<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Claude Architect 問題集２</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F4F9; --paper:#FFFFFF; --soft:#F5F7FB;
  --ink:#16223B; --ink2:#4B5875; --line:#D3DAE8; --line2:#B5BFD4;
  --accent:#2D4FD6; --on-accent:#FFFFFF; --sel:#E8EDFF;
  --ok:#16775A; --ok-bg:#E3F3EB; --ok-solid:#16775A;
  --ng:#B3392D; --ng-bg:#FBE8E5; --ng-solid:#B3392D;
  --on-solid:#FFFFFF;
  --sans:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  --serif:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1424; --paper:#151D31; --soft:#1A233B;
    --ink:#E8EDF9; --ink2:#A2AEC9; --line:#2B3555; --line2:#44527A;
    --accent:#8EA5FF; --on-accent:#0E1424; --sel:#1F2A52;
    --ok:#6FDBAC; --ok-bg:#12332A; --ok-solid:#4CC79A;
    --ng:#FF9488; --ng-bg:#3A1D1B; --ng-solid:#FF9488;
    --on-solid:#0E1424;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1424; --paper:#151D31; --soft:#1A233B;
  --ink:#E8EDF9; --ink2:#A2AEC9; --line:#2B3555; --line2:#44527A;
  --accent:#8EA5FF; --on-accent:#0E1424; --sel:#1F2A52;
  --ok:#6FDBAC; --ok-bg:#12332A; --ok-solid:#4CC79A;
  --ng:#FF9488; --ng-bg:#3A1D1B; --ng-solid:#FF9488;
  --on-solid:#0E1424;
  color-scheme:dark;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 12px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.8;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.shell{display:grid;grid-template-columns:292px minmax(0,1fr);gap:36px;max-width:1120px;margin:0 auto;padding:28px 20px 72px}
.side{align-self:start;position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);max-height:calc(100vh - 32px);overflow:auto;padding-right:2px}
.side h1{font-family:var(--serif);font-weight:700;font-size:23px;line-height:1.45;margin:0 0 4px;letter-spacing:.02em}
.side .sub{margin:0 0 18px;color:var(--ink2);font-size:13px}
.score{margin:0 0 8px;font-size:14px;font-variant-numeric:tabular-nums}
.score b{font-weight:700}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-bottom:18px}
.bar i{display:block;height:100%;background:var(--accent);width:0}
details.nav{margin:0 0 18px}
details.nav summary{cursor:pointer;font-weight:700;font-size:14px;padding:6px 0;list-style:none}
details.nav summary::-webkit-details-marker{display:none}
details.nav summary::after{content:"　▾";color:var(--ink2);font-weight:400}
details.nav[open] summary::after{content:"　▴"}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:8px;margin-top:8px}
.dot{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line2);background:var(--paper);color:var(--ink);font-size:12.5px;font-weight:500;font-variant-numeric:tabular-nums;cursor:pointer;display:grid;place-items:center;padding:0;line-height:1}
.dot[data-s="sel"]{background:var(--sel);border-color:var(--accent);color:var(--accent);font-weight:700}
.dot[data-s="ok"]{border-color:var(--ok);color:var(--ok);font-weight:700}
.dot[data-s="ng"]{border-color:var(--ng);color:var(--ng);font-weight:700;border-radius:10px}
.dot[aria-current="true"]{outline:2px solid var(--accent);outline-offset:2px}
.legend{margin:10px 0 0;font-size:12px;color:var(--ink2);line-height:1.7}
.sidebtns{display:flex;flex-direction:column;gap:8px}

.btn{border:1.5px solid var(--line2);background:var(--paper);color:var(--ink);padding:10px 18px;border-radius:10px;cursor:pointer;font-weight:500;font-size:15px;min-height:44px;transition:background .15s,border-color .15s}
.btn:hover:not(:disabled){background:var(--sel);border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.btn.primary:hover:not(:disabled){filter:brightness(1.08);background:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.small{min-height:40px;padding:8px 14px;font-size:14px}

.sheet{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:30px 32px 32px}
.qhead{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px 12px;margin-bottom:18px}
.qno{font-family:var(--serif);font-weight:700;font-size:26px;letter-spacing:.02em}
.qtotal{color:var(--ink2);font-size:14px;font-variant-numeric:tabular-nums}
.tag{font-size:13px;font-weight:700;border:1.5px solid var(--accent);color:var(--accent);padding:1px 10px;border-radius:999px;line-height:1.7}
.stem p,.overall p,.why p,.banner p{margin:0 0 .8em;white-space:pre-line}
.stem ul,.overall ul{margin:0 0 .9em;padding-left:1.4em}
.stem li,.overall li{margin:.15em 0}
.prompt{font-family:var(--serif);font-weight:700;font-size:19.5px;line-height:1.75;margin:18px 0 20px;white-space:pre-line}

.banner{border-left:4px solid var(--line2);background:transparent;padding:6px 16px 2px;margin:0 0 20px;scroll-margin-top:16px}
.banner h2{font-family:var(--serif);font-size:17px;margin:0 0 2px;line-height:1.5}
.banner.ok,.banner.ng{border-color:var(--line2)}
.banner.ok h2,.banner.ng h2{color:var(--ink)}
.banner p{font-size:14.5px;color:var(--ink)}

ol.opts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.choice{display:grid;grid-template-columns:36px minmax(0,1fr);column-gap:14px;align-items:start;width:100%;text-align:left;padding:14px 16px;border:1.5px solid var(--line);border-radius:12px;background:var(--paper);cursor:pointer;transition:background .15s,border-color .15s}
.choice:hover:not([aria-disabled="true"]){background:var(--sel);border-color:var(--accent)}
.choice[aria-disabled="true"]{cursor:default}
.mark{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center;font-family:var(--serif);font-weight:700;font-size:15px;background:var(--paper);margin-top:1px}
.multi .mark{border-radius:9px}
.choice.on{border-color:var(--accent);background:var(--sel)}
.choice.on .mark{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.choice .txt{font-size:16px;line-height:1.75;padding-top:3px}
.meta{grid-column:2;display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pill{font-size:12.5px;font-weight:500;padding:0;border:none;line-height:1.7}
.pill.ok{color:var(--ok)}
.pill.ng{color:var(--ng)}
.pill.me{color:var(--ink2)}
.opt.ok .choice{border-color:var(--ok)}
.opt.ok .mark{border-color:var(--ok);color:var(--ok)}
.opt.ng.picked .choice{border-color:var(--ng)}
.opt.ng.picked .mark{border-color:var(--ng);color:var(--ng)}
.why{margin:8px 0 0 50px;padding:10px 16px 4px;border-left:3px solid var(--line2);background:var(--soft);border-radius:0 8px 8px 0;font-size:14.5px;line-height:1.9}
.why h3{margin:0 0 4px;font-size:13px;font-weight:700;color:var(--ink2)}
.hint{margin:14px 0 0;font-size:14px;color:var(--ink2);min-height:1.8em}

.overall{margin-top:30px;padding-top:22px;border-top:1.5px solid var(--line)}
.overall h2{font-family:var(--serif);font-size:19px;margin:0 0 10px}
.ref{font-size:14px;color:var(--ink2);margin:6px 0 0}
.ref a{color:var(--accent);word-break:break-all}
.actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;margin-top:28px}
.actions .grow{display:flex;gap:10px;flex-wrap:wrap}

.result h2{font-family:var(--serif);font-size:25px;margin:0 0 8px;line-height:1.5}
.result .lead{font-size:16px;margin:0 0 20px}
.result h3{font-size:15px;margin:22px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--ng);color:var(--ng);background:var(--paper);border-radius:10px;padding:4px 12px;cursor:pointer;font-weight:700;font-size:14px;min-height:36px}
.chip:hover{background:var(--ng-bg)}
.chip.un{border-color:var(--line2);color:var(--ink2)}
.chip.un:hover{background:var(--soft)}

@media (max-width:859px){
  .shell{grid-template-columns:minmax(0,1fr);gap:20px;padding:18px 14px 56px}
  .side{position:static;max-height:none;overflow:visible}
  .sheet{padding:22px 18px 24px}
  .why{margin-left:0}
  .qno{font-size:23px}
  .prompt{font-size:18px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="shell">
  <aside class="side" aria-label="進捗と問題一覧">
    <h1>Claude Architect<br>問題集２</h1>
    <p class="sub">4択（一部は2つ選択）。回答を確認すると、各選択肢の解説と全体の説明が表示されます。</p>
    <p class="score" id="score" aria-live="polite"></p>
    <div class="bar" aria-hidden="true"><i id="barfill"></i></div>
    <details class="nav" id="navd" open>
      <summary>問題一覧</summary>
      <div class="grid" id="grid"></div>
      <p class="legend">丸＝正解　角丸の四角＝不正解　青＝選択中</p>
    </details>
    <div class="sidebtns">
      <button type="button" class="btn small" id="btnResult">結果を見る</button>
      <button type="button" class="btn small" id="btnReset">最初からやり直す</button>
    </div>
  </aside>
  <main id="main" aria-live="off"></main>
</div>

<script type="application/json" id="qdata">[{"n":1,"stem":["あるクラウドインフラ企業のプラットフォームチームは、Claude Codeを使ってソフトウェア開発を加速しています。コード生成、リファクタリング、デバッグ、ドキュメント作成に活用し、カスタムスラッシュコマンドやCLAUDE.mdの設定を用いて開発ワークフローに統合しています。プランモードと直接実行をどのように使い分けるかも理解する必要があります。","このチームが独自に作成した/upgrade-planコマンドは、リポジトリのアップグレードガイドを解析して、下流の自動化処理向けのJSONに変換します。","評価では有効なJSONが得られていますが、元の情報が次のような形で書かれている場合に、rollback_commandやcompatibility_noteといった必須フィールドがnullとして返されてしまいます。","フェンス付きのシェルブロック","Markdownのチェックリスト","散文の段落","情報自体は元資料の中にあります。また、現在のプロンプトはすでにスキーマを列挙し、必須フィールドを省略しないよう指示しています。"],"q":"この抽出の失敗に最も直接的に対処できる変更はどれですか。（2つ選択してください。）","need":2,"opts":[{"t":"スキーマの説明をCLAUDE.mdに移し、このコマンドの実行時に毎回読み込まれる状態にする。","c":false,"e":["CLAUDE.mdはClaude Codeが毎回読み込むプロジェクト共通の指示の置き場です。しかし現在のプロンプトはすでにスキーマを列挙しており、同じ情報の置き場所を変えても、シェルブロックやチェックリストの中の値をどのフィールドに入れるかという対応づけのあいまいさは残ります。"]},{"t":"temperatureを引き上げ、さまざまなアップグレードガイドの形式をより広く解釈させる。","c":false,"e":["temperatureは出力のランダムさを調整するパラメータで、表現の多様さが欲しい創作的なタスクで上げることがあります。構造化抽出では一貫した出力が望ましく、上げてもフィールドの取りこぼしは直りません。なおClaude Opus 4.7以降やClaude Sonnet 5では、既定値以外のtemperatureを指定すると400エラーになります。"]},{"t":"多様なガイド形式を期待されるJSONフィールドに対応づけた構造化例を3〜5個追加する。","c":true,"e":["正解。公式のプロンプトガイドは、形式や構造を安定させる確実な方法として、実際の用途に近く多様な例を3〜5個示すことを勧めています。シェルブロック・チェックリスト・散文といった異なる形式から期待されるJSONフィールドへの変換例を見せれば、Claudeは初めて見るガイドにも同じ対応づけを適用できます。"]},{"t":"必須フィールドごとに、元資料のどこにどの形（シェルブロックやチェックリスト等）で現れるかを書く。","c":true,"e":["正解。rollback_commandはフェンス付きのシェルブロックに、compatibility_noteはチェックリストや散文の段落に現れる、といった「どこに、どの形で現れるか」をフィールドごとに書けば、Claudeは表現形式が違っても同じ情報を見つけられます。情報が元資料にあるのにnullになるという症状の直接の原因である、形式ごとの対応づけのあいまいさを解消できます。"]}],"overall":["構造化抽出で「情報は元資料にあるのにnullが返る」場合、問題はスキーマの有無ではなく、元資料の多様な表現を各フィールドに対応づける手がかりの不足です。本問のプロンプトはすでにスキーマを列挙し、省略しないよう指示しているので、同じ指示を強めたり置き場所を変えたりしても改善しません。","効くのは、フィールドごとに「元資料のどこに、どの形で現れるか」を説明することと、多様な形式から期待されるJSONへの変換例を3〜5個示すことの2つで、公式ガイドも具体的な指示と多様な例の併用を勧めています。","temperatureの引き上げは一貫性を下げる方向の調整で、CLAUDE.mdへの移動は情報を増やしません。","抽出の失敗を見たら、モデルに足りないのが「何を出すか」の定義なのか、「どこから取るか」の手がかりなのかを見極めることが解決の近道です。"],"ref":"https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices"},{"n":2,"stem":["ある法律事務所では、Claude Agent SDKを使用して、判例調査を行うマルチエージェントシステムを構築しています。コーディネーターエージェントが、専門サブエージェントに作業を委任します。サブエージェントには、判例データベースを検索するもの、判例文書を分析するもの、論点を統合するもの、法律メモを生成するものがあります。このシステムはトピックを調査し、引用付きの包括的なメモを作成します。","文書分析サブエージェントは、クライアント側のツールを使って、ライセンス契約済みの判例データベースから文書を読み取り、根拠となる記述を抽出します。文書が利用できない場合、ツールはis_error: trueのtool_resultを返します。ただしその内容は、次のような原因にかかわらず、常に「操作に失敗しました」という固定の文言です。","ライセンス切れ","一時的なタイムアウト","非対応のファイル形式","該当箇所が無い有効な検索結果","その結果、コーディネーターは、リトライ、そのソースの破棄、エスカレーションのいずれかを予測できない形で選んでしまいます。"],"q":"復旧動作を最も改善できる変更はどれですか。（2つ選択してください。）","need":2,"opts":[{"t":"失敗した文書の読み取りを空の結果セットとして返し、統合処理をそのまま続行させる。","c":false,"e":["失敗を空の結果として扱う方法は、結果が0件でも処理を止めたくない集計処理などでは使われます。しかし本問では「該当箇所がない有効な検索結果」と「読み取りの失敗」の区別が消え、ライセンス切れの文書を根拠なしと誤って結論づけるなど、統合結果の正確さを損ないます。"]},{"t":"リトライ可能と示されたエラーだけをリトライし、他はソースの切り替えかエスカレーションに回させる。","c":true,"e":["正解。エラー情報を構造化して返しても、それを使う側の方針が決まっていなければ復旧動作は安定しません。ツールがリトライ可能と示したもの（一時的なタイムアウトなど）だけをリトライし、ライセンス切れや非対応形式のような恒久的な失敗は別ソースへの切り替えかエスカレーションに回す、とコーディネーターに明示すれば、同じ状況では同じ判断が下されるようになります。"]},{"t":"原因の分類とリトライの可否を含むtool_resultエラーを返す。","c":true,"e":["正解。公式ドキュメントは、\"failed\"のような汎用的なエラーではなく、何が起きたか、次に何を試すべきかを含む具体的なエラーメッセージを返すよう勧めています。","原因（ライセンス切れ、タイムアウト、非対応形式、該当なしの有効な結果など）の分類とリトライの可否をtool_resultに含めれば、コーディネーターは状況に応じた復旧を選べます。試した入力や推奨される復旧策を添えれば、判断はさらに確実になります。"]},{"t":"文書ツールの説明文を拡張し、失敗する可能性のあるツールの使用をClaudeに避けさせる方向へ誘導する。","c":false,"e":["ツールの説明文を充実させることは、ツールの正しい使い分けを促す基本的な改善です。しかし失敗は文書の状態やネットワークなど実行時の要因で起き、事前に避けられるものではないうえ、判例文書の読み取りは中核機能なので、使用を避けさせると調査そのものが成り立ちません。"]}],"overall":["エージェントの復旧動作が予測不能になる典型的な原因は、ツールがすべての失敗を同じ固定文言で返し、判断材料がないことです。公式ドキュメントは、is_errorをtrueにしたtool_resultに、何が起きて次に何を試すべきかを具体的に書くよう勧めています。","本問では、失敗の原因の分類とリトライの可否を返すことと、そのリトライ可否に従ってリトライか切り替え・エスカレーションかを選ぶ方針をコーディネーターに与えることの2つがそろって初めて、復旧が一貫します。","空の結果への変換は「該当なし」と「失敗」を混同させ、ツールの回避は中核機能を損ないます。"],"ref":"https://platform.claude.com/docs/en/agents-and-tools/tool-use/handle-tool-calls"},{"n":3,"stem":["あるゲームスタジオのライブ運用チームは、Claude CodeをCI/CDパイプラインに統合しています。このシステムは、自動コードレビューを実行し、テストケースを生成し、プルリクエストにフィードバックを返します。具体的で実行可能なフィードバックを返し、誤検知を最小限に抑えるプロンプトを設計する必要があります。","運用開始から3か月が経ち、このシステムは、構造化されたレビューの指摘や生成したテスト提案の大半に、高い確信度スコアを付けるようになりました。","人手によるレビュー体制は縮小される予定です。それでもチームは、次のことを続ける必要があります。","本番環境でのエラー率を測定する","マイグレーション、セキュリティに関わる変更、言語固有の規約といった領域で、まれな失敗モードを捕捉する"],"q":"この目的に最も適した監視アプローチはどれですか。（2つ選択してください。）","need":2,"opts":[{"t":"確信度のカットオフ値を引き上げた後も、高確信度の出力について一定数以上のサンプルをレビューし続ける。","c":true,"e":["正解。確信度のカットオフを引き上げると、レビューを経ずに通過する高確信度の出力が増えます。高確信度帯からも一定数のサンプルを継続してレビューしておけば、「確信度は高いが誤っている」出力の割合を本番で測り続けられ、カットオフ自体が妥当かどうかも検証できます。"]},{"t":"変更の種類や言語、指摘のカテゴリで層別化して高確信度の指摘をサンプリングし、誤りと新種を分けてラベル付けする。","c":true,"e":["正解。変更の種類・コンポーネント・言語・指摘のカテゴリで層別化してサンプリングすると、マイグレーションやセキュリティ関連の変更のように件数の少ない領域からも確実にサンプルが取れます。誤りと新種のパターンを分けてラベル付けすれば、既知の誤りの頻度と、まだ知られていない失敗モードの出現を別々に追跡できます。"]},{"t":"すべてのリポジトリにわたって高確信度の指摘を一様にサンプリングし、パイプライン全体について1つの集計エラー率を公表する。","c":false,"e":["一様なサンプリングと全体の集計エラー率は、パイプライン全体の傾向を示す基本指標にはなります。ただし件数の少ないマイグレーションやセキュリティ関連の変更はサンプルにほとんど入らず、まれな失敗モードが平均の中に薄まって見えなくなります。"]},{"t":"低確信度の指摘を優先してレビューし、高確信度帯は月次の全体精度だけを確認する。","c":false,"e":["低確信度の指摘を優先してレビューするのは、限られた人手を誤りの多そうな出力に回す合理的な配分です。しかし高確信度帯を月次の全体精度だけで見ると、マイグレーションやセキュリティのような件数の少ない領域の誤りが平均に埋もれ、確信度が高いまま誤っているまれな失敗モードを捕捉できません。"]}],"overall":["自動化の比率を上げるほど、人がレビューしない出力の品質をどう監視するかが重要になります。モデルが付ける確信度は正しさの保証ではないため、高確信度帯を完全に無審査にすると、自信を持って誤っているケースを検出できなくなります。","本問の要件は「本番のエラー率を測る」ことと「まれな領域の失敗モードを捕捉する」ことの2つで、高確信度帯からの継続的なサンプリングが前者を、層別化したサンプリングと誤り・新種パターンのラベル分けが後者を満たします。","高確信度帯を月次の全体精度だけで見る方法はまれな誤りを平均に埋もれさせ、一様サンプリングは件数の少ない領域を薄めます。","公式の評価設計ガイドも、エッジケースを含む具体的で測定可能な基準で評価することを勧めています。件数の少ない領域ほど一様なサンプリングでは見えにくくなる、という性質は品質監視全般で押さえておくべき点です。"],"ref":"https://platform.claude.com/docs/en/test-and-evaluate/develop-tests"},{"n":4,"stem":["あなたは、ソフトウェア開発を加速するためにClaude Codeを使用しています。チームでは、コード生成、リファクタリング、デバッグ、ドキュメント作成にClaude Codeを使っています。カスタムスラッシュコマンドやCLAUDE.mdの設定を用いて開発ワークフローに統合し、プランモードと直接実行をどのように使い分けるかを理解する必要があります。","ある電子カルテプラットフォームのチームが、50を超えるファイルで使われている共有認証ライブラリを移行しようとしています。実現可能な移行アプローチは2つあり、それぞれインフラ要件が異なります。保守担当者は、実装を始める前に、Claude Codeにコードベースを調査させ、アプローチを提案してほしいと考えています。"],"q":"最初に取るべきワークフローとして最も適切なものはどれですか。","need":1,"opts":[{"t":"プランモードに入り、Claudeに影響範囲を調査させ、実行モードを選ぶ前に提案されたプランをレビューする。","c":true,"e":["正解。プランモードではClaudeはファイルを編集せずにコードベースを調べ、影響範囲と実装方針を提案として提示します。保守担当者はその計画を見て2つのアプローチを比較し、納得してから実行時の権限モードを選べるため、50以上のファイルに及ぶ移行のような影響の大きい変更の最初の一歩に適しています。"]},{"t":"bypassPermissionsで開始し、Claudeにコマンドを自由に実行させ、リグレッションの有無は事後にテストで確認する。","c":false,"e":["bypassPermissionsはすべての権限確認を省くモードで、コンテナやVMのように隔離された環境で無人実行するためのものです。50を超えるファイルで使われる共有認証ライブラリを事前の調査なしに自由に変更させると、影響範囲の確認とアプローチの比較という要件を飛ばし、問題はテストで事後に見つけるしかなくなります。"]},{"t":"acceptEditsで開始し、Claudeに移行を適用させ、変更が完了した後で差分をレビューする。","c":false,"e":["acceptEditsはファイル編集を確認なしで適用するモードで、変更内容をすでに理解していて反復を速めたい場面に向いています。移行を先に適用させて完了後に差分を見る流れでは、どちらのアプローチを採るかという判断が実装前に行われず、レビューが事後になります。"]},{"t":"直接実装を指示するプロンプトから始め、Claudeにアプローチを選ばせて、編集しながら設計を練り上げる。","c":false,"e":["直接実装を指示する進め方は、変更範囲が小さく方針が明らかな作業では最も速い方法です。本問ではインフラ要件の異なる2つのアプローチを実装前に比較したいので、Claudeに選ばせて編集しながら設計を固めると、保守担当者が提案をレビューする機会がないまま変更が進みます。"]}],"overall":["Claude Codeの権限モードは、どこまでClaudeに任せるかを作業の段階に合わせて選ぶための仕組みです。プランモードは読み取りと調査だけを行って計画を提示させるモードで、acceptEditsはファイル編集の確認を省き、bypassPermissionsはすべての確認を省きます（隔離された環境専用）。","本問は影響範囲の大きい共有ライブラリの移行で、しかもインフラ要件の異なる2案を実装前に比較したいので、まずプランモードで調査と提案をさせ、計画をレビューしてから実行モードを選ぶのが正解です。","直接実装やacceptEdits、bypassPermissionsはいずれも変更が先に進み、レビューが事後になります。影響の大きい変更ほど、計画のレビューを挟む手間に見合う効果があります。"],"ref":"https://code.claude.com/docs/en/permission-modes"},{"n":5,"stem":["ある物流会社の社内ヘルプデスクでは、配送遅延、返品対応、アカウント権限の問題などのあいまいな問い合わせを解決するエージェントを、Claude Agent SDKで構築しています。このエージェントは、カスタムのModel Context Protocol（MCP）ツール（get_employee、lookup_ticket、issue_replacement、escalate_to_manager）を通じて、社内システムにアクセスします。目標は、エスカレーションすべきタイミングを見極めながら、初回解決率80%以上を達成することです。","このチームでは、交換対応やエスカレーションのロジックへの変更を検査するため、夜間のプルリクエストチェックでClaude Codeを呼び出しています。しかしCI環境には、フォローアップの確認プロンプトに応答するターミナルの利用者がいません。そのため、ジョブはプロンプトを表示したまま、ランナーがタイムアウトするまで待ち続けてしまいます。"],"q":"この障害を防ぐために最も適切な変更はどれですか。（2つ選択してください。）","need":2,"opts":[{"t":".claude/commands/に共有のスラッシュコマンドを作成し、CIジョブからそのコマンドを呼び出す。","c":false,"e":["共有のスラッシュコマンドは、同じレビュー手順をチームやCIで再利用するのに便利です。しかしコマンドを使ってもClaude Codeは対話モードで動くままで、確認プロンプトに応答する人がいない問題は変わらず、ジョブは同じようにタイムアウトまで待ち続けます。"]},{"t":"Claude Codeを-p（--print）フラグ付きで実行し、レビュー用プロンプトを非対話的に渡す。","c":true,"e":["正解。-p（--print）フラグを付けるとClaude Codeは非対話モードで動作し、渡されたプロンプトを処理して結果を出力すると終了します。フォローアップの入力を待つことがないため、CIのようにターミナルの利用者がいない環境での実行に適しています。"]},{"t":"レビューに必要なツールを、CIジョブの権限設定で事前承認する。","c":true,"e":["正解。無人の環境では、承認が必要なツール呼び出しをその場で許可できる人がいません。レビューに必要なツールを--allowedToolsや設定ファイルの権限ルールで事前に許可しておけば、ツールの承認待ちで作業が止まったり失敗したりすることを防げ、夜間のジョブが最後まで完了します。"]},{"t":"Claude Codeをプランモードで実行し、生成されたプランをジョブが自動承認するようにする。","c":false,"e":["プランモードは、変更を加える前に調査と計画の提示だけを行わせる権限モードです。計画の承認は対話的な確認の一種で、無人のCIで承認させる仕組みを別に作らない限りプロンプト待ちは残り、レビュー作業の実行自体も進みません。"]}],"overall":["Claude CodeをCIのような無人の環境で動かすには、「対話を前提としない実行モード」と「人の承認を前提としない権限設定」の2つが必要です。公式ドキュメントは、-p（--print）で非対話的に実行し、--allowedToolsなどで必要なツールを自動承認する方法を示しています。","本問のジョブはフォローアップの確認プロンプトに応答する人がいないために止まっているので、-pでプロンプトを非対話的に渡すことと、レビューに必要なツールを権限設定で事前承認することの2つが正解です。","共有のスラッシュコマンドは実行モードを変えず、プランモードは計画の承認という別の対話を生みます。","無人実行では、実行モードと権限の2か所に人の入力を待つ箇所が残りやすいと覚えておくと、設定漏れを防げます。"],"ref":"https://code.claude.com/docs/en/headless"},{"n":6,"stem":["サプライチェーン分析を手がけるスタートアップが、Claude Agent SDKを使用して、マルチエージェントの調査レポートシステムを構築しています。コーディネーターエージェントが、専門サブエージェントに作業を委任します。サブエージェントには、サプライヤーのデータを収集するもの、出荷リスクを分析するもの、調査結果を統合するもの、経営層向けレポートを作成するものがあります。このシステムはトピックを調査し、出典を明記した包括的なレポートを作成します。","ある評価実行で、コーディネーターの最初のMessages APIレスポンスには、短いテキストブロックと、Taskの2つのtool_useブロックが含まれていました。しかし実行履歴を確認すると、レポート生成の前にtool_resultメッセージが一度も送信されていませんでした。レポートは常に、コーディネーターの最初のテキストだけに基づいています。"],"q":"コーディネーターのループに加えるべき変更はどれですか。（2つ選択してください。）","need":2,"opts":[{"t":"各サブエージェントの出力を、tool_useのidごとにuserターンのtool_resultブロックとして送る。","c":true,"e":["正解。Messages APIにはtoolロールがなく、ツールの結果はuserターンのcontentにtool_resultブロックとして入れ、各ブロックのtool_use_idを要求されたtool_useのidに対応させます。並列に要求された2つのTaskの結果を1つのuserメッセージにまとめてidごとに返すことで、Claudeはどの結果がどの委任に対応するかを正しく扱えます。"]},{"t":"コーディネーターのテキストブロックを統合処理へそのまま転送し、Taskの実行は省いて、テキストがあればその時点でターンを終える。","c":false,"e":["テキストが出た時点でターンを終えるのは、ツールを使わない単純な応答なら成り立つ終了判定です。しかし最初の応答にはテキストと並んで2つのTaskのtool_useが含まれており、Taskの実行を省くとサブエージェントに委任した調査が行われず、現在と同じく最初のテキストだけのレポートになります。"]},{"t":"コーディネーターを3回の反復に制限し、部分的な調査結果を要約して、上限に達したら停止させる。","c":false,"e":["反復回数の上限は、ループが終わらない事態を防ぐ安全装置として実務でも使われます。しかし本問の原因は、要求されたTaskが実行されずtool_resultが一度も返されていないことで、上限を設けても結果が返らないまま要約して止まるだけです。"]},{"t":"要求された各Taskを実行してtool_resultを返し、stop_reasonがend_turnになるまで呼び出しを続ける。","c":true,"e":["正解。stop_reasonがtool_useの応答を受け取ったら、要求された各Taskを実際に実行し、その結果をtool_resultとして返して再びMessages APIを呼び出します。これをstop_reasonがend_turnになるまで繰り返すのがエージェントループの基本で、サブエージェントの調査結果を踏まえたレポートが生成されるようになります。"]}],"overall":["ツールを使うエージェントは、モデルのtool_use要求を実行して結果を返し、再びモデルを呼ぶ往復を繰り返して初めて機能します。公式ドキュメントによれば、tool_resultブロックは対応するtool_useの直後のuserメッセージに入れ、content配列の先頭に置く必要があります。","本問の実行履歴ではコーディネーターが2つのTaskを要求しているのにtool_resultが一度も送られておらず、レポートが最初のテキストだけに基づいてしまっています。正解は、要求されたTaskを実行してtool_resultを返しstop_reasonがend_turnになるまで呼び出しを続けることと、結果をtool_useのidごとにuserターンのtool_resultとして送ることの2つで、ループの継続と結果の返し方がそろって初めて委任が機能します。","反復回数の制限やTaskの省略は、結果が返っていないという原因に触れません。","stop_reasonごとに次に何をすべきか（tool_useなら実行して結果を返す、end_turnなら終える）を整理しておくと、ループの不具合を素早く見抜けます。"],"ref":"https://platform.claude.com/docs/en/agents-and-tools/tool-use/handle-tool-calls"},{"n":7,"stem":["ある通信キャリアは、Claude Agent SDKを使用して顧客対応エージェントを構築しています。このエージェントは、料金請求に関する問い合わせ、SIM交換、端末保証などのあいまいな問い合わせを処理します。カスタムのModel Context Protocol（MCP）ツール（get_subscriber、lookup_invoice、process_credit、escalate_to_tier2）を通じて、社内システムにアクセスします。目標は、エスカレーションすべきタイミングを見極めながら、初回解決率80%以上を達成することです。","本番環境のトレースを確認すると、すべての受信リクエストが、次の個別のサブエージェントに順に送られていることが分かりました。","本人確認","請求内容","クレジットポリシー","エスカレーション要約","単純な請求状況の確認だけで済む質問でもレイテンシが高くなっており、一部の回答には、無関係なクレジットポリシーの注意書きまで含まれています。"],"q":"専門のワーカーを本当に必要なケースのために残しつつ、設計を最も改善できる変更はどれですか。（2つ選択してください。）","need":2,"opts":[{"t":"すべてのサブエージェントに同じバックエンドツールを持たせ、不要な場合は各ワーカー自身にスキップするよう指示する。","c":false,"e":["各ワーカーに自分が不要かどうかを判断させる方法は、ワーカーの自己判断が信頼できる場合には柔軟な設計です。しかしすべてのワーカーが毎回起動されることに変わりはなくレイテンシは下がらず、スキップの判断もプロンプト頼みで不安定なため、無関係な注意書きの混入を防ぎきれません。"]},{"t":"単純な請求状況の確認は直接回答し、専門的な処理が必要なケースだけサブエージェントに委任する。","c":true,"e":["正解。単純な請求状況の確認のように1回の照会で答えられる問い合わせは、コーディネーターが直接回答するほうが速く、無関係な注意書きが混ざることもありません。マルチエージェント構成の手間とコストは、専門的な処理が本当に必要なケースに限って払うのが合理的です。"]},{"t":"本人確認と請求のサブエージェントを1つに統合し、経由する段数を減らす。","c":false,"e":["サブエージェントの統合は、役割が重なっていて分ける利点が小さい場合には、段数とレイテンシを減らす妥当な手段です。しかしすべての問い合わせが残りのワーカーを順に通る構造は変わらないため、単純な請求確認の遅さと無関係なクレジットポリシーの注意書きは残り、本人確認という専門の役割もぼやけます。"]},{"t":"ケースを検査し、必要なサブエージェントだけを呼び出して、それぞれに自己完結したタスク要約を渡すコーディネーターの工程を追加する。","c":true,"e":["正解。コーディネーターがまずケースの内容を検査し、必要なサブエージェントだけを呼び出す工程を入れれば、単純な問い合わせで全ワーカーを順に通る無駄がなくなります。呼び出すサブエージェントには自己完結したタスク要約を渡すことで、各ワーカーは必要な情報だけで確実に作業できます。"]}],"overall":["マルチエージェント構成は強力ですが、すべての入力を全ワーカーに順番に通すとレイテンシとコストが膨らみ、無関係な処理の出力が回答に混ざります。Anthropicのエージェント設計ガイドは、入力を分類して適切な後続処理に振り分けるroutingを紹介し、複雑さは必要なときにだけ加えるべきだとしています。","本問の正解は、ケースを検査して必要なサブエージェントだけを呼び出すコーディネーターの工程と、単純な確認は直接回答して委任を専門的なケースに限ることの2つで、どちらも「必要なときだけ委任する」という同じ原則に立っています。","ワーカー自身によるスキップ判断は起動の無駄を残し、一部のサブエージェントの統合は全件を順に通す構造を残します。"],"ref":"https://www.anthropic.com/engineering/building-effective-agents"},{"n":8,"stem":["あるフィンテック企業のプラットフォームチームは、Claude Codeを使ってソフトウェア開発を加速しています。コード生成、リファクタリング、デバッグ、ドキュメント作成に活用し、カスタムスラッシュコマンドやCLAUDE.mdの設定を用いて開発ワークフローに統合しています。プランモードと直接実行をどのように使い分けるかも理解する必要があります。","このチームは、エンジニアリング参考資料（設計ドキュメント、運用手順書、データベーススキーマ、アーキテクチャノート）を扱うため、独自のMCPサーバーとクライアント側の統合を追加しようとしています。開発者の要望は次のとおりです。","ホスト側に、これらの参考資料をブラウズできる一覧を表示させる","必要なときにだけ、選択したコンテンツをClaudeのコンテキストに添付する","何が存在するかを調べるためだけに、Claudeが探索的な関数呼び出しにターンを費やすことは避ける"],"q":"MCPの制御モデルに最も合致する設計はどれですか。","need":1,"opts":[{"t":"list_reference_materialツールを追加して最初に呼ばせ、選んだ文書は追加のツール呼び出しで取得させる。","c":false,"e":["一覧取得用のツールを用意するのは、モデル自身に必要な資料を探させたい場合には妥当な設計です。しかしMCPのツールはモデルが判断して呼び出すもので、何があるかを調べるためだけにClaudeがツール呼び出しにターンを使うことになり、避けたい挙動をそのまま設計に組み込みます。"]},{"t":"資料カタログをCLAUDE.mdにコピーしてリポジトリ更新のたびに更新し、Claudeに開発者へ文書名を尋ねさせる。","c":false,"e":["CLAUDE.mdは毎回読み込まれる指示の置き場で、カタログをコピーすると使わない会話にも常に読み込まれ、更新のたびに手で同期する負担も生じます。さらにClaudeに文書名を尋ねさせる流れは、ホストの一覧から開発者が選んで添付するという要件とは異なります。"]},{"t":"resources機能を宣言し、resources/listで一覧を示してresources/readで読ませる。","c":true,"e":["正解。MCPのresourcesはアプリケーション（ホスト）主導でコンテキストを提供するための仕組みです。サーバーがresources機能を宣言すると、クライアントはresources/listで一覧を取得してユーザーに提示し、選ばれたURIの内容をresources/readで読み込めます。Claudeが探索のためにツールを呼ぶ必要がなく、開発者が選んだ資料だけをコンテキストに添付できます。"]},{"t":"各参考資料をプロンプトとして公開し、開発者がスラッシュコマンドで実行して文書本文を注入する。","c":false,"e":["MCPのpromptsは、ユーザーが明示的に選んで実行する再利用可能なプロンプトテンプレートで、定型の依頼をスラッシュコマンドとして提供したいときに向きます。参考資料の閲覧と添付に使うと資料ごとにコマンドを用意して実行する必要があり、「一覧をブラウズして必要なものだけ添付する」というデータ提供の用途とは役割が合いません。"]}],"overall":["MCPのサーバーが公開する主な機能は3種類あり、それぞれ誰が主導して使うかが異なります。toolsはモデルが判断して呼び出すもの、promptsはユーザーが明示的に実行するテンプレート、resourcesはホストアプリケーションが一覧の提示や添付を制御するデータです。","本問の要件は「ホストで一覧をブラウズでき、必要なときだけ選んだ内容をコンテキストに添付し、Claudeの探索的な呼び出しは避ける」なので、resources機能とresources/list・resources/readの組み合わせが制御モデルに合致します。","ツールでの一覧取得はモデルの探索ターンを生み、promptsはユーザーが起動するテンプレートで、CLAUDE.mdへのコピーは常時読み込みになります。","MCPの機能選択では、「誰がいつ使うかを決めるのか」を問題文から読み取ると、tools・prompts・resourcesのどれかに対応づけられます。"],"ref":"https://modelcontextprotocol.io/specification/2026-07-28/server/resources"},{"n":9,"stem":["あなたは、レガシーシステムの保守を担当するチームで、Claude Codeを使って開発ワークフローを効率化しています。カスタムスラッシュコマンドやCLAUDE.mdの設定を用いて開発ワークフローに統合し、プランモードと直接実行をどのように使い分けるかを理解する必要があります。","チームは、見慣れないレガシーな請求計算モジュールに包括的なテストを追加するための、再利用可能なワークフローを必要としています。作業は通常、モジュールの読み込みから始まりますが、その後の手順は次の点によって変わります。","見つかった依存関係","既存のテストパターン","コードの継ぎ目（シーム）の有無","チームは、レイテンシの最小化よりも、有用なカバレッジを生み出すことを重視しています。"],"q":"最も適したオーケストレーションの選択はどれですか。","need":1,"opts":[{"t":"広範なスラッシュコマンドを1つ使い、ファイル一式と要件を制約のない1つのリクエストでClaudeに渡す。","c":false,"e":["1回の広い依頼で済ませる方法は、小さく見通しのよいタスクなら手早い進め方です。しかし見慣れないレガシーモジュールでは、依存関係や既存のテストパターンを調べた結果によって次に何をすべきかが変わるため、構造のない単一のリクエストでは発見に応じた計画の組み直しができず、カバレッジの質が安定しません。"]},{"t":"動的な分解を使い、Claudeにモジュールを調査させ、発見内容からサブタスクを作ってテスト計画に統合させる。","c":true,"e":["正解。モジュールを調査し、見つかった依存関係・既存のテストパターン・継ぎ目の有無からサブタスクをその場で作り、最後にテスト計画へ統合する動的な分解は、手順を事前に固定できないタスクに適した構成です。","Anthropicのエージェント設計ガイドがorchestrator-workersとして説明する、サブタスクが入力に応じて決まるパターンに当たり、レイテンシよりカバレッジを重視するという条件とも合います。"]},{"t":"固定のプロンプトチェーンを使い、Claudeに毎回、ファイル分析・テスト作成・テスト実行・失敗の修正をこの順序で行わせる。","c":false,"e":["固定のプロンプトチェーンは、手順が毎回同じで固定のサブタスクに分解できる処理では、各段を検証しやすい優れた構成です。しかし本問では継ぎ目の有無などによって必要な手順自体が変わるため、決め打ちの順序では発見内容を計画に反映できません。"]},{"t":"直接実行を使い、Claudeにすぐテストを書き始めさせ、不足しているコンテキストには失敗が現れてから対処させる。","c":false,"e":["直接実行は、要件と手順が明確な小さな変更なら最も速い進め方です。本問のように見慣れないモジュールでは、状況を把握する前にテストを書き始めると依存関係や既存パターンを無視したテストが生まれ、失敗が出てから文脈を補う手戻りが増えます。"]}],"overall":["オーケストレーションの型は、「手順を事前に決められるか」で選び分けます。Anthropicのエージェント設計ガイドは、固定のサブタスクに分解できるならprompt chaining、必要なサブタスクを事前に予測できない複雑なタスクなら、中心のLLMがその場で分解・委任・統合するorchestrator-workersが適すると説明しています。","本問は「最初にモジュールを読む」以外の手順が、発見された依存関係やテストパターン、継ぎ目の有無で変わるうえ、レイテンシよりカバレッジを重視するので、調査結果からサブタスクを作って統合する動的な分解が正解です。","単一の広い依頼は構造がなく、固定チェーンは発見を反映できず、直接実行は状況の把握より先に手を動かしてしまいます。","問題文の「その後の手順は〜によって変わる」という一文が、動的な分解を選ぶ根拠になります。"],"ref":"https://www.anthropic.com/engineering/building-effective-agents"},{"n":10,"stem":["あなたは、Claude Agent SDKを使用して、通信キャリアのカスタマーサポート解決エージェントを構築しています。このエージェントは、返金、請求に関する異議申し立て、アカウントの問題など、あいまいさの高いリクエストを処理します。カスタムのModel Context Protocol（MCP）ツール（get_customer、lookup_order、process_refund、escalate_to_human）を通じて、バックエンドシステムにアクセスできます。目標は、エスカレーションすべきタイミングを見極めながら、初回解決率80%以上を維持することです。","あるカスタマーサポート基盤では、Messages APIのクライアント側のツール使用ループを使っています。ベータテスト期間中のポリシーでは、500ドルを超える返金には人によるレビューが必須です。","感情の高ぶった請求トラブルのケースがいくつか発生しました。その中でエージェントは、lookup_orderの後に、しきい値を超える金額でprocess_refundのtool_useリクエストを発行し、アプリケーションはそのリクエストをそのまま実行してしまいました。"],"q":"このワークフローの要件を最も効果的に強制できる変更はどれですか。（2つ選択してください。）","need":2,"opts":[{"t":"しきい値を超えるprocess_refundの呼び出しをアプリ側で止め、escalate_to_humanへ回す。","c":true,"e":["正解。アプリケーション側のガードは、Claudeが発行したtool_useを実行する前に金額を検査し、しきい値を超えていれば実行せずにescalate_to_humanへ回します。判断がモデルの確率的な振る舞いに左右されないため、感情的なやり取りの中でも500ドルを超える返金が人のレビューを経ずに実行されることはありません。"]},{"t":"返金を伴う請求トラブルでは、tool_choiceでescalate_to_humanの呼び出しを毎回強制する。","c":false,"e":["tool_choiceによる強制は、特定のツールを確実に呼ばせたい場合の手段です。しかし返金を伴う請求トラブルすべてでエスカレーションを強制すると、しきい値以下の正当な返金まで人の手に回り、初回解決率80%以上という目標を損ないます。Claude Opus 5.5などでは強制指定自体が400エラーになる点にも注意が必要です。"]},{"t":"しきい値を超える返金はescalate_to_humanに送るよう、システムプロンプトに明記する。","c":false,"e":["システムプロンプトでの明記は、モデルに業務ルールを伝える基本であり、多くの場合は正しくエスカレーションされるようになります。しかし指示の遵守は確率的で、しきい値を超えるtool_useが発行されてそのまま実行されたという本問の事故を確実に防ぐ仕組みにはなりません。"]},{"t":"process_refundの実装で要求金額を検証し、しきい値を超えるリクエストをそこで拒否する。","c":true,"e":["正解。ツールの実装側で金額を検証すれば、どの経路から呼ばれてもしきい値を超える返金は実行されません。モデルが誤った判断でprocess_refundを要求しても最後の砦として機能し、拒否理由をis_error付きの結果として返せば、Claudeはエスカレーションへ切り替えられます。"]}],"overall":["金額のしきい値のように明確で例外を認めない業務ルールは、モデルへの指示だけに頼らず、コードで決定的に強制するのが原則です。Messages APIのクライアント側ツールでは、Claudeが出すのはツール呼び出しの要求で、実際に実行するかどうかを最終的に決めるのはアプリケーションです。","本問では、アプリケーション側のガードでしきい値超えのprocess_refundを止めてescalate_to_humanに回すことと、process_refundの実装自体で金額を検証して拒否することの2つが、どちらもモデルの判断に依存しない強制手段として正解になります。","システムプロンプトは確率的な対策にとどまり、tool_choiceによる一律の強制は少額の正当な返金まで止めて解決率を下げます。","金額や件数のように機械的に判定できるルールほど、コード側で強制する価値が高くなります。"],"ref":"https://platform.claude.com/docs/en/agents-and-tools/tool-use/overview"},{"n":11,"stem":["ある投資リサーチデスクは、Claude Agent SDKを使用してマルチエージェントの株式調査システムを構築しています。コーディネーターエージェントが、専門サブエージェントに作業を委任します。サブエージェントには、財務ニュースと開示資料を検索するもの、証券アナリストのPDFレポートを分析するもの、知見を統合するもの、レポートを生成するものがあります。","このチームは、公開前に草稿レポートの所見を分類する、プロンプトベースの品質ゲートを追加しました。","そのうちの1つのカテゴリ「根拠のない市場動向の主張」が、出典が十分に示された統合した段落に対して誤検知を多く出すようになりました。一方、引用の欠落や出典間の矛盾といったほかのカテゴリは良好に機能しています。その結果、エンジニアは品質レポート全体を無視するようになってしまいました。"],"q":"このチームが次に行うべきことはどれですか。","need":1,"opts":[{"t":"ノイズの多いカテゴリは有効なまま、誤検知がありうるという注意書きを添え、手動で無視するよう頼む。","c":false,"e":["注意書きを添えて運用を続けるのは、誤検知が少数で影響が小さい場合の暫定策としてはあり得ます。しかしエンジニアはすでにレポート全体を無視し始めており、ノイズを残したまま手動での無視を求めても信頼は戻らず、良好なカテゴリの指摘まで見落とされ続けます。"]},{"t":"ノイズの多いカテゴリだけを一時的に外し、実例と定義、適合率・再現率の評価で作り直す。","c":true,"e":["正解。問題は1カテゴリに局所化しているので、そのカテゴリだけを有効なプロンプトから一時的に外せば、引用の欠落や出典間の矛盾の検出はそのまま使い続けられます。外したカテゴリは、判定基準の定義、該当する例としない例、適合率と再現率を測る評価セットで作り直し、基準を満たしてから戻すのが確実です。"]},{"t":"品質ゲートに厳格なJSONを返させて不正な出力を却下し、スキーマ準拠を主な信頼指標にする。","c":false,"e":["厳格なJSONの強制は、下流の処理が出力を確実にパースできるようにするための手段です。しかし誤検知は「形式」ではなく「判定の中身」の問題で、スキーマに準拠していても根拠の十分な段落を誤って指摘する出力はそのまま通るため、信頼指標として使うと問題を見えなくします。"]},{"t":"1リリースサイクルの間は品質ゲート全体を止め、プロンプトを直してから全カテゴリを再開する。","c":false,"e":["品質ゲート全体を止めるのは、どのカテゴリが原因か分からないときの安全策としては理解できます。本問では問題が1カテゴリに特定できており、全体を止めると引用の欠落や出典間の矛盾といった正しく機能している検出まで失い、その間に公開される草稿の品質を守れません。"]}],"overall":["品質ゲートの一部が誤検知を連発すると、利用者は正しい指摘まで含めてレポート全体を信用しなくなります。対処の原則は、問題の範囲だけを切り離し、機能している部分の価値を守りながら、問題の部分を評価に基づいて作り直すことです。公式の評価設計ガイドも、具体的で測定可能な成功基準とテストケースを用意して改善を確かめることを勧めています。","本問では「根拠のない市場動向の主張」カテゴリだけを一時的に外し、定義・実例・適合率と再現率の評価で再構築する方法がこれに当たります。","注意書きは信頼の低下を放置し、全停止は良好なシグナルまで失い、スキーマ準拠は形式と中身を取り違えています。局所的な問題には局所的な対処を、というのが品質ゲート運用の基本です。"],"ref":"https://platform.claude.com/docs/en/test-and-evaluate/develop-tests"},{"n":12,"stem":["ある教育系SaaS企業は、Claude Codeをコードレビュー自動化パイプラインに統合しています。このシステムは、プルリクエストごとに自動レビューを実行し、テストケースを生成し、具体的で実行可能なフィードバックを返します。誤検知を最小限に抑えるプロンプトを設計する必要があります。","コーディネーターは、あるプルリクエストのレビューを、セキュリティ、テストカバレッジ、保守性をそれぞれ担当する専門サブエージェントに委任しています。各サブエージェントは有用な指摘をコーディネーターに返していますが、最終的なレビュー要約では、コーディネーターがすでに受け取っていたはずの次の情報がしばしば省略されています。","具体的なファイルパス","失敗したテストの名前","根拠となるコードスニペット"],"q":"この信頼性の問題に最も効果的に対処できる変更はどれですか。（2つ選択してください。）","need":2,"opts":[{"t":"セキュリティとテストカバレッジの指示をCLAUDE.mdに保存し、次回以降のCI実行で読み込ませる。","c":false,"e":["CLAUDE.mdはClaude Codeが毎回読み込むプロジェクト共通の指示を置く場所で、レビュー観点を将来の実行に常に反映させたい場合には有効です。ただし今回の欠落は、この実行で受け取った具体的なファイルパスやテスト名が統合段階に引き継がれないことが原因で、次回以降向けの指示を増やしても解消しません。"]},{"t":"各専門サブエージェントの結果をコーディネーターが要約してから統合サブエージェントに渡し、入力を小さく保つ。","c":false,"e":["コーディネーターによる要約は、統合エージェントの入力を小さく保ちたい場合に使われる手段です。しかし本問で欠落しているのはまさにファイルパスやテスト名、根拠スニペットといった細部で、要約の段階を増やすほどそれらが落ちやすくなり、問題を悪化させます。"]},{"t":"各サブエージェントが返した構造化データを要約せず、そのまま統合サブエージェントのプロンプトに渡す。","c":true,"e":["正解。サブエージェントの出力はコーディネーターを経由するたびに要約されやすく、その過程でファイルパスや根拠スニペットのような細部が落ちます。構造化された出力を要約せずに統合サブエージェントのプロンプトへ渡せば、最終要約を書く時点で必要な詳細が手元にそろいます。"]},{"t":"各専門サブエージェントに、指摘ごとの根拠（ファイルパスやテスト名、コード抜粋）を必須とする固定スキーマで返させる。","c":true,"e":["正解。各専門サブエージェントの返却形式を、ファイルパス・テスト名・根拠を必須項目とする固定スキーマにそろえると、どの指摘にも同じ粒度の証拠が付きます。項目が欠けていればコーディネーターが機械的に検出できるため、統合段階へ渡す情報の抜けを事前に防げます。"]}],"overall":["マルチエージェント構成では、サブエージェントの結果がコーディネーターを経由して次の工程へ渡るたびに情報が圧縮され、具体的な証拠が抜け落ちやすくなります。Anthropicのマルチエージェント研究システムの解説でも、委任時に出力形式を明示すること、結果を伝言ゲームのように中継させないことが重要だとされています。","本問の正解は、返す側（固定スキーマで必須項目を返させる）と渡す側（構造化データを要約せずに統合へ渡す）の両方を整える2つです。","要約してから渡す案は詳細が落ちる地点をむしろ増やし、CLAUDE.mdへの保存は将来の実行向けで今回の受け渡しの欠落を扱いません。","詳細が工程のどこで落ちているかをたどり、その地点を直接直す選択肢を選ぶのが要点です。"],"ref":"https://www.anthropic.com/engineering/multi-agent-research-system"},{"n":13,"stem":["あるモバイルアプリ企業のプラットフォームチームは、Claude CodeをCI/CDパイプラインに統合しています。このシステムは、自動コードレビューを実行し、テストケースを生成し、プルリクエストにフィードバックを返します。具体的で実行可能なフィードバックを返し、誤検知を最小限に抑えるプロンプトを設計する必要があります。","このチームのCIレビュージョブには、プルリクエストのメタデータを扱う、プロジェクトスコープのHTTP MCPサーバーが必要です。このサーバーは、Authorizationヘッダーにベアラートークンを要求します。チームの要件は次の2つです。","MCPの設定は、すべてのチェックアウトで共有する","認証情報はコミットしない"],"q":"この要件を最もよく満たす実装はどれですか。","need":1,"opts":[{"t":"MCPサーバーをAuthorizationトークンごと~/.claude.jsonにだけ登録し、手動での設定手順を全員向けに文書化する。","c":false,"e":["~/.claude.jsonに登録するローカル／ユーザースコープは、個人だけが使うサーバーや個人の認証情報を置くのに適した場所です。しかしリポジトリで共有されないため、CIを含むすべてのチェックアウトで同じMCP設定を使うという要件を満たせず、全員に手作業での設定を求めることになります。"]},{"t":"headersでBearer ${PR_API_TOKEN}を参照する.mcp.jsonをコミットし、値は各環境で設定する。","c":true,"e":["正解。Claude Codeは.mcp.jsonのheaders・url・command・args・envで${VAR}形式の環境変数展開をサポートしており、設定ファイルには変数名だけを書いてコミットできます。実際のトークンは各CIのシークレットや開発者の環境変数として設定すれば、プロジェクトスコープの設定を全チェックアウトで共有しつつ、認証情報はリポジトリに入りません。","なおANTHROPIC_API_KEYのようなClaude Code自身や一部の既知の認証情報の変数名は、リモートサーバーのheadersでは空として扱われるため、PR_API_TOKENのような独自の変数名を使います。"]},{"t":"headersでBearer $PR_API_TOKEN（波括弧なし）を参照する.mcp.jsonをコミットし、接続時の展開に任せる。","c":false,"e":["環境変数で認証情報を渡すという方針自体は正しいものの、公式ドキュメントが示す展開構文は、波括弧で囲んだ${VAR}の形（既定値を付ける形も含む）です。波括弧のない$PR_API_TOKENは展開の対象として記載されておらず、文字列のままサーバーへ送られて認証に失敗するおそれがあります。"]},{"t":"ベアラートークンをheadersに直接書いた.mcp.jsonをコミットし、リポジトリへのアクセスを承認済みメンテナーに限る。","c":false,"e":["リポジトリへのアクセスを絞ることは、機密性の高いコードを守る一般的な対策です。しかしトークンを設定ファイルに直接書いてコミットすれば、履歴を含めて認証情報がリポジトリに残り、アクセスできる全員とそのクローンに渡るため、「認証情報をコミットしない」という要件に反します。"]}],"overall":["チームで共有する設定と個人の秘密情報を分けることは、MCPの構成でも基本になります。Claude CodeではプロジェクトスコープのMCPサーバーを.mcp.jsonに書いてコミットすれば全員に共有でき、そのheadersなどでは${VAR}形式の環境変数展開（既定値を付ける形も含む）が使えます。","本問は「設定は全チェックアウトで共有」「認証情報はコミットしない」の2条件なので、.mcp.jsonでは変数を参照するだけにして、値は各環境で設定する方法が正解です。","ユーザースコープの~/.claude.jsonは共有されず、波括弧なしの記法は文書化された展開構文ではなく、直接の埋め込みはアクセス制限の有無にかかわらず漏洩につながります。","なおClaude Codeや一部の既知の認証情報の変数名は、リモートサーバーのurlやheadersでは意図的に空として扱われるので、独自の変数名を使うのが安全です。"],"ref":"https://code.claude.com/docs/en/mcp"},{"n":14,"stem":["ある環境政策シンクタンクでは、Claude Agent SDKを使用して、政策リサーチシステムを構築しています。コーディネーターエージェントが、専門サブエージェントに作業を委任します。サブエージェントには、ウェブを検索するもの、文書を分析するもの、知見を統合するもの、報告書を生成するものがあります。このシステムはトピックを調査し、出典を明記した包括的な報告書を作成します。","評価の過程で、最終報告書は出典を引用してはいるものの、同じ主張について次の根拠を同等に扱ってしまうことがあると分かりました。","査読付きの学術研究","ベンダーが公表したベンチマーク","内部アンケート調査","検索サブエージェントと文書分析サブエージェントは現在、簡潔な知見の要約と、参照した出典の一般的なリストだけを返しています。"],"q":"後続の統合を正確にするために、最も適切な変更はどれですか。（2つ選択してください。）","need":2,"opts":[{"t":"各サブエージェントに、出典の所在・発行日・根拠の抜粋を含む構造化された主張レコードを返させる。","c":true,"e":["正解。現在のサブエージェントは要約と一般的な出典リストしか返さないため、統合エージェントにはどの主張がどの出典のどの記述に基づくのかが分かりません。出典の所在、発行日、根拠となる抜粋を含む構造化された主張レコードを返させれば、統合時に根拠の性質を機械的に参照できます。"]},{"t":"統合の工程で、根拠を出典の種類に応じて重み付けする。","c":true,"e":["正解。同じ主張を支える根拠でも、査読付き研究、ベンダーが公表したベンチマーク、内部アンケートでは信頼性の重みが異なります。統合の工程で出典の種類に応じて根拠を重み付けする方針を明示すれば、性質の違う根拠を同等に並べる誤りを防ぎ、主張の確からしさを適切に書き分けられます。"]},{"t":"コーディネーターにサブエージェントの完全な会話記録を保持させ、統合エージェントにそこから出典の由来を推測させる。","c":false,"e":["完全な会話記録を残せば情報自体は失われませんが、非構造の長いトランスクリプトから出典の由来や手法を推測させるのは不確実で、コンテキストも大きく消費します。根拠の性質は、推測させるのではなく構造化されたフィールドとして明示的に渡すほうが確実です。"]},{"t":"各サブエージェントに、要約を作成する前にすべての利用可能な出典を調査できるよう、より広いツールアクセス権を与える。","c":false,"e":["ツールアクセスを広げると、サブエージェントが調べられる情報源は増えます。しかし問題は調べた結果の返し方にあり、要約と一般的なリストという出力の形が変わらなければ、出典の種類や手法の違いは統合エージェントに伝わりません。"]}],"overall":["出典付きのレポートでも、根拠の「質」が区別されていなければ、査読付き研究とベンダーのベンチマークが同じ重みで扱われてしまいます。これを防ぐには、根拠の性質を後段が参照できる形で受け渡すことと、それを使って扱いを分けることの両方が必要です。Anthropicのマルチエージェント研究システムの解説でも、サブエージェントへの委任では出力形式を明確に指示すること、情報源の質を見極めるよう促すことが重要だとされています。","本問の正解は、出典の所在・発行日・根拠の抜粋を含む構造化された主張レコードを返させることと、統合の工程で出典の種類に応じて根拠を重み付けすることの2つです。","ツールアクセスの拡大は出力の形を変えず、トランスクリプトからの推測は不確実です。"],"ref":"https://www.anthropic.com/engineering/multi-agent-research-system"},{"n":15,"stem":["太陽光発電設備のリース事業を営む会社が、Claude Agent SDKを使用して顧客対応エージェントを構築しています。このエージェントは、料金に関する紛争、設備の不具合、アカウントの問題などのあいまいな問い合わせを処理します。カスタムのModel Context Protocol（MCP）ツール（get_customer、lookup_order、process_refund、escalate_to_human）を通じて、社内システムにアクセスします。目標は、エスカレーションすべきタイミングを見極めながら、初回解決率80%以上を達成することです。","このチームは、サポートエンジニアがオンデマンドで実行できる、case-reviewという名前のClaude Codeワークフローを用意したいと考えています。要件は次のとおりです。","長文の調査メモを作成するため、メインの会話コンテキストの外側で実行する","Claudeが、権限確認プロンプトを繰り返し出さずに、プロジェクトファイルを読み取り・検索できる","開発者が呼び出すときに、想定されるケースIDを表示する"],"q":"これらの要件に最も合致する設定はどれですか。","need":1,"opts":[{"t":".claude/skills/case-review/SKILL.mdをcontext: fork、allowed-toolsを排他的な許可リストとして、argument-hintをバリデータとして設定する。","c":false,"e":["配置とcontextのforkは正しいものの、各項目の役割を取り違えています。allowed-toolsは列挙したツールを承認なしで使えるようにする事前承認で、他のツールを使えなくする排他的な許可リストではありません。またargument-hintは補完時に表示するヒントで、引数を検証するバリデーターではありません。"]},{"t":".claude/skills/case-review.mdをcontext: fork、allowed-toolsにReadとGrep、argument-hint: [case-id]で作成する。","c":false,"e":["スキルは.claude/skills/＜スキル名＞/SKILL.mdというディレクトリ構成で置く必要があり、.claude/skills/case-review.mdのような単一ファイルはスキルとして認識されません。フロントマターの内容は正しくても、ワークフローとして呼び出せなくなります。"]},{"t":".claude/skills/case-review/SKILL.mdをcontext: main、allowed-toolsにReadとGrep、argument-hint: [case-id]で作成する。","c":false,"e":["contextをforkにしない構成では、スキルは既定どおりメインの会話の中で実行されます。allowed-toolsとargument-hintは要件に合っていますが、長文の調査メモがメインの会話コンテキストに積み上がり、「メインの会話の外側で実行する」という要件を満たしません。"]},{"t":".claude/skills/case-review/SKILL.mdをcontext: fork、allowed-toolsにReadとGrep、argument-hint: [case-id]で作成する。","c":true,"e":["正解。スキルは.claude/skills/＜スキル名＞/SKILL.mdに置きます。contextにforkを指定すると、agentで指定した種類の新しいサブエージェントが会話履歴を持たない独立したコンテキストでスキルを実行するため、長文の調査メモはメインの会話に積み上がりません。","allowed-toolsにReadとGrepを書けばスキルを呼び出したターンの間は確認なしにそれらを使え、argument-hintに[case-id]と書けば入力補完の際に想定される引数が表示されます。"]}],"overall":["Claude Codeのスキルは、.claude/skills/＜スキル名＞/SKILL.mdに手順とフロントマターを書いて定義します。公式ドキュメントによれば、contextのforkは、agentで指定した種類の新しいサブエージェントを起動し、会話履歴を持たない独立したコンテキストでスキルを実行させる指定です（名前に反して、履歴を引き継ぐ/forkのような会話のforkではありません）。allowed-toolsはスキルを呼び出したターンの間、列挙したツールを確認なしで使えるようにする事前承認（ツールを制限するものではない）、argument-hintは補完時に期待する引数を示すヒントです。","本問の3要件（メインの会話の外で実行、ReadとGrepを確認なしで使う、ケースIDを表示）は、これらの項目をそのまま組み合わせた選択肢で満たせます。","contextをmainにした構成はメインの会話で実行され、単一ファイルの配置はスキルとして読み込まれず、allowed-toolsとargument-hintを制限や検証の機能とみなす構成は各項目の意味を誤解しています。配置パスとフロントマターのどちらか1つでも誤ると、ワークフローは要件どおりに動きません。"],"ref":"https://code.claude.com/docs/en/skills"},{"n":16,"stem":["ある投資リサーチデスクは、Claude Agent SDKを使用してマルチエージェントの株式調査システムを構築しています。コーディネーターエージェントが、専門サブエージェントに作業を委任します。サブエージェントには、財務ニュースと開示資料を検索するもの、証券アナリストのPDFレポートを分析するもの、知見を統合するもの、レポートを生成するものがあります。","統合フェーズには、次の2つのクライアントツールが与えられています。","analyze_content（Web検索の抜粋を分析する）","analyze_content_docs（アップロードされたPDFを分析する）","評価の過程で、モデルは検索結果に対してPDF向けのツールを呼び、PDFの抜粋に対してWeb向けのツールを呼ぶ、という誤りを頻繁に起こしています。両方のツールの説明文はほぼ同じで、「コンテンツを分析して主要な知見を返す」としか書かれていません。","チームは、出力仕様と監査ログを別々に管理するため、Web抜粋向けとPDF向けの分析ツールを今後も別々に公開する必要があります。"],"q":"誤ったツール呼び出しを最も効果的に減らせる変更はどれですか。","need":1,"opts":[{"t":"ソースを示す名前に変え、各説明文に使う場面と使わない場面の境界を書く。","c":true,"e":["正解。モデルがツールを見分ける主要な手がかりはツール名と説明文です。analyze_web_snippetsとanalyze_uploaded_pdfsのようにソースが分かる名前にし、説明文に「どの入力に使い、どの入力には使わないか」を明記すれば誤呼び出しは直接減ります。名前を変えた以上、実行側のディスパッチャーも新しい名前に合わせる必要があります。"]},{"t":"ツール名はそのままにして、統合フェーズのプロンプトに例を足し、慎重に選ぶようClaudeに頼む。","c":false,"e":["プロンプトへの例の追加は、モデルの判断を具体的に導く有効な手法です。ただし両ツールの名前と説明文がほぼ同じという根本原因が残る限り、モデルが呼び出し時に参照する定義そのものに区別の手がかりがなく、例や「注意して選んで」という依頼だけでは誤選択を減らしきれません。"]},{"t":"2つの分析ツールを汎用ツール1つに統合し、ソースごとの扱いはツール内部で判断させる。","c":false,"e":["似たツールを1つにまとめて内部で振り分けるのは、呼び出し側の選択ミスをなくす設計としては有効な場合があります。しかし本問のチームは、出力仕様と監査ログを分けて管理するためにWeb抜粋向けとPDF向けのツールを別々に公開し続ける必要があり、統合はその要件と両立しません。"]},{"t":"tool_choiceでまず文書分析ツールを強制し、結果が不十分なときだけWeb分析ツールを呼ばせる。","c":false,"e":["tool_choiceによる強制は、特定のツールを必ず使わせたい場面では確実な制御です。しかし入力がWeb検索結果かPDFかにかかわらず文書分析ツールを先に呼ばせると、検索結果に誤ったツールが使われる問題をむしろ固定化します。Claude Opus 5.5などでは強制指定そのものが400エラーになる点にも注意が必要です。"]}],"overall":["名前も説明文もほぼ同じツールが並んでいると、モデルは区別の手がかりを持てず、呼び出しを取り違えます。公式のツール定義ガイドは、ツールが何をし、いつ使うべきで、いつ使うべきでないかを詳しく書いた説明文を最重要とし、意味の分かる名前付けも勧めています。","本問は出力仕様と監査ログの都合で2つのツールを分けたまま運用する必要があるため、ツールは残したまま、ソースを示す名前と用途・非用途を明記した説明文に改め、ディスパッチャーを追随させる方法が正解です。","統合は要件に反し、プロンプト側の例は定義のあいまいさを残し、tool_choiceの固定は入力に応じた選択を放棄します。","ツール選択の誤りを見たら、まずツール定義そのものが区別できる形になっているかを疑うのが近道です。"],"ref":"https://platform.claude.com/docs/en/agents-and-tools/tool-use/define-tools"},{"n":17,"stem":["あなたは、Claude Agent SDKを使用して、医療保険の会員対応エージェントを構築しています。このエージェントは、保険金請求の異議申し立て、保険料請求、保障内容の確認など、あいまいさの高いリクエストを処理します。カスタムのModel Context Protocol（MCP）ツール（get_member、lookup_claim、process_reimbursement、escalate_to_human）を通じて、バックエンドシステムにアクセスできます。目標は、エスカレーションすべきタイミングを見極めながら、初回解決率80%以上を維持することです。","ある保険会社のサポート自動化チームでは、MCPツールの呼び出しは成功しているものの、返り値の形式が一貫していません。次の2種類のレスポンスが混在しています。","Unixタイムスタンプと数値のステータスコードを使うレスポンス","ISO 8601形式の日付と文字列のステータス値を使うレスポンス","Claudeは、請求が払い戻しの対象かどうかを判断する際に、これらのフィールドを取り違えることがあります。"],"q":"Claudeが成功したツール結果を推論に使う前に、正規化された表現を与えるため、このチームが実装すべきものはどれですか。（2つ選択してください。）","need":2,"opts":[{"t":"MCPツールの実装側で日付とステータスのフィールドを正規化し、正規化済みの値を返すようにする。","c":true,"e":["正解。MCPツールの実装側で日付形式とステータス値を正規の形に統一して返せば、発生源で不統一が解消され、どのクライアントやエージェントから呼んでも同じ表現の結果が得られます。フックでの変換と違って呼び出し側ごとの対策が要らず、長期的な保守の面でも確実な方法です。"]},{"t":"tool_responseを読み取り、正規化されたフィールドを含むhookSpecificOutput.updatedToolOutputを返すPostToolUseフックを追加する。","c":true,"e":["正解。PostToolUseフックはtool_responseを受け取り、hookSpecificOutput.updatedToolOutputを返すと、Claudeに渡る前にツールの出力を差し替えられます。","日付をISO 8601に、ステータスを文字列にそろえた値へ置き換えれば、Claudeは常に同じ表現の結果だけを見て払い戻しの可否を判断できます。なお変わるのはClaudeが見る値だけで、ツール自体の実行結果は変わりません。"]},{"t":"一貫性のないフィールドについてのマッピングを含むhookSpecificOutput.additionalContextを返すPostToolUseフックを追加する。","c":false,"e":["additionalContextは、ツールの結果の横に補足情報を添えてClaudeに伝える手段です。マッピング表を添えることはできますが、元の不統一な値はそのまま残り、どのフィールドをどう読み替えるかの解釈はClaudeに委ねられるため、取り違えの余地が残ります。"]},{"t":"ツールレスポンスが非正規のフィールドを使っている場合にdecision: \"block\"を返すPostToolUseフックを追加する。","c":false,"e":["PostToolUseでdecisionを\"block\"にして返すと、ツール結果の横に理由が添えられてClaudeにフィードバックされますが、ツールはすでに実行済みのため実行を止めるものではありません。Claudeには元の不統一な出力がそのまま見えるので、正規化された表現を与えるという要件は満たせません。"]}],"overall":["ツールの返り値の形式がばらつくと、モデルは同じ意味の値を別物として扱い、判断を誤りやすくなります。対策は、Claudeが推論に使う前に値そのものを正規の表現へそろえることで、方法は発生源（MCPツールの実装）で直すか、受け取った直後に差し替えるかの2通りです。","Agent SDKのフックでは、PostToolUseがupdatedToolOutputを返すとClaudeが見る前にツールの出力を置き換えられ、additionalContextはツール結果に情報を付け加えるだけだと公式ドキュメントは説明しています。decisionを\"block\"にしても理由が添えられるだけで、Claudeは元の出力を見続けます。","したがってupdatedToolOutputによる差し替えと、MCPツール側での正規化の2つが正解です。","フック出力の設問では、そのフィールドが「置き換える」「付け加える」「止める」のどれに当たるかを区別すると正誤が決まります。"],"ref":"https://code.claude.com/docs/en/agent-sdk/hooks"},{"n":18,"stem":["あなたはフィンテック企業で、Messages APIを使ってClaudeをリリースパイプラインの自動レビューエージェントとして組み込んでいます。このエージェントは、プルリクエストごとに静的解析を実行し、テストケースの提案とレビューのフィードバックを生成します。","あるPRのレビュー中に、Claudeはsubmit_review_findingsツールを呼び出しました。引数のJSONは構文的に正しく、スキーマにも完全に準拠していました。しかし社内のCI検証ロジックは、次の指摘が含まれていることを理由に、この実行を拒否しました。","変更されていないファイルを参照する指摘","社内のレビューポリシーに違反する指摘"],"q":"Claudeがレビュー出力を修正しやすくするために、この統合が次に行うべき対応はどれですか。（2つ選択してください。）","need":2,"opts":[{"t":"拒否されたtool_useとそのエラー結果を会話履歴に残したまま、次のリクエストを送る。","c":true,"e":["正解。Messages APIはステートレスで、Claudeが参照できるのは各リクエストに含めたmessagesだけです。拒否されたtool_useブロックと対応するtool_resultを履歴に残したまま次のリクエストを送れば、Claudeは自分が出した指摘と拒否理由を突き合わせて修正版を作れます。この対応関係を履歴から落とすと、is_errorで伝えた内容も次のターンには届きません。"]},{"t":"検証を通った指摘だけを公開し、拒否された指摘は破棄して実行を完了させる。","c":false,"e":["通った結果だけを採用する部分公開は、失敗が一部に限られリトライする価値がない場面では現実的な選択です。しかし本問の目的はClaudeにレビュー出力を修正させることで、拒否理由を返さずに破棄するとClaudeは誤りを知る機会がなく、却下された指摘に含まれていた正当な問題も失われます。"]},{"t":"そのtool_use_idにis_error: trueのtool_resultを返し、拒否理由を指摘ごとに書く。","c":true,"e":["正解。tool_resultのis_errorをtrueにすると、Claudeはそのツール呼び出しが失敗したと認識し、contentに書かれた理由を手がかりに入力を直してリトライします。「未変更ファイルを参照した指摘」「ポリシーに違反した指摘」のように、どの指摘がなぜ拒否されたかを具体的に書くほど、次の呼び出しで直すべき箇所がはっきりします。"]},{"t":"「レビュー指摘は社内ポリシーを満たすこと」という一般的な指示をシステムプロンプトに追加して再実行する。","c":false,"e":["システムプロンプトへの追記は、毎回のリクエストで伝わる共通の方針を伝える手段で、将来の実行全体の傾向を変えたいときに使います。今回の失敗は特定の実行の特定の指摘で起きており、一般的な指示では「どの指摘がなぜ拒否されたか」を伝えられないため、この実行での修正にはつながりません。"]}],"overall":["ツール呼び出しがスキーマ上は正しくても、アプリケーション側の業務ルールで拒否されることは珍しくありません。その場合の定石は、失敗を、is_errorをtrueにしたtool_resultで具体的な理由とともにClaudeに返し、そのやり取りを会話履歴に残したまま次のリクエストを送ることです。公式ドキュメントも、\"failed\"のような汎用的なメッセージではなく、何が起きて次に何を試すべきかを書いたエラーメッセージを返すよう勧めています。","2つの正解は「何を返すか」と「どこに残すか」の組で、どちらかが欠けると修正の材料がClaudeに届きません。","誤答の2つは、失敗を黙って消す案と、個別の失敗を一般的な指示に置き換える案で、どちらも今回の誤りをClaudeに知らせる経路を持ちません。"],"ref":"https://platform.claude.com/docs/en/agents-and-tools/tool-use/handle-tool-calls"},{"n":19,"stem":["あるゲームスタジオのライブ運用チームは、Claude CodeをCI/CDパイプラインに統合しています。このシステムは、自動コードレビューを実行し、テストケースを生成し、プルリクエストにフィードバックを返します。具体的で実行可能なフィードバックを返し、誤検知を最小限に抑えるプロンプトを設計する必要があります。","このチームは、フレーキーテスト（不安定なテスト）のリスクを検出する、新しい自動レビュー機能を設計しています。ただし、求められる挙動について、製品やワークフローの面で次のような疑問が未解決のまま残っています。","どのようなコメントが対応可能で、どのようなコメントがノイズなのか","何を検証すれば、実装が正しいと証明できるのか"],"q":"Claude Codeに実装を依頼する前に、このチームがまず行うべきことはどれですか。","need":1,"opts":[{"t":"最近のプルリクエストの議論から不足している要件を推測する、自律的なClaude Codeジョブを定期実行する。","c":false,"e":["過去の議論から要件の候補を洗い出すのは、既存の合意を掘り起こす補助としては役立ちます。しかし本問の疑問はまだ誰も決めていない製品判断で、自律ジョブに推測させると人が決めるべき事項がモデルの推測に置き換わり、誤った前提のまま実装が進む危険があります。"]},{"t":"Agentツールで委任したサブエージェントにAskUserQuestionで質問させ、その記録を実装担当のセッションへ渡す。","c":false,"e":["サブエージェントへの委任は、調査などの作業を別のコンテキストに切り出したいときに有効です。しかしAskUserQuestionはサブエージェントには提供されないツールの1つで、委任先から開発者に直接質問することはできないため、未解決の疑問を人との対話で解消する手段になりません。"]},{"t":"詳細なレビューチェックリストをプロンプトに含めて直接実行し、最初のCI失敗を見て調整する。","c":false,"e":["直接実行は、要件が明確で手順が分かっている変更なら最も速い進め方です。本問ではどのコメントが対応可能でどれがノイズか、何を検証すれば正しいと言えるかが未決のままで、チェックリストを詳しくしても決まっていない判断は埋まらず、CIの失敗から逆算する手戻りが生じます。"]},{"t":"AskUserQuestionでClaudeに質問させながらSPEC.mdをまとめさせ、新しいセッションで実装する。","c":true,"e":["正解。公式のベストプラクティスは、大きな機能では最小限のプロンプトから始めてAskUserQuestionツールでClaudeにインタビューさせ、合意した内容をSPEC.mdにまとめ、仕様が固まったら新しいセッションで実装する流れを勧めています。未解決の製品判断を人との対話で決め、実装はその仕様だけに集中したクリーンなコンテキストで行えます。"]}],"overall":["未決の要件が残ったまま実装を依頼すると、Claudeはもっともらしい前提で空白を埋めて進めるため、後で大きな手戻りが生じがちです。Claude Codeのベストプラクティスは、大きな機能ほど先にClaudeにインタビューさせて仕様を固める進め方を勧めており、AskUserQuestionで質問を重ねてSPEC.mdを書かせ、仕様が完成したら新しいセッションで実装に入る手順を示しています。","本問の「どのコメントが対応可能か」「何を検証すれば正しいと言えるか」はまさに人が決めるべき論点なので、この対話型の計画が正解です。","サブエージェントはAskUserQuestionを使えず、直接実行は疑問を残したまま進み、自律ジョブは判断を推測で置き換えます。","問題文に「疑問が未解決」「実装を依頼する前に」とあれば、人との合意を文書に残す段階を持つ選択肢が有力です。"],"ref":"https://code.claude.com/docs/en/best-practices"},{"n":20,"stem":["あなたは、Claude Agent SDKを使用して保険金請求対応エージェントを構築しています。このエージェントは、支払い調整、補償範囲の照会、払戻し可否など、あいまいさの高い問い合わせを処理します。カスタムのMCPツール（get_policyholder、lookup_claim、issue_payout、escalate_to_adjuster）を通じて、バックエンドシステムにアクセスできます。目標は、エスカレーションすべきタイミングを見極めながら、初回解決率80%以上を維持することです。","ある保険会社のエンジニアリングチームが、Claude Agent SDKとこれらのMCPツールを使って、このエージェントを構築しています。テスト中にエージェントのトレースを見ると、ClaudeはMCP経由でlookup_claimをリクエストしているものの、請求内容の照会結果が観測されていません。セッションは、顧客への最終的な回答を出さないまま終了してしまいます。"],"q":"このチームが行うべき実装上の変更はどれですか。","need":1,"opts":[{"t":"起動前にサポート用のMCPツールを一通り実行し、その出力をClaudeに1ターンで要約させる。","c":false,"e":["必要なデータが事前に確定している定型処理なら、先にまとめて取得して1回で要約させる構成も成り立ちます。しかしあいまいな問い合わせでは、どのツールをどの順で使うかは会話の内容によって変わり、issue_payoutやescalate_to_adjusterのような副作用のある操作を無条件に先に実行するのは危険です。"]},{"t":"アシスタントの文章から完了を示す言い回しを検出し、解決したと述べた時点でワークフローを終える。","c":false,"e":["出力の文章から完了を判定する方法は、ツールを使わない単純なチャットなら終了条件として使えることもあります。しかし今回の原因はツール呼び出しの結果が返っていないことで、完了の言い回しを探しても照会結果が得られないまま終わる点は変わらず、言い回しの揺れによる誤判定の危険も加わります。"]},{"t":"各MCPバックエンド操作はClaude自身が実行してから回答するよう、システム指示に追加する。","c":false,"e":["システム指示は、Claudeにどう振る舞ってほしいかを伝える手段です。しかしClaudeが出力するのはツール呼び出しの要求（tool_use）までで、実際にMCPサーバーへ送って結果を受け取るのはクライアント側のループの役目なので、指示を追加してもツールが実行されない問題は直りません。"]},{"t":"SDKのエージェントループで実行し、ツール呼び出しの結果を返して最終応答まで処理を続けさせる。","c":true,"e":["正解。Agent SDKのエージェントループは、Claudeが要求したツール呼び出しを実際に実行し、その結果を会話に返して次のターンを要求する処理を、Claudeがツールを使わずに最終応答を返すまで繰り返します。","lookup_claimの照会結果が観測されずにセッションが終わる症状はこのループが回っていないことを示しており、SDK主導のループで実行すれば要求から結果、最終回答までが一続きになります。"]}],"overall":["ツールを使うエージェントは、「モデルがツールを要求する」「アプリケーションがそれを実行して結果を返す」「モデルが続きを考える」という往復を繰り返して初めて機能します。Agent SDKのエージェントループはこの往復を自動で回し、ツールを使わない最終応答が返るまで処理を続けます。","本問のトレースではlookup_claimの要求は出ているのに結果が観測されず、最終回答もないため、ツール呼び出しの実行と結果の返却が抜けていると判断できます。","システム指示の追加はモデルに実行できない役割を求め、完了フレーズの検出は原因と無関係で、ツールの事前一括実行は会話に応じたツール選択を捨てます。","トレースに「要求はあるのに結果がない」と見えたら、まずループの実装を疑うのが定石です。"],"ref":"https://code.claude.com/docs/en/agent-sdk/agent-loop"},{"n":21,"stem":["ある再生可能エネルギー会社では、Claude Agent SDKを使用して、送電網の系統連系フィージビリティ調査システムを構築しています。コーディネーターエージェントが、専門サブエージェントに作業を委任します。サブエージェントには、ウェブを検索するもの、技術文書を分析するもの、知見を統合するもの、報告書を生成するものがあります。このシステムはトピックを調査し、出典を明記した包括的な報告書を作成します。","評価の過程で、統合サブエージェントが、サブエージェントの出力を連結した長いテキストを受け取ったときに、次のような傾向があることが分かりました。","束の途中にある根拠のしっかりした知見を、繰り返し省いてしまう","冒頭と末尾付近の知見は保持される"],"q":"統合ステップを元の根拠に基づかせたまま、この失敗を最も効果的に減らせる変更はどれですか。","need":1,"opts":[{"t":"詳細な根拠を段階的に短くした要約に置き換え、最新の要約だけを統合エージェントに渡す。","c":false,"e":["段階的な要約は、長い会話を続けるためにコンテキストを圧縮したい場面では現実的な手段です。しかし詳細な根拠を短い要約に置き換え、最新の要約だけを渡すと、統合ステップが元の根拠を参照できなくなり、「元の根拠に基づかせたまま」という要件に反します。"]},{"t":"集約された出力の前に簡潔な知見マップを付加し、詳細な根拠を出典とトピックの明示的な見出しでグループ化する。","c":true,"e":["正解。長いコンテキストでは、先頭と末尾に比べて途中に置かれた情報が見落とされやすくなります。集約した出力の前に知見の全体像を示すマップを置き、詳細な根拠を出典とトピックの明示的な見出しで区切れば、統合エージェントは束のどこに何があるかを把握したうえで各根拠を参照でき、元の根拠を削らずに中間部分の取りこぼしを減らせます。"]},{"t":"すべての出典URLを末尾の付録に移し、説明的な根拠は1つの連続したセクションにまとめておく。","c":false,"e":["出典URLを付録にまとめると本文は読みやすくなりますが、根拠テキストの配置や構造は変わりません。説明的な根拠を1つの連続したセクションに詰めると、かえって区切りの手がかりが減り、途中の知見が埋もれやすくなります。"]},{"t":"サブエージェントの出力を完了順に連結し、統合エージェントに束全体から主要テーマを推測させる。","c":false,"e":["完了順の連結は実装が最も簡単な集約方法ですが、現在の失敗はまさにこの構成で起きています。構造の手がかりがないまま長い束全体から主要テーマを推測させても、途中に位置する根拠の見落としは解消しません。"]}],"overall":["長いコンテキストでは、入力の先頭と末尾にある情報に比べて、途中にある情報がモデルの注意から漏れやすくなることが知られています。公式のプロンプトガイドは長文を扱うコツとして、複数の文書を＜document＞などのタグと出典のメタデータで構造化すること、作業の前に関連箇所を引用させることなどを勧めています。","本問の統合ステップは、連結された長い出力の途中にある根拠を落としているので、冒頭に知見マップを置いて全体像を示し、詳細な根拠を出典とトピックの見出しで構造化する方法が、根拠を失わずに見落としを減らせる正解です。","要約への置き換えは元の根拠を失い、完了順の連結は現状のままで、URLの移動は根拠の構造を変えません。要件に「元の根拠に基づかせたまま」とある以上、情報を削る選択肢はその時点で候補から外れます。"],"ref":"https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices"},{"n":22,"stem":["ある投資リサーチデスクは、Claude Agent SDKを使用してマルチエージェントの株式調査システムを構築しています。コーディネーターエージェントが、専門サブエージェントに作業を委任します。サブエージェントには、財務ニュースと開示資料を検索するもの、証券アナリストのPDFレポートを分析するもの、知見を統合するもの、レポートを生成するものがあります。","リファクタリング計画を確定する前に変更対象のパッケージを調査するため、依存関係の影響を調べる名前付きサブエージェントを使っています。","ところが、サブエージェントが影響対象のファイルを複数特定した後に、ローカルのテストコマンドが断続的にタイムアウトします。親の会話には「impact analysis failed」という結果だけが返されるため、有用な知見が計画から抜け落ちてしまいます。"],"q":"親の会話を生の調査出力で溢れさせずに、失敗への耐性を最もよく保てる変更はどれですか。","need":1,"opts":[{"t":"親がサブエージェントの途中のBash呼び出しを確認し、失敗したコマンドだけを計画前に再実行する。","c":false,"e":["親が子の作業の詳細を確認できるなら、失敗箇所だけを再実行するのは無駄の少ない対処です。しかしサブエージェントの途中のツール呼び出しと結果はサブエージェントの中にとどまり、親に返るのは最終メッセージだけなので、親から中間のBash呼び出しを検査するという前提が成り立ちません。"]},{"t":"toolsとdisallowedToolsを未設定のままにし、継承されたアクセス権でBashのリトライを抑える。","c":false,"e":["toolsやdisallowedToolsを省略すると、サブエージェントは親が使えるツールを継承します。これはツール権限の範囲を決める設定で、リトライの振る舞いや失敗時に何を返すかとは無関係なため、部分的な知見が失われる問題には効きません。"]},{"t":"サブエージェント内で一時的な失敗をリトライさせ、得られた知見と未解決のエラーを最終結果に含めさせる。","c":true,"e":["正解。一時的なタイムアウトはサブエージェント自身がリトライして吸収し、それでも解決しない場合は、試行回数、特定できた影響対象ファイル、未解決のエラーをまとめて最終結果として返させます。親は簡潔な1つの結果だけを受け取るのでコンテキストが溢れず、「impact analysis failed」の一言で有用な知見が捨てられることもなくなります。"]},{"t":"依存関係の影響の調査を親の会話に戻し、計画作成の材料としてコマンドログを残す。","c":false,"e":["調査を親の会話で直接行えば、ログはすべて手元に残ります。ただしそれはサブエージェントへ委任してコンテキストを分離した目的そのものを捨てることになり、親の会話が生の調査出力で溢れるという、問題文が避けたい状態を招きます。"]}],"overall":["サブエージェントに調査を委任する利点は、途中の探索やツール出力をサブエージェント側に閉じ込め、親には要点だけを返せることです。公式ドキュメントも、サブエージェントの中間のツール呼び出しと結果はサブエージェント内にとどまり、親に返るのは最終メッセージだけだと説明しています。そのため一時的な失敗への耐性も、サブエージェント側で完結させるのが自然な設計です。","本問では、ローカルでリトライし、それでも残った失敗と部分的な知見を最終結果に含めて返す方法が、失敗への耐性と親のコンテキスト効率を両立します。","親から中間呼び出しを検査する案は仕組み上できず、権限設定の放置は論点と無関係で、調査を親へ戻す案は委任の利点を失います。"],"ref":"https://code.claude.com/docs/en/agent-sdk/subagents"},{"n":23,"stem":["あなたは、Claude Agent SDKを使用して、動画配信サービスのカスタマーサポート解決エージェントを構築しています。このエージェントは、解約、請求に関する異議申し立て、アカウントの問題など、あいまいさの高いリクエストを処理します。カスタムのModel Context Protocol（MCP）ツール（get_customer、lookup_order、process_refund、escalate_to_human）を通じて、バックエンドシステムにアクセスできます。目標は、エスカレーションすべきタイミングを見極めながら、初回解決率80%以上を維持することです。","このチームは、緊急性の低い解決後の品質チェックを、Message Batches APIに移行したいと考えています。条件は次のとおりです。","ケースは継続的に到着する","監査のトリアージのため、各チェックは、ケースの到着から30時間以内にバッチの最終結果が得られている必要がある","バッチは、結果が得られるか期限切れになるまでに、ドキュメントに記載された24時間の処理ウィンドウをすべて使う場合があるものとする"],"q":"チームが使うべき送信間隔はどれですか。","need":1,"opts":[{"t":"custom_idで各ケースの結果を突き合わせながら、蓄積したリクエストを1日に1回送信する。","c":false,"e":["1日1回の送信は、結果が翌日以降に分かれば十分な集計処理なら、最も管理が簡単な間隔です。しかし最悪の場合、送信直後に到着したケースは約24時間待ってから投入され、さらに処理に最大24時間かかると到着から約48時間後になり、30時間の要件を大きく超えます。"]},{"t":"custom_idで各ケースの結果を突き合わせながら、蓄積したリクエストを8時間ごとに送信する。","c":false,"e":["8時間ごとの送信でも、最悪の待ち時間は8時間＋24時間＝32時間となり、30時間を2時間超えます。多くのバッチは1時間以内に終わりますが、問題文は24時間の処理ウィンドウをすべて使う場合を想定するよう求めているので、平均ではなく最悪値で判断します。"]},{"t":"custom_idで各ケースの結果を突き合わせながら、蓄積したリクエストを12時間ごとに送信する。","c":false,"e":["12時間ごとの送信では、最悪で12時間待ってから投入され、処理に最大24時間かかると合計36時間になります。custom_idによる突き合わせは正しく機能しても、30時間以内という時間要件は満たせません。"]},{"t":"custom_idで各ケースの結果を突き合わせながら、蓄積したリクエストを4時間ごとに送信する。","c":true,"e":["正解。4時間ごとに送信すれば、最悪でも到着から投入まで4時間、処理に最大24時間で合計28時間となり、30時間以内に収まります。送信間隔は「30時間−24時間＝6時間」以下である必要があり、選択肢の中でこれを満たすのは4時間だけです。"]}],"overall":["Message Batches APIは大量のリクエストを低コストで非同期に処理でき、多くのバッチは1時間以内に完了しますが、24時間以内に処理が終わらなければ期限切れになる仕様のため、最大24時間の処理時間を見込む必要があります。","継続的に到着するケースを一定間隔でまとめて送る場合、最悪の遅延は「次の送信までの待ち時間（最大で送信間隔）＋バッチの処理時間（最大24時間）」です。これを30時間以内に収めるには送信間隔を6時間以下にする必要があり、選択肢では4時間ごとだけが該当します（4＋24＝28時間）。","1日・12時間・8時間ごとは、それぞれ最悪48・36・32時間で要件を超えます。custom_idによる結果の突き合わせはすべての選択肢に共通していて差を生まないため、判断は送信間隔の計算だけで決まります。","平均ではなく最悪ケースで待ち時間と処理時間を足し合わせるのが、時間要件の見積もりの基本です。"],"ref":"https://platform.claude.com/docs/en/build-with-claude/batch-processing"},{"n":24,"stem":["あるコンサルティング企業のリサーチチームは、Claude Agent SDKを使用してマルチエージェントリサーチシステムを構築しています。コーディネーターエージェントが、専門サブエージェントに作業を委任します。サブエージェントには、ウェブを検索するもの、文書を分析するもの、調査結果を統合するもの、レポートを生成するものがあります。このシステムはトピックを調査し、出典を明記した包括的なレポートを作成します。","広いトピックでベンチマークを実行すると、処理が遅く、カバー範囲にもムラがあります。ログを見ると、コーディネーターは次の順で処理していました。","1人の専門サブエージェントに、すべての観点を順番に調査させる","圧縮した文章の要約を、次の専門サブエージェントへ渡す","そのあとで初めて、最終レポートを依頼する","関連する観点は開始時点ですでに判明しており、互いに依存関係もありません。"],"q":"レイテンシとカバー範囲を改善しつつ、一貫性のある最終レポートを維持するために、最も効果的な設計変更はどれですか。（2つ選択してください。）","need":2,"opts":[{"t":"各専門サブエージェントに、未完了の観点を別の専門サブエージェントへ引き継がせ、互いの非公開のコンテキストを統合したうえで、統合済みの回答をコーディネーターへ返させる。","c":false,"e":["専門サブエージェント同士の引き継ぎ（ハンドオフ）は、作業の途中で担当を切り替える必要があるワークフローでは使われる形です。しかし未完了分を順に引き継ぐ限り処理は逐次のままでレイテンシは改善せず、各サブエージェントのコンテキストは独立しているため、互いの非公開コンテキストを直接統合するという前提も成り立ちません。"]},{"t":"コーディネーターが並列のツール利用を無効化して各観点を別々のターンで処理し、生の結果をすべて追記していき、最後のサブタスクの後に統合する。","c":false,"e":["並列ツール呼び出しの無効化（disable_parallel_tool_use）は、ツールの実行順序を厳密に制御したい場合や、同時に実行すると競合する操作がある場合に使う設定です。本問の観点は互いに独立しており、並列化こそがレイテンシ改善の手段なので、無効化して1観点ずつ処理すると現在の遅さを固定してしまいます。"]},{"t":"コーディネーターが依頼を観点ごとのサブタスクに分け、共有の制約条件を添えて独立した専門サブエージェントをまとめて呼び出し、それぞれの知見を統合する。","c":true,"e":["正解。観点が開始時点で分かっていて互いに依存しないなら、観点ごとのサブタスクに分けて専門サブエージェントを同時に走らせるのが最も速い構成です。共有の制約条件（対象範囲や出典の基準など）を各サブタスクに渡しておけば、最後の統合で観点ごとの結果を一貫した1つのレポートにまとめられます。"]},{"t":"コーディネーターが各専門サブエージェントに自己完結したブリーフを渡し、どの専門サブエージェントもほかのサブエージェントの要約を待たずに済むようにする。","c":true,"e":["正解。現在の遅さは、前の専門サブエージェントの要約を次の専門サブエージェントが待つという逐次の依存から生じています。各専門サブエージェントに必要な情報を含む自己完結したブリーフを渡せば待ち合わせがなくなり、同時に実行できます。圧縮された要約を経由しないので、中継の過程で情報が落ちてカバー範囲にムラが出る問題も避けられます。"]}],"overall":["独立した複数の観点を調べるタスクは、並列化によってレイテンシとカバー範囲の両方を改善できる典型例です。Anthropicのエージェント設計ガイドはこれをparallelizationのsectioning（独立したサブタスクへの分割と並行実行）として紹介しており、マルチエージェント研究システムの解説でも、サブエージェントを並行して起動することで複雑な調査の所要時間が大きく短縮されたと報告されています。","本問の正解は、観点ごとのサブタスクに分割して同時に呼び出し統合することと、各専門サブエージェントに自己完結したブリーフを渡して待ち合わせをなくすことの2つです。","順番の引き継ぎも並列ツールの無効化も、逐次処理という原因を残したままです。","問題文に「開始時点で判明」「互いに依存しない」とあれば、並列化を妨げている依存を取り除く選択肢が正解の候補になります。"],"ref":"https://www.anthropic.com/engineering/building-effective-agents"},{"n":25,"stem":["医療保険の請求処理システムを提供する会社では、会員からのあいまいな問い合わせ（保険金請求の異議申し立て、加入資格の確認、アカウントの問題など）を解決するエージェントを、Claude Agent SDKで構築しています。このエージェントは、カスタムのModel Context Protocol（MCP）ツール（get_member、lookup_claim、process_adjustment、escalate_to_specialist）を通じて、社内システムにアクセスします。目標は、必要な場合には専門担当者にエスカレーションしながら、初回解決率80%以上を達成することです。","このチームは、保険金調整やエスカレーションのポリシーの変更をGitHubで管理しており、スケジュールされたレビューバッチのときだけ、マネージド版のClaude Code Reviewを依頼しています。","あるレビュアーが@claude review onceとコメントし、修正がプッシュされた後に、もう一度@claude review onceとコメントしました。すると、解消済みのはずのいくつかの指摘が、新しいインラインコメントとして繰り返されてしまいました。","チームは、次回の手動での再レビューで、最初のレビューで見つかった未解消の問題は確実に表示させつつ、レビュアーの信頼を損なわないようにしたいと考えています。"],"q":"変更すべきことはどれですか。","need":1,"opts":[{"t":"再レビューでは過去の指摘を踏まえて新規または未解消の問題だけを報告するよう、REVIEW.mdにガイダンスを追加する。","c":true,"e":["正解。REVIEW.mdはリポジトリのルートに置くレビュー専用の指示で、指摘を見つけて検証するエージェントに直接渡されます。公式ドキュメントも「再レビューの収束」として、すでにレビュー済みのPRでどう振る舞うかをここに書くことを勧めており、過去の指摘を踏まえて新規または未解消の問題だけを報告するよう定めれば、解消済みの指摘の繰り返しを抑えつつ、未解消の問題は表示させ続けられます。"]},{"t":"手動コマンドを@claude review alwaysに変え、以後はプッシュのたびにプルリクエストをレビューさせる。","c":false,"e":["「@claude review always」は、以後のプッシュごとにレビューを起動するようPRを登録するコマンドで、登録されたPRでは修正済みの指摘のスレッドが次の実行で自動的に解決されます。","しかしこのチームはスケジュールされたバッチのときだけ手動でレビューを依頼する運用で、プッシュのたびにレビューを走らせるとその前提とコスト管理が崩れます。なお2026年7月の更新以降、onceを付けない「@claude review」は「@claude review once」と同じ1回限りのレビューで、プッシュ起動の登録は行いません。"]},{"t":"レビュー用の指示は変更せず、再レビューのたびにメンテナーが重複したインラインスレッドを手作業でクローズする。","c":false,"e":["重複スレッドの手作業でのクローズは、一時的に画面を整える方法としては可能です。しかし再レビューのたびに同じ手間が生じ、根本原因である報告内容はそのままなので、レビュアーの信頼の低下も続きます。"]},{"t":"GitHubのChecksタブからレビューを再実行し、Claude Codeに新しいコミットに対するコメントを更新させる。","c":false,"e":["Checksタブからの再実行は、プッシュせずに新しいレビューをもう一度走らせたいときに使える手段です。しかし再実行も「@claude review once」と同じく独立した新しいレビューで、報告の方針は変わらないため、解消済みの指摘が新しいインラインコメントとして繰り返される状況は解決しません。"]}],"overall":["Claude Codeのマネージドなコードレビュー（Code Review）は、PRへの「@claude review」系のコメントや、リポジトリの設定に応じたプッシュ時の自動実行で起動し、CLAUDE.mdとREVIEW.mdでレビューの方針を調整できます。REVIEW.mdはレビューにだけ使われる指示で、重大度の定義、指摘数の上限、スキップ規則に加え、すでにレビュー済みのPRでの振る舞い（再レビューの収束）も指定できます。","本問は手動でのスケジュール運用を保ったまま、再レビューで解消済みの指摘が繰り返されるのを防ぎ、未解消の問題は確実に残したいので、REVIEW.mdに過去の指摘を踏まえて新規または未解消の問題だけを報告する方針を書くのが正解です。","「@claude review always」への切り替えは手動運用の前提を崩し、Checksタブからの再実行は同じ方針のレビューをやり直すだけで、手作業のクローズは根本原因に触れません。起動方法を変える選択肢は、どれもレビューの中身には手を触れていない点で共通しています。"],"ref":"https://code.claude.com/docs/en/code-review"},{"n":26,"stem":["あなたは、Claude Agent SDKを使用して、インテリア・家具のEC事業者向けにカスタマーサポート解決エージェントを構築しています。このエージェントは、返品、請求に関する異議申し立て、アカウントの問題など、あいまいさの高いリクエストを処理します。カスタムのModel Context Protocol（MCP）ツール（get_customer、lookup_order、process_refund、escalate_to_human）を通じて、バックエンドシステムにアクセスできます。目標は、エスカレーションすべきタイミングを見極めながら、初回解決率80%以上を維持することです。","パイロットテストの間に、返金提案のステップは、パース可能な構造化データを常に生成するようになりました。必須フィールドはすべてそろっており、数値の型も正しくなっています。残っている不具合は次の2つです。","商品クレジットが、shipping_refundフィールドに入れられてしまう","明細ごとの調整額の合計が、要求された返金総額と一致しない"],"q":"このチームが次に行うべき変更はどれですか。","need":1,"opts":[{"t":"プレーンなJSONの指示に切り替え、抽出ステップからツールスキーマを取り除く。","c":false,"e":["プレーンなJSONの指示は、スキーマを使わずに柔軟な形式で出力させたい場合の選択肢です。しかしパース可能で型も正しいという現在の良い状態を手放すだけで、フィールドの使い分けや金額の整合性という残った不具合には効果がありません。"]},{"t":"スキーマの返金フィールドを必須にし、抽出時にnull許容の値を拒否する。","c":false,"e":["必須化とnullの拒否は、値が欠けることを防ぐための形式面の対策です。現在の出力はすでに必須フィールドがそろっており、問題は値の入れ場所と金額の整合性という意味の誤りなので、形式の制約を強めても解消しません。"]},{"t":"ツール定義にstrict: trueを設定し、返金提案の入力をスキーマに厳密に一致させる。","c":false,"e":["ツール定義のstrictをtrueにすると、ツール入力が定義したスキーマに厳密に一致することが保証され、型の誤りや必須フィールドの欠落を防げます。本問の出力はすでにスキーマに適合しており、フィールドの意味の取り違えや合計の不一致はスキーマの外にある業務上の正しさの問題なので、strictでは検出できません。"]},{"t":"返金の実行前に業務ルールの検証を追加し、具体的な違反内容を差し戻して修正させる。","c":true,"e":["正解。構造化出力やスキーマ検証が保証できるのは、必須フィールドの存在や型の一致といった形式面までです。商品クレジットをshipping_refundに入れていないか、明細の合計が返金総額と一致するかは業務ルールの検証で確かめる必要があり、違反を具体的に書いて差し戻せば、Claudeは何をどう直すべきかを把握して修正できます。"]}],"overall":["構造化出力で「パースでき、必須フィールドがそろい、型も正しい」状態になっても、それは形式の正しさであって業務上の正しさではありません。公式ドキュメントも、structured outputsやstrict tool useはスキーマへの適合を保証するものだと説明しており、値の意味や項目間の整合性はアプリケーション側で検証する必要があります。","本問に残っている不具合は、商品クレジットの誤ったフィールドへの格納と、明細の合計と返金総額の不一致で、どちらも業務ルールの問題です。したがって、返金の実行前に業務ルールの検証を行い、違反内容を具体的に差し戻して修正させるのが次の一手です。","スキーマの除去、strictの設定、必須化はいずれも形式面の操作で、残った問題に届きません。","失敗が「形式の誤り」か「意味の誤り」かの見極めが、対策を選ぶ出発点になります。"],"ref":"https://platform.claude.com/docs/en/build-with-claude/structured-outputs"},{"n":27,"stem":["ある保険会社の社内開発チームは、Claude Codeをコードレビュー自動化パイプラインに統合しています。このシステムは、プルリクエストごとに自動レビューを実行し、具体的で実行可能なフィードバックを返します。","このチームのレビュー用プロンプトは、Claudeにポリシー違反の可能性を検出させ、各指摘にpolicy_sectionとsupporting_quote（根拠となる引用）を必ず含めるよう求めています。","あるプルリクエストは、カスタマーサポートの通話記録（トランスクリプト）の保持（retention）ロジックを追加するものでした。しかし、Claudeに渡したポリシーの抜粋はアプリケーションログと分析イベントに関するものだけで、トランスクリプトに関するポリシーは含まれていませんでした。バリデーターは、supporting_quoteが空であることを理由に、Claudeの指摘を却下しました。"],"q":"このパイプラインがとるべき対応はどれですか。（2つ選択してください。）","need":2,"opts":[{"t":"引用を示せない場合は情報不足として返し、引用が付くまで指摘を投稿しない。","c":true,"e":["正解。根拠となる文書が手元にない状態で引用を求めると、モデルは存在しない文言を作り出す方向に押されます。「引用を示せなければ情報不足として返す」と明示して投稿を保留すれば、根拠のない指摘がパイプラインに流れません。公式ドキュメントも、分からないと言える余地を与えることと、引用で裏付けられない主張を取り下げさせることをハルシネーション対策として挙げています。"]},{"t":"max_tokensを引き上げ、不足しているポリシーの根拠を応答の続きで補わせる。","c":false,"e":["max_tokensは応答が途中で打ち切られる（stop_reasonがmax_tokensになる）場合に引き上げる出力上限です。今回は入力にトランスクリプトのポリシーが存在しないことが問題で、出力の上限を増やしても引用できる文言は生まれず、長く書かせるほど根拠の捏造を招きやすくなります。"]},{"t":"構造化出力スキーマでsupporting_quoteを必須フィールドにして出力を強制する。","c":false,"e":["スキーマで必須フィールドにする方法は、値が存在するのに出力から漏れてしまう場合には有効です。本問では引用すべき文言そのものが提供されていないため、必須化するとClaudeは何かを埋めざるを得なくなり、もっともらしい架空の引用が混入する危険が増します。"]},{"t":"通話トランスクリプトの保持に関するポリシー抜粋を、レビュー用プロンプトに追加で渡す。","c":true,"e":["正解。supporting_quoteが空になる直接の原因は、トランスクリプトの保持に関するポリシー文言が入力に含まれていないことです。該当する抜粋をプロンプトに加えれば、Claudeは実在する文言を引用してpolicy_sectionと根拠を埋められ、指摘が検証可能な形で成立します。"]}],"overall":["根拠付きの構造化出力では、「根拠を付けさせる」ことと「根拠がないときにどう振る舞わせるか」を分けて設計します。","本問のバリデーターが指摘を却下したのは正しい動作で、問題はトランスクリプトのポリシーという根拠が入力に存在しないことにあります。したがって、不足している根拠を供給することと、根拠がないときは情報不足として投稿を保留することの2つが正解です。公式のハルシネーション低減ガイドも、不確かなときに「分からない」と言わせること、引用で裏付けられない主張を取り下げさせることを推奨しています。","max_tokensの引き上げやスキーマでの必須化は出力の長さや形を変えるだけで、存在しない根拠を補えません。"],"ref":"https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/reduce-hallucinations"},{"n":28,"stem":["ある製薬会社では、Claude Agent SDKを使用して、競合情報のリサーチシステムを構築しています。コーディネーターエージェントが、専門サブエージェントに作業を委任します。サブエージェントには、規制当局への申請文書を検索するもの、臨床試験文書を分析するもの、知見を統合するもの、報告書を生成するものがあります。このシステムはトピックを調査し、出典を明記した包括的な報告書を作成します。","評価の過程で、最終報告書はよく書けているものの、次の問題が起きることがあると分かりました。","根拠のない主張が含まれる","セクション間の矛盾を見落とす","現在の設計では、報告書生成エージェントが公開前に自分自身の草稿をレビューしています。"],"q":"レビューの信頼性を最も効果的に改善できるアーキテクチャの変更はどれですか。（2つ選択してください。）","need":2,"opts":[{"t":"主張と出典の組ごとに独立したレビュアーで検証し、その後で矛盾と抜けを確認する統合パスを実行する。","c":true,"e":["正解。セクションごとの主張と出典の組に対して独立したレビュアーを走らせれば、各レビュアーは小さく焦点の絞れた入力で根拠の有無を確かめられます。そのうえで矛盾とカバレッジの抜けを横断的に確認する統合パスを別に実行すれば、セクション単位では見えないセクション間の食い違いも拾えます。"]},{"t":"検証をサブエージェントに任せ、検証対象の主張と照合すべき出典の抜粋を一緒に渡す。","c":true,"e":["正解。検証を独立したサブエージェントに任せるときは、何と何を突き合わせるかを明示して渡すことが前提です。検証対象の主張と照合すべき出典の抜粋をセットで渡せば、サブエージェントは生成過程の文脈に引きずられずに、主張が出典で裏付けられているかだけを判定できます。"]},{"t":"報告書生成エージェントに、既存の会話履歴のまま草稿直後に拡張版のセルフレビューを行わせる。","c":false,"e":["セルフレビューは、手早く明らかな誤りを直す工程としては役立ちます。しかし草稿を書いたのと同じ会話履歴で見直すと、生成時の前提や思い込みを引き継いだまま評価することになり、根拠のない主張を見落とすという現状の設計の弱点はそのまま残ります。"]},{"t":"統合エージェントに全サブエージェントの出力を一度にまとめさせ、公開前に根拠のない主張へ印を付けさせる。","c":false,"e":["統合と検査を1つのエージェントに一度でやらせる方法は、構成が単純で処理も速い利点があります。しかし大量の出力を一度に扱うと注意が分散して見落としが生じやすく、自分でまとめた結果を同じエージェントが検査することになるため、独立した検証にはなりません。"]}],"overall":["生成したエージェント自身によるレビューは、同じ前提と文脈を共有しているため誤りを見逃しやすく、品質保証には独立した検証の仕組みが必要です。Anthropicのエージェント設計ガイドは、あるLLMが生成し別のLLMが評価してフィードバックするevaluator-optimizerや、独立したサブタスクを並行して処理するparallelizationを紹介しています。","本問の正解は、主張と出典の組ごとに独立したレビュアーで検証してから統合パスで矛盾と抜けを確認することと、検証を委任する際に主張と照合すべき出典の抜粋を一緒に渡すことの2つです。","既存の履歴でのセルフレビューは現状の設計のままで、一度きりの統合と検査の兼務は見落としを招きます。独立性と材料の両方がそろって初めて、レビューは生成とは別の視点として機能します。"],"ref":"https://www.anthropic.com/engineering/building-effective-agents"},{"n":29,"stem":["あなたは、Claude Agent SDKを使用して、航空会社のカスタマーサポート解決エージェントを構築しています。このエージェントは、払い戻し、請求に関する異議申し立て、アカウントの問題など、あいまいさの高いリクエストを処理します。カスタムのModel Context Protocol（MCP）ツール（get_customer、lookup_order、process_refund、escalate_to_human）を通じて、バックエンドシステムにアクセスできます。目標は、エスカレーションすべきタイミングを見極めながら、初回解決率80%以上を維持することです。","ある請求トラブルのフローで、Claudeは同じアシスタントターン内でget_customerとlookup_orderをリクエストします。get_customerの呼び出しは成功しますが、lookup_orderは断続的にタイムアウトします。","本番環境のログを見ると、これまでに次の2つの修正が試みられていました。","lookup_orderの結果を、空の注文リストとして成功扱いにする","lookup_orderが失敗するたびに、会話全体を中断する"],"q":"この信頼性の問題に最も適切に対応できる変更はどれですか。（2つ選択してください。）","need":2,"opts":[{"t":"並列呼び出しを無効にし、get_customerの結果を確認してからlookup_orderを順に要求させる。","c":false,"e":["並列ツール呼び出しの無効化（disable_parallel_tool_use）は、呼び出しの順序に依存関係がある場合や、同時に実行すると競合する操作を扱う場合に使う設定です。しかし本問の2つの照会は互いに独立しており、順番に要求させてもタイムアウトという失敗そのものは起き続けるうえ、ターンが増えて応答も遅くなります。"]},{"t":"タイムアウトしたlookup_orderをツールラッパー内でリトライしてから、そのツール結果を返す。","c":true,"e":["正解。断続的なタイムアウトのような一時的なエラーは、ツールラッパーの中で短いリトライを行えば多くの場合吸収でき、Claudeには本来の注文情報をそのまま返せます。リトライしても失敗した場合はis_error付きで伝える方針と組み合わせれば、会話を止めずに信頼性を高められます。"]},{"t":"成功したget_customerと、is_error: trueを付けたlookup_orderの結果を両方返し、会話を続ける。","c":true,"e":["正解。同じターンで複数のツール呼び出しを要求された場合は、各tool_useに対応するtool_resultをすべて返す必要があります。","成功したget_customerの結果はそのまま返し、タイムアウトしたlookup_orderにはis_errorをtrueにして失敗の内容を付けて返せば、Claudeは顧客情報という部分的なコンテキストを活かしつつ、注文情報が取れなかったことを正しく認識して、リトライや顧客への説明、エスカレーションを判断できます。"]},{"t":"lookup_orderがタイムアウトしたら、PreToolUseフックで以後のlookup_orderの呼び出しを止める。","c":false,"e":["PreToolUseフックは、条件に合うツール呼び出しを実行前に確実に止めたいときに使う仕組みです。しかし断続的なタイムアウトは一時的なエラーで、以後のlookup_orderを止めてしまうと、リトライすれば取れたはずの注文情報まで得られなくなり、解決できる問い合わせを自ら減らします。"]}],"overall":["並列に要求されたツール呼び出しの一部だけが失敗したときは、成功した結果を活かしつつ、失敗を失敗として正確に伝えることが信頼性の鍵です。公式ドキュメントは、ツールの実行でエラーが起きた場合はtool_resultのis_errorをtrueにし、エラー内容を入れて返すよう説明しており、Claudeはそれを踏まえてリトライや説明、エスカレーションを選べます。","本問の正解は、成功した結果とis_error付きの失敗結果を両方返して会話を続けることと、一時的なタイムアウトをラッパー内のリトライで吸収することの2つです。","ログにある過去の2つの修正（空の注文リストで成功扱いにする、失敗のたびに会話を中断する）は、それぞれ失敗を偽の事実に変える、成功した結果まで捨てる、という点で誤りでした。PreToolUseフックでの遮断は一時的なエラーを恒久的な停止に変え、並列呼び出しの無効化は失敗の扱いそのものを変えません。"],"ref":"https://platform.claude.com/docs/en/agents-and-tools/tool-use/handle-tool-calls"},{"n":30,"stem":["写真共有アプリを開発するスタートアップでは、コード生成、リファクタリング、デバッグ、ドキュメント作成にClaude Codeを使っています。カスタムスラッシュコマンドやCLAUDE.mdの設定を用いて開発ワークフローに統合し、プランモードと直接実行を使い分けています。","このチームの/reviewコマンドは、正確性・セキュリティ・パフォーマンス・スタイルの4カテゴリで、PRにフィードバックを投稿します。評価データを見ると、次のような傾向があります。","セキュリティに関する指摘は、概ね受け入れられている","スタイルに関するコメントは、「個人の好みの些細な指摘」として却下されることが多い","その結果、開発者はセキュリティの指摘も含めて、レビュー結果全体を無視するようになってしまいました。"],"q":"最初に行うべき変更はどれですか。","need":1,"opts":[{"t":"カテゴリ別に適合率と再現率を測り、実例をもとにノイズの多いスタイル基準を絞るか無効にする。","c":true,"e":["正解。カテゴリごとに適合率（出した指摘のうち正しかった割合）と再現率（見つけるべき問題のうち拾えた割合）を測ると、問題がスタイルに集中していることが数字で示せます。そのうえで、フラグを付けるべき例と付けるべきでない例を使ってスタイル基準を具体化するか、いったん無効にすれば、機能しているセキュリティの指摘を損なわずにノイズ源だけを直せます。"]},{"t":"全体の受け入れ率だけを追跡し、その集計値が目標を下回ったときにプロンプト全体を見直す。","c":false,"e":["全体の受け入れ率は、レビュー機能全体の健全性を追う指標としては便利です。しかしセキュリティは受け入れられ、スタイルだけが却下されているという本問の偏りが平均の中に埋もれてしまい、どのカテゴリを直すべきかが分からないまま全体を手探りで修正することになります。"]},{"t":"全カテゴリの報告しきい値を一律に引き上げ、どのカテゴリでもClaudeにより保守的に指摘させる。","c":false,"e":["しきい値を一律に上げる方法は、全カテゴリで誤検知が同程度に多いときの応急処置にはなります。本問ではセキュリティの指摘はすでに受け入れられており、一律に絞ると有用な指摘まで減る一方で、スタイル基準のあいまいさという原因は残ります。"]},{"t":"セキュリティの指摘をレポートの先頭に移し、開発者の必読項目として目立たせる。","c":false,"e":["表示順の工夫は、重要な指摘を読み飛ばされにくくする補助策として意味があります。しかし却下されているスタイル指摘の量は変わらないため、レポート全体への信頼が下がった根本原因には手が付かず、開発者が無視を続ける状況は変わりません。"]}],"overall":["複数カテゴリにまたがる自動レビューの品質は、カテゴリ別に測って初めて改善の手がかりが得られます。公式の評価設計ガイドも、タスクに即した具体的で測定可能な成功基準を定め、エッジケースを含むテストで確かめることを勧めています。","本問ではセキュリティが受け入れられ、スタイルが却下されるという偏りがあるため、カテゴリ別の適合率・再現率で原因を特定し、実例を使ってスタイル基準だけを絞るか無効化するのが最初の一手です。","全体の受け入れ率は偏りを平均で隠し、一律のしきい値引き上げは良好なカテゴリまで巻き込み、表示順の変更はノイズの量を変えません。","平均値が良好に見えても内訳まで下りると原因が見える、という性質は評価設計全般に通じます。"],"ref":"https://platform.claude.com/docs/en/test-and-evaluate/develop-tests"},{"n":31,"stem":["ある投資ファームでは、Claude Agent SDKを使用して、M&Aデューデリジェンスのリサーチシステムを構築しています。コーディネーターエージェントが、専門サブエージェントに作業を委任します。サブエージェントには、公開資料を検索するもの、契約書を分析するもの、リスクに関する知見を統合するもの、デューデリジェンス報告書を生成するものがあります。このシステムはトピックを調査し、出典を明記した包括的な報告書を作成します。","最近の評価で、次の問題が分かりました。","最終報告書で、同じ出典が、ある主張を裏付けるものとしても矛盾するものとしても扱われることがある","長い出典の束の中にある根拠のない主張を、レビュアーが見落とすことがある","チームは、報告書が生成される前に記録・採点できるレビューのチェックポイントも欲しいと考えています。"],"q":"このチームが行うべきことはどれですか。","need":1,"opts":[{"t":"引用された主張ごとに確信度スコアを付け、スコアの低い主張を別のレビュアーに回す。","c":false,"e":["確信度スコアでレビュー対象を絞るのは、レビュー工数が限られる場面では合理的な優先付けです。しかしスコアを付けるモデルが長い出典の束の中で根拠を見落としていれば、根拠のない主張にも高いスコアが付いて素通りし、同じ出典を賛否両方に使う矛盾も検出されません。"]},{"t":"出典の束全体を1人のレビュアーに送り、報告書生成の前により長いチェックリストを課す。","c":false,"e":["チェックリストを長くすると確認観点は増えますが、長い出典の束を1回で読ませるという構造は変わりません。見落としの原因である入力の長さと焦点の分散はそのままで、報告書生成前に記録・採点できる明示的なチェックポイントも生まれません。"]},{"t":"同一のレビュアーを複数起動して出典の束全体を読ませ、最も多く一致した結果を採用する。","c":false,"e":["同じタスクを複数回実行して多数決をとるvotingは、判断のばらつきを抑えて確信度を上げたい場面で有効です。しかし全員が同じ長い束を同じ方法で読むため、見落としやすい箇所は全員が見落としやすく、構造的な問題は多数決では解消しません。各パスを記録・採点できるチェックポイントにもなりません。"]},{"t":"出典ごとのレビューパスをプロンプトチェーンで実行し、その後に別の統合パスを実行する。","c":true,"e":["正解。出典ごとにレビューするパスをプロンプトチェーンとして順に実行すれば、各パスは1つの出典に焦点を絞れるため根拠のない主張を見落としにくく、各パスの出力がそのまま記録・採点できるチェックポイントになります。その後に別の統合パスで、出典間の矛盾や同じ出典の扱いの食い違いをまとめて確認できます。"]}],"overall":["長い入力を1回のパスで処理させると、途中の情報の見落としや扱いの不整合が起きやすくなります。Anthropicのエージェント設計ガイドは、タスクを固定の段階に分けて各段の出力を次の段に渡すprompt chainingを紹介し、各ステップを簡単にすることで精度が上がり、途中にプログラムによるチェック（ゲート）を挟めると説明しています。","本問は見落としと矛盾に加えて「報告書生成前に記録・採点できるチェックポイント」も求めているので、出典単位のレビューパスをチェーンで実行し、最後に統合パスを置く設計が正解です。","確信度スコア、同一レビュアーの多数決、長いチェックリストは、いずれも長い束を一度に処理する構造を変えていません。","要件に「記録・採点できる中間成果」が含まれていたら、段階ごとの出力が残る構成を選ぶのが自然です。"],"ref":"https://www.anthropic.com/engineering/building-effective-agents"},{"n":32,"stem":["旅行予約プラットフォームを運営する企業は、Claude Codeをコードレビュー自動化パイプラインに統合しています。このシステムは、プルリクエストごとに自動レビューを実行し、テストケースを生成し、具体的で実行可能なフィードバックを返します。誤検知を最小限に抑えるプロンプトを設計する必要があります。","コンプライアンスレビューの結果、必須のテスト結果アーティファクトが添付される前に、システムが承認レビューを投稿してしまうプルリクエストがまれにあることが分かりました。","このルールに例外は認められません。承認の操作は、アーティファクトがすでに存在し、かつ合格している場合にだけ実行する必要があります。"],"q":"このチームが行うべき変更はどれですか。（2つ選択してください。）","need":2,"opts":[{"t":"Claude Codeのステップの前にCIゲートを置き、合格済みアーティファクトが無ければジョブを失敗させる。","c":true,"e":["正解。CIパイプラインのゲートはClaudeの判断とは無関係に、ジョブの制御フローとして評価されます。合格済みアーティファクトがなければClaude Codeのステップ自体が始まらず、承認も投稿されないため、例外を認めない前提条件をモデルの外側で確定的に検査できます。"]},{"t":"承認コマンドの完了後に発火するPostToolUseフックで、アーティファクトの有無を確認する。","c":false,"e":["PostToolUseフックはツールが成功した後に発火し、結果の検査や記録、Claudeへの補足情報の提示に使います。フックが動く時点で承認レビューはすでに投稿されているため、不備を事後に検出できても「アーティファクトがなければ承認を実行しない」という規則は守れません。"]},{"t":"承認前にアーティファクトを確認するよう、システムプロンプトの指示を強い表現に書き換える。","c":false,"e":["システムプロンプトの強化は、振る舞いの傾向を変えたいときの第一歩としては有効です。しかしプロンプトはClaudeが文脈として解釈する指示で、実行を機械的に止める仕組みではないため、まれなPRで起きている違反をゼロにする保証にはなりません。"]},{"t":"合格済みアーティファクトが無いときに承認コマンドを拒否するPreToolUseフックを追加する。","c":true,"e":["正解。PreToolUseフックはツールの実行前に発火し、permissionDecisionを\"deny\"にして返せばその呼び出しを確実に止められます。承認コマンドに一致させてアーティファクトの存在と合否を検査すれば、Claudeがどう判断しても条件を満たさない承認は実行されません。"]}],"overall":["「絶対に守らせたい規則」をどこで強制するかは、Claude Codeの設計で繰り返し問われる論点です。公式ドキュメントも、CLAUDE.mdなどの指示はClaudeが文脈として扱うもので強制力のある設定ではないとし、Claudeの判断にかかわらず操作を止めたい場合はPreToolUseフックを使うよう案内しています。","本問の正解は、ツール実行の直前に止めるPreToolUseフックと、Claude Codeの実行前に止めるCIゲートの2つで、どちらも条件を決定的に評価します。","PostToolUseフックは同じフックでも実行後に動くため防止には使えず、プロンプトの強化は確率的な対策にとどまります。","問題文に「例外は認められません」「〜の場合にだけ実行」とあれば、実行前に機械的に判定できる仕組みを探すと正解にたどり着きます。"],"ref":"https://code.claude.com/docs/en/hooks"},{"n":33,"stem":["あなたは、Claude Agent SDKを使用して、マルチエージェントの市場インテリジェンスシステムを構築しています。コーディネーターエージェントが、専門サブエージェントに作業を委任します。サブエージェントには、競合他社の価格情報を収集するもの、レビューを分析するもの、知見を統合するもの、提言レポートを生成するものがあります。このシステムはトピックを調査し、出典を明記した包括的なレポートを作成します。","長時間の調査を実行していると、後段の統合ターンが、Web検索や文書分析のサブエージェントが以前に返した知見を無視してしまうことがあります。ログを確認すると、後段のMessages API呼び出しには、現在のコーディネーターの指示と最新のサブエージェントの出力しか含まれていません。"],"q":"この一貫性の問題に最も効果的に対処できる変更はどれですか。（2つ選択してください。）","need":2,"opts":[{"t":"自動プロンプトキャッシュを有効にし、以前のサブエージェントの知見が、後続のリクエストに含めなくても記憶されるようにする。","c":false,"e":["自動プロンプトキャッシュは、リクエストの先頭部分（プレフィックス）が前回と完全に一致する場合に、その処理結果を再利用してコストとレイテンシを下げる機能です。キャッシュされるのはあくまで送信した内容の処理結果であり、リクエストに含めなかった以前の知見をモデルに覚えさせる仕組みではありません。"]},{"t":"コーディネーターのセッション識別子を保存し、フォローアップリクエストごとに最新のサブエージェント結果だけを送信する。","c":false,"e":["セッション識別子で会話を追跡する仕組みは、Agent SDKのセッションのように履歴を保存・再開してくれる層がある場合には有効です。しかしMessages API自体はステートレスで、識別子を保存しても以前の出力は保持されないため、最新の結果だけを送れば今と同じ欠落が起きます。"]},{"t":"関連するmessages配列（過去のアシスタント出力・ツール結果・現在のユーザーターン）を保持して再送する。","c":true,"e":["正解。Messages APIはリクエストごとに独立しており、モデルが参照できるのは送信したmessages配列の内容だけです。以前のアシスタント出力やツール結果を含む関連するmessages配列を保持して再送すれば、統合ターンでもサブエージェントがこれまでに返した知見が確実に見えます。"]},{"t":"これまでのサブエージェントの知見を継続的に更新される要約として保持し、後続のリクエストごとにその最新版を含める。","c":true,"e":["正解。これまでのサブエージェントの知見を要約として保持し、更新しながら後続のリクエストごとに最新版を含めれば、履歴全体を毎回送らなくても統合ターンが以前の知見を参照できます。長時間の実行でコンテキストが膨らみすぎるのを抑えつつ、一貫性を保てる方法です。"]}],"overall":["Messages APIはステートレスで、各リクエストに含めた内容だけがモデルから見えます。長時間の処理で後段が以前の知見を無視するのは、ログのとおりその知見がリクエストに含まれていないからです。","対策は、関連するmessages配列（以前のアシスタント出力やツール結果を含む）を保持して再送するか、知見を更新し続ける要約として持ち回り、毎回のリクエストに含めるかのいずれかで、本問ではこの2つが正解です。","プロンプトキャッシュは送信済みのプレフィックスの処理を再利用する最適化で、送っていない内容を補いません。セッション識別子を保存して最新の結果だけを送る方法は、現在の失敗をそのまま再現します。"],"ref":"https://platform.claude.com/docs/en/build-with-claude/working-with-messages"},{"n":34,"stem":["あなたは、Claude Agent SDKを使用して保険金請求のトリアージエージェントを構築しています。このエージェントは、返金請求、保険料の相違、契約者情報の問題など、あいまいさの高い依頼を処理します。カスタムのModel Context Protocol（MCP）ツール（get_member、lookup_claim、process_adjustment、escalate_to_human）を通じて、バックエンドシステムにアクセスできます。目標は、エスカレーションすべきタイミングを見極めながら、初回解決率80%以上を達成することです。","このチームは夜間のバックログ処理で、数千件の未解決の会話をMessage Batches APIで一括投入する計画を立てています。バッチの入力には、会員・請求システム向けのMCPバックエンドのクライアントツール定義が含まれます。これらのバックエンドは、チーム自身のサービスが実装しています。"],"q":"最も適切な設計はどれですか。（2つ選択してください。）","need":2,"opts":[{"t":"各バッチ項目にcustom_idを設定し、返されたツールリクエストを正しい会話に突き合わせられるようにする。","c":true,"e":["正解。バッチの結果は投入した順序で返るとは限らないため、公式ドキュメントは各リクエストのcustom_idで結果と要求を突き合わせるよう求めています。数千件の案件を扱う本問では、custom_idに会話や案件の識別子を入れておくことで、返されたツール要求を正しい会話に戻して処理を継続できます。"]},{"t":"返金処理がフォローアップリクエストなしで完了できるよう、すべてのカスタマーサポートツールをサーバーツールとしてバッチリクエストに組み込む。","c":false,"e":["サーバーツールはAnthropic側で実行されるツールで、バッチの中でも動作します。しかしツール定義の種類を書き換えるだけで独自のクライアントツールがサーバー側で実行されるわけではなく、会員・請求システムを操作するツールは引き続き自分たちで実行し、その結果を後続のリクエストで返す必要があります。"]},{"t":"初期分析またはツールリクエストにはバッチを使用し、返されたクライアントツールを実行してから、各案件を後続のMessagesリクエストで継続する。","c":true,"e":["正解。Message Batches APIのリクエストにはクライアントツールの定義を含められますが、Claudeが返すのはツール呼び出しの要求（stop_reasonがtool_use）までで、ツールを実行するのは自分たちの役目です。","バッチで初期分析やツール要求の生成までを安価にまとめて処理し、返されたツールを自社のバックエンドで実行したうえで、各案件を後続のMessagesリクエストで継続するのが正しい分担です。"]},{"t":"各バッチ項目にクライアントツールのスキーマを含め、バッチワーカーに、レスポンスを確定する前にバックエンドツールを実行させる。","c":false,"e":["バッチワーカーは、ウェブ検索やコード実行、MCPコネクタのようなサーバーツールであれば同期APIと同じサーバー側のループで実行します。しかしチームのサービスが実装するクライアントツールはAnthropic側から実行できないため、スキーマを含めてもバッチの中でバックエンド操作が完了することはありません。"]}],"overall":["Message Batches APIは、急ぎでない大量のリクエストを低コストで非同期に処理する仕組みで、ツール使用にも対応しています。ただしバッチの中で実行まで完結するのはサーバーツールだけで、自分たちが実装したクライアントツールは、Claudeが返したツール呼び出しの要求を受けて自分で実行し、その結果を次のリクエストで返す必要があります。また結果の順序は保証されないため、各リクエストのcustom_idで突き合わせることが前提になります。","本問の正解は、バッチで初期分析とツール要求までを行い後続のリクエストで継続する設計と、custom_idによる対応付けの2つです。","バッチワーカーにクライアントツールを実行させる案や、独自ツールをサーバーツール扱いにする案は、この実行の分担を取り違えています。サーバーツールとクライアントツールの実行主体の違いは、同期のAPIでもバッチでも変わりません。"],"ref":"https://platform.claude.com/docs/en/build-with-claude/batch-processing"},{"n":35,"stem":["あるゲームスタジオのライブ運用チームは、Claude Codeを継続的インテグレーション／継続的デプロイ（CI/CD）パイプラインに統合しています。このシステムは、自動コードレビューを実行し、テストケースを生成し、プルリクエストにフィードバックを返します。具体的で実行可能なフィードバックを返し、誤検知を最小限に抑えるプロンプトを設計する必要があります。","リポジトリのメインの指示ファイルは400行を超え、次の内容が混在するようになっています。","レビューのトーン","テスト規約","API設計ルール","デプロイ時のチェックリスト","CIの実行結果を見ると、Claude Codeが日常的な単体テストのレビューにまでデプロイ時のガイダンスを適用し、開発者が重視するテスト固有の基準を見落とすことがあると分かりました。"],"q":"共有のレビュー基準は引き続き利用できるようにしたまま、無関係なコンテキストを減らすために、このチームが行うべき変更はどれですか。（2つ選択してください。）","need":2,"opts":[{"t":"ルートの指示ファイルを、すべての変更に共通するレビュー基準だけに絞り込む。","c":true,"e":["正解。ルートの指示ファイルは毎回読み込まれるため、ここにはどの変更にも当てはまる共有のレビュー基準だけを残すのが適切です。400行に膨らんだ混在状態を解消して常時読み込む内容を小さく保てば、共有基準は利用可能なまま、テスト固有の基準が埋もれることも防げます。"]},{"t":"各パッケージディレクトリにCLAUDE.mdを作り、関連するテスト・API・デプロイのガイダンスを複製する。","c":false,"e":["パッケージごとのCLAUDE.mdは、そのパッケージ固有の事情を書く場所としては有効です。しかし同じガイダンスを全パッケージに複製すると更新漏れによる不整合を招き、ディレクトリ単位の読み込みはファイルの種類を区別しないため、テストのレビューにデプロイのガイダンスが混ざる問題も残ります。"]},{"t":"トピック別のガイダンスをpathsなしで.claude/rules/へ移し、ディレクトリ単位の読み込みに任せる。","c":false,"e":[".claude/rules/への分割自体はファイルを整理する良い手段ですが、pathsを持たないルールは起動時に無条件で読み込まれます。ディレクトリに置くだけで遅延読み込みされるわけではないので、すべてのガイダンスが従来どおりコンテキストに入り、無関係な基準の混入は減りません。"]},{"t":"トピック別のガイダンスを.claude/rules/のファイルへ移し、特定ファイル向けのものにはpathsを付ける。","c":true,"e":["正解。トピックごとのガイダンスを.claude/rules/の個別ファイルに分け、特定のファイルにだけ関係するもの（デプロイ時のチェックリストなど）にpathsフロントマターを付ければ、Claudeが一致するファイルを読んだときだけ読み込まれます。単体テストのレビューにデプロイのガイダンスが混ざる原因を、読み込み条件の側で断てます。"]}],"overall":["1つの指示ファイルにあらゆるトピックを詰め込むと、常時読み込まれる内容が肥大化し、場面に合わないガイダンスが適用されたり重要な基準が埋もれたりします。公式ドキュメントは、大きなプロジェクトでは指示を.claude/rules/のトピック別ファイルに分け、特定のファイルにだけ関係するルールはpathsで範囲を限定するよう勧めています。pathsを持たないルールは起動時に読み込まれ、pathsを持つルールは一致するファイルを読んだときにだけ読み込まれます。","本問では、トピック別ルールへの切り出しとpathsの付与、そしてルートを共有基準だけに絞ることの2つがそろって初めて、共有基準を保ったまま無関係なコンテキストを減らせます。","pathsなしの移動は読み込み量を変えず、パッケージ単位の複製は保守性を下げます。"],"ref":"https://code.claude.com/docs/en/memory"},{"n":36,"stem":["あなたは、Claude Agent SDKを使用して保険金請求対応エージェントを構築しています。このエージェントは、支払い調整、補償範囲の照会、払戻し可否など、あいまいさの高い問い合わせを処理します。カスタムのMCPツール（get_policyholder、lookup_claim、issue_payout、escalate_to_adjuster）を通じて、バックエンドシステムにアクセスできます。目標は、エスカレーションすべきタイミングを見極めながら、初回解決率80%以上を維持することです。","チームは、長時間かかる案件を処理できるよう、エージェントをコーディネーター型にリファクタリングしています。コーディネーターは、支払い調整と補償範囲の調査ステップをサブエージェントに委任できます。","テスト中に、係争案件の途中でコンテナがクラッシュしました。その後を引き継いだワーカーは、次の情報を失っていました。","確認済みの契約者ID","それまでの請求内容の調査結果","「この案件はエスカレーションが必要」という判断","ワーカー間でファイルシステムは共有されておらず、ローカルのセッションJSONLファイルも、再起動後に確実に残っているとは限りません。"],"q":"クラッシュから安全に復旧するために、最も効果的な変更はどれですか。","need":1,"opts":[{"t":"システムプロンプトに状態を覚えておくよう強い指示を加え、直近の顧客メッセージから再開する。","c":false,"e":["システムプロンプトでの指示は、モデルに何を重視させるかを伝える手段で、会話中の情報の扱い方を変えることはできます。しかしクラッシュで失われたのはプロセスとともに消えた会話そのもので、指示を強めても新しいワーカーには以前の契約者IDや調査結果が存在せず、覚えておく対象がありません。"]},{"t":"確認済みの事実と判断をJSONの状態マニフェストに永続化し、再起動時にプロンプトへ注入する。","c":true,"e":["正解。確認済みの契約者ID、調査結果、エスカレーションが必要という判断のように、失ってはいけない状態をアプリケーション側で定義したJSONに書き出して永続化すれば、セッションファイルの有無に依存せずに復旧できます。再起動時にそれを読み込んでコーディネーターとサブエージェントのプロンプトへ注入すれば、どのワーカーが引き継いでも同じ前提から処理を再開できます。"]},{"t":"ローカルのJSONLトランスクリプトを可能なときにコピーし、引き継いだワーカーで最新に見えるセッションを再開する。","c":false,"e":["トランスクリプトを別の場所へ複製する考え方自体は、SessionStoreアダプターのように共有ストレージへ確実にミラーする仕組みであれば、ホストをまたいだ再開の手段になります。しかし「可能なときに」コピーする方式では最新の状態が残る保証がなく、最も新しく見えるセッションが正しい案件とも限らないため、安全な復旧の基盤になりません。"]},{"t":"Agent SDKのセッションをcontinueで再開し、最新のローカルなトランスクリプトから状態を組み立て直す。","c":false,"e":["continueは、カレントディレクトリにある最新のセッションを再開する機能で、同じ環境にセッションファイルが残っている場合には手軽な復旧手段です。本問ではワーカー間でファイルシステムが共有されず、ローカルのJSONLも残る保証がないため、引き継いだワーカーでは再開すべきセッションが見つからない可能性があります。"]}],"overall":["エージェントのクラッシュ復旧では、「何を」「どこに」残すかを自分で決めることが信頼性の土台になります。Agent SDKのセッションはローカルのJSONLに保存され、ホストをまたいで再開するには共有ストレージへのミラー（SessionStoreアダプター）が必要だと公式ドキュメントは説明しています。","本問はファイルシステムが共有されず、ローカルのJSONLも確実には残らないという制約があるため、ローカルのセッションに頼るcontinueや可能なときだけ行うコピーは前提が崩れています。確認済みの事実と判断をアプリケーション定義の状態マニフェストとして永続化し、再起動時にプロンプトへ注入する方法なら、実行環境に依存せずに必要な状態を復元できます。","システムプロンプトの強化は、失われた情報そのものを取り戻しません。"],"ref":"https://code.claude.com/docs/en/agent-sdk/sessions"},{"n":37,"stem":["あるサイバーセキュリティ企業では、Claude Agent SDKを使用して、脅威インテリジェンスの調査システムを構築しています。コーディネーターエージェントが、専門サブエージェントに作業を委任します。サブエージェントには、OSINT情報源を検索するもの、マルウェア検体を分析するもの、知見を統合するもの、報告書を生成するものがあります。このシステムはトピックを調査し、出典を明記した包括的な報告書を作成します。","ある実行で広範な情報源のレビューが完了し、有用なベースライン分析が得られました。チームは、同じ出発点から2つの異なる対応戦略を比較したいと考えています。それぞれの戦略の探索は、ベースラインのセッション履歴を変更せずに、独自の会話履歴を持つ必要があります。"],"q":"このチームが行うべきことはどれですか。（2つ選択してください。）","need":2,"opts":[{"t":"各戦略についてファイルのチェックポイント機能を有効にし、チェックポイントをセッション履歴の分岐の仕組みとして使う。","c":false,"e":["ファイルのチェックポイントは、WriteやEditによるファイル変更を記録し、後から以前の状態へ巻き戻すための機能です。巻き戻せるのはディスク上のファイルだけで会話履歴は巻き戻らないため、会話の分岐の仕組みとしては使えません。"]},{"t":"各戦略についてSDKのフォークオプションを有効にしてベースラインのセッションを再開し、新しく生成されたセッションIDを追跡する。","c":true,"e":["正解。Agent SDKでベースラインのセッションIDを指定してresumeし、forkオプション（Pythonではfork_session、TypeScriptではforkSession）を有効にすると、元の履歴をコピーした新しいセッションが作られ、元のセッションIDと履歴は変わりません。戦略ごとに新しく発行されたセッションIDを追跡すれば、各探索をそれぞれ独立した会話として再開・比較できます。"]},{"t":"ベースライン分析が完了した時点でそのセッションIDを記録し、各戦略のワーカーに渡す。","c":true,"e":["正解。フォークで分岐させるには、分岐元となるセッションIDを特定できることが前提です。ベースライン分析が完了した時点のセッションIDを記録しておけば、各戦略の探索を確実に同じ出発点から始められ、後から「どの状態から分岐したか」を追跡することもできます。"]},{"t":"各戦略のワーカーでcontinueを使い、SDKにカレントディレクトリ内の最新セッションを選択させる。","c":false,"e":["continueは、カレントディレクトリで最も新しいセッションを自動で見つけて再開する機能で、1つの会話を続けるアプリでは手軽です。しかし複数の戦略ワーカーが動く環境では、どのセッションが最新かは実行順に左右され、意図したベースラインから再開される保証がなく、元の履歴に追記されてしまうおそれもあります。"]}],"overall":["同じ出発点から複数の探索を独立して進めるには、元の会話を変えずに履歴のコピーを作る「フォーク」が適しています。Agent SDKの公式ドキュメントは、continueはカレントディレクトリの最新セッションを再開し、resumeは指定したセッションIDを再開し、forkは元の履歴をコピーした新しいセッションを作って元を変えない、と3つを区別しています。","本問の正解は、ベースライン完了時のセッションIDを記録することと、そのIDをresumeする際にforkオプションを有効にして新しいセッションIDを追跡することの2つで、IDの記録がなければフォークの分岐元を指定できません。","continueは分岐元を保証せず、ファイルのチェックポイントは会話ではなくファイルを巻き戻す機能です。"],"ref":"https://code.claude.com/docs/en/agent-sdk/sessions"},{"n":38,"stem":["健康管理アプリを開発するプロダクトチームでは、コード生成、リファクタリング、デバッグ、ドキュメント作成にClaude Codeを使っています。カスタムスラッシュコマンドやCLAUDE.mdの設定を用いて開発ワークフローに統合し、プランモードと直接実行を使い分けています。","このチームは、コードレビュー用とドキュメント作成用に、SDKで管理するサブエージェントを追加しようとしています。要件は次の2つです。","Claudeが用途に応じて、適切なサブエージェントに作業を振り分けられる","ドキュメント作成用のサブエージェントには、ファイルの読み取りは許可するが、ファイルの編集やコマンドの実行はさせない"],"q":"採用すべき構成はどれですか。","need":1,"opts":[{"t":"agentsマップに各サブエージェントのdescriptionとpromptを定義し、ドキュメント用のtoolsは読み取り系に限る。","c":true,"e":["正解。Agent SDKではquery()のagentsパラメータに、サブエージェントの種類をキーとしてAgentDefinitionを並べ、description（いつ使うかの判断材料）とprompt（役割の指示）を設定します。","toolsにはそのサブエージェントが使えるツールだけを列挙できるので、ドキュメント用にRead・Grep・Globのような読み取り系だけを与えれば、他のサブエージェントの権限に影響を与えずに編集とコマンド実行を封じられます。"]},{"t":"agentsマップを表示名で定義し、用途はprompt内に書き、トップレベルのdisallowedToolsで編集系ツールを止める。","c":false,"e":["disallowedToolsは指定したツールをClaudeから見えなくする確実な手段で、セッション全体で使わせたくないツールがある場合に向きます。トップレベルで指定すると全体に効くため、編集が必要なコードレビュー用サブエージェントまで制限されます。また用途をpromptに書くだけでは、委任先の選択に使われるdescriptionの役割を果たせません。"]},{"t":"トップレベルのallowedToolsに読み取り系ツールを並べ、ルーティングの方針はCLAUDE.mdに書き、サブエージェント個別のツール設定は省く。","c":false,"e":["トップレベルのallowedToolsは、列挙したツールを承認なしで実行させる設定で、ツールを制限するものではありません。列挙しなかったEditやBashも引き続き使える状態のままで、サブエージェント単位の制御にもならないため、ドキュメント用だけを読み取り専用にす
