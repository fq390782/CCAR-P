る要件を満たせません。CLAUDE.mdのルーティング方針もdescriptionの代わりにはなりません。"]},{"t":"サブエージェントをファイル名で区別し、ルーティングの手がかりは名前に任せ、ツール制限は親の権限設定に委ねる。","c":false,"e":["名前でサブエージェントを識別すること自体は必要ですが、Claudeが委任先を選ぶときの判断材料は各サブエージェントのdescriptionで、ファイル名はその代わりになりません。また親の権限設定に任せると全サブエージェントが同じ権限で動くため、ドキュメント用だけを読み取り専用にするという要件を満たせません。"]}],"overall":["Agent SDKでサブエージェントを定義する方法の1つが、query()のagentsパラメータにプログラムでAgentDefinitionを渡す方法です。各定義のdescriptionはClaudeが「どのサブエージェントに任せるか」を判断する材料になり、promptは役割を、toolsは使えるツールの範囲を決めます。","本問の2つの要件（用途に応じた振り分けと、ドキュメント用だけの読み取り専用化）は、descriptionとサブエージェント単位のtools指定で満たせます。","トップレベルのallowedToolsは「承認なしで実行してよいツール」の一覧で制限にはならず、トップレベルのdisallowedToolsはセッション全体に効くためサブエージェント間で権限を分けられません。","権限まわりの選択肢は、その設定が「承認を省く」ものか「ツールを取り除く」ものか、そしてどの範囲に効くのかを確かめると正誤がはっきりします。"],"ref":"https://code.claude.com/docs/en/agent-sdk/subagents"},{"n":39,"stem":["あなたは、Claude Agent SDKを使用して保険金請求対応エージェントを構築しています。このエージェントは、支払い調整、補償範囲の照会、払戻し可否など、あいまいさの高い問い合わせを処理します。カスタムのMCPツール（get_policyholder、lookup_claim、issue_payout、escalate_to_adjuster）を通じて、バックエンドシステムにアクセスできます。目標は、エスカレーションすべきタイミングを見極めながら、初回解決率80%以上を維持することです。","インシデントの振り返りで、このチームは、大規模なリポジトリの中で払戻しエスカレーションの判断がどこで行われているかを、Claude Codeに把握させる必要があります。このセッションでは、組み込みのRead・Grep・Globが有効になっています。","過去の調査では、関連するフローを特定する前にサービス用ディレクトリ全体をコンテキストに読み込んでしまい、セッションがノイズだらけで遅くなっていました。"],"q":"このチームがまず取るべきアプローチはどれですか。（2つ選択してください。）","need":2,"opts":[{"t":"まずGlobで対象となるサービス用ディレクトリの候補を絞り込み、そのパスの範囲だけでGrepを実行する。","c":true,"e":["正解。Globはファイル名やパスのパターン（services/**/payout*など）で候補を探すツールで、中身を読まずに探索範囲を絞れます。候補のサービスディレクトリに絞ってからGrepで内容を検索すれば、走査するファイルと結果の量が減り、関係のないコードがコンテキストに入るのを防げます。"]},{"t":"サービス用ディレクトリのREADMEと設定ファイルを先に一通りReadし、設計文書の記述から払戻し判断の箇所を推定する。","c":false,"e":["READMEや設定ファイル、設計文書を先に読むのは、コードベースの全体像をつかむ入口としては有効です。しかし文書が実装と一致しているとは限らず、払戻しエスカレーションの判断が実際にどのコードで行われているかは推定にとどまるため、インシデントの振り返りに必要な正確な特定にはなりません。"]},{"t":"払戻しとエスカレーションの識別子に対してGrepを使い、一致したファイルだけをReadで読み込み、そのエントリポイントからimportをたどる。","c":true,"e":["正解。Grepはファイルの中身をパターンで検索するツールで、払戻しやエスカレーションに関わる関数名や識別子から該当箇所を直接見つけられます。一致したファイルだけをReadで読み、そこからimportをたどれば、判断ロジックがどこにあるかを最小限の読み込みで特定できます。"]},{"t":"払戻しとエスカレーションの識別子に対してGlobを使い、返されたパスの一致結果から制御フローを推測する。","c":false,"e":["Globはパスのパターンに一致するファイルを返すだけで、ファイルの中身は検索しません。識別子の名前がファイル名に含まれているとは限らず、返ってきたパスの一覧から制御フローを推測しても、実際にどこで判断しているかは確かめられません。"]}],"overall":["大きなリポジトリで特定の処理を探すときの基本は、「パスで絞る」「中身で探す」「必要なものだけ読む」の順に範囲を狭めていくことです。Claude CodeのGlobはファイル名のパターン検索、Grepはファイル内容の検索、Readは個々のファイルの読み込みを担い、この順で使えばコンテキストに入る情報を最小限にできます（macOSやLinuxでは、同等の検索がBash経由のfindとgrepで行われる構成もあります）。","本問の正解は、識別子をGrepで探して一致したファイルだけを読みimportをたどる方法と、Globで候補ディレクトリに絞ってからGrepする方法の2つです。","文書からの推定は実装を確かめておらず、Globでの識別子検索は中身を見ていません。"],"ref":"https://code.claude.com/docs/en/tools-reference"},{"n":40,"stem":["物流プラットフォームを開発する社内チームでは、コード生成、リファクタリング、デバッグ、ドキュメント作成にClaude Codeを使っています。カスタムスラッシュコマンドやCLAUDE.mdの設定を用いて開発ワークフローに統合し、プランモードと直接実行を使い分けています。","このチームのモノレポでは、単体テストとコンポーネントテストが、services/・packages/・apps/の各配下で、対象のソースファイルのすぐ近くに置かれています。","ところが、同じようなテスト規約の指示が複数のディレクトリ階層のメモリファイルにコピーされており、一部のディレクトリには更新が反映されていません。そのため、Claude Codeが適用するテストの指示に一貫性がありません。"],"q":"テスト規約の保守を容易にしつつ、テストに関係のない作業では不要なコンテキストを避けるために、変更すべきことはどれですか。（2つ選択してください。）","need":2,"opts":[{"t":"テスト規約をルートのCLAUDE.mdに移す。","c":false,"e":["ルートのCLAUDE.mdは起動時に毎回読み込まれるため、プロジェクト全体で常に守らせたい規約を置く場所です。テスト規約をここへ移せば1か所にまとまり一貫性は保てますが、テストに関係しない作業の会話にも毎回読み込まれ、「不要なコンテキストを避ける」という条件に反します。"]},{"t":"テスト規約を.claude/commands/配下のプロジェクトスラッシュコマンドにまとめ、開発者にテスト編集前に実行してもらう。","c":false,"e":[".claude/commands/のスラッシュコマンドは、定型の手順を開発者が「/名前」で呼び出して実行したい場面に向く仕組みです（現在はスキルと同じ扱い）。開発者にテスト編集前の実行を頼む運用では、規約が効くかどうかが人の実行忘れに左右されるため、Claude Codeが適用するテストの指示に一貫性が無いという問題は解消しません。"]},{"t":"pathsのglobパターンでテストファイルを指定した.claude/rules/testing.mdを作成し、共有のテスト規約をそこに一元化する。","c":true,"e":["正解。.claude/rules/配下のルールファイルは、YAMLフロントマターのpathsにglobパターンを書くと、Claudeがそのパターンに一致するファイルを読んだときだけ読み込まれます。テストファイルのパターンを指定すれば、services/・packages/・apps/のどこにあるテストにも同じ規約が適用され、テスト以外の作業ではコンテキストに入りません。"]},{"t":"ディレクトリ単位のメモリファイルに複製されたテスト規約を削除し、共有規約の置き場を1か所に統一する。","c":true,"e":["正解。同じ規約が複数のディレクトリ単位のメモリファイルに複製されていると、一部だけが更新された時点で食い違いが生まれます。複製を削除して共有規約の置き場を1か所にまとめれば、以後の更新はその1か所で済み、古い版が別のディレクトリで読み込まれることもなくなります。"]}],"overall":["Claude Codeのメモリには、起動時に常に読み込まれるもの（ルートのCLAUDE.md、pathsを持たないルール）と、条件に応じて読み込まれるもの（サブディレクトリのCLAUDE.md、paths付きのルール）があります。","本問の「保守を容易にする」と「テスト以外の作業では読み込ませない」の2条件を同時に満たすのは、paths付きの.claude/rules/testing.mdに規約を集約し、既存の複製を削除する組み合わせです。","集約だけで複製を残すと古い版が並存し、削除だけでは条件付きで読み込む受け皿がありません。ルートのCLAUDE.mdは一貫性は得られても常時読み込みになり、スラッシュコマンドは開発者の手動実行に依存します。","メモリ配置の設問は、「いつ読み込まれるか」と「情報源がいくつあるか」の2軸で選択肢を並べると整理しやすくなります。"],"ref":"https://code.claude.com/docs/en/memory"},{"n":41,"stem":["地域ニュース配信サービスを運営する企業の開発チームは、Claude Agent SDKを使用してマルチエージェントリサーチシステムを構築しています。コーディネーターエージェントが、専門サブエージェントに作業を委任します。サブエージェントには、ウェブを検索するもの、文書を分析するもの、調査結果を統合するもの、レポートを生成するものがあります。このシステムはトピックを調査し、出典を明記した包括的なレポートを作成します。","このチームは、literature-gap-auditという名前のClaude Codeスキルを作成しました。そのSKILL.mdでは、誰かがコーディネーターを編集する前に、次の作業をするようClaudeに指示しています。","リポジトリ内のプロンプトを検索する","レポートテンプレートを調査する","不足している出典検証の観点をブレインストーミングする","開発者がこのスキルを呼び出すと、大量のファイル検索メモや、検討の末に却下した代替案がメインセッションに残り続けます。その結果、その後のレポート生成の編集作業で焦点がぼやけてしまいます。"],"q":"このスキルの設定で変更すべきことはどれですか。","need":1,"opts":[{"t":"監査のために/forkを呼び出し、現在の会話全体の履歴を引き継がせる。","c":false,"e":["/forkは現在の会話をコピーして別のバックグラウンドセッション（旧バージョンではforkサブエージェント）で作業を進める手動の操作で、横道の作業を切り出したいときに便利です。ただし開発者が毎回手で実行する運用であってスキルの設定変更ではなく、会話履歴を丸ごと引き継ぐため、監査に不要な文脈まで持ち込みます。"]},{"t":"監査の指示をCLAUDE.mdに移し、監査が終わった後に/compactを実行する。","c":false,"e":["CLAUDE.mdは毎回読み込まれる常設の指示の置き場で、監査手順をそこへ移すと、監査をしない会話にまで手順が読み込まれます。/compactは溜まった会話を後から要約してコンテキストを空ける機能で、探索メモがメインセッションに流れ込むこと自体は防げず、要約の過程で必要な情報が落ちる可能性もあります。"]},{"t":"disable-model-invocation: trueを設定し、開発者が「/名前」で明示的に呼び出す形にする。","c":false,"e":["disable-model-invocationをtrueにすると、デプロイのように副作用がある手順をClaudeが自動で呼び出さず、開発者が「/名前」で明示的に実行する形になります。誰がいつ呼び出すかが変わるだけで、スキルは従来どおりメインの会話の中で実行されるため、検索メモや却下案が本流に残る問題は解消しません。"]},{"t":"SKILL.mdにcontext: forkを追加し、監査自体は明示的なタスク指示として維持する。","c":true,"e":["正解。SKILL.mdのフロントマターでcontextをforkにすると、Claude Codeはagentフィールドで指定した種類の新しいサブエージェントを起動し、SKILL.mdの内容をそのプロンプトとして実行させます。","このサブエージェントは会話履歴を持たない独立したコンテキストで動くため、途中のファイル検索や検討の過程はその中にとどまり、メインセッションには最終結果だけが戻ります。監査手順はSKILL.mdに明示的なタスクとして書かれているので、履歴がなくても単独で実行できます。"]}],"overall":["大量の中間作業を伴う手順をスキル化するときは、その作業をどのコンテキストで実行するかを設定で決められます。Claude Codeのスキルは既定ではメインの会話の中で実行されますが、フロントマターでcontextにforkを指定すると、agentで指定した種類の新しいサブエージェントが会話履歴を持たない独立したコンテキストでスキルを実行し、結果だけを返します。名前に反して、これは会話履歴をすべて引き継ぐ「現在の会話のfork」（/forkなどの操作）とは別物です。","本問ではliterature-gap-auditの探索メモがメインセッションを汚しているので、この隔離をスキルの設定として組み込むのが正解です。","disable-model-invocationは誰が呼び出せるかの設定、CLAUDE.mdと/compactは常設化と事後の圧縮、/forkは手動の運用操作で、いずれもスキルの実行場所を変えません。","forkという語が付く機能は複数あり、会話履歴を引き継ぐかどうかで区別して覚えておくと混同しません。"],"ref":"https://code.claude.com/docs/en/skills"},{"n":42,"stem":["あるゲームスタジオの社内ツールチームは、Claude Codeを使って、コード生成、リファクタリング、デバッグ、ドキュメント作成の作業を加速しています。カスタムスラッシュコマンドやCLAUDE.mdの設定を用いて開発ワークフローに統合し、プランモードと直接実行をどのように使い分けるかを理解する必要があります。","カスタムのparallel-reviewコマンドは、v2.1.63より前のClaude Code設定に固定されたリポジトリでSDKの実行を開始し、Taskツールでサブエージェントに作業を委任します。この実行は、複数の専門レビュー用サブエージェントにファンアウトする想定です。","現在のSDKオプションで自動承認されているのはRead・Grep・Globだけで、各実行は、最初にサブエージェントへの委任を試みた時点で、対話的な権限確認プロンプトによって止まってしまいます。"],"q":"このチームが変更すべきことはどれですか。（2つ選択してください。）","need":2,"opts":[{"t":"permissionModeをacceptEditsにして、編集系ツールの確認を省く。","c":false,"e":["acceptEditsは、ファイル編集や一般的なファイル操作コマンドを確認なしで承認する権限モードで、編集内容を後でまとめてレビューする前提で作業を速めたいときに使います。自動承認されるのは編集系の操作に限られ、Taskによる委任の承認には効かないため、最初の委任で確認待ちになる停止は解消しません。"]},{"t":"入れ子の委任のためにワーカー側のサブエージェントのtoolsにAgentを加え、コーディネーターの設定は変えない。","c":false,"e":["ワーカー側のサブエージェントのtoolsにAgentを加えるのは、サブエージェントがさらに自分のサブエージェントを呼ぶ入れ子の委任を許可したい場合の設定です。止まっているのはコーディネーターによる最初の委任なので、ワーカー側の設定を変えてもこの停止は解消しません。"]},{"t":"SDKの実行に権限判定のコールバックを与え、Taskによる委任呼び出しをプログラム的に承認する。","c":true,"e":["正解。Agent SDKでは、自動承認されないツール呼び出しは最終的にcanUseTool（Pythonではcan_use_tool）のコールバックに回され、ここでプログラムから許可・拒否を返せます。Taskによる委任を承認するコールバックを渡せば、対話的な権限プロンプトを出さずに委任が進み、条件付きで許可するといった細かな制御もできます。"]},{"t":"コーディネーターを実行するSDKのallowedTools（またはallowed_tools）リストにTaskを追加する。","c":true,"e":["正解。allowedTools（Pythonではallowed_tools）に列挙したツールは、権限確認なしに自動承認されます。コーディネーターを実行するSDKの設定にTaskを加えれば、最初の委任で確認プロンプトに止まることがなくなり、専門レビュー用サブエージェントへのファンアウトが進みます。なおClaude Code v2.1.63以降では、このツールはAgentという名前で扱われます。"]}],"overall":["Agent SDKの権限評価では、フック、拒否ルール、確認ルール、権限モード、許可ルール（allowedTools）を順に確認し、どれでも決まらなかった呼び出しがcanUseToolコールバックに回ります。コールバックで判断できなければ対話的な確認が必要になり、無人の実行では停止の原因になります。","本問はRead・Grep・Globだけが自動承認されている状態で、最初のTaskによる委任が確認待ちで止まっているので、コーディネーターのallowedToolsにTaskを加えることと、Taskを承認する権限コールバックを渡すことの2つが正解です。","acceptEditsは編集系の承認にしか効かず、ワーカー側へのAgent追加は入れ子の委任のための設定で最初の委任には関係しません。"],"ref":"https://code.claude.com/docs/en/agent-sdk/permissions"},{"n":43,"stem":["フィンテック企業のプラットフォームチームは、Claude Codeを使ってソフトウェア開発を加速しています。ある開発者が、プランモードで長時間調査したあと、変更を加える前にセッションIDを保存しました。","開発者は、この分析済みのコンテキストから、次の2つの異なる試みを検証したいと考えています。","最小限のパッチ案","より大掛かりなリファクタリング案","ただし、どちらの試みも、同じ作業ディレクトリ内の重複するファイルを変更します。"],"q":"会話履歴とファイルの状態を混同せずに、それぞれの試みを独立して検証するのに最も適した方法はどれですか。（2つ選択してください。）","need":2,"opts":[{"t":"同じプロジェクトディレクトリからcontinueを2回実行し、どちらの試みを基準にするかはClaude Codeに自動で選ばせる。","c":false,"e":["continueは、カレントディレクトリで最も新しい会話を開き直して作業を続ける機能です。2回実行しても分岐は作られず、同じ会話に追記されていくだけなので、2つの試みの会話履歴を独立させられず、ファイルの状態も共有されたままです。"]},{"t":"保存したセッションIDをforkせずに2回resumeし、Claudeに各試みを分けて扱うよう依頼する。","c":false,"e":["forkせずに同じセッションIDを2回再開すると、公式ドキュメントが説明するとおり両方のメッセージが1つのトランスクリプトに混ざって記録されます。Claudeに「分けて扱って」と頼んでも履歴は1本のままで、作業ディレクトリのファイルも共有されるため、会話とファイルの両方で試みが混ざります。"]},{"t":"保存したセッションIDを試みごとにforkオプション付きでresumeし、チェックポイントから巻き戻せるようにしておく。","c":true,"e":["正解。保存したセッションIDをforkオプション付きで再開すると（CLIでは--resumeと--fork-sessionの組み合わせ）、元の履歴をコピーした新しいセッションが作られ、元のセッションは変わりません。","ただし分岐するのは会話履歴だけでファイルは共有されるため、Claude Codeが自動で記録するチェックポイントから各試みの変更を巻き戻せるようにしておくことで、ファイルの状態も試みごとに扱えます。"]},{"t":"各試みをリポジトリの別々の作業コピーで実行し、重複するファイルへの編集が互いに混ざらないようにする。","c":true,"e":["正解。重なるファイルを編集する2つの試みを並行して独立させるには、ファイルシステム自体を分けるのが確実です。リポジトリの別の作業コピー（git worktreeなど）で各試みを実行すれば、パッチ案とリファクタリング案の編集が物理的に混ざらず、それぞれを別々にテスト・比較できます。"]}],"overall":["同じ分析結果から複数の方針を試すときは、「会話履歴」と「ファイルの状態」という2つの次元を別々に分離する必要があります。公式ドキュメントも、セッションのfork（--fork-sessionや/branch）は会話のコピーを作って元の会話を残す仕組みだと説明しており、ファイル変更の巻き戻しにはチェックポイントを使うよう案内しています。","本問の正解は、保存したセッションを試みごとにforkして再開しチェックポイントから巻き戻せるようにしておく方法と、試みごとに別の作業コピーを使う方法の2つで、どちらも会話とファイルの両方を手当てしています。","continueは最新の会話を開き直すだけで、forkなしのresumeは1本の履歴を共有してしまいます。","実務でも、比較のための分岐はgit worktreeのような作業コピーと会話の分岐を組み合わせるのが扱いやすい構成です。"],"ref":"https://code.claude.com/docs/en/sessions"},{"n":44,"stem":["研究用機器を製造するバイオテック企業が、開発ワークフローを加速するためにClaude Codeを使っています。チームでは、コード生成、リファクタリング、デバッグ、ドキュメント作成にClaude Codeを使い、カスタムスラッシュコマンドやCLAUDE.mdの設定を用いて開発ワークフローに統合しています。プランモードと直接実行をどのように使い分けるかも理解する必要があります。","このチームは、作業指示書から、機器の校正レポートと安全適合ラベルをClaude Codeに生成させています。公開前にレビュアーが確認できるのは、生成されたフィールドのごく一部だけです。","パイロット運用の結果、フィールドによって精度が大きく異なることが分かっています。","機器モデル名は、概ね正しい","危険物分類は、しばしば誤っている"],"q":"人によるレビューを、最も効果の大きい項目に振り分けるために、最も適切な変更はどれですか。","need":1,"opts":[{"t":"パイロット運用から得た全体の精度を使い、それが目標を上回ったらレビュー量を減らし、残りの出力は一様にサンプリングしてレビューする。","c":false,"e":["全体の精度は、パイプラインが目標水準に達しているかを確かめる指標としては有用です。しかし本問では機器モデル名はほぼ正しく危険物分類はしばしば誤るというようにフィールドごとの精度が大きく異なり、全体の平均と一様なサンプリングでは、誤りやすい危険物分類へレビューを集中させられません。"]},{"t":"構造化出力にフィールドごとの確信度を出させ、ラベル付き事例でしきい値をキャリブレーションし、低確信度のフィールドをレビューへ回す。","c":true,"e":["正解。フィールドごとの確信度を構造化出力に含めさせ、正解ラベル付きの事例でどの値以下なら誤りが多いかを調べてしきい値をキャリブレーションすれば、確信度が実際の精度とどう対応するかを確かめたうえで振り分けられます。確信度の低いフィールドだけをレビュアーに回せば、限られたレビュー能力を危険物分類のような誤りやすい項目に集中できます。"]},{"t":"文書単位で1つの確信度スコアを算出し、しきい値を下回った文書だけをレビューし、承認された文書はすべてのフィールドをそのまま公開する。","c":false,"e":["文書単位の確信度は、文書全体を採否するような粗い判定には使えます。しかし1つの文書の中でもフィールドによって精度が大きく異なるため、文書全体のスコアが高くても危険物分類だけが誤っているケースを見逃し、承認された文書ではそれがそのまま公開されます。"]},{"t":"処理が正常終了したことを高信頼の指標とみなしてそれらの出力のレビューを省略し、途中で打ち切られた応答だけをレビューする。","c":false,"e":["stop_reasonがend_turnで正常終了したことは、応答が最後まで生成されたことを示すだけで、内容が正しいことの証拠ではありません。打ち切られた応答だけをレビューすると、正常に終了したが危険物分類を誤っている大多数のケースが確認されずに公開されます。"]}],"overall":["人によるレビューの容量が限られるときは、誤りが起きやすい箇所を見つけてそこへ集中させる仕組みが必要です。本問のパイロット結果は、機器モデル名は概ね正しく危険物分類はしばしば誤るという、フィールドごとの精度の違いを示しています。","したがって振り分けの単位はフィールドであるべきで、構造化出力にフィールドごとの確信度を出させ、ラベル付きの事例でしきい値をキャリブレーションしてから、確信度の低いフィールドをレビューへ回す方法が正解です。公式の評価設計ガイドも、具体的で測定可能な基準をラベル付きのテストケースで確かめることを勧めています。","全体の精度や文書単位のスコアは粒度が粗すぎ、正常終了は正しさの指標になりません。"],"ref":"https://platform.claude.com/docs/en/test-and-evaluate/develop-tests"},{"n":45,"stem":["あなたは、Claude Agent SDKを使用してマルチエージェントリサーチシステムを構築しています。コーディネーターエージェントが、専門サブエージェントに作業を委任します。サブエージェントには、ウェブを検索するもの、文書を分析するもの、調査結果を統合するもの、レポートを生成するものがあります。このシステムはトピックを調査し、出典を明記した包括的なレポートを作成します。","このシステムが、「製造業におけるAI在庫管理導入について、出典付きの包括的なレポートを作成してほしい」という広い依頼を受け取りました。コーディネーターは、実際の調査を各サブエージェントに委任する前に、どう着手するかを決める必要があります。","過去の実行では、文章としてはよく書けたレポートが得られたものの、カバー範囲にムラがあり、本筋から外れた細部の調査に労力を費やしていました。"],"q":"この種のタスクに最も効果的に対処できるコーディネーターの戦略はどれですか。（2つ選択してください。）","need":2,"opts":[{"t":"最初に探索的な調査でトピックの構造と重要領域をつかみ、判明した依存関係に応じてサブタスクを組み替える。","c":true,"e":["正解。最初に短く広い探索でトピックの全体像と重要領域をつかんでから優先度付きのサブタスクを割り当てると、枝葉の細部に労力を使う前に調べるべき範囲が決まります。調査の途中で依存関係が判明したらサブタスクを組み替えられるようにしておけば、固定の計画では拾えない領域にも対応できます。"]},{"t":"検索からレポート作成までの固定パイプラインで開始し、最初の割り当て後は調査範囲を変更しない。","c":false,"e":["固定パイプラインは、手順が毎回同じで事前に分解できるタスクなら予測可能性の高い設計です。しかし広いトピックの調査では何が重要かは調べてみるまで分からず、最初の割り当て後に範囲を変えられないと、過去の実行で起きたカバー範囲のムラをそのまま固定してしまいます。"]},{"t":"レポートの目次は調査結果に応じて後から確定し、優先度の高い知見から各セクションを埋める。","c":true,"e":["正解。調査の前に目次を固定すると、的外れな前提の見出しに労力が割かれ、重要な領域が抜けやすくなります。目次はトピックの構造と重要度が分かってから確定し、優先度の高い知見から埋めていけば、実際に重要と分かった領域に沿った構成になり、カバー範囲のムラを抑えられます。"]},{"t":"最も目立つキーワードごとの並行調査を最初に割り当て、完了した知見を統合サブエージェントにまとめさせる。","c":false,"e":["並行調査は、独立した観点を同時に調べてレイテンシを下げたいときに有効な手段です。ただし割り当ての基準が表面的なキーワードだと、トピック全体の優先度が考慮されず、目立つ語の周辺に労力が偏って本筋から外れた細部を調べる問題が再現します。"]}],"overall":["広い調査依頼をサブエージェントへ委任する前に、コーディネーターが「何を調べるべきか」を把握できているかどうかが品質を左右します。Anthropicのマルチエージェント研究システムの解説でも、まず短く広い検索で全体像をつかんでから焦点を絞ること、委任時に目的や範囲を明確にすることが重要だとされています。","本問の正解は、探索的な調査で構造と重要領域を把握してから優先度付きのサブタスクを割り当て、依存関係に応じて組み替えることと、目次を調査結果に応じて後から確定することの2つです。","固定パイプラインは途中の発見を反映できず、キーワード起点の並行調査は優先度の判断を飛ばしています。"],"ref":"https://www.anthropic.com/engineering/multi-agent-research-system"},{"n":46,"stem":["ある物流企業のプラットフォームチームは、インシデント管理システムを操作するMCPサーバーを、社内の開発者向けに提供しています。これまでは、各開発者が自分のマシンでサーバーのプロセスを起動し、Claude Codeからローカルに接続していました。","今回、このサーバーを社内クラウドに移し、全員が同じURLに接続する形に切り替えます。新しいサーバーの条件は次のとおりです。","Claudeからの要求に応答するだけで、イベントを自発的に送ることはない","利用者には、ブラウザでのOAuth 2.0ログインを求める","移行期間中は、古いクライアント向けにSSEのエンドポイントも併せて公開する"],"q":"各開発者がClaude Codeにこのサーバーを追加する方法として、最も適切なものはどれですか。","need":1,"opts":[{"t":"claude mcp add --transport httpでサーバーのURLを追加し、/mcpからブラウザで認証する。","c":true,"e":["正解。HTTPトランスポートは、リモートのMCPサーバーに接続するときの推奨の方式で、クラウド上のサービスで最も広くサポートされています。OAuth 2.0による認証にも対応しており、追加後に/mcpからブラウザでログインすれば、トークンは安全に保存されて自動で更新されるため、全員が同じURLのサーバーをそれぞれの権限で利用できます。"]},{"t":"サーバーのパッケージを各自で取得し、claude mcp add --transport stdioでローカルに追加する。","c":false,"e":["stdioトランスポートは、サーバーを自分のマシン上のプロセスとして起動する方式で、ローカルのファイルやシステムに直接アクセスするツールや独自のスクリプトに向いています。本問はサーバーを社内クラウドに移し、全員が同じURLに接続する構成への切り替えなので、各自がプロセスを起動する従来の形に戻す案は移行の目的に反します。"]},{"t":"claude mcp add --transport sseでSSEのエンドポイントを追加し、/mcpからブラウザで認証する。","c":false,"e":["SSEトランスポートは、SSEのエンドポイントしか公開していない古いサービスにつなぐために残されている方式です。公式ドキュメントではSSEは非推奨とされ、HTTPが使える場合はHTTPを使うよう案内されています。本問のサーバーはHTTPで接続でき、SSEは移行期間中の古いクライアント向けに併設されているだけなので、こちらを選ぶ理由はありません。"]},{"t":".mcp.jsonにtype: \"ws\"でサーバーのURLを書き、Authorizationヘッダーにトークンを設定する。","c":false,"e":["WebSocketの接続は双方向の常時接続を保つ方式で、サーバーがClaudeに向けてイベントを自発的に送る場合に適しています。本問のサーバーは要求に応答するだけであり、WebSocketの認証はヘッダーによる方式に限られてOAuthには対応しないため、ブラウザでのOAuth 2.0ログインという要件を満たせません。"]}],"overall":["Claude CodeにMCPサーバーを追加するときは、サーバーがどこで動き、どちら向きに通信し、どう認証するかでトランスポートを選びます。公式ドキュメントでは、stdioは自分のマシン上のローカルプロセス向け、HTTPはリモートのMCPサーバーに接続する推奨の方式、WebSocketはサーバーがイベントを自発的に送る双方向の接続向けと整理されています。","SSEは非推奨で、HTTPが使える場合はHTTPを使うよう明記されています。さらに、OAuth 2.0による認証はHTTPのサーバーで利用でき、WebSocketはヘッダーによる認証だけに対応します。","本問のサーバーはクラウド上にあり、要求に応答するだけで、OAuthでのログインを求めるので、3つの条件がそろってHTTPを指しています。","SSEは非推奨の旧方式、stdioはローカル実行の方式、WebSocketは認証の方式が合わない、というように残りの選択肢は1つずつ条件から外れます。","トランスポートを選ぶ場面では、「接続先の場所」「通信の向き」「認証の方式」の3点を順に照らし合わせるのが確実です。"],"ref":"https://code.claude.com/docs/en/mcp"},{"n":47,"stem":["オンライン教育プラットフォームを運営する企業では、Claude CodeをCI/CDパイプラインに統合しています。このシステムは、自動コードレビューを実行し、テストケースを生成し、プルリクエストにフィードバックを返します。具体的で実行可能なフィードバックを返し、誤検知を最小限に抑えるプロンプトを設計する必要があります。","プルリクエストのレビューで誤検知が発生しています。原因は、データベースマイグレーション固有のレビュー基準が、フロントエンドやドキュメントの変更にまで適用されていることです。マイグレーションファイルは、services・apps・共有ライブラリなど、複数のパッケージの配下に置かれる可能性があります。"],"q":"Claudeが関連するファイルを読み取ったときにだけこれらの規約を読み込ませるために、このチームが行うべき変更はどれですか。","need":1,"opts":[{"t":"マイグレーションのチェックリストをルートのCLAUDE.mdに移し、関連ファイルにだけ適用するよう指示する。","c":false,"e":["ルートのCLAUDE.mdは起動時に毎回読み込まれるため、全体に共通する規約の置き場です。マイグレーションのファイルにだけ適用するよう書いても基準自体は常にコンテキストに入ったままで、適用範囲の判断をClaudeの解釈に委ねることになり、フロントエンドやドキュメントの変更での誤検知を確実には防げません。"]},{"t":"pathsにマイグレーションのglobパターンを書いた.claude/rules/database-migrations.mdに基準を置く。","c":true,"e":["正解。.claude/rules/のルールファイルにYAMLフロントマターでpaths（\"**/migrations/**/*.{sql,ts}\"など）を指定すると、Claudeがそのパターンに一致するファイルを読んだときにだけ読み込まれます。","マイグレーションファイルがservices・apps・共有ライブラリのどこにあっても基準が適用され、それ以外の変更のレビューには読み込まれないため、誤検知の原因を断てます。"]},{"t":"マイグレーション用のglobパターンを書いた~/.claude/rules/database-migrations.mdを各レビュアーに入れてもらう。","c":false,"e":["~/.claude/rules/のユーザーレベルのルールは、個人の好みをすべてのプロジェクトに適用するための場所です。レビュアーごとの手元への配置に頼るとチームやCI環境で同じ基準が効く保証がなく、リポジトリで共有・管理される規約にはなりません。"]},{"t":"フロントマターなしの.claude/rules/database-migrations.mdを作り、ファイル名で対象を絞らせる。","c":false,"e":[".claude/rules/にファイルを置くこと自体は正しい方向ですが、ルールのフロントマターで読み込み条件として読まれる項目はpathsだけで、ファイル名は条件になりません。フロントマターのないルールは起動時に無条件で読み込まれるため、すべての変更に基準が適用される現状と変わりません。"]}],"overall":["「特定のファイルを扱うときだけ効かせたいレビュー基準」は、Claude Codeではpaths付きのプロジェクトルールで実現します。公式ドキュメントによれば、.claude/rules/のルールはpathsを持たなければ起動時に読み込まれ、pathsを持てば一致するファイルをClaudeが読んだときにだけ読み込まれます。また、ルールのフロントマターでClaude Codeが読む項目はpathsだけです。","本問はマイグレーション固有の基準がフロントエンドやドキュメントの変更にまで適用されて誤検知を生んでいるので、マイグレーションのパターンをpathsに指定したプロジェクトルールが正解です。","ルートのCLAUDE.mdは常時読み込み、ユーザーレベルのルールはチームで共有されず、フロントマターのないルールは無条件に読み込まれます。"],"ref":"https://code.claude.com/docs/en/memory"},{"n":48,"stem":["オンライン薬局サービスを運営する企業は、Claude Codeをコードレビュー自動化パイプラインに統合しています。このシステムは、プルリクエストごとに自動レビューを実行し、テストケースを生成し、具体的で実行可能なフィードバックを返します。誤検知を最小限に抑えるプロンプトを設計する必要があります。","このシステムは、プルリクエストのレビュー、テストの生成、PRメタデータの更新のすべてを、1回のMessages API呼び出しでまとめて処理しています。ログを見ると、次の問題が起きています。","レビュー段階で、テストできないスタイルのコメントに対しても、テスト作成用ツールが呼び出されることがある","パイプラインが期待する構造化された指摘オブジェクトではなく、ただの文章が返されることがある"],"q":"パイプラインのほかの箇所での自動テスト生成は維持しつつ、ツール選択の信頼性を最も改善できる変更はどれですか。（2つ選択してください。）","need":2,"opts":[{"t":"レビューとテスト生成のステップを分離し、それぞれの役割に必要なツールだけを公開し、レビューステップではtool_choiceでレポート用ツールの使用を強制する。","c":true,"e":["正解。役割の異なる処理を1回の呼び出しに混ぜず、ステップごとに必要なツールだけを公開すれば、無関係なツールを選ぶ余地そのものがなくなります。さらにレビューステップでtool_choiceにより指摘報告用ツールの使用を指定すれば、構造化された指摘オブジェクトが返り、文章だけの応答を防げます。","なおClaude Opus 5.5のように強制指定に対応しないモデルでは、autoとstrict tool use、またはstructured outputsの組み合わせで同じ目的を満たします。"]},{"t":"各ツールの説明文を、レビュー段階で使う場面と使わない場面の境界が分かる形に書き直す。","c":true,"e":["正解。モデルがどのツールを使うかを判断する最大の手がかりは説明文で、公式ドキュメントも詳細な説明文をツールの性能を左右する最重要の要素としています。テスト作成用ツールの説明に、使う場面と使わない場面（テストできないスタイル指摘には使わない等）を明記すれば、レビュー段階での誤選択を減らしつつ、パイプラインの他の箇所では同じツールを使い続けられます。"]},{"t":"共有の1つのCIステップを維持し、ツール名をカテゴリごとに名前空間で分け、tool_choiceはautoのままモデルの柔軟性に任せる。","c":false,"e":["ツール名にサービスや用途の接頭辞を付ける名前空間化は、ツールが多くの領域にまたがるときの選択を明確にする推奨手法です。しかし1つのステップにレビュー・テスト生成・メタデータ更新のツールがすべて公開されたままでtool_choiceもautoのままでは、レビュー中にテスト作成用ツールを選ぶ余地も、ツールを使わず文章で返す余地も残ります。"]},{"t":"両方のステップにすべてのCIツールを公開し、レビュー中はtool_choiceをnoneに設定し、アシスタントのテキストからJSONを解析する。","c":false,"e":["tool_choiceのnoneは、ツールを使わせずに文章だけで答えさせたい場面で使う設定です。レビュー中にこれを指定すると構造化された指摘用ツールも使えなくなり、文章からJSONを取り出す方式に頼ることになるため、「構造化オブジェクトの代わりに文章が返る」という現在の問題を仕組みとして常態化させます。"]}],"overall":["1回の呼び出しに多くの目的とツールを詰め込むと、モデルは目的に合わないツールを選んだり、ツールを使わずに文章で答えたりしやすくなります。","対策の基本は、ツールの説明文で使う場面と使わない場面の境界を明確にすることと、処理を役割ごとのステップに分けて各ステップに必要なツールだけを見せることです。構造化された出力が必須のステップでは、tool_choiceで報告用ツールを指定する（強制指定に対応しないモデルではstrict tool useやstructured outputsを使う）ことで形式も担保できます。","名前空間化は有用な工夫ですが公開範囲を狭めず、tool_choiceのnoneは構造化出力の手段を自ら手放します。","なお、2026年9月以降に公開された一部のモデルでは、tool_choiceのanyやtoolによる強制が400エラーになります。試験ガイド（2026年7月版）より新しい変更のため、本試験では強制できる前提で出題される可能性があります。"],"ref":"https://platform.claude.com/docs/en/agents-and-tools/tool-use/define-tools"},{"n":49,"stem":["あなたは、Claude Codeを使ってソフトウェア開発を加速しています。チームでは、コード生成、リファクタリング、デバッグ、ドキュメント作成にClaude Codeを使っています。カスタムスラッシュコマンドやCLAUDE.mdの設定を用いて開発ワークフローに統合し、プランモードと直接実行をどのように使い分けるかを理解する必要があります。","このチームは、日常の開発タスクのために、Claude CodeをServiceNowのチケットと連携させたいと考えています。さらに、チケットのフィールドに社内限定のサービス所有権ルールと内部デプロイチェックを組み合わせた、リリース判定のワークフローも必要です。"],"q":"再利用性、保守性、チーム固有の挙動を最もよく両立できる統合方法はどれですか。","need":1,"opts":[{"t":"ServiceNowの各操作ごとにプロジェクトスラッシュコマンドを作成し、どのAPI呼び出しを選ぶかはClaude Codeのプロンプトに任せる。","c":false,"e":["操作ごとのスラッシュコマンドは、決まった手順を人が起動する用途には向いています。ただしどのAPI呼び出しを行うかを毎回プロンプトの解釈に任せると挙動が安定せず、社内ルールを組み合わせたリリース判定のような複合ロジックを信頼できる形で実装する手段にはなりません。"]},{"t":"ServiceNow操作を再実装し、リリース判定ワークフローも処理する1つのカスタムMCPサーバーを構築する。","c":false,"e":["すべてを1つのカスタムサーバーにまとめると、実装と権限の管理を一元化できる利点はあります。しかし既存サーバーが提供する標準操作まで自前で作り直すことになり、ServiceNow側の仕様変更への追随もすべて自分たちの負担になるため、保守性の面で不利です。"]},{"t":"ServiceNow操作用にメンテナンスされた既存のMCPサーバーを設定し、リリース判定ワークフロー用にはカスタムMCPサーバーを実装する。","c":true,"e":["正解。チケットの参照や更新のような標準的な操作は、保守されている既存のServiceNow向けMCPサーバーを使えば、API変更への追随などの保守を提供元に任せられます。社内限定の所有権ルールや内部デプロイチェックを組み合わせるリリース判定にはチーム固有の知識が必要なので、その部分だけをカスタムMCPサーバーとして実装すれば、再利用性と固有の挙動を両立できます。"]},{"t":"ServiceNowのREST手順をCLAUDE.mdに保存し、Bashを呼び出すスラッシュコマンドでチケット更新を行う。","c":false,"e":["CLAUDE.mdに手順を書いてスラッシュコマンドからBashでAPIを呼ぶ方法は、小規模で一時的な自動化なら手軽です。しかしツールとしての入力スキーマや説明を持たないため、呼び出しの正確さが手順書の記述とモデルの解釈に依存し、チームで再利用・保守する統合の基盤としては脆弱です。"]}],"overall":["外部サービス連携では、「汎用部分は既存の部品を使い、固有部分だけを自作する」という切り分けが再利用性と保守性を両立させます。MCPはこの切り分けに向いた仕組みで、Claude Codeのドキュメントも、既存のMCPサーバーを追加して外部ツールやデータソースに接続できることを説明しており、固有の機能は独自のサーバーとして公開できます。","本問では、ServiceNowの標準操作は保守されている既存サーバーに任せ、社内限定の所有権ルールと内部デプロイチェックを組み合わせるリリース判定だけをカスタムMCPサーバーにするのが最適です。","全部を自作すると標準操作の保守まで抱え込み、CLAUDE.mdの手順書とBash、操作ごとのコマンドは構造化されたツール定義を持たないため挙動が安定しません。汎用部分を上流に任せられるかどうかは、統合の保守コストを長期的に左右します。"],"ref":"https://code.claude.com/docs/en/mcp"},{"n":50,"stem":["あるゲームスタジオのライブ運用チームは、Claude Codeを使ってソフトウェア開発を加速しています。コード生成、リファクタリング、デバッグ、ドキュメント作成に活用し、カスタムスラッシュコマンドやCLAUDE.mdの設定を用いて開発ワークフローに統合しています。プランモードと直接実行をどのように使い分けるかも理解する必要があります。","このチームの/release-noteワークフローは、生のコミットメッセージを顧客向けの変更履歴エントリに書き換えます。レビュー担当者は、変換結果に次のような一貫性のなさがあることに気づきました。","社内チケットIDがそのまま残ることがある","破壊的変更が、あいまいな表現に和らげられることがある","簡潔なバグ修正コミットが、根拠のない詳細情報で水増しされることがある"],"q":"このワークフローの一貫性を最も直接的に改善できる変更はどれですか。","need":1,"opts":[{"t":"release-note用の指示をプロジェクト設定に移し、チーム共有の設定でワークフローを実行する。","c":false,"e":["指示を共有のプロジェクト設定に置くことは、チーム全員が同じ指示で実行するための手段です。ただし今回の不一致は指示の置き場所ではなく、指示の内容が変換の期待値を十分に伝えていないことから生じているため、共有しても同じあいまいな出力が全員の環境で再現されるだけです。"]},{"t":"社内チケットIDを含む変更履歴の書き込みをブロックするPreToolUseフックを追加する。","c":false,"e":["PreToolUseフックは、特定の条件を満たす操作を実行前に確実に止めたいときに使う決定的な制御です。社内チケットIDの混入のように機械的に検出できる問題には有効ですが、破壊的変更の表現が和らげられる問題や、根拠のない詳細が水増しされる問題は文字列の検査では判定できず、3つの不一致のうち1つしか扱えません。"]},{"t":"プランモードでワークフローを実行し、Claudeに編集前の段階で作成方針を提示させる。","c":false,"e":["プランモードは、コードを変更する前に調査と方針の提示を行わせたい場面で使う権限モードです。変換方針を事前に言語化させても、個々のコミットメッセージをどう書き換えるかの具体的な基準は示されないため、チケットIDの除去や重大度の維持といった振る舞いの一貫性は改善しません。"]},{"t":"エッジケースを含む変換前後の代表例を3つ、タグで区切った例示セクションに追加する。","c":true,"e":["正解。公式のプロンプトガイドは、出力の形式やトーンを安定させる確実な方法として、実際の用途に近くエッジケースを含む多様な例を3〜5個、＜example＞タグで指示と区切って示すことを勧めています。社内チケットIDの除去、破壊的変更の明示、短いバグ修正は短いまま書く、といった期待される変換を具体例で見せれば、3種類の不一致をまとめて抑えられます。"]}],"overall":["テキスト変換タスクの出力がぶれるときは、ルールを増やすより「期待される入出力の具体例」を見せるほうが効きます。公式のベストプラクティスによれば、少数の適切な例（few-shot／multishot）は出力の形式・トーン・構造を安定させ、例は実際の用途に近くエッジケースを含むものを選び、＜example＞タグで指示と区別して示すのがよいとされています。","本問の不一致は、社内IDの残留、破壊的変更の弱体化、根拠のない水増しの3種類で、いずれも「こう書き換える」という手本があれば防げます。","PreToolUseフックは1種類しか検出できず、設定の共有とプランモードは変換の基準そのものを与えません。","出力の一貫性を問われたら、モデルが真似できる手本を与える選択肢かどうかが判断の軸になります。"],"ref":"https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices"},{"n":51,"stem":["ある物流会社では、輸送書類（船荷証券・通関申告書）を自動レビューするAIエージェントを、文書処理パイプラインに統合しています。このシステムは書類の自動レビューを実行し、修正指摘のフィードバックを担当者に返します。フィードバックは実用的で、誤検知を最小限に抑える必要があります。","長い輸送書類ほど、レビューステップがコンテキスト上限に近づく問題が起きています。トレースを確認すると、書類解析ツールを呼び出すたびに、大きなtool_resultペイロードが追加されていました。ペイロードには次の情報が含まれますが、実際のレビューで使うのはその一部のフィールドだけです。","書類メタデータ全体","関係者データ","全文の通関履歴","依存関係の詳細"],"q":"この信頼性の問題に最も適切に対応できる変更はどれですか。","need":1,"opts":[{"t":"コンテキストエディット機能を有効にし、設定したしきい値をリクエストが超えた時点で古いツール結果をクリアする。","c":false,"e":["コンテキストエディットは、設定したしきい値を超えたときに古いツール結果を自動で消去する機能で、長く続くエージェントの会話で古い結果が溜まる場合に有効です。しかし本問では1回ごとの結果が大きいことが原因で、消去は溜まった後の対症療法にとどまり、まだ使う結果まで消える可能性もあります。"]},{"t":"ツールラッパーを変更し、必要なフィールドだけを含むレビュー用のコンパクトなtool_resultペイロードを返すようにする。","c":true,"e":["正解。コンテキストを圧迫している原因は、レビューに使わない関係者データや全文の通関履歴まで毎回tool_resultに入っていることです。ツールラッパーで必要なフィールドだけを返すようにすれば発生源でペイロードが小さくなり、長い書類でもコンテキスト上限に近づきにくくなります。モデルが読む情報が絞られるため、レビューの焦点も定まりやすくなります。"]},{"t":"ツール定義と繰り返し登場するレビュー用プレフィックスにプロンプトキャッシュを適用し、コンテキストウィンドウの圧迫を軽減する。","c":false,"e":["プロンプトキャッシュは、繰り返し送る同一のプレフィックスの処理を再利用してコストとレイテンシを下げる機能です。キャッシュされた部分もコンテキストウィンドウの長さには数えられるため圧迫は軽減されず、毎回新しく追加される大きなペイロードにも効果がありません。"]},{"t":"レビュー応答のmax_tokensを増やし、無関係なtool_resultフィールドを無視するようClaudeに指示する。","c":false,"e":["max_tokensは出力の上限を決めるパラメータで、入力側のコンテキストを圧迫しているtool_resultの大きさには影響しません。無関係なフィールドを無視するよう指示しても、それらのトークンはコンテキストに入ったままなので、上限への接近は防げません。"]}],"overall":["tool_resultに入れた内容はそのまま会話のコンテキストに積み上がるため、ツールが返すデータ量は信頼性に直結します。本問のトレースでは、レビューに使わない書類メタデータ全体・関係者データ・全文の通関履歴・依存関係の詳細が毎回追加されており、原因はツールの返し方そのものです。","したがって、ツールラッパーで必要なフィールドだけのコンパクトな結果を返すのが最も根本的な対処です。","コンテキストエディットは溜まった結果を後から消す対症療法、max_tokensは出力側の上限、プロンプトキャッシュはコストとレイテンシの最適化で、いずれもペイロードの大きさという原因に手を付けていません。","コンテキスト上限の問題では、情報がコンテキストに入る「入口」で減らせないかを最初に検討すると、根本対策を選べます。"],"ref":"https://platform.claude.com/docs/en/build-with-claude/context-windows"},{"n":52,"stem":["あなたは、ソフトウェア開発チームで、Claude Codeを使ったドキュメント抽出ワークフローを運用しています。設計ドキュメントやプルリクエストの説明文を、JSON形式の作業アイテムに変換する抽出ジョブです。レビュアーが目視で確認できるのは、全体の約20％だけです。","現在のジョブは、stop_reason: end_turnを返したレスポンスを、そのままトラッカーに投入しています。抜き取り検査では、次の場合に不良な作業アイテムが発生していることが分かりました。","2つの参照元の文書の内容が食い違っている場合","ある項目が、文脈から弱く推測されている場合"],"q":"このレビューワークフローを最も改善できる変更はどれですか。（2つ選択してください。）","need":2,"opts":[{"t":"2つの参照元ファイルの内容が食い違っている作業アイテムにフラグを立てる、参照元間の整合性チェックを追加する。","c":true,"e":["正解。抜き取り検査で見つかった不良の一方は、2つの参照元の文書の内容が食い違っているケースです。参照元どうしの整合性をチェックして食い違う作業アイテムにフラグを立てれば、モデルの自己申告に頼らずにこのリスクを機械的に検出でき、限られたレビュー枠をそこへ優先的に回せます。"]},{"t":"JSONスキーマにフィールドごとの確信度・あいまいさ・矛盾・根拠抜粋のフィールドを追加し、フラグが立ったレコードをクリーンなレコードより先にレビュアーへキューイングする。","c":true,"e":["正解。JSONスキーマにフィールドごとの確信度・あいまいさ・矛盾・根拠の抜粋を追加すると、Claudeは抽出と同時に「弱い推測で埋めた項目」や「根拠が衝突している項目」を申告できます。フラグ付きのレコードをクリーンなレコードより先にレビュアーへ回せば、約20％のレビュー容量を不良が起きやすいレコードに集中させられます。"]},{"t":"OpenAI SDK層を経由してlogprobsとtop_logprobsを要求し、低確率のレコードを整形済みレコードより先にレビュアーへキューイングする。","c":false,"e":["logprobsはトークンごとの出現確率を返す仕組みで、他社のAPIでは確信度の推定に使われることがあります。しかしClaudeのOpenAI SDK互換レイヤーではlogprobsとtop_logprobsは無視され、応答のlogprobsも常に空なので、この方法では低確率のレコードを選び出せません。"]},{"t":"ソース文書に対してcitations機能を有効にしてJSONスキーマ出力と併用し、citationブロックが欠落しているレコードを他のレコードより先にレビュアーへキューイングする。","c":false,"e":["citationsは、回答のどの部分が提供文書のどこに基づくかを示す機能で、根拠の確認には有用です。しかしcitationsと構造化出力（JSONスキーマの出力形式）は併用できず、同時に指定すると400エラーになります。また引用の有無だけでは、2つの参照元の食い違いを検出することもできません。"]}],"overall":["stop_reasonがend_turnであることは応答が最後まで生成されたことを示すだけで、内容の正しさは保証しません。レビューできる割合が限られるなら、不良が起きやすいレコードを見つけて優先的に回す仕組みが必要です。","本問の不良は「参照元の食い違い」と「文脈からの弱い推測」の2種類なので、前者は参照元間の整合性チェックで機械的に検出し、後者はスキーマに確信度・あいまいさ・矛盾・根拠抜粋のフィールドを設けてモデル自身に申告させるのが正解です。","logprobsはOpenAI SDK互換レイヤーでは無視され、citationsは構造化出力と併用すると400エラーになるため、どちらも成立しません。","検証の仕組みは、実際のAPIの組み合わせとして動くかどうかまで確かめて初めて選択肢になります。"],"ref":"https://platform.claude.com/docs/en/build-with-claude/structured-outputs"},{"n":53,"stem":["製薬会社の規制情報チームは、Claude Agent SDKを使用してマルチエージェントリサーチシステムを構築しています。コーディネーターエージェントが、専門サブエージェントに作業を委任します。サブエージェントには、ウェブを検索するもの、文書を分析するもの、調査結果を統合するもの、レポートを生成するものがあります。このシステムはトピックを調査し、出典を明記した包括的なレポートを作成します。","このチームは、引用検証用のテストをエージェントのコードのすぐそばに置いています。テストファイルは、packages/search/・packages/synthesis/・apps/reporting/の各配下にあります。チームの要望は次の2つです。","これらのテストファイルを編集するときは、常に同じテスト規約をClaude Codeに適用させる","関係のない本番用ファイルを編集するときは、その規約を読み込ませない"],"q":"このチームが行うべきことはどれですか。","need":1,"opts":[{"t":"各パッケージディレクトリにCLAUDE.mdを置き、同じテスト規約をそれぞれのファイルに複製して記載する。","c":false,"e":["サブディレクトリのCLAUDE.mdは、Claudeがそのディレクトリのファイルを読んだときに読み込まれるため、特定のパッケージだけの事情を書くのには向いています。しかし同じ規約を3か所に複製すると、更新のたびにすべてをそろえる必要があり、更新漏れによる食い違いを新たに生みます。また、そのディレクトリの本番用ファイルを読んだときにも読み込まれます。"]},{"t":"各開発者のユーザーレベルのCLAUDE.mdにテスト規約を追加し、編集時に読み込ませる。","c":false,"e":["ユーザーレベルのCLAUDE.md（~/.claude/CLAUDE.md）は、個人の好みをすべてのプロジェクトに適用するためのものです。リポジトリに含まれないのでチームで共有されず、特定のテストファイルに絞って読み込ませる仕組みもないため、本問の要件を満たしません。"]},{"t":"テストファイルのglobパターンをpathsに書いたルールファイルを.claude/rules/に置く。","c":true,"e":["正解。.claude/rules/のルールファイルは、YAMLフロントマターのpathsにglobパターン（**/*.test.tsなど）を書くと、そのパターンに一致するファイルをClaudeが読んだときだけ読み込まれます。","規約は1ファイルにまとまったまま、packages/search/・packages/synthesis/・apps/reporting/のテストに共通で適用され、本番用ファイルの編集ではコンテキストに入りません。"]},{"t":"テスト規約をルートのCLAUDE.mdの専用セクションに追加する。","c":false,"e":["ルートのCLAUDE.mdは起動時に毎回読み込まれるため、リポジトリ全体で常に適用したい規約の置き場です。専用セクションに分けて書いてもファイルごと読み込まれることは変わらず、テストと無関係な本番用ファイルを編集するときにも規約がコンテキストに入り、「無関係なファイルでは読み込ませない」という要件に反します。"]}],"overall":["「特定の種類のファイルを扱うときだけ効かせたい規約」は、Claude Codeではpaths付きのルールで表現します。公式ドキュメントによれば、.claude/rules/配下のルールはpathsを持たなければ起動時に読み込まれ、pathsを持てば一致するファイルをClaudeが読んだときにだけ読み込まれます。","本問は複数のパッケージに散らばる引用検証テストに同じ規約を適用しつつ、本番用ファイルでは読み込ませたくないので、テストファイルのglobパターンをpathsに書いたルールファイルが正解です。","ディレクトリごとのCLAUDE.mdは複製による保守負担を生み、ルートのCLAUDE.mdは常時読み込みになり、ユーザーレベルのCLAUDE.mdは共有も絞り込みもできません。"],"ref":"https://code.claude.com/docs/en/memory"},{"n":54,"stem":["あなたは、Claude Agent SDKを使用して保険金請求対応エージェントを構築しています。このエージェントは、支払い調整、補償範囲の照会、払戻し可否など、あいまいさの高い問い合わせを処理します。カスタムのMCPツール（get_policyholder、lookup_claim、issue_payout、escalate_to_adjuster）を通じて、バックエンドシステムにアクセスできます。目標は、エスカレーションすべきタイミングを見極めながら、初回解決率80%以上を維持することです。","本番環境のログを確認したところ、請求内容が補償対象期間外の場合に、issue_payoutが「Payout blocked by policy」という内容を含む、一見成功したように見えるツール結果を返すことがあると分かりました。","Claudeはこの結果を受けて、状況を顧客に説明したり適切にエスカレーションしたりせずに、言い回しを少し変えただけの同じ支払いリクエストを繰り返し試みています。"],"q":"エージェントのこの復旧時の挙動を最も改善できる変更はどれですか。","need":1,"opts":[{"t":"CallToolResultにisError: trueを付け、リトライの可否をstructuredContentで示す。","c":true,"e":["正解。MCPでは、ツールの実行が業務上の理由で失敗した場合、CallToolResultのisErrorをtrueにしたツール実行エラーとして返します。これによりClaudeは支払いが実行されなかったことを確実に認識でき、リトライの可否やポリシー上の理由を構造化して添えれば、同じ要求を繰り返す代わりに顧客への説明やescalate_to_adjusterへの切り替えを判断できます。"]},{"t":"通常のCallToolResultを返し、contentに払戻しポリシーの詳しい説明と次に取れる対応の候補を書く。","c":false,"e":["contentに詳しい説明を書くこと自体は有益ですが、isErrorが付かない通常の結果として返す限り、クライアントとモデルにとっては成功した呼び出しです。現在の「Payout blocked by policy」と同じく失敗を文章から読み取らせる形になるため、同じ要求のリトライが続く可能性が残ります。"]},{"t":"issue_payoutの説明文に、補償期間外の支払いを要求しないようClaudeへの警告を追記する。","c":false,"e":["ツールの説明文は、そのツールをいつ使うべきかをモデルに伝える主要な手段で、誤用を予防する効果はあります。しかし今回の問題は、拒否された結果が成功のように見える形で返り、Claudeが失敗と認識できないことです。事前の警告を足しても、実行後に返る結果の意味は変わりません。"]},{"t":"業務ポリシーに違反する支払い要求には、tools/callからJSON-RPCのプロトコルエラーを返す。","c":false,"e":["JSON-RPCのプロトコルエラーは、未知のツール名や不正なリクエストのように、リクエストの構造自体に問題がある場合のためのものです。MCPの仕様は、この種のエラーはモデルが自力で復旧しにくいとし、ツールが実行した処理の失敗はツール実行エラーとして返すよう区別しています。"]}],"overall":["MCPはエラーを2種類に分けています。リクエストの構造に問題がある場合のプロトコルエラーと、ツールの実行自体が失敗した場合のツール実行エラーで、後者はCallToolResultのisErrorをtrueにして返します。仕様上、クライアントはツール実行エラーをモデルに渡して自己修正に使わせるべきとされ、プロトコルエラーは復旧につながりにくいと説明されています。","本問のissue_payoutは業務上の理由で支払いを拒否しているのに成功に見える結果を返しており、Claudeは失敗と気づけずに言い換えたリトライを続けています。したがってisErrorをtrueにし、リトライの可否などの判断材料を構造化して返す方法が正解です。","説明文への警告や詳しい通常の結果は「失敗である」という信号を与えず、プロトコルエラーは扱う層が違います。","失敗がプロトコルの問題か、ツールが実行した処理の結果かの切り分けが、MCPのエラー設計の第一歩です。"],"ref":"https://modelcontextprotocol.io/specification/2026-07-28/server/tools"},{"n":55,"stem":["音楽ストリーミングサービスを開発する企業は、Claude Codeをコードレビュー自動化パイプラインに統合しています。このシステムは、プルリクエストごとに自動レビューを実行し、テストケースを生成し、具体的で実行可能なフィードバックを返します。誤検知を最小限に抑えるプロンプトを設計する必要があります。","数週間運用したところ、開発者から自動レビューは「ノイズが多い」という声が上がっています。実例を見ると、次の2種類のコメントが混在しています。","変数名の付け方、好みのアサーションスタイル、テスト不足についてのコメント","null参照の実バグや認可バイパスといった、本物の問題についてのコメント","現在のプロンプトには、「高い確信を持てる問題のみを報告すること」とだけ書かれています。"],"q":"レビューの有用性を最も直接的に改善できるプロンプトの変更はどれですか。（2つ選択してください。）","need":2,"opts":[{"t":"自動検出の結果を1つのノンブロッキングな要約コメントにまとめ、インラインには投稿しない。","c":false,"e":["要約コメントへの集約は、指摘の量はそのままに表示の圧迫感を減らしたい場合には使える手段です。しかし何を報告するかは変わらないため、変数名や好みのアサーションスタイルに関するノイズは同じ量だけ生成され続け、開発者が本物の問題を見つけにくい状況は解消しません。"]},{"t":"レビュー範囲は今のまま広く保ち、各インラインコメントに数値の確信度スコアと簡潔な根拠の説明を添えさせる。","c":false,"e":["確信度スコアの付与は、指摘の優先度付けやしきい値によるフィルタに使えます。ただし「高い確信を持てる問題のみ」という現在の指示が効いていないことからも分かるとおり、モデルが自己申告する確信度は報告対象の種類を絞る基準にはならず、範囲を広いまま保てばスタイルの指摘も生成され続けます。"]},{"t":"報告する問題の種類（本番バグやセキュリティ欠陥など）とスキップする種類を、検証できる基準で定義する。","c":true,"e":["正解。「高い確信」のような主観的な基準では、何を報告すべきかが実行ごとにぶれます。本番バグ・セキュリティ欠陥・壊れたエッジケース・見つけにくいリグレッションは報告し、命名や好みのスタイルはスキップする、といった判定可能な基準を書けば、報告対象そのものが絞られて出力が安定します。"]},{"t":"命名やフォーマット、アサーションスタイルの好みに関する項目を、レビューのチェックリストから外す。","c":true,"e":["正解。ノイズの発生源は、命名・フォーマット・アサーションスタイルといった好みの項目がチェックリストに残っていることです。項目自体を外せばその種のコメントは生成対象から消え、報告基準の明確化と組み合わせることで、残る指摘を実害のある問題に集中させられます。"]}],"overall":["自動コードレビューのノイズは、多くの場合「確信度」ではなく「報告範囲」の問題です。「高い確信を持てる問題のみ」という指示は主観的で、モデルは好みのスタイルの指摘にも高い確信を持てるため、報告対象の種類は絞られません。","公式のプロンプトガイドが勧めるように、期待する出力は明確で具体的な基準として書くのが効果的です。本問では、報告する種類とスキップする種類を検証可能な形で定義することと、ノイズ源の項目をチェックリストから外すことの2つが正解です。","要約コメントへの集約は表示場所を変えるだけで、確信度スコアの付与は範囲が広いままでは同じ種類のノイズを生み続けます。表示の工夫が意味を持つのは、報告内容が正しく絞られた後です。"],"ref":"https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices"},{"n":56,"stem":["自律型ドローン配送を手がけるスタートアップが、Claude CodeをCI/CDパイプラインに統合しています。このシステムは、自動コードレビューを実行し、テストケースを生成し、プルリクエストにフィードバックを返します。具体的で実行可能なフィードバックを返し、誤検知を最小限に抑えるプロンプトを設計する必要があります。","最近のCI実行の結果、20〜40ファイルにまたがるプルリクエストでは、レビューが表面的なスタイルの問題ばかりを報告し、ファイル横断の相互作用に依存する問題を見逃していることが分かりました。","チームは、レビューを自由度の高い調査的な処理にはせずに、より信頼できるレビュー設計にしたいと考えています。"],"q":"行うべき変更はどれですか。","need":1,"opts":[{"t":"ファイルのグループごとに独立した並列レビュアーを実行し、統合の工程を挟まずにそれぞれのコメントをそのまま公開する。","c":false,"e":["ファイル群ごとの並列レビューは、各レビュアーが小さな範囲に集中できるため、個々のファイル内の問題を見つけるには有効です。しかし統合の工程がないと、あるファイルの変更が別のファイルにどう影響するかを誰も確認せず、見逃している相互作用の問題を拾えません。"]},{"t":"差分全体を1つのレビュープロンプトに渡し、コメントを出す重大度のしきい値を引き上げる。","c":false,"e":["重大度のしきい値の引き上げは、軽微なスタイル指摘を減らす効果はあります。しかし20〜40ファイルの差分全体を1つのプロンプトで扱うと注意が分散し、ファイル横断の相互作用に依存する問題はそもそも見つかりにくいため、しきい値を上げても検出漏れは改善しません。"]},{"t":"ファイル単位の集中レビューを固定の段階として順に実行し、最後に横断チェックの段階を置く。","c":true,"e":["正解。ファイル単位の集中したレビューを固定の段階として順に実行すれば、各段階は小さな範囲を丁寧に確認でき、表面的な指摘に流れにくくなります。最後に、収集された指摘をまとめて検討する横断チェックの段階を置けば、ファイルをまたぐ相互作用の問題を確認できます。手順は固定されているため、自由度の高い調査的な処理にもなりません。"]},{"t":"各プルリクエストについて、Claudeが自分自身でレビューの進め方とツールを動的に選択できるようにする。","c":false,"e":["経路とツールの選択をモデルに任せる自律的なエージェントは、手順を事前に決められない探索的なタスクに向いています。しかしこのチームは自由度の高い調査的な処理を避け、毎回同じ手順で動く信頼できるレビューを求めているため、実行ごとに進め方が変わる設計は要件と逆です。"]}],"overall":["大きなPRのレビューでは、1回で全部を見ると注意が分散し、ばらばらに見るだけだとファイル横断の問題を取りこぼします。Anthropicのエージェント設計ガイドは、タスクを固定の段階に分けて各段の出力を次の段へ渡すprompt chainingを、各ステップを簡単にして精度を上げる手法として紹介しており、手順を事前に決められるタスクではモデルに経路を委ねるより予測可能なワークフローが適するとしています。","本問は自由度の高い調査的な処理を避けたいので、ファイル単位の集中したレビューパスをチェーンで実行し、最後に統合パスで相互作用を確認する設計が正解です。","経路選択をモデルに任せる案は要件と逆で、差分全体の一括レビューは注意が分散し、統合のない並列レビューはファイル横断の問題を拾えません。分割と統合をどちらも固定の手順として持つ点が、自律的なエージェントとの違いです。"],"ref":"https://www.anthropic.com/engineering/building-effective-agents"},{"n":57,"stem":["特許調査を専門とする法律事務所は、Claude Agent SDKを使用してマルチエージェントリサーチシステムを構築しています。コーディネーターエージェントが、専門サブエージェントに作業を委任します。サブエージェントには、ウェブを検索するもの、文書を分析するもの、調査結果を統合するもの、レポートを生成するものがあります。このシステムはトピックを調査し、出典を明記した包括的なレポートを作成します。","このシステムのコーディネーターは、MCPで実装されたWeb検索サブエージェントと文書分析サブエージェントにタスクを振り分けています。評価の過程で、次のような誤った振り分けが多く見られました。","ユーザーがアップロードした特許明細書PDFの分析を依頼しているのに、文献レビュー系のタスクをWeb検索サブエージェントに送る","最新動向の確認が必要なWeb系のタスクを、文書分析サブエージェントに送る","ツールの実装自体は、一度正しく呼び出されれば正常に動作します。"],"q":"ツール選択の信頼性を改善するために、このチームが最初に行うべきツール定義の変更はどれですか。（2つ選択してください。）","need":2,"opts":[{"t":"各リサーチターンで、結果をコーディネーターに返す前に必ずいずれか1つの利用可能なツールを呼び出すよう、モデルAPIを通じて強制する。","c":false,"e":["tool_choiceのanyで何らかのツール呼び出しを強制する方法は、ツールを使わずに答えてしまう問題への対策です。本問ではツールは呼ばれているものの呼び先を取り違えているため、呼び出しを強制しても正しいツールを選ぶ手がかりは増えません（Claude Opus 5.5などではanyの指定自体が400エラーになります）。"]},{"t":"各ツール定義を、想定される用途・想定されない用途・入力・返されるデータ・注意点を網羅した詳細な説明文に書き換える。","c":true,"e":["正解。公式ドキュメントは、ツールが何をするか、いつ使うべきか・使うべきでないか、各パラメータの意味、注意点や制限まで詳しく書いた説明文を、ツールの性能を左右する最重要の要素としています。用途と非用途を明記すれば、アップロード済みPDFの分析はWeb検索ではなく文書分析へ、最新動向の確認はその逆へ、という判断基準がモデルに伝わります。"]},{"t":"Webクエリ・PDF分析・引用検索それぞれについて、JSON Schemaのフィールド説明の中にリクエスト例を追加する。","c":false,"e":["input_examplesやフィールド説明内の入力例は、ネストしたオブジェクトや書式に厳しいパラメータを正しく埋めさせたいときに役立ちます。ただし効くのはツールが選ばれた後の引数の組み立てで、「どちらのツールを呼ぶべきか」という選択の混同は解消しません。"]},{"t":"各ツールの名前を、ライブのWeb検索結果を扱うのか、アップロードされた文書を扱うのかが分かる名前に変更する。","c":true,"e":["正解。ツール名は説明文と並んで、モデルがツールを見分ける主要な手がかりです。扱う対象（ライブのWeb検索結果か、アップロードされた文書か）が名前に表れていれば、文献レビューと最新動向の確認を取り違える余地が小さくなり、説明文の改善と組み合わせることで混同をさらに減らせます。"]}],"overall":["用途の近いツールが並ぶと、モデルは名前と説明文を頼りに呼び先を決めるため、そこがあいまいだと誤選択が起きます。公式のツール定義ガイドは、詳細な説明文（何をするか、いつ使い・いつ使わないか、返すデータ、注意点）を最重要の要素とし、あわせて意味の分かる名前付けを勧めています。","本問はツールの実装自体は正しく動くので、直すべきはツール定義の側で、説明文の充実と対象を示す名前への変更が正解です。","入力例の追加は選ばれた後の引数を整えるもので、呼び出しの強制は「どれを選ぶか」に影響しません。","症状が「誤ったツールの選択」なのか「正しいツールへの誤った入力」なのかを区別すると、効く対策がはっきりします。"],"ref":"https://platform.claude.com/docs/en/agents-and-tools/tool-use/define-tools"},{"n":58,"stem":["あなたは、カスタマーサポート業務を支援するAIエージェントを運用しています。チームはこのエージェントに、問い合わせごとに次のどの対応をとるかを判断させています。","問い合わせ内容を調査する","対応方針を立案する","直接返信を作成する","この判断ロジックは、カスタムコマンド/triageとして実装されています。しかし評価テストでは、「この件を確認して」「エラーを調べて」「この文面を改善できる？」のようなあいまいな依頼に対して、挙動に一貫性がありません。詳細なルールを文書化して追加しても、判断基準は安定していません。"],"q":"次に変更すべきことはどれですか。","need":1,"opts":[{"t":"計画作業を示唆しうる依頼では直接の返信作成を避ける、という強い指示を追加する。","c":false,"e":["強い禁止ルールは、特定の誤りを確実に避けたいときの手段になります。しかし一方向の強いルールを足すと、本来は直接返信で足りる依頼まで計画に振られるなど判断が逆側に偏り、あいまいな依頼を見分ける基準そのものは示されないため、一貫性は改善しません。"]},{"t":"調査・計画・直接返信のそれぞれを起動すべきフレーズを網羅的に列挙した、より長いチェックリストを追加する。","c":false,"e":["トリガーとなるフレーズの列挙は、入力の表現が限られている場合には分かりやすい振り分け規則です。しかし「この件を確認して」のようなあいまいな依頼は同じ言い回しでも文脈によって適切な対応が変わり、キーワードの網羅には際限がないうえ、初めて見る言い回しには対応できません。"]},{"t":"あいまいな依頼の類似例を2〜4件、選ぶべき対応と他案を退ける理由を添えてタグ付きで追加する。","c":true,"e":["正解。公式のプロンプトガイドは、少数の適切な例（few-shot）が出力の一貫性を高める確実な方法の1つだとし、例を＜example＞タグで指示と区別して示すよう勧めています。あいまいな依頼に対して「どの対応を選ぶか」と「なぜ他のもっともらしい選択肢ではないのか」を示せば、ルールの文章では伝わりにくい判断の境界が具体的に伝わります。"]},{"t":"タグ付けしていない過去のやりとりを大量に追加し、Claudeにチームの好みを推測させる。","c":false,"e":["大量の実例を与えるアプローチは、ファインチューニングや検索用のデータとしてなら意味を持つこともあります。しかしプロンプト内で、どの対応が正しかったかのタグも理由もない会話を大量に並べても、Claudeは何を手本にすべきか判断できず、コンテキストを消費するだけで境界の判断は安定しません。"]}],"overall":["ルールを文章で詳しく書いても判断が安定しないときは、判断の境界を「例」で示すのが効果的です。公式のベストプラクティスでは、実際の用途に近く多様な例を少数示すことが出力の形式や判断を安定させる確実な方法とされ、例は＜example＞タグで指示と区別して示すよう勧められています。","本問の/triageは「調査・計画・直接返信」を選ぶ分類タスクで、すでに詳細なルールがあるのにあいまいな依頼で揺れているため、類似のあいまいな依頼に対する正解の対応と、他案を退ける簡潔な理由をタグ付きで示すのが次の一手です。","タグのない大量データは手本にならず、一方向の強いルールは判断を偏らせ、フレーズの網羅は文脈の違いを扱えません。","ルールを足しても直らない分類の揺れには、境界上の具体例を与える選択肢を優先すると外しにくくなります。"],"ref":"https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices"},{"n":59,"stem":["あなたは、Claude Agent SDKを使用して、マルチエージェントの財務分析レポートシステムを構築しています。コーディネーターエージェントが、専門サブエージェントに作業を委任します。サブエージェントには、市場データを収集するもの、決算資料を分析するもの、知見を統合するもの、レポートを生成するものがあります。","このチームには、レポート中の主張を引用元と突き合わせて検証するようClaude Codeに依頼する、カスタムの/source-checkスラッシュコマンドがあります。あるエンジニアがsource-check.mdを~/.claude/commands/の下に保存しています。このコマンドは本人には使えますが、リポジトリをクローンしたチームメイトには使えません。"],"q":"同じコマンドをリポジトリから利用できるようにするために、チームが行うべきことはどれですか。","need":1,"opts":[{"t":"source-check.mdを~/.claude/commands/に保持したまま、プロジェクトのREADMEにこのコマンドを文書化する。","c":false,"e":["~/.claude/commands/はユーザー個人のコマンドの置き場で、自分のすべてのプロジェクトで使いたいコマンドに向いています。READMEで存在を知らせても、ファイル自体はそのエンジニアのホームディレクトリにしかないため、クローンしたチームメイトの環境ではコマンドとして使えません。"]},{"t":"source-checkの指示をルートのCLAUDE.mdに追加し、手動で呼び出す。","c":false,"e":["CLAUDE.mdに手順を書くと、毎回の会話でその内容が文脈として読み込まれます。しかしスラッシュコマンドとして/source-checkで呼び出せるわけではなく、使わない会話でも常にコンテキストを消費するため、同じコマンドをチームで使うという要件を満たしません。"]},{"t":"source-check.mdを.claude/commands/に保持しつつ、.claudeディレクトリをバージョン管理から除外する。","c":false,"e":[".claude配下の一部をgitから除外する運用は、settings.local.jsonのような個人用の設定を共有しないために使われます。ディレクトリ全体を除外するとコマンドファイルがリポジトリに含まれず誰にも共有されないため、目的と正反対の結果になります。"]},{"t":"source-check.mdをリポジトリ内の.claude/commands/に移動し、そのファイルをコミットする。","c":true,"e":["正解。リポジトリ内の.claude/commands/（または.claude/skills/＜名前＞/SKILL.md）に置いたファイルはプロジェクトスコープの設定として扱われ、コミットすればクローンした全員が同じ/source-checkを使えます。個人スコープかプロジェクトスコープかは、ファイルがホームディレクトリとリポジトリのどちらにあるかで決まります。"]}],"overall":["Claude Codeのカスタムコマンドとスキルは、置き場所によって誰が使えるかが決まります。~/.claude/commands/や~/.claude/skills/は個人スコープで自分のすべてのプロジェクトで使え、リポジトリ内の.claude/commands/や.claude/skills/はプロジェクトスコープで、コミットすればチームで共有されます（現在はコマンドとスキルは同じ扱いで、新規作成にはスキルが推奨されています）。","本問はエンジニア個人のホームディレクトリに置かれたコマンドをチームメイトも使えるようにしたいので、リポジトリ内の.claude/commands/へ移してコミットするのが正解です。","READMEでの周知はファイルを共有せず、.claudeの除外は共有を不可能にし、CLAUDE.mdへの記載はコマンドとして呼び出せません。"],"ref":"https://code.claude.com/docs/en/skills"},{"n":60,"stem":["動画配信プラットフォームを開発する企業は、Claude Codeをコードレビュー自動化パイプラインに統合しています。このシステムは、プルリクエストごとに自動レビューを実行し、テストケースを生成し、具体的で実行可能なフィードバックを返します。誤検知を最小限に抑えるプロンプトを設計する必要があります。","あるPRのレビュー中に、メインセッションは変更されたファイルを読み取り、失敗しているテストに気づきました。そのうえで、fork（会話を引き継ぐ方式）ではなく、通常の名前付きのセキュリティレビュー用サブエージェントに作業を委任しました。","このサブエージェントは一般的な指摘しか返さず、差分やテスト出力から得られるはずのPR固有の証拠を見落としていました。"],"q":"レビューの信頼性を最も直接的に改善できる変更はどれですか。（2つ選択してください。）","need":2,"opts":[{"t":"通常の名前付きサブエージェントではなくforkで委任し、親の会話を引き継いだ状態から分岐させる。","c":true,"e":["正解。forkは親の会話全体（システムプロンプト、ツール、メッセージ履歴）を引き継いで起動するサブエージェントです。メインセッションが読んだ変更ファイルや失敗したテストの文脈を持ったままレビューでき、途中のツール呼び出しはforkの中にとどまって最終結果だけが戻るため、メインのコンテキストも汚れません。"]},{"t":"レビュー結果を生成する前に、親の会話のトランスクリプトを読み取るようサブエージェントに指示する。","c":false,"e":["必要な情報をサブエージェント自身に取りに行かせる設計は、ファイルやログのように共有された場所にある情報なら成り立ちます。しかし通常のサブエージェントには親の会話履歴を読む手段がなく、受け取るのは委任時のプロンプト文字列だけなので、指示しても親が読んだ差分やテスト結果には到達できません。"]},{"t":"変更ファイルと差分の抜粋、失敗したテストの出力、レビュー基準をサブエージェントのプロンプトに含める。","c":true,"e":["正解。通常の名前付きサブエージェントは新しいコンテキストで起動し、親から受け取るのは委任時のプロンプトだけです。変更ファイル、差分の抜粋、失敗したテストの出力、レビュー基準を明示的にプロンプトへ含めれば、サブエージェントはPR固有の証拠に基づいてレビューでき、一般論の指摘に終わりません。"]},{"t":"名前付きサブエージェントを新規に呼び出し、それ以前のCIステップから引き継いだ記録済みのトランスクリプトに頼る。","c":false,"e":["名前付きサブエージェントには以前の実行を再開する機能もありますが、今回のように新規に起動した呼び出しは以前のCIステップのトランスクリプトを自動では引き継ぎません。そのため、このPRの差分や失敗したテストの出力は依然としてサブエージェントに届かず、一般的な指摘しか返らない状況は変わりません。"]}],"overall":["Claude Codeのサブエージェントは原則として新しいコンテキストで起動し、親の会話履歴を見ません。公式ドキュメントも、親からサブエージェントに渡るのは委任時のプロンプト文字列だけなので、必要なファイルパスやエラーメッセージ、判断はそのプロンプトに直接含めるよう説明しています。例外がforkで、親の会話をそのまま引き継いで分岐します。","したがって、PR固有の証拠をプロンプトに明示して渡すことと、forkで委任することの2つが正解です。前者は継承に頼らずに情報を渡す方法、後者は継承そのものを使う方法という違いがあります。","誤答はどちらも「通常のサブエージェントでも親の文脈や過去のトランスクリプトに届く」という前提に立っており、その前提が成り立ちません。","サブエージェントの設問では、委任先が起動時に何を持っているかを先に確認すると正誤を判断しやすくなります。"],"ref":"https://code.claude.com/docs/en/sub-agents"}]</script>
<script>
(function(){
  var Q = JSON.parse(document.getElementById('qdata').textContent);
  var N = Q.length;
  var LET = ['ア','イ','ウ','エ','オ'];
  var KEY = 'claude-arch-quiz-2-v1';
  var st = { cur: 0, ans: {}, view: 'quiz' };
  var main = document.getElementById('main');
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- 保存と復元（失敗しても動作に影響しない） ---------- */
  try {
    var raw = localStorage.getItem(KEY);
    if (raw) {
      var o = JSON.parse(raw);
      if (o && typeof o === 'object') {
        var c = parseInt(o.cur, 10);
        if (!isNaN(c)) st.cur = Math.min(Math.max(c, 0), N - 1);
        if (o.ans && typeof o.ans === 'object') {
          Q.forEach(function(q){
            var a = o.ans[q.n];
            if (a && Array.isArray(a.sel)) {
              var sel = a.sel.filter(function(i){ return Number.isInteger(i) && i >= 0 && i < q.opts.length; });
              sel = sel.filter(function(v, k){ return sel.indexOf(v) === k; }).slice(0, q.need);
              var checked = !!a.checked && sel.length === q.need;
              st.ans[q.n] = { sel: sel, checked: checked };
            }
          });
        }
      }
    }
  } catch (e) {}
  function save(){ try { localStorage.setItem(KEY, JSON.stringify({ cur: st.cur, ans: st.ans })); } catch (e) {} }

  /* ---------- 小道具 ---------- */
  function el(tag, attrs, kids){
    var n = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function(k){
      if (k === 'class') n.className = attrs[k];
      else if (k === 'text') n.textContent = attrs[k];
      else n.setAttribute(k, attrs[k]);
    });
    (kids || []).forEach(function(c){ if (c) n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return n;
  }
  function isItem(t){ return !/[。！？!?]$/.test(t) && t.length <= 90 && t.indexOf('\n') < 0; }
  function blocks(paras, parent){
    var ul = null;
    paras.forEach(function(p){
      if (isItem(p)) {
        if (!ul) { ul = el('ul'); parent.appendChild(ul); }
        ul.appendChild(el('li', { text: p }));
      } else { ul = null; parent.appendChild(el('p', { text: p })); }
    });
  }
  function plain(paras, parent){ paras.forEach(function(p){ parent.appendChild(el('p', { text: p })); }); }
  function isCorrect(q, sel){
    if (sel.length !== q.need) return false;
    return q.opts.every(function(o, i){ return o.c === (sel.indexOf(i) >= 0); });
  }
  function statusOf(q){
    var a = st.ans[q.n];
    if (!a) return 'none';
    if (a.checked) return isCorrect(q, a.sel) ? 'ok' : 'ng';
    return a.sel.length ? 'sel' : 'none';
  }
  function letters(q, idxs){
    return idxs.slice().sort(function(a, b){ return a - b; }).map(function(i){ return LET[i]; }).join('・');
  }
  function toTop(){ window.scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' }); }

  /* ---------- サイドバー ---------- */
  function renderSide(){
    var ok = 0, ng = 0;
    Q.forEach(function(q){ var s = statusOf(q); if (s === 'ok') ok++; else if (s === 'ng') ng++; });
    var done = ok + ng;
    var sc = document.getElementById('score');
    sc.textContent = '';
    sc.appendChild(document.createTextNode('回答済み '));
    sc.appendChild(el('b', { text: done + ' / ' + N }));
    sc.appendChild(document.createTextNode('　正解 '));
    sc.appendChild(el('b', { text: String(ok) }));
    document.getElementById('barfill').style.width = (done / N * 100) + '%';
    var grid = document.getElementById('grid');
    grid.textContent = '';
    Q.forEach(function(q, i){
      var s = statusOf(q);
      var label = '問題' + q.n + (s === 'ok' ? ' 正解' : s === 'ng' ? ' 不正解' : s === 'sel' ? ' 選択中' : ' 未回答');
      var b = el('button', { type: 'button', class: 'dot', 'data-s': s, 'aria-label': label, text: String(q.n) });
      if (st.view === 'quiz' && i === st.cur) b.setAttribute('aria-current', 'true');
      b.addEventListener('click', function(){ go(i); });
      grid.appendChild(b);
    });
  }

  /* ---------- 問題画面 ---------- */
  function renderQuestion(){
    var q = Q[st.cur];
    var a = st.ans[q.n] || { sel: [], checked: false };
    var multi = q.need > 1;
    main.textContent = '';
    var sheet = el('section', { class: 'sheet', 'aria-label': '問題' + q.n });

    var head = el('div', { class: 'qhead' }, [
      el('span', { class: 'qno', text: '問題 ' + q.n }),
      el('span', { class: 'qtotal', text: '／ ' + N }),
      multi ? el('span', { class: 'tag', text: '複数選択（' + q.need + 'つ）' }) : null
    ]);
    sheet.appendChild(head);

    var stem = el('div', { class: 'stem' });
    blocks(q.stem, stem);
    sheet.appendChild(stem);
    sheet.appendChild(el('p', { class: 'prompt', text: q.q }));

    var correctNow = a.checked && isCorrect(q, a.sel);
    if (a.checked) {
      var cls = correctNow ? 'banner ok' : 'banner ng';
      var correctIdx = []; q.opts.forEach(function(o, i){ if (o.c) correctIdx.push(i); });
      var banner = el('div', { class: cls, id: 'banner', tabindex: '-1', role: 'status' }, [
        el('h2', { text: correctNow ? '正解です' : '不正解です' }),
        el('p', { text: correctNow
          ? '選んだ答え：' + letters(q, a.sel)
          : '正解は ' + letters(q, correctIdx) + ' です。あなたの回答：' + letters(q, a.sel) })
      ]);
      sheet.appendChild(banner);
    }

    var ol = el('ol', { class: 'opts' + (multi ? ' multi' : ''), role: multi ? 'group' : 'radiogroup', 'aria-label': '選択肢' });
    var btns = [];
    q.opts.forEach(function(o, i){
      var picked = a.sel.indexOf(i) >= 0;
      var li = el('li', { class: 'opt' + (a.checked ? (o.c ? ' ok' : ' ng') + (picked ? ' picked' : '') : '') });
      var b = el('button', {
        type: 'button',
        class: 'choice' + (picked && !a.checked ? ' on' : ''),
        role: multi ? 'checkbox' : 'radio',
        'aria-checked': picked ? 'true' : 'false'
      }, [
        el('span', { class: 'mark', 'aria-hidden': 'true', text: LET[i] }),
        el('span', { class: 'txt', text: o.t })
      ]);
      if (a.checked) {
        b.setAttribute('aria-disabled', 'true');
        var meta = el('span', { class: 'meta' }, [
          o.c ? el('span', { class: 'pill ok', text: '✓ 正解の選択肢' }) : el('span', { class: 'pill ng', text: '✕ 誤りの選択肢' }),
          picked ? el('span', { class: 'pill me', text: 'あなたの回答' }) : null
        ]);
        b.appendChild(meta);
        b.addEventListener('click', function(e){ e.preventDefault(); });
      } else {
        b.addEventListener('click', function(){ pick(i); });
      }
      btns.push(b);
      li.appendChild(b);
      if (a.checked) {
        var why = el('div', { class: 'why' }, [ el('h3', { text: '解説' }) ]);
        plain(o.e, why);
        li.appendChild(why);
      }
      ol.appendChild(li);
    });
    sheet.appendChild(ol);

    var hint = el('p', { class: 'hint', id: 'hint', 'aria-live': 'polite' });
    if (!a.checked) sheet.appendChild(hint);

    if (a.checked) {
      var ov = el('section', { class: 'overall', 'aria-label': '全体的な説明' }, [ el('h2', { text: '全体的な説明' }) ]);
      blocks(q.overall, ov);
      if (q.ref) {
        var r = el('p', { class: 'ref' }, [ document.createTextNode('参考：') ]);
        var link = el('a', { href: q.ref, target: '_blank', rel: 'noopener noreferrer', text: q.ref });
        r.appendChild(link);
        ov.appendChild(r);
      }
      sheet.appendChild(ov);
    }

    /* 操作ボタン */
    var prev = el('button', { type: 'button', class: 'btn', text: '前の問題' });
    if (st.cur === 0) prev.disabled = true;
    prev.addEventListener('click', function(){ go(st.cur - 1); });

    var right = el('div', { class: 'grow' });
    var primary;
    if (!a.checked) {
      primary = el('button', { type: 'button', class: 'btn primary', id: 'btnCheck', text: '回答を確認' });
      primary.disabled = a.sel.length !== q.need;
      primary.addEventListener('click', check);
      right.appendChild(primary);
    } else {
      var retry = el('button', { type: 'button', class: 'btn', text: 'この問題をやり直す' });
      retry.addEventListener('click', function(){ delete st.ans[q.n]; save(); render(); });
      right.appendChild(retry);
      var last = st.cur === N - 1;
      primary = el('button', { type: 'button', class: 'btn primary', text: last ? '結果を見る' : '次の問題へ' });
      primary.addEventListener('click', function(){ if (last) showResult(); else go(st.cur + 1); });
      right.appendChild(primary);
    }
    sheet.appendChild(el('div', { class: 'actions' }, [ prev, right ]));
    main.appendChild(sheet);

    /* 選択状態の更新（再描画せず、フォーカスを保つ） */
    function paint(){
      var cur = st.ans[q.n] || { sel: [], checked: false };
      btns.forEach(function(b, i){
        var on = cur.sel.indexOf(i) >= 0;
        b.setAttribute('aria-checked', on ? 'true' : 'false');
        b.classList.toggle('on', on);
      });
      var cb = document.getElementById('btnCheck');
      if (cb) cb.disabled = cur.sel.length !== q.need;
      hint.textContent = multi
        ? q.need + 'つ選んでください（現在 ' + cur.sel.length + ' / ' + q.need + '）'
        : (cur.sel.length ? '' : '1つ選んでください');
      renderSide();
    }
    function pick(i){
      var cur = st.ans[q.n];
      if (cur && cur.checked) return;
      if (!cur) { cur = { sel: [], checked: false }; st.ans[q.n] = cur; }
      if (!multi) { cur.sel = [i]; }
      else {
        var k = cur.sel.indexOf(i);
        if (k >= 0) cur.sel.splice(k, 1);
        else if (cur.sel.length < q.need) cur.sel.push(i);
        else { hint.textContent = '選べるのは' + q.need + 'つまでです。選択を外してから選び直してください。'; return; }
      }
      save();
      paint();
    }
    function check(){
      var cur = st.ans[q.n];
      if (!cur || cur.sel.length !== q.need) return;
      cur.checked = true;
      save();
      render();
      var bn = document.getElementById('banner');
      if (bn) {
        bn.scrollIntoView({ block: 'start', behavior: reduce ? 'auto' : 'smooth' });
        bn.focus({ preventScroll: true });
      }
    }
    if (!a.checked) paint();
  }

  /* ---------- 結果画面 ---------- */
  function renderResult(){
    var ok = [], ng = [], un = [];
    Q.forEach(function(q, i){
      var s = statusOf(q);
      if (s === 'ok') ok.push(i); else if (s === 'ng') ng.push(i); else un.push(i);
    });
    var done = ok.length + ng.length;
    main.textContent = '';
    var sheet = el('section', { class: 'sheet result', 'aria-label': '結果' });
    sheet.appendChild(el('h2', { text: done === 0 ? 'まだ回答がありません' : N + '問中 ' + ok.length + '問 正解' }));
    if (done > 0) {
      var pct = Math.round(ok.length / done * 100);
      sheet.appendChild(el('p', { class: 'lead', text: '回答済み ' + done + '問のうち ' + ok.length + '問が正解（正答率 ' + pct + '%）。' + (un.length ? '未回答は ' + un.length + '問です。' : '') }));
    } else {
      sheet.appendChild(el('p', { class: 'lead', text: '問題を解くと、ここに結果がまとまります。' }));
    }
    if (ng.length) {
      sheet.appendChild(el('h3', { text: '不正解だった問題' }));
      var c1 = el('div', { class: 'chips' });
      ng.forEach(function(i){
        var b = el('button', { type: 'button', class: 'chip', text: '問題' + Q[i].n });
        b.addEventListener('click', function(){ go(i); });
        c1.appendChild(b);
      });
      sheet.appendChild(c1);
    }
    if (un.length && done > 0) {
      sheet.appendChild(el('h3', { text: '未回答の問題' }));
      var c2 = el('div', { class: 'chips' });
      un.forEach(function(i){
        var b = el('button', { type: 'button', class: 'chip un', text: '問題' + Q[i].n });
        b.addEventListener('click', function(){ go(i); });
        c2.appendChild(b);
      });
      sheet.appendChild(c2);
    }
    var acts = el('div', { class: 'actions' });
    var back = el('button', { type: 'button', class: 'btn', text: '問題に戻る' });
    back.addEventListener('click', function(){ go(st.cur); });
    var grow = el('div', { class: 'grow' });
    if (ng.length) {
      var redo = el('button', { type: 'button', class: 'btn primary', text: '不正解の問題を解き直す' });
      redo.addEventListener('click', function(){
        ng.forEach(function(i){ delete st.ans[Q[i].n]; });
        go(ng[0]);
      });
      grow.appendChild(redo);
    }
    acts.appendChild(back);
    acts.appendChild(grow);
    sheet.appendChild(acts);
    main.appendChild(sheet);
  }

  /* ---------- 画面遷移 ---------- */
  function render(){
    renderSide();
    if (st.view === 'result') renderResult(); else renderQuestion();
  }
  function go(i){
    st.cur = Math.min(Math.max(i, 0), N - 1);
    st.view = 'quiz';
    save();
    render();
    toTop();
  }
  function showResult(){ st.view = 'result'; render(); toTop(); }

  document.getElementById('btnResult').addEventListener('click', showResult);
  var rb = document.getElementById('btnReset');
  var rbTimer = null;
  rb.addEventListener('click', function(){
    if (rb.getAttribute('data-arm') === '1') {
      clearTimeout(rbTimer);
      rb.removeAttribute('data-arm');
      rb.textContent = '最初からやり直す';
      st.ans = {}; st.cur = 0; st.view = 'quiz';
      save(); render(); toTop();
    } else {
      rb.setAttribute('data-arm', '1');
      rb.textContent = 'もう一度押すと全回答を消去';
      rbTimer = setTimeout(function(){ rb.removeAttribute('data-arm'); rb.textContent = '最初からやり直す'; }, 4000);
    }
  });
  if (window.innerWidth < 860) document.getElementById('navd').removeAttribute('open');

  render();
})();
</script>
</body>
</html>
