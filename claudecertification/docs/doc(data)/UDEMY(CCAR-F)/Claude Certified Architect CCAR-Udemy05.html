い申請は\"other\"と詳細の文字列で表せば、新しい区分を既存の区分に無理に押し込まずに済みます。"},{"text":"当てはまる区分がなかった申請を定期的に集計し、件数の多いものはenumの正式な値に加える。","explanation":"正解。既存の3区分に当てはまらなかった申請の内容を定期的に集計すると、どのような新しい区分がどれだけ届いているかが分かります。件数の多い区分を正式なenumの値に加えていけば、新しい区分が年に数種類ずつ増えても、スキーマを根拠のある形で拡張し続けられ、下流の審査システムも決まった値で処理できます。"},{"text":"申請区分のenumをやめて自由記述の文字列にし、書類に書かれた区分名をそのまま返させる。","explanation":"自由記述にすれば無理な分類はなくなりますが、「授業料減免」「授業料の減免」のような表記の揺れがそのまま下流に流れ、審査システムで区分ごとの処理ができなくなります。既存の区分を決まった値で扱えるという、enumの利点も失われます。"},{"text":"プロンプトに「3つの区分のうち最も近いものを必ず選ぶ」と書き足し、分類のぶれを減らす。","explanation":"「最も近いものを必ず選ぶ」という指示は、現在起きている誤分類をむしろ強めます。enumに当てはまる値がない以上、モデルは最も近い値を選ぶしかなく、留学支援の申請が授業料減免として登録される問題はなくなりません。"}],"answer":[0,1],"overall":"JSONスキーマのenumを、拡張可能な分類として設計する方法がテーマです。ガイドは、スキーマ設計の考慮事項として、拡張可能なカテゴリのために、enumに\"other\"と詳細を入れる文字列フィールドを組み合わせる設計を挙げています。\n\nenumに定義していない値が入力に現れると、モデルは既存の値のどれかを選ばざるをえず、本問のように新しい区分が既存の区分に誤って分類されます。\"other\"を用意すれば、当てはまらないことをそのまま表現でき、詳細の文字列で内容も失われません。さらに、新しい区分が増え続けるという条件から、\"other\"に入った内容を定期的に分析して、正式な値に取り込む運用が必要になります。正解の2つは、スキーマの設計と、その後の拡張の運用という組み合わせです。\n\n誤答の見分け方は、決まった値による下流での扱いやすさと、想定外の値への対応を両立しているかどうかです。自由記述は前者を失い、「必ず選ぶ」という指示は後者を失います。\n\n本番では、あいまいで判断できない書類のために\"unclear\"のような値を別に用意し、人間のレビューに回すことも検討します。\n\n参考: https://platform.claude.com/docs/en/build-with-claude/structured-outputs"},{"id":38,"scenario":"エージェントアーキテクチャとオーケストレーション","situation":"あるゲーム会社は、Claude Agent SDKで開発者の生産性向上ツールを作り、クラッシュ報告の調査に使っています。エージェントは3つのMCPサーバーからデータを取得し、各サーバーの応答の形式は次のとおりです。\n\nクラッシュ収集サービスは、時刻をUnixミリ秒で返す\n\nビルドサーバーは、時刻を+09:00付きのISO 8601で返す\n\nマッチングサーバーは、ステータスを3や7のような数値のコードで返す\n\n3つとも外部のサービスで、応答の形式は変更できません。\n\nログによると、調査の11%で、エージェントが「ビルドの配布後にクラッシュが増えた」のように、イベントの前後関係を誤って判断していました。システムプロンプトには時刻の形式を説明する文章がありますが、誤りは減っていません。","question":"最も信頼性の高い対策はどれですか。","choices":[{"text":"3つのサーバーの応答をそのまま1つのツール結果に連結し、時系列の判断はClaudeに任せる。","explanation":"応答を1つにまとめても、形式がばらばらなことは変わらず、前後関係の判断はClaudeに任されたままです。連結によってツール結果が長くなり、かえって比較を誤りやすくなるおそれもあります。"},{"text":"PostToolUseフックで、時刻とステータスの形式をClaudeが受け取る前に統一する。","explanation":"正解。PostToolUseフックは、ツールの結果をモデルが処理する前にインターセプトして変換できます。Agent SDKではupdatedToolOutputでツールの出力を置き換えられるため、すべての時刻をUTCのISO 8601にそろえ、数値のステータスを名称に変換してから渡せば、Claudeは形式の違いを意識せずに前後関係を判断できます。"},{"text":"システムプロンプトに各サーバーの時刻の形式とステータスの対応表を載せ、変換してから判断させる。","explanation":"対応表を載せると、変換の手がかりは増えます。しかし、変換するかどうかはモデルが指示に従うかに左右される確率的な遵守で、すでにプロンプトで説明しても誤りが減っていません。大量のイベントを毎回正確に換算させること自体も、誤りの原因になります。"},{"text":"PreToolUseフックで各ツールの入力に出力形式の指定を加え、サーバーにISO 8601で返させる。","explanation":"PreToolUseフックは、ツールの入力を変更したり、呼び出しを拒否したりするためのフックです。ただし、入力に出力形式の指定を加えても、サーバーがその指定に対応していなければ応答は変わりません。本問のサーバーは外部のサービスで、応答の形式は変更できません。"}],"answer":[1],"overall":"ツールの結果を正規化するためのPostToolUseフックがテーマです。ガイドは、エージェントが処理する前に、異なるMCPツールから返されるばらばらなデータ形式（Unixタイムスタンプ、ISO 8601、数値のステータスコード）を正規化するPostToolUseフックを実装することを、スキルとして挙げています。フックはアプリケーションのコードとして決定論的に動くため、プロンプトでの説明のように、変換するかどうかがモデル次第になることはありません。Agent SDKのPostToolUseフックでは、additionalContextで情報を付け加えるだけでなく、updatedToolOutputでツールの出力そのものを置き換えられます。\n\n本問の決め手は、サーバーが外部のサービスで形式を変えられないことと、プロンプトでの説明では誤りが減らなかったことです。前者でサーバー側での統一が、後者でプロンプトの強化が外れ、残るのはツールの結果がClaudeに届く手前での変換です。\n\nPreToolUseフックは呼び出しの前に働くため、返ってくる結果の形式は変えられません。\n\n本番では、正規化前の値もログに残しておくと、変換の誤りを後から検証できます。\n\n参考: https://code.claude.com/docs/en/agent-sdk/hooks"},{"id":39,"scenario":"Claude Codeの設定とワークフロー","situation":"ある精密機器メーカーの開発チームは、夜間のCIジョブで、Claude Codeに前日の変更に対するテストを生成させています。ジョブのスクリプトはclaude -pで実行しており、終わると標準出力の文章から「N件のテストを生成しました」という部分を正規表現で拾い、生成件数と対象ファイルを集計しています。\n\nこの1か月で、次の2つの問題が起きました。\n\n認証の設定が切れてテストが1件も生成されなかった日に、スクリプトがその実行を成功として扱い、後続のジョブに進んだ\n\nClaudeの書き方が「テストを3件追加しました」のように変わるたびに正規表現が一致せず、集計が壊れる","question":"このCIジョブで適切な対応はどれですか。（2つ選択してください。）","choices":[{"text":"プロンプトで「最後に『生成件数: N』の形式で書くこと」と指示し、その行を正規表現で拾うようにする。","explanation":"出力の書式をプロンプトで指定する方法は、人が読むレポートの体裁をそろえる場面では有効です。しかし、Claudeが指示どおりの形式で書くかどうかは確率的で、書き方が少し変わるだけで正規表現は再び一致しなくなります。また、認証切れのように実行そのものが失敗した場合は、指定した行が出力されないため、失敗の検知にもなりません。"},{"text":"claudeの終了コードを確認し、0以外であればジョブを失敗として扱う。","explanation":"正解。非対話モードのClaude Codeは、成功すると終了コード0、実行が失敗すると0以外の終了コードで終了するため、スクリプトはその値で分岐できます。認証が見つからないといった実行中の失敗は、その内容が結果として標準出力に書かれますが、文章を読まなくても終了コードで判定できます。0以外ならジョブを失敗にすれば、テストが生成されなかった実行を後続のジョブに渡さずに済みます。"},{"text":"--output-format jsonと--json-schemaで、結果を構造化して受け取る。","explanation":"正解。--output-format jsonを付けると、結果はセッションIDなどのメタデータを含むJSONで返されます。さらに--json-schemaでスキーマを指定すれば、生成件数や対象ファイルをスキーマに沿ったstructured_outputのフィールドとして受け取れるため、Claudeの文章の書き方が変わっても、後続のジョブの解析は壊れません。"},{"text":"--max-turnsの値を引き上げ、途中で打ち切られずにテストの生成を最後まで続けさせる。","explanation":"--max-turnsは、非対話モードでエージェントが行うターンの数に上限を設けるフラグで、既定では上限がありません。本問の失敗は、ターン数の上限で打ち切られたことではなく、認証切れで実行そのものが失敗したことと、出力の解析方法が不安定なことです。上限を引き上げても、どちらの問題も解消しません。"}],"answer":[1,2],"overall":"Claude CodeをCI/CDパイプラインに組み込むときの、実行結果の受け取り方がテーマです。ガイドは、CIのコンテキストで構造化出力を強制するための--output-format jsonと--json-schemaを知識として挙げています。公式ドキュメントによると、claude -pは成功すると終了コード0、実行が失敗すると0以外で終了するため、スクリプトは終了ステータスで分岐できます。また、--output-format jsonと--json-schemaを併用すると、スキーマに沿った出力がstructured_outputフィールドに入ります。\n\n本問の1つ目の問題は、終了コードを確認せずに後続のジョブへ進んだこと、2つ目は、集計に使う値を人向けの文章から拾っていたことです。正解の2つは、成否を終了コードで判定し、集計に使う値は構造化された出力から読むという、機械が使う情報を機械が読める形で受け取る対策です。\n\n誤答の見分け方は、Claudeの文章の書き方に頼っていないかどうかです。プロンプトで書式を指定しても書き方の揺れは確率的に残り、--max-turnsはどちらの問題とも関係がありません。\n\n本番では、構造化出力に生成したテストのファイル名も含めておくと、後続のジョブで実際にファイルが作られたかを突き合わせられます。\n\n参考: https://code.claude.com/docs/en/headless"},{"id":40,"scenario":"ツール設計とMCP統合","situation":"ある人材紹介会社は、構造化データ抽出システムを運用しています。このシステムは、応募者から届く履歴書（PDF）から職歴・スキル・希望条件を抽出し、JSONスキーマで検証したうえで候補者データベースに登録します。抽出はサブエージェントが担当しており、現在はシステム全体の18個のツールをすべて利用できる設定です。\n\nログを確認したところ、次のことが分かりました。\n\n抽出サブエージェントが、検証前のデータを候補者データベースへ直接書き込む呼び出しが週40件ある\n\n応募先企業の情報をウェブ検索する呼び出しが、1件あたり平均3回発生している\n\n抽出の約6割で職種コードマスタの照会が必要で、現在はそのたびにコーディネーターへ処理を戻している","question":"抽出サブエージェントのツール構成として適切な変更はどれですか。（2つ選択してください。）","choices":[{"text":"抽出サブエージェントのツールを、文書の読み取りと抽出結果の提出に必要なものだけに絞る。","explanation":"正解。エージェントに多くのツールを与えると選択の判断が複雑になり、専門外のツールを誤用しがちになります。抽出サブエージェントの役割は文書を読んで結果を提出することなので、そのためのツールだけに絞れば、データベースへの直接の書き込みや不要なウェブ検索は選択肢から消えます。"},{"text":"職種コードマスタを含む候補者データベース全体への読み書き権限を抽出サブエージェントに与える。","explanation":"データベースへの広い権限を与えると照会のための往復はなくなりますが、抽出役に書き込みまで許すことになり、今回問題になっている検証前の書き込みをかえって助長します。頻度の高いニーズには、必要な範囲だけに絞った役割横断のツールを用意するのが原則です。"},{"text":"職種コードマスタだけを照会できる、読み取り専用のlookup_job_codeツールを追加する。","explanation":"正解。職種コードの照会は抽出の約6割で発生する、頻度の高い特定のニーズです。このようなニーズには、役割横断のツールを限定的に与えるのが適切です。マスタの照会だけができる読み取り専用のツールにすれば、コーディネーターとの往復を減らしつつ、データの変更につながる操作は与えずに済みます。"},{"text":"ツール構成は変えずに、システムプロンプトで「候補者データベースへの書き込みとウェブ検索は行わない」と指示する。","explanation":"プロンプトでの禁止は、ツールの使い方の方針を伝える場面では役立ちます。しかし、指示に従うかどうかは確率的で、検証前の書き込みのように起きてはならない操作を確実には防げません。使わせたくないツールは、そもそもツールセットに含めないほうが確実です。"}],"answer":[0,2],"overall":"エージェント間のツール配分と、スコープを限定したツールアクセスがテーマです。ガイドは、各エージェントにはその役割に必要なツールのみを与え、頻度の高い特定のニーズに対しては役割横断のツールを限定的に与えることを原則としています。ツールが多すぎると判断が複雑になって選択の信頼性が下がり、専門外のツールを持つエージェントはそれを誤用しがちです。\n\n本問のログはまさにその症状で、抽出役が書き込みやウェブ検索まで行っています。一方、職種コードの照会は役割の中で頻繁に必要になるため、すべてを取り上げるとコーディネーターとの往復が増えます。そこで、ツールを役割に絞り込む変更と、照会に限定した読み取り専用ツールの追加を組み合わせます。\n\n誤答の見分け方は、制御が確実か、権限が必要最小限かの2点です。プロンプトでの禁止は確実性に欠け、データベース全体への読み書き権限は広すぎます。\n\nAgent SDKでは、AgentDefinitionのtoolsでサブエージェントごとに使えるツールを指定できます。本番では、ツールの呼び出しログを定期的に確認し、役割に合わない呼び出しが出ていないかを監視します。\n\n参考: https://code.claude.com/docs/en/agent-sdk/subagents"},{"id":41,"scenario":"プロンプトエンジニアリングと構造化出力","situation":"ある小売チェーンのEC開発チームは、プルリクエストをClaude Codeで自動レビューし、指摘ごとにcritical・major・minorの重大度を付けてコメントしています。重大度の定義は、レビューのシステムプロンプトに「影響の大きさに応じて判断すること」とだけ書かれています。\n\n直近の監査では、次のような判定の揺れが見つかりました。\n\n決済金額を計算する関数のnullチェック漏れが、あるPRではcritical、別のPRではminorと判定されていた\n\n変数名の表記揺れがmajorと判定された例もあった\n\n開発者の間では、重大度を見ずにコメントを読み流す傾向が広がっています。","question":"重大度の判定を一貫させるために、最も効果的な対策はどれですか。","choices":[{"text":"システムプロンプトに「重大度は慎重に判断し、迷った場合は低いほうを選ぶ」と追記する。","explanation":"「慎重に」「迷ったら低いほう」といった一般的な指示は、具体的なカテゴリ別の基準と比べて、精度の向上につながりにくいとされています。迷う場面を減らす情報を与えていないため、決済の欠陥まで低い重大度に寄せてしまうおそれもあります。"},{"text":"各指摘に重大度とあわせて確信度を出力させ、確信度が0.8以上の指摘だけを投稿する。","explanation":"確信度によるフィルタリングは投稿する指摘の数を減らしますが、重大度の判定基準があいまいなことは変わりません。確信度の高い指摘の中でも、同じnullチェック漏れにcriticalとminorが付く揺れは残ります。"},{"text":"重大度ごとの判定条件を、具体的なコード例とともにシステムプロンプトに追記する。","explanation":"正解。ガイドは、一貫した分類を実現するために、重大度レベルごとに具体的なコード例を伴う明示的な重大度基準を定義することを挙げています。「決済金額や認可に影響する欠陥はcritical」「命名の不統一はminor」のように条件とコード例を示せば、同じ種類の問題には同じ重大度が付き、PRごとの揺れがなくなります。"},{"text":"重大度を「重要」と「その他」の2段階に減らし、判定に迷いが生じる余地を小さくする。","explanation":"段階を減らせば揺れの幅は小さくなりますが、何を「重要」とするかの基準がなければ、決済のnullチェック漏れが「その他」に入る誤りは防げません。区分の数ではなく、区分ごとの判定基準が欠けていることが問題です。"}],"answer":[2],"overall":"明示的な基準で精度を高め、誤検知を減らすプロンプト設計がテーマです。ガイドは、あいまいな指示よりも明示的な基準が重要であること、そして一貫した分類を実現するために、重大度レベルごとに具体的なコード例を伴う明示的な重大度基準を定義することを挙げています。\n\n本問の「影響の大きさに応じて判断する」という指示は、何をもって影響が大きいとするかを定めていないため、PRごとに判定が揺れていました。重大度が信頼できなくなると、開発者は重大度を見なくなり、本当に重要な指摘まで読み流されます。誤検知の多いカテゴリが、正確なカテゴリへの信頼まで損なうのと同じ構造です。\n\n誤答の見分け方は、判定の基準そのものを具体化しているかどうかです。確信度による絞り込み、区分の削減、「慎重に」という指示は、いずれも基準のあいまいさを残しています。\n\n本番では、判定が揺れた実例を集め、重大度の境界に近いコード例として基準に追加していくと、精度を継続的に高められます。\n\n参考: https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices"},{"id":42,"scenario":"Claude Codeの設定とワークフロー","situation":"あるレストラン予約サービスの開発チームは、Claude Codeで、満席の時間帯にキャンセル待ちを登録し、空きが出たら順番に案内する機能を実装しようとしています。担当の開発者はキャンセル待ちの仕組みを作った経験がなく、「キャンセル待ち機能を作って」と依頼する予定です。\n\n社内では以前、同じような依頼から作った機能で次の点が考慮されておらず、リリース後に作り直したことがありました。\n\n同時に2件のキャンセルが出たときの案内の順番\n\n通知の送信に失敗した場合の扱い","question":"この機能の実装の進め方として、適切なものはどれですか。（2つ選択してください。）","choices":[{"text":"同時キャンセルや通知失敗時の動作を受け入れ条件として仕様に書き、それから実装を始める。","explanation":"正解。同時に2件のキャンセルが出たときの案内の順番や、通知の送信に失敗したときの動作を、受け入れ条件として仕様に書き出してから実装を始めれば、実装の判断がぶれず、テストを書くときの基準にもなります。\n\nClaudeとのやり取りで洗い出した論点も同じように仕様に加えておくことで、以前のような考慮漏れによる作り直しを防げます。Claude Codeのベストプラクティスも、インタビューの結果を仕様にまとめてから実装に進む流れを勧めています。"},{"text":"実装の前に、設計上の考慮事項をClaudeに質問させ、想定していなかった論点を洗い出す。","explanation":"正解。インタビューパターンは、実装の前にClaudeに質問させて、開発者が想定していなかった可能性のある考慮事項を洗い出す手法です。不慣れな領域ほど、同時キャンセルの順番や通知の失敗のような論点を開発者自身が思いつきにくいため、Claudeから問いかけさせることで、仕様の抜けを早い段階で見つけられます。"},{"text":"開発者には質問させず、Claudeに詳細な設計書を一人で書かせてから実装を始めさせる。","explanation":"Claudeに一人で設計書を書かせると、もっともらしい文書はできますが、開発者やチームが持つ前提（どの順番で案内したいか、など）が反映されません。インタビューパターンの価値は、質問と回答のやり取りで、開発者が気づいていなかった論点を引き出す点にあります。"},{"text":"一般的に妥当と思われる仕様をClaudeに想定させてすぐに実装させ、問題はレビューで直す。","explanation":"妥当と思われる仕様をClaudeに想定させる方法は、要件が明確で小さな変更なら素早く進められます。しかし本問では、以前に同じ進め方で考慮漏れが起き、リリース後の作り直しになっています。実装後のレビューで直すと、手戻りのコストが大きくなります。"}],"answer":[0,1],"overall":"反復的な改善の手法のうち、インタビューパターンがテーマです。ガイドは、実装の前に、開発者が想定していなかった可能性のある考慮事項を洗い出すために、Claudeに質問させるインタビューパターンを挙げ、不慣れな領域でソリューションを実装する前に、設計上の考慮事項（キャッシュの無効化戦略や障害モードなど）を洗い出すことをスキルとしています。Claude Codeのベストプラクティスも、大きな機能ではAskUserQuestionツールなどを使ってClaudeにインタビューさせ、技術的な実装やエッジケース、トレードオフを掘り下げたうえで仕様を書かせることを勧めています。\n\n本問の決め手は、開発者がこの領域に不慣れであることと、過去に同じ依頼の仕方で考慮漏れが起きていることです。正解の2つは、質問によって論点を洗い出すことと、決まった内容を受け入れ条件として仕様に残すことの組み合わせです。\n\n誤答の見分け方は、開発者とClaudeの間で論点を引き出すやり取りがあるかどうかです。すぐに実装させる案も、設計書を一人で書かせる案も、そのやり取りを省いています。\n\n本番では、仕様がまとまったら新しいセッションで実装を始めると、インタビューのやり取りに左右されない、すっきりしたコンテキストで作業できます。\n\n参考: https://code.claude.com/docs/en/best-practices"},{"id":43,"scenario":"プロンプトエンジニアリングと構造化出力","situation":"あるライブ・エンターテインメント企業は、チケットの払い戻しや座席変更の依頼に対応するカスタマーサポート解決エージェントを運用しています。エージェントは顧客のメッセージから枚数・公演日・購入日を抽出し、払い戻し申請のツールに渡します。\n\nログを調べると、「2、3枚だったと思う」「先月末くらいに買った」のようなくだけた表現の問い合わせで、エージェントが枚数を3、購入日を月末の日付と推測で埋めて申請していました。こうして後から訂正が必要になったケースは、月に140件ありました。\n\nシステムプロンプトには抽出の手順が文章で詳しく書かれていますが、例は1つもありません。","question":"抽出のハルシネーションを減らすためのfew-shotの例の使い方として、適切なものはどれですか。（2つ選択してください。）","choices":[{"text":"値を一つに確定できない表現のときに、その項目を空のままにして顧客に確認する応答の例を加える。","explanation":"正解。値を確定できないときの正しい振る舞いを例で示すことが、推測で埋める動作を抑える近道です。項目を空のままにして「購入日を確認させてください」と尋ねる応答の例があれば、エージェントは不確かな値で申請を進めるのではなく、確認を挟む動作を学べます。"},{"text":"「2、3枚」のようなくだけた表現と正しい抽出結果を示すfew-shotの例を、プロンプトに加える。","explanation":"正解。few-shotの例は、くだけた表現や多様な書き方を含む入力の正しい扱い方を示し、抽出のハルシネーションを減らすのに有効です。「2、3枚」は枚数を確定できない表現である、といった判断を具体的な入力と出力の組で示すと、文章の手順だけでは伝わりにくい扱い方が一貫して再現されやすくなります。"},{"text":"枚数と購入日を必須フィールドにした抽出ツールの出力例を示し、必ず値を入れて申請させる。","explanation":"必須のフィールドは、値を必ず受け取りたい場合に使う設計です。しかし、元の情報に値が含まれていない可能性があるときに項目を必須にし、値の入った出力例まで示すと、モデルは必須を満たすために値を捏造しやすくなり、今回の問題をかえって悪化させます。"},{"text":"例は加えずに、システムプロンプトに「推測で値を埋めてはならない」と強調して書き加える。","explanation":"「推測で値を埋めてはならない」と強調することは、方針を伝える一手としては有効です。しかし、詳細な指示だけでは一貫した結果にならない状況がすでに起きており、どの表現が「確定できない」にあたるのかを具体的に示す手がかりは増えません。"}],"answer":[0,1],"overall":"few-shotの例が、抽出のハルシネーションの低減に役立つことがテーマです。ガイドは、抽出タスクにおけるハルシネーションの低減に対するfew-shotの例の有効性を挙げ、その例として、くだけた単位表記（「ひとつまみ」「数百件程度」など）や多様な文書構造の処理を示しています。\n\n本問では、「2、3枚」「先月末くらい」のような表現を、エージェントが一つの値に推測で置き換えていました。手順を文章で詳しく書いても例がないため、どの表現を確定できないものとして扱うかが伝わっていません。正解は、くだけた表現とその正しい抽出結果の例、そして確定できないときに確認を求める例の組み合わせで、「どう抽出するか」と「抽出できないときにどうするか」の両方を具体的に示します。\n\n誤答の見分け方は、判断の手がかりを具体的な例として増やしているかどうかです。強調した指示は手がかりを増やさず、必須フィールドは捏造を促します。\n\n本番では、訂正が必要になったログの表現を定期的に集め、例の入れ替えに使うと効果を保てます。\n\n参考: https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices"},{"id":44,"scenario":"コンテキスト管理と信頼性","situation":"ある国際協力NGOのIT部門は、Claude Agent SDKで開発者の生産性向上ツールを作り、寄付管理システムのレガシーコードの調査に使っています。ある開発者は、1つのセッションで2時間以上、寄付の受付から領収書の発行までの処理の流れを調べ続けています。\n\nセッションの前半では、ReceiptIssuerとDonationLedgerの具体的な依存関係を特定していました。しかし後半になると、エージェントは「一般的には、台帳クラスが領収書を発行します」のように、前半で特定したクラス名ではなく典型的なパターンに基づいて答えるようになりました。コンテキストの大半は、GrepとReadの長い出力が占めています。\n\n開発者は、これまでの調査結果を引き継いだまま、同じ調査を続けたいと考えています。","question":"最も適切な対応はどれですか。","choices":[{"text":"新しいセッションを起動し、これまでの調査内容は伝えずに、同じ質問を最初から調べ直させる。","explanation":"新しいセッションで始め直せば、コンテキストは空になります。しかし、調査結果を何も伝えないため、前半で特定した依存関係を再び調べ直すことになり、「調査結果を引き継いだまま続けたい」という要件に反します。新しいセッションを使うなら、少なくとも調査結果の要約を最初に渡す必要があります。"},{"text":"allowed_toolsからGrepを外し、以降はReadでファイルを読んで調査を続けさせる。","explanation":"Grepを外しても、すでに積み重なった出力は減りません。さらに、Grepは目的の箇所を内容で検索して絞り込むための道具なので、Readだけに頼るとファイルを丸ごと読む回数が増え、かえってコンテキストを消費します。"},{"text":"残す調査結果を添えて/compactをプロンプトで送り、同じセッションで続ける。","explanation":"正解。Agent SDKでは、/compactをプロンプトの文字列として送ると、その時点で会話の圧縮を実行できます。古い履歴が要約に置き換わるので、冗長な調査出力が占めていたコンテキストの使用量を減らせます。特定済みのクラス名や依存関係など、残すべき内容を指示として添えておけば、調査結果を引き継いだまま続けられます。"},{"text":"max_turnsを引き上げ、同じセッションのまま調査を続けさせる。","explanation":"max_turnsは、ツールを使う往復の回数の上限を決める安全装置です。上限を引き上げても、すでにコンテキストを占めている冗長なツール出力は減らないため、回答が典型的なパターンに流れる症状は改善しません。"}],"answer":[2],"overall":"大規模なコードベースを探索する長時間のセッションで起きる、コンテキストの劣化への対処がテーマです。ガイドは、長時間のセッションではモデルが一貫しない回答を返し始め、以前に発見した具体的なクラスではなく「典型的なパターン」に言及するようになることを、コンテキストの劣化の症状として挙げています。そして、冗長な調査出力でコンテキストが埋まった場合に/compactでコンテキストの使用量を減らすことを、スキルとして挙げています。Agent SDKでも、/compactをプロンプトの文字列として送れば手動で圧縮でき、残したい内容を指示として添えられます。\n\n本問の決め手は、「調査結果を引き継いだまま続けたい」という要件と、「コンテキストの大半が長いツール出力」という事実です。\n\n何も渡さずに新しく始める案は引き継ぎの要件に反し、max_turnsやツールの増減は、すでに埋まったコンテキストには効きません。\n\n本番では、主要な調査結果をスクラッチパッドファイルにも記録させておくと、圧縮や新しいセッションの開始をまたいでも結論を参照し続けられます。\n\n参考: https://code.claude.com/docs/en/agent-sdk/agent-loop"},{"id":45,"scenario":"エージェントアーキテクチャとオーケストレーション","situation":"ある航空会社は、予約の変更や手荷物の問い合わせに対応するカスタマーサポート解決エージェントを構築しています。エージェントループはMessages APIを直接呼び出す独自の実装で、「Claudeを呼び出し、ツールの要求があれば実行して結果を返す」処理を最大3回繰り返したあと、その時点の応答テキストを顧客に返します。\n\n1か月分のログでは、振替便の手配のように4回以上のツール呼び出し（get_customer、lookup_order、空席の検索、予約の変更）が必要な案件のうち、18%が「ただいま確認しています」という応答のまま終了していました。一方、単純な問い合わせは1回目の反復で完了しています。","question":"ループの終了判定の改め方として、適切なものはどれですか。（2つ選択してください。）","choices":[{"text":"応答テキストに「完了しました」などの語句があれば、ループを終えるよう判定する。","explanation":"応答テキストの語句を解析して終了を判定する方法は、ガイドが避けるべきとしているアンチパターンです。Claudeの言い回しは一定ではなく、「完了しました」と書かずに終える応答もあれば、作業の途中で同じ語句を含む応答もあるため、終了判定が不安定になります。"},{"text":"反復回数の上限を3回から10回に引き上げ、10回目の応答を最終回答として顧客に返す。","explanation":"上限の引き上げは、上限が原因で処理が打ち切られていると分かった場合の応急処置にはなります。しかし、反復回数を主な停止条件にしている構造は変わらず、10回を超える手配では同じ打ち切りが起きます。上限に達した時点の未完成の応答を、そのまま顧客に返す問題も残ります。"},{"text":"反復回数の上限は安全装置として大きめに残し、到達した場合は異常として記録する。","explanation":"正解。反復回数の上限そのものが悪いわけではなく、無限ループや予期しないコストを防ぐ安全装置としては有効です。問題は上限を「完了の合図」として扱うことなので、通常の処理では届かない大きめの値にし、到達したら正常終了ではなく異常として記録・調査する扱いにすれば、stop_reasonによる終了判定と両立します。"},{"text":"stop_reasonが\"tool_use\"なら続け、\"end_turn\"でループを終える。","explanation":"正解。stop_reasonは、Claudeがツールの実行を求めているのか（\"tool_use\"）、応答を自然に終えたのか（\"end_turn\"）を示す値です。\"tool_use\"の間はツールを実行してtool_resultを会話履歴に追加し、次のリクエストを送ることで、必要な呼び出し回数がケースごとに違っても、モデル自身の判断で最後まで処理できます。"}],"answer":[2,3],"overall":"エージェントループのライフサイクルは、リクエストを送信してstop_reasonを確認し、\"tool_use\"なら要求されたツールを実行して結果を返し、\"end_turn\"なら終了する、という流れです。この制御フローでは、何回ツールを呼ぶかをモデルがコンテキストに基づいて判断します。\n\n本問の実装は「3回で必ず終える」という反復回数の上限を主な停止条件にしているため、4回以上の呼び出しが必要な振替便の手配だけが途中で打ち切られていました。単純な問い合わせが1回で完了していることも、上限が処理の複雑さと無関係に働いていることを示しています。\n\n誤答の見分け方は、終了の判断を何に委ねているかです。上限の引き上げは数字を変えるだけで構造は同じで、語句の解析は自然言語のシグナルに頼るアンチパターンです。正解の2つは、終了はstop_reasonで判断し、上限は安全装置に格下げするという組み合わせです。\n\n本番では、上限への到達や予期しないstop_reasonの値を監視の指標にしておくと、ループの不具合を早く見つけられます。\n\n参考: https://platform.claude.com/docs/en/build-with-claude/handling-stop-reasons"},{"id":46,"scenario":"ツール設計とMCP統合","situation":"あるEC物流企業の調査チームは、マルチエージェントリサーチシステムで配送遅延の原因を調べています。検索サブエージェントはMessages APIを直接呼び出す実装で、ツール定義として次の2つを渡しています。\n\nquery_tracking_events（説明は「追跡イベントを取得する」、パラメータはq）\n\nsearch_carrier_notices（説明は「お知らせを検索する」）\n\n追跡番号は「JP」に続く11桁の数字です。\n\nログを調べたところ、次の誤りが見つかりました。\n\nquery_tracking_eventsの呼び出しの34%で、「仙台方面の遅延」のような自由な文章がqに渡されて検証エラーになっていた\n\n個別の荷物の状況をsearch_carrier_noticesで調べようとする呼び出しが、週に120件あった","question":"ツールの選択と入力の誤りを減らすために適切な変更はどれですか。（2つ選択してください。）","choices":[{"text":"query_tracking_eventsに、有効な追跡番号のinput_examplesを数件加える。","explanation":"正解。input_examplesは、形式の決まった入力や複雑な入力を持つツールに、スキーマに沿った具体的な入力の例を添えるための項目です。追跡番号のように形式が厳密なパラメータに有効な例を示すと、Claudeは正しい形式の値を渡しやすくなります。"},{"text":"各ツールの説明に、受け付ける入力の形式、返す内容、もう一方のツールを使うべき場面を書き加える。","explanation":"正解。ツールの説明は、LLMがツールを選ぶ際の主要な手がかりです。「JPに続く11桁の追跡番号を1件受け取り、その荷物の追跡イベントを返す」「地域や配送業者全体の遅延情報はsearch_carrier_noticesを使う」のように、入力の形式・出力・類似ツールとの使い分けを書けば、自由文を渡す誤りと、ツールの取り違えの両方を減らせます。"},{"text":"ツールの説明は現在の長さのまま、パラメータ名だけをqからqueryに変更する。","explanation":"パラメータ名を意味の分かる名前にするのは良い習慣ですが、qをqueryにしても「何を渡すべきか」は依然としてあいまいです。説明が最小限のままでは、追跡番号を渡すべきことも、2つのツールの使い分けも伝わりません。"},{"text":"2つのツールをsearch_logisticsという1つのツールに統合し、入力に応じてサーバー側で振り分ける。","explanation":"ツールの統合は、アーキテクチャ上の選択としてはありえます。しかし、今回の根本原因は説明が最小限であることなので、統合しても入力の形式や使い分けの情報が不足したままでは、同じ誤りが統合後のツールの中で起きます。説明を書き直す対策に比べて、作業量も大きくなります。"}],"answer":[0,1],"overall":"明確な説明と境界を備えたツールインターフェースの設計がテーマです。ガイドは、ツールの説明をLLMがツール選択に用いる主要な仕組みとし、説明には入力形式、クエリの例、エッジケース、境界の説明を含めることが重要だとしています。公式ドキュメントも、詳細な説明がツールの性能を左右する最も重要な要素であり、何をするツールか、いつ使い、いつ使わないか、各パラメータが何を意味するかを説明するよう求めています。形式に厳密なパラメータには、input_examplesでスキーマに沿った入力例を添えることもできます。\n\n本問では、説明が一言しかないため、自由文を追跡番号の欄に渡す誤りと、2つのツールの取り違えが同時に起きていました。正解は、説明に入力の形式と境界を書くことと、形式の厳密なパラメータに入力例を添えることの組み合わせです。\n\n誤答の見分け方は、根本原因である情報の不足を埋めているかどうかです。名前だけの変更は情報を増やさず、統合は根本原因を残したまま作業量を増やします。\n\n本番では、ツールを追加するたびに、似た役割の既存ツールの説明にも使い分けを書き足すと、誤ったルーティングを防げます。\n\n参考: https://platform.claude.com/docs/en/agents-and-tools/tool-use/define-tools"},{"id":47,"scenario":"Claude Codeの設定とワークフロー","situation":"ある通信事業者の開発チームは、Claude Codeで基地局管理システムのコードを生成しています。ルートのCLAUDE.mdは約1,300行あり、起動時に、ファイルが長すぎるという警告が表示されます。そのうち約900行は、次のような特定のファイル種別を扱うときにだけ必要な規約です。\n\nYANGモデル（*.yang）\n\nTerraform（*.tf）\n\nSQLのマイグレーション（*.sql）\n\n画面の改修のように、これらと関係のない作業でも、規約がすべてコンテキストに読み込まれています。チームは、規約を必要なときにだけ読み込ませ、それ以外の作業でのコンテキストの消費を減らしたいと考えています。","question":"適切な変更はどれですか。（2つ選択してください。）","choices":[{"text":"それらの規約を.claude/rules/の個別のファイルに分け、pathsは指定せずにトピック別のフォルダで整理する。","explanation":"pathsを指定しないルールのファイルは、起動時に.claude/CLAUDE.mdと同じ優先度で読み込まれます。フォルダで整理しても読み込まれ方は変わらないため、関係のない作業でも規約がコンテキストに入ります。"},{"text":"特定のファイル種別の規約を.claude/rules/に分け、各ファイルのpathsにglobを指定する。","explanation":"正解。.claude/rules/のファイルは、YAMLフロントマターのpathsにglobパターンを指定すると、一致するファイルを扱うときにだけ読み込まれます。pathsに[\"**/*.yang\"]と書くように、規約ごとに対象のファイル種別を指定すれば、関係のない作業ではコンテキストに入らず、トークンの消費を減らせます。"},{"text":"それらの規約を別のMarkdownファイルに分け、ルートのCLAUDE.mdから@importで読み込む。","explanation":"@importは、CLAUDE.mdをモジュール化して整理するのには役立ちますが、インポートされたファイルも起動時に読み込まれるため、コンテキストの消費は減りません。公式ドキュメントも、@importでの分割は整理には役立つものの、コンテキストは減らないと説明しています。"},{"text":"ルートのCLAUDE.mdからそれらの規約を削除し、全体に共通する規約だけを残す。","explanation":"正解。規約をパス固有のルールに移しても、ルートのCLAUDE.mdに同じ内容が残っていれば、起動時に毎回読み込まれます。移した規約はCLAUDE.mdから削除し、どの作業にも必要な共通の規約だけを残すことで、常に読み込まれる量が実際に減ります。"}],"answer":[1,3],"overall":"パス固有のルールが、一致するファイルを扱うときにだけ読み込まれ、無関係なコンテキストとトークンの使用量を減らす仕組みがテーマです。公式ドキュメントによると、CLAUDE.mdは1ファイルあたり200行未満が目安で、長いファイルはコンテキストを多く消費し、指示が守られにくくなります。その対策として、コードベースの一部にしか関係しない指示は、一致するファイルを扱うときにだけ読み込まれるパス固有のルールに移すことが勧められています。\n\n一方、@importでファイルを分けても、インポートされたファイルは起動時に読み込まれるため、コンテキストの消費は減りません。pathsを持たないルールも、起動時に読み込まれます。\n\n本問の要件は、規約を必要なときにだけ読み込ませることです。正解の2つは、規約をpaths付きのルールに移すことと、元のCLAUDE.mdから削除することの組み合わせで、両方がそろって初めて、常に読み込まれる量が減ります。\n\n誤答の見分け方は、ファイルを分けることと、読み込まれる条件を変えることを区別できているかどうかです。\n\n本番では、分割した後に/contextで起動時に読み込まれるファイルを確認し、意図どおりに減っているかを確かめます。\n\n参考: https://code.claude.com/docs/en/memory"},{"id":48,"scenario":"Claude Codeの設定とワークフロー","situation":"あるガス会社の開発チームは、Claude Codeを使って料金計算モジュールの不具合を修正しています。テストで見つかった問題は次の4件です。\n\n基本料金の日割り計算で、端数の丸め方が仕様と違う\n\n従量料金の計算で、丸めを行う順番が日割りの計算より先になっている\n\n請求書のCSV出力で、列の並び順が仕様と違う\n\n管理画面のエラーメッセージに誤字がある\n\n調べたところ、1と2は、どちらを直すかによってもう一方の期待値が変わる関係にあることが分かりました。3と4は、他の問題とは独立しています。","question":"Claude Codeへの依頼の進め方として適切なものはどれですか。（2つ選択してください。）","choices":[{"text":"1と2は、それぞれ別のセッションで1件ずつ修正させ、最後に結果を突き合わせる。","explanation":"相互に影響する問題を別々のセッションで直すと、各セッションは相手の修正を知らないまま作業するため、結果を突き合わせたときに食い違いが生じやすくなります。互いの期待値が依存し合う問題こそ、同じ依頼の中で扱う必要があります。"},{"text":"3と4は、1と2とは分けて、1件ずつ順番に依頼し、確認しながら直す。","explanation":"正解。CSVの列の並びとエラーメッセージの誤字は、他の問題とは独立しています。独立した問題は、1件ずつ順番に依頼して結果を確認しながら反復すれば、変更の範囲が小さく保たれ、問題が起きたときにも原因を特定しやすくなります。"},{"text":"1と2は、互いの関係と期待される結果を添えて、1つの詳細なメッセージで依頼する。","explanation":"正解。修正が相互に影響する問題は、1つの詳細なメッセージで一緒に扱うのが適切です。日割りの丸めと従量料金の丸めの順番は、片方を直すともう片方の期待値が変わるため、別々に直すと、一方の修正がもう一方の修正を崩すことを繰り返しかねません。関係と期待される結果を一緒に伝えれば、両方を整合させた修正を得られます。"},{"text":"4件をまとめて1つのメッセージにし、一度の依頼で修正させる。","explanation":"4件をまとめて依頼すると、独立した問題まで1回の変更に混ざり、どの変更がどの問題を直したのかを確認しにくくなります。独立した問題は、順番に1件ずつ反復するほうが、確認と修正のやり直しが容易です。"}],"answer":[1,2],"overall":"反復的な改善で、問題をまとめて伝えるか、順番に伝えるかの見極めがテーマです。ガイドは、すべての問題を単一のメッセージで提示すべき場合（相互に影響する問題）と、順番に修正すべき場合（独立した問題）を見極めることを知識として挙げ、修正が相互に影響する場合は単一の詳細なメッセージで扱い、独立した問題は順番に反復することをスキルとしています。\n\n本問の4件のうち、日割りの丸めと従量料金の丸めの順番は、片方を直すともう片方の期待値が変わるという、相互に影響する関係にあります。一方、CSVの列の並びと誤字は独立しています。正解の2つは、この性質の違いに合わせて、依頼の単位を分けるものです。\n\n誤答の見分け方は、問題の関係の有無と依頼の単位が合っているかどうかです。すべてをまとめる案は独立した問題を混ぜ、相互に影響する問題を別々に直す案は整合性を失います。\n\n本番では、相互に影響する問題を一緒に依頼するときに、期待される結果を具体的なテストケースとして添えると、修正の正しさを確かめやすくなります。\n\n参考: https://code.claude.com/docs/en/best-practices"},{"id":49,"scenario":"Claude Codeの設定とワークフロー","situation":"ある証券会社の開発チームは、Claude Agent SDKで開発者の生産性向上ツールを作り、エンジニアからの開発依頼を処理させています。依頼の内容に応じて、permission_modeを\"plan\"にして先に計画を提示させるか、そのまま実装させるかを切り替える方針です。\n\n今週、選択肢に挙げた4件の依頼が届きました。","question":"先に計画を提示させるべき依頼はどれですか。（2つ選択してください。）","choices":[{"text":"顧客の認証方式として、社内のシングルサインオンとOAuthのどちらを採用するかを決めて実装する。","explanation":"正解。複数の有効なアプローチがあり、どれを選ぶかによって実装が大きく変わる判断は、プランモードが向いているタスクです。先に両方の方式の影響と実装方針を計画として提示させ、チームが選んでから実装に進めば、選択を誤った場合のコストのかかる手戻りを防げます。"},{"text":"注文管理の同期処理をメッセージキューによる非同期方式に移し、約50ファイルを変更する。","explanation":"正解。同期処理から非同期の方式への移行は、約50ファイルに影響するアーキテクチャ上の変更です。プランモードでは、変更を加える前にコードベースを調査して依存関係を把握し、設計を確かめられるため、途中で依存関係が見つかって手戻りになるリスクを抑えられます。"},{"text":"約定通知のログに出力されるメッセージの誤字を、3か所直す。","explanation":"ログのメッセージの誤字の修正は、変更の内容を1文で説明できる、範囲の明確な小さな変更です。Claude Codeのベストプラクティスも、誤字の修正のような小さな変更では計画を省き、直接実行するよう勧めています。"},{"text":"スタックトレースで原因の行が特定済みの、1つの関数に抜けていたnullチェックを追加する。","explanation":"原因の行が特定され、変更が1つの関数に収まる修正は、内容が十分に理解されていて範囲が明確な変更です。このような変更は直接実行で進めるのが適しており、計画を挟むと手間が増えるだけです。"}],"answer":[0,1],"overall":"プランモードと直接実行のどちらを使うかの判断がテーマです。ガイドは、プランモードを、大規模な変更、複数の有効なアプローチ、アーキテクチャ上の決定、複数ファイルの修正を伴う複雑なタスク向けとし、直接実行を、単純で範囲が明確な変更に適したものとしています。Agent SDKでも、permission_modeを\"plan\"にすると、Claudeはソースファイルを編集せずに探索と計画を行うため、変更を加える前に計画を確認できます。\n\n本問の4件のうち、約50ファイルに影響する非同期化はアーキテクチャに影響する大規模な変更、認証方式の選択は複数の有効なアプローチからの決定で、どちらも計画を先に確かめる価値があります。一方、原因が特定済みの1関数の修正と誤字の修正は、範囲が明確な小さな変更です。\n\n誤答の見分け方は、「変更の内容を1文で説明できるか」「複数の選択肢や広い影響があるか」です。\n\n本番では、計画を承認した後の実装は直接実行に切り替えるなど、調査と実装でモードを使い分けると、効率よく進められます。\n\n参考: https://code.claude.com/docs/en/best-practices"},{"id":50,"scenario":"Claude Codeの設定とワークフロー","situation":"ある建設会社の開発チームは、工程管理システムのプルリクエストごとに、Claude Codeでテストを生成するCIジョブを運用しています。ジョブはリポジトリのルートでclaude -pを実行しており、--bareは付けていません。\n\n生成されたテストを確認したところ、次のことが分かりました。\n\ngetterの戻り値を確かめるだけのテストや、依存をすべてモックにして何も検証していないテストが半数を超えていた\n\ntests/factories/に用意しているBuildingFactoryやScheduleFactoryを使わず、テストのたびに建物や工程のデータを一から組み立てていた","question":"テスト生成の品質を高めるために適切な対応はどれですか。（2つ選択してください。）","choices":[{"text":"プロジェクトのCLAUDE.mdに、工期の境界や資材の上限など、価値のあるテストの基準を書く。","explanation":"正解。CLAUDE.mdは、CIから呼び出されるClaude Codeにも、テスト標準やレビュー基準といったプロジェクトのコンテキストを提供する仕組みです。ガイドは、テスト標準と価値のあるテストの基準をCLAUDE.mdに文書化し、価値の低いテストの出力を減らすことを挙げています。業務ルールのどこを確かめるテストに価値があるかを具体的に書けば、getterだけのテストは生成されにくくなります。"},{"text":"CIのランナーで使うユーザーの~/.claude/CLAUDE.mdに、テストの基準とフィクスチャの使い方を書く。","explanation":"ユーザーレベルの~/.claude/CLAUDE.mdは、そのユーザーの環境にだけ適用される個人の設定で、バージョン管理を通じて共有されません。CIのランナーは作り直されることも多く、開発者がローカルで生成するテストにも基準が届かないため、チームの標準を置く場所として適していません。"},{"text":"プロジェクトのCLAUDE.mdに、tests/factories/の各ファクトリーの用途と使い方を記載する。","explanation":"正解。ガイドは、利用可能なフィクスチャをCLAUDE.mdに文書化することも、テスト生成の品質を高める方法として挙げています。BuildingFactoryやScheduleFactoryの用途と使い方が書かれていれば、Claudeは毎回データを一から組み立てるのではなく、既存のファクトリーを使ったテストを生成します。"},{"text":"CIのプロンプトに「質の高い、意味のあるテストを書くこと」という一文を加える。","explanation":"「質の高いテストを書くこと」という一般的な指示は、何が質の高いテストなのかを定義していないため、生成の傾向をほとんど変えません。基準は、業務ルールの検証のような具体的な内容として示す必要があります。"}],"answer":[0,2],"overall":"CIから呼び出されるClaude Codeに、プロジェクトのコンテキストを渡す仕組みとしてのCLAUDE.mdがテーマです。ガイドは、CLAUDE.mdを、テスト標準、フィクスチャの規約、レビュー基準を提供する仕組みと位置付けています。そのうえで、テスト標準、価値のあるテストの基準、利用可能なフィクスチャをCLAUDE.mdに文書化して、テスト生成の品質を高め、価値の低いテストの出力を減らすことを挙げています。\n\n本問の問題は2つで、価値の低いテストが多いことと、既存のファクトリーが使われないことです。正解の2つは、それぞれに対応する情報をプロジェクトのCLAUDE.mdに書くものです。なお、claude -pは既定でプロジェクトのCLAUDE.mdを読み込みますが、--bareを付けるとCLAUDE.mdの自動読み込みを省くため、その場合は--append-system-prompt-fileなどで明示的に渡す必要があります。\n\n誤答の見分け方は、基準が具体的か、チームで共有される場所に書かれているかの2点です。一般的な一文は具体性がなく、ユーザーレベルのファイルは共有されません。\n\n本番では、レビューで却下されたテストの例を集め、基準の記述に反映していくと効果的です。\n\n参考: https://code.claude.com/docs/en/headless"},{"id":51,"scenario":"コンテキスト管理と信頼性","situation":"ある外食チェーンの本部は、構造化データ抽出システムを運用しています。このシステムは、仕入れ先から届く規格書や納品書（PDFやFAXの画像）から品名・アレルゲン・原産地・単価を抽出し、JSONに変換します。モデルはフィールド単位の確信度スコアも出力しており、現在は確信度0.9以上のフィールドを自動登録し、それ未満を人間のレビューに回しています。\n\n監査の結果、次のことが分かりました。\n\n自動登録されたアレルゲン欄の約6%に誤りがあり、その多くは確信度0.9以上だった\n\n品名欄は、確信度が0.7台でもほぼすべて正しい値だった\n\nレビュー担当者が確認できるのは1日200件までです。","question":"レビューの振り分けを改善するために適切な対応はどれですか。（2つ選択してください。）","choices":[{"text":"全フィールドの自動登録のしきい値を一律0.97に引き上げ、それ未満はすべてレビューに回す。","explanation":"しきい値を一律に上げると、アレルゲン欄の誤りの一部はレビューに回るようになります。しかし、確信度0.7台でもほぼ正しい品名欄まで大量にレビューに回り、1日200件という処理能力を圧迫します。問題はしきい値の高さではなく、フィールドごとに確信度の意味が違うことです。"},{"text":"確信度が低い抽出と、元の文書があいまいまたは矛盾する抽出を、優先して人間のレビューに回す。","explanation":"正解。レビュー担当者の処理能力には限りがあるため、誤りの起きやすい抽出から優先して確認する必要があります。確信度の低い抽出に加え、FAXの判読しにくい箇所や、規格書と納品書で記載が食い違う箇所のように、元の文書があいまいまたは矛盾している抽出を優先してレビューに回すと、限られた件数で効率よく誤りを拾えます。"},{"text":"ラベル付き検証セットでフィールドごとの確信度と実際の精度を測り、しきい値を個別に決める。","explanation":"正解。フィールド単位の確信度スコアは、ラベル付き検証セットを使ってキャリブレーションして初めて、レビューの振り分けに使える値になります。フィールドごとに「確信度がいくつのとき実際の精度が何%か」を測れば、アレルゲン欄は高めの、品名欄は低めのしきい値というように、フィールドの性質に合った基準を決められます。"},{"text":"プロンプトに「確信が持てないときは確信度を低く出す」と追記し、しきい値は0.9のまま運用する。","explanation":"自己申告の確信度は、指示を足しても実際の正しさと一致するようにはなりません。どの値が「確信が持てない」状態なのかをモデル自身が正しく判断できていないことが今回の問題なので、検証データとの突き合わせなしに指示だけを変えても、キャリブレーションにはなりません。"}],"answer":[1,2],"overall":"人間によるレビューのワークフローと確信度のキャリブレーションがテーマです。モデルが出力するフィールド単位の確信度は、そのままでは実際の正しさと対応しているとは限りません。本問でも、アレルゲン欄は確信度が高いのに誤りがあり、品名欄は確信度が低めでもほぼ正しいという、フィールドによるずれが起きています。\n\nガイドは、モデルにフィールド単位の確信度を出力させ、その後ラベル付き検証セットを用いてレビューのしきい値をキャリブレーションすることを挙げています。さらに、確信度の低い抽出や、元の文書があいまい・矛盾している抽出を人間のレビューに回し、限られた処理能力に優先順位を付けることも挙げています。正解の2つは、この2点に対応します。\n\n誤答の見分け方は、確信度の数字と実際の精度の対応を確かめているかどうかです。一律の引き上げも、プロンプトでの言い聞かせも、その対応を確かめないまま数字を扱っています。\n\n本番では、キャリブレーション後も自動登録分から一定数を抽出して精度を測り続け、仕入れ先や書式が変わったときのずれを検知します。\n\n参考: https://platform.claude.com/docs/en/test-and-evaluate/develop-tests"},{"id":52,"scenario":"ツール設計とMCP統合","situation":"ある工作機械メーカーの開発チームは、Claude Agent SDKで開発者の生産性向上ツールを作り、工場の設備データを扱うMCPサーバーと統合しています。サーバーには、次の2つのツールがあります。\n\nget_line_status（説明は「状態を取得する」、パラメータはid）\n\nget_machine_status（説明は「状態を取得する」、パラメータはid）\n\n生産ラインのIDは「L-12」、個々の機械のIDは「M-0457」のような形式です。\n\nログを確認すると、「ライン3の稼働状況は？」という質問にget_machine_statusが呼ばれたり、機械のIDがget_line_statusに渡されたりする誤りが、呼び出し全体の37%で起きていました。","question":"誤ったルーティングを減らすために適切な変更はどれですか。（2つ選択してください。）","choices":[{"text":"各ツールの説明に、対象が生産ライン全体か個々の機械か、もう一方を使うべき場面を書く。","explanation":"正解。2つのツールの説明が同じ「状態を取得する」であることが、誤ったルーティングの根本原因です。対象の範囲（ライン全体か、個々の機械か）、返す内容、もう一方のツールを使うべき場面を書き分けることで、似たツールの間での選択の信頼性が上がります。"},{"text":"パラメータ名をline_idとmachine_idに変え、受け付けるIDの形式を説明に書く。","explanation":"正解。どちらのツールのパラメータもidという同じ名前で、何のIDを渡すべきかが区別できない状態でした。line_id、machine_idのように意味の分かる名前にし、受け付ける形式を説明に書けば、Claudeは質問に含まれるIDの形式からも、正しいツールと値を選びやすくなります。"},{"text":"2つのツールの説明を1行に短くそろえ、ツール定義が消費するトークンを抑える。","explanation":"説明を短くそろえると、今でも区別できない2つのツールが、さらに区別しにくくなります。ツールの説明はLLMがツールを選ぶ際の主要な手がかりであり、トークンの節約のために削るべきものではありません。"},{"text":"システムプロンプトに「『ライン』という語があればget_line_statusを使う」という規則を追加する。","explanation":"特定のキーワードに反応する指示は、一見わかりやすいものの、意図しないツールの関連付けを生みます。「ライン上の機械M-0457の状態は？」のように、機械についての質問にも「ライン」という語が含まれる場合、この規則はかえって誤ったツールを選ばせます。"}],"answer":[0,1],"overall":"あいまいな、または重複するツールの説明が、誤ったルーティングを引き起こす仕組みがテーマです。ガイドは、ほぼ同一の説明を持つツールの例を挙げて、重複する説明が誤ったルーティングにつながることを示し、各ツールの目的、想定される入力、出力、類似の代替ツールではなくそのツールを使うべき場面を明確に区別する説明を作成することを挙げています。Anthropicのツール設計の記事も、パラメータはuserではなくuser_idのように、あいまいさのない名前にするよう勧めています。\n\n本問では、説明もパラメータ名も2つのツールで同じだったため、Claudeには区別の手がかりがほとんどありませんでした。正解の2つは、説明で対象と境界を書き分けることと、パラメータ名と入力の形式で区別することで、どちらも2つのツールの違いを定義に書き込む対策です。\n\n誤答の見分け方は、ツールの定義そのものの情報を増やしているかどうかです。キーワードの規則は新たな誤りの原因になり、説明の短縮は手がかりを減らします。\n\n本番では、似た名前のツールを追加するときに、既存のツールとの違いを両方の説明に書くことを、レビューの観点にしておくと効果的です。\n\n参考: https://www.anthropic.com/engineering/writing-tools-for-agents"},{"id":53,"scenario":"プロンプトエンジニアリングと構造化出力","situation":"あるホテルチェーンは、宿泊者アンケートの自由記述から施設・不満の種類・要望を抽出してJSONに変換する構造化データ抽出システムを、Message Batches APIで運用しています。各ホテルとの取り決めにより、アンケートを受け付けてから36時間以内に、抽出結果を各ホテルに配信する必要があります。アンケートの受付件数は、時期によって1日300件から5,000件まで変動します。\n\n処理の流れは次のとおりです。\n\n受け付けたアンケートを、次のバッチ送信までためておく\n\n送信の直前に、2時間の前処理を行う\n\nバッチを送信する\n\n結果を受け取ったあとに、2時間の検証と配信を行う\n\n検証で失敗した文書は、検証と配信の2時間の中で、同期APIを使って個別に再処理しています。","question":"バッチ送信の頻度の決め方として適切なものはどれですか。（2つ選択してください。）","choices":[{"text":"8時間ごとに、その間に受け付けたアンケートをまとめてバッチを送信する。","explanation":"正解。最も不利なのは、バッチを送信した直後に届いたアンケートです。待ち時間は最大で送信間隔の長さになり、そこに前処理2時間、バッチの処理最大24時間、検証と配信2時間が加わります。36時間から28時間を引いた8時間が送信間隔の上限なので、8時間ごとに送信すれば、どのアンケートも期限内に配信できます。"},{"text":"送信間隔は、普段の処理時間ではなく、最大24時間の処理時間を前提に計算する。","explanation":"正解。Message Batches APIは最大24時間の処理ウィンドウで処理され、レイテンシのSLAは保証されません。期限を守る送信間隔を決めるには、普段の速さではなく、最悪のケースである24時間を前提にする必要があります。この前提に立つことで、混雑時に処理が長引いても期限を守れる設計になります。"},{"text":"12時間ごとに、その間に受け付けたアンケートをまとめてバッチを送信する。","explanation":"12時間ごとの送信では、送信の直後に届いたアンケートは最大12時間待ち、そこに前処理2時間、バッチの処理最大24時間、検証と配信2時間が加わるため、配信まで最大40時間かかり、36時間の期限を4時間超えます。期限の36時間からバッチの最大24時間だけを引くと12時間になりますが、その前後の工程の4時間が計算から抜けています。"},{"text":"受け付けたアンケートが1,000件たまるたびに、まとめてバッチを送信する。","explanation":"件数を基準にした送信は、1回のバッチの大きさをそろえたい場合に使われる方法です。しかし、受付が1日300件の時期には、1,000件たまるまでに3日以上かかり、待ち時間だけで36時間の期限を超えてしまいます。期限を守るには、件数ではなく、最も不利なアンケートの待ち時間が上限を超えない時間間隔で送信する必要があります。"}],"answer":[0,1],"overall":"SLAの制約に基づいて、バッチの送信頻度を計算する問題です。Message Batches APIは50%のコスト削減と引き換えに、最大24時間の処理ウィンドウで処理され、レイテンシのSLAは保証されません。ガイドは、SLAの制約に基づいてバッチ送信の頻度を計算することを挙げています（たとえば、最大24時間のバッチ処理で30時間のSLAを守るなら4時間ごとに送信する）。\n\n本問では、期限の36時間から、前処理2時間、バッチの処理最大24時間、検証と配信2時間の合計28時間を引いた8時間が、アンケートをためておける時間の上限です。最も不利な、送信直後に届いたアンケートでも、待ち時間8時間と28時間を合わせて36時間で期限に収まります。正解の2つは、計算の結果（8時間ごと）と、計算の前提（最大24時間）の組み合わせです。\n\n誤答の見分け方は、すべての工程の時間を最悪の場合で積み上げているかどうかです。12時間ごとの送信は前処理と検証・配信の4時間を計算に入れておらず、件数を基準にした送信は、受付の少ない時期の待ち時間に上限がありません。\n\n実際の運用では、各工程の時間が延びた場合に備えて、計算した上限より少し短い間隔にしておくと安全です。\n\n参考: https://platform.claude.com/docs/en/build-with-claude/batch-processing"},{"id":54,"scenario":"エージェントアーキテクチャとオーケストレーション","situation":"ある不動産管理会社の開発チームは、Claude Agent SDKで開発者の生産性向上ツールを作っています。エージェントが賃貸契約の更新料を計算するモジュールを改修すると、ツールはその生成セッションをfork_sessionで分岐させ、分岐したセッションに「この変更をレビューして」と依頼します。チームは、生成とは別のセッションIDになるので、独立したレビューになると考えていました。\n\n直近の40件の改修では、次のような結果になりました。\n\nレビューの指摘は合計2件で、文面には「改修時に検討したとおり、端数は切り捨てで問題ありません」のように、生成時の判断を前提にした記述が多く見られた\n\n受け入れテストでは、月の途中で解約した場合の日割り計算の誤りなど、9件の不具合が見つかった","question":"レビューの仕組みとして適切な変更はどれですか。（2つ選択してください。）","choices":[{"text":"分岐したセッションへの依頼に、生成時の判断を疑って批判的に確認するよう書き加える。","explanation":"批判的に確認するよう指示することは、同じ担当者が見直すしかない場面での一般的な工夫です。しかし、分岐したセッションには生成時の会話履歴がそのまま入っており、指示を加えても、レビュー役は「改修時に検討したとおり」という前提から抜け出しにくいままです。ガイドも、独立したレビューインスタンスは、セルフレビューの指示よりも見つけにくい問題を見つけるうえで効果的だとしています。"},{"text":"生成セッションをresumeせずに新しいセッションを開始し、レビューを実行させる。","explanation":"正解。resumeもforkも使わずに新しいセッションを開始すると、生成時の会話履歴を持たないインスタンスでレビューできます。forkは元の履歴のコピーから始まるため、セッションIDが別でも、中身は生成セッションの続きです。差分と計算規則をプロンプトで渡せば、レビュー役は生成時の判断を知らないまま、日割り計算の端数のような見つけにくい問題も規則に照らして検討できます。"},{"text":"改修後のファイルと計算規則だけを渡すレビュー用のサブエージェントを定義する。","explanation":"正解。AgentDefinitionで定義するAgent SDKのサブエージェントは、forkでない限り新しいコンテキストで始まり、親の会話履歴やツールの結果を受け取りません。\n\n親から渡るのはAgentツールのプロンプトだけなので、改修後のファイルと更新料の計算規則だけを渡せば、レビュー役は生成時の推論を知らない状態で、コードを計算規則と突き合わせられます。toolsをRead・Grep・Globに絞れば、レビュー役がファイルを書き換えることも防げます。"},{"text":"生成時より上位のモデルを指定して、分岐したセッションでレビューを実行させる。","explanation":"上位のモデルは、難しい推論が必要な作業で精度を上げたいときに選ぶ手段です。しかし、分岐したセッションでは、モデルを替えても生成時の会話履歴と判断の経緯がそのまま引き継がれます。問題はモデルの能力ではなく、レビュー役が生成時の推論を前提に読んでいることなので、モデルの変更ではレビューの独立性は得られません。"}],"answer":[1,2],"overall":"マルチインスタンスのレビュー設計で、レビュー役が本当に独立しているかを見極める問題です。ガイドは、モデルは生成時の推論の流れを保持しているため、同じセッション内では自身の判断を疑いにくくなること、そして以前の推論の流れを持たない独立したレビューインスタンスは、セルフレビューの指示や拡張思考よりも、見つけにくい問題を見つけるうえで効果的であることを挙げています。Agent SDKのドキュメントによると、forkは元の履歴のコピーから始まる新しいセッションで、独自のセッションIDを持ちます。つまり、IDが別でも、分岐したレビュー役は生成時の推論をすべて引き継いでいます。\n\n本問の決め手は、指摘の文面が「改修時に検討したとおり」と生成時の判断を前提にしている点で、レビューが実質的にセルフレビューになっていることを示しています。正解の2つは、forkでないサブエージェントと新しいセッションという、生成時の履歴を持たないインスタンスでレビューする方法です。\n\n誤答の見分け方は、レビュー役のコンテキストから生成時の推論が外れているかどうかです。批判的に見るよう指示しても、上位のモデルに替えても、分岐したセッションの履歴は残ります。fork_sessionは共通の分析結果から異なる方針を試すための仕組みで、独立したレビューのためのものではありません。\n\n本番では、レビュー役に渡す情報を差分・仕様・レビュー基準に限ると決めておくと、独立性を保てます。\n\n参考: https://code.claude.com/docs/en/agent-sdk/subagents"},{"id":55,"scenario":"Claude Codeの設定とワークフロー","situation":"ある自動車メーカーのコネクテッドサービス開発チームは、Claude Codeで車両データの受信APIを改修しています。本番のエラーログから、受信した車台番号（VIN）の桁数を確かめていないために、validate_vin関数で例外が発生していることが分かりました。\n\nスタックトレースで原因の行は特定済みで、この不具合を再現する失敗テストも1件用意してあります。修正は、validate_vin関数に17桁かどうかの確認を1つ加えるだけで済む見込みです。","question":"この修正の進め方として、最も適切なものはどれですか。","choices":[{"text":"直接実行でそのまま修正させ、用意した失敗テストと既存のテストが通ることを確かめさせる。","explanation":"正解。直接実行は、内容が十分に理解されていて範囲が明確な変更に適しています。原因が特定済みで、修正が1つの関数への確認の追加だけという今回の変更は、その典型です。用意した失敗テストと既存のテストを実行させれば、Claudeは修正が正しいことを自分で確かめられます。"},{"text":"インタビューパターンで、VINの検証に関する要件を開発者から聞き取らせてから実装させる。","explanation":"インタビューパターンは、不慣れな領域で、実装の前に設計上の考慮事項を洗い出したい場合に使う手法です。17桁かどうかを確かめるという要件は明確で、開発者から聞き取るべき論点はほとんどありません。"},{"text":"Exploreサブエージェントで、リポジトリ内のVINの扱いをすべて洗い出させてから修正させる。","explanation":"Exploreサブエージェントは、冗長な調査の出力をメインの会話から分離するのに役立ちます。しかし今回は、修正箇所がすでに特定されており、リポジトリ全体を調べる必要がありません。不要な調査は時間とコストを増やすだけです。"},{"text":"プランモードに入り、車両データの処理全体への影響を調査させてから修正の計画を提示させる。","explanation":"プランモードは、大規模な変更や複数の有効なアプローチがあるタスクで、変更前に調査と設計を行うためのものです。原因の行が特定され、変更が1つの関数に収まる今回の修正では、計画の作成と承認の手間が増えるだけで、得られるものはほとんどありません。"}],"answer":[0],"overall":"プランモードと直接実行のどちらを使うかの判断のうち、直接実行を選ぶべき場面がテーマです。ガイドは、直接実行を単純で範囲が明確な変更に適したものとし、内容が十分に理解されていて範囲が明確な変更（スタックトレースが明確な単一ファイルのバグ修正や、日付のバリデーションの条件分岐の追加など）に直接実行を選ぶことを挙げています。Claude Codeのベストプラクティスも、計画は役に立つ一方で手間も増えるため、変更の内容を1文で説明できるなら計画を省いてよいとしています。\n\n本問の修正は、原因の行が特定済みで、1つの関数に確認を1つ加えるだけの変更です。さらに失敗テストが用意されているため、Claudeは修正後にテストを実行して、自分で正しさを確かめられます。\n\n誤答の見分け方は、手法が問題の大きさに見合っているかどうかです。プランモード、Exploreサブエージェント、インタビューパターンは、いずれも不確かさの大きいタスクのための手法で、今回の修正には過剰です。\n\n本番では、直接実行でも修正後にテストを実行させ、その結果を示させることで、確認の手間を減らせます。\n\n参考: https://code.claude.com/docs/en/best-practices"},{"id":56,"scenario":"Claude Codeの設定とワークフロー","situation":"ある電力会社のシステム開発チームは、Claude Codeで料金計算システムのコードを生成しています。SQLファイルは、ルートのschema.sqlのほか、services/billing/db/queries/やtools/reports/など複数のディレクトリに散在しています。\n\nチームはSQLの規約を.claude/rules/sql.mdにまとめ、フロントマターにpaths: [\"*.sql\"]を指定しました。SQL以外の作業では、この規約をコンテキストに読み込ませたくないと考えています。\n\nところが、ルートのschema.sqlを編集したときは規約が適用されるのに、services/billing/db/queries/配下のSQLファイルを編集したときは適用されません。","question":"最も適切な修正はどれですか。","choices":[{"text":"pathsの値を\"**/*.sql\"に変更し、どの階層にあるSQLファイルにも一致させる。","explanation":"正解。globパターンの*.sqlはプロジェクトのルートにあるSQLファイルにだけ一致し、サブディレクトリのファイルには一致しません。**/を付けた**/*.sqlにすると、ディレクトリの階層に関係なくすべてのSQLファイルに一致し、それらを読み書きするときにだけ規約が読み込まれます。"},{"text":"sql.mdからpathsを削除し、規約がすべてのセッションで起動時に読み込まれるようにする。","explanation":"pathsを持たないルールは、起動時に.claude/CLAUDE.mdと同じ優先度で読み込まれます。規約はすべてのSQLファイルに適用されるようになりますが、SQL以外の作業でもコンテキストに入るため、「SQL以外の作業では読み込ませたくない」という条件に反します。"},{"text":"sql.mdを.claude/rules/db/に移し、ルールファイルの配置をSQLファイルの構成に合わせる。","explanation":".claude/rules/配下のファイルはサブディレクトリも含めて再帰的に検出されますが、フォルダの配置はルールを整理するためのもので、どのファイルに適用されるかはpathsのパターンで決まります。配置を変えても*.sqlのままでは、サブディレクトリのSQLファイルには一致しません。"},{"text":"SQLファイルがある各ディレクトリにCLAUDE.mdを置き、sql.mdと同じ内容を記載する。","explanation":"サブディレクトリのCLAUDE.mdは、規約が特定のディレクトリに結び付いている場合には有効です。しかし、SQLファイルは複数のディレクトリに散在しており、ディレクトリごとに同じ内容を複製すると、更新漏れで規約が食い違う原因になります。globパターンで1か所にまとめるほうが保守しやすくなります。"}],"answer":[0],"overall":"パス固有のルールで使う、globパターンの書き方がテーマです。.claude/rules/のファイルは、YAMLフロントマターのpathsにglobパターンを指定すると、一致するファイルをClaudeがRead・Write・Editで扱うときにだけ読み込まれます。公式ドキュメントの例にあるとおり、*.mdはプロジェクトのルートにあるMarkdownファイルに、**/*.tsはあらゆるディレクトリのTypeScriptファイルに一致します。\n\n本問の*.sqlはルート直下にしか一致しないため、ルートのschema.sqlでは規約が適用され、サブディレクトリのファイルでは適用されないという症状になりました。決め手は「ルートでは効くが、下の階層では効かない」という差で、ルールの仕組み自体は動いており、パターンの範囲だけが狭いことを示しています。\n\npathsを外す案は条件付きの読み込みという要件を失い、ディレクトリごとのCLAUDE.mdは散在するファイルの管理に向きません。\n\n本番では、新しいルールを作ったら、深い階層にある代表的なファイルを1つ読ませて、規約が読み込まれるかを確かめておくと安心です。\n\n参考: https://code.claude.com/docs/en/memory"},{"id":57,"scenario":"プロンプトエンジニアリングと構造化出力","situation":"あるデジタル広告企業の開発チームは、広告配信SDKのプルリクエストをClaude Codeで自動レビューしています。指摘は--json-schemaで定めたJSON形式で出力し、PRのインラインコメントとして投稿しています。直近3か月で、開発者が「却下」した指摘の割合は29%から46%に上がりました。\n\nチームは却下の多い指摘の傾向を調べたいと考えています。しかし、指摘の文面は「非同期処理の例外が握りつぶされています」「catchの中で何もしていません」のように毎回異なり、どの指摘が同じ種類のコードに対するものなのかを集計できません。","question":"却下の傾向を体系的に分析できるようにするための対応として、最も適切なものはどれですか。","choices":[{"text":"各指摘に確信度を出力させ、確信度0.7未満の指摘はインラインコメントに投稿しない。","explanation":"確信度で投稿を絞ると、却下される指摘の数は減るかもしれませんが、どの種類の指摘が却下されているのかという傾向の分析には役立ちません。自己申告の確信度は、キャリブレーションされていなければ却下されやすさとも一致しません。"},{"text":"スキーマにdetected_patternを加え、指摘の元になったコード構造を記録させる。","explanation":"正解。ガイドは、構造化された指摘事項にdetected_patternフィールドを追加し、開発者が指摘事項を却下した際の誤検知のパターンを分析できるようにすることを挙げています。\"empty-catch\"のように、指摘のきっかけになったコード構造を決まった値で記録させれば、文面が毎回違っても、パターンごとの却下率を集計できます。"},{"text":"却下のたびに、開発者に却下の理由を自由記述で入力してもらい、その文章を集計する。","explanation":"却下の理由は、指摘のどこに問題があったかを知る手がかりになります。しかし、自由記述の文章は書き方がばらばらで、指摘の文面と同じく集計しにくく、開発者の負担も増えます。分析の単位になる、決まった値を持つ項目が必要です。"},{"text":"PRごとの却下率を集計し、却下率の高いPRの作成者に、指摘を確認するよう促す。","explanation":"PRごとの却下率は、どのPRで却下が多かったかを示すだけで、どの種類の指摘が問題なのかは分かりません。また、却下の多さをPRの作成者の責任にすると、誤検知の多い指摘を改善するという本来の目的から外れます。"}],"answer":[1],"overall":"検証とフィードバックのループで、却下された指摘を分析できるようにする設計がテーマです。ガイドは、どのコード構造が指摘事項を引き起こすかをdetected_patternフィールドで追跡し、却下パターンの体系的な分析を可能にすることを、フィードバックループの設計として挙げています。\n\n本問のチームは、却下の割合が上がっていることは分かっていても、指摘の文面が毎回違うため、どの種類の指摘が却下されているのかを集計できませんでした。指摘の出力はすでに--json-schemaで構造化されているので、スキーマにdetected_patternを加えれば、パターンごとの指摘数と却下率を機械的に集計できます。その結果、却下率の高いパターンについて、レビューの基準を見直したり、一時的に報告を止めたりといった対策を取れるようになります。\n\n誤答の見分け方は、指摘の種類という分析の単位を作っているかどうかです。自由記述の理由は集計しにくく、確信度やPR単位の集計は、指摘の種類を区別しません。\n\n本番では、detected_patternの値の一覧を定めておき、新しいパターンは\"other\"で受けて定期的に見直すと、集計の粒度を保てます。\n\n参考: https://code.claude.com/docs/en/headless"},{"id":58,"scenario":"Claude Codeの設定とワークフロー","situation":"ある半導体メーカーの組込みソフトウェアチームは、Claude Codeでファームウェアのコードを生成しています。コードの書き方の指示は、次のように複数のCLAUDE.mdに書かれています。\n\nリポジトリのルートのCLAUDE.mdには「インデントはスペース4つ」\n\nfirmware/ディレクトリのCLAUDE.mdには「MISRA Cに準拠し、インデントはスペース2つ」\n\n一部のメンバーの~/.claude/CLAUDE.mdには「インデントはタブを使う」\n\nfirmware/配下で生成されたCのコードを調べると、インデントがセッションやメンバーによって、タブ・スペース4つ・スペース2つとばらばらでした。","question":"最も適切な対処はどれですか。","choices":[{"text":"firmware/のCLAUDE.mdの先頭に「上位のCLAUDE.mdより優先する」と書き、他の記述はそのまま残す。","explanation":"CLAUDE.mdの各ファイルは、上書きし合うのではなく、連結されてコンテキストに入ります。起動したディレクトリに近いファイルほど後に読まれますが、矛盾する指示が残っている限り、Claudeがどちらに従うかは定まりません。「優先する」と書いても、矛盾そのものは解消されません。"},{"text":"ルートのCLAUDE.mdのインデント規約をfirmware/以外に限り、個人のCLAUDE.mdからインデントの指示を外す。","explanation":"正解。CLAUDE.mdは、ユーザーレベル、プロジェクトレベル、ディレクトリレベルのファイルがすべて連結されて読み込まれ、矛盾する指示があると、Claudeはどちらかを任意に選ぶ可能性があります。\n\nルートのインデント規約の適用範囲をfirmware/以外に限り、各メンバーの~/.claude/CLAUDE.mdからもインデントの指示を外せば、firmware/でのインデントの指示はfirmware/のCLAUDE.mdの「スペース2つ」だけになり、生成されるコードが安定します。"},{"text":"ルートのCLAUDE.mdを削除し、各ディレクトリのCLAUDE.mdだけでプロジェクトの規約を管理する。","explanation":"ルートのCLAUDE.mdを削除すると、firmware/以外の作業や、プロジェクト全体に共通する指示の置き場所がなくなります。今回の問題は、ルートの記述とfirmware/の記述が同じ項目で矛盾していることなので、記述の範囲を整理すれば十分です。"},{"text":"firmware/の規約を各メンバーの~/.claude/CLAUDE.mdにも書いてもらい、全員の設定をそろえる。","explanation":"全員のユーザーレベルの設定に同じ規約を書いても、ルートのCLAUDE.mdの「スペース4つ」との矛盾は残ります。また、チームの規約を個人の設定で管理すると、新しいメンバーには届かず、変更のたびに全員の設定を直す必要があります。"}],"answer":[1],"overall":"CLAUDE.mdの設定階層（ユーザーレベル、プロジェクトレベル、ディレクトリレベル）と、それらがどのように組み合わさるかがテーマです。公式ドキュメントによると、見つかったCLAUDE.mdのファイルはすべて、互いに上書きするのではなく、連結されてコンテキストに入ります。読み込みの順番は、ユーザーレベルが先、プロジェクトレベルが後で、ディレクトリの階層ではルートから起動したディレクトリに向かって並びます。そして、2つの指示が矛盾している場合、Claudeはどちらかを任意に選ぶ可能性があるとされています。\n\n本問では、同じ「インデント」という項目について、3つのレベルに異なる指示があるため、セッションやメンバーによって結果がばらついていました。決め手は、ばらつきがメンバーの違いにも連動していることで、ユーザーレベルの個人の設定も原因に含まれていることを示しています。\n\n誤答の見分け方は、矛盾そのものを解消しているかどうかです。「優先する」という記述、設定の追加、ファイルの削除は、いずれも矛盾を残すか、別の問題を生みます。\n\n本番では、CLAUDE.mdや.claude/rules/を定期的に見直し、古い指示や矛盾する指示を取り除くことが推奨されています。\n\n参考: https://code.claude.com/docs/en/memory"},{"id":59,"scenario":"プロンプトエンジニアリングと構造化出力","situation":"あるプロスポーツクラブの開発チームは、チケット販売アプリのプルリクエストをClaude Codeで自動レビューするCIパイプラインを運用しています。レビュー用のプロンプトにはN+1クエリを指摘するfew-shotの例が3件ありますが、いずれもforループの中で関連テーブルを参照する、同じ書き方のコードです。\n\n直近3か月の振り返りでは、本番で見つかったN+1クエリ9件のうち7件をレビューが見落としていました。見落とした7件は、内包表記の中での参照やシリアライザー経由での参照など、例とは書き方が異なるものでした。","question":"レビューが例と異なる形の問題にも判断を広げられるようにするための、few-shotの例の見直し方として最も効果的なものはどれですか。","choices":[{"text":"few-shotの例を外し、N+1クエリの定義と検出条件をシステムプロンプトに詳しく書く。","explanation":"定義を詳しく書くことは、判断基準をはっきりさせたいときに役立ちます。ただし、文章による指示だけでは一貫した結果にならないことが多く、ガイドでもそうした場合に最も効果的な手法としてfew-shotの例を挙げています。例を外すと、どのようなコードを問題とみなすかの具体的な手がかりが失われます。"},{"text":"書き方の異なるN+1の例と問題のない一括取得の例を、判断の理由付きでプロンプトに示す。","explanation":"正解。書き方の異なる複数の例を並べると、Claudeは個々のコードの形ではなく「ループの中でクエリが繰り返し発行される」という共通の性質に注目しやすくなります。さらに、似ているが問題ではない一括取得の例と判断の理由を添えることで判断の境界が伝わり、新しい書き方にも判断を一般化しつつ、誤検知も抑えられます。"},{"text":"既存の例は残し、「類似のパターンも漏れなく報告する」という指示を追記する。","explanation":"「類似のパターンも漏れなく報告する」は、何が類似にあたるかを定めていないあいまいな指示です。例が同じ書き方のままでは判断の手がかりは増えず、問題のない一括取得まで指摘する誤検知が増えるおそれもあります。"},{"text":"見落とした7件のコードを、そのままfew-shotの例として追加する。","explanation":"見落としたコードを例に加える方法は、特定の書き方を確実に拾いたいときには一定の効果があります。しかし、例が「事前に挙げた書き方の一覧」として働くだけなので、次に現れる別の書き方（たとえば非同期処理の中での参照）には同じように対応できません。本問の目的は、例にない形にも判断を広げることです。"}],"answer":[1],"overall":"few-shotの例は、詳細な指示だけでは結果が安定しない場合に、出力の一貫性と品質を高める有力な手段です。効果を引き出す鍵は、例を「一致させるべきケースの一覧」にせず、判断の根拠を伝える材料にすることです。\n\n書き方の異なる正例と、似ているが問題ではない負例を、判断の理由とともに示すと、Claudeは例に共通する性質を読み取り、事前に挙げていない新しいパターンにも判断を一般化できます。公式のプロンプトのベストプラクティスも、例は多様にし、エッジケースを含めて意図しないパターンを拾わせないよう求めています。\n\n誤答の見分け方は、見直した例が「特定のコードの一覧」なのか「判断の境界を示す材料」なのかです。見落としたケースをそのまま足す案は前者にとどまり、定義の文章化やあいまいな指示の追加は、例の問題を解決しません。\n\n本番では、見落としや誤検知が出たときに、表面的な書き方ではなく、どの判断が伝わっていなかったのかを特定してから例を選び直すと効果的です。\n\n参考: https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices"},{"id":60,"scenario":"プロンプトエンジニアリングと構造化出力","situation":"あるホテル予約サイトの開発チームは、CIパイプラインでClaude Codeに料金計算の不具合を修正させ、同じセッションの中で「自分の変更をレビューし、問題があれば指摘して」と依頼しています。レビューの精度を上げるため、拡張思考も有効にしています。\n\n過去30件のPRで、このセルフレビューが指摘した問題は0件でした。しかしリリース後に、連泊割引と消費税の丸めの順序が逆になっている不具合など、4件の不具合が見つかりました。","question":"レビューの仕組みとして適切な改善はどれですか。（2つ選択してください。）","choices":[{"text":"レビュー役には差分と仕様・レビュー基準だけを渡し、修正時の説明や推論は渡さない。","explanation":"正解。レビュー役に生成時の説明や推論を渡すと、別のインスタンスであっても、その説明を前提に読んでしまい、独立性が失われます。差分と仕様・レビュー基準だけを渡せば、レビュー役は結果そのものを自分の基準で評価できます。Claude Codeのベストプラクティスも、レビュー役は差分と与えられた基準だけを見るのがよいとしています。"},{"text":"修正を生成するセッションのeffortを上げ、より深く考えてからレビューさせる。","explanation":"effortを上げると、1回の応答で行う推論は深くなります。ただし、ガイドは、独立したレビューインスタンスのほうが、セルフレビューの指示や拡張思考よりも微妙な問題を見つけるうえで効果的だとしています。本問でも拡張思考を有効にしたまま見落としが起きており、推論を深くするだけでは解決しません。"},{"text":"同じセッションのまま、チェックリストを渡して「より厳しく」レビューし直すよう指示する。","explanation":"チェックリストは、レビューの観点をそろえるのには役立ちます。しかし、同じセッションで「より厳しく」と指示しても、生成時の推論を保持したままでは、自分の変更を正しいと考える傾向は変わりません。セルフレビューの限界は、指示の強さではなく、コンテキストを共有していることにあります。"},{"text":"修正を生成したセッションとは別の、独立したインスタンスでレビューを実行する。","explanation":"正解。コードを生成したのと同じセッションは、生成時の推論の流れを保持しているため、自分の判断を疑いにくくなります。以前の推論を持たない独立したインスタンスでレビューすれば、丸めの順序のような微妙な問題も、生成時の前提に引きずられずに検討できます。"}],"answer":[0,3],"overall":"マルチインスタンスのレビュー設計のうち、セルフレビューの限界がテーマです。ガイドは、モデルは生成時の推論の流れを保持しているため、同じセッション内では自身の判断を疑いにくくなること、そして以前の推論の流れを持たない独立したレビューインスタンスは、セルフレビューの指示や拡張思考よりも、微妙な問題を見つけるうえで効果的であることを挙げています。\n\n本問の30件で指摘が0件だったのは、レビューが修正と同じセッションで行われていたためです。拡張思考を有効にしても改善しなかったことは、推論の深さではなく、コンテキストを共有していることが原因だと示しています。正解の2つは、独立したインスタンスでレビューすることと、そのインスタンスに生成時の推論を渡さないことで、どちらもレビューの独立性を確保するものです。\n\n誤答の見分け方は、レビューがまだ生成時の前提に縛られていないかどうかです。同じセッションでの再レビューも、effortの引き上げも、その前提を共有したままです。\n\n本番では、レビュー役が細かな好みまで指摘しすぎないよう、正しさや要件に関わる問題だけを報告するよう基準に書いておくと、過剰な修正を防げます。\n\n参考: https://code.claude.com/docs/en/best-practices"}]</script>
<script>
(function(){
var Q=JSON.parse(document.getElementById('data').textContent);
var N=Q.length,L='ABCDE',NOSC='ドメイン未記載';
var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var answers=Q.map(function(){return null;});
var pending=Q.map(function(){return [];});
var cur=0,view='quiz',armTimer=null,armed=false;
function $(id){return document.getElementById(id);}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function fmt(s){
  var parts=String(s).split('`');
  if(parts.length%2===0)return esc(s);
  return parts.map(function(p,i){return i%2?'<code>'+esc(p)+'</code>':esc(p);}).join('');
}
function paras(s,link){
  return String(s).split('\n\n').map(function(p){
    var h=fmt(p);
    if(link)h=h.replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
    return '<p>'+h+'</p>';
  }).join('');
}
function sc(q){return q.scenario||NOSC;}
function isMulti(q){return q.answer.length>1;}
function sortn(a){return a.slice().sort(function(x,y){return x-y;});}
function letters(a){return sortn(a).map(function(i){return L[i];}).join('・');}
function scenarios(){var o=[];Q.forEach(function(q){var s=sc(q);if(o.indexOf(s)<0)o.push(s);});return o;}
function counts(){var a=0,ok=0,ng=0;answers.forEach(function(x){if(x){a++;if(x.ok)ok++;else ng++;}});return {a:a,ok:ok,ng:ng,un:N-a};}
function status(i){
  if(answers[i])return answers[i].ok?'ok':'ng';
  return pending[i].length?'sel':'none';
}
function toTop(){window.scrollTo({top:0,behavior:reduce?'auto':'smooth'});}

function renderSide(){
  var c=counts();
  var h='<button class="btn small drawer-close" data-act="menu">✕ 閉じる</button>'+
    '<h1>Claude Certified<br>Architect</h1><p class="code">CCAR-F 練習テスト 5（全60問）</p>'+
    '<p class="sub">4択（一部は2つ選択）。選択肢を選ぶとその場で正誤と解説が表示されます。2つ選択の問題は「回答する」で判定します。</p>'+
    '<p class="score" aria-live="polite">回答済み <b>'+c.a+' / '+N+'</b>　正解 <b>'+c.ok+'</b></p>'+
    '<div class="bar" aria-hidden="true"><i style="width:'+(c.a/N*100)+'%"></i></div>';
  h+='<div class="grp"><div class="grp-h"><span>問題一覧</span></div><div class="grid">';
  Q.forEach(function(q,i){
    var st=status(i);
    var lab='問題'+q.id+(st==='ok'?' 正解':st==='ng'?' 不正解':st==='sel'?' 選択中':' 未回答');
    h+='<button type="button" class="dot" data-s="'+st+'" data-go="'+i+'" aria-label="'+lab+'"'+(view==='quiz'&&i===cur?' aria-current="true"':'')+'>'+q.id+'</button>';
  });
  h+='</div></div>';
  h+='<p class="legend">丸＝正解　角丸の四角＝不正解　青＝現在地</p>'+
    '<div class="sidebtns"><button type="button" class="btn small" data-act="score">採点する</button>'+
    '<button type="button" class="btn small" data-act="restart">'+(armed?'もう一度押すと全回答を消去':'最初からやり直す')+'</button></div>';
  $('side').innerHTML=h;
}
function renderTop(){
  var h='<button type="button" class="btn menu-btn" data-act="menu" aria-expanded="'+$('side').classList.contains('open')+'">☰ 問題一覧</button>';
  if(view==='quiz'){
    h+='<span class="pos">'+Q[cur].id+' / '+N+'</span>'+
      '<button type="button" class="btn" data-act="prev"'+(cur===0?' disabled':'')+'>前へ</button>'+
      '<button type="button" class="btn" data-act="next"'+(cur===N-1?' disabled':'')+'>次へ</button>'+
      '<button type="button" class="btn primary" data-act="score">採点する</button>';
  }else{
    h+='<span class="pos">採点結果</span><button type="button" class="btn" data-act="back">問題に戻る</button>';
  }
  $('topbar').innerHTML=h;
}
function renderQuiz(){
  var q=Q[cur],a=answers[cur],multi=isMulti(q),pend=pending[cur];
  var h='<section class="sheet" aria-label="問題'+q.id+'"><div class="qhead"><span class="qno">問題 '+q.id+'</span><span class="qtotal">／ '+N+'</span><span class="scn">'+esc(sc(q))+'</span>'+(multi?'<span class="tag">複数選択（2つ）</span>':'')+'</div>';
  h+='<div class="stem">'+paras(q.situation)+'</div><div class="prompt">'+paras(q.question)+'</div>';
  if(a){
    h+='<div class="banner '+(a.ok?'ok':'ng')+'" id="banner" tabindex="-1" role="status"><h2>'+(a.ok?'正解！':'不正解。正解は '+esc(letters(q.answer)))+'</h2>'+
      '<p>あなたの回答：'+esc(letters(a.sel))+'</p></div>';
  }
  h+='<ol class="opts'+(multi?' multi':'')+'" role="'+(multi?'group':'radiogroup')+'" aria-label="選択肢">';
  q.choices.forEach(function(c,i){
    var isC=q.answer.indexOf(i)>=0,sel=(a?a.sel:pend).indexOf(i)>=0;
    var li='opt'+(a?(isC?' ok':' ng')+(sel?' picked':''):'');
    var cl='choice'+(!a&&sel?' on':'');
    h+='<li class="'+li+'"><button type="button" class="'+cl+'" data-ch="'+i+'" role="'+(multi?'checkbox':'radio')+'" aria-checked="'+sel+'"'+(a?' aria-disabled="true"':'')+'>'+
      '<span class="mark" aria-hidden="true">'+L[i]+'</span><span class="txt">'+fmt(c.text)+'</span>';
    if(a){
      var mt=(isC?'<span class="pill ok">✓ 正解の選択肢</span>':(a.ok?'':'<span class="pill ng">✕ 誤りの選択肢</span>'))+(sel?'<span class="pill me">あなたの回答</span>':'');
      if(mt)h+='<span class="meta">'+mt+'</span>';
    }
    h+='</button>';
    if(a)h+='<div class="why"><h3>解説</h3>'+paras(c.explanation)+'</div>';
    h+='</li>';
  });
  h+='</ol>';
  if(!a){
    h+='<p class="hint" id="hint" aria-live="polite">'+(multi?'2つ選んでください（現在 '+pend.length+' / 2）':'1つ選んでください')+'</p>';
    if(multi)h+='<div class="actions"><span></span><div class="grow"><button type="button" class="btn primary" data-act="submit"'+(pend.length===2?'':' disabled')+'>回答する</button></div></div>';
  }else{
    h+='<section class="overall" aria-label="全体的な説明"><h2>全体的な説明</h2>'+paras(q.overall,true)+'</section>';
  }
  h+='<div class="actions pair"><button type="button" class="btn" data-act="prev"'+(cur===0?' disabled':'')+'>前へ</button><button type="button" class="btn primary" data-act="next"'+(cur===N-1?' disabled':'')+'>次へ</button></div></section>';
  $('main').innerHTML=h;
}
function renderScore(){
  var c=counts();
  var rate=Math.round(c.ok/N*1000)/10;
  var h='<section class="sheet result" aria-label="採点結果"><h2>'+N+'問中 '+c.ok+'問 正解</h2>'+
    '<p class="lead">'+(c.un?'未回答が '+c.un+'問あります。':'すべての問題に回答しました。')+'</p>'+
    '<div class="stats"><div class="stat"><b>'+rate+'%</b><span>正答率（全'+N+'問中）</span></div>'+
    '<div class="stat ok"><b>'+c.ok+'</b><span>正解数</span></div>'+
    '<div class="stat ng"><b>'+c.ng+'</b><span>不正解数</span></div>'+
    '<div class="stat"><b>'+c.un+'</b><span>未回答数</span></div></div>';
  var wrong=[];Q.forEach(function(q,i){if(answers[i]&&!answers[i].ok)wrong.push(i);});
  h+='<h3>不正解だった問題（シナリオ別）</h3>';
  if(!wrong.length)h+='<p>不正解の問題はありません。</p>';
  scenarios().forEach(function(s){
    var w=wrong.filter(function(i){return sc(Q[i])===s;});
    if(!w.length)return;
    h+='<div class="grp"><div class="grp-h" style="margin-bottom:10px"><span>'+esc(s)+'</span><span>'+w.length+'問</span></div>';
    w.forEach(function(i){
      var q=Q[i],a=answers[i];
      h+='<div class="witem"><div class="wh"><button type="button" class="chip" data-go="'+i+'">問題'+q.id+'</button><span class="pill me">押すと問題に戻ります</span></div>'+
        '<div class="stem">'+paras(q.situation)+'</div><div class="q">'+paras(q.question)+'</div>'+
        '<div class="row mine"><span class="lab">あなたの回答</span>'+sortn(a.sel).map(function(k){return '<div>'+L[k]+'. '+fmt(q.choices[k].text)+'</div>';}).join('')+'</div>'+
        '<div class="row corr"><span class="lab">正解</span>'+sortn(q.answer).map(function(k){return '<div>'+L[k]+'. '+fmt(q.choices[k].text)+'</div>';}).join('')+'</div></div>';
    });
    h+='</div>';
  });
  h+='<div class="actions"><button type="button" class="btn" data-act="back">問題に戻る</button><div class="grow"><button type="button" class="btn primary" data-act="restart">'+(armed?'もう一度押すと全回答を消去':'最初からやり直す')+'</button></div></div></section>';
  $('main').innerHTML=h;
}
function render(top){
  renderSide();renderTop();
  if(view==='quiz')renderQuiz();else renderScore();
  if(top)toTop();
}
function closeDrawer(){$('side').classList.remove('open');$('backdrop').classList.remove('show');}
function go(i){cur=Math.min(Math.max(i,0),N-1);view='quiz';closeDrawer();render(true);}
function submit(){
  var q=Q[cur],sel=pending[cur].slice();
  if(answers[cur])return;
  if(sel.length!==q.answer.length)return;
  var ok=sel.every(function(x){return q.answer.indexOf(x)>=0;});
  answers[cur]={sel:sel,ok:ok};
  render(false);
  var bn=$('banner');
  if(bn){bn.scrollIntoView({block:'start',behavior:reduce?'auto':'smooth'});bn.focus({preventScroll:true});}
}
function pick(i){
  if(answers[cur])return;
  var q=Q[cur];
  if(!isMulti(q)){pending[cur]=[i];submit();return;}
  var p=pending[cur],k=p.indexOf(i);
  if(k>=0)p.splice(k,1);
  else if(p.length<2)p.push(i);
  else{var h=$('hint');if(h)h.textContent='選べるのは2つまでです。選択を外してから選び直してください。';return;}
  render(false);
  var b=document.querySelector('[data-ch="'+i+'"]');if(b)b.focus({preventScroll:true});
}
function restart(){
  if(!armed){
    armed=true;clearTimeout(armTimer);
    armTimer=setTimeout(function(){armed=false;renderSide();if(view==='score')renderScore();},4000);
    renderSide();if(view==='score')renderScore();
    return;
  }
  clearTimeout(armTimer);armed=false;
  answers=Q.map(function(){return null;});pending=Q.map(function(){return [];});
  cur=0;view='quiz';closeDrawer();render(true);
}
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-go],[data-ch],[data-act]');
  if(!t){if(e.target.id==='backdrop')closeDrawer();return;}
  if(t.hasAttribute('data-go')){go(parseInt(t.getAttribute('data-go'),10));return;}
  if(t.hasAttribute('data-ch')){pick(parseInt(t.getAttribute('data-ch'),10));return;}
  var act=t.getAttribute('data-act');
  if(act==='prev'){go(cur-1);}
  else if(act==='next'){go(cur+1);}
  else if(act==='score'){view='score';closeDrawer();render(true);}
  else if(act==='back'){view='quiz';render(true);}
  else if(act==='submit'){submit();}
  else if(act==='restart'){restart();}
  else if(act==='menu'){var o=$('side').classList.toggle('open');$('backdrop').classList.toggle('show',o);renderTop();}
});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeDrawer();});
render(false);
})();
</script>
</body>
</html>
