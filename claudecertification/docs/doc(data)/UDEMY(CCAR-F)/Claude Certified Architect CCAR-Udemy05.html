<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Claude Certified Architect CCAR-F 練習テスト 5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --paper:#FFFFFF; --soft:#F4F6FC;
  --ink:#000000; --ink2:#222222; --line:#8F8F8F; --line2:#4D4D4D;
  --accent:#2D4FD6; --on-accent:#FFFFFF; --sel:#E8EDFF;
  --ok:#0B6C8A; --ok-bg:#E1F1F6; --ng:#B4432B; --ng-bg:#FBE9E4;
  --sans:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  --serif:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --code:#ECECEC;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 76px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.8;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
code{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:.88em;background:var(--code);border-radius:5px;padding:.1em .4em;overflow-wrap:anywhere}

.shell{display:grid;grid-template-columns:292px minmax(0,1fr);gap:36px;max-width:1120px;margin:0 auto;padding:28px 20px 72px}
.side{align-self:start;position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);max-height:calc(100vh - 32px - env(safe-area-inset-top,0px));overflow:auto;padding-right:2px}
.side h1{font-family:var(--serif);font-weight:700;font-size:23px;line-height:1.45;margin:0 0 4px;letter-spacing:.02em}
.side .code{margin:0 0 10px;font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--accent)}
.side .sub{margin:0 0 18px;color:var(--ink2);font-size:13px}
.score{margin:0 0 8px;font-size:14px;font-variant-numeric:tabular-nums}
.score b{font-weight:700}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-bottom:18px}
.bar i{display:block;height:100%;background:var(--accent);width:0}
.grp{margin:0 0 18px}
.grp-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13.5px;font-weight:700;line-height:1.5}
.grp-h span:last-child{font-weight:400;color:var(--ink2);font-size:12.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:8px;margin-top:8px}
.dot{width:36px;height:36px;border-radius:50%;border:2px solid var(--line2);background:var(--paper);color:var(--ink);font-size:12.5px;font-weight:500;font-variant-numeric:tabular-nums;cursor:pointer;display:grid;place-items:center;padding:0;line-height:1}
.dot[data-s="ok"]{border-color:var(--ok);color:var(--ok);background:var(--ok-bg);font-weight:700}
.dot[data-s="ng"]{border-color:var(--ng);color:var(--ng);background:var(--ng-bg);font-weight:700;border-radius:10px}
.dot[data-s="sel"]{background:var(--sel);border-color:var(--accent);color:var(--accent);font-weight:700}
.dot[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.legend{margin:6px 0 16px;font-size:12px;color:var(--ink2);line-height:1.7}
.sidebtns{display:flex;flex-direction:column;gap:8px}
.drawer-close{display:none}

.btn{border:1.5px solid var(--line2);background:var(--paper);color:var(--ink);padding:10px 18px;border-radius:10px;cursor:pointer;font-weight:500;font-size:15px;min-height:44px;transition:background .15s,border-color .15s}
.btn:hover:not(:disabled){background:var(--sel);border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.btn.primary:hover:not(:disabled){filter:brightness(1.08);background:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.small{min-height:40px;padding:8px 14px;font-size:14px}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:16px}
.topbar .pos{font-family:var(--serif);font-weight:700;font-size:19px;margin-right:auto;font-variant-numeric:tabular-nums;white-space:nowrap}
.menu-btn{display:none}

.sheet{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:30px 32px 32px}
.qhead{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px 12px;margin-bottom:18px}
.qno{font-family:var(--serif);font-weight:700;font-size:26px;letter-spacing:.02em}
.qtotal{color:var(--ink2);font-size:14px;font-variant-numeric:tabular-nums}
.scn{font-size:12.5px;color:var(--ink2);border:1px solid var(--line2);border-radius:6px;padding:0 8px;line-height:1.7}
.tag{font-size:13px;font-weight:700;border:1.5px solid var(--accent);color:var(--accent);padding:1px 10px;border-radius:999px;line-height:1.7}
.stem p,.overall p,.why p,.banner p{margin:0 0 .8em;overflow-wrap:anywhere}
.prompt{font-family:var(--serif);font-weight:700;font-size:19.5px;line-height:1.75;margin:18px 0 20px}
.prompt p{margin:0}

.banner{border-left:4px solid var(--line2);padding:6px 16px 2px;margin:0 0 20px;scroll-margin-top:calc(env(safe-area-inset-top,0px) + 80px)}
.banner:focus{outline:none}
.banner h2{font-family:var(--serif);font-size:19px;margin:0 0 2px;line-height:1.5}
.banner.ok{border-color:var(--ok)}.banner.ok h2{color:var(--ok)}
.banner.ng{border-color:var(--ng)}.banner.ng h2{color:var(--ng)}

ol.opts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.choice{display:grid;grid-template-columns:36px minmax(0,1fr);column-gap:14px;align-items:start;width:100%;text-align:left;padding:14px 16px;border:2px solid var(--line);border-radius:12px;background:var(--paper);cursor:pointer;transition:background .15s,border-color .15s}
.choice:hover:not([aria-disabled="true"]){background:var(--sel);border-color:var(--accent)}
.choice[aria-disabled="true"]{cursor:default}
.mark{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center;font-family:var(--serif);font-weight:700;font-size:15px;background:var(--paper);margin-top:1px}
.multi .mark{border-radius:9px}
.choice.on{border-color:var(--accent);background:var(--sel)}
.choice.on .mark{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.choice .txt{font-size:16px;line-height:1.75;padding-top:3px;overflow-wrap:anywhere}
.meta{grid-column:2;display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:8px}
.pill{font-size:12.5px;font-weight:500;line-height:1.7}
.pill.ok{color:var(--ok)}.pill.ng{color:var(--ng)}.pill.me{color:var(--ink2)}
.opt.ok .choice{border-color:var(--ok);background:var(--ok-bg)}
.opt.ok .mark{border-color:var(--ok);background:var(--ok);color:var(--paper)}
.opt.ng.picked .choice{border-color:var(--ng);background:var(--ng-bg)}
.opt.ng.picked .mark{border-color:var(--ng);background:var(--ng);color:var(--paper)}
.why{margin:8px 0 0 50px;padding:10px 16px 4px;border-left:3px solid var(--line2);background:var(--soft);border-radius:0 8px 8px 0;font-size:14.5px;line-height:1.9}
.why h3{margin:0 0 4px;font-size:13px;font-weight:700;color:var(--ink2)}
.hint{margin:14px 0 0;font-size:14px;color:var(--ink2);min-height:1.8em}

.overall{margin-top:30px;padding-top:22px;border-top:1.5px solid var(--line)}
.overall h2{font-family:var(--serif);font-size:19px;margin:0 0 10px}
.overall a{color:var(--accent);word-break:break-all}
.actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;margin-top:28px}
.actions .grow{display:flex;gap:10px;flex-wrap:wrap}
.actions.pair .btn{flex:1}

.result h2{font-family:var(--serif);font-size:25px;margin:0 0 8px;line-height:1.5}
.result .lead{font-size:16px;margin:0 0 18px;color:var(--ink2)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin:0 0 6px}
.stat{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--soft)}
.stat b{display:block;font-family:var(--serif);font-size:28px;line-height:1.3;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--ink2)}
.stat.ok b{color:var(--ok)}.stat.ng b{color:var(--ng)}
.result h3{font-family:var(--serif);font-size:18px;margin:28px 0 10px;padding-bottom:6px;border-bottom:1.5px solid var(--line)}
.witem{border-left:4px solid var(--ng);background:var(--soft);border-radius:0 10px 10px 0;padding:12px 16px 6px;margin:0 0 14px}
.witem .wh{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.chip{border:1.5px solid var(--ng);color:var(--ng);background:var(--paper);border-radius:10px;padding:4px 12px;cursor:pointer;font-weight:700;font-size:14px;min-height:36px}
.chip:hover{background:var(--ng-bg)}
.witem .q{font-family:var(--serif);font-weight:700;margin:8px 0}
.witem .q p{margin:0}
.witem .row{margin:8px 0;font-size:15px}
.witem .lab{display:block;font-size:12.5px;font-weight:700;margin-bottom:2px}
.witem .mine .lab{color:var(--ng)}.witem .corr .lab{color:var(--ok)}
.witem .row div{overflow-wrap:anywhere}
.backdrop{display:none}

@media (max-width:760px){
  .shell{grid-template-columns:minmax(0,1fr);gap:0;padding:12px 12px 56px}
  .side{position:fixed;z-index:80;top:0;bottom:0;left:0;width:min(88vw,330px);max-height:none;background:var(--bg);padding:calc(18px + env(safe-area-inset-top,0px)) 18px calc(24px + env(safe-area-inset-bottom,0px));border-right:1px solid var(--line);transform:translateX(-104%);transition:transform .22s;overflow:auto}
  .side.open{transform:none}
  .backdrop.show{display:block;position:fixed;inset:0;z-index:70;background:rgba(10,15,30,.5)}
  .drawer-close{display:inline-block;margin-bottom:12px}
  .menu-btn{display:inline-block}
  .topbar{padding:8px 10px}
  .topbar .pos{font-size:17px}
  .topbar .btn{padding:8px 11px;font-size:14px;min-height:40px}
  .sheet{padding:22px 18px 24px}
  .why{margin-left:0}
  .qno{font-size:23px}
  .prompt{font-size:18px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="shell">
  <aside class="side" id="side" aria-label="進捗と問題一覧"></aside>
  <div>
    <div class="topbar" id="topbar"></div>
    <main id="main"></main>
  </div>
</div>
<div class="backdrop" id="backdrop"></div>
<script id="data" type="application/json">[{"id":1,"scenario":"プロンプトエンジニアリングと構造化出力","situation":"ある環境保護団体のIT部門は、寄付の受付プラットフォームのプルリクエストをClaude Codeで自動レビューしています。レビューのプロンプトには「コードのコメントが正確かどうかも確認すること」と書かれています。\n\nコメントに関する指摘は週に約210件あり、そのうち約7割は、コードの動作とは関係のない次のような指摘で、開発者に却下されていました。\n\n言い回しが分かりにくい\n\n句読点が不統一\n\nTODOが古い\n\n一方で、コメントには「金額は税込で返す」とあるのに、実際は税抜で返していたという本当の問題は見落とされていました。","question":"コメントのレビューの精度を高めるために適切な変更はどれですか。（2つ選択してください。）","choices":[{"text":"プロンプトに「保守的に判断し、確信度の高い指摘だけを報告すること」という指示を加える。","explanation":"「保守的に」「確信度の高いものだけ」といった一般的な指示は、具体的なカテゴリ別の基準と比べて、精度の向上につながりにくいとされています。何が報告に値するのかが定義されていないため、言い回しの指摘が減るとは限らず、本当の問題まで報告されなくなるおそれもあります。"},{"text":"言い回しや句読点、動作と矛盾しない古いTODOなど、報告しない対象を具体的に列挙する。","explanation":"正解。報告すべき問題だけでなく、スキップすべき問題を具体的に定義することも、明示的な基準の一部です。言い回し、句読点、動作と矛盾しない古いTODOのように、却下されている指摘の種類を報告しない対象として列挙すれば、誤検知を直接減らせます。"},{"text":"各指摘に確信度を出力させ、確信度が0.8以上の指摘だけをPRに投稿する。","explanation":"確信度によるフィルタリングは、件数を減らす手段にはなります。しかし、モデルは言い回しの指摘にも高い確信度を付けることがあり、何を報告すべきかという基準があいまいなままでは、精度は改善しません。ガイドも、確信度に基づくフィルタリングに頼るのではなく、報告すべき問題を定義する基準を書くよう求めています。"},{"text":"プロンプトの指示を「コメントの記述がコードの動作と矛盾する場合だけ指摘する」に変える。","explanation":"正解。ガイドは、「コメントの正確性を確認する」のようなあいまいな指示ではなく、「主張されている動作が実際のコードの動作と矛盾する場合にのみ指摘する」という明示的な基準を例に挙げています。報告の条件をこのように定義すれば、税込と税抜の食い違いのような本当の問題に注意が向き、動作と関係のない指摘は対象から外れます。"}],"answer":[1,3],"overall":"明示的な基準で精度を高め、誤検知を減らすプロンプト設計がテーマです。ガイドは、あいまいな指示よりも明示的な基準が重要であることを、「コメントの正確性を確認する」ではなく「主張されている動作が実際のコードの動作と矛盾する場合にのみコメントを指摘する」という例で示しています。また、報告すべき問題とスキップすべき問題を定義する具体的なレビュー基準を書くこと、「保守的に判断する」「確信度の高い指摘事項のみを報告する」といった一般的な指示が精度の向上につながらないことも挙げています。\n\n本問の「コメントが正確かどうかも確認する」という指示は、何をもって不正確とするかを定めていないため、言い回しのような動作と無関係な指摘が大量に出る一方で、動作との矛盾という本当の問題を見落としていました。正解の2つは、報告する条件の定義と、報告しない対象の列挙で、基準の両側を具体化するものです。\n\n誤答の見分け方は、基準そのものを書いているか、確信度による絞り込みに頼っているかです。\n\n本番では、誤検知の多いカテゴリを一時的に無効化し、基準を改善してから戻すことで、開発者の信頼を保ちながら調整できます。\n\n参考: https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices"},{"id":2,"scenario":"ツール設計とMCP統合","situation":"ある鉄道会社の技術調査チームは、マルチエージェントリサーチシステムで、車両の故障報告や保守記録を分析しています。このシステムで使っているモデルは、tool_choiceの\"any\"と特定のツールの指定に対応しています。tool_choiceを見直す対象は、次の3か所です。\n\nコーディネーターは、単純な質問には自分で直接答え、必要な場合だけサブエージェントを呼び出す\n\n文書分析では、毎回、最初にextract_metadataで文書の種類と日付を取り出してから、エンリッチメント（保守台帳の情報を付け加える処理）のツールを使う\n\nレポート生成では、結果をreport_tableかreport_textのどちらかの出力用ツールで返し、会話のテキストだけで終わらせない","question":"tool_choiceの設定として適切なものはどれですか。（2つ選択してください。）","choices":[{"text":"文書分析のすべてのターンでextract_metadataを強制指定し、エンリッチメントも同じ結果から行わせる。","explanation":"すべてのターンでextract_metadataを強制すると、Claudeは毎回そのツールしか呼べず、エンリッチメントのツールを使う段階に進めません。強制選択は最初のステップを確実に実行させるために使い、その後のステップは後続のターンで処理するのが基本です。"},{"text":"レポート生成のリクエストではtool_choiceを\"any\"にし、出力用ツールのいずれかを必ず呼ばせる。","explanation":"正解。tool_choiceの\"any\"は、Claudeに必ずいずれかのツールを呼び出させ、どのツールを使うかの選択は任せる設定です。出力用のツールが2つあり、どちらを使うかは内容に応じて選ばせたいレポート生成には、特定のツールの強制ではなく\"any\"が適しています。"},{"text":"文書分析の最初のリクエストだけextract_metadataを強制し、残りは後続のターンで行う。","explanation":"正解。tool_choiceのtypeを\"tool\"、nameを\"extract_metadata\"にすると、Claudeは指定した名前のツールを必ず呼び出します。最初のリクエストだけで強制し、メタデータを取り出したあとのエンリッチメントは後続のターンで通常の選択に戻すことで、処理の順番を確実にしつつ、その後のツール選択の柔軟さも保てます。"},{"text":"コーディネーターではtool_choiceを\"any\"にし、毎回いずれかのサブエージェントを呼ばせる。","explanation":"\"any\"にすると、Claudeは毎回必ずツールを呼び出すため、単純な質問に直接答えることができなくなります。ツールを呼ぶかどうかをモデルに判断させたいコーディネーターには、テキストでの回答も認める\"auto\"が適しています。"}],"answer":[1,2],"overall":"tool_choiceの3つの設定を、役割に応じて使い分ける問題です。tool_choiceには、ツールを呼ぶかどうかをモデルが判断する\"auto\"、必ずいずれかのツールを呼ぶがどれを使うかは選べる\"any\"、指定した名前の特定のツールを必ず呼ぶ強制的なツール選択（typeを\"tool\"にしてnameでツールを指定）があります。ガイドは、強制選択で特定のツールが最初に呼び出されるようにし、その後のステップは後続のターンで処理すること、そしてモデルが会話のテキストを返すのではなく確実にツールを呼び出すように\"any\"を設定することを挙げています。\n\n本問の3か所は、それぞれ別の設定が合います。コーディネーターは直接答える場合があるので\"auto\"、文書分析の最初の一手は強制選択、レポート生成は複数の出力用ツールから選ばせる\"any\"です。\n\n誤答の見分け方は、設定によって奪われる選択肢を考えることです。\"any\"はテキストだけの回答を、全ターンの強制は他のツールの使用を、それぞれ不可能にします。\n\nなお、2026年9月以降に公開された一部のモデルでは、tool_choiceのanyやtoolによる強制が400エラーになります。試験ガイド（2026年7月版）より新しい変更のため、本試験では強制できる前提で出題される可能性があります。対応しないモデルでは\"auto\"とstrictなツール定義などで代替します。\n\n参考: https://platform.claude.com/docs/en/agents-and-tools/tool-use/define-tools"},{"id":3,"scenario":"プロンプトエンジニアリングと構造化出力","situation":"ある家電メーカーは、構造化データ抽出システムを運用しています。このシステムは、顧客から送られてくる保証書の画像から型番・製造番号・購入日・販売店名を抽出し、JSONに変換します。抽出結果は検証スクリプトで確認し、エラーがあれば、検証エラーを添えて最大3回までリトライしています。\n\n先週の検証エラーを分析したところ、内訳は次のとおりでした。\n\n58%は、購入日が「2026年9月14日」のような和文の表記のままで、規定のISO 8601形式に変換されていないもの\n\n残りの42%は型番の欠落で、それらの保証書には型番の欄がなく、型番は同封の購入明細にだけ記載されていた\n\n型番の欠落は、3回リトライしても1件も解消していません。","question":"リトライの運用の見直し方として、最も適切なものはどれですか。","choices":[{"text":"型番の欠落だけをリトライの対象にし、購入日の形式の誤りは人間のレビューに回す。","explanation":"対象が逆になっています。型番の欠落は元の文書に情報がないためリトライでは直らず、購入日の形式の誤りは、検証エラーを添えたリトライで直せる典型的なケースです。"},{"text":"リトライはやめ、検証エラーはすべて人間のレビューに回す。","explanation":"すべてを人間のレビューに回せば確実ではありますが、検証エラーの58%を占める形式の誤りは、リトライで自動的に直せます。レビュー担当者の負担が大きく増えるわりに、得られる効果は小さい対応です。"},{"text":"2種類のエラーのどちらについても、リトライの上限を3回から5回に増やす。","explanation":"リトライの回数を増やすのは、形式の誤りのように直せる見込みのあるエラーで成功率を上げたいときの調整です。しかし、型番の欠落は保証書そのものに情報がないことが原因なので、何回リトライしても解消せず、時間とコストが増えるだけです。"},{"text":"形式の誤りはリトライで直し、型番の欠落は購入明細を入力に加えて解決する。","explanation":"正解。形式の誤りは、元の文書と失敗した抽出結果、具体的な検証エラーを渡せば、モデルが自己修正できます。一方、型番の欠落は必要な情報が保証書に存在しないことが原因なので、リトライは効きません。情報を含む購入明細を入力に加えるか、型番のフィールドをnull許容にして「記載なし」として扱う必要があります。"}],"answer":[3],"overall":"抽出の検証とリトライのループで、リトライが効く場合と効かない場合の見極めがテーマです。ガイドは、検証エラーを添えたリトライを有効な手法とする一方で、必要な情報がそもそも元の文書に存在しない場合には、形式や構造のエラーと異なり、リトライは効果がないことを挙げています。\n\n本問の検証エラーは2種類で、性質がまったく違います。購入日の形式の誤りは、情報は文書にあり表し方が違うだけなので、検証エラーを示せば直せます。型番の欠落は、保証書に型番が書かれておらず購入明細にしか情報がないため、同じ保証書を何度読ませても直りません。決め手は「3回リトライしても1件も解消していない」という事実で、情報が入力にないことを裏付けています。\n\n誤答の見分け方は、エラーの原因に応じて対処を分けているかどうかです。一律の回数変更や一律のレビューは、2種類のエラーを区別していません。\n\n本番では、元の文書に情報が含まれない可能性のあるフィールドをnull許容にしておくと、モデルが必須を満たすために値を捏造することも防げます。\n\n参考: https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/reduce-hallucinations"},{"id":4,"scenario":"ツール設計とMCP統合","situation":"ある証券会社の調査部門は、マルチエージェントリサーチシステムで、銘柄ごとの市場動向レポートを作成しています。市場データを取得するサブエージェントのMCPツールは、現在どのような失敗でも\"Operation failed\"という一律のエラーを返しており、コーディネーターは失敗のたびに同じ要求を3回繰り返しています。\n\n直近1週間の失敗を調べると、次の3種類がありました。\n\n取引所APIのタイムアウト\n\n存在しない銘柄コードの指定\n\n契約に含まれていない海外取引所のデータへのアクセス拒否\n\nチームは、失敗の種類に応じてエラーレスポンスを返し分けることにしました。","question":"返し方とコーディネーターの対応の組み合わせとして、最も適切なものはどれですか。","choices":[{"text":"契約外の取引所データの取得拒否を権限エラーとして返し、情報源の不足として報告させる。","explanation":"正解。契約外のデータへのアクセス拒否は権限エラーで、リトライしても結果は変わりません。権限エラーとしてリトライ不可と示し、どのデータが取得できなかったかを伝えれば、コーディネーターは別の情報源を探すか、その領域のデータが不足していることをレポートに注記するかを判断できます。"},{"text":"取引所APIのタイムアウトを検証エラーとして返し、入力を修正して呼び直させる。","explanation":"タイムアウトは、時間をおけば成功する可能性のある一時的なエラーです。入力には誤りがないため、検証エラーとして返すと、コーディネーターは正しい銘柄コードを書き換えようとし、無駄な修正と誤った結果を招きます。一時的なエラーとして返し、リトライ可能と示すのが適切です。"},{"text":"存在しない銘柄コードの指定を一時的なエラーとして返し、時間をおいてリトライさせる。","explanation":"存在しない銘柄コードは入力の誤りなので、何度リトライしても成功しません。一時的なエラーとして返すと、時間をおいた無駄なリトライが続きます。検証エラーとしてリトライ不可と示し、正しいコードを確認させるのが適切です。"},{"text":"契約外の取引所データの取得拒否を一時的なエラーとして返し、同じ要求を繰り返させる。","explanation":"契約に含まれていないデータへのアクセスは、何度要求しても許可されません。一時的なエラーとして返すと、今と同じように無駄な要求の繰り返しが続きます。リトライによって状況が変わらない失敗は、リトライできないことを明示する必要があります。"}],"answer":[0],"overall":"MCPツールの構造化されたエラーレスポンスで、エラーの種類を区別する意味がテーマです。ガイドは、一時的なエラー（タイムアウト、サービスの利用不可）、検証エラー（無効な入力）、ビジネスエラー（ポリシー違反）、権限エラーの違いを知識として挙げ、一律のエラーレスポンス（汎用的な\"Operation failed\"）では、エージェントが適切な復旧の判断を下せなくなるとしています。また、リトライ可能かどうかを構造化されたメタデータとして返すことで、無駄なリトライを防げます。\n\n本問の3種類の失敗は、取るべき対応がすべて異なります。タイムアウトは時間をおいてリトライし、存在しない銘柄コードは入力を直し、契約外のデータは別の情報源を探すか不足として報告します。\n\n誤答の3つは、いずれもエラーの種類の判定を誤り、その結果として誤った対応につながっています。なお、エラーの分類名（errorCategoryの値など）はアプリケーション側で設計するもので、大切なのは名前ではなく、分類によってエージェントの対応を正しく分けられることです。\n\n本番では、エラーの種類ごとの発生件数を監視すると、契約の見直しや入力チェックの強化といった改善点が見えてきます。\n\n参考: https://www.anthropic.com/engineering/writing-tools-for-agents"},{"id":5,"scenario":"Claude Codeの設定とワークフロー","situation":"ある広告配信会社の開発チームは、Claude Codeで、同じユーザーへの広告の表示回数を1日3回までに制限する機能を実装しました。Claudeに「この機能を実装し、テストも書いて」と依頼したところ、42件のテストはすべて成功しました。\n\nしかし本番では、日付が切り替わる日本時間0時の前後と、3回目の表示のときに、制限が正しく働かない不具合が見つかりました。テストを見直すと、実装の分岐をそのままなぞったものがほとんどで、日付の境界や上限ちょうどの回数を確かめるテストはありませんでした。\n\nこの機能は、1リクエストあたり5ミリ秒以内という性能要件も満たす必要があります。","question":"この機能の改修で、Claude Codeとの反復の進め方として適切なものはどれですか。（2つ選択してください。）","choices":[{"text":"実装が終わった後で、カバレッジが90%を超えるまでテストを追加するようClaudeに依頼する。","explanation":"カバレッジの数値を目標にすると、実装後に書いたテストは既存の分岐をなぞるものになりがちで、今回のように実装が見落とした境界の条件は、テストでも見落とされます。カバレッジは、要件をどこまで確かめたかを示す指標ではありません。"},{"text":"実装の前に、日付の境界・上限ちょうどの回数・性能要件を確かめるテストを先に用意する。","explanation":"正解。テスト駆動の反復では、実装の前に、期待される動作・エッジケース・性能要件をカバーするテストスイートを用意します。日付の境界や上限ちょうどの回数、5ミリ秒以内という要件をテストで先に定めておけば、Claudeは実装の都合ではなく要件に照らして作業を進め、合否を自分で確かめられます。"},{"text":"失敗したテスト名と出力を渡して修正を繰り返させ、テスト自体は変更しないよう指示する。","explanation":"正解。テストが失敗したら、どのテストがどのような出力で失敗したかをClaudeに共有しながら修正を繰り返すのが、テスト駆動の反復の進め方です。あわせて、テストを書き換えて通すことを禁じておかないと、要件を満たさないまま、テストのほうを実装に合わせてしまうおそれがあります。"},{"text":"要件の説明文をより詳しく書き直したうえで、実装とテストを1回の依頼でまとめて作らせる。","explanation":"説明文を詳しくすることは、要件の誤解を減らすうえで役立ちます。しかし、実装とテストを同時に作らせると、テストが実装の考え方に引きずられるという今回の問題は解決せず、合否を判断する客観的な基準も得られません。"}],"answer":[1,2],"overall":"反復的な改善の手法のうち、テスト駆動の反復がテーマです。ガイドは、先にテストスイートを作成し、テストの失敗を共有しながら反復して段階的な改善を導くことを挙げ、テストには期待される動作、エッジケース、パフォーマンス要件を含めるとしています。Claude Codeのベストプラクティスも、Claudeが自分で実行できる検証手段（テストなど）を与えることを重視しており、検証手段があれば、Claudeは作業・確認・修正のループを自分で回せます。\n\n本問の不具合は、実装とテストを同時に作らせた結果、テストが実装の分岐をなぞるだけになり、境界の条件が両方から抜け落ちたことで起きました。\n\n誤答の見分け方は、テストが実装より先に要件を定めているかどうかです。実装後のカバレッジ目標や一括の依頼は、テストを実装の後追いにしてしまいます。\n\n本番では、不具合が見つかるたびに、再現するテストを先に追加してから修正させると、同じ不具合の再発を防げます。\n\n参考: https://code.claude.com/docs/en/best-practices"},{"id":6,"scenario":"ツール設計とMCP統合","situation":"ある化学メーカーの研究開発チームは、Claude Codeを使って実験データ管理システム（LIMS）と連携するコードを開発しています。リポジトリにはチームで共有する.mcp.jsonがコミットされており、LIMSのMCPサーバーのheadersには\"Authorization\": \"Bearer ${LIMS_TOKEN}\"が指定されています。\n\n今月参加した2名の環境でだけ、次の現象が起きています。\n\nLIMSのツール呼び出しが401エラーで失敗する\n\nclaude mcp listを実行すると、このサーバーに未設定の環境変数があるという警告が表示される\n\n他のメンバーは、同じリポジトリで問題なく使えています。","question":"最も可能性の高い原因と対処はどれですか。","choices":[{"text":"headersの値では${LIMS_TOKEN}が展開されないため、トークンの値を.mcp.jsonに直接書いてコミットし直す。","explanation":"Claude Codeの.mcp.jsonでは、command・args・env・urlに加え、HTTPサーバーの認証に使うheadersでも${VAR}形式の環境変数が展開されます。トークンを直接書いてコミットすると、シークレットがバージョン管理に残るうえ、他のメンバーが問題なく使えている理由も説明できません。"},{"text":"2名の環境にLIMS_TOKENが設定されていないため、各自の環境変数にトークンを設定してからClaude Codeを起動する。","explanation":"正解。参照している環境変数が未設定で既定値もない場合でも設定は読み込まれますが、claude mcp listに未設定の変数の警告が出て、${LIMS_TOKEN}という文字列がそのまま使われます。その結果、正しいトークンが送られずに401になります。.mcp.jsonは変えずに、各自の環境で変数を設定すれば解決します。"},{"text":"プロジェクトスコープのサーバーは新しいメンバーには読み込まれないため、各自がclaude mcp add --scope userで登録し直す。","explanation":"プロジェクトスコープの.mcp.jsonは、リポジトリをクローンしたメンバー全員に読み込まれる共有用の設定です。2名の環境でもclaude mcp listにこのサーバーが表示されていることから、設定自体は読み込まれています。ユーザースコープに登録し直すと、チームで1か所に保っている設定が個人ごとに分かれてしまいます。"},{"text":"2名が.mcp.jsonの承認を拒否しているため、claude mcp reset-project-choicesを実行して承認し直す。","explanation":"プロジェクトスコープのサーバーは、対話セッションで使う前に承認を求められ、選択を取り消すにはclaude mcp reset-project-choicesを使います。ただし、承認を拒否していればツールの呼び出し自体が行われず、サーバーから401が返ることはありません。今回の警告も、未設定の環境変数を示しています。"}],"answer":[1],"overall":"MCPサーバーのスコープ設定と、.mcp.jsonでの環境変数の展開を組み合わせた運用のトラブルシューティングです。チームで共有するサーバーはプロジェクトスコープの.mcp.jsonに置き、認証トークンは${VAR}で参照して、シークレットをコミットしないのが基本です。このとき、トークンの値そのものは各メンバーの環境で用意する必要があります。公式ドキュメントによると、参照した変数が未設定で既定値（${VAR:-default}）もない場合でも設定は読み込まれ、claude mcp listに未設定の変数の警告が出て、展開前の${VAR}の文字列がそのまま使われます。\n\n決め手は「2名だけ」「未設定の変数の警告」「他のメンバーは正常」の3つの事実で、これらはスコープや承認の問題ではなく、個人の環境側の不足を示しています。\n\nトークンを直接書く案は、シークレットをコミットしないという仕組みそのものを壊します。\n\n本番では、新しいメンバー向けの手順書に必要な環境変数の一覧を載せ、claude mcp listの警告を確認する手順を入れておくと、同じ問い合わせを減らせます。\n\n参考: https://code.claude.com/docs/en/mcp"},{"id":7,"scenario":"Claude Codeの設定とワークフロー","situation":"ある通信事業者の開発チームは、料金計算サービスのプルリクエストごとに、Claude Codeでユニットテストを生成するCIジョブを運用しています。ジョブはclaude -pでPRの差分だけを渡し、「この変更に必要なテストを書いて」と指示しています。\n\n生成されたテストを1か月分確認したところ、次のことが分かりました。\n\n38%は、tests/billing/test_rating.pyなどに既にあるテストと同じシナリオだった\n\nconftest.pyに用意済みのフィクスチャとほぼ同じヘルパーを、生成のたびに新しく定義していた","question":"重複を減らすためのCIジョブの変更として、最も適切なものはどれですか。","choices":[{"text":"リポジトリ全体のテストファイル約2,400件を、毎回プロンプトに連結して渡す。","explanation":"既存のテストを渡す方向性は正しいものの、2,400件をすべて連結すると、変更と無関係なテストがコンテキストの大半を占めます。大量の入力の中で関係する部分を見落としやすくなるうえ、コストも大きく増えます。渡すのは、変更対象に関係するテストに絞るべきです。"},{"text":"生成後に別のジョブを走らせ、テスト名が既存のテストと一致するものだけを削除する。","explanation":"生成後の削除は、重複を後から取り除く対症療法です。生成されたテストは既存のものと名前が違うことが多く、名前の一致だけでは同じシナリオのテストを見つけられません。また、フィクスチャを重複して定義する問題にも対処できません。"},{"text":"直近のカバレッジ率（全体78%）だけを渡し、80%を超えるまでテストを追加するよう指示する。","explanation":"カバレッジ率は、どの行が実行されたかを示す全体の指標で、どのシナリオが既にテストされているかは分かりません。数値の目標だけを与えると、既にあるシナリオを別の形で書き直したテストでも数値は上がるため、重複は減りません。"},{"text":"変更対象モジュールの既存テストとconftest.pyを読ませ、既存のシナリオを除かせる。","explanation":"正解。ガイドは、既存のテストファイルをコンテキストに提供し、テストスイートですでにカバーされているシナリオが重複して提案されないようにすることを挙げています。変更対象のモジュールに対応するテストと、利用できるフィクスチャを定義したconftest.pyを読ませれば、Claudeは足りないシナリオだけを、既存のフィクスチャを使って書けます。"}],"answer":[3],"overall":"CI/CDパイプラインでのテスト生成の品質を高める方法がテーマです。ガイドは、既存のテストファイルをコンテキストに提供し、テスト生成において、テストスイートですでにカバーされている重複シナリオが提案されないようにすることを、スキルとして挙げています。\n\n本問のジョブは差分だけを渡していたため、Claudeは既存のテストやフィクスチャの存在を知らず、同じシナリオのテストや同じヘルパーを繰り返し作っていました。決め手は、重複の内容が「既存のテストと同じシナリオ」と「用意済みのフィクスチャと同じヘルパー」の2種類であることで、どちらも既存のファイルを見せれば防げます。\n\n誤答の見分け方は、渡す情報が重複の判断に役立ち、かつ量が適切かどうかです。全件の連結は多すぎ、カバレッジ率はシナリオの情報を含まず、名前による削除は後追いです。\n\n本番では、テスト標準や利用できるフィクスチャをCLAUDE.mdにも記載しておくと、CIから呼び出されるClaude Codeが毎回同じ前提で生成できます。\n\n参考: https://code.claude.com/docs/en/github-actions"},{"id":8,"scenario":"ツール設計とMCP統合","situation":"ある会計事務所の開発チームは、Claude Codeで申告書作成ツールのコードを生成しています。社内のMCPサーバーは、次の3つのツールを提供しています。\n\nlist_tax_forms（帳票の一覧を20件ずつ返す）\n\nget_tax_form（1つの帳票の項目構成を返す）\n\ncreate_return（申告書を作成する）\n\n帳票は約1,800種類あり、内容が変わるのは年に1回の改正時だけです。\n\nログを見ると、Claudeは作業のたびに、使う帳票を探すためにlist_tax_formsとget_tax_formを平均7回呼び出しており、そのたびに作業が中断されています。","question":"MCPサーバーの設計として適切な変更はどれですか。（2つ選択してください。）","choices":[{"text":"帳票の一覧と各帳票の項目構成を、MCPリソースとして公開する。","explanation":"正解。MCPリソースは、ファイルやデータベースのスキーマのような、言語モデルにコンテキストを提供するデータを、URIで識別して公開する仕組みです。帳票の一覧と項目構成をリソースとして公開すれば、Claude Codeでは「@」で参照してそのまま読み込めるため、探すためのツールの呼び出しを繰り返す必要がなくなります。"},{"text":"create_returnはツールのまま残し、一覧と項目構成を返すツールは外す。","explanation":"正解。ツールは、申告書の作成のように操作を伴う処理に向いています。帳票の一覧と項目構成をリソースとして公開するなら、それを探すためのlist_tax_formsとget_tax_formをツールとして残す必要はなく、外せばClaudeが探索的な呼び出しに戻ることも防げます。create_returnはツールのまま残すことで、参照するデータはリソース、操作はツールという役割分担になります。"},{"text":"list_tax_formsが1回で返す件数を、20件から1,800件に増やす。","explanation":"一度に1,800件を返せば呼び出しの回数は減りますが、毎回の作業で膨大な一覧がツール結果としてコンテキストに入り、関連性に見合わない量のトークンを消費します。必要な帳票だけを参照できる仕組みのほうが効率的です。"},{"text":"帳票の一覧の全文を、list_tax_formsツールの説明に書き込む。","explanation":"ツールの説明は、そのツールが何をし、いつ使うべきかを伝えるためのものです。1,800種類の帳票の一覧を書き込むと、説明が非常に長くなって毎回のコンテキストを圧迫するうえ、Claude Codeでは長いツールの説明は一定の長さで切り詰められます。改正のたびに説明を書き換える手間もかかります。"}],"answer":[0,1],"overall":"MCPリソースで、コンテンツカタログを公開する仕組みがテーマです。ガイドは、探索的なツール呼び出しを減らすために、コンテンツカタログ（課題のサマリー、ドキュメントの階層、データベースのスキーマなど）を公開する仕組みとしてのMCPリソースを挙げ、エージェントが探索的なツール呼び出しをせずに利用可能なデータを把握できるよう、カタログをリソースとして公開することをスキルとしています。MCPの仕様では、リソースはファイルやデータベースのスキーマなど、モデルにコンテキストを提供するデータをURIで公開するもので、どのように取り込むかはホストのアプリケーションが決めます。Claude Codeでは、接続したサーバーのリソースを「@」で参照して添付できます。\n\n本問の帳票は約1,800種類と多いものの、内容は年に1回しか変わらない静的なカタログです。それをツールで少しずつ探させていたため、作業のたびに7回もの呼び出しが発生していました。正解の2つは、カタログをリソースで公開し、ツールは操作を伴うcreate_returnだけに絞るという役割分担です。\n\n誤答の見分け方は、カタログの扱いとコンテキストの消費を両立しているかどうかです。説明への書き込みも一括取得も、大量の情報を毎回コンテキストに入れてしまいます。\n\n本番では、帳票の改正に合わせてリソースを更新し、変更があったことをクライアントに通知できるようにしておきます。\n\n参考: https://modelcontextprotocol.io/specification/2026-07-28/server/resources"},{"id":9,"scenario":"ツール設計とMCP統合","situation":"ある人材サービス会社の開発チームは、Claude Codeで求人票のHTMLテンプレートを生成しています。デザインの規約が変わり、job_card.htmlの給与欄のクラス名をsalaryからsalary-rangeに変えることになりました。\n\nファイルの状況は次のとおりです。\n\n給与欄のclass=\"salary\"が14か所あり、すべて同じように変える\n\n補足欄のclass=\"salary-note\"も6か所あるが、こちらは変えない\n\n各求人カードは同じ構造で、給与欄の前後の行も共通\n\nClaudeに変更を依頼したところ、class=\"salary\"をold_stringに指定したEditが「ファイル内で14か所に一致する」というエラーで失敗しました。","question":"この変更を行う方法として、最も適切なものはどれですか。","choices":[{"text":"old_stringをsalaryだけに短くし、replace_all: trueを指定してEditを呼び出させる。","explanation":"replace_allをtrueにする判断は正しいものの、old_stringをsalaryだけにすると、class=\"salary-note\"の6か所にも一致します。\n\nすべての出現が置き換わるため、補足欄のクラス名までsalary-range-noteに変わってしまい、「補足欄は変えない」という条件を満たせません。replace_allを使うときほど、置き換えたい箇所にだけ一致する文字列を選ぶ必要があります。"},{"text":"old_stringをclass=\"salary\"のまま、replace_all: trueを指定してEditを呼び出させる。","explanation":"正解。Editのold_stringは、ファイル内にちょうど1回だけ現れる必要があり、複数回現れる場合は、前後の文脈を含めて1か所に絞り込むか、replace_allをtrueにしてすべてを置き換えるかのどちらかです。\n\n本問は14か所をすべて同じ値に変えたいので、replace_allが適しています。class=\"salary\"は閉じる引用符まで含むため、class=\"salary-note\"には一致せず、補足欄はそのまま残ります。"},{"text":"old_stringを前後の行まで広げ、14か所を1か所ずつ順にEditで置き換えさせる。","explanation":"前後の行を含めてold_stringを広げるのは、複数の一致の中から特定の1か所だけを変えたいときの正しい方法です。しかし本問では、各求人カードの前後の行も共通なので、広げても1か所に絞り込めず、同じエラーが続きます。仮に絞り込めたとしても、同じ変更のために14回の呼び出しが必要になります。"},{"text":"Readでファイル全体を読み込み、14か所を書き換えた内容をWriteでファイル全体に書き込ませる。","explanation":"Read＋Writeは、Editで一意に一致するテキストを見つけられず、ほかに確実な方法がない場合のフォールバックです。本問では、変えたい14か所がすべて同じ内容に置き換わるので、Editのreplace_allで対応できます。\n\nファイル全体を書き直すと、変更しない部分まで出力し直すことになり、トークンの消費と、意図しない箇所が変わるリスクが増えます。公式ドキュメントも、既存ファイルの部分的な変更にはWriteではなくEditを使うとしています。"}],"answer":[1],"overall":"組み込みツールのEditで、一致が一意でないときにどう対処するかがテーマです。ガイドは、ファイル全体の操作にはRead/Write、一意に一致するテキストを使った、的を絞った変更にはEditを使うことを知識として挙げています。公式ドキュメントによると、Editは正規表現やあいまいな一致を使わない完全一致の置換で、old_stringはファイル内にちょうど1回だけ現れる必要があります。複数回現れる場合の対処は、前後の文脈を含めて1か所に絞り込むか、replace_allをtrueにしてすべてを置き換えるかの2つです。\n\n本問の決め手は、14か所を「すべて同じように」変えるという条件と、変えてはいけないclass=\"salary-note\"が同じファイルにあるという条件です。前者からreplace_allを選べ、後者からold_stringには閉じる引用符まで含めたclass=\"salary\"を使う必要があります。\n\n誤答の見分け方は、2つの条件を両方満たしているかどうかです。短いold_stringは補足欄まで変え、前後の行まで広げる方法は共通の構造のため絞り込めず、Read＋Writeはこの変更には重すぎる手段です。\n\n本番では、置き換えのあとにGrepでsalary-rangeとsalary-noteの件数を確かめると、変更の範囲を確認できます。\n\n参考: https://code.claude.com/docs/en/tools-reference"},{"id":10,"scenario":"エージェントアーキテクチャとオーケストレーション","situation":"ある情報セキュリティ企業は、監視サービスの契約者からの問い合わせに対応するカスタマーサポート解決エージェントを運用しています。アラートの誤検知への苦情や、管理画面のアカウントのロックなど、エージェントでは解決できない案件はescalate_to_humanで人間の担当者に引き継ぎます。担当者は別のチケットシステムで作業しており、エージェントとの会話の記録にはアクセスできません。\n\n現在の引き継ぎは「お客様がアラートについて困っています」のような一文だけです。担当者は平均9分かけて顧客に状況を聞き直しており、顧客満足度の調査では「同じ説明を2回させられた」という不満が最も多くなっています。","question":"引き継ぎの内容として適切な改善はどれですか。（2つ選択してください。）","choices":[{"text":"エージェントとの会話の記録を全文添付し、担当者が必要な箇所を探して読めるようにする。","explanation":"会話の記録を全文添付すれば情報は欠けませんが、担当者は長い記録から要点を探す必要があり、引き継ぎにかかる時間は大きく減りません。人間の担当者への引き継ぎでは、記録をそのまま渡すのではなく、判断に必要な事実をまとめた構造化されたハンドオフサマリーを渡すのが基本です。"},{"text":"エージェントが推奨する次の対応と、その判断の根拠を、引き継ぎの項目に含める。","explanation":"正解。構造化されたハンドオフプロトコルには、顧客の詳細や根本原因の分析に加えて、推奨アクションを含めます。「誤検知ルールの例外登録を推奨。根拠は同じ送信元からの誤検知が3日で47件」のように次の対応と根拠を示すと、担当者は判断を一から組み立て直す必要がなくなります。"},{"text":"顧客の感情スコアと会話のターン数を渡し、担当者が対応の優先度を決める材料にする。","explanation":"感情スコアやターン数は、案件の中身を示す情報ではありません。担当者が聞き直しているのは、顧客が誰で、何が起きていて、何を試したかであり、これらの値では解消しません。感情は、案件の複雑さを示す指標としても信頼できません。"},{"text":"検証済みの顧客ID、根本原因の分析、試した対処を、構造化した項目で渡す。","explanation":"正解。ガイドは、会話の記録にアクセスできない人間の担当者にエスカレーションする際に、顧客ID、根本原因、推奨アクションなどを含む構造化されたハンドオフサマリーを作成することを挙げています。検証済みの顧客IDと、どこまで調べてどの対処を試したかが項目として分かれていれば、担当者は聞き直さずに続きから対応できます。"}],"answer":[1,3],"overall":"プロセスの途中で人間の担当者へエスカレーションする際の、構造化されたハンドオフがテーマです。ガイドは、会話の記録にアクセスできない人間の担当者にエスカレーションする場合に、顧客ID、根本原因、返金額、推奨アクションといった項目を含む構造化されたハンドオフサマリーを作成することを挙げています。\n\n本問の担当者は別のシステムで作業しており、エージェントとの会話を見られません。そのため一文だけの引き継ぎでは、担当者は顧客に同じ説明を求めるしかありませんでした。正解の2つは、事実（誰の、何の問題で、何を試したか）と判断（次に何をすべきか、その根拠）を、項目として分けて渡すという点で共通しています。\n\n誤答の見分け方は、担当者が聞き直さずに対応を始められる情報かどうかです。会話の全文は量が多すぎて要点が分からず、感情スコアやターン数は中身を含みません。\n\n本番では、escalate_to_humanの入力スキーマでこれらの項目を必須にしておくと、引き継ぎの品質が会話ごとにばらつくのを防げます。\n\n参考: https://platform.claude.com/docs/en/about-claude/use-case-guides/customer-support-chat"},{"id":11,"scenario":"ツール設計とMCP統合","situation":"ある法律事務所の開発チームは、Claude Codeで契約書テンプレートの生成システムを開発しています。チームは調査用のカスタムサブエージェント.claude/agents/finder.mdを作り、toolsにはRead、Grep、Globだけを指定しています（Bashは含めていません）。\n\nこのサブエージェントに「契約書テンプレートのテストファイルをすべて列挙して」と依頼しました。すると、Grepで\"template\"という文字列をリポジトリ全体から検索し、1,900件を超える一致を読み込んだ末に、一部のファイルを見落としていました。\n\nテストファイルは、各モジュールの中にcontract.template.spec.tsのような名前で散在しています。","question":"このサブエージェントが使うべき方法として、最も適切なものはどれですか。","choices":[{"text":"Readでリポジトリのルートディレクトリを読み込み、ファイルの一覧をたどって探す。","explanation":"Readは、指定したファイルの内容を読むためのツールで、ディレクトリをたどってファイルを一覧にする用途には向きません。ファイルを名前のパターンで探すには、Globを使います。"},{"text":"Bashでfindコマンドを実行し、ファイル名のパターンで検索する。","explanation":"Bashのfindでもファイル名で検索できますが、このサブエージェントのtoolsにBashは含まれておらず、使うことができません。toolsにGlobやGrepを指定してBashを外したサブエージェントではGlobとGrepのツールが利用できるので、Globを使うのが適切です。"},{"text":"Grepで\"spec\"という文字列を検索し、一致したファイルの一覧だけを出力させる。","explanation":"Grepは、関数名やエラーメッセージのような文字列を、ファイルの内容から検索するためのツールです。\"spec\"を内容から探すと、テスト以外のファイルの記述にも一致し、逆にファイル名だけがパターンに合うファイルは見落とします。ファイルを名前で探す今回の目的には合いません。"},{"text":"Globでファイル名のパターンを指定し、名前が一致するファイルを列挙する。","explanation":"正解。Globは、名前や拡張子のパターンでファイルを見つけるためのツールです。**/*.template.spec.tsのように**を含むパターンを指定すれば、どの階層にあるファイルにも一致します。ファイルの内容を読まずに名前だけで列挙するため、Grepのように大量の一致をコンテキストに読み込むこともありません。"}],"answer":[3],"overall":"組み込みツールの使い分けのうち、ファイルパスのパターンで探すGlobの選択がテーマです。ガイドは、コンテンツ検索のためのGrep（関数名やエラーメッセージなどのパターンをファイルの内容から検索する）と、ファイルパスのパターンマッチングのためのGlob（名前や拡張子のパターンでファイルを見つける）を区別し、命名パターンに一致するファイルを見つけるためにGlobを選ぶこと（**/*.test.tsxなど）を挙げています。\n\n本問の依頼は「テストファイルを列挙する」で、手がかりはcontract.template.spec.tsという名前の規則です。内容を検索するGrepでは名前の規則を直接指定できないため、無関係な一致を大量に読み込んだうえに見落としが出ました。なお、Claude Codeの公式ドキュメントによると、macOSやLinuxでは既定でGlobとGrepの代わりにBashのfindやgrepが使われますが、サブエージェントのtoolsにGlobやGrepを指定してBashを外した場合は、そのサブエージェントでGlobとGrepが使えます。\n\n誤答の見分け方は、探す対象が「ファイルの名前」なのか「ファイルの中身」なのかです。\n\n本番では、名前の規則が分かっていればGlobで候補を絞り、その後で必要なファイルだけをReadで確認する順番にすると、コンテキストを節約できます。\n\n参考: https://code.claude.com/docs/en/tools-reference"},{"id":12,"scenario":"Claude Codeの設定とワークフロー","situation":"ある航空会社の整備システム部門は、Claude Codeで機体整備記録のアプリケーションを開発しています。最近、一部のメンバーがチームの規約を自分の~/.claude/CLAUDE.mdに書いていたことが分かりました。そのため、メンバーによって生成されるコードの書き方がばらついていました。チームは、ユーザーレベルのファイルに書く内容を見直すことにしました。","question":"選択肢に挙げた指示のうち、各メンバーが自分の~/.claude/CLAUDE.mdに書くのが適切なものはどれですか。","choices":[{"text":"コミットメッセージは、社内で定めた書式に従う。","explanation":"コミットメッセージの書式はチームの取り決めで、全員が同じ書式を使う必要があります。個人の設定に書くと、書いたメンバーだけが従う状態になり、チームの中で書式がそろいません。"},{"text":"整備記録の日時は、UTCで保存する。","explanation":"日時の保存形式は、どのメンバーが書いたコードでも同じでなければならない、チーム共通の規約です。ユーザーレベルのファイルに書くと、そのメンバーの環境でしか適用されず、他のメンバーやCIで生成されたコードとの間で形式が食い違います。プロジェクトのCLAUDE.mdに書くべき内容です。"},{"text":"ビルドとテストはmake ciで実行する。","explanation":"ビルドとテストのコマンドは、そのリポジトリで作業する全員に必要な情報です。ユーザーレベルのファイルはバージョン管理を通じて共有されないため、新しいメンバーには届きません。プロジェクトのCLAUDE.mdに書いてコミットするのが適切です。"},{"text":"説明は箇条書きで短くまとめて返してほしい。","explanation":"正解。説明の書き方の好みは、そのメンバー個人の作業のしやすさに関するもので、チームで共有する必要はありません。~/.claude/CLAUDE.mdは、すべてのプロジェクトに適用される個人の好みを書く場所で、他のメンバーには影響しないため、このような指示に適しています。"}],"answer":[3],"overall":"CLAUDE.mdの設定階層のうち、ユーザーレベルの設定がそのユーザーにのみ適用されることがテーマです。ガイドは、ユーザーレベルの設定（~/.claude/CLAUDE.md）内の指示が、バージョン管理を通じてチームメイトと共有されないことを知識として挙げています。公式ドキュメントでも、~/.claude/CLAUDE.mdは、すべてのプロジェクトに共通する個人の好み（コードのスタイルの好みや、個人用のショートカットなど）を書く場所とされ、チームで共有する規約はプロジェクトのCLAUDE.mdに書いてバージョン管理に含めるとされています。\n\n本問のばらつきは、チームの規約が個人の設定に書かれていたことで起きていました。判断の基準は、「その指示がメンバー全員に同じように適用されるべきか」です。日時の保存形式、ビルドのコマンド、コミットの書式は全員が守るべきチームの規約で、説明の書き方の好みだけが、個人で変えてよい内容です。\n\n誤答の見分け方は、指示が守られなかったときに、チームの成果物に影響が出るかどうかです。\n\n本番では、プロジェクトに固有だが個人的な設定（自分用のテストデータの場所など）は、CLAUDE.local.mdに書いて.gitignoreに追加する方法もあります。\n\n参考: https://code.claude.com/docs/en/memory"},{"id":13,"scenario":"Claude Codeの設定とワークフロー","situation":"ある医療機器メーカーの開発チームは、Claude Codeを使って電子カルテとの連携モジュールを開発しています。チームは、すべてのコードに共通する次の規約を.claude/skills/coding-standards/SKILL.mdにまとめ、リポジトリにコミットしました。\n\n患者IDや氏名をログに出力しない\n\n日時はUTCで保存する\n\nセッションの中で/coding-standardsを実行した場合は、規約が守られます。しかし、実行しなかったセッションで生成されたコードを調べたところ、約4割にログへの患者IDの出力が含まれていました。","question":"最も適切な対処はどれですか。","choices":[{"text":"SKILL.mdのフロントマターにdisable-model-invocation: trueを追加し、開発者が明示的に呼び出す運用にする。","explanation":"disable-model-invocationをtrueにするのは、デプロイのように副作用のある手順を、開発者が明示的に呼び出したときだけ実行させたい場合です。この設定ではClaudeが自分の判断でスキルを読み込むことがなくなるため、呼び出し忘れのセッションで規約が適用されない問題はかえって悪化します。"},{"text":"SKILL.mdのフロントマターにcontext: forkを追加し、規約の確認を分離したサブエージェントで実行する。","explanation":"フロントマターのcontextにforkを指定すると、冗長な出力を生む分析や探索的な作業を分離したサブエージェントで実行でき、メインの会話を汚さずに済みます。規約はコードを書くメインの会話で常に参照されている必要があり、別のコンテキストで確認しても、生成中のコードには反映されません。"},{"text":"すべてのコードに共通する規約はプロジェクトのCLAUDE.mdに移し、スキルには特定の作業の手順だけを残す。","explanation":"正解。CLAUDE.mdは毎回のセッションで読み込まれる全体共通の標準を置く場所で、スキルの本文は呼び出されたときにだけ読み込まれます。すべてのコードに当てはまる規約をスキルに置くと、呼び出されなかったセッションでは規約がコンテキストに入りません。常に守るべき規約はCLAUDE.mdへ、作業ごとの手順はスキルへと分けるのが適切です。"},{"text":"セッションの開始時に必ず/coding-standardsを実行するよう、チームの開発手順書に書き加える。","explanation":"手順書で実行を義務付けても、守られるかどうかは開発者の運用に左右されます。実行を忘れたセッションでは同じ問題が起きるため、規約を確実に適用するという目的には合いません。"}],"answer":[2],"overall":"スキルとCLAUDE.mdのどちらを使うかの判断がテーマです。ガイドは、スキルを「タスク固有のワークフローのためのオンデマンド呼び出し」、CLAUDE.mdを「常に読み込まれる全体共通の標準」と位置付けています。公式ドキュメントによると、スキルの説明文は常にコンテキストにありますが、本文が読み込まれるのは、開発者が「/名前」で呼び出したときか、Claudeが必要と判断したときだけです。\n\n本問の規約は、ログ出力や日時の保存方法という、どのコードを書くときにも守るべき内容です。そのため、スキルに置くと呼び出されなかったセッションでは適用されず、ログに患者IDが出力される結果になりました。決め手は「実行しなかったセッションで守られていない」という事実で、配置先の読み込まれ方に原因があることを示しています。\n\ndisable-model-invocationやcontextのforkは、スキルの呼び出し方を変える設定で、常に適用するという要件には応えません。\n\n本番では、患者情報の扱いのように違反が許されない規約は、CLAUDE.mdに加えてフックやレビューでも確認すると、さらに確実になります。\n\n参考: https://code.claude.com/docs/en/skills"},{"id":14,"scenario":"エージェントアーキテクチャとオーケストレーション","situation":"あるサイバーセキュリティ企業の開発チームは、Claude Agent SDKで開発者の生産性向上ツールを作っています。エージェントは40分かけて、認証モジュールの脆弱性の原因と、関係するファイルの依存関係を分析しました。その結果は、セッションの中に残っています。\n\nチームは、この分析結果をもとに、次の2つの方針を並行して検討したいと考えています。\n\n既存のセッション管理を改修する方針\n\n認証の仕組みを新しいライブラリに置き換える方針\n\n分析をやり直す時間はかけたくありません。また、2つの検討は互いに影響し合わないようにしたいと考えています。","question":"セッションの扱いとして適切なものはどれですか。（2つ選択してください。）","choices":[{"text":"分析済みのセッションをresumeし、fork_sessionを有効にして方針ごとに分岐させる。","explanation":"正解。fork_sessionは、共通の分析結果から独立したブランチを作り、異なるアプローチを探るための仕組みです。分析済みのセッションをresumeするときにfork_sessionを有効にすると、元の履歴のコピーから始まる新しいセッションが作られ、元のセッションは変更されません。方針ごとに分岐させれば、40分の分析を共有したまま、2つの検討を独立して進められます。"},{"text":"方針ごとのセッションIDを記録し、後から個別に再開して検討結果を比べる。","explanation":"正解。forkしたセッションには、元とは別の新しいセッションIDが付きます。方針ごとのIDを記録しておけば、後からresumeでどちらの検討にも個別に戻れるため、2つの方針の検討結果を並べて比べたり、選ばなかった方針を後で見直したりできます。"},{"text":"2つの新しいセッションを起動し、それぞれに最初から40分の分析をやり直させる。","explanation":"新しいセッションで始めれば、2つの検討は確実に独立します。しかし、40分の分析をそれぞれでやり直すことになり、「分析をやり直す時間はかけたくない」という条件に反します。以前の分析結果がおおむね有効な今回のような場合は、それを引き継げる方法を選ぶべきです。"},{"text":"分析済みのセッションIDを、forkせずに2つのプロセスから同時にresumeする。","explanation":"forkせずに同じセッションを2つのプロセスから再開すると、どちらの検討も同じ会話履歴に書き込まれ、2つの方針のやり取りが混ざってしまいます。互いに影響し合わないようにするという要件を満たせません。"}],"answer":[0,1],"overall":"セッションの状態の管理のうち、fork_sessionで共通の分析から分岐する方法がテーマです。ガイドは、共通の分析結果から独立したブランチを作成し、異なるアプローチを探るためのfork_sessionを知識として挙げ、共通のコードベース分析から2つのテスト戦略やリファクタリングのアプローチを比較する例を示しています。Agent SDKのドキュメントによると、forkは元の履歴のコピーから始まる新しいセッションを作り、独自のセッションIDを持ち、元のセッションのIDと履歴は変更されません。\n\n本問の条件は、40分の分析を共有することと、2つの検討を独立させることの2つです。正解の2つは、fork_sessionによる分岐と、分岐したセッションIDの管理で、両方の条件を満たします。\n\n誤答の見分け方は、2つの条件の両方を満たしているかどうかです。同じセッションの同時再開は独立性を失い、新しいセッションでのやり直しは分析の共有を失います。\n\nなお、forkで分岐するのは会話の履歴であり、ファイルシステムではありません。本番では、2つの方針でファイルを実際に変更する場合は、作業ディレクトリを分けるなどして、変更が互いに見えないようにしておきます。\n\n参考: https://code.claude.com/docs/en/agent-sdk/sessions"},{"id":15,"scenario":"ツール設計とMCP統合","situation":"ある法律事務所の開発チームは、Claude Agent SDKを使って所内向けの開発者の生産性向上ツールを作っています。連携するMCPサーバーは、判例検索（caselaw）、契約書の文書管理（contracts）、課題管理（tickets）の3つで、ツールは合計11個です。\n\n「判例を調べ、関連する契約書のテンプレートを特定し、結果を課題に記録する」のように、複数のサーバーにまたがる依頼が全体の約半数を占めます。ところが試作版では、依頼の種類に応じて1つのサーバーだけを接続したセッションを起動していたため、こうした依頼は毎回途中で止まっていました。","question":"このツールの設計として適切なものはどれですか。（2つ選択してください。）","choices":[{"text":"3つのMCPサーバーをmcpServersにまとめて設定し、1つのセッションで使えるようにする。","explanation":"正解。Agent SDKでは、mcpServersに複数のサーバーを設定でき、接続した各サーバーのツールは「mcp__サーバー名__ツール名」という名前で、同じセッションの中から利用できます。サーバーごとにセッションを分ける必要はなく、1つのセッションでサーバーをまたぐ依頼をそのまま処理できます。"},{"text":"allowedToolsにmcp__caselaw__*などのサーバー単位のワイルドカードを指定して許可する。","explanation":"正解。Agent SDKでは、MCPツールは許可していないと権限の確認に回され、人が応答しない実行ではそのまま呼び出せません。allowedToolsにmcp__caselaw__*のようなワイルドカードを指定すれば、そのサーバーのツールを一つずつ列挙せずに許可でき、許可の範囲も目的のサーバーだけに限定できます。"},{"text":"依頼の種類を判定するルーターを作り、判定したサーバーだけを接続した新しいセッションを依頼ごとに起動する。","explanation":"依頼ごとに必要なサーバーだけを接続する設計は、接続するサーバーを最小限にしたい場合の工夫に見えます。しかし、本問の依頼の約半数は複数のサーバーを必要とするため、1つのサーバーに絞る設計では同じ途中停止が起きます。ルーターを作って保守する負担も増えます。"},{"text":"判例検索と文書管理の機能を統合した新しいMCPサーバーを実装し、サーバーを1つにまとめる。","explanation":"サーバーを統合すると、既存の判例検索や文書管理のサーバーを作り直す開発と保守の負担が生じます。設定されたすべてのMCPサーバーのツールは同時に利用できるので、サーバーを1つにまとめなくても、サーバーをまたぐ依頼は処理できます。"}],"answer":[0,1],"overall":"MCPサーバーをエージェントのワークフローに統合する方法がテーマです。ガイドは、設定されたすべてのMCPサーバーのツールが接続時に検出され、エージェントから同時に利用可能になることを知識として挙げています。Agent SDKでは、mcpServersオプション（または.mcp.json）に複数のサーバーを登録すると、各ツールが「mcp__サーバー名__ツール名」という名前で1つのセッションに並びます。そのうえで、許可していないMCPツールの呼び出しは権限の確認に回されるため、allowedToolsでサーバー単位のワイルドカードなどを使って許可します。\n\n試作版の問題は、サーバーを1つずつしか接続しない設計が、サーバーをまたぐ依頼という要件に合っていなかったことです。\n\n誤答の見分け方は、「サーバーを分ける」「サーバーを統合する」という不要な構造変更を求めていないかです。ルーターも新しいサーバーの実装も、同時に利用できるという前提を知っていれば必要ありません。\n\nなお、ツール検索が既定で有効なため、MCPツールの定義は必要になるまで読み込みが遅延されます。本番では、system/initメッセージで各サーバーの接続状態を確認し、failedやneeds-authを検知できるようにしておきます。\n\n参考: https://code.claude.com/docs/en/agent-sdk/mcp"},{"id":16,"scenario":"エージェントアーキテクチャとオーケストレーション","situation":"ある半導体商社は、Claude Agent SDKでカスタマーサポート解決エージェントを構築し、半導体部品の返品・交換・保証に関する問い合わせに対応しています。エージェントはcreate_replacement_orderツールで代替品の発送を手配できます。選択肢に挙げた4つのルールは、現在すべてシステムプロンプトで指示しています。\n\nログでは、いずれのルールについても、反する応答が全体の0.2〜0.5%見つかっています。チームは、このうち違反すると法令違反や大きな金銭的損失に直結するルールだけを、Agent SDKのフックで確実に強制したいと考えています。","question":"フックで強制すべきルールはどれですか。","choices":[{"text":"技術的な説明は、顧客の専門知識の程度に合わせて言い換える。","explanation":"説明の言い換えは、顧客に合わせた応答の質に関するルールで、判断に柔軟さが求められます。決まった条件で機械的に可否を判定できる内容ではなく、プロンプトの指示やfew-shotの例で品質を高めるのが適しています。"},{"text":"輸出管理の対象品を、許可リスト外の国へ発送しない。","explanation":"正解。輸出管理の違反は法令違反に直結し、0.2%であっても許されません。代替品の発送はcreate_replacement_orderの呼び出しとして表れるため、PreToolUseフックで宛先の国を許可リストと照合し、違反する呼び出しを拒否して人間の担当者へのエスカレーションなどに切り替えれば、プロンプトでは得られない決定論的な保証になります。"},{"text":"回答の冒頭で、顧客の会社名を挙げて呼びかける。","explanation":"呼びかけの書き方は応答の文体に関するルールで、守られなかった場合の影響は小さく、プロンプトによる指示で十分です。また、文章の書き方はツール呼び出しとして表れないため、ツール呼び出しをインターセプトするフックで検査する対象にもなりません。"},{"text":"保証期間外の問い合わせには、有償修理の案内を添える。","explanation":"有償修理の案内を添えることは顧客体験の向上に役立ちますが、案内が漏れても法令違反や大きな金銭的損失にはつながりません。プロンプトで十分に扱える種類のルールで、フックで強制する優先度は低いといえます。"}],"answer":[1],"overall":"Agent SDKのフックによる決定論的な保証と、プロンプトの指示による確率的な遵守の使い分けがテーマです。ガイドは、ビジネスルールで確実な遵守が求められる場合に、プロンプトによる指示ではなくフックを選択することを挙げています。プロンプトの指示は大半のケースで守られますが、失敗率はゼロにはなりません。そのため、違反が法令違反や金銭的な損失につながるルールは、プログラムによって確実に強制する必要があります。PreToolUseフックは、ツールが実行される前に呼び出しの内容を検査し、permissionDecisionで拒否して、その理由をClaudeに伝えられます。\n\n本問の4つのうち、違反が重大な結果につながり、しかもツール呼び出しとして検査できるのは、輸出管理のルールだけです。\n\n誤答の3つは、文体や説明の質、案内の付け加えに関するもので、柔軟な判断が求められるか、違反の影響が小さいため、プロンプトでの指示が適しています。\n\n本番では、フックが拒否した件数と理由を記録しておくと、ルールの抜け道や、システムプロンプトの見直しが必要な箇所を把握できます。\n\n参考: https://code.claude.com/docs/en/agent-sdk/hooks"},{"id":17,"scenario":"エージェントアーキテクチャとオーケストレーション","situation":"ある資産運用会社の開発チームは、Claude Agent SDKを導入する前に、Messages APIを直接呼び出す独自のエージェントループで開発者の生産性向上ツールを作りました。ループの終了判定は次のとおりです。\n\n応答にテキストのブロックが含まれていれば、「最終回答が得られた」とみなして終了する\n\nテキストがなくツールの呼び出しだけの場合は、ツールを実行して続ける\n\nログを見ると、タスクの31%が、最初の応答の「まず、該当するファイルを検索します。」というテキストを返しただけで終了していました。これらの応答には、テキストのあとにGrepのtool_useブロックも含まれていました。","question":"最も適切な修正はどれですか。","choices":[{"text":"tool_choiceを\"any\"にして、毎回の応答で必ずツールを呼び出させる。","explanation":"\"any\"にすると、Claudeは毎回必ずツールを呼び出すため、作業が終わっても最終回答をテキストだけで返すことができず、ループが正しく終わらなくなります。また、最新の一部のモデルは\"any\"に対応していません。"},{"text":"システムプロンプトに「ツールを呼び出すときは説明のテキストを書かない」と追加する。","explanation":"説明のテキストを書かせないように指示すれば、今の判定方法でも動くことが増えるかもしれません。しかし、指示に従うかどうかは確率的で、完了の判定という制御の根幹を、モデルの書き方に依存させることになります。根本原因は、判定の仕組みそのものにあります。"},{"text":"テキストの有無で判定するのをやめ、stop_reasonが\"tool_use\"なら続ける。","explanation":"正解。Claudeは、ツールを呼び出す前に「まず検索します」のように、これから行うことを説明するテキストを書くことがよくあります。そのため、テキストの有無は完了の指標になりません。stop_reasonが\"tool_use\"ならツールを実行して結果を返し、\"end_turn\"になったら終了する、という判定にすれば、テキストを伴うツール呼び出しも正しく処理できます。"},{"text":"最初のリクエストだけmax_tokensを増やし、テキストの後のツール呼び出しまで出力させる。","explanation":"max_tokensが不足していれば、stop_reasonが\"max_tokens\"になり、応答が途中で切れます。しかし本問の応答には、テキストのあとにtool_useブロックまで含まれており、出力は切れていません。問題は、ループがtool_useブロックを無視して終了していることです。"}],"answer":[2],"overall":"エージェントループの終了判定で避けるべきアンチパターンがテーマです。ガイドは、ループ終了の判定に自然言語のシグナルを解析すること、主要な停止メカニズムとして反復回数の上限を設定すること、完了の指標としてアシスタントのテキストコンテンツの有無を確認すること、をアンチパターンとして挙げています。公式ドキュメントでも、Claudeはツールを呼び出す前に、何をするかを自然な文章で説明することが多いとされており、1つの応答にテキストとtool_useブロックが一緒に含まれることは珍しくありません。\n\n本問のループは「テキストがあれば完了」と判定していたため、説明のテキストを伴うツール呼び出しのたびに、ツールを実行せずに終了していました。決め手は、終了した応答にtool_useブロックが含まれていたという事実で、ループがモデルの意図を読み違えていることを示しています。正しい制御フローは、stop_reasonが\"tool_use\"なら継続し、\"end_turn\"なら終了するものです。\n\n誤答の見分け方は、判定の仕組みを直しているか、モデルの書き方に合わせて回避しているかです。\n\n本番では、Agent SDKのように、この制御フローを組み込みで備えた仕組みに移行することも検討します。\n\n参考: https://platform.claude.com/docs/en/build-with-claude/handling-stop-reasons"},{"id":18,"scenario":"ツール設計とMCP統合","situation":"あるEC物流企業は、Claude Agent SDKで開発者の生産性向上ツールを作っています。エージェントにはRead、Write、Edit、Bash、Grep、Globの組み込みツールを与えています。\n\n毎晩、配送業者のマスタデータからcarriers.generated.json（約1,200行）を作り直すタスクを実行しています。このファイルは自動生成専用で、人が手で編集することはありません。\n\nログによると、エージェントは古いファイルを読み込んだうえで、変更のある値ごとにEditを40〜80回呼び出しています。\"status\": \"active\"のように同じ文字列が何十か所にもあるため、一意に一致せずに失敗するEditがあり、今月は途中まで更新されたファイルが3回残っていました。","question":"このタスクで使うべき方法として、最も適切なものはどれですか。","choices":[{"text":"新しい内容を生成し、Writeでファイル全体を一度に書き込ませる。","explanation":"正解。Writeは、ファイル全体を指定した内容で作成または上書きするツールで、ファイル全体を扱う操作に向いています。このファイルは自動生成専用で毎回作り直すものなので、部分的な置き換えを積み重ねるより、新しい内容を一度に書き込むほうが確実で、途中まで更新されたファイルも残りません。"},{"text":"Editの呼び出しを並列に発行させ、置き換えにかかる時間を短くする。","explanation":"Editを並列に発行しても、一意に一致しないold_stringは失敗するため、途中まで更新されたファイルが残る問題は変わりません。ファイルを変更するツールは、競合を避けるために順番に実行されるため、時間の短縮にもつながりません。"},{"text":"replace_all: trueを付けたEditで、変更のある値をまとめて置き換えさせる。","explanation":"replace_allをtrueにするのは、同じ文字列のすべての出現をまとめて置き換えたいときです。本問では、何十か所にある同じ文字列（statusがactiveの行など）のうち一部だけを変えたい場合があるため、すべてを置き換えると、変えるべきでない箇所まで書き換わります。"},{"text":"Bashのsedで、変更のある行を正規表現でまとめて置き換えさせる。","explanation":"sedによる一括置換は、置き換えの対象を正規表現で正確に表せる場合には有効です。しかし、同じ文字列が何十か所にあり、その一部だけを変えたい状況では、正規表現で対象を絞り込むのは難しく、意図しない箇所まで変わるおそれがあります。"}],"answer":[0],"overall":"組み込みツールの使い分けのうち、ファイル全体を扱うRead／Writeと、的を絞った変更のためのEditの選び方がテーマです。ガイドは、ファイル全体の操作にはRead/Write、一意に一致するテキストを使った、的を絞った変更にはEditを使うことを知識として挙げています。公式ドキュメントによると、Editはold_stringをファイル内のちょうど1か所と完全に一致させて置き換える仕組みで、一致が複数あると、より長い前後の文脈を含めるかreplace_allを使う必要があります。\n\n本問のファイルは毎回作り直す自動生成ファイルで、同じ文字列が大量に繰り返されるという、Editの一意性の条件と相性の悪い構造です。決め手は「自動生成専用で手で編集しない」という条件で、既存の内容を部分的に保つ必要がないため、ファイル全体を書き込むWriteが最も単純で確実な方法になります。\n\n誤答の見分け方は、ファイル全体の作り直しを、部分的な置き換えで実現しようとしていないかどうかです。\n\n本番では、Writeで書き込んだ後に、JSONとして読み込めるかを確かめる検証の手順を加えると、さらに安全です。\n\n参考: https://code.claude.com/docs/en/tools-reference"},{"id":19,"scenario":"エージェントアーキテクチャとオーケストレーション","situation":"ある旅行会社の調査チームは、マルチエージェントリサーチシステムで「南欧方面の団体ツアーの予約が前年より35%減った理由」を調べています。コーディネーターは、調査の開始時に質問の文面から「競合の価格」「為替」「広告費」の3つのサブタスクを決めます。そして、それぞれをサブエージェントに委任し、結果を統合しています。\n\n最初の調査で、検索サブエージェントは「主要な航空会社が、南欧への直行便を春から減便している」という情報を見つけていました。しかし、開始時に決めたサブタスクに含まれていなかったため、減便の影響は最終レポートで扱われていませんでした。","question":"コーディネーターの計画の立て方として、適切な変更はどれですか。（2つ選択してください。）","choices":[{"text":"サブタスクは調査の開始時に決め、途中で見つかった情報は統合エージェントに渡して最終レポートで補足させる。","explanation":"途中で見つかった情報を最終レポートで補足させる方法は、計画の外で得た情報を捨てずに残せる点では妥当に見えます。しかし、統合エージェントが受け取るのは「減便がある」という事実だけで、その影響を調べるサブタスクがないため、減便が予約の減少にどれだけ関係したかは検証されないまま書き添えられます。原因の調査はオープンエンドなので、途中の発見に応じてコーディネーターが計画そのものを更新する必要があります。"},{"text":"最初に幅広い調査を行わせ、見つかった要因（減便など）に応じて次のサブタスクを追加する。","explanation":"正解。ガイドは、各ステップで発見された内容に基づいてサブタスクを生成する、適応的な調査計画の価値を挙げています。まず幅広く調べて全体像をつかみ、減便のような新しい要因が見つかったら、その影響を調べるサブタスクを追加すれば、開始時には想定していなかった原因も調査の対象にできます。"},{"text":"調査の途中で、得られた結果に応じてサブタスクの優先順位を見直し、影響の小さい調査は打ち切る。","explanation":"正解。動的な分解では、サブタスクを追加するだけでなく、得られた結果に応じて計画全体を見直します。影響の大きそうな領域を優先し、調べても関係が薄いと分かった領域は打ち切ることで、限られた時間とコストを、原因の解明に役立つ調査に振り向けられます。"},{"text":"新しい情報を見つけたサブエージェントには、自分の判断でさらにサブエージェントを起動させ、自由に調べさせる。","explanation":"サブエージェントに自由にサブエージェントを起動させると、新しい情報は拾えるかもしれませんが、調査の全体像を把握する役がいなくなり、重複や抜けをコーディネーターが管理できません。計画の見直しは、全体を見ているコーディネーターが担うべき役割です。"}],"answer":[1,2],"overall":"複雑なワークフローのタスク分解のうち、発見に応じて計画を変える動的な分解がテーマです。ガイドは、固定の逐次パイプライン（プロンプトチェーン）と、途中の発見に基づく動的な分解をどのような場合に使い分けるかを知識として挙げ、オープンエンドな調査タスクには動的な分解を選ぶとしています。また、各ステップで発見された内容に基づいてサブタスクを生成する、適応的な調査計画の価値も挙げています。\n\n本問の調査は「なぜ予約が減ったか」という原因の探索で、何が原因かは調べてみるまで分かりません。それにもかかわらず、開始時に質問の文面から決めた3つのサブタスクを固定していたため、途中で見つかった減便という有力な手がかりが計画に反映されませんでした。正解の2つは、発見に応じたサブタスクの追加と、結果に応じた優先順位の見直しで、どちらも計画をコーディネーターが更新し続ける形です。\n\n誤答の見分け方は、計画を固定していないか、全体の管理を手放していないかです。\n\n本番では、計画の変更とその理由をコーディネーターに記録させておくと、レポートの結論に至った経緯を後から説明できます。\n\n参考: https://www.anthropic.com/engineering/multi-agent-research-system"},{"id":20,"scenario":"ツール設計とMCP統合","situation":"ある音楽ライブのチケット販売会社は、カスタマーサポート解決エージェントを運用しています。システムプロンプトには「『チケット』という言葉が含まれる問い合わせでは、必ずlookup_orderで注文を確認すること」という指示があります。\n\n先月、各ツールの説明を書き直し、lookup_orderには「個別の注文の状況を確認する。払い戻しの規定などの一般的な質問にはsearch_policyを使う」と境界を明記しました。\n\nそれでも、「チケットの払い戻しの規定を教えて」のような一般的な質問の22%で、エージェントはlookup_orderを呼び、顧客に注文番号を尋ねていました。ツールの数は5つで、説明は互いに明確に区別されています。","question":"最も可能性の高い根本原因はどれですか。","choices":[{"text":"lookup_orderの説明がまだ短く、search_policyとの違いが十分に伝わっていない。","explanation":"ツールの説明が最小限であれば、誤ったルーティングの原因になります。しかし本問では、先月の書き直しでlookup_orderの説明にsearch_policyとの境界が明記されており、説明は互いに明確に区別されています。説明の不足では、この症状を説明できません。"},{"text":"払い戻しの規定に関する質問を示すfew-shotの例が、システムプロンプトに不足している。","explanation":"few-shotの例は、あいまいなケースの扱いを示すのに役立ちます。ただし、今回の質問はあいまいではなく、ツールの説明では明確にsearch_policyの対象です。それでもlookup_orderが選ばれていることは、例の不足ではなく、説明と矛盾する指示があることを示しています。"},{"text":"ツールの数が多すぎるため、エージェントのツール選択の信頼性が下がっている。","explanation":"ツールが多すぎると選択の信頼性が下がるのは事実ですが、本問のツールは5つで、問題になるほどの数ではありません。また、誤りが「チケット」という語を含む質問に集中していることも、ツールの数とは別の原因を示しています。"},{"text":"特定のキーワードに反応するシステムプロンプトの指示が、ツールの説明より優先されている。","explanation":"正解。システムプロンプトの「『チケット』という言葉が含まれる問い合わせでは、必ずlookup_order」という指示は、特定のキーワードに反応する指示で、意図しないツールの関連付けを生みます。この指示がある限り、ツールの説明で境界を明記しても、「チケット」を含む一般的な質問では指示のほうに引きずられます。指示を、注文の確認が必要な場合だけに限定する形に書き直す必要があります。"}],"answer":[3],"overall":"システムプロンプトの文言が、ツールの選択に与える影響がテーマです。ガイドは、特定のキーワードに反応する指示が、意図しないツールの関連付けを生む可能性があることを知識として挙げ、適切に書かれたツールの説明を上書きしてしまう可能性のある、キーワードに反応する指示がないかシステムプロンプトをレビューすることを、スキルとしています。\n\n本問の決め手は、ツールの説明をすでに書き直して境界も明記しているのに、「チケット」という語を含む一般的な質問だけで誤りが続いていることです。これは、ツールの説明そのものではなく、説明と矛盾するシステムプロンプトの指示が選択を左右していることを示しています。\n\n誤答の見分け方は、事実と合う原因かどうかです。説明の不足やツールの数は問題文の事実で否定されており、few-shotの例は、矛盾する指示が残っている状態では根本的な解決になりません。\n\n本番では、ツールの説明を改善したときに、システムプロンプトにそのツールの名前や関連する語句を含む指示がないかを、あわせて確認するとよいでしょう。\n\n参考: https://platform.claude.com/docs/en/agents-and-tools/tool-use/define-tools"},{"id":21,"scenario":"プロンプトエンジニアリングと構造化出力","situation":"ある銀行の開発チームは、夜間にリポジトリ全体の静的解析の結果をMessage Batches APIで要約し、翌朝モジュールごとのレビューレポートを作成するCIジョブを運用しています。ジョブの実装は次のとおりです。\n\n各リクエストには、custom_idとして\"req-0001\"から順に連番を振っている\n\n結果ファイルは上から順に読み込み、送信時のモジュール一覧の順番どおりに各モジュールへ割り当てている\n\n先週から、「あるモジュールのレポートに、別のモジュールのクラス名や指摘が書かれている」という報告が12件寄せられています。プロンプトとモデルは変更しておらず、個々の要約は、別のモジュールの解析結果として読めば正確な内容でした。","question":"最も可能性の高い根本原因はどれですか。","choices":[{"text":"結果の順番は送信順と一致する保証がないのに、custom_idでなく行の順番で割り当てている。","explanation":"正解。バッチの結果は任意の順番で返される可能性があり、送信時の順番と一致する保証はありません。結果を行の順番でモジュールに割り当てると、順番がずれたときに要約と対象のモジュールが食い違います。各結果は、custom_idで送信時のリクエストと突き合わせる必要があります。"},{"text":"プロンプトキャッシュがバッチ内のリクエスト間で共有され、別のモジュールの内容が応答に混ざっている。","explanation":"プロンプトキャッシュは、同じ接頭辞を持つリクエストの処理を再利用して、コストとレイテンシを下げる仕組みです。バッチと併用することもできますが、キャッシュが効いても各リクエストの応答はそのリクエストの入力に基づいて生成されるため、別のモジュールの内容が応答に混ざる原因にはなりません。"},{"text":"夜間は負荷が高いため、Message Batches APIが複数のリクエストを1つにまとめて処理している。","explanation":"Message Batches APIでは、バッチ内の各リクエストは独立して処理されます。負荷によって処理が遅くなることはあっても、複数のリクエストが1つにまとめられることはありません。"},{"text":"入力がコンテキストの上限を超えたリクエストで、隣のリクエストの内容が入力に連結されている。","explanation":"入力がコンテキストの上限を超えたリクエストはエラーになり、隣のリクエストの内容が自動的に連結されることはありません。上限超過が問題になる場合は、custom_idで失敗した文書を特定し、チャンク分割して再送信するのが対処です。"}],"answer":[0],"overall":"Message Batches APIで、リクエストとレスポンスを対応付ける仕組みがテーマです。Message Batches APIは、50%のコスト削減と引き換えに最大24時間の処理ウィンドウで非同期に処理するAPIで、夜間レポートのようにレイテンシを許容できるワークロードに向いています。公式ドキュメントは、バッチの結果は任意の順番で返される可能性があり、作成時のリクエストの順番と一致するとは限らないため、対応付けには必ずcustom_idを使うよう求めています。\n\n本問のジョブはcustom_idを付けているものの、割り当てには使わず、結果ファイルの行の順番に頼っていました。決め手は「個々の要約は、別のモジュールの結果として読めば正確」という事実で、生成の誤りではなく割り当ての誤りであることを示しています。\n\nキャッシュによる混入やリクエストの統合は、バッチの仕組みには存在しない現象です。\n\n本番では、custom_idにモジュールを識別できる意味のある値を入れておくと突き合わせが容易になり、後から調査するときにも役立ちます。\n\n参考: https://platform.claude.com/docs/en/build-with-claude/batch-processing"},{"id":22,"scenario":"プロンプトエンジニアリングと構造化出力","situation":"ある会計事務所の社内開発チームは、税額計算ライブラリのプルリクエストをClaude CodeのCIレビューで確認しています。現在は、1件のPRあたり平均14件の指摘をすべてインラインコメントとして投稿しています。しかし、開発者が実際に対応した指摘は約3割にとどまり、コメントが読まれなくなりつつあります。\n\nチームは、重要な指摘だけを即時にコメントし、それ以外は週次でまとめて確認する運用に変えたいと考えています。直近3か月分の指摘については、開発者が「対応」「却下」のどちらを選んだかの記録が残っています。","question":"指摘の振り分けの設計として、最も適切なものはどれですか。","choices":[{"text":"指摘を生成した同じセッションで1〜10の確信度を付けさせ、7以上をそのまま即時コメントにする。","explanation":"指摘に確信度を付けること自体は振り分けの材料になります。しかし、生成と同じセッションでは自身の判断を疑いにくく、7という値も実際の対応率で確かめたものではありません。キャリブレーションされていない自己申告の値をそのまましきい値に使うと、確信度は高いのに却下される指摘が即時コメントに残ります。"},{"text":"重大度に関係なく、1PRあたりの即時コメントを上位3件に制限し、残りを週次の確認に回す。","explanation":"件数の上限は、コメントの量を抑える即効性のある手段です。ただし、どの3件を残すかの根拠がなく、1件のPRに重要な指摘が5件ある場合は2件が週次に回ってしまいます。手元にある対応記録を判断に使っていない点も、本問の条件に合いません。"},{"text":"別の検証パスで指摘ごとに確信度を付けさせ、過去の対応記録でキャリブレーションしたしきい値で振り分ける。","explanation":"正解。各指摘に確信度を自己申告させる検証パスを設けると、指摘ごとの振り分けに使える値が得られます。ただし自己申告の値はそのままではキャリブレーションされていないため、過去の「対応／却下」の記録をラベルとして、確信度の帯ごとに実際に対応された割合を測り、しきい値を決めます。これで、確信度の数字が実際の有用性と対応した振り分けになります。"},{"text":"レビュープロンプトに「確信度の高い指摘だけを報告する」と追記し、出力をすべて即時コメントにする。","explanation":"「確信度の高いものだけを報告する」という一般的な指示は、何を報告すべきかの具体的な基準を与えないため、精度の向上につながりにくいとされています。また、出力をすべて即時コメントにするので、重要な指摘とそれ以外を分けるというチームの目的も満たしません。"}],"answer":[2],"overall":"マルチパスのレビュー設計のうち、確信度を使ったキャリブレーションされたルーティングがテーマです。ガイドは、モデルが各指摘事項とあわせて確信度を自己申告する検証パスを実行し、キャリブレーションされたレビューのルーティングを可能にすることを挙げています。ポイントは「キャリブレーション」で、自己申告の値は実際の正しさと一致する保証がないため、正解ラベル付きのデータで確信度と実際の結果の関係を測ってから、しきい値を決める必要があります。\n\n本問では、開発者の「対応／却下」の記録がそのラベルとして使えます。Claude Codeのマネージドなコードレビューも、候補の指摘を検証ステップでコードと照合し、誤検知を除いてから投稿する構成です。\n\n誤答の見分け方は、振り分けの基準が実際のデータで裏付けられているかどうかです。プロンプトの一般的な指示、同じセッションでのキャリブレーションされていない数値、根拠のない件数制限は、いずれも裏付けがありません。\n\n本番では、キャリブレーションしたしきい値も定期的に記録と突き合わせ、コードベースや規約の変化に合わせて見直します。\n\n参考: https://code.claude.com/docs/en/code-review"},{"id":23,"scenario":"コンテキスト管理と信頼性","situation":"ある製薬会社は、医療機関からの製品に関する問い合わせに対応するカスタマーサポート解決エージェントを運用しています。現在は、次のどちらかに当てはまったときに、アプリケーション側で自動的に人間の担当者へ転送する設計です。\n\n感情分析のスコアが一定以下になったとき\n\nエージェントが自己申告する確信度が0.6を下回ったとき\n\n1か月分のログを分析すると、転送された案件の43%は、配送遅延への苦情など定型の手続きで解決できるものでした。一方で、落ち着いた口調で寄せられた適応外使用の相談や副作用の報告は、確信度0.9前後のままエージェントが自分で回答していました。\n\n社内規程では、この2種類は必ず医薬情報部門の担当者が対応することになっています。","question":"最も可能性の高い根本原因はどれですか。","choices":[{"text":"感情分析のしきい値が厳しすぎ、口調が穏やかな顧客の案件が人間の担当者に回されていない。","explanation":"感情分析のしきい値を調整しても、判断の材料が口調であることは変わりません。適応外使用の相談は穏やかな口調で寄せられることも多く、口調と規程上の要件はもともと連動しないため、しきい値をどう設定しても必須の案件を確実には拾えません。"},{"text":"エスカレーションの条件が、エージェントのシステムプロンプトではなくアプリケーション側のコードにだけ実装されている。","explanation":"条件をどこに実装するかは設計上の選択で、アプリケーション側のコードで判定すれば、決まった条件を毎回確実に適用できるという利点もあります。今回の誤りは、判定に使う指標が案件の内容と連動していないことが原因で、同じ条件をシステムプロンプトに移しても、口調や確信度で判断する限り、規程上の必須案件は拾えません。"},{"text":"確信度のしきい値0.6が低すぎ、確信度0.9前後の回答がエスカレーションの対象から漏れている。","explanation":"しきい値を引き上げると転送の件数は増えますが、自己申告の確信度は実際の難しさを正しく反映していません。今回も規程上の必須案件で確信度は0.9前後と高く出ており、しきい値を上げても、高い確信度のまま誤って自動処理される案件は残ります。"},{"text":"エスカレーションの判断を、案件の内容と連動しない口調や自己申告の確信度に頼っている。","explanation":"正解。顧客の口調や、エージェントが自己申告する確信度は、案件の複雑さや社内規程が求める対応とは連動しない、信頼できない指標です。そのため、苛立っているだけの定型の案件が転送され、穏やかな口調で寄せられた規程上の必須案件は高い確信度のまま自動で処理されていました。エスカレーションの条件を、適応外使用の相談や副作用の報告といった案件の内容で定義する必要があります。"}],"answer":[3],"overall":"エスカレーションの判断に何を使うべきかがテーマです。ガイドは、感情に基づくエスカレーションや自己申告の確信度スコアが、実際のケースの複雑さを示す指標として信頼できない理由を知識として挙げています。適切なエスカレーションの条件は、顧客による人間の担当者への要求、ポリシーの例外やポリシーに定めがないケース、解決に向けて進展しない状況などで、案件の内容に基づいて定義します。\n\n本問のログは、2つの指標がどちらも外れていることを示しています。苛立った顧客の定型の案件は転送され、穏やかな口調の規程上の必須案件は、高い確信度のまま自動で処理されていました。決め手は「43%が定型で解決できた」「必須案件の確信度が0.9前後」という2つの事実で、しきい値の高低ではなく、指標の選び方そのものに原因があることを示しています。\n\n誤答のうち2つは、口調や確信度という指標を使い続けたまま、しきい値の高低に原因を求めています。もう1つは条件の実装場所を問題にしていますが、どこに実装しても判定に使う指標が同じなら、結果は変わりません。\n\n本番では、規程上必ず人に回すべき案件の種類を明示的なエスカレーション基準としてシステムプロンプトに書き、判断の境界を示すfew-shotの例を添えます。\n\n参考: https://platform.claude.com/docs/en/about-claude/use-case-guides/customer-support-chat"},{"id":24,"scenario":"エージェントアーキテクチャとオーケストレーション","situation":"ある県庁の政策企画課は、マルチエージェントリサーチシステムで、市区町村ごとの子育て支援策の効果を調べています。コーディネーターは検索サブエージェントに、次の手順をプロンプトで渡しています。\n\n国の統計サイトで検索する\n\n上位3件を要約する\n\n結果を返す\n\n結果を確認すると、国の統計サイトに市区町村単位のデータがないテーマでは、検索サブエージェントが「該当なし」と返して終わっていました。実際には、県や市の公開資料に必要なデータがあるケースも多くありました。また、2019年以前の古い統計を要約して返していたケースもありました。","question":"コーディネーターから検索サブエージェントへの委任の仕方として、適切な変更はどれですか。（2つ選択してください。）","choices":[{"text":"調査の目的と、市区町村単位・2020年以降・一次資料という品質基準を伝える。","explanation":"正解。ガイドは、サブエージェントが状況に適応できるように、段階的な手順ではなく、リサーチの目標と品質基準を指定するコーディネーターのプロンプトを設計することを挙げています。何のために調べ、どのような結果なら十分かが分かれば、サブエージェントは国の統計にデータがなくても別の資料を探し、古い統計を除外する判断ができます。"},{"text":"コーディネーターの会話履歴をサブエージェントがすべて引き継ぐ設定を有効にし、背景を伝える。","explanation":"Claude CodeやAgent SDKには、現在の会話を分岐させて履歴ごとサブエージェントに渡す仕組み（fork）もありますが、コーディネーターの長い履歴をそのまま渡しても、何のために調べ、どのような結果なら十分かという基準は伝わりません。\n\nforkでない通常のサブエージェントはコーディネーターの会話履歴を受け取らないため、必要な背景と基準は委任のプロンプトで明示的に渡す必要があります。履歴を丸ごと渡すと、サブエージェントのコンテキストを調査と無関係なやり取りで埋めることにもなります。"},{"text":"使ってよい情報源の種類と範囲を条件として示し、どの順番で探すかはサブエージェントに任せる。","explanation":"正解。Anthropicのマルチエージェントリサーチシステムでは、各サブエージェントに目的、出力の形式、使うべきツールや情報源の指針、明確なタスクの境界を伝えることが重要だとされています。使ってよい情報源の範囲を条件として示し、探し方は任せれば、サブエージェントは範囲内で柔軟に情報源を選べます。"},{"text":"国の統計サイトで見つからない場合は県のサイト、次に市のサイトを検索する、という手順を追加する。","explanation":"手順を追加すれば、今回のケースには対応できるかもしれません。しかし、想定していない状況（市の資料が別の形式で公開されている、など）が起きるたびに手順を足すことになり、サブエージェントは手順にない対応を取れないままです。問題は手順の不足ではなく、目標と基準が伝わっていないことです。"}],"answer":[0,2],"overall":"サブエージェントへの委任の仕方、特にプロンプトで何を指定するかがテーマです。ガイドは、サブエージェントが適応できるように、段階的な手順の指示ではなく、リサーチの目標と品質基準を指定するコーディネーターのプロンプトを設計することを挙げています。Anthropicのマルチエージェントリサーチシステムでも、各サブエージェントには目的、出力の形式、ツールや情報源の指針、明確なタスクの境界が必要だとされ、厳格なルールよりも良い判断の手がかりを与える方針がとられています。\n\n本問の手順書型の委任では、想定外の状況（国の統計にデータがない）に出会ったときにサブエージェントが打つ手がなく、何が良い結果かも伝わっていないため、古い統計を返していました。正解の2つは、目標と品質基準を伝えることと、情報源の範囲は条件として示しつつ探し方は任せることで、どちらも「何を達成すべきか」を渡して「どうやるか」を任せる形です。\n\n誤答の見分け方は、手順を増やしていないか、目標と基準の代わりに会話履歴を渡そうとしていないかです。\n\n本番では、品質基準を満たす情報が見つからなかった場合にその旨を結果に明記させると、コーディネーターがカバレッジの不足を判断できます。\n\n参考: https://www.anthropic.com/engineering/multi-agent-research-system"},{"id":25,"scenario":"エージェントアーキテクチャとオーケストレーション","situation":"ある公的研究機関の調査部門は、マルチエージェントリサーチシステムで政策テーマの調査レポートを作っています。過去30件のレポートのうち12件で、レビュー担当者から「テーマの主要な領域が抜けている」と指摘されました。\n\nたとえば「高齢化が地域の公共交通に与える影響」というテーマでは、コーディネーターのログに、情報源の種類ごとの次の3つのサブタスクが記録されていました。\n\n白書・統計を調べる\n\n学術論文を調べる\n\n報道記事を調べる\n\n3つのサブエージェントはどれもテーマの文言をそのまま検索し、返ってきた結果の大半は路線バスの廃止に関するものでした。鉄道、デマンド交通、高齢者の移動需要といったテーマの領域は、どの指示にも現れていませんでした。","question":"レポートの抜けを防ぐために、最も効果的な変更はどれですか。","choices":[{"text":"各サブエージェントが取得する検索結果の件数を、10件から30件に増やす。","explanation":"検索結果の件数を増やすと、1回の調査で集まる情報の量は増えます。しかし、検索の文言が同じである限り、上位に来るのは路線バスの記事が中心で、鉄道やデマンド交通の情報が確実に含まれるとは限りません。件数の調整は、調べる範囲の決め方という原因に手を付けていません。"},{"text":"テーマを構成する領域を洗い出させ、領域ごとに調査範囲を分けて割り当てさせる。","explanation":"正解。ログが示すとおり、サブタスクはすべて情報源の種類で区切られており、テーマの中身による切り分けはどの指示にもありませんでした。そのため、各サブエージェントは最も情報の多い路線バスの話題に流れました。\n\nコーディネーターがまずテーマを構成する領域（路線バス、鉄道、デマンド交通、移動需要など）を洗い出し、領域ごとに調査範囲を割り当てれば、各領域に担当が付き、網羅できているかを分解の段階で確かめられます。"},{"text":"自治体の公開資料を調べるサブタスクを加え、情報源の種類を4つに増やす。","explanation":"情報源の種類を増やすと、自治体の交通計画のような資料も対象に入り、出典の幅は広がります。しかし、増えたサブエージェントも同じテーマの文言で検索するため、結果は路線バスに偏ったままです。足りないのは情報源の種類ではなく、テーマの領域による調査範囲の切り分けです。"},{"text":"各情報源のサブタスクに、検索するキーワードの一覧を追加で指定する。","explanation":"キーワードの一覧を指定する方法は、検索の焦点を絞りたい場面では役立ちます。しかし、分解の単位が情報源の種類のままなので、3つのサブエージェントが同じキーワードを重複して調べることになり、鉄道やデマンド交通をどこまで調べたかを領域ごとに確かめる単位もありません。さらに、適切なキーワードを選ぶには、まずテーマの領域を洗い出す必要があり、本問ではその工程そのものが抜けています。"}],"answer":[1],"overall":"コーディネーター・サブエージェントパターンで、コーディネーターがタスクをどの軸で分解するかがテーマです。ガイドは、コーディネーターがタスクの分解・委任・結果の集約を担うこと、そしてコーディネーターのタスク分解が狭すぎると、幅広いリサーチトピックを十分にカバーできなくなるリスクを挙げています。分解の軸を誤った場合も、同じように抜けが生じます。\n\n本問の分解は「どこで調べるか」（情報源の種類）だけで、「何を調べるか」（テーマの領域）を誰にも割り当てていません。そのため、どのサブエージェントもテーマの文言で検索し、最も情報の多い路線バスの話題に集中しました。決め手は、ログの3つのサブタスクに領域の名前が一つも出てこないという事実です。\n\n誤答の見分け方は、分解の単位を変えているかどうかです。キーワードの追加、情報源の追加、検索件数の増加は、いずれも情報源ごとの分解を保ったまま、量や条件を調整しているだけです。\n\nAnthropicのマルチエージェントリサーチシステムでも、詳細なタスクの説明がないと、エージェントが作業を重複させたり、抜けを残したりすることが報告されています。本番では、コーディネーターに分解の結果と各領域の担当を出力させ、統合の前に、洗い出した領域がすべて調べられたかを確かめさせると効果的です。\n\n参考: https://www.anthropic.com/engineering/multi-agent-research-system"},{"id":26,"scenario":"Claude Codeの設定とワークフロー","situation":"ある物流会社の開発チームは、Claude Codeで配送ルート計算サービスのコードを生成しています。チームには、次のような規約があります。\n\n距離はメートル単位の整数で扱う\n\n外部APIの呼び出しにはタイムアウトを設定する\n\nリード開発者のセッションでは、これらの規約が守られます。しかし、今月参加した3名のセッションや、CIで実行したClaude Codeでは守られません。\n\nリード開発者のセッションで/contextを実行すると、Memory filesにCLAUDE.mdとCLAUDE.local.mdが表示されます。新しいメンバーのセッションではCLAUDE.mdだけが表示され、その内容はビルドとテストのコマンドだけでした。","question":"最も可能性の高い原因はどれですか。","choices":[{"text":"ルートのCLAUDE.mdが長すぎるため、新しい環境では途中で読み込みが打ち切られている。","explanation":"CLAUDE.mdが長いと、コンテキストを多く消費して指示が守られにくくなることはありますが、途中で読み込みが打ち切られるわけではありません。新しいメンバーの環境のCLAUDE.mdは、ビルドとテストのコマンドだけの短い内容で、規約の記述そのものが含まれていません。"},{"text":"新しいメンバーがサブディレクトリでClaude Codeを起動しており、ルートのCLAUDE.mdが読み込まれていない。","explanation":"Claude Codeは、起動したディレクトリとその上位のすべてのディレクトリにあるCLAUDE.mdを起動時に読み込みます。サブディレクトリで起動しても、ルートのCLAUDE.mdは読み込まれます。実際に、新しいメンバーの/contextにもCLAUDE.mdが表示されています。"},{"text":"新しいメンバーの~/.claude/CLAUDE.mdが空のため、プロジェクトの設定が継承されていない。","explanation":"~/.claude/CLAUDE.mdはユーザーレベルの個人の設定で、プロジェクトの規約がそこから継承される仕組みはありません。プロジェクトの規約は、ユーザーレベルのファイルの有無に関係なく、プロジェクトのCLAUDE.mdから読み込まれます。"},{"text":"規約がリード開発者のCLAUDE.local.mdに書かれており、Gitで共有されていない。","explanation":"正解。CLAUDE.local.mdは、プロジェクトごとの個人の設定を置くためのファイルで、.gitignoreに追加してバージョン管理に含めない使い方が想定されています。チームの規約をここに書くと、リード開発者の環境でしか読み込まれません。規約はプロジェクトのCLAUDE.mdに移してコミットする必要があります。"}],"answer":[3],"overall":"CLAUDE.mdの設定階層の問題を診断する問題です。CLAUDE.mdには、組織が管理するもの、ユーザーレベル（~/.claude/CLAUDE.md）、プロジェクトレベル（./CLAUDE.mdまたは./.claude/CLAUDE.md）、個人のプロジェクト設定（CLAUDE.local.md）などの階層があり、どこに書くかで誰に共有されるかが決まります。チームで共有されるのは、バージョン管理を通じて配布されるプロジェクトレベルのファイルです。ガイドは、指示がプロジェクトレベルではなく個人のレベルの設定にあるために、新しいチームメンバーに指示が届かない、という階層の問題を診断するスキルを挙げています。\n\n本問の決め手は、/contextの表示の違いです。リード開発者の環境にだけCLAUDE.local.mdがあり、共有されているCLAUDE.mdには規約がないことから、規約が個人用のファイルに書かれていることが分かります。\n\n誤答は、読み込みの打ち切り、ユーザーレベルからの継承、起動ディレクトリと、いずれもClaude Codeの実際の読み込み方と合わない説明です。\n\n本番では、新しいメンバーが参加したときに、/contextの表示をリード開発者の環境と比べると、この種の問題をすぐに見つけられます。\n\n参考: https://code.claude.com/docs/en/memory"},{"id":27,"scenario":"エージェントアーキテクチャとオーケストレーション","situation":"ある旅行会社の開発チームは、Claude Codeで運賃ルールの判定ロジックを監査しています。ある開発者は、fare-auditという名前を付けたセッションで、運賃ルールに関係する25ファイルの分析を進めてきました。\n\n翌日、同僚がマージしたプルリクエストによって、このうちfare_rules.py、discount.py、tax_calc.pyの3ファイルが変更されました。残りの22ファイルは変更されていません。開発者は、前日の分析をできるだけ活かして監査を続けたいと考えています。","question":"作業を再開する方法として、最も適切なものはどれですか。","choices":[{"text":"新しいセッションを開始し、25ファイルすべてを最初から読み込んで分析し直させる。","explanation":"新しいセッションで始め直すと、古い情報に引きずられる心配はなくなります。しかし、22ファイル分の分析はまだ有効なため、それをすべてやり直すのは無駄が大きく、「前日の分析をできるだけ活かしたい」という要件にも反します。新しいセッションが向くのは、以前のツールの結果の多くが古くなっている場合です。"},{"text":"claude --resume fare-auditで再開し、変更された3ファイルだけを再分析させる。","explanation":"正解。名前付きのセッションは、claude --resume fare-auditのように名前を指定して再開できます。前日の分析の大半（22ファイル分）はそのまま有効なので、セッションを再開し、変更された3ファイルを具体的に伝えて、その部分だけを再分析させるのが最も効率的です。"},{"text":"claude --resume fare-auditで再開し、変更には触れずに前回の作業の続きを進めさせる。","explanation":"変更に触れずに再開すると、Claudeは前日に読んだ3ファイルの古い内容を前提に作業を続けます。変更後のコードと食い違った分析をもとに監査を進めることになり、誤った結論につながるおそれがあります。"},{"text":"claude --continueで再開し、「最新の状態を確認してから続けて」とだけ指示する。","explanation":"claude --continueは、現在のディレクトリで最も新しいセッションを開くため、fare-auditが最新でなければ別のセッションが開く可能性があります。また、「最新の状態を確認して」という指示だけでは、どのファイルが変わったかが分からず、25ファイル全体を再び調べ直すことになりかねません。"}],"answer":[1],"overall":"セッションの再開と、再開時に変更を伝えることの重要性がテーマです。ガイドは、--resumeで名前付きのセッションを再開して特定の過去の会話を続けること、そしてコード変更の後にセッションを再開する際は、以前に分析したファイルへの変更をエージェントに伝えることの重要性を挙げています。また、全体を再探索させるのではなく、的を絞った再分析のために、再開したセッションに具体的なファイルの変更を伝えることをスキルとしています。\n\n本問では、25ファイルのうち変更されたのは3ファイルだけで、以前の分析はおおむね有効です。この状況では、新しく始めるよりも再開を選び、変更点を具体的に伝えるのが適切です。\n\n誤答の見分け方は、再開と新規開始の選択が状況に合っているか、変更の伝え方が具体的かの2点です。全ファイルのやり直しは過剰で、変更に触れない再開は古い前提を残し、あいまいな指示は全体の再探索を招きます。\n\n本番では、変更されたファイルの一覧をgit diff --name-onlyなどで取得してから伝えると、伝え漏れを防げます。\n\n参考: https://code.claude.com/docs/en/sessions"},{"id":28,"scenario":"ツール設計とMCP統合","situation":"ある市役所は、住民からの粗大ごみの収集予約や、各種証明書の郵送申請に対応するカスタマーサポート解決エージェントを運用しています。予約や申請を行うMCPツールは、どのような失敗でも「処理に失敗しました」という一律のエラーメッセージを返しています。\n\nログを見たところ、次のことが分かりました。\n\n「収集の申し込みは、収集日の3日前の17時まで」という規則に反した予約で、エージェントが同じ予約を4回繰り返して失敗していた\n\n存在しない住所コードを指定した申請では、住民に「システム障害が発生しています」と案内していた","question":"ツールのエラーレスポンスの改善として適切なものはどれですか。（2つ選択してください。）","choices":[{"text":"エラーメッセージは一律のまま、ツールが失敗したら人間の担当者にエスカレーションさせる。","explanation":"失敗をすべて人間の担当者に回せば誤った案内は避けられますが、受付期限の案内や住所の確認のように、エージェントが自分で対応できる案件まで人に回ることになります。原因は、エージェントが失敗の中身を知らされていないことにあります。"},{"text":"エラーメッセージは一律のまま、エージェント側でどの失敗も3回まで間隔をあけてリトライさせる。","explanation":"間隔をあけたリトライは、タイムアウトのような一時的なエラーには有効です。しかし、受付期限を過ぎた予約や存在しない住所コードは、何度リトライしても成功しません。一律のエラーのままでは、リトライすべき失敗とそうでない失敗を区別できないため、無駄な呼び出しが増えるだけです。"},{"text":"失敗の種類と、リトライで解決できるかどうかを、構造化されたメタデータとして返す。","explanation":"正解。一律のエラーでは、エージェントは一時的なエラーなのか、入力の誤りなのか、規則違反なのかを区別できません。失敗の種類と、リトライで解決できるかどうかを構造化して返せば、エージェントは規則違反ではリトライをやめ、入力の誤りでは住民に住所の確認を求める、といった適切な判断を下せます。"},{"text":"規則に反した失敗では、住民にそのまま伝えられる分かりやすい説明を含めて返す。","explanation":"正解。ガイドは、ビジネスルールの違反に対して、リトライ不可のフラグと顧客にわかりやすい説明を含め、エージェントが適切に伝えられるようにすることを挙げています。「収集日の3日前の17時を過ぎているため、この日の予約はできません」のような説明があれば、エージェントは住民に理由と次の選択肢を伝えられます。"}],"answer":[2,3],"overall":"MCPツールの構造化されたエラーレスポンスのうち、一律のエラーメッセージの問題がテーマです。ガイドは、一律のエラーレスポンス（本問の「処理に失敗しました」のような汎用的なメッセージ）では、エージェントが適切な復旧の判断を下せなくなる理由を知識として挙げています。そして、リトライ可能かどうかを示す構造化されたメタデータを返すことで無駄なリトライを防げること、ビジネスルールの違反にはリトライ不可のフラグと顧客にわかりやすい説明を含めることを挙げています。\n\n本問の2つの症状は、どちらも一律のエラーが原因です。規則違反を一時的な失敗と区別できないために同じ予約を繰り返し、入力の誤りを障害と区別できないために「システム障害」と案内していました。正解の2つは、失敗の種類とリトライの可否というエージェント向けの情報と、住民に伝える説明という人向けの情報を、エラーレスポンスに含めるものです。\n\n誤答の見分け方は、エラーレスポンスの情報量を増やしているかどうかです。一律のエラーのままでのリトライやエスカレーションは、判断の材料が足りないまま、対応だけを変えています。\n\n本番では、住民に伝える説明の文面を、窓口の担当者が使っている案内と同じ表現にそろえると、問い合わせの行き違いを減らせます。\n\n参考: https://www.anthropic.com/engineering/writing-tools-for-agents"},{"id":29,"scenario":"Claude Codeの設定とワークフロー","situation":"あるSaaS企業の開発チームは、Claude Codeでモノレポのコード生成を行っています。GraphQLのスキーマとresolverの規約を.claude/rules/graphql.mdにまとめ、フロントマターにpaths: [\"**/*.{graphql,ts}\"]を指定しました。\n\n規約を適用したいのは、次のファイルだけです。\n\nリポジトリ内のすべての.graphqlファイル\n\n名前が.resolver.tsで終わるファイル\n\n対象のファイルは、packages/billing/src/graphql/やpackages/admin/src/resolvers/のように、各パッケージの深い階層にあります。\n\nところが、GraphQLと関係のない通常のTypeScriptファイルを編集する作業でも、この規約が毎回読み込まれていました。","question":"pathsの指定として正しいものはどれですか。（2つ選択してください。）","choices":[{"text":"paths: [\"**/*.graphql\", \"**/*.ts\"]を指定する。","explanation":"**/*.tsはリポジトリ内のすべてのTypeScriptファイルに一致するため、現在の**/*.{graphql,ts}と同じく、GraphQLと関係のないファイルを編集するときにも規約が読み込まれます。*.resolver.tsのように、ファイル名の末尾まで含めて絞り込む必要があります。"},{"text":"paths: \"**/*.graphql,**/*.resolver.ts\"を指定する。","explanation":"正解。pathsは、YAMLのリストだけでなく、カンマ区切りの文字列でも指定できます。この書き方でも**/*.graphqlと**/*.resolver.tsの2つのパターンとして扱われるため、YAMLのリストで2つを並べた場合と同じ範囲のファイルにだけ規約が読み込まれます。"},{"text":"paths: [\"packages/*/*.graphql\", \"packages/*/*.resolver.ts\"]を指定する。","explanation":"packages/*/の*は1階層分にしか一致しないため、packages/billing/schema.graphqlのようなパッケージ直下のファイルには一致しても、packages/billing/src/graphql/のような深い階層のファイルには一致しません。階層をまたいで一致させるには**を使います。"},{"text":"paths: [\"**/*.graphql\", \"**/*.resolver.ts\"]を指定する。","explanation":"正解。**/*.graphqlはどの階層の.graphqlファイルにも、**/*.resolver.tsはどの階層でも名前が.resolver.tsで終わるファイルにだけ一致します。YAMLのリストとして2つのパターンを並べれば、規約を適用したいファイルの範囲とpathsの範囲が一致します。"}],"answer":[1,3],"overall":"パス固有のルールで、規約を条件付きで読み込むためのpathsの書き方がテーマです。.claude/rules/のファイルは、YAMLフロントマターのpathsに指定したglobパターンに一致するファイルを、ClaudeがRead・Write・Editで扱うときにだけ読み込まれます。公式ドキュメントによると、pathsはYAMLのリストでもカンマ区切りの文字列でも指定でき、{ts,tsx}のような波かっこの展開で複数の拡張子をまとめることもできます。\n\n本問の**/*.{graphql,ts}は、波かっこの展開によって**/*.graphqlと**/*.tsの2つになるため、すべてのTypeScriptファイルに一致していました。これが、関係のない作業でも規約が読み込まれていた原因です。\n\n誤答の見分け方は、各パターンが一致する範囲を、規約の対象と正確に比べられるかどうかです。**/*.tsは広すぎ、packages/*/は深い階層に届きません。\n\n条件付きの読み込みは、範囲が広すぎると無関係なコンテキストとトークンの消費を生み、狭すぎると規約が適用されないため、どちらの方向にもずれないことが重要です。本番では、ルールを変更したら、対象のファイルと対象外のファイルをそれぞれ1つずつ読ませて、読み込まれ方を確かめます。\n\n参考: https://code.claude.com/docs/en/memory"},{"id":30,"scenario":"コンテキスト管理と信頼性","situation":"ある出版社の開発チームは、Claude Codeを使って記事配信システム（CMS）の改修を進めています。ある開発者は、記事の公開からキャッシュの削除までの処理の流れを、1つのセッションで3時間以上かけて調べてきました。セッションの序盤には、「キャッシュ層のコードは別チームの担当なので変更しない」とClaudeに伝えています。\n\nところが後半になると、Claudeに次の変化が現れました。\n\n前半に調べ終えたArticleRepository.tsなどのファイルを、Grepで探し直すようになった\n\nCacheInvalidatorを書き換える修正案まで出すようになった\n\n/contextで確認すると、コンテキストの大半を会話履歴が占めており、その多くはGrepとReadの長い出力でした。CLAUDE.mdはこの間、変更していません。","question":"最も可能性の高い原因はどれですか。","choices":[{"text":"大量のツール出力でコンテキストが埋まり、前半の調査結果や指示を参照しにくくなっている。","explanation":"正解。コンテキストウィンドウが埋まるにつれてClaudeの性能は低下し、以前の指示を忘れたり、誤りが増えたりすることがあります。前半の調査結果を覚えていないかのように同じファイルを探し直す症状と、序盤の指示に反する提案は、どちらもGrepとReadの長い出力でコンテキストが埋まり、前半の内容を参照しにくくなったことで説明できます。"},{"text":"調査対象のファイルが途中で他のメンバーに変更され、Claudeが改めて読み直している。","explanation":"他のメンバーがファイルを変更した場合は、以前の分析が合わなくなり、ファイルを読み直す必要が生じることがあります。しかし、それで説明できるのは探し直しのほうだけで、序盤に伝えた「キャッシュ層のコードは変更しない」という指示に反する提案をする理由にはなりません。2つの症状を同時に説明できるのは、セッション自体の状態です。"},{"text":"自動の圧縮でCLAUDE.mdが失われ、プロジェクトの規約を参照できなくなっている。","explanation":"プロジェクトのルートにあるCLAUDE.mdは、圧縮されたあともディスクから読み直されて、セッションに再び注入されます。圧縮によってCLAUDE.mdが失われることはありません。また、守られなくなった「キャッシュ層のコードは変更しない」という指示は、CLAUDE.mdではなく会話の中で伝えたものなので、CLAUDE.mdの有無では説明できません。"},{"text":"CLAUDE.mdにキャッシュ層の変更を促す古い記述が残り、後半はそれが優先されている。","explanation":"CLAUDE.mdに古い記述が残っていれば、指示と食い違う提案の原因になりえます。しかし、CLAUDE.mdはこの間変更されておらず、セッションの前半ではClaudeはキャッシュ層に手を付けない前提で調査を進めていました。同じ設定のまま後半になってから振る舞いが変わったことは、CLAUDE.mdではなく、セッションの長さに関係する原因を示しています。"}],"answer":[0],"overall":"大規模なコードベースの探索で起きる、コンテキストの劣化を見分ける問題です。ガイドは、長時間のセッションにおけるコンテキストの劣化を、大規模なコードベースを探索するときに管理すべき問題として挙げています。公式ドキュメントも、コンテキストウィンドウにはこれまでのメッセージやツールの結果がすべて入り、トークン数が増えるにつれて正確さや情報を思い出す力が落ちる（context rot）と説明しています。\n\n本問の決め手は、調べ終えたファイルの探し直しと序盤の指示の無視という2つの症状が後半になってから現れたこと、コンテキストの大半を長いツール出力が占めていること、CLAUDE.mdは変更されていないこと、の3つです。これらは、設定や外部の変更ではなく、セッションの長さとツール出力の蓄積が原因であることを示しています。\n\n誤答の見分け方は、2つの症状を同時に、しかも事実と矛盾せずに説明できるかどうかです。圧縮によるCLAUDE.mdの喪失、CLAUDE.mdの古い記述、他のメンバーによる変更は、いずれも事実と合わないか、一方の症状しか説明できません。\n\n本番では、主要な調査結果をスクラッチパッドファイルに記録させ、守らせたい制約はCLAUDE.mdに書き、/compactやサブエージェントへの委任で冗長な出力をメインの会話から外すと、劣化を防げます。\n\n参考: https://platform.claude.com/docs/en/build-with-claude/context-windows"},{"id":31,"scenario":"コンテキスト管理と信頼性","situation":"ある大学の入試課は、編入学の志願者から提出される成績証明書から、科目名・単位数・成績・卒業見込み日を抽出する構造化データ抽出システムを導入しようとしています。2,000件の検証データで測った全体の精度は97%で、目標の95%を上回りました。チームは、確信度0.9以上の抽出について、人間による確認をやめることを検討しています。\n\n提出される成績証明書には、国内の大学のPDF、海外の大学の英文の書類、手書きの補足が入ったスキャン画像など、さまざまな種類があります。","question":"人間による確認を減らす前に行うべきこととして、適切なものはどれですか。（2つ選択してください。）","choices":[{"text":"全体の精度が目標を上回ったので、確信度0.9以上の抽出は一律に確認をやめる。","explanation":"全体の精度97%は、件数の多い国内のPDFの高い精度に引っ張られた数字である可能性があります。全体の精度は、特定の文書の種類やフィールドでの低い精度を覆い隠すことがあるため、この数字だけで確認をやめると、精度の低い区分の誤りがそのまま登録されます。"},{"text":"文書の種類（国内・海外・手書きの補足あり）とフィールドごとに、精度を分けて測る。","explanation":"正解。ガイドは、確信度の高い抽出を自動化する前に、文書の種類およびフィールドのセグメントごとに精度を検証することの重要性を挙げています。国内・海外・手書きの補足ありといった文書の種類と、単位数や卒業見込み日のようなフィールドごとに精度を測れば、全体の数字に隠れた弱い区分を見つけられます。"},{"text":"検証データから無作為に50件を選んで再確認し、95%以上なら全体の確認をやめる。","explanation":"50件の無作為な再確認では、件数の少ない区分（たとえば手書きの補足がある書類）はほとんど含まれず、その区分の精度は分かりません。全体を一つの集団として扱っている点で、全体の精度だけを見る方法と同じ弱点があります。"},{"text":"目標の95%を満たした区分だけで人間による確認を減らし、他の区分では確認を続ける。","explanation":"正解。区分ごとに測った精度のうち、目標の95%を満たしている区分だけで人間による確認を減らし、満たしていない区分では確認を続ければ、自動化の利点を得つつ、精度の低い区分の誤りがそのまま登録されるのを防げます。ガイドも、すべてのセグメントで一貫したパフォーマンスが得られていることを確かめてから、人間によるレビューを減らすよう求めています。"}],"answer":[1,3],"overall":"人間によるレビューを減らす前の、セグメント別の精度の検証がテーマです。ガイドは、全体の精度（たとえば全体で97%という数字）が、特定の文書の種類やフィールドにおける低いパフォーマンスを覆い隠す可能性があるというリスクと、確信度の高い抽出を自動化する前に、文書の種類およびフィールドのセグメントごとに精度を検証することの重要性を挙げています。\n\n本問の成績証明書は、国内のPDF、海外の英文の書類、手書きの補足入りのスキャンと、性質の違う文書が混在しており、全体の97%という数字が、どの区分でも同じように成り立つとは限りません。正解の2つは、区分ごとに精度を測ることと、目標を満たした区分だけで確認を減らすことで、測定と判断の2段階に対応しています。\n\n誤答の見分け方は、全体の数字だけで判断していないかどうかです。全体の精度で一律に確認をやめる案も、少数の無作為な再確認も、区分ごとの違いを見ていません。\n\n本番では、確認をやめた区分についても、層化無作為抽出で一定数を継続して確認し、新しい誤りのパターンを検出できるようにします。\n\n参考: https://platform.claude.com/docs/en/test-and-evaluate/develop-tests"},{"id":32,"scenario":"プロンプトエンジニアリングと構造化出力","situation":"ある消費財メーカーの開発チームは、プルリクエストをClaude Codeでレビューし、指摘をJSONで出力させるCIジョブを運用しています。出力は検証スクリプトで確認し、次の場合は失敗とみなします。\n\nJSONとして読めない\n\n指摘の行番号がPRの差分の範囲外にある\n\n失敗したときは、「前回の出力は不正でした。やり直してください」と指示して、最大5回まで再実行しています。\n\n直近1か月では実行の23%が検証に失敗しており、その内訳は、JSONの構文エラーが60%、差分の範囲外の行番号が40%でした。5回の再実行でも失敗するケースが続いています。","question":"検証とリトライの仕組みとして適切な改善はどれですか。（2つ選択してください。）","choices":[{"text":"リトライのたびに新しい実行を始め、「前回は失敗しました」とだけ伝えて同じ差分を渡す。","explanation":"新しい実行で「失敗した」とだけ伝えても、失敗した出力も具体的なエラーも渡していないため、Claudeはどこを直せばよいか判断できません。前回と同じ差分から同じ誤りを再現する可能性が高く、リトライの効果はほとんど得られません。"},{"text":"失敗した出力と元の差分をリトライに含め、どの指摘のどの値がなぜ不正かを具体的に示す。","explanation":"正解。検証エラーを添えたリトライでは、元の入力、失敗した出力、具体的な検証エラーを後続のリクエストに含めて、モデルの自己修正を導きます。「指摘3の行番号214は、差分の変更範囲（180〜205行）の外にある」のように具体的に示せば、Claudeは差分と照らし合わせて該当箇所だけを直せます。"},{"text":"リトライの上限を5回から10回に増やし、成功するまで同じ指示で実行させる。","explanation":"リトライの回数を増やすと、偶然に形式が整った出力が得られる確率は上がります。しかし、何が誤っていたかをClaudeに伝えていないため、同じ誤りを繰り返しやすく、実行時間とコストが増えるだけで、根本的な改善にはなりません。"},{"text":"--json-schemaで出力のスキーマを固定し、JSONの構文エラーをなくす。","explanation":"正解。claude -pで--output-format jsonと--json-schemaを併用すると、出力は指定したJSONスキーマに沿った構造化データとしてstructured_outputに返されます。スキーマに沿った構造化出力にすればJSONの構文エラーはなくなり、リトライが必要なのは、行番号の誤りのような意味的なエラーに絞られます。"}],"answer":[1,3],"overall":"生成結果の品質を高める、検証とリトライのループの設計がテーマです。ガイドは、リトライ時に具体的な検証エラーをプロンプトに追加してモデルを修正へ導く、検証エラーを添えたリトライを知識として挙げています。また、スキーマに沿った構造化出力はJSONの構文エラーを排除しますが、値の誤りや配置の誤りといった意味的なエラーは防げないため、意味的な検証は別に必要です。\n\n本問の失敗は、JSONの構文エラーと、差分の範囲外の行番号という意味的なエラーの2種類です。前者は出力の形式を固定する仕組みで発生自体をなくし、後者は失敗した出力と具体的なエラーを添えたリトライで直す、という役割分担が正解の組み合わせです。\n\n誤答の見分け方は、リトライでClaudeに新しい情報を渡しているかどうかです。回数を増やす案も、「失敗した」とだけ伝える案も、何をどう直すべきかを伝えていません。\n\n本番では、エラーの種類ごとにリトライの成功率を記録し、リトライでは直らない誤りを早めに見分けます。\n\n参考: https://code.claude.com/docs/en/headless"},{"id":33,"scenario":"ツール設計とMCP統合","situation":"ある海運会社は、コンテナ輸送の問い合わせに対応するカスタマーサポート解決エージェントを構築しています。MCPツールlookup_bookingは、予約番号の形式が誤っている場合や予約が取り消し済みの場合に例外を送出し、MCPサーバーはそれをJSON-RPCのエラーレスポンスとして返しています。\n\nログを確認すると、こうしたケースの72%で、エージェントは「システム障害のため確認できません」と回答して会話を終えていました。予約番号を聞き直したり、取り消し済みであることを顧客に伝えたりできたケースはほとんどありません。","question":"lookup_bookingの失敗の返し方として、最も適切なものはどれですか。","choices":[{"text":"例外を送出する前にサーバー内で3回リトライし、それでも失敗した場合だけエラーを返す。","explanation":"サーバー内でのリトライは、タイムアウトなどの一時的なエラーを局所的に解消したい場合には有効です。しかし、番号の形式の誤りや取り消し済みの予約は何度呼び直しても結果が変わらないため、待ち時間が延びるだけで、エージェントに失敗の理由が伝わらない問題は残ります。"},{"text":"失敗をツールの結果としてisError: trueで返し、contentに失敗の理由と次に取れる対応を書く。","explanation":"正解。MCPの仕様では、入力の検証エラーや業務ロジック上のエラーは、ツールの結果の中でisErrorをtrueにして報告し、言語モデルが内容を読んで自己修正できるようにすることが求められています。失敗の理由（番号の形式が誤っている、取り消し済みである）と次に取れる対応を書けば、エージェントは番号を聞き直したり、取り消し済みであることを伝えたりできます。"},{"text":"失敗時もisErrorはfalseのままにし、contentに「エラー: 予約番号が無効です」と書いて返す。","explanation":"失敗をisErrorがfalseの通常の結果として返すと、エージェントは失敗した呼び出しを成功とみなして処理を進めるおそれがあります。本文に「エラー」と書いても、成功か失敗かを示すフラグと内容が食い違い、エージェントが状況を正しく判断する手がかりになりません。"},{"text":"JSON-RPCのエラーレスポンスのまま、messageに失敗の理由を詳しく書いて返す。","explanation":"JSON-RPCのエラーレスポンスは、存在しないツールの呼び出しや不正な形式のリクエストなど、プロトコルレベルの問題を伝えるためのものです。仕様上、クライアントはプロトコルエラーをモデルに渡さなくてもよく、渡しても復旧につながりにくいとされています。messageを詳しくしても、エージェントに届く保証はありません。"}],"answer":[1],"overall":"MCPツールの失敗をエージェントに伝える、isErrorフラグのパターンがテーマです。MCPの仕様はエラーを2種類に分けています。存在しないツールや不正な形式のリクエストのようなプロトコルエラーはJSON-RPCのエラーとして返し、APIの失敗、入力の検証エラー、業務ロジックのエラーのようなツール実行エラーは、結果の中でisErrorをtrueにして報告します。後者には、モデルが自己修正して呼び直すための具体的な情報を含め、クライアントはそれをモデルに渡すべきだとされています。\n\n本問のエージェントが「システム障害」と答えて終わっていたのは、業務上の失敗がプロトコルエラーとして返され、理由がエージェントに届いていなかったためです。\n\n誤答の見分け方は、失敗であることと失敗の理由の両方が、エージェントの読める形で届くかどうかです。isErrorがfalseのままでは失敗であることが伝わらず、JSON-RPCのエラーでは理由が届く保証がなく、一律のリトライは理由を伝えません。\n\n本番では、失敗の理由ごとに顧客へどう案内するかを、エラーメッセージの文面とあわせて設計しておくと、初回解決率の改善につながります。\n\n参考: https://modelcontextprotocol.io/specification/2026-07-28/server/tools"},{"id":34,"scenario":"Claude Codeの設定とワークフロー","situation":"ある損害保険会社の開発チームは、Claude Codeで保険金請求システムを開発しています。Aさんは、請求データの検証手順をまとめた/claim-validateというカスタムスラッシュコマンドを作り、チームの全員に使ってもらうつもりでした。\n\nAさんの環境ではこのコマンドを使えますが、他の5名がリポジトリを最新の状態にしても、コマンドの一覧に/claim-validateが表示されません。リポジトリの.claude/ディレクトリにはsettings.jsonだけがあり、commands/やskills/はありません。","question":"最も可能性の高い原因と対処はどれですか。","choices":[{"text":"コマンドが個人用の場所にあるため、.claude/commands/に移してコミットする。","explanation":"正解。~/.claude/commands/にあるコマンドは、そのユーザーだけが使える個人用のコマンドで、バージョン管理を通じて共有されません。リポジトリの.claude/にコマンドがないことから、Aさんのファイルは個人用の場所にあると分かります。.claude/commands/に移してコミットすれば、リポジトリを取得した全員が使えるようになります。"},{"text":"他のメンバーのClaude Codeのバージョンが古いため、全員がアップデートする。","explanation":"バージョンの違いで一部の機能が使えないことはありますが、カスタムスラッシュコマンドは以前からある基本的な機能です。リポジトリの.claude/にコマンドのファイルが存在しないことのほうが、症状を直接説明しています。"},{"text":"コマンドのファイルにフロントマターがないため、descriptionを追加してから読み込み直す。","explanation":"コマンドやスキルのフロントマターは任意で、descriptionがなくてもファイルは読み込まれます。また、ファイル自体がリポジトリにないため、フロントマターを追加しても、他のメンバーの環境には届きません。"},{"text":"コマンドの名前が既存のスキルと重複しているため、別の名前にして作り直す。","explanation":"名前が重複している場合は、どちらの定義が使われるかが問題になりますが、Aさんの環境では正しく動いており、他のメンバーの環境ではコマンド自体が一覧に現れていません。名前の重複では、この症状を説明できません。"}],"answer":[0],"overall":"カスタムスラッシュコマンドのスコープの違いを、症状から診断する問題です。ガイドは、.claude/commands/内のプロジェクトスコープのコマンド（バージョン管理を通じて共有）と、~/.claude/commands/内のユーザースコープのコマンド（個人用）の違いを知識として挙げています。現在のClaude Codeではカスタムコマンドはスキルに統合されていますが、.claude/commands/のファイルは引き続き使え、置く場所によって誰が使えるかが決まる点も同じです。\n\n本問の決め手は、Aさんの環境では動くこと、他のメンバーの環境では一覧にも現れないこと、そしてリポジトリの.claude/にcommands/がないことの3つです。これらは、コマンドが個人用の場所にあり、リポジトリに含まれていないことを示しています。\n\n誤答の見分け方は、症状をすべて説明できる原因かどうかです。名前の重複、バージョン、フロントマターは、リポジトリにファイルが存在しないという事実を説明できません。\n\n本番では、チームで使うコマンドやスキルを作ったら、別のメンバーの環境で一覧に表示されるかを確かめてから案内すると、同じ行き違いを防げます。\n\n参考: https://code.claude.com/docs/en/skills"},{"id":35,"scenario":"エージェントアーキテクチャとオーケストレーション","situation":"ある農業資材の通販会社は、肥料や農機部品の注文に関する問い合わせに対応するカスタマーサポート解決エージェントを運用しています。問い合わせの約21%には、「先週の肥料がまだ届かない。請求も二重になっている気がする。あと、注文したトラクターの部品が自分の機種に合うか知りたい」のように、複数の用件が含まれています。\n\nログによると、こうした問い合わせでは、エージェントが最初の用件だけを解決して会話を終えることが多く、顧客からの再問い合わせが相次いでいます。初回解決率は61%で、目標の80%を大きく下回っています。","question":"最も効果的な改善策はどれですか。","choices":[{"text":"用件を1つずつ順番に処理し、用件ごとに新しい会話を開始してget_customerから本人確認をやり直す。","explanation":"用件を順番に処理すること自体は可能ですが、用件ごとに新しい会話を開始すると、確認済みの顧客情報や注文の一覧を毎回取得し直すことになり、時間がかかります。また、請求と配送のように関連する用件を一緒に見られず、食い違った説明をするおそれもあります。"},{"text":"問い合わせを個別の用件に分解し、確認済みの顧客情報を共有して各用件を並列に調べ、1つの回答にまとめる。","explanation":"正解。ガイドは、複数の用件を含む顧客リクエストを個別の項目に分解し、共有コンテキストを使ってそれぞれを並列に調査したうえで、統一された解決策にまとめることを挙げています。確認済みの顧客IDや注文の一覧を共有すれば、配送・請求・適合確認を同時に調べられ、関連する事実を踏まえた1つの回答で、すべての用件に応えられます。"},{"text":"複数の用件を含む問い合わせには、用件ごとに別の問い合わせとして送り直すよう顧客に依頼する。","explanation":"用件ごとの送り直しを求めると、システム側の処理は単純になりますが、手間を顧客に転嫁することになります。顧客体験が悪化するうえ、送り直された問い合わせでも同じ本人確認が繰り返され、初回解決率の改善にもつながりません。"},{"text":"複数の用件を含む問い合わせを検出したら、内容を確認せずに人間の担当者へエスカレーションする。","explanation":"人間の担当者へのエスカレーションは、ポリシーの例外や、解決に向けて進展しない状況などで行うべきものです。用件が複数あるというだけで一律に転送すると、エージェントが対応できる範囲の案件まで人に回り、初回解決率はかえって下がります。"}],"answer":[1],"overall":"複数の用件を含む問い合わせを扱うワークフローの設計がテーマです。ガイドは、複数の用件を含む顧客リクエストを個別の項目に分解し、共有コンテキストを使ってそれぞれを並列に調査したうえで、統一された解決策にまとめることをスキルとして挙げています。これは、独立したサブタスクを同時に処理してから結果を集約する、並列化のワークフローの考え方です。\n\n本問では、エージェントが最初の用件だけで会話を終えてしまい、残りの用件のために顧客が再び問い合わせていました。決め手は「最初の用件だけを解決して終える」という症状と、初回解決率という指標です。用件を分けて調べ、1つの回答にまとめれば、1回のやり取りですべての用件を解決できます。\n\n誤答の見分け方は、手間や判断を顧客や人間の担当者に押し付けていないか、確認済みの情報を使い回せているかです。\n\n本番では、回答の最後に用件ごとの結果を並べて示し、対応漏れがないかを顧客と一緒に確認できるようにします。\n\n参考: https://www.anthropic.com/engineering/building-effective-agents"},{"id":36,"scenario":"エージェントアーキテクチャとオーケストレーション","situation":"ある自動車部品メーカーの技術調査チームは、Claude Agent SDKでマルチエージェントリサーチシステムを構築しています。コーディネーターは、ウェブ検索、文書分析、統合、レポート生成の4つのサブエージェントに作業を委任します。コーディネーターのプロンプトには「すべての質問で、4つのサブエージェントを順番に呼び出すこと」と書かれています。\n\n利用状況を調べたところ、次のことが分かりました。\n\n質問の約6割は「ある規格の発効日」のような単一の事実確認だが、こうした質問でも4つのサブエージェントをすべて通るため、回答までに平均4分、1件あたり0.9ドルかかっている\n\n文書分析サブエージェントは、添付文書のない質問でも毎回起動され、「分析対象なし」と返している","question":"コーディネーターの設計として適切な変更はどれですか。（2つ選択してください。）","choices":[{"text":"4つのサブエージェントを順番に呼ぶのをやめ、毎回4つとも並列に起動する。","explanation":"並列に起動すれば待ち時間は短くなりますが、不要なサブエージェントも毎回起動するため、コストは減らず、文書分析が「分析対象なし」を返す無駄も残ります。本問の問題は呼び出しの順番ではなく、呼び出す範囲が質問の内容に合っていないことです。"},{"text":"コーディネーターの前段に過去の質問で学習させた分類モデルを置き、呼び出すサブエージェントを予測させる。","explanation":"過去のデータで学習させた分類モデルは、プロンプトの改善では対応しきれない規模の振り分けが必要になった段階で検討する手段です。今回の原因は「必ず4つ呼ぶ」というプロンプトの指示であり、ラベル付きデータと機械学習の運用を追加するのは、問題に見合わない過剰な設計です。"},{"text":"各サブエージェントの説明に、担当する作業と、どのような質問のときに呼び出すべきかを明記する。","explanation":"正解。Agent SDKでは、サブエージェントの説明（AgentDefinitionのdescription）を手がかりに、Claudeがどのサブエージェントを呼び出すかを判断します。担当する作業と呼び出すべき条件を説明に書いておくと、コーディネーターが質問ごとに必要なサブエージェントを選びやすくなります。"},{"text":"固定の呼び出し順の指示をやめ、質問の要件を分析して必要なサブエージェントだけを呼び出させる。","explanation":"正解。ガイドは、常にパイプライン全体を経由させるのではなく、クエリの要件を分析して呼び出すサブエージェントを動的に選ぶコーディネーターを設計するよう求めています。単一の事実確認なら検索だけで答え、添付文書がなければ文書分析を呼ばない、という判断をコーディネーターに任せれば、無駄な起動と待ち時間がなくなります。"}],"answer":[2,3],"overall":"コーディネーター・サブエージェントパターンで、呼び出すサブエージェントを動的に選ぶ設計がテーマです。コーディネーターの役割には、タスクの分解と委任、結果の集約に加えて、クエリの複雑さに基づいてどのサブエージェントを呼ぶかの判断が含まれます。Anthropicのマルチエージェントリサーチシステムでも、単純な事実確認は1つのエージェントと少数のツール呼び出しで済ませ、比較や複雑な調査ほど多くのサブエージェントを使うように、作業量を質問の複雑さに合わせています。\n\n本問では「すべての質問で4つを順番に呼ぶ」という固定の指示が、単純な質問のコストと待ち時間を押し上げていました。正解は、固定の指示をやめて判断をコーディネーターに任せることと、その判断の材料になるサブエージェントの説明を整えることの組み合わせです。\n\n誤答の見分け方は、原因である固定の呼び出し方に手を付けているかどうかです。分類モデルは過剰な設計で、4つすべての並列起動は呼び出す範囲を変えません。\n\n本番では、質問の種類ごとに起動したサブエージェントの数とコストを記録し、振り分けが意図どおりかを確認します。\n\n参考: https://www.anthropic.com/engineering/multi-agent-research-system"},{"id":37,"scenario":"プロンプトエンジニアリングと構造化出力","situation":"ある大学の学生支援課は、奨学金の申請書類から申請区分・世帯年収・在籍状況を抽出する構造化データ抽出システムを運用しています。抽出ツールのJSONスキーマでは、申請区分を\"給付型\"・\"貸与型\"・\"授業料減免\"の3つの値を持つenumとして定義しています。\n\n今年度から、留学支援や災害特例のような新しい区分の申請が届くようになりました。抽出結果を監査すると、こうした申請の多くが\"授業料減免\"に分類されており、全体の約9%が誤った区分のまま下流の審査システムに登録されていました。\n\n新しい区分は、今後も年に数種類ずつ増える見込みです。","question":"スキーマの設計と運用として適切な変更はどれですか。（2つ選択してください。）","choices":[{"text":"enumに\"other\"を追加し、内容を記録する詳細の文字列フィールドを設ける。","explanation":"正解。ガイドは、拡張可能なカテゴリのために、enumに\"other\"と詳細を入れる文字列フィールドを組み合わせる設計を挙げています。既存の3区分は決まった値のまま扱い、どれにも当てはまらな
