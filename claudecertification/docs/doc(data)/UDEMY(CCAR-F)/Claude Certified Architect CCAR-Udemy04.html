<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Claude Certified Architect CCAR-F 練習テスト 4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --paper:#FFFFFF; --soft:#F4F6FC;
  --ink:#000000; --ink2:#222222; --line:#8F8F8F; --line2:#4D4D4D;
  --accent:#2D4FD6; --on-accent:#FFFFFF; --sel:#E8EDFF;
  --ok:#0B6C8A; --ok-bg:#E1F1F6; --ng:#B4432B; --ng-bg:#FBE9E4;
  --sans:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  --serif:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --code:#ECECEC;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 76px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.8;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
code{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:.88em;background:var(--code);border-radius:5px;padding:.1em .4em;overflow-wrap:anywhere}

.shell{display:grid;grid-template-columns:292px minmax(0,1fr);gap:36px;max-width:1120px;margin:0 auto;padding:28px 20px 72px}
.side{align-self:start;position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);max-height:calc(100vh - 32px - env(safe-area-inset-top,0px));overflow:auto;padding-right:2px}
.side h1{font-family:var(--serif);font-weight:700;font-size:23px;line-height:1.45;margin:0 0 4px;letter-spacing:.02em}
.side .code{margin:0 0 10px;font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--accent)}
.side .sub{margin:0 0 18px;color:var(--ink2);font-size:13px}
.score{margin:0 0 8px;font-size:14px;font-variant-numeric:tabular-nums}
.score b{font-weight:700}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-bottom:18px}
.bar i{display:block;height:100%;background:var(--accent);width:0}
.grp{margin:0 0 18px}
.grp-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13.5px;font-weight:700;line-height:1.5}
.grp-h span:last-child{font-weight:400;color:var(--ink2);font-size:12.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:8px;margin-top:8px}
.dot{width:36px;height:36px;border-radius:50%;border:2px solid var(--line2);background:var(--paper);color:var(--ink);font-size:12.5px;font-weight:500;font-variant-numeric:tabular-nums;cursor:pointer;display:grid;place-items:center;padding:0;line-height:1}
.dot[data-s="ok"]{border-color:var(--ok);color:var(--ok);background:var(--ok-bg);font-weight:700}
.dot[data-s="ng"]{border-color:var(--ng);color:var(--ng);background:var(--ng-bg);font-weight:700;border-radius:10px}
.dot[data-s="sel"]{background:var(--sel);border-color:var(--accent);color:var(--accent);font-weight:700}
.dot[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.legend{margin:6px 0 16px;font-size:12px;color:var(--ink2);line-height:1.7}
.sidebtns{display:flex;flex-direction:column;gap:8px}
.drawer-close{display:none}

.btn{border:1.5px solid var(--line2);background:var(--paper);color:var(--ink);padding:10px 18px;border-radius:10px;cursor:pointer;font-weight:500;font-size:15px;min-height:44px;transition:background .15s,border-color .15s}
.btn:hover:not(:disabled){background:var(--sel);border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.btn.primary:hover:not(:disabled){filter:brightness(1.08);background:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.small{min-height:40px;padding:8px 14px;font-size:14px}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:16px}
.topbar .pos{font-family:var(--serif);font-weight:700;font-size:19px;margin-right:auto;font-variant-numeric:tabular-nums;white-space:nowrap}
.menu-btn{display:none}

.sheet{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:30px 32px 32px}
.qhead{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px 12px;margin-bottom:18px}
.qno{font-family:var(--serif);font-weight:700;font-size:26px;letter-spacing:.02em}
.qtotal{color:var(--ink2);font-size:14px;font-variant-numeric:tabular-nums}
.scn{font-size:12.5px;color:var(--ink2);border:1px solid var(--line2);border-radius:6px;padding:0 8px;line-height:1.7}
.tag{font-size:13px;font-weight:700;border:1.5px solid var(--accent);color:var(--accent);padding:1px 10px;border-radius:999px;line-height:1.7}
.stem p,.overall p,.why p,.banner p{margin:0 0 .8em;overflow-wrap:anywhere}
.prompt{font-family:var(--serif);font-weight:700;font-size:19.5px;line-height:1.75;margin:18px 0 20px}
.prompt p{margin:0}

.banner{border-left:4px solid var(--line2);padding:6px 16px 2px;margin:0 0 20px;scroll-margin-top:calc(env(safe-area-inset-top,0px) + 80px)}
.banner:focus{outline:none}
.banner h2{font-family:var(--serif);font-size:19px;margin:0 0 2px;line-height:1.5}
.banner.ok{border-color:var(--ok)}.banner.ok h2{color:var(--ok)}
.banner.ng{border-color:var(--ng)}.banner.ng h2{color:var(--ng)}

ol.opts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.choice{display:grid;grid-template-columns:36px minmax(0,1fr);column-gap:14px;align-items:start;width:100%;text-align:left;padding:14px 16px;border:2px solid var(--line);border-radius:12px;background:var(--paper);cursor:pointer;transition:background .15s,border-color .15s}
.choice:hover:not([aria-disabled="true"]){background:var(--sel);border-color:var(--accent)}
.choice[aria-disabled="true"]{cursor:default}
.mark{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center;font-family:var(--serif);font-weight:700;font-size:15px;background:var(--paper);margin-top:1px}
.multi .mark{border-radius:9px}
.choice.on{border-color:var(--accent);background:var(--sel)}
.choice.on .mark{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.choice .txt{font-size:16px;line-height:1.75;padding-top:3px;overflow-wrap:anywhere}
.meta{grid-column:2;display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:8px}
.pill{font-size:12.5px;font-weight:500;line-height:1.7}
.pill.ok{color:var(--ok)}.pill.ng{color:var(--ng)}.pill.me{color:var(--ink2)}
.opt.ok .choice{border-color:var(--ok);background:var(--ok-bg)}
.opt.ok .mark{border-color:var(--ok);background:var(--ok);color:var(--paper)}
.opt.ng.picked .choice{border-color:var(--ng);background:var(--ng-bg)}
.opt.ng.picked .mark{border-color:var(--ng);background:var(--ng);color:var(--paper)}
.why{margin:8px 0 0 50px;padding:10px 16px 4px;border-left:3px solid var(--line2);background:var(--soft);border-radius:0 8px 8px 0;font-size:14.5px;line-height:1.9}
.why h3{margin:0 0 4px;font-size:13px;font-weight:700;color:var(--ink2)}
.hint{margin:14px 0 0;font-size:14px;color:var(--ink2);min-height:1.8em}

.overall{margin-top:30px;padding-top:22px;border-top:1.5px solid var(--line)}
.overall h2{font-family:var(--serif);font-size:19px;margin:0 0 10px}
.overall a{color:var(--accent);word-break:break-all}
.actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;margin-top:28px}
.actions .grow{display:flex;gap:10px;flex-wrap:wrap}
.actions.pair .btn{flex:1}

.result h2{font-family:var(--serif);font-size:25px;margin:0 0 8px;line-height:1.5}
.result .lead{font-size:16px;margin:0 0 18px;color:var(--ink2)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin:0 0 6px}
.stat{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--soft)}
.stat b{display:block;font-family:var(--serif);font-size:28px;line-height:1.3;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--ink2)}
.stat.ok b{color:var(--ok)}.stat.ng b{color:var(--ng)}
.result h3{font-family:var(--serif);font-size:18px;margin:28px 0 10px;padding-bottom:6px;border-bottom:1.5px solid var(--line)}
.witem{border-left:4px solid var(--ng);background:var(--soft);border-radius:0 10px 10px 0;padding:12px 16px 6px;margin:0 0 14px}
.witem .wh{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.chip{border:1.5px solid var(--ng);color:var(--ng);background:var(--paper);border-radius:10px;padding:4px 12px;cursor:pointer;font-weight:700;font-size:14px;min-height:36px}
.chip:hover{background:var(--ng-bg)}
.witem .q{font-family:var(--serif);font-weight:700;margin:8px 0}
.witem .q p{margin:0}
.witem .row{margin:8px 0;font-size:15px}
.witem .lab{display:block;font-size:12.5px;font-weight:700;margin-bottom:2px}
.witem .mine .lab{color:var(--ng)}.witem .corr .lab{color:var(--ok)}
.witem .row div{overflow-wrap:anywhere}
.backdrop{display:none}

@media (max-width:760px){
  .shell{grid-template-columns:minmax(0,1fr);gap:0;padding:12px 12px 56px}
  .side{position:fixed;z-index:80;top:0;bottom:0;left:0;width:min(88vw,330px);max-height:none;background:var(--bg);padding:calc(18px + env(safe-area-inset-top,0px)) 18px calc(24px + env(safe-area-inset-bottom,0px));border-right:1px solid var(--line);transform:translateX(-104%);transition:transform .22s;overflow:auto}
  .side.open{transform:none}
  .backdrop.show{display:block;position:fixed;inset:0;z-index:70;background:rgba(10,15,30,.5)}
  .drawer-close{display:inline-block;margin-bottom:12px}
  .menu-btn{display:inline-block}
  .topbar{padding:8px 10px}
  .topbar .pos{font-size:17px}
  .topbar .btn{padding:8px 11px;font-size:14px;min-height:40px}
  .sheet{padding:22px 18px 24px}
  .why{margin-left:0}
  .qno{font-size:23px}
  .prompt{font-size:18px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

<div class="shell">
  <aside class="side" id="side" aria-label="進捗と問題一覧"></aside>

  </div>
</div>

<script id="data" type="application/json">[{"id":1,"scenario":"Claude Codeの設定とワークフロー","situation":"ある航空機整備会社の開発チームは、CIパイプラインでClaude Codeを使い、プルリクエストごとに整備記録モジュールのユニットテストを生成しています。テストの書き方の規約と、tests/fixtures/にある整備記録のフィクスチャの使い方は、リポジトリのルートのCLAUDE.mdに書いてコミットしています。\n\n先週、CIジョブのコマンドをclaude -pからclaude --bare -p --output-format jsonに変更し、同じ週にCLAUDE.mdへ規約を3項目追記しました。それ以降、生成されるテストはフィクスチャを使わず、整備記録のデータを毎回一から組み立てるようになりました。","question":"最も可能性の高い根本原因はどれですか。","choices":[{"text":"CLAUDE.mdに規約を追記したことで、フィクスチャの使い方の記述が埋もれている。","explanation":"CLAUDE.mdが長くなると指示が守られにくくなることは、実際にあります。しかし追記は3項目で、それまで守られていたフィクスチャの使い方が、すべてのテストで一斉に無視されるほどの変化ではありません。同じ週のコマンドの変更のほうが、「まったく使われなくなった」という症状をそのまま説明できます。"},{"text":"--output-format jsonの指定により、出力形式の指示がCLAUDE.mdの規約より優先されている。","explanation":"--output-format jsonは、結果をセッションIDやコストなどのメタデータと一緒にJSONで受け取るための指定で、スクリプトから結果を解析する場面で使います。変わるのは応答の返し方だけで、Claudeが読み込む指示やテストの書き方には影響しません。CLAUDE.mdの規約が上書きされることもありません。"},{"text":"非対話モードでは、tests/fixtures/のファイルを読む権限が承認されないまま実行されている。","explanation":"権限の設定は、CIでBashのコマンドやファイルの書き込みを事前に許可する際に重要です。しかし作業ディレクトリ内のファイルの読み取りは、通常は承認なしで行えます。また、変更前も同じ非対話モードでフィクスチャが使われていたので、非対話モードであること自体は原因になりません。"},{"text":"--bareを付けたことで、CLAUDE.mdが自動では読み込まれなくなっている。","explanation":"正解。--bareは、フック・スキル・MCPサーバー・CLAUDE.mdなどの自動検出を省いて起動を速くするモードで、どのマシンでも同じ結果を得たいCIやスクリプトに勧められています。\n\nその代わり、リポジトリにコミットしたCLAUDE.mdも読み込まれないため、テストの規約とフィクスチャの使い方がClaudeに届きません。--bareを使い続けるなら、規約を--append-system-prompt-fileで明示的に渡します。"}],"answer":[3],"overall":"公式ガイド（タスクステートメント3.6）は、CIで動くClaude Codeにテスト標準、フィクスチャの規約、レビュー基準といったプロジェクトのコンテキストを伝える仕組みとしてCLAUDE.mdを挙げています。\n\nただしこの仕組みは、CLAUDE.mdが実際に読み込まれていることが前提です。Claude Codeのドキュメントによると、--bareを付けるとCLAUDE.mdを含む自動検出が行われず、必要なコンテキストは--append-system-prompt-fileなどのフラグで渡す必要があります。\n\n本問では、同じ週に3つの変更が重なっています。症状が「一部の規約が守られにくい」ではなく「フィクスチャがまったく使われない」であることから、規約全体が届かなくなる変更、つまり--bareの追加に絞り込めます。\n\n出力形式の指定と非対話モードは、指示の読み込みに関係しません。\n\n本番では、CIのコマンドを変えたら、規約に沿ったテストが生成されるかを数件のプルリクエストで確かめてから全体に適用します。\n\n参考: https://code.claude.com/docs/en/headless"},{"id":2,"scenario":"エージェントアーキテクチャとオーケストレーション","situation":"ある人材紹介会社の開発チームは、Claude Agent SDKでカスタマーサポート解決エージェントを構築しています。エージェントは、求職者からの問い合わせに答えるため、MCPツールget_candidateで登録情報を取得します。ただし、このツールの結果には、個人番号（マイナンバー）と給与振込口座の番号も含まれています。\n\n社内規程では、これらの項目をモデルに渡すことを禁止しています。現在はシステムプロンプトで「個人番号と口座番号は回答に含めないこと」と指示していますが、監査で、モデルへの入力にこれらの項目が含まれていることが問題視されました。","question":"モデルがこれらの項目を受け取らないようにする方法として適切なものはどれですか。（2つ選択してください。）","choices":[{"text":"PostToolUseフックでget_candidateの結果から個人番号と口座番号を除き、updatedToolOutputで置き換える。","explanation":"正解。PostToolUseフックはツールの実行後、モデルが結果を処理する前に動くため、結果を変換してから渡せます。updatedToolOutputで置き換えた結果だけが会話に入るので、禁止項目がモデルの入力に含まれることはありません。プロンプトの指示と違い、コードで毎回確実に実行されます。"},{"text":"PreToolUseフックでget_candidateの呼び出しをすべて拒否し、登録情報は担当者が確認してから回答する運用にする。","explanation":"PreToolUseフックによる拒否は、実行させてはならないツール呼び出しを確実に止める手段です。しかし本問で問題なのは一部の項目だけで、氏名や応募状況などの登録情報はエージェントが問い合わせに答えるために必要です。呼び出し自体を止めると、エージェントは大半の問い合わせを自力で解決できなくなります。"},{"text":"システムプロンプトの指示を強調表現で書き直し、個人番号を回答に含めた悪い例と正しい例をfew-shotで示す。","explanation":"強調やfew-shotの例は、回答の書き方を安定させたい場面では有効な手段です。しかし監査で問題になったのは「回答に出るか」ではなく「モデルが受け取っているか」であり、プロンプトをどう書いてもツール結果に含まれる項目はモデルに渡ってしまいます。また、プロンプトによる遵守は確率的で、漏れをゼロにはできません。"},{"text":"MCPサーバー側のget_candidateの応答を変更し、個人番号と口座番号をエージェント向けの結果に含めない。","explanation":"正解。エージェントが使うツールの応答から禁止項目を最初から外せば、モデルに渡る経路そのものがなくなります。ツールが返す項目を利用者の用途に合わせて絞るのは、ツール設計として自然な対処で、トークンの節約にもつながります。フックでの除去と組み合わせれば、多層的な防御になります。"}],"answer":[0,3],"overall":"ツールの結果は、モデルが処理する前にフックでインターセプトして変換できます（タスクステートメント1.5）。Agent SDKのPostToolUseフックは、ツールの実行結果が返った時点で動き、updatedToolOutputを返すとClaudeが見る前にツールの出力を置き換えられます。公式ドキュメントも、フックの用途として入力や出力を変換してデータを無害化することを挙げています。\n\n本問の要件は「回答に出さない」ではなく「モデルに渡さない」ことなので、ツール結果そのものを変える手段が必要です。そのため、フックで置き換える方法と、MCPサーバーの応答から項目を外す方法の2つが正解になります。\n\n見分け方の決め手は、監査の指摘が「入力に含まれていること」だった点です。プロンプトの強化は出力の制御にとどまり、しかも確率的です。呼び出しの全面拒否は禁止項目以外の必要な情報まで失います。\n\n本番では、フックのmatcherをmcp__{サーバー名}__get_candidateのように対象ツールに絞り、他のツールの結果に影響を与えないようにします。\n\n参考: https://code.claude.com/docs/en/agent-sdk/hooks"},{"id":3,"scenario":"プロンプトエンジニアリングと構造化出力","situation":"ある自動車部品メーカーの開発チームは、継続的インテグレーションのパイプラインにClaude Codeを組み込んでいます。車載ECUのファームウェアについては、Claudeがコードを生成した直後に、同じセッションで「今のコードをレビューして」と指示するステップがあります。\n\nしかし、後の結合試験で、境界値でのオーバーフローや割り込み処理の競合など、見つけにくい不具合が見つかる例が続いています。","question":"レビューの効果を高める変更として適切なものはどれですか。（2つ選択してください。）","choices":[{"text":"同じセッションで拡張思考を有効にし、生成したコードを時間をかけて見直させる。","explanation":"拡張思考は、複雑な問題を段階的に考えさせたい場面で推論の質を高める機能です。しかし同じセッションのモデルは生成時の推論をそのまま持っているため、考える時間を増やしても自分の判断を疑いにくい状態は変わりません。公式ガイドも、見つけにくい問題を見つけるには拡張思考より独立したレビューインスタンスが効果的だとしています。"},{"text":"レビュー側には差分と要件仕様だけを渡し、生成時の説明や推論の過程は渡さない。","explanation":"正解。独立したインスタンスにしても、生成時の説明をそのまま渡すと、レビュー側は生成側の考え方に沿ってコードを読んでしまいます。差分と要件仕様（許容範囲、割り込みの優先度など）だけを渡せば、レビューは「仕様を満たしているか」をコードそのものから判断できます。"},{"text":"生成時の会話記録をレビュー側に渡し、設計の意図を理解したうえで確認させる。","explanation":"設計の意図を共有することは、人間どうしのコードレビューでは議論を効率よく進める手段になります。しかしモデルによるレビューでは、生成時の推論を渡すと独立したインスタンスを使う意味が薄れ、生成側と同じ見落としを引き継ぎます。確認すべき基準は、会話記録ではなく要件仕様として渡します。"},{"text":"生成とは別のClaudeインスタンスを起動し、そのインスタンスにレビューを担当させる。","explanation":"正解。生成時の推論を持たない別のインスタンスは、コードをその内容だけで評価するため、生成側が見落とした前提の誤りや境界条件の抜けに気づきやすくなります。Claude Codeのドキュメントでも、書いた直後のコードに偏らない新しいコンテキストのほうがレビューの質が上がるとされています。"}],"answer":[1,3],"overall":"公式ガイド（タスクステートメント4.6）は、セルフレビューの限界として、モデルは生成時の推論の流れを保持しているため、同じセッション内では自身の判断を疑いにくいことを挙げています。そのうえで、以前の推論の流れを持たない独立したレビューインスタンスのほうが、セルフレビューの指示や拡張思考よりも見つけにくい問題を見つけやすいとしています。\n\nClaude Codeのベストプラクティスでも、新しいコンテキストで動くレビュー役は、変更を生んだ推論ではなく差分と与えられた基準だけを見て評価すると説明されています。そのため正解は、別のインスタンスを使うことと、そのインスタンスに生成時の推論を渡さないことの2つです。\n\n見分け方の決め手は、「独立している」ことの中身です。拡張思考は同じセッションのままで、会話記録の受け渡しは別のインスタンスにしても独立性を失わせます。\n\n本番では、レビュー用インスタンスへの入力を「差分・要件仕様・レビュー基準」に限定するテンプレートをパイプラインに固定すると、運用の途中で推論が混入するのを防げます。\n\n参考: https://code.claude.com/docs/en/best-practices"},{"id":4,"scenario":"ツール設計とMCP統合","situation":"ある不動産会社の開発チームは、Claude Codeを開発ワークフローに統合しようとしています。Claudeから、次の3つを扱えるようにしたいと考えています。\n\nGitHubのイシューとプルリクエスト\n\nSlackのチャンネル\n\n社内の物件管理データベース（価格改定を2段階で承認する社内独自のワークフローがある）\n\n担当者は、3つすべてについてカスタムのMCPサーバーを自作する計画を立てています。","question":"この計画の見直しとして適切なものはどれですか。（2つ選択してください。）","choices":[{"text":"カスタムMCPサーバーは、物件管理データベースの承認ワークフローに限って作る。","explanation":"正解。価格改定の2段階承認のような社内独自のワークフローは、既存のサーバーでは扱えないため、カスタムのMCPサーバーを作る価値があります。カスタムサーバーをチーム固有の処理に限定すれば、作るべきものが明確になり、承認の手順をツールの設計に正確に反映できます。"},{"text":"MCPは使わず、各APIをcurlで呼ぶ手順をCLAUDE.mdに書いてBashで実行させる。","explanation":"CLIやcurlでのAPI呼び出しは、少数の単純な操作であれば手軽な手段です。しかし手順をCLAUDE.mdに書いて都度コマンドを組み立てさせると、認証情報の扱いや入力の検証が不安定になり、承認ワークフローのような複雑な手順を確実に守らせることも難しくなります。ツールとして定義したほうが、使い方と境界が明確になります。"},{"text":"GitHubとSlackには、既存のコミュニティ製や公式のMCPサーバーを使う。","explanation":"正解。GitHubやSlackのような標準的な連携には、すでに広く使われ保守されているMCPサーバーがあります。それらを使えば、イシューやメッセージの操作に必要なツールがすぐにそろい、APIの変更への追従も提供元に任せられます。自作の手間を、社内固有の部分に集中できます。"},{"text":"3つの連携を1つのカスタムMCPサーバーにまとめ、保守する対象を1つにする。","explanation":"サーバーを1つにまとめると、デプロイや設定の手間は減るように見えます。しかしGitHubやSlackのような標準的な連携まで自作する点は変わらず、APIの仕様変更への追従や認証の実装をすべて自分たちで抱えることになります。保守の負担が減るどころか、1つのサーバーの不具合が3つの連携すべてに波及します。"}],"answer":[0,2],"overall":"公式ガイド（タスクステートメント2.4）は、標準的な統合（Jiraなど）には、カスタム実装ではなく既存のコミュニティ製MCPサーバーを選択し、カスタムサーバーはチーム固有のワークフローのために取っておくことを挙げています。\n\n本問では、GitHubとSlackが標準的な統合に当たり、物件管理データベースの2段階承認がチーム固有のワークフローに当たります。そのため、前者には既存のサーバーを使い、後者だけを自作するのが適切です。\n\n見分け方の決め手は、それぞれの連携先が「多くの組織で共通のもの」か「自社にしかないもの」かを区別することです。1つにまとめる案とcurlで呼ぶ案は、どちらも標準的な連携を自前で抱え込む点で、元の計画の問題を残しています。\n\nClaude Codeでは、チームで使うサーバーをプロジェクトスコープの.mcp.jsonに登録しておけば、メンバー全員が同じツールを使えます。本番では、カスタムサーバーの認証トークンを環境変数の展開で参照し、シークレットをリポジトリにコミットしないようにします。\n\n参考: https://code.claude.com/docs/en/mcp"},{"id":5,"scenario":"エージェントアーキテクチャとオーケストレーション","situation":"ある研究機関の共同利用施設では、外部の研究者からの問い合わせに答えるカスタマーサポート解決エージェントを、Claude Agent SDKで構築しています。装置の利用料を返金するprocess_refundについては、「同じセッション内でget_customerが呼ばれるまで呼び出しを拒否する」前提条件ゲートを実装しました。\n\nところが監査で、get_customerが「該当する利用者が2名います」という結果を返した会話でも、その後のprocess_refundが実行され、別の研究者の口座に返金されていたことが分かりました。","question":"最も可能性の高い原因はどれですか。","choices":[{"text":"process_refundの説明が短く、エージェントが使うべき場面を判断できていない。","explanation":"ツールの説明の不足は、似たツールの間で選択を誤る原因としてはよくあるものです。しかし本問のエージェントは、返金の依頼に対して正しくprocess_refundを選んでいます。問題はツールの選択ではなく、本人が特定されていないのに実行を許したことにあります。"},{"text":"tool_choiceが\"auto\"のままで、get_customerの呼び出しが強制されていない。","explanation":"tool_choiceで特定のツールを強制すると、そのツールを最初に必ず呼ばせることはできます。しかし本問では、get_customerはすでに呼ばれています。呼び出しを強制しても、返された結果が本人を特定できていないことは変わらず、ゲートがそれを見逃す問題も解決しません。"},{"text":"システムプロンプトに、返金の前に本人確認を行うという指示が書かれていない。","explanation":"プロンプトの指示は、エージェントに手順を理解させるためには必要です。しかし本問では、手順を確実に守らせるためにすでにプログラムによるゲートを実装しており、事故はそのゲートを通過して起きています。プロンプトに指示を足しても、確率的な遵守が加わるだけで、ゲートの条件の不備は残ります。"},{"text":"ゲートが、get_customerの呼び出しの有無だけを見て、検証済みのIDを確かめていない。","explanation":"正解。前提条件ゲートで確かめるべきなのは「get_customerが呼ばれたか」ではなく、「get_customerが検証済みの顧客IDを1件返したか」です。現在の条件では、複数の候補が一致して本人が特定できていない場合でもゲートを通過してしまいます。検証済みのIDが確定するまでprocess_refundをブロックする条件に直す必要があります。"}],"answer":[3],"overall":"公式ガイド（タスクステートメント1.4）は、前提となるステップが完了するまで下流のツール呼び出しをブロックする前提条件を実装する例として、get_customerが検証済みの顧客IDを返すまでprocess_refundをブロックすることを挙げています。ここでの「完了」は、ツールが呼ばれたことではなく、検証済みのIDが得られたことです。\n\n本問のゲートは呼び出しの有無だけを条件にしているため、複数の候補が一致した会話でも通過してしまいました。\n\n見分け方の決め手は、すでにゲートがあるのに事故が起きたという事実から、ゲートの条件そのものを疑うことです。プロンプトの指示、ツールの説明、tool_choiceは、いずれもエージェントにツールを正しく選ばせ、正しい順に呼ばせるための手段で、本問ではその部分は問題なく動いています。\n\nなお、複数の候補が一致した場合は、推測で1件を選ばず、追加の識別情報を顧客に尋ねるようエージェントに指示することも必要です。本番では、ゲートの判定に使う検証済みIDをセッションの状態として保持し、process_refundの引数のIDと一致することまで確かめます。\n\n参考: https://code.claude.com/docs/en/agent-sdk/hooks"},{"id":6,"scenario":"プロンプトエンジニアリングと構造化出力","situation":"ある広告会社の開発チームは、Claudeで構造化データ抽出システムを構築しています。広告主との契約書から、契約開始日・契約終了日・月額料金・自動更新の有無を抽出し、請求システムへ登録します。抽出スキーマでは、4つのフィールドをいずれも必須にしています。\n\nところが、契約書の約30%は自動更新型で、終了日の記載がありません。その場合でも、「2099-12-31」や「契約開始日の1年後」といった、契約書にない終了日が出力されていました。","question":"最も適切な対処はどれですか。","choices":[{"text":"契約終了日をnull許容の任意フィールドにし、記載がなければnullを返させる。","explanation":"正解。元の文書に情報が含まれていない可能性があるフィールドを任意（null許容）にしておけば、モデルは必須フィールドを埋めるために値を捏造する必要がなくなります。終了日がnullの契約は自動更新型として請求システム側で扱えるので、架空の日付が登録されることもありません。"},{"text":"ツール定義にstrict: trueを設定し、スキーマどおりの値を返させる。","explanation":"strictをtrueにする設定は、出力がスキーマの型や必須項目に必ず一致するようにする機能です。しかし現在のスキーマが終了日を必須にしている以上、スキーマどおりに出力させると、終了日には必ず何らかの日付が入ります。捏造を防ぐどころか、必須の値を埋める圧力を強めます。"},{"text":"後処理で、終了日が2099年の値を契約開始日の1年後に置き換えて登録する。","explanation":"後処理による値の補正は、形式の揺れをそろえる正規化には有効です。しかしこの案は、ある架空の値を別の架空の値に置き換えているだけで、契約書に終了日がないという事実は記録されません。「契約開始日の1年後」という捏造された値はそのまま残ります。"},{"text":"プロンプトに「契約書に書かれていない日付は推測しないこと」と追記する。","explanation":"推測を控えるよう指示すると、捏造が減る場合はあります。しかしスキーマで終了日が必須のままでは、値を入れずにツールを呼ぶ選択肢がモデルにありません。プロンプトとスキーマが矛盾した状態では、何らかの日付が入り続けるおそれがあります。"}],"answer":[0],"overall":"公式ガイド（タスクステートメント4.3）は、元の文書に情報が含まれていない可能性がある場合にスキーマのフィールドを任意（null許容）として設計し、必須フィールドを満たすための値の捏造を防ぐことを挙げています。\n\n本問の「2099-12-31」や「契約開始日の1年後」は、終了日が必須であるために生まれた捏造の値です。\n\n見分け方の決め手は、捏造の原因がプロンプトではなくスキーマの設計にあると見抜くことです。プロンプトの追記はスキーマと矛盾し、後処理は捏造を別の捏造に置き換え、strictをtrueにする設定は必須の制約をむしろ確実にします。\n\nなお、自動更新型かどうかは別のフィールドで抽出しているので、終了日がnullであることと組み合わせれば、請求システムは契約の種類を正しく判断できます。本番では、nullを返した件数を契約書の種類ごとに集計し、本来は終了日があるはずの契約でnullが出ていないかも確認します。\n\n参考: https://platform.claude.com/docs/en/build-with-claude/structured-outputs"},{"id":7,"scenario":"Claude Codeの設定とワークフロー","situation":"ある保険会社の開発チームは、Claude Codeで契約管理システムを開発しています。リポジトリのルートのCLAUDE.mdはチームで共有してコミットしていますが、最近はメンバーが自分専用の内容も書き足すようになりました。たとえば、次のような行です。\n\n「検証環境には自分用のsbx-tanakaサーバーを使う」\n\n「テストには自分が担当する契約番号P-20871を使う」\n\nその結果、他のメンバーのClaudeが別人の検証環境に接続しようとしたり、こうした行の編集でマージの競合が起きたりしています。","question":"CLAUDE.mdの構成の見直しとして適切なものはどれですか。（2つ選択してください。）","choices":[{"text":"コミットするCLAUDE.mdには、ビルド手順や規約など、チーム全員に共通する内容だけを残す。","explanation":"正解。プロジェクトのCLAUDE.mdは、バージョン管理を通じてチーム全員に共有される指示の置き場所です。ビルドやテストのコマンド、コーディング規約、全体の構成といった全員に共通する内容だけに絞れば、個人の設定が他のメンバーのセッションに混ざらなくなり、ファイルを編集する機会も減ります。"},{"text":"メンバーごとに.claude/rules/に個人用のファイルを作り、担当するディレクトリをpathsで指定する。","explanation":".claude/rules/は、トピックごとに規約を分けて管理したり、pathsで特定のファイルにだけ適用したりするための仕組みです。しかしプロジェクトの.claude/rules/はリポジトリの一部としてコミットされ、チーム全員に共有されます。pathsはファイルのパスで読み込みを絞るもので、作業する人を区別しないため、個人の設定を分ける目的には使えません。"},{"text":"各メンバー専用の内容は、プロジェクトのルートのCLAUDE.local.mdに移し、.gitignoreに追加する。","explanation":"正解。CLAUDE.local.mdは、自分だけが使うプロジェクト固有の設定（検証環境や使いたいテストデータなど）を置くためのファイルで、プロジェクトのCLAUDE.mdと一緒に読み込まれます。.gitignoreに加えればコミットされないので、他のメンバーのClaudeに別人の検証環境が伝わることも、こうした行でマージの競合が起きることもなくなります。"},{"text":"各メンバー専用の内容は、各自のホームディレクトリの~/.claude/CLAUDE.mdに移す。","explanation":"~/.claude/CLAUDE.mdは、コードスタイルの好みのように、すべてのプロジェクトに共通する個人の設定を置く場所です。ここに移せば他のメンバーには共有されませんが、この契約管理システム用の検証環境や契約番号が、無関係な別のプロジェクトの作業でも読み込まれます。特定のプロジェクトだけで使う個人の設定には、より範囲の狭い置き場所があります。"}],"answer":[0,2],"overall":"公式ガイド（タスクステートメント3.1）は、ユーザーレベル・プロジェクトレベル・ディレクトリレベルという設定階層と、ユーザーレベルの指示がバージョン管理を通じてチームメイトと共有されないことを挙げています。\n\nClaude Codeのドキュメントでは、これにプロジェクト固有の個人設定を置くCLAUDE.local.mdが加わります。すべてのプロジェクトに共通する個人の好みは~/.claude/CLAUDE.md、チームで共有する指示はプロジェクトのCLAUDE.md、このプロジェクトだけで使う自分の設定はCLAUDE.local.md、という使い分けです。本問の検証環境や担当の契約番号は、3つ目に当たります。\n\n誤答を除く手がかりは、各置き場所が「誰に共有され、どのプロジェクトで読み込まれるか」です。~/.claude/CLAUDE.mdは共有されない点では条件を満たしますが、他のプロジェクトでも読み込まれます。.claude/rules/はチームに共有されるうえ、pathsは人ではなくファイルで絞る仕組みです。\n\n本番では、CLAUDE.local.mdを.gitignoreに追加したうえで、/contextのMemory filesに両方のファイルが表示されることを確かめます。\n\n参考: https://code.claude.com/docs/en/memory"},{"id":8,"scenario":"エージェントアーキテクチャとオーケストレーション","situation":"あるSaaS企業の開発チームは、Claude Agent SDKで開発者の生産性向上ツールを構築しています。このツールには、次の2つの機能があります。\n\nプルリクエストごとに、ライセンスヘッダー・変更履歴の記載・公開APIの互換性の3点を確認する定型チェック\n\n「レガシーの課金サービスがなぜ遅いのか調べて」のような、範囲の決まっていない調査の依頼\n\n現在はどちらも同じ汎用エージェントが処理しており、定型チェックでは確認項目が実行ごとに抜けたり増えたりしています。","question":"タスク分解の設計として適切なものはどれですか。（2つ選択してください。）","choices":[{"text":"調査の依頼は、途中の発見に応じてサブタスクを追加する動的な分解で処理する。","explanation":"正解。「なぜ遅いのか」のような調査は、最初に何を調べればよいかが分からず、遅いクエリや外部APIの呼び出しといった発見に応じて次の調査対象が決まります。こうしたオープンエンドなタスクには、各ステップで分かったことをもとにサブタスクを生成する動的な分解が適しています。"},{"text":"調査の依頼では、最初にsrc配下のファイルを読み込ませてから、1回のプロンプトで原因を特定させる。","explanation":"関係しそうなコードを先に読ませるのは、調査対象が小さい場合には手早い方法です。しかしレガシーのサービス全体を一度に読み込むとコンテキストを圧迫して注意が分散し、途中で分かったことに応じて調べる範囲を変えることもできません。範囲の決まっていない調査には向かないやり方です。"},{"text":"両機能を1つのエージェントのまま、反復回数の上限を下げて応答のぶれを抑える。","explanation":"反復回数の上限は、ループが止まらない場合の安全策としては必要です。しかし上限を下げても、定型チェックで何を確認するかがエージェントの判断に任されている状態は変わらず、項目の抜けは防げません。調査の依頼では、必要な調査が途中で打ち切られるおそれも生じます。"},{"text":"定型チェックは、3つの確認を決まった順に行うプロンプトチェーンにする。","explanation":"正解。確認する項目が毎回同じで予測できる作業には、固定の逐次パイプラインであるプロンプトチェーンが適しています。ライセンスヘッダー、変更履歴、APIの互換性を1ステップずつ確認させれば、項目の抜けや余計な確認がなくなり、結果も毎回同じ形でそろいます。"}],"answer":[0,3],"overall":"公式ガイド（タスクステートメント1.6）は、固定の逐次パイプライン（プロンプトチェーン）と、中間的な発見に基づく動的で適応的な分解を使い分けることを挙げ、予測可能な多面的レビューにはプロンプトチェーン、オープンエンドな調査タスクには動的な分解を選ぶよう求めています。\n\n本問の2つの機能は、まさにこの2つの典型に当たります。定型チェックは確認項目が決まっているので固定のチェーンにし、原因調査は発見に応じてサブタスクを増やす動的な分解にするのが適切です。Anthropicのエージェント設計の解説でも、決まった手順に分けられるタスクにはプロンプトチェーンを、必要なサブタスクを事前に予測できないタスクにはオーケストレーターによる動的な分解を使うとされています。\n\n見分け方の決め手は、各機能について「手順を事前に決められるか」を判断することです。反復回数の調整は分解の方法を変えず、全ファイルの一括読み込みは動的な調査の利点を捨てています。\n\n本番では、定型チェックの各ステップの結果を構造化して返し、最後にまとめて1つのPRコメントにすると、開発者が確認しやすくなります。\n\n参考: https://www.anthropic.com/engineering/building-effective-agents"},{"id":9,"scenario":"エージェントアーキテクチャとオーケストレーション","situation":"ある出版社の開発チームは、Claude Agent SDKでマルチエージェントリサーチシステムを構築しています。編集部が定めた品質基準には、「市場規模や利用者数などの数値は、2つ以上の独立した出典で裏付ける」とあります。\n\n「国内の電子書籍市場の動向」を調べたところ、統合サブエージェントの草稿には数値を含む主張が14件あり、そのうち3件は出典が1件しかありませんでした。現在のコーディネーターは、統合サブエージェントの草稿を確認せずに、そのままレポート生成サブエージェントに渡しています。","question":"最も適切な改善策はどれですか。","choices":[{"text":"草稿を品質基準と照合し、裏付けの足りない3件だけを再度委任してから統合をやり直す。","explanation":"正解。コーディネーターが統合の出力を品質基準と照らし合わせて不足を特定し、その3件の主張の裏付けに絞ったクエリで検索・分析サブエージェントに再度委任します。得られた出典を加えて統合サブエージェントを呼び直し、基準を満たすまでこれを繰り返せば、基準を満たした部分を生かしたまま不足だけを埋められます。"},{"text":"草稿を編集部に回し、担当者が品質基準との照合を終えてから再実行を指示する。","explanation":"人間の担当者が草稿を確認する工程は、公開前の最終的な品質保証としては有効です。しかし「数値に2つ以上の出典があるか」は、コーディネーターが草稿と品質基準を照らし合わせれば判定できる条件です。照合のたびに担当者の確認を待つと、レポートの完成が遅れ、担当者の負担も増えます。"},{"text":"出典が1件の主張に「裏付けは1件」と注記させ、そのままレポート生成に進める。","explanation":"裏付けが足りないことを注記するのは、追加で調べても出典が見つからない場合に、読み手へ不確かさを伝える方法として正しい扱いです。しかし本問の3件は、まだ追加の調査を試していません。注記だけで済ませると、品質基準を満たさないままレポートが作られます。注記は、再調査を尽くした後に使う手段です。"},{"text":"検索・分析・統合のすべてを最初から実行し直し、得られた新しい草稿で置き換える。","explanation":"全体の再実行は、調査の範囲や問いの立て方そのものが誤っていた場合には妥当です。しかし本問で不足しているのは14件のうち3件の裏付けだけで、残る11件はすでに基準を満たしています。全体をやり直すとコストと時間がかかるうえ、同じ検索の仕方では同じ不足が再び生じるおそれもあります。"}],"answer":[0],"overall":"公式ガイド（タスクステートメント1.2）は、コーディネーターが統合の出力に不足がないかを評価し、的を絞ったクエリで検索および分析のサブエージェントに再度委任し、カバー範囲が十分になるまで統合を再度呼び出す反復的な改善ループを実装することを挙げています。\n\nAnthropicのマルチエージェントリサーチシステムの解説でも、リードエージェントは結果を統合したうえで追加の調査が必要かを判断し、必要ならサブエージェントを追加で起動するとされています。本問の不足は、品質基準という明確な物差しで特定できる3件の主張に限られています。だからこそ、評価をコーディネーターが行い、再委任をその3件に絞ることに意味があります。\n\n誤答はいずれも、このループのどこかが欠けています。評価を人に回す案は遅く、注記で済ませる案は評価の後の再調査を省き、全体をやり直す案は範囲を絞っていません。\n\n本番では、品質基準をコーディネーターのプロンプトに明記し、ループの反復回数に上限を設けて、上限に達しても裏付けが見つからない主張は注記を付けてレポートに進めます。\n\n参考: https://www.anthropic.com/engineering/multi-agent-research-system"},{"id":10,"scenario":"ツール設計とMCP統合","situation":"ある国際協力NGOの開発チームは、開発の生産性を上げるためにClaude Codeを使っています。あるエンジニアが、個人で試している翻訳用のMCPサーバーを、自分が担当する5つのリポジトリのどれで作業するときにも使いたいと考えています。このサーバーはまだ試作段階で、チームの他のメンバーには共有したくありません。","question":"このMCPサーバーの設定方法として最も適切なものはどれですか。","choices":[{"text":"最初に作業するリポジトリで、ローカルスコープとして1回だけ追加する。","explanation":"ローカルスコープは既定のスコープで、自分専用のサーバーを特定のプロジェクトだけで使いたいときに適しています。設定は~/.claude.jsonにそのプロジェクトのパスとともに保存されるため、他の4つのリポジトリではこのサーバーは読み込まれません。"},{"text":"5つのリポジトリそれぞれの.mcp.jsonに追加し、コミットしてチームで共有する。","explanation":"プロジェクトスコープの.mcp.jsonは、チームで共有するMCPサーバーを設定する場所で、バージョン管理を通じて全員が同じツールを使えます。しかし本問のサーバーは試作段階で、他のメンバーには共有したくないものです。コミットすると、チームの全員の環境にこのサーバーが現れます。"},{"text":"ユーザースコープで追加し、~/.claude.jsonに保存されるようにする。","explanation":"正解。ユーザースコープのMCPサーバーは~/.claude.jsonに保存され、自分のマシンのすべてのプロジェクトで使える一方、自分のアカウントに限られます。個人用・実験的なサーバーをどのリポジトリでも使いたいという要件と、チームには共有しないという要件の両方を満たします。"},{"text":"各リポジトリの.mcp.jsonに追加し、.gitignoreで.mcp.jsonをコミット対象から外す。","explanation":".gitignoreで外せばチームには共有されませんが、.mcp.jsonはチームで共有するサーバーを置くためのファイルです。共有用のサーバーを後から追加するときに競合し、5つのリポジトリで同じ設定を別々に保守する手間も生じます。個人用の設定には、そのためのスコープを使うのが適切です。"}],"answer":[2],"overall":"公式ガイド（タスクステートメント2.4）は、チームで共有するツール向けのプロジェクトスコープ（.mcp.json）と、個人用・実験的なサーバー向けのユーザースコープ（~/.claude.json）を区別し、個人用・実験的なMCPサーバーはユーザースコープで設定するよう求めています。\n\nClaude Codeのドキュメントでも、ローカルスコープは現在のプロジェクトだけで読み込まれて共有されず、プロジェクトスコープは.mcp.jsonでバージョン管理を通じて共有され、ユーザースコープはすべてのプロジェクトで読み込まれて共有されないと整理されています。本問の要件は「すべての担当リポジトリで使う」と「共有しない」の2つで、両方を満たすのはユーザースコープだけです。\n\n見分け方の決め手は、各スコープを「どこで読み込まれるか」と「誰と共有されるか」の2つの軸で比べることです。.mcp.jsonを使う2つの案は共有用の仕組みを個人用に流用しており、ローカルスコープは読み込まれる範囲が1つのプロジェクトに限られます。\n\n本番では、claude mcp addに--scope userを付けて追加し、試作が固まってチームで使うことになったらプロジェクトスコープへ移します。\n\n参考: https://code.claude.com/docs/en/mcp"},{"id":11,"scenario":"コンテキスト管理と信頼性","situation":"ある外食業界向け市場調査会社の開発チームは、Claude Agent SDKでマルチエージェントリサーチシステムを構築しています。コーディネーターが、ウェブ検索・文書分析・統合・レポート生成の各サブエージェントに作業を委任します。\n\n「国内フードデリバリー市場の規模」を調査したところ、文書分析サブエージェントが読んだ2つの業界団体レポートで、市場規模が1.8兆円（2025年版）と2.4兆円（2026年版）に食い違っていました。現在のサブエージェントは、矛盾を見つけた時点で分析を打ち切り、「データ不整合」というエラーだけを返しています。","question":"この食い違いの扱いとして適切なものはどれですか。（2つ選択してください。）","choices":[{"text":"どちらの値を採用するかの判断はコーディネーターに任せ、サブエージェントには判断材料をそろえて返させる。","explanation":"正解。文書分析サブエージェントは自分の担当文書しか見ていないため、採用・併記・追加調査のどれにするかを決める立場にありません。矛盾を注記した結果をコーディネーターに返せば、他の調査結果も踏まえて「両論を併記する」「定義を確認する追加調査を委任する」などを判断できます。"},{"text":"両方の値を出典情報とともに残し、矛盾を明示したうえで分析を最後まで完了させる。","explanation":"正解。信頼できる情報源どうしで統計が食い違う場合は、どちらかを捨てるのでも分析を止めるのでもなく、出典を付けたまま両方の値を残して矛盾を注記します。残す出典情報には、レポート名・公開日・集計範囲などを含めます。集計範囲（テイクアウトを含むか等）や公開時期の違いが食い違いの理由であることも多く、出典情報が残っていれば後段で原因を判断できます。"},{"text":"公開日が新しい2026年版の値を正として採用し、2025年版の値は出力から外すようサブエージェントに指示する。","explanation":"時系列データで「最新の値を報告する」と要件が決まっている場面なら、新しい値を優先する規則は有効です。しかし本問の2つのレポートは集計範囲が同じかどうかも分かっておらず、新しいほうが正しいとは限りません。一方を恣意的に選ぶと、もう一方の出典が失われ、矛盾があった事実も最終レポートから消えます。"},{"text":"2つの値の平均である2.1兆円を市場規模として算出し、2つの出典を併記して統合サブエージェントに渡す。","explanation":"複数の推計値を平均するのは、同じ定義で測った独立な推計を集約する統計処理としては使われる手法です。しかし本問では食い違いの理由が分かっておらず、どちらの資料にも存在しない2.1兆円という数値を作ることになります。出典を併記しても、その数値はどの出典にも書かれていないため、主張と情報源の対応が崩れます。"}],"answer":[0,1],"overall":"公式ガイド（タスクステートメント5.6）は、信頼できる情報源の間で統計が食い違う場合に一方の値を恣意的に選ばず、出典を付けて矛盾を注記すること、そして矛盾する値を含めたまま文書の分析を完了し、統合に渡す前にどう整合させるかをコーディネーターに判断させることを求めています。\n\n正解の2つは、文書分析サブエージェントが「出典付きで両方の値を残して分析を完了する」役割と、コーディネーターが「整合のさせ方を決める」役割に分けた設計です。\n\n見分け方の決め手は、問題文に「食い違いの理由が分かっていない」状況しか書かれていない点です。新しい値の採用は理由を確かめずに一方を捨て、平均値はどの出典にもない数値を作ります。どちらも情報の出所を失わせる点で共通しています。\n\n本番では、サブエージェントの出力スキーマに「矛盾の有無」と「各値の出典」を入れておくと、コーディネーターが機械的に検出して判断に回せます。\n\n参考: https://www.anthropic.com/engineering/multi-agent-research-system"},{"id":12,"scenario":"ツール設計とMCP統合","situation":"ある音楽配信会社の開発チームは、Claude Agent SDKで開発者の生産性向上ツールを構築しています。このエージェントでは、組み込みのRead・Grep・Globが有効になっています。\n\n新しく配属されたエンジニアが「楽曲の再生回数から権利者への分配額を計算する流れを知りたい」と依頼したところ、エージェントはsrc配下の約900ファイルを先頭から順にReadで読み始め、途中でコンテキストが足りなくなりました。なお、分配額の計算をcalculateRoyaltyという関数が担当していることは分かっています。","question":"最初の手順として最も適切なものはどれですか。","choices":[{"text":"Bashのcatでsrc配下のファイルを連結し、1回のツール呼び出しでまとめて読み込む。","explanation":"Bashでファイルをまとめて表示すると、ツール呼び出しの回数は減ります。しかし読み込む内容は900ファイル分のままで、コンテキストが足りなくなるという問題は解決しません。むしろ1回の出力が巨大になり、必要な情報が大量のコードに埋もれます。"},{"text":"GrepでcalculateRoyaltyの定義と呼び出し箇所を探し、そこからReadでimportをたどる。","explanation":"正解。Grepはファイルの内容から関数名やimport文のパターンを検索するツールで、エントリーポイントを素早く見つけられます。見つかったファイルをReadで読み、importをたどって関係するファイルだけを順に開けば、900ファイルを読まずに計算の流れを段階的に理解できます。"},{"text":"分配額の計算フローを推測した説明文をWriteで作成し、それを1ファイルずつ確かめていく。","explanation":"仮説を立ててから確かめる進め方は、調査の方向付けとしては役に立つことがあります。しかし推測から始めると、実際のコードにない処理を前提にしやすく、確認のために結局多くのファイルを読むことになります。手がかりになる関数名が分かっているなら、まずそこから検索するほうが確実です。"},{"text":"Globで**/*.tsを列挙し、ファイル名に「royalty」を含むものから順にすべてReadで読む。","explanation":"Globは、名前や拡張子のパターンに一致するファイルを見つけるのに適したツールです。しかし処理の流れはファイル名ではなく関数の呼び出し関係で決まり、ファイル名にroyaltyを含まない集計処理や通知処理も関わります。名前で絞ってすべて読むやり方では、無関係なファイルを読みながら重要なファイルを見落とします。"}],"answer":[1],"overall":"公式ガイド（タスクステートメント2.5）は、最初にすべてのファイルを読むのではなく、Grepでエントリーポイントを見つけることから始め、次にReadでimportをたどってフローを追跡することを挙げています。Claude Codeのツールリファレンスでも、Grepはファイルの内容からパターンを検索するツール、Globはパターンでファイルを見つけるツールと説明されています。\n\n本問ではcalculateRoyaltyという手がかりがすでにあるので、その定義と呼び出し箇所をGrepで探すのが最短の入口です。\n\n見分け方の決め手は、「処理の流れ」はファイル名ではなく関数の呼び出し関係とimportでつながっている点です。Globで名前を絞る方法も、catでまとめて読む方法も、読む量を減らさないまま必要な関係を見つけにくくします。\n\n本番では、たどったファイルと分かった呼び出し関係をスクラッチパッドファイルに記録させると、後続の質問でも同じ調査を繰り返さずに済みます。\n\n参考: https://code.claude.com/docs/en/tools-reference"},{"id":13,"scenario":"プロンプトエンジニアリングと構造化出力","situation":"ある証券会社の開発チームは、CIパイプラインのClaude Codeで、プルリクエストをファイルごとに分けてレビューしています。各ファイルを個別に分析する方式にしてから、ファイル内の指摘の質と一貫性は改善しました。\n\nところが、次の不具合がレビューを通過し、本番障害になりました。注文サービス側でorder_qtyフィールドの名前をquantityに変えたのに、それを受け取る決済サービス側は古い名前のままでした。","question":"レビューの改善策として最も適切なものはどれですか。","choices":[{"text":"ファイルごとのレビューをやめ、変更されたファイルを1回のパスでまとめてレビューする方式に戻す。","explanation":"1回のパスでまとめてレビューすれば、ファイルをまたぐ関係も同じコンテキストで見られるように思えます。しかし多数のファイルを一度に扱うと注意が分散し、ファイル単位の方式で改善した指摘の質と一貫性が再び失われます。以前の問題を呼び戻すだけで、両立にはなりません。"},{"text":"ファイル単位のレビューで重大度のしきい値を下げ、報告される指摘の件数を増やす。","explanation":"しきい値を下げると、軽微な問題まで報告されるようになり、見逃しが減る場合もあります。しかしファイル単位のパスは、そもそも他のファイルとの整合性を見ていないので、件数を増やしても今回のような不整合は検出できません。誤検知が増え、開発者の信頼を損なうおそれもあります。"},{"text":"ファイル単位のパスに加え、ファイル間のデータの受け渡しを調べる統合パスを追加する。","explanation":"正解。ファイル単位のパスは各ファイルの局所的な問題に集中する一方、ファイルをまたぐ整合性は見ていません。ファイル間のデータフローに焦点を絞った別の統合パスを加えれば、フィールド名の変更が受け手側に反映されていないといった不整合を検出でき、ファイル単位の指摘の質も保てます。"},{"text":"各ファイルのレビューに、リポジトリ内の他のファイルの全文を参考として添える。","explanation":"周辺のコードを参照させることは、レビューの精度を上げる工夫として一般には役立ちます。しかし各パスに他のファイルの全文まで入れると、ファイル単位のパスが本来の焦点を失い、注意も分散します。ファイルをまたぐ問題を調べる役割は、別のパスに分けたほうが確実です。"}],"answer":[2],"overall":"公式ガイド（タスクステートメント4.6）は、注意の分散や矛盾した指摘事項を避けるために、大規模なレビューをファイル単位の局所的な分析パスと、ファイル横断のデータフロー分析のための別個の統合パスに分割することを挙げています。\n\n本問のチームは前者だけを実装しており、ファイル内の質は上がったものの、ファイルをまたぐ不整合を調べる仕組みが欠けています。そのため、統合パスを追加するのが正解です。Anthropicのエージェント設計の解説でも、タスクを決まった順序のステップに分けて各ステップを1つの役割に集中させるプロンプトチェーンが、精度を高める手法として紹介されています。\n\n見分け方の決め手は、見逃された不具合が「ファイル間の受け渡し」に関するものだという点です。1回のパスに戻す案は注意の分散を呼び戻し、全文の添付はファイル単位のパスの焦点をぼかし、しきい値の調整は見ていない観点を補いません。\n\n本番では、統合パスにファイル単位のパスの結果と変更されたインターフェースの一覧を入力として渡すと、調べる範囲を絞り込めます。\n\n参考: https://www.anthropic.com/engineering/building-effective-agents"},{"id":14,"scenario":"エージェントアーキテクチャとオーケストレーション","situation":"あるEC物流会社の開発チームは、カスタマーサポート解決エージェントの一部の処理を、Messages APIを直接呼び出す独自のループで実装しています。現在のループは、次のどちらかの条件で終了します。\n\n応答のテキストに「以上で対応は完了です」という文言が含まれる\n\n反復が10回に達する\n\nログを見ると、次のケースがありました。\n\nテキストとtool_useを同時に含む応答でループが終わり、返金処理が実行されないまま会話が閉じる\n\n調査の途中なのに、10回目で打ち切られる","question":"ループの終了判定の改善として適切なものはどれですか。（2つ選択してください。）","choices":[{"text":"応答にテキストのブロックが含まれていたら、その時点で対応が完了したとみなす。","explanation":"テキストの有無で完了を判定するのは、終了判定のアンチパターンです。モデルは「返金を処理します」のような説明のテキストとtool_useを同じ応答に含めることがあり、テキストがあっても作業は続いています。今回の返金漏れと同じ問題が、より頻繁に起きるようになります。"},{"text":"stop_reasonが\"tool_use\"の間は続け、\"end_turn\"になったら終了する。","explanation":"正解。stop_reasonは、モデルがなぜ応答を止めたかをAPIが示すフィールドです。\"tool_use\"ならツールの実行を求めているので、ツールを実行して結果を返し、ループを続けます。\"end_turn\"ならモデルが応答を終えたことを示すので、そこで終了します。テキストの内容に頼らず、確実に終了を判定できます。"},{"text":"反復回数の上限は十分大きな値にし、ループが止まらない場合の安全策としてだけ残す。","explanation":"正解。反復回数の上限は、想定外の繰り返しでコストが膨らむのを防ぐ安全策として役立ちます。しかし主な停止条件として使うと、調査がまだ続いている会話まで打ち切ってしまいます。終了はstop_reasonで判断し、上限は通常の会話では届かない十分大きな値にして、異常時の歯止めとしてだけ使います。"},{"text":"終了の文言の候補を増やし、「対応しました」などの表現にも一致するようにする。","explanation":"文言の候補を増やすと、言い回しの違いによる判定漏れは減るように見えます。しかし自然言語のシグナルでループの終了を判定すること自体がアンチパターンで、文言が含まれていてもtool_useが残っている問題は解決しません。候補を増やすほど、作業途中の説明文に一致して早く終わる危険も高まります。"}],"answer":[1,2],"overall":"公式ガイド（タスクステートメント1.1）は、stop_reasonが\"tool_use\"の場合は継続し\"end_turn\"の場合は終了するよう制御フローを実装すること、そしてループ終了の判定に自然言語のシグナルを解析する、主要な停止メカニズムとして反復回数の上限を設定する、完了の指標としてアシスタントのテキストの有無を確認する、といったアンチパターンを避けることを求めています。\n\n現在のループは、このうち2つのアンチパターンを組み合わせています。stop_reasonの扱いに関する公式ドキュメントでも、\"tool_use\"はツールの実行を求めていることを示し、結果を返して処理を続けるべき状態と説明されています。\n\n見分け方の決め手は、テキストとtool_useが同じ応答に含まれうることを知っているかどうかです。テキストの有無も終了の文言も、この場合に誤って終了を判定します。\n\n本番では、反復回数の上限に達したときはログに記録し、人間の担当者へのエスカレーションに回すと、打ち切られた会話を放置せずに済みます。\n\n参考: https://platform.claude.com/docs/en/build-with-claude/handling-stop-reasons"},{"id":15,"scenario":"コンテキスト管理と信頼性","situation":"あるエネルギー会社の開発チームは、Claude Agent SDKでマルチエージェントリサーチシステムを構築しています。「各国の洋上風力発電の規制動向」を調べる際、コーディネーターは12の国・地域ごとに検索サブエージェントを並列に起動します。\n\n先週の実行では、1つの地域のサブエージェントが、規制当局のサイトの応答待ちでタイムアウトしました。その例外がトップレベルまで伝わり、ワークフロー全体が終了しました。完了していた11地域分の結果も破棄され、翌日に全体を再実行するコストが発生しています。","question":"最も適切な改善策はどれですか。","choices":[{"text":"タイムアウトの時間を30秒から10分に延ばし、応答の遅いサイトでも結果を待つようにする。","explanation":"タイムアウトの見直しは、設定値が対象サービスの通常の応答時間に比べて明らかに短い場合には妥当な調整です。しかし時間を延ばしても、相手のサイトが本当に停止していれば失敗は起き、そのときにはやはりワークフロー全体が終了します。1か所の失敗が全体を止めるという設計上の問題は残ったままです。"},{"text":"失敗を構造化されたエラーとして返し、続行かリトライかをコーディネーターに判断させる。","explanation":"正解。失敗の種類、試行したクエリ、得られた部分的な結果、考えられる代替手段をエラーとしてコーディネーターに返せば、11地域の結果を生かしたまま、その地域だけをリトライするか、別の情報源を試すか、欠落を注記して続行するかを判断できます。1つの失敗がワークフロー全体を止めることもなくなります。"},{"text":"ワークフロー全体を最大3回まで自動で再実行するラッパーを、トップレベルに追加する。","explanation":"自動の再実行は、失敗がまれで処理が軽い場合には手軽な復旧手段になります。しかし本問では、1地域の失敗のために完了済みの11地域分まで毎回やり直すことになり、コストの問題をむしろ大きくします。失敗した部分だけを扱えるようにするほうが効率的です。"},{"text":"失敗した地域は空の結果として扱い、残りの11地域の結果だけでレポートを完成させる。","explanation":"部分的な結果でレポートを完成させること自体は、状況によっては妥当な判断です。しかし失敗を空の結果として扱うと、その地域には規制の動きがなかったのか、調べられなかったのかを区別できなくなります。エラーを黙って握りつぶすアンチパターンで、レポートの読み手が誤った結論を出すおそれがあります。"}],"answer":[1],"overall":"公式ガイド（タスクステートメント5.3）は、エラーを黙って握りつぶすこと（空の結果を成功として返す）も、1つの失敗でワークフロー全体を終了させることも、いずれもアンチパターンであるとしています。そのうえで、失敗の種類・試行した内容・部分的な結果・考えられる代替案を含む構造化されたエラーコンテキストを返し、コーディネーターが状況に応じた復旧の判断をできるようにすることを求めています。\n\n本問の現状は後者のアンチパターンで、1地域のタイムアウトが11地域分の成果まで失わせています。\n\n見分け方の決め手は、改善策が「失敗した部分だけ」を扱えるかどうかです。全体の再実行は無駄を増やし、空の結果は前者のアンチパターンに入れ替えるだけで、タイムアウトの延長は失敗そのものがなくなることを前提にしています。Anthropicのマルチエージェントリサーチシステムの解説でも、エラーが起きた地点から再開できる仕組みと、エージェントに失敗を伝えて適応させることの重要性が述べられています。\n\n本番では、最終レポートに「この地域は情報源が利用できなかった」というカバレッジの注記を付けて、欠落を読み手に明示します。\n\n参考: https://www.anthropic.com/engineering/multi-agent-research-system"},{"id":16,"scenario":"エージェントアーキテクチャとオーケストレーション","situation":"ある海運会社の開発チームは、Claude Agent SDKでカスタマーサポート解決エージェントを構築しています。荷主の依頼で貨物の配送先を変更するchange_delivery_addressツールは、本人確認を済ませてから呼び出す決まりで、システムプロンプトにもそのように明記しています。\n\nしかし直近1か月のログでは、配送先の変更の2.3%が本人確認なしに実行されていました。チームでは、プロンプトの指示をさらに強調する案が出ています。","question":"対応として適切なものはどれですか。（2つ選択してください。）","choices":[{"text":"本人確認なしで実行された変更をログで検出し、担当者が事後に取り消す運用にする。","explanation":"ログによる事後の検出は、手順の抜けや不正の兆候を監査するには役立ちます。しかし取り消しが間に合う前に、貨物が変更後の配送先へ向かうおそれがあり、誤った変更が実行されること自体は防げません。本人確認という前提条件は、操作の前に確実に満たされている必要があります。"},{"text":"change_delivery_addressの説明に「本人確認が完了した会話でのみ使う」と条件を書き加える。","explanation":"ツールの説明に使うべき条件を書くことは、Claudeがツールを選ぶ判断を正しい方向に導くうえで有効です。しかし説明に従うかどうかはモデルの判断に委ねられており、プロンプトの指示と同じく確率的な遵守にとどまります。誤ると貨物が別の場所に届く操作では、2.3%を下げるだけでは不十分です。"},{"text":"本人確認の成功をコードで確かめ、未確認ならchange_delivery_addressを拒否する。","explanation":"正解。本人確認ツールが成功したかどうかをアプリケーション側のコード（PreToolUseフックやツールのハンドラー）で確かめ、未確認の間は配送先の変更を拒否すれば、モデルが手順を飛ばしても変更は実行されません。プロンプトの指示と違い、毎回確実に順序が守られます。"},{"text":"拒否した理由（本人確認が先に必要）をツールの結果としてエージェントに返す。","explanation":"正解。拒否の理由をツールの結果として返せば、エージェントは何が足りないのかを理解し、本人確認の手順に戻ってから改めて変更を試みられます。理由を伝えずに止めるだけだと、エージェントが同じ呼び出しを繰り返したり、顧客に不正確な説明をしたりするおそれがあります。"}],"answer":[2,3],"overall":"公式ガイド（タスクステートメント1.4）は、金銭に関わる操作の前の本人確認のように決定論的な遵守が求められる場合、プロンプトの指示だけでは失敗率がゼロにならないことを挙げ、前提となるステップが完了するまで下流のツール呼び出しをブロックするプログラムによる前提条件を実装するよう求めています。\n\nAgent SDKのPreToolUseフックは、ツールの呼び出しを拒否し、permissionDecisionReasonで理由をモデルに伝えられるので、こうした前提条件ゲートの実装に使えます。正解の2つは、ゲートで確実に止めることと、止めた理由を伝えてエージェントを正しい手順に戻すことです。\n\n見分け方の決め手は、要件が「確率を下げる」ではなく「確実に防ぐ」である点です。ツールの説明に条件を書く案はプロンプトの指示と同じく確率的な遵守のままで、事後に取り消す運用は誤った変更が実行されること自体を防げません。\n\n本番では、ゲートが拒否した件数を監視し、どの会話の流れで手順が飛ばされやすいかを分析すると、プロンプトの改善にも役立ちます。\n\n参考: https://code.claude.com/docs/en/agent-sdk/hooks"},{"id":17,"scenario":"Claude Codeの設定とワークフロー","situation":"ある旅行会社の開発チームは、Claude Codeで運賃比較のスキルfare-diffを作りました。このスキルは、路線コードと出発日の2つを受け取り、新旧の運賃テーブルでの価格差を表示します。\n\nしかし開発者が引数を付けずに/fare-diffを実行することが多く、そのたびに次のどちらかが起きています。\n\nClaudeが路線を推測して計算する\n\nSKILL.mdの手順にある「指定された路線」が何を指すか分からずに止まる","question":"改善策として適切なものはどれですか。（2つ選択してください。）","choices":[{"text":"allowed-toolsに路線コードと出発日を列挙して、引数として扱わせる。","explanation":"allowed-toolsは、スキルの実行中に許可を求めずに使えるツールを指定するフロントマターで、引数を定義する設定ではありません。路線コードや出発日を書いても、ツールの指定として扱われるだけで、引数の入力を促したり手順に値を渡したりする効果はありません。"},{"text":"SKILL.mdの本文で$0と$1を使い、渡された路線コードと出発日を手順に埋め込む。","explanation":"正解。スキルの本文では、呼び出し時に渡された引数を$ARGUMENTSや$0・$1のような位置指定のプレースホルダーで参照できます。「指定された路線」のようなあいまいな書き方をやめ、$0（路線コード）と$1（出発日）を手順に埋め込めば、Claudeはどの値を使えばよいかを迷いません。"},{"text":"argument-hint: [route-code] [date]を設定し、必要な引数を表示させる。","explanation":"正解。argument-hintを設定すると、開発者が/fare-diffを入力するときの補完に、期待する引数が表示されます。引数なしで呼び出しがちな開発者に、路線コードと出発日が必要であることをその場で知らせられるので、推測で計算させる場面が減ります。"},{"text":"context: forkを設定し、引数がないときは別のコンテキストで路線を推測させる。","explanation":"contextをforkにすると、スキルは分離されたサブエージェントのコンテキストで実行され、冗長な出力がメインの会話を汚さなくなります。引数の受け取り方には関係がなく、別のコンテキストで推測させても、誤った路線で計算する問題は残ります。"}],"answer":[1,2],"overall":"公式ガイド（タスクステートメント3.2）は、argument-hintフロントマターを使用して、開発者が引数なしでスキルを呼び出したときに必須パラメータの入力を促すことを挙げています。Claude Codeのドキュメントでも、argument-hintは補完時に期待する引数を示すヒントで、スキルの本文では$ARGUMENTSや$0・$1で渡された引数を参照できると説明されています。\n\n本問の2つの症状、つまり引数を付け忘れることと、手順の中で値の指す先があいまいなことに、正解の2つがそれぞれ対応します。\n\n見分け方の決め手は、各フロントマターの役割を正確に区別することです。allowed-toolsはツールの事前承認に、contextをforkにする設定は実行するコンテキストの分離に使うもので、どちらも引数とは関係がありません。\n\n本番では、SKILL.mdの手順の冒頭に「路線コードまたは出発日が渡されていない場合は、計算せずに入力を求める」と書いておくと、推測による計算をさらに防げます。\n\n参考: https://code.claude.com/docs/en/skills"},{"id":18,"scenario":"ツール設計とMCP統合","situation":"あるSaaS企業の開発チームは、Claude Agent SDKでマルチエージェントリサーチシステムを構築しています。次の2つのツールがあり、説明はどちらも「コンテンツを分析して要点を返す」です。\n\nanalyze_content（ウェブ検索サブエージェントが取得したページを解析する）\n\nanalyze_document（ユーザーがアップロードしたPDFを解析する）\n\nログを見ると、アップロードされたPDFの約40%がanalyze_contentに送られ、ページ番号などのメタデータが失われていました。","question":"改善策として適切なものはどれですか。（2つ選択してください。）","choices":[{"text":"誤ったツールが呼ばれたときは、PostToolUseフックでその結果を破棄して再実行させる。","explanation":"PostToolUseフックは、ツールの結果をモデルが処理する前に変換したり正規化したりするのに使える仕組みです。しかし誤ったツールの結果を破棄して再実行させても、次の呼び出しで正しいツールが選ばれる保証はなく、無駄な呼び出しとレイテンシが増えます。選択の誤りそのものを減らす対策ではありません。"},{"text":"analyze_documentの説明に、アップロードされたPDFを扱い、ページ番号などのメタデータを返すことを書く。","explanation":"正解。ツールの説明は、モデルがどのツールを使うかを決める主な手がかりです。analyze_documentの説明に、入力がユーザーのアップロードしたPDFであることと、ページ番号などのメタデータを付けて返すことを明記すれば、ウェブのページを扱うツールとの違いがはっきりし、PDFの分析でこのツールが選ばれやすくなります。\n\n改名する側だけでなく残る側の説明も具体的にすることで、2つのツールの境界が明確になります。"},{"text":"PDFがアップロードされたときは、tool_choiceでanalyze_documentを毎回強制的に選択させる。","explanation":"強制的なツール選択は、特定のツールを必ず最初に呼ばせたい場面では有効です。しかし本問の会話では、PDFとウェブ検索の結果が同じ依頼の中に混在することもあり、毎回1つのツールに固定すると別の誤りを生みます。ツールの説明が重複しているという根本原因も残ったままです。"},{"text":"analyze_contentをextract_web_resultsに改名し、ウェブ専用の説明に書き換える。","explanation":"正解。ほぼ同じ説明を持つツールが並ぶと、モデルはどちらを選ぶべきか判断できず、誤ったルーティングが起きます。名前と説明の両方で「ウェブ検索の結果を扱うツール」であることを明確にすれば、機能の重複がなくなり、PDFがこのツールに送られることも減ります。"}],"answer":[1,3],"overall":"公式ガイド（タスクステートメント2.1）は、ほぼ同一の説明を持つanalyze_contentとanalyze_documentのように、あいまいな説明や重複する説明が誤ったルーティングを引き起こすことを挙げ、機能の重複をなくすためにツールの名前を変更し説明を更新するよう求めています。Claudeのツール定義のドキュメントでも、ツールの説明は何をするか・いつ使うべきかを詳しく書くことが、ツールの性能に最も影響する要素とされています。\n\n本問の2つのツールは説明が同じ1文で、名前も「content」と「document」という区別しにくい語です。そのため、一方をウェブ専用の名前と説明に改め、もう一方の説明にも入力の種類と返す内容を書いて、両者の境界をはっきりさせるのが正解です。\n\n誤答の2つは、tool_choiceの強制で選択そのものを迂回するか、フックで誤った選択の後始末をするもので、説明が重複しているという原因に手を付けていません。\n\n本番では、改名後にPDFとウェブの結果が混在する依頼でルーティングの正しさを確認します。\n\n参考: https://platform.claude.com/docs/en/agents-and-tools/tool-use/define-tools"},{"id":19,"scenario":"ツール設計とMCP統合","situation":"あるスポーツデータ分析会社の開発チームは、Claude Agent SDKでマルチエージェントリサーチシステムを構築しています。統合サブエージェントにも、ウェブ検索サブエージェントと同じweb_searchツールを与えています。\n\n最近のレポートでは、統合サブエージェントが自分で追加の検索をした結果、文書分析サブエージェントの検証を経ていない個人ブログの数値が、出典として混ざるようになりました。追加の検索が必要になる場面は、統合の作業全体の1割程度です。","question":"最も適切な改善策はどれですか。","choices":[{"text":"統合サブエージェントに文書分析のツールも与え、検索した資料を自分で検証させる。","explanation":"検索した資料を自分で検証できれば、未検証の情報は減るように見えます。しかし統合サブエージェントに検索と分析のツールをすべて持たせると、役割が肥大化して判断が複雑になり、ツール選択の信頼性も下がります。専門のサブエージェントに分けた構成の意味がなくなります。"},{"text":"統合サブエージェントからweb_searchを外し、追加の調査はコーディネーターに戻す。","explanation":"正解。専門外のツールを持つエージェントは、それを誤用しがちです。統合サブエージェントのツールを役割に必要なものに絞り、追加の調査が必要なときはコーディネーターに戻して、検索と文書分析のサブエージェントに委任し直させれば、検証を経ない情報源が混ざることはなくなります。必要な場面は1割程度なので、往復が増えても全体への影響は限られます。"},{"text":"統合サブエージェントのシステムプロンプトに「web_searchは使わないこと」と書く。","explanation":"プロンプトで使用を控えさせると、検索の回数は減ると考えられます。しかしツールが手元にある限り、モデルが必要だと判断すれば使う可能性は残り、遵守は確率的です。使わせたくないツールは、指示で抑えるより与えないほうが確実です。"},{"text":"統合サブエージェントが検索で得た情報にも、出典の信頼性を付けて区別させる。","explanation":"情報源の種類や信頼性を明示することは、レポートの読み手が情報の確かさを判断するのに役立ちます。しかし統合サブエージェントが検証を経ない情報を集めること自体は止まらず、役割を超えた作業が続きます。統合と検索の関心の分離という問題が解決しません。"}],"answer":[1],"overall":"公式ガイド（タスクステートメント2.3）は、専門外のツールを持つエージェントがそれらを誤用しがちである理由として、統合エージェントがウェブ検索を試みる例を挙げ、各サブエージェントのツールセットをその役割に関連するものに制限するよう求めています。また、複雑なケースはコーディネーター経由でルーティングし、頻度の高いニーズにだけ範囲を限定した役割横断のツールを与えるという考え方も示しています。\n\n本問の追加の検索は全体の1割程度と頻度が低く、検証を経ることが重要なので、コーディネーター経由に戻すのが適切です。\n\n見分け方の決め手は、問題が「未検証の情報が混ざる」ことであり、その原因が統合サブエージェントの手元に検索ツールがあることだと見抜くことです。プロンプトでの禁止は確率的で、信頼性の付記は混入を止めず、ツールの追加は役割をさらに広げます。\n\nAgent SDKでは、サブエージェントのtoolsで使えるツールを明示的に指定できます。本番では、統合サブエージェントが追加の調査を必要とした理由を構造化して返させると、コーディネーターが的を絞った委任をしやすくなります。\n\n参考: https://code.claude.com/docs/en/agent-sdk/subagents"},{"id":20,"scenario":"Claude Codeの設定とワークフロー","situation":"ある鉄道会社の開発チームは、Claude Codeで運行管理システムの開発を進めています。ダイヤを定義する*.schedule.yamlファイルの規約は.claude/rules/schedule.mdにまとめています。paths: [\"lines/**/*.schedule.yaml\"]をそのフロントマターに指定しています。\n\n既存のダイヤ定義ファイルの修正を依頼すると、規約どおりの内容になります。ところが、旧システムのデータからダイヤ定義ファイルを出力する変換スクリプトtools/convert_timetable.pyの改修を依頼したところ、出力されるファイルの書式が規約に反していました。\n\n読み込まれた指示ファイルを記録するInstructionsLoadedフックのログを見ると、このセッションでschedule.mdは一度も読み込まれていません。","question":"最も可能性の高い根本原因はどれですか。","choices":[{"text":"セッションの途中で/compactが実行され、読み込まれていた規約が失われている。","explanation":"/compactの後、pathsを持つルールは一致するファイルを再び扱うまで読み込まれ直さないため、圧縮の後に規約が消えたように見えることは実際にあります。しかしログでは、このセッションでschedule.mdは一度も読み込まれていません。失われる以前に、そもそもコンテキストに入っていなかったので、圧縮では今回の症状を説明できません。"},{"text":"作業の対象が変換スクリプトだけで、pathsに一致するファイルをClaudeが読み書きしていない。","explanation":"正解。pathsを持つルールは起動時には読み込まれず、Claudeが一致するファイルにRead・Write・Editを使ったとき（catのように読み取りに当たるBashコマンドを含む）に初めて読み込まれます。\n\n今回Claudeが扱ったのはtools/convert_timetable.pyだけで、このファイルはlines/**/*.schedule.yamlに一致しないため、規約がコンテキストに入らないまま改修が進みました。スクリプトが書き出すファイルの書式も規約の対象なら、pathsにtools/convert_timetable.pyを加えるなど、規約を必要とする作業で扱うファイルまで範囲に含める必要があります。"},{"text":"ルートのCLAUDE.mdに書かれたPythonの規約が、schedule.mdの規約より優先されている。","explanation":"複数の指示ファイルの内容が矛盾すると、Claudeがどちらか一方に従うことはあります。しかしCLAUDE.mdと.claude/rules/のルールは互いを上書きする関係ではなく、どちらも連結されてコンテキストに入ります。そもそもschedule.mdは読み込まれていないので、指示どうしの優先順位の問題ではありません。"},{"text":"pathsのglobパターンが、lines/配下の深い階層にあるファイルに一致していない。","explanation":"globの範囲が狭すぎて規約が読み込まれないことは、パス固有のルールでよくある失敗です。しかし「**」はディレクトリの階層をまたいで一致するため、lines/配下のどの深さにあるダイヤ定義ファイルにも一致します。既存のダイヤ定義ファイルを修正したときには規約が守られていることからも、パターン自体は機能していると分かります。"}],"answer":[1],"overall":"公式ガイド（タスクステートメント3.3）は、pathsフィールドにglobパターンを持つ.claude/rules/のファイルが、一致するファイルを編集するときにだけ読み込まれ、無関係なコンテキストとトークン使用量を減らす仕組みを挙げています。Claude Codeのドキュメントでも、パスを指定したルールは、Claudeが一致するファイルにRead・Write・Editツールを使ったときに読み込まれると説明されています。\n\nつまり読み込みのきっかけは、作業の話題ではなく、Claudeが扱ったファイルのパスです。本問では、既存のダイヤ定義ファイルを扱う作業では規約が守られ、変換スクリプトだけを扱う作業では読み込まれていません。これはこの仕組みとそのまま一致します。\n\n誤答を除く手がかりは問題文の2つの事実です。既存ファイルの修正では規約が働くのでglobは機能しており、ログでは一度も読み込まれていないので、圧縮や指示の優先順位は原因になりません。\n\n本番では、規約を必要とする作業で扱うファイル（生成スクリプトやテンプレートなど）を洗い出してpathsに含め、InstructionsLoadedフックのログで読み込まれ方を確かめます。\n\n参考: https://code.claude.com/docs/en/memory"},{"id":21,"scenario":"ツール設計とMCP統合","situation":"ある製造業の開発チームは、Claude Agent SDKで開発者の生産性向上ツールを構築しています。エージェントは組み込みツールに加えて、工場の設備データを扱う社内MCPサーバーのquery_plant_telemetryツールを利用できます。現在の設定は次のとおりです。\n\nquery_plant_telemetryは設備IDごとの稼働率と異常フラグを集計して返すが、説明は「テレメトリを照会する」の1文だけ\n\nシステムプロンプトには「不具合の調査では、まずログを検索すること」と書かれている\n\nログを見ると、エージェントは設備の異常に関する質問でもGrepで数GBの生ログを検索し、MCPツールをほとんど使っていません。","question":"改善策として適切なものはどれですか。（2つ選択してください。）","choices":[{"text":"Grepを無効化し、エージェントが設備データをMCPツールからしか取得できないようにする。","explanation":"使わせたくないツールを外すことは、役割外のツールが誤用される場合には有効な手段です。しかしGrepは、ソースコードや設定ファイルの調査など、このツールの本来の用途で必要な組み込みツールです。無効化すると、設備データ以外の調査まで行えなくなり、根本原因である説明の不足も残ったままです。"},{"text":"MCPツールの説明に、返す集計値と異常フラグの内容、生ログ検索より向いている場面を書く。","explanation":"正解。エージェントはツールの説明を主な手がかりにして、どのツールを使うかを決めます。「テレメトリを照会する」だけでは、このツールが設備ごとの集計と異常フラグを一度に返すことが伝わらず、なじみのあるGrepが選ばれがちです。機能と出力を具体的に書き、どんな質問にこのツールを使うべきかを示せば、より高機能なMCPツールが選ばれるようになります。"},{"text":"MCPサーバーの登録先をプロジェクトの.mcp.jsonからユーザースコープの~/.claude.jsonに移す。","explanation":"スコープの使い分けは、チームで共有するサーバーと個人用のサーバーを分けるための設定です。どのスコープで設定しても、接続時にツールが検出されてエージェントから利用可能になる点は同じで、ツールの選ばれやすさは変わりません。また、チームで使うサーバーを個人のスコープに移すと、他のメンバーの環境で使えなくなります。"},{"text":"システムプロンプトの「まずログを検索すること」という一文を、対象を限定した表現に改める。","explanation":"正解。システムプロンプトの中の特定のキーワードに反応する指示は、ツールの説明より優先されて、意図しないツールの関連付けを生むことがあります。「ログを検索する」という一文が、設備の異常の調査でもGrepを選ばせる方向に働いています。「アプリケーションのエラーはログを検索し、設備の異常はquery_plant_telemetryで確認する」のように対象を限定すれば、説明の改善が生きます。"}],"answer":[1,3],"overall":"公式ガイド（タスクステートメント2.4）は、MCPツールの説明を拡充して機能と出力を詳しく説明し、エージェントがGrepなどの組み込みツールを優先してしまうのを防ぐことを挙げています。あわせて、ツールの説明と同じくシステムプロンプトの文言もツール選択に影響し、特定のキーワードに反応する指示が意図しない関連付けを生むことを指摘しています。\n\n本問はこの2つの原因が重なっているため、説明の拡充とシステムプロンプトの見直しの両方が必要です。Anthropicのツール設計の解説でも、ツールの説明はエージェントの振る舞いを大きく左右し、少し改善するだけで成果が大きく変わるとされています。\n\n見分け方の決め手は、症状が「ツールが使えない」ではなく「使えるのに選ばれない」点です。Grepの無効化は選択の問題を強制で抑え込むだけで、スコープの変更は選択に影響しません。\n\n本番では、設備の異常に関する質問を集めた評価セットで、変更前後のMCPツールの選択率を比べます。\n\n参考: https://www.anthropic.com/engineering/writing-tools-for-agents"},{"id":22,"scenario":"エージェントアーキテクチャとオーケストレーション","situation":"あるゲーム会社の開発チームは、継続的インテグレーションのパイプラインにClaude Codeを組み込み、夜間ジョブでテストケースを生成しています。\n\n今回、「ゲームサーバーのレガシーコードに包括的なテストを追加する」という作業を任せたところ、Claudeはディレクトリ名のアルファベット順にファイルを処理し始めました。その結果、一晩の実行予算の大半が、共通ユーティリティの単純な関数のテストに使われました。障害の多い課金モジュールとマッチングモジュールには、1件もテストが追加されませんでした。","question":"このオープンエンドなタスクの分解方法として適切なものはどれですか。（2つ選択してください。）","choices":[{"text":"最初にモジュール構成と依存関係を把握させ、障害履歴や変更頻度から影響の大きい領域を特定させる。","explanation":"正解。オープンエンドなタスクでは、まず全体の構造をつかみ、どこにテストを足すと効果が大きいかを見極めることが分解の出発点になります。課金やマッチングのように障害が多く変更も頻繁な領域を先に特定すれば、限られた夜間の予算をそこへ集中できます。"},{"text":"影響の大きい領域から順に並べた計画を作らせ、新たな依存関係が見つかるたびに計画を更新させる。","explanation":"正解。優先順位付きの計画を作り、調査の途中で見つかった依存関係（課金モジュールが呼ぶ外部決済のラッパーなど）に応じて計画を組み替えるのが動的な分解です。最初の計画にこだわらず発見に合わせて適応するため、テストの追加先が実際の重要度に沿ったものになります。"},{"text":"1回の実行で処理できるファイル数とターン数の上限を引き上げ、すべてのファイルにテストを生成させる。","explanation":"上限の引き上げは、作業量が見積もれていて単に予算が足りない場合には有効な調整です。しかし本問の問題は処理の順番に優先度がないことであり、上限を上げてもアルファベット順に処理する限り、重要な領域に到達するのは最後のままです。コストだけが増え、根本原因には効きません。"},{"text":"全モジュールを同じ粒度のサブタスクに事前に分割し、決めた順番で1つずつ処理するプロンプトチェーンにする。","explanation":"プロンプトチェーンは、手順が毎回同じで予測できる多面的なレビューには適した分解方法です。しかし範囲の決まっていない作業を事前に均等割りすると、どこが重要かを調べる前に順番が決まってしまい、今回と同じく影響の小さい領域から予算を使う結果になりかねません。"}],"answer":[0,1],"overall":"公式ガイド（タスクステートメント1.6）は「レガシーコードベースに包括的なテストを追加する」のような範囲の決まっていない作業について、まず構造を把握し、影響の大きい領域を特定したうえで、依存関係が見つかるたびに適応する優先順位付きの計画を作ることを挙げています。\n\n正解の2つは、この「把握・特定」と「優先順位付きの計画と更新」に当たります。\n\n見分け方の決め手は、問題文の症状が「処理量の不足」ではなく「処理の順番に重要度が反映されていない」ことにある点です。上限の引き上げは量の問題を解き、事前の均等割りは予測できる定型作業向けの分解なので、どちらも順番の問題を解消しません。Anthropicのエージェント設計の解説でも、必要なサブタスクを事前に予測できない作業では、オーケストレーターが入力に応じてタスクを分解する構成が適しているとされています。\n\n本番では、最初のステップの出力として「優先順位付きの対象領域リスト」を成果物に残させると、翌晩のジョブがその続きから作業できます。\n\n参考: https://www.anthropic.com/engineering/building-effective-agents"},{"id":23,"scenario":"コンテキスト管理と信頼性","situation":"ある銀行の開発チームは、Claude Agent SDKでマルチエージェントリサーチシステムを構築しています。融資担当者は、コーディネーターと何十ターンもやり取りしながら、取引先企業の財務状況と業界動向を調べます。会話が長くなると、コーディネーターは古いターンを段階的に要約しています。\n\nところが、序盤で確認した「既存融資の金利3.25%、返済期限2027年3月、担保評価額4.2億円」が、後半では「低金利の長期融資があり、担保も十分」という要約に置き換わり、最終的な比較表の数値が誤っていました。比較表は、コーディネーター自身が会話の内容をもとに作成しています。","question":"数値が誤った最も可能性の高い根本原因はどれですか。","choices":[{"text":"「lost in the middle」効果で、長い入力の中間にある数値が見落とされている。","explanation":"「lost in the middle」効果は、長い入力の中間にある情報が見落とされやすい現象で、重要な情報を入力のどこに置くかを工夫すべき場面で考慮します。しかしこの効果は、情報が入力に含まれていることが前提です。本問では、正確な数値はすでに要約で消えており、入力のどこにも残っていません。"},{"text":"融資担当者の発言とツールの結果が混在し、どの数値が確定値かを区別できていない。","explanation":"複数の情報源から集めた値が混在すると、どれが確定値かを判断できなくなることはあります。しかし本問の要約には、別の値と取り違えた数値ではなく、数値を含まないあいまいな表現が残っています。値の取り違えではなく、値そのものが要約で失われたことが原因です。"},{"text":"金利や期限などの事実が、要約される会話履歴の中にしか存在しない。","explanation":"正解。段階的な要約は、古いターンを短くするたびに数値や日付をあいまいな表現に置き換えがちです。金利・返済期限・担保評価額のような取引に関する事実が、要約の対象である会話履歴の中にしかなければ、要約が進むほど正確な値は失われ、後半の比較表はあいまいな要約から作られます。対処としては、これらの事実を要約とは別の「ケースの事実情報」ブロックに抜き出し、毎回のプロンプトに含めます。"},{"text":"会話がコンテキストウィンドウの上限を超え、序盤のターンが切り捨てられている。","explanation":"コンテキストウィンドウの上限を超えて古い内容が失われることは、長い会話で実際に起こりえます。しかし本問の序盤の数値は、消えたのではなく「低金利の長期融資があり、担保も十分」という要約に置き換わっています。切り捨てではなく、要約の過程で数値があいまいになったことを示す症状です。"}],"answer":[2],"overall":"公式ガイド（タスクステートメント5.1）は、段階的な要約によって数値、パーセンテージ、日付、顧客が述べた期待があいまいな要約に圧縮されてしまうリスクを挙げ、取引に関する事実（金額、日付、番号、ステータス）を、要約された履歴の外に置かれ各プロンプトに含まれる永続的な「ケースの事実情報」ブロックに抽出することを求めています。\n\n本問の症状は、まさにこの段階的な要約による数値の劣化で、その根本には、事実が要約の対象である会話履歴の中にしかないという設計があります。Anthropicのコンテキストエンジニアリングの解説でも、長時間のタスクではコンテキストの外に構造化した記録を持ち、必要なときに参照させる手法が紹介されています。\n\n原因を絞り込む手がかりは、後半に残っていたのが「数値を含まないあいまいな要約」だったという事実です。切り捨てなら記述そのものが消え、lost in the middleなら数値は入力に残り、取り違えなら別の数値が現れるはずで、いずれも今回の症状とは合いません。\n\n本番では、ケースの事実情報ブロックに値の出典（どの資料の何ページか）も添えると、比較表の数値を後から検証できます。\n\n参考: https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents"},{"id":24,"scenario":"エージェントアーキテクチャとオーケストレーション","situation":"ある製薬会社の開発チームは、Claude Agent SDKでマルチエージェントリサーチシステムを構築しています。文書分析サブエージェントは、臨床試験の論文から得た知見を、「〜という結果が報告されている（Smith et al., 2024, p.12）」のように出典を文中に埋め込んだ文章で返しています。\n\n統合サブエージェントがこれらを言い換えてまとめる過程で、知見と出典の組み合わせがずれ、最終レポートの約15%の引用で、別の論文の結論が紐づいていました。","question":"最も適切な改善策はどれですか。","choices":[{"text":"統合サブエージェントのプロンプトに「出典は正確に保つこと」と明記し、言い換えを控えさせる。","explanation":"プロンプトで注意を促すと、出典の取り違えをある程度減らすことはできます。しかし文中に埋め込まれた出典は、言い換えや並べ替えのたびに本文から切り離されやすく、指示だけでは対応関係を確実には守れません。構造そのものが対応付けを保持していないことが根本原因です。"},{"text":"文書分析サブエージェントの出力を要約せず、論文の全文をそのまま統合サブエージェントに渡す。","explanation":"元の文書を参照できるようにすることは、検証が必要な場面では役に立ちます。しかし全文を渡すと統合サブエージェントのコンテキストを大きく圧迫し、どの部分が知見なのかを改めて読み取らせることになります。知見と出典の対応付けを保つという課題も解決しません。"},{"text":"知見の本文と、URLやページ番号などのメタデータを分けた形式で返させる。","explanation":"正解。知見の内容と出典のメタデータを別々のフィールドに持つ構造化データにすれば、統合サブエージェントが本文を言い換えても、どの知見がどの文書のどのページに基づくかという対応はデータとして残ります。下流のエージェントは、このメタデータを引き継ぐだけで出典を正しく付けられます。"},{"text":"レポートの完成後に別のエージェントで各主張の出典を検索し直し、引用を付け直す。","explanation":"事後に出典を確認する工程は、品質チェックとして加える価値はあります。しかし一度失われた対応付けを検索で復元しようとすると、似た結論の別の論文を誤って紐づけるおそれがあり、手間も大きくなります。対応付けを最初から失わない設計のほうが確実です。"}],"answer":[2],"overall":"公式ガイド（タスクステートメント1.3）は、エージェント間でコンテキストを渡す際に情報源を保持するため、構造化データ形式を使ってコンテンツとメタデータ（ソースURL、文書名、ページ番号）を分けることを挙げています。\n\n本問では出典が文章の中に埋め込まれているため、統合の段階で文が言い換えられると、知見と出典の結び付きが簡単に崩れます。メタデータを別のフィールドにしておけば、本文がどれだけ書き換えられても対応はデータとして保たれます。\n\n見分け方の決め手は、引用の誤りが「言い換えの過程」で起きているという点です。プロンプトでの注意は確率的な対策にとどまり、全文の受け渡しはコンテキストを圧迫するだけで、事後の付け直しは失われた対応を推測で埋めることになります。Anthropicのマルチエージェントリサーチシステムの解説でも、調査結果に出典を正しく付ける工程が品質の要とされています。\n\n本番では、知見ごとに一意のIDを振り、レポートの各主張がどのIDに基づくかを残すと、後から検証できます。\n\n参考: https://www.anthropic.com/engineering/multi-agent-research-system"},{"id":25,"scenario":"コンテキスト管理と信頼性","situation":"ある通信事業者の開発チームは、Claude Agent SDKで開発者の生産性向上ツールを構築しています。このエージェントは、不慣れなコードベースの調査をフェーズ1（課金バッチの依存関係の洗い出し）、フェーズ2（改修箇所の特定）のように分け、フェーズごとに新しいサブエージェントを起動します。\n\nログを確認したところ、フェーズ2のサブエージェントは、フェーズ1が調べ終えた38個のファイルをReadで読み直しており、トークン使用量の約半分がその重複に使われていました。フェーズ2への委任プロンプトには、「改修箇所を特定してください」という依頼文だけが書かれています。","question":"最も可能性の高い根本原因はどれですか。","choices":[{"text":"フェーズ2のサブエージェントにGrepが許可されておらず、Readで1ファイルずつ開くしか調べる手段がない。","explanation":"Grepが使えないと内容検索ができず、Readでファイルを順に開くしかなくなるため、探索が非効率になることは実際にあります。しかし本問の症状は「フェーズ1が調べ終えたファイルを読み直す」ことであり、検索手段の有無ではなく、調べ終えた事実を知らないことが原因です。Grepがあっても、前フェーズの結論を知らなければ同じ調査をやり直します。"},{"text":"フェーズ2のサブエージェントのmax_turnsが小さく、上限に達するたびに調査を最初からやり直している。","explanation":"max_turnsは実行が長引きすぎるのを防ぐ上限で、上限に達すると実行はエラーの結果で終了します。上限に達しても自動で最初からやり直す仕組みではないため、同じファイルの読み直しの説明にはなりません。また、問題文には上限到達を示すログの記述もありません。"},{"text":"コーディネーターのコンテキストウィンドウが上限に近づき、フェーズ1の調査結果が自動的に圧縮されている。","explanation":"長いセッションでは自動的な圧縮によって細部が失われることがあり、コーディネーター自身の判断がぶれる原因にはなります。しかしサブエージェントはコーディネーターの会話履歴をもともと引き継がないため、圧縮の有無にかかわらず、委任プロンプトに書かれていない情報は届きません。本問の重複は圧縮ではなく受け渡しの欠落で説明できます。"},{"text":"フェーズ1の主要な調査結果が要約されず、フェーズ2のサブエージェントの初期コンテキストに含まれていない。","explanation":"正解。サブエージェントは分離されたコンテキストで動き、親や前のサブエージェントの調査内容を自動的には受け取りません。フェーズ1の主要な調査結果（依存関係の一覧、確認済みのファイルと結論）を要約して委任プロンプトに注入すれば、フェーズ2はその結論を前提に改修箇所の特定だけに集中できます。"}],"answer":[3],"overall":"Agent SDKのサブエージェントは独立した新しいコンテキストで起動し、呼び出し元の会話履歴を見ません。そのため公式ガイド（タスクステートメント5.4）は、次のフェーズのサブエージェントを起動する前に、前の探索フェーズの主要な調査結果を要約して初期コンテキストに注入することを挙げています。\n\n本問では委任プロンプトに依頼文しかないので、フェーズ2はフェーズ1の結論を知らず、同じ38ファイルを読み直すしかありません。\n\n誤答の見分け方の決め手は、問題文が委任プロンプトの中身をわざわざ示している点です。Grepの不足や圧縮、max_turnsはいずれも別の症状（検索の非効率、判断のぶれ、途中終了）を生む要因で、「調べ終えたことを知らない」という今回の症状には直接つながりません。\n\n本番では、各フェーズの出力を「確認済みファイル・判明した依存関係・未解決の疑問」の形で要約させ、そのまま次のフェーズのプロンプトに入れる運用にすると重複を防げます。\n\n参考: https://code.claude.com/docs/en/agent-sdk/subagents"},{"id":26,"scenario":"Claude Codeの設定とワークフロー","situation":"ある化学メーカーの開発チームは、Claude Codeでプロジェクト用のスキルを2つ作りました。\n\n1つは、安全データシート（SDS）のYAMLファイルの記載形式を確認するsds-checkです。SDSのファイルを編集するたびに使ってほしいのですが、descriptionが「SDS用」だけのため、Claudeが自動で使うことはほとんどありません。\n\nもう1つは、製造ロットの出荷判定を記録して社内システムに登録するrelease-lotです。担当者が明示的に実行したときだけ動かしたいのに、関連する会話の中でClaudeが自動で呼び出したことがありました。","question":"適切な設定はどれですか。（2つ選択してください。）","choices":[{"text":"release-lotのフロントマターにdisable-model-invocation: trueを設定する。","explanation":"正解。disable-model-invocationをtrueにしたスキルは、Claudeが自動で読み込むことがなくなり、/release-lotのように明示的に呼び出したときだけ実行されます。社内システムへの登録のような副作用のある操作を、担当者の意図したタイミングでだけ動かしたい場合に適した設定です。"},{"text":"2つのスキルの内容をCLAUDE.mdに移し、どの会話でも常に読み込まれる状態にする。","explanation":"CLAUDE.mdは、すべての作業に共通する標準を常に読み込ませる場所です。特定の作業でだけ必要な手順をここに移すと、無関係な作業でもコンテキストを消費します。また、出荷判定の登録手順が常に読み込まれると、明示的に実行したときだけ動かすという要件からはかえって遠ざかります。"},{"text":"release-lotにargument-hintを設定し、ロット番号の入力を促して自動実行を防ぐ。","explanation":"argument-hintは、スキルを呼び出すときの補完で、期待する引数を開発者に示すためのフロントマターです。引数の入力を促す効果はありますが、Claudeが自動でスキルを読み込むかどうかには影響しません。自動での呼び出しを防ぐ設定ではありません。"},{"text":"sds-checkのdescriptionに、確認する内容と使うべき場面を書く。","explanation":"正解。Claudeは、スキルのdescriptionをもとに、今の依頼でそのスキルを使うべきかどうかを判断します。「SDS用」だけでは何をするスキルなのかが伝わらず、自動で選ばれません。「SDSのYAMLファイルの必須項目と記載形式を確認する。SDSファイルを作成・編集したときに使う」のように具体的に書けば、適切な場面で使われるようになります。"}],"answer":[0,3],"overall":"スキルがいつ使われるかは、フロントマターで制御できます（タスクステートメント3.2）。Claude Codeのドキュメントによると、スキルはClaudeが関連すると判断したときに自動で適用されるほか、/スキル名で直接呼び出すこともでき、その判断にはdescriptionが使われます。\n\nまた、disable-model-invocationをtrueにすると、Claudeがスキルを自動で読み込むのを防ぎ、手動の呼び出しに限定できます。副作用のあるワークフローにはこの設定が勧められています。本問の2つのスキルは、それぞれ「自動で使われない」「自動で使われてしまう」という逆の問題を抱えており、前者にはdescriptionの改善、後者にはdisable-model-invocationが対応します。\n\n見分け方の決め手は、各フロントマターが何を制御するかを正確に区別することです。argument-hintは補完時の表示だけを変え、CLAUDE.mdへの移動はオンデマンドで読み込むというスキルの利点を捨てます。\n\n本番では、sds-checkのdescriptionを書き換えた後、SDSファイルを編集する依頼でスキルが選ばれるかを実際に確かめます。\n\n参考: https://code.claude.com/docs/en/skills"},{"id":27,"scenario":"ツール設計とMCP統合","situation":"ある消費者金融会社の開発チームは、Claude Agent SDKでカスタマーサポート解決エージェントを構築しています。process_refundツールは、1回あたりの返金上限（10万円）を超える依頼に対して、isError: trueと「Operation failed」という文字列だけを返します。\n\nログでは、上限を超える返金依頼のたびに、エージェントが同じ呼び出しを4〜5回繰り返したうえで、顧客に「現在システム障害が発生しています」と誤った案内をしていました。","question":"process_refundのエラーレスポンスの改善として適切なものはどれですか。（2つ選択してください。）","choices":[{"text":"エラーを一時的なエラーに分類し、エージェントが指数バックオフで間隔を空けてリトライするようにする。","explanation":"一時的なエラーとして指数バックオフでリトライさせるのは、タイムアウトやサービスの一時的な利用不可のように、時間を置けば成功しうる失敗には適した設計です。しかし返金上限の超過は、何度呼び出しても結果が変わらないビジネスルール違反です。一時的なエラーと伝えると、今の無駄なリトライがむしろ正当化されてしまいます。"},{"text":"「1回の返金上限は10万円で、超える分は担当部署の審査が必要」という顧客向けの説明を含める。","explanation":"正解。顧客にわかりやすい説明をエラーに含めておけば、エージェントはそれをもとに、なぜ処理できないのかと次に何が起きるのかを正確に伝えられます。汎用的な「Operation failed」だけでは、エージェントは理由を推測するしかなく、今回のような「システム障害」という誤った案内につながります。"},{"text":"ビジネスルール違反であることを示す分類とともに、isRetryable: falseを返す。","explanation":"正解。失敗の種類とリトライの可否を構造化されたメタデータとして返せば、エージェントは「同じ呼び出しを繰り返しても無駄だ」と判断でき、4〜5回の無駄なリトライがなくなります。分類からシステム障害ではないことも分かるので、顧客への誤った案内も防げます。"},{"text":"エラーにする代わりに空の成功結果を返し、エージェントが次の手順へ進めるようにする。","explanation":"失敗を成功として返すと、エージェントは返金が処理されたのか、されなかったのかを区別できなくなります。顧客に「返金を受け付けました」と誤って伝えるおそれがあり、エラーを黙って握りつぶすアンチパターンに当たります。エラーであることは隠さず、その中身を具体的に伝える必要があります。"}],"answer":[1,2],"overall":"公式ガイド（タスクステートメント2.2）は、一律のエラーレスポンス（汎用的な\"Operation failed\"）ではエージェントが適切な復旧の判断を下せないこと、そしてビジネスルール違反にはリトライ不可を示すフラグと顧客にわかりやすい説明を含めるべきことを挙げています。MCPの仕様でも、ビジネスロジックのエラーはisErrorをtrueにしたツール実行エラーとして結果に含め、モデルが内容を読んで対処できるようにするとされています。\n\n本問では、エラーの中身が空であるために、エージェントが「繰り返せば通るかもしれない」「システム障害だろう」と誤って推測しています。\n\n見分け方の決め手は、上限超過が時間を置いても解消しない失敗だという点です。一時的なエラーへの分類は誤った情報を与えてリトライを助長し、空の成功結果はエラーそのものを隠します。\n\nなお、エラーカテゴリの名前はアプリケーション側で設計するもので、特定の列挙値を覚える必要はありません。本番では、上限超過の場合にescalate_to_humanへ引き継ぐことも説明に書いておくと、エージェントが次の手順を迷わずに選べます。\n\n参考: https://modelcontextprotocol.io/specification/2026-07-28/server/tools"},{"id":28,"scenario":"エージェントアーキテクチャとオーケストレーション","situation":"ある教育サービス企業の開発チームは、Claude APIで開発者の生産性向上ツールを構築しています。現在の実装では、質問を受けると、アプリ側のコードが次の順序を固定で実行し、各ステップの後にClaudeを呼び出しています。\n\nGlobでファイルを探す\n\nGrepで検索する\n\n上位5ファイルをReadで読む\n\n回答する\n\nテストの実行結果を確かめないと答えられない質問や、5ファイル以上を読む必要がある質問では、的外れな回答が返っています。","question":"この実装の見直しとして適切なものはどれですか。（2つ選択してください。）","choices":[{"text":"ツールを定義してループに渡し、次にどのツールを呼ぶかは結果を見たClaudeに判断させる。","explanation":"正解。モデル主導の判断では、Claudeがそれまでのツールの結果とコンテキストをもとに、次に呼ぶツールを推論します。テストを実行すべき質問ならBashを、さらに読むべきファイルがあればReadを追加で選べるので、固定の順序では扱えなかった質問にも対応できます。"},{"text":"反復回数の上限を5回に固定し、5回目のツール実行が終わったら回答させる。","explanation":"反復回数の上限は、ループが止まらなくなったときの安全策として設けるのが適切です。主な停止条件として使うと、まだ調査が必要な質問でも途中で打ち切られ、逆に早く答えられる質問でも余分な実行が起きます。終了はstop_reasonで判断すべきです。"},{"text":"各ツールのdescriptionに、用途とほかのツールとの使い分けを書く。","explanation":"正解。モデル主導の判断では、Claudeはツール定義のdescriptionを手がかりに、どのツールをいつ使うかを決めます。\n\nGlobはファイル名での検索、Grepは内容の検索、Bashはテストの実行というように用途と使い分けを書いておけば、テストの結果を確かめないと答えられない質問でBashを選ぶ、といった判断ができるようになります。順序の固定をやめてClaudeに判断を任せるなら、その判断材料も合わせて整える必要があります。"},{"text":"質問の種類ごとに分岐を増やし、テストの実行が必要な質問用の固定手順を追加する。","explanation":"事前に設定した決定木は、手順が毎回同じで予測できる定型処理には向いています。しかし開発者の質問は内容がさまざまで、分岐を増やしても想定外の質問が来るたびに手順を足し続けることになります。どのツールが必要かは、途中で分かった情報によって変わるため、固定の手順では追いつきません。"}],"answer":[0,2],"overall":"公式ガイド（タスクステートメント1.1）は、Claudeがコンテキストに基づいて次に呼び出すツールを推論するモデル主導の判断と、事前に設定された決定木やツールシーケンスとの違いを理解することを求めています。\n\n本問の実装は後者で、順序をアプリ側で固定しているため、途中で分かった情報に応じて手順を変えられません。正解の2つは、ツールの選択をClaudeに任せることと、その選択の手がかりになるツールの説明を整えることの組み合わせです。Claudeのツール定義のドキュメントでも、ツールが何をするか、いつ使うべきかを詳しく説明することが、ツールの性能に最も大きく影響するとされています。\n\nうまくいかない質問が「必要な手順が質問ごとに違う」ものだという点に注目すると、分岐の追加は決定木を大きくするだけで、反復回数の固定は主な停止条件として上限を使うアンチパターンに当たると分かります。\n\nなお、ループ自体は、stop_reasonが\"tool_use\"の間はツールを実行して結果を返し、\"end_turn\"で終える形で実装します。Agent SDKを使えばこのループはSDKが担うため、自作する場合に限って必要な制御です。本番では、反復回数の上限は暴走を防ぐ安全策として十分大きな値で残します。\n\n参考: https://platform.claude.com/docs/en/agents-and-tools/tool-use/define-tools"},{"id":29,"scenario":"ツール設計とMCP統合","situation":"ある自治体の情報政策課の開発チームは、Claude Agent SDKでマルチエージェントリサーチシステムを構築しています。他自治体の施策を調べる際、文書分析サブエージェントは汎用のanalyze_documentツールだけを使い、次の3つの用途をこの1つのツールで処理しています。\n\nデータを抜き出す\n\n要約する\n\n主張を出典と照合する\n\nその結果、同じ依頼でも出力の形式が毎回異なり、コーディネーターが結果を解析できない事態が週に数十件起きています。","question":"改善策として適切なものはどれですか。（2つ選択してください。）","choices":[{"text":"analyze_documentの説明に3つの用途それぞれの手順を書き込み、1つのツールで対応させる。","explanation":"説明を充実させることは、ツールの用途を正しく伝えるうえで基本となる対策です。しかし1つのツールが3つの異なる出力を返す構造のままでは、どの形式の結果が返るかは呼び出しのたびに変わり、コーディネーターは結果を一定の形で解析できません。用途ごとに入出力が違う処理を1つにまとめていることが、問題の根本です。"},{"text":"用途ごとに、extract_data_pointsなどの目的別のツールに分割する。","explanation":"正解。汎用のツールを、extract_data_points・summarize_content・verify_claim_against_sourceのような目的別のツールに分ければ、モデルは用途に合ったツールを選び、各ツールは決まった形の結果を返します。コーディネーターも、呼ばれたツールの名前から結果の形式を判断できます。"},{"text":"ツールごとに受け取る引数と返すフィールドを定め、入出力の仕様を説明に書く。","explanation":"正解。目的別のツールそれぞれについて、受け取る引数と返すフィールドを入出力の仕様として定めておけば、結果の形式が毎回そろいます。たとえばverify_claim_against_sourceなら「主張・出典ID」を受け取り「一致/不一致・該当箇所の抜粋」を返す、と決めておくと、コーディネーターは機械的に解析できます。"},{"text":"分析結果を自由形式の文章で返させ、コーディネーター側で用途に合わせて解釈させる。","explanation":"自由形式の文章は、人が読むレポートの最終出力には向いています。しかしエージェント間の受け渡しで形式を決めずにおくと、コーディネーターが毎回文章を読み解く必要があり、解析できない件数はむしろ増えます。形式のばらつきを受け手に押し付けるだけで、原因は解消しません。"}],"answer":[1,2],"overall":"公式ガイド（タスクステートメント2.1）は、汎用的なanalyze_documentを、入出力の仕様が定義された目的別のツール（extract_data_points、summarize_content、verify_claim_against_source）に分割することを挙げています。\n\n用途ごとに受け取るものと返すものが違う処理を1つのツールにまとめると、どの形式の結果が返るかがモデルの判断に左右され、下流での解析が不安定になります。目的別に分けたうえで、それぞれの入出力の仕様を明示すれば、ツールの選択と結果の形式の両方が安定します。\n\n見分け方の決め手は、症状が「出力の形式が毎回違う」ことであり、原因がツールの粒度にあると見抜くことです。説明の追加は粒度を変えず、自由形式の文章はばらつきを受け手に移すだけです。Anthropicのエージェント設計の解説でも、エージェントとツールの間のインターフェースはプロンプトと同じくらい丁寧に設計すべきだとされています。\n\n本番では、各ツールの出力スキーマをコーディネーター側の検証にも使い、形式が崩れた結果を早期に検出します。\n\n参考: https://www.anthropic.com/engineering/building-effective-agents"},{"id":30,"scenario":"ツール設計とMCP統合","situation":"ある製薬会社の開発チームは、Claude Agent SDKでマルチエージェントリサーチシステムを構築しています。文献データベースを検索するサブエージェントは、レート制限（HTTP 429）やタイムアウトが起きるたびに、そのエラーをそのままコーディネーターに返しています。\n\nコーディネーターはそのたびに同じ検索を委任し直しており、ログではコーディネーターのトークンの約30%がこうしたエラーの処理に使われていました。エラーの多くは、数秒待てば成功するものです。","question":"最も適切な改善策はどれですか。","choices":[{"text":"エラーが一定回数を超えたら、ワークフロー全体を停止して担当者に通知する。","explanation":"異常が続くときに処理を止めて人に知らせる仕組みは、障害が長引く場合の安全策としては意味があります。しかし本問のエラーの多くは数秒で解消する一時的なもので、全体を止めると他の検索の成果まで無駄になります。1つの失敗でワークフロー全体を終了させるのと同じ問題を抱えます。"},{"text":"サブエージェントでエラーを捕捉し、取得できた分だけを成功の結果として返す。","explanation":"部分的な結果を返すこと自体は有用ですが、失敗があった事実を伝えずに成功として返すと、コーディネーターは検索が不完全であることに気づけません。エラーを黙って握りつぶすアンチパターンに当たり、文献の欠落したレポートができるおそれがあります。"},{"text":"コーディネーターに、エラーの再委任だけを担当するリトライ専用のサブエージェントを追加する。","explanation":"役割ごとにサブエージェントを分けるのは、マルチエージェント構成では一般的な設計です。しかし一時的なエラーが毎回コーディネーターまで上がってくる流れは変わらず、リトライのための委任の往復もむしろ増えます。数秒で解決する失敗を、遠回りして処理することになります。"},{"text":"一時的な失敗はサブエージェント内でリトライし、解決しないものだけを伝播させる。","explanation":"正解。レート制限やタイムアウトのような一時的なエラーは、サブエージェントの中で間隔を空けてリトライすれば多くが解決します。ローカルで解決できなかったエラーだけを、試行した内容と部分的な結果とともにコーディネーターに伝えれば、コーディネーターは本当に判断が必要な失敗にだけコンテキストを使えます。"}],"answer":[3],"overall":"公式ガイド（タスクステートメント2.2）は、一時的な失敗についてはサブエージェント内でローカルにエラー復旧を実装し、ローカルで解決できないエラーだけを、部分的な結果や試行した内容とともにコーディネーターに伝播することを挙げています。\n\n本問の現状は、数秒待てば成功する一時的なエラーまでコーディネーターに上げており、コーディネーターのコンテキストとトークンを浪費しています。\n\n見分け方の決め手は、エラーの性質が「時間を置けば解決する一時的なもの」だと読み取ることです。リトライ専用のサブエージェントは処理の場所を変えるだけで往復を減らさず、成功として返す案は失敗を隠し、全体の停止は一時的な失敗に過剰に反応します。Anthropicのマルチエージェントリサーチシステムの解説でも、エラーへの対処の仕組みをシステムに組み込みつつ、エージェントに状況を伝えて適応させる重要性が述べられています。\n\n本番では、ローカルでのリトライ回数に上限を設け、上限に達したときはその回数と最後のエラーの内容をコーディネーターに返します。\n\n参考: https://www.anthropic.com/engineering/multi-agent-research-system"},{"id":31,"scenario":"エージェントアーキテクチャとオーケストレーション","situation":"ある航空会社の開発チームでは、エンジニアがClaude Codeで複数の調査を並行して進めています。あるエンジニアは、次の3つの調査を、それぞれ別のセッションで数日にわたって続けています。\n\n運航管理システムの遅延通知の不具合\n\n整備記録のエクスポートの性能問題\n\n乗務員スケジュールの移行準備\n\n毎朝claude --continueで作業を再開していますが、直前に触っていた別の調査のセッションが開いてしまい、説明をやり直す手間がかかっています。","question":"最も適切な対処はどれですか。","choices":[{"text":"--continueに--fork-sessionを付けて、元のセッションを残したまま再開する。","explanation":"--fork-sessionは、元のセッションを残したまま、別のアプローチを試すための分岐を作るフラグです。しかし分岐元は--continueで選ばれる最新のセッションのままなので、開くセッションを選べないという問題は解決しません。不要な分岐のセッションが増えるだけです。"},{"text":"調査ごとの進捗をCLAUDE.mdに書き残し、毎朝新しいセッションを開始する。","explanation":"前回の調査結果が古くなっている場合は、要約を渡して新しいセッションを始めるほうが信頼できることもあります。しかしCLAUDE.mdは常に読み込まれるプロジェクトの指示を置く場所で、3つの調査の進捗を混ぜると、どの作業でも無関係な内容が読み込まれます。前日までの文脈がおおむね有効な今回は、セッションを再開するほうが手間がかかりません。"},{"text":"毎回--continueで再開し、違う調査のセッションだったら/clearしてから説明し直す。","explanation":"/clearは、無関係な作業の間でコンテキストをリセットしたいときに使うコマンドです。しかし/clearで消えるのは開いてしまったセッションの文脈であり、目的のセッションに移れるわけではありません。説明をやり直す手間という問題そのものが残ります。"},{"text":"各セッションに/renameで名前を付け、claude --resumeに名前を指定して再開する。","explanation":"正解。--continueは現在のディレクトリで最も新しいセッションを開くため、複数の調査を並行していると、意図しないセッションが開きます。/renameやclaude -nでセッションに名前を付けておけば、「claude --resume delay-notice」のように名前を指定して、目的の調査のセッションを直接再開できます。"}],"answer":[3],"overall":"公式ガイド（タスクステートメント1.7）は、特定の過去の会話を続行するために--resumeでセッション名を指定し、複数の作業セッションにまたがって名前付きの調査セッションを続けることを挙げています。\n\nClaude Codeのドキュメントでも、claude --continueは現在のディレクトリの最新のセッションを開き、claude --resumeに名前を渡すとそのセッションを直接再開でき、名前は起動時のclaude -nやセッション中の/renameで付けられると説明されています。本問の手間は、--continueが「最新」という基準でしかセッションを選べないことから生じています。\n\n見分け方の決め手は、要件が「並行する複数のセッションの中から目的のものを開く」ことだと捉えることです。/clearはセッションを切り替えず、--fork-sessionは分岐を作るだけで、CLAUDE.mdへの記録は有効な文脈を捨てて新規開始することになります。\n\n本番では、名前を調査内容が分かるもの（delay-notice、export-perfなど）にしておくと、セッションピッカーでも見つけやすくなります。\n\n参考: https://code.claude.com/docs/en/sessions"},{"id":32,"scenario":"コンテキスト管理と信頼性","situation":"ある物流会社の開発チームは、Claude Agent SDKでマルチエージェントリサーチシステムを構築しています。「国内の倉庫自動化の動向」についてのレポートでは、次の3種類の内容を扱います。\n\n上場各社の設備投資額と営業利益率の比較\n\n業界ニュースの経緯\n\nロボットの技術仕様の調査結果\n\n現在のレポート生成サブエージェントは、すべての内容を同じ箇条書きの形式に変換しており、読者から「数値を比較しにくい」「ニュースの流れが分からない」という声が出ています。","question":"最も適切な改善策はどれですか。","choices":[{"text":"レポート全体の形式を箇条書きから表に改め、全項目を列にそろえる。","explanation":"表は、各社の設備投資額や利益率のように同じ項目を並べて比べる財務データには最適な形式です。しかしニュースの経緯のように因果や時間の流れを伝える内容を表の列に押し込むと、出来事のつながりが読み取れなくなります。箇条書きを表に置き換えても、すべてを1つの形式にそろえる問題は残ります。"},{"text":"財務データは文章で解説し、ニュースと技術仕様は表にまとめる。","explanation":"内容の種類で表現を分ける方向は正しいのですが、割り当てが逆です。複数社の設備投資額や利益率を文章で書くと、読者は数値を探して読み比べる必要があり、比較しにくさは解消しません。ニュースの経緯を表の列に分けると、出来事の因果や時間の流れも読み取りにくくなります。"},{"text":"汎用テンプレートを1つ用意し、全セクションを同じ見出し構成で出力させる。","explanation":"テンプレートによる構成の統一は、レポートの体裁をそろえて読み手が目的の情報を探しやすくするには役立ちます。しかし内容の種類が違うセクションを同じ構成で出力させると、今と同じように、比較や経緯の説明に合わない形式が使われ続けます。"},{"text":"財務データは表、ニュースは文章、技術仕様は構造化リストで表現させる。","explanation":"正解。内容の種類ごとに適した表現を使えば、財務データは表で数値を横に比べられ、ニュースは文章で経緯と背景が伝わり、技術仕様は構造化されたリストで項目ごとに確認できます。読者の2つの不満に、それぞれ直接応えられます。"}],"answer":[3],"overall":"公式ガイド（タスクステートメント5.6）は、すべてを画一的な形式に変換するのではなく、統合の出力ではコンテンツの種類ごとに適切な表現を用いること（財務データは表、ニュースは文章、技術的な調査結果は構造化されたリスト）を挙げています。\n\n本問の読者の不満は、数値の比較とニュースの流れという、性質の違う内容が同じ箇条書きにされていることから生じています。正解は、内容の種類に応じて表現を使い分けることです。Anthropicのプロンプトのベストプラクティスでも、出力の形式は望む形を具体的に指示し、用途に合わせて制御すべきだとされています。\n\n見分け方の決め手は、各内容に適した表現を正しく対応させているかどうかです。表への統一とテンプレートの統一は画一化そのものを残し、財務データを文章にする案は、表現を分けてはいても内容との対応を誤っています。\n\n本番では、統合サブエージェントが各調査結果に内容の種類（財務・ニュース・技術）のラベルを付けて渡すと、レポート生成側で表現を確実に切り替えられます。\n\n参考: https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices"},{"id":33,"scenario":"プロンプトエンジニアリングと構造化出力","situation":"ある日用品メーカーの開発チームは、Claudeで構造化データ抽出システムを構築しています。取引先から届く商品仕様書から、商品名・内容量・希望小売価格・JANコードを抽出し、商品マスターへ登録します。\n\n以前は応答のテキストからJSONを取り出していたため、構文エラーで処理が止まることがありました。JSONスキーマを入力パラメータにした抽出ツールをtool_useで呼び出す方式に変えたところ、構文エラーはなくなりました。しかし、内容量の「500」が希望小売価格のフィールドに入るなど、値が誤ったフィールドに入る誤りが約4%残っています。","question":"この状況への対応として適切なものはどれですか。（2つ選択してください。）","choices":[{"text":"各フィールドの説明に単位と仕様書上の記載位置を明記し、値の取り違えが起きにくくする。","explanation":"正解。スキーマの各プロパティのdescriptionは、モデルがどの値をどのフィールドに入れるかを判断する手がかりになります。「希望小売価格は税抜の円単位、仕様書の価格欄から取る」「内容量はgまたはml」のように単位と記載位置を書けば、数値どうしの取り違えを減らせます。"},{"text":"tool_choiceで抽出ツールを強制的に選択させ、毎回必ずこのツールが呼ばれるようにする。","explanation":"強制的なツール選択は、モデルがツールを呼ばずにテキストで答えてしまう問題や、特定の抽出を最初に実行させたい場面で有効です。しかし本問では抽出ツールはすでに呼ばれており、問題はツールに渡される値の中身です。どのツールを呼ぶかを固定しても、フィールドの取り違えは減りません。"},{"text":"ツール定義にstrict: trueを追加し、出力がスキーマに準拠することを保証して誤りを防ぐ。","explanation":"strictをtrueにする設定は、ツールの入力が型や必須項目などのスキーマに必ず一致するようにする機能で、型の違う値や項目の欠落を防ぐには有効です。しかし本問の誤りは、正しい型の値が別のフィールドに入っているもので、スキーマ準拠の範囲では見分けられません。構文と型が正しくても、意味的なエラーは残ります。"},{"text":"価格と内容量の桁や単位の整合など、意味的な正しさはアプリケーション側の検証コードで確認する。","explanation":"正解。ツール使用による厳密なスキーマは構文エラーをなくしますが、値の意味が正しいかまでは保証しません。内容量と価格がどちらも数値なら、取り違えてもスキーマ上は正しい出力です。単位や桁の整合、JANコードのチェックディジットなどをコードで検証し、不一致は検証エラーを添えてリトライするか、レビューに回します。"}],"answer":[0,3],"overall":"公式ガイド（タスクステートメント4.3）は、JSONスキーマを用いたツール使用がスキーマに準拠した出力を保証して構文エラーを排除する一方で、合計と一致しない明細や誤ったフィールドに入った値のような意味的なエラーは防げないことを挙げています。\n\n本問は構文エラーが解消した後に残る意味的なエラーへの対処なので、スキーマの外で意味を確かめる検証コードと、取り違えを起こしにくくするフィールドの説明の2つが正解になります。\n\n見分け方の決め手は、残っている誤りが「正しい型の値が別のフィールドに入る」種類だという点です。strictをtrueにする設定とtool_choiceの強制は、どちらもスキーマへの準拠やツールの呼び出しを確実にする手段で、すでに満たされている条件をさらに強めるだけです。\n\n本番では、検証コードで見つけた不一致の件数をフィールドごとに集計し、説明の改善が効いたかを確認します。\n\n参考: https://platform.claude.com/docs/en/agents-and-tools/tool-use/strict-tool-use"},{"id":34,"scenario":"プロンプトエンジニアリングと構造化出力","situation":"あるセキュリティ企業の開発チームは、CIパイプラインでClaude Codeにプルリクエストのレビューをさせています。現在、次の2つの問題が起きています。\n\nハードコードされた認証情報の検出で、似たようなコードでもテスト用のダミーのAPIキーを指摘したりしなかったりし、本物のトークンを見逃すこともある\n\n指摘の書き方が実行ごとに異なり、開発者が対応すべき内容を読み取りにくい","question":"プロンプトの改善として適切なものはどれですか。（2つ選択してください。）","choices":[{"text":"「確信度の高い指摘だけを報告すること」と指示し、迷うケースは報告しないようにする。","explanation":"報告の基準を絞ること自体は、誤検知を減らす方向の対策です。しかし「確信度の高いものだけ」という一般的な指示は、何が確信できるケースなのかを示していないため、精度の向上につながりにくいとされています。迷うケースを報告しないと、本物のトークンの見逃しがかえって増えるおそれもあります。"},{"text":"疑わしい文字列は広めに指摘させ、本物かどうかの判断は開発者に任せる。","explanation":"見逃しを減らしたい場面では、検出の範囲を広げることも選択肢になります。しかし誤検知が増えると、開発者は指摘を読まずに閉じるようになり、本物の認証情報についての正しい指摘まで信頼されなくなります。判断の一貫性を高めるという課題の解決にもなりません。"},{"text":"出力例を、場所・問題・重大度・修正案の形式でそろえて示す。","explanation":"正解。求める出力の形式をfew-shotの例で具体的に示すと、指摘の書き方が実行ごとにぶれなくなります。どのファイルの何行目に、どんな問題があり、どれだけ重大で、どう直せばよいかがそろって書かれていれば、開発者はすぐに対応に移れます。"},{"text":"ダミー値と本物の認証情報を対比したfew-shotの例を2〜4個示し、判断の理由を添える。","explanation":"正解。あいまいなケースでは、ある判断が選ばれた理由を示すfew-shotの例が、判断の一貫性を高める最も効果的な手段です。「fixtures配下でtest_を接頭辞に持つ値は指摘しない」「本番用の設定ファイルにある形式の正しいトークンは指摘する」のように理由を添えれば、モデルは例にない新しいケースにも判断を一般化できます。"}],"answer":[2,3],"overall":"公式ガイド（タスクステートメント4.2）は、詳細な指示だけでは一貫しない結果になる場合に、一貫した形式で実用的な出力を得る最も効果的な手法としてfew-shotの例を挙げています。具体的には、あいまいなシナリオ向けに、妥当と思われる代替案ではなくあるアクションが選ばれた理由を示す例を2〜4個作ること、そして求める出力形式（場所、問題、重大度、修正案）を示す例を含めることを求めています。\n\n本問の2つの症状、つまり判断のぶれと書き方のぶれに、それぞれが対応します。Anthropicのプロンプトのベストプラクティスでも、関連性が高く多様な例を示すことが、形式と判断の両方を安定させるとされています。\n\n見分け方の決め手は、「確信度の高いものだけ」という一般的な指示と、「広めに指摘して人に任せる」という方針が、どちらもあいまいなケースの判断基準を与えていない点です。\n\n本番では、例として示したケースと開発者が却下した指摘を照らし合わせ、新しい誤検知のパターンが見つかったら例を差し替えます。\n\n参考: https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices"},{"id":35,"scenario":"Claude Codeの設定とワークフロー","situation":"あるホテルチェーンの開発チームは、Claude Codeで予約データの移行スクリプトを作成しています。旧システムでは、連泊の途中で部屋を移った予約について、最初の部屋のチェックアウト日がnullで保存されています。\n\n移行後のデータを確認すると、これらの予約の宿泊日数が0泊になっていました。開発者は「チェックアウト日がnullの場合は、同じ予約番号の次の部屋のチェックイン日を使う」と2回説明しましたが、修正後も別の予約で同じ誤りが残っています。","question":"次に取るべき対応として最も効果的なものはどれですか。","choices":[{"text":"nullを含む入力レコードと期待される出力を示すテストケースを渡し、通るまで修正させる。","explanation":"正解。入力例と期待される出力を伴う具体的なテストケースがあれば、Claudeは修正のたびにテストを実行して、正しく直ったかを自分で確かめられます。説明の解釈に頼らずに合否で判断できるので、別の予約で同じ誤りが残っていれば、その時点で失敗として検出されます。"},{"text":"新しいセッションを開始し、同じ説明を最初に伝えてからスクリプトを書き直させる。","explanation":"失敗した修正のやり取りが積み重なったセッションをリセットするのは、コンテキストが混乱しているときには有効です。しかし新しいセッションでも同じ文章の説明を伝えるだけでは、解釈がぶれる原因は解消されません。説明に加えて、正しさを確かめられる具体的な入出力が必要です。"},{"text":"「null値に注意して堅牢に処理すること」とプロンプトに追記し、スクリプト全体を見直させる。","explanation":"注意を促す一般的な指示は、何を確認すべきかがすでに明確な場合の念押しとしては役に立ちます。しかし本問では具体的なルールを2回説明しても誤りが残っており、さらに抽象的な指示を足しても、Claudeが「どの入力でどの出力になれば正しいか」を判断する材料は増えません。"},{"text":"プランモードに切り替え、移行スクリプト全体の設計を最初から検討し直させる。","explanation":"プランモードは、複数のアプローチがあり設計判断が必要な変更を、着手前に安全に検討するためのモードです。しかし本問の問題は、スクリプトの構成ではなく特定のエッジケースの扱いに限られています。全体を設計し直しても、nullの扱いの誤りを確かめる手段がない状態は変わりません。"}],"answer":[0],"overall":"公式ガイド（タスクステートメント3.5）は、移行スクリプトにおけるnull値を例に、入力例と期待される出力を伴う具体的なテストケースを提示してエッジケースの処理を修正することを挙げています。Claude Codeのベストプラクティスも、テストやスクリプトのようにClaudeが自分で実行して合否を確かめられるチェックを与えると、Claudeが作業・確認・修正を自力で繰り返せると説明しています。\n\n本問では、文章による説明を2回繰り返しても誤りが残っており、説明の追加ではなく検証の手段が欠けていることが分かります。\n\n見分け方の決め手は、「同じ誤りが別の予約で残っている」という症状です。これは、Claudeが修正の正しさを確かめられないまま作業を終えていることを示しています。抽象的な注意喚起、設計のやり直し、セッションのリセットは、いずれもこの検証の欠如を補いません。\n\n本番では、見つかったnullのパターンごとにテストケースを追加して回帰テストとして残し、以降の修正で同じ誤りが再発しないようにします。\n\n参考: https://code.claude.com/docs/en/best-practices"},{"id":36,"scenario":"ツール設計とMCP統合","situation":"ある化粧品メーカーの開発チームは、Claude Agent SDKでマルチエージェントリサーチシステムを構築しています。競合製品の成分を調べる検索サブエージェントは、社内の成分データベースに問い合わせるMCPツールsearch_ingredientsを使います。\n\nこのツールは現在、一致する成分が0件だった場合も、データベースへの接続がタイムアウトした場合も、空の配列を返しています。そのため最終レポートには、実際には調べられなかった製品について「該当成分なし」と書かれていました。","question":"search_ingredientsの返し方として最も適切なものはどれですか。","choices":[{"text":"どちらの場合もisError: trueを返し、エラーの文字列に「検索に失敗しました」と書く。","explanation":"失敗をisErrorで明示すること自体は、タイムアウトのようなアクセスの失敗には正しい扱いです。しかし0件の結果まで失敗として返すと、検索は成功したのに一致がなかったという有効な結果が失われ、エージェントは不要なリトライを繰り返します。汎用的な文字列だけでは、リトライすべきかどうかも判断できません。"},{"text":"タイムアウトした場合は、同じ製品について前回の検索で得た結果を成功として返す。","explanation":"以前の結果を使うキャッシュは、変化の少ないデータでの応答速度の改善には有効です。しかし失敗したときに古い結果を成功として返すと、最新の成分の情報かどうかをエージェントが判断できず、失敗があった事実も隠れます。調べられなかったことは、調べられなかったこととして伝える必要があります。"},{"text":"どちらの場合も空の配列を返し、タイムアウトの発生はサーバーのログにだけ記録する。","explanation":"ログへの記録は、運用担当者が障害の傾向を調べるには役立ちます。しかしエージェントが受け取る結果は現在と同じ空の配列のままで、タイムアウトを「該当なし」と区別できません。エラーを黙って握りつぶす状態が続き、レポートの誤りもなくなりません。"},{"text":"0件は正常な空の結果、タイムアウトはリトライ可否付きのisError: trueとして返す。","explanation":"正解。一致がなかった成功したクエリは有効な空の結果として返し、接続のタイムアウトはisErrorをtrueにし、リトライ可能であることを示すメタデータを付けて返せば、エージェントは両者を区別できます。前者は「該当成分なし」という調査結果として扱い、後者はリトライするか、調べられなかったことを報告するかを判断できます。"}],"answer":[3],"overall":"公式ガイド（タスクステートメント2.2）は、リトライの判断が必要なアクセスの失敗と、一致するものがなかった成功したクエリを表す有効な空の結果を区別するよう求めています。MCPの仕様でも、APIの失敗のようなツールの実行エラーは、結果のisErrorをtrueにしてモデルに伝え、モデルが内容を読んで対処できるようにするとされています。\n\n本問のツールは2つの状態を同じ空の配列で返しているため、調べられなかった製品が「該当なし」として報告されています。\n\n見分け方の決め手は、2つの状態がエージェントにとって意味の違う情報だと捉えることです。両方をエラーにする案は有効な空の結果を失わせ、両方を空の配列にする案は失敗を隠し、キャッシュを返す案は古い情報を新しい結果に見せかけます。\n\n本番では、空の結果にも検索した条件（製品名、対象のデータベース）を添えると、コーディネーターが「どこを調べて見つからなかったのか」をレポートに書けます。\n\n参考: https://modelcontextprotocol.io/specification/2026-07-28/server/tools"},{"id":37,"scenario":"プロンプトエンジニアリングと構造化出力","situation":"ある建設会社の開発チームは、CIパイプラインでClaude Codeにプルリクエストのレビューをさせています。指摘のカテゴリ別に過去1か月の結果を分析したところ、次のことが分かりました。\n\nSQLインジェクションとN+1クエリの指摘は、ほぼ正しかった\n\n「命名規則」の指摘は約70%、「コメントの正確性」の指摘は約60%が誤検知だった\n\n開発者の多くは、カテゴリにかかわらずレビューコメントを読まずに閉じるようになっています。","question":"対応として適切なものはどれですか。（2つ選択してください。）","choices":[{"text":"誤検知の多い2つのカテゴリを一時的に無効化し、プロンプトを改善してから再開する。","explanation":"正解。誤検知の多いカテゴリは、正確なカテゴリへの信頼まで損ないます。命名規則とコメントの正確性の指摘をいったん止めれば、開発者が目にするのは信頼できるSQLインジェクションやN+1クエリの指摘だけになり、信頼の回復を待ちながら、その2カテゴリのプロンプトを改善できます。"},{"text":"開発者の信頼が戻るまで、自動レビューを全カテゴリで停止する。","explanation":"レビュー全体を止めれば、誤検知による不満はなくなります。しかし正確なSQLインジェクションやN+1クエリの指摘まで失われ、本来防げた不具合がマージされるおそれがあります。問題は一部のカテゴリに限られているので、そこだけを止めれば十分です。"},{"text":"コメントの正確性は「記述が実際の動作と矛盾する場合」に限るとプロンプトに書く。","explanation":"正解。「コメントの正確性を確認する」のようなあいまいな指示は、好みの問題や軽微な言い回しまで指摘させ、誤検知を生みます。「コメントが述べる動作が実際のコードの動作と矛盾する場合にのみ指摘する」という明示的な基準にすれば、本当に直すべき食い違いだけが報告されます。"},{"text":"全カテゴリ共通で「確信度の高い指摘だけを報告すること」と指示する。","explanation":"報告の基準を厳しくする意図は理解できますが、「確信度の高いものだけ」という一般的な指示は、具体的なカテゴリ別の基準と比べて精度の向上につながりにくいとされています。正確なカテゴリの有用な指摘まで減るおそれもあり、誤検知の原因となっているあいまいな基準は残ります。"}],"answer":[0,2],"overall":"公式ガイド（タスクステートメント4.1）は、誤検知の多いカテゴリが正確なカテゴリへの信頼まで損なうことを挙げ、誤検知の多いカテゴリを一時的に無効化し、そのカテゴリのプロンプトを改善する間に開発者の信頼を回復することを求めています。また、あいまいな指示よりも明示的な基準が重要であることの例として、「コメントの正確性を確認する」ではなく「主張されている動作が実際のコードの動作と矛盾する場合にのみ指摘する」と書くことを示しています。\n\n本問では、カテゴリごとの誤検知率がはっきり分かれているので、問題のあるカテゴリだけを止めて基準を書き直すのが適切です。\n\n見分け方の決め手は、データが「一部のカテゴリだけが悪い」ことを示している点です。全体の停止は正確なカテゴリまで失い、一般的な「確信度の高いものだけ」という指示は具体的な基準の代わりになりません。\n\n本番では、改善したカテゴリを再開した後も、開発者が却下した指摘をカテゴリ別に集計し続けて、誤検知率が下がったことを確かめます。\n\n参考: https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices"},{"id":38,"scenario":"コンテキスト管理と信頼性","situation":"ある出版社の開発チームは、Claudeで構造化データ抽出システムを構築しています。印刷会社や翻訳者から届く請求書から、金額・支払期日・取引先コードを抽出しています。確信度が0.90以上の抽出は人によるレビューを省き、そのまま会計システムへ送っていました。\n\nところが、ある印刷会社が請求書の様式を変えてから、確信度0.95前後の抽出で支払期日の取り違えが3週間続きました。チームが気づいたのは、支払いの遅延が起きてからでした。","question":"同様の問題を早期に検出するための変更として、最も効果的なものはどれですか。","choices":[{"text":"新しい様式の請求書をfew-shotの例として抽出プロンプトに追加し、同じ取り違えが起きないようにする。","explanation":"多様な様式の例を示すfew-shotは、既に分かっている様式での抽出精度を上げる有効な手段で、今回の様式への対処としては役に立ちます。しかし問われているのは「同様の問題を早期に検出する」方法です。例の追加は見つかった誤りを直す対策であり、まだ知らない様式や誤りのパターンを発見する仕組みにはなりません。"},{"text":"取引先から様式変更の連絡を受けたら、その取引先の請求書をしばらく全件レビューする運用にする。","explanation":"事前に分かっている変更に対して一時的にレビューを厚くするのは、運用上の備えとしては妥当です。しかしこの方法は取引先からの連絡に依存しており、今回のように予告なく様式が変わった場合には何も検出できません。連絡のない変化や、様式以外の原因で起きる新しい誤りも見逃します。"},{"text":"確信度の高い抽出についても、取引先と文書の種類で層に分けた無作為抽出を続け、層ごとのエラー率を測る。","explanation":"正解。層化無作為抽出は、自動化した高確信度の抽出のエラー率を継続的に測り、新しいエラーパターンを見つけるための仕組みです。取引先や文書の種類で層を分けておけば、1社の様式変更で特定の層のエラー率だけが上がったことを数日のうちに捉えられます。全体の件数に埋もれやすい少数の取引先も確実に抽出対象になります。"},{"text":"自動で送る確信度のしきい値を0.90から0.97に引き上げ、人によるレビューに回る件数を増やす。","explanation":"しきい値の調整は、ラベル付き検証セットでキャリブレーションした結果に基づいて行うなら、レビューの振り分けを改善する有効な手段です。しかし本問の誤りは確信度0.95前後で起きており、新しい様式に対してモデルが誤って高い確信度を付けている状態です。しきい値を上げても、次の様式変更で同じように高い確信度の誤りが出れば検出できません。"}],"answer":[2],"overall":"公式ガイド（タスクステートメント5.5）は、確信度の高い抽出におけるエラー率を測定し、新しいエラーパターンを検出するために層化無作為抽出を実装することを挙げています。\n\n本問の事故は、モデルの確信度が高いまま誤るという、確信度だけに頼った振り分けの弱点から起きました。層化無作為抽出を続けていれば、確信度とは無関係に一定数が人の目に触れるので、特定の取引先の層だけエラー率が上がる変化に気づけます。\n\n見分け方の決め手は、設問が「この誤りを直す」ではなく「同様の問題を早期に検出する」ことを求めている点です。しきい値の引き上げとfew-shotの追加は既知の問題への対処で、連絡に頼る全件レビューは予告のない変化に無力です。\n\n本番では、層ごとのエラー率をダッシュボードで監視し、急な上昇を警告する条件を決めておくと、下流で支払遅延が起きる前に
