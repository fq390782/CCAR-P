止められます。\n\n参考: https://platform.claude.com/docs/en/test-and-evaluate/develop-tests"},{"id":39,"scenario":"コンテキスト管理と信頼性","situation":"ある家電メーカーの開発チームは、Claude Agent SDKでカスタマーサポート解決エージェントを構築しています。ログを分析したところ、次の2つの問題が見つかりました。\n\n顧客が氏名だけを伝えたときにget_customerが同姓同名の顧客を3件返し、エージェントが直近に購入履歴のある1件を選んで修理の予約を進めた結果、別人の予約を変更していた\n\n洗濯機の排水エラーについて、エージェントが同じリセット手順を言い回しを変えて4回案内し、40分以上解決しないまま会話が続いていた","question":"改善策として適切なものはどれですか。（2つ選択してください。）","choices":[{"text":"案内できる手順を試しても解決に向けて進展しない場合は、人間の担当者にエスカレーションする。","explanation":"正解。解決に向けて進展しない状況は、エスカレーションの適切な条件の1つです。同じ手順を繰り返しても解決しないと分かった時点で、試した手順と症状をまとめて人間の担当者に引き継げば、顧客を待たせ続けることなく、より専門的な対応につなげられます。"},{"text":"複数の候補が一致した場合は、エージェントが最も可能性の高い顧客を選び、その根拠を記録に残す。","explanation":"判断の根拠を記録に残すことは、後から誤りを調べる監査には役立ちます。しかし同姓同名の顧客が複数いる時点で、エージェントの手元には本人を特定する情報がなく、どの候補を選んでもヒューリスティックによる推測になります。記録を残しても、別人の予約を変更してしまう誤りそのものは防げません。"},{"text":"解決しない会話では、顧客の発言から不満の度合いを判定し、強いと判断したときにエスカレーションする。","explanation":"顧客の感情に気を配ること自体は、応対の質を保つうえで大切です。しかし不満の強さは、ケースの複雑さやエージェントが解決できるかどうかを示す信頼できる指標ではありません。穏やかな顧客との会話でも進展がなければ引き継ぐべきで、感情を基準にすると、引き継ぎが遅れる会話が残ります。"},{"text":"複数の候補が一致した場合は、電話番号や注文番号などの追加の識別情報を尋ねてから進める。","explanation":"正解。ツールの結果が複数の一致を返したときは、推測で1件を選ばず、電話番号や注文番号のように本人を一意に特定できる情報を顧客に尋ねるのが適切です。やり取りが1往復増えるだけで、別人の記録を操作するという取り返しのつかない誤りを防げます。"}],"answer":[0,3],"overall":"公式ガイド（タスクステートメント5.2）は、複数の顧客が一致した場合には、ヒューリスティックによる選択ではなく追加の識別情報を求める確認が必要だとし、ツールの結果が複数の一致を返したときは追加の識別情報を尋ねるようエージェントに指示することを挙げています。\n\nまた、適切なエスカレーションの条件として、顧客による人間の担当者への要求、ポリシーの例外や空白とともに、解決に向けて進展しない状況を挙げ、感情に基づくエスカレーションは実際のケースの複雑さを示す指標として信頼できないとしています。本問の2つの問題は、前者が「あいまいさの解消」、後者が「エスカレーションの条件」に当たります。\n\n誤答の2つは、推測と感情という信頼できない手がかりに頼っている点で共通しています。根拠を記録しても推測は推測のままで、不満の強さは進展の有無を表しません。\n\n本番では、エスカレーションの条件をシステムプロンプトに明記するとともに、試した手順と結果をハンドオフサマリーに含め、担当者が同じ案内を繰り返さずに済むようにします。\n\n参考: https://platform.claude.com/docs/en/about-claude/use-case-guides/customer-support-chat"},{"id":40,"scenario":"プロンプトエンジニアリングと構造化出力","situation":"あるEC物流会社の開発チームは、Claudeで構造化データ抽出システムを構築しています。現在、次の3つの処理でリアルタイムのMessages API呼び出しを使っています。\n\n(1)倉庫の作業員が端末の前で待つ間に、配送伝票から住所を抽出してラベル発行の可否を判定する処理\n\n(2)月末に締めた運送会社の請求書を抽出し、翌週の監査担当者に渡す処理\n\n(3)顧客がチャットに添付した伝票画像から追跡番号を抽出し、その場で配送状況を答える処理\n\nコスト削減のため、Message Batches APIの利用を検討しています。","question":"Message Batches APIの使い方として最も適切なものはどれですか。","choices":[{"text":"(2)だけをバッチ処理に切り替え、(1)と(3)はリアルタイムの呼び出しを維持する。","explanation":"正解。(2)は月末締めの請求書を翌週の監査に回す処理で、数時間から最大24時間の遅れを許容できるため、Message Batches APIの50%のコスト削減を活かせます。(1)の作業員と(3)の顧客はその場で結果を待っているので、リアルタイムの呼び出しが必要です。"},{"text":"3つともリアルタイムの呼び出しを維持し、プロンプトキャッシュを使ってコストを下げる。","explanation":"プロンプトキャッシュは、共通の長いプロンプトを繰り返し送る処理で入力コストを下げる有効な手段で、バッチ処理と併用もできます。しかし(2)は結果を翌週に使う処理で、待ち時間を許容できます。バッチ処理に回せる処理まで同期のまま残すと、50%のコスト削減の機会を逃します。"},{"text":"(1)と(2)をバッチ処理に切り替え、(3)はリアルタイムの呼び出しを維持する。","explanation":"(1)は作業員が端末の前で結果を待つブロッキングな処理です。バッチ処理は最大24時間の処理時間がかかる可能性があり、レイテンシのSLAも保証されないため、出荷作業が止まるおそれがあります。多くのバッチが1時間以内に終わるとしても、待つ人がいる処理には使えません。"},{"text":"(2)と(3)をバッチ処理に切り替え、(1)はリアルタイムの呼び出しを維持する。","explanation":"(3)はチャットで顧客がその場の回答を待つ処理です。社内の作業員ではなく顧客が相手でも、応答を待つ人がいるブロッキングな処理である点は(1)と同じです。バッチ処理にすると、回答までの時間が保証されず、顧客対応として成り立ちません。"}],"answer":[0],"overall":"バッチ処理（タスクステートメント4.5）に使うMessage Batches APIは、コストを50%削減できる一方で、処理には最大24時間かかることがあり、レイテンシのSLAは保証されません。そのため、夜間レポートや定期的な監査のようなノンブロッキングでレイテンシを許容できる処理に適し、人が結果を待つブロッキングな処理には適していません。\n\n本問で待ち時間を許容できるのは、結果を翌週に使う(2)だけです。\n\n見分け方の決め手は、各処理について「誰かが結果を待っているか」を確かめることです。(1)は作業員、(3)は顧客が待っており、相手が社内か社外かは判断に関係しません。また、バッチの結果はcustom_idでリクエストと対応付けられるので、順序の心配から同期にこだわる必要もありません。\n\n本番では、(2)のバッチを請求書の締め日に合わせて送信し、custom_idに請求書番号を入れておくと、結果の突合と失敗分の再送が容易になります。\n\n参考: https://platform.claude.com/docs/en/build-with-claude/batch-processing"},{"id":41,"scenario":"コンテキスト管理と信頼性","situation":"ある自動車メーカーの品質保証部門は、Claude Agent SDKでマルチエージェントリサーチシステムを構築し、8か国のリコール情報を調べています。各国の規制当局のデータベースを検索するサブエージェントは、失敗したときに、失敗の種類・試行したクエリ・部分的な結果・考えられる代替手段を構造化して返します。\n\n先週の実行では、7か国の検索は成功し、A国だけが権限エラーで失敗しました。エラーには、次の内容が示されていました。\n\nA国のデータベースは有償契約者だけが閲覧できる\n\n代替手段として、同国の官報に載るリコール公示を検索できる\n\nところがコーディネーターは、エラーを受け取ると8か国すべての検索を同じ指示で委任し直す作りになっていました。そのため、同じ権限エラーが3回繰り返されたうえ、検索のコストは通常の約4倍になりました。","question":"コーディネーターの復旧の判断として適切なものはどれですか。（2つ選択してください。）","choices":[{"text":"成功した7か国の結果は再検索せず、部分的な結果としてそのまま統合に使う。","explanation":"正解。7か国分の結果は、すでに取得に成功している有効なデータです。再検索せずに部分的な結果として統合に回せば、失敗の影響をA国だけに閉じ込められ、全件をやり直すコストもなくなります。エラーのたびに最初からやり直すのではなく、失敗した箇所だけを扱い直せるようにしておくことが、マルチエージェントシステムの復旧の基本です。"},{"text":"A国については、指数バックオフを入れて、同じクエリのリトライを3回まで行わせる。","explanation":"指数バックオフ付きのリトライは、タイムアウトやレート制限のような一時的なエラーに対しては有効な手段です。しかしA国の失敗は、閲覧が有償契約者に限られていることによる権限エラーで、待ってから同じクエリを送っても結果は変わりません。リトライの回数とコストが増えるだけで、A国の情報は得られません。"},{"text":"A国の失敗を受けた時点で実行全体を中断し、失敗の詳細を人間の担当者に報告する。","explanation":"人間の担当者への報告は、エージェントの側に打つ手がない場合や、契約・権限の変更のように人の判断が必要な場合に適した対応です。しかし本問では、エラーに代替手段が示されており、7か国の結果もそろっています。1か国の失敗で実行全体を止めるのは、1つの失敗でワークフロー全体を終了させるアンチパターンに当たります。有償契約の検討を人に依頼する場合でも、調査そのものは続けられます。"},{"text":"A国については、エラーに示された官報のリコール公示を検索する作業を委任する。","explanation":"正解。権限エラーは、時間をおいて同じクエリを送っても解消しない種類の失敗です。エラーに含まれていた代替手段を使い、A国についてだけ官報のリコール公示を検索する作業を委任すれば、契約の制約を避けながら不足している1か国分を補えます。構造化されたエラーコンテキストの「失敗の種類」と「代替手段」は、コーディネーターがこうした判断を下すために返されています。"}],"answer":[0,3],"overall":"公式ガイド（タスクステートメント5.3）は、失敗の種類・試行したクエリ・部分的な結果・代替アプローチを含むエラーコンテキストが、コーディネーターによる状況に応じた復旧の判断を可能にするとしています。\n\nAnthropicのマルチエージェントリサーチシステムの解説も、エラーが起きたときに最初からやり直すのはコストが高く、エラーが起きた時点から再開できるようにしたこと、ツールの失敗をエージェントに知らせて適応させる方法がよく機能することを述べています。\n\n本問のサブエージェントは必要な情報を返しているのに、コーディネーターがそれを使わず、全件を同じ指示でやり直しています。正解の2つは、エラーに示された代替手段で失敗した1か国だけを補うことと、取得済みの部分的な結果を捨てずに使うことです。\n\n誤答を見分ける手がかりは、失敗の種類にあります。権限エラーは待っても解消しないため、バックオフ付きのリトライは効きません。また、代替手段がある状況で実行全体を止めるのは、復旧の機会を自ら捨てることになります。\n\n実際の運用では、代替の情報源でもA国の情報が得られなかった場合に備え、最終レポートでA国の情報が不足していることを明示できるようにしておきます。\n\n参考: https://www.anthropic.com/engineering/multi-agent-research-system"},{"id":42,"scenario":"Claude Codeの設定とワークフロー","situation":"ある旅行会社の開発チームは、コード生成やリファクタリングにClaude Codeを使っています。\n\nリポジトリのルートにあるCLAUDE.mdは1,400行に増えており、次の内容も含まれています。\n\n予約エンジンのインフラを定義するTerraformファイル（infra/配下の*.tf）専用の規約（600行）\n\n年に数回しか行わない決済SDKの移行手順（200行）\n\nフロントエンドの作業中もこれらがすべて読み込まれ、コンテキストを圧迫しています。","question":"トークン使用量を減らす変更として適切なものはどれですか。（2つ選択してください。）","choices":[{"text":"Terraformの規約を、paths: [\"infra/**/*.tf\"]を指定した.claude/rules/のファイルに移す。","explanation":"正解。pathsフロントマターを持つルールは、一致するファイルをClaudeが読んだり編集したりしたときにだけ読み込まれます。Terraformファイルを扱わないフロントエンドの作業では600行の規約がコンテキストに入らなくなり、インフラの作業では従来どおり規約が適用されます。"},{"text":"Terraformの規約をdocs/terraform.mdに書き出し、ルートのCLAUDE.mdから@importで読み込む。","explanation":"@importは、長いCLAUDE.mdを複数のファイルに分けて保守しやすくするには有効な構文です。しかしインポートされたファイルは、それを参照するCLAUDE.mdと一緒に起動時に読み込まれます。ファイルが分かれるだけで読み込まれる量は変わらないため、フロントエンドの作業中のコンテキスト消費は減りません。"},{"text":"Terraformの規約を、各メンバーの~/.claude/rules/terraform.mdに移す。","explanation":"~/.claude/rules/はユーザーレベルのルールで、pathsフロントマターが無ければ起動時に無条件で読み込まれます。そのためフロントエンドの作業中も600行の規約がコンテキストに入り続け、トークン使用量は減りません。加えてバージョン管理で共有されないため、チームの規約の置き場所としても適しません。"},{"text":"決済SDKの移行手順をスキルにして、必要なときだけ呼び出されて読み込まれるようにする。","explanation":"正解。スキルは、特定の作業のときだけ必要になる手順や知識をオンデマンドで読み込む仕組みです。常に読み込まれるCLAUDE.mdから年に数回しか使わない200行の手順を外せば、普段の作業のコンテキストを節約しつつ、移行作業のときには手順を呼び出せます。"}],"answer":[0,3],"overall":"パス固有のルール（タスクステートメント3.3）について、公式ドキュメントは、pathsフィールドを持つ.claude/rules/のルールが、一致するファイルに対してRead・Write・Editを使ったときにだけ読み込まれ、無関係なコンテキストを減らすと説明しています。\n\n一方で@importでインポートしたファイルは起動時に読み込まれるため、整理には役立ってもコンテキストの消費は減らないと明記されています。また、ときどきしか使わない手順はCLAUDE.mdではなくスキルに置くと、必要なときだけ読み込まれます。\n\n見分け方の決め手は、設問が「整理」ではなく「トークン使用量の削減」を求めている点です。ファイルを分けるだけの@importと、pathsを持たない~/.claude/rules/への移動は、どちらも起動時に読み込まれるため、読み込まれる量を変えません（後者はチームで共有もされません）。\n\n本番では、変更後に/contextで実際に読み込まれているメモリファイルを確認し、フロントエンドの作業中にTerraformの規約が入っていないことを確かめます。\n\n参考: https://code.claude.com/docs/en/memory"},{"id":43,"scenario":"エージェントアーキテクチャとオーケストレーション","situation":"ある会計事務所の開発チームは、Claude Agent SDKでマルチエージェントリサーチシステムを構築しています。税制改正の影響を調べるにあたり、開発を急いだため、サブエージェントどうしが共有のメッセージキューを通じて直接依頼を送り合う構成にしました。その結果、次の問題が起きています。\n\n文書分析サブエージェントの失敗に誰も気づかないまま、統合が進むことがある\n\n同じ検索が、別々のサブエージェントから重複して依頼される\n\nどの情報がどの経路で流れたかを、ログから追えない","question":"最も適切な改善策はどれですか。","choices":[{"text":"失敗したサブエージェントが、他のサブエージェントに直接エラーを通知する仕組みを追加する。","explanation":"失敗を関係者に伝えること自体は大切ですが、通知先や対処の判断がサブエージェントごとにばらばらになり、エラー処理が一貫しません。直接のやり取りがさらに増えることで、情報の流れはいっそう追いにくくなります。"},{"text":"サブエージェントどうしの依頼にリトライと重複排除の仕組みを加え、キューの信頼性を上げる。","explanation":"メッセージ基盤の信頼性を上げることは、分散システムの一般的な改善としては妥当です。しかし本問の問題は、誰がどのサブエージェントに何を依頼するかを全体として管理する主体がいないことにあります。キューを丈夫にしても、エラー処理や情報の流れを一貫して制御する仕組みにはなりません。"},{"text":"サブエージェント間の直接のやり取りをやめ、通信をすべてコーディネーター経由にする。","explanation":"正解。ハブアンドスポーク型の構成では、コーディネーターがサブエージェント間のすべての通信、エラー処理、情報のルーティングを管理します。失敗はコーディネーターに必ず返るので、リトライや代替手段を判断でき、重複した依頼も1か所で整理できます。情報の流れが1つの経路に集まるため、追跡も容易になります。"},{"text":"共有キューに詳細なログ出力を追加し、流れたメッセージを記録して後から追跡できるようにする。","explanation":"ログの追加は可観測性の向上に役立ち、問題の調査には必要なことも多い対策です。しかし記録が増えても、失敗に気づいて対処する役割や、重複した依頼を整理する役割を担う者がいない構成は変わりません。後から追跡できても、失敗したまま統合が進むことは防げません。"}],"answer":[2],"overall":"公式ガイド（タスクステートメント1.2）は、コーディネーターがサブエージェント間のすべての通信、エラー処理、情報のルーティングを管理するハブアンドスポーク型アーキテクチャを挙げ、可観測性、一貫したエラー処理、制御された情報フローのために、サブエージェントのすべての通信をコーディネーター経由でルーティングするよう求めています。\n\n本問の3つの症状、つまり失敗の見落とし、重複した依頼、追跡できない情報の流れは、いずれもこの3つの性質が欠けていることから生じています。\n\n見分け方の決め手は、症状が個々の部品の不具合ではなく、全体を管理する主体がいない構成そのものから来ていると見抜くことです。ログの追加とキューの改善は部品を丈夫にするだけで、エラーの直接通知は直接のやり取りをさらに増やします。Anthropicのマルチエージェントリサーチシステムの解説でも、リードエージェントがサブエージェントを起動し、結果を受け取って次の行動を決める構成が採られています。\n\n本番では、コーディネーターが各サブエージェントへの依頼と結果を構造化して記録すると、情報の出所を後から確認できます。\n\n参考: https://www.anthropic.com/engineering/multi-agent-research-system"},{"id":44,"scenario":"ツール設計とMCP統合","situation":"ある銀行の開発チームは、マルチエージェントリサーチシステムを構築しています。文書分析サブエージェントはMessages APIを直接呼び出すコードとして実装されており、結果を次のどちらかのツールで返す設計です。\n\nreport_findings（調査結果を構造化して返す）\n\nreport_no_relevant_content（関連する記述がなかったことを理由とともに返す）\n\nコーディネーターは、このツール呼び出しを解析して次の処理を決めます。ところが、全体の約6%で、サブエージェントがどちらのツールも呼ばず、文章だけの要約を返して処理が止まっています。","question":"最も適切な対処はどれですか。","choices":[{"text":"tool_choiceで{\"type\": \"tool\", \"name\": \"report_findings\"}を指定し、常にこのツールを呼ばせる。","explanation":"強制的なツール選択は、特定の抽出を必ず最初に実行させたい場面では適した設定です。しかし本問では、関連する記述がない文書についてはreport_no_relevant_contentで返す必要があります。report_findingsに固定すると、該当なしの文書でも調査結果をむりに作らせることになり、存在しない内容が作られるおそれがあります。"},{"text":"tool_choiceを\"auto\"のままにし、「必ずどちらかのツールで結果を返すこと」とプロンプトで強調する。","explanation":"プロンプトでツールの使用を促すと、ツールを呼ぶ頻度を上げることはできます。しかしtool_choiceが\"auto\"のままでは、モデルはツールを呼ばずにテキストで答えることも選べるため、6%の失敗をゼロにはできません。コーディネーターの解析が止まる問題には、確実に呼び出させる設定が必要です。"},{"text":"文章だけの応答が返ったら、コーディネーター側で文章を解析して調査結果に変換する。","explanation":"受け取った出力を後処理で整えるのは、フォーマットの小さな揺れを吸収する補助的な手段にはなります。しかし自由な文章から調査結果と出典を確実に取り出すのは難しく、解析ロジックの保守も増えます。そもそもツール呼び出しで構造を保証する設計の利点を捨てることになります。"},{"text":"tool_choiceを\"any\"に設定し、2つのツールのどちらかを必ず呼び出させる。","explanation":"正解。tool_choiceの\"any\"は、モデルに必ずいずれかのツールを呼ばせ、どのツールにするかはモデルに選ばせる設定です。文章だけの応答がなくなる一方で、調査結果があればreport_findings、なければreport_no_relevant_contentという判断はモデルに残せます。"}],"answer":[3],"overall":"tool_choiceの\"auto\"では、モデルはツールを呼ばずにテキストを返す場合があります。\"any\"ではモデルは必ずいずれかのツールを呼び出しますが、どのツールにするかは選べます。typeに\"tool\"、nameにツール名を指定する強制的な選択では、指定した特定のツールが必ず呼ばれます。\n\n公式ガイド（タスクステートメント2.3）は、モデルが会話テキストを返すのではなく確実にツールを呼び出すようにするために\"any\"を設定することを挙げています。本問の要件は「テキストだけの応答をなくす」ことと「2つのツールのどちらにするかはモデルに判断させる」ことの両立で、これを満たすのは\"any\"だけです。\n\n見分け方の決め手は、正しい出口が2つあるという設計です。出口が1つなら強制的な選択が候補になりますが、該当なしの報告先がなくなる点で本問には合いません。プロンプトの強調と後処理は、確率的な遵守と事後の取り繕いにとどまります。\n\ntool_choiceはMessages APIのリクエストで指定するパラメータなので、本問のようにサブエージェントをAPIの呼び出しとして実装していれば、そのまま設定できます。なお、\"any\"や特定のツールの強制は対応するモデルで使える設定で、2026年9月以降に公開された一部のモデルでは400エラーになります。試験ガイド（2026年7月版）より新しい変更のため、本試験では強制できる前提で出題される可能性があります。\n\n本番では、report_no_relevant_contentにも検索した範囲と理由を必須項目として持たせると、コーディネーターが追加の調査を判断しやすくなります。\n\n参考: https://platform.claude.com/docs/en/agents-and-tools/tool-use/define-tools"},{"id":45,"scenario":"プロンプトエンジニアリングと構造化出力","situation":"ある化学メーカーの開発チームは、Claudeで構造化データ抽出システムを構築しています。原料メーカーから届く分析証明書から、各成分の含有率と、証明書に記載された合計値を抽出しています。スキーマには次のフィールドがあります。\n\nstated_total（証明書に記載された合計）\n\ncalculated_total（抽出した各成分から計算した合計）\n\nconflict_detected（両者の不一致を示す）\n\n現在は、不一致が検出されると最大3回まで再抽出しています。その結果、全体の18%の文書がリトライの上限に達し、APIコストが想定の2倍になりました。調べたところ、上限に達した文書の大半は、証明書そのものの合計欄に転記ミスがあるものでした。","question":"最も適切な改善方法はどれですか。","choices":[{"text":"合計が一致しない文書は抽出結果を破棄し、処理対象から除外して記録だけを残す。","explanation":"処理できない文書を記録して隔離するのは、データ品質を守る手段としては理解できます。しかし抽出結果そのものは正しく取れている可能性が高く、破棄すると18%の文書の原料データが登録されないままになります。不一致の内容を添えて人の確認に回すほうが、業務を止めずに済みます。"},{"text":"リトライは1回までにし、なお一致しない文書はconflict_detectedをtrueのまま担当者のレビューに回す。","explanation":"正解。検証エラーを添えたリトライは、抽出の読み誤りのように出力側に原因がある場合には効果があるので、1回は試す価値があります。しかし証明書の合計欄そのものが誤っている場合、何度抽出し直しても一致しません。不一致を記録したまま担当者に回せば、無駄なリトライのコストを止めつつ、原料メーカーへの確認にもつなげられます。"},{"text":"リトライの上限を3回から5回に増やし、合計が一致するまで再抽出を続ける。","explanation":"上限の引き上げは、リトライのたびに一致率が着実に上がっている場合なら検討の余地があります。しかし本問の大半の文書は、元の証明書の合計欄に誤りがあるため、抽出し直しても一致することはありません。コストがさらに増えるだけで、問題の文書はいずれ上限に達します。"},{"text":"stated_totalをcalculated_totalの値で上書きし、合計が一致した状態で下流システムへ送る。","explanation":"計算値で記載値を置き換えると不一致は見かけ上消えますが、証明書に何が書かれていたかという事実が失われます。転記ミスが成分側にある可能性も否定できず、確認しないまま誤ったデータが下流に流れます。conflict_detectedを設けた意味もなくなります。"}],"answer":[1],"overall":"公式ガイド（タスクステートメント4.4）は、リトライ時に具体的な検証エラーを示すとモデルを修正に導けること、しかし必要な情報がソース文書に存在しない場合や、ソースデータ自体が整合していない場合には効果がないことを挙げています。そのため、stated_totalとcalculated_totalを両方抽出し、整合しないソースに対してconflict_detectedを立てる設計が推奨されています。\n\n本問の不一致の大半は証明書側の転記ミスなので、リトライを重ねても解決せず、不一致を記録したまま人に回すのが適切です。\n\n見分け方の決め手は、「上限に達した文書の大半は証明書そのものに誤りがある」という調査結果です。上限の引き上げはコストを増やすだけで、上書きや破棄はソースの矛盾という事実を消してしまいます。\n\n本番では、リトライ後も残った不一致を原料メーカー別に集計すると、転記ミスの多い取引先への改善依頼にも使えます。\n\n参考: https://platform.claude.com/docs/en/build-with-claude/structured-outputs"},{"id":46,"scenario":"Claude Codeの設定とワークフロー","situation":"ある法律事務所の開発チームは、Claude Codeで社内の契約管理システムの改修を進めています。次の作業は、電子署名サービスを別の事業者へ切り替えるための調査で、署名処理に関わるモジュールを洗い出す必要があります。\n\n前回の同様の調査では、メインのセッションに数百ファイル分の検索結果とファイル内容が読み込まれ、実装を始める頃には重要な判断が会話から押し出されていました。また、調査の途中で誤ってファイルが書き換えられたこともありました。今回は、調査中の編集を確実に防ぎたいと考えています。","question":"最も適切な方法はどれですか。","choices":[{"text":"調査をExploreサブエージェントに任せ、要約だけをメインの会話に返させる。","explanation":"正解。Exploreサブエージェントはコードベースの検索と分析に特化した読み取り専用のエージェントで、WriteとEditは使えません。調査は自分のコンテキストウィンドウで行い、メインの会話には要約だけが返るため、冗長な調査出力を分離しつつ、調査中の編集も確実に防げます。"},{"text":"汎用（general-purpose）サブエージェントに調査を任せ、結果をファイルに書き出させる。","explanation":"汎用サブエージェントは、調査と変更の両方が必要な複数ステップの作業に向いており、別のコンテキストで動くのでメインの会話の圧迫は避けられます。しかしサブエージェントで使えるすべてのツールを持つため、ファイルの編集も可能です。調査中の編集を確実に防ぐという要件を満たしません。"},{"text":"メインのセッションで調査し、実装を始める前に/compactで会話を要約する。","explanation":"/compactは、冗長な調査出力でコンテキストが埋まった後に使用量を減らす手段としては有効です。しかし調査中は大量の出力がメインのコンテキストに入り続け、要約の段階で細部の判断が失われることもあります。また、調査中の編集を防ぐ仕組みにはなっていません。"},{"text":"メインのセッションをプランモードに切り替え、同じセッションの中で調査を進めさせる。","explanation":"プランモードではClaudeはファイルを読んで調査できますが編集はしないため、調査中の書き換えを防ぐ目的には合っています。しかし調査はメインのセッションの中で行われるので、数百ファイル分の検索結果はそのままメインの会話のコンテキストに積み上がります。前回の問題だったコンテキストの圧迫は解消されません。"}],"answer":[0],"overall":"公式ガイド（タスクステートメント3.4）は、冗長な調査出力を分離し、要約を返すことでメインの会話のコンテキストを保全するものとしてExploreサブエージェントを挙げ、複数フェーズのタスクでコンテキストウィンドウの枯渇を防ぐために使うよう求めています。\n\nClaude Codeのドキュメントでも、Exploreは読み取り専用のツールだけを持ち、WriteとEditが拒否される高速なエージェントと説明されています。本問の要件は「メインのコンテキストを守る」と「調査中の編集を防ぐ」の2つで、両方を満たすのはExploreサブエージェントだけです。\n\n見分け方の決め手は、要件を1つずつ当てはめることです。プランモードは編集を防いでもコンテキストは守れず、汎用サブエージェントはコンテキストを守っても編集を防げず、/compactはどちらも事後的な対処にとどまります。\n\n本番では、Exploreに「署名処理の入口と依存モジュールを一覧にする」のように問いを絞って依頼すると、返ってくる要約がそのまま実装の計画に使えます。\n\n参考: https://code.claude.com/docs/en/sub-agents"},{"id":47,"scenario":"ツール設計とMCP統合","situation":"ある半導体メーカーの開発チームは、Claude Agent SDKでマルチエージェントリサーチシステムを構築しています。開発を急いだため、ウェブ検索・文書分析・統合・レポート生成のすべてのサブエージェントに、同じ18個のツールを与えています。\n\n評価では、文書分析サブエージェントが特許文書を分析する途中でウェブ検索やレポートの書式設定のツールを呼び出すなど、ツールの選択を誤るケースが15%ありました。","question":"最も効果的な対処はどれですか。","choices":[{"text":"ツールの呼び出しを記録して、誤った選択があったら分析をやり直す監視処理を追加する。","explanation":"ツール呼び出しの記録と監視は、可観測性を高め、問題の傾向を把握するには役立ちます。しかしこの案は誤った選択が起きた後に気づいてやり直すだけで、誤りそのものを減らしません。やり直しの分だけコストとレイテンシも増えます。"},{"text":"18個すべてのツールの説明を詳しく書き直し、どのサブエージェントでも正しく選べるようにする。","explanation":"ツールの説明を充実させることは、似たツールの間で選択を誤る場合に効果のある基本的な対策です。しかし本問の誤りは、文書分析の担当なのにウェブ検索やレポートの書式設定を呼ぶといった、役割の外にあるツールの使用です。説明を良くしても18個から選ぶ判断の複雑さは変わらず、役割外のツールが手の届くところにある状態も続きます。"},{"text":"文書分析サブエージェントのtool_choiceを\"any\"に設定し、必ずツールを呼ばせる。","explanation":"tool_choiceの\"any\"は、モデルがツールを呼ばずにテキストだけを返すのを防ぐ設定です。本問の問題は、ツールを呼ばないことではなく、誤ったツールを呼ぶことです。必ずいずれかのツールを呼ばせても、18個の中から誤って選ぶ状況は変わりません。"},{"text":"各サブエージェントのツールを、その役割に必要な4〜5個に絞る。","explanation":"正解。エージェントに多すぎるツールを与えると判断が複雑になり、ツール選択の信頼性が下がります。また、専門外のツールを持つエージェントはそれを誤用しがちです。文書分析サブエージェントには文書の読み取りや抽出に必要なツールだけを与えれば、役割外のツールはそもそも選べなくなります。"}],"answer":[3],"overall":"公式ガイド（タスクステートメント2.3）は、エージェントに多すぎるツール（たとえば4〜5個ではなく18個）へのアクセスを与えると判断の複雑さが増し、ツール選択の信頼性が低下するという原則と、専門外のツールを持つエージェントがそれらを誤用しがちであることを挙げています。\n\nそのため、各サブエージェントのツールセットをその役割に関連するものに制限し、専門外のツールの誤用を防ぐことが求められます。Agent SDKでも、サブエージェントごとに使えるツールをtoolsで指定して絞り込めます。\n\n本問の誤りは、まさに役割の外にあるツールの呼び出しです。見分け方の決め手は、誤りの種類が「似たツールの取り違え」ではなく「役割外のツールの使用」である点です。前者なら説明の改善が第一の手ですが、後者には配分の見直しが直接効きます。tool_choiceの変更は別の問題を解く設定で、監視は事後の対応にとどまります。\n\n本番では、頻度の高い横断的なニーズ（統合エージェントの簡単な事実確認など）があれば、それだけを満たす範囲の限られたツールを追加で与えます。\n\n参考: https://code.claude.com/docs/en/agent-sdk/subagents"},{"id":48,"scenario":"エージェントアーキテクチャとオーケストレーション","situation":"ある研究機関の開発チームは、Claude Agent SDKでマルチエージェントリサーチシステムを構築しています。\n\n「国内の再生医療研究の動向」を調べたところ、ウェブ検索サブエージェントは関連する論文と報道を28件見つけ、文書分析サブエージェントも各論文の要点を正しく抽出していました。ところが、統合サブエージェントが作った草稿は、どの調査結果にも触れない一般論ばかりでした。\n\nログを確認すると、コーディネーターが統合サブエージェントを呼び出したときのプロンプトは、「これまでの検索結果と分析結果を統合して草稿を作ってください」の1文だけでした。","question":"最も可能性の高い根本原因はどれですか。","choices":[{"text":"文書分析サブエージェントが要点を短く要約しすぎ、統合に必要な情報が失われている。","explanation":"要約のしすぎで数値や出典が失われるのは、統合の品質を下げるよくある原因です。しかし本問では文書分析サブエージェントは要点を正しく抽出しており、その結果がどれだけ短くても、統合サブエージェントに渡っていなければ草稿には反映されません。原因は分析の質ではなく受け渡しにあります。"},{"text":"統合サブエージェントのコンテキストウィンドウが、28件分の検索結果で埋まってあふれている。","explanation":"大量の検索結果を渡すと、コンテキストを圧迫して処理が不安定になることは実際にあります。しかしログでは統合サブエージェントへのプロンプトは1文だけで、検索結果はそもそも渡されていません。あふれるほどの情報が入っていないことが、むしろ今回の症状の原因です。"},{"text":"統合サブエージェントのツールに検索ツールが含まれておらず、自分で情報を集められない。","explanation":"統合サブエージェントに検索ツールがないのは、役割を限定するための適切な設計です。調査は検索と文書分析のサブエージェントの担当であり、統合サブエージェントが自分で集め直すのは関心の分離に反します。必要なのは検索ツールではなく、すでに集めた調査結果をプロンプトで渡すことです。"},{"text":"統合サブエージェントには調査結果が自動では渡らず、プロンプトにも含まれていない。","explanation":"正解。サブエージェントは分離されたコンテキストで動き、コーディネーターの会話履歴や他のサブエージェントの結果を自動的には受け取りません。依頼文が「これまでの結果を統合して」の1文だけでは、統合サブエージェントの手元には統合すべき材料が何もなく、一般論で埋めるしかありません。先行する調査結果の全体をプロンプトに直接含める必要があります。"}],"answer":[3],"overall":"公式ガイド（タスクステートメント1.3）は、サブエージェントが親のコンテキストを自動的に継承せず、呼び出し間でメモリも共有しないため、必要なコンテキストはプロンプトで明示的に提供しなければならないとしています。\n\nそのうえで、ウェブ検索結果や文書分析の出力のように、先行するエージェントの調査結果全体を統合サブエージェントのプロンプトに直接含めることを求めています。Agent SDKのドキュメントでも、サブエージェントは新しいコンテキストで起動し、受け取るのは委任時に渡されたプロンプトだと説明されています。本問の上流の2つのサブエージェントは正常に動いており、壊れているのは「統合への受け渡し」だけです。\n\n見分け方の決め手は、ログが示す委任プロンプトの中身です。コンテキストのあふれや要約のしすぎは、材料が渡っていることを前提とした原因で、今回の状況とは合いません。\n\n本番では、委任プロンプトに調査結果を出典情報付きの構造化データとして埋め込み、統合サブエージェントがどの結果に基づいて書いたかを追えるようにします。\n\n参考: https://code.claude.com/docs/en/agent-sdk/subagents"},{"id":49,"scenario":"コンテキスト管理と信頼性","situation":"ある通信事業者の開発チームは、Claude Agent SDKでカスタマーサポート解決エージェントを構築しています。ある顧客は1回の問い合わせの中で、次の3つを相談しました。\n\n(1)9月分の請求で通話料が二重に計上されている件\n\n(2)端末の分割払いの残額の件\n\n(3)解約した場合の違約金の件\n\nやり取りが30ターンを超えると、エージェントは二重計上の金額と分割払いの残額を取り違えたり、すでに解決した(1)をもう一度調べ始めたりしました。また、注文照会のツールは1回あたり40以上のフィールドを返しています。","question":"改善策として適切なものはどれですか。（2つ選択してください。）","choices":[{"text":"解決した案件のターンを会話履歴から削除し、未解決の案件のやり取りだけを残す。","explanation":"不要になった情報をコンテキストから外すという発想自体は、コンテキスト管理として妥当です。しかし会話履歴から直接ターンを削ると、顧客との会話の流れや、解決した案件で顧客に何を伝えたかが失われ、応答の一貫性を損ないます。解決済みであるという事実自体も残りません。"},{"text":"案件ごとの番号・金額・状態を構造化し、会話とは別のレイヤーに保持して毎ターン渡す。","explanation":"正解。複数の問題を扱うセッションでは、案件ごとの構造化されたデータ（番号、金額、ステータス）を抽出し、会話履歴とは別のコンテキストレイヤーに永続化するのが有効です。(1)が解決済みであることや各案件の金額が毎ターン明示されるので、取り違えや解決済み案件の調べ直しを防げます。"},{"text":"ツールの出力は、各案件に関係するフィールドだけに切り詰めてから会話に加える。","explanation":"正解。注文照会のたびに40以上のフィールドが会話に積み上がると、関連性に見合わない量のトークンを消費し、重要な値が大量の無関係な情報に埋もれます。請求額や残額など案件に必要なフィールドだけを残してから会話に加えれば、コンテキストの節約と取り違えの防止を両立できます。"},{"text":"3つの案件を1つの要約文にまとめ、古いターンはその要約に置き換えて送信する。","explanation":"要約でコンテキストを節約するのは、長いやり取りで一般的に使われる手法です。しかし3つの案件を1つの文章にまとめると、金額や状態がどの案件のものかがかえってあいまいになり、取り違えが起きやすくなります。段階的な要約は数値をあいまいにするリスクもあります。"}],"answer":[1,2],"overall":"公式ガイド（タスクステートメント5.1）は、複数の問題を扱うセッションのために構造化された問題データ（注文ID、金額、ステータス）を抽出して別のコンテキストレイヤーに永続化すること、そして冗長なツール出力がコンテキストに蓄積する前に関連するフィールドだけに切り詰めることを挙げています。\n\nまた、ツールの結果が蓄積して関連性に見合わない量のトークンを消費する例として、注文照会ごとに40以上のフィールドが返される状況を示しています。本問の2つの症状、つまり案件の取り違えとコンテキストの肥大に、正解の2つがそれぞれ対応します。\n\n見分け方の決め手は、案件ごとの事実を「会話とは別に、構造を保ったまま」持てるかどうかです。1つの要約文にまとめる案は構造を崩し、ターンの削除は会話の一貫性を失わせます。Anthropicのコンテキストエンジニアリングの解説でも、必要な情報だけを高い密度でコンテキストに置くことが重要とされています。\n\n本番では、案件のレイヤーに「顧客に伝えた内容」も記録しておくと、後で人間の担当者へ引き継ぐときのハンドオフサマリーにも使えます。\n\n参考: https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents"},{"id":50,"scenario":"Claude Codeの設定とワークフロー","situation":"ある家電メーカーの開発チームは、開発者の生産性を上げるためにClaude Codeを使っています。エンジニアが、次の2つの作業を依頼しようとしています。\n\nスマート家電のファームウェア更新に使う通信ライブラリを、新しいメジャーバージョンへ移行する作業（60以上のファイルに影響し、再接続処理の実装方針も複数考えられる）\n\n設定画面に表示されるエラーメッセージの誤字を1か所直す作業","question":"進め方として適切なものはどれですか。（2つ選択してください。）","choices":[{"text":"ライブラリの移行はプランモードで調査・計画し、計画の承認後に直接実行で実装する。","explanation":"正解。影響するファイルが多く、実装方針も複数考えられる作業は、プランモードで変更前にコードベースを調べて設計するのが適しています。計画を確認して承認した後は、決めた方針に沿って直接実行で実装すれば、調査と実装のそれぞれに合ったモードを使い分けられ、コストのかかる手戻りも防げます。"},{"text":"ライブラリの移行は、影響するファイルを10件ずつに分け、それぞれを直接実行で順に修正する。","explanation":"作業を小さな単位に分けて順に進めるのは、置き換える内容が決まっている機械的な変更（APIの名前の一括変更など）なら、差分を確かめやすい進め方です。しかし本問の移行では、再接続処理の実装方針がまだ決まっていません。方針を決めないまま10件ずつ直すと、グループごとに異なる実装が混ざったり、後のグループで方針を変えて前のグループを直し直したりすることになります。"},{"text":"誤字の修正もプランモードで計画を作成させ、内容をレビューしてから実行する。","explanation":"どんな変更でも計画を確認してから進めるのは慎重なやり方に見えますが、プランモードには相応の手間がかかります。1か所の誤字修正は内容が明確で範囲も限られており、差分を1文で説明できる変更です。計画を挟んでも得られるものはほとんどありません。"},{"text":"誤字の修正は、プランモードを使わずに直接実行で行う。","explanation":"正解。直接実行は、単純で範囲が明確な変更に適しています。エラーメッセージの誤字1か所は、どのファイルの何を変えるかが明らかで、別の方針を検討する余地もありません。そのまま依頼して修正させ、差分を確認すれば十分です。"}],"answer":[0,3],"overall":"公式ガイド（タスクステートメント3.4）は、プランモードを大規模な変更・複数の有効なアプローチ・アーキテクチャ上の決定・複数ファイルの修正を伴う複雑なタスク向けとし、直接実行を単純で範囲が明確な変更向けとしています。\n\nさらに、調査のためのプランモードと実装のための直接実行を組み合わせる進め方（ライブラリ移行を計画し、その後に計画したアプローチを実行する）も挙げています。Claude Codeのベストプラクティスにも、差分を1文で説明できる小さな修正は計画を省いて直接頼むよう書かれています。\n\n本問の2つの作業は、この両極端に当たります。見分け方の決め手は、それぞれの作業について「実装の方針を先に決める必要があるか」と「範囲が明確か」を確かめることです。移行は方針の判断を伴うので、計画を立てずにファイルを分けて直す案は不適切で、誤字修正は範囲が明確なので計画は不要です。\n\n本番では、計画を承認する前にCtrl+Gで計画を編集し、再接続処理の方針など判断が分かれる点を明記してから実装に進むと、後の議論が減ります。\n\n参考: https://code.claude.com/docs/en/permission-modes"},{"id":51,"scenario":"Claude Codeの設定とワークフロー","situation":"あるスポーツ用品メーカーの開発チームは、GitHub ActionsでClaude Codeを実行し、プルリクエストごとにテストコードの生成と、そのテストのレビューを行っています。現在のジョブは、claude -pでテストを生成したあと、claude -p --continueで同じセッションを続け、「生成したテストをレビューして」と依頼しています。\n\nレビューではほとんど指摘が出ないのに、マージ後にテストの抜けや誤った期待値が見つかっています。","question":"改善策として適切なものはどれですか。（2つ選択してください。）","choices":[{"text":"生成のプロンプトに「出力前に自分で確認すること」と追記し、レビューの実行を省く。","explanation":"生成時に自己点検を指示すると、明らかな書き間違いが減ることはあります。しかしこれは同じコンテキストでのセルフレビューであり、生成時の前提の誤りには気づきにくいままです。独立したレビューを省くと、現在よりも見落としが増えるおそれがあります。"},{"text":"テスト標準とレビュー基準をリポジトリのCLAUDE.mdに書き、レビューの実行でもその基準を参照させる。","explanation":"正解。CIから呼び出されるClaude Codeにとって、CLAUDE.mdはテスト標準やレビュー基準などのプロジェクトのコンテキストを伝える仕組みです。「境界値と異常系を必ず含める」「期待値は仕様書の値と照合する」のような基準を書いておけば、レビューで何を確認すべきかが具体的になり、抜けや誤った期待値を指摘しやすくなります。"},{"text":"生成と同じセッションを--resumeで再開し、「厳しく確認すること」とプロンプトを強める。","explanation":"--resumeは特定のセッションの続きから作業したいときに便利なフラグですが、ここでは--continueと同じく生成時のコンテキストを引き継ぎます。指示の言葉を強めても、自分の推論に沿ってテストを読む状態は変わりません。問題はプロンプトの強さではなく、セッションが分離されていないことです。"},{"text":"レビューは--continueを付けない別のclaude -p実行にし、新しいセッションで差分を読ませる。","explanation":"正解。--continueは直前のセッションを引き継ぐため、レビューする側がテストを書いたときの推論をそのまま持っています。コードを生成したのと同じセッションは、独立したレビューインスタンスに比べて自分の変更を疑いにくく、指摘が出にくくなります。別の実行にすれば、差分だけを見た独立したレビューになります。"}],"answer":[1,3],"overall":"公式ガイド（タスクステートメント3.6）は、コードを生成したのと同じClaudeセッションは、独立したレビューインスタンスと比べて自身の変更をレビューする効果が低いこと、そしてCIから呼び出されるClaude Codeにテスト標準やレビュー基準を伝える仕組みとしてCLAUDE.mdを挙げています。\n\nclaude -p --continueは直前の会話を引き継ぐため、現在のジョブは実質的にセルフレビューになっています。正解の1つ目はレビューを別のセッションにしてこの問題を解消し、2つ目はレビューで確認すべき基準をプロジェクトのコンテキストとして与えます。\n\n見分け方の決め手は、--continueと--resumeがどちらも「同じ会話を続ける」フラグだと理解しているかどうかです。プロンプトを強める案と自己点検の案は、いずれも同じコンテキストのまま確認させる点で現在の問題を解決しません。\n\n本番では、生成ジョブとレビュージョブをワークフローの別ステップに分け、レビュー側には差分とCLAUDE.mdだけが入る状態にしておきます。\n\n参考: https://code.claude.com/docs/en/headless"},{"id":52,"scenario":"ツール設計とMCP統合","situation":"ある農業IoT企業の開発チームは、Claude Agent SDKで開発者の生産性向上ツールを構築しています。このエージェントでは、組み込みのRead・Grep・Globが有効になっています。現場の担当者から、「センサーIDが登録されていません」というエラーが出るという報告がありました。エンジニアは、次の2点を知りたいと考えています。\n\nこのメッセージがどこで出力されているか\n\nセンサーIDを検証するvalidateSensorId関数がどこから呼ばれているか","question":"エージェントに使わせるツールの選び方として適切なものはどれですか。（2つ選択してください。）","choices":[{"text":"Globで**/*sensor*に一致するファイルを列挙し、見つかったファイルを順にReadで読む。","explanation":"Globは、名前や拡張子のパターンでファイルを見つけるのに適したツールです。しかしエラーメッセージを出力するコードや関数の呼び出し元が、ファイル名にsensorを含むとは限りません。名前で集めたファイルを順に読むやり方は、関係のないファイルまで読む一方で、肝心の箇所を見落とすおそれがあります。"},{"text":"Grepでエラーメッセージの文字列を検索し、出力している箇所を特定する。","explanation":"正解。Grepはファイルの内容からパターンを検索するツールで、エラーメッセージの場所の特定に向いています。「センサーIDが登録されていません」をそのまま検索すれば、メッセージを定義しているファイルと行がすぐに分かり、そこから周辺のコードをReadで確認できます。"},{"text":"Bashのfindで、ファイル名にerrorを含むファイルを探して内容を確認する。","explanation":"findはファイルを名前や属性で探すコマンドで、ファイルの場所を調べたいときには役立ちます。しかしエラーメッセージがerrorという名前のファイルに書かれているとは限らず、関数の呼び出し元の検索にもなりません。内容を検索すべき場面で、ファイル名の検索を使っています。"},{"text":"Grepでコードベース全体からvalidateSensorIdの呼び出しを検索する。","explanation":"正解。ある関数の呼び出し元をすべて見つけるのは、Grepによる内容検索の代表的な使い方です。validateSensorId(のようなパターンで検索すれば、どのファイルのどの処理がこの検証を通っているかが一覧でき、エラーが起きうる経路を絞り込めます。"}],"answer":[1,3],"overall":"公式ガイド（タスクステートメント2.5）は、関数名・エラーメッセージ・import文などのパターンをファイルの内容から検索するためにGrepを選び、ある関数のすべての呼び出し元を見つけたり、エラーメッセージの場所を特定したりすることを挙げています。一方、Globは名前や拡張子のパターンでファイルを見つけるためのツールです。\n\n本問で知りたい2つのこと、つまりメッセージの出力箇所と関数の呼び出し元は、どちらもファイルの「中身」に書かれている情報なので、Grepが適しています。\n\n見分け方の決め手は、探している情報がファイルの名前にあるのか、内容にあるのかを区別することです。Globとfindの案は、どちらもファイル名で当たりを付けようとしており、内容で決まる情報を探す手段としては不確実です。\n\n本番では、Grepで見つかった箇所をReadで開いて前後の処理を確認し、エラーが出る条件を特定してから修正方針を立てます。\n\n参考: https://code.claude.com/docs/en/tools-reference"},{"id":53,"scenario":"エージェントアーキテクチャとオーケストレーション","situation":"ある農業機械メーカーの開発チームは、Claude Agent SDKで開発者の生産性向上ツールを構築しています。このエージェントは、灌漑制御システムのインフラ設定リポジトリでも作業します。本番環境への反映は、担当者がterraform planの結果を確認してから行う決まりです。\n\nしかし先月、エージェントがBashでterraform applyを実行し、ある圃場の給水スケジュールが意図せず変わる事故が起きました。CLAUDE.mdには「applyは実行しないこと」と書かれていました。","question":"再発防止策として適切なものはどれですか。（2つ選択してください。）","choices":[{"text":"PreToolUseフックで、terraform applyを含むBashの呼び出しを拒否する。","explanation":"正解。PreToolUseフックはツールが実行される前に呼び出しをインターセプトし、permissionDecisionに\"deny\"を返すことで実行を止められます。CLAUDE.mdの指示はモデルが従うかどうかに左右されますが、フックはコードで毎回確実に評価されるため、applyが実行されることはなくなります。"},{"text":"拒否の理由に、planの結果を担当者の確認に回す手順を示し、代わりの手順へ進ませる。","explanation":"正解。permissionDecisionReasonで拒否の理由と代わりの手順を伝えれば、エージェントは止められた後に何をすべきかを理解し、planの結果をまとめて担当者に確認を依頼する、という正しいワークフローに進めます。単に止めるだけでなく、ポリシーに沿った手順へ誘導できます。"},{"text":"CLAUDE.mdの記述を冒頭に移し、「IMPORTANT」を付けて強調して書き直す。","explanation":"特に守らせたい1行に強調を付けるのは、CLAUDE.mdの指示が埋もれている場合の改善策としては有効です。しかしCLAUDE.mdはモデルが参照するコンテキストであり、強制される設定ではありません。強調しても遵守は確率的なままで、本番への誤った反映を確実には防げません。"},{"text":"PostToolUseフックで、applyの実行結果を検出したら直前の状態にロールバックする。","explanation":"PostToolUseフックは、ツールの実行結果をモデルが処理する前に変換したり記録したりするのに適しています。しかしこの時点ではapplyはすでに実行され、本番の給水スケジュールは変わっています。ロールバックが間に合わない、あるいは失敗するおそれもあり、事故を未然に防ぐ仕組みにはなりません。"}],"answer":[0,1],"overall":"公式ガイド（タスクステートメント1.5）は、ポリシーに違反する操作をブロックし、人間へのエスカレーションのような代替のワークフローにリダイレクトするツール呼び出しインターセプトフックを実装すること、そしてビジネスルールで確実な遵守が求められる場合にはプロンプトによる強制ではなくフックを選ぶことを挙げています。\n\nAgent SDKのPreToolUseフックは、permissionDecisionを\"deny\"にして呼び出しを止め、permissionDecisionReasonで理由をモデルに伝えられます。正解の2つは、この「確実に止める」と「代わりの手順へ導く」に当たります。\n\n見分け方の決め手は、事故がCLAUDE.mdに禁止が書かれていたにもかかわらず起きたという点です。これは指示が確率的にしか守られないことを示しており、強調して書き直す案は同じ仕組みに頼り続けます。PostToolUseは実行後に動くため、防止策になりません。\n\n本番では、matcherをBashに絞ったうえで、tool_inputのcommandを確認してapplyやdestroyなどの破壊的なサブコマンドをまとめて判定します。\n\n参考: https://code.claude.com/docs/en/agent-sdk/hooks"},{"id":54,"scenario":"エージェントアーキテクチャとオーケストレーション","situation":"ある広告代理店の開発チームは、Claude Agent SDKでマルチエージェントリサーチシステムを構築しています。新商品の市場調査では、10代・20代・30代・40代・50代以上の5つの年代について、それぞれ独立に消費動向を調べたうえで、最後に年代間の比較をまとめます。\n\nログを見ると、コーディネーターは1回の応答でAgentツール（旧Taskツール）を1回だけ呼び出し、結果が返るのを待ってから次の年代を委任していました。そのため、調査全体に想定の5倍の時間がかかっていました。","question":"改善策として適切なものはどれですか。（2つ選択してください。）","choices":[{"text":"5つの年代の調査は、コーディネーターの1つの応答で複数のAgentツール呼び出しとして出させる。","explanation":"正解。互いに依存しない調査は、コーディネーターが1つの応答の中で複数のAgentツール呼び出しを出せば、サブエージェントが並列に起動します。別々のターンに分けて1件ずつ委任する現在のやり方に比べ、5つの年代の調査がほぼ同時に進むので、全体の所要時間が大きく短縮されます。"},{"text":"年代間の比較も含めた6つの委任を、すべて同じ応答で同時に出させる。","explanation":"並列化できるものをまとめて出す考え方は正しいのですが、年代間の比較は5つの調査結果を材料にする依存したタスクです。同時に起動すると、比較を担当するサブエージェントには材料がまだそろっておらず、中身のない比較しか作れません。依存関係のあるタスクまで並列にしてはいけません。"},{"text":"年代間の比較は、5つの調査結果がそろってから、次のターンで委任させる。","explanation":"正解。比較は5つの調査結果に依存するので、並列に起動した調査がすべて完了してから、その結果をプロンプトに含めて別のターンで委任するのが適切です。独立したタスクは並列に、依存するタスクは順番に、と分けることで、速さと結果の質を両立できます。"},{"text":"コーディネーターからAgentツールを外し、5つの年代を1つのプロンプトでまとめて調べさせる。","explanation":"1つのエージェントにまとめると委任の往復はなくなりますが、5つの年代の調査結果がすべて1つのコンテキストに積み上がり、注意が分散して各年代の調査が浅くなりがちです。専門化したサブエージェントに分けて並列に進めるという、マルチエージェント構成の利点も失われます。"}],"answer":[0,2],"overall":"公式ガイド（タスクステートメント1.3）は、別々のターンに分けるのではなく、コーディネーターの1つの応答で複数のAgentツール（旧Taskツール）呼び出しを出力することで、サブエージェントを並列に起動することを挙げています。\n\nAnthropicのマルチエージェントリサーチシステムの解説でも、リードエージェントが複数のサブエージェントを並列に起動することで、複雑な調査の時間を大幅に短縮できたと報告されています。ただし並列化できるのは互いに依存しないタスクだけです。本問の5つの年代の調査は独立していますが、年代間の比較はその結果に依存しています。\n\n見分け方の決め手は、各タスクの入力が他のタスクの出力を必要とするかどうかです。6つすべてを同時に出す案は依存関係を無視しており、1つのプロンプトにまとめる案は並列化の利点そのものを捨てています。\n\n本番では、委任するタスクの依存関係をコーディネーターのプロンプトに明示しておくと、並列にするタスクと順番に進めるタスクの判断が安定します。\n\n参考: https://www.anthropic.com/engineering/multi-agent-research-system"},{"id":55,"scenario":"エージェントアーキテクチャとオーケストレーション","situation":"ある会計事務所の開発チームは、Claude Agent SDKで開発者の生産性向上ツールを構築しています。このツールにはセッションの再開機能があり、エンジニアはコードベースの調査を数日に分けて進められます。\n\n今朝、2人のエンジニアが前日の調査の続きを始めようとしています。\n\nAさんは税額計算モジュールを調査中で、昨日以降の変更はREADMEの誤字修正1件だけ\n\nBさんは仕訳エンジンを調査中だが、夜間に大規模なリファクタリングがマージされ、昨日分析したファイルの約4割が移動または名前変更された","question":"それぞれの再開方法として最も適切なものはどれですか。","choices":[{"text":"Aさん・Bさんとも前日のセッションをそのまま再開し、変更があったファイルの一覧だけを伝える。","explanation":"再開して変更ファイルを伝える方法は、以前のコンテキストがおおむね有効な場合に適しています。Aさんにはこれで十分ですが、Bさんのセッションには移動・改名前のパスやコードを前提にした古いツール結果が大量に残っています。一覧を伝えても、古い結果に引きずられた推論が起きるおそれがあります。"},{"text":"Aさんは新しいセッションに前日の要約を注入して開始し、Bさんは前日のセッションをそのまま再開する。","explanation":"判断が逆になっています。要約を注入した新しいセッションは、以前のツール結果が古くなっている場合に信頼性が高い方法で、変更がほとんどないAさんには不要な手間です。一方、ファイルの4割が変わったBさんがそのまま再開すると、古くなったツール結果を抱えたまま調査を続けることになります。"},{"text":"Aさん・Bさんとも新しいセッションを開始し、前日の調査をそれぞれ最初からやり直させる。","explanation":"最初からやり直す方法は、前日の調査が使い物にならないほど状況が変わった場合の最後の手段にはなります。しかしAさんの前日の分析はほぼそのまま有効で、やり直すと読み込み済みのファイルや判断をすべて捨てることになります。Bさんの場合も、移動していない6割の調査結果まで捨てる必要はありません。"},{"text":"Aさんは前日のセッションをそのまま再開し、Bさんは有効な調査結果の要約を新しいセッションに注入する。","explanation":"正解。Aさんは前日のコンテキストがほぼ有効なので、再開すれば読み込み済みのファイルと分析をそのまま使えます。Bさんは多くのツール結果が古くなっているため、移動していない部分の調査結果だけを構造化した要約にして新しいセッションへ渡すほうが、古い前提に引きずられずに済みます。"}],"answer":[3],"overall":"Agent SDKのセッションは会話履歴を保存しており、resumeで再開すると、読んだファイルや以前の分析を含む完全なコンテキストから続けられます。公式ガイド（タスクステートメント1.7）は、以前のコンテキストがおおむね有効な場合は再開を、以前のツール結果が古くなっている場合は構造化されたサマリーを注入して新たに開始することを選ぶよう求めています。\n\nセッションが保存するのは会話であってファイルシステムではないため、コードが大きく変わると、履歴の中のツール結果は現在のコードと食い違います。\n\n見分け方の決め手は、2人の「前日以降の変更量」の違いです。変更が1件だけのAさんは再開、4割が変わったBさんは新規開始という対応を見抜ければ、両方を同じ扱いにする選択肢と、判断を逆にした選択肢を除外できます。\n\n本番では、再開か新規開始かを変更されたファイル数や対象範囲で決める基準を、ツール側で提示するとエンジニアが迷いません。\n\n参考: https://code.claude.com/docs/en/agent-sdk/sessions"},{"id":56,"scenario":"プロンプトエンジニアリングと構造化出力","situation":"ある非営利団体の開発チームは、寄付管理システムのCIパイプラインにClaude Codeを組み込み、夜間にテストケースを生成しています。現在の夜間ジョブでは、次のやり取りを1ファイルあたり平均6回繰り返しています。\n\nClaudeがテストを書く\n\nBashでテストを実行する\n\n失敗した結果を見て修正する\n\n予算が限られているため、50%のコスト削減を見込んでMessage Batches APIへの移行を検討しています。","question":"移行の設計として適切なものはどれですか。（2つ選択してください。）","choices":[{"text":"リクエストのcustom_idを連番にして、1つのリクエストの中で前のリクエストの結果を参照させる。","explanation":"custom_idは、バッチのリクエストとレスポンスを対応付けるための識別子で、結果を突合したり失敗分だけを再送したりするのに使います。各リクエストは独立して処理されるため、IDを連番にしても、あるリクエストが別のリクエストの結果を参照できるようにはなりません。"},{"text":"ソースと既存テストをあらかじめプロンプトに含め、1回の応答で完結するテスト案の生成だけをバッチに送る。","explanation":"正解。必要なソースコードと既存のテストをあらかじめプロンプトに含めておけば、各リクエストはツールを使わずに1回の応答で完結します。こうしたテスト案の下書きは、夜間に処理すればよいノンブロッキングな作業なので、バッチ処理の50%のコスト削減を活かせます。"},{"text":"テストを実行して失敗を見ながら直す反復は、ツールの結果を返せる同期の実行に残す。","explanation":"正解。テストの実行結果を見て修正するやり取りは、ツールを実行して結果を返し、次のターンに進むマルチターンのツール呼び出しです。これはclaude -pのような同期の実行なら1つのセッションの中で自然に繰り返せますが、バッチの1リクエストでは扱えません。反復が必要な部分は同期の実行に残すのが適切です。"},{"text":"バッチの各リクエストにBashツールを定義し、バッチの処理中にテストを実行させて結果を受け取る。","explanation":"バッチのリクエストにもツールの定義は含められますが、Claudeがツールの呼び出しを返した時点でそのリクエストの処理は終わります。バッチがリクエストの途中でツールを実行して結果を返すことはできず、テストを実行して結果を返すには、改めて新しいリクエストを送る必要があります。1つのリクエストの中で実行と修正を繰り返すことはできません。"}],"answer":[1,2],"overall":"公式ガイド（タスクステートメント4.5）は、バッチAPIが1つのリクエストの中でのマルチターンのツール呼び出しをサポートしておらず、リクエストの途中でツールを実行して結果を返すことはできないとしています。Message Batches APIのドキュメントでも、バッチ内の各リクエストは独立して処理され、結果はcustom_idで対応付けると説明されています。\n\n本問の夜間ジョブは「書く・実行する・直す」を繰り返すマルチターンのツール使用なので、そのままバッチに載せることはできません。そこで、反復が必要な部分は同期の実行に残し、1回の応答で完結するように入力をそろえた部分だけをバッチに回すのが正解です。\n\n見分け方の決め手は、各リクエストが「途中でツールの結果を受け取る必要があるか」です。Bashツールの定義とcustom_idの連番は、どちらもリクエストの途中や間で結果をやり取りできるという誤解に基づいています。\n\n本番では、バッチで作ったテスト案を翌朝の同期ジョブで実行し、失敗したものだけを修正に回すと、コストと品質を両立できます。\n\n参考: https://platform.claude.com/docs/en/build-with-claude/batch-processing"},{"id":57,"scenario":"ツール設計とMCP統合","situation":"あるEC事業者の開発チームは、Claude Agent SDKで開発者の生産性向上ツールを構築しています。エンジニアが、割引計算の内部関数applyDiscountの仕様を変える前に、影響を受ける箇所をすべて洗い出そうとしています。\n\nエージェントがGrepでapplyDiscountを検索したところ、見つかった呼び出しは2か所だけでした。しかし実際には、多くの画面がlib/pricing/index.tsというラッパーモジュールを経由しており、そこではexport { applyDiscount as discountedPrice }のように別名で再エクスポートされています。","question":"使用箇所を漏れなく追跡する方法として最も適切なものはどれですか。","choices":[{"text":"ラッパーがエクスポートする名前をすべて特定し、各名前でGrepをかける。","explanation":"正解。ラッパーモジュールが関数を別名で再エクスポートしている場合、元の関数名で検索しても呼び出し元には一致しません。まずlib/pricing/index.tsを読んでエクスポートされている名前（discountedPriceなど）をすべて洗い出し、それぞれの名前でコードベース全体を検索すれば、ラッパー経由の使用箇所も漏れなく追跡できます。"},{"text":"画面のコンポーネントのファイルを先頭から順にReadで読み、割引の処理を探す。","explanation":"ファイルを1つずつ読めば見落としは減るように見えますが、画面のファイルが多い場合はコンテキストと時間を大量に消費します。検索で絞り込める情報があるのに全件を読むのは、組み込みツールの使い方として非効率です。読み進めるうちにコンテキストが劣化し、かえって見落としが起きることもあります。"},{"text":"Globで**/pricing/**に一致するファイルを列挙し、それらをすべてReadで読んで確認する。","explanation":"Globでディレクトリ配下のファイルを列挙するのは、関係しそうなファイルの範囲をつかむには役立ちます。しかし割引関数を使っているのはpricingディレクトリの外にある多数の画面で、このやり方ではそれらを見つけられません。ラッパー自体のファイルを読んでも、どこから使われているかは分かりません。"},{"text":"Grepの大文字小文字を区別しない検索でapplyDiscountを再検索し、表記ゆれも拾う。","explanation":"大文字小文字を区別しない検索は、命名規則のぶれで検索漏れが起きている場合には有効です。しかし本問の呼び出し元は、applyDiscountとは別の名前であるdiscountedPriceで関数を使っています。表記ゆれをいくら拾っても、別名での呼び出しは検索に一致しません。"}],"answer":[0],"overall":"公式ガイド（タスクステートメント2.5）は、まずエクスポートされたすべての名前を特定し、次にコードベース全体で各名前を検索することで、ラッパーモジュールをまたぐ関数の使用箇所を追跡することを挙げています。Grepはファイルの内容に対するパターン検索なので、検索する文字列が実際に呼び出しで使われている名前と一致して初めて結果が得られます。\n\n本問では、元の関数名で2か所しか見つからないこと自体が、別名で使われていることを示す手がかりです。\n\n見分け方の決め手は、検索の漏れの原因が「表記ゆれ」ではなく「別名による再エクスポート」だと見抜くことです。大文字小文字を無視する検索は前者には効きますが後者には効かず、Globやファイルの通読は検索の代わりにはなりません。\n\n本番では、ラッパーが複数段に重なっている場合もあるため、見つかった別名がさらに再エクスポートされていないかも同じ手順で確認します。\n\n参考: https://code.claude.com/docs/en/tools-reference"},{"id":58,"scenario":"Claude Codeの設定とワークフロー","situation":"ある医療機関向けシステムの開発チームは、Claude Codeで検査結果の表示形式を変換する関数を作成しています。検査機器が出力する「GLU 126 H」のような文字列を、「血糖値: 126 mg/dL（基準値より高い）」という表示に変換する必要があります。\n\n変換ルールを文章で詳しく説明しましたが、生成された関数は、単位を付け忘れたり、低値を示す「L」を高値として扱ったりと、生成のたびに解釈がぶれています。","question":"この変換の要件を伝える方法として最も効果的なものはどれですか。","choices":[{"text":"インタビューパターンで、変換について確認したい点をClaudeに質問させる。","explanation":"インタビューパターンは、不慣れな領域で実装を始める前に、開発者が想定していなかった考慮事項を洗い出すのに有効です。しかし本問では変換の要件はすでに決まっており、足りないのは要件の伝え方です。質問に答えても文章でのやり取りが続くだけで、解釈のぶれは残ります。"},{"text":"変換前と変換後の組を、高値・低値・基準内を含めて2〜3個具体的に示す。","explanation":"正解。文章による説明が一貫しない解釈を生む場合、期待する変換を伝える最も効果的な方法は具体的な入出力の例です。「GLU 126 H」→「血糖値: 126 mg/dL（基準値より高い）」、「GLU 58 L」→「…（基準値より低い）」のように高値・低値・基準内をそろえて示せば、単位の付け方とフラグの意味が例から一意に読み取れます。"},{"text":"変換ルールの説明文を、項目ごとの例外も含めて今の3倍の分量に書き足す。","explanation":"説明を詳しくすることは、要件そのものが不足している場合には必要な対応です。しかし本問では、すでに詳しく説明したうえで解釈がぶれています。文章を増やすほど解釈の余地も増えやすく、「L」の意味のような取り違えを確実に防ぐことはできません。"},{"text":"変換の処理を担当する関数名と引数を指定し、その関数だけを書き直させる。","explanation":"対象の関数を指定して範囲を絞ることは、無関係なコードまで書き換えられるのを防ぐうえでは有効です。しかし本問の問題は変換ルールの解釈であり、どの関数を直すかは明確です。範囲を絞っても、同じ説明から同じ取り違えが起きます。"}],"answer":[1],"overall":"公式ガイド（タスクステートメント3.5）は、文章による説明が一貫性なく解釈される場合に、期待する変換を伝える最も効果的な方法として具体的な入出力の例を挙げ、自然言語の説明では一貫しない結果になるときは2〜3個の具体例を示して変換の要件を明確にするよう求めています。Anthropicのプロンプトのベストプラクティスでも、よく選んだ例は出力の形式や判断の仕方を正確に伝える手段とされています。\n\n本問の症状は、単位の付け忘れや「L」の取り違えといった、文章のどこをどう読むかで変わる解釈のぶれです。\n\n見分け方の決め手は、要件はすでに確定しており、伝え方だけが問題になっている点です。説明の追加とインタビューは文章でのやり取りを増やすだけで、関数の指定は範囲の問題を解決するものです。\n\n本番では、示した入出力の例をそのままテストケースにしておくと、後の修正で変換が崩れたときにすぐ気づけます。\n\n参考: https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices"},{"id":59,"scenario":"Claude Codeの設定とワークフロー","situation":"ある建設会社の開発チームは、Claude Codeで施工管理システムのモノレポを開発しています。共通の標準はリポジトリのルートのdocs/standards/に置き、各パッケージのメンテナーが必要な標準だけを選んで、パッケージのCLAUDE.mdから@importで取り込む方針です。\n\n見積パッケージのpackages/estimate/CLAUDE.mdに@docs/standards/estimate.mdと書きましたが、/contextで確認すると、この標準ファイルが読み込まれていません。","question":"最も適切な修正はどれですか。","choices":[{"text":"Claude Codeを常にリポジトリのルートで起動し、パスがルート基準で解決されるようにする。","explanation":"起動するディレクトリによってCLAUDE.mdの読み込み方が変わることはありますが、@importの相対パスは作業ディレクトリを基準に解決されるわけではありません。どこで起動しても、packages/estimate/CLAUDE.mdに書いた相対パスはそのファイルの場所から解決されるので、この方法では読み込まれないままです。"},{"text":"@importをやめ、estimate.mdの内容をpackages/estimate/CLAUDE.mdにコピーして貼り付ける。","explanation":"内容をコピーすれば、そのパッケージでは確かに標準が読み込まれます。しかし共通の標準を1か所で管理し、メンテナーが必要なものを選んで取り込むという方針が崩れ、標準を改訂するたびにコピー先をすべて直す必要が生じます。読み込まれない原因はパスの書き方なので、構文を捨てる必要はありません。"},{"text":"@importの行を~/.claude/CLAUDE.mdに移し、ユーザーレベルで読み込まれるようにする。","explanation":"ユーザーレベルのCLAUDE.mdは、自分だけに適用したい個人的な設定を置く場所です。ここに書いた指示はバージョン管理でチームメイトと共有されないため、他のメンバーの環境では見積の標準が読み込まれません。また、見積パッケージ以外の作業でも常に読み込まれるようになります。"},{"text":"@importのパスを、CLAUDE.mdがある場所を基準にした相対パスに直す。","explanation":"正解。@importの相対パスは、インポートを書いたファイルの場所を基準に解決されます。packages/estimate/CLAUDE.mdから見た標準ファイルは「@../../docs/standards/estimate.md」なので、このように書き直せば読み込まれます。各パッケージが必要な標準だけを選んで取り込む方針も、そのまま維持できます。"}],"answer":[3],"overall":"公式ガイド（タスクステートメント3.1）は、@importを使い、メンテナーのドメイン知識に基づいて関連する標準ファイルを各パッケージのCLAUDE.mdに選択的に取り込むことを挙げています。Claude Codeのドキュメントによると、@importには相対パスと絶対パスのどちらも使え、相対パスは作業ディレクトリではなく、インポートを含むファイルの場所を基準に解決されます。\n\n本問の「@docs/standards/estimate.md」は「packages/estimate/docs/standards/estimate.md」を指すことになり、存在しないファイルを参照しています。\n\n見分け方の決め手は、「相対パスの基準がどこか」という1点です。起動ディレクトリを変える案はこの基準を誤解しており、コピーとユーザーレベルへの移動は、パスの問題を直さずに共有と選択的な取り込みという方針を崩します。\n\n本番では、修正後に見積パッケージのファイルを開いた状態で/contextを実行し、Memory filesの一覧に標準ファイルが現れることを確かめます。\n\n参考: https://code.claude.com/docs/en/memory"},{"id":60,"scenario":"ツール設計とMCP統合","situation":"あるセキュリティ製品の販売会社の開発チームは、Claude Agent SDKでカスタマーサポート解決エージェントを構築しています。エージェントは次の3つのツールを使えますが、どの説明も短い1文だけです。\n\nget_alert_detail（説明は「アラートを取得する」）\n\nget_incident（説明は「インシデントを取得する」）\n\nsearch_kb（説明は「検索する」）\n\n顧客から「昨夜通知されたブルートフォースのアラートALT-20931は対応済みですか」と聞かれたのに、エージェントはsearch_kbでFAQを検索し、一般的な対処手順を答えていました。","question":"改善策として適切なものはどれですか。（2つ選択してください。）","choices":[{"text":"search_kbの説明に、FAQ用であり個別のアラートの状況確認には使わないと書く。","explanation":"正解。「検索する」だけの説明では、どんな問い合わせにも使えるように見え、具体的なツールより先に選ばれがちです。製品の使い方やFAQを調べるためのツールであることと、使わない場面（個別のアラートやインシデントの状況確認）という境界を説明に書けば、誤ったルーティングを防げます。"},{"text":"search_kbを削除し、アラートとインシデントの2つのツールだけをエージェントに渡す。","explanation":"使い道のないツールを外すのは、ツールが多すぎて選択が不安定な場合には有効です。しかしsearch_kbは、製品の設定方法やFAQに関する問い合わせに答えるために必要なツールです。削除すると、その種の問い合わせに答えられなくなり、説明が不十分という根本原因も残ります。"},{"text":"get_alert_detailとget_incidentの説明に、IDの形式・返す項目・使い分けを書く。","explanation":"正解。ツールの説明は、モデルがツールを選ぶ際の主要な手がかりです。「ALT-で始まるアラートIDを受け取り、検知日時・対応状況・担当者を返す。インシデント全体の経過はget_incidentを使う」のように書けば、モデルは問い合わせに含まれるIDの形式と目的から、正しいツールを選べます。"},{"text":"「アラート」という語を含む質問ではget_alert_detailを使うよう、システムプロンプトに書く。","explanation":"特定の語とツールを結び付ける指示は、一見すると分かりやすい対策です。しかしこうした特定のキーワードに反応する指示は、「アラートの設定方法を知りたい」のようなFAQ向けの質問までget_alert_detailに送ってしまうなど、意図しないツールの関連付けを生みます。ツールの説明を整えるほうが確実です。"}],"answer":[0,2],"overall":"公式ガイド（タスクステートメント2.1）は、LLMがツール選択に用いる主要な仕組みはツールの説明であり、最小限の説明では類似したツール間での選択の信頼性が低下することを挙げています。\n\nそのうえで、各ツールの目的、想定される入力、出力、類似の代替ツールではなくそのツールを使うべき場面を明確に区別する説明を書くよう求めています。Claudeのツール定義のドキュメントでも、何をするのか、いつ使うべきか（使うべきでないか）、各パラメーターの意味を詳しく書くことが、ツールの性能に最も影響するとされています。本問では、具体的な2つのツールの説明と、汎用的に見えるsearch_kbの境界の両方を書くことで、選択の誤りが解消します。\n\n見分け方の決め手は、症状の原因が「説明が最小限であること」にあると見抜くことです。ツールの削除は必要な機能を失わせ、キーワードに反応する指示は新たな誤ったルーティングを生みます。\n\n本番では、説明を書き換えた後に、IDを含む問い合わせとFAQ向けの問い合わせの両方を集めた評価セットでツールの選択を確認します。\n\n参考: https://platform.claude.com/docs/en/agents-and-tools/tool-use/define-tools"}]</script>
<script>
(function(){
var Q=JSON.parse(document.getElementById('data').textContent);
var N=Q.length,L='ABCDE',NOSC='ドメイン未記載';
var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var answers=Q.map(function(){return null;});
var pending=Q.map(function(){return [];});
var cur=0,view='quiz',armTimer=null,armed=false;
function $(id){return document.getElementById(id);}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function fmt(s){
  var parts=String(s).split('`');
  if(parts.length%2===0)return esc(s);
  return parts.map(function(p,i){return i%2?'<code>'+esc(p)+'</code>':esc(p);}).join('');
}
function paras(s,link){
  return String(s).split('\n\n').map(function(p){
    var h=fmt(p);
    if(link)h=h.replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
    return '<p>'+h+'</p>';
  }).join('');
}
function sc(q){return q.scenario||NOSC;}
function isMulti(q){return q.answer.length>1;}
function sortn(a){return a.slice().sort(function(x,y){return x-y;});}
function letters(a){return sortn(a).map(function(i){return L[i];}).join('・');}
function scenarios(){var o=[];Q.forEach(function(q){var s=sc(q);if(o.indexOf(s)<0)o.push(s);});return o;}
function counts(){var a=0,ok=0,ng=0;answers.forEach(function(x){if(x){a++;if(x.ok)ok++;else ng++;}});return {a:a,ok:ok,ng:ng,un:N-a};}
function status(i){
  if(answers[i])return answers[i].ok?'ok':'ng';
  return pending[i].length?'sel':'none';
}
function toTop(){window.scrollTo({top:0,behavior:reduce?'auto':'smooth'});}

function renderSide(){
  var c=counts();
  var h='<button class="btn small drawer-close" data-act="menu">✕ 閉じる</button>'+
    '<h1>Claude Certified<br>Architect</h1><p class="code">CCAR-F 練習テスト 4（全60問）</p>'+
    '<p class="sub">4択（一部は2つ選択）。選択肢を選ぶとその場で正誤と解説が表示されます。2つ選択の問題は「回答する」で判定します。</p>'+
    '<p class="score" aria-live="polite">回答済み <b>'+c.a+' / '+N+'</b>　正解 <b>'+c.ok+'</b></p>'+
    '<div class="bar" aria-hidden="true"><i style="width:'+(c.a/N*100)+'%"></i></div>';
  h+='<div class="grp"><div class="grp-h"><span>問題一覧</span></div><div class="grid">';
  Q.forEach(function(q,i){
    var st=status(i);
    var lab='問題'+q.id+(st==='ok'?' 正解':st==='ng'?' 不正解':st==='sel'?' 選択中':' 未回答');
    h+='<button type="button" class="dot" data-s="'+st+'" data-go="'+i+'" aria-label="'+lab+'"'+(view==='quiz'&&i===cur?' aria-current="true"':'')+'>'+q.id+'</button>';
  });
  h+='</div></div>';
  h+='<p class="legend">丸＝正解　角丸の四角＝不正解　青＝現在地</p>'+
    '<div class="sidebtns"><button type="button" class="btn small" data-act="score">採点する</button>'+
    '<button type="button" class="btn small" data-act="restart">'+(armed?'もう一度押すと全回答を消去':'最初からやり直す')+'</button></div>';
  $('side').innerHTML=h;
}
function renderTop(){
  var h='<button type="button" class="btn menu-btn" data-act="menu" aria-expanded="'+$('side').classList.contains('open')+'">☰ 問題一覧</button>';
  if(view==='quiz'){
    h+='<span class="pos">'+Q[cur].id+' / '+N+'</span>'+
      '<button type="button" class="btn" data-act="prev"'+(cur===0?' disabled':'')+'>前へ</button>'+
      '<button type="button" class="btn" data-act="next"'+(cur===N-1?' disabled':'')+'>次へ</button>'+
      '<button type="button" class="btn primary" data-act="score">採点する</button>';
  }else{
    h+='<span class="pos">採点結果</span><button type="button" class="btn" data-act="back">問題に戻る</button>';
  }
  $('topbar').innerHTML=h;
}
function renderQuiz(){
  var q=Q[cur],a=answers[cur],multi=isMulti(q),pend=pending[cur];
  var h='<section class="sheet" aria-label="問題'+q.id+'"><div class="qhead"><span class="qno">問題 '+q.id+'</span><span class="qtotal">／ '+N+'</span><span class="scn">'+esc(sc(q))+'</span>'+(multi?'<span class="tag">複数選択（2つ）</span>':'')+'</div>';
  h+='<div class="stem">'+paras(q.situation)+'</div><div class="prompt">'+paras(q.question)+'</div>';
  if(a){
    h+='<div class="banner '+(a.ok?'ok':'ng')+'" id="banner" tabindex="-1" role="status"><h2>'+(a.ok?'正解！':'不正解。正解は '+esc(letters(q.answer)))+'</h2>'+
      '<p>あなたの回答：'+esc(letters(a.sel))+'</p></div>';
  }
  h+='<ol class="opts'+(multi?' multi':'')+'" role="'+(multi?'group':'radiogroup')+'" aria-label="選択肢">';
  q.choices.forEach(function(c,i){
    var isC=q.answer.indexOf(i)>=0,sel=(a?a.sel:pend).indexOf(i)>=0;
    var li='opt'+(a?(isC?' ok':' ng')+(sel?' picked':''):'');
    var cl='choice'+(!a&&sel?' on':'');
    h+='<li class="'+li+'"><button type="button" class="'+cl+'" data-ch="'+i+'" role="'+(multi?'checkbox':'radio')+'" aria-checked="'+sel+'"'+(a?' aria-disabled="true"':'')+'>'+
      '<span class="mark" aria-hidden="true">'+L[i]+'</span><span class="txt">'+fmt(c.text)+'</span>';
    if(a){
      var mt=(isC?'<span class="pill ok">✓ 正解の選択肢</span>':(a.ok?'':'<span class="pill ng">✕ 誤りの選択肢</span>'))+(sel?'<span class="pill me">あなたの回答</span>':'');
      if(mt)h+='<span class="meta">'+mt+'</span>';
    }
    h+='</button>';
    if(a)h+='<div class="why"><h3>解説</h3>'+paras(c.explanation)+'</div>';
    h+='</li>';
  });
  h+='</ol>';
  if(!a){
    h+='<p class="hint" id="hint" aria-live="polite">'+(multi?'2つ選んでください（現在 '+pend.length+' / 2）':'1つ選んでください')+'</p>';
    if(multi)h+='<div class="actions"><span></span><div class="grow"><button type="button" class="btn primary" data-act="submit"'+(pend.length===2?'':' disabled')+'>回答する</button></div></div>';
  }else{
    h+='<section class="overall" aria-label="全体的な説明"><h2>全体的な説明</h2>'+paras(q.overall,true)+'</section>';
  }
  h+='<div class="actions pair"><button type="button" class="btn" data-act="prev"'+(cur===0?' disabled':'')+'>前へ</button><button type="button" class="btn primary" data-act="next"'+(cur===N-1?' disabled':'')+'>次へ</button></div></section>';
  $('main').innerHTML=h;
}
function renderScore(){
  var c=counts();
  var rate=Math.round(c.ok/N*1000)/10;
  var h='<section class="sheet result" aria-label="採点結果"><h2>'+N+'問中 '+c.ok+'問 正解</h2>'+
    '<p class="lead">'+(c.un?'未回答が '+c.un+'問あります。':'すべての問題に回答しました。')+'</p>'+
    '<div class="stats"><div class="stat"><b>'+rate+'%</b><span>正答率（全'+N+'問中）</span></div>'+
    '<div class="stat ok"><b>'+c.ok+'</b><span>正解数</span></div>'+
    '<div class="stat ng"><b>'+c.ng+'</b><span>不正解数</span></div>'+
    '<div class="stat"><b>'+c.un+'</b><span>未回答数</span></div></div>';
  var wrong=[];Q.forEach(function(q,i){if(answers[i]&&!answers[i].ok)wrong.push(i);});
  h+='<h3>不正解だった問題（シナリオ別）</h3>';
  if(!wrong.length)h+='<p>不正解の問題はありません。</p>';
  scenarios().forEach(function(s){
    var w=wrong.filter(function(i){return sc(Q[i])===s;});
    if(!w.length)return;
    h+='<div class="grp"><div class="grp-h" style="margin-bottom:10px"><span>'+esc(s)+'</span><span>'+w.length+'問</span></div>';
    w.forEach(function(i){
      var q=Q[i],a=answers[i];
      h+='<div class="witem"><div class="wh"><button type="button" class="chip" data-go="'+i+'">問題'+q.id+'</button><span class="pill me">押すと問題に戻ります</span></div>'+
        '<div class="stem">'+paras(q.situation)+'</div><div class="q">'+paras(q.question)+'</div>'+
        '<div class="row mine"><span class="lab">あなたの回答</span>'+sortn(a.sel).map(function(k){return '<div>'+L[k]+'. '+fmt(q.choices[k].text)+'</div>';}).join('')+'</div>'+
        '<div class="row corr"><span class="lab">正解</span>'+sortn(q.answer).map(function(k){return '<div>'+L[k]+'. '+fmt(q.choices[k].text)+'</div>';}).join('')+'</div></div>';
    });
    h+='</div>';
  });
  h+='<div class="actions"><button type="button" class="btn" data-act="back">問題に戻る</button><div class="grow"><button type="button" class="btn primary" data-act="restart">'+(armed?'もう一度押すと全回答を消去':'最初からやり直す')+'</button></div></div></section>';
  $('main').innerHTML=h;
}
function render(top){
  renderSide();renderTop();
  if(view==='quiz')renderQuiz();else renderScore();
  if(top)toTop();
}
function closeDrawer(){$('side').classList.remove('open');$('backdrop').classList.remove('show');}
function go(i){cur=Math.min(Math.max(i,0),N-1);view='quiz';closeDrawer();render(true);}
function submit(){
  var q=Q[cur],sel=pending[cur].slice();
  if(answers[cur])return;
  if(sel.length!==q.answer.length)return;
  var ok=sel.every(function(x){return q.answer.indexOf(x)>=0;});
  answers[cur]={sel:sel,ok:ok};
  render(false);
  var bn=$('banner');
  if(bn){bn.scrollIntoView({block:'start',behavior:reduce?'auto':'smooth'});bn.focus({preventScroll:true});}
}
function pick(i){
  if(answers[cur])return;
  var q=Q[cur];
  if(!isMulti(q)){pending[cur]=[i];submit();return;}
  var p=pending[cur],k=p.indexOf(i);
  if(k>=0)p.splice(k,1);
  else if(p.length<2)p.push(i);
  else{var h=$('hint');if(h)h.textContent='選べるのは2つまでです。選択を外してから選び直してください。';return;}
  render(false);
  var b=document.querySelector('[data-ch="'+i+'"]');if(b)b.focus({preventScroll:true});
}
function restart(){
  if(!armed){
    armed=true;clearTimeout(armTimer);
    armTimer=setTimeout(function(){armed=false;renderSide();if(view==='score')renderScore();},4000);
    renderSide();if(view==='score')renderScore();
    return;
  }
  clearTimeout(armTimer);armed=false;
  answers=Q.map(function(){return null;});pending=Q.map(function(){return [];});
  cur=0;view='quiz';closeDrawer();render(true);
}
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-go],[data-ch],[data-act]');
  if(!t){if(e.target.id==='backdrop')closeDrawer();return;}
  if(t.hasAttribute('data-go')){go(parseInt(t.getAttribute('data-go'),10));return;}
  if(t.hasAttribute('data-ch')){pick(parseInt(t.getAttribute('data-ch'),10));return;}
  var act=t.getAttribute('data-act');
  if(act==='prev'){go(cur-1);}
  else if(act==='next'){go(cur+1);}
  else if(act==='score'){view='score';closeDrawer();render(true);}
  else if(act==='back'){view='quiz';render(true);}
  else if(act==='submit'){submit();}
  else if(act==='restart'){restart();}
  else if(act==='menu'){var o=$('side').classList.toggle('open');$('backdrop').classList.toggle('show',o);renderTop();}
});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeDrawer();});
render(false);
})();
</script>
</body>
</html>
