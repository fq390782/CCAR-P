<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Claude Certified Architect CCAR-F</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F0F0F0; --paper:#FFFFFF; --soft:#F6F6F6;
  --ink:#000000; --ink2:#333333; --line:#8F8F8F; --line2:#4D4D4D;
  --accent:#111111; --on-accent:#FFFFFF; --sel:#E4E4E4;
  --ok:#0B6C8A; --ok-bg:#E1F1F6; --ok-solid:#0B6C8A;
  --ng:#B4432B; --ng-bg:#FBE9E4; --ng-solid:#B4432B;
  --on-solid:#FFFFFF;
  --sans:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  --serif:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D0D0D; --paper:#181818; --soft:#202020;
    --ink:#FFFFFF; --ink2:#D2D2D2; --line:#6A6A6A; --line2:#A8A8A8;
    --accent:#FFFFFF; --on-accent:#0D0D0D; --sel:#2E2E2E;
    --ok:#6CCBE6; --ok-bg:#0F2F3A; --ok-solid:#6CCBE6;
    --ng:#FF9B85; --ng-bg:#3A1D17; --ng-solid:#FF9B85;
    --on-solid:#0B1612;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D0D0D; --paper:#181818; --soft:#202020;
  --ink:#FFFFFF; --ink2:#D2D2D2; --line:#6A6A6A; --line2:#A8A8A8;
  --accent:#FFFFFF; --on-accent:#0D0D0D; --sel:#2E2E2E;
  --ok:#6CCBE6; --ok-bg:#0F2F3A; --ok-solid:#6CCBE6;
  --ng:#FF9B85; --ng-bg:#3A1D17; --ng-solid:#FF9B85;
  --on-solid:#0B1612;
  color-scheme:dark;
}
:root:root:root{
  --bg:#FFFFFF; --paper:#FFFFFF; --soft:#F5F5F5;
  --ink:#000000; --ink2:#222222; --line:#8F8F8F; --line2:#4D4D4D;
  --accent:#111111; --on-accent:#FFFFFF; --sel:#E4E4E4;
  --ok:#0B6C8A; --ok-bg:#E1F1F6; --ok-solid:#0B6C8A;
  --ng:#B4432B; --ng-bg:#FBE9E4; --ng-solid:#B4432B;
  --on-solid:#FFFFFF;
  color-scheme:light;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 12px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.8;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.shell{display:grid;grid-template-columns:292px minmax(0,1fr);gap:36px;max-width:1120px;margin:0 auto;padding:28px 20px 72px}
.side{align-self:start;position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);max-height:calc(100vh - 32px);overflow:auto;padding-right:2px}
.side h1{font-family:var(--serif);font-weight:700;font-size:23px;line-height:1.4;margin:0 0 2px;letter-spacing:.02em}
.side .code{margin:0 0 10px;font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--accent)}
.side .sub{margin:0 0 18px;color:var(--ink2);font-size:13px}
.score{margin:0 0 8px;font-size:14px;font-variant-numeric:tabular-nums}
.score b{font-weight:700}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-bottom:18px}
.bar i{display:block;height:100%;background:var(--accent);width:0}
details.nav{margin:0 0 18px}
details.nav summary{cursor:pointer;font-weight:700;font-size:14px;padding:6px 0;list-style:none}
details.nav summary::-webkit-details-marker{display:none}
details.nav summary::after{content:"　▾";color:var(--ink2);font-weight:400}
details.nav[open] summary::after{content:"　▴"}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:8px;margin-top:8px}
.dot{width:36px;height:36px;border-radius:50%;border:2px solid var(--line2);background:var(--paper);color:var(--ink);font-size:12.5px;font-weight:500;font-variant-numeric:tabular-nums;cursor:pointer;display:grid;place-items:center;padding:0;line-height:1}
.dot[data-s="sel"]{background:var(--sel);border-color:var(--accent);color:var(--accent);font-weight:700}
.dot[data-s="ok"]{border-color:var(--ok);color:var(--ok);font-weight:700}
.dot[data-s="ng"]{border-color:var(--ng);color:var(--ng);font-weight:700;border-radius:10px}
.dot[aria-current="true"]{outline:2px solid var(--accent);outline-offset:2px}
.legend{margin:10px 0 0;font-size:12px;color:var(--ink2);line-height:1.7}
.sidebtns{display:flex;flex-direction:column;gap:8px}

.btn{border:1.5px solid var(--line2);background:var(--paper);color:var(--ink);padding:10px 18px;border-radius:10px;cursor:pointer;font-weight:500;font-size:15px;min-height:44px;transition:background .15s,border-color .15s}
.btn:hover:not(:disabled){background:var(--sel);border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.btn.primary:hover:not(:disabled){filter:brightness(1.08);background:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.small{min-height:40px;padding:8px 14px;font-size:14px}

.sheet{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:30px 32px 32px}
.qhead{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px 12px;margin-bottom:18px}
.qno{font-family:var(--serif);font-weight:700;font-size:26px;letter-spacing:.02em}
.qtotal{color:var(--ink2);font-size:14px;font-variant-numeric:tabular-nums}
.domain{font-size:12.5px;color:var(--ink2);border:1px solid var(--line2);border-radius:6px;padding:0 8px;line-height:1.7}
.tag{font-size:13px;font-weight:700;border:1.5px solid var(--accent);color:var(--accent);padding:1px 10px;border-radius:999px;line-height:1.7}
.stem p,.overall p,.why p,.banner p{margin:0 0 .8em;white-space:pre-line}
.stem ul,.overall ul{margin:0 0 .9em;padding-left:1.4em}
.stem li,.overall li{margin:.15em 0}
.prompt{font-family:var(--serif);font-weight:700;font-size:19.5px;line-height:1.75;margin:18px 0 20px;white-space:pre-line}

.banner{border-left:4px solid var(--line2);background:transparent;padding:6px 16px 2px;margin:0 0 20px;scroll-margin-top:16px}
.banner h2{font-family:var(--serif);font-size:17px;margin:0 0 2px;line-height:1.5}
.banner.ok,.banner.ng{border-color:var(--line2)}
.banner.ok h2,.banner.ng h2{color:var(--ink)}
.banner p{font-size:14.5px;color:var(--ink)}

ol.opts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.choice{display:grid;grid-template-columns:36px minmax(0,1fr);column-gap:14px;align-items:start;width:100%;text-align:left;padding:14px 16px;border:2px solid var(--line);border-radius:12px;background:var(--paper);cursor:pointer;transition:background .15s,border-color .15s}
.choice:hover:not([aria-disabled="true"]){background:var(--sel);border-color:var(--accent)}
.choice[aria-disabled="true"]{cursor:default}
.mark{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center;font-family:var(--serif);font-weight:700;font-size:15px;background:var(--paper);margin-top:1px}
.multi .mark{border-radius:9px}
.choice.on{border-color:var(--accent);background:var(--sel)}
.choice.on .mark{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.choice .txt{font-size:16px;line-height:1.75;padding-top:3px}
.meta{grid-column:2;display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pill{font-size:12.5px;font-weight:500;padding:0;border:none;line-height:1.7}
.pill.ok{color:var(--ok)}
.pill.ng{color:var(--ng)}
.pill.me{color:var(--ink2)}
.opt.ok .choice{border-color:var(--ok)}
.opt.ok .mark{border-color:var(--ok);color:var(--ok)}
.opt.ng.picked .choice{border-color:var(--ng)}
.opt.ng.picked .mark{border-color:var(--ng);color:var(--ng)}
.why{margin:8px 0 0 50px;padding:10px 16px 4px;border-left:3px solid var(--line2);background:var(--soft);border-radius:0 8px 8px 0;font-size:14.5px;line-height:1.9}
.why h3{margin:0 0 4px;font-size:13px;font-weight:700;color:var(--ink2)}
.hint{margin:14px 0 0;font-size:14px;color:var(--ink2);min-height:1.8em}

.overall{margin-top:30px;padding-top:22px;border-top:1.5px solid var(--line)}
.overall h2{font-family:var(--serif);font-size:19px;margin:0 0 10px}
.ref{font-size:14px;color:var(--ink2);margin:6px 0 0}
.ref a{color:var(--accent);word-break:break-all}
.actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;margin-top:28px}
.actions .grow{display:flex;gap:10px;flex-wrap:wrap}

.result h2{font-family:var(--serif);font-size:25px;margin:0 0 8px;line-height:1.5}
.result .lead{font-size:16px;margin:0 0 20px}
.result h3{font-size:15px;margin:22px 0 8px}
.dom-list{display:flex;flex-direction:column;gap:12px}
.dom-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 16px;align-items:baseline}
.dom-name{font-size:15px}
.dom-score{font-size:14px;color:var(--ink2);font-variant-numeric:tabular-nums}
.dom-bar{grid-column:1 / -1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.dom-bar i{display:block;height:100%;background:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--ng);color:var(--ng);background:var(--paper);border-radius:10px;padding:4px 12px;cursor:pointer;font-weight:700;font-size:14px;min-height:36px}
.chip:hover{background:var(--ng-bg)}
.chip.un{border-color:var(--line2);color:var(--ink2)}
.chip.un:hover{background:var(--soft)}

@media (max-width:859px){
  .shell{grid-template-columns:minmax(0,1fr);gap:20px;padding:18px 14px 56px}
  .side{position:static;max-height:none;overflow:visible}
  .sheet{padding:22px 18px 24px}
  .why{margin-left:0}
  .qno{font-size:23px}
  .prompt{font-size:18px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="shell">
  <aside class="side" aria-label="進捗と問題一覧">
    <h1>Claude Certified<br>Architect</h1>
    <p class="code">CCAR-F 練習問題（全60問）</p>
    <p class="sub">4択（一部は2つ選択）。回答を確認すると、各選択肢の解説と全体の説明が表示されます。</p>
    <p class="score" id="score" aria-live="polite"></p>
    <div class="bar" aria-hidden="true"><i id="barfill"></i></div>
    <details class="nav" id="navd" open>
      <summary>問題一覧</summary>
      <div class="grid" id="grid"></div>
      <p class="legend">丸＝正解　角丸の四角＝不正解　青＝選択中</p>
    </details>
    <div class="sidebtns">
      <button type="button" class="btn small" id="btnResult">結果を見る</button>
      <button type="button" class="btn small" id="btnReset">最初からやり直す</button>
    </div>
  </aside>
  <main id="main" aria-live="off"></main>
</div>

<script type="application/json" id="qdata">[{"n":1,"d":"コンテキスト管理と信頼性","stem":["ある消費財メーカーは、Claude Agent SDKを使用してマルチエージェントの市場調査システムを構築しています。コーディネーターが、市場調査・文書分析・統合・レポート生成をそれぞれ担当する専門サブエージェントに作業を委任しています。","このチームは、競合価格分析レポートを作成するための長大なチェックリストを、ルートのメモリファイルに追加しました。チェックリストは、出典の選別手順、価格帯のグルーピング、引用の書式、最終レポートの組み立てを段階的に記した手順書です。しかし、この手順はごく一部のリサーチタスクにしか関係がありません。","開発者たちは、無関係なClaude Codeセッションまでもが、この専門的な手順をコンテキストとして読み込んでいることに気づきました。"],"q":"このチームが取るべき対応として、最も適切なものはどれですか。","need":1,"opts":[{"t":"チェックリストを、各項目が完了するまでレポート生成をブロックするPreToolUseフックに置き換える。","c":false,"e":["PreToolUseフックは、特定のツール呼び出しを実行前に検査して止めたいときに使う決定的な仕組みです。手順を守らせることはできても、本問の課題は長い手順書が無関係なセッションのコンテキストに入り込むことであり、フックへの置き換えはこの読み込みの問題とは別の話です。"]},{"t":"引用・出典管理のルールも含めて手順全体をスキルに移し、CLAUDE.mdは空にする。","c":false,"e":["スキルに手順を移すのは、特定の作業でしか使わない手順を常時読み込みから外したいときの正しい整理です。しかし引用や出典管理の規約は多くのリサーチタスクに共通する前提で、これもスキルに移してCLAUDE.mdを空にすると、スキルを呼ばない通常のタスクでは規約が読み込まれなくなります。"]},{"t":"競合価格分析の手順はSKILL.mdのスキルに移し、CLAUDE.mdには全タスクに共通する規約だけを残す。","c":true,"e":["正解。CLAUDE.mdの内容はセッション開始時に毎回コンテキストへ読み込まれますが、スキルは説明文だけが常に見えていて、本文は使われたときにだけ読み込まれます。一部のタスクでしか使わない長い手順をSKILL.mdに移し、CLAUDE.mdには全体に共通する規約だけを残せば、無関係なセッションのコンテキストを消費しなくなります。"]},{"t":"競合価格分析の手順全体をCLAUDE.mdに残したまま、関係しないときは無視するよう注記を加える。","c":false,"e":["注記で適用条件を書き添えるのは、短い補足ならコストの小さい対処です。しかし手順の本文がCLAUDE.mdに残る限り、無関係なセッションでも毎回その全文がコンテキストに読み込まれるため、トークンの消費と無関係な情報によるノイズという問題は何も変わりません。"]}],"overall":["Claude Codeには、常に読み込まれる指示と、必要なときだけ読み込まれる指示の2種類の置き場所があります。CLAUDE.mdはセッション開始時に毎回コンテキストに入るため、ビルド手順やコーディング規約のような常に必要な事実に向いています。一方スキルは、説明文だけが常時見えていて、本文は呼び出されたときにだけ読み込まれます。公式ドキュメントも、CLAUDE.mdの一部が「事実」ではなく「手順」に育ってきたらスキルに切り出すよう勧めています。","本問の競合価格分析チェックリストはごく一部のタスクでしか使わない手順なので、スキルに移してCLAUDE.mdには共通の規約だけを残すのが適切です。","注記を足す案は読み込み自体を止めず、共通の規約までスキルに移す案は通常のタスクに必要な情報を失い、フックは読み込みとは無関係です。","指示の置き場所に迷ったら、「全タスクで常に必要か」を問いかけてみてください。"],"ref":"https://code.claude.com/docs/en/skills"},{"n":2,"d":"Claude Codeの設定とワークフロー","stem":["あるチームは、社内のコードベース調査や定型的なリファクタリングを自動化するために、Claude Agent SDKをベースにしたエンジニアリング支援エージェントを構築しています。このエージェントは、組み込みツール（Read、Write、Bash、Grep、Glob）に加えて、複数のMCPサーバーと連携します。","試験運用中、エンジニアが「ワークスペース内を丸ごと整理して」といったあいまいなクリーンアップ依頼を出すと、エージェントがワークスペース外のパスまで変更するBashコマンドを実行してしまうことがありました。","ワークスペースの境界を越えないことは、絶対に譲れないルールです。次の2点を満たす必要があります。","ワークスペース外を対象とするコマンドは、実行前に必ず停止させる","その違反についてのフィードバックを、Claudeに返す"],"q":"このチームが行うべき変更はどれですか。","need":1,"opts":[{"t":"ワークスペース外のコマンドをログに記録するだけで、ブロックはしないPreToolUseコマンドフックを追加する。","c":false,"e":["ログだけを取るPreToolUseフックは、本番で拒否する前にどれだけ違反が起きているかを観察する段階なら有用です。しかし拒否を返さなければコマンドはそのまま実行されるため、譲れないルールの強制にはなりません。"]},{"t":"対象パスを検証し、ワークスペース外のコマンドを理由付きでブロックするPreToolUseフックを追加する。","c":true,"e":["正解。PreToolUseフックはBashの実行前に発火するため、コマンドの対象パスを検査し、ワークスペース外なら終了コード2で終わるか、permissionDecisionを\"deny\"にして返すことで拒否できます。拒否した場合コマンドは実行されず、フックが示した理由がClaudeにフィードバックとして返るので、「実行前に止める」と「違反をClaudeに伝える」の両方を満たします。"]},{"t":"Bashコマンドを一つずつ確認してワークスペース外のパスを避けるよう、システムプロンプトの指示を強める。","c":false,"e":["システムプロンプトでルールを伝えることは、Claudeが最初から違反しにくくなるという点で意味があります。しかし指示はモデルへの依頼にすぎず、あいまいで範囲の広い依頼の中では見落とされることがあるため、決定的に実行を止める仕組みの代わりにはなりません。"]},{"t":"Bashの変更をPostToolUseコマンドフックで検知し、Claudeに元に戻すよう依頼するフックを追加する。","c":false,"e":["PostToolUseフックは、ツールが成功した後に結果を検査して記録したり、Claudeに注意を返したりする用途に向いています。しかしこの時点でコマンドはすでに実行され、ワークスペース外の変更は起きてしまっているため、実行前に止めるという要件を満たせません。元に戻す依頼も確実に成功するとは限りません。"]}],"overall":["Claude Codeのフックは、ツールの実行前後などのタイミングで任意のコマンドを実行できる仕組みで、中でもPreToolUseはツールの呼び出しをブロックできるイベントです。公式リファレンスによると、PreToolUseのフックが終了コード2で終わると呼び出しはブロックされ、標準エラー出力の内容（またはJSONで返した拒否理由）がClaudeに伝えられます。一方PostToolUseはツールがすでに実行された後に発火するため、終了コード2を返してもブロックは起きません。","本問の要件は、ワークスペースの外を対象とするコマンドを実行前に止めることと、違反の内容をClaudeに返すことの2つで、対象パスを検証して拒否するPreToolUseフックだけが両方を満たします。","事後に元へ戻させる案、ログだけ取る案、システムプロンプトを強める案は、いずれも実行そのものを止めません。","イベントが実行の前か後か、そして拒否を返しているかの2点が、フックを選ぶ際の着眼点です。"],"ref":"https://code.claude.com/docs/en/hooks"},{"n":3,"d":"エージェントアーキテクチャとオーケストレーション","stem":["ある気候研究コンソーシアムは、Claudeを使用して、長大な観測レポートから情報を抽出する構造化データ抽出システムを構築しています。このシステムは、非構造化文書から情報を抽出し、JSONスキーマを使用して出力を検証し、高い精度を維持する必要があります。エッジケースを適切に処理し、下流のシステムと連携する必要もあります。","研究チームは、長い文書を分割し、複数の抽出サブエージェントに処理させています。検証の過程で、統合エージェントが抽出された複数の統計値を1つの傾向としてまとめてしまいました。レビュー担当者は後になって、2つの値が実際には比較できない条件で得られたものだったことに気づきました。","ログを見ると、各抽出サブエージェントは関連する知見の簡潔な文章要約を返していました。"],"q":"統合の信頼性を最も直接的に改善する変更はどれですか。（2つ選択してください。）","need":2,"opts":[{"t":"全文書から抽出したテキストを丸ごと統合エージェントに送り、出所の情報をそこから独自に再構築させる。","c":false,"e":["元のテキストを丸ごと渡せば情報の欠落は起きないように見えますが、長い文書を分割して処理するという設計の利点が失われ、統合エージェントのコンテキストに大量の生データを抱え込ませることになります。出所を一から再構築させるのは非効率で、誤りも入り込みやすくなります。"]},{"t":"各抽出サブエージェントをforkとして実行し、要約を返す前に親の会話を引き継がせる。","c":false,"e":["forkは親の会話を引き継いで分岐するため、同じ前提のまま別の方針を試したいときに使います。しかし親の文脈を持っていても、統合エージェントに返すのが簡潔な文章要約である限り、観測期間や測定方法は構造化された形で伝わらず、根本原因は解消しません。"]},{"t":"値をまとめる前に、各サブエージェントのレコードに観測期間と測定方法が入っているかを検証する。","c":true,"e":["正解。構造化されたレコードを求めても、実際に観測期間や測定方法の欄が埋まっていなければ、統合の時点で値を比べてよいかを判断できません。値をまとめる前に各レコードにこれらのフィールドが入っていることを検証すれば、比較の前提を欠いたレコードが1つの傾向にまとめられる事態を防げます。この検証はアプリケーションのコードで行うため、モデルの判断に左右されず毎回同じ基準で欠落を検出できます。"]},{"t":"主張と出典位置、取得条件を含む構造化された根拠レコードを各サブエージェントに返させる。","c":true,"e":["正解。統合エージェントが統計値を正しく比べるには、それぞれの値が何を主張し、どの文書のどこに書かれ、どんな条件（観測期間や測定方法など）で得られたかが必要です。Anthropicのマルチエージェント調査システムも、サブエージェントへの委任には目的と並んで出力形式を明示することが欠かせないとしており、構造化された根拠レコードを義務付けることで、条件の違う値を取り違えずに統合できます。"]}],"overall":["サブエージェントが返す内容の形は、統合の品質を大きく左右します。文章の要約は読みやすい一方で、値ごとの観測期間や測定方法といった比較に欠かせないメタデータが落ちやすく、本問のように条件の違う統計値が1つの傾向にまとめられてしまいます。","Anthropicのマルチエージェント調査システムの解説は、サブエージェントには目的、出力形式、使うツールや情報源の指針、明確な作業範囲を伝える必要があると述べています。本問では、主張・出典の位置・日付・測定方法を含む構造化された根拠レコードを返させることと、統合の前にそのレコードに観測期間と測定方法が入っているかを検証することの2つが、統合の信頼性を直接高めます。","forkで親の文脈を持たせても出力の形は変わらず、全文を統合エージェントに送る案は分割の利点を捨てます。","統合での誤りの多くは、統合する側ではなく受け取るデータの形に原因があります。"],"ref":"https://www.anthropic.com/engineering/multi-agent-research-system"},{"n":4,"d":"コンテキスト管理と信頼性","stem":["ある航空会社の乗務員スケジューリングシステム改修チームは、Claude Codeを使って数時間に及ぶ調査作業を行っています。Claude Codeは、序盤にレガシーなスケジューリング依存関係をいくつか正しく特定しました。","しかし、多数のファイル読み込みや検索、コンパクション（会話履歴の圧縮）を経た後、後続の回答ではそれらの依存関係への言及が抜け落ち始めました。具体的な調査結果ではなく、よくあるパターンを答えるようになっています。"],"q":"後続の質問に備えて調査の状態を保つ変更として、最も効果的なものはどれですか。","need":1,"opts":[{"t":"改修作業をプランモードに切り替え、以前のファイル分析の詳細はそのプランが保持してくれることに頼る。","c":false,"e":["プランモードで作成したプランは、コンパクション後にディスクから再注入されるため、実装方針を見失わない点では役立ちます。しかしプランは変更の進め方を記す文書で、調査の途中で確認した依存関係を逐次書き足していく記録ではありません。プランに書かれなかった分析の詳細は、要約の過程で抜け落ちます。"]},{"t":"確認済みの依存関係をinvestigation-notes.mdに記録させ、後続の質問の前に読み込ませる。","c":true,"e":["正解。会話の外にあるファイルへ確定した調査結果を書き出し、後続の質問の前に読み込み直す方法は、構造化されたメモ（エージェントのメモリ）と呼ばれる手法です。コンパクションで会話履歴が要約されてもファイルの内容は変わらないため、序盤に確認した依存関係を正確なまま何度でも参照できます。"]},{"t":"/compactに依存関係を残すよう焦点の指示を渡し、要約の中に調査結果を含めさせる。","c":false,"e":["/compactには要約の焦点を指示でき、次の作業に必要な話題を要約に残したいときに役立ちます。しかし残るのはあくまで要約文で、コンパクションが繰り返されるたびに具体的な依存関係の細部は丸められていくうえ、自動で走るコンパクションには毎回指示を渡せません。確定した事実を正確なまま保持する手段にはなりません。"]},{"t":"セッション開始時の指示を長くし、特定した依存関係を一つ残らず覚えておくようClaudeに伝える。","c":false,"e":["セッション開始時の指示は、作業全体の方針を伝える場所として有効です。しかし「覚えておいて」と頼んでも、覚えた内容を保存する場所はコンテキストしかなく、コンパクションで会話が要約されれば具体的な依存関係は同じように失われます。"]}],"overall":["長時間の調査で序盤の発見が抜け落ちる原因は、コンテキストの有限性とコンパクションの仕組みにあります。Claude Codeのコンパクションは会話を構造化された要約に置き換え、ツール出力の全文や途中の推論は残りません。Anthropicのコンテキストエンジニアリングの解説では、長期タスクへの対策として、エージェントがコンテキストの外にメモを書き出し、必要なときに読み戻す「構造化されたメモ（NOTES.mdの維持など）」を挙げています。","本問でinvestigation-notes.mdに確認済みの依存関係を記録し、後続の質問の前に読ませる案はまさにこの手法です。","プランモードのプランは実装方針の文書であり、/compactへの焦点指示や長い開始時の指示は、いずれも要約の影響を受ける場所に情報を置いたままです。","残したい情報が会話の外に置かれているかどうかが、この問題の決め手です。"],"ref":"https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents"},{"n":5,"d":"エージェントアーキテクチャとオーケストレーション","stem":["あるチームは、Claude Agent SDKを使用して、複数のサブエージェントを統括するマルチエージェントの市場調査システムを構築しています。コーディネーターエージェントは、専門化されたサブエージェント（Web検索担当、資料分析担当、知見の統合担当、レポート生成担当）に作業を委任します。このシステムはトピックを調査し、出典を明記した包括的なレポートを作成します。","評価中、Web検索サブエージェントが、いくつかの有用な情報源を見つけた後で一時的なネットワークエラーに遭遇することがありました。その際、コーディネーターには汎用的な失敗メッセージしか渡されず、レポート生成を止めるか、その節を省略するかのどちらかになってしまいます。"],"q":"サブエージェントの分離を保ちながら、レジリエンスを最も改善する変更はどれですか。","need":1,"opts":[{"t":"コーディネーターに検索サブエージェントの中間的なツール呼び出しを検査させ、リトライするか部分的な情報源のまま続行するかを判断させる。","c":false,"e":["コーディネーターがサブエージェントの途中経過を監視するのは、デバッグやトレースの分析では役立つ見方です。しかし運用の判断のために内部のツール呼び出しまで検査させると、サブエージェントを独立した単位として扱う分離が崩れ、コーディネーターのコンテキストも膨らみます。"]},{"t":"検索が失敗するたびに検索サブエージェントに空の成功結果を返させ、統合エージェントにカバレッジの欠落を推測させる。","c":false,"e":["空の結果を成功として返すのは、検索が正常に終わって本当に該当が無かった場合の表現です。失敗を成功に見せかけると、統合エージェントは情報が欠けていることを知らないまま結論を書き、出典付きのレポートとしての信頼性を損ないます。"]},{"t":"検索サブエージェント内で一時的な失敗をリトライさせ、解決しなければエラー内容と取得済みの情報源を返させる。","c":true,"e":["正解。一時的なネットワークエラーは、サブエージェント自身がリトライすれば多くが解消し、コーディネーターに届く前に吸収できます。それでも解決しない場合に、試したクエリ、未解決のエラー内容、すでに見つけた情報源を構造化して返せば、コーディネーターは内部のツール呼び出しを覗かなくても、再委任するか部分的な情報で進めるかを判断でき、サブエージェントの分離も保たれます。"]},{"t":"検索サブエージェントに親のツールを継承させ、主要な検索経路が失敗するたびに別のツールで代替させる。","c":false,"e":["サブエージェントがツールを継承するのは、toolsを省略したときの既定の動作で、専門を持たない汎用の作業者には便利な設定です。しかし親のツールを丸ごと持たせると、役割に必要な範囲だけを与えるという分離の考え方から外れ、本問が求める「サブエージェントの分離を保つ」条件を損ないます。"]}],"overall":["マルチエージェントの信頼性を高めるには、失敗を「どこで吸収し、何を上に伝えるか」を設計する必要があります。Anthropicのマルチエージェント調査システムの解説は、エラーが起きたときに最初からやり直すのではなく、ツールが失敗していることをエージェントに知らせて適応させることと、リトライのような確定的な安全策を組み合わせることが有効だと述べています。","本問では、一時的なネットワークエラーという、その場でのリトライで解決しやすい失敗が問題になっています。検索サブエージェントの中でリトライし、それでも駄目なら試行内容・エラー内容・取得済みの情報源を構造化して返せば、コーディネーターは内部に立ち入らずに次の手を決められます。","親のツールを継承させる案とコーディネーターが内部を覗く案は分離を崩し、空の成功を返す案は失敗を隠します。","サブエージェントの境界を保つとは、内部の失敗処理は内部で行い、外には判断に必要な要約だけを渡すことです。"],"ref":"https://www.anthropic.com/engineering/multi-agent-research-system"},{"n":6,"d":"ツール設計とMCP統合","stem":["あなたは、Claudeを使用して自動請求書処理システムを構築しています。このシステムは、非構造化のスキャン文書から情報を抽出し、JSONスキーマを使用して出力を検証し、高い精度を維持します。エッジケースを適切に処理し、下流のシステムと連携する必要があります。","Claudeがstop_reasonとして\"tool_use\"を返し、同じassistantターンの中に2つのvalidate_invoiceツール呼び出し（tool_useブロック）を含めてきました。あなたのラッパーは、両方のバリデーターを実行した後、その結果を要約したプレーンテキストのユーザーメッセージだけを含む新しいリクエストを開始しています。"],"q":"Claudeが次の抽出アクションについて正しく推論できるようにするために、ラッパーが代わりに行うべきことはどれですか。","need":1,"opts":[{"t":"tool_useを含むassistant応答を履歴に残し、tool_use_idで対応付けた2つのtool_resultを1つのuserメッセージで返す。","c":true,"e":["正解。クライアントツールの結果は、tool_useを含むassistantメッセージの直後のuserメッセージで、各tool_use_idに対応するtool_resultブロックとして返します。","同じターンで複数のツールが呼ばれた場合はすべての結果を1つのuserメッセージにまとめ、テキストを添えるならtool_resultの後ろに置きます。これでClaudeはどの検証結果がどの呼び出しに対応するかを正確に把握できます。"]},{"t":"tool_resultを送る前に、バリデーターの出力を要約した新しいuserテキストメッセージを追加してから続ける。","c":false,"e":["結果の要点を文章で補足すること自体は、Claudeに追加の文脈を伝えたいときに使えます。しかしtool_useの直後に結果以外のメッセージを挟むことはできず、tool_resultを含むuserメッセージの中でもテキストを先に置くとAPIは400エラーを返します。要約を先に送る設計は、今のラッパーが抱える構造的な対応付けの欠如を残したままです。"]},{"t":"両方のバリデーターの出力を、tool_use_idで対応付けたtool_resultブロックとして1つのassistantメッセージに入れて追加する。","c":false,"e":["tool_use_idで結果を対応付けるという点は正しいものの、置き場所が違います。tool_resultはツールを実行した側、つまりアプリケーションからの返答なのでuserロールのメッセージに入れる決まりで、assistantメッセージに入れると会話の構造として成立しません。"]},{"t":"後続のuserメッセージを2つ追加し、それぞれに対応するtool_resultブロックを1つずつ入れて送る。","c":false,"e":["結果ごとにメッセージを分ける形は、1回の応答で1つのツールしか呼ばれない通常のループなら自然に見えます。しかし同じassistantターンで発行された複数のtool_useには、1つのuserメッセージでまとめて結果を返すのが正しい形で、公式ドキュメントも分割するとClaudeが並列呼び出しを避けるようになると注意しています。"]}],"overall":["tool_useで停止した応答への返し方には、厳密な決まりがあります。tool_resultはtool_useを含むassistantメッセージの直後に置き、間に他のメッセージを挟めません。tool_resultを含むuserメッセージでは、tool_resultブロックを配列の先頭に並べ、テキストを添える場合はその後ろに置きます。そして並列に呼ばれた複数のツールの結果は、1つのuserメッセージにまとめて返します。","本問のラッパーは、この構造を捨てて要約テキストだけの新規リクエストを送っているため、Claudeはどの結果がどの呼び出しに対応するのか、そもそもツールが実行されたのかを把握できません。","assistantメッセージに結果を入れる案はロールの取り違え、要約を先に送る案と結果を分割する案は順序とまとめ方の規則違反です。","ツール結果の問題では、どのロールに、どの順番で、いくつのメッセージで返すかの3点を確認すると判断がぶれません。"],"ref":"https://platform.claude.com/docs/en/agents-and-tools/tool-use/parallel-tool-use"},{"n":7,"d":"ツール設計とMCP統合","stem":["データパイプラインの保守作業を加速するために、Claude Codeを使用しています。チームでは、コード生成、リファクタリング、デバッグ、ドキュメント作成にClaude Codeを使っています。カスタムスラッシュコマンドやCLAUDE.mdの設定を用いて開発ワークフローに統合し、プランモードと直接実行をどのように使い分けるかを理解する必要があります。","カスタムの/resolve-incidentコマンドは、コードを編集してコミットメッセージを生成する前に、インシデント検索用のMCPツールを使います。テストでは、インシデントのタイトル検索で類似したインシデントが複数返った場合に、Claude Codeが最新のインシデントをそのまま採用し、誤った内容を実装してしまうことがあります。"],"q":"信頼性を改善するためにこのチームが行うべき変更はどれですか。（2つ選択してください。）","need":2,"opts":[{"t":"一致するインシデントが複数あるときはタイトルの類似度を優先して選ぶよう、CLAUDE.mdを更新する。","c":false,"e":["CLAUDE.mdに判断の優先順位を書いておくことは、チームの慣習を反映した既定の振る舞いを決めたい場面では役立ちます。しかしタイトルの類似度も1つの推測の基準にすぎず、確認を経ずに自動で1件を選ぶ点は変わらないため、誤ったインシデントを選ぶリスクは残ります。"]},{"t":"検索ツールの説明を更新し、候補のインシデントが複数返ったときは作業前に確認を求めさせる。","c":true,"e":["正解。ツールの説明文は、そのツールをいつどう使うべきかをClaudeに伝える場所で、制約や注意点もここに書くよう公式に勧められています。候補が複数返った場合は推測で1件を選ばず確認を求める、と説明に明記しておけば、Claude Codeは作業を進める前に対象のインシデントを確かめるようになります。"]},{"t":"プロジェクトのファイルを変更する前に、一致した中で最も新しいインシデントを選ぶようコマンドを更新する。","c":false,"e":["最新のものを選ぶという規則は、最新版が正しいと分かっているデータ（設定の最新リビジョンなど）には合理的な既定値です。しかし本問で起きている不具合はまさに最新のインシデントをそのまま採用したことで、この変更は誤った挙動をコマンドの仕様として固定してしまいます。"]},{"t":"検索ツールから候補のインシデントをすべて、IDなどの識別情報付きで返させる。","c":true,"e":["正解。似たインシデントが複数あることと、それらを見分けるためのIDやステータス、起票日が結果に含まれていれば、Claudeはあいまいさに気づき、どれを対象にすべきかを判断したり確認したりできます。ツールの応答は、次の判断に必要な識別子と情報を返すように設計することが推奨されています。"]}],"overall":["検索結果があいまいなとき、エージェントが推測で1件を選んで先に進むと、誤った対象に対して変更を実装してしまいます。これを防ぐには、ツールがあいまいさを見える形で返すことと、あいまいなときの振る舞いを明示することの両方が必要です。公式のツール定義ガイドは、説明文にツールの使い方や注意点を詳しく書くことと、ツールの応答に次の判断に必要な識別子と情報だけを返すことを勧めています。","本問では、候補をIDやステータス、起票日といった識別情報とともにすべて返すことであいまいさが見えるようになり、候補が複数あるときは確認を求めるとツールの説明に書くことで、Claude Codeが推測で進まなくなります。","タイトルの類似度や新しさで自動選択する案は、どちらも確認を経ない推測である点で同じ問題を抱えています。","正解の2つはどちらも、あいまいさを隠さずに表に出し、確認につなげる方向を向いています。"],"ref":"https://platform.claude.com/docs/en/agents-and-tools/tool-use/define-tools"},{"n":8,"d":"Claude Codeの設定とワークフロー","stem":["ある証券会社のプラットフォームチームは、社内の約150のリポジトリでClaude Codeを利用しています。セキュリティ部門は、開発者がどのリポジトリで作業する場合でも、Claude Codeが.envファイルを読み取れないようにしたいと考えています。","この制限には、次の条件があります。","開発者が自分の設定ファイル、リポジトリ内の設定、起動時のオプションを変えても緩められない","今後新しく作られるリポジトリにも、追加作業なしで適用される"],"q":"最も適切な方法はどれですか。","need":1,"opts":[{"t":".envの読み取りを拒否するdenyルールを、MDMで配布するmanaged-settings.jsonに書く。","c":true,"e":["正解。managed-settings.jsonやMDM、claude.aiの管理コンソールから配布されるマネージド設定は、設定の優先順位の最上位に位置し、ユーザー・プロジェクト・ローカルの設定ファイルや--settingsでは上書きできません。配布先のマシンではすべてのプロジェクトに適用されるため、既存の約150リポジトリにも新しいリポジトリにも、追加作業なしで同じdenyルールが効きます。"]},{"t":".envの読み取りを拒否するdenyルールを、各リポジトリの.claude/settings.jsonに書いてコミットする。","c":false,"e":[".claude/settings.jsonをコミットする方法は、チーム全員に同じ権限ルールやフックを共有したいときの標準的な置き場所です。しかし効果はそのリポジトリの中だけで、新しいリポジトリには都度追加が必要なうえ、開発者は自分の作業コピーでこのファイルを編集できるため、「緩められない」「追加作業なしで適用」という条件を満たしません。"]},{"t":".envの読み取りを拒否するdenyルールを、各開発者の~/.claude/settings.jsonに追加してもらう。","c":false,"e":["~/.claude/settings.jsonは、自分が関わるすべてのプロジェクトに同じ設定を適用したいときに使うユーザー単位のファイルです。リポジトリを問わず効く点は要件に近いものの、ファイルの持ち主は開発者本人なので、ルールを追加するかどうかも後から削除するかも各自に委ねられ、組織として強制する手段にはなりません。"]},{"t":".envの読み取りを拒否するdenyルールを--settingsで渡す起動用スクリプトを配布し、それで起動させる。","c":false,"e":["--settingsは、そのセッションに限って設定を上乗せしたいときのフラグで、ユーザー・プロジェクト・ローカルの各設定ファイルより優先されます。しかし効くのは配布したスクリプト経由で起動した場合だけで、開発者がclaudeを直接起動すれば適用されないため、起動方法を変えても緩められないという条件に反します。"]}],"overall":["Claude Codeの設定は、マネージド設定・コマンドライン引数・プロジェクトのローカル設定・共有プロジェクト設定・ユーザー設定の5つの層に分かれ、同じキーが複数の層にあれば上位の層の値が使われます。公式ドキュメントは、マネージド設定をセキュリティポリシーやコンプライアンス要件のための層と位置付け、ほかのどの層からも上書きできないと説明しています。","本問の条件は、全リポジトリへの一律の適用、新しいリポジトリへの自動的な適用、そして開発者が設定や起動方法を変えても緩められないことの3つです。","共有プロジェクト設定はリポジトリ単位、ユーザー設定は開発者本人の管理下、--settingsはそのセッションだけの指定で、いずれも条件のどれかを欠きます。3つを同時に満たせるのは、組織が配布し利用者の側では変更できないマネージド設定だけです。","設定をどの層に置くかは、「誰に適用したいか」と「誰に変更させたくないか」の2つを並べると決めやすくなります。"],"ref":"https://code.claude.com/docs/en/settings"},{"n":9,"d":"コンテキスト管理と信頼性","stem":["あるチームは、Claude Agent SDKを使用して、投資先候補を調べるマルチエージェントのデューデリジェンス支援システムを構築しています。コーディネーターエージェントは、専門化されたサブエージェント（Web検索担当、資料分析担当、知見の統合担当、レポート生成担当）に作業を委任します。このシステムは対象企業を調査し、出典を明記した包括的なレポートを作成します。","評価では、統合エージェントが、各サブエージェントの出力を時系列順に連結した非常に長いプロンプトを受け取っています。最終レポートの状況は次のとおりです。","最初期のWeb検索結果からの知見は、毎回一貫して反映される","末尾に置かれた直近のレポート作成指示も、毎回一貫して反映される","集約された入力の中ほどに埋もれた資料分析の知見は、いくつかが漏れてしまう"],"q":"調査をやり直さずに、レポートの網羅性を最も直接的に改善する変更はどれですか。","need":1,"opts":[{"t":"中ほどの知見を出典なしのトピック要約に置き換えてから統合エージェントに渡し、レポートを書かせる。","c":false,"e":["要約して入力を短くするのは、コンテキストを節約したい場面では有効な手法です。しかし中ほどの知見から出典を外してしまうと、出典付きのレポートという要件を満たせず、詳細な根拠そのものも失われます。"]},{"t":"知見と出典の簡潔な一覧を統合プロンプトの冒頭に置き、詳しい根拠はラベル付きの節に残す。","c":true,"e":["正解。長い入力を並べただけのプロンプトでは、どこに何があるかをモデルが把握しにくく、中ほどに埋もれた内容が見落とされやすくなります。統合プロンプトの冒頭に知見と出典の簡潔な一覧を置き、詳しい根拠はラベル付きの節に整理すれば、統合エージェントは全知見を最初に見渡したうえで必要な根拠を参照でき、調査をやり直さずに網羅性を高められます。"]},{"t":"統合プロンプトの末尾に、提供されたすべての知見を検討するよう求める最終チェックリストを追加する。","c":false,"e":["最後にチェックリストを置くのは、出力に含めるべき項目を思い出させたい場合の軽い工夫です。しかし「提供された知見をすべて検討せよ」と求めても、中ほどに埋もれた知見がどれなのかは示されず、長い入力を時系列に連結しただけという構造の問題は残ります。"]},{"t":"応答の長さ上限を引き上げ、統合エージェントが最終レポートにより多くの知見と出典を含められるようにする。","c":false,"e":["出力の上限を引き上げるのは、レポートが途中で打ち切られている（stop_reasonがmax_tokensになる）場合の対処です。本問では最初期の結果と末尾の指示は毎回反映されており、問題は出力の長さではなく、入力の中ほどにある知見が拾われないことにあります。"]}],"overall":["コンテキストに入る情報が増えるほど、モデルが個々の情報を正確に扱う力は落ちていきます。Anthropicのコンテキストエンジニアリングの解説はこれをコンテキストの劣化（context rot）と呼び、コンテキストを限られた資源として扱うよう勧めています。","本問の統合エージェントは、サブエージェントの出力を時系列に連結しただけの長いプロンプトを受け取り、最初と最後の内容は反映できても、中ほどに埋もれた資料分析の知見を取りこぼしています。Anthropicのプロンプトガイドは、長い文書を扱う際には内容と出典などのメタデータをXMLタグで構造化することを勧めています。冒頭に知見と出典の簡潔な一覧を置き、詳細をラベル付きの節に整理すれば、どの知見も一覧から辿れるようになり、調査をやり直さずに網羅性を改善できます。","最後のチェックリスト、出典を外した要約、出力上限の引き上げは、入力の構造という原因に手を付けていません。","長いプロンプトで取りこぼしが起きたら、情報の量より並べ方を先に見直しましょう。"],"ref":"https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices"},{"n":10,"d":"プロンプトエンジニアリングと構造化出力","stem":["Claude Agent SDKを使用して、マルチエージェントの調査システムを構築しています。コーディネーターエージェントが、専門化されたサブエージェントに作業を委任します。サブエージェントには、Web検索を行うもの、文書を分析するもの、調査結果を統合するもの、レポートを生成するものがあります。このシステムはトピックを調査し、出典を明記した包括的なレポートを作成します。","ある法務調査チームは、6万件の判例トピックを一晩で処理する計画を立てています。各トピックは独立したMessages APIのレポート生成リクエストとし、Message Batches APIを通じて送信します。","パイロットサンプルでは、次の問題が分かりました。","レポート生成用のプロンプトが、必須のレポートセクションを省略することがある","下流のパーサーが拒否するJSONメタデータを出力することがある"],"q":"全件を送信する前に取るべき次のステップとして、最も適切なものはどれですか。","need":1,"opts":[{"t":"プロンプトをテンプレート化し、本番と同じリクエスト形式のエッジケース評価で改善を重ね、同期のドライラン成功後にバッチを送る。","c":true,"e":["正解。6万件を流す前に、プロンプトをテンプレート化して本番と同じ構造化出力のリクエスト形式で代表的なエッジケースを評価し、欠落するセクションや拒否されるメタデータが無くなるまで改善を繰り返すのが確実です。最後に同期のリクエストでドライランを通してから投入すれば、既知の欠陥を6万件分複製するリスクを避けられます。"]},{"t":"Claudeにレポート生成プロンプトを書き直させ、採点基準もテストセットも変えずにその版でバッチを送信する。","c":false,"e":["Claudeにプロンプトを改善させること自体は有効で、Anthropicも最新のモデルは優れたプロンプトエンジニアになりうると紹介しています。しかし出てきた版を評価せずに本番へ採用し、採点基準もシナリオ固有のテストも用意しないままでは、判明している欠陥が直ったかを確かめられないまま大規模実行に進むことになります。"]},{"t":"先に全件をバッチで送信し、終了した結果から検証や品質の失敗を洗い出して、該当する判例トピックだけを修正版で再送する。","c":false,"e":["先に全件を流して失敗分だけ再送する方式は、失敗がまれでランダムに起きる場合には現実的な運用です。本問ではパイロットの段階で欠陥が判明しているため、それを直さずに6万件を投入すると同じ失敗を大量に生み、コストと再送の手間が無駄になります。"]},{"t":"レポート生成のスキーマを厳格にしてツールの使用を強制し、網羅性や出典の品質の問題はスキーマ検証に任せる。","c":false,"e":["スキーマの厳格化やツールの強制は、JSONメタデータの構文や型の誤りを防ぐには効果があります。しかし必須のレポートセクションが中身として抜け落ちる網羅性の問題や出典の質はスキーマ検証では判定できず、既知の欠陥の一部にしか対処できません。"]}],"overall":["大規模なバッチ処理は、1件あたりのコストが安い反面、プロンプトの欠陥もそのまま件数分だけ複製します。Anthropicの評価設計のガイドは、成功基準を明確にし、実際のタスク分布とエッジケースを反映したテストで評価しながらプロンプトを改善していく流れを基本にしています。","本問のパイロットでは、必須セクションの欠落とパーサーが拒否するJSONメタデータという2種類の欠陥がすでに見つかっています。したがって、プロンプトをテンプレート化して本番と同じリクエスト形式でエッジケースを評価し、改善と再評価を繰り返したうえで、同期のドライランが成功してから6万件を投入するのが最善の次の一手です。","改善版を検証せずに採用する案、先に全件を流す案、スキーマ検証だけに頼る案は、いずれも既知の欠陥を確かめないまま大規模実行に進んでしまいます。","少量で欠陥が再現しなくなったことを確かめられるかどうかが、大規模投入の前提条件です。"],"ref":"https://platform.claude.com/docs/en/test-and-evaluate/develop-tests"},{"n":11,"d":"エージェントアーキテクチャとオーケストレーション","stem":["あなたは、Claude Agent SDKを使用して開発者の生産性向上ツールを構築しています。このエージェントは、エンジニアが不慣れなコードベースを探索し、レガシーシステムを理解し、ボイラープレートコードを生成し、反復的なタスクを自動化するのを支援します。組み込みツール（Read、Write、Bash、Grep、Glob）を使用し、Model Context Protocol（MCP）サーバーと統合します。","ある小売チェーンの在庫管理システムを長時間にわたって調査する過程で、メインの会話がファイル一覧・検索結果・テストログで繰り返し埋め尽くされてしまいます。リード開発者は、冗長な調査出力によって重要なコンテキストが失われないようにしたうえで、メインエージェントには引き続きアーキテクチャを把握するための調整役を担わせたいと考えています。"],"q":"この問題に最も適した変更はどれですか。（2つ選択してください。）","need":2,"opts":[{"t":"汎用（general-purpose）サブエージェントに探索させ、パスと行番号付きの要約だけをメインに返させる。","c":true,"e":["正解。コンテキストを守る効果は、どの種類のサブエージェントを使うかよりも、メインに何を返すかで決まります。汎用サブエージェントで探索しても、戻す内容を要約とファイルパス・行番号の参照に絞れば、生の出力はサブエージェント側に留まり、必要なときは参照を手がかりに該当箇所だけを読み直せます。"]},{"t":"調査する分岐ごとにforkを作成し、親の会話全体を継承させたうえで結果をメインに返させる。","c":false,"e":["forkは現在の会話をそのまま引き継いで分岐するため、同じ前提のまま別の方針を試したいときに便利です。しかし親の会話全体を各分岐に持ち込むと、探索のたびに大きなコンテキストを抱えて始めることになり、コンテキストを軽く保つという目的とは逆の結果になります。"]},{"t":"Grep・Glob・Read・Bashをメインの会話で直接実行し、大きな探索が終わるたびに会話をコンパクト化する。","c":false,"e":["メインの会話で直接ツールを使うのは、1〜2回の検索で済む小さな調査なら最も手早い方法です。しかし長時間の調査では、コンパクト化するまでの間メインの会話が生の出力で埋まり続け、要約の際には重要な細部も一緒に失われやすくなります。"]},{"t":"コード検索とファイル探索をExploreサブエージェントに任せ、簡潔な調査結果だけをメインの会話に返させる。","c":true,"e":["正解。Exploreはコードベースの検索と分析に特化した読み取り専用の組み込みサブエージェントで、探索の結果をメインの会話の外に留めるために使われます。大量のファイル一覧や検索結果はExploreのコンテキストの中で処理され、メインには要点だけが戻るため、調整役のコンテキストを冗長な出力から守れます。"]}],"overall":["長い調査でメインの会話が検索結果やログで埋まってしまう問題には、サブエージェントによるコンテキストの分離が効きます。サブエージェントは独立したコンテキストで作業し、途中のツール呼び出しと結果は内部に留まり、最終メッセージだけが呼び出し元に戻ります。Anthropicのコンテキストエンジニアリングの解説でも、サブエージェントが数万トークン規模の探索を行っても、メインには1,000〜2,000トークン程度の凝縮された要約だけを返す構成が紹介されています。","本問では、読み取り専用のExploreに探索を任せる案と、汎用サブエージェントでも返す内容を要約と参照に絞る案が、この分離を実現します。","メインで直接実行してから後で圧縮する案は、圧縮までの間コンテキストを肥大化させ、forkで親の会話を継承させる案は分岐ごとに重いコンテキストを持ち込みます。","サブエージェントの種類よりも「メインに何が戻るか」に注目すると、正しい組み合わせが見えてきます。"],"ref":"https://code.claude.com/docs/en/sub-agents"},{"n":12,"d":"ツール設計とMCP統合","stem":["あなたのチームは、インフラ構成変更（Infrastructure as Code）のプルリクエストのレビューを、Message Batches APIを使って毎晩実行したいと考えています。","各レビューでは、Claudeが最終的なフィードバックを書く前に、アプリケーション側で実行するクライアントツールrun_infra_checksが必要になる場合があります。このツールは、ローカルでterraform planとポリシーチェックを実行します。"],"q":"このワークフローを最も適切に処理する設計はどれですか。","need":1,"opts":[{"t":"レビュー用プロンプトをバッチ項目として送信し、tool_choiceをrun_infra_checksに設定し、最終フィードバックを返す前にバッチワーカーがクライアントツールを実行してくれる前提にする。","c":false,"e":["tool_choiceで特定のツールを強制するのは、必ずそのツールの呼び出しを得たい場面で使う設定です。しかし強制しても得られるのはtool_useブロックまでで、クライアントツールを実行するのはバッチ処理側ではなくアプリケーションの責務です。バッチワーカーがローカル環境でterraform planを走らせることはありません。"]},{"t":"プロンプト、予測したtool_resultブロック、最終レビュー指示を1つのバッチ項目にまとめて送信し、Claudeが1回のリクエストでループを完結できるようにする。","c":false,"e":["tool_resultには、実際にツールを実行して得た結果を入れる必要があります。実行前に結果を予測して埋め込めば、Claudeは存在しない検証結果をもとにレビューを書くことになり、1回のリクエストでループが閉じたように見えても内容の正しさは保証されません。"]},{"t":"レビュー用プロンプトをバッチ項目として送信し、custom_idでtool_useの結果を取得し、要求されたクライアントツールを実行したうえで、tool_resultブロックを含む後続リクエストを送信する。","c":true,"e":["正解。Message Batches APIでもツール定義を含むリクエストは処理できますが、クライアントツールを実行するのはAnthropicではなく呼び出し側のアプリケーションです。","バッチ結果にrun_infra_checksのtool_useが含まれていたら、custom_idで該当するレビューを特定してローカルでツールを実行し、その出力をtool_resultとして含めた後続リクエストを送ることでループを完結させます。"]},{"t":"レビュー用プロンプトをバッチ項目として送信し、run_infra_checksの代わりにweb_searchを使い、サーバーツールの実行結果でローカルリポジトリの検証を代替する。","c":false,"e":["web_searchはAnthropic側で実行されるサーバーツールで、公開情報を調べたい場面ではバッチの中でも利用できます。しかしインターネット検索では、ローカルのリポジトリに対するterraform planやポリシーチェックの結果は得られず、run_infra_checksの代わりにはなりません。"]}],"overall":["Message Batches APIは、Messages APIと同じパラメータのリクエストを大量にまとめて非同期で処理する仕組みで、ツール利用を含むリクエストも扱えます。ただしバッチの中でAnthropicが実行するのはweb検索などのサーバーツールだけで、アプリケーションが定義したクライアントツールは、結果を受け取った側が実行しなければなりません。","本問のrun_infra_checksはローカルでterraform planとポリシーチェックを実行するクライアントツールなので、バッチの結果にtool_useが含まれていれば、custom_idでどのレビューのものかを特定し、ツールを実行して、tool_resultを含む後続リクエストを送る必要があります。","web_searchへの置き換えは検証の対象が違い、tool_choiceの強制は実行主体を変えず、予測したtool_resultは実行結果ではありません。","そのツールを誰が実行するのかという一点で、選択肢の成否が分かれます。"],"ref":"https://platform.claude.com/docs/en/build-with-claude/batch-processing"},{"n":13,"d":"ツール設計とMCP統合","stem":["あなたは、Claudeを使用して給与計算用のデータ抽出システムを構築しています。このシステムは、タイムシートなどの非構造化文書から情報を抽出し、JSONスキーマを使用して出力を検証し、高い精度を維持します。エッジケースを適切に処理し、下流の給与システムと連携する必要があります。","検証中、あるMCPツールが次の2点を検知しました。","抽出された勤務日が、実在しない日付である","申告された合計勤務時間が、抽出した内訳の合計と一致しない","このツールは現在、「検証に失敗しました」というテキストを含む通常の結果を返しています。その結果、Claudeが同じ呼び出しを繰り返したり、下流のシステムが抽出を成功とみなしたりすることがあります。"],"q":"復旧動作を改善する変更として、最も効果的なものはどれですか。","need":1,"opts":[{"t":"tools/callリクエストに対してJSON-RPCのエラー応答を返し、検証の失敗をプロトコル層のエラーとして報告する。","c":false,"e":["JSON-RPCのエラーは、存在しないツールの呼び出しやCallToolRequestのスキーマに合わない不正なリクエストなど、リクエストの構造そのものの問題を報告するための仕組みです。仕様上、モデルが自力で直しにくい種類のエラーとされており、実在しない日付や合計の不一致のような検証結果をClaudeに修正させたい本問には合いません。"]},{"t":"抽出結果は空のまま、文書を検証できなかった理由を説明するテキストを本文に入れた成功扱いのCallToolResultを返す。","c":false,"e":["空の結果を成功として返すのは、検索で該当が0件だったように「処理は正常に終わったが中身が無い」ケースには正しい表現です。しかし本問は検証に失敗しており、成功扱いのままでは下流システムが抽出を成功とみなす現在の問題がそのまま残ります。"]},{"t":"日付と合計値の書式をツールの説明文に追記し、Claudeが不正な引数を送らないよう予防する。","c":false,"e":["ツールの説明文に入力の書式や制約を書くのは、そもそも不正な引数が送られる頻度を下げる予防策として有効です。ただし検証が実際に失敗したときにその内容をClaudeへ伝える手段にはならないため、同じ呼び出しの繰り返しや下流での成功扱いという復旧時の問題は解決しません。"]},{"t":"CallToolResultのisErrorをtrueにし、エラー種別と修正のヒントをstructuredContentで返す。","c":true,"e":["正解。MCPでは、APIの失敗や入力値の検証エラー、業務ルール違反のようなツール実行時の失敗を、isErrorをtrueにしたツール結果として返すと定められています。エラー種別や影響したフィールド、修正のヒントをstructuredContent（と同じ内容のテキスト）で返せば、Claudeは失敗を成功と取り違えず、どの値をどう直して再実行すべきかを判断できます。"]}],"overall":["MCPのツールは、エラーを2つの経路で報告します。1つはJSON-RPCのエラーで、未知のツールや不正な形式のリクエストなど、リクエストの構造自体の問題に使います。もう1つはツール結果のisErrorをtrueにして返すツール実行エラーで、APIの失敗、入力値の検証エラー（日付の形式違いや範囲外の値など）、業務ロジックのエラーが対象です。2026-07-28版の仕様は、後者にはモデルが自己修正してリトライするための実行可能なフィードバックを含め、クライアントはそれをモデルに渡すべきだとしています。","本問の「実在しない日付」「合計値の不一致」はまさにツール実行エラーなので、isErrorを付け、種別や修正のヒントを構造化して返すのが正しい設計です。","JSON-RPCエラーは用途が違い、成功扱いの結果は失敗を隠し、説明文の追記は予防にとどまります。","「リクエストの形の問題」か「実行した結果の問題」かの区別が、エラーの返し方を決める鍵です。"],"ref":"https://modelcontextprotocol.io/specification/2026-07-28/server/tools"},{"n":14,"d":"エージェントアーキテクチャとオーケストレーション","stem":["ある銀行で、コアバンキング基盤の大規模なリファクタリングを進めています。チームは、Claude Codeにデータベース移行レビュー、API互換性レビュー、テストカバレッジレビューを並行して実行させたいと考えています。また、矛盾する指摘事項を解消し、どのフォローアップ作業を行うかを決める場所は、1か所にまとめたいと考えています。"],"q":"Claude Codeのサブエージェントモデルに最も合致するオーケストレーション設計はどれですか。","need":1,"opts":[{"t":"レビュアーのサブエージェント同士に直接メッセージを交換させ、共有タスクリスト上で調整した最終プランを送らせる。","c":false,"e":["メンバー同士が直接メッセージをやり取りし、共有タスクリストで調整する形は、Claude Codeの実験的機能であるエージェントチームの仕組みです。互いの発見を議論させたい調査には向きますが、判断を1か所に集約するサブエージェントのモデルとは異なり、調整のオーバーヘッドとトークン消費も大きくなります。"]},{"t":"メインエージェントがAgentで各レビュアーに必要な情報を渡して起動し、返った要約をもとに中央で方針を決める。","c":true,"e":["正解。Claude Codeのサブエージェントは、メインの会話がAgentツールで起動し、各自の独立したコンテキストで作業して最終結果だけを呼び出し元に返します。独立した3つのレビューは並行して走らせられ、返ってきた要約をメインエージェントが突き合わせることで、矛盾する指摘の解消とフォローアップの決定を1か所に集約できます。"]},{"t":"メインエージェントのツールからAgentを外し、CLAUDE.mdに書いたレビュアー用の指示からClaudeに暗黙的に選ばせる。","c":false,"e":["CLAUDE.mdにレビュー観点を書いておくことは、チーム共通の基準を常に読み込ませる用途には役立ちます。しかしAgentツールを外すとメインエージェントはサブエージェントを起動できなくなり、レビュアーを並行して動かすという要件そのものが実現できません。"]},{"t":"各レビュアーを独立したサブエージェントとして起動しつつメインの履歴を継承させ、振り分けの段を設けずに指摘をまとめる。","c":false,"e":["履歴を引き継いで起動するのは、現在の会話を分岐させるforkの挙動で、同じ文脈を前提に別案を試したいときに使います。通常のサブエージェントは新しいコンテキストで始まるため「独立して起動しつつ履歴を継承する」前提が噛み合わず、振り分けの段を省けば、矛盾する指摘を解消して次の作業を決める場所もなくなります。"]}],"overall":["Claude Codeで並行作業を組むときは、サブエージェントとエージェントチームという2つのモデルを区別しておく必要があります。サブエージェントは1つのセッションの中でメインの会話がAgentツールを使って起動し、それぞれ独立したコンテキストで作業したうえで結果を呼び出し元に返します。エージェントチームは複数のセッションが共有タスクリストと直接のメッセージで協調する実験的な機能で、判断は分散します。","本問は「3つのレビューを並行して走らせたい」「矛盾の解消とフォローアップの決定は1か所で行いたい」という2条件を持ち、後者が決め手です。メインエージェントが各レビュアーに必要な情報を渡して起動し、返った要約を中央で統合する案だけが、両方をサブエージェントのモデルで満たします。","履歴の継承を前提にする案、ピア同士で調整させる案、Agentツールを外す案は、それぞれ別の仕組みの特徴を持ち込んでいます。","誰が最終判断を下すのかが、2つのモデルを分ける最大の違いです。"],"ref":"https://code.claude.com/docs/en/sub-agents"},{"n":15,"d":"Claude Codeの設定とワークフロー","stem":["Claudeを使用して、構造化データ抽出システムを構築しています。このシステムは、非構造化文書から情報を抽出し、JSONスキーマを使用して出力を検証し、高い精度を維持します。エッジケースを適切に処理し、下流のシステムと連携する必要があります。","このチームは、Claude Codeを使って抽出用のリポジトリを更新しています。"],"q":"Claudeにデフォルトモードで直接変更させるのではなく、実装前にプランモードを使うのに最も適したタスクはどれですか。（2つ選択してください。）","need":2,"opts":[{"t":"既知のスキーマファイルを開かせ、誤字のあるフィールドラベルを直させて、明白な1行の修正を適用させる。","c":false,"e":["ファイルも誤りの内容も分かっている誤字の修正は、探索も設計判断も必要としない典型的な小さな変更です。プランモードを経由すると手間が増えるだけで、既定のモードで直接修正させる方が効率的です。"]},{"t":"既に特定済みの検証関数を開かせ、失敗時のログ出力を1行追加させて、その小さな変更を保存させる。","c":false,"e":["対象の関数が特定済みで、失敗時にログを1行足すだけの変更は、範囲がはっきりしています。試験ガイドも、ある関数にバリデーションを1つ足すような単純で範囲が明確な変更には直接実行が適しているとしています。"]},{"t":"検証と修復がパイプライン全体でどう作用し合うかを調べさせ、部分的に妥当な文書の扱いを提案させる。","c":true,"e":["正解。検証と修復の段がパイプライン全体でどう作用し合っているかはまだ把握されておらず、部分的にしか妥当でない文書の扱いは設計判断を伴います。プランモードならファイルを変更せずに複数の箇所を読み比べ、方針を提案させて人が確認してから実装に進めるため、影響範囲が不明確な変更に適しています。"]},{"t":"既存の保険金請求の抽出フローを調べさせ、あいまいな請求額の表現を変えるための移行計画を提案させる。","c":true,"e":["正解。既存の抽出フローを調べたうえで、あいまいな請求額の表現方法を変える移行計画を立てる作業は、複数のファイルに影響が及ぶ可能性があり、どの方式に移行するかという判断も含みます。直接変更させる前にプランモードで選択肢と影響範囲を洗い出す価値が高いタスクです。"]}],"overall":["プランモードは便利な一方で、計画のための往復というオーバーヘッドも生みます。試験ガイドは使い分けの目安として、大規模な変更や複数ファイルの修正、アーキテクチャ上の判断を伴う複雑なタスクにはプランモードを、ある関数にバリデーションを1つ足すような単純で範囲が明確な変更には直接実行を挙げています。プランモードでは、Claudeはソースを編集せずに調べて計画を示し、承認されるまで編集しません。","本問では、パイプライン全体の検証と修復の相互作用を調べて方針を決める作業と、既存フローを調べて請求額の表現を移行する計画を立てる作業が、影響範囲も判断の余地も大きいプランモード向きのタスクです。","特定済みの関数へのログ追加と既知のファイルの誤字修正は、直接実行で十分です。","迷ったら、変更の範囲と進め方がすでに決まっているかを確かめてみてください。"],"ref":"https://code.claude.com/docs/en/permission-modes"},{"n":16,"d":"ツール設計とMCP統合","stem":["ある通信キャリアのカスタマーサポート部門は、自社のカスタマーサポート解決エージェントを見直しています。その中で、エスカレーションされたサポートチケットに、「顧客は請求金額について不満を持っている」といったあいまいなメモしか残っていないことが多い、という問題が見つかりました。","これらのチケットを受け取る人間の担当者は、元のチャット履歴にアクセスできません。また、下流のサポート管理ツールは、一貫した引き継ぎデータを前提としています。"],"q":"この問題に最も適した実装上の変更はどれですか。（2つ選択してください。）","need":2,"opts":[{"t":"引き継ぎメモの必須項目をシステムプロンプトに箇条書きで列挙し、自由記述で出力させる。","c":false,"e":["必須項目を指示で列挙するのは、メモの抜けを減らす手軽な改善としては効果があります。しかし自由記述の出力は項目名や順序、値の書き方が毎回揺れる可能性があり、構造を検証する仕組みも無いため、一貫した引き継ぎデータを前提とする下流のサポート管理ツールの要件を保証できません。"]},{"t":"人への引き継ぎで対応を終える場合はエスカレーション用ツールを呼び出すよう、システムプロンプトで指示する。","c":true,"e":["正解。ツールを定義しても、どの場面で呼ぶべきかが伝わっていなければ、Claudeは引き継ぎの際に自由記述のメモで済ませてしまうことがあります。人への引き継ぎで対応を終えるときはエスカレーション用ツールを呼ぶ、とシステムプロンプトで明示すれば、構造化された引き継ぎデータが毎回作られるようになります。"]},{"t":"顧客IDや根本原因、推奨対応をinput_schemaの必須項目にしたescalate_to_humanツールを定義する。","c":true,"e":["正解。input_schemaのrequiredに顧客ID・根本原因・推奨対応などを定めたクライアントツールを用意すると、Claudeはエスカレーションのたびにこれらの項目を埋めた構造化データを渡すことになります。strictをtrueにすればスキーマへの準拠も保証でき、元のチャットを見られない人間の担当者や下流ツールが一貫した引き継ぎデータを受け取れます。"]},{"t":"チケットを作成する前に返金の引数が検証されるよう、tool_choiceでprocess_refundを強制的に呼ばせる。","c":false,"e":["tool_choiceでツールを強制するのは、特定の処理を必ず実行させたい場面の設定です（最新の一部モデルでは400エラー）。そもそもprocess_refundは返金を実行するツールで、エスカレーション時の引き継ぎメモの質という本問の課題とは無関係です。"]}],"overall":["人への引き継ぎで情報が欠ける問題は、引き継ぎ自体を構造化されたツール呼び出しにすることで解決できます。Messages APIのクライアントツールは名前・説明・input_schemaで定義し、Claudeはスキーマに沿った入力を組み立てて呼び出します。公式のツール定義ガイドは、ツールの用途と使うべき場面を説明文で具体的に伝えることを重視しており、必須項目をrequiredで定めればClaudeはその項目を埋めて呼び出します。","本問では、顧客IDや根本原因、推奨対応を必須にしたescalate_to_humanツールを定義することと、引き継ぎで終わる対応ではそのツールを使うよう指示することの2つが組み合わさって、一貫した引き継ぎデータが毎回作られます。","必須項目を箇条書きで指示して自由記述させる案は形式を保証できず、process_refundの強制は別の処理を対象にしています。","データの形を決める仕組みと、そのツールを使わせる仕組みの両方が揃っているかどうかが要点です。"],"ref":"https://platform.claude.com/docs/en/agents-and-tools/tool-use/define-tools"},{"n":17,"d":"コンテキスト管理と信頼性","stem":["Claude Agent SDKを使用して、マルチエージェントの競合製品調査システムを構築しています。コーディネーターエージェントが、専門化されたサブエージェントに作業を委任します。サブエージェントには、Web検索を行うもの、文書を分析するもの、調査結果を統合するもの、レポートを生成するものがあります。このシステムはトピックを調査し、出典を明記した包括的なレポートを作成します。","コーディネーターは昨日調査を完了し、Web検索の出力・文書分析ツールの結果・統合のメモ・レポート生成の下書きを含むセッションを保存しました。それ以降、次の変化がありました。","文書コーパスが再インデックスされた","複数の情報源文書が更新された","レビュー担当者が、従来の調査結果のうちどれが引き続き有効かを修正した","チームは、次の実行では有効な分析上の判断だけを引き継ぎ、昨日のツールの古い観測結果は持ち越さないようにしたいと考えています。"],"q":"コーディネーターが次に行うべきことはどれですか。（2つ選択してください。）","need":2,"opts":[{"t":"保存済みのセッションをforkし、そのforkの中で修正版のレポートを検討させる。","c":false,"e":["forkは元のセッションの履歴をコピーした新しいセッションを作り、元を残したまま別の方向を試したいときに使います。しかしコピーされる履歴には再インデックス前の検索結果や分析結果も含まれるため、古い観測結果を持ち越さないという要件には合いません。"]},{"t":"保存済みのセッションをIDで再開し、昨日の古いツール結果は無視するようコーディネーターに指示する。","c":false,"e":["セッションの再開（resume）は、中断した作業を同じ文脈のまま続けたいときや、上限に達した実行を引き継ぎたいときに使う機能です。再開すると昨日のツール結果を含む会話全体がそのままコンテキストに戻るため、「無視して」と指示しても古い観測結果が後続の判断に紛れ込む余地が残ります。"]},{"t":"再インデックス後のコーパスに対して、Web検索と文書分析のサブエージェントを実行し直す。","c":true,"e":["正解。昨日のWeb検索と文書分析の出力は、再インデックスと文書の更新が行われる前のコーパスに基づく観測結果です。新しいレポートの根拠にするには、これらのサブエージェントを更新後のコーパスに対して実行し直し、観測結果そのものを取り直す必要があります。ツールの出力は実行した時点のデータの写しにすぎないため、データ側が変わった後に最新の状態を得る方法は、ツールを実行し直すこと以外にありません。"]},{"t":"新しいセッションを開始し、検証済みの結果と判断、再確認する情報源を構造化した要約で渡す。","c":true,"e":["正解。新しいセッションで始め、レビュー担当者が有効と認めた調査結果と判断、再確認すべき情報源だけを構造化した要約として渡せば、昨日の古いツール出力をコンテキストに持ち込まずに済みます。何を引き継ぎ何を捨てるかをアプリケーション側で明示的に選べるのが、この方法の利点です。"]}],"overall":["Agent SDKでは、過去のセッションを続ける方法として、直近のセッションを続けるcontinue、IDを指定して再開するresume、履歴をコピーして分岐するforkが用意されています。いずれも過去の会話履歴を引き継ぐための機能で、履歴の中身がまだ正しいことが前提です。","本問では、文書コーパスの再インデックス、情報源の更新、レビュー担当者による有効な調査結果の修正という3つの変化が起きており、昨日のツール出力はもはや信頼できません。この場合は、新しいセッションを始めて有効な判断と再確認すべき情報源だけを構造化した要約として渡すことと、Web検索と文書分析を更新後のコーパスで実行し直して観測結果を取り直すことの2つが必要です。","resumeやforkは古い観測結果を含む履歴ごと引き継いでしまい、「無視して」という指示では紛れ込みを防げません。","前提となるデータが変わったときは、履歴を引き継ぐよりも、必要な判断だけを選んで新しい文脈に持ち込む方が安全です。"],"ref":"https://code.claude.com/docs/en/agent-sdk/sessions"},{"n":18,"d":"エージェントアーキテクチャとオーケストレーション","stem":["あるEコマース企業は、Claude Agent SDKを使用してマルチエージェントの商品リサーチシステムを構築しています。コーディネーターが、市場調査・文書分析・統合・レポート生成をそれぞれ担当する専門サブエージェントに作業を委任し、根拠付きの詳細なレポートを作成します。","テストでは、初期の調査ステップは出典を豊富に含む調査結果をコーディネーターに返しています。それにもかかわらず、統合サブエージェントは出典を記載しない要約をたびたび生成しています。統合作業を委任するメッセージは、「これまでに集めた調査結果を使って、出典付きのレポートを作成してください」という内容です。"],"q":"このチームが行うべき変更はどれですか。（2つ選択してください。）","need":2,"opts":[{"t":"統合サブエージェントが、自身のツール設定からAgentを呼び出して他のサブエージェントを起動できるようにする。","c":false,"e":["サブエージェントにAgentツールを持たせて入れ子で委任させる構成は、大きな作業をさらに分割したい場合に使えます。しかし統合サブエージェントが別のサブエージェントを起動しても、コーディネーターが持っている既存の調査結果や出典はそこに現れず、同じ情報の欠落を抱えたまま委任が増えるだけです。"]},{"t":"関連する調査結果と出典メタデータを、統合タスクのメッセージに直接渡す。","c":true,"e":["正解。Agent SDKのサブエージェントは、親の会話履歴やツール結果を持たない新しいコンテキストで始まり、親から渡るのはAgentツールのプロンプト文字列だけです。「これまでに集めた調査結果」と書いても統合サブエージェントには中身が見えないため、必要な調査結果と出典メタデータを委任メッセージ自体に含める必要があります。"]},{"t":"最終レポート作成のたびに、統合サブエージェントを@メンションで呼び出す。","c":false,"e":["@メンションは、Claude Codeで特定のサブエージェントを確実に呼び出したいときに使う指定方法です。呼び出し方を変えても統合サブエージェントに渡る情報は委任時のプロンプトのままなので、調査結果と出典が届いていないという根本原因は解消しません。"]},{"t":"収集した調査結果と出典メタデータをファイルに書き出し、そのファイルパスを統合タスクのメッセージで渡す。","c":true,"e":["正解。調査結果と出典メタデータをファイルに書き出してパスを渡せば、統合サブエージェントは自分でファイルを読んで出典を参照できます。Anthropicのマルチエージェント調査システムでも、成果物を外部に保存して軽量な参照だけを受け渡すことで、伝言ゲームによる情報の劣化を防いでいます。"]}],"overall":["サブエージェントに何が引き継がれ、何が引き継がれないかを押さえていれば解ける問題です。Agent SDKの公式ドキュメントによると、fork以外のサブエージェントのコンテキストは親の会話を含まずに始まり、親から渡る内容はAgentツールのプロンプト文字列だけです。そのため、必要なファイルパスや判断材料はプロンプトに直接書くよう案内されています。","本問の委任メッセージは「これまでに集めた調査結果を使って」と参照しているだけで、実際の調査結果も出典も含んでいません。解決策は、実データそのものをメッセージに入れるか、ファイルに保存してそのパスを渡すかの2通りです。","@メンションで呼び方を変える案やAgentツールを追加する案は、どちらも統合サブエージェントに届く情報を増やしません。","委任の不具合を見たときは、受け手のコンテキストに必要な情報が実際に入っているかを確かめるのが出発点です。"],"ref":"https://code.claude.com/docs/en/agent-sdk/subagents"},{"n":19,"d":"エージェントアーキテクチャとオーケストレーション","stem":["Claude Agent SDKを使用して、マルチエージェントのデューデリジェンス調査システムを構築しています。コーディネーターエージェントが、専門化されたサブエージェントに作業を委任します。サブエージェントには、Web検索を行うもの、文書を分析するもの、調査結果を統合するもの、レポートを生成するものがあります。このシステムはトピックを調査し、出典を明記した包括的なレポートを作成します。","規制対象のトピックを扱う実行で、コーディネーターがすべての主要な主張について出典対応表の検証を終える前に、レポート生成サブエージェントが、下書きを公開するMCPツールを呼び出してしまうことがあります。","チームは、出典対応表（citation manifest）が無い限り公開ツールが実行されないよう、確定的に制御したいと考えています。"],"q":"行うべき変更はどれですか。（2つ選択してください。）","need":2,"opts":[{"t":"公開ツールに対して、必須の出典対応表が欠けている呼び出しをブロックするPreToolUseフックを設定する。","c":true,"e":["正解。PreToolUseフックはツールの実行前に呼ばれ、呼び出しを拒否できます。フックはサブエージェントの中で発生したツール呼び出しでも発火するため、公開ツールへの呼び出しに出典対応表が含まれていなければ拒否する、という確定的な条件をモデルの判断とは無関係に適用できます。"]},{"t":"公開用のMCPツールをレポート生成サブエージェントの許可ツールから外し、コーディネーターだけが呼べる状態にする。","c":true,"e":["正解。Agent SDKではサブエージェントごとにtoolsやdisallowedToolsで使えるツールを限定でき、与えられていないツールはそのサブエージェントのセッションに存在しません。公開ツールをレポート生成サブエージェントから外し、出典の検証を担うコーディネーターだけが呼べるようにすれば、検証前の公開という経路そのものがなくなります。"]},{"t":"公開の前には出典対応表を検証するよう、各サブエージェントに向けた指示をコーディネーターのプロンプトに追加する。","c":false,"e":["コーディネーターのプロンプトに検証の手順を書くことは、サブエージェントの振る舞いを方向づける第一歩としては必要です。しかし指示はモデルへの依頼であり、規制対象のトピックで求められる確定的な制御にはならないため、見落としによる早すぎる公開の可能性を排除できません。"]},{"t":"公開ツールに、必須の出典対応表が欠けた出力を拒否するPostToolUseフックを設定して実行後に検査する。","c":false,"e":["PostToolUseフックは、ツールの結果を記録したり、出力を検査して後続の処理に警告を返したりする用途に適しています。しかし発火するのは公開ツールの実行が終わった後で、下書きはすでに公開されているため、実行そのものを防ぐ制御にはなりません。"]}],"overall":["規制対象のトピックで「条件を満たさない限り実行させない」制御が必要なとき、頼れるのはプロンプトではなく、ツールの権限とフックという仕組みです。Agent SDKの公式ドキュメントによると、フックは権限の評価より先に実行され、拒否すればbypassPermissionsモードでも呼び出しを止められます。また、サブエージェントの定義でtoolsを絞れば、与えられていないツールはそのサブエージェントからは見えません。","本問では、公開ツールをレポート生成サブエージェントから取り上げてコーディネーターだけが呼べるようにすることと、出典対応表の無い呼び出しをPreToolUseフックで拒否することが、それぞれ確定的な制御になります。","PostToolUseフックは実行後に動くため公開を防げず、コーディネーターへの指示の追加は依頼にとどまります。","モデルの判断を経由しない仕組みかどうかが、「確定的」という条件を満たすための基準です。"],"ref":"https://code.claude.com/docs/en/agent-sdk/hooks"},{"n":20,"d":"エージェントアーキテクチャとオーケストレーション","stem":["ある非営利団体は、Claude Agent SDKを使用してマルチエージェントの政策リサーチシステムを構築しています。コーディネーターが、Web調査・文書分析・統合・レポート生成をそれぞれ担当する専門サブエージェントに作業を委任し、出典を明記した包括的なレポートを作成します。","コーディネーターは、文書分析サブエージェントが証拠の抜粋と出典メタデータを返す前に、レポート生成サブエージェントへ委任してしまうことがあります。その結果、レポートはよく書けているものの、元の出典まで遡れない主張を含んでしまいます。"],"q":"この失敗を最も効果的に防ぐ変更はどれですか。","need":1,"opts":[{"t":"コーディネーターの反復回数の上限を増やし、不足している証拠を再要求できる機会を増やす。","c":false,"e":["反復回数の上限を引き上げるのは、複雑な調査で途中打ち切りが起きているときの対処です。本問の失敗は回数不足ではなく、証拠が返る前に次の段へ進んでしまう順序の問題なので、ループを長くしても早すぎる委任は防げません。"]},{"t":"tool_choiceでレポート生成ツールを強制し、Claudeが常に指定されたレポート作成ステップを選択するようにする。","c":false,"e":["tool_choiceによるツールの強制は、特定のツールを確実に呼ばせたい単発の処理で使う手段です（最新の一部モデルでは400エラー）。仮に使えても「いつ」呼ぶかという順序は制御できず、むしろ証拠が揃う前でもレポート生成を呼ばせる方向に働きます。"]},{"t":"証拠のメタデータがすべて揃った後にのみレポート生成を行うよう、コーディネーターへの指示を強化する。","c":false,"e":["コーディネーターへの指示を具体的にすることは、望ましい振る舞いへ誘導する最初の一手としては妥当です。しかし指示はモデルへの依頼であり、早すぎる委任を確実に防ぐ仕組みではないため、すでに起きている失敗が再発する余地が残ります。"]},{"t":"必要な結果と出典の対応付けが揃うまでレポート生成への委任を拒否する、オーケストレーション層の前提条件を追加する。","c":true,"e":["正解。委任の可否をオーケストレーション層のコードで判定し、文書分析の結果と出典の対応付けが揃うまでレポート生成への委任を拒否すれば、コーディネーターの判断にかかわらず順序が守られます。Anthropicのエージェント設計ガイドも、ワークフローの途中にプログラムによるチェック（ゲート）を挟んで、次の段へ進む条件を確かめる構成を紹介しています。"]}],"overall":["サブエージェント間の実行順序を守らせたいとき、プロンプトで頼むのか、コードで強制するのかが分かれ目になります。Anthropicのエージェント設計ガイドは、ワークフローの段と段の間にプログラムによるチェック（ゲート）を置き、条件を満たしたときだけ次へ進める構成を示しています。","本問の失敗は、文書分析サブエージェントが証拠の抜粋と出典メタデータを返す前にレポート生成へ委任してしまうことで、出典を辿れない主張がレポートに入る原因になっています。オーケストレーション層で「必要な結果と出典の対応付けが揃っているか」を検査し、揃うまで委任を拒否すれば、モデルの判断のぶれに関係なく順序が保証されます。","指示の強化はあくまで依頼で、反復回数の増加やtool_choiceの強制は順序を制御する仕組みではありません。","「確実に防ぐ」と問われたら、モデルの外側で判定する仕組みがあるかを探してみてください。"],"ref":"https://www.anthropic.com/engineering/building-effective-agents"},{"n":21,"d":"エージェントアーキテクチャとオーケストレーション","stem":["あなたは、Claude Agent SDKを使用して、複数のエージェントで構成される法務契約レビューシステムを構築しています。コーディネーターエージェントが、専門化されたサブエージェントに作業を委任します。サブエージェントには、判例を検索するもの、契約書を解析するもの、調査結果を統合するもの、引用付きの意見書を作成するものがあります。","このシステムに、次の2つの評価ワークフローを追加する必要があります。","プルリクエストがマージされる前に必ずpass/failを返す必要がある、ブロッキングの引用品質ゲート","完了済みの意見書40,000件を対象に毎週実施する監査（結果は翌朝レビューされる）"],"q":"これらの要件に最も適したAPIの使い方はどれですか。","need":1,"opts":[{"t":"両方のワークフローでストリーミングのMessages API呼び出しを使い、毎週の監査は多数の同時ストリーミングリクエストとして実行する。","c":false,"e":["ストリーミングは生成中のテキストを逐次表示して、ユーザーの体感待ち時間を短くしたい対話的な用途で使う方式です。4万件の監査を同時のストリーミングリクエストで捌くとレート制限に当たりやすく、翌朝で間に合う処理に即時性の対価を払うことになります。"]},{"t":"マージゲートにはPOST /v1/messagesを使い、毎週の監査はcustom_id付きでMessage Batches APIに送る。","c":true,"e":["正解。マージゲートはPRのマージをその場で止める用途なので、応答をすぐ受け取れる同期のMessages API（POST /v1/messages）が適しています。翌朝の確認で足りる40,000件の監査は、料金が通常の50%になるMessage Batches APIに回し、結果の順序が入力と一致しない前提でcustom_idによって各意見書と突き合わせます。"]},{"t":"両方のワークフローをMessage Batches APIで送信し、各pass/failの結果が得られるまでバッチのステータスをポーリングする。","c":false,"e":["Message Batches APIは即時の応答を必要としない大量処理を半額で流せる仕組みで、毎週の監査には適しています。しかしバッチは多くが1時間以内に終わるとはいえ最大24時間かかり得る非同期処理で、マージをブロックして結果を待つゲートにポーリングで使うと、開発者の待ち時間が読めなくなります。"]},{"t":"マージゲートにはMessage Batches APIを使い、出力の順序を保つために毎週の監査にはPOST /v1/messagesを使う。","c":false,"e":["同期と非同期を使い分けるという発想は正しいものの、割り当てが逆です。即時の判定が必要なマージゲートを非同期のバッチにし、4万件の監査を同期呼び出しで処理すると、ゲートは遅く、監査は割高になります。バッチの結果は入力順とは限りませんが、custom_idで対応付けられるため、順序の維持は同期呼び出しを選ぶ理由になりません。"]}],"overall":["Claude APIには、1件ずつすぐに応答を返す同期のMessages APIと、大量のリクエストをまとめて非同期に処理するMessage Batches APIがあります。バッチは料金が通常の50%で、多くは1時間以内に完了しますが、結果を取得できるのは全件の処理が終わるか24時間が経過した時点で、結果の並びも投入順とは限りません。そのため各リクエストには一意のcustom_idを付けて結果と照合します。","本問の2つのワークフローは、「PRのマージ前に必ずpass/failを返すゲート」と「翌朝に確認できれば良い4万件の監査」で、待てる時間がまったく異なります。前者は同期呼び出し、後者はcustom_id付きのバッチ、という割り当てだけが両方の条件を満たします。","どちらもバッチにする案、割り当てを逆にする案、ストリーミングで大量に投げる案は、この待ち時間の違いを取り違えています。","APIの選択を問われたら、結果をいつまでに必要とするかをまず確認するのが確実です。"],"ref":"https://platform.claude.com/docs/en/build-with-claude/batch-processing"},{"n":22,"d":"プロンプトエンジニアリングと構造化出力","stem":["あなたは、Claudeを使用して、不動産の賃貸借契約書から情報を抽出する構造化データ抽出システムを構築しています。このシステムは、非構造化文書から情報を抽出し、JSONスキーマを使用して出力を検証し、高い精度を維持します。エッジケースを適切に処理し、下流のシステムと連携する必要があります。","最新の評価では、検証セット全体で97.4%の総合抽出精度が報告されました。関係者は、この結果をもとに人によるレビューを減らしたいと考えています。"],"q":"レビューポリシーを変更する前に、このチームが行うべきことはどれですか。（2つ選択してください。）","need":2,"opts":[{"t":"同じ検証セットでプロンプト比較を再実行し、平均スコアが高い方のプロンプトを本番に採用する。","c":false,"e":["プロンプトを比較して良い方を採用するのは、プロンプトの改善を判断するときの基本的な進め方です。しかし比較の指標が平均スコアのままでは、どの文書の種類やフィールドで誤りが集中しているのかは見えず、人によるレビューを減らしてよいかという本問の判断材料にはなりません。"]},{"t":"抽出チェックを一律に完全一致の採点へ切り替え、その集計結果を承認の根拠にする。","c":false,"e":["完全一致の採点は、感情分類のように答えがはっきりしたカテゴリで決まるタスクには単純であいまいさのない指標です。しかし表記の揺れが許されるフィールドまで一律に完全一致にすると評価の意味が変わり、しかも集計値1つで承認する点は元の問題と同じです。"]},{"t":"文書の種類ごと、フィールドごとの精度を信頼できる件数で測れるよう、検証セットを拡大する。","c":true,"e":["正解。評価を分解しても、各セグメントの件数が少なければその精度は偶然に大きく左右され、判断の根拠になりません。公式の評価ガイドも、少数の丁寧な手作業の採点より、自動で採点できる多数のテストケースを優先するよう勧めています。文書の種類とフィールドごとに精度を信頼できる件数まで検証セットを広げれば、分解した結果をレビュー方針の判断に使えます。"]},{"t":"レビューを減らしてよい条件として、セグメントごとに満たすべき精度の目標値を先に定める。","c":true,"e":["正解。公式の評価ガイドは、成功基準を「F1スコア0.85以上」のように具体的で測定可能な形で先に定めるよう勧めています。97.4%という全体の数字を見てから判断するのではなく、どのセグメントがどの精度を満たせば人のレビューを減らしてよいかを事前に決めておけば、商業用の契約書や敷金額のような重要な領域が基準を下回った場合に、レビューを残す対象として客観的に切り分けられます。"]}],"overall":["全体の精度が高いことは、どの部分でも精度が高いことを意味しません。Anthropicの評価設計のガイドは、成功基準を具体的で測定可能なものにし、実際のタスク分布とエッジケースを反映したテストで評価するよう勧めています。","本問の97.4%は検証セット全体の平均で、文書の種類や抽出するフィールドによっては、誤りが特定の領域に集中している可能性があります。人によるレビューを減らすという、誤りのコストが大きい判断をする前に必要なのは、どのセグメントがどの精度を満たせばレビューを減らしてよいかという目標を先に定めることと、その精度を信頼できる件数で測れるまで検証セットを広げることの2つです。","プロンプト比較の再実行と完全一致採点への切り替えは、どちらも集計値1つで判断する構造を変えていません。","数字1つの裏にある内訳を確かめる姿勢が、評価設計の出発点です。"],"ref":"https://platform.claude.com/docs/en/test-and-evaluate/develop-tests"},{"n":23,"d":"コンテキスト管理と信頼性","stem":["ある保険会社は、Claude Agent SDKを使用して社内向けの開発者の生産性向上ツールを構築しています。このエージェントは、エンジニアが不慣れなコードベースを探索し、レガシーシステムを理解し、ボイラープレートコードを生成し、反復的なタスクを自動化するのを支援します。組み込みツール（Read、Write、Bash、Grep、Glob）を使用し、MCPサーバーとも連携します。","このチームは、ReadとGrepを使って、レガシーの請求処理ソースファイルから構造化されたリファクタ候補を抽出しています。JSONスキーマによって不正な形式のJSONは防げるようになりましたが、ログにはまだ次の2つの問題が残っています。","一部の応答が、stop_reason: \"max_tokens\"で返ってくる","スキーマ上は正当な一部の知見が、参照先ファイルに実在しない行番号を引用している"],"q":"信頼性を改善するために、抽出ループが行うべきことはどれですか。（2つ選択してください。）","need":2,"opts":[{"t":"stop_reasonを確認して、打ち切られた生成は出力上限を上げてリトライし、意味的な検証エラーは具体的に返して修正させる。","c":true,"e":["正解。stop_reasonがmax_tokensなら出力は上限で打ち切られており、Structured outputsでもスキーマに合わない不完全な出力になり得るため、max_tokensを引き上げてリトライします。一方、実在しない行番号はスキーマ上は正しい値なので構造の検証では捕まえられず、参照先のファイルと突き合わせる意味的な検証を行い、具体的なエラーを返して修正させる必要があります。"]},{"t":"pause_turnをクライアント側ツールの失敗として扱い、エラーのtool_resultを送信して抽出を最初からやり直す。","c":false,"e":["pause_turnは、Web検索などのサーバーツールのループが反復の上限に達して一時停止したことを示すstop_reasonで、応答のアシスタント内容をそのまま送り返せば処理を続けられます。クライアント側ツールの失敗を表すものではなく、本問のmax_tokensによる打ち切りや行番号の誤りとは関係がありません。最初からやり直すのも非効率です。"]},{"t":"各ソースファイルを小さな抽出リクエストに分割し、1リクエストあたりの候補数を抑える。","c":true,"e":["正解。stop_reasonがmax_tokensになるのは、生成したトークン数が上限に達したときで、1つの応答で扱う候補が多いほど出力は長くなります。各ソースファイルを小さな抽出リクエストに分ければ、1回あたりの出力量そのものが減り、打ち切りが起きにくくなります。公式のガイドがmax_tokensに達したときの対処として挙げる上限の引き上げと組み合わせれば、打ち切りをより確実に減らせます。"]},{"t":"スキーマに適合したJSONを信頼し、行番号の検証は省略して、JSONパーサーが構文エラーを出したときだけリトライする。","c":false,"e":["スキーマに沿ったJSONであることは、構文や型の誤りが無いことを保証する点では信頼できます。しかし値の中身が事実として正しいかどうかは保証しないため、行番号の検証を省くと、実在しない行を指す指摘がそのまま下流に流れます。打ち切りによる不完全な出力も見逃します。"]}],"overall":["構造化出力で得たデータには、2種類の失敗が残り得ます。1つは出力の打ち切りで、stop_reasonがmax_tokensの場合は応答が上限で途切れており、公式ドキュメントもStructured outputsのスキーマ準拠がこのときは保証されず、max_tokensを増やしてリトライするよう案内しています。もう1つは意味の誤りで、スキーマが保証するのは構造と型までなので、実在しない行番号のような値の正しさは別途確かめる必要があります。","本問では、stop_reasonを確認して打ち切りを大きな上限でリトライし、行番号を参照先ファイルと照合して具体的な検証エラーを返すことと、ファイルを小さなリクエストに分けて打ち切り自体を起きにくくすることが、信頼性を高める組み合わせです。","pause_turnはサーバーツールのループの一時停止を示すもので本問とは無関係で、スキーマを信頼して行番号の検証を省く案は意味の誤りを放置します。","構造の検証と意味の検証は別物で、それぞれに別の手段が必要です。"],"ref":"https://platform.claude.com/docs/en/build-with-claude/handling-stop-reasons"},{"n":24,"d":"Claude Codeの設定とワークフロー","stem":["インシデント対応の手順書（ランブック）を自動化するSREエージェントを構築しています。このエージェントは、組み込みツール（Read、Write、Bash、Grep、Glob）を使用し、Model Context Protocol（MCP）サーバーとも連携します。","本番環境のトレースを確認すると、エージェントがReadやGrepで対象クラスタを確認する前に、クラスタの状態を変更するBashコマンドを実行してしまうことがあります。システムプロンプトでは、対象環境の確認を必須と指示しています。"],"q":"この必須の実行順序を最も確実に強制するために、行うべき変更はどれですか。（2つ選択してください。）","need":2,"opts":[{"t":"クラスタの状態を変えるBashコマンドの前にReadかGrepを行うよう、システム指示をより強い表現で書き直す。","c":false,"e":["システムプロンプトで手順を明示することは、望ましい振る舞いを促す出発点としては必要です。しかし本問ではすでに必須と指示しているのに順序違反が起きており、公式ドキュメントもCLAUDE.mdなどの指示は強制力のある設定ではなくコンテキストとして扱われると説明しています。表現を強めても確実な強制にはなりません。"]},{"t":"安全でないBashコマンドを実行後に検出して拒否し、Claudeにリトライを促すPostToolUseのチェックを追加する。","c":false,"e":["PostToolUseのチェックは、ツールの実行後に結果を記録したり検証したりする用途に向いています。しかしこのイベントの時点でコマンドはすでに実行されており、終了コード2を返してもブロックは起きません。クラスタの状態が変わった後に気づいても、確認を先に行わせるという要件は満たせません。"]},{"t":"状態を変える操作を専用ツールに移し、確認済みのクラスタIDを必須にして記録と一致しない呼び出しを拒否する。","c":true,"e":["正解。状態を変える操作を専用ツールに切り出し、input_schemaで確認済みのクラスタIDを必須にしたうえで、記録された確認結果と一致しない呼び出しをツールの実装側で拒否すれば、確認を経ていない変更は実行されません。順序をプロンプトの依頼ではなく、ツールの仕様として強制する設計です。"]},{"t":"対象環境の確認が記録されるまでBashを拒否する、PreToolUseの前提条件ゲートを追加する。","c":true,"e":["正解。PreToolUseフックはツールの実行前に発火し、終了コード2で終わるか、permissionDecisionを\"deny\"にして返すと呼び出しをブロックでき、その理由がClaudeに伝わります。対象環境の確認が記録されるまでBashを拒否するゲートにすれば、モデルの判断のばらつきに関係なく、確認より先に変更系のコマンドが走ることを防げます。"]}],"overall":["エージェントに決まった順番を守らせたいとき、指示だけに頼ると、今回のように広い依頼や長い作業の中でときどき破られます。Claude Codeの公式ドキュメントは、CLAUDE.mdなどの指示は強制されるものではなくコンテキストであり、Claudeの判断にかかわらずある操作を止めたいならPreToolUseフックを使うよう案内しています。PreToolUseはツールの実行前に発火し、呼び出しを拒否して理由をClaudeに返せます。","もう1つの確実な方法は、状態を変える操作を専用ツールに移し、確認済みの識別子を必須の入力にしてツール側で照合することで、これも順序を仕組みとして保証します。","システム指示の強化はすでに効いていない手段の延長で、PostToolUseは実行後にしか動かないため変更を防げません。","実行前の時点で機械的に判定しているかどうかが、確実な強制とそれ以外を分ける線です。"],"ref":"https://code.claude.com/docs/en/hooks"},{"n":25,"d":"プロンプトエンジニアリングと構造化出力","stem":["あるエネルギー事業者のプラットフォームエンジニアリングチームは、Claude Agent SDKを使用して社内向けの開発者の生産性向上ツールを構築しています。このエージェントは、エンジニアが不慣れなコードベースを探索し、レガシーシステムを理解し、ボイラープレートコードを生成し、反復的なタスクを自動化するのを支援します。組み込みツール（Read、Write、Bash、Grep、Glob）を使用し、MCPサーバーとも連携します。","このチームは自動化されたコードベース棚卸しを実行しており、エージェントはレガシーのルーター定義ファイルからエンドポイントのメタデータを、後続ツール用のJSONとして抽出しています。バリデーターは、次の理由でこの抽出を拒否しました。","必須フィールドが1つ欠けている","列挙値が1つ不正である","ハンドラー名が1つ、ソースコード中に存在しない"],"q":"リトライのフォローアップリクエストとして最も適切な設計はどれですか。","need":1,"opts":[{"t":"同じスキーマでスキーマ制約付きのJSON出力を使ってリトライし、欠けているソースの詳細はスキーマの強制に補わせる。","c":false,"e":["スキーマで出力を制約する方法は、JSONの構文や型、必須フィールドの存在を保証したいときに有効です。しかしスキーマはソースに書かれた値を知らないため、必須フィールドを埋めることはできても正しい値にする保証はなく、存在しないハンドラー名も防げません。"]},{"t":"元の文書と拒否されたJSON、バリデーターのエラーをXMLタグで区切り、修正版だけを返させる新しいリクエストを送る。","c":true,"e":["正解。元の文書を含めればモデルは正しい値やハンドラー名をソースで確かめ直せ、拒否されたJSONと具体的なバリデーターのエラーを示せば、どこをどう直すべきかが明確になります。それぞれをXMLタグで区切ると、指示・入力・誤りの一覧をモデルが混同せずに読み分けられ、修正済みのデータだけを返すよう指示すれば後続ツールもそのまま使えます。"]},{"t":"バリデーターのエラーだけを含む短い修正リクエストを送り、どのフィールドをどう直すかは前回の試行からClaudeに推測させる。","c":false,"e":["誤りの一覧だけを送る簡潔な再依頼は、トークンを節約したいときには魅力的です。しかし元の文書が無ければ、モデルは正しい値やソースに実在するハンドラー名を確認できず、誤りを含む前回の出力から推測するしかないため、別の誤りを生む危険があります。"]},{"t":"temperatureを0にし、元の文書とスキーマに「JSONの妥当性にもっと注意して」という指示を添えて、最初の抽出をリトライする。","c":false,"e":["「もっと注意して」という指示は、何を直すべきかを具体的に示していないため、欠落したフィールド、不正な列挙値、存在しないハンドラー名という3つの誤りのどれにも的確には効きません。temperatureの変更も最新モデルでは400エラーになり、0にしても完全には決定的になりません。"]}],"overall":["構造化データの抽出が検証で拒否されたとき、リトライのリクエストに何を入れるかで修正の精度が大きく変わります。必要なのは、正しい値を確かめるための元の文書、直す対象である拒否されたJSON、そして何が誤りかを示すバリデーターの具体的なエラーの3つです。Anthropicのプロンプトガイドは、指示・文脈・入力が混在するプロンプトでは、それぞれをXMLタグで囲むことで誤解を減らせると説明しています。","本問の誤りは、必須フィールドの欠落、不正な列挙値、ソースに無いハンドラー名と性質が異なり、とくに最後の1つは元の文書と照合しなければ直せません。3つの材料をタグで区切って渡し、修正済みのデータだけを返させる案がこれに合致します。","「注意して」という抽象的な指示、スキーマの強制力への期待、元の文書を省いた再依頼は、いずれも正しい値に辿り着く材料が欠けています。","リトライが成功するかどうかは、モデルが誤りを直すための証拠を手元に持っているかで決まります。"],"ref":"https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices"},{"n":26,"d":"ツール設計とMCP統合","stem":["あるフィンテック企業の開発ツールチームは、Claude Codeに2つのMCPサーバーを追加しました。その後、次のような誤りがよく起きています。","開発者がリポジトリ内のシンボルについて質問すると、Claude Codeがドキュメント検索ツールを呼び出す","開発者がフレームワークのポリシーページについて質問すると、Claude Codeがリポジトリ検索ツールを呼び出す","ツールの名前はそれぞれ異なりますが、どちらも検索型の質問を受け付けます。"],"q":"ツール選択の信頼性を改善するために、このチームがまず変更すべきことはどれですか。","need":1,"opts":[{"t":"各ツールの説明を、使うべき場面と使うべきでない場面、入力の形式と返す内容まで具体的に書き直す。","c":true,"e":["正解。Claudeはツールの説明文を読んで呼び出すツールを決めるため、公式ドキュメントも詳細な説明をツール性能の最重要要素に挙げています。何をするツールか、どんなときに使い、どんなときは使わないか、入力の意味と返す内容を書き分けると、「リポジトリ内のシンボル」と「フレームワークのポリシー」の質問を説明文の段階で振り分けられるようになります。"]},{"t":"各タスクを始める前に、開発者に正しい検索ツールを選ばせるプロジェクト用スラッシュコマンドを追加する。","c":false,"e":["スラッシュコマンドは、定型の手順を人が明示的に起動したいときに便利な仕組みです。しかし毎回開発者に検索ツールを選ばせる運用では、Claudeが質問の内容から適切なツールを判断できない原因は残ったままで、選び間違いの責任を人に移しているだけです。"]},{"t":"対象のデータソースが分かる長い名前に各ツールを改名し、既存の説明文は変えずに残しておく。","c":false,"e":["サービス名などの接頭辞をツール名に付けるのは、ツールが増えたときに選択のあいまいさを減らす有効な手法です。本問ではツール名はすでに区別できており、判断材料となる説明文があいまいなまま残るため、名前を長くしても誤選択の原因を解消できません。"]},{"t":"リポジトリ検索が失敗するまではドキュメント検索ツールを使わないよう、CLAUDE.mdに指示を追加する。","c":false,"e":["CLAUDE.mdに優先順位を書くのは、チームの作業手順として既定の振る舞いを決めたいときには使えます。しかし「リポジトリ検索が失敗するまでドキュメント検索を使わない」という一律のルールでは、ポリシーページの質問でも先にリポジトリを探させることになり、質問の内容に応じた選択という目的と逆行します。"]}],"overall":["ツールの選び間違いが続くとき、最初に疑うべきはツール定義の説明文です。Claudeは各ツールの名前と説明、入力スキーマを手がかりに呼び出すツールを決めます。公式のツール定義ガイドは、何をするツールか、いつ使うべきでいつ使うべきでないか、各パラメータの意味、返さない情報などの注意点までを3〜4文以上で書くよう勧めています。","本問では名前がすでに異なり、どちらも検索型の質問を受け付けるため、説明文で守備範囲を切り分けていないことが誤選択の直接の原因です。","開発者に選ばせるコマンド、名前だけの変更、一律の優先ルールは、どれもClaudeの判断材料を良くしていません。","「まず何を変えるべきか」を問う問題では、症状の原因に最も近い箇所を直す選択肢を探すのが基本です。"],"ref":"https://platform.claude.com/docs/en/agents-and-tools/tool-use/define-tools"},{"n":27,"d":"ツール設計とMCP統合","stem":["あなたは、Claudeを使用して、通関用の出荷マニフェストから情報を抽出する構造化データ抽出システムを構築しています。このシステムは、非構造化文書から情報を抽出し、JSONスキーマを使用して出力を検証し、高い精度を維持します。エッジケースを適切に処理し、下流のシステムと連携する必要があります。","抽出バリデーターと下流提出用ツールは現在、is_errorをtrueに設定したtool_resultブロックを返しています。しかし、その内容は、次のどの場合でも常に\"Operation failed\"という同じ文字列です。","スキーマ検証の失敗","元データの形式不正","サービスのタイムアウト","権限拒否","ログを見ると、Claudeはリトライ不可能な失敗をリトライしたり、リトライ可能な失敗を一貫性なくエスカレーションしたりしています。"],"q":"復旧動作を最も改善する変更はどれですか。（2つ選択してください。）","need":2,"opts":[{"t":"ツールの説明文を拡張し、汎用的な失敗には多くの原因がありうることをClaudeに説明しておく。","c":false,"e":["ツールの説明文は、Claudeがツールを呼ぶ前に読む静的な情報で、入力の制約や注意点を伝える場所としては重要です。しかし実行時に返される内容が常に同じ\"Operation failed\"のままでは、個々の失敗がどの種類でリトライできるのかをClaudeは判別できません。"]},{"t":"失敗の分類とリトライ可否、具体的なメッセージと是正のヒントを構造化したtool_resultエラーを返す。","c":true,"e":["正解。失敗の分類、リトライの可否、具体的なメッセージ、是正のヒントを構造化してtool_resultのエラーとして返すと、Claudeは失敗ごとの性質を読み取り、リトライすべきか、入力を直すべきか、人へエスカレーションすべきかを一貫して判断できます。Anthropicのツール設計の指針も、エラー応答には具体的で実行可能な改善点を含めるよう勧めています。"]},{"t":"タイムアウトのようにリトライ可能と分類できる失敗だけをバックオフ付きでリトライし、他はエラーとして返す。","c":true,"e":["正解。リトライに意味があるのは、サービスのタイムアウトのように時間を置けば成功しうる一時的な失敗だけです。ツール側でリトライ可能と分類できる失敗に限ってバックオフ付きでリトライし、スキーマ違反や権限拒否のようなリトライしても変わらない失敗はエラーとしてClaudeに返せば、無駄なリトライを避けつつ復旧の判断を一貫させられます。"]},{"t":"失敗した抽出ツールの呼び出し結果を、下流の提出用スキーマを満たす空のJSONオブジェクトに置き換えて返す。","c":false,"e":["空のオブジェクトやデフォルト値を返すのは、値が無いことが正常な状態として許される項目なら成り立つ表現です。本問では抽出が実際に失敗しているため、スキーマを満たす空のJSONを返すと下流は正常なデータとして受け取り、エラーが隠されて問題が悪化します。"]}],"overall":["ツールのエラーをClaudeに返すとき、is_errorをtrueにするだけでは復旧の判断材料として不十分です。常に同じ\"Operation failed\"が返ってくると、Claudeはスキーマ違反、元データの形式不正、タイムアウト、権限拒否を区別できず、リトライしても無駄な失敗を繰り返したり、リトライで済む失敗を人に回したりします。Anthropicのツール設計の記事は、エラー応答を不透明なエラーコードではなく、具体的で実行可能な改善点を伝えるよう設計することを勧めています。","本問では、失敗の分類・リトライ可否・メッセージ・是正のヒントを構造化して返すことと、一時的な失敗だけをツール側でバックオフ付きでリトライし、それ以外はエラーとして返すことの2つが、復旧動作の一貫性を直接高めます。","説明文の拡張は実行時の応答を変えず、空のJSONへの置き換えは失敗を隠します。","失敗の種類ごとに次の行動が決まるかどうかが、エラー処理の良し悪しを分けます。"],"ref":"https://www.anthropic.com/engineering/writing-tools-for-agents"},{"n":28,"d":"エージェントアーキテクチャとオーケストレーション","stem":["インフラ構成のコード化（IaC）作業を支援するため、Messages APIの上に自作のオーケストレータを構築しています。オーケストレータは、サブエージェントに調査を委任するAgent相当のツールをClaudeが使えるようにしており、変更を提案する前に、ネットワークトポロジー、IAMポリシー、コスト見積もりを調査させます。","ログを見ると、この3つの調査は互いに独立しているにもかかわらず、メインスレッドは次の順に1つずつ処理しています。","ネットワークトポロジーのサブエージェントを起動し、その要約を待つ","IAMポリシーのサブエージェントを起動し、その要約を待つ","コスト見積もりのサブエージェントを起動する"],"q":"分析の範囲を変えずに、このツール呼び出しの逐次化を最も減らせる変更はどれですか。（2つ選択してください。）","need":2,"opts":[{"t":"1ターンに1つのAgent呼び出しを保ち、各サブエージェントの最終結果を待ってから次をbackground指定で起動する。","c":false,"e":["background指定は、サブエージェントを走らせたままメインの作業を続けたいときに使う実行方法です。しかし1ターンに1つずつ起動し、最終結果を待ってから次を起動する流れのままでは、backgroundを付けても3つの調査は順番にしか進まず、直列化は解消しません。"]},{"t":"各サブエージェントの要約を完了直後に個別のuserメッセージで返し、全部揃ってからメインスレッドを進める。","c":false,"e":["結果を受け取った順に処理を進める考え方は、非同期のジョブ管理では一般的です。しかしMessages APIでは、同じターンで発行されたtool_useの結果は1つのuserメッセージにまとめて返すのが正しい形で、公式ドキュメントも結果を別々のメッセージに分けるとClaudeが並列呼び出しを避けるようになると注意しています。"]},{"t":"独立したAgent呼び出しを1回のアシスタントターンでまとめて発行し、結果は次のuserメッセージでまとめて返す。","c":true,"e":["正解。互いに独立した3つの調査は、1回のアシスタントターンの中でAgent呼び出しを複数発行すれば並行して実行されます。対応するtool_resultを次のuserメッセージにまとめて返す形を保つことで、Claudeは並列呼び出しを続けやすくなり、分析の範囲を変えずに待ち時間の直列化を解消できます。"]},{"t":"tool_choiceのdisable_parallel_tool_useを既定値のfalseから変更しない。","c":true,"e":["正解。disable_parallel_tool_useはtool_choiceの中で指定するフィールドで、trueにするとClaudeは1回の応答で最大1つのツールしか呼ばなくなります。既定のfalseのままにしておくことが、1ターンで複数のAgent呼び出しを発行するための前提条件です。"]}],"overall":["Claudeは1回の応答で複数のツールを呼び出す並列ツール使用を既定で行えます。独立したサブタスクを並行して走らせたいなら、1回のアシスタントターンで複数のツール呼び出しを出させ、その結果を1つのuserメッセージにまとめて返す形を保つことが大切です。公式ドキュメントは、結果を別々のuserメッセージに分けると、Claudeに並列呼び出しを避けるよう「教えて」しまうと説明しています。また並列呼び出しは、tool_choiceのdisable_parallel_tool_useをtrueにすると無効になるため、既定のfalseのままにしておく必要があります。","本問のIaC調査は3つとも独立しているので、この2点を満たせば分析の範囲を変えずに直列化を解消できます。","1つずつ起動してbackground指定を付ける案と、結果を個別のメッセージで返す案は、どちらも逐次の待ち合わせを残します。","並列化の問題では、呼び出しの出し方と結果の返し方の両方を確認するのがコツです。"],"ref":"https://platform.claude.com/docs/en/agents-and-tools/tool-use/parallel-tool-use"},{"n":29,"d":"プロンプトエンジニアリングと構造化出力","stem":["ある開発チームが、Claude Codeの/reviewコマンドを運用しています。このコマンドには詳細なレビュー基準と固定の出力テンプレートがありますが、見慣れないリファクタリングに対しては挙動が一貫しません。具体的には、次のことが起きています。","無害なローカルの慣習を、欠陥として誤って指摘することがある","チェックリストの例とは異なる実際の欠陥を、見逃すことがある"],"q":"次に取るべきプロンプトの変更として、最も適切なものはどれですか。","need":1,"opts":[{"t":"これまでに見られたすべてのパターンを列挙する大きなチェックリストを追加し、完全一致した場合にのみ報告するよう指示する。","c":false,"e":["チェックリストを網羅的にするのは、既知の不具合パターンを確実に拾いたい用途では有効です。しかし完全一致したときだけ報告させると、チェックリストの例と表現が違うだけの実際の欠陥を見逃すという、まさに今起きている失敗を強めてしまいます。"]},{"t":"問題あり・問題なしの両方の事例を、判断の境界を示す簡潔な理由付きで多様に示すfew-shotの例を追加する。","c":true,"e":["正解。公式のプロンプトガイドは、例示を出力の形式や判断を安定させる最も確実な手段の1つとし、実際の用途に近く、エッジケースを含めて多様な例を3〜5個示すよう勧めています。問題あり・問題なしの両方を、境界を示す短い理由とともに見せると、Claudeは見た目のパターンではなく判断基準そのものを一般化できます。"]},{"t":"直近の1件のリファクタリングから抜き出した複数の例を追加し、その表現や重大度ラベルをそのままコピーするよう指示する。","c":false,"e":["直近の実例から例を取るのは、用途に近い例を用意するという点では理にかなっています。しかし1件のリファクタリングだけから集めた例は多様性がなく、表現や重大度ラベルまで写させると、Claudeはその表面的なパターンに引きずられ、見慣れない変更への判断はかえって不安定になります。"]},{"t":"例を示さず、レビュー担当は保守的であるべきだと述べるCLAUDE.mdのルールを追加する。","c":false,"e":["「保守的に」という方針は、誤検知を減らしたいときの大まかな方向づけにはなります。ただし何を指摘し何を見逃してよいかの基準が示されないため、無害な慣習の誤検知と実際の欠陥の見逃しという両方向のぶれは解消しません。例を示さないことで偏りを避けるという発想も、境界のあいまいさを残したままです。"]}],"overall":["詳細な基準と固定テンプレートがあるのに判断がぶれるのは、基準の文章だけでは「どこからが問題か」という境界がモデルに伝わっていないためです。こうした場面で効くのがfew-shot（multishot）プロンプトで、Anthropicのガイドは例を関連性があり多様で構造化されたものにし、3〜5個を目安に示すよう勧めています。","本問の失敗は、無害な慣習を欠陥と誤判定する方向と、例と違う形の欠陥を見逃す方向の両方に出ています。したがって「問題あり」と「問題なし」の両側の例を、判断理由とともに示す必要があります。","1件のリファクタリングから写させる例は多様性を欠き、抽象的な方針や完全一致のチェックリストは境界そのものを示しません。","誤検知と見逃しが同時に起きているなら、両側の例を含む選択肢が最有力です。"],"ref":"https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices"},{"n":30,"d":"コンテキスト管理と信頼性","stem":["あなたは、コンプライアンス担当者が保険金請求ファイルを数週間かけて監査する作業を支援するエージェントを構築しています。このエージェントは、組み込みツール（Read、Write、Bash、Grep、Glob）を使用し、Model Context Protocol（MCP）サーバーとも連携します。","レガシーな請求処理システムを1か月にわたって調査する過程で、エージェントが生成する経過サマリーの中の正確な数値・条件が、次のようにあいまいな表現に置き換わっていってしまいます。","「エスカレーション基準額は3000ドル」→「そこそこの基準額」","「応答SLAは99.95%」→「高い可用性」","「契約更新の締切は2026年6月30日」→「近い将来の締切」","「契約上、期中の保険料変更は行わない」→「安定した保険料」"],"q":"後続の作業で誤った修正が行われるリスクを減らすために、行うべき変更はどれですか。（2つ選択してください。）","need":2,"opts":[{"t":"サマリーでは数値や日付、契約条件を言い換えず、原文のまま残すことを必須にする。","c":true,"e":["正解。要約は言い換えによって情報を圧縮するため、基準額3,000ドルが「そこそこの基準額」に変わるような劣化が、繰り返しの要約で積み重なります。数値や日付、契約条件は言い換え禁止の項目として原文のまま運ぶよう要約の要件に明記すれば、要約そのものがあいまい化の原因になることを防げます。"]},{"t":"大まかな意図を優先してサマリーを書き直させ、エージェントが追跡すべき細部を減らす。","c":false,"e":["大まかな意図を残す要約は、議論の流れや方針をつかむための概要としては役立ちます。しかし後続の修正で必要になるのは基準額や締切の正確な値で、それを意図的に捨てれば、誤った後続の編集が起きるリスクをむしろ高めてしまいます。"]},{"t":"生のツール出力をコンテキストに多めに残し、ウィンドウがほぼ埋まってから要約させる。","c":false,"e":["要約を遅らせると、しばらくの間は生の出力をそのまま参照できます。しかしいずれ要約は発生し、その時点で同じあいまい化が起こるうえ、コンテキストが埋まるほど前半の情報を正確に思い出しにくくなる（コンテキストの劣化）ため、問題を先送りするだけです。"]},{"t":"圧縮される会話履歴とは別に、正確な事実を記録する構造化スクラッチパッドを維持して更新する。","c":true,"e":["正解。圧縮される会話履歴とは別の構造化されたスクラッチパッドに正確な事実を保持し、事実が変わったときだけそこを更新すれば、何度コンパクションが走っても基準額やSLA、締切の値はそのまま残ります。Anthropicが構造化されたメモと呼ぶ、コンテキストの外に事実を置く手法です。"]}],"overall":["長期のエージェント作業では、要約（コンパクション）を繰り返すうちに正確な値が少しずつ丸められていく現象が起きます。Anthropicのコンテキストエンジニアリングの解説は、コンパクションの難しさを「何を残し何を捨てるかの選択」にあるとし、過度な圧縮は後から重要と分かる細部を失わせると指摘しています。そのうえで、エージェントがコンテキストの外にメモを残して必要なときに読み戻す構造化メモの手法を紹介しています。","本問の対策は、要約の段階で数値や条件を原文のまま運ばせることと、要約の対象にならないスクラッチパッドに事実を保持することの2つで、前者は劣化の発生源を抑え、後者は劣化の影響を受けない保管場所を作ります。","意図を優先する要約は劣化を意図的に進め、要約を遅らせる案は先送りにすぎません。","事実と解釈を分けて保存できているかどうかが、2つの正解に共通する特徴です。"],"ref":"https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents"},{"n":31,"d":"ツール設計とMCP統合","stem":["あるオンライン学習プラットフォームの開発チームは、アプリケーションのエラーログからサポートチケットを自動作成する独自のMCPツールを、Claude Codeに追加しました。","サポートチケット発行サービスが不正な形式のコースIDを拒否した場合、アダプタ（MCPサーバー）はこの失敗をツール結果としてClaudeに返し、Claudeが状況を把握して復旧できるようにする必要があります。"],"q":"アダプタが返す内容として適切なものはどれですか。（2つ選択してください。）","need":2,"opts":[{"t":"isError: trueを付け、チケットが作成されていないことと候補のコースIDを含むJSONをcontentに入れて返す。","c":true,"e":["正解。ツール結果のisErrorをtrueにすると、Claudeはこの呼び出しが失敗したことをエラーとして受け取ります。そのうえでcontentに「チケットは作成されていない」ことと候補のコースIDを構造化して返せば、Claudeは作成済みと誤認せず、候補から正しいIDを選び直して再実行するという具体的な復旧行動を取れます。"]},{"t":"isError: trueを付け、エラー分類とリトライ可否、正しいID形式の例を含むJSONをcontentに入れて返す。","c":true,"e":["正解。エラー分類とリトライ可否を返すと、Claudeは「同じ引数で繰り返しても解決しない入力エラーだ」と判断でき、正しいID形式の例を手がかりに引数を直して再送できます。Anthropicのツール設計の指針も、エラー応答は不透明なエラーコードではなく、次に取るべき具体的な修正が分かる内容にするよう勧めています。"]},{"t":"isError: trueを付け、「操作に失敗しました。しばらくしてからリトライしてください。」という汎用の文字列をcontentに入れて返す。","c":false,"e":["isErrorをtrueにして失敗を伝えること自体は正しく、一時的なエラーで時間を置けば通る場面なら汎用の文言でも用は足ります。しかし本問の失敗原因はコースIDの形式不正で、待ってリトライしても結果は変わりません。原因も正しい形式も含まない文字列では、Claudeは同じ引数でのリトライを繰り返しがちです。"]},{"t":"ツール呼び出しを未捕捉の例外で終了させ、チケット発行サービスの応答内容はClaude Codeのデバッグログで確認する。","c":false,"e":["例外の記録やデバッグログは、開発者が障害を事後に調べる手段としては有用です。しかしClaudeが会話の中で受け取れるのはツール結果の内容だけで、ログに残した応答本文は届きません。失敗の理由がモデルに渡らないため、状況を把握して復旧するという要件を満たせません。"]}],"overall":["MCPのツールが実行時に失敗したときは、ツール結果（CallToolResult）のisErrorをtrueにして失敗であることを示します。MCPの仕様は、こうしたツール実行エラーにはモデルが自分で直してリトライできる情報を含め、クライアントはそれをモデルに渡すべきだとしています。Claudeが復旧できるかどうかは、そのcontentに何が書かれているかで決まります。Anthropicのツール設計の指針でも、エラー応答はエラーコードやスタックトレースではなく、具体的で実行可能な改善点を伝えるよう設計することが勧められています。","本問の失敗原因は「コースIDの形式不正」という入力側の問題なので、チケットが作られていないことと選び直せる候補IDを返しても、エラー分類・リトライ可否・正しい形式を返しても、Claudeは次の一手を決められます。","汎用メッセージはエラーであることしか伝えず、例外やログへの委任はそもそもClaudeに情報が届きません。","迷ったときは「Claudeがこの応答だけを読んで次の引数を決められるか」を基準に選択肢を見ると判断しやすくなります。"],"ref":"https://modelcontextprotocol.io/specification/2026-07-28/server/tools"},{"n":32,"d":"コンテキスト管理と信頼性","stem":["あなたは、Claude Agent SDKを使用して、特許の先行技術調査を行うマルチエージェントシステムを構築しています。コーディネーターエージェントが、専門化されたサブエージェントに作業を委任します。サブエージェントには、特許データベースを検索するもの、先行技術文書を解析するもの、調査結果を統合するもの、新規性レポートを生成するものがあります。","テスト中、文書解析サブエージェントが、抽出した複数のレコードにクレーム（請求項）の要約が欠けているという理由で、検証に繰り返し失敗しています。ログを確認すると、これらの特許についてサブエージェントには要約ページしか渡されていませんでした。クレームのセクションは別ファイルにあり、そもそもサブエージェントに提供されていなかったことが分かりました。"],"q":"チームが最初に変更すべきことはどれですか。","need":1,"opts":[{"t":"検証エラーを添えて、すべてのクレーム要約フィールドが埋まるまで同じ抽出をリトライする。","c":false,"e":["検証エラーをフィードバックしてリトライするのは、モデルが元の文書を読み違えたり形式を誤ったりした場合には効果的な復旧手段です。しかしクレームのセクションは一度もコンテキストに入っていないため、何度リトライしても正しい内容は現れず、フィールドを埋めようとして捏造が起きるリスクだけが高まります。"]},{"t":"抽出ツールでstrictなツール使用を有効にし、ツール呼び出しの際に欠けているクレームの内容を復元できるようにする。","c":false,"e":["strictなツール使用は、ツールの入力がスキーマの型や必須項目に確実に従うようにする機能です。構造を保証することはできても、コンテキストに存在しない情報を生み出すことはできず、むしろ必須フィールドを埋めるために根拠の無い値が入る危険があります。"]},{"t":"クレーム要約のfew-shot例を追加し、サブエージェントが欠けているセクションを一貫して推測できるようにする。","c":false,"e":["few-shot例は、形式や判断の基準をそろえたいときに有効な手法です。しかし例をいくら示しても、特定の特許のクレーム内容そのものがサブエージェントに与えられるわけではなく、「一貫して推測させる」ことは先行技術調査で許されない内容の捏造を体系化するだけです。"]},{"t":"欠けているクレームの情報源を提供し、根拠となる情報がコンテキストに無い場合は「利用不可」の値を許容するようにする。","c":true,"e":["正解。ログが示す原因は、クレームのセクションを含むファイルがサブエージェントに渡っていないという入力の欠落です。まず欠けている情報源を提供し、それでも根拠となる文書がコンテキストに無い場合は「利用不可」を許容しておけば、モデルが空欄を埋めるために内容を作り出すことを防げます。公式ドキュメントも、情報が足りないときは分からないと答えてよいと明示することを、ハルシネーションを減らす基本策に挙げています。"]}],"overall":["検証の失敗が続くとき、プロンプトやスキーマに手を入れる前に、モデルが正しく答えるための情報をそもそも持っているかを確かめる必要があります。","本問のログは、サブエージェントには要約ページしか渡っておらず、クレームのセクションは別ファイルにあって一度も提供されていないことを示しています。これは推論の問題ではなく入力の問題です。","Anthropicのハルシネーション対策のガイドは、情報が足りないときにClaudeが「分からない」と答えることを明示的に許すことを基本策の1つに挙げています。したがって、欠けている情報源を提供したうえで、それでも根拠が無い場合は「利用不可」を許すのが最初の変更になります。","リトライ、strictなツール使用、few-shot例は、どれも存在しない情報をモデルに埋めさせる方向に働きます。","失敗の原因が入力側にあるのか出力側にあるのかを見分けることが、この種の問題を解く出発点です。"],"ref":"https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/reduce-hallucinations"},{"n":33,"d":"コンテキスト管理と信頼性","stem":["Claudeを使用して、構造化データ抽出システムを構築しています。このシステムは、非構造化文書から情報を抽出し、JSONスキーマを使用して出力を検証し、高い精度を維持します。エッジケースを適切に処理し、下流のシステムと連携する必要があります。","評価中、記載されたコンテナ総数と明細行の合計が食い違う出荷マニフェストが、レビュー段階をすり抜けてしまうことがよくあります。","現在のフローでは、まずClaudeにJSONを抽出させます。その後、同じ会話の中で、「アプリケーションがスキーマ検証を実行する前に、直前の抽出結果を確認してください」というフォローアップのプロンプトを続けて送っています。"],"q":"検証ステップ自体は維持しつつ、このレビューの見落としに最も効果的に対処できる変更はどれですか。","need":1,"opts":[{"t":"抽出結果を合成のアシスタントメッセージとして会話に挿入し、Claudeにそれをスキーマと照合して監査するよう求める。","c":false,"e":["過去の出力をassistantメッセージとして会話に入れるのは、会話履歴を再構成するときに使われる手法です。しかし形を変えても同じ会話の中で自分の出力を評価する構造は変わらず、独立した視点での確認にはなりません。"]},{"t":"元の文書、抽出されたJSON、明示的な不整合判定基準を受け取る独立したレビューリクエストを別途実行する。","c":true,"e":["正解。抽出を行った会話の続きで確認させると、モデルは直前の自分の出力を前提に読んでしまい、同じ見落としを繰り返しやすくなります。元の文書・抽出結果・明示的な不整合の判定基準だけを受け取る独立したレビューリクエストにすれば、先入観の無い状態で基準に沿って照合でき、コンテナ総数と明細合計の食い違いを検出しやすくなります。後段のスキーマ検証はそのまま残せます。"]},{"t":"検証の前にClaudeへ、自分の直前の抽出結果に懐疑的になるよう求めるフォローアップのプロンプトを追加する。","c":false,"e":["自分の出力を疑うよう促すのは、単発の応答を見直させる軽い工夫としては使われることがあります。しかし同じ会話の中では直前の抽出結果が文脈として強く働き、何を不整合とみなすかの基準も示されていないため、見落としの原因はそのまま残ります。"]},{"t":"スキーマ検証を実行する前に、抽出した各フィールドに確信度の値を含めることを必須にする。","c":false,"e":["フィールドごとの確信度は、人のレビューに回す候補を絞る補助情報として使われることがあります。しかしモデルの自己申告はキャリブレーションされておらず、元の文書と数値を照合する処理でもないため、記載された総数と明細合計の食い違いを直接検出する仕組みにはなりません。"]}],"overall":["生成と検証を同じ会話の中で行うと、検証が甘くなりがちです。Anthropicのプロンプトガイドは、複雑なタスクを別々のAPI呼び出しに分けるプロンプトチェイニングの代表例として、下書きを生成し、基準に照らしてレビューし、その結果で修正するという自己修正の流れを挙げ、各段を別の呼び出しにすることで記録・評価・分岐ができると説明しています。Claude Codeのベストプラクティスも、新しいコンテキストでのレビューは直前の成果物への偏りが無いため質が上がるとしています。","本問では、元の文書・抽出結果・判定基準を独立したレビューリクエストに渡すことで、同じ会話での自己確認という見落としの原因を取り除けます。","懐疑的になるよう促す案や合成メッセージを挿入する案は同じ文脈の中にとどまり、確信度の追加は照合の仕組みではありません。","誰がどんな前提を持って確認しているかが、レビューの質を左右します。"],"ref":"https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices"},{"n":34,"d":"Claude Codeの設定とワークフロー","stem":["あるゲームスタジオの開発者ツールチームは、Claude Agent SDKを使用して開発者の生産性向上ツールを構築しています。このエージェントは、エンジニアが不慣れなコードベースを探索し、レガシーシステムを理解し、ボイラープレートコードを生成し、反復的なタスクを自動化するのを支援します。組み込みツール（Read、Write、Bash、Grep、Glob）を使用し、MCPサーバーとも連携します。","このチームは、変更されたファイルをレビューしてインラインで提案コメントを投稿するCIコマンドを、追加しようとしています。要件は次のとおりです。","PRボットは、file・line・severity・messageのフィールドを持つアプリケーションスキーマに一致するJSONオブジェクトを受け取る","Claudeが有効なデータを生成できない場合は、コメントを投稿せずに失敗させる","経費計算のための実行メタデータも取得する"],"q":"採用すべき実装はどれですか。（2つ選択してください。）","need":2,"opts":[{"t":"Claude Codeを既定のテキスト出力で実行し、スキーマに沿ったJSONだけを返すようプロンプトで指示する。","c":false,"e":["テキスト出力とプロンプトでの指示は、人が読む要約や、形式が多少ぶれても困らない用途なら手軽な方法です。しかし出力がスキーマに合っているかをClaude Code側で検証する仕組みがないため、有効なデータを作れなかったときに失敗させるというPRボットの要件を機械的に保証できません。"]},{"t":"Claude Codeを-pと--output-format jsonで実行し、結果のJSONに含まれるコストや所要時間を経費計算に使う。","c":true,"e":["正解。--output-format jsonの出力には、テキストの結果に加えてセッションIDや使用量、total_cost_usdなどのメタデータが含まれます。経費計算に必要なコストや所要時間はこの結果のJSONから取得でき、レビュー内容の検証とは別の要件として満たせます。"]},{"t":"Claude Codeを-pと--output-format jsonに--json-schemaを加えて実行し、structured_outputを読み取る。","c":true,"e":["正解。--output-format jsonと--json-schemaを組み合わせると、Claude Codeは応答をJSON Schemaに適合させ、結果JSONのstructured_outputフィールドに構造化データを入れて返します。","PRボットはこのフィールドだけを読めばよく、structured_outputが得られない実行を失敗として扱えば、無効なデータでコメントを投稿することを防げます。"]},{"t":"Claude Codeを-pと--output-format stream-jsonで実行し、流れてくる各イベントをレビュー結果として検証する。","c":false,"e":["stream-jsonは実行中のイベントを1行ずつ流す形式で、進捗表示やリアルタイムのUI更新に向いています。個々のイベントはツール呼び出しや途中のメッセージであってレビュー結果のオブジェクトではないため、各イベントをスキーマで検証しても最終的な指摘データの妥当性は確かめられません。"]}],"overall":["CIでClaude Codeを動かすときは、-p（--print）による非対話実行と--output-formatの選び方が設計の中心になります。textは既定のプレーンテキスト、jsonは結果とセッションIDやコストなどのメタデータをまとめたJSON、stream-jsonは実行中のイベントを逐次流す形式です。さらに--json-schemaを付けると、スキーマに適合した構造化データが結果JSONのstructured_outputフィールドに入ります。","本問には「file・line・severity・messageを持つスキーマ準拠のデータ」と「経費計算用の実行メタデータ」という独立した2つの要件があり、前者は--json-schema、後者はjson出力のメタデータがそれぞれ担います。","プロンプトの指示だけに頼る案は検証の仕組みを持たず、stream-jsonのイベントはレビュー結果そのものではありません。","要件を「中身の形式」と「実行の記録」に分けると、2つの正解がそれぞれ別の要件を担っていることが見えてきます。"],"ref":"https://code.claude.com/docs/en/headless"},{"n":35,"d":"ツール設計とMCP統合","stem":["ある旅行予約プラットフォームのエンジニアリングチームは、社内オペレーター向けの支援エージェントをMessages APIで構築しています。アプリケーションは自前のMCPクライアントで、予約・決済・在庫・顧客管理・チケット管理・監視の6つのMCPサーバーに接続し、取得した約220個のツール定義をすべてtoolsに渡しています。","オペレーターの依頼がどの業務領域にまたがるかは事前に分からないため、1つの会話からどのツールも使える状態を保つ必要があります。","最近の計測で、次のことが分かりました。","作業を始める前から、ツール定義だけで約6万トークンを消費している","名前の似たツールを取り違える呼び出しが増えている"],"q":"このチームが行うべき変更はどれですか。","need":1,"opts":[{"t":"ツール検索ツールをtoolsに加え、よく使う数個を除くツール定義にdefer_loading: trueを付ける。","c":true,"e":["正解。ツール検索ツールを使うと、最初のコンテキストには検索ツールとdefer_loadingを付けていない少数のツールだけが載り、Claudeは必要になった時点で検索して該当する数個の定義だけを読み込みます。すべての定義はtoolsに渡したままなので、どの領域の依頼にも対応でき、定義による消費と候補の多さによる取り違えを同時に抑えられます。"]},{"t":"各ツールのdescriptionを1行程度に短くし、ツール定義全体のトークン数を削減する。","c":false,"e":["説明文を短くすればトークン数は減りますが、公式ドキュメントはツールの目的や使いどころを詳しく書くことを、選択の精度を支える要素として推奨しています。名前の似たツールを見分ける手がかりが減るため取り違えはむしろ増えやすく、220個の定義が常にコンテキストに並ぶ状況も変わりません。"]},{"t":"tool_choiceを{\"type\": \"any\"}に設定し、各ターンでいずれかのツールを呼び出させる。","c":false,"e":["tool_choiceのanyは、構造化データの抽出のように毎ターンいずれかのツールを使わせたい場面で使う設定です。本問の問題は多すぎる候補の中からどれを選ぶかであり、呼び出しを強制しても候補は絞られず、ツールが不要な依頼にもテキストだけで答えられなくなります。"]},{"t":"toolsの最後の定義にcache_controlを付け、すべてのツール定義をプロンプトキャッシュの対象にする。","c":false,"e":["プロンプトキャッシュは、毎回同じツール定義やシステムプロンプトを送るときの料金とレイテンシを下げる手段で、長い固定のプレフィックスを持つ構成では有効です。ただしキャッシュされた定義もコンテキストウィンドウには載ったままなので、約6万トークンの占有は変わらず、220個の候補から選ぶことによる取り違えも減りません。"]}],"overall":["扱うツールが数十個を超えると、ツール定義そのものがコンテキストを圧迫し、選択の精度も落ちていきます。公式ドキュメントは、複数のMCPサーバーを束ねた構成では定義だけで数万トークンを消費し得ること、利用可能なツールが30〜50個を超えるとClaudeが正しいツールを選ぶ能力が下がることを挙げ、その対策としてツール検索ツールを案内しています。defer_loadingをtrueにした定義は検索で見つかったときだけコンテキストに展開され、よく使う3〜5個には付けずに残しておくのが推奨です。","本問には1つの会話で全ツールを使える状態を保つという条件があるため、ツールを会話ごとに分けたり削ったりするのではなく、読み込みを必要な時点まで遅らせる方法が適します。","キャッシュは料金とレイテンシ、tool_choiceは呼び出すかどうか、説明文の短縮はトークン数だけに作用し、いずれも「占有」と「取り違え」の両方には効きません。","ツールが増え続ける構成では、すべてを最初から見せるという前提を見直せるかどうかが設計の分かれ目です。"],"ref":"https://platform.claude.com/docs/en/agents-and-tools/tool-use/tool-search-tool"},{"n":36,"d":"エージェントアーキテクチャとオーケストレーション","stem":["あなたは、Claude Agent SDKを使用して、財務監査レポートを分析するマルチエージェントシステムを構築しています。コーディネーターエージェントが、専門化されたサブエージェントに作業を委任します。サブエージェントには、規制当局への提出書類を検索するもの、財務諸表を解析するもの、開示情報を突き合わせるもの、監査所見のレポートを作成するものがあります。","長時間のデバッグセッションの中で、財務諸表解析やクロスリファレンスの出力段階では存在していた引用情報が、最終レポートでは失われてしまうことがあります。","チームは、次のような具体的な疑問をClaude Codeに調査させたいと考えています。","引用情報はどこに保存されているか","統合処理のどこで書き換えが起きているか","レポート生成をどのテストがカバーしているか","その際、メインの会話は、生の検索ログやファイル内容ではなく、調整作業に集中させておきたいと考えています。"],"q":"この目的に最も適した作業フローはどれですか。","need":1,"opts":[{"t":"汎用（general-purpose）サブエージェントに、引用消失の原因を調査させながらレポート生成コードの修正も行わせる。","c":false,"e":["調査と修正を1つのサブエージェントに任せるのは、原因が明らかで直す範囲も決まっている場合には効率的です。本問はまだ引用が失われる原因が分かっていない段階で、調査の途中でレポート生成のコードを書き換えると、原因の切り分けがかえって難しくなります。"]},{"t":"焦点を絞った読み取り専用の調査をサブエージェントに委任し、返された要約をメインの会話で活用する。","c":true,"e":["正解。引用の保存場所、統合処理での書き換え箇所、レポート生成のテストという個別の疑問ごとに読み取り専用の調査をサブエージェントへ任せれば、検索ログやファイル内容はサブエージェントのコンテキストに留まり、メインの会話には要約だけが戻ります。読み取り専用にしておくことで、原因の特定前にコードが変わってしまう心配もありません。"]},{"t":"調査ごとに独立したClaude Codeセッションを実行し、その完全なトランスクリプトをメインの会話に貼り付ける。","c":false,"e":["独立したセッションで調べること自体は、メインの会話を汚さないという点で理にかなっています。しかしその完全なトランスクリプトをメインに貼り付ければ分離した意味がなくなり、結局メインの会話が生の検索ログで埋め尽くされてしまいます。"]},{"t":"メインの会話に関連するすべてのファイルを直接調べさせ、各フェーズの後に会話をコンパクト化する。","c":false,"e":["メインの会話で直接ファイルを調べるのは、対象が数ファイルに限られる小さな確認なら手早い方法です。本問のように複数の疑問を調べる長いデバッグでは、フェーズごとに圧縮するまでの間メインが生の出力で埋まり続け、圧縮の際に必要な細部も失われやすくなります。"]}],"overall":["デバッグの調査をどこで行うかは、メインの会話のコンテキストをどう守るかという問題でもあります。Claude Codeのサブエージェントは独立したコンテキストで作業し、途中の検索結果やファイルの中身は内部に留まり、最終的な要約だけが呼び出し元に戻ります。組み込みのExploreのように読み取り専用のツールだけを持たせることもでき、調べるだけの作業を安全に切り出せます。","本問でチームが知りたいのは、引用の保存場所、統合での書き換え箇所、レポート生成のテスト範囲という複数の具体的な疑問で、メインの会話はその結果をもとに調整に集中したいという条件があります。疑問ごとに焦点を絞った読み取り専用の調査を委任し、戻ってきた要約を使う案がこれに合致します。","メインで直接調べる案やトランスクリプトを貼る案は生の出力をメインに持ち込み、調査と修正を同時に行う案は原因の特定前に変更を加えてしまいます。","調査と変更の段階を分けられているかも、選択肢を評価する手がかりになります。"],"ref":"https://code.claude.com/docs/en/sub-agents"},{"n":37,"d":"ツール設計とMCP統合","stem":["あるチームは、Claude Agent SDKを使用して、複数のサブエージェントを統括するマルチエージェントの調査システムを構築しています。コーディネーターエージェントは、専門化されたサブエージェント（Web検索担当、資料分析担当、知見の統合担当、レポート生成担当）に作業を委任します。このシステムはトピックを調査し、出典を明記した包括的なレポートを作成します。","カスタムのMCPサーバーが、複数のサブエージェントが調査中に必要とする出典データベースと資料カタログを公開しています。あるメンバーが、自分のノートPC上でClaude CodeのMCPコマンドを既定のまま使ってこのサーバーを追加しました。しかし、他のメンバーがリポジトリをクローンしても、そのサーバーは見えません。","また、チームとしては、認証情報をソース管理にコミットしたくないと考えています。"],"q":"このチームが取るべき行動はどれですか。（2つ選択してください。）","need":2,"opts":[{"t":"サーバーの認証情報は各メンバーがローカルで設定する環境変数に保持し、必要な環境変数名をオンボーディングガイドに記載する。","c":true,"e":["正解。認証情報の実体を各メンバーが自分の環境で設定する環境変数に置けば、ソース管理には入りません。.mcp.jsonが参照する変数名をオンボーディングガイドに記しておけば、クローンしたメンバーが迷わず設定を完了でき、共有された設定がそのまま動きます。"]},{"t":"サーバーを--scope projectで追加し直し、環境変数のプレースホルダーを使って生成された.mcp.jsonをコミットする。","c":true,"e":["正解。--scope projectで追加すると、サーバーの設定はプロジェクトルートの.mcp.jsonに書き出され、コミットすればリポジトリをクローンしたメンバー全員が同じ設定を得られます。.mcp.jsonは${VAR}形式の環境変数の展開に対応しているため、認証情報はプレースホルダーとして書き、実際の値はファイルに含めずに済みます。"]},{"t":"サーバーを--scope userで追加し直し、各メンバーが自分の~/.claude.jsonに個別に設定し直すようにする。","c":false,"e":["--scope userは、自分が関わるすべてのプロジェクトで同じMCPサーバーを使いたいときの個人用のスコープで、設定は~/.claude.jsonに保存されます。リポジトリには何も含まれないため、クローンしたメンバーに自動で共有されることはなく、各自が手作業で設定し直す必要が残ります。"]},{"t":"最初のメンバーの~/.claude.jsonをリポジトリにチェックインし、他のメンバーにそのファイルを再利用させる。","c":false,"e":["~/.claude.jsonは、既定のlocalスコープやuserスコープのMCP設定などを保持する個人用の設定ファイルです。そのままリポジトリに入れると、他のプロジェクトの設定や認証情報まで公開されるおそれがあり、認証情報をコミットしないという要件に反します。"]}],"overall":["Claude CodeのMCPサーバーには、local・project・userの3つのスコープがあります。既定のlocalスコープは~/.claude.jsonの中に現在のプロジェクト用として保存され、本人にしか見えません。userスコープも~/.claude.jsonに保存され、本人の全プロジェクトで使えます。チームで共有したい場合はprojectスコープを使い、プロジェクトルートの.mcp.jsonをソース管理に入れます。","本問のメンバーは既定のコマンドでサーバーを追加したため、設定がlocalスコープに入り、他のメンバーには見えていません。projectスコープで追加し直して.mcp.jsonをコミットし、認証情報は${VAR}形式の環境変数で参照して、実際の値は各メンバーがローカルの環境変数に設定する、という組み合わせが共有と秘密の保護を両立します。","userスコープへの変更は共有に
