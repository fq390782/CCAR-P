ならず、個人の~/.claude.jsonをコミットする案は認証情報を漏らしかねません。","MCPの設定問題では、そのスコープの設定がどのファイルに保存されるかを押さえておくと迷いません。"],"ref":"https://code.claude.com/docs/en/mcp"},{"n":38,"d":"Claude Codeの設定とワークフロー","stem":["あるフィンテック企業のプラットフォームエンジニアリングチームは、Claude Agent SDKを使用して社内向けの開発者の生産性向上ツールを構築しています。このエージェントは、エンジニアが不慣れなコードベースを探索し、レガシーシステムを理解し、ボイラープレートコードを生成し、反復的なタスクを自動化するのを支援します。組み込みツール（Read、Write、Bash、Grep、Glob）を使用し、MCPサーバーとも連携します。","このチームは、Claude Code GitHub Actionsを使ったプルリクエストレビューのジョブを追加しようとしています。初期のレビューでは、リポジトリのテスト方針、フィクスチャの命名規則、スタイルに関する指摘を報告すべき基準が無視されています。","このガイダンスは、開発者間で共有され、かつCI実行中のClaude Codeからも参照できる状態にする必要があります。"],"q":"このチームが取るべき行動はどれですか。（2つ選択してください。）","need":2,"opts":[{"t":"各CIランナーのイメージに、同じガイダンスを入れた~/.claude/CLAUDE.mdを配置しておく。","c":false,"e":["ランナーのホームディレクトリに設定を置くのは、特定のマシンだけに個人設定を適用したいときの方法です。ユーザーレベルのCLAUDE.mdはリポジトリの外にあるためバージョン管理もレビューもされず、ランナーのイメージ構成に依存して壊れやすく、開発者との共有という要件も満たせません。"]},{"t":"フィクスチャの命名規則を書いたCLAUDE.mdをtestsディレクトリにコミットし、その配下の作業で読ませる。","c":true,"e":["正解。サブディレクトリのCLAUDE.mdもリポジトリにコミットされるため開発者間で共有・レビューでき、Claudeがそのディレクトリのファイルを読んだときに読み込まれます。フィクスチャの命名規則のように適用範囲が限られる規約をtestsディレクトリに置けば、ルートのCLAUDE.mdを膨らませずに必要な場面で参照させられます。"]},{"t":"ガイダンスをワークフローのclaude_argsに書き、--append-system-promptでシステムプロンプトに追加する。","c":false,"e":["claude_argsで--append-system-promptを渡すのは、特定のワークフローだけに追加の指示を与えたいときに便利な方法です。しかしガイダンスがワークフロー定義の中に閉じてしまい、開発者がローカルのClaude Codeで同じ規約を参照・レビューする共有の文書にはなりません。"]},{"t":"テスト方針とフィクスチャの命名規則、レビュー基準を書いたCLAUDE.mdをリポジトリのルートにコミットする。","c":true,"e":["正解。リポジトリのルートにコミットしたCLAUDE.mdは、ソース管理を通じて開発者全員が読み・レビューし・編集でき、Claude Codeはセッションの開始時にこれを読み込みます。","Claude Code GitHub Actionsの公式ドキュメントも、コードスタイルやレビュー基準、プロジェクト固有のルールをルートのCLAUDE.mdに定義するよう案内しており、CIの実行でも同じガイダンスが参照されます。"]}],"overall":["チームで共有し、CIのClaude Codeにも読ませたいガイダンスは、リポジトリにコミットするCLAUDE.mdに置くのが基本です。Claude Codeの公式ドキュメントによると、プロジェクトルートのCLAUDE.mdはソース管理を通じてチームに共有され、セッションの開始時に読み込まれます。サブディレクトリのCLAUDE.mdは、Claudeがそのディレクトリのファイルを読んだ時点で追加されます。GitHub Actionsのガイドも、コードスタイルやレビュー基準をルートのCLAUDE.mdに定義し、簡潔に保つよう勧めています。","本問では、テスト方針とレビュー基準をルートのCLAUDE.mdに、フィクスチャの命名規則をtestsディレクトリのCLAUDE.mdに置くことで、開発者との共有とCIでの参照を同時に満たせます。","claude_argsでシステムプロンプトに足す方法はワークフローの中に閉じ、ランナーの~/.claude/CLAUDE.mdはリポジトリの外にあります。","「共有」と「CIからの参照」の両方が求められたら、両者が同じファイルを読む構成になっているかを確かめましょう。"],"ref":"https://code.claude.com/docs/en/github-actions"},{"n":39,"d":"Claude Codeの設定とワークフロー","stem":["あなたは、IoTデバイスのファームウェア開発を加速するためにClaude Codeを使用しています。チームでは、コード生成、リファクタリング、デバッグ、ドキュメント作成にClaude Codeを使っています。カスタムスラッシュコマンドやCLAUDE.mdの設定を用いて開発ワークフローに統合し、プランモードと直接実行をどのように使い分けるかを理解する必要があります。","ある新人開発者から、Claude Codeがリポジトリのコーディングスタイルと単体テストの規約を適用してくれない、という報告がありました。シニアエンジニアは自分のマシンでは規約どおりの動作を再現できますが、新人開発者のマシンでは再現できません。チームは、関連する指示ファイルが新人開発者のセッションで実際に読み込まれているかどうかを把握できていません。"],"q":"設定階層の問題を診断するために、まず行うべきことはどれですか。（2つ選択してください。）","need":2,"opts":[{"t":"新人開発者のセッションで/statusを実行し、StatusタブのSetting sourcesの行に並ぶ設定ファイルを確認する。","c":false,"e":["/statusのSetting sourcesの行は、そのセッションが読み込んだsettingsファイル（ユーザー設定やプロジェクトのローカル設定、管理設定など）を確かめる場面で役立ちます。しかし対象は権限やフックなどの設定ファイルで、CLAUDE.mdのような指示ファイルがコンテキストに入っているかどうかは示さないため、本問の診断には合いません。"]},{"t":"関連するCLAUDE.mdが、新人のセッションで読み込まれる場所に実際に置かれているかを確認する。","c":true,"e":["正解。公式ドキュメントのトラブルシューティングは、/contextの確認と並んで、関連するCLAUDE.mdがそのセッションで読み込まれる場所にあるかを確かめるよう挙げています。","作業ディレクトリより上の階層や~/.claude/にあるファイルは起動時に読み込まれ、サブディレクトリのファイルはClaudeがそこを読んだときに読み込まれるため、新人の作業ディレクトリやクローンの構成によっては、規約ファイルが読み込み範囲の外に置かれていることがあります。"]},{"t":"チームの規約を新人開発者のマシンの.claude/settings.local.jsonに書き込み、その後の挙動を確認する。","c":false,"e":["settings.local.jsonは、個人のマシンだけに適用する権限などの設定をコミットせずに置くためのファイルです。指示文を書く場所ではないうえ、原因を切り分ける前に設定を書き足してしまうと、既存のCLAUDE.mdが読み込まれていないという本当の原因が分からないままになります。"]},{"t":"新人開発者のセッションで/contextを実行し、「Memory files」に並ぶ読み込み済みの指示ファイルを確認する。","c":true,"e":["正解。公式ドキュメントのトラブルシューティングは、指示が守られないときにまず/contextを実行し、「Memory files」にCLAUDE.mdやCLAUDE.local.mdが読み込まれているかを確認するよう案内しています。一覧に無いファイルはClaudeから見えていないため、読み込みの有無を直接確かめる最初の一手になります。"]}],"overall":["「自分の環境では再現するのに、他の人の環境では再現しない」という問題は、まず何が読み込まれているかを確かめるのが定石です。","Claude Codeの公式ドキュメントのトラブルシューティングは、指示が守られないときの手順として、/contextの「Memory files」で読み込まれたCLAUDE.mdを確認することと、関連するCLAUDE.mdがセッションで読み込まれる場所にあるかを確かめることを挙げています。一覧に無いファイルはClaudeから見えていません。","これに対して/memoryは、ユーザーとプロジェクトの各スコープのメモリファイルの配置場所を、まだ存在しないファイルも含めて一覧し、開いて編集するためのコマンドなので、読み込み済みかどうかの確認には向きません。/statusのSetting sourcesは設定ファイルの読み込み状況を示すもので、指示ファイルは対象外です。settings.local.jsonへの書き込みは、原因を確かめる前に手を加える対処です。","「変更する前に観測する」順序を守った選択肢が、診断問題の正解の候補です。"],"ref":"https://code.claude.com/docs/en/memory"},{"n":40,"d":"Claude Codeの設定とワークフロー","stem":["インフラ自動化の開発を加速するために、Claude Codeを使用しています。チームでは、コード生成、リファクタリング、デバッグ、ドキュメント作成にClaude Codeを使っています。カスタムスラッシュコマンドやCLAUDE.mdの設定を用いて開発ワークフローに統合し、プランモードと直接実行をどのように使い分けるかを理解する必要があります。","リポジトリには、すでに.claude/skills/code-review/SKILL.mdにチーム共有のプロジェクトスキルがあります。あなたは、自分専用のより厳格なレビューワークフローを、自分が関わるすべてのプロジェクトで使えるようにしたいと考えています。ただし、次のことは避けたいと考えています。","チームメイトの挙動を変える","既存の/code-reviewスキルを覆い隠す"],"q":"取るべき対応として、最も適切なものはどれですか。","need":1,"opts":[{"t":".claude/skills/code-review/SKILL.mdをより厳格なルールに編集し、/code-reviewとして呼び出す。","c":false,"e":["プロジェクトスキルを編集するのは、チーム全体のレビュー基準を変えたいときの正しい手段です。しかし.claude/skills/はリポジトリで共有されるため、編集すれば同じリポジトリで作業するチームメイト全員の/code-reviewの挙動が変わってしまい、自分専用の変更という要件に反します。"]},{"t":"プロジェクトのCLAUDE.mdにより厳格なレビュー指示を追記し、既存の/code-reviewを呼び出す。","c":false,"e":["プロジェクトのCLAUDE.mdは、チーム全員に共通の規約を常に読み込ませたいときに使う場所です。そこに自分用の厳しいレビュー指示を足すと、コミットを通じてチームメイトのセッションにも読み込まれ、全員のレビューの挙動を変えてしまいます。"]},{"t":"~/.claude/skills/my-code-review/SKILL.mdを作成し、/my-code-reviewとして呼び出す。","c":true,"e":["正解。~/.claude/skills/配下のパーソナルスキルは自分が関わるすべてのプロジェクトで使え、リポジトリには含まれないのでチームメイトの挙動を変えません。ディレクトリ名もコマンド名も既存と異なるmy-code-reviewにしておけば、プロジェクトの/code-reviewと名前が衝突せず、両方をそれぞれのコマンドで呼び出せます。"]},{"t":"~/.claude/skills/code-review/SKILL.mdを作成し、/code-reviewとして呼び出す。","c":false,"e":["ホーム配下に同じ名前のスキルを置くのは、既存のスキルの動作を自分の環境だけで置き換えたい場合には使える手です。しかし同じ名前のスキルは個人用がプロジェクト用より優先されるため、自分のセッションで/code-reviewを実行するとパーソナルスキルが動き、チームで共有している既存のプロジェクトスキルを覆い隠してしまいます。"]}],"overall":["Claude Codeのスキルは、置き場所によって適用範囲が決まります。~/.claude/skills/に置くパーソナルスキルは自分の全プロジェクトで使え、.claude/skills/に置くプロジェクトスキルはリポジトリを通じてチームに共有されます。同じ名前のスキルがある場合は、エンタープライズ、パーソナル、プロジェクトの順に優先され、個人用が同名のプロジェクト用を上書きして実行されます。","本問の要件は、自分の全プロジェクトで使えること、チームメイトに影響しないこと、既存の/code-reviewを覆い隠さないことの3つで、ホーム配下にmy-code-reviewという別名のスキルを作る案だけがすべてを満たします。","プロジェクトスキルやCLAUDE.mdの編集はチームに波及し、ホーム配下に同じcode-reviewという名前で作る案は優先順位によって既存スキルを隠します。","置き場所と名前の2点をセットで押さえることが、スキル設計の基本です。"],"ref":"https://code.claude.com/docs/en/skills"},{"n":41,"d":"Claude Codeの設定とワークフロー","stem":["あるメディア分析企業のチームは、マルチエージェントの記事要約システムをClaude Codeで開発・保守しています。このシステムでは、コーディネーターが調査・分析・要約・レポート生成の各サブエージェントに作業を委任します。","このチームは、次のようにしたいと考えています。","引用や出典の扱いに関する規約は、すべての開発者に共有する","レポート生成サブエージェント固有のガイダンスは、そのサブエージェントの作業ディレクトリで作業する場合にだけ適用する","個人のエディタ設定の好みは、非公開のままにする"],"q":"Claude Codeのメモリ階層に最も合致する設定方法はどれですか。","need":1,"opts":[{"t":"規約は~/.claude/CLAUDE.mdにまとめ、レポート生成向けの注記は.claude/settings.jsonに書き、各開発者に同じファイルをコピーさせる。","c":false,"e":["~/.claude/CLAUDE.mdは自分の全プロジェクトに適用したい個人の好みを書く場所で、チームへの配布手段ではありません。settings.jsonは権限やフックなどの動作設定を記述するファイルで、指示文を読み込ませる仕組みではないため、手作業のコピーに頼る運用は階層の利点を捨てることになります。"]},{"t":"共有規約はレポート生成ディレクトリのCLAUDE.md、個人の好みはルートのCLAUDE.mdに置き、子の内容で親を上書きさせる。","c":false,"e":["サブディレクトリにCLAUDE.mdを置く発想自体は、特定コンポーネントに限定した規約を持たせたいときの正しい使い方です。しかし見つかったCLAUDE.mdは上書きではなく連結されてコンテキストに入るため、「子が親を上書きする」前提が成り立ちません。加えてルートのCLAUDE.mdに個人の好みを書くと、コミットによって全員に配られてしまいます。"]},{"t":"共有規約はCLAUDE.local.md、レポート生成向けは~/.claude/CLAUDE.mdに置き、ユーザーレベルのファイルをチーム用にコミットする。","c":false,"e":["CLAUDE.local.mdは自分用のサンドボックスURLなど、プロジェクトごとの個人的な設定を置くファイルで、.gitignoreに追加してコミットしない運用が想定されています。チーム共有の規約をここに置くと他の開発者には届かず、~/.claude/CLAUDE.mdも特定ディレクトリに限定したガイダンスを表現できません。"]},{"t":"共有規約はルートのCLAUDE.md、レポート生成向けはそのディレクトリのCLAUDE.md、個人の好みは~/.claude/CLAUDE.mdに置く。","c":true,"e":["正解。./CLAUDE.md（または./.claude/CLAUDE.md）はソース管理でチームに共有されるプロジェクト用の指示で、サブディレクトリのCLAUDE.mdはClaudeがそのディレクトリのファイルを読んだときに読み込まれます。","~/.claude/CLAUDE.mdは自分の全プロジェクトに効く個人用の指示でリポジトリには入らないため、共有・限定・非公開の3つの要求をそれぞれの置き場所で満たせます。"]}],"overall":["Claude Codeの指示ファイルは、置き場所によって「誰に」「いつ」効くかが決まります。プロジェクトの./CLAUDE.md（または./.claude/CLAUDE.md）はソース管理を通じてチームで共有され、~/.claude/CLAUDE.mdは自分の全プロジェクトに効く個人用、CLAUDE.local.mdは.gitignoreに入れて使うプロジェクト単位の個人用です。作業ディレクトリより上にあるファイルは起動時に読み込まれ、サブディレクトリのCLAUDE.mdはClaudeがそこにあるファイルを読んだ時点で追加されます。見つかったファイル同士は上書きし合わず、連結されてコンテキストに入る点も押さえておきましょう。","問題文の3つの要求（全員で共有・特定ディレクトリだけ・非公開）を、ルート・サブディレクトリ・ホームの3か所に1対1で対応させた案だけが条件を満たします。","CLAUDE.local.mdや設定ファイルに規約を置く案、上書きを前提にする案は、この階層の仕組みを取り違えています。","要求を「共有範囲」と「適用範囲」の2軸で整理すると、置き場所を迷わず選べます。"],"ref":"https://code.claude.com/docs/en/memory"},{"n":42,"d":"プロンプトエンジニアリングと構造化出力","stem":["あなたは、Claudeを使用して、経費精算文書から情報を抽出する構造化データ抽出システムを構築しています。このシステムは、非構造化文書から情報を抽出し、JSONスキーマを使用して出力を検証し、高い精度を維持します。エッジケースを適切に処理し、下流のシステムと連携する必要があります。","検証の結果、抽出器が欠落した金額を、依然として次のように一貫性なく表現していることが分かりました。","null","空文字列","\"N/A\"","フィールドそのものの省略","簡潔な文章のルールはすでに追加しましたが、同じ失敗パターンが続いています。"],"q":"次に行うべきことはどれですか。（2つ選択してください。）","need":2,"opts":[{"t":"典型的なケースとエッジケースの欠落値を含む、タグで区切った元の文書の抜粋と期待するJSONの例を3〜5個追加する。","c":true,"e":["正解。欠落値をどう表すかは、言葉で説明するより入力と出力の組で見せる方が確実に伝わります。典型的なケースとエッジケースの欠落値を含む元の文書の抜粋と期待するJSONを、タグで区切った例として3〜5個示せば、モデルはnull・空文字列・\"N/A\"・省略のどれを使うべきかを具体的なパターンとして学べます。"]},{"t":"文章のルールに、欠落値を表す同義語と、正規化を求めるより強い言い回しを書き足す。","c":false,"e":["言い換えの候補や強い言い回しを加えるのは、指示があいまいで意図が伝わっていない初期段階の対処です。本問ではすでに簡潔なルールを追加しても同じ失敗が続いており、同じ性質の対処を強めても、欠落値をどう書けばよいかの具体的な手本は示されません。"]},{"t":"正規化の要件をユーザーレベルのCLAUDE.mdに移し、すべてのローカルClaude Codeセッションで読み込まれるようにする。","c":false,"e":["ユーザーレベルのCLAUDE.mdは、開発者個人のClaude Codeセッションすべてに共通の指示を読み込ませたいときに使う場所です。本問の抽出器はAPI経由で動くパイプラインで、開発者のローカルセッションで読まれる指示ファイルは実行時のプロンプトに入らないため、抽出結果には影響しません。"]},{"t":"採用する欠落値の表現をJSONスキーマ自体で定め、フィールドを必須にしたうえで空の値はnullだけを許可する。","c":true,"e":["正解。JSONスキーマでフィールドを必須にし、空を表す値をnullだけに限定すれば、空文字列や\"N/A\"、フィールドの省略はスキーマ上の違反になります。Structured outputsのようにスキーマで出力を制約する仕組みと組み合わせれば、文章の指示に頼らずに表現の一貫性を機械的に担保できます。"]}],"overall":["出力の表記揺れが文章のルールでは直らないとき、次に打つ手は「手本を見せる」ことと「形を機械的に縛る」ことです。Anthropicのプロンプトガイドは、例示を出力の形式と一貫性を安定させる最も確実な方法の1つとし、関連性が高く多様で、タグで構造化した例を3〜5個示すよう勧めています。これに加えて、欠落値の表現そのものをJSONスキーマで規定すれば、nullだけを空の表現として許し、それ以外を検証で弾けます。","本問はまさにこの2つの組み合わせが正解です。","CLAUDE.mdへの移動は抽出パイプラインの実行文脈と無関係で、文章のルールの強化はすでに効果がなかった手法の延長にすぎません。","「同じ種類の対策がすでに失敗している」という情報は、別の種類の対策を選ぶべき合図として読むとよいでしょう。"],"ref":"https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices"},{"n":43,"d":"プロンプトエンジニアリングと構造化出力","stem":["あなたは、AIアシスタントを使って社内の文書処理を自動化しているエンジニアです。チームは、新入社員のオンボーディング資料からメタデータを抽出し、人事システム用のJSONカタログを生成するカスタムコマンドを運用しています。","評価の結果、manager（上長）やstart_date（入社日）などの必須フィールドがnullとして返される問題が、繰り返し起きていることが分かりました。この問題は、情報が表・メール署名・自由記述の説明文など、さまざまな形式で記載されている場合に起きています。","該当フィールドは元の文書に確かに存在します。しかし、コマンドのプロンプトには、スキーマの説明と「すべての必須フィールドを抽出すること」という指示しか含まれていません。"],"q":"抽出の一貫性を最も直接的に改善する変更はどれですか。（2つ選択してください。）","need":2,"opts":[{"t":"コマンドのtemperatureを下げ、実行のたびに抽出の挙動がより決定的になるよう調整する。","c":false,"e":["temperatureは応答のばらつきを調整するパラメータですが、Claude Opus 4.6より後にリリースされたモデルでは変更自体が非推奨となり、1.0以外の値は400エラーで拒否されます。また0.0にしても完全には決定的になりません。仮に下げられても、形式を読み取れないという原因は変わらず、同じnullを安定して返すだけです。"]},{"t":"必須フィールドが現れやすい箇所と、表や署名、本文それぞれからの値の読み取り方を指示に書き加える。","c":true,"e":["正解。同じフィールドでも、表のセル、メール署名の一行、自由記述の文中では現れ方が異なります。フィールドごとに現れやすい場所と、それぞれからの読み取り方を明示すると、モデルは「スキーマの項目名と一致する見出しが無い」というだけでnullを返すのではなく、形式ごとの手がかりから値を探しにいけるようになります。"]},{"t":"多様なソース形式とその抽出結果を示す、関連性の高い構造化された例を3〜5個追加する。","c":true,"e":["正解。表・署名・文章といった多様な入力形式と、期待される抽出結果の組を例として示すことは、形式に左右されない抽出を教える最も直接的な方法です。公式ガイドも、実際の用途に近く多様で、＜example＞タグで構造化した例を3〜5個示すよう勧めています。"]},{"t":"該当するスキーマのフィールドをnullableに変更し、値が取れない場合でも検証エラーにしない。","c":false,"e":["nullableにするのは、元の文書に本当に値が無いことがある任意項目を正しく表現したい場合の設計です。本問のフィールドは元の文書に存在しており、nullを許すと抽出の失敗が検証をすり抜けて人事システムに入り込み、データ品質の問題を見えなくしてしまいます。"]}],"overall":["スキーマの説明と「すべての必須フィールドを抽出すること」という指示だけでは、モデルはフィールドの値がどんな見た目で現れるかを知りません。表の列、メール署名の一行、文章の中の言い回しと、同じ上長名や入社日でも表現は大きく異なります。Anthropicのプロンプトガイドは、出力の形式と精度を安定させる手段として、関連性が高く多様な例を3〜5個示すことを勧めています。","本問では、形式ごとの入力と期待される出力の組を例示すること、そしてフィールドが現れやすい場所と読み取り方を言葉で明示することの2つが、nullになる根本原因（形式の見落とし）に直接効きます。","temperatureはばらつきを扱う設定で、新しいモデルでは既定値以外を指定できません。nullableへの変更は失敗を検証から隠すだけです。","抽出漏れの問題では、モデルに足りないのが指示の強さなのか、入力の見え方についての知識なのかを見極めると判断できます。"],"ref":"https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices"},{"n":44,"d":"ツール設計とMCP統合","stem":["あなたは、Claude Agent SDKを使用して、製薬分野の文献レビューを行うマルチエージェントシステムを構築しています。コーディネーターエージェントが、専門化されたサブエージェントに作業を委任します。サブエージェントには、ウェブを検索するもの、文書を解析するもの、調査結果を統合するもの、レポートを生成するものがあります。","検索サブエージェントと文書解析サブエージェントは、臨床試験データベース検索用・社内文書アクセス用・引用エクスポート用の、それぞれ別々のMCPサーバーに接続することになっています。","ある設計案は、ランタイムがサブエージェントごとに1つのサーバーだけを有効にしておき、サブエージェントが別のサーバーのツールを必要としたときに、その都度再接続する方式です。"],"q":"この設計案の代わりに推奨すべきものはどれですか。（2つ選択してください。）","need":2,"opts":[{"t":"サブエージェントに必要な各MCPサーバーへ接続してツール一覧を取得し、統一されたレジストリとして公開して呼び出しを所有サーバーへルーティングする。","c":true,"e":["正解。MCPのホストはサーバーごとに1つのクライアントを作り、それぞれが専用の接続を保ちます。必要なサーバーすべてに接続して各サーバーのツール一覧を取得し、1つのレジストリとして公開したうえで、呼び出しをそのツールを持つサーバーへ振り分ければ、サブエージェントは再接続を待たずに複数サーバーのツールを使えます。"]},{"t":"各サブエージェントには自身の役割に実際に必要なMCPサーバーだけを割り当て、それらすべてを実行中ずっと接続したままにする。","c":true,"e":["正解。サブエージェントには役割に必要なMCPサーバーだけを割り当て（Agent SDKではサブエージェント定義のmcpServersで指定できます）、それらを実行中は接続したままにすると、不要な権限を与えずに途中の再接続や中断も避けられます。必要最小限の範囲と接続の継続性を両立する設計です。"]},{"t":"次の調査フェーズに必要なMCPサーバーだけを接続し、フェーズの間で再接続し、各ステップの前にサブエージェントのツールを再構築する。","c":false,"e":["必要なサーバーをフェーズごとに切り替える方式は、同時に保てる接続数に厳しい制約がある環境では検討されることがあります。しかしフェーズの境目ごとに再接続とツールの再構築が起き、提案された設計と同じ中断と待ち時間を抱えるため、代替案になっていません。"]},{"t":"外部サービスを1つの自作MCPサーバーの背後にまとめ、個別のサーバーを廃止して、サブエージェントには集約された1つの調査ツールだけを公開する。","c":false,"e":["複数の外部サービスを1つのMCPサーバーにまとめる設計は、ツール数を減らして選択のあいまいさを下げたい場合には有効なこともあります。しかし既存の個別サーバーを同時に利用できるのに新たなサーバーを作って集約するのは、開発と保守の負担を増やすだけで、本問の再接続の問題を解くのに必要な変更ではありません。"]}],"overall":["MCPのアーキテクチャでは、Claude CodeのようなAIアプリケーション（ホスト）が、接続するMCPサーバーごとに1つのMCPクライアントを作り、各クライアントが対応するサーバーとの専用の接続を維持します。つまり1つのホストが複数のサーバーに同時につながるのが標準の形で、「サブエージェントごとに1つのサーバーだけを有効にしておく」必要はありません。ツールの一覧は各サーバーへのtools/listで取得でき、ホストはそれらをまとめて提示し、呼び出しを持ち主のサーバーへ振り分けます。","本問の推奨は、必要なサーバーに同時接続して統一されたレジストリを作ることと、サブエージェントには役割に必要なサーバーだけを割り当てて接続を保つことの2点です。","フェーズごとに接続し直す案は元の提案と同じ中断を生み、自作サーバーへの集約は不要な開発負担を増やします。","MCPの設計問題では、ホスト・クライアント・サーバーの1対1対応を思い出すと判断の軸がぶれません。"],"ref":"https://modelcontextprotocol.io/docs/2026-07-28/learn/architecture"},{"n":45,"d":"エージェントアーキテクチャとオーケストレーション","stem":["ある製薬会社の研究開発チームは、Claude Agent SDKで夜間に無人で動く文献調査エージェントを運用しています。毎晩数十件の調査依頼をそれぞれ別のquery()で実行し、翌朝に研究者が結果を確認します。","ほとんどの依頼は20ターン前後で終わります。しかし、「この領域の最新動向を網羅的に調べる」のような範囲の広い依頼では、ツール呼び出しが数百回続き、1件で一晩分の予算の大半を使ってしまうことがあります。","チームは、次の2つを実現したいと考えています。","1件あたりの実行量に確実な上限を設ける","途中で止まった依頼を完了した調査と取り違えず、後から続きを処理できるようにする"],"q":"行うべき変更はどれですか。（2つ選択してください。）","need":2,"opts":[{"t":"累計の費用が限度を超えた時点で実行を打ち切るStopフックを、各query()のオプションに登録する。","c":false,"e":["Stopフックはエージェントが応答を終える時点で呼ばれ、最終結果の検証やセッション状態の保存に使われます。ツール呼び出しが続いている間は発火しないため、数百回の呼び出しを続けている最中のセッションを途中で止める手段にはならず、費用の限度を守る仕組みとしては機能しません。"]},{"t":"結果のsubtypeがerror_max_turns等ならsession_idを保存し、後でresumeする。","c":true,"e":["正解。限度で止まった場合、ResultMessageのsubtypeはerror_max_turnsまたはerror_max_budget_usdになり、最終結果を入れるresultフィールドは付きません。どのsubtypeでもsession_idは返るので、それを保存しておけば完了扱いにせずに済み、後から同じセッションを再開して、それまでの調査内容を引き継いだまま続きを処理できます。"]},{"t":"ClaudeAgentOptionsのeffortを\"low\"にし、各ターンの推論に使うトークン量を減らす。","c":false,"e":["effortは推論の深さとトークン量の釣り合いを決める設定で、ファイルの一覧取得のような単純で範囲の狭い作業では費用とレイテンシを下げられます。しかし1ターンあたりの消費が減るだけでターン数そのものには限度が付かず、範囲の広い依頼が数百回のツール呼び出しを続ける状況は止まりません。"]},{"t":"max_turnsとmax_budget_usdを設定し、1件ごとのターン数と費用に限度を設ける。","c":true,"e":["正解。max_turnsはツール呼び出しの往復回数、max_budget_usdは費用の累計に限度を設けるオプションで、どちらも既定では無制限です。限度に達するとSDKはループを止めてエラー種別付きのResultMessageを返し、費用の限度はサブエージェントの消費も含めて数えるため、1件の依頼が一晩の予算を使い切る事態を確実に防げます。"]}],"overall":["無人で動くエージェントでは、タスクが終わらない場合の歯止めを設計に組み込んでおく必要があります。Agent SDKのエージェントループは、Claudeがツールを呼ばない応答を返すまでターンを繰り返し、既定ではターン数にも費用にも限度がありません。公式ドキュメントは、範囲の広いプロンプトでは実行が長引き得るとして、本番のエージェントでは予算を設定することを既定の選択として勧めています。","max_turnsとmax_budget_usdで限度を決め、止まったときはResultMessageのsubtypeで成功と区別し、session_idから再開するのが、上限と継続を両立させる基本の形です。なお単発のquery()は、エラー種別の結果を返した後で例外を送出するため、try文で囲んで次の依頼に進める実装にしておきます。","effortは1ターンあたりの消費を変えるだけで、Stopフックはループが終わるまで発火しません。","「どこで止めるか」と「止まった後にどう扱うか」の両方が用意されているかが、長時間動くエージェントを評価するときの着眼点です。"],"ref":"https://code.claude.com/docs/en/agent-sdk/agent-loop"},{"n":46,"d":"プロンプトエンジニアリングと構造化出力","stem":["あるコンサルティング会社は、Claude Agent SDKを使用して、環境影響評価のためのマルチエージェント調査システムを構築しています。コーディネーターエージェントは、専門化されたサブエージェント（Web検索担当、資料分析担当、知見の統合担当、レポート生成担当）に作業を委任します。このシステムは案件を調査し、出典を明記した包括的なレポートを作成します。","レポート生成ステップは、統合サブエージェントから常に同じ構造化された知見データを受け取っていますが、生成される文章表現には毎回ばらつきがあります。ある回では1つの知見につき出典付きの箇条書きを1件にしていますが、別の回では次のようになります。","複数の知見を1つにまとめてしまう","根拠となる抜粋を省く","出典の日付を脚注に追いやる","現在の指示は、「各知見を、出典の詳細を完全な形で含む簡潔な出典付き箇条書きに変換してください」というものです。"],"q":"この変換の一貫性を最も直接的に改善する変更はどれですか。（2つ選択してください。）","need":2,"opts":[{"t":"代表的な知見の入力例と、理想的な出典付き箇条書きの出力例を示す例示ブロックを追加する。","c":true,"e":["正解。入力となる知見と、理想的な出典付き箇条書きの出力を組にして示すと、1つの知見を1項目にする粒度、根拠の抜粋を残すこと、出典の日付の置き場所といった変換の規則が、言葉の説明より確実に伝わります。エッジケースの例も含めておけば、紛らわしい入力でも同じ形を保ちやすくなります。"]},{"t":"出典付き箇条書きの明示的な出力テンプレートを追加し、必須要素とその記載順序を定義する。","c":true,"e":["正解。出典付き箇条書きに必ず含める要素と、その並び順を定義したテンプレートを示せば、知見をまとめてしまう、抜粋を省く、日付を脚注に移す、といったばらつきの余地を形式の面から減らせます。例示と組み合わせると、望ましい変換をより確実に再現させられます。"]},{"t":"出典付き箇条書きが発行日を省いている場合にレポート作成を止めるPreToolUseフックを追加する。","c":false,"e":["PreToolUseフックは、特定のツール呼び出しを実行前に機械的に止めたい場合に有効です。しかし発行日の欠落という1つの症状を検知して止めるだけで、知見の統合や抜粋の省略といった他のばらつきは防げず、止めた後にどう書き直すかも示されません。"]},{"t":"「簡潔に」「完全な形で」といった指示の語を、太字や大文字を使った強い表現に書き換える。","c":false,"e":["指示の語を強調するのは、指示そのものが見落とされているときには一定の効果があります。しかし本問のばらつきは、「簡潔」と「完全」をどう両立させ、1項目に何をどの順で書くかが決まっていないことから生じており、強調しても解釈の幅は狭まりません。Anthropicのプロンプトガイドも、最近のモデルには過度に強い言い回しを控え、具体的な指示や例で伝えるよう勧めています。"]}],"overall":["同じ構造化データを受け取っているのに出力の形が毎回変わるのは、指示文が変換の規則を言葉でしか伝えていないためです。「出典の詳細を完全な形で含む簡潔な出典付き箇条書き」という指示は、1項目に何を入れ、どの順で書くかを解釈に任せています。Anthropicのプロンプトガイドは、例示を出力の形式・トーン・構造を安定させる最も確実な方法の1つとし、出力の形式を明示的に指定することも勧めています。","本問では、代表的な入力とエッジケースを含む理想的な出力の例を示すことと、必須要素と並び順を定義したテンプレートを示すことの2つが、変換の一貫性に直接効きます。","語の強調は解釈の幅を狭めず、PreToolUseフックは1つの症状を止めるだけです。","「見本」と「型」の2つを用意できているかが、出力のばらつきを抑える鍵です。"],"ref":"https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices"},{"n":47,"d":"プロンプトエンジニアリングと構造化出力","stem":["ある通信キャリアの請求紛争処理チームは、Claudeを使用して構造化データ抽出システムを構築しています。このシステムは、非構造化文書から情報を抽出し、JSONスキーマを使用して出力を検証します。エッジケースを適切に処理し、下流のシステムと連携する必要があります。","抽出処理の途中で、明細書の内容が顧客アカウントのデータと矛盾するため、一部のレコードはエスカレーションが必要になります。エスカレーションには、次の条件があります。","レビュー担当者は、モデルの会話全体やツール利用履歴を受け取らない","受付キューが受け取るエスカレーション用のパケットは、ツール呼び出しの引数ではなく、モデルの最終応答そのものでなければならない","顧客識別子・推定される根本原因・推奨される次のアクションを含む一貫したJSONが必要である"],"q":"このチームが採用すべき設計はどれですか。（2つ選択してください。）","need":2,"opts":[{"t":"Structured outputsでスキーマに適合したエスカレーション用パケットを最終応答として生成する。","c":true,"e":["正解。Structured outputs（output_config.formatのjson_schema）は制約付きデコーディングで応答本文そのものをスキーマに適合させるため、必須フィールドや型の揃ったJSONが最終応答として返ります。受付キューが求める「ツール呼び出しの引数ではなく最終応答であること」と「一貫したJSONであること」の両方を直接満たせます。"]},{"t":"スキーマを定義したエスカレーション用ツールを呼ばせ、その呼び出し引数をレビュー担当への引き渡しにする。","c":false,"e":["ツールの入力スキーマで構造を固定する方法は、アプリケーション側で処理を実行させたい場面や、ツール呼び出しを受け取るように作られた連携では正しい選択です。本問の受付キューは引き渡しが最終応答そのものであることを明示的に求めているため、tool_useの引数を渡す設計はこの要件と正面から衝突します。"]},{"t":"受付キューに入れる前に同じJSONスキーマでパケットを検証し、適合しないものは差し戻す。","c":true,"e":["正解。Structured outputsでも、stop_reasonがmax_tokensで途中で切れた場合や安全上の理由で拒否（refusal）した場合は、出力がスキーマに合わないことがあります。受付キューの手前で同じスキーマによる検証を置き、適合しないパケットを差し戻せば、下流が壊れたデータを取り込む事態を防げます。"]},{"t":"抽出した生の抜粋と会話履歴をそのまま引き渡し、レビュー担当者に内容を再構成してもらう。","c":false,"e":["生の抜粋や会話履歴を保存しておくことは、監査や事後調査の記録としては価値があります。しかし問題文はレビュー担当者が会話全体やツール履歴を受け取らない前提で、顧客識別子・根本原因・推奨アクションを含む一貫したJSONを求めているため、手作業での再構成に頼る案は要件を満たしません。"]}],"overall":["Claude APIで構造化データを得る方法には、応答本文をJSONにするStructured outputs（JSON outputs）と、ツール呼び出しの入力をスキーマに従わせるstrictなツール使用の2系統があります。どちらを選ぶかは、下流が「最終応答」を受け取るのか「ツール呼び出し」を受け取るのかで決まります。","本問の受付キューは最終応答を要求しているので、output_config.formatでスキーマを指定し、応答本文をエスカレーション用パケットとして生成するのが筋です。ただし公式ドキュメントには、max_tokensでの打ち切りやrefusalの場合は出力がスキーマに合わない可能性があると明記されています。そのため、キューに入れる前の検証を組み合わせるのが実務的な設計になります。","ツール引数を引き渡しに使う案は「最終応答」という条件に反し、生データを渡す案はレビュー担当者の前提条件に反します。","下流が最終応答を受け取るのかツール呼び出しを受け取るのかが、方式を選ぶ最初の分岐点です。"],"ref":"https://platform.claude.com/docs/en/build-with-claude/structured-outputs"},{"n":48,"d":"エージェントアーキテクチャとオーケストレーション","stem":["ある物流会社は、Claude Agent SDKを使用して社内向けの調査アシスタントを構築しています。コーディネーターエージェントが、経路検索・書類分析・統合・レポート生成をそれぞれ担当する専門サブエージェントに作業を委任します。","評価の結果、次の2つの問題が繰り返し起きていることが分かりました。","些細な根拠確認のたびに、レポート生成が停滞する","以前、統合サブエージェントの役割を広げたところ、経路検索サブエージェントと同じ作業まで行うようになった"],"q":"この設計の改善として最も適切な変更はどれですか。","need":1,"opts":[{"t":"統合サブエージェントにも、経路検索サブエージェントと同じRead・Grep・Globの権限を与える。","c":false,"e":["Read・Grep・Globは読み取り専用で安全な組み合わせで、探索を担当するサブエージェントには適した権限です。しかし統合サブエージェントに経路検索と同じ広い探索手段を与えると、以前と同じように自分で調査を始めてしまい、役割の境界が崩れて作業の重複が再発します。"]},{"t":"統合とレポート生成を1つのサブエージェントにまとめ、プロンプトとツール権限を共有させる。","c":false,"e":["2つの役割をまとめるのは、両者の入出力が密に結びついていて分割の利点が小さい場合には検討に値します。ただし本問の課題は根拠確認による停滞と調査の重複であり、統合しても軽微な確認の手段は用意されず、1つのプロンプトに責務が増えて専門化の利点も失われます。"]},{"t":"統合サブエージェントのツールを外し、根拠を確認するたびにコーディネーターの承認を得てから次の作業へ進ませる。","c":false,"e":["ツールを外して承認制にするのは、影響の大きい書き込み系の操作をコーディネーターや人の管理下に置きたい場面では有効な設計です。本問の問題は軽微な根拠確認のたびに作業が止まることなので、確認ごとに承認の往復を挟むと、停滞はむしろ悪化します。"]},{"t":"統合サブエージェントに範囲の狭いverify_factツールだけを与え、広い調査はコーディネーターに戻させる。","c":true,"e":["正解。事実確認という1つの目的に絞ったverify_factだけを持たせると、統合サブエージェントは軽微な根拠確認をその場で済ませられ、レポート生成が止まらなくなります。範囲の広い調査はコーディネーターに差し戻す設計なので、経路検索サブエージェントの担当領域に踏み込んで作業が重複することもありません。"]}],"overall":["サブエージェントにどのツールを渡すかは、その役割の境界を決める設計判断です。Agent SDKではサブエージェントごとにtoolsで使えるツールを限定でき、公式ドキュメントも権限を役割に合わせて絞ることで意図しない動作のリスクを下げられると説明しています。","本問には、軽微な根拠確認でレポート生成が止まる問題と、役割を広げたときに経路検索の作業と重複した問題の2つがあります。前者には確認の手段が必要で、後者にはその手段を広げすぎない制約が必要です。狭い目的のverify_factだけを与え、それを超える調査はコーディネーターに戻すという案が、両方の条件を同時に満たします。","ツールを外す案は前者を悪化させ、経路検索と同じ権限を渡す案は後者を再発させ、役割をまとめる案はどちらにも効きません。","症状が2つ示された問題では、両方の症状に効く選択肢が1つしか無いことが多く、その照合が決め手です。"],"ref":"https://code.claude.com/docs/en/agent-sdk/subagents"},{"n":49,"d":"Claude Codeの設定とワークフロー","stem":["あるチームは、Claudeを使用して、医療記録から情報を抽出する構造化データ抽出システムを構築しています。このシステムは、非構造化文書から情報を抽出し、JSON（JavaScript Object Notation）スキーマを使用して出力を検証し、高い精度を維持する必要があります。エッジケースを適切に処理し、下流のシステムと連携する必要もあります。","ある検証ロールアウトで、後続のコードがいまだに古い抽出フィールド名insured_partyを期待しているため、処理が失敗し始めました。状況は次のとおりです。","どのファイルがそのフィールドを参照しているかは分からない","ファイル名自体には、その文字列は含まれていない","このセッションでは、組み込みのGlobとGrepが有効になっている"],"q":"最初に行うべきClaude Codeのツール操作として、最も適切なものはどれですか。","need":1,"opts":[{"t":"Bashでgit logを実行し、insured_partyに触れたコミットメッセージを探す。","c":false,"e":["コミット履歴の検索は、そのフィールドがいつ誰の変更で導入・改名されたかを調べたいときには役立ちます。しかしコミットメッセージにフィールド名が書かれているとは限らず、履歴を見ても現在のコードのどこが古い名前を参照しているかは分かりません。"]},{"t":"Grepで、insured_partyという文字列をリポジトリのファイル内容から検索する。","c":true,"e":["正解。Grepはripgrepを基盤にファイルの中身をパターンで検索するツールで、既定の出力モードでは一致したファイルのパスを返します。探しているのはファイル名ではなくコード中に現れるフィールド名なので、insured_partyで内容を検索すれば、どのファイルが古いフィールド名を参照しているかを直接特定できます。"]},{"t":"Globを使って、ファイル名にinsured_partyという文字列を含むリポジトリのパスを探す。","c":false,"e":["Globはsrc配下の拡張子.tsのファイルといった、ファイル名やパスのパターンに一致するファイルを探すツールで、名前の規則が分かっている場合には最も手早い手段です。本問ではファイル名にその文字列が含まれないと分かっているため、パスで探しても目的のファイルには辿り着けません。"]},{"t":"Readでプロジェクトルートを読み込み、ディレクトリ一覧から候補を目視で調べる。","c":false,"e":["Readは、パスが分かっているファイルの中身を読むためのツールです。どのファイルが参照しているか分からない段階で目視の候補探しに使うと、リポジトリ全体を横断して文字列を探す作業には向かず、時間がかかるうえ見落としも起きます。"]}],"overall":["Claude Codeには、ファイルを探す手段として名前で探すGlob、中身で探すGrep、指定したファイルを読むReadがあり、目的に応じて使い分けます。公式のツールリファレンスは、Globがファイル名のパターンでファイルを見つけるのに対し、Grepはファイルの中の行を見つけるツールだと説明しています。なおmacOS・Linux・WSLでは、GlobとGrepが既定のツールセットから外れ、Bashのfindやgrepで検索する構成になっているため、本問ではこのセッションで両ツールが有効であることを前提にしています。","探しているのはコードの中に書かれたinsured_partyというフィールド名で、ファイル名には含まれていないので、内容を検索するGrepが最初の一手になります。","コミット履歴の検索は現在の参照箇所を示さず、Readの目視は横断検索に向かず、Globは名前が手がかりにならない本問では使えません。","手がかりが「名前」にあるのか「中身」にあるのかで、使うべき検索ツールは決まります。"],"ref":"https://code.claude.com/docs/en/tools-reference"},{"n":50,"d":"ツール設計とMCP統合","stem":["壊れたテストフィクスチャを自動修正するQAオートメーションエージェントを構築しています。このエージェントは、組み込みツール（Read、Write、Bash、Grep、Glob）を使用し、Model Context Protocol（MCP）サーバーとも連携します。","ある自動修正処理の中で、指定したold_stringが同じソースファイル内に複数回出現するため、Edit呼び出しが失敗しました。状況は次のとおりです。","意図している変更は、ファイルの最終的な内容に対する一回限りの修正であり、一致するすべての箇所を置き換えることではない","周辺の文脈を加えてold_stringを一意にしようとしたが、それでも一意にできなかった","望ましいファイル全体の内容は、組み立てられる状態にある"],"q":"確実に修正するために、次に行うべきことはどれですか。","need":1,"opts":[{"t":"目的の出現箇所にゆるく一致する、正規表現風のold_stringでEditをリトライする。","c":false,"e":["正規表現は、Grepツールでパターン検索を行うときには使えます。しかしEditツールは正規表現やあいまい一致を使わず、old_stringとの完全一致で置換するため、正規表現風の指定は意図した箇所に一致しません。"]},{"t":"replace_all: trueを付けてEditをリトライし、一致する箇所をまとめて同じ内容に更新する。","c":false,"e":["replace_allをtrueにする指定は、変数名の一括変更のように、一致するすべての箇所を同じ内容に置き換えたいときに使います。本問は一回限りの修正で、一致する全箇所の置換ではないと明示されているため、関係の無い箇所まで書き換えてしまいます。"]},{"t":"Grepで対象の行番号を特定してから、同じ一意でないold_stringのままEditを呼び出す。","c":false,"e":["Grepで対象の行を確かめるのは、どの出現箇所を直すべきかを把握する手順としては有用です。しかしEditツールが受け取るのはold_stringとnew_stringで、行番号で出現箇所を指定する仕組みはないため、一意でないold_stringのままでは同じ失敗を繰り返します。"]},{"t":"現在のファイルをReadで読み込み、望ましい全体の内容を組み立ててからWriteで上書きする。","c":true,"e":["正解。Writeツールは既存のファイルを、渡した内容全体でそのまま上書きします。old_stringを一意にできないときでも、現在の内容をReadで読み込み、意図した1か所だけを変えた全体を組み立ててWriteで書き戻せば、他の一致箇所に触れずに確実に修正できます。"]}],"overall":["Claude CodeのEditツールは、old_stringをファイル内から完全一致で探し、new_stringに置き換える仕組みです。公式のツールリファレンスによると、old_stringはファイル内にちょうど1回だけ現れる必要があり、複数回現れる場合は周辺の文脈を含めて一意にするか、replace_allをtrueにして全箇所を置き換えるかのどちらかになります。正規表現やあいまい一致は使えません。","本問では周辺の文脈を加えても一意にできず、全箇所の置換も意図していないため、Editの2つの逃げ道はどちらも使えません。そこで、ファイル全体の望ましい内容を組み立てられるという条件を活かし、Readで読み込んでWriteで丸ごと上書きするのが確実な方法になります。","replace_allは範囲が広すぎ、Grepによる行の特定や正規表現風の指定はEditの一致方式を変えません。","ツールの制約を問う問題では、その制約に対して公式に用意されている回避策がいくつあるかを思い出すと選択肢を絞れます。"],"ref":"https://code.claude.com/docs/en/tools-reference"},{"n":51,"d":"Claude Codeの設定とワークフロー","stem":["あるエンジニアは、社内システムのリファクタリング・デバッグ・ドキュメント作成にClaude Codeを活用しています。カスタムスラッシュコマンドやCLAUDE.mdの設定を整え、プランモードと直接実行をどう使い分けるかも把握しています。","昨日、リファクタリング計画について長時間の会話をした際、そのセッションIDを環境変数session_idに控えておきました。今日は、ターミナルから最初のフォローアップのプロンプトを送ると同時に、その特定の過去の会話を再開したいと考えています。"],"q":"取るべき行動はどれですか。","need":1,"opts":[{"t":"claude -p \"昨日の調査を続けて\" --continueを実行する。","c":false,"e":["--continueは、そのディレクトリで直近に使った会話を引き継ぐオプションで、直前の作業をそのまま続けたいときに便利です。しかし特定のセッションIDを指定できないため、昨日の会話の後に別のセッションを使っていれば、意図しない会話を再開してしまいます。"]},{"t":"claudeを起動し、session_idの値を貼り付けてから、昨日の調査を続けるよう頼む。","c":false,"e":["対話モードで起動して作業を始めるのは、新しい会話を始めるときの普通の使い方です。しかし会話の中にセッションIDの文字列を貼り付けても、それは単なるテキストとして扱われ、過去のセッションの履歴が読み込まれるわけではありません。対話モードで過去の会話に戻るなら/resumeや「claude --resume」を使います。"]},{"t":"claude -p \"昨日の調査を続けて\" --resume \"$session_id\"を実行する。","c":true,"e":["正解。--resumeにセッションIDを渡すと、その特定の会話を履歴ごと再開できます。-pと組み合わせれば、再開と同時に最初のフォローアップのプロンプトを非対話で送れるため、ターミナルのコマンド1つで要件を満たせます。公式ドキュメントも、複数の会話がある場合はセッションIDを控えて--resumeで指定する方法を示しています。"]},{"t":"claude -p \"$session_id の調査を続けて\"を実行する。","c":false,"e":["プロンプトの文中にセッションIDを書いても、Claude Codeはそれを再開の指示として解釈しません。新しいセッションが始まり、Claudeは昨日の会話の内容を知らないまま、IDという文字列だけを受け取ることになります。"]}],"overall":["Claude Codeで過去の会話に戻る方法は、直近の会話を続ける--continueと、セッションIDを指定して特定の会話を再開する--resumeの2つです。公式ドキュメントの非対話実行の説明では、複数の会話を扱う場合は-pと--output-format jsonで得たsession_idを控え、「claude -p」に「--resume \"$session_id\"」を付けて指定する方法が示されています。-pと組み合わせれば、再開と最初のフォローアップの送信を1つのコマンドで行えます。","本問の条件は、特定の過去の会話であること、ターミナルのコマンドから再開すること、最初のフォローアップを同時に送ることの3つで、--resumeにIDを渡す案だけがすべてを満たします。","--continueは直近の会話しか選べず、IDを会話やプロンプトに貼る方法は再開の指示として扱われません。","「特定の」会話なのか「直近の」会話なのかが、この2つのオプションを選び分ける基準です。"],"ref":"https://code.claude.com/docs/en/headless"},{"n":52,"d":"ツール設計とMCP統合","stem":["ある物流企業の開発生産性チームは、コードベースに関する作業を支援するため、Messages APIでツール使用の仕組みを実装しています。","テスト中、開発者が次のような質問をすると、コードベースの参照が不要な場合でも、Claudeがリポジトリgrepツールや、MCPリポジトリ検索ツールを呼び出してしまいます。","「このヘルパーのもっとシンプルな名前を考えて」","「エッジケースについてのあなたの推論を検索して」","現在の設定は次のとおりです。","これらのツールの説明には、リポジトリの内容やMCPが提供するプロジェクトデータを調べるためのものだと、すでに明記されている","リクエストは、デフォルトのtool_choiceの挙動を使っている","システムプロンプトには、「ユーザーがfind、search、locate、look upと言ったときは、回答する前に必ず検索ツールを使うこと」という一文が含まれている"],"q":"最初に行うべき変更はどれですか。","need":1,"opts":[{"t":"広いキーワードのルールを、リポジトリやMCPのデータを調べる必要がある場合だけ検索する指示に置き換える。","c":true,"e":["正解。不要な検索の直接の原因は、find・search・locate・look upという単語が出るたびに検索ツールを使えと命じるシステムプロンプトのルールです。ツールの説明はすでに適切なので、このルールを「リポジトリやMCPのデータを実際に調べる必要がある場合にだけ検索する」という狭い指示に置き換えれば、名前の提案や推論の見直しのような依頼での誤発火を根本から止められます。"]},{"t":"tool_choiceを{\"type\":\"any\"}に設定し、毎回のユーザーターンで最適なツールを選ばせる。","c":false,"e":["tool_choiceのanyは、どれか1つのツールを必ず呼ばせたい場面で使う設定です。ツールが不要な依頼でも毎ターン呼び出しを強制するため、不要な検索はむしろ増えます。さらに最新の一部モデルではanyの指定自体が400エラーになります。"]},{"t":"リポジトリgrepツールとMCPツールの説明に、それぞれのツールを呼び出すべきでないリクエストの例をさらに追加する。","c":false,"e":["使うべきでない場面の例をツールの説明に加えるのは、説明文があいまいで誤選択が起きているときには有効な改善です。しかし本問の説明文はすでに用途を明記しており、それを上書きしているのはシステムプロンプトの一律のキーワードルールなので、説明を足しても同じ指示に押し切られます。"]},{"t":"検索系のツール名を、findやsearchといった利用者がよく使う単語に似ない名前へ変更する。","c":false,"e":["ツール名を区別しやすくするのは、似た名前のツールが混同されているときの対策です。しかし誤発火の引き金はツール名ではなく、ユーザーの言葉に反応して検索を命じるシステムプロンプトのルールなので、改名しても「検索して」と言われれば同じように検索ツールが呼ばれます。"]}],"overall":["不要なツール呼び出しが起きたとき、原因の候補はツールの説明、tool_choiceの設定、システムプロンプトの指示の3つです。本問では、ツールの説明はすでに用途を明記しており、tool_choiceも既定のauto、つまりツールを呼ぶかどうかはClaudeに任されています。","残るのは「find・search・locate・look upと言われたら検索ツールを使え」というシステムプロンプトの一文で、これが説明文に基づく判断を上書きし、コードベースを調べる必要の無い依頼でも検索を呼ばせています。Anthropicのプロンプトガイドも、最近のモデルはシステムプロンプトによく従うため、ツールを使わせる強い言い回しは過剰な呼び出し（overtrigger）を招きやすく、普通の表現に戻すよう勧めています。したがって最初に直すべきは、このルールを実際にリポジトリやMCPのデータを調べる必要があるときだけに絞ることです。","説明の拡充や改名は原因の箇所を外しており、tool_choiceのanyは呼び出しを強制して悪化させます。","最初に直すべきなのは、症状を直接引き起こしている指示です。"],"ref":"https://platform.claude.com/docs/en/agents-and-tools/tool-use/define-tools"},{"n":53,"d":"プロンプトエンジニアリングと構造化出力","stem":["Claudeを使用して、構造化データ抽出システムを構築しています。このシステムは、購買発注書から情報を抽出し、JSONスキーマを使用して出力を検証し、高い精度を維持します。エッジケースを適切に処理し、下流のシステムと連携する必要があります。","検証ログを見ると、JSONは構文的に正しいものの、レビューキューには数量・金額の不整合フラグが大量に溜まっています。","フラグの多くは、無害な表記の違いによるものである","一方で、実際の計算ミスの一部は見逃されている","現在の指示は、「疑わしい合計を見つけてレビューにフラグを立ててください」となっています。"],"q":"一貫性を最も直接的に改善するプロンプトの変更はどれですか。","need":1,"opts":[{"t":"保守的に判断して、確信度の高い合計の異常だけをレビューに回すよう、指示を強める。","c":false,"e":["「確信度の高いものだけ」という絞り込みは、誤検知を減らしたい場合の方向づけにはなります。しかし確信度もまた主観的な基準で、どこから確信が高いかが測定できないため、無害な差異の過剰検出と実際のミスの見逃しの両方を同時には解決できません。"]},{"t":"最終的なJSONを出力する前に、疑わしい合計の異常をすべて説明するようClaudeに求める。","c":false,"e":["判断の理由を先に書かせることは、モデルの推論を確認したり精度を上げたりするのに役立つ場合があります。しかし「何を疑わしいとみなすか」という基準があいまいなままでは、説明が付いてもフラグを立てる線引きは実行ごとにぶれ続けます。"]},{"t":"あいまいなフラグ付け指示を、解析した明細項目が記載された合計と矛盾する場合の測定可能なルールに置き換える。","c":true,"e":["正解。「疑わしい合計」という基準は読み手によって解釈が変わり、モデルも実行ごとに異なる線引きをしてしまいます。解析した明細の合計と記載された合計が一致しない場合、というように測定できる条件に置き換えれば、無害な表記の違いは対象から外れ、実際の計算ミスは確実に拾えるようになります。"]},{"t":"温度（temperature）を上げて、Claudeが各発注書のレイアウトについてより多くの解釈を検討できるようにする。","c":false,"e":["temperatureを上げると出力の多様性が増すため、アイデア出しのような創造的なタスクで使われてきた設定です。一貫した判定を求める本問では逆効果で、そもそも最新モデルでは既定値以外のtemperatureは400エラーになります。"]}],"overall":["モデルの判定が一貫しないとき、多くの場合は指示の中の基準が測定できない言葉で書かれています。Anthropicのプロンプトガイドは明確で直接的な指示を与えることを基本原則に挙げ、評価設計のガイドも成功基準を具体的で測定可能にするよう求めています。","本問の「疑わしい合計を見つけてレビューにフラグを立ててください」は、何をもって疑わしいとするかが書かれていないため、無害な表記の違いに反応したり、実際の計算ミスを見逃したりと、判定が両方向にぶれています。明細の合計と記載された合計が矛盾する条件を数値で定義すれば、Claudeは同じ基準で毎回判定できます。","説明を求める案や「保守的に」「確信度が高いものだけ」といった言い換えは基準のあいまいさを残したままで、temperatureを上げる案は一貫性とは逆方向の変更です。","判定のぶれの多くは、指示の中に残った測れない言葉から生じます。"],"ref":"https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices"},{"n":54,"d":"ツール設計とMCP統合","stem":["ある可観測性エンジニアリングチームは、本番ログの分析中に、Claude Messages APIを使って異常マップを生成しています。この異常マップは、社内ダッシュボードで使われます。","現在のプロンプトには「このスキーマに一致するJSONのみを返してください」と書かれています。しかしログを見ると、次のような理由でパーサーが失敗することが時折あります。","余計なコメントが末尾に付く","フィールドが欠落する","配列が期待される箇所に文字列値が入る","ダッシュボード側の連携は、自由形式のアシスタントのテキストではなく、ツール呼び出しを受け取るように設計されています。"],"q":"スキーマに準拠した出力を最も確実に強制する変更はどれですか。","need":1,"opts":[{"t":"input_schemaを持つクライアントツールをstrict: trueで定義し、応答をtool_useとして受け取る。","c":true,"e":["正解。toolsに定義したクライアントツールのstrictをtrueにすると、Claudeがそのツールを呼び出すときの入力はinput_schemaに準拠することが保証され、必須フィールドの欠落や、配列の代わりに文字列が入るといった型の違いが起きなくなります。","応答は自由なテキストではなくtool_useブロックの入力として受け取るため、ツール呼び出しを受け取るダッシュボードの設計にそのまま合い、tool_choiceによる強制に頼らないので最新のモデルでも同じ構成が使えます。"]},{"t":"応答の後でパース済みのJSONを検証し、不正なダッシュボード用ペイロードを拒否するカスタムMCPサーバーを作成する。","c":false,"e":["パース後のJSONを検証して不正なペイロードを拒否する仕組みは、下流を守る最後の防御線としては有用です。しかし生成された後で弾くだけなので、不正な出力の発生そのものは減らず、拒否されたダッシュボード更新をどう復旧するかという問題も残ります。"]},{"t":"アシスタントの応答を開き波括弧でプリフィルし、停止シーケンスを追加して、返されたテキストをJSONとして解析する。","c":false,"e":["プリフィルは、以前はJSONなどの形式を強制する手段として使われていましたが、Claude 4.6以降のモデルでは最後のassistantターンのプリフィルがサポートされず、400エラーになります。仮に使えても得られるのは自由形式のテキストで、ツール呼び出しを受け取るダッシュボードの設計にも合いません。"]},{"t":"プロンプトにJSONスキーマを残したまま、有効なJSONしか受け付けないという強い言い回しを足し、パースに失敗したらリトライする。","c":false,"e":["スキーマをプロンプトに示して失敗時にリトライするのは、構造化出力の機能が使えない環境での次善策としては成り立ちます。本問ではすでに同じ趣旨の指示が失敗しており、言い回しを強めても末尾のコメントや型の不一致を構造的に防ぐことはできません。"]}],"overall":["モデルに特定の構造で出力させる方法は、プロンプトでの依頼、事後の検証、APIの機能による制約の3段階に分けて考えると整理できます。最も確実なのはAPIの機能による制約で、Claudeの場合はツール定義のstrictをtrueにしてツール入力をスキーマに準拠させる方法と、Structured outputsで応答本文をスキーマに準拠させる方法があります。","本問のダッシュボードは自由形式のテキストではなくツール呼び出しを受け取る設計なので、input_schemaを持つクライアントツールをstrictで定義し、応答をtool_useとして受け取る形が要件に直結します。公式ドキュメントは、Claude Opus 5.5などtool_choiceのanyやtoolによる強制が400エラーになるモデルでは、autoのままstrictなツールを組み合わせてスキーマ準拠の入力を保証するよう案内しており、どのツールを呼ぶかはプロンプトで促します。なお、この仕様は2026年9月のアップデートで変更されたもので、試験ガイド（2026年7月版）より新しいため、本試験では旧仕様（tool_choiceのanyやtoolでツールの使用を強制できる）を前提に出題される可能性があります。","事後検証のMCPサーバーは不正な出力の発生を防がず、指示の強化はすでに効かなかった手段で、プリフィルは新しいモデルでは使えません。","生成時に制約するのか、生成後に弾くのかという区別が、確実性の差を生みます。"],"ref":"https://platform.claude.com/docs/en/agents-and-tools/tool-use/define-tools"},{"n":55,"d":"エージェントアーキテクチャとオーケストレーション","stem":["あなたは、Claudeを使用して、企業合併のデューデリジェンス文書レビューを行う構造化データ抽出システムを構築しています。このシステムは、非構造化文書から情報を抽出し、JSONスキーマを使用して出力を検証し、高い精度を維持します。エッジケースを適切に処理し、下流のシステムと連携する必要があります。","テストでは、30ファイルからなる文書パケットをレビューする際に、すべての元ファイルとすべての抽出済みJSONオブジェクトを、1つのレビュー用プロンプトにまとめて送っています。この方法では、次の問題が起きています。","ファイル固有の抽出エラーを見落とすことが多い","パケット全体の合計値について、矛盾した結論を返すことがある","また、レビューの中間成果物を、ログに残して評価できるようにする必要があります。"],"q":"取るべき対応として、最も適切なものはどれですか。","need":1,"opts":[{"t":"明示的なプロンプトチェイニングでファイル単位のレビューを行い、その所見を別の統合呼び出しでまとめる。","c":true,"e":["正解。プロンプトチェイニングは、タスクを固定の段に分け、各段の出力を次の段が受け取る構成です。ファイルごとの呼び出しなら1回に扱う情報が絞られてファイル固有の誤りを見落としにくく、その所見はログに残して評価できる中間成果物になります。最後に別の呼び出しで所見を統合すれば、パケット全体の合計も一貫した手順で導けます。"]},{"t":"すべてのファイル・スキーマ・これまでのメモ・より厳格なチェック指示を含めた、さらに大きな1回のレビュー呼び出しを使う。","c":false,"e":["指示を厳しくしたり参照情報を加えたりするのは、情報が足りずに判断を誤っている場合の対処です。本問の問題は1回の呼び出しに情報を詰め込みすぎていることなので、プロンプトをさらに大きくすると、ファイル固有の誤りの見落としと合計値の矛盾はむしろ起きやすくなります。"]},{"t":"Claude自身に最終的な問題リストを返す前に自らの所見を批評させる、1回のレビュー呼び出しを使う。","c":false,"e":["自己批評を1回の呼び出しに組み込むのは、短い出力の品質を手軽に上げたいときには有効な工夫です。しかし30ファイル分の情報を1つのコンテキストで扱う構造はそのままで、ファイル単位の見落としは減らず、ログに残して評価できる中間成果物も得られません。"]},{"t":"低いtemperatureでパケット全体を対象としたレビュー呼び出しを繰り返し行い、複数回の実行で共通して現れた所見だけを採用する。","c":false,"e":["同じ処理を複数回実行して結果を突き合わせるのは、判断の確信度を上げたいときの並列化（投票）の手法です。しかしパケット全体を毎回1つのプロンプトで扱う限りファイル単位の見落としは解消せず、費用だけが増えます。なお、最新モデルでは既定値以外のtemperatureは400エラーになります。"]}],"overall":["1つの巨大なプロンプトに全ファイルと全抽出結果を詰め込むと、モデルは個々のファイルの細部に注意を払いにくくなり、全体の集計でも矛盾が生じやすくなります。Anthropicのエージェント設計ガイドは、タスクを固定の段に分割し、各段の出力を次の段で処理するプロンプトチェイニングを、1回の呼び出しを易しくする代わりに多少のレイテンシを受け入れて精度を上げるパターンとして紹介しています。段と段の間で出力を検査することもできます。","本問では、ファイル単位のレビュー呼び出しで見落としを減らし、その所見を中間成果物としてログに残し、最後に統合用の呼び出しでパケット全体の合計を導く設計が、3つの要求すべてに応えます。","1回の呼び出しでの自己批評、同じプロンプトの反復、さらに大きなプロンプトは、どれも1つの巨大なコンテキストに頼ったままです。","「中間成果物が必要」という条件は、処理を段に分けるべきだという強いヒントです。"],"ref":"https://www.anthropic.com/engineering/building-effective-agents"},{"n":56,"d":"ツール設計とMCP統合","stem":["Claudeを使用して、構造化データ抽出システムを構築しています。このシステムは、非構造化文書から情報を抽出し、JSONスキーマを使用して出力を検証し、高い精度を維持します。エッジケースを適切に処理し、下流のシステムと連携する必要があります。","チームは、classify_document、extract_claim_fields、validate_extraction、queue_human_reviewという名前のクライアントツールを追加しました。文書によって性質が大きく異なり、次のようなものがあります。","複数回の検証パスが必要な記録","レビューに回すべき記録","ツール呼び出しが一切不要な依頼"],"q":"文書ごとにClaudeが次の行動を変えられるようにしつつ、ツールの実行はアプリケーション側が受け持つ設計として、最も適したものはどれですか。（2つ選択してください。）","need":2,"opts":[{"t":"tool_choiceをデフォルトのauto（自動）の挙動のままにし、ツール呼び出しが不要な依頼にはツールを呼ばずに応答できる状態を保つ。","c":true,"e":["正解。tool_choiceのautoはツールが与えられたときの既定値で、ツールを呼ぶかどうかをClaude自身に判断させます。ツール呼び出しが不要な依頼にはそのまま文章で答えられるため、anyやtoolで毎ターン呼び出しを強制する設定と違い、文書ごとの適応を損ないません。"]},{"t":"classify_document、extract_claim_fields、validate_extraction、queue_human_reviewを常にこの順番で呼び出す固定のコントローラーを構築する。","c":false,"e":["固定の順序で処理を呼ぶコントローラーは、すべての入力が同じ手順を踏むと分かっているワークフローなら、予測しやすく監査もしやすい設計です。本問は文書によって必要な検証の回数やレビューの要否が異なり、ツールが不要な依頼もあるため、常に同じ順序で全ツールを呼ぶ構成では適応できません。"]},{"t":"明確な説明とスキーマでツールを定義し、各tool_useリクエストを実行して対応するtool_resultブロックを返すループを実行する。","c":true,"e":["正解。ツールを明確な説明とスキーマで定義し、Claudeが返すtool_useをアプリケーションのループで実行してtool_resultを返す形は、クライアントツールの標準的な使い方です。どのツールを何回呼ぶか、そもそも呼ぶかはClaudeが文書ごとに判断し、実際の実行は常にアプリケーション側に残るため、要件の両方を満たします。"]},{"t":"Claudeの自然言語による応答を解析し、「検証が必要」のようなフレーズを探して、対応する抽出ツールを呼び出す。","c":false,"e":["応答の文章からキーワードを拾って処理を分岐させる方法は、ツール利用の機能が無かった頃の簡易的な手法です。言い回しの揺れに弱く壊れやすいうえ、Claudeが構造化されたtool_useで呼び出したいツールと引数を示せる仕組みを活かせていません。"]}],"overall":["Claudeにツールを使わせる基本形は、アプリケーションがツールを定義し、Claudeがtool_useで呼び出しを要求し、アプリケーションが実行してtool_resultを返す、というループです。公式のツール利用の概要が説明するとおり、クライアントツールの実行はアプリケーションの責任で、Claudeはどのツールを使うかと引数を決めます。tool_choiceの既定値であるautoは、ツールを呼ぶかどうかの判断もClaudeに任せる設定です。","本問は、文書によって検証を複数回行う、レビューに回す、ツールを使わずに答える、と次の行動が変わる状況なので、明確に定義したツールをループで実行し、tool_choiceをautoのままにする2つの選択が要件に合います。","固定順序のコントローラーは適応性を失い、文章中のキーワード解析は構造化された呼び出しの仕組みを使っていません。","Claudeに判断させる部分とアプリケーションが実行する部分の境界が、ツール利用の設計を読み解く軸です。"],"ref":"https://platform.claude.com/docs/en/agents-and-tools/tool-use/overview"},{"n":57,"d":"Claude Codeの設定とワークフロー","stem":["Claudeを使用して、構造化データ抽出システムを構築しています。このシステムは、非構造化文書から情報を抽出し、JSONスキーマを使用して出力を検証し、高い精度を維持します。エッジケースを適切に処理し、下流のシステムと連携する必要があります。","スキーマを更新した後、次の3つの抽出失敗が同時に発生しました。","キャリアの別名解決","配送日の正規化","運賃の合計照合","どの失敗も同じパーサーモジュールと共有のテストフィクスチャに関わっており、1つを単独で修正すると別の1つを壊してしまう状態が続いています。"],"q":"このチームが次に使うべきClaude Codeのワークフローはどれですか。（2つ選択してください。）","need":2,"opts":[{"t":"変更範囲をパーサーモジュールと共有フィクスチャに限定し、無関係な下流の整理は今回含めない。","c":true,"e":["正解。複数のファイルにまたがる壊れやすい修正では、変更範囲をパーサーモジュールと共有フィクスチャに絞り、無関係な下流のクリーンアップを混ぜないことが重要です。範囲が小さければ、検証で失敗が再発したときにどの変更が原因かをすぐに切り分けられます。変更してよいファイルを依頼の中で明示しておけば、Claudeが関係の無い箇所まで手を広げることも防げます。"]},{"t":"現在の会話をそのまま続け、検証を実行するたびに残っている失敗をその都度修正していく。","c":false,"e":["同じ会話で検証と修正を繰り返すのは、失敗の原因が1つに絞れている場合には素直な進め方です。しかし依存関係を整理しないまま検証結果に反応して直していくと、モグラ叩きのように別の失敗を再発させ、会話のコンテキストも試行錯誤の履歴で膨らんでいきます。"]},{"t":"失敗しているすべてのフィクスチャ、共有のスキーマ制約、検証コマンドを揃えてプランモードを開始する。","c":true,"e":["正解。3つの失敗が同じパーサーモジュールと共有フィクスチャに絡んでいる状況では、1件ずつ直すと別の1件を壊す悪循環に陥ります。プランモードではClaudeはソースファイルを変更せずに調査と計画だけを行うため、失敗しているフィクスチャ・共有のスキーマ制約・検証コマンドをまとめて渡し、相互の依存を踏まえた修正計画を先に固められます。"]},{"t":"失敗しているフィクスチャごとに直接編集を個別に実行し、検証コマンドの合間にコンテキストをクリアする。","c":false,"e":["フィクスチャごとに直接編集してコンテキストをクリアする進め方は、互いに独立した小さな修正を順に片付けるなら効率的です。しかし本問の3つの失敗は同じモジュールを共有しており、クリアのたびに相互依存の全体像が失われるため、これまでと同じく1つを直すと別の1つが壊れる状況を繰り返します。"]}],"overall":["Claude Codeのプランモードは、ソースファイルを変更せずにコードベースを調べ、変更の計画を立てるためのモードです。公式のベストプラクティスは、進め方に確信が持てないとき、変更が複数のファイルに及ぶとき、よく知らないコードを変えるときに計画を立てる価値が高いとしています。","本問では、スキーマ更新の後に3つの抽出失敗が同じパーサーモジュールと共有フィクスチャに絡み合って発生し、1つを単独で直すと別の1つが壊れることが繰り返されています。これはまさに、相互の依存を把握してから手を動かすべき状況です。失敗しているフィクスチャ・共有の制約・検証コマンドを揃えてプランモードで計画を立てることと、変更範囲をパーサーと共有フィクスチャに限定することが、この悪循環を断ち切ります。","個別に直接編集してコンテキストをクリアする案や、検証のたびに場当たり的に直す案は、依存関係を見ないまま変更を重ねます。","「直すたびに別の箇所が壊れる」という記述は、計画から始めるべきだという合図です。"],"ref":"https://code.claude.com/docs/en/permission-modes"},{"n":58,"d":"コンテキスト管理と信頼性","stem":["あるSaaS企業の開発ツールチームは、Claude Code上に構築したPRレビューヘルパーを運用しています。このヘルパーはプッシュのたびに実行され、GitHub上にインラインコメントを投稿します。","しかし、後続の実行では、以前の実行ですでに指摘した内容を繰り返し報告してしまうことがよくあります。このチームは、まだ解消されていない問題は隠さずに、繰り返し実行されるレビューを役に立つものにしたいと考えています。"],"q":"このチームが行うべき変更はどれですか。（2つ選択してください。）","need":2,"opts":[{"t":"ファイルパスと行番号の一致だけを基準に重複を排除してから、後続のコメントを投稿する。","c":false,"e":["パスと行番号による重複排除は、同じ実行の中で同じ指摘が二重に出るのを防ぐような機械的な整理には使えます。しかし同じ行に問題が残っている場合も「前に指摘済み」として消してしまうため、まだ存在する問題を隠さないという要件に反します。"]},{"t":"以前のPRの指摘事項を永続化し、各再実行に渡して、新規または未解消の問題だけを報告するよう指示する。","c":true,"e":["正解。各実行は独立したセッションとして始まるため、以前の実行で何を指摘したかは、保存して渡さない限り新しい実行のコンテキストに存在しません。過去の指摘を永続化して再実行時に入力し、新規または未解消のものだけを報告するよう指示すれば、Claudeは指摘ごとに「対応済みかどうか」を判断材料にできます。"]},{"t":"後続のレビューを手動リクエストに切り替え、繰り返しコメントを生成する価値があるかを開発者に判断させる。","c":false,"e":["手動リクエストへの切り替えは、レビューの実行コストを抑えたいときや、変更の大きいPRだけを確認したいときの運用上の選択肢です。しかし繰り返しの指摘をどう判定するかという課題はそのまま残り、プッシュごとに自動で役立つレビューを返すという目的も失われます。"]},{"t":"以前に指摘した箇所のコードを毎回あらためて確認し、問題が依然として残っている場合にだけ再度報告する。","c":true,"e":["正解。以前指摘した箇所の現在のコードを確かめ、問題が残っているときだけ再報告するという手順は、報告の要否を位置ではなく問題の状態で決めるものです。対応済みの指摘は繰り返さず、まだ直っていない問題は隠さないという2つの要件を同時に満たします。"]}],"overall":["プッシュのたびに走るレビューは、毎回まっさらなコンテキストで始まります。前回の実行で何を指摘したかという状態は、どこかに保存して次の実行へ渡さない限り引き継がれません。Anthropicのコンテキストエンジニアリングの解説でも、エージェントがコンテキストの外に記録を残し、後の作業で読み戻す構造化メモの手法が、過去の作業を参照し続けるための基本として紹介されています。","本問では、過去の指摘を永続化して再実行に渡すことが状態の引き継ぎにあたり、指摘箇所を再確認して残っているものだけを報告することが、報告の要否を問題の状態で決める手順にあたります。","パスと行番号の一致で機械的に除外する案は未解消の問題まで隠し、手動実行への切り替えは判定の課題を人に移すだけです。","「重複を消す」ことと「解決済みを消す」ことは別物だと意識すると、正しい2つを見分けられます。"],"ref":"https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents"},{"n":59,"d":"エージェントアーキテクチャとオーケストレーション","stem":["ある保険会社の請求処理自動化チームは、Claudeを使用して構造化データ抽出システムを構築しています。このシステムは、非構造化文書である請求書類から情報を抽出し、JSONスキーマを使用して出力を検証し、高い精度を維持する必要があります。","抽出コーディネーターには、表解析・条項抽出・スキーマ修復を担当する専門サブエージェントが用意されていますが、SDKの設定ではファイル閲覧系のツールしか自動承認されていません。そのため、コーディネーターは個別のサブタスクを委任せず、抽出作業をすべて自分自身で行い続けています。"],"q":"このチームが行うべき変更はどれですか。（2つ選択してください。）","need":2,"opts":[{"t":"各専門サブエージェントを、agentsオプションか.claude/agents配下のファイルとして定義する。","c":true,"e":["正解。Claudeが委任先を選ぶ手がかりは、各サブエージェントの定義に書かれたdescriptionです。agentsオプション（SDKでの推奨）や.claude/agents配下のファイルで表解析・条項抽出・スキーマ修復の担当を定義しておくと、コーディネーターはタスクに合う専門家を名前で指定して任せられます。"]},{"t":"permissionModeをbypassPermissionsに変更し、コーディネーターのツール設定と委任の指示はそのまま残す。","c":false,"e":["bypassPermissionsは承認プロンプトを出さずにツールを実行させるモードで、隔離された検証環境で人の確認を省きたいときに使われます。allowedToolsはこのモードを制限しないため、BashやWriteまで無条件に通ってしまいます。委任先のサブエージェントを用意する設定でもないので、権限を過剰に広げるだけで本問の原因には届きません。"]},{"t":"コーディネーターのallowedTools（Pythonではallowed_tools）にAgentを追加する。","c":true,"e":["正解。Agent SDKのサブエージェントはAgentツールを通じて呼び出され、公式ドキュメントの構成例でもRead・Grep・Globと並べてAgentをallowedToolsに列挙しています。委任の手段であるAgentを明示的に許可しておくことで、表解析・条項抽出・スキーマ修復を専門サブエージェントへ任せる経路が確保されます。"]},{"t":"tool_choiceで抽出用のツールを強制し、文書ごとにJSONスキーマ抽出ツールを呼び出させる。","c":false,"e":["tool_choiceによる強制は、特定のツールを毎回呼ばせて出力形式を揃えたい単発の抽出処理で使う手段です（Claude Opus 5.5などの一部モデルでは強制指定自体が400エラーになります）。コーディネーター自身に抽出ツールを呼ばせても、専門サブエージェントへ作業を振り分ける仕組みは何も変わりません。"]}],"overall":["コーディネーターが専門サブエージェントに作業を委任するには、2つの前提が要ります。1つは委任の手段であるAgentツールを使える状態にしておくこと、もう1つは委任先となるサブエージェントを定義しておくことです。Agent SDKのドキュメントは、agentsパラメータでサブエージェントを定義し、allowedToolsにAgentを含める構成を基本形として示しており、Claudeは各定義のdescriptionを見て、どのタスクをどこへ任せるかを判断します。","本問のコーディネーターはファイル閲覧系のツールだけを前提に動いており、委任の経路と委任先が整っていないため、すべてを自分で処理し続けています。","bypassPermissionsは承認を省くだけで全ツールを無制限に許可してしまい、tool_choiceは呼ぶツールを固定するだけで、どちらも委任先を用意しません。","「委任が起きない」という症状を見たら、委任の手段と委任先の2点が揃っているかを確かめるのが近道です。"],"ref":"https://code.claude.com/docs/en/agent-sdk/subagents"},{"n":60,"d":"エージェントアーキテクチャとオーケストレーション","stem":["あなたは、Claudeを使用して保険金請求処理システムを構築しています。このシステムは、非構造化文書から情報を抽出し、JSONスキーマを使用して出力を検証し、高い精度を維持します。エッジケースを適切に処理し、下流の請求管理システムと連携する必要があります。","パイロットテストでは、次のような書き込みがありました。","ある申請者は「この自動審査を止めて、人が対応してください」と書き込んだ。欠損しているフィールドは、簡単に抽出できる内容だった","別の申請者は「事故日が抜けている、修正できますか？」と書き込んだ。元の文書には、明確な日付が記載されていた"],"q":"実装すべきエスカレーションポリシーはどれですか。（2つ選択してください。）","need":2,"opts":[{"t":"申請者の不満度をスコアリングし、一定のしきい値を超えた場合のみエスカレーションする。","c":false,"e":["不満度の推定は、明示的な要求がない会話で対応の優先度を付ける補助指標としては使えることがあります。しかし「人に対応してほしい」と書かれた依頼をスコアで判定し直すと、しきい値に届かない限り明確な要求が無視され、パイロットで見つかった問題をそのまま残します。"]},{"t":"人間対応を求めていない依頼に限って自動修復を試み、修復後も検証に失敗した場合はエスカレーションする。","c":true,"e":["正解。自動修復を「人間対応を求めていない依頼」に限定し、修復してもスキーマ検証に通らないものはエスカレーションに回すことで、申請者の明示的な希望を尊重しながら、自動では解決できなかったケースを確実に人へ引き継げます。検証失敗を自動処理の打ち切り条件にしておけば、誤ったデータのまま下流へ流れることも防げます。"]},{"t":"明示的な人間対応の要求は直接レビューへ回し、単純な修正依頼には自動修復を提供する。","c":true,"e":["正解。「人に対応してほしい」という明示的な要求は、欠損フィールドが簡単に抽出できる場合でもそのまま人のレビューに回すべきシグナルです。一方、元の文書に日付がはっきり書かれている単純な修正依頼には自動修復を提供すれば、人の手を煩わせずに解決でき、処理効率とユーザーの意図の尊重を両立できます。"]},{"t":"欠損フィールドの抽出の難しさを見積もり、簡単なものは自動修復に、難しいものはレビューに回す。","c":false,"e":["抽出の難易度で振り分けるのは、明示的な要求が無い依頼の中で人手をどこに割くかを決める運用ルールとしては合理的です。しかし本問の1件目は、欠損フィールドが簡単に抽出できるにもかかわらず申請者が人の対応を求めているケースで、難易度で判定すると自動修復に回され、明確な要求が無視されてしまいます。"]}],"overall":["エスカレーションの設計では、何をきっかけに人へ引き継ぐかを明確に決めておくことが重要です。Anthropicのエージェント設計ガイドは、エージェントが判断に迷う場面や人の確認が必要な場面で処理を止め、人間のフィードバックを受けられるチェックポイントを設けることを勧めています。","本問では、ユーザーが明示的に人の対応を求めたケースと、元の文書から確実に直せる単純な修正依頼という、性質の違う2つの入力が示されています。前者は内容の難易度に関係なく人へ回し、後者には自動修復を用意したうえで、修復後も検証に失敗したら人へ引き継ぐ、という組み合わせが要件に合います。","不満度のスコアや抽出の難易度で判断する案は、明示的な要求という最も確かなシグナルを別の基準に置き換えてしまいます。","ユーザーがはっきり意思表示している場面では、推測による判定を挟まないことが原則です。"],"ref":"https://www.anthropic.com/engineering/building-effective-agents"}]</script>
<script>
(function(){
  var Q = JSON.parse(document.getElementById('qdata').textContent);
  var N = Q.length;
  var LET = ['ア','イ','ウ','エ','オ'];
  var KEY = 'ccar-f-quiz-v1';
  var st = { cur: 0, ans: {}, view: 'quiz' };
  var main = document.getElementById('main');
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- 保存と復元（失敗しても動作に影響しない） ---------- */
  try {
    var raw = localStorage.getItem(KEY);
    if (raw) {
      var o = JSON.parse(raw);
      if (o && typeof o === 'object') {
        var c = parseInt(o.cur, 10);
        if (!isNaN(c)) st.cur = Math.min(Math.max(c, 0), N - 1);
        if (o.ans && typeof o.ans === 'object') {
          Q.forEach(function(q){
            var a = o.ans[q.n];
            if (a && Array.isArray(a.sel)) {
              var sel = a.sel.filter(function(i){ return Number.isInteger(i) && i >= 0 && i < q.opts.length; });
              sel = sel.filter(function(v, k){ return sel.indexOf(v) === k; }).slice(0, q.need);
              var checked = !!a.checked && sel.length === q.need;
              st.ans[q.n] = { sel: sel, checked: checked };
            }
          });
        }
      }
    }
  } catch (e) {}
  function save(){ try { localStorage.setItem(KEY, JSON.stringify({ cur: st.cur, ans: st.ans })); } catch (e) {} }

  /* ---------- 小道具 ---------- */
  function el(tag, attrs, kids){
    var n = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function(k){
      if (k === 'class') n.className = attrs[k];
      else if (k === 'text') n.textContent = attrs[k];
      else n.setAttribute(k, attrs[k]);
    });
    (kids || []).forEach(function(c){ if (c) n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return n;
  }
  function isItem(t){ return !/[。！？!?]$/.test(t) && t.length <= 90 && t.indexOf('\n') < 0; }
  function blocks(paras, parent){
    var ul = null;
    paras.forEach(function(p){
      if (isItem(p)) {
        if (!ul) { ul = el('ul'); parent.appendChild(ul); }
        ul.appendChild(el('li', { text: p }));
      } else { ul = null; parent.appendChild(el('p', { text: p })); }
    });
  }
  function plain(paras, parent){ paras.forEach(function(p){ parent.appendChild(el('p', { text: p })); }); }
  function isCorrect(q, sel){
    if (sel.length !== q.need) return false;
    return q.opts.every(function(o, i){ return o.c === (sel.indexOf(i) >= 0); });
  }
  function statusOf(q){
    var a = st.ans[q.n];
    if (!a) return 'none';
    if (a.checked) return isCorrect(q, a.sel) ? 'ok' : 'ng';
    return a.sel.length ? 'sel' : 'none';
  }
  function letters(q, idxs){
    return idxs.slice().sort(function(a, b){ return a - b; }).map(function(i){ return LET[i]; }).join('・');
  }
  function toTop(){ window.scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' }); }

  /* ---------- サイドバー ---------- */
  function renderSide(){
    var ok = 0, ng = 0;
    Q.forEach(function(q){ var s = statusOf(q); if (s === 'ok') ok++; else if (s === 'ng') ng++; });
    var done = ok + ng;
    var sc = document.getElementById('score');
    sc.textContent = '';
    sc.appendChild(document.createTextNode('回答済み '));
    sc.appendChild(el('b', { text: done + ' / ' + N }));
    sc.appendChild(document.createTextNode('　正解 '));
    sc.appendChild(el('b', { text: String(ok) }));
    document.getElementById('barfill').style.width = (done / N * 100) + '%';
    var grid = document.getElementById('grid');
    grid.textContent = '';
    Q.forEach(function(q, i){
      var s = statusOf(q);
      var label = '問題' + q.n + (s === 'ok' ? ' 正解' : s === 'ng' ? ' 不正解' : s === 'sel' ? ' 選択中' : ' 未回答');
      var b = el('button', { type: 'button', class: 'dot', 'data-s': s, 'aria-label': label, text: String(q.n) });
      if (st.view === 'quiz' && i === st.cur) b.setAttribute('aria-current', 'true');
      b.addEventListener('click', function(){ go(i); });
      grid.appendChild(b);
    });
  }

  /* ---------- 問題画面 ---------- */
  function renderQuestion(){
    var q = Q[st.cur];
    var a = st.ans[q.n] || { sel: [], checked: false };
    var multi = q.need > 1;
    main.textContent = '';
    var sheet = el('section', { class: 'sheet', 'aria-label': '問題' + q.n });

    var head = el('div', { class: 'qhead' }, [
      el('span', { class: 'qno', text: '問題 ' + q.n }),
      el('span', { class: 'qtotal', text: '／ ' + N }),
      multi ? el('span', { class: 'tag', text: '複数選択（' + q.need + 'つ）' }) : null,
      q.d ? el('span', { class: 'domain', text: q.d }) : null
    ]);
    sheet.appendChild(head);

    var stem = el('div', { class: 'stem' });
    blocks(q.stem, stem);
    sheet.appendChild(stem);
    sheet.appendChild(el('p', { class: 'prompt', text: q.q }));

    var correctNow = a.checked && isCorrect(q, a.sel);
    if (a.checked) {
      var cls = correctNow ? 'banner ok' : 'banner ng';
      var correctIdx = []; q.opts.forEach(function(o, i){ if (o.c) correctIdx.push(i); });
      var banner = el('div', { class: cls, id: 'banner', tabindex: '-1', role: 'status' }, [
        el('h2', { text: correctNow ? '正解です' : '不正解です' }),
        el('p', { text: correctNow
          ? '選んだ答え：' + letters(q, a.sel)
          : '正解は ' + letters(q, correctIdx) + ' です。あなたの回答：' + letters(q, a.sel) })
      ]);
      sheet.appendChild(banner);
    }

    var ol = el('ol', { class: 'opts' + (multi ? ' multi' : ''), role: multi ? 'group' : 'radiogroup', 'aria-label': '選択肢' });
    var btns = [];
    q.opts.forEach(function(o, i){
      var picked = a.sel.indexOf(i) >= 0;
      var li = el('li', { class: 'opt' + (a.checked ? (o.c ? ' ok' : ' ng') + (picked ? ' picked' : '') : '') });
      var b = el('button', {
        type: 'button',
        class: 'choice' + (picked && !a.checked ? ' on' : ''),
        role: multi ? 'checkbox' : 'radio',
        'aria-checked': picked ? 'true' : 'false'
      }, [
        el('span', { class: 'mark', 'aria-hidden': 'true', text: LET[i] }),
        el('span', { class: 'txt', text: o.t })
      ]);
      if (a.checked) {
        b.setAttribute('aria-disabled', 'true');
        var meta = el('span', { class: 'meta' }, [
          o.c ? el('span', { class: 'pill ok', text: '✓ 正解の選択肢' }) : el('span', { class: 'pill ng', text: '✕ 誤りの選択肢' }),
          picked ? el('span', { class: 'pill me', text: 'あなたの回答' }) : null
        ]);
        b.appendChild(meta);
        b.addEventListener('click', function(e){ e.preventDefault(); });
      } else {
        b.addEventListener('click', function(){ pick(i); });
      }
      btns.push(b);
      li.appendChild(b);
      if (a.checked) {
        var why = el('div', { class: 'why' }, [ el('h3', { text: '解説' }) ]);
        plain(o.e, why);
        li.appendChild(why);
      }
      ol.appendChild(li);
    });
    sheet.appendChild(ol);

    var hint = el('p', { class: 'hint', id: 'hint', 'aria-live': 'polite' });
    if (!a.checked) sheet.appendChild(hint);

    if (a.checked) {
      var ov = el('section', { class: 'overall', 'aria-label': '全体的な説明' }, [ el('h2', { text: '全体的な説明' }) ]);
      blocks(q.overall, ov);
      if (q.ref) {
        var r = el('p', { class: 'ref' }, [ document.createTextNode('参考：') ]);
        var link = el('a', { href: q.ref, target: '_blank', rel: 'noopener noreferrer', text: q.ref });
        r.appendChild(link);
        ov.appendChild(r);
      }
      sheet.appendChild(ov);
    }

    /* 操作ボタン */
    var prev = el('button', { type: 'button', class: 'btn', text: '前の問題' });
    if (st.cur === 0) prev.disabled = true;
    prev.addEventListener('click', function(){ go(st.cur - 1); });

    var right = el('div', { class: 'grow' });
    var primary;
    if (!a.checked) {
      primary = el('button', { type: 'button', class: 'btn primary', id: 'btnCheck', text: '回答を確認' });
      primary.disabled = a.sel.length !== q.need;
      primary.addEventListener('click', check);
      right.appendChild(primary);
    } else {
      var retry = el('button', { type: 'button', class: 'btn', text: 'この問題をやり直す' });
      retry.addEventListener('click', function(){ delete st.ans[q.n]; save(); render(); });
      right.appendChild(retry);
      var last = st.cur === N - 1;
      primary = el('button', { type: 'button', class: 'btn primary', text: last ? '結果を見る' : '次の問題へ' });
      primary.addEventListener('click', function(){ if (last) showResult(); else go(st.cur + 1); });
      right.appendChild(primary);
    }
    sheet.appendChild(el('div', { class: 'actions' }, [ prev, right ]));
    main.appendChild(sheet);

    /* 選択状態の更新（再描画せず、フォーカスを保つ） */
    function paint(){
      var cur = st.ans[q.n] || { sel: [], checked: false };
      btns.forEach(function(b, i){
        var on = cur.sel.indexOf(i) >= 0;
        b.setAttribute('aria-checked', on ? 'true' : 'false');
        b.classList.toggle('on', on);
      });
      var cb = document.getElementById('btnCheck');
      if (cb) cb.disabled = cur.sel.length !== q.need;
      hint.textContent = multi
        ? q.need + 'つ選んでください（現在 ' + cur.sel.length + ' / ' + q.need + '）'
        : (cur.sel.length ? '' : '1つ選んでください');
      renderSide();
    }
    function pick(i){
      var cur = st.ans[q.n];
      if (cur && cur.checked) return;
      if (!cur) { cur = { sel: [], checked: false }; st.ans[q.n] = cur; }
      if (!multi) { cur.sel = [i]; }
      else {
        var k = cur.sel.indexOf(i);
        if (k >= 0) cur.sel.splice(k, 1);
        else if (cur.sel.length < q.need) cur.sel.push(i);
        else { hint.textContent = '選べるのは' + q.need + 'つまでです。選択を外してから選び直してください。'; return; }
      }
      save();
      paint();
    }
    function check(){
      var cur = st.ans[q.n];
      if (!cur || cur.sel.length !== q.need) return;
      cur.checked = true;
      save();
      render();
      var bn = document.getElementById('banner');
      if (bn) {
        bn.scrollIntoView({ block: 'start', behavior: reduce ? 'auto' : 'smooth' });
        bn.focus({ preventScroll: true });
      }
    }
    if (!a.checked) paint();
  }

  /* ---------- 結果画面 ---------- */
  function renderResult(){
    var ok = [], ng = [], un = [];
    Q.forEach(function(q, i){
      var s = statusOf(q);
      if (s === 'ok') ok.push(i); else if (s === 'ng') ng.push(i); else un.push(i);
    });
    var done = ok.length + ng.length;
    main.textContent = '';
    var sheet = el('section', { class: 'sheet result', 'aria-label': '結果' });
    sheet.appendChild(el('h2', { text: done === 0 ? 'まだ回答がありません' : N + '問中 ' + ok.length + '問 正解' }));
    if (done > 0) {
      var pct = Math.round(ok.length / done * 100);
      sheet.appendChild(el('p', { class: 'lead', text: '回答済み ' + done + '問のうち ' + ok.length + '問が正解（正答率 ' + pct + '%）。' + (un.length ? '未回答は ' + un.length + '問です。' : '') }));
    } else {
      sheet.appendChild(el('p', { class: 'lead', text: '問題を解くと、ここに結果がまとまります。' }));
    }
    if (ng.length) {
      sheet.appendChild(el('h3', { text: '不正解だった問題' }));
      var c1 = el('div', { class: 'chips' });
      ng.forEach(function(i){
        var b = el('button', { type: 'button', class: 'chip', text: '問題' + Q[i].n });
        b.addEventListener('click', function(){ go(i); });
        c1.appendChild(b);
      });
      sheet.appendChild(c1);
    }
    if (un.length && done > 0) {
      sheet.appendChild(el('h3', { text: '未回答の問題' }));
      var c2 = el('div', { class: 'chips' });
      un.forEach(function(i){
        var b = el('button', { type: 'button', class: 'chip un', text: '問題' + Q[i].n });
        b.addEventListener('click', function(){ go(i); });
        c2.appendChild(b);
      });
      sheet.appendChild(c2);
    }
    if (done > 0) {
      var doms = [], map = {};
      Q.forEach(function(q){
        var d = q.d || 'その他';
        if (!map[d]) { map[d] = { name: d, total: 0, done: 0, ok: 0 }; doms.push(map[d]); }
        map[d].total++;
        var s = statusOf(q);
        if (s === 'ok') { map[d].done++; map[d].ok++; } else if (s === 'ng') { map[d].done++; }
      });
      sheet.appendChild(el('h3', { text: 'ドメイン別の結果' }));
      var tbl = el('div', { class: 'dom-list' });
      doms.forEach(function(m){
        var pct = m.done ? Math.round(m.ok / m.done * 100) : 0;
        var row = el('div', { class: 'dom-row' }, [
          el('span', { class: 'dom-name', text: m.name }),
          el('span', { class: 'dom-score', text: m.done ? m.ok + ' / ' + m.done + '問（' + pct + '%）' : '未回答' }),
          el('span', { class: 'dom-bar', 'aria-hidden': 'true' }, [ el('i', { style: 'width:' + (m.done ? pct : 0) + '%' }) ])
        ]);
        tbl.appendChild(row);
      });
      sheet.appendChild(tbl);
    }
    var acts = el('div', { class: 'actions' });
    var back = el('button', { type: 'button', class: 'btn', text: '問題に戻る' });
    back.addEventListener('click', function(){ go(st.cur); });
    var grow = el('div', { class: 'grow' });
    if (ng.length) {
      var redo = el('button', { type: 'button', class: 'btn primary', text: '不正解の問題を解き直す' });
      redo.addEventListener('click', function(){
        ng.forEach(function(i){ delete st.ans[Q[i].n]; });
        go(ng[0]);
      });
      grow.appendChild(redo);
    }
    acts.appendChild(back);
    acts.appendChild(grow);
    sheet.appendChild(acts);
    main.appendChild(sheet);
  }

  /* ---------- 画面遷移 ---------- */
  function render(){
    renderSide();
    if (st.view === 'result') renderResult(); else renderQuestion();
  }
  function go(i){
    st.cur = Math.min(Math.max(i, 0), N - 1);
    st.view = 'quiz';
    save();
    render();
    toTop();
  }
  function showResult(){ st.view = 'result'; render(); toTop(); }

  document.getElementById('btnResult').addEventListener('click', showResult);
  var rb = document.getElementById('btnReset');
  var rbTimer = null;
  rb.addEventListener('click', function(){
    if (rb.getAttribute('data-arm') === '1') {
      clearTimeout(rbTimer);
      rb.removeAttribute('data-arm');
      rb.textContent = '最初からやり直す';
      st.ans = {}; st.cur = 0; st.view = 'quiz';
      save(); render(); toTop();
    } else {
      rb.setAttribute('data-arm', '1');
      rb.textContent = 'もう一度押すと全回答を消去';
      rbTimer = setTimeout(function(){ rb.removeAttribute('data-arm'); rb.textContent = '最初からやり直す'; }, 4000);
    }
  });
  if (window.innerWidth < 860) document.getElementById('navd').removeAttribute('open');

  render();
})();
</script>
</body>
</html>
