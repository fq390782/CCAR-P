<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Claude Developer 問題集</title>
<style>
:root{
  --bg:#F1F4F9; --paper:#FFFFFF; --soft:#F5F7FB;
  --ink:#16223B; --ink2:#4B5875; --line:#D3DAE8; --line2:#B5BFD4;
  --accent:#2D4FD6; --on-accent:#FFFFFF; --sel:#E8EDFF;
  --ok:#16775A; --ok-bg:#E3F3EB; --ok-solid:#16775A;
  --ng:#B3392D; --ng-bg:#FBE8E5; --ng-solid:#B3392D;
  --on-solid:#FFFFFF;
  --sans:Meiryo,"メイリオ","Hiragino Kaku Gothic ProN",sans-serif;
  --serif:var(--sans);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1424; --paper:#151D31; --soft:#1A233B;
    --ink:#E8EDF9; --ink2:#A2AEC9; --line:#2B3555; --line2:#44527A;
    --accent:#8EA5FF; --on-accent:#0E1424; --sel:#1F2A52;
    --ok:#6FDBAC; --ok-bg:#12332A; --ok-solid:#4CC79A;
    --ng:#FF9488; --ng-bg:#3A1D1B; --ng-solid:#FF9488;
    --on-solid:#0E1424;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1424; --paper:#151D31; --soft:#1A233B;
  --ink:#E8EDF9; --ink2:#A2AEC9; --line:#2B3555; --line2:#44527A;
  --accent:#8EA5FF; --on-accent:#0E1424; --sel:#1F2A52;
  --ok:#6FDBAC; --ok-bg:#12332A; --ok-solid:#4CC79A;
  --ng:#FF9488; --ng-bg:#3A1D1B; --ng-solid:#FF9488;
  --on-solid:#0E1424;
  color-scheme:dark;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 12px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.8;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.shell{display:grid;grid-template-columns:292px minmax(0,1fr);gap:36px;max-width:1120px;margin:0 auto;padding:28px 20px 72px}
.side{align-self:start;position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);max-height:calc(100vh - 32px);overflow:auto;padding-right:2px}
.side h1{font-family:var(--serif);font-weight:700;font-size:23px;line-height:1.45;margin:0 0 4px;letter-spacing:.02em}
.side .sub{margin:0 0 18px;color:var(--ink2);font-size:13px}
.score{margin:0 0 8px;font-size:14px;font-variant-numeric:tabular-nums}
.score b{font-weight:700}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-bottom:18px}
.bar i{display:block;height:100%;background:var(--accent);width:0}
details.nav{margin:0 0 18px}
details.nav summary{cursor:pointer;font-weight:700;font-size:14px;padding:6px 0;list-style:none}
details.nav summary::-webkit-details-marker{display:none}
details.nav summary::after{content:"　▾";color:var(--ink2);font-weight:400}
details.nav[open] summary::after{content:"　▴"}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:8px;margin-top:8px}
.dot{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line2);background:var(--paper);color:var(--ink);font-size:12.5px;font-weight:500;font-variant-numeric:tabular-nums;cursor:pointer;display:grid;place-items:center;padding:0;line-height:1}
.dot[data-s="sel"]{background:var(--sel);border-color:var(--accent);color:var(--accent);font-weight:700}
.dot[data-s="ok"]{border-color:var(--ok);color:var(--ok);font-weight:700}
.dot[data-s="ng"]{border-color:var(--ng);color:var(--ng);font-weight:700;border-radius:10px}
.dot[aria-current="true"]{outline:2px solid var(--accent);outline-offset:2px}
.legend{margin:10px 0 0;font-size:12px;color:var(--ink2);line-height:1.7}
.sidebtns{display:flex;flex-direction:column;gap:8px}

.btn{border:1.5px solid var(--line2);background:var(--paper);color:var(--ink);padding:10px 18px;border-radius:10px;cursor:pointer;font-weight:500;font-size:15px;min-height:44px;transition:background .15s,border-color .15s}
.btn:hover:not(:disabled){background:var(--sel);border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.btn.primary:hover:not(:disabled){filter:brightness(1.08);background:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.small{min-height:40px;padding:8px 14px;font-size:14px}

.sheet{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:30px 32px 32px}
.qhead{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px 12px;margin-bottom:18px}
.qno{font-family:var(--serif);font-weight:700;font-size:26px;letter-spacing:.02em}
.qtotal{color:var(--ink2);font-size:14px;font-variant-numeric:tabular-nums}
.tag{font-size:13px;font-weight:700;border:1.5px solid var(--accent);color:var(--accent);padding:1px 10px;border-radius:999px;line-height:1.7}
.stem p,.overall p,.why p,.banner p{margin:0 0 .8em;white-space:pre-line}
.stem ul,.overall ul{margin:0 0 .9em;padding-left:1.4em}
.stem li,.overall li{margin:.15em 0}
.prompt{font-family:var(--serif);font-weight:700;font-size:19.5px;line-height:1.75;margin:18px 0 20px;white-space:pre-line}

.banner{border-left:4px solid var(--line2);background:transparent;padding:6px 16px 2px;margin:0 0 20px;scroll-margin-top:16px}
.banner h2{font-family:var(--serif);font-size:17px;margin:0 0 2px;line-height:1.5}
.banner.ok,.banner.ng{border-color:var(--line2)}
.banner.ok h2,.banner.ng h2{color:var(--ink)}
.banner p{font-size:14.5px;color:var(--ink)}

ol.opts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.choice{display:grid;grid-template-columns:36px minmax(0,1fr);column-gap:14px;align-items:start;width:100%;text-align:left;padding:14px 16px;border:1.5px solid var(--line);border-radius:12px;background:var(--paper);cursor:pointer;transition:background .15s,border-color .15s}
.choice:hover:not([aria-disabled="true"]){background:var(--sel);border-color:var(--accent)}
.choice[aria-disabled="true"]{cursor:default}
.mark{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center;font-family:var(--serif);font-weight:700;font-size:15px;background:var(--paper);margin-top:1px}
.multi .mark{border-radius:9px}
.choice.on{border-color:var(--accent);background:var(--sel)}
.choice.on .mark{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.choice .txt{font-size:16px;line-height:1.75;padding-top:3px}
.meta{grid-column:2;display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pill{font-size:12.5px;font-weight:500;padding:0;border:none;line-height:1.7}
.pill.ok{color:var(--ok)}
.pill.ng{color:var(--ng)}
.pill.me{color:var(--ink2)}
.opt.ok .choice{border-color:var(--ok)}
.opt.ok .mark{border-color:var(--ok);color:var(--ok)}
.opt.ng.picked .choice{border-color:var(--ng)}
.opt.ng.picked .mark{border-color:var(--ng);color:var(--ng)}
.why{margin:8px 0 0 50px;padding:10px 16px 4px;border-left:3px solid var(--line2);background:var(--soft);border-radius:0 8px 8px 0;font-size:14.5px;line-height:1.9}
.why h3{margin:0 0 4px;font-size:13px;font-weight:700;color:var(--ink2)}
.hint{margin:14px 0 0;font-size:14px;color:var(--ink2);min-height:1.8em}

.overall{margin-top:30px;padding-top:22px;border-top:1.5px solid var(--line)}
.overall h2{font-family:var(--serif);font-size:19px;margin:0 0 10px}
.ref{font-size:14px;color:var(--ink2);margin:6px 0 0}
.ref a{color:var(--accent);word-break:break-all}
.actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;margin-top:28px}
.actions .grow{display:flex;gap:10px;flex-wrap:wrap}

.result h2{font-family:var(--serif);font-size:25px;margin:0 0 8px;line-height:1.5}
.result .lead{font-size:16px;margin:0 0 20px}
.result h3{font-size:15px;margin:22px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--ng);color:var(--ng);background:var(--paper);border-radius:10px;padding:4px 12px;cursor:pointer;font-weight:700;font-size:14px;min-height:36px}
.chip:hover{background:var(--ng-bg)}
.chip.un{border-color:var(--line2);color:var(--ink2)}
.chip.un:hover{background:var(--soft)}

@media (max-width:859px){
  .shell{grid-template-columns:minmax(0,1fr);gap:20px;padding:18px 14px 56px}
  .side{position:static;max-height:none;overflow:visible}
  .sheet{padding:22px 18px 24px}
  .why{margin-left:0}
  .qno{font-size:23px}
  .prompt{font-size:18px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="shell">
  <aside class="side" aria-label="進捗と問題一覧">
    <h1>Claude Developer<br>問題集</h1>
    <p class="sub">4択（一部は2つ選択）。回答を確認すると、各選択肢の解説と全体の説明が表示されます。</p>
    <p class="score" id="score" aria-live="polite"></p>
    <div class="bar" aria-hidden="true"><i id="barfill"></i></div>
    <details class="nav" id="navd" open>
      <summary>問題一覧</summary>
      <div class="grid" id="grid"></div>
      <p class="legend">丸＝正解　角丸の四角＝不正解　青＝選択中</p>
    </details>
    <div class="sidebtns">
      <button type="button" class="btn small" id="btnResult">結果を見る</button>
      <button type="button" class="btn small" id="btnReset">最初からやり直す</button>
    </div>
  </aside>
  <main id="main" aria-live="off"></main>
</div>

<script type="application/json" id="qdata">[{"n":1,"stem":["あるオンライン旅行代理店が、旅程を手配する長時間実行のエージェントを運用しています。このエージェントは、数十回のツール呼び出しを行います。会話がコンテキストウィンドウの上限に近づき、処理を続けられなくなる問題が起きています。"],"q":"有効なコンテキスト管理の手法はどれですか。（2つ選択してください。）","need":2,"opts":[{"t":"コンテキスト編集のtool result clearingで、古いツール結果をコンテキストから除く。","c":true,"e":["正解。コンテキスト編集のtool result clearing（clear_tool_uses_20250919）は、入力トークン数などのしきい値を超えたときに古いツール結果から順にプレースホルダーへ置き換える機能です。直近のツール結果は指定した数だけ残せるため、もう参照しない検索結果や予約照会の応答がコンテキストを占有し続ける状態を解消できます。"]},{"t":"コンパクションで会話の古いやり取りをサーバー側で要約に置き換え、コンテキストを縮める。","c":true,"e":["正解。コンパクションは会話の古いターン（1往復のやり取り）を、Claudeがサーバー側で書いた要約で置き換える機能で、要約処理を自前で実装しなくても会話を上限内に収めたまま継続できます。多数のツール呼び出しを重ねる長時間のエージェントでは履歴が積み上がり続けるため、公式ドキュメントでもコンテキスト管理の主要な戦略として位置づけられています。"]},{"t":"プロンプトキャッシングで会話履歴の接頭辞をキャッシュし、履歴部分の入力トークン料金を下げる。","c":false,"e":["プロンプトキャッシングは、繰り返し送るシステムプロンプトや長い履歴の接頭辞を再利用し、入力トークンの料金とレイテンシを下げたい場面で有効な機能です。ただしキャッシュされた接頭辞もコンテキストウィンドウには計上されるため、支払う金額は変わっても、上限に近づいているという本問の問題は解消しません。"]},{"t":"429や529のエラーが返ったときに、指数バックオフで同じリクエストを再送する。","c":false,"e":["指数バックオフでの再送は、レート制限（429）や過負荷（529）のような一時的なエラーから回復するための定石です。入力がコンテキストウィンドウを超えた場合は400のinvalid_request_error（prompt is too long）となり、同じ内容を再送しても毎回同じ理由で拒否されるため、履歴そのものを減らす対処が必要です。"]},{"t":"max_tokensを引き上げ、1回の応答で生成できる出力トークン数の上限を増やす。","c":false,"e":["max_tokensは1回の応答で生成する出力トークンの上限で、長い出力が途中で切れる（stop_reasonがmax_tokens）場合に引き上げるパラメータです。コンテキストウィンドウの容量自体は変わらず、生成した出力もウィンドウに計上されるため、上限に近づいた会話への対処にはなりません。"]}],"overall":["長時間動くエージェントの会話がコンテキストウィンドウの上限に迫ったとき、何をすれば容量そのものを減らせるかがテーマです。コンテキストウィンドウにはシステムプロンプト、ツール結果を含む全メッセージ、ツール定義、そのターンの出力がすべて計上されるため、数十回のツール呼び出しを重ねるエージェントでは履歴が急速に膨らみます。","上限に近づく会話への主要な戦略はサーバー側のコンパクションで、古いターンを要約に置き換えて会話を継続させます。より限定的な手段としてコンテキスト編集があり、tool result clearingで古いツール結果を除去できます。","正誤を分けるのは「コンテキストに載るトークンそのものを減らしているか」という一点です。プロンプトキャッシングは料金を、max_tokensは出力の上限を、バックオフ再送は一時的なエラーを扱う機能で、いずれも履歴の量は変わりません。なお入力が上限を超えると古い部分が自動で切り捨てられるのではなく、400エラーになる点も押さえておきましょう。","「料金・速度の最適化」と「容量の管理」を別の軸として区別できれば、選択肢は自然に絞れます。"],"ref":"https://platform.claude.com/docs/en/build-with-claude/context-windows"},{"n":2,"stem":["ある製薬会社が、規制対応が求められる本番システムでClaudeを利用します。"],"q":"モデルを、新しいスナップショットに切り替わっていくエイリアスではなく、特定のスナップショット（固定バージョン）に固定する理由として、最も適切なものはどれですか。","need":1,"opts":[{"t":"固定したスナップショットには廃止の予定がなく、同じモデルを期限なく使い続けられる。","c":false,"e":["各モデルIDには個別の廃止（retirement）スケジュールがあり、モデル一覧にも「この日より前には廃止しない」という形で約束の日付が示されています。固定は永続利用の保証ではないため、規制対応のシステムでは廃止日を見越して、後継モデルの検証と移行を計画しておく必要があります。"]},{"t":"検証・承認した時点と同じモデルで動かし続け、意図しない切り替えによる挙動の変化を未然に防げる。","c":true,"e":["正解。モデルIDはそれぞれ固定されたバージョンを指し、そのIDを使う限りモデル本体の重みは変わりません。4.6世代より前のモデルにあるclaude-haiku-4-5のようなエイリアスは、そのマイナーバージョンの最新の日付付きスナップショットへ解決される利便のためのポインタなので、本番では検証・承認したスナップショットIDを指定しておけば、再現性と監査の説明がしやすくなります。"]},{"t":"固定したモデルIDは入力トークンの単価が下がり、規制対応システムの運用費を抑えられる。","c":false,"e":["料金はモデルごとに決まっており、同じモデルであればどの形式のIDで指定しても単価は変わりません。コストを下げたい場合は、Batches APIの割引、プロンプトキャッシング、より小さいモデルの選択といった別の手段を使います。"]},{"t":"後続モデルの改善が固定したIDにも自動で反映され、再検証なしで性能が上がっていく。","c":false,"e":["新しいモデルの改善は、新しいモデルIDとして提供されます。Anthropicは既存のモデルIDの重みや設定を更新しないと明記しているため、固定したIDに改善が自動で入ることはなく、改善を取り込むには新しいIDへの意図的な移行と再検証が必要です。"]}],"overall":["Claudeのモデルは、4.6世代以降はclaude-sonnet-5のような日付のないID自体が固定のスナップショットで、それより前の世代はclaude-haiku-4-5-20251001のような日付付きIDがスナップショット、日付なしの名前が最新のスナップショットを指すエイリアスという構成です。","固定したIDの重みは変わらないため、検証・承認した時点と同じ挙動を前提に監査記録を残せます。ただし、ルーターや安全分類器といった、モデルを提供する周辺の仕組みの更新によって、同じIDでも挙動にわずかな差が出ることはあると説明されています。","誤答は、固定を料金の話と取り違える、廃止スケジュールを見落とす、改善が自動で入ると誤解する、の3つです。","固定で得られるのは再現性と移行時期を自分で決められることであり、永続性や最新性ではない、と押さえておけば似た問題にも対応できます。"],"ref":"https://platform.claude.com/docs/en/about-claude/models/model-ids-and-versions"},{"n":3,"stem":["ある会計事務所が、長年運用してきた大規模なレガシー連携コードのリファクタリングに着手します。"],"q":"安全に進めるための方針として最も適切なものはどれですか。","need":1,"opts":[{"t":"既存の振る舞いを固定するテストを整え、小さな変更を段階的に重ねて都度検証する。","c":true,"e":["正解。まず現在の振る舞いを記録するテスト（特性テスト）を用意すれば、変更後も同じ結果になるかを機械的に確かめられます。そのうえで小さく検証可能な単位で変更を重ね、各段階でテストとレビューを通せば、問題が出ても直前の状態へ戻すだけで済みます。Claude Codeの公式ワークフローでも、振る舞いを保つよう指示し、小さくテスト可能な単位で進め、変更後にテストを実行する手順が示されています。"]},{"t":"振る舞いを変えない作業なので、機能追加とバグ修正も同じ変更にまとめて進める。","c":false,"e":["リファクタリングの定義（外部から見た振る舞いを変えずに内部構造を改善する）自体は正しい理解です。しかし機能追加やバグ修正は振る舞いを意図的に変える作業なので、同じ変更に混ぜるとテストが落ちたときにどちらが原因か切り分けられず、レビューもしにくくなります。"]},{"t":"テストを書く工数を省き、変更のたびに担当者が画面操作で動作を確認して進める。","c":false,"e":["画面操作による手動確認は、自動化が難しいUIの最終確認などで今も使われる手段です。しかし連携コードの内部を大きく組み替える作業で手動確認だけに頼ると、確認していない経路の回帰を見逃しやすく、変更のたびに同じ確認を繰り返す工数もかさみます。"]},{"t":"新しい設計で全面的に書き直し、完成した時点で旧システムから一括で切り替える。","c":false,"e":["全面的な書き直し（ビッグバン・リライト）は、既存コードの延命が技術的に難しい場合などに選ばれることがあります。しかし大規模なレガシー連携コードでは、新旧の振る舞いの差を切り替えまで検証できず、問題が出ても途中で戻れないため、「安全に進める」という本問の条件に反します。"]}],"overall":["大規模なレガシーコードのリファクタリングを安全に進める鍵は、振る舞いを確かめる手段と、小さく戻せる変更単位の2つです。リファクタリングは外部から見た振る舞いを保ったまま内部構造を改善する作業で、その「振る舞いを保てているか」を確かめる手段がテストです。","テストのないコードでは、まず現在の入出力を記録する特性テストを書き、それを安全網にして小さな変更を積み重ねます。Claude Codeのドキュメントでも、リファクタリングは同じ振る舞いを維持するよう指示し、小さくテスト可能な単位で行い、最後にテストで検証する流れが紹介されています。","誤答の3つは、一括切り替え、目的の異なる変更の混在、自動テストの省略という形で、いずれも「問題が起きたときに原因を特定して戻せるか」を損なっています。","安全性を問われたら、検証の手段があるか、切り戻しの単位が小さく保たれているか、の2点を基準に選ぶと判断がぶれません。"],"ref":"https://code.claude.com/docs/en/common-workflows"},{"n":4,"stem":["ある出版社が、書籍原稿のレビューエージェントを構築しています。事実確認・文体チェック・引用の権利関係チェックを、それぞれ専門のサブエージェントに委任する設計を検討しています。どのチェックでも、大量の参考資料を読み込む必要があります。"],"q":"サブエージェントによるコンテキストの分離で得られる利点として、最も適切なものはどれですか。","need":1,"opts":[{"t":"親のシステムプロンプトがサブエージェントにも適用され、各チェックを同じ方針で進められる。","c":false,"e":["サブエージェントが受け取るのは、自身の定義に書いたシステムプロンプト（AgentDefinitionのprompt）と委任時のプロンプトで、親のシステムプロンプトは含まれません。チェックごとに専門の指示を与えられるのはこの仕組みのためで、共通の方針を守らせたい場合は各サブエージェントの定義か、設定により読み込まれるプロジェクトのCLAUDE.mdに記載します。"]},{"t":"資料の読み込みや途中のツール結果はサブエージェント内に留まり、親には最終結果だけが返る。","c":true,"e":["正解。サブエージェントは親とは別の会話コンテキストで動作し、途中のツール呼び出しと結果はサブエージェントの内部に留まって、最終メッセージだけがAgentツールの結果として親に返ります。各チェックで大量の参考資料を読み込んでも親の会話には要約された結論しか積み上がらないため、親エージェントはコンテキストを圧迫されずに原稿全体のレビューを続けられます。"]},{"t":"システム全体のトークン消費量が、処理を1つのエージェントで行う場合より少なくなる。","c":false,"e":["コンテキストの分離では各サブエージェントがそれぞれ資料を読み込み、独自にAPIリクエストを行うため、システム全体の総トークン数はむしろ増えることがあります。コストを抑えたい場合は、サブエージェントごとにmodelで軽量なモデルを指定するといった別の手段を使います。分離の利点は総量の削減ではなく、親の会話に資料が蓄積しないことにあります。"]},{"t":"各サブエージェントが親の会話履歴とツール結果を引き継ぎ、委任時の指示を短く書ける。","c":false,"e":["親の会話履歴を引き継ぐのは、現在の会話を分岐させるfork型のサブエージェントの挙動です。通常のサブエージェントは親の履歴やツール結果を持たない新しいコンテキストで始まり、親から渡るのはAgentツールのプロンプト文字列だけなので、必要なファイルパスや判断材料は委任時の指示に明示する必要があります。"]}],"overall":["サブエージェントに作業を任せたとき、親とサブエージェントの間で何が受け渡され、何が受け渡されないのかがこの問題の核心です。Agent SDKのサブエージェントは別のエージェントインスタンスとして動き、forkでない限り親の会話履歴を持たない新しいコンテキストで開始されます。","資料の読み込みや中間のツール結果はサブエージェントの中に留まり、親には最終メッセージだけが返るため、数十のファイルを精査しても親の会話は膨らみません。","見分けるポイントは「何が親とサブエージェントの間を行き来するか」です。親からサブエージェントへ渡るのは委任時のプロンプトとサブエージェント自身の定義で、親の会話履歴やシステムプロンプトは引き継がれません。また各サブエージェントが独自にAPIを呼ぶため、総トークン数が減るとは限りません。","選択肢を読むときは、「親のコンテキストを守る」話なのか「コスト」の話なのかを切り分けると、判断を誤りにくくなります。"],"ref":"https://code.claude.com/docs/en/agent-sdk/subagents"},{"n":5,"stem":["あるスポーツ分析サービスでは、Claudeで試合レポートを生成しています。開発チームは、同じ入力でも実行ごとに出力が変わることに気づきました。"],"q":"サンプリングパラメータと非決定性について、temperatureの説明として正しいものはどれですか。","need":1,"opts":[{"t":"temperatureは応答のレイテンシに作用するパラメータで、生成される内容には影響しない。","c":false,"e":["応答までの時間に影響するのは、モデルの大きさ、入力と出力の長さ、思考の量などです。temperatureは次のトークンを選ぶときのランダムさを調整するパラメータで、どの語が選ばれるか、つまり生成される内容そのものに作用します。"]},{"t":"temperatureを0にすれば、同じ入力に対して毎回まったく同じ出力が返ることが保証される。","c":false,"e":["低いtemperatureは出力を安定させるので、定型的な抽出などで使われる設定です。しかし0にしても完全な決定性は得られず、同じ入力でも呼び出しごとに出力が変わり得ると公式に説明されています（Anthropic自身の推論サービスでもクラウド事業者経由でも同様）。テストで出力の完全一致を期待値にすると、偶発的な失敗が起きます。"]},{"t":"temperatureはサンプリングのランダム性を調整し、0にしても出力の完全な一致は保証されない。","c":true,"e":["正解。LLMは確率分布から次のトークンをサンプリングして文章を生成し、temperatureはその選び方のランダムさを調整します。低い値ほど確率の高い語に寄って保守的で安定した出力になり、高い値ほど多様で意外性のある出力になります。","ただし公式の用語集は、temperatureを0にしても結果は完全には決定論的にならず、同じ入力でもAPI呼び出しごとに異なる出力になり得ると明記しているため、厳密な一致を前提にした設計は避けます。"]},{"t":"temperatureを上げると候補の語をより広く検討するため、生成される内容の事実の正確さが高まる。","c":false,"e":["高いtemperatureは、確率の低い語も選ばれやすくすることで表現の多様さや創造性を高める設定で、物語の生成やアイデア出しに向きます。事実の正確さを高める効果はなく、むしろ根拠のない表現が混じりやすくなるため、正確さは参照資料の提供や出力の検証で担保します。"]}],"overall":["同じ入力で出力が変わる理由を、サンプリングとtemperatureの仕組みから説明できるかが問われています。LLMは各ステップで次のトークンの確率分布を計算し、そこからサンプリングして文章を作ります。temperatureはこの分布からの選び方のランダムさを調整し、低くすると最も確からしい語に寄り、高くすると珍しい語も選ばれやすくなります。","重要なのは、temperatureが0でも出力は完全には決定論的にならず、同じ入力でも呼び出しごとに異なる結果になり得ることです。","なおClaude Sonnet 5やClaude Opus 5.5のように、temperature・top_p・top_kを既定値以外に設定するとエラーになるモデルもあり、その場合は出力の方向づけをプロンプトで行います。いずれの場合も「同じ入力なら同じ出力」を前提にしない設計、例えば出力をスキーマで検証する、評価を複数回の試行で行う、といった工夫が求められます。"],"ref":"https://platform.claude.com/docs/en/about-claude/glossary"},{"n":6,"stem":["ある物流企業が、配送計画システムを構築しようとしています。このシステムでは、道路状況・車両の空き・荷物の優先度に応じて、毎回異なる調査と再計画が必要になります。","システムは、中心となるマネージャー（オーケストレーター）と複数のワーカーLLMで構成する予定です。"],"q":"このマネージャー／スーパーバイザー階層で、マネージャーの役割として最も適切なものはどれですか。","need":1,"opts":[{"t":"配送依頼を種別ごとに分類し、種別ごとに用意した専用のワーカーへ振り分ける。","c":false,"e":["入力を分類して専用の後続処理へ振り分けるのはroutingで、問い合わせの種類（返金・技術サポートなど）ごとに扱いを分けたい場面に向きます。routingは振り分けで役割を終え、サブタスクの分解や結果の統合を行わないため、毎回異なる調査を組み合わせて1つの計画にまとめる本問の要件を満たしません。"]},{"t":"依頼の状況に応じてサブタスクを決めてワーカーへ委任し、結果を統合して計画にまとめる。","c":true,"e":["正解。orchestrator-workersでは、中心のLLMが入力を見て必要なサブタスクをその場で決め、ワーカーLLMへ委任し、返ってきた結果を統合します。サブタスクが事前定義されていない点が他のワークフローとの決定的な違いで、道路状況や車両の空きによって必要な調査が毎回変わる配送計画のように、手順を予測できない複雑なタスクに適しています。"]},{"t":"設計時に決めた順序でワーカーを呼び出し、前段の出力を次段の入力として渡していく。","c":false,"e":["固定の順序で呼び出し、各段が前段の出力を処理していくのはprompt chainingで、原稿作成から翻訳へと進むような固定のサブタスクに分解できる処理に向きます。呼び出し系列が設計時に確定しているため、状況に応じて必要な調査を毎回組み替えるという本問の前提と合わず、マネージャーが担う動的な分解の役割も存在しません。"]},{"t":"全ワーカーに同じ計画タスクを並列で解かせ、出力の多数決で最終的な配送計画を選ぶ。","c":false,"e":["同じタスクを複数回実行して出力を比べ、多数決などで結論を選ぶのはparallelizationのvotingで、コードの脆弱性レビューのように複数の視点で確信度を上げたい場面に向きます。タスクを分解して役割の異なるワーカーに割り振るものではないため、道路状況・車両・優先度ごとに異なる調査が必要な本問のマネージャーの役割には当たりません。"]}],"overall":["マネージャー／スーパーバイザー階層は、Anthropicのエージェント設計ガイドでいうorchestrator-workersのパターンに当たります。ガイドでは、中心のLLMがタスクを分解してワーカーLLMに委任し、それらの結果を統合する構成をorchestrator-workersと呼び、必要なサブタスクを予測できない複雑なタスクに適すると説明しています。","見た目は並列化と似ていますが、決め手はサブタスクが事前定義されず、オーケストレーターが入力に応じて決める点です。問題文の「毎回異なる調査と再計画が必要」という条件がこれを示しています。","同じタスクを並列に解かせて多数決するvoting、入力を分類して振り分けるrouting、固定順序で呼び出すprompt chainingは、いずれも処理の形が設計時に決まっており、動的な分解と統合を含みません。","パターン名に迷ったら、「分解の内容を誰がいつ決めるのか（設計時のコードか、実行時のLLMか）」を手がかりにすると判別できます。"],"ref":"https://www.anthropic.com/engineering/building-effective-agents"},{"n":7,"stem":["ある海運企業のバッチ処理パイプラインが、負荷が高いときに、Claude APIから断続的にHTTP 429とHTTP 529を受け取っています。"],"q":"リトライ設計として最も適切なものはどれですか。","need":1,"opts":[{"t":"429を受けたらバッチ全体をいったん停止し、原因を調べてから翌日に全件を再投入し直す。","c":false,"e":["失敗の多いバッチを止めて原因を調べるのは、恒久的なエラーが大量に出ている場合には妥当な判断です。しかし429は多くの場合、待てば回復する一時的な制限で、バッチ全体を止めて翌日に全件を再投入すると、成功済みの処理まで重複して実行し、処理の遅れも大きくなります。"]},{"t":"遅延を入れずにその場で再送を繰り返し、成功した時点ですぐ次のリクエストの処理に進めていく。","c":false,"e":["即時の再送は、ネットワークの瞬断のようにすぐ回復する単発の失敗なら成功することもあります。しかし429や529はAPI側の制限や過負荷を示しているため、間隔を空けずに再送すると負荷をさらに高め、制限の解除を遅らせる結果になります。"]},{"t":"400を含むあらゆるエラーを、固定の待ち時間をはさんで決まった回数だけ再試行し続ける。","c":false,"e":["固定間隔での再試行は、一時的な失敗が散発する小規模な処理なら実用上足りることもあります。しかし400 invalid_request_errorはリクエストの形式や内容の不備を示す恒久的なエラーで、何度送っても同じ理由で拒否されるうえ、固定間隔では過負荷時に再試行が同時に集中しやすくなります。"]},{"t":"429と529はジッター付き指数バックオフで再試行し、retry-afterに従う。","c":true,"e":["正解。429 rate_limit_errorと529 overloaded_errorは一時的なエラーなので、待ち時間を指数的に延ばしながらランダムな揺らぎ（ジッター）を加えて再試行し、retry-afterヘッダーがあればその秒数だけ待ちます。公式SDKは接続エラー・レート制限・5xxをこの方式で既定2回まで自動再試行し、max_retriesで調整できます。","なお利用ティアの月間支出上限に達したことによる429はretry-afterが付かず、上限が戻るまで失敗し続けるため、再試行とは別に検知できるようにしておきます。"]}],"overall":["429や529が返ったときの再試行は、「待てば直るエラーか」を見極めるところから設計します。エラーは「待てば直るもの」と「直さなければ何度送っても失敗するもの」に分けて扱います。429（レート制限）、529（過負荷）、500（内部エラー）は前者で、ジッター付きの指数バックオフで再試行し、retry-afterヘッダーがあれば従います。400（形式・内容の不備）や401（認証）などは後者で、再試行ではなくリクエストや設定を直します。","公式SDKはこの再試行を既定で行うため、自前で実装する場合もSDKの設定を見直す場合も、同じ考え方で判断できます。","誤答は、待たずに再送する、一時的な429を致命的とみなす、恒久的な400まで再試行する、のいずれかで、エラーの種類に応じた扱い分けができていません。","なお、利用量を急に増やすと、レート制限の範囲内でも429が返ることがあるため、トラフィックは段階的に増やすのが望ましいとされています。"],"ref":"https://platform.claude.com/docs/en/api/errors"},{"n":8,"stem":["ある法務チームが、アップロードされた契約書1件を約40の条項に分け、条項ごとに独立したリスク判定をClaudeで行う機能を作っています。担当者は、画面の前で結果を待っています。","1件ずつ順番に呼び出すと、合計の待ち時間が長すぎます。一方で、組織のレート制限を超えて429を多発させることも避けたいと考えています。"],"q":"Python SDKを使った実装として最も適切なものはどれですか。","need":1,"opts":[{"t":"クライアントのmax_retriesを大きくし、1件ずつの呼び出しが失敗したらSDKに自動で再送させる。","c":false,"e":["max_retriesは、接続エラーや429、5xxなどが返ったときにSDKが自動で再送する回数の設定で（既定は2回）、一時的な失敗からの回復力を高めたい場面で調整します。再送の回数を増やしても、1件ずつ順番に呼ぶ限り合計の待ち時間は短くならず、失敗した呼び出しの分だけ待ちがかえって伸びます。"]},{"t":"1件ずつの呼び出しをストリーミングに切り替え、各条項の結果が届き始めるまでの時間を短くする。","c":false,"e":["ストリーミングは、生成されたテキストを到着順に受け取れる仕組みで、1件の長い応答の書き出しを早く表示したいときに効果があります。しかし1件ずつ順番に呼ぶ構造は変わらないため、40件すべての判定がそろうまでの合計時間はほとんど縮まりません。本問の遅さの原因は、互いに独立した処理を直列に並べていることにあります。"]},{"t":"40件をMessage Batches APIにまとめて投入し、処理の終了をポーリングしてから結果を表示する。","c":false,"e":["Message Batches APIは、大量のリクエストを非同期にまとめて処理してコストを抑える仕組みで、夜間の一括処理のようにすぐに結果が要らない用途に向きます。ただしバッチは最長24時間の処理枠で動き、いつ終わるかは保証されません。担当者が画面の前で待っている本問の用途には、完了時刻の読めない方式は合いません。"]},{"t":"AsyncAnthropicで40件を並行に送り、同時に処理中の件数をセマフォで一定数に抑える。","c":true,"e":["正解。Python SDKのAsyncAnthropicは同期版のAnthropicと同じインターフェースを持つ非同期クライアントで、asyncioと組み合わせると、ある応答を待つ間に別のリクエストを送れます。互いに独立した40件を並行に投げれば、合計時間はほぼ最も遅い1件分まで縮みます。","さらにasyncio.Semaphoreで同時実行数を組織のレート制限に収まる値に絞れば、上限を一気に使い切って429が多発する事態も避けられます。"]}],"overall":["待ち時間の大半がネットワーク越しの応答待ちである処理を、どう速くするかが問われています。Claude APIの呼び出しは典型的なI/O待ちの処理で、Python SDKには同期のAnthropicと同じインターフェースを持つ非同期クライアントAsyncAnthropicが用意されています。","互いに依存しない複数の呼び出しはasyncio.gatherなどでまとめて並行に実行でき、合計時間は直列の合計から、ほぼ最も遅い1件分へと縮みます。一方で、同時に投げる数を無制限にすると、リクエスト数や入力トークン数の毎分の上限を短時間で消費して429を招くため、セマフォで同時実行数に上限を設け、SDK既定の自動再送と組み合わせるのが定石です。","誤答は、コスト重視の非同期一括処理、1件の体感速度を上げる仕組み、失敗時の再送設定で、それぞれ別の問題を解くための手段です。","性能の問題では、まず遅さの原因が直列の待ちなのか、1件の生成時間なのか、処理量なのかを切り分けると、選ぶべき手段が絞れます。"],"ref":"https://platform.claude.com/docs/en/cli-sdks-libraries/sdks/python"},{"n":9,"stem":["ある農業テック企業が、作物病害の現場報告を扱うClaudeアプリを設計しています。処理には、次の2つのサブタスクがあります。","自由記述の報告を、決められた病害カテゴリのいずれかに分類する","相互に影響する多数の制約を考慮して、多段階の灌漑・防除計画を立案する"],"q":"フューショットプロンプティングと思考モード（エフォートや適応型思考）の使い分けとして、最も適切なものはどれですか。","need":1,"opts":[{"t":"計画立案のプロンプトに数十件の計画例を詰め込み、推論の深さは既定の設定のままにする。","c":false,"e":["例示は形式や方針を伝えるのに有効ですが、公式ドキュメントが勧める目安は3〜5件で、関連性と多様性のある例を選ぶことが重要です。数十件の計画例はコンテキストを圧迫するうえ、例の表面的なパターンをなぞらせるおそれがあり、多数の制約を突き合わせる推論そのものの代わりにはなりません。"]},{"t":"分類はフューショットプロンプティングで形式と境界を示し、計画立案はエフォートを高めて深く推論させる。","c":true,"e":["正解。フューショットプロンプティング（マルチショット）は出力の形式・トーン・構造を安定させる最も確実な手段の1つで、固定カテゴリへの分類なら数件の代表例で書式と判断の境界を示せます。","一方、相互に影響する制約を突き合わせる計画立案は多段階の推論が価値を生む典型で、適応型思考ではエフォートを上げるとClaudeがより積極的かつ深く考えるようになります。タスクごとに手段を割り当てれば、品質とコスト・レイテンシの釣り合いが取れます。"]},{"t":"両タスクともゼロショットで指示だけを与え、エフォートを最小に設定して応答の速さを優先する。","c":false,"e":["指示だけのゼロショットと低いエフォートの組み合わせは、単純な問い合わせを大量に速く処理したい場面では妥当な設定です。しかし分類では例がないと出力形式やカテゴリの境界がぶれやすく、計画立案では推論を抑えることで制約の見落としが起きやすくなるため、どちらのタスクの要件にも合いません。"]},{"t":"両タスクでエフォートをmaxに設定し、分類も計画立案も最も深い推論で処理させる。","c":false,"e":["エフォートをmaxにすると、Claudeは最も積極的かつ深く考えるようになり、難しい推論では品質の向上が期待できます。ただし考えた分は出力トークンとして課金され、レイテンシも延びるため、形式が決まった単純な分類にまで適用するのは費用対効果に見合いません。"]}],"overall":["フューショットプロンプティングによる例示は「どんな形で答えるか」を伝える手段で、固定カテゴリへの分類のように答えの形と判断基準が明確なタスクで効果を発揮します。思考モードは「どれだけ考えてから答えるか」を調整する手段です。現行モデルでは適応型思考が標準で、Claudeがリクエストごとに考えるかどうかと深さを判断し、その傾向をエフォート（lowからmaxまで）で方向づけます。","なお以前の拡張思考（budget_tokensで思考量を固定する方式）は、Claude Opus 4.7以降のモデルでは受け付けられません。思考に使ったトークンは出力として課金されるため、推論が品質を左右するタスクに絞って深く考えさせるのが基本です。","誤答は、全タスクで推論を抑える、例示を推論の代わりにする、全タスクで推論を最大化する、といった一律の設定になっており、タスクの性質に合わせて手段を割り当てるという問題の核心から外れています。"],"ref":"https://platform.claude.com/docs/en/build-with-claude/thinking-steering-and-cost"},{"n":10,"stem":["ある気象情報会社が、大規模な気象シミュレーション結果の要約生成を、長時間実行の非同期ジョブとして実装します。この処理には、数時間かかることもあります。"],"q":"ジョブの完了をクライアントに伝える方式について、ポーリングとコールバック（Webhook）を比較した記述として最も適切なものはどれですか。","need":1,"opts":[{"t":"コールバックは受信URLを公開しておけば確実に届くため、再送や重複受信への備えは要らない。","c":false,"e":["Webhookの受信側は、送信側の再送によって同じ通知を複数回受け取ることや、受信側の停止中に通知が失われることを前提に設計します。署名の検証、重複を無視できる冪等な受信処理、取りこぼしに備えた状態確認APIの併用が必要で、URLを公開しただけで到達が保証されるわけではありません。"]},{"t":"ポーリングは単純だが検知の遅れと無駄な問合せが出て、コールバックは即時だが受信側の準備が要る。","c":true,"e":["正解。ポーリングはクライアント側だけで完結するため実装が単純ですが、問い合わせ間隔を長くすると完了の検知が遅れ、短くすると無駄なリクエストが増えるというトレードオフがあります。コールバックは完了時にサーバーから通知が届くため即時性と効率に優れる一方、受信エンドポイントの公開・認証・再送への備えをクライアント側で用意する必要があります。"]},{"t":"ポーリングは完了を即時に検知でき、コールバックは受信エンドポイントなしで実装できる。","c":false,"e":["説明が逆になっています。ポーリングはクライアントが一定間隔で状態を問い合わせる方式なので、完了の検知は次の問い合わせまで遅れます。コールバックはジョブ完了時にサーバーがあらかじめ登録されたURLへ通知する方式で、通知を受け取るエンドポイントの公開と認証がクライアント側に必要です。"]},{"t":"同期呼び出しでHTTP接続を数時間ずっと保持し続ければ、ポーリングもコールバックも用意せずに済む。","c":false,"e":["同期呼び出しは、数秒から数十秒で終わる処理なら最も単純で扱いやすい方式です。しかし数時間に及ぶ処理では、ネットワーク機器のアイドルタイムアウトや接続断で結果を受け取れなくなるリスクが高く、長時間の処理は非同期ジョブにしてポーリングかコールバックで完了を扱うのが定石です。"]}],"overall":["数時間かかるジョブの完了を、クライアントが聞きに行くのか（ポーリング）、サーバーが知らせるのか（コールバック）、という設計上のトレードオフが論点です。","ポーリングは「クライアントが聞きに行く」方式で、実装は単純ですが、検知の遅れと問い合わせ回数のバランスを取る必要があります。コールバックは「サーバーが知らせに来る」方式で、無駄な問い合わせがない代わりに、受信側の公開エンドポイント、認証、再送と重複受信への対処が要ります。Claudeの非同期処理であるMessage Batches APIも、processing_statusをポーリングしてendedになったらresults_urlから結果を取得する設計です。","選択肢を読むときは、通知の起点がクライアントとサーバーのどちらにあるかを確認し、その起点から生じる負担（問い合わせの無駄か、受信側の準備か）が正しく書かれているかを見ると判断できます。数時間の処理を同期接続で待つ案は、長時間の接続がそもそも安定しないという前提で除外できます。"],"ref":"https://platform.claude.com/docs/en/build-with-claude/batch-processing"},{"n":11,"stem":["ある保険代理店には、自社のバックエンドからMessages APIを直接呼び出すアプリがあります。このアプリで、インターネットに公開済みのリモートMCPサーバー（Streamable HTTP）が提供する契約照会ツールを、Claudeに使わせたいと考えています。","MCPクライアントは自前で実装せず、MCPコネクタ（mcp_serversパラメータ）を使います。"],"q":"この構成の設計として正しいものはどれですか。（2つ選択してください。）","need":2,"opts":[{"t":"mcp_toolsetのconfigsで更新系ツールのenabledをfalseにし、照会系のツールだけを使わせる。","c":true,"e":["正解。mcp_toolsetでは、default_configで全ツールの既定を決め、configsでツールごとにenabledを上書きできます。更新系のツールだけをfalseにする拒否リスト（denylist）の形にすれば照会専用のアシスタントとして使え、公式ドキュメントも読み取り専用のアシスタントを作る場合などにこの形を勧めています。"]},{"t":"mcp_serversにサーバーのURLと名前を定義し、tools配列のmcp_toolsetからその名前を参照する。","c":true,"e":["正解。MCPコネクタでは、mcp_serversの各要素にtype・url・nameと、必要に応じてauthorization_tokenを定義し、tools配列に置いたmcp_toolsetのmcp_server_nameでそのサーバーを参照します。","これだけでAPIがサーバーからツールの一覧を取得してClaudeに提示し、呼び出しも代行するため、アプリはMCPクライアントを実装せずにリモートサーバーのツールを使えます。"]},{"t":"サーバーがresourcesとして公開している約款文書も、mcp_toolsetで有効にしてClaudeに読ませる。","c":false,"e":["MCPのresourcesは、文書やスキーマのような参照用のデータを、アプリ側の判断でコンテキストに取り込むためのプリミティブです。しかしMCPコネクタが対応しているのはMCP仕様のうちツール呼び出しだけで、resourcesやpromptsはmcp_toolsetで扱えません。約款文書を読ませたい場合は、アプリが取得して文書としてメッセージに含めるか、文書を返すツールをサーバーに用意します。"]},{"t":"開発者PCでstdio起動している検証用のMCPサーバーも、mcp_serversに起動コマンドを書いて接続する。","c":false,"e":["stdioは、Claude DesktopやClaude Codeのように同じマシン上でサーバーをサブプロセスとして起動するクライアントが使う通信方式で、ローカルのファイルやCLIを扱うサーバーに向きます。","MCPコネクタは、HTTP（Streamable HTTPまたはSSE）で公開されたサーバーにだけ接続でき、ローカルのstdioサーバーを直接つなぐことはできません。検証用サーバーを使うなら、HTTPで公開するか、自前のMCPクライアントを介する必要があります。"]},{"t":"Claudeがmcp_tool_useを返したら、アプリがtools/callをサーバーへ送り、結果をtool_resultで返す。","c":false,"e":["自前でMCPクライアントを持つ構成なら、モデルが選んだツールをアプリがtools/callで実行し、結果をtool_resultとして返すループを組みます。","MCPコネクタではその実行をAPI側が担い、応答にはmcp_tool_useとmcp_tool_resultのブロックがそろって返るため、アプリが改めて呼び出す必要はありません。二重に実行すれば、更新系のツールでは処理が重複するおそれもあります。"]}],"overall":["Messages APIからリモートのMCPサーバーを直接使うMCPコネクタの構成と制約が問われています。MCPコネクタは、リクエストのmcp_serversにサーバーの接続情報を書き、tools配列のmcp_toolsetで参照するだけで、APIがサーバーとの通信とツールの実行を代行する仕組みです（ベータ機能のため、ベータヘッダーを付けて使います）。","その代わりに制約があります。対応するのはツール呼び出しだけで、サーバーはHTTPで公開されている必要があり、ローカルのstdioサーバーはつなげません。有効にするツールは、mcp_toolsetの設定で許可リストや拒否リストの形に絞れます。","誤答の3つは、stdioでの接続、アプリ側での再実行、resourcesの利用で、どれも自前のMCPクライアントやClaude Desktopといった別の構成なら成り立つ内容です。","「ツールの実行を誰が担うか」と「MCP仕様のどこまでが対象か」の2点を押さえておくと、MCPコネクタとローカル接続の問題を取り違えません。","なお、MCPコネクタはAmazon BedrockとGoogle Cloud（Google managed）では提供されていないため、利用するプラットフォームも事前に確かめておく必要があります。"],"ref":"https://platform.claude.com/docs/en/agents-and-tools/mcp-connector"},{"n":12,"stem":["ある鉄道会社が、乗客を案内するClaudeアシスタントを構築しています。"],"q":"指示をシステムプロンプトとユーザーメッセージのどちらに置くかについて、原則として最も適切なものはどれですか。","need":1,"opts":[{"t":"役割や安全上の制約はシステムプロンプトに置き、個別の問い合わせやデータはユーザーメッセージに置く。","c":true,"e":["正解。案内係としての役割、守るべき振る舞い、安全上の制約のような会話全体に効かせる方針はシステムプロンプトに置き、毎回変わる乗客の問い合わせや参照データはユーザーメッセージに置きます。安定した方針と可変の入力を分けておけば、方針を一か所で保守でき、利用者の入力が方針と混ざることも防げます。"]},{"t":"安全上の制約はユーザーメッセージの側に置き、問い合わせごとに内容を調整する。","c":false,"e":["問い合わせの内容に応じて変えたい補足（路線ごとの注意事項など）は、ユーザーメッセージに添えるのが適切です。しかし安全上の制約は全ターンで一貫して守らせるべき方針で、利用者の入力と同じ場所に置くと、入力の書き方次第で弱められたり上書きされたりするおそれがあります。"]},{"t":"指示は毎回のユーザーメッセージの冒頭にまとめて書き、システムプロンプトは使わずに運用する。","c":false,"e":["指示をユーザーメッセージにまとめて書く方法でも、Claudeは多くの場合それに従い、システムプロンプトを設定できない環境では実際に使われる書き方です。しかし毎回の入力と方針が同じ場所に混ざるため方針の保守が難しくなり、利用者の入力で方針が弱められる余地も生まれます。公式ドキュメントも、システムプロンプトで役割を設定すると振る舞いと口調が用途に合わせて安定すると説明しています。"]},{"t":"乗客ごとの問い合わせ内容も含め、指示とデータを丸ごとシステムプロンプトに入れる。","c":false,"e":["常に参照させたい背景情報（運行ルールの要点など）をシステムプロンプトに入れること自体は一般的です。しかし乗客ごとの問い合わせまでシステムプロンプトに入れると、方針と毎回変わる入力が混ざって保守しにくくなり、信頼できない利用者の入力を方針と同じ権威で扱うことにもなります。"]}],"overall":["指示をシステムプロンプトとユーザーメッセージのどちらに置くかは、方針の一貫性と入力の安全性を左右するプロンプト設計の基本です。Messages APIでは、systemはトップレベルのパラメータとして会話全体の前提を与え、messagesのuserターンが個々の依頼を担います。","役割、振る舞いのルール、安全上の制約のように全ターンで一貫させたい方針はシステムプロンプトに、乗客の質問や参照するデータのように毎回変わるものはユーザーメッセージに置くのが原則です。こう分けておくと、方針の変更はシステムプロンプトだけを直せば済み、利用者の入力が方針を上書きする余地も小さくなります。","誤答は、方針も含めて毎回ユーザーメッセージに書く、安全上の制約をユーザーメッセージ側に置く、何もかもシステムプロンプトに入れる、のいずれかで、「安定した方針」と「可変な入力」を分けるという観点が欠けています。","長い参照資料を扱う場合は、資料をプロンプトの上部に、質問を末尾に置くと精度が上がる、という配置の工夫もあわせて押さえておくと役立ちます。"],"ref":"https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices"},{"n":13,"stem":["あるセキュリティ運用センター（SOC）が、Claudeアプリを構築しています。このアプリで、自社インフラ内で動く社内SIEMへの独自クエリと、一般的なWeb検索の両方を行いたいと考えています。"],"q":"クライアント側ツール（client tools）とサーバー側ツール（server tools）の実行場所と使い分けについて、正しいものはどれですか。","need":1,"opts":[{"t":"クライアント側ツールもAnthropicのインフラ上で実行され、社内のSIEMには接続できない。","c":false,"e":["クライアント側ツールの実行場所はアプリケーション側で、Claudeはどのツールをどんな入力で呼ぶかを示すだけです。アプリが自社インフラ内で動いていれば、そこから社内SIEMに接続できるため、社内システムとの連携にはまさにクライアント側ツールを使います。"]},{"t":"サーバー側ツールは自分のアプリ内で実行され、実行コードを書いてtool_resultを返す。","c":false,"e":["実行コードを自分で書いてtool_resultを返すのは、クライアント側ツールの扱い方です。web_searchやcode_executionのようなサーバー側ツールはAnthropicのインフラ上で実行され、結果は同じ応答の中に直接含まれるため、アプリ側で実行を扱う必要はありません。"]},{"t":"社内の独自システムにはサーバー側ツールで接続し、Web検索はクライアント側ツールとして自前で実装する。","c":false,"e":["自前のWeb検索をクライアント側ツールとして実装すること自体は、独自の検索基盤を使いたい場合などにあり得る設計です。しかしサーバー側ツールはAnthropicが提供する機能（web_search、web_fetch、code_executionなど）で、利用者が独自の社内システム向けに定義できるものではなく、自社インフラ内のSIEMにも到達できません。"]},{"t":"SIEM照会のような自作ツールはアプリ内で実行され、Web検索はAnthropic側で実行される。","c":true,"e":["正解。ツールは実行される場所で区別されます。自分で定義したクライアント側ツールはアプリ内で実行され、Claudeがstop_reason: tool_useとtool_useブロックを返したら、アプリがSIEMに照会してtool_resultを返します。","Web検索のようなサーバー側ツールはAnthropicのインフラで実行されるので、アプリは結果を受け取るだけで済みます。社内ネットワークの中にあるシステムには、自社環境で動くクライアント側ツールから接続します。"]}],"overall":["ツールが「どこで実行されるか」を理解しているかどうかが、正誤の分かれ目です。公式ドキュメントでは、ツールは主にコードが実行される場所で区別されます。","クライアント側ツール（自分で定義したツールや、bash・text_editorのようにAnthropicがスキーマを定めたツール）はアプリケーションで実行され、Claudeがtool_useを返し、アプリが処理してtool_resultを返す往復になります。サーバー側ツール（web_search、web_fetch、code_execution、tool_searchなど）はAnthropicのインフラで実行され、結果が応答に直接含まれます。","したがって社内インフラ内のSIEMへの独自クエリはクライアント側ツール、一般的なWeb検索はサーバー側ツールという組み合わせになります。","誤答は、実行場所を入れ替える、クライアント側ツールもAnthropic側で動くとみなす、といった形で実行場所を取り違えています。","「そのコードはどこで動き、どのネットワークに届くか」を考えると、社内システム連携の問題は迷わず解けます。"],"ref":"https://platform.claude.com/docs/en/agents-and-tools/tool-use/overview"},{"n":14,"stem":["CRMを提供するあるSaaS企業が、長時間実行のエージェントを構築します。このエージェントには、次の機能が必要です。","障害から再開できる耐久実行","人手による承認（human-in-the-loop）","状態の永続化"],"q":"LangGraphのようなエージェントオーケストレーションフレームワークの採用についての判断として、最も適切なものはどれですか。","need":1,"opts":[{"t":"障害後の再開や状態の保存の仕組みを自作せずに済ませるために採用し、制御フローをグラフで定義する。","c":true,"e":["正解。LangGraphは長時間実行・ステートフルなエージェントのための低レベルのオーケストレーションフレームワークで、状態を永続化して障害後に途中から再開する耐久実行や、状態を確認・修正して人が介入するhuman-in-the-loopを備えています。これらを自作せずに使える一方、処理の流れはノードとエッジのグラフとして開発者が明示的に設計するため、制御の見通しも保てます。"]},{"t":"LLMの呼び出し回数とトークン消費を自動で減らし、APIコストを下げるために採用する。","c":false,"e":["呼び出し回数やトークン消費を減らしたいなら、プロンプトキャッシュやモデル選択、処理設計の見直しといった別の手段を使います。オーケストレーションフレームワークはモデルの外側で制御フローと状態を管理する層で、呼び出しを自動で減らす機能ではありません。フレームワークの内部で何が送られているかを理解せずに使うと、かえって無駄な呼び出しに気づきにくくなる点にも注意が必要です。"]},{"t":"プロンプトやエージェントの構成を自分で書かずに済ませるために採用する。","c":false,"e":["プロンプトや典型的なツール呼び出しループまであらかじめ用意された仕組みで手早く作りたい場合は、LangChainのagentsのような上位の仕組みが向いています。LangGraphは自らを低レベルのオーケストレーションフレームワークと位置づけ、プロンプトやアーキテクチャを隠さない（抽象化しない）ため、エージェントの構成は開発者が設計する前提です。"]},{"t":"採用は見送り、Messages APIでツール使用ループを直接実装して、承認待ちの状態はプロセスのメモリに保持する。","c":false,"e":["Anthropicは、多くのパターンはLLMのAPIを直接使えば数行で実装できるとして、まずシンプルな実装から始めることを推奨しており、短時間で完結するエージェントならこの判断は妥当です。しかし状態がプロセスのメモリにしかないと、障害や再起動で途中経過が失われ、承認待ちで長時間止まる処理を再開できないため、本問の要件を満たすには同等の仕組みを自作することになります。"]}],"overall":["LangGraphは、エージェント向け抽象化フレームワークの1つです。長時間実行・ステートフルなエージェントを構築・管理・デプロイするための低レベルのオーケストレーションフレームワーク兼ランタイムで、耐久実行、human-in-the-loop、短期・長期のメモリといった共通の仕組みを備え、プロンプトやアーキテクチャは抽象化しません。","判断の根拠は、問題文の「障害から再開できる耐久実行」「人手による承認」「状態の永続化」がそのまま実行基盤の要件になっている点です。","これらが不要な単純なエージェントならAPIを直接使う方が見通しがよく（Anthropicもシンプルな実装から始めることを推奨しています）、プロンプトや構成まで用意された仕組みが欲しいならより上位の仕組みを選びます。コスト削減はフレームワークの役割ではありません。","フレームワークの採用は、「要件がフレームワークの提供する機能と一致しているか」「フレームワークの内部で何が起きているかを理解したうえで使えるか」の2点で判断するのが基本です。"],"ref":"https://docs.langchain.com/oss/python/langgraph/overview"},{"n":15,"stem":["あるEdTech企業が、K-12向けの教材を生成する指示（プロンプト）を、Claude Code・claude.ai・Messages APIの3つで試しました。すると、同じ指示でも解釈や出力が異なりました。"],"q":"この違いの理由と対処として最も適切なものはどれですか。","need":1,"opts":[{"t":"差の原因は指示の曖昧さにあるため、指示文を詳しく書き直して3つの出力をそろえる。","c":false,"e":["指示を具体的に書き直すことは、どの環境でも出力の質とぶれを改善する有効な手段です。しかし各インターフェースが付け加えるシステムプロンプトやツール、メモリの違いは指示文の外側にあるため、指示だけを詳しくしても文脈の差は残り、出力がそろう保証にはなりません。"]},{"t":"各インターフェースが付け加える文脈が異なるため、文脈を制御できるAPI上に構築する。","c":true,"e":["正解。claude.aiは独自のシステムプロンプトを、Claude Codeはそれに加えてツール定義やCLAUDE.md、auto memoryなどを指示の周りに付け加えるため、同じ指示でもモデルが受け取る文脈全体は異なります。","Messages APIではシステムプロンプトとメッセージを開発者が組み立てるので、挙動をそろえたい本番用途はAPIやSDK上に構築し、実際に提供する環境で評価するのが適切です。"]},{"t":"3つは同じシステムプロンプトで動くため、差はモデルの不具合としてサポートに報告する。","c":false,"e":["claude.aiやモバイルアプリは、現在の日付の提供や回答スタイルの誘導のために独自のシステムプロンプトを会話の最初に入れており、これはClaude APIには適用されないと公開されています。Claude Codeも独自のシステムプロンプトやツール、CLAUDE.mdなどを文脈に加えるため、同じ指示でも出力が変わるのは設計上の違いで、不具合報告で統一されるものではありません。"]},{"t":"最も良い出力が出たインターフェースを1つに決め、残りの2つでの検証はやめる。","c":false,"e":["用途に合うインターフェースを選ぶこと自体は妥当な判断です。しかし差が生じる理由を理解しないまま1つに絞ると、後で別の環境へ移したり、選んだ環境の設定が変わったりしたときに同じ問題が再発します。本問では教材生成を本番化する前提で、挙動の違いを自分で制御できる状態にしておくことが求められています。"]}],"overall":["Claude Code・claude.ai・Messages APIのどれで試すかによって同じ指示の解釈が変わるのは、モデルが受け取るのが指示文だけでなく、その周りの文脈全体だからです。claude.aiとモバイルアプリは独自のシステムプロンプトを会話の最初に入れており（APIには適用されない）、Claude Codeはさらにツール、CLAUDE.md、auto memory、セッションの状態などを文脈に加えます。一方Messages APIでは、systemとmessagesに何を入れるかを開発者が決めます。","したがって挙動を一貫させたい本番の教材生成は、文脈を自分で組み立てられるAPIやSDKの上に作り、実際に提供する環境で評価するのが筋です。","誤答は、原因を調べずに環境を1つに絞る、モデルの不具合とみなす、指示文の書き方だけに原因を求める、のいずれかで、「指示の外側にある文脈」を見落としている点が共通しています。","インターフェース間の違いを問われたら、まず「モデルに実際に届いている文脈は何か」を考えると整理できます。"],"ref":"https://platform.claude.com/docs/en/release-notes/system-prompts/overview"},{"n":16,"stem":["ある銀行が、登録住所の変更をチャットで受け付けるClaudeアシスタントを構築しています。手順は、必ず次の順序で進める必要があります。","本人確認","新住所の聞き取り","内容の復唱と同意","変更の実行","テストでは、利用者に急かされたClaudeが、本人確認の完了前に住所変更ツールを呼び出す事例が見つかりました。"],"q":"この順序を確実に守らせる設計として最も適切なものはどれですか。","need":1,"opts":[{"t":"エフォートを高い値に設定し、応答のたびにClaudeが手順を確認する推論の量を増やす。","c":false,"e":["エフォートは思考と応答に使うトークン量の目安を調整するパラメータで、難しい推論が必要なタスクの品質を上げたいときに引き上げます。推論が深くなっても、手順を飛ばすかどうかはモデルの判断のままで、住所変更ツールを呼べる状態も変わりません。必須の順序を保証する手段にはならず、コストとレイテンシが増えるだけです。"]},{"t":"現在の手順をアプリ側の状態として保持し、その状態で許可したツールだけをリクエストに含める。","c":true,"e":["正解。Messages APIはステートレスで、会話がどの段階まで進んだかはアプリが管理します。アプリ側で「本人確認済み」などの状態を持ち、状態の遷移は本人確認ツールの成功のようにコードで判定できる事実に基づいて行います。","各状態で使ってよいツールだけをtoolsに渡せば、本人確認前のリクエストには住所変更ツールが存在しないため、Claudeは呼び出しようがありません。対話の柔軟さはClaudeに任せつつ、破れない順序だけをコードで強制する設計です。"]},{"t":"次に進む手順名を毎回の応答でClaudeにJSONで出力させ、アプリはその値に従って処理を切り替える。","c":false,"e":["構造化出力で次の手順名をJSONとして返させる方法は、問い合わせの分類やルーティングの判定をアプリに取り込みたい場面で有効です。ただしJSONの形式が保証されても、どの手順名を選ぶかはモデルの判断のままで、急かされて「変更の実行」を返せばアプリはそれに従ってしまいます。順序の強制を、順序を破り得る側の出力に委ねる構造になっています。"]},{"t":"手順の順序をシステムプロンプトに番号付きで明記し、順序どおりに進む対話をフューショットプロンプティングで示す。","c":false,"e":["番号付きリストで手順を示し、フューショットプロンプティングで望ましい対話を示すのは、順序や網羅性が重要な指示をClaudeに伝える正攻法で、多くの場面で遵守率を上げます。しかしプロンプトはモデルの判断に働きかけるもので、住所変更ツールがリクエストに含まれている限り、利用者に強く急かされた場面で先に呼ばれる可能性は残ります。本人確認のような必須の順序は、確率ではなく仕組みで保証する必要があります。"]}],"overall":["会話の中で「必ずこの順に進む」という業務上の制約を、どこで保証するかが問われています。Anthropicはワークフローを、あらかじめ定めたコードの経路でLLMとツールを組み合わせる仕組みと位置づけ、中間の段階にプログラムによるチェック（ゲート）を置けると説明しています。","本問ではこれを対話に当てはめ、アプリ側に状態機械（ステートマシン）を持たせます。現在の状態に応じて渡すツールを絞り、状態を進める条件を本人確認ツールの成功のようなコードで検証できる事実にしておけば、Claudeが何を言われても、未確認のまま変更が実行されることはありません。","誤答の3つは、いずれも順序を守るかどうかの最終判断をモデルに残しています。プロンプトの工夫、構造化出力、推論量の調整は応答の質を高める手段ですが、破ってはならない順序にはモデルの外側の仕組みを組み合わせる、という線引きを持っておくと設計を誤りません。","なお、ツール定義の変更はプロンプトキャッシュ全体を無効にするため、ツール定義は固定したまま、状態に合わない呼び出しの実行をアプリが拒否してエラーとして返す実装を選ぶこともできます。"],"ref":"https://www.anthropic.com/engineering/building-effective-agents"},{"n":17,"stem":["ある物流企業が、CIパイプラインにClaude Codeを組み込み、プルリクエストのコードレビューを自動化します。"],"q":"ヘッドレスモードとsettings.jsonの使い方として最も適切なものはどれですか。","need":1,"opts":[{"t":"プロジェクトのsettings.jsonでdefaultModeをbypassPermissionsにし、確認を一括で省く。","c":false,"e":["bypassPermissionsは確認をまとめて省くモードですが、permissions.defaultModeのautoとbypassPermissionsはプロジェクト設定やローカル設定からは効かない仕様で、使う場合はユーザー設定・マネージド設定か--permission-modeで指定します。","そもそも全操作を無確認にするのは隔離された環境に限るべき強い設定で、レビュー用途なら必要なツールだけを許可するほうが安全です。"]},{"t":"-pで非対話実行し、必要なツールを--allowedToolsで事前に許可する。","c":true,"e":["正解。-p（--print）を付けるとClaude Codeは非対話モードで動き、結果を標準出力に返すため、CIのスクリプトから扱えます。-pの実行には承認する人がいないので、許可が必要な操作は拒否されます。--allowedToolsで必要なツールを指定しておけば確認なしで実行でき、--permission-mode dontAskと併用すれば、許可していない操作は確認を求めずに拒否されます。","なお共有の.claude/settings.jsonにあるpermissions.allowルールは、フォルダの信頼（workspace trust）を受け入れた後にだけ適用されます。-pは信頼ダイアログを表示しないため、CIが新しくチェックアウトしたフォルダではこの許可ルールは使われません。"]},{"t":"CLAUDE.mdに「CIでは確認なしで実行してよい」と書き、対話モードのまま起動する。","c":false,"e":["CLAUDE.mdは規約やビルド手順をモデルに伝えるための文脈で、権限の判定には関与しません。公式ドキュメントも、Claudeはこれを強制される設定ではなく文脈として扱うと説明しており、書いた文言で確認ダイアログが省かれることはないため、対話モードで起動すればCIは確認待ちで止まります。"]},{"t":"対話モードで起動し、表示される権限確認にはCI担当者がその都度応答して進める。","c":false,"e":["権限確認に人が応答する対話モードは、開発者が手元で変更内容を確かめながら作業する通常の使い方です。CIのパイプラインは無人で動くため、確認待ちで処理が止まり、プルリクエストのたびに人が張り付く運用になって自動化の意味がなくなります。"]}],"overall":["CIパイプラインでClaude Codeを動かすときは、無人で最後まで実行できることと、許可の設定が実際に効くことの2点が問われます。claude -pはプロンプトを受け取って非対話で実行し、結果を標準出力（--output-format jsonなら構造化された形）で返すため、スクリプトやCIから扱えます。確認に答える人がいないので、必要な操作は--allowedToolsで事前に許可し、必要なら--permission-mode dontAskで許可外の操作を拒否させます。","注意したいのは、リポジトリにコミットした.claude/settings.jsonのpermissions.allowルールが、フォルダの信頼（workspace trust）を受け入れた後にだけ適用される点です。-pの実行は信頼ダイアログを表示しないため、CIが新しくチェックアウトしたフォルダでは共有の許可ルールは使われず、許可を置くならコマンドラインの--allowedToolsか、ランナー側のユーザー設定・マネージド設定になります。","誤答は、対話前提のまま運用する案、プロジェクト設定からは効かない権限モードに頼る案、強制力のないCLAUDE.mdに頼る案です。","手元の対話セッションで効いた設定がCIでも同じように効くとは限らない、という点を意識して選択肢を読むと、正解は1つに絞れます。"],"ref":"https://code.claude.com/docs/en/headless"},{"n":18,"stem":["あるゲーム開発会社が、ノンプレイヤーキャラクターのセリフ生成に使うClaudeのプロンプトを、頻繁に改良しています。"],"q":"プロンプトの変更を通常のソフトウェア開発ライフサイクル（SDLC）に統合する方法として最も適切なものはどれですか。","need":1,"opts":[{"t":"プロンプトの変更は本番でA/Bテストにかけ、利用者の反応が良かった版を残していく。","c":false,"e":["本番でのA/Bテストは、事前評価を通過した候補の中から利用者にとって良い方を選ぶ最終段階としては有効な手法です。しかしマージ前の評価やレビューを経ずに本番へ出すと、キャラクター設定の崩れや不適切なセリフといった回帰を利用者が最初に目にすることになり、切り戻しの判断も遅れます。"]},{"t":"企画担当が管理画面からプロンプトを直接編集できるようにし、変更を即時に本番へ反映する。","c":false,"e":["管理画面から直接編集できる仕組みは、試作段階でプロンプトを素早く試すには便利です。ただし変更履歴とレビューが残らないため、どの変更で出力が悪化したのかを追えず、以前の版へ確実に戻すこともできません。"]},{"t":"プロンプト本文は設定データベースで管理し、変更時はコミットメッセージに全文を記録する。","c":false,"e":["プロンプトを設定データとして外出しすること自体は、デプロイせずに差し替えられる利点があり実務でも使われます。しかし本体がバージョン管理の外にあると、コミットメッセージの全文は記録にすぎず、差分レビューやリバート、評価結果との対応づけが機能しません。"]},{"t":"プロンプトをリポジトリで管理し、プルリクエストでレビューと評価を通してからマージする。","c":true,"e":["正解。プロンプトはモデルの出力を左右する成果物なので、コードと同じくバージョン管理下に置けば、差分の確認・レビュー・問題時のリバートがそのまま使えます。Anthropicのプロンプトエンジニアリングのガイドも、改善の前提として成功基準と、それを実証的にテストする手段（評価）を用意することを求めており、プルリクエストで評価結果を確認してからマージすれば、変更の影響を本番前に把握できます。"]}],"overall":["プロンプトはコードと同じく挙動を決める成果物であり、バージョン管理、コードレビュー、自動テスト（評価）、リリースと切り戻し、という通常の開発の流れに乗せることで、変更の追跡性と再現性を確保できます。Anthropicのプロンプトエンジニアリングのガイドも、明確な成功基準と、それに対して実証的にテストする手段を先に用意することを前提にしています。","誤答はどれも実務で見かける手法ですが、評価が本番まで後回しになる（A/Bテストのみ）、履歴とレビューが残らない（管理画面で直接編集）、本体がバージョン管理の外にある（データベース管理）という点で、SDLCへの統合になっていません。","「変更を誰がどこで確認し、問題が出たらどう戻せるか」を問いかけると、プルリクエストで評価とレビューを通す案だけが条件を満たします。"],"ref":"https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/overview"},{"n":19,"stem":["あるEC企業が、返品対応エージェントを開発します。このエージェントは、返品ポリシー文書を読み込み、社内の返品処理スクリプトを実行します。"],"q":"Anthropicのクライアント（Client）SDKでMessages APIを直接呼び出す方式と比べて、Claude Agent SDKを採用する利点として最も適切なものはどれですか。","need":1,"opts":[{"t":"応答をストリーミングで逐次受け取れ、長い処理の途中経過をユーザーの画面に表示できる。","c":false,"e":["ストリーミングはMessages API自体の機能で、Client SDKでもmessages.stream()やstream: trueで応答を逐次受け取れます。長い生成でユーザーを待たせないための有効な手段ですが、Client SDKでも同じことができるため、Agent SDKを採用する利点にはなりません。"]},{"t":"エージェントをAnthropicのインフラ上でホストでき、実行環境やサンドボックスを運用せずに済む。","c":false,"e":["エージェントループとサンドボックスをAnthropicがホストするのはManaged Agentsの特徴で、実行基盤を持たずに長時間の非同期タスクを動かしたい場面に向きます。Agent SDKは利用者自身が運用するプロセスの中でエージェントを動かすライブラリなので、実行環境の運用は利用者側に残ります。"]},{"t":"ファイル操作やコマンド実行の組み込みツールと、それらを実行して結果を返すエージェントループを利用できる。","c":true,"e":["正解。Agent SDKは、Claude Codeを支えるものと同じ組み込みツール（Read・Edit・Bashなど）・エージェントループ・コンテキスト管理を、PythonとTypeScriptのライブラリとして使えるようにしたものです。ツールの実行と結果の返却はSDK側が担います。","Client SDKでは、tool_useの応答を受けてツールを実行し、結果を返して再びAPIを呼ぶループを自前で書くか、ベータ版のtool runnerに任せたうえで、ファイル操作やコマンド実行そのものも自分で実装する必要があります。返品ポリシーの読み込みとスクリプト実行を伴う本問のエージェントでは、この実装負担をまとめて省けます。"]},{"t":"claude.aiのアカウントでログインして動かせ、APIキーを発行せずに自社製品へ組み込める。","c":false,"e":["claude.aiアカウントでのログインは、開発者が対話的に使うClaude Code CLIなどで使える認証方法です。Anthropicは事前の承認なく第三者がAgent SDKで作った製品にclaude.aiログインやそのレート制限を提供することを認めておらず、Agent SDKではAPIキーによる認証を使う必要があります。"]}],"overall":["Client SDKは、Messages APIを直接呼び出すためのライブラリで、モデルがtool_useを返したらツールを実行し、tool_resultを付けて再び呼び出すというループと、ツールそのものの実装を開発者が担います（ループ部分はベータ版のtool runnerに任せることもできます）。これに対しAgent SDKは、Claude Codeと同じエージェントループと組み込みツール（ファイルの読み書き・編集、コマンド実行、Web検索）に加え、フック・サブエージェント・MCP・パーミッション・セッションを備えたライブラリです。","比較の軸は「Client SDKでもできることかどうか」で、ストリーミングやツール使用自体は両方で使えるため差になりません。ホスティングを任せたいならManaged Agents、claude.aiログインはAgent SDK製品では使えない、という区別も押さえておきましょう。","ツールを実行する部分を誰が実装し、誰が運用するのか、という観点でClient SDK・Agent SDK・Managed Agentsを並べると整理しやすくなります。"],"ref":"https://code.claude.com/docs/en/agent-sdk/overview"},{"n":20,"stem":["ある小売企業のカスタマーサポートチャットでは、1人の顧客との対話が長時間続きます。"],"q":"セッションの適切な管理（セッションハイジーン）の観点で、最も適切な設計はどれですか。","need":1,"opts":[{"t":"用件が変わっても同じセッションを使い続け、過去のやり取りを削らずに毎回送り直す。","c":false,"e":["同じセッションで過去のやり取りを残し続けると、以前の用件の文脈を参照できるという利点はあります。しかし用件が変わった後の無関係な履歴がノイズになって必要な内容を正確に拾いにくくなり、再送のたびに入力トークンの課金も増えるため、長時間の対話では品質とコストの両面で不利になります。"]},{"t":"1Mトークンのコンテキストウィンドウを持つモデルを選び、全履歴を上限まで保持する。","c":false,"e":["1Mトークンのウィンドウは、長い契約書や大量の資料を一度に読ませたい用途では大きな利点です。ただし上限に収まることと精度が保たれることは別で、履歴が増えるほどcontext rotによる劣化とトークン費用が増えるため、容量が大きいからといって全履歴を抱え続けるのは健全な設計ではありません。"]},{"t":"会話の状態はサーバー側に保持させ、クライアントは毎回最新のメッセージだけを送る。","c":false,"e":["サーバー側で会話の状態を保持する仕組みは、Anthropicがホストするマネージド型のエージェントのセッションなどには存在します。しかしMessages APIはステートレスで、過去のターンは送られたmessagesの中にしか存在しないため、最新のメッセージだけを送るとClaudeはそれまでの経緯を知らないまま回答します。"]},{"t":"用件ごとにセッションを分け、古い履歴は要約したり削ったりして縮め、関連する文脈だけを残す。","c":true,"e":["正解。Messages APIはステートレスで、会話を続けるには過去のやり取りをmessagesとして毎回送り直すため、履歴はそのままコンテキストウィンドウに積み上がります。公式ドキュメントは、トークンが増えるほど前に読んだ内容を正確に拾えなくなる現象（context rot）を挙げ、何を文脈に入れるかの取捨選択が容量と同じくらい重要だとしています。","用件ごとにセッションを分け、古い部分を要約したり不要な部分を削ったりして縮めれば、応答品質とコストの両方を保てます。"]}],"overall":["長く続くチャットで「履歴をどこまで持ち続けるか」は、セッションの適切な管理（セッションハイジーン）、つまり会話履歴やコンテキストを健全に保つ運用の問題で、品質とコストの両方に効きます。Messages APIはステートレスなので、会話を続けるにはシステムプロンプトと過去のメッセージを毎回送り直し、そのすべてがコンテキストウィンドウに計上されます。公式ドキュメントは、コンテキストは多ければよいわけではなく、トークンが増えるほど前に読んだ内容を正確に拾えなくなる（context rot）ため、何を入れるかの管理が重要だと述べています。","そこで用件の区切りでセッションを分け、長くなった履歴は要約したり（サーバー側のコンパクション）、不要な部分を削ったり（ツール出力の刈り込み）して縮め、関連する文脈だけを残すのが健全な設計です。","誤答のうち、サーバーに状態を持たせる案はAPIの前提と合わず、履歴を削らずに持ち続ける案と大きなウィンドウに頼る案は、いずれもcontext rotとコスト増を招きます。","「履歴を増やせば賢くなる」という直感を疑うことが、この分野の問題を解く出発点です。"],"ref":"https://platform.claude.com/docs/en/build-with-claude/context-windows"},{"n":21,"stem":["ある自動車部品メーカーが、設計関連文書を編集するエージェントを運用しています。監査要件により、エージェントがファイルを変更したときは、例外なく毎回、監査ログに記録しなければなりません。"],"q":"この要件を満たす実装として最も適切なものはどれですか。","need":1,"opts":[{"t":"EditとWriteにマッチさせたPostToolUseFailureフックを設定し、監査記録スクリプトを実行する。","c":false,"e":["PostToolUseFailureは、ツール呼び出しが失敗した後に発火するイベントで、失敗した操作の記録やエラー通知に向きます。ファイル変更が成功したときには発火しないため、成功した変更を毎回監査ログへ残すという本問の要件では、記録すべき変更が残らなくなります。"]},{"t":"監査記録用のサブエージェントを定義し、ファイル変更後に呼び出すようメインエージェントに指示する。","c":false,"e":["専門のサブエージェントに作業を切り出すのは、コンテキストを分離したい調査や専門的なレビューに向く方法です。しかしサブエージェントを呼び出すかどうかはメインエージェント（モデル）の判断に依存するため呼び出し忘れを排除できず、ファイル変更のたびに確実に記録するには、モデルを経由しない仕組みが別に必要です。"]},{"t":"EditとWriteにマッチさせたPostToolUseフックを設定し、監査記録スクリプトを実行する。","c":true,"e":["正解。フックはエージェントのライフサイクルの決まった時点で実行されるユーザー定義の処理で、モデルの判断を経由せず、matcherに合致すればそのたびに起動します。PostToolUseはツール呼び出しが成功した直後に発火するため、EditやWriteによる変更が確定するたびに監査記録のスクリプトが動き、記録漏れをモデルの注意力に頼らずに防げます。"]},{"t":"CLAUDE.mdに「ファイルを編集したら監査ログへ記録する」というルールを記載する。","c":false,"e":["CLAUDE.mdはプロジェクトの規約やビルド手順などをセッション開始時にコンテキストへ読み込ませる仕組みで、コーディング規約の共有などに向きます。ただし内容はモデルへの指示として扱われるだけで実行は強制されないため、長いセッションや複雑な作業の中で記録を忘れる可能性が残り、「例外なく毎回」という監査要件を保証できません。"]}],"overall":["フックを使うと、モデルの判断に左右されない決定論的なアクションを実現できます。フックはツール実行の前後やセッション開始時など、ライフサイクルの特定の時点で自動的に実行されるシェルコマンドやHTTP呼び出しなどの処理で、matcherでツール名（Edit|Writeなど）を絞り込めます。モデルが指示に従うかどうかに関係なく起動するため、「例外なく毎回」という要件をプロンプトではなくコードで担保できます。","押さえるべき点は2つです。1つは、CLAUDE.mdへの記述やサブエージェントへの依頼のようにモデルの判断を経由する方法は確率的で、監査要件の保証にならないこと。もう1つはイベントの選択で、成功後はPostToolUse、失敗後はPostToolUseFailure、実行前の阻止はPreToolUseと役割が分かれていることです。","要件が「確実に」「毎回」を求めていればフックを選び、そのうえで「いつ発火すべきか」でイベント名を決める、という2段階で考えると取り違えません。"],"ref":"https://code.claude.com/docs/en/hooks"},{"n":22,"stem":["ある電力会社が、送電網を監視するClaudeエージェントを運用しています。長時間のセッションでは、各ツールがセンサーデータなどの大量のデータを加工せずにそのまま返し、それがコンテキストにたまって、品質が下がるとともにコストとレイテンシが増えています。"],"q":"コンテキストの肥大化を防ぐ緩和策として、最も適切なものはどれですか。","need":1,"opts":[{"t":"max_tokensを引き上げ、大きくなったコンテキストでも長い応答を最後まで出力させる。","c":false,"e":["max_tokensは1回の応答で生成する出力の上限で、長い回答が途中で切れる（stop_reasonがmax_tokens）場合に引き上げるパラメータです。コンテキストウィンドウの容量は増えず、むしろ出力の分だけウィンドウを多く使うため、蓄積したツール結果による品質低下やコストの問題は解決しません。"]},{"t":"センサーデータを取得するツールの登録を外し、エージェントに生データを取得させない。","c":false,"e":["不要なツールを外すことは、ツール定義そのものが占めるトークンを減らす方法としては有効です。しかしセンサーデータの取得は送電網監視エージェントの中核機能で、利用を止めれば監視という目的自体が成り立たなくなります。問題はツールの存在ではなく、その結果を加工せずに積み上げていることにあります。"]},{"t":"ツール結果を必要な項目に絞ってから追加し、古いやり取りは要約して短くする。","c":true,"e":["正解。ツールの応答を次の判断に必要な項目だけに絞れば、1回ごとに追加される量を減らせます（公式のツール設計の指針でも、必要な情報だけを含む応答が勧められています）。さらに長時間のセッションでは、古いターン（1往復のやり取り）をClaudeがサーバー側で書いた要約に置き換えるコンパクションや、古いツール結果を除去するコンテキスト編集で、後続のステップに必要な状態だけを残します。"]},{"t":"1Mトークンのウィンドウを持つモデルへ移行し、ツールが返したデータをそのまま保持し続ける。","c":false,"e":["大きなウィンドウは、膨大な資料を一度に読ませる必要がある場面では有力な選択肢です。しかし公式ドキュメントが述べるとおり、トークンが増えるほど前に読んだ内容を正確に拾えなくなり（context rot）、入力トークンの課金とレイテンシも増えるため、生データを溜め続ける限り問題文の症状は解消しません。"]}],"overall":["ツールが加工せずに返す大量のデータが積み上がって品質とコストを悪化させる、コンテキストの肥大化への対処が問われています。エージェントは各ステップのツール結果を会話に積み上げていくため、大量のデータをそのまま返すツールを長時間呼び続けると、関係の薄い情報でモデルの注意が分散し、トークン費用とレイテンシも増えていきます。","対策は2段構えで、まず入口でツールの応答を必要な項目に絞り、次に溜まった履歴をコンパクション（古いターンを要約に置き換える）やコンテキスト編集（古いツール結果を除去する）で縮めます。コンパクションは、長い会話や長時間のエージェントを上限内で続けるための主要な戦略と位置づけられています。","誤答は、ツール自体をやめる、出力の上限を変える、ウィンドウの大きさで受け止める、という「量を減らさない」対処で、症状の原因である不要な蓄積に手を付けていません。","コンテキストに何を残すかを設計することが、容量を増やすことより優先される、という考え方がこの分野の出発点です。"],"ref":"https://platform.claude.com/docs/en/build-with-claude/context-windows"},{"n":23,"stem":["ある決済プラットフォームで、取引照合を行うClaudeベースのエージェントが断続的に失敗しています。トレースには、次の2種類の失敗が記録されています。","APIがHTTP 400 invalid_request_errorを返し、即座に失敗する","APIはHTTP 200を返すが、返ってきた本文を自社のパーサでバリデーションすると、不正な形式として弾かれる"],"q":"これらの失敗が、統合レイヤー（自社のリクエスト構築・後処理コード）の不具合によるものか、モデル出力そのものの問題によるものかを切り分けるうえで、最も適切なアプローチはどれですか。","need":1,"opts":[{"t":"max_tokensを引き上げて応答が途中で切れていないことを確かめ、同じ処理を再実行する。","c":false,"e":["stop_reasonがmax_tokensの応答は途中で切れているため、200応答の後にパースで弾かれる一因として確認する価値はあります。しかしmax_tokensは出力の長さを変えるだけで、リクエストの形式や内容の不備を示す400 invalid_request_errorには効かず、2種類の失敗を層ごとに切り分ける手段にはなりません。"]},{"t":"失敗したリクエストを一律に指数バックオフで再試行し、成功した場合は解決済みとみなす。","c":false,"e":["指数バックオフでの再試行は、429（レート制限）や529（過負荷）、500のような一時的なエラーからの回復策としては正しい実装です。しかし400は同じリクエストを送り続けても毎回同じ理由で拒否され、たまたま成功した再試行を「解決」と扱うと、根本原因が隠れたまま失敗が続きます。"]},{"t":"失敗をAPI境界で分類し、4xxは自社の組み立て、200後の不正は出力か後処理の問題とする。","c":true,"e":["正解。Claude APIは予測可能なHTTPステータスとエラー種別を返し、400 invalid_request_errorは「リクエストの形式または内容に問題がある」ことを示すため、送信前の組み立てを担う統合レイヤーを調べる根拠になります。","一方、200が返った後にバリデーションで弾かれる場合はAPI呼び出し自体は成功しているので、stop_reasonや生の応答本文を確認して、モデル出力の問題か自社パーサの問題かを切り分けます。応答ごとのrequest_idを記録しておけば、トレースとAPI側の記録の突き合わせも容易になります。"]},{"t":"より大きなモデルに切り替えて同じ取引を処理し、失敗の頻度が下がるかどうかを観察する。","c":false,"e":["より高性能なモデルへの切り替えは、推論の質が足りないと分かった後の改善策としては妥当です。しかしリクエスト自体が拒否される400は自社コードの問題なのでモデルを変えても解消せず、失敗が減ったかを眺めるだけでは原因がどの層にあるのかは分かりません。"]}],"overall":["失敗が自社の統合レイヤーで起きているのか、モデルの出力で起きているのかを切り分ける手順がテーマです。手がかりになるのはAPIとの境界です。Claude APIは400 invalid_request_error、401 authentication_error、429 rate_limit_error、500 api_error、529 overloaded_errorのように原因の種類を表すステータスとエラー型を返し、すべての応答にrequest-idヘッダーが付きます。","4xxならリクエストがAPIに受け付けられていないので自社の組み立てを、200の後で失敗しているならstop_reasonや生の出力を見てモデル側か自社パーサ側かを調べる、という順で絞り込めます。","誤答のmax_tokens調整、モデル変更、一律の再試行は、いずれも特定の仮説に対する対処で、原因がどの層にあるかを示してくれません。","デバッグの問題では、対処策を試すより先に「失敗がどこで起きているかを特定する手順」を選ぶのが基本です。"],"ref":"https://platform.claude.com/docs/en/api/errors"},{"n":24,"stem":["ある監査法人が、子会社3社の監査報告書をまとめてClaudeに渡し、「3社に共通する内部統制上の指摘事項は何か」と尋ねる機能を作っています。報告書は1本あたり数万トークンあります。","現在のプロンプトでは、質問文を先頭に置き、その後ろに3本の報告書を区切りなしで連結しています。しかし、回答の質が安定せず、どの会社の報告書に基づく記述なのかも分かりにくくなっています。"],"q":"プロンプトの構成の改善として最も適切なものはどれですか。","need":1,"opts":[{"t":"エフォートを高い値に設定し、長い報告書を読み解く思考により多くのトークンを使わせる。","c":false,"e":["エフォートは、思考と応答に使うトークン量の目安を調整するパラメータで、推論の難しいタスクの品質を上げたいときに引き上げます。深く考えさせても、質問が先頭にあって報告書の境目も分からない構成は変わらず、どの会社の記述かを区別する手がかりも増えません。構成の問題を推論量で補おうとすると、コストとレイテンシだけが増えます。"]},{"t":"3本の報告書をそれぞれ事前に要約させ、その要約だけを質問文の後ろに並べて渡す。","c":false,"e":["事前要約は、入力がコンテキストウィンドウに収まらない場合や、細部までは要らず全体像をつかみたい場合に使う手法です。しかし要約の段階で個々の指摘事項が落ちると、3社に共通する指摘という細部の突き合わせができなくなり、要約だけでは元の報告書のどこに基づくかも示せません。入力は十分に収まっているので、情報を削るより構成を整えるのが先です。"]},{"t":"報告書部分の末尾にcache_controlを付け、同じ報告書への2回目以降の質問を速く安くする。","c":false,"e":["プロンプトキャッシングは、同じ接頭辞を繰り返し送るときに2回目以降の入力の処理を安く速くする仕組みで、同じ報告書に何度も質問する運用ではコスト面で有効です。ただしキャッシュはモデルが読む内容を変えないため、回答の質や出典の分かりやすさは改善しません。本問で直すべきは料金ではなく、プロンプトの構成です。"]},{"t":"報告書を先頭に置いて出典名付きのタグで1本ずつ囲み、質問文はその後ろの末尾に置く。","c":true,"e":["正解。Anthropicのプロンプトのベストプラクティスは、2万トークンを超えるような長い入力では文書をプロンプトの上部に置き、質問や指示を末尾に置くよう勧めています。テストでは、特に複雑な複数文書の入力で応答品質が最大30%向上したとしています。","さらに各報告書を＜document＞タグで囲み、＜source＞に会社名などのメタデータを入れれば、Claudeはどの記述がどの会社のものかを取り違えずに扱えます。"]}],"overall":["長い文書を含むプロンプトの組み立て方（ロングコンテキストのプロンプティング）が論点です。公式のガイドは、長い入力を扱う際の要点として次の3つを挙げています。","文書をプロンプトの上部に置き、質問を末尾に回す","複数の文書は＜document＞タグで1本ずつ囲み、＜document_content＞と＜source＞などのサブタグで本文と出典を分ける","必要に応じて、関連箇所を先に引用させてから答えさせる","本問の症状は、質問が先頭にあることと、報告書の境目と出典が示されていないことの2点から説明でき、正解はその両方を直します。","誤答はいずれも実在する有効な手段ですが、情報を削る（事前要約）、料金を下げる（キャッシュ）、推論量を増やす（エフォート）という別の目的のもので、構成の欠点はそのまま残ります。","長い入力で品質が揺れるときは、パラメータを触る前に「文書が上、質問が下、文書ごとに出典付きの境界」という配置になっているかを確かめるのが近道です。"],"ref":"https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices"},{"n":25,"stem":["ある工作機械メーカーが、設備点検の予約や履歴照会のツールを提供する社内MCPサーバーを運用しています。このサーバーに、点検日程を変更するreschedule_inspectionツールを新たに追加しました。","このサーバーを使う複数のAIアプリ（ホスト）では、アプリ側のコードを変えずに、新しいツールとその引数をモデルに提示したいと考えています。"],"q":"MCPでツールとその引数がクライアントに伝わる仕組みとして、正しいものはどれですか。","need":1,"opts":[{"t":"サーバーがpromptsとして公開したテンプレートに引数の説明を含め、利用者に選ばせてモデルへ渡す。","c":false,"e":["promptsは、サーバーが再利用できるプロンプトのテンプレートを公開し、利用者がスラッシュコマンドなどで明示的に選んで使うプリミティブです。利用者の操作を起点にする仕組みなので、モデルが状況に応じて自動でツールを見つけて呼び出す用途には合いません。テンプレートに引数の説明を書いても、ツールとして呼び出せるようにはなりません。"]},{"t":"クライアントがtools/listを送り、返されたinputSchemaなどをモデル向けのツール定義に使う。","c":true,"e":["正解。toolsの機能を宣言したMCPサーバーは、クライアントからのtools/listに対して、各ツールのname、description、JSON Schemaで引数を定義したinputSchemaを返します。クライアントはこれをモデル向けのツール定義に変換して渡すだけでよいため、サーバーにツールを追加すれば、各アプリはコードを変えずに新しいツールをモデルに提示できます。"]},{"t":"クライアントが空の引数でtools/callを試し、返されたエラーの内容から必要な引数をモデルに学ばせる。","c":false,"e":["tools/callでの入力検証エラーは、isError付きのツール実行エラーとしてモデルに返され、引数を直して再試行させる自己修正に役立ちます。しかしこれは呼び出した後の回復の仕組みで、ツールの存在や引数を知る手段ではありません。更新系のツールを試しに呼べば、意図しない変更が起きる危険もあります。"]},{"t":"サーバーがresourcesとして公開したツール仕様書をクライアントが読み、引数の形式をモデルに推測させる。","c":false,"e":["resourcesは、ファイルやデータベースのスキーマ、文書などの参照用データをURIで公開するプリミティブで、どれをコンテキストに入れるかはアプリ側が決めます。ツールの仕様書を資料として読ませても、モデルが呼び出せるツールとしては登録されず、引数の形式も推測に頼ることになります。ツールの発見と引数の定義には、ツール専用の仕組みが用意されています。"]}],"overall":["MCPサーバーが公開するツールを、クライアントがどう発見して使うかという、toolsの基本的なやり取りが論点です。toolsの機能を宣言したサーバーは、tools/listに対して現在使えるツールの一覧を返し、各ツールには名前、人が読める説明、引数を定義するinputSchema（JSON Schema）が含まれます。クライアントはこの一覧をモデルに提示し、モデルが選んだツールをtools/callで実行します。","一覧が変わったときは、listChangedを宣言したサーバーが、購読しているクライアントにnotifications/tools/list_changedを送って再取得を促せます。2026-07-28版の仕様はステートレスで、ツールの一覧を接続ごとに変えることは禁止されていますが、要求に付いた認可に応じて変えることは認められています。","誤答は、参照データ用のresources、利用者が選ぶprompts、呼び出し後のエラー処理という、MCPの別の役割を発見の仕組みと取り違えたものです。","MCPの3つのプリミティブは、主導するのがモデルか、アプリか、利用者かで区別すると整理しやすくなります。"],"ref":"https://modelcontextprotocol.io/specification/2026-07-28/server/tools"},{"n":26,"stem":["ある通信会社が、コールセンターのオペレーターに通話中の回答候補を提示する、Claudeを活用したアシスタントを企画しています。ビジネス要件は次の2つです。","回答候補の表示が1秒以内に始まること","ピーク時に300件の通話で同時利用できること"],"q":"この要件から導かれる技術・インフラ要件として最も適切なものはどれですか。","need":1,"opts":[{"t":"ストリーミングで応答を逐次表示し、429エラーが返ったらretry-afterの秒数だけ待って同じ依頼を再試行する。","c":false,"e":["429を受けたらretry-afterに従って待ってから再試行するのは、一時的なレート超過から回復するための正しい実装作法で、ストリーミングによる表示開始の短縮も妥当です。しかしピーク時の300通話に必要な枠を確保していなければ、再試行の待ち時間そのものが1秒を超える遅延になるため、同時利用の要件を満たす手段にはなりません。"]},{"t":"Message Batches APIで通話ごとの依頼をまとめて投入し、処理キューの上限に収まるよう件数を調整する。","c":false,"e":["Message Batches APIは、即時性が不要な大量のリクエストを非同期で安く処理するための仕組みで、夜間の一括分析などに向きます。バッチは完了までに最長24時間かかり得るため、通話中に1秒以内で回答候補を出すというリアルタイムの要件には使えません。"]},{"t":"コンテキストウィンドウが1Mトークンのモデルを選定し、通話の全文字起こしを毎回の入力に含める。","c":false,"e":["大きなコンテキストウィンドウは、長い契約書や通話記録全体を一度に読ませたい分析用途で有効です。一方で毎回の入力が大きくなるほど最初のトークンが返るまでの時間が延び、ITPMの消費も増えるため、表示開始の速さと同時利用数という本問の要件にはむしろ逆行します。"]},{"t":"ストリーミングで応答を逐次表示し、ピーク時のリクエスト数とトークン量に見合うレート制限枠を確保する。","c":true,"e":["正解。stream: trueを指定するとMessages APIは応答をserver-sent eventsで少しずつ返すため、生成の完了を待たずに最初のトークンから画面に表示でき、「1秒以内に表示が始まる」という体感レイテンシの要件に応えられます。","同時300通話という要件はRPM・ITPM・OTPMの見積もりに直結し、組織の利用ティアの上限で足りなければ、引き上げを事前に申請しておく必要があります。"]}],"overall":["Messages APIはstream: trueでserver-sent events（SSE）による逐次配信に切り替わり、応答全体の完成を待たずに最初のトークンから表示できます。これが「1秒以内に表示が始まる」という要件への答えです。「ピーク時300通話」は、リクエスト数と入出力トークン量を見積もり、組織のレート制限（RPM・ITPM・OTPM）に余裕を持たせるというキャパシティ計画に落とし込みます。","正解を選ぶ条件は、2つの要件の両方に答えているかどうかです。429の再試行は超過が起きた後の回復策で、枠の確保の代わりにはなりません。Batches APIは非同期処理なのでリアルタイム要件に合わず、大きなコンテキストはむしろ遅延と消費を増やします。","要件を「応答の速さ」と「量（同時数）」に分解し、それぞれに対応する仕組みがそろっている選択肢を探す、という読み方が有効です。"],"ref":"https://platform.claude.com/docs/en/build-with-claude/streaming"},{"n":27,"stem":["ある非営利団体が、寄付者対応を支援するClaudeのワークフローを本番運用しています。"],"q":"新しいモデルバージョンがリリースされたときに、モデルのリリース間で生じる挙動の変化に備える方法として、最も適切なものはどれですか。","need":1,"opts":[{"t":"本番のモデルIDを固定し、新モデルは回帰評価で劣化がないと確かめてから移行する。","c":true,"e":["正解。モデルIDを固定していれば、本番の挙動は検証済みのまま保たれ、新モデルへの切り替えは自分たちが決めたタイミングでだけ起こります。そのうえで代表的な入力と合格基準をまとめた回帰評価スイートを維持し、新モデルで実行して劣化がないことを確かめてから移行すれば、リリース間で生じる挙動の変化を本番の前に捉えられます。"]},{"t":"新しいモデルは前の世代より優れているとみなし、既存プロンプトの再テストは省く。","c":false,"e":["新しいモデルの多くは全体的な性能が向上していますが、個々のプロンプトに対する挙動が同じとは限りません。公式の移行ガイドも、以前のモデル向けに調整した指示やエフォートの設定を持ち越さず、自分の評価で改めて確かめるよう勧めており、再テストを省くと出力形式の変化などの回帰を本番で初めて知ることになります。"]},{"t":"移行前に新モデルでプロンプトを数件試し、応答の印象がよければ本番のモデルを切り替える。","c":false,"e":["数件の手動確認は、新モデルの傾向をつかむ最初の一歩としては有用です。ただし少数の例では、まれな入力での崩れや出力形式の変化を見落としやすく、印象で判断すると再現性のある比較になりません。代表的な入力と期待される結果をまとめた評価セットで、旧モデルと並べて測る必要があります。"]},{"t":"新モデルの公開日に本番のモデルIDを差し替え、問題が報告されたら元に戻す。","c":false,"e":["問題が出たら元に戻せる状態で素早く切り替えるのは、影響の小さい社内ツールなら現実的な進め方です。しかし寄付者対応のような対外業務では、問題の報告を待つ時点で既に不適切な応答が相手に届いており、事前の評価で防げた回帰を利用者に見つけさせることになります。"]}],"overall":["新しいモデルが出るたびに起こり得る挙動の変化に、稼働中のシステムでどう備えるかがテーマです。新しいモデルはAPIの互換性を保っていても、同じプロンプトに対する応答の長さ、形式、判断の傾向が変わることがあり、パラメータの扱いが変わって以前の設定がエラーになることもあります（例えばClaude Opus 5.5では、temperatureなどのサンプリング設定の変更や思考の無効化は受け付けられません）。","そのため、本番はモデルIDを固定して挙動を安定させ、評価スイートで新モデルを事前に測ってから移行する、という手順を踏みます。","誤答は、評価を省く（新モデルは優れているという前提）、本番で試す（リリース日に差し替え）、評価が不十分（数件の印象）のいずれかで、「移行前に再現性のある方法で比較しているか」という観点で見ると不足が分かります。","モデル一覧には各モデルの廃止予定日も示されているので、移行は予定に組み込んで計画的に進めるのが実務の定石です。"],"ref":"https://platform.claude.com/docs/en/models/overview"},{"n":28,"stem":["ある人材サービス企業が、外部の求人掲載サービスのREST APIと連携し、新しい求人をPOSTで登録するバッチを実装しています。ネットワークエラーやタイムアウトのときは、リクエストを再試行します。"],"q":"RESTのステータスコードと冪等性を踏まえた実装として最も適切なものはどれですか。","need":1,"opts":[{"t":"タイムアウトしたPOSTはPUTと同じく冪等とみなして再送し、重複した求人は後から手作業で削除する。","c":false,"e":["失敗したリクエストをそのまま再送するのは、GET・PUT・DELETEのような冪等なメソッドなら安全な回復策です。しかしPOSTは冪等ではなく、タイムアウトしただけでサーバー側では登録が完了していることもあるため、単純な再送は求人の二重掲載を生みます。後から手作業で削除する運用では、重複が外部に公開されるまで気づけません。"]},{"t":"5xxが返ったPOSTは登録済みとみなし、再送せずに次の求人の登録処理へ進む。","c":false,"e":["5xxはサーバー側でエラーが起きたことを示すステータスで、処理が完了したことを意味しません。障害の件数を数える監視では5xxも「応答あり」として集計することがありますが、登録処理では5xxの後に求人が作成されたかどうかは応答から判断できず、登録済みとみなすと掲載漏れに気づけなくなります。"]},{"t":"400が返ったリクエストも指数バックオフで再送し、成功するまで一定回数繰り返す。","c":false,"e":["指数バックオフでの再試行は、429（レート制限）や503のような一時的なエラーから回復するための定石です。400 Bad Requestはリクエストの形式や内容の不備を示すクライアントエラーで、内容を直さない限り何度送っても同じ結果になるため、再試行は時間と相手サーバーの負荷を浪費するだけです。"]},{"t":"冪等キーの付与か登録済み確認をしてからPOSTを再送し、429以外の4xxは再送しない。","c":true,"e":["正解。POSTは冪等ではないため、応答を受け取れなかった登録を再送する前に、冪等キー（同じキーの再送を1件として扱わせる仕組み）を付けるか、登録済みかを確認して重複を防ぎます。そのうえで一時的な障害を示す5xxや429は再試行の対象、それ以外の4xxはリクエスト側の不備として修正に回す、とステータスコードで扱いを分けるのが堅牢な実装です。"]}],"overall":["HTTPメソッドの冪等性とステータスコードの意味は、Claude連携を含むあらゆる外部API連携で再試行を設計する際の土台になります。HTTPのメソッドのうちGET・HEAD・PUT・DELETEは冪等（同じリクエストを何度送っても結果が同じ）ですが、POSTとPATCHは冪等ではありません。そのため、タイムアウトなどで結果が分からないPOSTを再送するときは、冪等キーや登録済みの確認で二重登録を防ぐ必要があります。","ステータスコードは2xxが成功、4xxがクライアント側の問題、5xxがサーバー側の問題を表し、再試行に意味があるのは一時的な障害（5xxや429）です。","選択肢を比べるときは「そのまま再送して安全なメソッドか」「そのエラーは待てば直る種類か」の2点を順に確かめると、正解以外の3つがどちらかで破綻していることが分かります。","Claude APIでも、400 invalid_request_errorは再送では解決せず、429や529はバックオフで再試行する、という同じ区別が使われます。"],"ref":"https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Methods"},{"n":29,"stem":["ある建設会社の開発チームが、Claude Codeのコーディング規約と権限設定を、チーム全体に配布したいと考えています。"],"q":"CLAUDE.mdとsettings.jsonの配置と階層の理解として最も適切なものはどれですか。","need":1,"opts":[{"t":"共通の権限はCLAUDE.mdに文章で記載し、settings.jsonの内容は各メンバーに任せる。","c":false,"e":["CLAUDE.mdはセッション開始時に読み込まれ、コーディング規約やビルド手順をモデルに伝えるのに向いています。しかし内容はモデルが参照する文脈であって強制される設定ではないため、許可や拒否のような権限を文章で書いても、実際の権限チェックには反映されません。"]},{"t":"共通の設定は各メンバーの~/.claude/settings.jsonに配布し、リポジトリには置かない。","c":false,"e":["ユーザー設定（~/.claude/settings.json）は、個人の好みや全プロジェクト共通で使いたい設定を置く場所です。チームの共通設定を手作業で各自に配ると、更新のたびに配り直しが必要になり、誰の環境がどの版かも追えないため、リポジトリと一緒に変更・レビューできる配置の利点を失います。"]},{"t":"共通の規約はCLAUDE.md、共通の権限は.claude/settings.jsonに置きGitで共有する。","c":true,"e":["正解。プロジェクト直下のCLAUDE.md（または.claude/CLAUDE.md）はソース管理を通じてチームで共有する指示、.claude/settings.jsonはコミットして全員に同じ権限・フック・プラグインを配る設定として位置づけられています。","個人の好みは~/.claude配下のユーザー設定、そのプロジェクトだけの個人的な上書きはsettings.local.jsonに置けば、共有と個人の設定がきれいに分かれます。"]},{"t":"共通の規約と権限は.claude/settings.local.jsonに書いてコミットし、全員に同じ内容を配る。","c":false,"e":["settings.local.jsonは、そのプロジェクトでの個人的な上書きや、共有前の試験に使うファイルで、Claude Codeが作成する場合はGitから除外されます。これを共有に使うと、各自が個人設定を書く場所がなくなって衝突が起き、チームの正本としての役割も果たせません。"]}],"overall":["チームに配りたい規約と権限を、CLAUDE.mdとsettings.jsonのどこに置くかという配置と階層の理解が問われています。CLAUDE.mdは「モデルに知っておいてほしい指示」、settings.jsonは「Claude Codeに適用させる設定（権限・フック・プラグインなど）」という違いがあり、どちらもユーザー・プロジェクト・ローカルといった範囲ごとに置き場所があります。","チームで共有するものはプロジェクトのCLAUDE.mdと.claude/settings.jsonに置いてGitで配り、個人用は~/.claude配下やsettings.local.json、CLAUDE.local.mdに置きます。同じ設定が複数の場所にある場合は、マネージド設定、コマンドライン、ローカル、共有プロジェクト、ユーザーの順に優先されます（許可ルールのようなリストは結合されます）。","誤答は、配布先を個人の領域にする、個人用のファイルを共有に使う、強制力のないCLAUDE.mdで権限を管理する、という3つのずれ方をしています。","「誰に効かせたいか」と「強制したいのか、伝えたいのか」の2軸で置き場所を決めると整理しやすくなります。"],"ref":"https://code.claude.com/docs/en/settings"},{"n":30,"stem":["あるニュースメディア企業が、長い記事の要約と、読者との複数ターンの対話を行うClaudeアプリを運用しています。"],"q":"運用チームが理解しておくべき、トークン使用量とコンテキストウィンドウの基礎について、正しい記述はどれですか。","need":1,"opts":[{"t":"コンテキストウィンドウは応答の長さの上限で、入力の大きさはウィンドウとは別に管理される。","c":false,"e":["応答の長さの上限を指定するのはmax_tokensパラメータで、コンテキストウィンドウとは別物です。コンテキストウィンドウは応答を生成するときにモデルが参照できるテキスト全体の上限で、システムプロンプト、全メッセージ、ツール定義といった入力と、そのターンの出力の両方がここに数えられます。"]},{"t":"ウィンドウには入力と出力の両方が数えられ、履歴を毎回送るため入力は会話とともに増える。","c":true,"e":["正解。公式ドキュメントでは、システムプロンプト、messages内のすべてのメッセージ（ツール結果や画像を含む）、ツール定義、そしてそのターンに生成する出力（思考を含む）がコンテキストウィンドウに数えられると説明されています。","APIは過去のやり取りを保持しないため、複数ターンの対話では毎回履歴を送り直し、入力トークンは会話が伸びるほど増えていきます。実際の消費量はレスポンスのusageで確認できます。"]},{"t":"出力トークンはウィンドウに数えられず、上限の対象になるのは送信した入力トークンに限られる。","c":false,"e":["生成される出力も同じウィンドウを消費し、入力と出力の合計が上限の対象です。なおClaude 4.5以降のモデルでは、入力とmax_tokensの合計がウィンドウを超えるリクエストも受け付けられ、生成がウィンドウの上限に達した時点でstop_reasonがmodel_context_window_exceededになって止まります。"]},{"t":"最新のユーザーメッセージだけが入力として課金され、過去のやり取りはサーバー側に保持される。","c":false,"e":["会話の状態をサーバー側で保持する仕組みは、claude.aiのようなチャット製品やマネージド型のエージェントには存在します。しかしMessages APIはステートレスで、過去のターン（1往復のやり取り）は毎回のリクエストのmessagesに含めて送り直す必要があり、その分も入力トークンとして数えられ課金されます。"]}],"overall":["コンテキストウィンドウは、モデルが応答を生成するときに参照できるテキスト全体（生成する応答自身を含む）の上限で、現行の多くのモデルでは100万トークンです。Messages APIはステートレスなので、2ターン目以降はシステムプロンプトと過去のメッセージを毎回送り直し、それらはすべて入力トークンとして数えられます。","長い記事を要約した後に対話を続けるアプリでは、記事本文と過去の応答が毎ターン入力に乗るため、プロンプトキャッシングで課金を抑えたり、履歴を要約して縮めたりする設計が必要になります。","誤答は、履歴がサーバーに残るという前提、max_tokensとウィンドウの混同、出力はウィンドウを消費しないという誤解のいずれかです。","usageのinput_tokensとoutput_tokensを実際に確認しながら会話を進めてみると、この仕組みは体感的に理解できます。"],"ref":"https://platform.claude.com/docs/en/build-with-claude/context-windows"},{"n":31,"stem":["あるHR系SaaS企業が、チーム全体でClaude Codeのプラグイン（拡張機能）を導入します。"],"q":"管理上の考慮点として適切なものはどれですか。（2つ選択してください。）","need":2,"opts":[{"t":"各メンバーが好きなプラグインをユーザースコープで入れ、チームの共有設定は用意しない。","c":false,"e":["ユーザースコープでの導入は、個人の好みの道具を全プロジェクトで使いたい場合には便利です。しかしチーム全体で使う前提のプラグインを各自の判断に任せると、メンバーごとに構成がばらつき、同じ操作でも結果が異なる、誰が何を入れたか把握できない、といった問題が起きます。"]},{"t":"有効化するプラグインをコミット済みの.claude/settings.jsonで全員に共有する。","c":true,"e":["正解。プロジェクトスコープでインストールすると、プラグインの有効化はコミットされる.claude/settings.jsonに記録され、そのリポジトリで作業する全員に適用されます。構成をリポジトリで管理すればプルリクエストでレビューでき、共有設定の一部は各メンバーがフォルダを信頼（ワークスペースの信頼確認）した後に有効になるため、意図しない導入も防げます。"]},{"t":"プラグインのバージョンを固定し、更新は変更内容を確認したうえで意図的に適用する。","c":true,"e":["正解。マーケットプレイスは#v1.2.0のようにタグやブランチを指定して追加でき、自動更新の有効・無効もマーケットプレイスごとに切り替えられます。バージョンを固定して更新を意図的に適用すれば、メンバー間で同じ版が動き、挙動の違いが出たときも原因をたどれます。"]},{"t":"マーケットプレイスの自動更新を有効にし、最新版のプラグインが全員に自動で届くようにする。","c":false,"e":["自動更新は、公式マーケットプレイスでは既定で有効になっている仕組みで、個人がセキュリティ修正や新機能を早く受け取りたい場合には適しています。しかしチームで運用する場合は、更新が内容の確認なしに各メンバーへ届き、新しいフックや権限が審査を経ずに加わるため、挙動の再現性と審査済みの状態を保てません。"]},{"t":"導入前の審査は説明文と利用者数の確認にとどめ、追加されるフックやMCPサーバーの中身は見ない。","c":false,"e":["説明文や利用実績の確認は、プラグインを選ぶ最初の手がかりとしては有用です。しかしプラグインが動かすものは利用者自身の権限で実行されるため、インストール画面に表示される「追加されるもの」（フック、MCPサーバー、スキルなど）を確認しなければ、どのコードが自分の環境で動くのかを把握できません。"]}],"overall":["Claude Codeのプラグインは、スキル、サブエージェント、フック、MCPサーバーなどをまとめて導入する仕組みで、有効にしたプラグインは利用者自身の権限で動きます。","チームで扱うときの要点は、構成の共有と変更の管理です。構成の共有は、プロジェクトスコープでインストールし、有効化の設定を.claude/settings.jsonに記録してコミットすることで、全員に同じ構成を配ります。変更の管理は、マーケットプレイスをタグやブランチで固定し、自動更新の設定を見直して、更新を内容の確認後に意図的に適用することで行います。","誤答は、更新を確認なしに自動で取り込む、各自に任せる、表面的な情報だけで審査する、の3つで、どれも構成のばらつきや権限の見落としにつながります。","拡張機能の管理は「誰に配るか」と「いつ変わるか」を自分たちで決められる状態を作ることだ、と捉えると判断しやすくなります。"],"ref":"https://code.claude.com/docs/en/plugins/install"},{"n":32,"stem":["ある大学の研究支援チームが、Claude Codeを導入し、構成要素の使い分けを整理しています。"],"q":"各構成要素の説明として最も適切なものはどれですか。","need":1,"opts":[{"t":"CLAUDE.mdは必要時に読み込まれる手順書で、スキルは毎セッション読み込まれる規約である。","c":false,"e":["CLAUDE.mdとスキルの読み込み方が逆になっています。毎回読み込まれるのがCLAUDE.md、必要時に本文が読み込まれるのがスキルで、公式ドキュメントも「常に知っておくべきことはCLAUDE.md、ときどき必要な参考資料や呼び出して使う手順はスキル」と使い分けを示しています。"]},{"t":"サブエージェントは親の会話履歴を引き継ぎ、親と同じコンテキストの中で作業を進める。","c":false,"e":["親の会話をそのまま引き継いで分岐させるのは、fork型のサブエージェントの挙動です。通常のサブエージェントは親の会話履歴を持たない独立したコンテキストで動き、途中の読み込みやツール結果はその中に留まって、親には要約された結果だけが返ります。この分離によって、親のコンテキストを汚さずに大量のファイル調査などを任せられます。"]},{"t":"Agent Memoryは人が書く規約ファイルで、Claudeが学びを自動で書き込むことはない。","c":false,"e":["人が書いて毎セッション読み込ませる恒久的な指示は、CLAUDE.mdの役割です。Claude Codeのauto memory（Agent Memory）は、ユーザーの訂正や好みをもとにClaude自身が書き込むメモで、セッション開始時に先頭部分（200行または25KBまで）が読み込まれます。書き手が人かClaudeかという点で、両者ははっきり分かれています。"]},{"t":"CLAUDE.mdは毎セッション読み込まれる規約で、スキルは必要時に読み込まれる手順である。","c":true,"e":["正解。CLAUDE.mdはセッション開始時に全文がコンテキストに読み込まれ、ビルド手順やコーディング規約のような「毎回知っておくべきこと」を置く場所です。スキルは説明文だけが常に見えていて、呼び出されたときや関連するときに本文が読み込まれるため、長い手順書や参考資料を置いても、使うまではほとんどコンテキストを消費しません。"]}],"overall":["Claude Codeの構成要素（ルール、スキル、コマンド、エージェント、エージェントメモリ）は、読み込まれるタイミングと書き手で見分けられます。整理の軸は「いつ読み込まれるか」と「誰が書くか」です。","CLAUDE.md（および.claude/rules/）は人が書き、毎セッション読み込まれる規約です。","スキルは人が書く手順や参考資料で、説明文だけが常に見え、使うときに本文が読み込まれます（カスタムのスラッシュコマンドは現在スキルに統合され、/名前 で呼び出せます）。","サブエージェントは独立したコンテキストで作業して要約を返すワーカーです。","auto memoryはClaudeが自分で書き込む学びのメモです。","誤答は、書き手を取り違える（Agent Memory）、コンテキストの分離を見落とす（サブエージェント）、読み込みのタイミングを逆にする（CLAUDE.mdとスキル）という典型的な混同を並べたものです。","構成要素の問題では、この2つの軸で表を作って覚えておくと取り違えを防げます。"],"ref":"https://code.claude.com/docs/en/features-overview"},{"n":33,"stem":["ある電子機器メーカーが、次の2つのMCPサーバーを開発しています。","開発者のマシン上でサブプロセスとして動き、ローカルのファイルやCLIにアクセスするサーバー","ネットワーク越しに多数のクライアントへ提供するサーバー"],"q":"MCPサーバーのトランスポートの選択として最も適切なものはどれですか。","need":1,"opts":[{"t":"サブプロセスで動くローカル用はstdio、多数に提供するリモート用はStreamable HTTPにする。","c":true,"e":["正解。MCPのトランスポートは2種類です。stdioは同じマシン上のプロセス間を標準入出力で直接つなぐ方式で、ネットワークのオーバーヘッドがなく、ローカルサーバーは通常1つのクライアントに提供されます。","Streamable HTTPは、クライアントからサーバーへのHTTP POSTと任意のServer-Sent Eventsで通信する方式です。リモートサーバーを多数のクライアントに提供するときに使い、Bearerトークンなどの標準的なHTTP認証に対応します。配置と提供範囲に応じて選び分けるのが適切です。"]},{"t":"ネットワーク提供用のサーバーも各利用者の端末にサブプロセスとして配布し、HTTPは使わない。","c":false,"e":["各利用者の端末にサーバーを配布してstdioで動かす形は、利用者のローカル環境にアクセスする必要があるツールや、パッケージとして配りたい場合には実際に使われます。しかし本問のもう一方は「ネットワーク越しに多数のクライアントへ提供する」サーバーで、端末ごとに配布すると更新や認証を中央で管理できず、要件そのものを満たしません。"]},{"t":"両方をStreamable HTTPで実装し、開発者の端末で動くサーバーもローカルのHTTPポートで公開する。","c":false,"e":["Streamable HTTPはリモートサーバーの標準的な方式で、ローカルで動かすことも技術的には可能です。しかし開発者の端末でサブプロセスとして動くサーバーにHTTPを使うと、ネットワーク経由のオーバーヘッドとポート公開に伴う認証・露出の考慮が増えるだけで、ネットワーク負荷のない直接通信というstdioの利点を捨てることになります。"]},{"t":"ローカル用とネットワーク提供用の両方をstdioで実装し、リモートの利用者にも同じ方式で提供する。","c":false,"e":["stdioは標準入出力を使って同じマシン上のプロセス同士が直接やり取りする方式で、ネットワーク越しに通信する手段を持ちません。ローカル用には最適ですが、多数のクライアントへネットワーク越しに提供するリモートサーバーには使えないため、要件の片方を満たせません。"]}],"overall":["MCPでは、ホスト（Claude Codeなど）がサーバーごとにクライアントを作って接続し、その通信経路をトランスポート層が担います。","stdioは同じマシン上のプロセス間通信で、ネットワークを介さずに最適な性能でやり取りでき、ローカルのファイルやCLIにアクセスする用途に向きます。ローカルサーバーは通常、1つのクライアントに提供されます。","Streamable HTTPはHTTP POSTと任意のSSEを使うリモート向けの方式で、多数のクライアントへの提供と、Bearerトークン・APIキー・カスタムヘッダーなどの標準的なHTTP認証に対応します。トークンの取得にはOAuthが推奨されています。","誤答は、片方の方式で両方をまかなおうとするか、提供形態を変えて要件をすり替えるもので、「どこで動き、誰に提供するか」という配置の条件に合っていません。","トランスポートの問題は、ローカルかリモートか、単一か多数か、の2つの条件を読み取れば答えが決まります。"],"ref":"https://modelcontextprotocol.io/docs/2026-07-28/learn/architecture"},{"n":34,"stem":["ある法律事務所では、数万トークンある契約書について、多数の異なる質問をClaudeに繰り返し送信します。契約書のテキストは毎回同じで、質問の前に置きます。"],"q":"プロンプトキャッシングでコストを削減する設計として正しいものはどれですか。（2つ選択してください。）","need":2,"opts":[{"t":"キャッシュ書き込みは使わずに、同じ契約書への質問を1回のリクエストにまとめて送る。","c":false,"e":["この案の前提にある、キャッシュ書き込みが基本入力より割高（5分TTLで1.25倍、1時間TTLで2倍）という点は事実で、一度しか使わない資料をキャッシュしても得にならないという判断自体は正しい考え方です。しかし本問は同じ契約書に多数の質問を繰り返し送る状況で、2回目以降は安価なキャッシュ読み出しになるため、書き込みの割増分はすぐに回収できます。"]},{"t":"毎回変わる受付日時を含むユーザーメッセージの末尾にcache_controlのブレークポイントを置く。","c":false,"e":["会話の末尾にブレークポイントを置く設計は、会話が伸びるたびにキャッシュする範囲を延ばしていく多ターンのチャットでは有効です。しかしキャッシュのヒットにはブレークポイントまでの内容が完全に一致する必要があるため、毎回変わる日時を含むブロックに置くと一度もヒットせず、書き込みの費用だけがかかり続けます。"]},{"t":"キャッシュ済みの契約書をコンテキストウィンドウの枠外として扱い、参考資料をさらに追加する。","c":false,"e":["キャッシュされた接頭辞もコンテキストウィンドウを占有し続けます。キャッシュが変えるのは支払う料金で、ウィンドウに数えられるかどうかではありません。なお多くのモデルではキャッシュヒット分がレート制限（ITPM）に数えられませんが、それはウィンドウの容量とは別の話で、資料を足せばその分だけウィンドウを消費します。"]},{"t":"契約書を先頭に置いてその末尾にcache_controlを付け、毎回変わる質問はその後ろに置く。","c":true,"e":["正解。キャッシュの接頭辞はtools、system、messagesの順に組み立てられ、ブレークポイントまでの内容が以前のリクエストと一致したときに再利用されます。変わらない契約書を前方に置いてその末尾にcache_controlを付け、毎回変わる質問をブレークポイントの後ろに置けば、契約書部分は安価なキャッシュ読み出しで処理され、質問部分だけが通常の入力として課金されます。"]},{"t":"キャッシュ対象の接頭辞が、モデルごとの最小キャッシュ可能トークン数以上になるようにする。","c":true,"e":["正解。プロンプトキャッシングにはモデルごとに最小キャッシュ可能トークン数（現行モデルでは512〜4,096トークン）があり、これに満たない接頭辞はcache_controlを付けてもエラーにならず、キャッシュされないまま処理されます。","数万トークンの契約書は十分な長さですが、実際にキャッシュされたかは、レスポンスのusageにあるcache_creation_input_tokensとcache_read_input_tokensで確認します。"]}],"overall":["プロンプトキャッシングのキャッシュは、ブレークポイント（cache_control）までの接頭辞が以前のリクエストと完全に一致したときに再利用され、読み出しは多くのモデルで基本入力の0.1倍（Claude Opus 5.5は0.05倍）、書き込みは5分TTLで1.25倍です。","したがって「変わらない部分を前に、変わる部分を後ろに」並べ、変わらない部分の末尾にブレークポイントを置くのが基本形になります。また最小キャッシュ可能トークン数を下回る接頭辞はエラーを出さずにキャッシュされないため、効果が出ない原因として見落としやすい点です。","誤答は、書き込みの割増だけを見て再利用の効果を無視するもの、毎回変わる内容にブレークポイントを置くもの、キャッシュとコンテキストウィンドウを混同するものです。","キャッシュが変えるのは料金とレイテンシで、ウィンドウの容量や送信する内容は変わらない、という一点を押さえておけば迷いません。"],"ref":"https://platform.claude.com/docs/en/build-with-claude/prompt-caching"},{"n":35,"stem":["あるコンサルティング会社が、複数のワークロードに使うClaudeのモデル（Opus・Sonnet・Haiku）を選定しています。"],"q":"品質・レイテンシ・コストのトレードオフに基づくモデル選定の考え方として、正しいものはどれですか。（2つ選択してください。）","need":2,"opts":[{"t":"一度評価して選んだモデルは、後継のモデルが出ても再評価せずにそのまま使い続ける。","c":false,"e":["一度選んだモデルを使い続けることは、検証済みの挙動を保つという意味で本番運用の安定には役立ちます。しかし後継モデルでは同じ価格のまま品質や速度が改善されることが多く、各モデルIDには廃止の予定日もあるため、評価セットを使って定期的に再評価し、移行を判断する必要があります。"]},{"t":"品質がコストより重要な複雑で自由度の高い分析には、単価が高くてもOpusを選ぶ。","c":true,"e":["正解。Opus系は本問の3系統の中で最も高い推論能力を持ち、長時間のエージェント作業や高度な知的作業に向くモデルです。単価とレイテンシは高くなりますが、回答の質が事業価値を左右する分析では、その品質差がコストを上回ります（さらに難しい推論向けには上位のClaude Fable 5.2も用意されています）。"]},{"t":"複雑な分析にも最も安いHaikuを使い、推論の難しさはプロンプトの工夫で補う。","c":false,"e":["プロンプトの改善で小さなモデルの性能を引き出すことは、コスト最適化の正攻法の1つです。ただし多数の要素を突き合わせる複雑な分析では、モデル自体の推論能力の差がプロンプトの工夫では埋めきれないことが多く、品質が最も重要な要件なら上位モデルを選ぶ正当な理由になります。"]},{"t":"大量で単純な分類やルーティングで速度とコストを優先するなら、Haikuを選ぶ。","c":true,"e":["正解。Claude Haiku 5.5は現行ラインアップで最も速く、入力100万トークンあたり0.10ドル・出力0.50ドルからと最も安価なモデルで、分類・抽出・ルーティングのような大量でレイテンシが重要な処理向けと位置づけられています。問い合わせの振り分けや定型分類のように1件あたりの推論が軽く件数が多い処理では、この速度と単価の差がそのまま全体のレイテンシとコストに効きます。"]},{"t":"分類から分析までの全ワークロードで、使うモデルをOpusの1種類に統一しておく。","c":false,"e":["上位のモデルに統一すると、モデルごとの評価や切り替えの手間が減り、品質面の不安も小さくなるという利点はあります。しかしOpus 5.5の単価はHaiku 5.5の数十倍で、レイテンシも大きいため、軽い分類まで同じモデルで処理すると品質の上積みがほとんどないまま費用と待ち時間が増えます。"]}],"overall":["現行のラインアップの位置づけは次のとおりです。","Haiku 5.5は最速・最安で、分類や抽出、ルーティングのような大量の処理向け（入力$0.10／出力$0.50から）","Sonnet 5.5は速度と知能の最良の組み合わせ（$2／$10）","Opus 5.5は長時間のエージェント作業や高度な知的作業向け（$4／$20）","迷ったらOpus 5.5から始めるよう案内されています。","選定の基本は、タスクの難しさと件数、許容できるレイテンシ、予算を並べ、要件を満たす最も効率のよいモデルを選ぶことです。件数が多く軽い処理は下位モデル、品質が最も重要な処理は上位モデル、という割り当てが典型になります。","誤答は、全ワークロードを1つのモデルに寄せる、プロンプトで能力差を埋められるとみなす、一度の評価で固定し続ける、といった一律の判断です。","モデル選定は評価セットで実測しながらタスク単位で決め、モデルのリリースごとに見直す継続的な作業だと捉えておくと、選択肢の良し悪しが見えやすくなります。","なお、モデルのラインアップと価格は2026年11月時点のものです。試験ガイド（2026年7月版）より後に新しいモデルが出ているため、本試験では当時のラインアップ（例えばClaude Haiku 4.5）を前提に出題される可能性があります。"],"ref":"https://platform.claude.com/docs/en/models/overview"},{"n":36,"stem":["ある食品メーカーは、自社のClaudeアプリで、回答の前に必ず原材料アレルゲン照合ツールを呼び出させたいと考えています。また、ツールの呼び出しが失敗することもあります。"],"q":"tool_choiceの制御とツールエラーの扱いについて、最も適切な設計はどれですか。","need":1,"opts":[{"t":"tool_choiceはautoのままにし、失敗したときは同じツールをアプリ側で成功するまで何度も再実行する。","c":false,"e":["一時的な失敗をアプリ側で再試行することは、ネットワークの瞬断などには有効な回復策です。しかしautoではツールを呼ぶかどうかをClaudeが毎ターン判断するため「回答前に必ず照合する」要件を保証できず、成功するまで無制限に再実行すると、障害が続いたときに応答が返らなくなります。"]},{"t":"対応モデルではtool_choiceで指名し、失敗時はis_error付きのtool_resultを返す。","c":true,"e":["正解。tool_choiceはauto（既定。呼ぶかどうかをClaudeが判断）、any（いずれかのツールを必ず使う）、tool（指名したツールを必ず使う）、none（ツールを使わない）から選べます。対応するモデルでは、toolで照合ツールを指名すれば毎回呼ばせられます。","ツールが失敗したときは、エラー内容をcontentに入れ、is_error: trueを付けたtool_resultを返すと、Claudeは失敗を認識したうえで利用者への説明や再試行を判断できます。なおClaude Opus 5.5などanyとtoolを受け付けないモデルでは、autoのまま、いつ照合ツールを使うかをプロンプトで指示し、strict tool useと組み合わせる方法が案内されています。"]},{"t":"ツールが失敗したら空のtool_resultを返し、Claudeにはエラーがあったことを伝えない。","c":false,"e":["結果が本当に空のとき（該当データなし）に空のtool_resultを返すのは正しい使い方です。しかし失敗を空の結果に見せかけると、Claudeは「アレルゲンは見つからなかった」と誤解して回答を続けるおそれがあり、食品のアレルゲン確認では安全上の重大な誤りにつながります。"]},{"t":"ツールが失敗したら例外を送出して会話を終了し、tool_resultは返さずに処理を打ち切る。","c":false,"e":["回復の見込みがない致命的な障害（認証情報の失効など）では、処理を打ち切って運用者に通知する判断が妥当な場合もあります。しかしツールの一時的な失敗のたびに会話を終えると、Claudeが状況を説明したり別の手段を提案したりする機会がなくなり、利用者は理由の分からないまま回答を得られません。"]}],"overall":["tool_choiceは次の4種類から選べます。","autoは既定の値で、呼ぶかどうかをClaudeが判断する","anyは、いずれかのツールの使用を必須にする","toolは、指名したツールの使用を必須にする","noneは、ツールを使わせない","ただし強制（anyとtool）は、2026年9月以降に公開された一部のモデル（Claude Opus 5.5やClaude Fable 5.1など）では400エラーになるため、その場合はautoとプロンプトでの指示、strict tool useを組み合わせます。この変更は試験ガイド（2026年7月版）より新しいため、本試験では強制できる前提で出題される可能性があります。","ツールの失敗は、is_error: trueを付けたtool_resultでエラー内容を返すのが正しい伝え方です。何が起きたか、次に何を試すべきかを具体的に書くと、Claudeが推測に頼らず回復しやすくなります。","誤答は、会話を打ち切る、失敗を隠す、アプリ側で無制限に再試行する、のいずれかで、Claudeに状況を知らせて判断させるという設計から外れています。","モデルの世代によって使えるパラメータが変わる点も含めて、公式の対応表を確認する習慣をつけておくと安心です。"],"ref":"https://platform.claude.com/docs/en/agents-and-tools/tool-use/define-tools"},{"n":37,"stem":["ある自治体が、住民からの問合せに回答する、Claudeを活用したシステムを本番リリースしました。"],"q":"ITシステムのライフサイクル管理の観点から、リリース後の運用・保守フェーズの活動として最も適切なものはどれですか。","need":1,"opts":[{"t":"応答品質と利用状況を監視し、モデル更新や制度改正の影響を評価して計画的に改修していく。","c":true,"e":["正解。運用・保守フェーズの中心は、稼働中のシステムが要件を満たし続けているかを監視し、環境の変化に合わせて計画的に直すことです。LLMを組み込んだシステムでは、モデルの世代交代や廃止予定、回答の根拠となる制度の改正が品質に直結するため、評価用の質問セットで影響を確かめてから改修を反映する運用が求められます。"]},{"t":"障害監視とサーバー再起動の手順を整備し、保守の作業を稼働率の維持に集中させる。","c":false,"e":["障害監視と復旧手順の整備は、可用性を守る運用・保守の基本で欠かせない活動です。ただしサーバーが正常に動いていても、制度改正で古くなった回答やモデル更新による応答の変化は検知できないため、住民に誤った案内を出し続けるリスクが残ります。"]},{"t":"住民が押した評価ボタンの結果をモデルの再学習に回し、回答品質を自動で改善させる。","c":false,"e":["利用者の評価を集める仕組み自体は、品質の傾向を把握するのに役立ちます。しかしClaude APIのモデルは運用中の会話から自動的に学習して更新されるものではなく、API経由のファインチューニングも現在は提供されていないため、評価結果はプロンプトや参照データの改修、評価用の質問セットの拡充に運用側が活かす必要があります。"]},{"t":"開発時のテストで品質を確定させ、次回のシステム更改までは回答内容の変更を凍結する。","c":false,"e":["変更凍結は、繁忙期や大規模な移行の直前など、リスクの高い期間に一時的に変更を止める運用として実際に使われます。しかしLLMを組み込んだシステムでは、利用中のモデルの廃止予定や制度改正による回答根拠の変化が稼働中にも起こるため、次期更改まで凍結すると誤った案内を直す手段がなくなります。"]}],"overall":["リリースした後に何を続けるべきか、つまり運用・保守フェーズの中身がテーマです。システムはリリースで完成ではなく、利用状況と品質を監視し、外部環境の変化に合わせて改修を続けることで価値を保ちます。LLMを組み込んだシステムでは、利用中のモデルIDにも廃止（retirement）の予定日があること、制度改正で回答の根拠が変わること、住民の質問の傾向が変わることが品質に影響します。","可用性の監視や一時的な変更凍結は運用の一部として実在する考え方ですが、「回答の中身が今も正しいか」を見続ける活動が抜けています。また、APIのモデルが運用中の会話から自動で賢くなるという前提は成り立たず、改善は運用側の評価と改修で行います。","問題文が「住民からの問合せに回答する」システムである点に注目すると、稼働率よりも回答品質の維持が問われていると読み取れます。"],"ref":"https://platform.claude.com/docs/en/models/overview"},{"n":38,"stem":["ある音楽ストリーミング企業の開発チームが、Claudeとの統合で、公式Python SDKを使うか、生のHTTPリクエストで直接呼ぶかを検討しています。"],"q":"SDKとREST APIの関係について正しい記述はどれですか。","need":1,"opts":[{"t":"SDKは生のHTTPとは別の高速なエンドポイントに接続し、同じ呼び出しでも応答が速い。","c":false,"e":["SDKも生のHTTPも、同じAPIエンドポイントへリクエストを送ります。応答速度を左右するのはモデルの選択、入出力の長さ、思考の量などで、SDKを使うことで別経路の高速なサーバーにつながるわけではありません。"]},{"t":"SDKを使うと、生のHTTPでは呼び出せないSDK専用のモデル機能を利用できる。","c":false,"e":["SDK固有のヘルパー（ストリームを集約して最終メッセージを返す関数や、ツール実行のループを代行するtool runnerなど）は存在しますが、これらはAPIの呼び出し方を楽にするための機能です。モデル側の機能はMessages APIのパラメータとして公開されており、生のHTTPでも同じ機能を使えます。"]},{"t":"SDKはserver-sent eventsを扱えず、ストリーミングを使う場合は生のHTTPで実装する。","c":false,"e":["公式SDKはストリーミングを組み込みでサポートしており、Pythonのmessages.stream()のように、テキストの差分を順に受け取るヘルパーや、ストリームを最後まで受けて完全なメッセージを返すヘルパーを備えています。max_tokensの大きい非ストリーミングのリクエストでは、SDKがタイムアウトを避けるためにストリーミングの利用を求めることもあります。"]},{"t":"SDKは生のHTTPと同じAPIを呼ぶクライアントで、型定義や再試行などの利便を加えるが機能は同じである。","c":true,"e":["正解。Anthropicの公式クライアントSDK（Python、TypeScript、C#、Go、Java、PHP、Ruby）は、いずれもMessages APIを呼び出す汎用クライアントで、型安全なインターフェース、ストリーミング、再試行、エラー処理を組み込みで提供します。到達するのは生のHTTPと同じAPIなので機能の差はなく、SDKを使うかどうかは実装の手間と保守性で判断します。"]}],"overall":["公式SDKを使うか生のHTTPで呼ぶかの判断は、SDKがREST APIのラッパーであることを理解していれば迷いません。Claude APIの本体はHTTPのREST APIで、SDKはそれを各言語から扱いやすくする汎用クライアントです。","SDKが加えるのは、次のような実装上の利便です。","型付きのリクエスト・レスポンス","ストリーミングのヘルパー","接続エラーやレート制限・5xxに対する自動再試行（既定で2回、retry-afterヘッダーに従う）","型付きの例外","到達できるAPIの機能は生のHTTPと同じです。","誤答は、SDK専用の機能がある、別の高速経路につながる、SDKはSSEを扱えない、という「SDKとAPIが別物である」前提に立っています。","逆に、使いたい言語にSDKがない環境や依存を増やしたくない場面では、生のHTTPを選んでも機能面の不利はない、という理解もあわせて持っておくと応用が利きます。"],"ref":"https://platform.claude.com/docs/en/cli-sdks-libraries/overview"},{"n":39,"stem":["ある在宅介護事業者が、スタッフのケア記録作成を支援するClaudeアシスタントを構築しています。記録には、氏名・住所・健康状態などの個人情報（PII）が含まれます。"],"q":"PIIの漏えいを防ぐ設計として最も適切なものはどれですか。","need":1,"opts":[{"t":"タスクに必要な項目だけを渡し、直接識別子はマスキングし、ツールの権限を狭く絞る。","c":true,"e":["正解。公式ドキュメントは、注入が成功しても被害を最小にするために最小権限の原則を適用し、Claudeに不要な秘密情報へのアクセスを与えず、権限をできるだけ狭く絞るよう勧めています。個人情報も同じ考え方で扱い、記録作成に必要な項目だけを渡し、氏名などの直接識別子は送信前に仮のIDへ置き換え、ツールが参照できる範囲を担当する利用者に限定すれば、万一の漏えい時にも露出する情報を最小にできます。"]},{"t":"直接識別子をマスキングし権限も絞るが、全利用者の記録はシステムプロンプトに常時載せておく。","c":false,"e":["直接識別子のマスキングと権限の限定は、正解と同じく有効な対策です。しかし全利用者の記録をシステムプロンプトに常時載せると、1件の注入や誤出力で担当外の利用者の情報まで引き出され得る状態が残り、「必要な項目だけを渡す」というデータ最小化の要件を欠いたままになります。"]},{"t":"監査に備えて、モデルに送ったプロンプトと応答を氏名入りのまま全文ログに保存する。","c":false,"e":["監査のために入出力を記録することは、問題が起きたときの調査に役立つ正当な運用です。しかし氏名や健康状態を含むまま全文を保存すると、本来の保存先の外に個人情報の写しが増え、ログを閲覧できる人やシステムから漏えいする経路になるため、記録するならマスキングや項目の限定が必要です。"]},{"t":"記録はTLSで送信し保存時も暗号化するため、プロンプトに渡す項目の最小化は行わない。","c":false,"e":["TLSによる通信の暗号化と保存時の暗号化は、盗聴やストレージの流出から個人情報を守る基本の対策で、欠かせません。しかしそれは経路と保管の保護であり、モデルが受け取った情報を出力に含めたり、注入によって引き出されたりするリスクは減らないため、渡す項目そのものを絞る対策の代わりにはなりません。"]}],"overall":["個人情報（PII）を扱うアプリケーションで漏えいを防ぐ基本はデータ最小化と最小権限で、「モデルに何を見せるか」と「モデルが何にアクセスできるか」の両方を必要最小限に絞ります。具体的には次のようにします。","タスクに必要な項目だけを渡す","直接識別子は送信前にマスキングやトークン化で置き換える","ツールや権限の範囲を担当分に限定する","ログやURLに個人情報を残さない","公式のガードレールのドキュメントも、注入が成功した場合の被害を小さくするために、不要な秘密情報へのアクセスを与えず権限を狭く絞ることを勧めています。","誤答は、通信と保存の暗号化で足りるとする、氏名入りの全文ログを残す、2つの対策を講じながら全件を常時読み込ませる、のいずれかで、どれかの経路で露出する範囲が広がったままです。","PIIの問題では「漏れたときにどこまで広がるか」を想像し、その範囲を最も小さくする選択肢を選ぶと判断を誤りません。"],"ref":"https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/mitigate-jailbreaks"},{"n":40,"stem":["あるレストランチェーンが、モバイルアプリの注文チャットにClaudeを組み込みます。応答が長くなるときでも顧客を待たせないように、Messages APIのストリーミングの採用を検討しています。"],"q":"ストリーミングの仕組みと利点の説明として正しいものはどれですか。","need":1,"opts":[{"t":"stream: trueでSSEの逐次配信を受け取り、届いた分から画面に表示していく。","c":true,"e":["正解。リクエストでstream: trueを指定すると、Messages APIは応答をserver-sent events（SSE）のイベント列として返し、テキストはcontent_block_delta内のtext_deltaとして少しずつ届きます。クライアントは受信のたびに表示へ追記できるので、長い応答でも最初の文字がすぐに表示され、顧客の体感待ち時間が短くなります。"]},{"t":"出力トークンの単価が標準の50%に下がり、長い応答ほど注文チャットの費用を抑えられる。","c":false,"e":["標準料金から50%割り引かれるのはMessage Batches APIの特徴で、即時性を手放す代わりに得られる割引です。ストリーミングは応答の届け方を変えるだけでトークン単価は変わらないため、注文チャットのコストを下げる根拠にはなりません。"]},{"t":"生成完了後に本文を1つのイベントにまとめて送り、クライアント側で表示を一括で更新する。","c":false,"e":["生成の完了を待って応答全体を一度に受け取るのは、streamを指定しない通常のMessages API呼び出しの挙動で、短い応答をまとめて扱う処理では実装が簡単な方式です。ストリーミングではmessage_startの後、content_block_deltaイベントが生成に合わせて次々に届くため、本問の「顧客を待たせない」要件に応えるのはこの逐次配信のほうです。"]},{"t":"WebSocketで双方向接続を張り、生成の途中でも同じ接続で追加の注文を受け付ける。","c":false,"e":["双方向・常時接続のWebSocketは、共同編集やゲームのように双方が任意のタイミングで送り合う通信に向く技術です。Messages APIのストリーミングはHTTP上のSSEによるサーバーからクライアントへの一方向の配信で、途中で追加の入力を送るには新しいリクエストを発行します。"]}],"overall":["Messages APIでstream: trueを指定すると、応答はmessage_start、content_block_start、content_block_delta、content_block_stop、message_delta、message_stopという流れのSSEイベントとして届き、途中にpingイベントが混じることもあります。","クライアントはtext_deltaを受け取るたびに表示を更新できるため、生成全体が終わる前に表示を始められます。SDKでは、max_tokensの大きいリクエストでHTTPタイムアウトを避けるためにストリーミングの利用が求められる、という実務上の理由もあります。","誤答はいずれも別の仕組みの性質を持ち込んだもので、完了後の一括受信は非ストリーミング、50%割引はBatches API、双方向通信はWebSocketの特徴です。","ストリーミングが短縮するのは生成時間そのものではなく「最初の文字が表示されるまでの待ち時間」だと押さえておくと、似た選択肢に惑わされません。"],"ref":"https://platform.claude.com/docs/en/build-with-claude/streaming"},{"n":41,"stem":["ある小売企業が、従業員向けの人事アシスタントを構築しています。Claudeは、社内MCPサーバーのget_employee_recordツールで人事DBを照会します。現在の構成は次のとおりです。","get_employee_recordツールは、全従業員の記録を読めるサービスアカウントで動いている","「本人の記録と、マネージャーなら部下の記録だけを扱う」という規則は、システムプロンプトに書いてあるだけ","テストでは、言い回しを工夫した質問で、他部署の従業員の評価を引き出せました。"],"q":"最も適切な是正策はどれですか。","need":1,"opts":[{"t":"システムプロンプトの規則を具体的な禁止例とともに書き直し、拒否すべき質問をフューショットプロンプティングで示す。","c":false,"e":["具体的な禁止例やフューショットプロンプティングで方針を明確にするのは、応答の方針をClaudeに正しく伝える基本的な手段で、誤った開示を減らす効果はあります。しかしツール自体は全従業員の記録を読める権限のままなので、言い回しの工夫でプロンプトの規則をすり抜けられれば、同じ漏えいが再び起こります。アクセスの制限をモデルへの指示にとどめていることが、本問の根本原因です。"]},{"t":"ログイン中の従業員のトークンをツールの実行に付け、照会できる範囲をサーバーがその権限で判定する。","c":true,"e":["正解。認可の判断を、モデルの出力ではなく検証済みの利用者の身元に基づいてサーバー側で行う設計です。トークンはClaudeが生成する引数ではなく、アプリがMCPサーバーへの要求に付ける認証情報で、サーバーはそこから利用者を特定して「本人か、その部下か」を毎回判定します。","Claudeがどんな質問に誘導されても権限のない記録はそもそも返らず、モデルに渡る情報が利用者本人の権限の範囲に限られるため、プロンプトの突破が情報漏えいに直結しなくなります。"]},{"t":"送信前の応答を別のモデルで検査し、依頼者以外の氏名が含まれていれば回答を差し止めて作り直す。","c":false,"e":["出力を別のモデルで検査する方法は、ガードレールを層として重ねる手段の1つで、不適切な内容の送出を減らす補助策として有効です。ただし氏名の有無だけでは、正当に閲覧できる部下の記録と権限外の記録を区別できず、権限外のデータはすでにモデルに読み込まれています。検知は認可の代わりにならず、アクセスの段階で止める仕組みが要ります。"]},{"t":"依頼者の従業員番号をClaudeにツールの引数として渡させ、サーバーはその番号の範囲だけを返す。","c":false,"e":["ツールの引数に対象者の識別子を入れて照会範囲を指定する設計は、どの記録を扱うかを明示したい場面で一般的に使われます。しかし引数の値を決めるのはClaudeで、会話の誘導で他人の番号を入れられれば、サーバーはそれを信じて返してしまいます。MCPのセキュリティのガイドも、利用者の識別はクライアントから渡された値ではなく、検証済みのトークンから導くよう求めています。"]}],"overall":["ツールを通じて社内データにアクセスするアプリで、ツールを「誰の権限で実行するか」という認可の伝播が問われています。全データを読めるサービスアカウントでツールを動かし、制限をシステムプロンプトに書くだけの構成では、Claudeは強い権限を持つ代理人として働き、会話で誘導さ
