ackage-lock.json to .gitignore, and have npm install in each environment generate a lockfile specific to that environment.", "C": "Delete node_modules before each build and then run npm install to re-resolve dependencies from a clean state.", "D": "Commit package-lock.json to the repository, and install dependencies with npm ci for the staging and production builds."}}, {"id": "CCDV-F-Udemy2-0050", "question": "A security operations center (SOC) classifies large volumes of alerts with Claude in a batch every night. Urgency is low, and a common classification guideline (a long fixed prompt) is reused in every request.\nWhich cost modeling approach is most appropriate?", "choices": {"A": "Cache the fixed guideline with prompt caching, and estimate costs with the Message Batches API discount stacked on top.", "B": "Do not use prompt caching, and estimate costs by calculating input tokens at the base input price.", "C": "Estimate by multiplying the number of input tokens by the input price, and exclude output tokens from the calculation because they are fewer.", "D": "Treat the Message Batches API and prompt caching as mutually exclusive, and estimate using the Message Batches API discount, which has the larger discount rate."}}, {"id": "CCDV-F-Udemy2-0051", "question": "An EdTech company is strengthening the management of API keys and secrets handled by its Claude-based service.\nWhich are best practices for secret management? (Select TWO.)", "choices": {"A": "Inject secrets at runtime from environment variables or a secrets manager, and do not keep them in source control.", "B": "Scope key permissions to the minimum necessary, set expiration dates, and rotate them regularly.", "C": "Share a single long-lived key across all environments and teams to consolidate the effort of issuing and managing keys.", "D": "Write API keys into configuration files and commit them to the repository along with the app code.", "E": "Embed the API key in the mobile app and call the Claude API directly from the device without going through a backend."}}, {"id": "CCDV-F-Udemy2-0052", "question": "A nonprofit's development team plans to use Claude to generate code changes and incorporate it into its existing software development process.\nWhich is the most appropriate branching strategy and approach to reviewing AI-generated code?", "choices": {"A": "Commit AI-generated changes directly to the main branch and conduct code reviews in bulk at the end of the month.", "B": "Put AI-generated changes into pull requests from feature branches as well, and merge them after human review and CI.", "C": "Manage AI-generated changes in a dedicated repository and release them as an artifact separate from the main codebase.", "D": "Merge AI-generated changes that pass an automated review by Claude without human review."}}, {"id": "CCDV-F-Udemy2-0053", "question": "A retailer exposes an internal MCP server over Streamable HTTP that provides inventory lookup and demand forecast aggregation tools. As usage grows, they want to scale out by placing multiple server instances behind a load balancer.\nSome of the aggregation tools take several minutes to complete, and their progress is queried later.\nWhich server design is most appropriate under the 2026-07-28 version of the MCP specification?", "choices": {"A": "Process each request using only the information contained in its _meta, and reference aggregation jobs that span requests from a shared store using explicit IDs.", "B": "Enable sticky sessions on the load balancer so that requests from the same client are always sent to the same instance.", "C": "Store the client information and capabilities received in the first request in the instance's memory and reuse them for subsequent requests.", "D": "Assign a conversation session to each connection, and discard the state of the jobs belonging to that connection when it disconnects."}}]</script>
<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
DATA.forEach(d => { d.domain = d.domain || '미분류'; });
const EN = new Map(JSON.parse(document.getElementById('data_en').textContent).map(d => [d.id, d]));
let lang = 'ko'; try { lang = localStorage.getItem('ccdvf_lang') || 'ko'; } catch (e) {}
const PER = 20, KEY = 'ccdvf_bank_v1';
let state = {}, order = DATA.map((_, i) => i), page = 1;
try { state = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };

const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function md(s) {
  const parts = s.split(/```[a-z]*\n?/);
  return parts.map((p, i) => i % 2 ? '<pre><code>' + esc(p.replace(/\n$/, '')) + '</code></pre>'
    : esc(p).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>')
  ).join('');
}

// 언어별 표시: ko / en / both(병기) / ja / jaen(일본어+영어 병기, 해설은 일본어만)
function tx(d, f, k) {
  const g = o => k ? o.choices[k] : o[f], e = EN.get(d.id);
  const t = e && g(e);
  if (lang === 'en' && t) return md(t);
  if ((lang === 'both' || lang === 'jaen') && t) return md(g(d)) + '<div class="en">' + md(t) + '</div>';
  return md(g(d));
}
// 필터용 선택지
const doms = [...new Set(DATA.map(d => d.domain))].sort();
const srcs = [...new Set(DATA.map(d => d.source_repo))].sort();
const $ = id => document.getElementById(id);
$('dom').innerHTML = '<option value="">전체 분야</option>' + doms.map(d => `<option>${esc(d)} (${DATA.filter(x => x.domain === d).length})</option>`).join('');
$('dom').dataset.vals = JSON.stringify(doms);
$('src').innerHTML = '<option value="">전체 출처</option>' + srcs.map(s => `<option value="${esc(s)}">${esc(s)}</option>`).join('');

function status(d) { const s = state[d.id]; return !s || !s.g ? 'un' : s.ok ? 'ok' : 'ng'; }
function filtered() {
  const kw = $('q').value.trim().toLowerCase();
  const di = $('dom').selectedIndex - 1, dv = di >= 0 ? doms[di] : '';
  const sv = $('src').value, st = $('st').value;
  return order.map(i => DATA[i]).filter(d =>
    (lang.startsWith('ja') === (d.language === 'ja')) && (!dv || d.domain === dv) && (!sv || d.source_repo === sv) && (st === 'all' || status(d) === st) &&
    (!kw || (d.question + Object.values(d.choices).join(' ') + d.explanation + (() => { const e = EN.get(d.id); return e ? e.question + Object.values(e.choices).join(' ') + (e.explanation || '') : ''; })()).toLowerCase().includes(kw)));
}

function grade(d) {
  const s = state[d.id] || (state[d.id] = {sel: []});
  const a = [...d.answer].sort().join(), b = [...s.sel].sort().join();
  s.g = 1; s.ok = a === b; save(); render();
}
function pick(d, k) {
  const s = state[d.id] || (state[d.id] = {sel: []});
  if (s.g) return;
  if (d.select_count === 1) { s.sel = [k]; grade(d); return; }
  s.sel = s.sel.includes(k) ? s.sel.filter(x => x !== k) : [...s.sel, k];
  save(); render();
}

function card(d, n) {
  const s = state[d.id] || {sel: []}, g = !!s.g;
  const ch = Object.entries(d.choices).map(([k, v]) => {
    let c = 'ch';
    if (g) { if (d.answer.includes(k)) c += s.sel.includes(k) ? ' right' : ' missed'; else if (s.sel.includes(k)) c += ' wrong'; }
    else if (s.sel.includes(k)) c += ' sel';
    return `<button class="${c}" ${g ? 'disabled' : ''} data-id="${d.id}" data-k="${k}"><span class="k">${k}.</span><span>${tx(d, 'choices', k)}</span></button>`;
  }).join('');
  const multi = d.select_count > 1 ? `<span class="tag">${d.select_count}개 선택</span>` : '';
  const res = g ? `<div class="res ${s.ok ? 'ok' : 'ng'}">${s.shown ? '정답 확인 (오답으로 집계)' : s.ok ? '정답입니다' : '오답입니다'} — 정답: ${d.answer.join(', ')}</div><div class="exp">${tx(d, 'explanation')}</div>` : '';
  const acts = g ? `<button data-retry="${d.id}">다시 풀기</button>`
    : (d.select_count > 1 ? `<button class="primary" data-grade="${d.id}" ${s.sel.length ? '' : 'disabled'}>채점</button>` : '') + `<button data-show="${d.id}">정답 보기</button>`;
  return `<div class="q"><div class="meta"><span class="tag">${esc(d.id)}</span><span class="tag">${esc(d.domain)}</span>${multi}</div>
  <div class="qt">${tx(d, 'question')}</div>${ch}${res}<div class="acts">${acts}</div></div>`;
}

function render() {
  const list = filtered(), pages = Math.max(1, Math.ceil(list.length / PER));
  if (page > pages) page = pages;
  const cur = list.slice((page - 1) * PER, page * PER);
  $('list').innerHTML = cur.length ? cur.map(card).join('') : '<div class="empty">조건에 맞는 문제가 없습니다.</div>';
  let p = '';
  for (let i = 1; i <= pages; i++) p += `<button class="${i === page ? 'on' : ''}" data-p="${i}">${i}</button>`;
  $('pager').innerHTML = pages > 1 ? p : '';
  const all = DATA.map(status), done = all.filter(x => x !== 'un').length, ok = all.filter(x => x === 'ok').length;
  $('stats').innerHTML = `<span>전체 ${DATA.length}문항</span><span>표시 ${list.length}문항</span><span>풀이 ${done}</span><span style="color:var(--ok)">정답 ${ok}</span><span style="color:var(--ng)">오답 ${done - ok}</span><span>정답률 ${done ? Math.round(ok / done * 100) : 0}%</span>`;
  $('bar').style.width = (DATA.length ? done / DATA.length * 100 : 0) + '%';
}

document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  const byId = id => DATA.find(x => x.id === id);
  if (t.dataset.k) pick(byId(t.dataset.id), t.dataset.k);
  else if (t.dataset.grade) grade(byId(t.dataset.grade));
  else if (t.dataset.show) { const d = byId(t.dataset.show); state[d.id] = {sel: [...d.answer], g: 1, ok: false, shown: 1}; save(); render(); }
  else if (t.dataset.retry) { delete state[t.dataset.retry]; save(); render(); }
  else if (t.dataset.p) { page = +t.dataset.p; render(); scrollTo(0, 0); }
});
$('lang').value = lang;
$('lang').addEventListener('change', () => { lang = $('lang').value; try { localStorage.setItem('ccdvf_lang', lang); } catch (e) {} page = 1; render(); });
['q', 'dom', 'src', 'st'].forEach(id => $(id).addEventListener('input', () => { page = 1; render(); }));
$('shuf').onclick = () => { for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; } page = 1; render(); };
$('ord').onclick = () => { order = DATA.map((_, i) => i); page = 1; render(); };
let rstT = 0;
$('rst').onclick = () => {
  const b = $('rst');
  if (!rstT) { b.textContent = '한 번 더 누르면 기록 삭제'; rstT = setTimeout(() => { rstT = 0; b.textContent = '기록 초기화'; }, 3000); return; }
  clearTimeout(rstT); rstT = 0; b.textContent = '기록 초기화'; state = {}; save(); render();
};
render();
</script>
</body>
</html>
