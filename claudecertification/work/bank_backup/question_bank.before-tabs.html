tegration", "domain_confidence": "high", "source_number": "2", "source_heading": null, "source_section": null, "ref": "https://platform.claude.com/docs/en/about-claude/models/model-ids-and-versions", "language": "ja"}, {"id": "CCDV-F-Udemy-0003", "exam": "CCDV-F", "source_repo": "Udemy", "source_file": "Udemy_CCDV-F.html", "question": "ある会計事務所が、長年運用してきた大規模なレガシー連携コードのリファクタリングに着手します。\n安全に進めるための方針として最も適切なものはどれですか。", "choices": {"A": "既存の振る舞いを固定するテストを整え、小さな変更を段階的に重ねて都度検証する。", "B": "振る舞いを変えない作業なので、機能追加とバグ修正も同じ変更にまとめて進める。", "C": "テストを書く工数を省き、変更のたびに担当者が画面操作で動作を確認して進める。", "D": "新しい設計で全面的に書き直し、完成した時点で旧システムから一括で切り替える。"}, "answer": ["A"], "select_count": 1, "explanation": "A. 正解。まず現在の振る舞いを記録するテスト（特性テスト）を用意すれば、変更後も同じ結果になるかを機械的に確かめられます。そのうえで小さく検証可能な単位で変更を重ね、各段階でテストとレビューを通せば、問題が出ても直前の状態へ戻すだけで済みます。Claude Codeの公式ワークフローでも、振る舞いを保つよう指示し、小さくテスト可能な単位で進め、変更後にテストを実行する手順が示されています。\nB. リファクタリングの定義（外部から見た振る舞いを変えずに内部構造を改善する）自体は正しい理解です。しかし機能追加やバグ修正は振る舞いを意図的に変える作業なので、同じ変更に混ぜるとテストが落ちたときにどちらが原因か切り分けられず、レビューもしにくくなります。\nC. 画面操作による手動確認は、自動化が難しいUIの最終確認などで今も使われる手段です。しかし連携コードの内部を大きく組み替える作業で手動確認だけに頼ると、確認していない経路の回帰を見逃しやすく、変更のたびに同じ確認を繰り返す工数もかさみます。\nD. 全面的な書き直し（ビッグバン・リライト）は、既存コードの延命が技術的に難しい場合などに選ばれることがあります。しかし大規模なレガシー連携コードでは、新旧の振る舞いの差を切り替えまで検証できず、問題が出ても途中で戻れないため、「安全に進める」という本問の条件に反します。\n\n大規模なレガシーコードのリファクタリングを安全に進める鍵は、振る舞いを確かめる手段と、小さく戻せる変更単位の2つです。リファクタリングは外部から見た振る舞いを保ったまま内部構造を改善する作業で、その「振る舞いを保てているか」を確かめる手段がテストです。\nテストのないコードでは、まず現在の入出力を記録する特性テストを書き、それを安全網にして小さな変更を積み重ねます。Claude Codeのドキュメントでも、リファクタリングは同じ振る舞いを維持するよう指示し、小さくテスト可能な単位で行い、最後にテストで検証する流れが紹介されています。\n誤答の3つは、一括切り替え、目的の異なる変更の混在、自動テストの省略という形で、いずれも「問題が起きたときに原因を特定して戻せるか」を損なっています。\n安全性を問われたら、検証の手段があるか、切り戻しの単位が小さく保たれているか、の2点を基準に選ぶと判断がぶれません。", "domain": "2. Applications and Integration", "domain_confidence": "high", "source_number": "3", "source_heading": null, "source_section": null, "ref": "https://code.claude.com/docs/en/common-workflows", "language": "ja"}, {"id": "CCDV-F-Udemy-0004", "exam": "CCDV-F", "source_repo": "Udemy", "source_file": "Udemy_CCDV-F.html", "question": "ある出版社が、書籍原稿のレビューエージェントを構築しています。事実確認・文体チェック・引用の権利関係チェックを、それぞれ専門のサブエージェントに委任する設計を検討しています。どのチェックでも、大量の参考資料を読み込む必要があります。\nサブエージェントによるコンテキストの分離で得られる利点として、最も適切なものはどれですか。", "choices": {"A": "親のシステムプロンプトがサブエージェントにも適用され、各チェックを同じ方針で進められる。", "B": "資料の読み込みや途中のツール結果はサブエージェント内に留まり、親には最終結果だけが返る。", "C": "システム全体のトークン消費量が、処理を1つのエージェントで行う場合より少なくなる。", "D": "各サブエージェントが親の会話履歴とツール結果を引き継ぎ、委任時の指示を短く書ける。"}, "answer": ["B"], "select_count": 1, "explanation": "A. サブエージェントが受け取るのは、自身の定義に書いたシステムプロンプト（AgentDefinitionのprompt）と委任時のプロンプトで、親のシステムプロンプトは含まれません。チェックごとに専門の指示を与えられるのはこの仕組みのためで、共通の方針を守らせたい場合は各サブエージェントの定義か、設定により読み込まれるプロジェクトのCLAUDE.mdに記載します。\nB. 正解。サブエージェントは親とは別の会話コンテキストで動作し、途中のツール呼び出しと結果はサブエージェントの内部に留まって、最終メッセージだけがAgentツールの結果として親に返ります。各チェックで大量の参考資料を読み込んでも親の会話には要約された結論しか積み上がらないため、親エージェントはコンテキストを圧迫されずに原稿全体のレビューを続けられます。\nC. コンテキストの分離では各サブエージェントがそれぞれ資料を読み込み、独自にAPIリクエストを行うため、システム全体の総トークン数はむしろ増えることがあります。コストを抑えたい場合は、サブエージェントごとにmodelで軽量なモデルを指定するといった別の手段を使います。分離の利点は総量の削減ではなく、親の会話に資料が蓄積しないことにあります。\nD. 親の会話履歴を引き継ぐのは、現在の会話を分岐させるfork型のサブエージェントの挙動です。通常のサブエージェントは親の履歴やツール結果を持たない新しいコンテキストで始まり、親から渡るのはAgentツールのプロンプト文字列だけなので、必要なファイルパスや判断材料は委任時の指示に明示する必要があります。\n\nサブエージェントに作業を任せたとき、親とサブエージェントの間で何が受け渡され、何が受け渡されないのかがこの問題の核心です。Agent SDKのサブエージェントは別のエージェントインスタンスとして動き、forkでない限り親の会話履歴を持たない新しいコンテキストで開始されます。\n資料の読み込みや中間のツール結果はサブエージェントの中に留まり、親には最終メッセージだけが返るため、数十のファイルを精査しても親の会話は膨らみません。\n見分けるポイントは「何が親とサブエージェントの間を行き来するか」です。親からサブエージェントへ渡るのは委任時のプロンプトとサブエージェント自身の定義で、親の会話履歴やシステムプロンプトは引き継がれません。また各サブエージェントが独自にAPIを呼ぶため、総トークン数が減るとは限りません。\n選択肢を読むときは、「親のコンテキストを守る」話なのか「コスト」の話なのかを切り分けると、判断を誤りにくくなります。", "domain": "6. Prompt and Context Engineering", "domain_confidence": "high", "source_number": "4", "source_heading": null, "source_section": null, "ref": "https://code.claude.com/docs/en/agent-sdk/subagents", "language": "ja"}, {"id": "CCDV-F-Udemy-0005", "exam": "CCDV-F", "source_repo": "Udemy", "source_file": "Udemy_CCDV-F.html", "question": "あるスポーツ分析サービスでは、Claudeで試合レポートを生成しています。開発チームは、同じ入力でも実行ごとに出力が変わることに気づきました。\nサンプリングパラメータと非決定性について、temperatureの説明として正しいものはどれですか。", "choices": {"A": "temperatureは応答のレイテンシに作用するパラメータで、生成される内容には影響しない。", "B": "temperatureを0にすれば、同じ入力に対して毎回まったく同じ出力が返ることが保証される。", "C": "temperatureはサンプリングのランダム性を調整し、0にしても出力の完全な一致は保証されない。", "D": "temperatureを上げると候補の語をより広く検討するため、生成される内容の事実の正確さが高まる。"}, "answer": ["C"], "select_count": 1, "explanation": "A. 応答までの時間に影響するのは、モデルの大きさ、入力と出力の長さ、思考の量などです。temperatureは次のトークンを選ぶときのランダムさを調整するパラメータで、どの語が選ばれるか、つまり生成される内容そのものに作用します。\nB. 低いtemperatureは出力を安定させるので、定型的な抽出などで使われる設定です。しかし0にしても完全な決定性は得られず、同じ入力でも呼び出しごとに出力が変わり得ると公式に説明されています（Anthropic自身の推論サービスでもクラウド事業者経由でも同様）。テストで出力の完全一致を期待値にすると、偶発的な失敗が起きます。\nC. 正解。LLMは確率分布から次のトークンをサンプリングして文章を生成し、temperatureはその選び方のランダムさを調整します。低い値ほど確率の高い語に寄って保守的で安定した出力になり、高い値ほど多様で意外性のある出力になります。 ただし公式の用語集は、temperatureを0にしても結果は完全には決定論的にならず、同じ入力でもAPI呼び出しごとに異なる出力になり得ると明記しているため、厳密な一致を前提にした設計は避けます。\nD. 高いtemperatureは、確率の低い語も選ばれやすくすることで表現の多様さや創造性を高める設定で、物語の生成やアイデア出しに向きます。事実の正確さを高める効果はなく、むしろ根拠のない表現が混じりやすくなるため、正確さは参照資料の提供や出力の検証で担保します。\n\n同じ入力で出力が変わる理由を、サンプリングとtemperatureの仕組みから説明できるかが問われています。LLMは各ステップで次のトークンの確率分布を計算し、そこからサンプリングして文章を作ります。temperatureはこの分布からの選び方のランダムさを調整し、低くすると最も確からしい語に寄り、高くすると珍しい語も選ばれやすくなります。\n重要なのは、temperatureが0でも出力は完全には決定論的にならず、同じ入力でも呼び出しごとに異なる結果になり得ることです。\nなおClaude Sonnet 5やClaude Opus 5.5のように、temperature・top_p・top_kを既定値以外に設定するとエラーになるモデルもあり、その場合は出力の方向づけをプロンプトで行います。いずれの場合も「同じ入力なら同じ出力」を前提にしない設計、例えば出力をスキーマで検証する、評価を複数回の試行で行う、といった工夫が求められます。", "domain": "5. Model Selection and Optimization", "domain_confidence": "high", "source_number": "5", "source_heading": null, "source_section": null, "ref": "https://platform.claude.com/docs/en/about-claude/glossary", "language": "ja"}, {"id": "CCDV-F-Udemy-0006", "exam": "CCDV-F", "source_repo": "Udemy", "source_file": "Udemy_CCDV-F.html", "question": "ある物流企業が、配送計画システムを構築しようとしています。このシステムでは、道路状況・車両の空き・荷物の優先度に応じて、毎回異なる調査と再計画が必要になります。\nシステムは、中心となるマネージャー（オーケストレーター）と複数のワーカーLLMで構成する予定です。\nこのマネージャー／スーパーバイザー階層で、マネージャーの役割として最も適切なものはどれですか。", "choices": {"A": "配送依頼を種別ごとに分類し、種別ごとに用意した専用のワーカーへ振り分ける。", "B": "依頼の状況に応じてサブタスクを決めてワーカーへ委任し、結果を統合して計画にまとめる。", "C": "設計時に決めた順序でワーカーを呼び出し、前段の出力を次段の入力として渡していく。", "D": "全ワーカーに同じ計画タスクを並列で解かせ、出力の多数決で最終的な配送計画を選ぶ。"}, "answer": ["B"], "select_count": 1, "explanation": "A. 入力を分類して専用の後続処理へ振り分けるのはroutingで、問い合わせの種類（返金・技術サポートなど）ごとに扱いを分けたい場面に向きます。routingは振り分けで役割を終え、サブタスクの分解や結果の統合を行わないため、毎回異なる調査を組み合わせて1つの計画にまとめる本問の要件を満たしません。\nB. 正解。orchestrator-workersでは、中心のLLMが入力を見て必要なサブタスクをその場で決め、ワーカーLLMへ委任し、返ってきた結果を統合します。サブタスクが事前定義されていない点が他のワークフローとの決定的な違いで、道路状況や車両の空きによって必要な調査が毎回変わる配送計画のように、手順を予測できない複雑なタスクに適しています。\nC. 固定の順序で呼び出し、各段が前段の出力を処理していくのはprompt chainingで、原稿作成から翻訳へと進むような固定のサブタスクに分解できる処理に向きます。呼び出し系列が設計時に確定しているため、状況に応じて必要な調査を毎回組み替えるという本問の前提と合わず、マネージャーが担う動的な分解の役割も存在しません。\nD. 同じタスクを複数回実行して出力を比べ、多数決などで結論を選ぶのはparallelizationのvotingで、コードの脆弱性レビューのように複数の視点で確信度を上げたい場面に向きます。タスクを分解して役割の異なるワーカーに割り振るものではないため、道路状況・車両・優先度ごとに異なる調査が必要な本問のマネージャーの役割には当たりません。\n\nマネージャー／スーパーバイザー階層は、Anthropicのエージェント設計ガイドでいうorchestrator-workersのパターンに当たります。ガイドでは、中心のLLMがタスクを分解してワーカーLLMに委任し、それらの結果を統合する構成をorchestrator-workersと呼び、必要なサブタスクを予測できない複雑なタスクに適すると説明しています。\n見た目は並列化と似ていますが、決め手はサブタスクが事前定義されず、オーケストレーターが入力に応じて決める点です。問題文の「毎回異なる調査と再計画が必要」という条件がこれを示しています。\n同じタスクを並列に解かせて多数決するvoting、入力を分類して振り分けるrouting、固定順序で呼び出すprompt chainingは、いずれも処理の形が設計時に決まっており、動的な分解と統合を含みません。\nパターン名に迷ったら、「分解の内容を誰がいつ決めるのか（設計時のコードか、実行時のLLMか）」を手がかりにすると判別できます。", "domain": "1. Agents and Workflows", "domain_confidence": "high", "source_number": "6", "source_heading": null, "source_section": null, "ref": "https://www.anthropic.com/engineering/building-effective-agents", "language": "ja"}, {"id": "CCDV-F-Udemy-0007", "exam": "CCDV-F", "source_repo": "Udemy", "source_file": "Udemy_CCDV-F.html", "question": "ある海運企業のバッチ処理パイプラインが、負荷が高いときに、Claude APIから断続的にHTTP 429とHTTP 529を受け取っています。\nリトライ設計として最も適切なものはどれですか。", "choices": {"A": "429を受けたらバッチ全体をいったん停止し、原因を調べてから翌日に全件を再投入し直す。", "B": "遅延を入れずにその場で再送を繰り返し、成功した時点ですぐ次のリクエストの処理に進めていく。", "C": "400を含むあらゆるエラーを、固定の待ち時間をはさんで決まった回数だけ再試行し続ける。", "D": "429と529はジッター付き指数バックオフで再試行し、retry-afterに従う。"}, "answer": ["D"], "select_count": 1, "explanation": "A. 失敗の多いバッチを止めて原因を調べるのは、恒久的なエラーが大量に出ている場合には妥当な判断です。しかし429は多くの場合、待てば回復する一時的な制限で、バッチ全体を止めて翌日に全件を再投入すると、成功済みの処理まで重複して実行し、処理の遅れも大きくなります。\nB. 即時の再送は、ネットワークの瞬断のようにすぐ回復する単発の失敗なら成功することもあります。しかし429や529はAPI側の制限や過負荷を示しているため、間隔を空けずに再送すると負荷をさらに高め、制限の解除を遅らせる結果になります。\nC. 固定間隔での再試行は、一時的な失敗が散発する小規模な処理なら実用上足りることもあります。しかし400 invalid_request_errorはリクエストの形式や内容の不備を示す恒久的なエラーで、何度送っても同じ理由で拒否されるうえ、固定間隔では過負荷時に再試行が同時に集中しやすくなります。\nD. 正解。429 rate_limit_errorと529 overloaded_errorは一時的なエラーなので、待ち時間を指数的に延ばしながらランダムな揺らぎ（ジッター）を加えて再試行し、retry-afterヘッダーがあればその秒数だけ待ちます。公式SDKは接続エラー・レート制限・5xxをこの方式で既定2回まで自動再試行し、max_retriesで調整できます。 なお利用ティアの月間支出上限に達したことによる429はretry-afterが付かず、上限が戻るまで失敗し続けるため、再試行とは別に検知できるようにしておきます。\n\n429や529が返ったときの再試行は、「待てば直るエラーか」を見極めるところから設計します。エラーは「待てば直るもの」と「直さなければ何度送っても失敗するもの」に分けて扱います。429（レート制限）、529（過負荷）、500（内部エラー）は前者で、ジッター付きの指数バックオフで再試行し、retry-afterヘッダーがあれば従います。400（形式・内容の不備）や401（認証）などは後者で、再試行ではなくリクエストや設定を直します。\n公式SDKはこの再試行を既定で行うため、自前で実装する場合もSDKの設定を見直す場合も、同じ考え方で判断できます。\n誤答は、待たずに再送する、一時的な429を致命的とみなす、恒久的な400まで再試行する、のいずれかで、エラーの種類に応じた扱い分けができていません。\nなお、利用量を急に増やすと、レート制限の範囲内でも429が返ることがあるため、トラフィックは段階的に増やすのが望ましいとされています。", "domain": "4. Eval, Testing, and Debugging", "domain_confidence": "medium", "source_number": "7", "source_heading": null, "source_section": null, "ref": "https://platform.claude.com/docs/en/api/errors", "language": "ja"}, {"id": "CCDV-F-Udemy-0008", "exam": "CCDV-F", "source_repo": "Udemy", "source_file": "Udemy_CCDV-F.html", "question": "ある法務チームが、アップロードされた契約書1件を約40の条項に分け、条項ごとに独立したリスク判定をClaudeで行う機能を作っています。担当者は、画面の前で結果を待っています。\n1件ずつ順番に呼び出すと、合計の待ち時間が長すぎます。一方で、組織のレート制限を超えて429を多発させることも避けたいと考えています。\nPython SDKを使った実装として最も適切なものはどれですか。", "choices": {"A": "クライアントのmax_retriesを大きくし、1件ずつの呼び出しが失敗したらSDKに自動で再送させる。", "B": "1件ずつの呼び出しをストリーミングに切り替え、各条項の結果が届き始めるまでの時間を短くする。", "C": "40件をMessage Batches APIにまとめて投入し、処理の終了をポーリングしてから結果を表示する。", "D": "AsyncAnthropicで40件を並行に送り、同時に処理中の件数をセマフォで一定数に抑える。"}, "answer": ["D"], "select_count": 1, "explanation": "A. max_retriesは、接続エラーや429、5xxなどが返ったときにSDKが自動で再送する回数の設定で（既定は2回）、一時的な失敗からの回復力を高めたい場面で調整します。再送の回数を増やしても、1件ずつ順番に呼ぶ限り合計の待ち時間は短くならず、失敗した呼び出しの分だけ待ちがかえって伸びます。\nB. ストリーミングは、生成されたテキストを到着順に受け取れる仕組みで、1件の長い応答の書き出しを早く表示したいときに効果があります。しかし1件ずつ順番に呼ぶ構造は変わらないため、40件すべての判定がそろうまでの合計時間はほとんど縮まりません。本問の遅さの原因は、互いに独立した処理を直列に並べていることにあります。\nC. Message Batches APIは、大量のリクエストを非同期にまとめて処理してコストを抑える仕組みで、夜間の一括処理のようにすぐに結果が要らない用途に向きます。ただしバッチは最長24時間の処理枠で動き、いつ終わるかは保証されません。担当者が画面の前で待っている本問の用途には、完了時刻の読めない方式は合いません。\nD. 正解。Python SDKのAsyncAnthropicは同期版のAnthropicと同じインターフェースを持つ非同期クライアントで、asyncioと組み合わせると、ある応答を待つ間に別のリクエストを送れます。互いに独立した40件を並行に投げれば、合計時間はほぼ最も遅い1件分まで縮みます。 さらにasyncio.Semaphoreで同時実行数を組織のレート制限に収まる値に絞れば、上限を一気に使い切って429が多発する事態も避けられます。\n\n待ち時間の大半がネットワーク越しの応答待ちである処理を、どう速くするかが問われています。Claude APIの呼び出しは典型的なI/O待ちの処理で、Python SDKには同期のAnthropicと同じインターフェースを持つ非同期クライアントAsyncAnthropicが用意されています。\n互いに依存しない複数の呼び出しはasyncio.gatherなどでまとめて並行に実行でき、合計時間は直列の合計から、ほぼ最も遅い1件分へと縮みます。一方で、同時に投げる数を無制限にすると、リクエスト数や入力トークン数の毎分の上限を短時間で消費して429を招くため、セマフォで同時実行数に上限を設け、SDK既定の自動再送と組み合わせるのが定石です。\n誤答は、コスト重視の非同期一括処理、1件の体感速度を上げる仕組み、失敗時の再送設定で、それぞれ別の問題を解くための手段です。\n性能の問題では、まず遅さの原因が直列の待ちなのか、1件の生成時間なのか、処理量なのかを切り分けると、選ぶべき手段が絞れます。", "domain": "2. Applications and Integration", "domain_confidence": "medium", "source_number": "8", "source_heading": null, "source_section": null, "ref": "https://platform.claude.com/docs/en/cli-sdks-libraries/sdks/python", "language": "ja"}, {"id": "CCDV-F-Udemy-0009", "exam": "CCDV-F", "source_repo": "Udemy", "source_file": "Udemy_CCDV-F.html", "question": "ある農業テック企業が、作物病害の現場報告を扱うClaudeアプリを設計しています。処理には、次の2つのサブタスクがあります。\n自由記述の報告を、決められた病害カテゴリのいずれかに分類する\n相互に影響する多数の制約を考慮して、多段階の灌漑・防除計画を立案する\nフューショットプロンプティングと思考モード（エフォートや適応型思考）の使い分けとして、最も適切なものはどれですか。", "choices": {"A": "計画立案のプロンプトに数十件の計画例を詰め込み、推論の深さは既定の設定のままにする。", "B": "分類はフューショットプロンプティングで形式と境界を示し、計画立案はエフォートを高めて深く推論させる。", "C": "両タスクともゼロショットで指示だけを与え、エフォートを最小に設定して応答の速さを優先する。", "D": "両タスクでエフォートをmaxに設定し、分類も計画立案も最も深い推論で処理させる。"}, "answer": ["B"], "select_count": 1, "explanation": "A. 例示は形式や方針を伝えるのに有効ですが、公式ドキュメントが勧める目安は3〜5件で、関連性と多様性のある例を選ぶことが重要です。数十件の計画例はコンテキストを圧迫するうえ、例の表面的なパターンをなぞらせるおそれがあり、多数の制約を突き合わせる推論そのものの代わりにはなりません。\nB. 正解。フューショットプロンプティング（マルチショット）は出力の形式・トーン・構造を安定させる最も確実な手段の1つで、固定カテゴリへの分類なら数件の代表例で書式と判断の境界を示せます。 一方、相互に影響する制約を突き合わせる計画立案は多段階の推論が価値を生む典型で、適応型思考ではエフォートを上げるとClaudeがより積極的かつ深く考えるようになります。タスクごとに手段を割り当てれば、品質とコスト・レイテンシの釣り合いが取れます。\nC. 指示だけのゼロショットと低いエフォートの組み合わせは、単純な問い合わせを大量に速く処理したい場面では妥当な設定です。しかし分類では例がないと出力形式やカテゴリの境界がぶれやすく、計画立案では推論を抑えることで制約の見落としが起きやすくなるため、どちらのタスクの要件にも合いません。\nD. エフォートをmaxにすると、Claudeは最も積極的かつ深く考えるようになり、難しい推論では品質の向上が期待できます。ただし考えた分は出力トークンとして課金され、レイテンシも延びるため、形式が決まった単純な分類にまで適用するのは費用対効果に見合いません。\n\nフューショットプロンプティングによる例示は「どんな形で答えるか」を伝える手段で、固定カテゴリへの分類のように答えの形と判断基準が明確なタスクで効果を発揮します。思考モードは「どれだけ考えてから答えるか」を調整する手段です。現行モデルでは適応型思考が標準で、Claudeがリクエストごとに考えるかどうかと深さを判断し、その傾向をエフォート（lowからmaxまで）で方向づけます。\nなお以前の拡張思考（budget_tokensで思考量を固定する方式）は、Claude Opus 4.7以降のモデルでは受け付けられません。思考に使ったトークンは出力として課金されるため、推論が品質を左右するタスクに絞って深く考えさせるのが基本です。\n誤答は、全タスクで推論を抑える、例示を推論の代わりにする、全タスクで推論を最大化する、といった一律の設定になっており、タスクの性質に合わせて手段を割り当てるという問題の核心から外れています。", "domain": "5. Model Selection and Optimization", "domain_confidence": "high", "source_number": "9", "source_heading": null, "source_section": null, "ref": "https://platform.claude.com/docs/en/build-with-claude/thinking-steering-and-cost", "language": "ja"}, {"id": "CCDV-F-Udemy-0010", "exam": "CCDV-F", "source_repo": "Udemy", "source_file": "Udemy_CCDV-F.html", "question": "ある気象情報会社が、大規模な気象シミュレーション結果の要約生成を、長時間実行の非同期ジョブとして実装します。この処理には、数時間かかることもあります。\nジョブの完了をクライアントに伝える方式について、ポーリングとコールバック（Webhook）を比較した記述として最も適切なものはどれですか。", "choices": {"A": "コールバックは受信URLを公開しておけば確実に届くため、再送や重複受信への備えは要らない。", "B": "ポーリングは単純だが検知の遅れと無駄な問合せが出て、コールバックは即時だが受信側の準備が要る。", "C": "ポーリングは完了を即時に検知でき、コールバックは受信エンドポイントなしで実装できる。", "D": "同期呼び出しでHTTP接続を数時間ずっと保持し続ければ、ポーリングもコールバックも用意せずに済む。"}, "answer": ["B"], "select_count": 1, "explanation": "A. Webhookの受信側は、送信側の再送によって同じ通知を複数回受け取ることや、受信側の停止中に通知が失われることを前提に設計します。署名の検証、重複を無視できる冪等な受信処理、取りこぼしに備えた状態確認APIの併用が必要で、URLを公開しただけで到達が保証されるわけではありません。\nB. 正解。ポーリングはクライアント側だけで完結するため実装が単純ですが、問い合わせ間隔を長くすると完了の検知が遅れ、短くすると無駄なリクエストが増えるというトレードオフがあります。コールバックは完了時にサーバーから通知が届くため即時性と効率に優れる一方、受信エンドポイントの公開・認証・再送への備えをクライアント側で用意する必要があります。\nC. 説明が逆になっています。ポーリングはクライアントが一定間隔で状態を問い合わせる方式なので、完了の検知は次の問い合わせまで遅れます。コールバックはジョブ完了時にサーバーがあらかじめ登録されたURLへ通知する方式で、通知を受け取るエンドポイントの公開と認証がクライアント側に必要です。\nD. 同期呼び出しは、数秒から数十秒で終わる処理なら最も単純で扱いやすい方式です。しかし数時間に及ぶ処理では、ネットワーク機器のアイドルタイムアウトや接続断で結果を受け取れなくなるリスクが高く、長時間の処理は非同期ジョブにしてポーリングかコールバックで完了を扱うのが定石です。\n\n数時間かかるジョブの完了を、クライアントが聞きに行くのか（ポーリング）、サーバーが知らせるのか（コールバック）、という設計上のトレードオフが論点です。\nポーリングは「クライアントが聞きに行く」方式で、実装は単純ですが、検知の遅れと問い合わせ回数のバランスを取る必要があります。コールバックは「サーバーが知らせに来る」方式で、無駄な問い合わせがない代わりに、受信側の公開エンドポイント、認証、再送と重複受信への対処が要ります。Claudeの非同期処理であるMessage Batches APIも、processing_statusをポーリングしてendedになったらresults_urlから結果を取得する設計です。\n選択肢を読むときは、通知の起点がクライアントとサーバーのどちらにあるかを確認し、その起点から生じる負担（問い合わせの無駄か、受信側の準備か）が正しく書かれているかを見ると判断できます。数時間の処理を同期接続で待つ案は、長時間の接続がそもそも安定しないという前提で除外できます。", "domain": "2. Applications and Integration", "domain_confidence": "medium", "source_number": "10", "source_heading": null, "source_section": null, "ref": "https://platform.claude.com/docs/en/build-with-claude/batch-processing", "language": "ja"}, {"id": "CCDV-F-Udemy-0011", "exam": "CCDV-F", "source_repo": "Udemy", "source_file": "Udemy_CCDV-F.html", "question": "ある保険代理店には、自社のバックエンドからMessages APIを直接呼び出すアプリがあります。このアプリで、インターネットに公開済みのリモートMCPサーバー（Streamable HTTP）が提供する契約照会ツールを、Claudeに使わせたいと考えています。\nMCPクライアントは自前で実装せず、MCPコネクタ（mcp_serversパラメータ）を使います。\nこの構成の設計として正しいものはどれですか。（2つ選択してください。）", "choices": {"A": "mcp_toolsetのconfigsで更新系ツールのenabledをfalseにし、照会系のツールだけを使わせる。", "B": "mcp_serversにサーバーのURLと名前を定義し、tools配列のmcp_toolsetからその名前を参照する。", "C": "サーバーがresourcesとして公開している約款文書も、mcp_toolsetで有効にしてClaudeに読ませる。", "D": "開発者PCでstdio起動している検証用のMCPサーバーも、mcp_serversに起動コマンドを書いて接続する。", "E": "Claudeがmcp_tool_useを返したら、アプリがtools/callをサーバーへ送り、結果をtool_resultで返す。"}, "answer": ["A", "B"], "select_count": 2, "explanation": "A. 正解。mcp_toolsetでは、default_configで全ツールの既定を決め、configsでツールごとにenabledを上書きできます。更新系のツールだけをfalseにする拒否リスト（denylist）の形にすれば照会専用のアシスタントとして使え、公式ドキュメントも読み取り専用のアシスタントを作る場合などにこの形を勧めています。\nB. 正解。MCPコネクタでは、mcp_serversの各要素にtype・url・nameと、必要に応じてauthorization_tokenを定義し、tools配列に置いたmcp_toolsetのmcp_server_nameでそのサーバーを参照します。 これだけでAPIがサーバーからツールの一覧を取得してClaudeに提示し、呼び出しも代行するため、アプリはMCPクライアントを実装せずにリモートサーバーのツールを使えます。\nC. MCPのresourcesは、文書やスキーマのような参照用のデータを、アプリ側の判断でコンテキストに取り込むためのプリミティブです。しかしMCPコネクタが対応しているのはMCP仕様のうちツール呼び出しだけで、resourcesやpromptsはmcp_toolsetで扱えません。約款文書を読ませたい場合は、アプリが取得して文書としてメッセージに含めるか、文書を返すツールをサーバーに用意します。\nD. stdioは、Claude DesktopやClaude Codeのように同じマシン上でサーバーをサブプロセスとして起動するクライアントが使う通信方式で、ローカルのファイルやCLIを扱うサーバーに向きます。 MCPコネクタは、HTTP（Streamable HTTPまたはSSE）で公開されたサーバーにだけ接続でき、ローカルのstdioサーバーを直接つなぐことはできません。検証用サーバーを使うなら、HTTPで公開するか、自前のMCPクライアントを介する必要があります。\nE. 自前でMCPクライアントを持つ構成なら、モデルが選んだツールをアプリがtools/callで実行し、結果をtool_resultとして返すループを組みます。 MCPコネクタではその実行をAPI側が担い、応答にはmcp_tool_useとmcp_tool_resultのブロックがそろって返るため、アプリが改めて呼び出す必要はありません。二重に実行すれば、更新系のツールでは処理が重複するおそれもあります。\n\nMessages APIからリモートのMCPサーバーを直接使うMCPコネクタの構成と制約が問われています。MCPコネクタは、リクエストのmcp_serversにサーバーの接続情報を書き、tools配列のmcp_toolsetで参照するだけで、APIがサーバーとの通信とツールの実行を代行する仕組みです（ベータ機能のため、ベータヘッダーを付けて使います）。\nその代わりに制約があります。対応するのはツール呼び出しだけで、サーバーはHTTPで公開されている必要があり、ローカルのstdioサーバーはつなげません。有効にするツールは、mcp_toolsetの設定で許可リストや拒否リストの形に絞れます。\n誤答の3つは、stdioでの接続、アプリ側での再実行、resourcesの利用で、どれも自前のMCPクライアントやClaude Desktopといった別の構成なら成り立つ内容です。\n「ツールの実行を誰が担うか」と「MCP仕様のどこまでが対象か」の2点を押さえておくと、MCPコネクタとローカル接続の問題を取り違えません。\nなお、MCPコネクタはAmazon BedrockとGoogle Cloud（Google managed）では提供されていないため、利用するプラットフォームも事前に確かめておく必要があります。", "domain": "8. Tools and MCPs", "domain_confidence": "high", "source_number": "11", "source_heading": null, "source_section": null, "ref": "https://platform.claude.com/docs/en/agents-and-tools/mcp-connector", "language": "ja"}, {"id": "CCDV-F-Udemy-0012", "exam": "CCDV-F", "source_repo": "Udemy", "source_file": "Udemy_CCDV-F.html", "question": "ある鉄道会社が、乗客を案内するClaudeアシスタントを構築しています。\n指示をシステムプロンプトとユーザーメッセージのどちらに置くかについて、原則として最も適切なものはどれですか。", "choices": {"A": "役割や安全上の制約はシステムプロンプトに置き、個別の問い合わせやデータはユーザーメッセージに置く。", "B": "安全上の制約はユーザーメッセージの側に置き、問い合わせごとに内容を調整する。", "C": "指示は毎回のユーザーメッセージの冒頭にまとめて書き、システムプロンプトは使わずに運用する。", "D": "乗客ごとの問い合わせ内容も含め、指示とデータを丸ごとシステムプロンプトに入れる。"}, "answer": ["A"], "select_count": 1, "explanation": "A. 正解。案内係としての役割、守るべき振る舞い、安全上の制約のような会話全体に効かせる方針はシステムプロンプトに置き、毎回変わる乗客の問い合わせや参照データはユーザーメッセージに置きます。安定した方針と可変の入力を分けておけば、方針を一か所で保守でき、利用者の入力が方針と混ざることも防げます。\nB. 問い合わせの内容に応じて変えたい補足（路線ごとの注意事項など）は、ユーザーメッセージに添えるのが適切です。しかし安全上の制約は全ターンで一貫して守らせるべき方針で、利用者の入力と同じ場所に置くと、入力の書き方次第で弱められたり上書きされたりするおそれがあります。\nC. 指示をユーザーメッセージにまとめて書く方法でも、Claudeは多くの場合それに従い、システムプロンプトを設定できない環境では実際に使われる書き方です。しかし毎回の入力と方針が同じ場所に混ざるため方針の保守が難しくなり、利用者の入力で方針が弱められる余地も生まれます。公式ドキュメントも、システムプロンプトで役割を設定すると振る舞いと口調が用途に合わせて安定すると説明しています。\nD. 常に参照させたい背景情報（運行ルールの要点など）をシステムプロンプトに入れること自体は一般的です。しかし乗客ごとの問い合わせまでシステムプロンプトに入れると、方針と毎回変わる入力が混ざって保守しにくくなり、信頼できない利用者の入力を方針と同じ権威で扱うことにもなります。\n\n指示をシステムプロンプトとユーザーメッセージのどちらに置くかは、方針の一貫性と入力の安全性を左右するプロンプト設計の基本です。Messages APIでは、systemはトップレベルのパラメータとして会話全体の前提を与え、messagesのuserターンが個々の依頼を担います。\n役割、振る舞いのルール、安全上の制約のように全ターンで一貫させたい方針はシステムプロンプトに、乗客の質問や参照するデータのように毎回変わるものはユーザーメッセージに置くのが原則です。こう分けておくと、方針の変更はシステムプロンプトだけを直せば済み、利用者の入力が方針を上書きする余地も小さくなります。\n誤答は、方針も含めて毎回ユーザーメッセージに書く、安全上の制約をユーザーメッセージ側に置く、何もかもシステムプロンプトに入れる、のいずれかで、「安定した方針」と「可変な入力」を分けるという観点が欠けています。\n長い参照資料を扱う場合は、資料をプロンプトの上部に、質問を末尾に置くと精度が上がる、という配置の工夫もあわせて押さえておくと役立ちます。", "domain": "6. Prompt and Context Engineering", "domain_confidence": "high", "source_number": "12", "source_heading": null, "source_section": null, "ref": "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices", "language": "ja"}, {"id": "CCDV-F-Udemy-0013", "exam": "CCDV-F", "source_repo": "Udemy", "source_file": "Udemy_CCDV-F.html", "question": "あるセキュリティ運用センター（SOC）が、Claudeアプリを構築しています。このアプリで、自社インフラ内で動く社内SIEMへの独自クエリと、一般的なWeb検索の両方を行いたいと考えています。\nクライアント側ツール（client tools）とサーバー側ツール（server tools）の実行場所と使い分けについて、正しいものはどれですか。", "choices": {"A": "クライアント側ツールもAnthropicのインフラ上で実行され、社内のSIEMには接続できない。", "B": "サーバー側ツールは自分のアプリ内で実行され、実行コードを書いてtool_resultを返す。", "C": "社内の独自システムにはサーバー側ツールで接続し、Web検索はクライアント側ツールとして自前で実装する。", "D": "SIEM照会のような自作ツールはアプリ内で実行され、Web検索はAnthropic側で実行される。"}, "answer": ["D"], "select_count": 1, "explanation": "A. クライアント側ツールの実行場所はアプリケーション側で、Claudeはどのツールをどんな入力で呼ぶかを示すだけです。アプリが自社インフラ内で動いていれば、そこから社内SIEMに接続できるため、社内システムとの連携にはまさにクライアント側ツールを使います。\nB. 実行コードを自分で書いてtool_resultを返すのは、クライアント側ツールの扱い方です。web_searchやcode_executionのようなサーバー側ツールはAnthropicのインフラ上で実行され、結果は同じ応答の中に直接含まれるため、アプリ側で実行を扱う必要はありません。\nC. 自前のWeb検索をクライアント側ツールとして実装すること自体は、独自の検索基盤を使いたい場合などにあり得る設計です。しかしサーバー側ツールはAnthropicが提供する機能（web_search、web_fetch、code_executionなど）で、利用者が独自の社内システム向けに定義できるものではなく、自社インフラ内のSIEMにも到達できません。\nD. 正解。ツールは実行される場所で区別されます。自分で定義したクライアント側ツールはアプリ内で実行され、Claudeがstop_reason: tool_useとtool_useブロックを返したら、アプリがSIEMに照会してtool_resultを返します。 Web検索のようなサーバー側ツールはAnthropicのインフラで実行されるので、アプリは結果を受け取るだけで済みます。社内ネットワークの中にあるシステムには、自社環境で動くクライアント側ツールから接続します。\n\nツールが「どこで実行されるか」を理解しているかどうかが、正誤の分かれ目です。公式ドキュメントでは、ツールは主にコードが実行される場所で区別されます。\nクライアント側ツール（自分で定義したツールや、bash・text_editorのようにAnthropicがスキーマを定めたツール）はアプリケーションで実行され、Claudeがtool_useを返し、アプリが処理してtool_resultを返す往復になります。サーバー側ツール（web_search、web_fetch、code_execution、tool_searchなど）はAnthropicのインフラで実行され、結果が応答に直接含まれます。\nしたがって社内インフラ内のSIEMへの独自クエリはクライアント側ツール、一般的なWeb検索はサーバー側ツールという組み合わせになります。\n誤答は、実行場所を入れ替える、クライアント側ツールもAnthropic側で動くとみなす、といった形で実行場所を取り違えています。\n「そのコードはどこで動き、どのネットワークに届くか」を考えると、社内システム連携の問題は迷わず解けます。", "domain": "8. Tools and MCPs", "domain_confidence": "high", "source_number": "13", "source_heading": null, "source_section": null, "ref": "https://platform.claude.com/docs/en/agents-and-tools/tool-use/overview", "language": "ja"}, {"id": "CCDV-F-Udemy-0014", "exam": "CCDV-F", "source_repo": "Udemy", "source_file": "Udemy_CCDV-F.html", "question": "CRMを提供するあるSaaS企業が、長時間実行のエージェントを構築します。このエージェントには、次の機能が必要です。\n障害から再開できる耐久実行\n人手による承認（human-in-the-loop）\n状態の永続化\nLangGraphのようなエージェントオーケストレーションフレームワークの採用についての判断として、最も適切なものはどれですか。", "choices": {"A": "障害後の再開や状態の保存の仕組みを自作せずに済ませるために採用し、制御フローをグラフで定義する。", "B": "LLMの呼び出し回数とトークン消費を自動で減らし、APIコストを下げるために採用する。", "C": "プロンプトやエージェントの構成を自分で書かずに済ませるために採用する。", "D": "採用は見送り、Messages APIでツール使用ループを直接実装して、承認待ちの状態はプロセスのメモリに保持する。"}, "answer": ["A"], "select_count": 1, "explanation": "A. 正解。LangGraphは長時間実行・ステートフルなエージェントのための低レベルのオーケストレーションフレームワークで、状態を永続化して障害後に途中から再開する耐久実行や、状態を確認・修正して人が介入するhuman-in-the-loopを備えています。これらを自作せずに使える一方、処理の流れはノードとエッジのグラフとして開発者が明示的に設計するため、制御の見通しも保てます。\nB. 呼び出し回数やトークン消費を減らしたいなら、プロンプトキャッシュやモデル選択、処理設計の見直しといった別の手段を使います。オーケストレーションフレームワークはモデルの外側で制御フローと状態を管理する層で、呼び出しを自動で減らす機能ではありません。フレームワークの内部で何が送られているかを理解せずに使うと、かえって無駄な呼び出しに気づきにくくなる点にも注意が必要です。\nC. プロンプトや典型的なツール呼び出しループまであらかじめ用意された仕組みで手早く作りたい場合は、LangChainのagentsのような上位の仕組みが向いています。LangGraphは自らを低レベルのオーケストレーションフレームワークと位置づけ、プロンプトやアーキテクチャを隠さない（抽象化しない）ため、エージェントの構成は開発者が設計する前提です。\nD. Anthropicは、多くのパターンはLLMのAPIを直接使えば数行で実装できるとして、まずシンプルな実装から始めることを推奨しており、短時間で完結するエージェントならこの判断は妥当です。しかし状態がプロセスのメモリにしかないと、障害や再起動で途中経過が失われ、承認待ちで長時間止まる処理を再開できないため、本問の要件を満たすには同等の仕組みを自作することになります。\n\nLangGraphは、エージェント向け抽象化フレームワークの1つです。長時間実行・ステートフルなエージェントを構築・管理・デプロイするための低レベルのオーケストレーションフレームワーク兼ランタイムで、耐久実行、human-in-the-loop、短期・長期のメモリといった共通の仕組みを備え、プロンプトやアーキテクチャは抽象化しません。\n判断の根拠は、問題文の「障害から再開できる耐久実行」「人手による承認」「状態の永続化」がそのまま実行基盤の要件になっている点です。\nこれらが不要な単純なエージェントならAPIを直接使う方が見通しがよく（Anthropicもシンプルな実装から始めることを推奨しています）、プロンプトや構成まで用意された仕組みが欲しいならより上位の仕組みを選びます。コスト削減はフレームワークの役割ではありません。\nフレームワークの採用は、「要件がフレームワークの提供する機能と一致しているか」「フレームワークの内部で何が起きているかを理解したうえで使えるか」の2点で判断するのが基本です。", "domain": "1. Agents and Workflows", "domain_confidence": "high", "source_number": "14", "source_heading": null, "source_section": null, "ref": "https://docs.langchain.com/oss/python/langgraph/overview", "language": "ja"}, {"id": "CCDV-F-Udemy-0015", "exam": "CCDV-F", "source_repo": "Udemy", "source_file": "Udemy_CCDV-F.html", "question": "あるEdTech企業が、K-12向けの教材を生成する指示（プロンプト）を、Claude Code・claude.ai・Messages APIの3つで試しました。すると、同じ指示でも解釈や出力が異なりました。\nこの違いの理由と対処として最も適切なものはどれですか。", "choices": {"A": "差の原因は指示の曖昧さにあるため、指示文を詳しく書き直して3つの出力をそろえる。", "B": "各インターフェースが付け加える文脈が異なるため、文脈を制御できるAPI上に構築する。", "C": "3つは同じシステムプロンプトで動くため、差はモデルの不具合としてサポートに報告する。", "D": "最も良い出力が出たインターフェースを1つに決め、残りの2つでの検証はやめる。"}, "answer": ["B"], "select_count": 1, "explanation": "A. 指示を具体的に書き直すことは、どの環境でも出力の質とぶれを改善する有効な手段です。しかし各インターフェースが付け加えるシステムプロンプトやツール、メモリの違いは指示文の外側にあるため、指示だけを詳しくしても文脈の差は残り、出力がそろう保証にはなりません。\nB. 正解。claude.aiは独自のシステムプロンプトを、Claude Codeはそれに加えてツール定義やCLAUDE.md、auto memoryなどを指示の周りに付け加えるため、同じ指示でもモデルが受け取る文脈全体は異なります。 Messages APIではシステムプロンプトとメッセージを開発者が組み立てるので、挙動をそろえたい本番用途はAPIやSDK上に構築し、実際に提供する環境で評価するのが適切です。\nC. claude.aiやモバイルアプリは、現在の日付の提供や回答スタイルの誘導のために独自のシステムプロンプトを会話の最初に入れており、これはClaude APIには適用されないと公開されています。Claude Codeも独自のシステムプロンプトやツール、CLAUDE.mdなどを文脈に加えるため、同じ指示でも出力が変わるのは設計上の違いで、不具合報告で統一されるものではありません。\nD. 用途に合うインターフェースを選ぶこと自体は妥当な判断です。しかし差が生じる理由を理解しないまま1つに絞ると、後で別の環境へ移したり、選んだ環境の設定が変わったりしたときに同じ問題が再発します。本問では教材生成を本番化する前提で、挙動の違いを自分で制御できる状態にしておくことが求められています。\n\nClaude Code・claude.ai・Messages APIのどれで試すかによって同じ指示の解釈が変わるのは、モデルが受け取るのが指示文だけでなく、その周りの文脈全体だからです。claude.aiとモバイルアプリは独自のシステムプロンプトを会話の最初に入れており（APIには適用されない）、Claude Codeはさらにツール、CLAUDE.md、auto memory、セッションの状態などを文脈に加えます。一方Messages APIでは、systemとmessagesに何を入れるかを開発者が決めます。\nしたがって挙動を一貫させたい本番の教材生成は、文脈を自分で組み立てられるAPIやSDKの上に作り、実際に提供する環境で評価するのが筋です。\n誤答は、原因を調べずに環境を1つに絞る、モデルの不具合とみなす、指示文の書き方だけに原因を求める、のいずれかで、「指示の外側にある文脈」を見落としている点が共通しています。\nインターフェース間の違いを問われたら、まず「モデルに実際に届いている文脈は何か」を考えると整理できます。", "domain": "2. Applications and Integration", "domain_confidence": "high", "source_number": "15", "source_heading": null, "source_section": null, "ref": "https://platform.claude.com/docs/en/release-notes/system-prompts/overview", "language": "ja"}, {"id": "CCDV-F-Udemy-0016", "exam": "CCDV-F", "source_repo": "Udemy", "source_file": "Udemy_CCDV-F.html", "question": "ある銀行が、登録住所の変更をチャットで受け付けるClaudeアシスタントを構築しています。手順は、必ず次の順序で進める必要があります。\n本人確認\n新住所の聞き取り\n内容の復唱と同意\n変更の実行\nテストでは、利用者に急かされたClaudeが、本人確認の完了前に住所変更ツールを呼び出す事例が見つかりました。\nこの順序を確実に守らせる設計として最も適切なものはどれですか。", "choices": {"A": "エフォートを高い値に設定し、応答のたびにClaudeが手順を確認する推論の量を増やす。", "B": "現在の手順をアプリ側の状態として保持し、その状態で許可したツールだけをリクエストに含める。", "C": "次に進む手順名を毎回の応答でClaudeにJSONで出力させ、アプリはその値に従って処理を切り替える。", "D": "手順の順序をシステムプロンプトに番号付きで明記し、順序どおりに進む対話をフューショットプロンプティングで示す。"}, "answer": ["B"], "select_count": 1, "explanation": "A. エフォートは思考と応答に使うトークン量の目安を調整するパラメータで、難しい推論が必要なタスクの品質を上げたいときに引き上げます。推論が深くなっても、手順を飛ばすかどうかはモデルの判断のままで、住所変更ツールを呼べる状態も変わりません。必須の順序を保証する手段にはならず、コストとレイテンシが増えるだけです。\nB. 正解。Messages APIはステートレスで、会話がどの段階まで進んだかはアプリが管理します。アプリ側で「本人確認済み」などの状態を持ち、状態の遷移は本人確認ツールの成功のようにコードで判定できる事実に基づいて行います。 各状態で使ってよいツールだけをtoolsに渡せば、本人確認前のリクエストには住所変更ツールが存在しないため、Claudeは呼び出しようがありません。対話の柔軟さはClaudeに任せつつ、破れない順序だけをコードで強制する設計です。\nC. 構造化出力で次の手順名をJSONとして返させる方法は、問い合わせの分類やルーティングの判定をアプリに取り込みたい場面で有効です。ただしJSONの形式が保証されても、どの手順名を選ぶかはモデルの判断のままで、急かされて「変更の実行」を返せばアプリはそれに従ってしまいます。順序の強制を、順序を破り得る側の出力に委ねる構造になっています。\nD. 番号付きリストで手順を示し、フューショットプロンプティングで望ましい対話を示すのは、順序や網羅性が重要な指示をClaudeに伝える正攻法で、多くの場面で遵守率を上げます。しかしプロンプトはモデルの判断に働きかけるもので、住所変更ツールがリクエストに含まれている限り、利用者に強く急かされた場面で先に呼ばれる可能性は残ります。本人確認のような必須の順序は、確率ではなく仕組みで保証する必要があります。\n\n会話の中で「必ずこの順に進む」という業務上の制約を、どこで保証するかが問われています。Anthropicはワークフローを、あらかじめ定めたコードの経路でLLMとツールを組み合わせる仕組みと位置づけ、中間の段階にプログラムによるチェック（ゲート）を置けると説明しています。\n本問ではこれを対話に当てはめ、アプリ側に状態機械（ステートマシン）を持たせます。現在の状態に応じて渡すツールを絞り、状態を進める条件を本人確認ツールの成功のようなコードで検証できる事実にしておけば、Claudeが何を言われても、未確認のまま変更が実行されることはありません。\n誤答の3つは、いずれも順序を守るかどうかの最終判断をモデルに残しています。プロンプトの工夫、構造化出力、推論量の調整は応答の質を高める手段ですが、破ってはならない順序にはモデルの外側の仕組みを組み合わせる、という線引きを持っておくと設計を誤りません。\nなお、ツール定義の変更はプロンプトキャッシュ全体を無効にするため、ツール定義は固定したまま、状態に合わない呼び出しの実行をアプリが拒否してエラーとして返す実装を選ぶこともできます。", "domain": "8. Tools and MCPs", "domain_confidence": "medium", "source_number": "16", "source_heading": null, "source_section": null, "ref": "https://www.anthropic.com/engineering/building-effective-agents", "language": "ja"}, {"id": "CCDV-F-Udemy-0017", "exam": "CCDV-F", "source_repo": "Udemy", "source_file": "Udemy_CCDV-F.html", "question": "ある物流企業が、CIパイプラインにClaude Codeを組み込み、プルリクエストのコードレビューを自動化します。\nヘッドレスモードとsettings.jsonの使い方として最も適切なものはどれですか。", "choices": {"A": "プロジェクトのsettings.jsonでdefaultModeをbypassPermissionsにし、確認を一括で省く。", "B": "-pで非対話実行し、必要なツールを--allowedToolsで事前に許可する。", "C": "CLAUDE.mdに「CIでは確認なしで実行してよい」と書き、対話モードのまま起動する。", "D": "対話モードで起動し、表示される権限確認にはCI担当者がその都度応答して進める。"}, "answer": ["B"], "select_count": 1, "explanation": "A. bypassPermissionsは確認をまとめて省くモードですが、permissions.defaultModeのautoとbypassPermissionsはプロジェクト設定やローカル設定からは効かない仕様で、使う場合はユーザー設定・マネージド設定か--permission-modeで指定します。 そもそも全操作を無確認にするのは隔離された環境に限るべき強い設定で、レビュー用途なら必要なツールだけを許可するほうが安全です。\nB. 正解。-p（--print）を付けるとClaude Codeは非対話モードで動き、結果を標準出力に返すため、CIのスクリプトから扱えます。-pの実行には承認する人がいないので、許可が必要な操作は拒否されます。--allowedToolsで必要なツールを指定しておけば確認なしで実行でき、--permission-mode dontAskと併用すれば、許可していない操作は確認を求めずに拒否されます。 なお共有の.claude/settings.jsonにあるpermissions.allowルールは、フォルダの信頼（workspace trust）を受け入れた後にだけ適用されます。-pは信頼ダイアログを表示しないため、CIが新しくチェックアウトしたフォルダではこの許可ルールは使われません。\nC. CLAUDE.mdは規約やビルド手順をモデルに伝えるための文脈で、権限の判定には関与しません。公式ドキュメントも、Claudeはこれを強制される設定ではなく文脈として扱うと説明しており、書いた文言で確認ダイアログが省かれることはないため、対話モードで起動すればCIは確認待ちで止まります。\nD. 権限確認に人が応答する対話モードは、開発者が手元で変更内容を確かめながら作業する通常の使い方です。CIのパイプラインは無人で動くため、確認待ちで処理が止まり、プルリクエストのたびに人が張り付く運用になって自動化の意味がなくなります。\n\nCIパイプラインでClaude Codeを動かすときは、無人で最後まで実行できることと、許可の設定が実際に効くことの2点が問われます。claude -pはプロンプトを受け取って非対話で実行し、結果を標準出力（--output-format jsonなら構造化された形）で返すため、スクリプトやCIから扱えます。確認に答える人がいないので、必要な操作は--allowedToolsで事前に許可し、必要なら--permission-mode dontAskで許可外の操作を拒否させます。\n注意したいのは、リポジトリにコミットした.claude/settings.jsonのpermissions.allowルールが、フォルダの信頼（workspace trust）を受け入れた後にだけ適用される点です。-pの実行は信頼ダイアログを表示しないため、CIが新しくチェックアウトしたフォルダでは共有の許可ルールは使われず、許可を置くならコマンドラインの--allowedToolsか、ランナー側のユーザー設定・マネージド設定になります。\n誤答は、対話前提のまま運用する案、プロジェクト設定からは効かない権限モードに頼る案、強制力のないCLAUDE.mdに頼る案です。\n手元の対話セッションで効いた設定がCIでも同じように効くとは限らない、という点を意識して選択肢を読むと、正解は1つに絞れます。", "domain": "3. Claude Code", "domain_confidence": "high", "source_number": "17", "source_heading": null, "source_section": null, "ref": "https://code.claude.com/docs/en/headless", "language": "ja"}, {"id": "CCDV-F-Udemy-0018", "exam": "CCDV-F", "source_repo": "Udemy", "source_file": "Udemy_CCDV-F.html", "question": "あるゲーム開発会社が、ノンプレイヤーキャラクターのセリフ生成に使うClaudeのプロンプトを、頻繁に改良しています。\nプロンプトの変更を通常のソフトウェア開発ライフサイクル（SDLC）に統合する方法として最も適切なものはどれですか。", "choices": {"A": "プロンプトの変更は本番でA/Bテストにかけ、利用者の反応が良かった版を残していく。", "B": "企画担当が管理画面からプロンプトを直接編集できるようにし、変更を即時に本番へ反映する。", "C": "プロンプト本文は設定データベースで管理し、変更時はコミットメッセージに全文を記録する。", "D": "プロンプトをリポジトリで管理し、プルリクエストでレビューと評価を通してからマージする。"}, "answer": ["D"], "select_count": 1, "explanation": "A. 本番でのA/Bテストは、事前評価を通過した候補の中から利用者にとって良い方を選ぶ最終段階としては有効な手法です。しかしマージ前の評価やレビューを経ずに本番へ出すと、キャラクター設定の崩れや不適切なセリフといった回帰を利用者が最初に目にすることになり、切り戻しの判断も遅れます。\nB. 管理画面から直接編集できる仕組みは、試作段階でプロンプトを素早く試すには便利です。ただし変更履歴とレビューが残らないため、どの変更で出力が悪化したのかを追えず、以前の版へ確実に戻すこともできません。\nC. プロンプトを設定データとして外出しすること自体は、デプロイせずに差し替えられる利点があり実務でも使われます。しかし本体がバージョン管理の外にあると、コミットメッセージの全文は記録にすぎず、差分レビューやリバート、評価結果との対応づけが機能しません。\nD. 正解。プロンプトはモデルの出力を左右する成果物なので、コードと同じくバージョン管理下に置けば、差分の確認・レビュー・問題時のリバートがそのまま使えます。Anthropicのプロンプトエンジニアリングのガイドも、改善の前提として成功基準と、それを実証的にテストする手段（評価）を用意することを求めており、プルリクエストで評価結果を確認してからマージすれば、変更の影響を本番前に把握できます。\n\nプロンプトはコードと同じく挙動を決める成果物であり、バージョン管理、コードレビュー、自動テスト（評価）、リリースと切り戻し、という通常の開発の流れに乗せることで、変更の追跡性と再現性を確保できます。Anthropicのプロンプトエンジニアリングのガイドも、明確な成功基準と、それに対して実証的にテストする手段を先に用意することを前提にしています。\n誤答はどれも実務で見かける手法ですが、評価が本番まで後回しになる（A/Bテストのみ）、履歴とレビューが残らない（管理画面で直接編集）、本体がバージョン管理の外にある（データベース管理）という点で、SDLCへの統合になっていません。\n「変更を誰がどこで確認し、問題が出たらどう戻せるか」を問いかけると、プルリクエストで評価とレビューを通す案だけが条件を満たします。", "domain": "2. Applications and Integration", "domain_confidence": "high", "source_number": "18", "source_heading": null, "source_section": null, "ref": "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/overview", "language": "ja"}, {"id": "CCDV-F-Udemy-0019", "exam": "CCDV-F", "source_repo": "Udemy", "source_file": "Udemy_CCDV-F.html", "question": "あるEC企業が、返品対応エージェントを開発します。このエージェントは、返品ポリシー文書を読み込み、社内の返品処理スクリプトを実行します。\nAnthropicのクライアント（Client）SDKでMessages APIを直接呼び出す方式と比べて、Claude Agent SDKを採用する利点として最も適切なものはどれですか。", "choices": {"A": "応答をストリーミングで逐次受け取れ、長い処理の途中経過をユーザーの画面に表示できる。", "B": "エージェントをAnthropicのインフラ上でホストでき、実行環境やサンドボックスを運用せずに済む。", "C": "ファイル操作やコマンド実行の組み込みツールと、それらを実行して結果を返すエージェントループを利用できる。", "D": "claude.aiのアカウントでログインして動かせ、APIキーを発行せずに自社製品へ組み込める。"}, "answer": ["C"], "select_count": 1, "explanation": "A. ストリーミングはMessages API自体の機能で、Client SDKでもmessages.stream()やstream: trueで応答を逐次受け取れます。長い生成でユーザーを待たせないための有効な手段ですが、Client SDKでも同じことができるため、Agent SDKを採用する利点にはなりません。\nB. エージェントループとサンドボックスをAnthropicがホストするのはManaged Agentsの特徴で、実行基盤を持たずに長時間の非同期タスクを動かしたい場面に向きます。Agent SDKは利用者自身が運用するプロセスの中でエージェントを動かすライブラリなので、実行環境の運用は利用者側に残ります。\nC. 正解。Agent SDKは、Claude Codeを支えるものと同じ組み込みツール（Read・Edit・Bashなど）・エージェントループ・コンテキスト管理を、PythonとTypeScriptのライブラリとして使えるようにしたものです。ツールの実行と結果の返却はSDK側が担います。 Client SDKでは、tool_useの応答を受けてツールを実行し、結果を返して再びAPIを呼ぶループを自前で書くか、ベータ版のtool runnerに任せたうえで、ファイル操作やコマンド実行そのものも自分で実装する必要があります。返品ポリシーの読み込みとスクリプト実行を伴う本問のエージェントでは、この実装負担をまとめて省けます。\nD. claude.aiアカウントでのログインは、開発者が対話的に使うClaude Code CLIなどで使える認証方法です。Anthropicは事前の承認なく第三者がAgent SDKで作った製品にclaude.aiログインやそのレート制限を提供することを認めておらず、Agent SDKではAPIキーによる認証を使う必要があります。\n\nClient SDKは、Messages APIを直接呼び出すためのライブラリで、モデルがtool_useを返したらツールを実行し、tool_resultを付けて再び呼び出すというループと、ツールそのものの実装を開発者が担います（ループ部分はベータ版のtool runnerに任せることもできます）。これに対しAgent SDKは、Claude Codeと同じエージェントループと組み込みツール（ファイルの読み書き・編集、コマンド実行、Web検索）に加え、フック・サブエージェント・MCP・パーミッション・セッションを備えたライブラリです。\n比較の軸は「Client SDKでもできることかどうか」で、ストリーミングやツール使用自体は両方で使えるため差になりません。ホスティングを任せたいならManaged Agents、claude.aiログインはAgent SDK製品では使えない、という区別も押さえておきましょう。\nツールを実行する部分を誰が実装し、誰が運用するのか、という観点でClient SDK・Agent SDK・Managed Agentsを並べると整理しやすくなります。", "domain": "1. Agents and Workflows", "domain_confidence": "high", "source_number": "19", "source_heading": null, "source_section": null, "ref": "https://code.claude.com/docs/en/agent-sdk/overview", "language": "ja"}, {"id": "CCDV-F-Udemy-0020", "exam": "CCDV-F", "source_repo": "Udemy", "source_file": "Udemy_CCDV-F.html", "question": "ある小売企業のカスタマーサポートチャットでは、1人の顧客との対話が長時間続きます。\nセッションの適切な管理（セッションハイジーン）の観点で、最も適切な設計はどれですか。", "choices": {"A": "用件が変わっても同じセッションを使い続け、過去のやり取りを削らずに毎回送り直す。", "B": "1Mトークンのコンテキストウィンドウを持つモデルを選び、全履歴を上限まで保持する。", "C": "会話の状態はサーバー側に保持させ、クライアントは毎回最新のメッセージだけを送る。", "D": "用件ごとにセッションを分け、古い履歴は要約したり削ったりして縮め、関連する文脈だけを残す。"}, "answer": ["D"], "select_count": 1, "explanation": "A. 同じセッションで過去のやり取りを残し続けると、以前の用件の文脈を参照できるという利点はあります。しかし用件が変わった後の無関係な履歴がノイズになって必要な内容を正確に拾いにくくなり、再送のたびに入力トークンの課金も増えるため、長時間の対話では品質とコストの両面で不利になります。\nB. 1Mトークンのウィンドウは、長い契約書や大量の資料を一度に読ませたい用途では大きな利点です。ただし上限に収まることと精度が保たれることは別で、履歴が増えるほどcontext rotによる劣化とトークン費用が増えるため、容量が大きいからといって全履歴を抱え続けるのは健全な設計ではありません。\nC. サーバー側で会話の状態を保持する仕組みは、Anthropicがホストするマネージド型のエージェントのセッションなどには存在します。しかしMessages APIはステートレスで、過去のターンは送られたmessagesの中にしか存在しないため、最新のメッセージだけを送るとClaudeはそれまでの経緯を知らないまま回答します。\nD. 正解。Messages APIはステートレスで、会話を続けるには過去のやり取りをmessagesとして毎回送り直すため、履歴はそのままコンテキストウィンドウに積み上がります。公式ドキュメントは、トークンが増えるほど前に読んだ内容を正確に拾えなくなる現象（context rot）を挙げ、何を文脈に入れるかの取捨選択が容量と同じくらい重要だとしています。 用件ごとにセッションを分け、古い部分を要約したり不要な部分を削ったりして縮めれば、応答品質とコストの両方を保てます。\n\n長く続くチャットで「履歴をどこまで持ち続けるか」は、セッションの適切な管理（セッションハイジーン）、つまり会話履歴やコンテキストを健全に保つ運用の問題で、品質とコストの両方に効きます。Messages APIはステートレスなので、会話を続けるにはシステムプロンプトと過去のメッセージを毎回送り直し、そのすべてがコンテキストウィンドウに計上されます。公式ドキュメントは、コンテキストは多ければよいわけではなく、トークンが増えるほど前に読んだ内容を正確に拾えなくなる（context rot）ため、何を入れるかの管理が重要だと述べています。\nそこで用件の区切りでセッションを分け、長くなった履歴は要約したり（サーバー側のコンパクション）、不要な部分を削ったり（ツール出力の刈り込み）して縮め、関連する文脈だけを残すのが健全な設計です。\n誤答のうち、サーバーに状態を持たせる案はAPIの前提と合わず、履歴を削らずに持ち続ける案と大きなウィンドウに頼る案は、いずれもcontext rotとコスト増を招きます。\n「履歴を増やせば賢くなる」という直感を疑うことが、この分野の問題を解く出発点です。", "domain": "2. Applications and Integration", "domain_confidence": "high", "source_number": "20", "source_heading": null, "source_section": null, "ref": "https://platform.claude.com/docs/en/build-with-claude/context-windows", "language": "ja"}, {"id": "CCDV-F-Udemy-0021", "exam": "CCDV-F", "source_repo": "Udemy", "source_file": "Udemy_CCDV-F.html", "question": "ある自動車部品メーカーが、設計関連文書を編集するエージェントを運用しています。監査要件により、エージェントがファイルを変更したときは、例外なく毎回、監査ログに記録しなければなりません。\nこの要件を満たす実装として最も適切なものはどれですか。", "choices": {"A": "EditとWriteにマッチさせたPostToolUseFailureフックを設定し、監査記録スクリプトを実行する。", "B": "監査記録用のサブエージェントを定義し、ファイル変更後に呼び出すようメインエージェントに指示する。", "C": "EditとWriteにマッチさせたPostToolUseフックを設定し、監査記録スクリプトを実行する。", "D": "CLAUDE.mdに「ファイルを編集したら監査ログへ記録する」というルールを記載する。"}, "answer": ["C"], "select_count": 1, "explanation": "A. PostToolUseFailureは、ツール呼び出しが失敗した後に発火するイベントで、失敗した操作の記録やエラー通知に向きます。ファイル変更が成功したときには発火しないため、成功した変更を毎回監査ログへ残すという本問の要件では、記録すべき変更が残らなくなります。\nB. 専門のサブエージェントに作業を切り出すのは、コンテキストを分離したい調査や専門的なレビューに向く方法です。しかしサブエージェントを呼び出すかどうかはメインエージェント（モデル）の判断に依存するため呼び出し忘れを排除できず、ファイル変更のたびに確実に記録するには、モデルを経由しない仕組みが別に必要です。\nC. 正解。フックはエージェントのライフサイクルの決まった時点で実行されるユーザー定義の処理で、モデルの判断を経由せず、matcherに合致すればそのたびに起動します。PostToolUseはツール呼び出しが成功した直後に発火するため、EditやWriteによる変更が確定するたびに監査記録のスクリプトが動き、記録漏れをモデルの注意力に頼らずに防げます。\nD. CLAUDE.mdはプロジェクトの規約やビルド手順などをセッション開始時にコンテキストへ読み込ませる仕組みで、コーディング規約の共有などに向きます。ただし内容はモデルへの指示として扱われるだけで実行は強制されないため、長いセッションや複雑な作業の中で記録を忘れる可能性が残り、「例外なく毎回」という監査要件を保証できません。\n\nフックを使うと、モデルの判断に左右されない決定論的なアクションを実現できます。フックはツール実行の前後やセッション開始時など、ライフサイクルの特定の時点で自動的に実行されるシェルコマンドやHTTP呼び出しなどの処理で、matcherでツール名（Edit|Writeなど）を絞り込めます。モデルが指示に従うかどうかに関係なく起動するため、「例外なく毎回」という要件をプロンプトではなくコードで担保できます。\n押さえるべき点は2つです。1つは、CLAUDE.mdへの記述やサブエージェントへの依頼のようにモデルの判断を経由する方法は確率的で、監査要件の保証にならないこと。もう1つはイベントの選択で、成功後はPostToolUse、失敗後はPostToolUseFailure、実行前の阻止はPreToolUseと役割が分かれていることです。\n要件が「確実に」「毎回」を求めていればフックを選び、そのうえで「いつ発火すべきか」でイベント名を決める、という2段階で考えると取り違えません。", "domain": "1. Agents and Workflows", "domain_confidence": "medium", "source_number": "21", "source_heading": null, "source_section": null, "ref": "https://code.claude.com/docs/en/hooks", "language": "ja"}, {"id": "CCDV-F-Udemy-0022", "exam": "CCDV-F", "source_repo": "Udemy", "source_file": "Udemy_CCDV-F.html", "question": "ある電力会社が、送電網を監視するClaudeエージェントを運用しています。長時間のセッションでは、各ツールがセンサーデータなどの大量のデータを加工せずにそのまま返し、それがコンテキストにたまって、品質が下がるとともにコストとレイテンシが増えています。\nコンテキストの肥大化を防ぐ緩和策として、最も適切なものはどれですか。", "choices": {"A": "max_tokensを引き上げ、大きくなったコンテキストでも長い応答を最後まで出力させる。", "B": "センサーデータを取得するツールの登録を外し、エージェントに生データを取得させない。", "C": "ツール結果を必要な項目に絞ってから追加し、古いやり取りは要約して短くする。", "D": "1Mトークンのウィンドウを持つモデルへ移行し、ツールが返したデータをそのまま保持し続ける。"}, "answer": ["C"], "select_count": 1, "explanation": "A. max_tokensは1回の応答で生成する出力の上限で、長い回答が途中で切れる（stop_reasonがmax_tokens）場合に引き上げるパラメータです。コンテキストウィンドウの容量は増えず、むしろ出力の分だけウィンドウを多く使うため、蓄積したツール結果による品質低下やコストの問題は解決しません。\nB. 不要なツールを外すことは、ツール定義そのものが占めるトークンを減らす方法としては有効です。しかしセンサーデータの取得は送電網監視エージェントの中核機能で、利用を止めれば監視という目的自体が成り立たなくなります。問題はツールの存在ではなく、その結果を加工せずに積み上げていることにあります。\nC. 正解。ツールの応答を次の判断に必要な項目だけに絞れば、1回ごとに追加される量を減らせます（公式のツール設計の指針でも、必要な情報だけを含む応答が勧められています）。さらに長時間のセッションでは、古いターン（1往復のやり取り）をClaudeがサーバー側で書いた要約に置き換えるコンパクションや、古いツール結果を除去するコンテキスト編集で、後続のステップに必要な状態だけを残します。\nD. 大きなウィンドウは、膨大な資料を一度に読ませる必要がある場面では有力な選択肢です。しかし公式ドキュメントが述べるとおり、トークンが増えるほど前に読んだ内容を正確に拾えなくなり（context rot）、入力トークンの課金とレイテンシも増えるため、生データを溜め続ける限り問題文の症状は解消しません。\n\nツールが加工せずに返す大量のデータが積み上がって品質とコストを悪化させる、コンテキストの肥大化への対処が問われています。エージェントは各ステップのツール結果を会話に積み上げていくため、大量のデータをそのまま返すツールを長時間呼び続けると、関係の薄い情報でモデルの注意が分散し、トークン費用とレイテンシも増えていきます。\n対策は2段構えで、まず入口でツールの応答を必要な項目に絞り、次に溜まった履歴をコンパクション（古いターンを要約に置き換える）やコンテキスト編集（古いツール結果を除去する）で縮めます。コンパクションは、長い会話や長時間のエージェントを上限内で続けるための主要な戦略と位置づけられています。\n誤答は、ツール自体をやめる、出力の上限を変える、ウィンドウの大きさで受け止める、という「量を減らさない」対処で、症状の原因である不要な蓄積に手を付けていません。\nコンテキストに何を残すかを設計することが、容量を増やすことより優先される、という考え方がこの分野の出発点です。", "domain": "6. Prompt and Context Engineering", "domain_confidence": "high", "source_number": "22", "source_heading": null, "source_section": null, "ref": "https://platform.claude.com/docs/en/build-with-claude/context-windows", "language": "ja"}, {"id": "CCDV-F-Udemy-0023", "exam": "CCDV-F", "source_repo": "Udemy", "source_file": "Udemy_CCDV-F.html", "question": "ある決済プラットフォームで、取引照合を行うClaudeベースのエージェントが断続的に失敗しています。トレースには、次の2種類の失敗が記録されています。\nAPIがHTTP 400 invalid_request_errorを返し、即座に失敗する\nAPIはHTTP 200を返すが、返ってきた本文を自社のパーサでバリデーションすると、不正な形式として弾かれる\nこれらの失敗が、統合レイヤー（自社のリクエスト構築・後処理コード）の不具合によるものか、モデル出力そのものの問題によるものかを切り分けるうえで、最も適切なアプローチはどれですか。", "choices": {"A": "max_tokensを引き上げて応答が途中で切れていないことを確かめ、同じ処理を再実行する。", "B": "失敗したリクエストを一律に指数バックオフで再試行し、成功した場合は解決済みとみなす。", "C": "失敗をAPI境界で分類し、4xxは自社の組み立て、200後の不正は出力か後処理の問題とする。", "D": "より大きなモデルに切り替えて同じ取引を処理し、失敗の頻度が下がるかどうかを観察する。"}, "answer": ["C"], "select_count": 1, "explanation": "A. stop_reasonがmax_tokensの応答は途中で切れているため、200応答の後にパースで弾かれる一因として確認する価値はあります。しかしmax_tokensは出力の長さを変えるだけで、リクエストの形式や内容の不備を示す400 invalid_request_errorには効かず、2種類の失敗を層ごとに切り分ける手段にはなりません。\nB. 指数バックオフでの再試行は、429（レート制限）や529（過負荷）、500のような一時的なエラーからの回復策としては正しい実装です。しかし400は同じリクエストを送り続けても毎回同じ理由で拒否され、たまたま成功した再試行を「解決」と扱うと、根本原因が隠れたまま失敗が続きます。\nC. 正解。Claude APIは予測可能なHTTPステータスとエラー種別を返し、400 invalid_request_errorは「リクエストの形式または内容に問題がある」ことを示すため、送信前の組み立てを担う統合レイヤーを調べる根拠になります。 一方、200が返った後にバリデーションで弾かれる場合はAPI呼び出し自体は成功しているので、stop_reasonや生の応答本文を確認して、モデル出力の問題か自社パーサの問題かを切り分けます。応答ごとのrequest_idを記録しておけば、トレースとAPI側の記録の突き合わせも容易になります。\nD. より高性能なモデルへの切り替えは、推論の質が足りないと分かった後の改善策としては妥当です。しかしリクエスト自体が拒否される400は自社コードの問題なのでモデルを変えても解消せず、失敗が減ったかを眺めるだけでは原因がどの層にあるのかは分かりません。\n\n失敗が自社の統合レイヤーで起きているのか、モデルの出力で起きているのかを切り分ける手順がテーマです。手がかりになるのはAPIとの境界です。Claude APIは400 invalid_request_error、401 authentication_error、429 rate_limit_error、500 api_error、529 overloaded_errorのように原因の種類を表すステータスとエラー型を返し、すべての応答にrequest-idヘッダーが付きます。\n4xxならリクエストがAPIに受け付けられていないので自社の組み立てを、200の後で失敗しているならstop_reasonや生の出力を見てモデル側か自社パーサ側かを調べる、という順で絞り込めます。\n誤答のmax_tokens調整、モデル変更、一律の再試行は、いずれも特定の仮説に対する対処で、原因がどの層にあるかを示してくれません。\nデバッグの問題では、対処策を試すより先に「失敗がどこで起きているかを特定する手順」を選ぶのが基本です。", "domain": "4. Eval, Testing, and Debugging", "domain_confidence": "high", "source_number": "23", "source_heading": null, "source_section": null, "ref": "https://platform.claude.com/docs/en/api/errors", "language": "ja"}, {"id": "CCDV-F-Udemy-0024", "exam": "CCDV-F", "source_repo": "Udemy", "source_file": "Udemy_CCDV-F.html", "question": "ある監査法人が、子会社3社の監査報告書をまとめてClaudeに渡し、「3社に共通する内部統制上の指摘事項は何か」と尋ねる機能を作っています。報告書は1本あたり数万トークンあります。\n現在のプロンプトでは、質問文を先頭に置き、その後ろに3本の報告書を区切りなしで連結しています。しかし、回答の質が安定せず、どの会社の報告書に基づく記述なのかも分かりにくくなっています。\nプロンプトの構成の改善として最も適切なものはどれですか。", "choices": {"A": "エフォートを高い値に設定し、長い報告書を読み解く思考により多くのトークンを使わせる。", "B": "3本の報告書をそれぞれ事前に要約させ、その要約だけを質問文の後ろに並べて渡す。", "C": "報告書部分の末尾にcache_controlを付け、同じ報告書への2回目以降の質問を速く安くする。", "D": "報告書を先頭に置いて出典名付きのタグで1本ずつ囲み、質問文はその後ろの末尾に置く。"}, "answer": ["D"], "select_count": 1, "explanation": "A. エフォートは、思考と応答に使うトークン量の目安を調整するパラメータで、推論の難しいタスクの品質を上げたいときに引き上げます。深く考えさせても、質問が先頭にあって報告書の境目も分からない構成は変わらず、どの会社の記述かを区別する手がかりも増えません。構成の問題を推論量で補おうとすると、コストとレイテンシだけが増えます。\nB. 事前要約は、入力がコンテキストウィンドウに収まらない場合や、細部までは要らず全体像をつかみたい場合に使う手法です。しかし要約の段階で個々の指摘事項が落ちると、3社に共通する指摘という細部の突き合わせができなくなり、要約だけでは元の報告書のどこに基づくかも示せません。入力は十分に収まっているので、情報を削るより構成を整えるのが先です。\nC. プロンプトキャッシングは、同じ接頭辞を繰り返し送るときに2回目以降の入力の処理を安く速くする仕組みで、同じ報告書に何度も質問する運用ではコスト面で有効です。ただしキャッシュはモデルが読む内容を変えないため、回答の質や出典の分かりやすさは改善しません。本問で直すべきは料金ではなく、プロンプトの構成です。\nD. 正解。Anthropicのプロンプトのベストプラクティスは、2万トークンを超えるような長い入力では文書をプロンプトの上部に置き、質問や指示を末尾に置くよう勧めています。テストでは、特に複雑な複数文書の入力で応答品質が最大30%向上したとしています。 さらに各報告書を＜document＞タグで囲み、＜source＞に会社名などのメタデータを入れれば、Claudeはどの記述がどの会社のものかを取り違えずに扱えます。\n\n長い文書を含むプロンプトの組み立て方（ロングコンテキストのプロンプティング）が論点です。公式のガイドは、長い入力を扱う際の要点として次の3つを挙げています。\n文書をプロンプトの上部に置き、質問を末尾に回す\n複数の文書は＜document＞タグで1本ずつ囲み、＜document_content＞と＜source＞などのサブタグで本文と出典を分ける\n必要に応じて、関連箇所を先に引用させてから答えさせる\n本問の症状は、質問が先頭にあることと、報告書の境目と出典が示されていないことの2点から説明でき、正解はその両方を直します。\n誤答はいずれも実在する有効な手段ですが、情報を削る（事前要約）、料金を下げる（キャッシュ）、推論量を増やす（エフォート）という別の目的のもので、構成の欠点はそのまま残ります。\n長い入力で品質が揺れるときは、パラメータを触る前に「文書が上、質問が下、文書ごとに出典付きの境界」という配置になっているかを確かめるのが近道です。", "domain": "6. Prompt and Context Engineering", "domain_confidence": "high", "source_number": "24", "source_heading": null, "source_section": null, "ref": "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices", "language": "ja"}, {"id": "CCDV-F-Udemy-0025", "exam": "CCDV-F", "source_repo": "Udemy", "source_file": "Udemy_CCDV-F.html", "question": "ある工作機械メーカーが、設備点検の予約や履歴照会のツールを提供する社内MCPサーバーを運用しています。このサーバーに、点検日程を変更するreschedule_inspectionツールを新たに追加しました。\nこのサーバーを使う複数のAIアプリ（ホスト）では、アプリ側のコードを変えずに、新しいツールとその引数をモデルに提示したいと考えています。\nMCPでツールとその引数がクライアントに伝わる仕組みとして、正しいものはどれですか。", "choices": {"A": "サーバーがpromptsとして公開したテンプレートに引数の説明を含め、利用者に選ばせてモデルへ渡す。", "B": "クライアントがtools/listを送り、返されたinputSchemaなどをモデル向けのツール定義に使う。", "C": "クライアントが空の引数でtools/callを試し、返されたエラーの内容から必要な引数をモデルに学ばせる。", "D": "サーバーがresourcesとして公開したツール仕様書をクライアントが読み、引数の形式をモデルに推測させる。"}, "answer": ["B"], "select_count": 1, "explanation": "A. promptsは、サーバーが再利用できるプロンプトのテンプレートを公開し、利用者がスラッシュコマンドなどで明示的に選んで使うプリミティブです。利用者の操作を起点にする仕組みなので、モデルが状況に応じて自動でツールを見つけて呼び出す用途には合いません。テンプレートに引数の説明を書いても、ツールとして呼び出せるようにはなりません。\nB. 正解。toolsの機能を宣言したMCPサーバーは、クライアントからのtools/listに対して、各ツールのname、description、JSON Schemaで引数を定義したinputSchemaを返します。クライアントはこれをモデル向けのツール定義に変換して渡すだけでよいため、サーバーにツールを追加すれば、各アプリはコードを変えずに新しいツールをモデルに提示できます。\nC. tools/callでの入力検証エラーは、isError付きのツール実行エラーとしてモデルに返され、引数を直して再試行させる自己修正に役立ちます。しかしこれは呼び出した後の回復の仕組みで、ツールの存在や引数を知る手段ではありません。更新系のツールを試しに呼べば、意図しない変更が起きる危険もあります。\nD. resourcesは、ファイルやデータベースのスキーマ、文書などの参照用データをURIで公開するプリミティブで、どれをコンテキストに入れるかはアプリ側が決めます。ツールの仕様書を資料として読ませても、モデルが呼び出せるツールとしては登録されず、引数の形式も推測に頼ることになります。ツールの発見と引数の定義には、ツール専用の仕組みが用意されています。\n\nMCPサーバーが公開するツールを、クライアントがどう発見して使うかという、toolsの基本的なやり取りが論点です。toolsの機能を宣言したサーバーは、tools/listに対して現在使えるツールの一覧を返し、各ツールには名前、人が読める説明、引数を定義するinputSchema（JSON Schema）が含まれます。クライアントはこの一覧をモデルに提示し、モデルが選んだツールをtools/callで実行します。\n一覧が変わったときは、listChangedを宣言したサーバーが、購読しているクライアントにnotifications/tools/list_changedを送って再取得を促せます。2026-07-28版の仕様はステートレスで、ツールの一覧を接続ごとに変えることは禁止されていますが、要求に付いた認可に応じて変えることは認められています。\n誤答は、参照データ用のresources、利用者が選ぶprompts、呼び出し後のエラー処理という、MCPの別の役割を発見の仕組みと取り違えたものです。\nMCPの3つのプリミティブは、主導するのがモデルか、アプリか、利用者かで区別すると整理しやすくなります。", "domain": "8. Tools and MCPs", "domain_confidence": "high", "source_number": "25", "source_heading": null, "source_section": null, "ref": "https://modelcontextprotocol.io/specification/2026-07-28/server/tools", "language": "ja"}, {"id": "CCDV-F-Udemy-0026", "exam": "CCDV-F", "source_repo": "Udemy", "source_file": "Udemy_CCDV-F.html", "question": "ある通信会社が、コールセンターのオペレーターに通話中の回答候補を提示する、Claudeを活用したアシスタントを企画しています。ビジネス要件は次の2つです。\n回答候補の表示が1秒以内に始まること\nピーク時に300件の通話で同時利用できること\nこの要件から導かれる技術・インフラ要件として最も適切なものはどれですか。", "choices": {"A": "ストリーミングで応答を逐次表示し、429エラーが返ったらretry-afterの秒数だけ待って同じ依頼を再試行する。", "B": "Message Batches APIで通話ごとの依頼をまとめて投入し、処理キューの上限に収まるよう件数を調整する。", "C": "コンテキストウィンドウが1Mトークンのモデルを選定し、通話の全文字起こしを毎回の入力に含める。", "D": "ストリーミングで応答を逐次表示し、ピーク時のリクエスト数とトークン量に見合うレート制限枠を確保する。"}, "answer": ["D"], "select_count": 1, "explanation": "A. 429を受けたらretry-afterに従って待ってから再試行するのは、一時的なレート超過から回復するための正しい実装作法で、ストリーミングによる表示開始の短縮も妥当です。しかしピーク時の300通話に必要な枠を確保していなければ、再試行の待ち時間そのものが1秒を超える遅延になるため、同時利用の要件を満たす手段にはなりません。\nB. Message Batches APIは、即時性が不要な大量のリクエストを非同期で安く処理するための仕組みで、夜間の一括分析などに向きます。バッチは完了までに最長24時間かかり得るため、通話中に1秒以内で回答候補を出すというリアルタイムの要件には使えません。\nC. 大きなコンテキストウィンドウは、長い契約書や通話記録全体を一度に読ませたい分析用途で有効です。一方で毎回の入力が大きくなるほど最初のトークンが返るまでの時間が延び、ITPMの消費も増えるため、表示開始の速さと同時利用数という本問の要件にはむしろ逆行します。\nD. 正解。stream: trueを指定するとMessages APIは応答をserver-sent eventsで少しずつ返すため、生成の完了を待たずに最初のトークンから画面に表示でき、「1秒以内に表示が始まる」という体感レイテンシの要件に応えられます。 同時300通話という要件はRPM・ITPM・OTPMの見積もりに直結し、組織の利用ティアの上限で足りなければ、引き上げを事前に申請しておく必要があります。\n\nMessages APIはstream: trueでserver-sent events（SSE）による逐次配信に切り替わり、応答全体の完成を待たずに最初のトークンから表示できます。これが「1秒以内に表示が始まる」という要件への答えです。「ピーク時300通話」は、リクエスト数と入出力トークン量を見積もり、組織のレート制限（RPM・ITPM・OTPM）に余裕を持たせるというキャパシティ計画に落とし込みます。\n正解を選ぶ条件は、2つの要件の両方に答えているかどうかです。429の再試行は超過が起きた後の回復策で、枠の確保の代わりにはなりません。Batches APIは非同期処理なのでリアルタイム要件に合わず、大きなコンテキストはむしろ遅延と消費を増やします。\n要件を「応答の速さ」と「量（同時数）」に分解し、それぞれに対応する仕組みがそろっている選択肢を探す、という読み方が有効です。", "domain": "2. Applications and Integration", "domain_confidence": "high", "source_number": "26", "source_heading": null, "source_section": null, "ref": "https://platform.claude.com/docs/en/build-with-claude/streaming", "language": "ja"}, {"id": "CCDV-F-Udemy-0027", "exam": "CCDV-F", "source_repo": "Udemy", "source_file": "Udemy_CCDV-F.html", "question": "ある非営利団体が、寄付者対応を支援するClaudeのワークフローを本番運用しています。\n新しいモデルバージョンがリリースされたときに、モデルのリリース間で生じる挙動の変化に備える方法として、最も適切なものはどれですか。", "choices": {"A": "本番のモデルIDを固定し、新モデルは回帰評価で劣化がないと確かめてから移行する。", "B": "新しいモデルは前の世代より優れているとみなし、既存プロンプトの再テストは省く。", "C": "移行前に新モデルでプロンプトを数件試し、応答の印象がよければ本番のモデルを切り替える。", "D": "新モデルの公開日に本番のモデルIDを差し替え、問題が報告されたら元に戻す。"}, "answer": ["A"], "select_count": 1, "explanation": "A. 正解。モデルIDを固定していれば、本番の挙動は検証済みのまま保たれ、新モデルへの切り替えは自分たちが決めたタイミングでだけ起こります。そのうえで代表的な入力と合格基準をまとめた回帰評価スイートを維持し、新モデルで実行して劣化がないことを確かめてから移行すれば、リリース間で生じる挙動の変化を本番の前に捉えられます。\nB. 新しいモデルの多くは全体的な性能が向上していますが、個々のプロンプトに対する挙動が同じとは限りません。公式の移行ガイドも、以前のモデル向けに調整した指示やエフォートの設定を持ち越さず、自分の評価で改めて確かめるよう勧めており、再テストを省くと出力形式の変化などの回帰を本番で初めて知ることになります。\nC. 数件の手動確認は、新モデルの傾向をつかむ最初の一歩としては有用です。ただし少数の例では、まれな入力での崩れや出力形式の変化を見落としやすく、印象で判断すると再現性のある比較になりません。代表的な入力と期待される結果をまとめた評価セットで、旧モデルと並べて測る必要があります。\nD. 問題が出たら元に戻せる状態で素早く切り替えるのは、影響の小さい社内ツールなら現実的な進め方です。しかし寄付者対応のような対外業務では、問題の報告を待つ時点で既に不適切な応答が相手に届いており、事前の評価で防げた回帰を利用者に見つけさせることになります。\n\n新しいモデルが出るたびに起こり得る挙動の変化に、稼働中のシステムでどう備えるかがテーマです。新しいモデルはAPIの互換性を保っていても、同じプロンプトに対する応答の長さ、形式、判断の傾向が変わることがあり、パラメータの扱いが変わって以前の設定がエラーになることもあります（例えばClaude Opus 5.5では、temperatureなどのサンプリング設定の変更や思考の無効化は受け付けられません）。\nそのため、本番はモデルIDを固定して挙動を安定させ、評価スイートで新モデルを事前に測ってから移行する、という手順を踏みます。\n誤答は、評価を省く（新モデルは優れているという前提）、本番で試す（リリース日に差し替え）、評価が不十分（数件の印象）のいずれかで、「移行前に再現性のある方法で比較しているか」という観点で見ると不足が分かります。\nモデル一覧には各モデルの廃止予定日も示されているので、移行は予定に組み込んで計画的に進めるのが実務の定石です。", "domain": "5. Model Selection and Optimization", "domain_confidence": "medium", "source_number": "27", "source_heading": null, "source_section": null, "ref": "https://platform.claude.com/docs/en/models/overview", "language": "ja"}, {"id": "CCDV-F-Udemy-0028", "exam": "CCDV-F", "source_repo": "Udemy", "source_file": "Udemy_CCDV-F.html", "question": "ある人材サービス企業が、外部の求人掲載サービスのREST APIと連携し、新しい求人をPOSTで登録するバッチを実装しています。ネットワークエラーやタイムアウトのときは、リクエストを再試行します。\nRESTのステータスコードと冪等性を踏まえた実装として最も適切なものはどれですか。", "choices": {"A": "タイムアウトしたPOSTはPUTと同じく冪等とみなして再送し、重複した求人は後から手作業で削除する。", "B": "5xxが返ったPOSTは登録済みとみなし、再送せずに次の求人の登録処理へ進む。", "C": "400が返ったリクエストも指数バックオフで再送し、成功するまで一定回数繰り返す。", "D": "冪等キーの付与か登録済み確認をしてからPOSTを再送し、429以外の4xxは再送しない。"}, "answer": ["D"], "select_count": 1, "explanation": "A. 失敗したリクエストをそのまま再送するのは、GET・PUT・DELETEのような冪等なメソッドなら安全な回復策です。しかしPOSTは冪等ではなく、タイムアウトしただけでサーバー側では登録が完了していることもあるため、単純な再送は求人の二重掲載を生みます。後から手作業で削除する運用では、重複が外部に公開されるまで気づけません。\nB. 5xxはサーバー側でエラーが起きたことを示すステータスで、処理が完了したことを意味しません。障害の件数を数える監視では5xxも「応答あり」として集計することがありますが、登録処理では5xxの後に求人が作成されたかどうかは応答から判断できず、登録済みとみなすと掲載漏れに気づけなくなります。\nC. 指数バックオフでの再試行は、429（レート制限）や503のような一時的なエラーから回復するための定石です。400 Bad Requestはリクエストの形式や内容の不備を示すクライアントエラーで、内容を直さない限り何度送っても同じ結果になるため、再試行は時間と相手サーバーの負荷を浪費するだけです。\nD. 正解。POSTは冪等ではないため、応答を受け取れなかった登録を再送する前に、冪等キー（同じキーの再送を1件として扱わせる仕組み）を付けるか、登録済みかを確認して重複を防ぎます。そのうえで一時的な障害を示す5xxや429は再試行の対象、それ以外の4xxはリクエスト側の不備として修正に回す、とステータスコードで扱いを分けるのが堅牢な実装です。\n\nHTTPメソッドの冪等性とステータスコードの意味は、Claude連携を含むあらゆる外部API連携で再試行を設計する際の土台になります。HTTPのメソッドのうちGET・HEAD・PUT・DELETEは冪等（同じリクエストを何度送っても結果が同じ）ですが、POSTとPATCHは冪等ではありません。そのため、タイムアウトなどで結果が分からないPOSTを再送するときは、冪等キーや登録済みの確認で二重登録を防ぐ必要があります。\nステータスコードは2xxが成功、4xxがクライアント側の問題、5xxがサーバー側の問題を表し、再試行に意味があるのは一時的な障害（5xxや429）です。\n選択肢を比べるときは「そのまま再送して安全なメソッドか」「そのエラーは待てば直る種類か」の2点を順に確かめると、正解以外の3つがどちらかで破綻していることが分かります。\nClaude APIでも、400 invalid_request_errorは再送では解決せず、429や529はバックオフで再試行する、という同じ区別が使われます。", "domain": "2. Applications and Integration", "domain_confidence": "high", "source_number": "28", "source_heading": null, "source_section": null, "ref": "https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Methods", "language": "ja"}, {"id": "CCDV-F-Udemy-0029", "exam": "CCDV-F", "source_repo": "Udemy", "source_file": "Udemy_CCDV-F.html", "question": "ある建設会社の開発チームが、Claude Codeのコーディング規約と権限設定を、チーム全体に配布したいと考えています。\nCLAUDE.mdとsettings.jsonの配置と階層の理解として最も適切なものはどれですか。", "choices": {"A": "共通の権限はCLAUDE.mdに文章で記載し、settings.jsonの内容は各メンバーに任せる。", "B": "共通の設定は各メンバーの~/.claude/settings.jsonに配布し、リポジトリには置かない。", "C": "共通の規約はCLAUDE.md、共通の権限は.claude/settings.jsonに置きGitで共有する。", "D": "共通の規約と権限は.claude/settings.local.jsonに書いてコミットし、全員に同じ内容を配る。"}, "answer": ["C"], "select_count": 1, "explanation": "A. CLAUDE.mdはセッション開始時に読み込まれ、コーディング規約やビルド手順をモデルに伝えるのに向いています。しかし内容はモデルが参照する文脈であって強制される設定ではないため、許可や拒否のような権限を文章で書いても、実際の権限チェックには反映されません。\nB. ユーザー設定（~/.claude/settings.json）は、個人の好みや全プロジェクト共通で使いたい設定を置く場所です。チームの共通設定を手作業で各自に配ると、更新のたびに配り直しが必要になり、誰の環境がどの版かも追えないため、リポジトリと一緒に変更・レビューできる配置の利点を失います。\nC. 正解。プロジェクト直下のCLAUDE.md（または.claude/CLAUDE.md）はソース管理を通じてチームで共有する指示、.claude/settings.jsonはコミットして全員に同じ権限・フック・プラグインを配る設定として位置づけられています。 個人の好みは~/.claude配下のユーザー設定、そのプロジェクトだけの個人的な上書きはsettings.local.jsonに置けば、共有と個人の設定がきれいに分かれます。\nD. settings.local.jsonは、そのプロジェクトでの個人的な上書きや、共有前の試験に使うファイルで、Claude Codeが作成する場合はGitから除外されます。これを共有に使うと、各自が個人設定を書く場所がなくなって衝突が起き、チームの正本としての役割も果たせません。\n\nチームに配りたい規約と権限を、CLAUDE.mdとsettings.jsonのどこに置くかという配置と階層の理解が問われています。CLAUDE.mdは「モデルに知っておいてほしい指示」、settings.jsonは「Claude Codeに適用させる設定（権限・フック・プラグインなど）」という違いがあり、どちらもユーザー・プロジェクト・ローカルといった範囲ごとに置き場所があります。\nチームで共有するものはプロジェクトのCLAUDE.mdと.claude/settings.jsonに置いてGitで配り、個人用は~/.claude配下やsettings.local.json、CLAUDE.local.mdに置きます。同じ設定が複数の場所にある場合は、マネージド設定、コマンドライン、ローカル、共有プロジェクト、ユーザーの順に優先されます（許可ルールのようなリストは結合されます）。\n誤答は、配布先を個人の領域にする、個人用のファイルを共有に使う、強制力のないCLAUDE.mdで権限を管理する、という3つのずれ方をしています。\n「誰に効かせたいか」と「強制したいのか、伝えたいのか」の2軸で置き場所を決めると整理しやすくなります。", "domain": "3. Claude Code", "domain_confidence": "medium", "source_number": "29", "source_heading": null, "source_section": null, "ref": "https://code.claude.com/docs/en/settings", "language": "ja"}, {"id": "CCDV-F-Udemy-0030", "exam": "CCDV-F", "source_repo": "Udemy", "source_file": "Udemy_CCDV-F.html", "question": "あるニュースメディア企業が、長い記事の要約と、読者との複数ターンの対話を行うClaudeアプリを運用しています。\n運用チームが理解しておくべき、トークン使用量とコンテキストウィンドウの基礎について、正しい記述はどれですか。", "choices": {"A": "コンテキストウィンドウは応答の長さの上限で、入力の大きさはウィンドウとは別に管理される。", "B": "ウィンドウには入力と出力の両方が数えられ、履歴を毎回送るため入力は会話とともに増える。", "C": "出力トークンはウィンドウに数えられず、上限の対象になるのは送信した入力トークンに限られる。", "D": "最新のユーザーメッセージだけが入力として課金され、過去のやり取りはサーバー側に保持される。"}, "answer": ["B"], "select_count": 1, "explanation": "A. 応答の長さの上限を指定するのはmax_tokensパラメータで、コンテキストウィンドウとは別物です。コンテキストウィンドウは応答を生成するときにモデルが参照できるテキスト全体の上限で、システムプロンプト、全メッセージ、ツール定義といった入力と、そのターンの出力の両方がここに数えられます。\nB. 正解。公式ドキュメントでは、システムプロンプト、messages内のすべてのメッセージ（ツール結果や画像を含む）、ツール定義、そしてそのターンに生成する出力（思考を含む）がコンテキストウィンドウに数えられると説明されています。 APIは過去のやり取りを保持しないため、複数ターンの対話では毎回履歴を送り直し、入力トークンは会話が伸びるほど増えていきます。実際の消費量はレスポンスのusageで確認できます。\nC. 生成される出力も同じウィンドウを消費し、入力と出力の合計が上限の対象です。なおClaude 4.5以降のモデルでは、入力とmax_tokensの合計がウィンドウを超えるリクエストも受け付けられ、生成がウィンドウの上限に達した時点でstop_reasonがmodel_context_window_exceededになって止まります。\nD. 会話の状態をサーバー側で保持する仕組みは、claude.aiのようなチャット製品やマネージド型のエージェントには存在します。しかしMessages APIはステートレスで、過去のターン（1往復のやり取り）は毎回のリクエストのmessagesに含めて送り直す必要があり、その分も入力トークンとして数えられ課金されます。\n\nコンテキストウィンドウは、モデルが応答を生成するときに参照できるテキスト全体（生成する応答自身を含む）の上限で、現行の多くのモデルでは100万トークンです。Messages APIはステートレスなので、2ターン目以降はシステムプロンプトと過去のメッセージを毎回送り直し、それらはすべて入力トークンとして数えられます。\n長い記事を要約した後に対話を続けるアプリでは、記事本文と過去の応答が毎ターン入力に乗るため、プロンプトキャッシングで課金を抑えたり、履歴を要約して縮めたりする設計が必要になります。\n誤答は、履歴がサーバーに残るという前提、max_tokensとウィンドウの混同、出力はウィンドウを消費しないという誤解のいずれかです。\nusageのinput_tokensとoutput_tokensを実際に確認しながら会話を進めてみると、この仕組みは体感的に理解できます。", "domain": "5. Model Selection and Optimization", "domain_confidence": "high", "source_number": "30", "source_heading": null, "source_section": null, "ref": "https://platform.claude.com/docs/en/build-with-claude/context-windows", "language": "ja"}, {"id": "CCDV-F-Udemy-0031", "exam": "CCDV-F", "source_repo": "Udemy", "source_file": "Udemy_CCDV-F.html", "question": "あるHR系SaaS企業が、チーム全体でClaude Codeのプラグイン（拡張機能）を導入します。\n管理上の考慮点として適切なものはどれですか。（2つ選択してください。）", "choices": {"A": "各メンバーが好きなプラグインをユーザースコープで入れ、チームの共有設定は用意しない。", "B": "有効化するプラグインをコミット済みの.claude/settings.jsonで全員に共有する。", "C": "プラグインのバージョンを固定し、更新は変更内容を確認したうえで意図的に適用する。", "D": "マーケットプレイスの自動更新を有効にし、最新版のプラグインが全員に自動で届くようにする。", "E": "導入前の審査は説明文と利用者数の確認にとどめ、追加されるフックやMCPサーバーの中身は見ない。"}, "answer": ["B", "C"], "select_count": 2, "explanation": "A. ユーザースコープでの導入は、個人の好みの道具を全プロジェクトで使いたい場合には便利です。しかしチーム全体で使う前提のプラグインを各自の判断に任せると、メンバーごとに構成がばらつき、同じ操作でも結果が異なる、誰が何を入れたか把握できない、といった問題が起きます。\nB. 正解。プロジェクトスコープでインストールすると、プラグインの有効化はコミットされる.claude/settings.jsonに記録され、そのリポジトリで作業する全員に適用されます。構成をリポジトリで管理すればプルリクエストでレビューでき、共有設定の一部は各メンバーがフォルダを信頼（ワークスペースの信頼確認）した後に有効になるため、意図しない導入も防げます。\nC. 正解。マーケットプレイスは#v1.2.0のようにタグやブランチを指定して追加でき、自動更新の有効・無効もマーケットプレイスごとに切り替えられます。バージョンを固定して更新を意図的に適用すれば、メンバー間で同じ版が動き、挙動の違いが出たときも原因をたどれます。\nD. 自動更新は、公式マーケットプレイスでは既定で有効になっている仕組みで、個人がセキュリティ修正や新機能を早く受け取りたい場合には適しています。しかしチームで運用する場合は、更新が内容の確認なしに各メンバーへ届き、新しいフックや権限が審査を経ずに加わるため、挙動の再現性と審査済みの状態を保てません。\nE. 説明文や利用実績の確認は、プラグインを選ぶ最初の手がかりとしては有用です。しかしプラグインが動かすものは利用者自身の権限で実行されるため、インストール画面に表示される「追加されるもの」（フック、MCPサーバー、スキルなど）を確認しなければ、どのコードが自分の環境で動くのかを把握できません。\n\nClaude Codeのプラグインは、スキル、サブエージェント、フック、MCPサーバーなどをまとめて導入する仕組みで、有効にしたプラグインは利用者自身の権限で動きます。\nチームで扱うときの要点は、構成の共有と変更の管理です。構成の共有は、プロジェクトスコープでインストールし、有効化の設定を.claude/settings.jsonに記録してコミットすることで、全員に同じ構成を配ります。変更の管理は、マーケットプレイスをタグやブランチで固定し、自動更新の設定を見直して、更新を内容の確認後に意図的に適用することで行います。\n誤答は、更新を確認なしに自動で取り込む、各自に任せる、表面的な情報だけで審査する、の3つで、どれも構成のばらつきや権限の見落としにつながります。\n拡張機能の管理は「誰に配るか」と「いつ変わるか」を自分たちで決められる状態を作ることだ、と捉えると判断しやすくなります。", "domain": "2. Applications and Integration", "domain_confidence": "medium", "source_number": "31", "source_heading": null, "source_section": null, "ref": "https://code.claude.com/docs/en/plugins/install", "language": "ja"}, {"id": "CCDV-F-Udemy-0032", "exam": "CCDV-F", "source_repo": "Udemy", "source_file": "Udemy_CCDV-F.html", "question": "ある大学の研究支援チームが、Claude Codeを導入し、構成要素の使い分けを整理しています。\n各構成要素の説明として最も適切なものはどれですか。", "choices": {"A": "CLAUDE.mdは必要時に読み込まれる手順書で、スキルは毎セッション読み込まれる規約である。", "B": "サブエージェントは親の会話履歴を引き継ぎ、親と同じコンテキストの中で作業を進める。", "C": "Agent Memoryは人が書く規約ファイルで、Claudeが学びを自動で書き込むことはない。", "D": "CLAUDE.mdは毎セッション読み込まれる規約で、スキルは必要時に読み込まれる手順である。"}, "answer": ["D"], "select_count": 1, "explanation": "A. CLAUDE.mdとスキルの読み込み方が逆になっています。毎回読み込まれるのがCLAUDE.md、必要時に本文が読み込まれるのがスキルで、公式ドキュメントも「常に知っておくべきことはCLAUDE.md、ときどき必要な参考資料や呼び出して使う手順はスキル」と使い分けを示しています。\nB. 親の会話をそのまま引き継いで分岐させるのは、fork型のサブエージェントの挙動です。通常のサブエージェントは親の会話履歴を持たない独立したコンテキストで動き、途中の読み込みやツール結果はその中に留まって、親には要約された結果だけが返ります。この分離によって、親のコンテキストを汚さずに大量のファイル調査などを任せられます。\nC. 人が書いて毎セッション読み込ませる恒久的な指示は、CLAUDE.mdの役割です。Claude Codeのauto memory（Agent Memory）は、ユーザーの訂正や好みをもとにClaude自身が書き込むメモで、セッション開始時に先頭部分（200行または25KBまで）が読み込まれます。書き手が人かClaudeかという点で、両者ははっきり分かれています。\nD. 正解。CLAUDE.mdはセッション開始時に全文がコンテキストに読み込まれ、ビルド手順やコーディング規約のような「毎回知っておくべきこと」を置く場所です。スキルは説明文だけが常に見えていて、呼び出されたときや関連するときに本文が読み込まれるため、長い手順書や参考資料を置いても、使うまではほとんどコンテキストを消費しません。\n\nClaude Codeの構成要素（ルール、スキル、コマンド、エージェント、エージェントメモリ）は、読み込まれるタイミングと書き手で見分けられます。整理の軸は「いつ読み込まれるか」と「誰が書くか」です。\nCLAUDE.md（および.claude/rules/）は人が書き、毎セッション読み込まれる規約です。\nスキルは人が書く手順や参考資料で、説明文だけが常に見え、使うときに本文が読み込まれます（カスタムのスラッシュコマンドは現在スキルに統合され、/名前 で呼び出せます）。\nサブエージェントは独立したコンテキストで作業して要約を返すワーカーです。\nauto memoryはClaudeが自分で書き込む学びのメモです。\n誤答は、書き手を取り違える（Agent Memory）、コンテキストの分離を見落とす（サブエージェント）、読み込みのタイミングを逆にする（CLAUDE.mdとスキル）という典型的な混同を並べたものです。\n構成要素の問題では、この2つの軸で表を作って覚えておくと取り違えを防げます。", "domain": "3. Claude Code", "domain_confidence": "high", "source_number": "32", "source_heading": null, "source_section": null, "ref": "https://code.claude.com/docs/en/features-overview", "language": "ja"}, {"id": "CCDV-F-Udemy-0033", "exam": "CCDV-F", "source_repo": "Udemy", "source_file": "Udemy_CCDV-F.html", "question": "ある電子機器メーカーが、次の2つのMCPサーバーを開発しています。\n開発者のマシン上でサブプロセスとして動き、ローカルのファイルやCLIにアクセスするサーバー\nネットワーク越しに多数のクライアントへ提供するサーバー\nMCPサーバーのトランスポートの選択として最も適切なものはどれですか。", "choices": {"A": "サブプロセスで動くローカル用はstdio、多数に提供するリモート用はStreamable HTTPにする。", "B": "ネットワーク提供用のサーバーも各利用者の端末にサブプロセスとして配布し、HTTPは使わない。", "C": "両方をStreamable HTTPで実装し、開発者の端末で動くサーバーもローカルのHTTPポートで公開する。", "D": "ローカル用とネットワーク提供用の両方をstdioで実装し、リモートの利用者にも同じ方式で提供する。"}, "answer": ["A"], "select_count": 1, "explanation": "A. 正解。MCPのトランスポートは2種類です。stdioは同じマシン上のプロセス間を標準入出力で直接つなぐ方式で、ネットワークのオーバーヘッドがなく、ローカルサーバーは通常1つのクライアントに提供されます。 Streamable HTTPは、クライアントからサーバーへのHTTP POSTと任意のServer-Sent Eventsで通信する方式です。リモートサーバーを多数のクライアントに提供するときに使い、Bearerトークンなどの標準的なHTTP認証に対応します。配置と提供範囲に応じて選び分けるのが適切です。\nB. 各利用者の端末にサーバーを配布してstdioで動かす形は、利用者のローカル環境にアクセスする必要があるツールや、パッケージとして配りたい場合には実際に使われます。しかし本問のもう一方は「ネットワーク越しに多数のクライアントへ提供する」サーバーで、端末ごとに配布すると更新や認証を中央で管理できず、要件そのものを満たしません。\nC. Streamable HTTPはリモートサーバーの標準的な方式で、ローカルで動かすことも技術的には可能です。しかし開発者の端末でサブプロセスとして動くサーバーにHTTPを使うと、ネットワーク経由のオーバーヘッドとポート公開に伴う認証・露出の考慮が増えるだけで、ネットワーク負荷のない直接通信というstdioの利点を捨てることになります。\nD. stdioは標準入出力を使って同じマシン上のプロセス同士が直接やり取りする方式で、ネットワーク越しに通信する手段を持ちません。ローカル用には最適ですが、多数のクライアントへネットワーク越しに提供するリモートサーバーには使えないため、要件の片方を満たせません。\n\nMCPでは、ホスト（Claude Codeなど）がサーバーごとにクライアントを作って接続し、その通信経路をトランスポート層が担います。\nstdioは同じマシン上のプロセス間通信で、ネットワークを介さずに最適な性能でやり取りでき、ローカルのファイルやCLIにアクセスする用途に向きます。ローカルサーバーは通常、1つのクライアントに提供されます。\nStreamable HTTPはHTTP POSTと任意のSSEを使うリモート向けの方式で、多数のクライアントへの提供と、Bearerトークン・APIキー・カスタムヘッダーなどの標準的なHTTP認証に対応します。トークンの取得にはOAuthが推奨されています。\n誤答は、片方の方式で両方をまかなおうとするか、提供形態を変えて要件をすり替えるもので、「どこで動き、誰に提供するか」という配置の条件に合っていません。\nトランスポートの問題は、ローカルかリモートか、単一か多数か、の2つの条件を読み取れば答えが決まります。", "domain": "8. Tools and MCPs", "domain_confidence": "high", "source_number": "33", "source_heading": null, "source_section": null, "ref": "https://modelcontextprotocol.io/docs/2026-07-28/learn/architecture", "language": "ja"}, {"id": "CCDV-F-Udemy-0034", "exam": "CCDV-F", "source_repo": "Udemy", "source_file": "Udemy_CCDV-F.html", "question": "ある法律事務所では、数万トークンある契約書について、多数の異なる質問をClaudeに繰り返し送信します。契約書のテキストは毎回同じで、質問の前に置きます。\nプロンプトキャッシングでコストを削減する設計として正しいものはどれですか。（2つ選択してください。）", "choices": {"A": "キャッシュ書き込みは使わずに、同じ契約書への質問を1回のリクエストにまとめて送る。", "B": "毎回変わる受付日時を含むユーザーメッセージの末尾にcache_controlのブレークポイントを置く。", "C": "キャッシュ済みの契約書をコンテキストウィンドウの枠外として扱い、参考資料をさらに追加する。", "D": "契約書を先頭に置いてその末尾にcache_controlを付け、毎回変わる質問はその後ろに置く。", "E": "キャッシュ対象の接頭辞が、モデルごとの最小キャッシュ可能トークン数以上になるようにする。"}, "answer": ["D", "E"], "select_count": 2, "explanation": "A. この案の前提にある、キャッシュ書き込みが基本入力より割高（5分TTLで1.25倍、1時間TTLで2倍）という点は事実で、一度しか使わない資料をキャッシュしても得にならないという判断自体は正しい考え方です。しかし本問は同じ契約書に多数の質問を繰り返し送る状況で、2回目以降は安価なキャッシュ読み出しになるため、書き込みの割増分はすぐに回収できます。\nB. 会話の末尾にブレークポイントを置く設計は、会話が伸びるたびにキャッシュする範囲を延ばしていく多ターンのチャットでは有効です。しかしキャッシュのヒットにはブレークポイントまでの内容が完全に一致する必要があるため、毎回変わる日時を含むブロックに置くと一度もヒットせず、書き込みの費用だけがかかり続けます。\nC. キャッシュされた接頭辞もコンテキストウィンドウを占有し続けます。キャッシュが変えるのは支払う料金で、ウィンドウに数えられるかどうかではありません。なお多くのモデルではキャッシュヒット分がレート制限（ITPM）に数えられませんが、それはウィンドウの容量とは別の話で、資料を足せばその分だけウィンドウを消費します。\nD. 正解。キャッシュの接頭辞はtools、system、messagesの順に組み立てられ、ブレークポイントまでの内容が以前のリクエストと一致したときに再利用されます。変わらない契約書を前方に置いてその末尾にcache_controlを付け、毎回変わる質問をブレークポイントの後ろに置けば、契約書部分は安価なキャッシュ読み出しで処理され、質問部分だけが通常の入力として課金されます。\nE. 正解。プロンプトキャッシングにはモデルごとに最小キャッシュ可能トークン数（現行モデルでは512〜4,096トークン）があり、これに満たない接頭辞はcache_controlを付けてもエラーにならず、キャッシュされないまま処理されます。 数万トークンの契約書は十分な長さですが、実際にキャッシュされたかは、レスポンスのusageにあるcache_creation_input_tokensとcache_read_input_tokensで確認します。\n\nプロンプトキャッシングのキャッシュは、ブレークポイント（cache_control）までの接頭辞が以前のリクエストと完全に一致したときに再利用され、読み出しは多くのモデルで基本入力の0.1倍（Claude Opus 5.5は0.05倍）、書き込みは5分TTLで1.25倍です。\nしたがって「変わらない部分を前に、変わる部分を後ろに」並べ、変わらない部分の末尾にブレークポイントを置くのが基本形になります。また最小キャッシュ可能トークン数を下回る接頭辞はエラーを出さずにキャッシュされないため、効果が出ない原因として見落としやすい点です。\n誤答は、書き込みの割増だけを見て再利用の効果を無視するもの、毎回変わる内容にブレークポイントを置くもの、キャッシュとコンテキストウィンドウを混同するものです。\nキャッシュが変えるのは料金とレイテンシで、ウィンドウの容量や送信する内容は変わらない、という一点を押さえておけば迷いません。", "domain": "5. Model Selection and Optimization", "domain_confidence": "high", "source_number": "34", "source_heading": null, "source_section": null, "ref": "https://platform.claude.com/docs/en/build-with-claude/prompt-caching", "language": "ja"}, {"id": "CCDV-F-Udemy-0035", "exam": "CCDV-F", "source_repo": "Udemy", "source_file": "Udemy_CCDV-F.html", "question": "あるコンサルティング会社が、複数のワークロードに使うClaudeのモデル（Opus・Sonnet・Haiku）を選定しています。\n品質・レイテンシ・コストのトレードオフに基づくモデル選定の考え方として、正しいものはどれですか。（2つ選択してください。）", "choices": {"A": "一度評価して選んだモデルは、後継のモデルが出ても再評価せずにそのまま使い続ける。", "B": "品質がコストより重要な複雑で自由度の高い分析には、単価が高くてもOpusを選ぶ。", "C": "複雑な分析にも最も安いHaikuを使い、推論の難しさはプロンプトの工夫で補う。", "D": "大量で単純な分類やルーティングで速度とコストを優先するなら、Haikuを選ぶ。", "E": "分類から分析までの全ワークロードで、使うモデルをOpusの1種類に統一しておく。"}, "answer": ["B", "D"], "select_count": 2, "explanation": "A. 一度選んだモデルを使い続けることは、検証済みの挙動を保つという意味で本番運用の安定には役立ちます。しかし後継モデルでは同じ価格のまま品質や速度が改善されることが多く、各モデルIDには廃止の予定日もあるため、評価セットを使って定期的に再評価し、移行を判断する必要があります。\nB. 正解。Opus系は本問の3系統の中で最も高い推論能力を持ち、長時間のエージェント作業や高度な知的作業に向くモデルです。単価とレイテンシは高くなりますが、回答の質が事業価値を左右する分析では、その品質差がコストを上回ります（さらに難しい推論向けには上位のClaude Fable 5.2も用意されています）。\nC. プロンプトの改善で小さなモデルの性能を引き出すことは、コスト最適化の正攻法の1つです。ただし多数の要素を突き合わせる複雑な分析では、モデル自体の推論能力の差がプロンプトの工夫では埋めきれないことが多く、品質が最も重要な要件なら上位モデルを選ぶ正当な理由になります。\nD. 正解。Claude Haiku 5.5は現行ラインアップで最も速く、入力100万トークンあたり0.10ドル・出力0.50ドルからと最も安価なモデルで、分類・抽出・ルーティングのような大量でレイテンシが重要な処理向けと位置づけられています。問い合わせの振り分けや定型分類のように1件あたりの推論が軽く件数が多い処理では、この速度と単価の差がそのまま全体のレイテンシとコストに効きます。\nE. 上位のモデルに統一すると、モデルごとの評価や切り替えの手間が減り、品質面の不安も小さくなるという利点はあります。しかしOpus 5.5の単価はHaiku 5.5の数十倍で、レイテンシも大きいため、軽い分類まで同じモデルで処理すると品質の上積みがほとんどないまま費用と待ち時間が増えます。\n\n現行のラインアップの位置づけは次のとおりです。\nHaiku 5.5は最速・最安で、分類や抽出、ルーティングのような大量の処理向け（入力$0.10／出力$0.50から）\nSonnet 5.5は速度と知能の最良の組み合わせ（$2／$10）\nOpus 5.5は長時間のエージェント作業や高度な知的作業向け（$4／$20）\n迷ったらOpus 5.5から始めるよう案内されています。\n選定の基本は、タスクの難しさと件数、許容できるレイテンシ、予算を並べ、要件を満たす最も効率のよいモデルを選ぶことです。件数が多く軽い処理は下位モデル、品質が最も重要な処理は上位モデル、という割り当てが典型になります。\n誤答は、全ワークロードを1つのモデルに寄せる、プロンプトで能力差を埋められるとみなす、一度の評価で固定し続ける、といった一律の判断です。\nモデル選定は評価セットで実測しながらタスク単位で決め、モデルのリリースごとに見直す継続的な作業だと捉えておくと、選択肢の良し悪しが見えやすくなります。\nなお、モデルのラインアップと価格は2026年11月時点のものです。試験ガイド（2026年7月版）より後に新しいモデルが出ているため、本試験では当時のラインアップ（例えばClaude Haiku 4.5）を前提に出題される可能性があります。", "domain": "5. Model Selection and Optimization", "domain_confidence": "high", "source_number": "35", "source_heading": null, "source_section": null, "ref": "https://platform.claude.com/docs/en/models/overview", "language": "ja"}, {"id": "CCDV-F-Udemy-0036", "exam": "CCDV-F", "source_repo": "Udemy", "source_file": "Udemy_CCDV-F.html", "question": "ある食品メーカーは、自社のClaudeアプリで、回答の前に必ず原材料アレルゲン照合ツールを呼び出させたいと考えています。また、ツールの呼び出しが失敗することもあります。\ntool_choiceの制御とツールエラーの扱いについて、最も適切な設計はどれですか。", "choices": {"A": "tool_choiceはautoのままにし、失敗したときは同じツールをアプリ側で成功するまで何度も再実行する。", "B": "対応モデルではtool_choiceで指名し、失敗時はis_error付きのtool_resultを返す。", "C": "ツールが失敗したら空のtool_resultを返し、Claudeにはエラーがあったことを伝えない。", "D": "ツールが失敗したら例外を送出して会話を終了し、tool_resultは返さずに処理を打ち切る。"}, "answer": ["B"], "select_count": 1, "explanation": "A. 一時的な失敗をアプリ側で再試行することは、ネットワークの瞬断などには有効な回復策です。しかしautoではツールを呼ぶかどうかをClaudeが毎ターン判断するため「回答前に必ず照合する」要件を保証できず、成功するまで無制限に再実行すると、障害が続いたときに応答が返らなくなります。\nB. 正解。tool_choiceはauto（既定。呼ぶかどうかをClaudeが判断）、any（いずれかのツールを必ず使う）、tool（指名したツールを必ず使う）、none（ツールを使わない）から選べます。対応するモデルでは、toolで照合ツールを指名すれば毎回呼ばせられます。 ツールが失敗したときは、エラー内容をcontentに入れ、is_error: trueを付けたtool_resultを返すと、Claudeは失敗を認識したうえで利用者への説明や再試行を判断できます。なおClaude Opus 5.5などanyとtoolを受け付けないモデルでは、autoのまま、いつ照合ツールを使うかをプロンプトで指示し、strict tool useと組み合わせる方法が案内されています。\nC. 結果が本当に空のとき（該当データなし）に空のtool_resultを返すのは正しい使い方です。しかし失敗を空の結果に見せかけると、Claudeは「アレルゲンは見つからなかった」と誤解して回答を続けるおそれがあり、食品のアレルゲン確認では安全上の重大な誤りにつながります。\nD. 回復の見込みがない致命的な障害（認証情報の失効など）では、処理を打ち切って運用者に通知する判断が妥当な場合もあります。しかしツールの一時的な失敗のたびに会話を終えると、Claudeが状況を説明したり別の手段を提案したりする機会がなくなり、利用者は理由の分からないまま回答を得られません。\n\ntool_choiceは次の4種類から選べます。\nautoは既定の値で、呼ぶかどうかをClaudeが判断する\nanyは、いずれかのツールの使用を必須にする\ntoolは、指名したツールの使用を必須にする\nnoneは、ツールを使わせない\nただし強制（anyとtool）は、2026年9月以降に公開された一部のモデル（Claude Opus 5.5やClaude Fable 5.1など）では400エラーになるため、その場合はautoとプロンプトでの指示、strict tool useを組み合わせます。この変更は試験ガイド（2026年7月版）より新しいため、本試験では強制できる前提で出題される可能性があります。\nツールの失敗は、is_error: trueを付けたtool_resultでエラー内容を返すのが正しい伝え方です。何が起きたか、次に何を試すべきかを具体的に書くと、Claudeが推測に頼らず回復しやすくなります。\n誤答は、会話を打ち切る、失敗を隠す、アプリ側で無制限に再試行する、のいずれかで、Claudeに状況を知らせて判断させるという設計から外れています。\nモデルの世代によって使えるパラメータが変わる点も含めて、公式の対応表を確認する習慣をつけておくと安心です。", "domain": "8. Tools and MCPs", "domain_confidence": "high", "source_number": "36", "source_heading": null, "source_section": null, "ref": "https://platform.claude.com/docs/en/agents-and-tools/tool-use/define-tools", "language": "ja"}, {"id": "CCDV-F-Udemy-0037", "exam": "CCDV-F", "source_repo": "Udemy", "source_file": "Udemy_CCDV-F.html", "question": "ある自治体が、住民からの問合せに回答する、Claudeを活用したシステムを本番リリースしました。\nITシステムのライフサイクル管理の観点から、リリース後の運用・保守フェーズの活動として最も適切なものはどれですか。", "choices": {"A": "応答品質と利用状況を監視し、モデル更新や制度改正の影響を評価して計画的に改修していく。", "B": "障害監視とサーバー再起動の手順を整備し、保守の作業を稼働率の維持に集中させる。", "C": "住民が押した評価ボタンの結果をモデルの再学習に回し、回答品質を自動で改善させる。", "D": "開発時のテストで品質を確定させ、次回のシステム更改までは回答内容の変更を凍結する。"}, "answer": ["A"], "select_count": 1, "explanation": "A. 正解。運用・保守フェーズの中心は、稼働中のシステムが要件を満たし続けているかを監視し、環境の変化に合わせて計画的に直すことです。LLMを組み込んだシステムでは、モデルの世代交代や廃止予定、回答の根拠となる制度の改正が品質に直結するため、評価用の質問セットで影響を確かめてから改修を反映する運用が求められます。\nB. 障害監視と復旧手順の整備は、可用性を守る運用・保守の基本で欠かせない活動です。ただしサーバーが正常に動いていても、制度改正で古くなった回答やモデル更新による応答の変化は検知できないため、住民に誤った案内を出し続けるリスクが残ります。\nC. 利用者の評価を集める仕組み自体は、品質の傾向を把握するのに役立ちます。しかしClaude APIのモデルは運用中の会話から自動的に学習して更新されるものではなく、API経由のファインチューニングも現在は提供されていないため、評価結果はプロンプトや参照データの改修、評価用の質問セットの拡充に運用側が活かす必要があります。\nD. 変更凍結は、繁忙期や大規模な移行の直前など、リスクの高い期間に一時的に変更を止める運用として実際に使われます。しかしLLMを組み込んだシステムでは、利用中のモデルの廃止予定や制度改正による回答根拠の変化が稼働中にも起こるため、次期更改まで凍結すると誤った案内を直す手段がなくなります。\n\nリリースした後に何を続けるべきか、つまり運用・保守フェーズの中身がテーマです。システムはリリースで完成ではなく、利用状況と品質を監視し、外部環境の変化に合わせて改修を続けることで価値を保ちます。LLMを組み込んだシステムでは、利用中のモデルIDにも廃止（retirement）の予定日があること、制度改正で回答の根拠が変わること、住民の質問の傾向が変わることが品質に影響します。\n可用性の監視や一時的な変更凍結は運用の一部として実在する考え方ですが、「回答の中身が今も正しいか」を見続ける活動が抜けています。また、APIのモデルが運用中の会話から自動で賢くなるという前提は成り立たず、改善は運用側の評価と改修で行います。\n問題文が「住民からの問合せに回答する」システムである点に注目すると、稼働率よりも回答品質の維持が問われていると読み取れます。", "domain": "2. Applications and Integration", "domain_confidence": "high", "source_number": "37", "source_heading": null, "source_section": null, "ref": "https://platform.claude.com/docs/en/models/overview", "language": "ja"}, {"id": "CCDV-F-Udemy-0038", "exam": "CCDV-F", "source_repo": "Udemy", "source_file": "Udemy_CCDV-F.html", "question": "ある音楽ストリーミング企業の開発チームが、Claudeとの統合で、公式Python SDKを使うか、生のHTTPリクエストで直接呼ぶかを検討しています。\nSDKとREST APIの関係について正しい記述はどれですか。", "choices": {"A": "SDKは生のHTTPとは別の高速なエンドポイントに接続し、同じ呼び出しでも応答が速い。", "B": "SDKを使うと、生のHTTPでは呼び出せないSDK専用のモデル機能を利用できる。", "C": "SDKはserver-sent eventsを扱えず、ストリーミングを使う場合は生のHTTPで実装する。", "D": "SDKは生のHTTPと同じAPIを呼ぶクライアントで、型定義や再試行などの利便を加えるが機能は同じである。"}, "answer": ["D"], "select_count": 1, "explanation": "A. SDKも生のHTTPも、同じAPIエンドポイントへリクエストを送ります。応答速度を左右するのはモデルの選択、入出力の長さ、思考の量などで、SDKを使うことで別経路の高速なサーバーにつながるわけではありません。\nB. SDK固有のヘルパー（ストリームを集約して最終メッセージを返す関数や、ツール実行のループを代行するtool runnerなど）は存在しますが、これらはAPIの呼び出し方を楽にするための機能です。モデル側の機能はMessages APIのパラメータとして公開されており、生のHTTPでも同じ機能を使えます。\nC. 公式SDKはストリーミングを組み込みでサポートしており、Pythonのmessages.stream()のように、テキストの差分を順に受け取るヘルパーや、ストリームを最後まで受けて完全なメッセージを返すヘルパーを備えています。max_tokensの大きい非ストリーミングのリクエストでは、SDKがタイムアウトを避けるためにストリーミングの利用を求めることもあります。\nD. 正解。Anthropicの公式クライアントSDK（Python、TypeScript、C#、Go、Java、PHP、Ruby）は、いずれもMessages APIを呼び出す汎用クライアントで、型安全なインターフェース、ストリーミング、再試行、エラー処理を組み込みで提供します。到達するのは生のHTTPと同じAPIなので機能の差はなく、SDKを使うかどうかは実装の手間と保守性で判断します。\n\n公式SDKを使うか生のHTTPで呼ぶかの判断は、SDKがREST APIのラッパーであることを理解していれば迷いません。Claude APIの本体はHTTPのREST APIで、SDKはそれを各言語から扱いやすくする汎用クライアントです。\nSDKが加えるのは、次のような実装上の利便です。\n型付きのリクエスト・レスポンス\nストリーミングのヘルパー\n接続エラーやレート制限・5xxに対する自動再試行（既定で2回、retry-afterヘッダーに従う）\n型付きの例外\n到達できるAPIの機能は生のHTTPと同じです。\n誤答は、SDK専用の機能がある、別の高速経路につながる、SDKはSSEを扱えない、という「SDKとAPIが別物である」前提に立っています。\n逆に、使いたい言語にSDKがない環境や依存を増やしたくない場面では、生のHTTPを選んでも機能面の不利はない、という理解もあわせて持っておくと応用が利きます。", "domain": "5. Model Selection and Optimization", "domain_confidence": "medium", "source_number": "38", "source_heading": null, "source_section": null, "ref": "https://platform.claude.com/docs/en/cli-sdks-libraries/overview", "language": "ja"}, {"id": "CCDV-F-Udemy-0039", "exam": "CCDV-F", "source_repo": "Udemy", "source_file": "Udemy_CCDV-F.html", "question": "ある在宅介護事業者が、スタッフのケア記録作成を支援するClaudeアシスタントを構築しています。記録には、氏名・住所・健康状態などの個人情報（PII）が含まれます。\nPIIの漏えいを防ぐ設計として最も適切なものはどれですか。", "choices": {"A": "タスクに必要な項目だけを渡し、直接識別子はマスキングし、ツールの権限を狭く絞る。", "B": "直接識別子をマスキングし権限も絞るが、全利用者の記録はシステムプロンプトに常時載せておく。", "C": "監査に備えて、モデルに送ったプロンプトと応答を氏名入りのまま全文ログに保存する。", "D": "記録はTLSで送信し保存時も暗号化するため、プロンプトに渡す項目の最小化は行わない。"}, "answer": ["A"], "select_count": 1, "explanation": "A. 正解。公式ドキュメントは、注入が成功しても被害を最小にするために最小権限の原則を適用し、Claudeに不要な秘密情報へのアクセスを与えず、権限をできるだけ狭く絞るよう勧めています。個人情報も同じ考え方で扱い、記録作成に必要な項目だけを渡し、氏名などの直接識別子は送信前に仮のIDへ置き換え、ツールが参照できる範囲を担当する利用者に限定すれば、万一の漏えい時にも露出する情報を最小にできます。\nB. 直接識別子のマスキングと権限の限定は、正解と同じく有効な対策です。しかし全利用者の記録をシステムプロンプトに常時載せると、1件の注入や誤出力で担当外の利用者の情報まで引き出され得る状態が残り、「必要な項目だけを渡す」というデータ最小化の要件を欠いたままになります。\nC. 監査のために入出力を記録することは、問題が起きたときの調査に役立つ正当な運用です。しかし氏名や健康状態を含むまま全文を保存すると、本来の保存先の外に個人情報の写しが増え、ログを閲覧できる人やシステムから漏えいする経路になるため、記録するならマスキングや項目の限定が必要です。\nD. TLSによる通信の暗号化と保存時の暗号化は、盗聴やストレージの流出から個人情報を守る基本の対策で、欠かせません。しかしそれは経路と保管の保護であり、モデルが受け取った情報を出力に含めたり、注入によって引き出されたりするリスクは減らないため、渡す項目そのものを絞る対策の代わりにはなりません。\n\n個人情報（PII）を扱うアプリケーションで漏えいを防ぐ基本はデータ最小化と最小権限で、「モデルに何を見せるか」と「モデルが何にアクセスできるか」の両方を必要最小限に絞ります。具体的には次のようにします。\nタスクに必要な項目だけを渡す\n直接識別子は送信前にマスキングやトークン化で置き換える\nツールや権限の範囲を担当分に限定する\nログやURLに個人情報を残さない\n公式のガードレールのドキュメントも、注入が成功した場合の被害を小さくするために、不要な秘密情報へのアクセスを与えず権限を狭く絞ることを勧めています。\n誤答は、通信と保存の暗号化で足りるとする、氏名入りの全文ログを残す、2つの対策を講じながら全件を常時読み込ませる、のいずれかで、どれかの経路で露出する範囲が広がったままです。\nPIIの問題では「漏れたときにどこまで広がるか」を想像し、その範囲を最も小さくする選択肢を選ぶと判断を誤りません。", "domain": "7. Security and Safety", "domain_confidence": "high", "source_number": "39", "source_heading": null, "source_section": null, "ref": "https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/mitigate-jailbreaks", "language": "ja"}, {"id": "CCDV-F-Udemy-0040", "exam": "CCDV-F", "source_repo": "Udemy", "source_file": "Udemy_CCDV-F.html", "question": "あるレストランチェーンが、モバイルアプリの注文チャットにClaudeを組み込みます。応答が長くなるときでも顧客を待たせないように、Messages APIのストリーミングの採用を検討しています。\nストリーミングの仕組みと利点の説明として正しいものはどれですか。", "choices": {"A": "stream: trueでSSEの逐次配信を受け取り、届いた分から画面に表示していく。", "B": "出力トークンの単価が標準の50%に下がり、長い応答ほど注文チャットの費用を抑えられる。", "C": "生成完了後に本文を1つのイベントにまとめて送り、クライアント側で表示を一括で更新する。", "D": "WebSocketで双方向接続を張り、生成の途中でも同じ接続で追加の注文を受け付ける。"}, "answer": ["A"], "select_count": 1, "explanation": "A. 正解。リクエストでstream: trueを指定すると、Messages APIは応答をserver-sent events（SSE）のイベント列として返し、テキストはcontent_block_delta内のtext_deltaとして少しずつ届きます。クライアントは受信のたびに表示へ追記できるので、長い応答でも最初の文字がすぐに表示され、顧客の体感待ち時間が短くなります。\nB. 標準料金から50%割り引かれるのはMessage Batches APIの特徴で、即時性を手放す代わりに得られる割引です。ストリーミングは応答の届け方を変えるだけでトークン単価は変わらないため、注文チャットのコストを下げる根拠にはなりません。\nC. 生成の完了を待って応答全体を一度に受け取るのは、streamを指定しない通常のMessages API呼び出しの挙動で、短い応答をまとめて扱う処理では実装が簡単な方式です。ストリーミングではmessage_startの後、content_block_deltaイベントが生成に合わせて次々に届くため、本問の「顧客を待たせない」要件に応えるのはこの逐次配信のほうです。\nD. 双方向・常時接続のWebSocketは、共同編集やゲームのように双方が任意のタイミングで送り合う通信に向く技術です。Messages APIのストリーミングはHTTP上のSSEによるサーバーからクライアントへの一方向の配信で、途中で追加の入力を送るには新しいリクエストを発行します。\n\nMessages APIでstream: trueを指定すると、応答はmessage_start、content_block_start、content_block_delta、content_block_stop、message_delta、message_stopという流れのSSEイベントとして届き、途中にpingイベントが混じることもあります。\nクライアントはtext_deltaを受け取るたびに表示を更新できるため、生成全体が終わる前に表示を始められます。SDKでは、max_tokensの大きいリクエストでHTTPタイムアウトを避けるためにストリーミングの利用が求められる、という実務上の理由もあります。\n誤答はいずれも別の仕組みの性質を持ち込んだもので、完了後の一括受信は非ストリーミング、50%割引はBatches API、双方向通信はWebSocketの特徴です。\nストリーミングが短縮するのは生成時間そのものではなく「最初の文字が表示されるまでの待ち時間」だと押さえておくと、似た選択肢に惑わされません。", "domain": "2. Applications and Integration", "domain_confidence": "high", "source_number": "40", "source_heading": null, "source_section": null, "ref": "https://platform.claude.com/docs/en/build-with-claude/streaming", "language": "ja"}, {"id": "CCDV-F-Udemy-0041", "exam": "CCDV-F", "source_repo": "Udemy", "source_file": "Udemy_CCDV-F.html", "question": "ある小売企業が、従業員向けの人事アシスタントを構築しています。Claudeは、社内MCPサーバーのget_employee_recordツールで人事DBを照会します。現在の構成は次のとおりです。\nget_employee_recordツールは、全従業員の記録を読めるサービスアカウントで動いている\n「本人の記録と、マネージャーなら部下の記録だけを扱う」という規則は、システムプロンプトに書いてあるだけ\nテストでは、言い回しを工夫した質問で、他部署の従業員の評価を引き出せました。\n最も適切な是正策はどれですか。", "choices": {"A": "システムプロンプトの規則を具体的な禁止例とともに書き直し、拒否すべき質問をフューショットプロンプティングで示す。", "B": "ログイン中の従業員のトークンをツールの実行に付け、照会できる範囲をサーバーがその権限で判定する。", "C": "送信前の応答を別のモデルで検査し、依頼者以外の氏名が含まれていれば回答を差し止めて作り直す。", "D": "依頼者の従業員番号をClaudeにツールの引数として渡させ、サーバーはその番号の範囲だけを返す。"}, "answer": ["B"], "select_count": 1, "explanation": "A. 具体的な禁止例やフューショットプロンプティングで方針を明確にするのは、応答の方針をClaudeに正しく伝える基本的な手段で、誤った開示を減らす効果はあります。しかしツール自体は全従業員の記録を読める権限のままなので、言い回しの工夫でプロンプトの規則をすり抜けられれば、同じ漏えいが再び起こります。アクセスの制限をモデルへの指示にとどめていることが、本問の根本原因です。\nB. 正解。認可の判断を、モデルの出力ではなく検証済みの利用者の身元に基づいてサーバー側で行う設計です。トークンはClaudeが生成する引数ではなく、アプリがMCPサーバーへの要求に付ける認証情報で、サーバーはそこから利用者を特定して「本人か、その部下か」を毎回判定します。 Claudeがどんな質問に誘導されても権限のない記録はそもそも返らず、モデルに渡る情報が利用者本人の権限の範囲に限られるため、プロンプトの突破が情報漏えいに直結しなくなります。\nC. 出力を別のモデルで検査する方法は、ガードレールを層として重ねる手段の1つで、不適切な内容の送出を減らす補助策として有効です。ただし氏名の有無だけでは、正当に閲覧できる部下の記録と権限外の記録を区別できず、権限外のデータはすでにモデルに読み込まれています。検知は認可の代わりにならず、アクセスの段階で止める仕組みが要ります。\nD. ツールの引数に対象者の識別子を入れて照会範囲を指定する設計は、どの記録を扱うかを明示したい場面で一般的に使われます。しかし引数の値を決めるのはClaudeで、会話の誘導で他人の番号を入れられれば、サーバーはそれを信じて返してしまいます。MCPのセキュリティのガイドも、利用者の識別はクライアントから渡された値ではなく、検証済みのトークンから導くよう求めています。\n\nツールを通じて社内データにアクセスするアプリで、ツールを「誰の権限で実行するか」という認可の伝播が問われています。全データを読めるサービスアカウントでツールを動かし、制限をシステムプロンプトに書くだけの構成では、Claudeは強い権限を持つ代理人として働き、会話で誘導されればその権限を依頼者以外の情報のためにも使ってしまいます。\nMCPのセキュリティのベストプラクティスは、認可を実装するサーバーがすべての要求を検証すること、利用者のIDをクライアントが渡す値ではなく検証済みのトークンから導くことを求めています。MCPのツール仕様も、要求に付いた認可に応じて使えるツールを変えることを認めています。正解は、ログイン中の利用者のトークンをアプリがツールの実行に付け、データ側で本人と部下の範囲だけを返させる設計です。\nプロンプトの強化と出力の検査は多層防御として重ねる価値がありますが、単独では確率的な対策にとどまります。引数での絞り込みは、モデルが決めた値を信じる点で元の欠陥と変わりません。\nエージェントに強い共通権限を持たせず、利用者本人の権限を最後まで引き継がせることが、データ漏えい防止の土台になります。", "domain": "7. Security and Safety", "domain_confidence": "high", "source_number": "41", "source_heading": null, "source_section": null, "ref": "https://modelcontextprotocol.io/docs/2026-07-28/tutorials/security/security_best_practices", "language": "ja"}, {"id": "CCDV-F-Udemy-0042", "exam": "CCDV-F", "source_repo": "Udemy", "source_file": "Udemy_CCDV-F.html", "question": "ある物流倉庫事業者が、入庫伝票の自由記述メモから、SKU・数量・破損の有無を一定の書式で抽出するClaudeの機能を構築しています。抽出結果のフォーマットが実行ごとにばらつくので、これを解消したいと考えています。\nフューショットプロンプティングと出力の制約の設計として、最も効果的なアプローチはどれですか。", "choices": {"A": "実例に近い代表例を3〜5件exampleタグで示し、出力形式は肯定形で指定する。", "B": "例示は使わずに、出力形式を詳しく説明した段落を指示の冒頭に加えて形式を伝える。", "C": "「箇条書きにしない」「説明を添えない」といった禁止事項を並べて形式を伝える。", "D": "手元にある伝票メモを選別せずに数十件そのまま並べ、できるだけ多くの例として示す。"}, "answer": ["A"], "select_count": 1, "explanation": "A. 正解。公式のベストプラクティスは、例示を出力の形式・トーン・構造を安定させる最も確実な方法の1つとし、実際の用途に近く（関連性）、境界的なケースも含む（多様性）例を3〜5件、exampleタグで囲んで指示と区別するよう勧めています。加えて「〜しないで」ではなく「〜の形式で出力する」と肯定形で指定すると望ましい形が明確に伝わり、SKU・数量・破損有無の書式がそろいやすくなります。\nB. 出力形式を文章で丁寧に説明することは、例示と組み合わせれば効果を高める有用な手段です。ただし説明だけでは項目の並び順や表記の揺れ（数量の単位、破損有無の書き方など）を細部まで伝えにくく、実行ごとのばらつきを抑える力は具体例を示す方法に及びません。\nC. 禁止事項の列挙は、特定の癖を1つだけ止めたいときには効くことがあります。しかし公式ドキュメントは、形式の指定について「何をしないか」ではなく「何をするか」を伝えるよう勧めており、禁止の羅列では望ましい出力の形が示されないため、書式の一貫性は上がりにくくなります。\nD. 例を増やすこと自体は、多様なパターンを示せれば精度の向上につながります。しかし手元のメモを選別せずに数十件並べると、偏った例や誤った例から意図しないパターンを拾わせるおそれがあり、コンテキストも圧迫します。重要なのは件数より、関連性と多様性を意識して選んだ例であることです。\n\n出力形式のばらつきを抑える最も確実な手段は、望ましい入出力の具体例を見せること（フューショットプロンプティング）です。公式の推奨は、実際の用途に近く多様な例を3〜5件、exampleタグで指示と区別して示すことです。\nさらに形式の指定は「〜しない」ではなく「〜の形で書く」と肯定形で伝え、必要ならXMLタグで出力の構造を示します。\n誤答は、例を選ばずに量を増やす、例示をやめて説明だけにする、禁止事項で伝える、のいずれかで、どれも「望ましい形を具体的に見せる」という核心が欠けています。\nスキーマへの厳密な準拠が必要になった場合は、構造化出力で出力をJSONスキーマに制約する方法も選択肢になります。形式が揺れるという症状を見たら、まず例示と肯定形の指定がそろっているかを確認するのが定石です。", "domain": "6. Prompt and Context Engineering", "domain_confidence": "high", "source_number": "42", "source_heading": null, "source_section": null, "ref": "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices", "language": "ja"}, {"id": "CCDV-F-Udemy-0043", "exam": "CCDV-F", "source_repo": "Udemy", "source_file": "Udemy_CCDV-F.html", "question": "ある不動産会社が、査定を支援するために、物件写真をClaudeで解析するアプリを開発しています。同じ物件写真を、複数ターンの会話や複数のリクエストで繰り返し参照します。そのため、リクエストのたびに画像を送り直して、リクエストのデータ量が膨らむことは避けたいと考えています。\nMessages APIへの画像の入力方式として最も適切なものはどれですか。", "choices": {"A": "Files APIに画像を一度アップロードし、返されたfile_idを各リクエストで参照する。", "B": "画像のURLをテキストとしてプロンプトに書き、Claudeにリンク先を開いて写真を読ませる。", "C": "画像をbase64でエンコードし、リクエストのたびにimageブロックへ埋め込んで送る。", "D": "画像のimageブロックにcache_controlを付け、プロンプトキャッシングでキャッシュして再利用する。"}, "answer": ["A"], "select_count": 1, "explanation": "A. 正解。Files APIに画像をアップロードすると返されるfile_idを、imageブロックのsourceにtype: fileとして指定すれば、同じ画像を何度でも参照できます。多ターンの会話やエージェントでは毎回会話履歴全体を送り直すため、base64だと画像のバイト列が毎ターン積み上がりますが、file_id参照なら画像が増えてもリクエストを小さく保てます。\nB. 画像をURLで渡したい場合は、imageブロックのsourceにtype: urlを指定する方法が用意されています。URLを単なるテキストとして書いても文字列として読まれるだけで、Claudeが自らリンク先を取得して画像として解析するわけではないため、査定に必要な写真の内容は伝わりません。\nC. base64での埋め込みは、1回きりの解析や外部にファイルを置けない環境で手軽に使える標準的な方法です。ただし会話履歴を送り直すたびに画像のバイト列も再送されるため、同じ写真を繰り返し参照する本問では、ターンが進むほどリクエストサイズとレイテンシが増えていきます。\nD. プロンプトキャッシングは、繰り返し送る同一の接頭辞について処理コストとレイテンシを下げる機能で、画像を含むプロンプトにも使えます。しかしキャッシュを使う場合でもリクエストには同じ内容を毎回含めて送る必要があり、キャッシュが減らすのは課金と処理時間であって、送信するデータの量ではありません。\n\n同じ画像を何度も参照するとき、リクエストの大きさを抑えられる渡し方はどれか、というのが焦点です。imageブロックのsourceには、リクエスト本文に埋め込むbase64、オンライン画像を指すurl、Files APIにアップロードした画像を指すfile_idの3種類があります。公式ドキュメントは、繰り返し使う画像にはFiles APIを使い、base64データを再送する代わりにfile_idを参照するよう勧めています。多ターン会話では会話履歴全体を毎回送るので、base64の画像は履歴に残る限り毎ターン送り直されるからです。\n本問の条件は「同じ写真を複数ターン・複数リクエストで参照する」「リクエストのデータ量が膨らむことは避けたい」の2点で、送る量そのものを減らせるのはfile_id参照です。\nプロンプトキャッシングは料金、base64は手軽さ、テキストのURLはそもそも画像として渡らない、と役割を整理すると選択肢を切り分けやすくなります。\nなおAmazon BedrockとGoogle Cloud（Google managed）経由では、現在base64だけが使える点も、実装時の注意点です。", "domain": "2. Applications and Integration", "domain_confidence": "high", "source_number": "43", "source_heading": null, "source_section": null, "ref": "ht
