ntent for each inquiry.", "C": "Write all instructions together at the beginning of every user message, and operate without using the system prompt.", "D": "Put all instructions and data, including each passenger's inquiry, into the system prompt."}}, {"id": "CCDV-F-Udemy-0013", "question": "A security operations center (SOC) is building a Claude app. In this app, the SOC wants to run both custom queries against an internal SIEM running within its own infrastructure and general web searches.\nRegarding where client tools and server tools are executed and when to use each, which statement is correct?", "choices": {"A": "Client tools are also executed on Anthropic's infrastructure and cannot connect to the internal SIEM.", "B": "Server tools are executed within your own app; you write the execution code and return a tool_result.", "C": "Connect to the internal custom system with a server tool, and implement web search yourself as a client tool.", "D": "Custom-built tools such as the SIEM query are executed within the app, and web search is executed on Anthropic's side."}}, {"id": "CCDV-F-Udemy-0014", "question": "A SaaS company that provides a CRM is building a long-running agent. This agent needs the following capabilities.\nDurable execution that can resume after failures\nHuman approval (human-in-the-loop)\nState persistence\nWhich is the most appropriate judgment about adopting an agent orchestration framework such as LangGraph?", "choices": {"A": "Adopt it so that you do not have to build your own mechanisms for resuming after failures and saving state, and define the control flow as a graph.", "B": "Adopt it to automatically reduce the number of LLM calls and token consumption, lowering API costs.", "C": "Adopt it so that you do not have to write prompts or agent configurations yourself.", "D": "Forgo adopting it, implement the tool use loop directly with the Messages API, and hold the pending-approval state in process memory."}}, {"id": "CCDV-F-Udemy-0015", "question": "An EdTech company tried instructions (prompts) for generating K-12 teaching materials in three places: Claude Code, claude.ai, and the Messages API. The same instructions produced different interpretations and outputs.\nWhich is the most appropriate explanation of this difference and response to it?", "choices": {"A": "The difference is caused by ambiguity in the instructions, so rewrite the instructions in more detail to make the three outputs consistent.", "B": "Each interface adds different context, so build on the API, where you can control the context.", "C": "All three run with the same system prompt, so report the difference to support as a model defect.", "D": "Settle on the one interface that produced the best output, and stop testing on the other two."}}, {"id": "CCDV-F-Udemy-0016", "question": "A bank is building a Claude assistant that accepts changes to registered addresses via chat. The procedure must always proceed in the following order.\nIdentity verification\nCollecting the new address\nRepeating back the details and obtaining consent\nExecuting the change\nIn testing, cases were found in which Claude, pressured by the user to hurry, called the address change tool before identity verification was complete.\nWhich design most reliably enforces this order?", "choices": {"A": "Set effort to a high value to increase the amount of reasoning Claude spends checking the procedure on every response.", "B": "Keep the current step as state on the application side, and include in the request only the tools allowed in that state.", "C": "Have Claude output the name of the next step as JSON in every response, and have the app switch processing according to that value.", "D": "Spell out the order of the steps with numbers in the system prompt, and use few-shot prompting to demonstrate a dialogue that follows the order."}}, {"id": "CCDV-F-Udemy-0017", "question": "A logistics company is integrating Claude Code into its CI pipeline to automate code review of pull requests.\nWhich is the most appropriate way to use headless mode and settings.json?", "choices": {"A": "Set defaultMode to bypassPermissions in the project's settings.json to skip all confirmations at once.", "B": "Run non-interactively with -p, and pre-approve the required tools with --allowedTools.", "C": "Write \"In CI, you may run without confirmation\" in CLAUDE.md, and launch Claude Code in interactive mode.", "D": "Launch Claude Code in interactive mode, and have a CI engineer respond to each permission prompt as it appears."}}, {"id": "CCDV-F-Udemy-0018", "question": "A game development company frequently refines the Claude prompts it uses to generate dialogue for non-player characters.\nWhich is the most appropriate way to integrate prompt changes into the normal software development lifecycle (SDLC)?", "choices": {"A": "Put prompt changes through A/B tests in production, and keep the versions that get the best user response.", "B": "Let planners edit prompts directly from an admin screen, and apply changes to production immediately.", "C": "Manage the prompt text in a configuration database, and record the full text in the commit message whenever it changes.", "D": "Manage prompts in the repository, and merge changes only after they pass review and evaluation through a pull request."}}, {"id": "CCDV-F-Udemy-0019", "question": "An e-commerce company is developing a returns-handling agent. This agent reads return policy documents and runs internal return-processing scripts.\nCompared with calling the Messages API directly with Anthropic's Client SDK, which is the most appropriate benefit of adopting the Claude Agent SDK?", "choices": {"A": "Responses can be received incrementally via streaming, so the progress of long tasks can be displayed on the user's screen.", "B": "The agent can be hosted on Anthropic's infrastructure, so you do not need to operate an execution environment or sandbox.", "C": "You can use built-in tools for file operations and command execution, along with an agent loop that executes those tools and returns the results.", "D": "The agent can run by logging in with a claude.ai account, so it can be embedded in your own product without issuing an API key."}}, {"id": "CCDV-F-Udemy-0020", "question": "A retail company's customer support chat involves long conversations with a single customer.\nFrom the perspective of proper session management (session hygiene), which design is most appropriate?", "choices": {"A": "Keep using the same session even when the customer's request changes, and resend all past exchanges every time without trimming them.", "B": "Choose a model with a 1M-token context window, and keep the entire history up to the limit.", "C": "Have the server side hold the conversation state, and have the client send only the latest message each time.", "D": "Use a separate session for each request, shrink old history by summarizing or trimming it, and keep only the relevant context."}}, {"id": "CCDV-F-Udemy-0021", "question": "An auto parts manufacturer operates an agent that edits design-related documents. Audit requirements dictate that every time the agent modifies a file, the change must be recorded in the audit log, without exception.\nWhich implementation best meets this requirement?", "choices": {"A": "Configure a PostToolUseFailure hook matched to Edit and Write that runs an audit logging script.", "B": "Define a subagent for audit logging, and instruct the main agent to call it after changing a file.", "C": "Configure a PostToolUse hook matched to Edit and Write that runs an audit logging script.", "D": "Add a rule to CLAUDE.md that says \"When you edit a file, record it in the audit log.\""}}, {"id": "CCDV-F-Udemy-0022", "question": "A power company operates a Claude agent that monitors the power grid. In long sessions, each tool returns large amounts of data, such as sensor data, as-is without processing. This data accumulates in the context, lowering quality while increasing cost and latency.\nWhich mitigation is most appropriate for preventing context bloat?", "choices": {"A": "Raise max_tokens so that long responses are output to the end even with the enlarged context.", "B": "Unregister the tool that retrieves sensor data so that the agent cannot retrieve raw data.", "C": "Narrow tool results down to the necessary fields before adding them, and summarize old exchanges to shorten them.", "D": "Migrate to a model with a 1M-token window, and keep holding the data returned by tools as-is."}}, {"id": "CCDV-F-Udemy-0023", "question": "On a payment platform, a Claude-based agent that performs transaction reconciliation fails intermittently. The traces record the following two types of failure.\nThe API returns HTTP 400 invalid_request_error, and the request fails immediately\nThe API returns HTTP 200, but when the company's own parser validates the returned body, the body is rejected as malformed\nWhich approach is most appropriate for isolating whether these failures are caused by defects in the integration layer (the company's own request-building and post-processing code) or by problems in the model output itself?", "choices": {"A": "Raise max_tokens to confirm that responses are not being cut off, and then rerun the same processing.", "B": "Uniformly retry failed requests with exponential backoff, and treat them as resolved if they succeed.", "C": "Classify failures at the API boundary: treat 4xx as a request-construction problem on your side, and malformed output after a 200 as an output or post-processing problem.", "D": "Switch to a larger model to process the same transactions, and observe whether the failure frequency decreases."}}, {"id": "CCDV-F-Udemy-0024", "question": "An audit firm is building a feature that passes the audit reports of three subsidiaries to Claude together and asks, \"What internal control findings are common to all three companies?\" Each report is tens of thousands of tokens long.\nThe current prompt places the question first, followed by the three reports concatenated without separators. However, answer quality is inconsistent, and it is also hard to tell which company's report each statement is based on.\nWhich is the most appropriate improvement to the prompt structure?", "choices": {"A": "Set effort to a high value so that more tokens are spent on thinking to interpret the long reports.", "B": "Have each of the three reports summarized in advance, and pass only those summaries, placed after the question.", "C": "Add cache_control at the end of the reports section to make the second and subsequent questions about the same reports faster and cheaper.", "D": "Place the reports first, wrapping each one in tags labeled with its source name, and place the question at the end, after the reports."}}, {"id": "CCDV-F-Udemy-0025", "question": "A machine tool manufacturer operates an internal MCP server that provides tools for booking equipment inspections and looking up inspection history. The manufacturer has added a new reschedule_inspection tool to this server for changing inspection schedules.\nThe manufacturer wants the multiple AI apps (hosts) that use this server to present the new tool and its arguments to the model without changing the app code.\nWhich correctly describes how tools and their arguments are communicated to the client in MCP?", "choices": {"A": "The server includes argument descriptions in templates it exposes as prompts, and the user selects one to pass to the model.", "B": "The client sends tools/list and uses the returned inputSchema and other fields for the tool definitions given to the model.", "C": "The client tries tools/call with empty arguments and has the model learn the required arguments from the returned error.", "D": "The client reads a tool specification document that the server exposes as resources and has the model infer the argument format."}}, {"id": "CCDV-F-Udemy-0026", "question": "A telecommunications company is planning a Claude-powered assistant that presents suggested answers to call center operators during calls. There are two business requirements.\nSuggested answers must start appearing within 1 second\nThe assistant must support 300 concurrent calls at peak\nWhich technical and infrastructure requirement best follows from these business requirements?", "choices": {"A": "Display responses incrementally with streaming, and when a 429 error is returned, wait the number of seconds in retry-after and then retry the same request.", "B": "Submit per-call requests together to the Message Batches API, adjusting the count to stay within the processing queue limit.", "C": "Select a model with a 1M-token context window, and include the full call transcript in every input.", "D": "Display responses incrementally with streaming, and secure rate limit capacity that matches the peak request volume and token volume."}}, {"id": "CCDV-F-Udemy-0027", "question": "A nonprofit runs a Claude workflow in production that supports donor relations.\nWhen a new model version is released, which is the most appropriate way to prepare for behavior changes between model releases?", "choices": {"A": "Pin the production model ID, and migrate to the new model only after regression evaluation confirms that there is no degradation.", "B": "Assume that the new model is better than the previous generation, and skip retesting existing prompts.", "C": "Before migrating, try a few prompts on the new model, and switch the production model if the responses make a good impression.", "D": "Swap the production model ID on the new model's release date, and roll back if problems are reported."}}, {"id": "CCDV-F-Udemy-0028", "question": "A staffing services company is implementing a batch job that integrates with an external job-posting service's REST API and registers new job postings via POST. On network errors or timeouts, the job retries the request.\nWhich implementation is most appropriate in light of REST status codes and idempotency?", "choices": {"A": "Treat a timed-out POST as idempotent, like PUT, and resend it; delete any duplicate job postings manually afterward.", "B": "Treat a POST that returned a 5xx as already registered, and move on to registering the next job posting without resending it.", "C": "Resend requests that returned 400 as well, using exponential backoff, repeating up to a fixed number of times until they succeed.", "D": "Resend a POST only after attaching an idempotency key or confirming whether it was already registered, and do not resend 4xx responses other than 429."}}, {"id": "CCDV-F-Udemy-0029", "question": "The development team at a construction company wants to distribute Claude Code coding conventions and permission settings to the entire team.\nWhich understanding of the placement and hierarchy of CLAUDE.md and settings.json is most appropriate?", "choices": {"A": "Describe the shared permissions in prose in CLAUDE.md, and leave the contents of settings.json up to each member.", "B": "Distribute the shared settings to each member's ~/.claude/settings.json, and do not put them in the repository.", "C": "Put the shared conventions in CLAUDE.md and the shared permissions in .claude/settings.json, and share both via Git.", "D": "Write the shared conventions and permissions in .claude/settings.local.json, commit it, and distribute the same contents to everyone."}}, {"id": "CCDV-F-Udemy-0030", "question": "A news media company operates a Claude app that summarizes long articles and holds multi-turn conversations with readers.\nWhich statement about the basics of token usage and the context window, which the operations team should understand, is correct?", "choices": {"A": "The context window is the upper limit on response length; the size of the input is managed separately from the window.", "B": "Both input and output count toward the window, and because the history is sent every time, the input grows as the conversation goes on.", "C": "Output tokens do not count toward the window; only the input tokens sent are subject to the limit.", "D": "Only the latest user message is billed as input; past exchanges are retained on the server side."}}, {"id": "CCDV-F-Udemy-0031", "question": "An HR SaaS company is rolling out Claude Code plugins (extensions) across the entire team.\nWhich are appropriate management considerations? (Select TWO.)", "choices": {"A": "Let each member install whatever plugins they like at user scope, and do not provide shared team settings.", "B": "Share the plugins to enable with everyone through a committed .claude/settings.json.", "C": "Pin plugin versions, and apply updates deliberately after reviewing what has changed.", "D": "Enable marketplace auto-updates so that the latest plugin versions reach everyone automatically.", "E": "Limit pre-adoption review to checking the description and the number of users, without examining the hooks or MCP servers the plugin adds."}}, {"id": "CCDV-F-Udemy-0032", "question": "A university's research support team has adopted Claude Code and is sorting out when to use each component.\nWhich description of the components is most appropriate?", "choices": {"A": "CLAUDE.md is a procedure guide loaded when needed, and skills are conventions loaded every session.", "B": "A subagent inherits the parent's conversation history and works within the same context as the parent.", "C": "Agent Memory is a convention file written by people; Claude never writes what it learns into it automatically.", "D": "CLAUDE.md contains conventions loaded every session, and skills are procedures loaded when needed."}}, {"id": "CCDV-F-Udemy-0033", "question": "An electronics manufacturer is developing the following two MCP servers.\nA server that runs as a subprocess on the developer's machine and accesses local files and CLIs\nA server offered over the network to many clients\nWhich choice of MCP server transport is most appropriate?", "choices": {"A": "Use stdio for the local server that runs as a subprocess, and Streamable HTTP for the remote server offered to many clients.", "B": "Distribute the network-facing server to each user's machine as a subprocess as well, and do not use HTTP.", "C": "Implement both with Streamable HTTP, exposing even the server that runs on the developer's machine on a local HTTP port.", "D": "Implement both the local server and the network-facing server with stdio, and offer them to remote users the same way."}}, {"id": "CCDV-F-Udemy-0034", "question": "A law firm repeatedly sends Claude many different questions about a contract that is tens of thousands of tokens long. The contract text is identical every time and is placed before the question.\nWhich designs correctly reduce cost with prompt caching? (Select TWO.)", "choices": {"A": "Do not use cache writes; instead, bundle the questions about the same contract into a single request.", "B": "Place the cache_control breakpoint at the end of the user message that includes the request timestamp, which changes every time.", "C": "Treat the cached contract as outside the context window, and add even more reference material.", "D": "Place the contract at the beginning with cache_control at its end, and place the question, which changes every time, after it.", "E": "Ensure that the prefix to be cached is at least the model-specific minimum cacheable token count."}}, {"id": "CCDV-F-Udemy-0035", "question": "A consulting firm is selecting Claude models (Opus, Sonnet, Haiku) for multiple workloads.\nWhich are correct approaches to model selection based on the trade-offs among quality, latency, and cost? (Select TWO.)", "choices": {"A": "Once a model has been evaluated and selected, keep using it as is without re-evaluation, even when successor models are released.", "B": "For complex, open-ended analysis where quality matters more than cost, choose Opus even though its unit price is higher.", "C": "Use the cheapest model, Haiku, even for complex analysis, and compensate for the difficulty of the reasoning through prompt engineering.", "D": "For high-volume, simple classification or routing where speed and cost take priority, choose Haiku.", "E": "Standardize on a single model, Opus, for all workloads, from classification to analysis."}}, {"id": "CCDV-F-Udemy-0036", "question": "A food manufacturer wants its Claude app to always call an ingredient allergen-checking tool before answering. Calls to the tool can also fail.\nWhich design for controlling tool_choice and handling tool errors is most appropriate?", "choices": {"A": "Leave tool_choice as auto, and when a call fails, have the application re-run the same tool repeatedly until it succeeds.", "B": "On supported models, name the tool with tool_choice, and on failure return a tool_result with is_error.", "C": "When the tool fails, return an empty tool_result and do not tell Claude that an error occurred.", "D": "When the tool fails, raise an exception and end the conversation, aborting processing without returning a tool_result."}}, {"id": "CCDV-F-Udemy-0037", "question": "A local government has released to production a Claude-powered system that answers inquiries from residents.\nFrom the perspective of IT system lifecycle management, which activity is most appropriate for the post-release operations and maintenance phase?", "choices": {"A": "Monitor response quality and usage, evaluate the impact of model updates and policy changes, and make planned improvements.", "B": "Establish procedures for failure monitoring and server restarts, and focus maintenance work on maintaining uptime.", "C": "Feed the results of the rating buttons that residents press into model retraining so that answer quality improves automatically.", "D": "Finalize quality through testing during development, and freeze changes to answer content until the next system replacement."}}, {"id": "CCDV-F-Udemy-0038", "question": "The development team at a music streaming company is considering whether to use the official Python SDK for its Claude integration or to call the API directly with raw HTTP requests.\nWhich statement about the relationship between the SDK and the REST API is correct?", "choices": {"A": "The SDK connects to a faster endpoint separate from the one used by raw HTTP, so the same call returns a response faster.", "B": "Using the SDK gives access to SDK-only model features that cannot be called via raw HTTP.", "C": "The SDK cannot handle server-sent events, so streaming must be implemented with raw HTTP.", "D": "The SDK is a client that calls the same API as raw HTTP; it adds conveniences such as type definitions and retries, but the functionality is the same."}}, {"id": "CCDV-F-Udemy-0039", "question": "A home care provider is building a Claude assistant that helps staff write care records. The records contain personally identifiable information (PII) such as names, addresses, and health conditions.\nWhich design is most appropriate for preventing PII leakage?", "choices": {"A": "Pass only the fields needed for the task, mask direct identifiers, and narrowly scope tool permissions.", "B": "Mask direct identifiers and narrowly scope permissions, but keep the records of all clients loaded in the system prompt at all times.", "C": "To prepare for audits, save the full text of the prompts and responses sent to the model in logs, with names left in.", "D": "Because records are sent over TLS and also encrypted at rest, do not minimize the fields passed to the prompt."}}, {"id": "CCDV-F-Udemy-0040", "question": "A restaurant chain is embedding Claude in the ordering chat of its mobile app. So that customers are not kept waiting even when responses are long, the company is considering adopting streaming in the Messages API.\nWhich explanation of how streaming works and its benefits is correct?", "choices": {"A": "With stream: true, the app receives incremental SSE delivery and displays content on screen as it arrives.", "B": "The unit price of output tokens drops to 50% of standard, so the longer the response, the more the ordering chat's costs are reduced.", "C": "After generation completes, the full text is bundled into a single event and sent, and the client updates the display all at once.", "D": "A bidirectional WebSocket connection is opened, and additional orders can be accepted over the same connection even mid-generation."}}, {"id": "CCDV-F-Udemy-0041", "question": "A retail company is building an HR assistant for employees. Claude queries the HR database with the get_employee_record tool on an internal MCP server. The current setup is as follows.\nThe get_employee_record tool runs under a service account that can read every employee's record\nThe rule \"handle only the user's own record and, for managers, their direct reports' records\" is written only in the system prompt\nIn testing, cleverly worded questions were able to extract the performance reviews of employees in other departments.\nWhich remediation is most appropriate?", "choices": {"A": "Rewrite the rule in the system prompt with concrete examples of what is prohibited, and use few-shot prompting to show questions that should be refused.", "B": "Attach the logged-in employee's token to tool execution, and have the server determine the queryable scope based on that employee's permissions.", "C": "Inspect responses with a separate model before sending them, and if a response contains names other than the requester's, block the answer and regenerate it.", "D": "Have Claude pass the requester's employee ID as a tool argument, and have the server return only records within that ID's scope."}}, {"id": "CCDV-F-Udemy-0042", "question": "A logistics warehouse operator is building a Claude feature that extracts the SKU, quantity, and presence or absence of damage, in a consistent format, from free-text notes on receiving slips. The format of the extraction results varies from run to run, and the operator wants to eliminate this.\nWhich approach to designing few-shot prompting and output constraints is most effective?", "choices": {"A": "Show 3–5 representative examples close to real cases in example tags, and specify the output format in positive terms.", "B": "Do not use examples; instead, convey the format by adding a paragraph that describes the output format in detail at the start of the instructions.", "C": "Convey the format by listing prohibitions such as \"Do not use bullet points\" and \"Do not add explanations.\"", "D": "List dozens of slip notes on hand as is without curating them, presenting as many examples as possible."}}, {"id": "CCDV-F-Udemy-0043", "question": "A real estate company is developing an app that uses Claude to analyze property photos to support appraisals. The same property photos are referenced repeatedly across multi-turn conversations and multiple requests. The company therefore wants to avoid re-sending the images with every request and inflating the request payload.\nWhich method of providing images to the Messages API is most appropriate?", "choices": {"A": "Upload the images once to the Files API, and reference the returned file_id in each request.", "B": "Write the image URLs as text in the prompt, and have Claude open the links and read the photos.", "C": "Encode the images in base64 and embed them in an image block with every request.", "D": "Add cache_control to the images' image blocks, and cache and reuse them with prompt caching."}}, {"id": "CCDV-F-Udemy-0044", "question": "An airline is building a Claude feature that extracts specified fields (aircraft number, maintenance category, time required, etc.) from free-text maintenance records into structured records.\nWhich designs are appropriate for ensuring that the model reliably returns structured data that conforms to the schema? (Select TWO.)", "choices": {"A": "Before using the result, confirm that stop_reason does not indicate a refusal (refusal) or reaching the limit (max_tokens).", "B": "Extract each field from the free-text response with regular expressions, and register any fields that are not found as blank.", "C": "Set max_tokens low to keep the output short, so that no parts that deviate from the schema appear.", "D": "Assume that using structured outputs always guarantees a schema-compliant response, and skip checking stop_reason.", "E": "Constrain the response to the schema with a JSON schema in output_config.format or with strict tool use."}}, {"id": "CCDV-F-Udemy-0045", "question": "A hotel reservation assistant has multiple tools registered, such as checking availability, confirming a reservation, and canceling a reservation. Claude sometimes calls a tool that does not fit the situation.\nWhich design is most appropriate in light of the relationship between how tool descriptions are written and tool selection accuracy?", "choices": {"A": "Keep the description short, as a memo for developers, and compensate for selection accuracy by choosing tool names carefully.", "B": "Give every tool the same generic description, and leave the choice among them to the model's flexible judgment.", "C": "Write a distinct, specific description of each tool's purpose and when to use it, eliminating overlap in roles between tools.", "D": "When the wrong tool is called, return an exception and have Claude retry and reselect the correct tool."}}, {"id": "CCDV-F-Udemy-0046", "question": "A hospital is planning a Claude-powered system that automatically generates clinical summaries from transcripts of consultation audio. The business goal is to \"reduce the time physicians spend on paperwork by 30%.\"\nWhich is the most appropriate \"functional requirement\" derived from this business requirement?", "choices": {"A": "Generate a clinical summary in the hospital's specified format from the transcript text, and display it on the physician's review screen.", "B": "Handle 100 concurrent requests at peak, keeping the 95th percentile response time within 10 seconds.", "C": "Reduce the time physicians spend on paperwork by 30% compared with before adoption, increasing the time available for patient care.", "D": "Complete development within three months, and keep first-year build and operating costs within the approved budget."}}, {"id": "CCDV-F-Udemy-0047", "question": "A government agency's portal answers thousands of inquiries from citizens based on a corpus of regulatory documents that rarely changes. In every request, the system prompt and the regulatory documents (a large amount of text) placed at the beginning are the same; only the citizen's inquiry changes.\nWhich statement about the cost design of prompt caching is correct?", "choices": {"A": "On many models, cache reads cost 0.1x the base input price and 5-minute TTL writes cost 1.25x, so the more reuse, the cheaper it becomes.", "B": "The cache is reused only within the same user's conversation, so a separate write is needed for each citizen.", "C": "1-hour TTL writes are cheaper than 5-minute TTL writes, so the 1-hour TTL is advantageous regardless of the reuse interval.", "D": "A 5-minute TTL cache is billed for a rewrite every 5 minutes, so the 1-hour TTL is advantageous even when inquiries arrive continuously."}}, {"id": "CCDV-F-Udemy-0048", "question": "An advertising agency is designing an internal system that analyzes the wording of tens of thousands of accumulated ad copies every night. The analysis results only need to be ready by the next morning's regular meeting, and reducing processing cost is the top priority.\nWhich is the correct reason to choose the Message Batches API for this use case?", "choices": {"A": "Results arrive incrementally via server-sent events, so the progress of the analysis can be displayed on screen continuously.", "B": "Requests are processed asynchronously at 50% of standard pricing, with most completing within 1 hour and a maximum window of 24 hours.", "C": "Each request's response returns faster than with the standard API, shortening the overnight analysis time.", "D": "Results are returned in the same order as submitted, so they can be matched to the original ad copy without custom_id."}}, {"id": "CCDV-F-Udemy-0049", "question": "A chemical manufacturer is building a Claude assistant. The assistant inserts the inquiry text sent by users into a prompt template and answers it.\nWhen assembling the prompt, which approach to handling (sanitizing) untrusted user input is most appropriate?", "choices": {"A": "Wrap the input in an XML tag such as user_query, and state in the system prompt that its contents are data.", "B": "Strip symbols from the input so that only text characters remain, and insert the result into the template as is.", "C": "Concatenate the input as is into the middle of the instructions, and leave it to the model's contextual judgment to distinguish instructions from input.", "D": "Before inserting the input, have a separate model summarize it, and insert the paraphrased text into the template instead."}}, {"id": "CCDV-F-Udemy-0050", "question": "A securities company is deploying a customer-facing Claude chatbot to production. It wants to put robust guardrails in place against inappropriate requests, such as facilitating insider trading or disclosing customer information.\nWhich design is most appropriate?", "choices": {"A": "Use a refusal policy in the system prompt and an output filter, and skip pre-screening of input to keep processing light.", "B": "Set up a mechanism that screens input with a lightweight model, and process requests that pass screening as is.", "C": "Try attacks through red teaming before release to harden the defenses, and add no further checks after going live.", "D": "Layer output filtering and monitoring on top of input screening and a refusal policy in the system prompt, for defense in depth."}}, {"id": "CCDV-F-Udemy-0051", "question": "A bank is building an internal agent that handles customer data. For regulatory compliance, it must meet the following requirements.\nThe agent's execution environment and session state (conversation logs) are kept within infrastructure that the bank manages itself\nThe agent directly operates on files and services within the bank's own network\nWhich deployment model best fits these requirements?", "choices": {"A": "Adopt Managed Agents, and run tools in a self-hosted sandbox on the bank's own infrastructure.", "B": "Adopt the Message Batches API, and submit each step of the agent as an asynchronous batch.", "C": "Adopt the Claude Agent SDK, and run the agent loop in the bank's own process on its own infrastructure.", "D": "Adopt Managed Agents, and run sessions in an Anthropic-managed cloud sandbox."}}, {"id": "CCDV-F-Udemy-0052", "question": "A renewable energy company uses a Claude Code agent that can run shell commands in its operations repository. It wants to block destructive commands, such as deleting production configuration, deterministically (reliably) before they run, without relying on the model's judgment.\nWhich approach is most appropriate?", "choices": {"A": "State explicitly in the system prompt: \"Do not run commands that delete production configuration.\"", "B": "Instruct the agent to call a reviewer subagent before execution, and have the subagent judge whether a command is destructive.", "C": "Inspect Bash execution results with a PostToolUse hook, and notify the person in charge if a destructive operation is detected.", "D": "Inspect commands before execution with a PreToolUse hook, and stop them by returning deny if they match."}}, {"id": "CCDV-F-Udemy-0053", "question": "An insurance company is trying to automate first-pass processing of insurance claims. Every time, processing runs the following three steps in this order, and the order never changes.\nCheck the submitted documents for required fields\nCross-check against the policy terms\nGenerate a receipt notification for the customer\nWhich LLM-based implementation approach is most appropriate?", "choices": {"A": "Implement it with the orchestrator-workers pattern, in which a manager LLM decides the subtasks for each claim and delegates them to worker LLMs.", "B": "Implement it with the evaluator-optimizer pattern, in which an evaluator LLM scores the output and generation and revision repeat until the criteria are met.", "C": "Implement it as a prompt chaining workflow that calls each step in order through predefined code paths.", "D": "Implement it as an autonomous agent in which the LLM itself decides at runtime the order of tool use and the processing steps."}}, {"id": "CCDV-F-Udemy2-0001", "question": "A hospital's IT department is integrating its in-house clinical reference MCP server into an AI application (the host). One engineer is confusing the relationship among the host, client, and server, as well as the number of clients needed when there are two servers.\nWhich statement correctly describes the MCP host/client/server model?", "choices": {"A": "The host creates one MCP client per server, and each client maintains a dedicated connection.", "B": "The MCP server also acts as the host, and the AI application connects to the server as a client.", "C": "The host creates a single MCP client, and that client connects to both servers simultaneously.", "D": "Separate clients are created per transport, one for stdio and one for Streamable HTTP, and the servers are distributed among them."}}, {"id": "CCDV-F-Udemy2-0002", "question": "A video streaming service is building a chat assistant that viewers use while watching, and its implementation handles Messages API streaming (server-sent events) directly.\nWhich implementations correctly process SSE events? (Select TWO.)", "choices": {"A": "Treat the text of the last content_block_delta received as the completed body, and display it on screen as is.", "B": "Parse the partial_json of input_json_delta as JSON every time one is received, and apply the resulting value to the arguments.", "C": "Treat receipt of an unknown event type as a specification violation, throw an exception, and close the connection.", "D": "Concatenate text_delta values in order for each index, and read stop_reason from the message_delta event.", "E": "Accumulate the partial_json of input_json_delta, and parse it only after receiving content_block_stop."}}, {"id": "CCDV-F-Udemy2-0003", "question": "When generating descriptions of tourist sites with a previous model, the development team of a travel guide app specified top_k to tune generation so that low-probability tokens were less likely to be chosen.\nAfter the team updated the model to Claude Sonnet 5, this request began failing with HTTP 400.\nWhich is the most appropriate understanding of sampling parameters and the most appropriate response?", "choices": {"A": "Remove top_k, and guide the writing style through instructions and examples in the prompt.", "B": "Keep top_k, and set top_p to 0.99 or higher so that the request is accepted as a combination close to the defaults.", "C": "Remove top_k, and instead lower temperature to 0 so that low-probability candidates are less likely to be chosen.", "D": "Remove top_k, and instead reduce max_tokens to narrow the number of candidates for the next token."}}, {"id": "CCDV-F-Udemy2-0004", "question": "A hotel chain put a concierge app built with Claude into production a few months ago.\nWhich is the most appropriate continuous maintenance and evaluation practice for the operations and maintenance phase of the system lifecycle?", "choices": {"A": "Investigate and fix the cause case by case whenever a failure is reported, and operate without an evaluation dataset.", "B": "Tally user satisfaction surveys every quarter, and review the configuration when the score drops.", "C": "Continuously monitor the quality of production outputs, and improve the prompts and configuration while maintaining a regression evaluation set.", "D": "Freeze the configuration from launch, and operate under a policy of not changing the model or prompts until the next major overhaul."}}, {"id": "CCDV-F-Udemy2-0005", "question": "A fintech (payments) company's fraud detection agent has started ignoring its initial instructions and account constraints in the latter part of long conversations. Its judgments have also started to waver, pulled along by irrelevant tool outputs.\nWhich best describes the symptoms of context drift and how to prevent it?", "choices": {"A": "Treat it as a temporary model malfunction, wait a while, and resume processing in the same conversation until the model recovers.", "B": "Treat it as the initial instructions being buried in a bloated context, and trim unnecessary tool results and narrow the context through summarization or separation.", "C": "Treat it as a shortage of initial instructions, and emphasize them by appending the same instructions to the system prompt repeatedly.", "D": "Treat it as wavering judgment caused by a lack of information, and fetch additional tool outputs that seem relevant and add them to the context."}}, {"id": "CCDV-F-Udemy2-0006", "question": "A mapping information company provides an in-house library that normalizes address notation to multiple development teams. The library uses Claude, and its current version is 2.4.1.\nIn the next change, the return value field confidence will be renamed to score, and the old name confidence will be removed.\nFollowing semantic versioning, which is the most appropriate version for releasing this change?", "choices": {"A": "Release it as 3.0.0, bumping MAJOR, since it is a backward-incompatible change to the public API.", "B": "Release it as 2.5.0, bumping MINOR, since it is a change that adds a new field.", "C": "Release it as 2.4.2, bumping PATCH, since it is a change comparable to an internal bug fix.", "D": "Replace the contents of the published 2.4.1 release, and notify the consuming teams of the change and ask them to adapt."}}, {"id": "CCDV-F-Udemy2-0007", "question": "A non-life insurance company's claims assessment support app sends Claude, in a single request, three photos of an accident vehicle taken from different angles together with a question asking it to compare the damaged areas.\nCurrently, the question is placed first, followed by the photos in sequence. Assessors sometimes cannot tell which photo \"the second photo\" in the response refers to.\nWhich is the most appropriate way to arrange the image blocks and text within the user message?", "choices": {"A": "Combine the three photos side by side into a single image, and refer to them by position (left, center, right) in the question.", "B": "Place the photos first, each immediately preceded by a label such as \"Image 1:\", and put the question after them.", "C": "Pass the three photos in the system prompt, and send only the question in the user message.", "D": "Upload the three photos to the Files API, and write each file_id into the question so that Claude references the photos."}}, {"id": "CCDV-F-Udemy2-0008", "question": "An ad-tech company that is building an agent is deciding whether to adopt an abstraction framework (such as LangGraph, Strands, or PydanticAI) or to implement the agent directly with the Messages API.\nWhich best describes the trade-off?", "choices": {"A": "Adopt an abstraction framework at the prototype stage, and shape the agent's architecture to fit the framework's conventions.", "B": "Start by implementing directly with the Messages API, and adopt a framework when its benefits justify the added complexity.", "C": "Prefer the components bundled with the framework, and inspect its internal prompts only once a bug appears.", "D": "Anticipating a future move to multiple agents, build a foundation for orchestrating multiple agents up front."}}, {"id": "CCDV-F-Udemy2-0009", "question": "A securities firm has drawn up a solution architecture in which Claude generates research summaries and passes them to a trading dashboard. The development team needs to derive functional requirements from this architecture.\nWhich activity correctly derives functional requirements from the solution architecture?", "choices": {"A": "Write down each part's inputs, outputs, and acceptance criteria as requirements whose pass/fail can be determined by tests.", "B": "Assign each component in the architecture diagram to developers as is, as a list of development tasks.", "C": "Finalize the model ID and API parameters first, and record those settings in the requirements definition document.", "D": "Build a prototype first and show it to stakeholders, then add the well-received behaviors as requirements."}}, {"id": "CCDV-F-Udemy2-0010", "question": "A publisher's app has the following two types of processing:\nInteractive operations in which editors ask Claude for immediate answers in the editor\nA high-volume job that reformats the entire back catalog in bulk\nWhich is the most appropriate criterion for choosing between a synchronous and an asynchronous architecture?", "choices": {"A": "Submit both types of processing to the Message Batches API, and respond to editor operations by polling for results as well.", "B": "Implement both types of processing with synchronous API calls, and set a longer HTTP timeout for the reformatting job.", "C": "Process the editors' interactive operations synchronously, and process the full-catalog reformatting asynchronously with queues or batches.", "D": "Use streaming for both types of processing, and run the reformatting job while streaming its progress to the editors' screens."}}, {"id": "CCDV-F-Udemy2-0011", "question": "A restaurant chain uses Claude to classify and summarize store reviews. To understand its operating costs, the company wants to track token usage per request.\nWhich is the most appropriate way to track token usage at the request level?", "choices": {"A": "Record input_tokens and output_tokens from the usage field of each response, and aggregate them per call.", "B": "Have the model write the number of tokens it used in the response body, and log and aggregate that value as usage.", "C": "Check the billed amount on the Console's Usage page at the end of the month, and divide it by that month's request count to get the cost per request.", "D": "Record the input token count measured with the count_tokens endpoint before sending, and aggregate it as the actual usage."}}, {"id": "CCDV-F-Udemy2-0012", "question": "A film distributor machine-translates tens of thousands of short subtitle lines into many languages. Each line is short and formulaic, and acceptable quality is sufficient. Cost and throughput are the top priorities.\nWhich model choice is most reasonable?", "choices": {"A": "Translate all lines with Claude Opus, setting effort low to keep the cost per line down.", "B": "Have multiple models translate each language, and have an evaluator LLM select and adopt the best translation.", "C": "Translate all lines with Claude Haiku, the fastest and lowest-cost model, and check translation quality with spot-check evaluations.", "D": "Translate all lines with the top-tier Claude Fable, maximizing translation quality before distribution."}}, {"id": "CCDV-F-Udemy2-0013", "question": "An airline's operations control center wants to build a system that handles operational disruptions involving bad weather, crew shortages, and aircraft changes. The situations that arise cannot be predicted in advance, and the required steps change from case to case, so dynamic decision-making is required.\nWhich architecture best fits this requirement?", "choices": {"A": "Implement it with parallelization, having multiple LLMs produce the same replanning proposal in parallel and choosing the plan to adopt by majority vote.", "B": "Implement it as an agent in which Claude assesses the situation, decides on tool use and next steps, and proceeds while checking the results.", "C": "Implement it with routing, classifying the input by type of disruption and dispatching it to a response flow prepared for each type.", "D": "Implement it with prompt chaining, defining the response steps in advance so that each LLM call proceeds in order using the previous step's output."}}, {"id": "CCDV-F-Udemy2-0014", "question": "A news media company operates a public Claude chatbot that answers questions about its articles. Some users craft inputs that jailbreak the bot into generating prohibited content (a direct threat in which the user is the attacker).\nWhich mitigation is most effective?", "choices": {"A": "Pre-screen inputs with a lightweight model, instruct the bot on ethical boundaries and how to decline, and restrict users who repeatedly violate the rules.", "B": "Pass user messages inside tool_result blocks so that they are treated as untrusted input.", "C": "Encode the retrieved article text as JSON to make the boundary between articles and instructions clear before having the bot answer.", "D": "Switch to a model with stronger instruction following, list the prohibited items in the system prompt, and restate them every turn."}}, {"id": "CCDV-F-Udemy2-0015", "question": "In a K-12 learning support app, requests to the Claude API spike right after classes begin, and the app has started receiving 429 errors.\nWhich is the most appropriate understanding of rate limit fundamentals and the most appropriate response?", "choices": {"A": "Retry with exponential backoff that follows retry-after, and use prompt caching for long shared instructions.", "B": "Switch to the Message Batches API, and return answers to in-class questions after batch processing completes.", "C": "Reset max_tokens to a smaller value to free up OTPM capacity and avoid 429 errors.", "D": "Distribute requests across multiple workspaces, and process them within the combined limits of all the workspaces."}}, {"id": "CCDV-F-Udemy2-0016", "question": "A food manufacturer runs an agent that uses multiple tools to automate production line inspections. However, the tool use loop sometimes runs out of control or repeats endlessly.\nWhich measures prevent this kind of tool use loop failure? (Select TWO.)", "choices": {"A": "Apply prompt caching to the definitions and results of repeatedly called tools to lower the input cost per call.", "B": "Validate the tool results at each step, and set a stop condition that ends the loop once the goal is judged to be achieved.", "C": "Set disable_parallel_tool_use to true to limit each response to at most one tool call.", "D": "Set a cap on the number of tool use round trips (such as max_turns), and stop the loop when the cap is reached.", "E": "Replace old tool results with summaries partway through the loop to free up space in the context."}}, {"id": "CCDV-F-Udemy2-0017", "question": "A law firm is designing the following two features that use Claude:\nAn analysis feature (scrutinizes the consistency between clauses of complex contracts through multi-step reasoning)\nAn internal FAQ feature (instantly returns a standard answer when asked for a clause number)\nWhich are appropriate ways to choose between fast mode and extended thinking (adaptive thinking / effort level)? (Select TWO.)", "choices": {"A": "For the contract consistency analysis, set effort to high to allocate sufficient thinking to the multi-step reasoning.", "B": "For the FAQ feature, set effort to low to limit thinking and reduce response time and token consumption.", "C": "Set effort to max even for the FAQ feature, so that Claude thinks thoroughly even on simple clause-number questions and answer quality improves.", "D": "For the contract consistency analysis, disable thinking to speed up responses, and have Claude reach a conclusion in a single output.", "E": "For the FAQ feature, enable fast mode (speed: \"fast\") to lower the price per answer."}}, {"id": "CCDV-F-Udemy2-0018", "question": "A caregiving provider wants to process the large volume of care records that accumulates each day in bulk overnight, and generate non-urgent summary reports by the next morning. Immediate responses are not needed, and cost is the top priority.\nWhich is the most appropriate way to operate the Message Batches API in this case?", "choices": {"A": "Submit the requests to the Message Batches API, and retrieve the results after processing_status becomes ended.", "B": "Specify stream: true on each request in the Message Batches API, and save the generated tokens incrementally.", "C": "Call the Messages API synchronously for each record, processing them one by one during idle overnight hours and saving the results.", "D": "Fetch results_url immediately after submitting to the Message Batches API, and use the results available at that point for the next morning's report."}}, {"id": "CCDV-F-Udemy2-0019", "question": "A construction company has Claude output on-site inspection findings as structured JSON, and ingests fields such as inspection date, remediation cost, and severity into a typed backend.\nWhich is the most appropriate approach to JSON serialization/deserialization and type handling?", "choices": {"A": "Validate the received JSON against a schema, and explicitly convert dates and amounts to date and Decimal types.", "B": "Store the inspection date in the database as a string, and interpret it each time a comparison or aggregation is needed.", "C": "Receive JSON numbers as floating-point values as is, and use those values when aggregating remediation costs as well.", "D": "Leave the restoration of date strings to date types to the JSON parser, and ingest the data without writing any type conversion logic."}}, {"id": "CCDV-F-Udemy2-0020", "question": "A construction company uses Claude Code. Every time, the team pastes into the chat the same multi-step checklist (formatting rules, required sections, review steps) for producing standardized site safety reports.\nThe team wants to package this checklist, have it loaded only when relevant, and have Claude follow it consistently.\nWhich mechanism is most appropriate for achieving this?", "choices": {"A": "As a custom tool: encode the checklist into an input_schema and have Claude call the tool.", "B": "As a skill: consolidate the steps and supporting materials into SKILL.md, and have its body loaded when relevant.", "C": "As CLAUDE.md: write the full text of the checklist into it, and have it loaded at the start of every session.", "D": "As an MCP server: expose the checklist as a resource, and have Claude Code reference it."}}, {"id": "CCDV-F-Udemy2-0021", "question": "A sports analytics platform defines a tool, get_player_stats, for Claude. Claude sometimes calls it with guessed values for parameters the user did not specify, or with the wrong types.\nWhich input_schema design most improves the accuracy of tool calls?", "choices": {"A": "Make every property a string type, and perform conversions to numbers and dates in the receiving code.", "B": "Remove the required specification so that the schema allows calls that omit arguments the user did not provide.", "C": "Write all the argument descriptions in the system prompt, and leave the input_schema properties empty.", "D": "Give each property the correct type and a description that includes units and format, and list the truly necessary arguments in required."}}, {"id": "CCDV-F-Udemy2-0022", "question": "A weather information company is developing an in-house forecast distribution tool with Claude Code. The company wants to use CLAUDE.md to separate organization-wide policies, individual developers' preferences, and rules shared across the project.\nWhich best describes the CLAUDE.md hierarchy and precedence?", "choices": {"A": "As with settings.json, a narrower-scope CLAUDE.md overrides the same instruction in a broader-scope CLAUDE.md.", "B": "Only the CLAUDE.md at the project root is loaded at startup, and the user file is loaded with /memory.", "C": "The files are loaded and concatenated in the order managed policy → user → project, and the organization's policy cannot be excluded.", "D": "Specifying the managed policy's path in claudeMdExcludes lets an individual exclude the organization's policy in their own environment."}}, {"id": "CCDV-F-Udemy2-0023", "question": "A logistics company wants to embed Claude into its shipment routing backend service and run it automatically at scale.\nWhich is the most appropriate choice of interface for using Claude (direct API/SDK use, Claude Code, or Claude Desktop/claude.ai)?", "choices": {"A": "Connect an MCP server for the internal systems to Claude Desktop, and have it execute routing on staff instructions.", "B": "Keep Claude Code running on a server in interactive mode, and have the backend feed it input for processing.", "C": "Have staff paste shipment data into the claude.ai chat screen, and transcribe the results into the business system.", "D": "Call the Claude API from the backend code with the Client SDK, and integrate it into the routing process."}}, {"id": "CCDV-F-Udemy2-0024", "question": "A music streaming app is adding a feature in which Claude summarizes and classifies reviews and track descriptions that users post freely (user-generated content).\nWhich are appropriate design considerations when handling user-generated content? (Select TWO.)", "choices": {"A": "Treat posts as untrusted input, pass them separately from the system instructions, and do not let Claude follow instructions inside the posts.", "B": "Handle post moderation reactively after reports are received, and run summarization and classification without any prior checks.", "C": "Concatenate the post text directly into the system prompt, passing it in the same context as the operator's instructions.", "D": "Set max_tokens to a small value to reduce the room for instructions embedded in posts to produce long outputs.", "E": "Screen posts, for example with pre-classification by a lightweight model, to detect and remove personal information and inappropriate content."}}, {"id": "CCDV-F-Udemy2-0025", "question": "A real estate company automatically generates property descriptions with Claude, but the level of detail and the tone of the output are inconsistent.\nWhich is the most appropriate way to clarify the instructions and refine them iteratively?", "choices": {"A": "Keep rewriting and testing the prompt until a good output appears, and adopt the wording at the point a satisfying output appears for production.", "B": "Treat the inconsistency in detail and tone as a lack of model capability, and start by considering a switch to a higher-tier model.", "C": "Prepare success criteria and evaluations that measure them first, then improve the prompt by adding specific instructions and examples while checking the results.", "D": "Constrain the output's level of detail and tone with prohibitions, adding instructions to the prompt that list \"do not ...\" items."}}, {"id": "CCDV-F-Udemy2-0026", "question": "A game studio wants to run long-running, asynchronous agents in production. However, it does not have the capacity to operate its own sandbox and session state infrastructure.\nWhich option most appropriately describes a deployment model suited to this situation and its characteristics?", "choices": {"A": "Run the Agent SDK in the company's own containers, and operate the session state and sandboxes in-house.", "B": "Build the loop with the Messages API and the Client SDK's tool runner, and provide the execution environment on the company's own servers.", "C": "Use Claude Managed Agents, and leave the operation of the agent loop and sandbox to Anthropic.", "D": "Run the Claude Code CLI non-interactively with the -p option, and launch it periodically from the company's job scheduler."}}, {"id": "CCDV-F-Udemy2-0027", "question": "A university's research support agent needs to retain insights gained partway through long-running research tasks across many steps. In addition, the team wants to carry those insights over to the next session after a session ends.\nWhich best describes agent memory patterns?", "choices": {"A": "Accumulate the insights in the conversation history, and carry them over by resending the same entire history in the next session.", "B": "Cache the conversation history with prompt caching, and read the insights from the cache in the next session.", "C": "Delegate the research to a subagent, have the subagent's context retain the insights, and have it reference them again next time.", "D": "Keep in-progress working notes in the context, and write the insights to be carried over to an external store such as files."}}, {"id": "CCDV-F-Udemy2-0028", "question": "A retail chain wants to automate a process that generates an inventory report every week using the same procedure. The steps are always the same and proceed in the following order:\nRetrieve sales data\nAggregate by store\nCreate a summary with Claude\nFormat it into the prescribed format\nWhich approach is most appropriate for this process?", "choices": {"A": "Classify the data by store size and format, and route it to summarization prompts prepared for each category.", "B": "Have Claude look at each week's sales data and proceed while deciding the necessary aggregations and processing order each time.", "C": "Call each step in a fixed order defined in code, passing the output of the previous step to the next.", "D": "Generate the per-store summaries in parallel, and have an evaluator LLM score them and have them rewritten until they meet the criteria."}}, {"id": "CCDV-F-Udemy2-0029", "question": "A shipping company is building a Claude app that extracts data from bills of lading and arrival notices. Because the extraction results are fed directly into a downstream core system, the app must return a JSON object containing only the specified fields, without any preamble or closing text.\nWhich prompt design most reliably enforces the output format?", "choices": {"A": "Set a closing brace in stop_sequences so that output generation is cut off when the JSON closes.", "B": "Show the expected JSON structure and an example output, and instruct in positive terms to return only JSON with no preamble.", "C": "List the styles to avoid in the instructions, such as \"Do not write a preamble\" and \"Do not add explanations.\"", "D": "Set max_tokens just large enough for the JSON, leaving no room for text before or after it."}}, {"id": "CCDV-F-Udemy2-0030", "question": "A property and casualty insurer is planning a Claude assistant to support first-line handling of accident claim intake. During requirements definition, the departments raised the following requirements:\nDisplay candidate responses within 2 seconds (call center department)\nCite and show the relevant policy clause in every response (compliance department)\nKeep monthly costs within the current budget (IT department)\nTesting showed that it is difficult to fully satisfy all three at the same time.\nWhich is the most appropriate way to finalize the requirements?", "choices": {"A": "Prioritize the requirements of the department with the most senior executive, and record the remaining requirements as items for consideration in the next phase.", "B": "Agree on priorities in a cross-departmental meeting, and let the development team decide the acceptance criteria as implementation proceeds.", "C": "Present the business rationale and trade-offs of each requirement, and agree with stakeholders on priorities and acceptance criteria.", "D": "Have the development team adopt requirements in order of technical ease, and notify each department of the decisions after the fact."}}, {"id": "CCDV-F-Udemy2-0031", "question": "A bank's risk analysis app uses a model with extended thinking enabled that performs multi-step reasoning while using tools.\nWhich statement correctly describes how thinking blocks are handled in the API?", "choices": {"A": "Keep thinking enabled while specifying a particular tool with tool_choice to force it to be called every time.", "B": "Treat thinking tokens as non-billable, and exclude responses containing long reasoning from cost estimates.", "C": "When returning tool results, send the preceding thinking block unmodified along with the tool_result.", "D": "When returning tool results, delete the thinking block from the previous response and send only the tool_result."}}, {"id": "CCDV-F-Udemy2-0032", "question": "An e-commerce service operates a Claude-integrated app across three environments: development, staging, and production.\nWhen managing configuration with settings.json and environment variables (env), which policy properly separates the settings for each environment?", "choices": {"A": "Commit shared settings in settings.json, put environment-specific differences in env, and put personal overrides in settings.local.json.", "B": "Embed configuration values such as endpoints and model names as constants in the app code, and build separately for each environment.", "C": "Write configuration values, including API keys, into separate per-environment settings.json files, and commit all three files to Git.", "D": "Share and commit a single settings.json across all environments, and have operators manually edit production-specific values when an incident occurs."}}, {"id": "CCDV-F-Udemy2-0033", "question": "A power company has Claude summarize large volumes of equipment inspection logs. Requests for long responses with a large max_tokens occasionally time out.\nWhat is the most appropriate countermeasure against timeouts for long-running responses?", "choices": {"A": "Upload the inspection logs to the Files API and send the request containing only the file_id.", "B": "Stay with non-streaming, increase the SDK timeout and max_retries, and have the same request resent.", "C": "Use stream: true to receive the response incrementally as SSE, receiving the long generation while keeping the connection open.", "D": "Cache the inspection logs as a common prefix with prompt caching to shorten request processing time."}}, {"id": "CCDV-F-Udemy2-0034", "question": "An online travel agency (OTA) app bundles a long inquiry thread and itinerary data and passes them to Claude in a single request.\nWhich most accurately describes the behavior when the context window is exceeded?", "choices": {"A": "If the input alone exceeds the limit, a 400 error is returned; if only the sum of the input and max_tokens exceeds it, generation stops at the limit.", "B": "If the input exceeds the limit, the API automatically deletes messages starting from the oldest and responds using the remaining history.", "C": "If the input exceeds the limit, the excess is automatically split into a separate request, and the responses are combined and returned later.", "D": "Specifying a larger max_tokens expands the context window by the same amount, so long inputs are accepted."}}, {"id": "CCDV-F-Udemy2-0035", "question": "An insurance company's development team is building a claims review support tool with Claude Code. They want to provide routine tasks as their own slash commands.\nWhich best describes the relationship between built-in commands and custom skills (slash commands)?", "choices": {"A": "Only custom skills placed in ~/.claude/skills/ are active; the project's .claude/skills/ is not loaded.", "B": "Separately from built-in commands such as /help, you can add your own /<name> with .claude/skills/<name>/SKILL.md.", "C": "Custom commands can only be placed in .claude/commands/; SKILL.md files in .claude/skills/ are for Claude's reference only.", "D": "Custom skills run only when the user invokes them with /<name>; they are never loaded automatically based on their description."}}, {"id": "CCDV-F-Udemy2-0036", "question": "An insurance company runs a Claude pipeline that processes insurance claim documents in the following six stages:\nLoad OCR text\nExtract fields\nMatch against the policy\nGenerate assessment notes\nRegister in the core system\nSend notifications\nIn one overnight batch, after stages 1–3 completed and saved their results, stage 4 (assessment note generation) returned HTTP 529 overloaded_error and processing stopped.\nWhich recovery strategy is most appropriate?", "choices": {"A": "Reuse the saved results of stages 1–3 and resume processing by retrying from stage 4 with backoff.", "B": "Treat the 529 as a permanent failure, abort the job, and ask staff to rerun it manually the next day.", "C": "Treat the 529 as a failure caused by invalid input, correct what is passed to stage 4, and then rerun all stages from the beginning.", "D": "Rerun the entire pipeline from the beginning, redoing the processing of stages 1–3 and saving their results again."}}, {"id": "CCDV-F-Udemy2-0037", "question": "A local government is building a service that accepts inquiries from residents. Claude returns a JSON object with category, priority, and needs_followup, and the backend routes requests based on those values.\nThe team has enabled structured outputs (json_schema), but a senior engineer argues that defensive parsing is still needed on the application side.\nWhich is the most appropriate approach and implementation?", "choices": {"A": "Enable structured outputs, remove the application-side validation, and use the returned values as-is.", "B": "Check stop_reason, then validate the required keys and types, and route responses that fail validation to human review.", "C": "Add an instruction at the end of the output for Claude to review its own JSON, and use that in place of application-side validation.", "D": "Retry the same request repeatedly until the output parses as JSON, and use the first parseable result as-is."}}, {"id": "CCDV-F-Udemy2-0038", "question": "A renewable energy company uses Claude to summarize wind turbine maintenance logs and compile figures such as failure counts and downtime into findings. Engineers make decisions based on those figures, but Claude sometimes confidently presents figures that do not exist in the original logs.\nWhat is the most effective design for guarding against confident but incorrect output?", "choices": {"A": "Switch to a higher-tier model, and adopt the figures for which the model shows high confidence directly as findings for engineers.", "B": "Instruct Claude in the system prompt to answer assertively, reducing ambiguous wording and hedging.", "C": "Have Claude extract the figures from the logs verbatim as evidence, allow it to say \"I don't know\" when unsure, and have it verify its claims with quotes.", "D": "Set effort high to deepen thinking, and have Claude trace how each figure was derived more carefully, one by one."}}, {"id": "CCDV-F-Udemy2-0039", "question": "A weather service operates a Claude agent that has a tool for issuing severe weather warnings to the public (the warnings are distributed to the general public). Because the cost of a false warning is high, they want Claude to draft and propose warnings but want to avoid having it issue them autonomously.\nWhich is the correct human-in-the-loop approval pattern?", "choices": {"A": "Specify the warning tool with tool_choice on every request, so that Claude calls the warning tool every time.", "B": "Define the warning distribution process as a server tool, and have Anthropic perform the approval and distribution.", "C": "Instruct Claude in the system prompt to ask the user for confirmation before distribution, and have it comply.", "D": "In the warning tool's handler, route the proposal to human review instead of distributing it, and have the app distribute it after approval."}}, {"id": "CCDV-F-Udemy2-0040", "question": "A software maintenance company is developing a feature that uses the Messages API to have Claude modify customers' configuration files. For this feature, they adopted the text editor tool whose schema is defined by Anthropic (text_editor_20250728).\nWhich statements correctly describe integrating this tool? (Select TWO.)", "choices": {"A": "Viewing and editing of files are executed on Anthropic's infrastructure, and the results are returned directly in the response.", "B": "Commands such as view and str_replace are executed by the application, and the results are returned as tool_result.", "C": "Upload the files to be edited to the Files API in advance, and pass their file_id to the tool to have them edited.", "D": "The tool definition only needs type and name; you do not need to write input_schema yourself.", "E": "Extend the tool's behavior by adding commands and arguments to input_schema to suit your own use case."}}, {"id": "CCDV-F-Udemy2-0041", "question": "A real estate portal implements its own agent loop on top of the Messages API. With the web search server tool enabled, it has Claude research the latest information on redevelopment plans and transit near properties.\nFor requests with a broad research scope, the response's stop_reason is pause_turn and the answer stops partway through.\nWhat is the most appropriate way for the harness to handle this?", "choices": {"A": "Create a tool_result for each server_tool_use block and return them as the next user message to continue processing.", "B": "Treat pause_turn as a transient error and retry the same request with exponential backoff with jitter.", "C": "Append the returned assistant response to the conversation as-is, and send the request again with the same tool definitions to generate the continuation.", "D": "Raise max_tokens and resend the same request from the beginning so that the research completes in a single response."}}, {"id": "CCDV-F-Udemy2-0042", "question": "A recruiting SaaS company receives new-application webhooks from a partner's applicant tracking system (ATS) and screens résumés with Claude for each event.\nWhat is the most appropriate basic design for an event-driven webhook receiving endpoint?", "choices": {"A": "Return 2xx immediately on receipt and process asynchronously via a queue, verifying the signature and deduplicating by event ID.", "B": "Verify the request signature, but screen redelivered events as new applications every time.", "C": "Return 2xx immediately on receipt and process via a queue, relying on an IP address allowlist alone to verify the sender.", "D": "Call Claude synchronously within the webhook handler and return the screening result in the response body."}}, {"id": "CCDV-F-Udemy2-0043", "question": "A hospital is building an agent with the Claude Agent SDK that reads patient records. They want to allow the agent only to view records and make it completely unable to modify or delete files.\nWhat is the most appropriate way to restrict permissions?", "choices": {"A": "Write \"Do not modify or delete files\" in the system prompt and have the agent follow it as a working policy.", "B": "Allow read-only tools with allowed_tools and exclude write tools with disallowed_tools.", "C": "Allow all tools with allowed_tools, and log each tool's execution with a PostToolUse hook for after-the-fact auditing.", "D": "Set permission_mode to acceptEdits to auto-approve edits, and record the changes in a work log."}}, {"id": "CCDV-F-Udemy2-0044", "question": "An automaker is about to deploy to production a Claude agent that queries a production scheduling API and reads a parts database. The security department requires secure by design.\nFrom the standpoint of least privilege and IAM, which policy is most appropriate?", "choices": {"A": "Give the agent an Admin API key with organization administrator privileges so that it can call any API without permission errors.", "B": "Specify the resources it may access in the system prompt so that it does not touch resources outside the task.", "C": "Share a single API key across development, staging, and production so that rotation is done in one place.", "D": "Scope the agent's key to only what is needed, separate environments with workspaces, and audit key usage."}}, {"id": "CCDV-F-Udemy2-0045", "question": "A consulting firm continuously improves the prompts it uses for report generation. Switching to a new prompt sometimes degrades output quality. When that happens, they want to revert immediately.\nWhich policy for prompt versioning and rollback is most appropriate?", "choices": {"A": "Edit prompts directly in the production settings screen, and have the editor keep the previous content in personal notes.", "B": "Version-control the prompts and pin the production version, and when quality degrades, roll back to a version that performed well.", "C": "When quality drops, rewrite the prompt on the spot while looking at the evaluation results and push it to production.", "D": "Have Claude automatically generate the prompt on every run, and adopt the ones that produced good results."}}, {"id": "CCDV-F-Udemy2-0046", "question": "A research firm runs a research agent built on the Claude Agent SDK in a container. The agent fetches and summarizes external web pages and can also read internal customer materials.\nEven if an injection via hidden instructions embedded in a fetched page succeeds, they want a structural safeguard that prevents internal data from being sent to arbitrary external servers.\nWhat is the most appropriate countermeasure?", "choices": {"A": "Log each tool's execution with a PostToolUse hook and periodically audit for traces of outbound transmission.", "B": "Cut off the container's network and allow external connections only through a proxy that relays to allowed domains.", "C": "Prohibit sending data externally in the system prompt, and instruct the agent to treat fetched pages as untrusted data.", "D": "Pre-screen fetched pages with a lightweight model and remove content suspected of injection before passing it to the agent."}}, {"id": "CCDV-F-Udemy2-0047", "question": "An accounting firm uses a Claude agent to run a long-running reconciliation task across multiple ledgers. However, when the conversation approaches the context window limit, the work can no longer continue.\nWhich context management policy is most appropriate for keeping long-running tasks going?", "choices": {"A": "Make the conversation history a target of prompt caching, and continue by excluding the cached portion from the limit calculation.", "B": "Replace older exchanges with a summary on the server side and continue working beyond the limit.", "C": "Estimate the input with the token counting API, and start a new conversation from scratch when the limit is approached.", "D": "Switch to a model with a 1M-token context window and continue working while retaining the full history."}}, {"id": "CCDV-F-Udemy2-0048", "question": "A chemical manufacturer's app exchanges safety data sheet fields as structured data between Claude and internal systems.\nWhat is the most appropriate policy for designing input/output schemas that cross boundaries as \"contracts\"?", "choices": {"A": "Show only a list of field names in the prompt, and leave decisions about types and required fields to each receiving implementation.", "B": "Use a JSON Schema that defines each field's type and whether it is required as the contract, and validate outputs and inputs against that definition.", "C": "Have Claude write findings in free text, and have the receiver extract the fields with regular expressions and register them in the internal systems.", "D": "Remove schema validation and operate provisionally whenever requirements change, and rebuild the schema once the specification settles."}}, {"id": "CCDV-F-Udemy2-0049", "question": "A logistics company releases a Node.js service every month that depends on multiple npm packages, including the Claude SDK. In package.json, dependencies are specified as ^ ranges.\nAn incident investigation revealed that the versions of some dependency packages differed between the build that passed regression evaluation in staging and the build later rebuilt for production.\nWhat is the most appropriate way to reproduce the same dependency tree across environments?", "choices": {"A": "Change the range specifiers in package.json from ^ to ~, and align versions by pulling in the latest patch versions with npm install in each build.", "B": "Add p
