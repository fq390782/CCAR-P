, and clearing stale tool results does the same for agents. Dropping all history forgets the customer's problem. `max_tokens` limits the output, not the window. The system prompt carries the rules the assistant needs."}, {"id": "CCDV-F-PatrickWiloak-0042", "question": "A request turns on manual extended thinking (`thinking: {type: \"enabled\", budget_tokens: 8000}`) and sets `tool_choice` to force a specific tool. The API rejects it with a 400 error. What is the cause?", "choices": {"A": "Tools cannot be defined at all on a request that has thinking turned on", "B": "The forced tool's name is longer than the API allows for a tool definition", "C": "Manual extended thinking only accepts `tool_choice` of `auto` or `none`", "D": "Requests that combine thinking with tools must go through the Batches API"}, "explanation": "With manual extended thinking, forcing a tool (`any` or a named `tool`) is incompatible because it would skip the thinking step, so only `auto` (the default) and `none` are accepted. Tools work fine with thinking under `auto`; to steer the model toward a tool, say in the prompt when to use it. Adaptive thinking is different: it accepts forced tool use on most models (the response then starts with the tool call and has no thinking block), though the newest models such as Claude Opus 5.5 and Sonnet 5.5 reject forced tool use on every request. Name length and the Batches API are unrelated to this error."}, {"id": "CCDV-F-PatrickWiloak-0043", "question": "A front-end developer put the Anthropic API key in browser JavaScript to call the API directly from a web page.", "choices": {"A": "Rotate the key and move the calls to a backend that holds it", "B": "Obfuscate the JavaScript so the key is harder to read", "C": "Keep the key in the page but restrict it to the company's IP range in the code", "D": "Store the key in the browser's local storage instead of the source file"}, "explanation": "Anything shipped to the browser can be read by users, so the key is already compromised and must be rotated, and calls must go through a server that keeps the secret. Obfuscation and local storage still deliver the key to the client. A check written in client-side code can be bypassed by anyone with the key."}, {"id": "CCDV-F-PatrickWiloak-0044", "question": "A developer wants Claude Code to auto-approve a few commands on their own machine without changing the permissions their teammates get from the repository.", "choices": {"A": "Edit the team's `.claude/settings.json` and commit it", "B": "Add the commands to the project `CLAUDE.md`", "C": "Ask every teammate to accept the same prompts each session", "D": "Put the allow rules in `.claude/settings.local.json`"}, "explanation": "`.claude/settings.local.json` holds personal project settings and is git-ignored, so the change stays on one machine. `.claude/settings.json` is shared and would change everyone's permissions. `CLAUDE.md` is guidance, not permission configuration. Asking teammates to change their behaviour is not a settings change at all."}, {"id": "CCDV-F-preporato-0001", "question": "A chatbot sends only the newest user message to the API on each turn. Users complain that it forgets what they said two messages earlier. What fixes this?", "choices": {"A": "Raise `max_tokens`", "B": "Switch to a model with a larger context window", "C": "Enable prompt caching so earlier turns are remembered", "D": "Send the conversation history, alternating user and assistant turns, with every request"}, "explanation": "The Messages API is stateless: the history you send is the model's entire memory of the conversation (D). Caching (C) makes repeated prefixes cheaper and faster, and it only applies to content you actually send. `max_tokens` (A) limits output length. A larger window (B) is useless when the earlier turns are never included."}, {"id": "CCDV-F-preporato-0002", "question": "Which `stop_reason` tells you the response ended because it filled the model's context window, as opposed to hitting the `max_tokens` value you set?", "choices": {"A": "`pause_turn`", "B": "`model_context_window_exceeded`", "C": "`end_turn`", "D": "`max_tokens`"}, "explanation": "B means the response ran into the model's context window limit. D means it hit your own `max_tokens` cap. A means a server-side tool loop paused and should be continued, and C means Claude finished naturally. The first two both mean the output may be incomplete and shouldn't be parsed as a finished answer."}, {"id": "CCDV-F-preporato-0003", "question": "Which TWO problems does streaming solve? (Select TWO)", "choices": {"A": "Rate-limit errors during traffic peaks", "B": "High token prices on long outputs", "C": "Users waiting several seconds for the first words of a chat reply", "D": "Answers that contain factual errors", "E": "HTTP timeouts on requests with very large `max_tokens` values"}, "explanation": "Streaming sends tokens as they're generated, which shortens perceived latency (C) and keeps long-running requests alive instead of waiting on one large response (E). It doesn't change token pricing (B), accuracy (D) or rate limits (A)."}, {"id": "CCDV-F-preporato-0004", "question": "Your app sends a different subset of 30 tools on each request depending on the user's plan, and the order of the tool list varies between requests. The system prompt is identical every time, yet the cache hit rate is near zero. Why?", "choices": {"A": "The system prompt must be placed before the tools to be cached", "B": "Requests that include tools can't be cached", "C": "Tools come first in the cache prefix, so any change to the tool list or its order invalidates everything after it, including the system prompt; send a stable, consistently ordered tool list per plan", "D": "The 5-minute cache lifetime is too short and needs the 1-hour option"}, "explanation": "The cache is a prefix match in a fixed order (tools, then system, then messages), so a changing tool list breaks the prefix at its very start (C). The order of those sections isn't yours to choose (A), tools are cacheable (B), and a longer lifetime (D) doesn't help a prefix that never repeats."}, {"id": "CCDV-F-preporato-0005", "question": "You add `cache_control` to a 600-token system prompt on a model whose minimum cacheable length is 1,024 tokens. Both `cache_creation_input_tokens` and `cache_read_input_tokens` stay at 0, and the API returns no error. What is happening?", "choices": {"A": "The prefix is below the model's minimum cacheable length, so the request is processed without caching and no error is raised", "B": "The cache expired between requests", "C": "The API needs a beta header to enable caching", "D": "`cache_control` only works in batch requests"}, "explanation": "Prompts shorter than the model's minimum cacheable length are processed normally without caching, and the API doesn't report an error, which is why checking the usage fields matters (A). Caching works for regular requests (D). An expired cache (B) would still show cache_creation tokens when the entry is written again. No beta header is needed (C)."}, {"id": "CCDV-F-preporato-0006", "question": "A nightly batch of 5,000 requests shares a 20,000-token system prompt. Batches can take longer than five minutes to process. How should prompt caching be set up?", "choices": {"A": "Mark the shared prefix with the 1-hour cache duration and accept its higher write price for better hit rates across the batch", "B": "Put the system prompt after the messages so it caches last", "C": "Skip caching, because it can't be combined with batches", "D": "Keep the default 5-minute duration, since it's always the cheapest option"}, "explanation": "Anthropic's documentation recommends the 1-hour duration for batches because their requests can be processed over a longer window, and cache hits on batches are best-effort (A). With the 5-minute default (D), entries can expire between requests. Caching does work with batches (C). The system prompt's position in the request (B) is fixed."}, {"id": "CCDV-F-preporato-0007", "question": "Your batch job writes results to the database in the order they come back, pairing each with the input at the same position. Some records end up with another record's classification. Why?", "choices": {"A": "The batch expired before all requests finished", "B": "Results are only kept for 29 days", "C": "Batch results can come back in any order; match each result to its request by `custom_id`", "D": "Sampling makes the classifications non-deterministic"}, "explanation": "Results aren't guaranteed to follow request order, which is why every request carries a `custom_id` (C). An expired batch (A) produces 'expired' results, which wouldn't swap labels between records. Non-determinism (D) can change a label but doesn't explain systematic mismatches. Retention (B) is unrelated."}, {"id": "CCDV-F-preporato-0008", "question": "A downstream parser broke after your model outputs changed format overnight. Nobody touched the code. Which TWO practices prevent this kind of silent change? (Select TWO)", "choices": {"A": "Pin a specific model version in production and upgrade on purpose after running evals", "B": "Keep prompts under version control (or in a prompt registry) and run evals before changing them", "C": "Edit prompts directly in production for speed", "D": "Always call the newest model alias to pick up improvements", "E": "Add retries around the parser"}, "explanation": "Pinning (A) keeps model behavior fixed until you choose to move, and versioned prompts (B) make every behavior change reviewable and revertible. A floating alias (D) and direct production edits (C) are how silent changes happen. Retries (E) repeat the same broken output."}, {"id": "CCDV-F-preporato-0009", "question": "A receipt-processing app sends 4,000 x 3,000-pixel phone photos. Latency is high, and tests show accuracy holds at lower resolution. What should change?", "choices": {"A": "Send the receipts through the Batch API", "B": "Convert the images to base64 text and paste them into the prompt", "C": "Place the image after the question in the message", "D": "Resize the images in the app before upload; oversized images are scaled down on Anthropic's side anyway, which adds latency, and image tokens grow with pixel area up to the model's limit"}, "explanation": "Each model has a maximum native resolution, and larger images are downscaled before processing, so sending them full-size costs upload time and latency without adding detail (D). Base64 (B) is the normal transport for images and changes nothing about their size. Batch (A) trades latency for price, the wrong direction here. Placement (C) has a small effect on quality, and Anthropic recommends putting images before the text."}, {"id": "CCDV-F-preporato-0010", "question": "Before launch, you need to know whether a 180-page contract plus your instructions fits in the model's context window, and what each request will cost. What is the best approach?", "choices": {"A": "Send the request and see whether it fails", "B": "Call the token counting endpoint with the exact request (system prompt, tools and messages)", "C": "Estimate four characters per token", "D": "Ask Claude how many tokens the contract contains"}, "explanation": "The token counting endpoint measures the request exactly as the model will receive it (B). A rule of thumb (C) can be far off, especially with tables, code or non-English text. Trial and error (A) costs money and tells you nothing until it fails. Claude can't reliably count its own input tokens (D)."}, {"id": "CCDV-F-preporato-0011", "question": "A team's monthly API bill doubled, and evals show quality is fine. Which TWO levers should they try before downgrading the model tier? (Select TWO)", "choices": {"A": "Move all traffic to the fast tier today", "B": "Trim context: drop stale tool outputs and history the model no longer needs", "C": "Cache the stable prefix (tools and system prompt)", "D": "Send all traffic, live chat included, through the Batch API", "E": "Raise `max_tokens` so fewer responses get cut off"}, "explanation": "Trimming (B) and caching (C) cut cost without touching the model, so they come before a tier change, which should only happen with eval evidence (A). Batch (D) fits only work nobody is waiting for. A higher `max_tokens` (E) can raise spend."}, {"id": "CCDV-F-preporato-0012", "question": "A coding agent on a model that supports the effort parameter works well but runs slowly and uses many tokens on routine refactors. Evals show quality holds at a lower effort level for those tasks. What should change?", "choices": {"A": "Switch to a smaller model without testing it", "B": "Set `max_tokens` to 512 for every request", "C": "Lower `output_config.effort` for routine refactors and keep a higher level for hard tasks", "D": "Turn on extended thinking with a large budget"}, "explanation": "Effort controls how many tokens Claude spends across the whole response, thinking and tool calls included, without changing models, and the evals already show the lower level holds (C). A skips the evidence step. A hard cap (B) truncates work midway. More thinking (D) adds tokens and latency, the opposite of the goal."}, {"id": "CCDV-F-preporato-0013", "question": "A team enabled extended thinking on every request, including one-line greetings in their chatbot. Latency and cost rose, with no measurable quality gain on those replies. What is the best response?", "choices": {"A": "Raise the thinking budget further", "B": "Decide per workload: keep deeper reasoning where evals show gains on multi-step problems, and reduce it for simple turns", "C": "Turn thinking off everywhere", "D": "Move to the most capable model"}, "explanation": "Thinking buys accuracy on multi-step problems and costs output tokens and latency everywhere else, so it's a per-workload choice backed by evals (B). C gives up the gains where they exist. A and D spend more on replies that didn't need it."}, {"id": "CCDV-F-preporato-0014", "question": "Your test suite checks that the model's summary exactly equals a stored 'golden' string, and the tests keep flaking. What is a better approach?", "choices": {"A": "Assert on structure and key facts (schema validity, required fields, the figures that must appear) or grade against a rubric", "B": "Retry each test until it matches", "C": "Delete the flaky tests", "D": "Set temperature to 0 and keep exact string matching, since that makes outputs fully deterministic"}, "explanation": "Sampled outputs vary between runs, so tests should check what matters about an output instead of its exact wording (A). A temperature of 0 (D) reduces variation and still doesn't guarantee identical text. Retrying until a pass (B) hides real regressions, and deleting tests (C) removes the safety net."}, {"id": "CCDV-F-preporato-0015", "question": "An autocomplete feature must return short suggestions within a few hundred milliseconds, and the quality bar is modest. Which setup fits?", "choices": {"A": "A top-tier model with extended thinking", "B": "A balanced-tier model with `max_tokens` of 32,000", "C": "The Batch API", "D": "A fast-tier (Haiku-class) model with streaming and a small `max_tokens`"}, "explanation": "Latency-critical, high-volume, bounded tasks are the fast tier's case (D). A adds the most latency of all the options. Batch (C) is asynchronous. B misses the latency target, and a huge output budget is pointless for short suggestions."}, {"id": "CCDV-F-preporato-0016", "question": "A team wants an autonomous agent to convert CSV exports into a fixed JSON layout. The column mapping never changes. What is the best approach?", "choices": {"A": "An Agent SDK agent with file tools", "B": "A manager agent with three subagents", "C": "A deterministic script, or a single model call with a schema if some fields need interpretation, with no agent loop", "D": "An orchestration framework with a state graph"}, "explanation": "Apply the four-question test: the task isn't complex, its path is fully known, and code can avoid errors cheaply, so autonomy only adds cost and unpredictability (C). A, B and D each add machinery the problem doesn't need."}, {"id": "CCDV-F-preporato-0017", "question": "Which TWO things does the Claude Agent SDK give you that you would otherwise build yourself in a custom loop? (Select TWO)", "choices": {"A": "A visual drag-and-drop workflow designer", "B": "Automatic fine-tuning on your traces", "C": "Context management, plus hooks and permissions for deterministic control", "D": "The agent loop with built-in tools for files, shell commands and search", "E": "A hosted vector database for retrieval"}, "explanation": "The Agent SDK packages the same harness Claude Code runs on: the loop and built-in tools (D), plus context management, hooks, permissions and subagents (C). It doesn't host a vector database (E), fine-tune models (B) or provide a visual designer (A)."}, {"id": "CCDV-F-preporato-0018", "question": "A bank's agent must keep all code execution and data inside its own network for data-residency rules. A startup wants the fastest path to production. Which deployment fits each?", "choices": {"A": "Managed for the bank, self-hosted for the startup", "B": "Self-hosted for the bank, managed for the startup", "C": "Self-hosted for both", "D": "Managed for both"}, "explanation": "Residency and custom-runtime requirements point to self-hosted execution, and speed to production points to a managed deployment where the provider runs the loop and the sandbox (B). D puts the bank's data outside its network. C slows the startup down for a requirement it doesn't have. A reverses both."}, {"id": "CCDV-F-preporato-0019", "question": "An agent must summarize 12 long PDFs independently, then write a comparison across them. The single-agent version runs out of context. What is the best design?", "choices": {"A": "One agent reads all 12 PDFs in sequence in a single context", "B": "Twelve agents that send their findings to each other directly", "C": "Raise `max_tokens` on the single agent", "D": "An orchestrator gives each PDF to a subagent with its own context, runs them in parallel, and writes the comparison from their summaries"}, "explanation": "The summaries are independent subtasks, so isolated subagent contexts fit, and only compact reports return to the orchestrator (D). A is the design that already failed. `max_tokens` (C) limits output, and the problem is input. Agents talking to each other directly (B) remove the coordinator that merges results and isolates failures."}, {"id": "CCDV-F-preporato-0020", "question": "You pass a 50-page contract and ask detailed questions about it. Answers sometimes miss relevant clauses. Which prompt structure follows Anthropic's long-context guidance?", "choices": {"A": "The contract first, wrapped in tags such as `<contract>`, then the instructions and question at the end, optionally asking Claude to quote the relevant clauses before answering", "B": "The question first, then the contract", "C": "The contract twice, once before and once after the question", "D": "The question in the middle of the contract"}, "explanation": "Anthropic recommends putting long documents at the top and the query at the end, and reports up to 30% better responses in tests with complex inputs; asking for supporting quotes first also helps Claude focus (A). B and D go against that guidance. C doubles the cost and the noise."}, {"id": "CCDV-F-preporato-0021", "question": "Your code forced JSON output by prefilling the assistant turn with an opening brace. After moving to a newer model, requests with the prefilled last assistant turn return a 400 error. What is the recommended replacement?\n\n```python\nmessages = [\n    {\"role\": \"user\", \"content\": f\"Extract the fields from: {doc}\"},\n    {\"role\": \"assistant\", \"content\": \"{\"},   # prefill\n]\n```", "choices": {"A": "Stay on the older model permanently", "B": "Prefill with an opening square bracket instead", "C": "Add 'respond only in JSON' and extract the first {...} block with a regex", "D": "Structured outputs: send the JSON schema in `output_config.format` and remove the prefill"}, "explanation": "Starting with the Claude 4.6 models, a prefilled last assistant turn is rejected, and Anthropic's migration guidance for format control points to structured outputs (D). B is still a prefill. C goes back to probabilistic formatting with fragile parsing. A blocks every future upgrade."}, {"id": "CCDV-F-preporato-0022", "question": "Which TWO practices make a few-shot prompt for a tricky classification more reliable? (Select TWO)", "choices": {"A": "Examples that all share the same label", "B": "Examples wrapped in tags such as `<example>`, clearly separated from the input to classify", "C": "Examples that contradict the instructions, to test robustness", "D": "Fifty near-identical examples", "E": "Two to four varied examples, including one the model should correctly reject"}, "explanation": "A small, varied set with a negative case teaches the boundary (E), and clear separation keeps the model from mixing examples with the real input (B). Near-identical examples (D) and single-label sets (A) teach a narrow pattern. Contradictory examples (C) teach the model to ignore your instructions."}, {"id": "CCDV-F-preporato-0023", "question": "Which statement about server-side tools such as web search is correct?", "choices": {"A": "They're available only through MCP", "B": "They run on Anthropic's infrastructure, so your code doesn't execute them or send `tool_result` blocks for them", "C": "Your application must implement and execute them", "D": "They work only in the Batch API"}, "explanation": "Server tools execute on Anthropic's side, and their results come back inside the response (B). Client tools are the ones your code runs (C). Server tools are declared in the tools parameter like any other tool (A), and they work in regular requests (D)."}, {"id": "CCDV-F-preporato-0024", "question": "Your company's quarterly-report procedure is 12 steps with templates and formatting rules. Teams want Claude to follow it in claude.ai, Claude Code and the API. No new external system is involved. Which mechanism fits?", "choices": {"A": "An MCP server", "B": "A fine-tuned model", "C": "A Skill: packaged instructions and templates that load when the task matches", "D": "A custom tool"}, "explanation": "The need is know-how and workflow steps, which is what Skills package (C). Tools (D) and MCP servers (A) add actions or data access, and nothing here needs a new action or data source. Fine-tuning (B) is heavy machinery for a procedure that fits in a document."}, {"id": "CCDV-F-preporato-0025", "question": "An agent calls `create_shipment` with inputs that sometimes have the wrong type (weight as a string) or miss required fields, which breaks your handler. Which API feature addresses this at the source?", "choices": {"A": "`strict: true` on the tool definition, so tool inputs follow the `input_schema`", "B": "A lower temperature", "C": "A longer tool description", "D": "`tool_choice` set to `auto`"}, "explanation": "Strict tool use applies schema validation to the tool's inputs (A). A better description (C) helps the model pick and fill the tool and still guarantees nothing. `auto` (D) is the default and changes nothing. Temperature (B) affects variation and can't guarantee types."}, {"id": "CCDV-F-preporato-0026", "question": "A research agent reads web pages. One page hides text telling the agent to email the user's files to an outside address, and the agent has a `send_email` tool. Which TWO controls most directly reduce this risk? (Select TWO)", "choices": {"A": "A system-prompt line telling the agent to ignore malicious instructions, as the only defense", "B": "A deterministic gate in code that blocks or holds any action sending data to an external address", "C": "A larger model", "D": "A higher temperature", "E": "Scope tools by least privilege: the research agent gets no `send_email` tool, or outbound email requires human approval"}, "explanation": "Content the agent reads is an untrusted channel, so the strongest controls limit what an injected instruction can do: no dangerous capability (E) and a programmatic check on risky actions (B). A prompt instruction on its own (A) is probabilistic. Model size (C) and temperature (D) aren't security controls."}, {"id": "CCDV-F-preporato-0027", "question": "A developer put the production API key into a system-prompt template in the repository 'so the agent can call internal APIs.' Which TWO steps fix this? (Select TWO)", "choices": {"A": "Rotate the key, and store secrets in environment variables or a secret manager", "B": "Tell the model never to reveal the key", "C": "Base64-encode the key in the template", "D": "Have your tool code authenticate to the internal APIs, so the model never sees the credential", "E": "Move the key to the end of the prompt"}, "explanation": "A key in a repository and a prompt is already exposed, so it gets rotated and stored properly (A), and credentials belong in the code that executes tools, outside the model's context (D). Encoding (C) is trivially reversed, an instruction (B) is probabilistic, and moving the key (E) keeps it in the prompt."}, {"id": "CCDV-F-preporato-0028", "question": "An internal HR assistant answers every employee's questions using one service account that can read all employee records. A junior employee asked about a colleague's salary and got an answer. What is the root fix?", "choices": {"A": "Remove salary data from the HR system", "B": "Add a system-prompt rule: 'Never reveal salaries'", "C": "Filter out responses that contain the word 'salary'", "D": "Run lookups with the calling user's identity and permissions, and log each tool call against that user"}, "explanation": "The shared over-privileged account erased per-user authorization and the audit trail, and acting as the caller restores both (D). B is a probabilistic patch. A breaks legitimate HR work. A keyword filter (C) is easy to get around and blocks legitimate answers."}, {"id": "CCDV-F-preporato-0029", "question": "Which files should hold a team's shared Claude Code permission rules (for example, allowing `Bash(npm run test *)`) and one developer's personal overrides for the same project?", "choices": {"A": "`~/.claude/settings.json` for the team; `.claude/settings.json` for the developer", "B": "`CLAUDE.md` for both", "C": "`.claude/settings.json`, committed, for the team; `.claude/settings.local.json`, gitignored, for the developer", "D": "`.mcp.json` for the team; `CLAUDE.local.md` for the developer"}, "explanation": "The project settings file is shared through version control, and the local settings file holds personal overrides for that project without being committed (C). User-level settings (A) apply to one person across all projects. `CLAUDE.md` files (B, D) hold instructions, while permissions are enforced from settings files, and `.mcp.json` configures MCP servers."}, {"id": "CCDV-F-preporato-0030", "question": "After you add a new tool named `get order status`, every request returns 400 `invalid_request_error`. What is the first move?", "choices": {"A": "Fix the request: tool names may contain only letters, digits, underscores and hyphens, so rename it (for example, `get_order_status`)", "B": "Switch to a different model", "C": "Retry with exponential backoff", "D": "Rewrite the system prompt"}, "explanation": "A 400 is a client error caused by the request itself, and the tool name breaks the documented pattern `^[a-zA-Z0-9_-]{1,128}$` (A). Retries (C) repeat the same invalid request. The model (B) and the prompt (D) play no part in request validation."}]</script>
<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const EN = new Map(JSON.parse(document.getElementById('data_en').textContent).map(d => [d.id, d]));
let lang = 'ko'; try { lang = localStorage.getItem('ccdvf_lang') || 'ko'; } catch (e) {}
const PER = 20, KEY = 'ccdvf_bank_v1';
let state = {}, order = DATA.map((_, i) => i), page = 1;
try { state = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };

const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function md(s) {
  const parts = s.split(/```[a-z]*\n?/);
  return parts.map((p, i) => i % 2 ? '<pre><code>' + esc(p.replace(/\n$/, '')) + '</code></pre>'
    : esc(p).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>')
  ).join('');
}

// 언어별 표시: ko / en / both(병기)
function tx(d, f, k) {
  const g = o => k ? o.choices[k] : o[f], e = EN.get(d.id);
  if (lang === 'en' && e) return md(g(e));
  if (lang === 'both' && e) return md(g(d)) + '<div class="en">' + md(g(e)) + '</div>';
  return md(g(d));
}
// 필터용 선택지
const doms = [...new Set(DATA.map(d => d.domain))].sort();
const srcs = [...new Set(DATA.map(d => d.source_repo))].sort();
const $ = id => document.getElementById(id);
$('dom').innerHTML = '<option value="">전체 분야</option>' + doms.map(d => `<option>${esc(d)} (${DATA.filter(x => x.domain === d).length})</option>`).join('');
$('dom').dataset.vals = JSON.stringify(doms);
$('src').innerHTML = '<option value="">전체 출처</option>' + srcs.map(s => `<option value="${esc(s)}">${esc(s)}</option>`).join('');

function status(d) { const s = state[d.id]; return !s || !s.g ? 'un' : s.ok ? 'ok' : 'ng'; }
function filtered() {
  const kw = $('q').value.trim().toLowerCase();
  const di = $('dom').selectedIndex - 1, dv = di >= 0 ? doms[di] : '';
  const sv = $('src').value, st = $('st').value;
  return order.map(i => DATA[i]).filter(d =>
    (!dv || d.domain === dv) && (!sv || d.source_repo === sv) && (st === 'all' || status(d) === st) &&
    (!kw || (d.question + Object.values(d.choices).join(' ') + d.explanation + (() => { const e = EN.get(d.id); return e ? e.question + Object.values(e.choices).join(' ') + e.explanation : ''; })()).toLowerCase().includes(kw)));
}

function grade(d) {
  const s = state[d.id] || (state[d.id] = {sel: []});
  const a = [...d.answer].sort().join(), b = [...s.sel].sort().join();
  s.g = 1; s.ok = a === b; save(); render();
}
function pick(d, k) {
  const s = state[d.id] || (state[d.id] = {sel: []});
  if (s.g) return;
  if (d.select_count === 1) { s.sel = [k]; grade(d); return; }
  s.sel = s.sel.includes(k) ? s.sel.filter(x => x !== k) : [...s.sel, k];
  save(); render();
}

function card(d, n) {
  const s = state[d.id] || {sel: []}, g = !!s.g;
  const ch = Object.entries(d.choices).map(([k, v]) => {
    let c = 'ch';
    if (g) { if (d.answer.includes(k)) c += s.sel.includes(k) ? ' right' : ' missed'; else if (s.sel.includes(k)) c += ' wrong'; }
    else if (s.sel.includes(k)) c += ' sel';
    return `<button class="${c}" ${g ? 'disabled' : ''} data-id="${d.id}" data-k="${k}"><span class="k">${k}.</span><span>${tx(d, 'choices', k)}</span></button>`;
  }).join('');
  const multi = d.select_count > 1 ? `<span class="tag">${d.select_count}개 선택</span>` : '';
  const res = g ? `<div class="res ${s.ok ? 'ok' : 'ng'}">${s.shown ? '정답 확인 (오답으로 집계)' : s.ok ? '정답입니다' : '오답입니다'} — 정답: ${d.answer.join(', ')}</div><div class="exp">${tx(d, 'explanation')}</div>` : '';
  const acts = g ? `<button data-retry="${d.id}">다시 풀기</button>`
    : (d.select_count > 1 ? `<button class="primary" data-grade="${d.id}" ${s.sel.length ? '' : 'disabled'}>채점</button>` : '') + `<button data-show="${d.id}">정답 보기</button>`;
  return `<div class="q"><div class="meta"><span class="tag">${esc(d.id)}</span><span class="tag">${esc(d.domain)}</span>${multi}</div>
  <div class="qt">${tx(d, 'question')}</div>${ch}${res}<div class="acts">${acts}</div></div>`;
}

function render() {
  const list = filtered(), pages = Math.max(1, Math.ceil(list.length / PER));
  if (page > pages) page = pages;
  const cur = list.slice((page - 1) * PER, page * PER);
  $('list').innerHTML = cur.length ? cur.map(card).join('') : '<div class="empty">조건에 맞는 문제가 없습니다.</div>';
  let p = '';
  for (let i = 1; i <= pages; i++) p += `<button class="${i === page ? 'on' : ''}" data-p="${i}">${i}</button>`;
  $('pager').innerHTML = pages > 1 ? p : '';
  const all = DATA.map(status), done = all.filter(x => x !== 'un').length, ok = all.filter(x => x === 'ok').length;
  $('stats').innerHTML = `<span>전체 ${DATA.length}문항</span><span>표시 ${list.length}문항</span><span>풀이 ${done}</span><span style="color:var(--ok)">정답 ${ok}</span><span style="color:var(--ng)">오답 ${done - ok}</span><span>정답률 ${done ? Math.round(ok / done * 100) : 0}%</span>`;
  $('bar').style.width = (DATA.length ? done / DATA.length * 100 : 0) + '%';
}

document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  const byId = id => DATA.find(x => x.id === id);
  if (t.dataset.k) pick(byId(t.dataset.id), t.dataset.k);
  else if (t.dataset.grade) grade(byId(t.dataset.grade));
  else if (t.dataset.show) { const d = byId(t.dataset.show); state[d.id] = {sel: [...d.answer], g: 1, ok: false, shown: 1}; save(); render(); }
  else if (t.dataset.retry) { delete state[t.dataset.retry]; save(); render(); }
  else if (t.dataset.p) { page = +t.dataset.p; render(); scrollTo(0, 0); }
});
$('lang').value = lang;
$('lang').addEventListener('change', () => { lang = $('lang').value; try { localStorage.setItem('ccdvf_lang', lang); } catch (e) {} render(); });
['q', 'dom', 'src', 'st'].forEach(id => $(id).addEventListener('input', () => { page = 1; render(); }));
$('shuf').onclick = () => { for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; } page = 1; render(); };
$('ord').onclick = () => { order = DATA.map((_, i) => i); page = 1; render(); };
$('rst').onclick = () => { if (confirm('풀이 기록을 모두 지울까요?')) { state = {}; save(); render(); } };
render();
</script>
</body>
</html>
