<svg xmlns="http://www.w3.org/2000/svg" width="940" height="540" viewBox="0 0 940 540" role="img" aria-label="구성 요소별 로드 시점과 작성자: CLAUDE.md는 매 세션 전체, skill은 설명문만 있다가 필요할 때 본문, auto memory는 Claude가 쓰고 앞부분만 로드, subagent는 독립 컨텍스트에서 요약만 반환, hooks는 모델 밖에서 실행" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">
  <title>구성 요소의 로드 시점과 작성자</title>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <defs>
    <marker id="arr-comp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker>
  </defs>
  <text x="470" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F2937">무엇이 언제 컨텍스트에 들어오고, 누가 쓰는가</text>

  <!-- sources -->
  <text x="115" y="66" text-anchor="middle" font-size="11" fill="#6B7280">파일 · 작성자</text>
  <rect x="20" y="80" width="190" height="56" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="115" y="104" text-anchor="middle" font-size="13" fill="#1F2937">CLAUDE.md</text>
  <text x="115" y="123" text-anchor="middle" font-size="11" fill="#6B7280">작성: 사람</text>
  <rect x="20" y="170" width="190" height="56" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="115" y="194" text-anchor="middle" font-size="13" fill="#1F2937">Skills (/이름으로 호출)</text>
  <text x="115" y="213" text-anchor="middle" font-size="11" fill="#6B7280">작성: 사람</text>
  <rect x="20" y="260" width="190" height="56" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="115" y="284" text-anchor="middle" font-size="13" fill="#1F2937">auto memory</text>
  <text x="115" y="303" text-anchor="middle" font-size="11" fill="#6B7280">작성: Claude (정정·선호 기반)</text>

  <!-- main context -->
  <rect x="340" y="46" width="290" height="284" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="485" y="70" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F2937">메인 세션 컨텍스트</text>
  <rect x="360" y="86" width="250" height="44" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="485" y="113" text-anchor="middle" font-size="13" fill="#1F2937">CLAUDE.md 전체</text>
  <rect x="360" y="150" width="250" height="36" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="485" y="173" text-anchor="middle" font-size="13" fill="#1F2937">skill 설명문만 (항상 보임)</text>
  <rect x="360" y="198" width="250" height="44" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="485" y="217" text-anchor="middle" font-size="13" fill="#1F2937">skill 본문</text>
  <text x="485" y="234" text-anchor="middle" font-size="11" fill="#6B7280">길어도 평소 컨텍스트 비용 작음</text>
  <rect x="360" y="262" width="250" height="50" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="485" y="283" text-anchor="middle" font-size="13" fill="#1F2937">auto memory 앞부분</text>
  <text x="485" y="301" text-anchor="middle" font-size="11" fill="#6B7280">200줄 또는 25KB까지</text>

  <line x1="210" y1="108" x2="358" y2="108" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-comp)"/>
  <text x="284" y="100" text-anchor="middle" font-size="11" fill="#6B7280">매 세션 전체 로드</text>
  <line x1="210" y1="186" x2="358" y2="168" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-comp)"/>
  <text x="284" y="168" text-anchor="middle" font-size="11" fill="#6B7280">세션 시작: 설명문</text>
  <line x1="210" y1="212" x2="358" y2="220" stroke="#1F2937" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr-comp)"/>
  <text x="284" y="236" text-anchor="middle" font-size="11" fill="#6B7280">호출·관련 시 본문</text>
  <line x1="210" y1="288" x2="358" y2="288" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-comp)"/>
  <text x="284" y="280" text-anchor="middle" font-size="11" fill="#6B7280">세션 시작 시</text>

  <!-- subagent -->
  <rect x="730" y="70" width="190" height="120" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="825" y="94" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2937">Subagent</text>
  <text x="825" y="116" text-anchor="middle" font-size="11" fill="#6B7280">독립 컨텍스트에서 작업</text>
  <text x="825" y="134" text-anchor="middle" font-size="11" fill="#6B7280">부모 대화 기록 없음</text>
  <text x="825" y="152" text-anchor="middle" font-size="11" fill="#6B7280">(fork형만 이어받음)</text>
  <text x="825" y="174" text-anchor="middle" font-size="11" fill="#6B7280">부를지는 모델이 판단</text>
  <line x1="630" y1="108" x2="728" y2="108" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-comp)"/>
  <text x="679" y="100" text-anchor="middle" font-size="11" fill="#6B7280">작업 위임</text>
  <line x1="728" y1="156" x2="632" y2="156" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-comp)"/>
  <text x="679" y="148" text-anchor="middle" font-size="11" fill="#6B7280">요약만 반환</text>

  <!-- hooks -->
  <rect x="730" y="230" width="190" height="90" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="825" y="254" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2937">Hooks</text>
  <text x="825" y="276" text-anchor="middle" font-size="11" fill="#6B7280">모델 판단 밖에서 실행</text>
  <text x="825" y="294" text-anchor="middle" font-size="11" fill="#6B7280">matcher에 맞으면 매번</text>
  <line x1="630" y1="275" x2="728" y2="275" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-comp)"/>
  <text x="679" y="267" text-anchor="middle" font-size="11" fill="#6B7280">도구 호출 시점</text>

  <!-- plugin -->
  <rect x="20" y="352" width="900" height="60" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="470" y="376" text-anchor="middle" font-size="13" fill="#1F2937">plugin = skills + subagents + hooks + MCP servers를 묶어 설치하는 단위</text>
  <text x="470" y="397" text-anchor="middle" font-size="11" fill="#6B7280">사용자 본인의 권한으로 실행 · MCP 서버 설정 파일은 .mcp.json</text>

  <!-- traps -->
  <rect x="20" y="428" width="900" height="76" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="470" y="450" text-anchor="middle" font-size="13" fill="#1F2937">함정</text>
  <text x="470" y="470" text-anchor="middle" font-size="11" fill="#6B7280">로드 시점을 거꾸로 서술(CLAUDE.md는 항상, skill은 필요할 때) · subagent가 부모 대화를 이어받는다(fork형만)</text>
  <text x="470" y="488" text-anchor="middle" font-size="11" fill="#6B7280">auto memory를 사람이 쓴다(Claude가 씀) · subagent로 "반드시 매번" 보장(모델 판단이라 보장 못 함)</text>

  <!-- legend -->
  <line x1="20" y1="524" x2="60" y2="524" stroke="#1F2937" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="68" y="528" font-size="11" fill="#6B7280">점선: 필요할 때만 로드</text>
</svg>
