<text x="830" y="224.55" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="bold">worker</text>
<text x="830" y="240.85" font-size="11" text-anchor="middle" fill="#6B7280">small · fast</text>
<polyline points="690,136 830,198" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-routing)"/>
<text x="690" y="180" font-size="11" text-anchor="middle" fill="#6B7280">좁고 반복되는 subtask 위임</text>
<rect x="490" y="280" width="400" height="44" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="690" y="306.55" font-size="13" text-anchor="middle" fill="#1F2937">✗ 가장 어려운 단계(계획)에 가장 약한 모델</text>
<rect x="20" y="365" width="430" height="60" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="235" y="390.55" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="bold">✗ 모든 요청에 가장 강한 모델</text>
<text x="235" y="408.55" font-size="13" text-anchor="middle" fill="#1F2937">쉬운 요청에 비용 · latency 낭비</text>
<rect x="470" y="365" width="430" height="60" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="685" y="390.55" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="bold">✗ 모든 요청에 가장 싼 모델</text>
<text x="685" y="408.55" font-size="13" text-anchor="middle" fill="#1F2937">어려운 요청에서 품질 부족</text>
