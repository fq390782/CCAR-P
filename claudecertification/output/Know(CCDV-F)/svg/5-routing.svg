<rect x="144.231" y="173" width="67.7692" height="15" fill="#FFFFFF"/>
<text x="209" y="184" font-size="11" text-anchor="end" fill="#1F2937">쉬움 · 대량</text>
<polyline points="215,215 215,290 268,290" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-routing)"/>
<rect x="133.231" y="276" width="78.7692" height="15" fill="#FFFFFF"/>
<text x="209" y="287" font-size="11" text-anchor="end" fill="#1F2937">어려움 · 소량</text>
