<rect x="630" y="200" width="120" height="56" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="690" y="224.55" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="bold">worker</text>
<text x="690" y="240.85" font-size="11" text-anchor="middle" fill="#6B7280">small · fast</text>
<polyline points="690,136 690,198" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-routing)"/>
