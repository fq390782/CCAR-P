<text x="355" y="310.85" font-size="11" text-anchor="middle" fill="#6B7280">deep analysis</text>
<text x="690" y="62" font-size="14" text-anchor="middle" fill="#1F2937" font-weight="bold">(2) orchestrator – worker</text>
