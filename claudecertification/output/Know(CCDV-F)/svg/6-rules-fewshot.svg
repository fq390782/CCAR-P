<text x="680.0" y="344.3" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="middle">오답: 지시가 이김 / 예시가 이김 / 거부됨</text>
<polyline points="420,332.0 480,332.0" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-rules-fewshot)"/>
