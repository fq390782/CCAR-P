<text x="680.0" y="68.0" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">정확한 출력 예시 3~5개 (&lt;example&gt; 태그)</text>
<text x="680.0" y="85.2" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="middle">+ 긍정형 형식 지정</text>
<text x="680.0" y="100.8" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="middle">오답: neat 요청, 큰 모델, temperature ↑</text>
