<text x="228.0" y="377.5" font-size="11" font-weight="normal" fill="#1F2937" text-anchor="start">아니오</text>
<polygon points="36,386 404,386 420,416.0 404,446 36,446 20,416.0" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
<text x="220.0" y="411.2" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="middle">지식 부족 · latency · 작은 창 문제에</text>
<text x="220.0" y="428.2" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="middle">few-shot?</text>
<rect x="480" y="386" width="400" height="60" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="680.0" y="411.5" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">few-shot이 아님</text>
<text x="680.0" y="428.7" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="middle">형식 · edge-case가 흔들릴 때만 쓴다</text>
<polyline points="420,416.0 480,416.0" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-rules-fewshot)"/>
