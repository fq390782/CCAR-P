<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-label="Files API 업로드 후 file_id 참조 흐름" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">
<title>Files API 업로드 후 file_id 참조 흐름</title>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<defs><marker id="arr-files-api-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker></defs>
<text x="450" y="28" font-size="14" text-anchor="middle" fill="#1F2937" font-weight="bold">같은 PDF·이미지를 여러 번 참조: 한 번 업로드하고 file_id로 참조한다</text>
<rect x="30" y="70" width="150" height="60" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="105.0" y="96.0" font-size="13" text-anchor="middle" fill="#1F2937">PDF / 이미지</text>
<text x="105.0" y="113.0" font-size="11" text-anchor="middle" fill="#6B7280">반복해서 참조할 파일</text>
<rect x="240" y="70" width="160" height="60" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="320.0" y="96.0" font-size="13" text-anchor="middle" fill="#1F2937">Files API 업로드</text>
<text x="320.0" y="113.0" font-size="11" text-anchor="middle" fill="#6B7280">1회, 삭제 전까지 보관</text>
<polyline points="180,100 240,100" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-files-api-flow)"/>
<rect x="188.2" y="79.0" width="43.5" height="18" fill="#FFFFFF"/>
<text x="210" y="92.5" font-size="11" text-anchor="middle" fill="#6B7280">upload</text>
<rect x="460" y="70" width="120" height="60" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="520.0" y="104.5" font-size="13" text-anchor="middle" fill="#1F2937">file_id</text>
<polyline points="400,100 460,100" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-files-api-flow)"/>
<rect x="660" y="50" width="230" height="40" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="775.0" y="74.5" font-size="12" text-anchor="middle" fill="#1F2937">요청 1: source.type: file</text>
<polyline points="580,100 620,100 620,70 660,70" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-files-api-flow)"/>
<rect x="660" y="100" width="230" height="40" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="775.0" y="124.5" font-size="12" text-anchor="middle" fill="#1F2937">요청 2 (다른 턴): source.type: file</text>
<polyline points="580,100 620,100 620,120 660,120" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-files-api-flow)"/>
<rect x="660" y="150" width="230" height="40" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="775.0" y="174.5" font-size="12" text-anchor="middle" fill="#1F2937">요청 N: source.type: file</text>
<polyline points="580,100 620,100 620,170 660,170" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-files-api-flow)"/>
<text x="770" y="210" font-size="11" text-anchor="middle" fill="#6B7280">PDF → document block · 이미지 → image block</text>
<rect x="30" y="240" width="400" height="66" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
<text x="230.0" y="260.5" font-size="13" text-anchor="middle" fill="#1F2937">file_id로 참조해도 문서 토큰은</text>
<text x="230.0" y="277.5" font-size="13" text-anchor="middle" fill="#1F2937">포함될 때마다 input으로 과금</text>
<text x="230.0" y="294.5" font-size="11" text-anchor="middle" fill="#6B7280">안정적인 prefix면 prompt caching과 함께</text>
<rect x="470" y="240" width="410" height="66" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="675.0" y="260.5" font-size="13" text-anchor="middle" fill="#1F2937">base64를 요청 본문에 포함</text>
<text x="675.0" y="277.5" font-size="13" text-anchor="middle" fill="#1F2937">→ 이력에 남아 있는 한 매 턴 다시 전송</text>
<text x="675.0" y="294.5" font-size="11" text-anchor="middle" fill="#6B7280">Bedrock·Google Cloud 경유는 현재 base64만 가능</text>
<rect x="30" y="330" width="400" height="60" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="230.0" y="356.0" font-size="13" text-anchor="middle" fill="#1F2937">이미지 URL을 프롬프트 텍스트로 적기</text>
<text x="230.0" y="373.0" font-size="13" text-anchor="middle" fill="#1F2937">→ Claude가 링크를 열지 않음</text>
<rect x="470" y="330" width="410" height="60" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="675.0" y="356.0" font-size="13" text-anchor="middle" fill="#1F2937">온라인 이미지는 image block의</text>
<text x="675.0" y="373.0" font-size="13" text-anchor="middle" fill="#1F2937">source.type: url로 지정</text>
<polyline points="430,360 470,360" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-files-api-flow)"/>
<rect x="435.0" y="339.0" width="30.0" height="18" fill="#FFFFFF"/>
<text x="450" y="352.5" font-size="11" text-anchor="middle" fill="#6B7280">대신</text>
</svg>
