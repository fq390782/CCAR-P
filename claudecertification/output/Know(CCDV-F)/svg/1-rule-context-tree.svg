<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-label="2장 판단 규칙: 컨텍스트·subagent·state·tool 문제의 정답과 오답" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">
<title>2장 판단 규칙: 컨텍스트·subagent·state·tool 문제의 정답과 오답</title>
