<text x="20" y="30" font-size="14" fill="#1F2937" text-anchor="start" font-weight="bold">컨텍스트·subagent·tool 문제 — 정답과 흔한 오답</text>
<polygon points="170,57.0 320.0,102 170,147.0 20.0,102" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
