<svg xmlns="http://www.w3.org/2000/svg" width="940" height="560" viewBox="0 0 940 560" role="img" aria-label="CI에서 claude -p 실행 흐름: 허가가 필요한 도구는 --allowedTools에 있을 때만 실행되고, 출력은 --output-format json으로 받아 schema 검증 후 파싱한다" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">
  <title>Headless/CI 실행 흐름</title>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <defs>
    <marker id="arr-ci" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker>
  </defs>
  <text x="470" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F2937">무인 실행: 허용은 미리, 출력은 구조화해서</text>

  <!-- start -->
  <rect x="40" y="50" width="220" height="56" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="150" y="74" text-anchor="middle" font-size="13" fill="#1F2937">CI runner</text>
  <text x="150" y="93" text-anchor="middle" font-size="11" fill="#6B7280">새로 checkout한 폴더</text>
  <line x1="260" y1="78" x2="318" y2="78" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-ci)"/>
  <text x="289" y="70" text-anchor="middle" font-size="11" fill="#6B7280">실행</text>
  <rect x="320" y="50" width="240" height="56" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="440" y="74" text-anchor="middle" font-size="13" fill="#1F2937">claude -p (--print)</text>
  <text x="440" y="93" text-anchor="middle" font-size="11" fill="#6B7280">비대화형, 승인할 사람 없음</text>

  <!-- D1 -->
  <line x1="440" y1="106" x2="440" y2="134" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-ci)"/>
  <text x="450" y="125" font-size="11" fill="#6B7280">도구 호출</text>
  <polygon points="440,136 530,174 440,212 350,174" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="440" y="179" text-anchor="middle" font-size="13" fill="#1F2937">허가가 필요?</text>

  <!-- D2 -->
  <line x1="440" y1="212" x2="440" y2="250" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-ci)"/>
  <text x="450" y="236" font-size="11" fill="#6B7280">예</text>
  <polygon points="440,252 560,292 440,332 320,292" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="440" y="289" text-anchor="middle" font-size="13" fill="#1F2937">--allowedTools에</text>
  <text x="440" y="306" text-anchor="middle" font-size="13" fill="#1F2937">포함?</text>

  <!-- deny -->
  <line x1="560" y1="292" x2="618" y2="292" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-ci)"/>
  <text x="589" y="284" text-anchor="middle" font-size="11" fill="#6B7280">아니오</text>
  <rect x="620" y="264" width="280" height="56" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="760" y="288" text-anchor="middle" font-size="13" fill="#1F2937">거부됨</text>
  <text x="760" y="307" text-anchor="middle" font-size="11" fill="#6B7280">--permission-mode dontAsk: 묻지 않고 거부</text>

  <!-- exec -->
  <line x1="440" y1="332" x2="440" y2="368" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-ci)"/>
  <text x="450" y="355" font-size="11" fill="#6B7280">예</text>
  <polyline points="350,174 300,174 300,392 328,392" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-ci)"/>
  <text x="325" y="166" text-anchor="middle" font-size="11" fill="#6B7280">아니오</text>
  <rect x="330" y="370" width="220" height="44" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="440" y="397" text-anchor="middle" font-size="13" fill="#1F2937">도구 실행</text>

  <!-- output row -->
  <line x1="440" y1="414" x2="440" y2="448" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-ci)"/>
  <text x="450" y="436" font-size="11" fill="#6B7280">결과</text>
  <rect x="320" y="450" width="240" height="56" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="440" y="474" text-anchor="middle" font-size="13" fill="#1F2937">stdout 출력</text>
  <text x="440" y="493" text-anchor="middle" font-size="11" fill="#6B7280">--output-format json</text>
  <line x1="560" y1="478" x2="618" y2="478" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-ci)"/>
  <text x="589" y="470" text-anchor="middle" font-size="11" fill="#6B7280">JSON</text>
  <rect x="620" y="450" width="120" height="56" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="680" y="483" text-anchor="middle" font-size="13" fill="#1F2937">schema 검증</text>
  <line x1="740" y1="478" x2="778" y2="478" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-ci)"/>
  <rect x="780" y="450" width="120" height="56" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
  <text x="840" y="474" text-anchor="middle" font-size="13" fill="#1F2937">파이프라인이</text>
  <text x="840" y="492" text-anchor="middle" font-size="13" fill="#1F2937">파싱</text>

  <!-- trust note (해설 기준) -->
  <rect x="620" y="50" width="280" height="108" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="760" y="72" text-anchor="middle" font-size="13" fill="#1F2937">커밋된 .claude/settings.json의</text>
  <text x="760" y="90" text-anchor="middle" font-size="13" fill="#1F2937">permissions.allow</text>
  <text x="760" y="110" text-anchor="middle" font-size="11" fill="#6B7280">workspace trust 수락 후에만 적용(해설)</text>
  <text x="760" y="126" text-anchor="middle" font-size="11" fill="#6B7280">-p는 trust 대화상자를 띄우지 않음</text>
  <text x="760" y="146" text-anchor="middle" font-size="11" fill="#D97706">주의: 공식 문서와 어긋나 보임, 버전 확인 필요</text>
  <polyline points="760,158 760,200 520,200 520,266" fill="none" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr-ci)"/>
  <text x="640" y="192" text-anchor="middle" font-size="11" fill="#DC2626">CI에서는 쓰이지 않음</text>

  <!-- where to allow -->
  <rect x="620" y="344" width="280" height="70" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="760" y="366" text-anchor="middle" font-size="13" fill="#1F2937">CI에서 허용을 두는 곳</text>
  <text x="760" y="386" text-anchor="middle" font-size="11" fill="#6B7280">--allowedTools (예: Bash(npm run test *))</text>
  <text x="760" y="403" text-anchor="middle" font-size="11" fill="#6B7280">또는 runner의 user/managed 설정</text>

  <!-- anti-pattern -->
  <rect x="40" y="214" width="236" height="128" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="158" y="236" text-anchor="middle" font-size="13" fill="#1F2937">오답</text>
  <text x="158" y="258" text-anchor="middle" font-size="11" fill="#6B7280">대화형 모드 → 확인 대기로 멈춤</text>
  <text x="158" y="276" text-anchor="middle" font-size="11" fill="#6B7280">출력 리다이렉트·화면 스크래핑</text>
  <text x="158" y="292" text-anchor="middle" font-size="11" fill="#6B7280">→ 구조화되지 않은 출력</text>
  <text x="158" y="312" text-anchor="middle" font-size="11" fill="#6B7280">project 설정의 bypassPermissions</text>
  <text x="158" y="328" text-anchor="middle" font-size="11" fill="#6B7280">→ 효과 없음(해설 기준)</text>

  <!-- legend -->
  <line x1="40" y1="540" x2="80" y2="540" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="88" y="544" font-size="11" fill="#6B7280">점선: 기대와 달리 적용되지 않는 경로</text>
</svg>
