<text x="450.0" y="539.5" font-size="12" fill="#1F2937" text-anchor="middle">prompts·resources로 tool 발견  |  빈 인자로 tools/call 시험 호출  |  isError를 발견 수단으로 사용</text>
<line x1="20" y1="584" x2="48" y2="584" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-8-mcp-discovery)"/>
<text x="56" y="588" font-size="11" fill="#6B7280" text-anchor="start">요청·응답</text>
<line x1="132.34615384615384" y1="584" x2="160.34615384615384" y2="584" stroke="#1F2937" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr-8-mcp-discovery)"/>
<text x="168.34615384615384" y="588" font-size="11" fill="#6B7280" text-anchor="start">목록이 바뀔 때만 오는 비동기 알림</text>
