<svg xmlns="http://www.w3.org/2000/svg" width="960" height="270" viewBox="0 0 960 270" role="img" aria-label="모델 출력 처리와 검증">
<title>모델 출력 처리와 검증</title>
<defs><marker id="arr-output-handling" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<g font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">
<text x="480" y="30" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">출력 처리: 모델 출력도 untrusted, 렌더링 전에 escape / sanitize</text><rect x="20" y="70" width="140" height="56" rx="6" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/><text x="90.0" y="94.7" font-size="13" fill="#1F2937" text-anchor="middle">입력</text><text x="90.0" y="110.8" font-size="11" fill="#1F2937" text-anchor="middle">(untrusted 가능)</text><polyline points="160,98 213,98" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-output-handling)"/><text x="187" y="90" font-size="11" fill="#1F2937" text-anchor="middle">영향</text><rect x="215" y="70" width="140" height="56" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/><text x="285.0" y="102.4" font-size="13" fill="#1F2937" text-anchor="middle">Claude</text><polyline points="355,98 408,98" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-output-handling)"/><text x="382" y="90" font-size="11" fill="#1F2937" text-anchor="middle">생성</text><rect x="410" y="70" width="140" height="56" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/><text x="480.0" y="94.7" font-size="13" fill="#1F2937" text-anchor="middle">모델 출력</text><text x="480.0" y="110.8" font-size="11" fill="#1F2937" text-anchor="middle">= untrusted</text><polyline points="550,98 603,98" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-output-handling)"/><text x="577" y="90" font-size="11" fill="#1F2937" text-anchor="middle">항상</text><rect x="605" y="70" width="140" height="56" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/><text x="675.0" y="93.3" font-size="13" fill="#1F2937" text-anchor="middle">escape /</text><text x="675.0" y="111.5" font-size="13" fill="#1F2937" text-anchor="middle">sanitize</text><polyline points="745,98 798,98" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-output-handling)"/><text x="772" y="90" font-size="11" fill="#1F2937" text-anchor="middle">그다음</text><rect x="800" y="70" width="140" height="56" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/><text x="870.0" y="93.3" font-size="13" fill="#1F2937" text-anchor="middle">web page</text><text x="870.0" y="111.5" font-size="13" fill="#1F2937" text-anchor="middle">렌더링</text><text x="772" y="152" font-size="12" fill="#6B7280" text-anchor="middle">출처와 상관없이 렌더링 전에 반드시</text><polyline points="480,126 480,178" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-output-handling)"/><text x="490" y="168" font-size="11" fill="#1F2937" text-anchor="start">escape 생략</text><rect x="380" y="180" width="200" height="56" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/><text x="480.0" y="204.7" font-size="13" fill="#1F2937" text-anchor="middle">그대로 렌더링</text><text x="480.0" y="220.8" font-size="11" fill="#1F2937" text-anchor="middle">'모델 출력은 안전하다' = 오답</text><rect x="620" y="180" width="320" height="56" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/><text x="780.0" y="204.7" font-size="13" fill="#1F2937" text-anchor="middle">모델에게 'markup을 만들지 마라' 지시</text><text x="780.0" y="220.8" font-size="11" fill="#1F2937" text-anchor="middle">통제가 아님</text>
</g>
</svg>
