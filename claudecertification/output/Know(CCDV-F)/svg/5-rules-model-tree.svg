<svg xmlns="http://www.w3.org/2000/svg" width="920" height="630" viewBox="0 0 920 630" role="img" aria-label="판단 규칙 ①: 작업 특성으로 후보를 고르고, 측정으로 확정한다">
<title>판단 규칙 ①: 작업 특성으로 후보를 고르고, 측정으로 확정한다</title>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<defs><marker id="arr-rules-model-tree" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker><marker id="arr-rules-model-tree-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker></defs>
<g font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">
<text x="460" y="30" font-size="14" text-anchor="middle" fill="#1F2937" font-weight="bold">판단 규칙 ①: 작업 특성으로 후보를 고르고, 측정으로 확정한다</text>
<rect x="90" y="50" width="160" height="40" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="170" y="74.55" font-size="13" text-anchor="middle" fill="#1F2937">모델을 정해야 함</text>
<polyline points="170,90 170,98" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-rules-model-tree)"/>
