<text x="170" y="275.55" font-size="13" text-anchor="middle" fill="#1F2937">대량 단순 작업 ·</text>
<text x="170" y="293.55" font-size="13" text-anchor="middle" fill="#1F2937">빠듯한 latency?</text>
<polyline points="290,280 328,280" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-rules-model-tree)"/>
<rect x="300.5" y="263" width="17" height="15" fill="#FFFFFF"/>
<text x="309" y="274" font-size="11" text-anchor="middle" fill="#1F2937">예</text>
<rect x="330" y="252" width="320" height="56" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="490" y="276.55" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="bold">Haiku (fast tier)</text>
<text x="490" y="292.85" font-size="11" text-anchor="middle" fill="#6B7280">autocomplete면 + streaming + 작은 max_tokens</text>
<polyline points="170,330 170,353" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-rules-model-tree)"/>
<rect x="179" y="335" width="39" height="15" fill="#FFFFFF"/>
<text x="182" y="346" font-size="11" text-anchor="start" fill="#1F2937">아니오</text>
