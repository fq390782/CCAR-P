<text x="490" y="146.55" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="bold">Routing: 작업별 tier 분리</text>
<text x="490" y="162.85" font-size="11" text-anchor="middle" fill="#6B7280">orchestrator = capable · worker = small · fast</text>
