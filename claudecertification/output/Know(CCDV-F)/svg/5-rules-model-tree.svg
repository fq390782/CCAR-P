<text x="674" y="274" font-size="11" text-anchor="middle" fill="#1F2937">후보</text>
<polyline points="650,410 698,410" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-rules-model-tree)"/>
<rect x="660" y="393" width="28" height="15" fill="#FFFFFF"/>
<text x="674" y="404" font-size="11" text-anchor="middle" fill="#1F2937">후보</text>
<polyline points="260,512 698,512" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-rules-model-tree)"/>
<rect x="466" y="495" width="28" height="15" fill="#FFFFFF"/>
<text x="480" y="506" font-size="11" text-anchor="middle" fill="#1F2937">후보</text>
<rect x="20" y="560" width="880" height="44" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="460" y="586.55" font-size="13" text-anchor="middle" fill="#1F2937">✗ benchmark 점수 · 최신 · 더 큰 모델이라서 선택        ✗ 추론 작업을 작은 모델 여러 개로 분할</text>
