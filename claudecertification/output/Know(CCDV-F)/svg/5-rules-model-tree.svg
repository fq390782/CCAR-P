<text x="170" y="405.55" font-size="13" text-anchor="middle" fill="#1F2937">다중 제약 multi-step</text>
<text x="170" y="423.55" font-size="13" text-anchor="middle" fill="#1F2937">계획 · migration?</text>
<polyline points="300,410 328,410" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-rules-model-tree)"/>
<rect x="305.5" y="393" width="17" height="15" fill="#FFFFFF"/>
<text x="314" y="404" font-size="11" text-anchor="middle" fill="#1F2937">예</text>
<rect x="330" y="382" width="320" height="56" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="490" y="406.55" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="bold">Opus (가장 capable)</text>
<text x="490" y="422.85" font-size="11" text-anchor="middle" fill="#6B7280">prompt로는 능력 차이를 못 메움</text>
<polyline points="170,465 170,488" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-rules-model-tree)"/>
<rect x="179" y="469" width="39" height="15" fill="#FFFFFF"/>
<text x="182" y="480" font-size="11" text-anchor="start" fill="#1F2937">아니오</text>
<rect x="80" y="490" width="180" height="44" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="170" y="516.55" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="bold">Sonnet (balanced)</text>
<rect x="700" y="122" width="200" height="412" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
<text x="800" y="233.55" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="bold">측정으로 확정</text>
<text x="800" y="251.55" font-size="13" text-anchor="middle" fill="#1F2937"></text>
<text x="800" y="269.55" font-size="13" text-anchor="middle" fill="#1F2937">두 후보 모두</text>
<text x="800" y="287.55" font-size="13" text-anchor="middle" fill="#1F2937">대표 sample +</text>
<text x="800" y="305.55" font-size="13" text-anchor="middle" fill="#1F2937">quality bar로 eval</text>
<text x="800" y="323.55" font-size="13" text-anchor="middle" fill="#1F2937"></text>
<text x="800" y="341.55" font-size="13" text-anchor="middle" fill="#1F2937">정확도가 같으면</text>
<text x="800" y="359.55" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="bold">작은 모델 배포</text>
<text x="800" y="377.55" font-size="13" text-anchor="middle" fill="#1F2937"></text>
<text x="800" y="395.55" font-size="13" text-anchor="middle" fill="#1F2937">큰 모델이 거의 완벽해도</text>
<text x="800" y="413.55" font-size="13" text-anchor="middle" fill="#1F2937">작은 모델이 요구 정확도를</text>
<text x="800" y="431.55" font-size="13" text-anchor="middle" fill="#1F2937">충족하는지 평가</text>
