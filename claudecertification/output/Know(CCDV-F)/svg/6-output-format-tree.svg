<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-label="출력 형식 강제 수단 decision tree" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">
<title>출력 형식 강제 수단 decision tree</title>
<defs><marker id="arr-output-format-tree" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<polygon points="306,20 594,20 610,47.0 594,74 306,74 290,47.0" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
<text x="450.0" y="51.0" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">스키마 준수 JSON을 보장해야 하나?</text>
<polygon points="146,120 434,120 450,147.0 434,174 146,174 130,147.0" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
<text x="290.0" y="151.0" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">선택지에 structured outputs가 있나?</text>
<rect x="590" y="120" width="290" height="74" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="735.0" y="143.5" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">JSON 지시 + 예시</text>
<text x="735.0" y="161.5" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">+ 방어적 파싱 · retry</text>
<text x="735.0" y="178.7" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="middle">여전히 확률적 — 보장 아님</text>
<polyline points="370,74 290,120" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-output-format-tree)"/>
<rect x="285.7" y="88" width="88.5" height="16" fill="#FFFFFF"/>
<text x="330" y="100.5" font-size="11" font-weight="normal" fill="#1F2937" text-anchor="middle">예 (보장 필요)</text>
<polyline points="530,74 735,120" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-output-format-tree)"/>
<rect x="619.5" y="88" width="41.0" height="16" fill="#FFFFFF"/>
<text x="640" y="100.5" font-size="11" font-weight="normal" fill="#1F2937" text-anchor="middle">아니오</text>
<rect x="20" y="230" width="270" height="110" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="155.0" y="256.0" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">structured outputs</text>
<text x="155.0" y="273.2" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="middle">output_config.format</text>
<text x="155.0" y="290.2" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="middle">+ JSON schema</text>
<text x="155.0" y="307.2" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="middle">(constrained decoding)</text>
<text x="155.0" y="322.8" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="middle">스키마 준수 보장 (strict tool 포함)</text>
<rect x="310" y="230" width="270" height="110" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="445.0" y="256.0" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">forced tool choice</text>
<text x="445.0" y="273.2" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="middle">input_schema = 목표 JSON</text>
<text x="445.0" y="290.2" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="middle">tool_choice로 호출 강제</text>
<text x="445.0" y="307.2" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="middle">→ input 사용</text>
<text x="445.0" y="322.8" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="middle">매우 신뢰성 높음, 보장은 아님</text>
<polyline points="210,174 155,230" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-output-format-tree)"/>
<rect x="170.5" y="193" width="19.0" height="16" fill="#FFFFFF"/>
<text x="180" y="205.5" font-size="11" font-weight="normal" fill="#1F2937" text-anchor="middle">예</text>
<polyline points="370,174 445,230" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-output-format-tree)"/>
<rect x="368.9" y="193" width="82.1" height="16" fill="#FFFFFF"/>
<text x="410" y="205.5" font-size="11" font-weight="normal" fill="#1F2937" text-anchor="middle">아니오 (없음)</text>
<rect x="20" y="380" width="560" height="66" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
<text x="300.0" y="408.5" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">프로덕션 추출: 출력은 untrusted input</text>
<text x="300.0" y="425.7" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="middle">파싱 결과 검증 → 실패 시 validation error를 붙여 retry</text>
<polyline points="155,340 155,380" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-output-format-tree)"/>
<polyline points="445,340 445,380" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-output-format-tree)"/>
<rect x="610" y="230" width="270" height="216" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="745.0" y="274.5" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">보장 수단이 아님 (확률적)</text>
<text x="745.0" y="291.7" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="middle">system prompt "JSON으로 답하라"</text>
<text x="745.0" y="308.7" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="middle">temperature 0</text>
<text x="745.0" y="325.7" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="middle">자유 텍스트 + regex parser</text>
<text x="745.0" y="342.7" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="middle">강조 · 반복 · 큰 모델</text>
<text x="745.0" y="360.5" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">assistant prefill { 또는 [</text>
<text x="745.0" y="377.7" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="middle">Claude 4.6부터 400 error</text>
<text x="745.0" y="394.7" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="middle">→ 제거하고 structured outputs로</text>
<text x="745.0" y="410.3" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="middle">대안이 아니라 대체재</text>
</svg>
