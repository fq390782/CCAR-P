<text x="795.0" y="201.5" font-size="12" text-anchor="middle" fill="#1F2937">turn 3</text>
<rect x="670" y="218" width="250" height="30" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
