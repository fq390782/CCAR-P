<svg xmlns="http://www.w3.org/2000/svg" width="940" height="560" viewBox="0 0 940 560" role="img" aria-label="context window 관리 전략 비교" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">
