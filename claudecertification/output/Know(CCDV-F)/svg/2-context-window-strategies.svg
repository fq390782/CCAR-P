<text x="307" y="177.5" font-size="11" text-anchor="middle" fill="#6B7280">서버가</text>
<text x="307" y="191.5" font-size="11" text-anchor="middle" fill="#6B7280">요약</text>
<polyline points="595,200 670,200" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-context-window-strategies)"/>
<rect x="600.7" y="164.0" width="62.6" height="32" fill="#FFFFFF"/>
<text x="632" y="177.5" font-size="11" text-anchor="middle" fill="#6B7280">threshold</text>
<text x="632" y="191.5" font-size="11" text-anchor="middle" fill="#6B7280">초과</text>
<text x="470" y="312" font-size="11" text-anchor="middle" fill="#6B7280">주요 전략: 요약을 직접 구현할 필요 없음</text>
<text x="795" y="312" font-size="11" text-anchor="middle" fill="#6B7280">오래된 tool result부터 교체 · compaction보다 범위가 좁음</text>
<rect x="30" y="330" width="880" height="46" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="470.0" y="357.5" font-size="12" text-anchor="middle" fill="#1F2937">tool이 50,000토큰 JSON 같은 거대한 payload를 돌려줌 → tool이 작업에 필요한 필드만 돌려주도록 수정</text>
<text x="470" y="404" font-size="13" text-anchor="middle" fill="#DC2626" font-weight="bold">토큰을 줄이지 않으므로 window 문제를 해결하지 못함</text>
<rect x="30" y="420" width="280" height="54" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="170.0" y="443.0" font-size="12" text-anchor="middle" fill="#1F2937">prompt caching</text>
<text x="170.0" y="460.0" font-size="11" text-anchor="middle" fill="#6B7280">요금·지연만 줄임</text>
<rect x="330" y="420" width="280" height="54" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="470.0" y="443.0" font-size="12" text-anchor="middle" fill="#1F2937">max_tokens 늘리기</text>
<text x="470.0" y="460.0" font-size="11" text-anchor="middle" fill="#6B7280">출력 상한일 뿐</text>
<rect x="630" y="420" width="280" height="54" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="770.0" y="443.0" font-size="12" text-anchor="middle" fill="#1F2937">backoff 재시도</text>
<text x="770.0" y="460.0" font-size="11" text-anchor="middle" fill="#6B7280">일시 오류용</text>
<rect x="30" y="484" width="280" height="54" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="170.0" y="507.0" font-size="12" text-anchor="middle" fill="#1F2937">오래된 턴 그냥 자르기</text>
<text x="170.0" y="524.0" font-size="11" text-anchor="middle" fill="#6B7280">사실이 조용히 사라짐</text>
<rect x="330" y="484" width="280" height="54" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="470.0" y="507.0" font-size="12" text-anchor="middle" fill="#1F2937">새 대화로 시작</text>
<text x="470.0" y="524.0" font-size="11" text-anchor="middle" fill="#6B7280">상태를 모두 잃음</text>
<rect x="630" y="484" width="280" height="54" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="770.0" y="507.0" font-size="12" text-anchor="middle" fill="#1F2937">window 큰 모델에 전체 기록</text>
<text x="770.0" y="524.0" font-size="11" text-anchor="middle" fill="#6B7280">문제를 미룸 · TTFT·ITPM 증가</text>
