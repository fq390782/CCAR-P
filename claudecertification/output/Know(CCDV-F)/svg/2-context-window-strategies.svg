<text x="470.0" y="237.5" font-size="12" text-anchor="middle" fill="#1F2937">turn 4 (최근)</text>
<text x="795" y="60" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="bold">context editing: tool result clearing</text>
<rect x="670" y="74" width="250" height="30" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="795.0" y="93.5" font-size="12" text-anchor="middle" fill="#1F2937">turn 1</text>
