<svg xmlns="http://www.w3.org/2000/svg" width="880" height="390" viewBox="0 0 880 390" role="img" aria-label="운영 중에는 품질과 이용 현황을 monitoring하고, 모델 교체나 외부 근거 변경과 사용자 피드백의 영향을 eval set으로 확인한 뒤 prompt, 참조 데이터, eval set을 계획적으로 수정한다." font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">
<title>release 이후 운영 루프</title>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<defs><marker id="arr-ops-feedback" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker><marker id="arr-ops-feedback-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker></defs>
<text x="20" y="30" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="start">release 이후: 피드백은 모델이 아니라 운영 측이 반영한다</text>
<rect x="20" y="90" width="160" height="64" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="100.0" y="126.9" text-anchor="middle"><tspan x="100.0" dy="0" font-size="14" font-weight="bold" fill="#1F2937">production 운영</tspan></text>
<rect x="220" y="90" width="200" height="64" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="320.0" y="118.9" text-anchor="middle"><tspan x="320.0" dy="0" font-size="14" font-weight="bold" fill="#1F2937">monitoring</tspan><tspan x="320.0" dy="16" font-size="13" fill="#1F2937">응답 품질·이용 현황</tspan></text>
<rect x="460" y="90" width="180" height="64" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="550.0" y="118.9" text-anchor="middle"><tspan x="550.0" dy="0" font-size="14" font-weight="bold" fill="#1F2937">eval set으로</tspan><tspan x="550.0" dy="16" font-size="13" fill="#1F2937">영향 확인</tspan></text>
<rect x="670" y="90" width="190" height="64" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="765.0" y="119.9" text-anchor="middle"><tspan x="765.0" dy="0" font-size="14" font-weight="bold" fill="#1F2937">계획적 수정</tspan><tspan x="765.0" dy="14" font-size="11" fill="#6B7280">prompt·참조 데이터·eval set</tspan></text>
<path d="M180,122 L220,122" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-ops-feedback)"/>
<path d="M420,122 L460,122" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-ops-feedback)"/>
<path d="M640,122 L670,122" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-ops-feedback)"/>
<path d="M765,90 L765,72 L100,72 L100,90" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-ops-feedback)"/>
<rect x="398.5" y="65" width="63.0" height="17" fill="#FFFFFF"/>
<text x="430" y="77" font-size="12" fill="#1F2937" text-anchor="middle">수정 반영</text>
<rect x="380" y="210" width="340" height="56" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="550.0" y="235.6" text-anchor="middle"><tspan x="550.0" dy="0" font-size="13" fill="#1F2937">변경 요인</tspan><tspan x="550.0" dy="14" font-size="11" fill="#6B7280">모델 교체 · 외부 근거(제도·문서) 변경 · 사용자 피드백</tspan></text>
<path d="M550,210 L550,154" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-ops-feedback)"/>
<text x="20" y="316" font-size="14" font-weight="bold" fill="#DC2626" text-anchor="start">흔한 오답</text>
<rect x="20" y="326" width="410" height="50" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="225.0" y="348.6" text-anchor="middle"><tspan x="225.0" dy="0" font-size="13" fill="#1F2937">✗ 사용자 피드백으로 모델이 자동 재학습</tspan><tspan x="225.0" dy="14" font-size="11" fill="#6B7280">Claude API 모델은 운영 중 스스로 학습하지 않음</tspan></text>
<rect x="450" y="326" width="410" height="50" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="655.0" y="348.6" text-anchor="middle"><tspan x="655.0" dy="0" font-size="13" fill="#1F2937">✗ uptime만 감시 / server 재시작 정비 / 변경 동결</tspan><tspan x="655.0" dy="14" font-size="11" fill="#6B7280">답변 내용이 지금도 맞는지는 확인 못 함</tspan></text>
</svg>
