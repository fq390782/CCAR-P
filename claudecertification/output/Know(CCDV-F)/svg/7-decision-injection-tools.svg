<svg xmlns="http://www.w3.org/2000/svg" width="900" height="595" viewBox="0 0 900 595" role="img" aria-label="판단 규칙 ①: injection과 tool 통제">
<title>판단 규칙 ①: injection과 tool 통제</title>
<defs><marker id="arr-decision-injection-tools" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<g font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">
<text x="450.0" y="30" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">판단 규칙 ①: injection과 tool 통제</text><polygon points="190,55 360,95 190,135 20,95" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/><text x="190" y="90.6" font-size="12" fill="#1F2937" text-anchor="middle">fetch한 페이지 · 문서에</text><text x="190" y="107.4" font-size="12" fill="#1F2937" text-anchor="middle">'이전 지시를 무시하고 ~하라'?</text><polyline points="360,95 408,95" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-decision-injection-tools)"/><text x="384" y="87" font-size="11" fill="#1F2937" text-anchor="middle">예</text><rect x="410" y="65" width="470" height="60" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/><text x="645.0" y="91.7" font-size="13" fill="#1F2937" text-anchor="middle">content를 untrusted 데이터로 다룬다</text><text x="645.0" y="107.8" font-size="11" fill="#1F2937" text-anchor="middle">권한은 모델 바깥에서 제한</text><polyline points="190,135 190,158" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-decision-injection-tools)"/><text x="198" y="151" font-size="11" fill="#1F2937" text-anchor="start">아니오</text><polygon points="190,160 360,200 190,240 20,200" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/><text x="190" y="195.6" font-size="12" fill="#1F2937" text-anchor="middle">요약 agent에 email·삭제·환불 tool이</text><text x="190" y="212.4" font-size="12" fill="#1F2937" text-anchor="middle">있고 injection을 당했다?</text><polyline points="360,200 408,200" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-decision-injection-tools)"/><text x="384" y="192" font-size="11" fill="#1F2937" text-anchor="middle">예</text><rect x="410" y="170" width="470" height="60" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/><text x="645.0" y="196.7" font-size="13" fill="#1F2937" text-anchor="middle">그 tool을 없앤다 (least privilege)</text><text x="645.0" y="212.8" font-size="11" fill="#1F2937" text-anchor="middle">남는 consequential tool은 human approval 뒤에</text><polyline points="190,240 190,263" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-decision-injection-tools)"/><text x="198" y="256" font-size="11" fill="#1F2937" text-anchor="start">아니오</text><polygon points="190,265 360,305 190,345 20,305" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/><text x="190" y="300.6" font-size="12" fill="#1F2937" text-anchor="middle">'agent가 절대 X를 하면 안 된다'</text><text x="190" y="317.4" font-size="12" fill="#1F2937" text-anchor="middle">보장이 필요?</text><polyline points="360,305 408,305" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-decision-injection-tools)"/><text x="384" y="297" font-size="11" fill="#1F2937" text-anchor="middle">예</text><rect x="410" y="275" width="470" height="60" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/><text x="645.0" y="301.7" font-size="13" fill="#1F2937" text-anchor="middle">X tool을 주지 않는다</text><text x="645.0" y="317.8" font-size="11" fill="#1F2937" text-anchor="middle">tool configuration · hooks로 강제</text><polyline points="190,345 190,368" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-decision-injection-tools)"/><text x="198" y="361" font-size="11" fill="#1F2937" text-anchor="start">아니오</text><polygon points="190,370 360,410 190,450 20,410" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/><text x="190" y="405.6" font-size="12" fill="#1F2937" text-anchor="middle">외부 주소로 데이터를 보낼</text><text x="190" y="422.4" font-size="12" fill="#1F2937" text-anchor="middle">위험이 있다? (TWO 고르기)</text><polyline points="360,410 408,410" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-decision-injection-tools)"/><text x="384" y="402" font-size="11" fill="#1F2937" text-anchor="middle">예</text><rect x="410" y="380" width="470" height="60" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/><text x="645.0" y="406.7" font-size="13" fill="#1F2937" text-anchor="middle">코드의 deterministic gate</text><text x="645.0" y="422.8" font-size="11" fill="#1F2937" text-anchor="middle">+ least privilege (tool 제거 또는 승인)</text><polyline points="190,450 190,473" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-decision-injection-tools)"/><text x="198" y="466" font-size="11" fill="#1F2937" text-anchor="start">아니오</text><polygon points="190,475 360,515 190,555 20,515" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/><text x="190" y="510.6" font-size="12" fill="#1F2937" text-anchor="middle">integration에</text><text x="190" y="527.4" font-size="12" fill="#1F2937" text-anchor="middle">DB 접근을 줘야 한다?</text><polyline points="360,515 408,515" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-decision-injection-tools)"/><text x="384" y="507" font-size="11" fill="#1F2937" text-anchor="middle">예</text><rect x="410" y="485" width="470" height="60" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/><text x="645.0" y="511.7" font-size="13" fill="#1F2937" text-anchor="middle">필요한 operation만</text><text x="645.0" y="527.8" font-size="11" fill="#1F2937" text-anchor="middle">범위를 좁혀 노출</text>
</g>
</svg>
