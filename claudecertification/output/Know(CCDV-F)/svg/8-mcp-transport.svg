<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-label="stdio는 같은 머신의 subprocess, Streamable HTTP는 원격 서버를 여러 client에 제공" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">
<title>stdio는 같은 머신의 subprocess, Streamable HTTP는 원격 서버를 여러 client에 제공</title>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<defs><marker id="arr-8-mcp-transport" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker></defs>
<rect x="20" y="20" width="420" height="340" rx="6" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="230" y="46" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">stdio</text>
<rect x="40" y="64" width="380" height="196" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="230" y="84" font-size="11" fill="#6B7280" text-anchor="middle">같은 머신</text>
<rect x="60" y="100" width="150" height="70" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="135.0" y="123.0" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">host</text>
<text x="135.0" y="138.0" font-size="11" fill="#1F2937" text-anchor="middle">(Claude Code 등)</text>
<text x="135.0" y="154.0" font-size="12" fill="#1F2937" text-anchor="middle">MCP client</text>
<rect x="250" y="100" width="150" height="70" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="325.0" y="131.0" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">MCP server</text>
<text x="325.0" y="146.0" font-size="11" fill="#1F2937" text-anchor="middle">subprocess로 실행</text>
<polyline points="210,125 248,125" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-8-mcp-transport)"/>
<polyline points="248,150 212,150" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-8-mcp-transport)"/>
<text x="135" y="196" font-size="11" fill="#6B7280" text-anchor="middle">host ↔ server: 표준 입출력</text>
<rect x="250" y="206" width="150" height="40" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="325.0" y="229.0" font-size="12" fill="#1F2937" text-anchor="middle">로컬 파일·CLI</text>
<polyline points="325,170 325,204" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-8-mcp-transport)"/>
<rect x="40" y="276" width="380" height="70" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="230.0" y="306.0" font-size="12" fill="#1F2937" text-anchor="middle">네트워크 오버헤드 없음, 보통 client 1개</text>
<text x="230.0" y="322.0" font-size="12" fill="#1F2937" text-anchor="middle">네트워크 너머로는 통신 불가</text>
<rect x="460" y="20" width="420" height="340" rx="6" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="670" y="46" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">Streamable HTTP</text>
<rect x="480" y="70" width="110" height="44" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="535.0" y="95.0" font-size="12" fill="#1F2937" text-anchor="middle">client A</text>
<polyline points="590,84 728,84" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-8-mcp-transport)"/>
<polyline points="728,104 592,104" fill="none" stroke="#1F2937" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr-8-mcp-transport)"/>
<rect x="480" y="130" width="110" height="44" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="535.0" y="155.0" font-size="12" fill="#1F2937" text-anchor="middle">client B</text>
<polyline points="590,144 728,144" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-8-mcp-transport)"/>
<polyline points="728,164 592,164" fill="none" stroke="#1F2937" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr-8-mcp-transport)"/>
<rect x="480" y="190" width="110" height="44" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="535.0" y="215.0" font-size="12" fill="#1F2937" text-anchor="middle">client C</text>
<polyline points="590,204 728,204" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-8-mcp-transport)"/>
<polyline points="728,224 592,224" fill="none" stroke="#1F2937" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr-8-mcp-transport)"/>
<polyline points="660,64 660,250" fill="none" stroke="#9CA3AF" stroke-width="1.2"/>
<text x="660" y="262" font-size="11" fill="#6B7280" text-anchor="middle">네트워크</text>
<rect x="730" y="70" width="130" height="164" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="795.0" y="147.0" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">원격</text>
<text x="795.0" y="164.0" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">MCP server</text>
<rect x="480" y="276" width="380" height="70" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="670.0" y="306.0" font-size="12" fill="#1F2937" text-anchor="middle">인증: Bearer 토큰, API key, 커스텀 헤더</text>
<text x="670.0" y="322.0" font-size="12" fill="#1F2937" text-anchor="middle">토큰 획득은 OAuth 권장</text>
<line x1="480" y1="380" x2="508" y2="380" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-8-mcp-transport)"/>
<text x="516" y="384" font-size="11" fill="#6B7280" text-anchor="start">client→server HTTP POST</text>
<line x1="687.9615384615385" y1="380" x2="715.9615384615385" y2="380" stroke="#1F2937" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr-8-mcp-transport)"/>
<text x="723.9615384615385" y="384" font-size="11" fill="#6B7280" text-anchor="start">SSE (선택)</text>
<rect x="20" y="410" width="860" height="120" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="450.0" y="457.5" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">오답: 배포 위치·제공 범위를 무시하고 한 transport로 통일</text>
<text x="450.0" y="473.5" font-size="12" fill="#1F2937" text-anchor="middle">로컬 subprocess 서버에 HTTP → 오버헤드, 포트 노출, 인증 부담만 늘어남</text>
<text x="450.0" y="489.5" font-size="12" fill="#1F2937" text-anchor="middle">원격 서버를 각 단말에 배포해 stdio로 실행 → 업데이트·인증을 중앙에서 관리 불가</text>
</svg>
