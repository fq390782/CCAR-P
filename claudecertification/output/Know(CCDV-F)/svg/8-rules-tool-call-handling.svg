<svg xmlns="http://www.w3.org/2000/svg" width="900" height="610" viewBox="0 0 900 610" role="img" aria-label="판단 규칙 1: tool 호출 결과를 누가, 어떤 메시지로 돌려주는가" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">
<title>판단 규칙 1: tool 호출 결과를 누가, 어떤 메시지로 돌려주는가</title>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<defs><marker id="arr-8-rules-tool-call-handling" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker></defs>
<rect x="330" y="20" width="240" height="44" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="450.0" y="45.5" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Claude가 tool 사용을 결정</text>
<polygon points="450,80.0 570.0,130 450,180.0 330.0,130" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
<text x="450" y="125.0" font-size="13" fill="#1F2937" text-anchor="middle">누가 tool을</text>
<text x="450" y="142.0" font-size="13" fill="#1F2937" text-anchor="middle">실행하나?</text>
<polyline points="450,64 450,78" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-8-rules-tool-call-handling)"/>
<rect x="650" y="95" width="230" height="70" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
<text x="765.0" y="117.0" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">server tool · MCP connector</text>
<text x="765.0" y="133.0" font-size="12" fill="#1F2937" text-anchor="middle">결과가 같은 응답에 포함</text>
<text x="765.0" y="149.0" font-size="12" fill="#1F2937" text-anchor="middle">앱은 실행·tool_result 없음</text>
<polyline points="570,130 648,130" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-8-rules-tool-call-handling)"/>
<rect x="576.4423076923077" y="111" width="65.11538461538461" height="15" fill="#FFFFFF"/>
<text x="609" y="122" font-size="11" fill="#1F2937" text-anchor="middle">Anthropic</text>
<rect x="300" y="210" width="300" height="56" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="450.0" y="233.5" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">stop_reason: tool_use</text>
<text x="450.0" y="249.5" font-size="12" fill="#1F2937" text-anchor="middle">tool_use 블록을 전부 실행 (여러 개여도)</text>
<polyline points="450,180 450,208" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-8-rules-tool-call-handling)"/>
<rect x="452" y="187" width="107.84615384615384" height="15" fill="#FFFFFF"/>
<text x="456" y="198" font-size="11" fill="#1F2937" text-anchor="start">앱 (client tool)</text>
<polygon points="450,295.0 560.0,340 450,385.0 340.0,340" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
<text x="450" y="343.5" font-size="13" fill="#1F2937" text-anchor="middle">실행 성공?</text>
<polyline points="450,266 450,294" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-8-rules-tool-call-handling)"/>
<rect x="30" y="312" width="220" height="56" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="140.0" y="335.5" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">tool_result</text>
<text x="140.0" y="351.5" font-size="12" fill="#1F2937" text-anchor="middle">(같은 tool_use_id)</text>
<rect x="650" y="305" width="230" height="70" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="765.0" y="327.0" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">tool_result + is_error: true</text>
<text x="765.0" y="343.0" font-size="12" fill="#1F2937" text-anchor="middle">무엇이 일어났고</text>
<text x="765.0" y="359.0" font-size="12" fill="#1F2937" text-anchor="middle">다음에 무엇을 시도할지</text>
<polyline points="340,340 252,340" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-8-rules-tool-call-handling)"/>
<rect x="286.0" y="320" width="20.0" height="16" fill="#FFFFFF"/>
<text x="296" y="332" font-size="12" fill="#1F2937" text-anchor="middle">예</text>
<polyline points="560,340 648,340" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-8-rules-tool-call-handling)"/>
<rect x="582.0" y="320" width="44.0" height="16" fill="#FFFFFF"/>
<text x="604" y="332" font-size="12" fill="#1F2937" text-anchor="middle">아니오</text>
<rect x="200" y="420" width="500" height="60" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
<text x="450.0" y="445.0" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">다음 요청: assistant 턴(tool_use)을 그대로 두고</text>
<text x="450.0" y="462.0" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">모든 tool_result를 한 user 메시지에</text>
<polyline points="140,368 140,450 198,450" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-8-rules-tool-call-handling)"/>
<polyline points="765,375 765,450 702,450" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-8-rules-tool-call-handling)"/>
<rect x="30" y="506" width="840" height="84" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="450.0" y="535.5" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">오답</text>
<text x="450.0" y="551.5" font-size="12" fill="#1F2937" text-anchor="middle">결과를 system·assistant 메시지에  |  assistant 턴·tool_use_id 빼기  |  여러 메시지로 분할</text>
<text x="450.0" y="567.5" font-size="12" fill="#1F2937" text-anchor="middle">빈 결과로 실패 숨기기  |  무한 재시도  |  server tool·mcp_tool_use에 앱이 다시 실행</text>
</svg>
