<svg xmlns="http://www.w3.org/2000/svg" width="920" height="450" viewBox="0 0 920 450" role="img" aria-label="Workflow vs Agent: 다음 단계를 코드가 정하나 모델이 정하나" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">
<title>Workflow vs Agent: 다음 단계를 코드가 정하나 모델이 정하나</title>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<defs><marker id="arr-d1-workflow-vs-agent-k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker><marker id="arr-d1-workflow-vs-agent-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker><marker id="arr-d1-workflow-vs-agent-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="arr-d1-workflow-vs-agent-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/></marker></defs>
<text x="20" y="30" font-size="14" fill="#1F2937" text-anchor="start" font-weight="bold">Workflow vs Agent — 다음 단계를 누가 정하나</text>
<polygon points="130,165.0 240.0,235 130,305.0 20.0,235" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
<text x="130" y="220.1" font-size="13" fill="#1F2937" text-anchor="middle">중간 결과를 봐야</text>
<text x="130" y="238.1" font-size="13" fill="#1F2937" text-anchor="middle">다음 단계를</text>
<text x="130" y="256.1" font-size="13" fill="#1F2937" text-anchor="middle">알 수 있나?</text>
<rect x="270" y="50" width="630" height="165" rx="6" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="284" y="72" font-size="14" fill="#1F2937" text-anchor="start" font-weight="bold">Workflow — 코드가 다음 단계를 정한다</text>
<text x="284" y="90" font-size="11" fill="#6B7280" text-anchor="start">control flow가 설계 시점에 고정 · 모델은 정해진 지점에서만 호출</text>
<rect x="285" y="110" width="70" height="50" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="320.0" y="138.1" font-size="13" fill="#1F2937" text-anchor="middle">입력</text>
<rect x="390" y="110" width="110" height="50" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="445.0" y="138.1" font-size="13" fill="#1F2937" text-anchor="middle">LLM 호출 ①</text>
<rect x="535" y="110" width="130" height="50" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="600.0" y="130.1" font-size="13" fill="#1F2937" text-anchor="middle">검증 gate</text>
<text x="600.0" y="146.7" font-size="11" fill="#6B7280" text-anchor="middle">(schema check)</text>
<rect x="700" y="110" width="110" height="50" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="755.0" y="138.1" font-size="13" fill="#1F2937" text-anchor="middle">LLM 호출 ②</text>
<rect x="835" y="110" width="55" height="50" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
<text x="862.5" y="138.1" font-size="13" fill="#1F2937" text-anchor="middle">출력</text>
<path d="M355,135 L390,135" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-d1-workflow-vs-agent-k)"/>
<path d="M500,135 L535,135" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-d1-workflow-vs-agent-k)"/>
<path d="M665,135 L700,135" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-d1-workflow-vs-agent-k)"/>
<path d="M810,135 L835,135" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-d1-workflow-vs-agent-k)"/>
<text x="285" y="195" font-size="11" fill="#6B7280" text-anchor="start">앱 코드가 호출 순서를 정함 → 싸고 빠르며 테스트·감사·디버깅이 쉽다</text>
<rect x="270" y="240" width="630" height="195" rx="6" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="284" y="262" font-size="14" fill="#1F2937" text-anchor="start" font-weight="bold">Agent — 모델이 실행 중에 다음 단계를 정한다</text>
<text x="284" y="280" font-size="11" fill="#6B7280" text-anchor="start">경로를 실행 중에 발견 · 비용·지연·비결정성·오류 연쇄 위험 증가</text>
<rect x="285" y="300" width="70" height="50" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="320.0" y="328.1" font-size="13" fill="#1F2937" text-anchor="middle">입력</text>
<rect x="390" y="290" width="170" height="70" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="475.0" y="320.1" font-size="13" fill="#1F2937" text-anchor="middle" font-weight="bold">Model</text>
<text x="475.0" y="336.7" font-size="11" fill="#6B7280" text-anchor="middle">다음 단계·tool 선택</text>
<rect x="660" y="290" width="130" height="70" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="725.0" y="328.1" font-size="13" fill="#1F2937" text-anchor="middle">tool 실행</text>
<rect x="820" y="392" width="70" height="36" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
<text x="855.0" y="413.1" font-size="13" fill="#1F2937" text-anchor="middle">결과</text>
<path d="M355,325 L390,325" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-d1-workflow-vs-agent-k)"/>
<path d="M560,308 L660,308" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-d1-workflow-vs-agent-k)"/>
<rect x="580.0" y="289" width="59.9" height="15" fill="#FFFFFF"/>
<text x="610" y="300" font-size="11" fill="#1F2937" text-anchor="middle">tool 호출</text>
<path d="M660,342 L560,342" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-d1-workflow-vs-agent-k)"/>
<rect x="581.8" y="351" width="56.4" height="15" fill="#FFFFFF"/>
<text x="610" y="362" font-size="11" fill="#1F2937" text-anchor="middle">중간 결과</text>
<path d="M475,360 L475,410 L820,410" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-d1-workflow-vs-agent-k)"/>
<rect x="602.1" y="403" width="95.8" height="15" fill="#FFFFFF"/>
<text x="650" y="414" font-size="11" fill="#1F2937" text-anchor="middle">모델이 완료 판단</text>
<path d="M130,165 L130,135 L285,135" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-d1-workflow-vs-agent-k)"/>
<rect x="153.9" y="128" width="102.1" height="15" fill="#FFFFFF"/>
<text x="205" y="139" font-size="11" fill="#1F2937" text-anchor="middle">아니오: 경로 고정</text>
<path d="M130,305 L130,325 L285,325" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-d1-workflow-vs-agent-k)"/>
<rect x="159.4" y="318" width="91.1" height="15" fill="#FFFFFF"/>
<text x="205" y="329" font-size="11" fill="#1F2937" text-anchor="middle">예: 경로를 발견</text>
<text x="20" y="400" font-size="11" fill="#6B7280" text-anchor="start">길이·tool 개수·structured output은</text>
<text x="20" y="415" font-size="11" fill="#6B7280" text-anchor="start">구분 기준이 아니다</text>
</svg>
