<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" role="img" aria-label="필수 순서는 앱의 state machine이 상태별 허용 tool만 tools에 넣어 강제한다" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">
<title>필수 순서는 앱의 state machine이 상태별 허용 tool만 tools에 넣어 강제한다</title>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<defs><marker id="arr-8-state-machine-gating" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker></defs>
<rect x="30" y="40" width="180" height="44" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="120.0" y="66.0" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">본인 확인</text>
<rect x="30" y="96" width="180" height="64" rx="6" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="120.0" y="115.0" font-size="11" fill="#6B7280" text-anchor="middle">tools =</text>
<text x="120.0" y="131.0" font-size="12" fill="#1F2937" text-anchor="middle">본인 확인 tool만</text>
<text x="120.0" y="146.0" font-size="11" fill="#6B7280" text-anchor="middle">변경 tool 없음</text>
<polyline points="210,62 248,62" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-8-state-machine-gating)"/>
<rect x="250" y="40" width="180" height="44" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="340.0" y="66.0" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">정보 수집</text>
<rect x="250" y="96" width="180" height="64" rx="6" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="340.0" y="122.5" font-size="11" fill="#6B7280" text-anchor="middle">tools =</text>
<text x="340.0" y="138.5" font-size="12" fill="#1F2937" text-anchor="middle">이 단계 허용 tool만</text>
<polyline points="430,62 468,62" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-8-state-machine-gating)"/>
<rect x="470" y="40" width="180" height="44" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="560.0" y="66.0" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">확인·동의</text>
<rect x="470" y="96" width="180" height="64" rx="6" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="560.0" y="122.5" font-size="11" fill="#6B7280" text-anchor="middle">tools =</text>
<text x="560.0" y="138.5" font-size="12" fill="#1F2937" text-anchor="middle">이 단계 허용 tool만</text>
<polyline points="650,62 688,62" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-8-state-machine-gating)"/>
<rect x="690" y="40" width="180" height="44" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
<text x="780.0" y="66.0" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">실행</text>
<rect x="690" y="96" width="180" height="64" rx="6" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="780.0" y="122.5" font-size="11" fill="#6B7280" text-anchor="middle">tools =</text>
<text x="780.0" y="138.5" font-size="12" fill="#1F2937" text-anchor="middle">변경 tool 허용</text>
<rect x="140.59615384615384" y="15" width="198.80769230769232" height="15" fill="#FFFFFF"/>
<text x="240" y="26" font-size="11" fill="#6B7280" text-anchor="middle">본인 확인 tool 성공 (코드로 검증)</text>
<rect x="461.28846153846155" y="15" width="217.42307692307693" height="15" fill="#FFFFFF"/>
<text x="570" y="26" font-size="11" fill="#6B7280" text-anchor="middle">전환 기준: 코드로 검증할 수 있는 사실</text>
<rect x="30" y="200" width="250" height="70" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="155.0" y="231.0" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">앱이 현재 단계를 상태로 보관</text>
<text x="155.0" y="246.0" font-size="11" fill="#6B7280" text-anchor="middle">(대화 유연성은 Claude에 맡김)</text>
<rect x="330" y="200" width="240" height="70" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="450.0" y="230.0" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">요청 생성: tools에</text>
<text x="450.0" y="247.0" font-size="13" fill="#1F2937" text-anchor="middle">현재 상태의 허용 tool만</text>
<rect x="620" y="200" width="250" height="70" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="745.0" y="230.5" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Claude</text>
<text x="745.0" y="246.5" font-size="12" fill="#1F2937" text-anchor="middle">없는 tool은 호출할 수 없음</text>
<polyline points="280,235 328,235" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-8-state-machine-gating)"/>
<polyline points="570,235 618,235" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-8-state-machine-gating)"/>
<polyline points="745,270 745,300 155,300 155,272" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-8-state-machine-gating)"/>
<rect x="364.3076923076923" y="282" width="171.3846153846154" height="16" fill="#FFFFFF"/>
<text x="450" y="294" font-size="12" fill="#1F2937" text-anchor="middle">tool 결과로 상태 전환 판단</text>
<text x="30" y="346" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="start">대안: tool 정의 고정 + 앱이 거부</text>
<rect x="30" y="360" width="260" height="66" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="160.0" y="388.0" font-size="12" fill="#1F2937" text-anchor="middle">tool 정의를 바꾸면</text>
<text x="160.0" y="404.0" font-size="12" fill="#1F2937" text-anchor="middle">prompt cache 전체 무효화</text>
<rect x="330" y="360" width="260" height="66" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="460.0" y="388.0" font-size="12" fill="#1F2937" text-anchor="middle">정의는 고정, 상태에 안 맞는</text>
<text x="460.0" y="404.0" font-size="12" fill="#1F2937" text-anchor="middle">호출은 앱이 거부</text>
<rect x="630" y="360" width="240" height="66" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="750.0" y="389.0" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">에러로 돌려줌</text>
<text x="750.0" y="404.0" font-size="11" fill="#6B7280" text-anchor="middle">(is_error tool_result)</text>
<polyline points="290,393 328,393" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-8-state-machine-gating)"/>
<polyline points="590,393 628,393" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-8-state-machine-gating)"/>
<rect x="30" y="456" width="840" height="96" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="450.0" y="492.0" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">오답: 판단을 모델에 남김 → 확률적일 뿐 보장 아님</text>
<text x="450.0" y="508.0" font-size="12" fill="#1F2937" text-anchor="middle">system 프롬프트의 번호 목록  |  few-shot  |  effort 상향  |  "다음 단계 이름을 JSON으로 출력"</text>
<text x="450.0" y="523.0" font-size="11" fill="#1F2937" text-anchor="middle">is_error 사후 회복으로는 되돌리기 어려운 작업(예약 확정·취소)의 첫 호출을 못 막음</text>
<rect x="30" y="569" width="14" height="14" rx="3" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="50" y="580" font-size="11" fill="#6B7280" text-anchor="start">코드로 강제하는 경로</text>
<rect x="179.69230769230768" y="569" width="14" height="14" rx="3" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
<text x="199.69230769230768" y="580" font-size="11" fill="#6B7280" text-anchor="start">변경 실행 허용</text>
<rect x="296.38461538461536" y="569" width="14" height="14" rx="3" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="316.38461538461536" y="580" font-size="11" fill="#6B7280" text-anchor="start">오답</text>
</svg>
