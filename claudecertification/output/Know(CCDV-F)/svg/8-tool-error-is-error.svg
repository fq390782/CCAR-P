<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-label="tool 실패는 is_error: true인 tool_result로 모델에 돌려준다" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">
<title>tool 실패는 is_error: true인 tool_result로 모델에 돌려준다</title>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<defs><marker id="arr-8-tool-error-is-error" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker></defs>
<rect x="30" y="200" width="150" height="50" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="105.0" y="228.5" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">tool 실행 실패</text>
<polygon points="300,170.0 400.0,225 300,280.0 200.0,225" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
<text x="300" y="220.0" font-size="13" fill="#1F2937" text-anchor="middle">실패를 모델에</text>
<text x="300" y="237.0" font-size="13" fill="#1F2937" text-anchor="middle">어떻게 알리나?</text>
<polyline points="180,225 198,225" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-8-tool-error-is-error)"/>
<rect x="470" y="30" width="400" height="74" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="670.0" y="62.5" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">tool_result + is_error: true</text>
<text x="670.0" y="78.5" font-size="12" fill="#1F2937" text-anchor="middle">무엇이 일어났고 다음에 무엇을 시도할지 구체적으로</text>
<polyline points="300,170 300,67 468,67" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-8-tool-error-is-error)"/>
<rect x="326" y="108" width="32.0" height="16" fill="#FFFFFF"/>
<text x="330" y="120" font-size="12" fill="#1F2937" text-anchor="start">정답</text>
<rect x="470" y="124" width="400" height="58" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
<text x="670.0" y="148.0" font-size="12" fill="#1F2937" text-anchor="middle">모델이 회복: 인자 수정 / 다른 방법 선택 /</text>
<text x="670.0" y="164.0" font-size="12" fill="#1F2937" text-anchor="middle">사용자에게 설명</text>
<polyline points="670,104 670,122" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-8-tool-error-is-error)"/>
<rect x="470" y="210" width="400" height="50" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="670.0" y="231.0" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">빈 tool_result로 위장</text>
<text x="670.0" y="246.0" font-size="11" fill="#1F2937" text-anchor="middle">"데이터 없음"으로 오해 (알레르겐 없음 착각)</text>
<polyline points="400,225 440,225 440,235 468,235" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-8-tool-error-is-error)"/>
<rect x="470" y="272" width="400" height="50" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="670.0" y="293.0" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">성공할 때까지 무한 재시도</text>
<text x="670.0" y="308.0" font-size="11" fill="#1F2937" text-anchor="middle">같은 결함 반복, 장애 지속 시 응답 없음</text>
<polyline points="400,225 440,225 440,297 468,297" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-8-tool-error-is-error)"/>
<rect x="470" y="334" width="400" height="50" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="670.0" y="355.0" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">raw 에러를 최종 사용자에게</text>
<text x="670.0" y="370.0" font-size="11" fill="#1F2937" text-anchor="middle">내부 정보 노출</text>
<polyline points="400,225 440,225 440,359 468,359" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-8-tool-error-is-error)"/>
<rect x="470" y="396" width="400" height="50" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="670.0" y="417.0" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">예외 던지고 대화 종료</text>
<text x="670.0" y="432.0" font-size="11" fill="#1F2937" text-anchor="middle">설명·대안 제시 기회 소실</text>
<polyline points="400,225 440,225 440,421 468,421" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-8-tool-error-is-error)"/>
<rect x="404.0" y="202" width="32.0" height="16" fill="#FFFFFF"/>
<text x="420" y="214" font-size="12" fill="#1F2937" text-anchor="middle">오답</text>
<rect x="30" y="300" width="340" height="110" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="200.0" y="342.5" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">예외적으로 맞을 수 있음</text>
<text x="200.0" y="358.5" font-size="12" fill="#1F2937" text-anchor="middle">일시적 장애 → 제한된 재시도</text>
<text x="200.0" y="374.5" font-size="12" fill="#1F2937" text-anchor="middle">복구 불가 장애(인증 만료) → 중단</text>
<rect x="30" y="430" width="340" height="74" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
<text x="200.0" y="455.5" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">is_error는 호출 "뒤"의 회복 수단</text>
<text x="200.0" y="470.5" font-size="11" fill="#1F2937" text-anchor="middle">잘못된 tool 선택 자체는 못 막음,</text>
<text x="200.0" y="485.5" font-size="11" fill="#1F2937" text-anchor="middle">되돌리기 어려운 작업은 이미 영향 발생</text>
</svg>
