<text x="220.0" y="243.2" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="middle">가장 중요한 지시가</text>
<text x="220.0" y="260.2" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="middle">긴 프롬프트 한가운데?</text>
