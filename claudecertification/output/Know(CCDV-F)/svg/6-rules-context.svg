<text x="680.0" y="328.5" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">관련 자료만 (정확도도 떨어짐)</text>
<text x="680.0" y="344.3" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="middle">오답: 모델이 무관한 것은 무시한다</text>
