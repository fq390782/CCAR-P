<text x="680.0" y="244.5" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">놓치기 쉬움 → 앞이나 끝으로 이동</text>
<text x="680.0" y="260.3" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="middle">오답: 위치는 상관없다 / 오류가 난다</text>
