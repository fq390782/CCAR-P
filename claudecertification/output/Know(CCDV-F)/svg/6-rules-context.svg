<text x="220.0" y="411.2" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="middle">장시간 assistant가 반복 · 혼동 · 지시 망각,</text>
<text x="220.0" y="428.2" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="middle">tool output으로 가득?</text>
