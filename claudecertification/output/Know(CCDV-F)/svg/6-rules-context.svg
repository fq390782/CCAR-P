<text x="680.0" y="152.0" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">문서를 앞으로, 질문은 끝</text>
<text x="680.0" y="169.2" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="middle">문서별 &lt;document&gt; + &lt;source&gt; 태그</text>
<text x="680.0" y="184.8" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="middle">오답: 문서를 질문 앞뒤로 두 번</text>
