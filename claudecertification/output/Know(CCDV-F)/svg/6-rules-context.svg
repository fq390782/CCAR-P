<svg xmlns="http://www.w3.org/2000/svg" width="900" height="732" viewBox="0 0 900 732" role="img" aria-label="판단 규칙 ③: 긴 문서 · context 관리" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">
<title>판단 규칙 ③: 긴 문서 · context 관리</title>
<defs><marker id="arr-rules-context" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="20" y="30" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="start">판단 규칙 ③: 긴 문서 · context 관리</text>
<polygon points="36,50 404,50 420,80.0 404,110 36,110 20,80.0" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
<text x="220.0" y="75.2" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="middle">긴 계약서 · 보고서에서 답이</text>
<text x="220.0" y="92.2" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="middle">관련 조항을 놓침?</text>
<rect x="480" y="50" width="400" height="60" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="680.0" y="68.0" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">문서를 태그로 감싸 위에, 지시 · 질문은 끝</text>
<text x="680.0" y="85.2" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="middle">+ 관련 조항을 먼저 인용</text>
<text x="680.0" y="100.8" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="middle">오답: effort ↑, cache_control, 사전 요약</text>
<polyline points="420,80.0 480,80.0" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-rules-context)"/>
<rect x="440.5" y="60.0" width="19.0" height="16" fill="#FFFFFF"/>
<text x="450.0" y="72.5" font-size="11" font-weight="normal" fill="#1F2937" text-anchor="middle">예</text>
<polyline points="220.0,110 220.0,134" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-rules-context)"/>
<rect x="224.0" y="113" width="41.0" height="16" fill="#FFFFFF"/>
<text x="228.0" y="125.5" font-size="11" font-weight="normal" fill="#1F2937" text-anchor="start">아니오</text>
<polygon points="36,134 404,134 420,164.0 404,194 36,194 20,164.0" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
<text x="220.0" y="159.2" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="middle">여러 긴 문서를 구분 없이 이어 붙이고</text>
<text x="220.0" y="176.2" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="middle">질문은 앞?</text>
