<text x="680.0" y="412.5" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">prune · 요약 / compact / subagent로 isolate</text>
<text x="680.0" y="428.3" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="middle">오답: 1M 창, system prompt 반복, max_tokens</text>
