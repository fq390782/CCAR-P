<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" role="img" aria-label="SDK와 raw HTTP, 플랫폼 client가 같은 Messages 인터페이스를 쓰는 구조" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">
