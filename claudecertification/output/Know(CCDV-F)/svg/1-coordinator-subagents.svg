<text x="460.0" y="136.1" font-size="13" fill="#1F2937" text-anchor="middle" font-weight="bold">Coordinator (orchestrator)</text>
<text x="460.0" y="154.1" font-size="13" fill="#1F2937" text-anchor="middle">① 입력에 맞춰 subtask 분해   ② 독립 subtask 위임(병렬)   ③ 요약 통합 · 실패 격리</text>
<text x="460.0" y="170.7" font-size="11" fill="#6B7280" text-anchor="middle">부모 context window에는 subagent 요약만 쌓인다</text>
