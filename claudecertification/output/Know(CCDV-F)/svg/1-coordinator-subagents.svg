<svg xmlns="http://www.w3.org/2000/svg" width="920" height="545" viewBox="0 0 920 545" role="img" aria-label="Coordinator 1개와 Subagent n개: 위임 prompt가 내려가고 요약만 올라온다" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">
<title>Coordinator 1개와 Subagent n개: 위임 prompt가 내려가고 요약만 올라온다</title>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<defs><marker id="arr-d1-coordinator-subagents-k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker><marker id="arr-d1-coordinator-subagents-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker><marker id="arr-d1-coordinator-subagents-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="arr-d1-coordinator-subagents-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/></marker></defs>
<text x="20" y="30" font-size="14" fill="#1F2937" text-anchor="start" font-weight="bold">Coordinator + Subagent — 위임은 prompt로, 반환은 요약만</text>
<rect x="40" y="40" width="120" height="40" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
