<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-label="API key와 secret 관리 흐름: 서버 측 보관">
<title>API key와 secret 관리 흐름: 서버 측 보관</title>
<defs><marker id="arr-secret-management" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<g font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">
<text x="450" y="28" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">API key / secret: 클라이언트와 prompt 밖, 서버 쪽에만 둔다</text><rect x="20" y="42" width="860" height="112" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/><text x="36" y="64" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="start">오답: key가 클라이언트나 prompt 안에 있음</text><rect x="35" y="82" width="270" height="56" rx="6" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/><text x="170.0" y="106.7" font-size="13" fill="#1F2937" text-anchor="middle">browser JS 안의 key</text><text x="170.0" y="122.8" font-size="11" fill="#1F2937" text-anchor="middle">클라이언트로 보낸 것은 사용자가 모두 읽음</text><rect x="315" y="82" width="270" height="56" rx="6" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/><text x="450.0" y="106.7" font-size="13" fill="#1F2937" text-anchor="middle">난독화 · Base64 · local storage · IP 제한</text><text x="450.0" y="122.8" font-size="11" fill="#1F2937" text-anchor="middle">되돌릴 수 있거나 여전히 클라이언트에 있음</text><rect x="595" y="82" width="270" height="56" rx="6" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/><text x="730.0" y="106.7" font-size="13" fill="#1F2937" text-anchor="middle">repo · system prompt template 속 key</text><text x="730.0" y="122.8" font-size="11" fill="#1F2937" text-anchor="middle">'공개하지 마라' · 위치 이동은 여전히 노출</text><rect x="20" y="166" width="860" height="38" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/><text x="450.0" y="189.4" font-size="13" fill="#1F2937" text-anchor="middle">① 이미 노출된 key는 먼저 rotate  →  ② backend · secret manager로 옮긴다 (옮기기만 하면 오답)</text><rect x="20" y="218" width="860" height="268" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/><text x="36" y="242" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="start">정답: key는 서버 쪽에만, 모델은 credential을 보지 않는다</text><rect x="40" y="291" width="140" height="52" rx="6" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/><text x="110.0" y="313.7" font-size="13" fill="#1F2937" text-anchor="middle">browser</text><text x="110.0" y="329.8" font-size="11" fill="#1F2937" text-anchor="middle">key 없음</text><polyline points="180,317 228,317" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-secret-management)"/><text x="204" y="309" font-size="11" fill="#1F2937" text-anchor="middle">요청</text><rect x="230" y="262" width="210" height="110" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/><text x="335.0" y="304.6" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">backend (proxy)</text><text x="335.0" y="322.8" font-size="13" fill="#1F2937" text-anchor="middle">tool 실행 코드</text><text x="335.0" y="338.9" font-size="11" fill="#1F2937" text-anchor="middle">credential로 직접 인증</text><polyline points="440,280 538,280" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-secret-management)"/><text x="489" y="273" font-size="11" fill="#1F2937" text-anchor="middle">prompt (key 없음)</text><rect x="540" y="262" width="160" height="52" rx="6" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/><text x="620.0" y="284.7" font-size="13" fill="#1F2937" text-anchor="middle">Claude</text><text x="620.0" y="300.8" font-size="11" fill="#1F2937" text-anchor="middle">context에 credential 없음</text><polyline points="540,300 442,300" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-secret-management)"/><text x="489" y="316" font-size="11" fill="#1F2937" text-anchor="middle">tool_use</text><polyline points="440,362 538,362" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-secret-management)"/><text x="489" y="355" font-size="11" fill="#1F2937" text-anchor="middle">인증 후 호출</text><rect x="540" y="340" width="160" height="46" rx="6" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/><text x="620.0" y="367.4" font-size="13" fill="#1F2937" text-anchor="middle">외부 API · DB</text><rect x="230" y="412" width="210" height="50" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/><text x="335.0" y="441.4" font-size="13" fill="#1F2937" text-anchor="middle">env var / secret manager</text><polyline points="335,412 335,374" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-secret-management)"/><text x="345" y="397" font-size="11" fill="#1F2937" text-anchor="start">인증할 때만 읽음</text><rect x="725" y="262" width="140" height="124" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/><text x="795.0" y="292.7" font-size="11" fill="#1F2937" text-anchor="middle">모델은 credential을</text><text x="795.0" y="308.1" font-size="11" fill="#1F2937" text-anchor="middle">보지 않는다</text><text x="795.0" y="318.3" font-size="6" fill="#1F2937" text-anchor="middle"></text><text x="795.0" y="331.9" font-size="11" fill="#1F2937" text-anchor="middle">credential은</text><text x="795.0" y="347.3" font-size="11" fill="#1F2937" text-anchor="middle">tool 코드가 인증할</text><text x="795.0" y="362.7" font-size="11" fill="#1F2937" text-anchor="middle">때만 쓴다</text>
</g>
</svg>
