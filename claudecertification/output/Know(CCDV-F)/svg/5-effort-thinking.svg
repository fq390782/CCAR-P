<svg xmlns="http://www.w3.org/2000/svg" width="900" height="570" viewBox="0 0 900 570" role="img" aria-label="사고량은 workload별로 정하고, 바꾸기 전에 eval로 확인한다">
<title>사고량은 workload별로 정하고, 바꾸기 전에 eval로 확인한다</title>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<defs><marker id="arr-effort-thinking" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker><marker id="arr-effort-thinking-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker></defs>
<g font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">
<text x="450" y="30" font-size="14" text-anchor="middle" fill="#1F2937" font-weight="bold">사고량은 workload별로 정하고, 바꾸기 전에 eval로 확인한다</text>
<rect x="20" y="70" width="130" height="44" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="85" y="96.55" font-size="13" text-anchor="middle" fill="#1F2937">workload별 판단</text>
<polyline points="150,92 178,92" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-effort-thinking)"/>
<polygon points="290,44.0 400.0,92 290,140.0 180.0,92" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
<text x="290" y="87.55" font-size="13" text-anchor="middle" fill="#1F2937">multi-step</text>
<text x="290" y="105.55" font-size="13" text-anchor="middle" fill="#1F2937">추론이 필요?</text>
<polyline points="400,92 458,92" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-effort-thinking)"/>
<rect x="420.5" y="75" width="17" height="15" fill="#FFFFFF"/>
<text x="429" y="86" font-size="11" text-anchor="middle" fill="#1F2937">예</text>
<rect x="460" y="64" width="260" height="56" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="590" y="88.55" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="bold">effort 높게</text>
<text x="590" y="104.85" font-size="11" text-anchor="middle" fill="#6B7280">adaptive thinking이 더 깊게 생각</text>
<polyline points="290,140 290,183" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-effort-thinking)"/>
<rect x="309" y="155" width="39" height="15" fill="#FFFFFF"/>
<text x="312" y="166" font-size="11" text-anchor="start" fill="#1F2937">아니오</text>
<polygon points="290,185.0 410.0,240 290,295.0 170.0,240" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
<text x="290" y="235.55" font-size="13" text-anchor="middle" fill="#1F2937">형식이 정해진</text>
<text x="290" y="253.55" font-size="13" text-anchor="middle" fill="#1F2937">분류 · 단순 응답?</text>
<polyline points="410,240 458,240" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-effort-thinking)"/>
<rect x="425.5" y="223" width="17" height="15" fill="#FFFFFF"/>
<text x="434" y="234" font-size="11" text-anchor="middle" fill="#1F2937">예</text>
<rect x="460" y="212" width="260" height="56" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="590" y="236.55" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="bold">effort 낮게 + few-shot</text>
<text x="590" y="252.85" font-size="11" text-anchor="middle" fill="#6B7280">관련성 있고 다양한 예시 3~5개</text>
<polyline points="290,295 290,328" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-effort-thinking)"/>
<rect x="301" y="305" width="31.3846" height="15" fill="#FFFFFF"/>
<text x="304" y="316" font-size="11" text-anchor="start" fill="#1F2937">그 밖</text>
<rect x="200" y="330" width="180" height="44" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="290" y="356.55" font-size="13" text-anchor="middle" fill="#1F2937">eval로 수준 결정</text>
<rect x="760" y="64" width="120" height="204" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
<text x="820" y="143.55" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="bold">eval로</text>
<text x="820" y="161.55" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="bold">품질 유지</text>
<text x="820" y="179.55" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="bold">확인 후</text>
<text x="820" y="197.55" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="bold">적용</text>
<polyline points="720,92 758,92" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-effort-thinking)"/>
<polyline points="720,240 758,240" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-effort-thinking)"/>
<text x="450" y="312" font-size="11" text-anchor="start" fill="#6B7280">역할 구분: few-shot = 어떤 형태로 답할지 · effort = 얼마나 생각할지</text>
<text x="40" y="412" font-size="13" text-anchor="start" fill="#1F2937" font-weight="bold">effort</text>
<polyline points="100,408 860,408" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-effort-thinking)"/>
<text x="110" y="432" font-size="11" text-anchor="start" fill="#1F2937">low</text>
<text x="850" y="432" font-size="11" text-anchor="end" fill="#1F2937">max</text>
<text x="110" y="450" font-size="11" text-anchor="start" fill="#6B7280">생각을 덜 함 · token 적음</text>
<text x="850" y="450" font-size="11" text-anchor="end" fill="#6B7280">더 적극적 · 깊게 생각 → thinking token(output 과금) · latency ↑</text>
<rect x="20" y="474" width="860" height="40" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="450" y="498.55" font-size="13" text-anchor="middle" fill="#1F2937">✗ 모든 요청에 thinking 일괄 on/off      ✗ 분류에 effort max      ✗ few-shot 수십 개로 추론 대체</text>
<text x="450" y="540" font-size="11" text-anchor="middle" fill="#6B7280">⚠ budget_tokens로 사고량을 고정하던 예전 extended thinking은 해설상 Opus 4.7 이후 모델에서 받지 않음 (문서 확인)</text>
</g>
</svg>
