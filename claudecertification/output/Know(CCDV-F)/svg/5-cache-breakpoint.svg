<svg xmlns="http://www.w3.org/2000/svg" width="920" height="490" viewBox="0 0 920 490" role="img" aria-label="cache_control은 공유 prefix의 마지막 block에, 바뀌는 값은 그 뒤에">
<title>cache_control은 공유 prefix의 마지막 block에, 바뀌는 값은 그 뒤에</title>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<defs><marker id="arr-cache-breakpoint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker><marker id="arr-cache-breakpoint-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker></defs>
<g font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">
<text x="460" y="30" font-size="14" text-anchor="middle" fill="#1F2937" font-weight="bold">cache_control은 공유 prefix의 마지막 block에, 바뀌는 값은 그 뒤에</text>
<text x="30" y="58" font-size="11" text-anchor="start" fill="#6B7280">렌더링 순서: tools → system → messages (byte 단위 prefix 일치)</text>
<text x="30" y="84" font-size="13" text-anchor="start" fill="#1F2937" font-weight="bold">✓ 공유 preamble 마지막 block에 breakpoint</text>
<rect x="30" y="96" width="130" height="44" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="95" y="122.55" font-size="13" text-anchor="middle" fill="#1F2937">tools</text>
<rect x="160" y="96" width="270" height="44" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="295" y="122.55" font-size="13" text-anchor="middle" fill="#1F2937">system (마지막 block)</text>
<rect x="430" y="96" width="190" height="44" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="525" y="122.55" font-size="13" text-anchor="middle" fill="#1F2937">질문 (매번 다름)</text>
<line x1="430" y1="88" x2="430" y2="148" stroke="#1F2937" stroke-width="3"/>
<text x="430" y="162" font-size="11" text-anchor="middle" fill="#1F2937">cache_control</text>
<rect x="650" y="90" width="250" height="56" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
<text x="775" y="113.55" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="bold">첫 요청: cache write</text>
<text x="775" y="131.55" font-size="13" text-anchor="middle" fill="#1F2937">이후 요청: cache read</text>
<text x="30" y="180" font-size="11" text-anchor="start" fill="#6B7280">앞 prefix 전체가 cache key, 질문은 cache 밖</text>
<text x="30" y="214" font-size="13" text-anchor="start" fill="#1F2937" font-weight="bold">✗ 질문 뒤에 breakpoint</text>
<rect x="30" y="226" width="130" height="44" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="95" y="252.55" font-size="13" text-anchor="middle" fill="#1F2937">tools</text>
<rect x="160" y="226" width="270" height="44" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="295" y="252.55" font-size="13" text-anchor="middle" fill="#1F2937">system</text>
<rect x="430" y="226" width="190" height="44" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="525" y="252.55" font-size="13" text-anchor="middle" fill="#1F2937">질문 (매번 다름)</text>
<line x1="620" y1="218" x2="620" y2="278" stroke="#1F2937" stroke-width="3"/>
<text x="620" y="292" font-size="11" text-anchor="middle" fill="#1F2937">cache_control</text>
<rect x="650" y="220" width="250" height="56" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="775" y="243.55" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="bold">요청마다 새 entry write</text>
<text x="775" y="261.55" font-size="13" text-anchor="middle" fill="#1F2937">다시 읽히지 않음</text>
<text x="30" y="324" font-size="13" text-anchor="start" fill="#1F2937" font-weight="bold">✗ prefix 안에 바뀌는 값</text>
<rect x="30" y="336" width="130" height="44" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="95" y="362.55" font-size="13" text-anchor="middle" fill="#1F2937">tools</text>
<rect x="160" y="336" width="270" height="44" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="295" y="362.55" font-size="13" text-anchor="middle" fill="#1F2937">system + timestamp/UUID</text>
<rect x="430" y="336" width="190" height="44" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="525" y="362.55" font-size="13" text-anchor="middle" fill="#1F2937">질문</text>
<line x1="430" y1="328" x2="430" y2="388" stroke="#1F2937" stroke-width="3"/>
<text x="430" y="402" font-size="11" text-anchor="middle" fill="#1F2937">cache_control</text>
<rect x="650" y="330" width="250" height="56" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="775" y="353.55" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="bold">prefix byte 불일치</text>
<text x="775" y="371.55" font-size="13" text-anchor="middle" fill="#1F2937">cache_read_input_tokens = 0</text>
<text x="30" y="420" font-size="11" text-anchor="start" fill="#6B7280">→ 해결: timestamp · UUID · 요청마다 바뀌는 tool set을 마지막 breakpoint 뒤로</text>
<text x="460" y="470" font-size="11" text-anchor="middle" fill="#6B7280">cache_control은 개별 content block에 붙임 (요청 최상위 · model parameter ✗) · 요청당 breakpoint 최대 4개</text>
</g>
</svg>
