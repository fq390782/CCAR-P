<svg xmlns="http://www.w3.org/2000/svg" width="880" height="380" viewBox="0 0 880 380" role="img" aria-label="temperature 0도 비결정적이므로, 테스트는 구조와 핵심 사실을 assert한다">
<title>temperature 0도 비결정적이므로, 테스트는 구조와 핵심 사실을 assert한다</title>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<defs><marker id="arr-flaky-test" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker><marker id="arr-flaky-test-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker></defs>
<g font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">
<text x="440" y="30" font-size="14" text-anchor="middle" fill="#1F2937" font-weight="bold">temperature 0도 비결정적이므로, 테스트는 구조와 핵심 사실을 assert한다</text>
<rect x="20" y="60" width="180" height="56" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="110" y="84.55" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="bold">temperature = 0</text>
<text x="110" y="100.85" font-size="11" text-anchor="middle" fill="#6B7280">무작위성 최소로</text>
<polyline points="200,88 248,88" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-flaky-test)"/>
<rect x="204.5" y="71" width="39" height="15" fill="#FFFFFF"/>
<text x="224" y="82" font-size="11" text-anchor="middle" fill="#1F2937">그래도</text>
<rect x="250" y="60" width="210" height="56" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="355" y="84.55" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="bold">비결정적</text>
<text x="355" y="100.85" font-size="11" text-anchor="middle" fill="#6B7280">같은 입력도 호출마다 다를 수 있음</text>
<polyline points="460,88 488,88" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-flaky-test)"/>
<polygon points="580,38.0 670.0,88 580,138.0 490.0,88" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
<text x="580" y="83.55" font-size="13" text-anchor="middle" fill="#1F2937">무엇을</text>
<text x="580" y="101.55" font-size="13" text-anchor="middle" fill="#1F2937">assert?</text>
<polyline points="670,88 698,88" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-flaky-test)"/>
<rect x="670" y="69" width="28" height="15" fill="#FFFFFF"/>
<text x="684" y="80" font-size="11" text-anchor="middle" fill="#1F2937">권장</text>
<rect x="700" y="50" width="170" height="76" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
<text x="785" y="76.55" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="bold">✓ 구조 · 핵심 사실</text>
<text x="785" y="92.85" font-size="11" text-anchor="middle" fill="#6B7280">schema · 필수 필드 · 수치</text>
<text x="785" y="108.85" font-size="11" text-anchor="middle" fill="#6B7280">또는 rubric 채점</text>
<polyline points="580,138 580,188" fill="none" stroke="#DC2626" stroke-width="1.5" marker-end="url(#arr-flaky-test-r)"/>
<rect x="587" y="155" width="85.5385" height="15" fill="#FFFFFF"/>
<text x="590" y="166" font-size="11" text-anchor="start" fill="#DC2626">golden string</text>
<rect x="460" y="190" width="240" height="56" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="580" y="213.55" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="bold">✗ 정확 일치 비교</text>
<text x="580" y="231.55" font-size="13" text-anchor="middle" fill="#1F2937">실패가 들쭉날쭉 (flaky)</text>
<polyline points="520,246 400,288" fill="none" stroke="#DC2626" stroke-width="1.5" marker-end="url(#arr-flaky-test-r)"/>
<polyline points="640,246 700,288" fill="none" stroke="#DC2626" stroke-width="1.5" marker-end="url(#arr-flaky-test-r)"/>
<rect x="250" y="290" width="280" height="56" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="390" y="313.55" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="bold">✗ 통과할 때까지 retry</text>
<text x="390" y="331.55" font-size="13" text-anchor="middle" fill="#1F2937">회귀를 숨김</text>
<rect x="560" y="290" width="280" height="56" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="700" y="313.55" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="bold">✗ 테스트 삭제</text>
<text x="700" y="331.55" font-size="13" text-anchor="middle" fill="#1F2937">안전망이 사라짐</text>
</g>
</svg>
