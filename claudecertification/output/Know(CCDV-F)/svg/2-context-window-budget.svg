<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img" aria-label="context window에 계산되는 항목과 초과 시 동작" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">
<title>context window에 계산되는 항목과 초과 시 동작</title>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<defs><marker id="arr-context-window-budget" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker></defs>
<text x="450" y="28" font-size="14" text-anchor="middle" fill="#1F2937" font-weight="bold">context window = 입력(tools · system · messages) + 이번 턴 출력(thinking 포함)</text>
<rect x="40" y="60" width="130" height="50" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="105.0" y="89.5" font-size="13" text-anchor="middle" fill="#1F2937">tools 정의</text>
<rect x="170" y="60" width="150" height="50" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="245.0" y="89.5" font-size="13" text-anchor="middle" fill="#1F2937">system</text>
<rect x="320" y="60" width="300" height="50" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="470.0" y="89.5" font-size="13" text-anchor="middle" fill="#1F2937">messages (tool result · 이미지 포함)</text>
<rect x="620" y="60" width="240" height="50" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="740.0" y="89.5" font-size="13" text-anchor="middle" fill="#1F2937">출력 (thinking 포함)</text>
<polyline points="40,122 40,130 620,130 620,122" fill="none" stroke="#6B7280" stroke-width="1.5"/>
<text x="330" y="146" font-size="11" text-anchor="middle" fill="#6B7280">입력: 요청에 실제로 보낸 모든 것</text>
<polyline points="620,122 620,130 860,130 860,122" fill="none" stroke="#6B7280" stroke-width="1.5"/>
<text x="740" y="146" font-size="11" text-anchor="middle" fill="#6B7280">max_tokens = 출력 상한 (window 크기 아님)</text>
<rect x="30" y="175" width="270" height="54" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="165.0" y="198.0" font-size="13" text-anchor="middle" fill="#1F2937">보내기 전에 측정</text>
<text x="165.0" y="215.0" font-size="11" text-anchor="middle" fill="#6B7280">token counting endpoint</text>
<rect x="30" y="260" width="270" height="60" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="165.0" y="286.0" font-size="13" text-anchor="middle" fill="#1F2937">token counting endpoint에</text>
<text x="165.0" y="303.0" font-size="13" text-anchor="middle" fill="#1F2937">실제 system · tools · messages</text>
<rect x="30" y="345" width="270" height="60" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="165.0" y="371.0" font-size="13" text-anchor="middle" fill="#1F2937">부정확: "4글자 = 1토큰" 어림셈,</text>
<text x="165.0" y="388.0" font-size="13" text-anchor="middle" fill="#1F2937">Claude에게 직접 세게 하기</text>
<polyline points="165,229 165,260" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-context-window-budget)"/>
<rect x="180.0" y="236.0" width="30.0" height="18" fill="#FFFFFF"/>
<text x="195" y="249.5" font-size="11" text-anchor="middle" fill="#6B7280">정확</text>
<polygon points="470,180.0 585.0,230 470,280.0 355.0,230" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
<text x="470" y="226.0" font-size="13" text-anchor="middle" fill="#1F2937">입력만으로</text>
<text x="470" y="243.0" font-size="13" text-anchor="middle" fill="#1F2937">window 초과?</text>
<rect x="360" y="330" width="220" height="70" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="470.0" y="352.5" font-size="13" text-anchor="middle" fill="#1F2937">생성 전 400</text>
<text x="470.0" y="369.5" font-size="13" text-anchor="middle" fill="#1F2937">invalid_request_error</text>
<text x="470.0" y="386.5" font-size="11" text-anchor="middle" fill="#6B7280">prompt is too long · 자동 절단 없음</text>
<polyline points="470,280 470,330" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-context-window-budget)"/>
<rect x="475.5" y="296.0" width="19.0" height="18" fill="#FFFFFF"/>
<text x="485" y="309.5" font-size="11" text-anchor="middle" fill="#6B7280">예</text>
<polygon points="720,180.0 825.0,230 720,280.0 615.0,230" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
<text x="720" y="226.0" font-size="13" text-anchor="middle" fill="#1F2937">입력 + max_tokens</text>
<text x="720" y="243.0" font-size="13" text-anchor="middle" fill="#1F2937">&gt; window?</text>
<polyline points="585,230 615,230" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-context-window-budget)"/>
<rect x="579.5" y="206.0" width="41.0" height="18" fill="#FFFFFF"/>
<text x="600" y="219.5" font-size="11" text-anchor="middle" fill="#6B7280">아니오</text>
<rect x="620" y="330" width="260" height="70" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="750.0" y="352.5" font-size="13" text-anchor="middle" fill="#1F2937">Claude 4.5 이후: 요청은 수락</text>
<text x="750.0" y="369.5" font-size="13" text-anchor="middle" fill="#1F2937">생성이 한계에 닿으면 stop_reason</text>
<text x="750.0" y="386.5" font-size="13" text-anchor="middle" fill="#1F2937">model_context_window_exceeded</text>
<polyline points="720,280 720,330" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-context-window-budget)"/>
<rect x="725.5" y="296.0" width="19.0" height="18" fill="#FFFFFF"/>
<text x="735" y="309.5" font-size="11" text-anchor="middle" fill="#6B7280">예</text>
<text x="720" y="425" font-size="11" text-anchor="middle" fill="#6B7280">출력이 미완성일 수 있으므로 완성된 답으로 파싱하지 않는다</text>
</svg>
