<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-label="context hygiene: prune, compact, isolate 비교" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">
<title>context hygiene: prune, compact, isolate 비교</title>
<defs><marker id="arr-context-hygiene" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<rect x="150" y="16" width="600" height="54" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="450.0" y="38.5" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">증상: 반복 · 이전 사례 혼동 · 최근 지시 망각 · 자기모순</text>
<text x="450.0" y="55.7" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="middle">컨텍스트가 장황한 tool output으로 가득</text>
<polygon points="336,92 564,92 580,115.0 564,138 336,138 320,115.0" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
<text x="450.0" y="119.0" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">context drift / bloat</text>
<polyline points="450,70 450,92" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-context-hygiene)"/>
<rect x="20" y="170" width="280" height="52" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="160.0" y="191.5" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">Prune</text>
<text x="160.0" y="208.7" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="middle">tool output 자르기 · 요약</text>
<rect x="20" y="246" width="280" height="100" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="160.0" y="282.7" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="middle">context editing:</text>
<text x="160.0" y="299.7" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="middle">오래된(stale) tool result 제거</text>
<text x="160.0" y="316.7" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="middle">tool 응답은 필요한 항목만 반환</text>
<polyline points="450,138 450,154 160,154 160,170" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-context-hygiene)"/>
<polyline points="160,222 160,246" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-context-hygiene)"/>
<rect x="310" y="170" width="280" height="52" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="450.0" y="191.5" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">Compact</text>
<text x="450.0" y="208.7" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="middle">대화 이력 압축</text>
<rect x="310" y="246" width="280" height="100" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="450.0" y="275.2" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="middle">compaction:</text>
<text x="450.0" y="292.2" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="middle">오래된 턴 → server 측 요약</text>
<text x="450.0" y="309.2" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="middle">최근 턴은 원문 그대로</text>
<text x="450.0" y="324.8" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="middle">원래 문제 같은 핵심 사실은 유지</text>
<polyline points="450,138 450,154 450,154 450,170" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-context-hygiene)"/>
<polyline points="450,222 450,246" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-context-hygiene)"/>
<rect x="600" y="170" width="280" height="52" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="740.0" y="191.5" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">Isolate</text>
<text x="740.0" y="208.7" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="middle">독립 subtask를 분리</text>
<rect x="600" y="246" width="280" height="100" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="740.0" y="282.7" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="middle">독립 subtask → subagent</text>
<text x="740.0" y="299.7" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="middle">용건(task)이 바뀌면 세션 분리</text>
<text x="740.0" y="316.7" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="middle">main context를 가볍게 유지</text>
<polyline points="450,138 450,154 740,154 740,170" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-context-hygiene)"/>
<polyline points="740,222 740,246" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-context-hygiene)"/>
<rect x="20" y="370" width="860" height="84" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="450.0" y="399.0" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">해법이 아님</text>
<text x="450.0" y="416.2" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="middle">더 큰 창(1M)으로 이동 · max_tokens 조정 · 매 턴 system prompt 반복 · system prompt 제거</text>
<text x="450.0" y="433.2" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="middle">temperature ↑ · "앞선 혼동을 무시하라" 요청 · 이력 없이 새 대화 시작</text>
</svg>
