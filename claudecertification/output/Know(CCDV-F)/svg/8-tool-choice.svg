<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-label="tool_choice 네 가지와 신규 모델에서의 대안" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">
<title>tool_choice 네 가지와 신규 모델에서의 대안</title>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<defs><marker id="arr-8-tool-choice" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker></defs>
<rect x="30" y="30" width="196" height="120" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="128.0" y="70.5" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">tool_choice: auto</text>
<text x="128.0" y="86.5" font-size="12" fill="#6B7280" text-anchor="middle">기본값</text>
<text x="128.0" y="102.5" font-size="12" fill="#1F2937" text-anchor="middle">호출 여부를 모델이 판단</text>
<text x="128.0" y="117.5" font-size="11" fill="#1F2937" text-anchor="middle">특정 tool 호출 보장 안 됨</text>
<rect x="244" y="30" width="196" height="120" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="342.0" y="78.0" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">tool_choice: any</text>
<text x="342.0" y="94.0" font-size="12" fill="#6B7280" text-anchor="middle">강제</text>
<text x="342.0" y="110.0" font-size="12" fill="#1F2937" text-anchor="middle">어떤 tool이든 반드시 사용</text>
<rect x="458" y="30" width="196" height="120" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="556.0" y="70.5" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">tool_choice: tool</text>
<text x="556.0" y="86.5" font-size="12" fill="#6B7280" text-anchor="middle">강제</text>
<text x="556.0" y="102.5" font-size="12" fill="#1F2937" text-anchor="middle">지정한 tool을 반드시 사용</text>
<text x="556.0" y="117.5" font-size="11" fill="#1F2937" text-anchor="middle">"답 전에 이 tool 먼저"의 정답</text>
<rect x="672" y="30" width="196" height="120" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="770.0" y="78.0" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">tool_choice: none</text>
<text x="770.0" y="94.0" font-size="12" fill="#6B7280" text-anchor="middle">금지</text>
<text x="770.0" y="110.0" font-size="12" fill="#1F2937" text-anchor="middle">tool 사용 안 함</text>
<text x="450" y="190" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">"답하기 전에 반드시 특정 tool을 호출"해야 한다면</text>
<polygon points="450,210.0 600.0,260 450,310.0 300.0,260" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
<text x="450" y="255.0" font-size="13" fill="#1F2937" text-anchor="middle">모델이 any / tool을</text>
<text x="450" y="272.0" font-size="13" fill="#1F2937" text-anchor="middle">지원하나?</text>
<polyline points="450,196 450,208" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-8-tool-choice)"/>
<rect x="30" y="230" width="230" height="60" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="145.0" y="263.5" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">tool_choice로 그 tool 지정</text>
<polyline points="300,260 262,260" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-8-tool-choice)"/>
<rect x="265.0" y="240" width="32.0" height="16" fill="#FFFFFF"/>
<text x="281" y="252" font-size="12" fill="#1F2937" text-anchor="middle">지원</text>
<rect x="640" y="220" width="230" height="80" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="755.0" y="247.5" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">auto + 프롬프트 지시</text>
<text x="755.0" y="264.5" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">+ strict tool use</text>
<text x="755.0" y="279.5" font-size="11" fill="#1F2937" text-anchor="middle">(any/tool은 400 반환)</text>
<polyline points="600,260 638,260" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-8-tool-choice)"/>
<rect x="597.0" y="240" width="44.0" height="16" fill="#FFFFFF"/>
<text x="619" y="252" font-size="12" fill="#1F2937" text-anchor="middle">미지원</text>
<rect x="640" y="320" width="230" height="80" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="755.0" y="348.0" font-size="12" fill="#1F2937" text-anchor="middle">예: Opus 5.5, Fable 5.1</text>
<text x="755.0" y="363.0" font-size="11" fill="#6B7280" text-anchor="middle">시험 가이드(2026-07)보다 새 변경</text>
<text x="755.0" y="378.0" font-size="11" fill="#6B7280" text-anchor="middle">시험은 강제 가능 전제일 수 있음</text>
<rect x="30" y="330" width="520" height="70" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="290.0" y="360.5" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">오답: 입력 형식 문제에 tool_choice: auto</text>
<text x="290.0" y="376.5" font-size="12" fill="#1F2937" text-anchor="middle">auto는 기본값이라 설정해도 바뀌는 것이 없음</text>
</svg>
