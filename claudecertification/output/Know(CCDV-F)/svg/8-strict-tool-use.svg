<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-label="strict: true는 tool 입력을 input_schema로 검증해 형식 오류를 근원에서 막는다" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">
<title>strict: true는 tool 입력을 input_schema로 검증해 형식 오류를 근원에서 막는다</title>
