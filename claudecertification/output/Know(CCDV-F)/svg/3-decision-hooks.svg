<svg xmlns="http://www.w3.org/2000/svg" width="820" height="350" viewBox="0 0 820 350" role="img" aria-label="판단 트리: 실행 전에 막으려면 PreToolUse, 성공한 변경을 기록하려면 PostToolUse, 실패만 기록하려면 PostToolUseFailure" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">
  <title>hook 이벤트 선택 판단 트리</title>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <defs>
    <marker id="arr-dhook" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker>
  </defs>
  <text x="410" y="26" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F2937">"확실히, 매번" → hooks. 어느 시점에 개입하는가로 이벤트를 고른다</text>

  <polygon points="410,44 560,80 410,116 260,80" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="410" y="85" text-anchor="middle" font-size="13" fill="#1F2937">언제 개입하나?</text>
  <line x1="410" y1="116" x2="410" y2="136" stroke="#1F2937" stroke-width="1.5"/>
  <line x1="140" y1="136" x2="680" y2="136" stroke="#1F2937" stroke-width="1.5"/>
  <line x1="140" y1="136" x2="140" y2="174" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-dhook)"/>
  <line x1="410" y1="136" x2="410" y2="174" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-dhook)"/>
  <line x1="680" y1="136" x2="680" y2="174" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-dhook)"/>
  <text x="134" y="160" text-anchor="end" font-size="11" fill="#6B7280">실행 전에 막기</text>
  <text x="404" y="160" text-anchor="end" font-size="11" fill="#6B7280">성공한 변경을 빠짐없이 기록</text>
  <text x="674" y="160" text-anchor="end" font-size="11" fill="#6B7280">실패한 호출만 기록·알림</text>

  <rect x="20" y="176" width="240" height="64" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="140" y="200" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2937">PreToolUse</text>
  <text x="140" y="221" text-anchor="middle" font-size="11" fill="#6B7280">permissionDecision: deny 또는 exit 2</text>
  <rect x="290" y="176" width="240" height="64" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="410" y="200" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2937">PostToolUse</text>
  <text x="410" y="221" text-anchor="middle" font-size="11" fill="#6B7280">matcher: Edit|Write</text>
  <rect x="560" y="176" width="240" height="64" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="680" y="200" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2937">PostToolUseFailure</text>
  <text x="680" y="221" text-anchor="middle" font-size="11" fill="#6B7280">실패할 때만 발화</text>

  <rect x="20" y="262" width="240" height="64" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="140" y="286" text-anchor="middle" font-size="13" fill="#1F2937">오답: PostToolUse로 차단</text>
  <text x="140" y="307" text-anchor="middle" font-size="11" fill="#6B7280">이미 실행된 뒤라 관찰만 가능</text>
  <rect x="290" y="262" width="240" height="64" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="410" y="286" text-anchor="middle" font-size="13" fill="#1F2937">오답: PostToolUseFailure로 감사</text>
  <text x="410" y="307" text-anchor="middle" font-size="11" fill="#6B7280">성공한 변경에서는 발화하지 않음</text>
</svg>
