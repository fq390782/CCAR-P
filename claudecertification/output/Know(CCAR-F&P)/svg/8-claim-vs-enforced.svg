<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450" viewBox="0 0 960 450" role="img" aria-label="사용자 입력은 claim이고, 인가는 인증된 신원을 코드에서 대조해 강제한다" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">
<title>사용자 입력은 claim이고, 인가는 인증된 신원을 코드에서 대조해 강제한다</title>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<defs><marker id="arr-8-claim-vs-enforced" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker></defs>
<rect x="30" y="20" width="310" height="150" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="185.0" y="67.0" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">claim = 인가 근거 ✗</text>
<text x="185.0" y="83.0" font-size="12" fill="#1F2937" text-anchor="middle">채팅에 입력한 clinic 이름 · tenant_id</text>
<text x="185.0" y="99.0" font-size="12" fill="#1F2937" text-anchor="middle">드롭다운에서 고른 자회사</text>
<text x="185.0" y="115.0" font-size="12" fill="#1F2937" text-anchor="middle">편집 가능한 profile JSON의 company</text>
<text x="185.0" y="131.0" font-size="12" fill="#1F2937" text-anchor="middle">시스템 프롬프트 속 사용자 role 주장</text>
<rect x="30" y="205" width="310" height="80" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="185.0" y="233.0" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">인가 근거 ✓</text>
<text x="185.0" y="249.0" font-size="12" fill="#1F2937" text-anchor="middle">인증된 세션 · 신원에서 얻은 값</text>
<text x="185.0" y="265.0" font-size="12" fill="#1F2937" text-anchor="middle">서버가 설정한 편집 불가 필드</text>
<polyline points="340,110 408,110" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-8-claim-vs-enforced)"/>
<rect x="351.0" y="91" width="46.0" height="18" fill="#FFFFFF"/>
<text x="374" y="104" font-size="12" fill="#1F2937" text-anchor="middle">입력값</text>
<polyline points="340,232 408,232" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-8-claim-vs-enforced)"/>
<rect x="357.0" y="213" width="34.0" height="18" fill="#FFFFFF"/>
<text x="374" y="226" font-size="12" fill="#1F2937" text-anchor="middle">신원</text>
<rect x="410" y="70" width="240" height="190" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="530.0" y="129.0" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">코드 인가 검사</text>
<text x="530.0" y="145.0" font-size="12" fill="#1F2937" text-anchor="middle">인증된 신원 ↔ 대상 명단 대조</text>
<text x="530.0" y="161.0" font-size="12" fill="#1F2937" text-anchor="middle">(학생 · tenant 매핑)</text>
<text x="530.0" y="177.0" font-size="12" fill="#1F2937" text-anchor="middle">읽기 전에 실행</text>
<text x="530.0" y="193.0" font-size="12" fill="#1F2937" text-anchor="middle">부작용 tool은 실행 전</text>
<text x="530.0" y="209.0" font-size="12" fill="#1F2937" text-anchor="middle">호출자 신원 + 대상 권한 확인</text>
<rect x="720" y="80" width="210" height="60" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
