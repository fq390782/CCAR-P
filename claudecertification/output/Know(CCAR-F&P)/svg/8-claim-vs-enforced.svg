<rect x="667.0" y="91" width="34.0" height="18" fill="#FFFFFF"/>
<text x="684" y="104" font-size="12" fill="#1F2937" text-anchor="middle">일치</text>
<rect x="720" y="190" width="210" height="60" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="825.0" y="216.0" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">거부</text>
<text x="825.0" y="232.0" font-size="12" fill="#1F2937" text-anchor="middle">신원 ↔ 대상 불일치</text>
<polyline points="650,220 718,220" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-8-claim-vs-enforced)"/>
<rect x="661.0" y="201" width="46.0" height="18" fill="#FFFFFF"/>
<text x="684" y="214" font-size="12" fill="#1F2937" text-anchor="middle">불일치</text>
<rect x="30" y="320" width="440" height="100" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="250.0" y="350.0" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">안티패턴 ✗</text>
<text x="250.0" y="366.0" font-size="12" fill="#1F2937" text-anchor="middle">응답 생성 후 필터 → 데이터를 이미 읽은 뒤 · 유출</text>
<text x="250.0" y="382.0" font-size="12" fill="#1F2937" text-anchor="middle">시스템 프롬프트의 role 주장 · 모델의 판단 → 인가 ✗</text>
<text x="250.0" y="398.0" font-size="12" fill="#1F2937" text-anchor="middle">authN만 구현 = 대상 확인 누락 → 인가 결함</text>
<rect x="500" y="320" width="430" height="100" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="715.0" y="350.0" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">보완 · 의존성</text>
<text x="715.0" y="366.0" font-size="12" fill="#1F2937" text-anchor="middle">사후 감사 로그 = 보완용 · 단독 통제 ✗ · 원본 시스템 ACL 유지</text>
<text x="715.0" y="382.0" font-size="12" fill="#1F2937" text-anchor="middle">신원 ↔ 대상 매핑 필요</text>
<text x="715.0" y="398.0" font-size="12" fill="#1F2937" text-anchor="middle">명단이 오래되면 정당한 사용자 차단 · 이전 사용자 허용</text>
</svg>
