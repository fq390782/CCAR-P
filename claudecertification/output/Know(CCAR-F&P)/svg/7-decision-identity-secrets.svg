"190,240 190,263" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-decision-identity-secrets)"/><text x="198" y="256" font-size="11" fill="#1F2937" text-anchor="start">아니오</text><polygon points="190,265 360,305 190,345 20,305" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/><text x="190" y="300.6" font-size="12" fill="#1F2937" text-anchor="middle">browser JS에</text><text x="190" y="317.4" font-size="12" fill="#1F2937" text-anchor="middle">API key가 있다?</text><polyline points="360,305 408,305" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-decision-identity-secrets)"/><text x="384" y="297" font-size="11" fill="#1F2937" text-anchor="middle">예</text><rect x="410" y="275" width="470" height="60" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/><text x="645.0" y="301.7" font-size="13" fill="#1F2937" text-anchor="middle">key를 rotate</text><text x="645.0" y="317.8" font-size="11" fill="#1F2937" text-anchor="middle">backend proxy로 옮긴다</text><polyline points="190,345 190,368" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-decision-identity-secrets)"/><text x="198" y="361" font-size="11" fill="#1F2937" text-anchor="start">아니오</text><polygon points="190,370 360,410 190,450 20,410" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/><text x="190" y="405.6" font-size="12" fill="#1F2937" text-anchor="middle">repo나 prompt template에</text><text x="190" y="422.4" font-size="12" fill="#1F2937" text-anchor="middle">key가 있다?</text><polyline points="360,410 408,410" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-decision-identity-secrets)"/><text x="384" y="402" font-size="11" fill="#1F2937" text-anchor="middle">예</text><rect x="410" y="380" width="470" height="60" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/><text x="645.0" y="406.7" font-size="13" fill="#1F2937" text-anchor="middle">rotate → env var / secret manager</text><text x="645.0" y="422.8" font-size="11" fill="#1F2937" text-anchor="middle">tool 코드가 인증, 모델은 credential을 보지 못함</text><polyline points="190,450 190,473" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-decision-identity-secrets)"/><text x="198" y="466" font-size="11" fill="#1F2937" text-anchor="start">아니오</text><polygon points="190,475 360,515 190,555 20,515" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/><text x="190" y="510.6" font-size="12" fill="#1F2937" text-anchor="middle">PII가 든 데이터를</text><text x="190" y="527.4" font-size="12" fill="#1F2937" text-anchor="middle">Claude에 넘긴다?</text><polyline points="360,515 408,515" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-decision-identity-secrets)"/><text x="384" y="507" font-size="11" fill="#1F2937" text-anchor="middle">예</text><rect x="410" y="485" width="470" height="60" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/><text x="645.0" y="511.7" font-size="13" fill="#1F2937" text-anchor="middle">필요한 항목만 · 직접 식별자 masking</text><text x="645.0" y="527.8" font-size="11" fill="#1F2937" text-anchor="middle">tool 권한을 좁힌다</text>
