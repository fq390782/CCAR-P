<svg xmlns="http://www.w3.org/2000/svg" width="800" height="540" viewBox="0 0 800 540" role="img" aria-label="실행 경계는 모델 밖(sandbox · permission rule)이 지킨다">
<title>실행 경계는 모델 밖(sandbox · permission rule)이 지킨다</title>
<defs><marker id="arr-sandbox-boundary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<g font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">
<text x="400.0" y="28" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">실행 경계는 prompt 메모가 아니라 모델 밖 수단이 지킨다</text>
<rect x="300" y="48" width="200" height="36" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="400.0" y="70.2" font-size="13" fill="#1F2937" text-anchor="middle">문서가 file exfil 지시</text>
<polyline points="350,84 350,100 200,100 200,116" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-sandbox-boundary)"/>
<polyline points="450,84 450,100 600,100 600,116" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-sandbox-boundary)"/>
<rect x="20" y="118" width="360" height="60" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="200.0" y="144.8" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">prompt 메모 방식</text>
<text x="200.0" y="160.2" font-size="11" fill="#1F2937" text-anchor="middle">홈 디렉터리 쓰기 허용 + '/reports만' 메모</text>
<polyline points="200,178 200,200" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-sandbox-boundary)"/>
<text x="208" y="194" font-size="11" fill="#1F2937" text-anchor="start">코드에서 제한 ✗</text>
<rect x="20" y="202" width="360" height="40" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="200.0" y="226.2" font-size="13" fill="#1F2937" text-anchor="middle">파일은 첫날에 유출</text>
<rect x="420" y="118" width="360" height="60" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="600.0" y="137.2" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">sandbox 방식 (모델 밖 강제)</text>
<text x="600.0" y="152.8" font-size="11" fill="#1F2937" text-anchor="middle">쓰기를 /reports로 한정 · 네트워크 거부</text>
<text x="600.0" y="167.8" font-size="11" fill="#1F2937" text-anchor="middle">실행 시간 제한</text>
<polyline points="600,178 600,200" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-sandbox-boundary)"/>
<text x="608" y="194" font-size="11" fill="#1F2937" text-anchor="start">경계 확대 불가</text>
<rect x="420" y="202" width="360" height="40" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
<text x="600.0" y="226.2" font-size="13" fill="#1F2937" text-anchor="middle">주입 지시가 경계를 넓힐 수 없음</text>
<text x="20" y="262" font-size="11" fill="#6B7280" text-anchor="start">prompt 메모는 sandbox와 병행할 때 style guide로만 가치</text>
<text x="420" y="262" font-size="11" fill="#6B7280" text-anchor="start">한계: 잘못 구성한 sandbox는 데이터 유출 → 설정 테스트 필요</text>
<text x="20" y="304" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="start">Claude Code에서 막으려는 경로별 수단</text>
<text x="20" y="326" font-size="11" fill="#6B7280" text-anchor="start">막으려는 경로</text>
<text x="270" y="326" font-size="11" fill="#6B7280" text-anchor="start">수단</text>
<text x="590" y="326" font-size="11" fill="#6B7280" text-anchor="start">오답</text>
<rect x="20" y="334" width="220" height="58" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="130.0" y="358.8" font-size="13" fill="#1F2937" text-anchor="middle">특정 write tool 차단</text>
<text x="130.0" y="375.8" font-size="13" fill="#1F2937" text-anchor="middle">(보고서 read tool은 유지)</text>
<polyline points="240,363 268,363" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-sandbox-boundary)"/>
<rect x="270" y="334" width="290" height="58" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="415.0" y="359.8" font-size="13" fill="#1F2937" text-anchor="middle">deny rule 추가 또는 tool 목록에서 제거</text>
<text x="415.0" y="375.2" font-size="11" fill="#1F2937" text-anchor="middle">→ 권한 자체 종료</text>
<rect x="590" y="334" width="190" height="58" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="685.0" y="351.8" font-size="11" fill="#1F2937" text-anchor="middle">audit logging: 기록일 뿐</text>
<text x="685.0" y="366.8" font-size="11" fill="#1F2937" text-anchor="middle">tool search deferred:</text>
<text x="685.0" y="381.8" font-size="11" fill="#1F2937" text-anchor="middle">모델이 검색하면 로드</text>
<rect x="20" y="402" width="220" height="58" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="130.0" y="426.8" font-size="13" fill="#1F2937" text-anchor="middle">shell의 알 수 없는</text>
<text x="130.0" y="443.8" font-size="13" fill="#1F2937" text-anchor="middle">호스트 접근 차단</text>
<polyline points="240,431 268,431" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-sandbox-boundary)"/>
<rect x="270" y="402" width="290" height="58" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="415.0" y="420.2" font-size="13" fill="#1F2937" text-anchor="middle">/sandbox 실행으로 sandbox 켬</text>
<text x="415.0" y="435.8" font-size="11" fill="#1F2937" text-anchor="middle">shell 트래픽 → proxy 경유</text>
<text x="415.0" y="450.8" font-size="11" fill="#1F2937" text-anchor="middle">허용 도메인 목록은 빈 상태로 시작</text>
<rect x="20" y="470" width="220" height="58" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="130.0" y="494.8" font-size="13" fill="#1F2937" text-anchor="middle">내장 Read tool의</text>
<text x="130.0" y="511.8" font-size="13" fill="#1F2937" text-anchor="middle">credential 파일 열람 차단</text>
<polyline points="240,499 268,499" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-sandbox-boundary)"/>
<rect x="270" y="470" width="290" height="58" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="415.0" y="495.8" font-size="13" fill="#1F2937" text-anchor="middle">해당 경로에 permission deny rule</text>
<text x="415.0" y="511.2" font-size="11" fill="#1F2937" text-anchor="middle">sandbox는 Read tool을 제어하지 않음</text>
<rect x="590" y="470" width="190" height="58" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="685.0" y="495.2" font-size="11" fill="#1F2937" text-anchor="middle">sandbox denyRead 항목</text>
<text x="685.0" y="510.2" font-size="11" fill="#1F2937" text-anchor="middle">Read tool을 막지 않음</text>
</g>
</svg>
