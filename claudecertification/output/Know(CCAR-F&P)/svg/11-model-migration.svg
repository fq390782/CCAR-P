<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-label="deprecation 공지 후 frozen eval, shadow deploy, 점진 전환, 새 baseline 문서화 순서와 워크로드별 pin 분리">
<title>모델 deprecation 마이그레이션 순서와 건너뛰면 실패하는 지름길</title>
<defs><marker id="arr-model-migration" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<g font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">
<text x="450.0" y="28" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">retirement 전에 eval · shadow · 점진 전환 · 롤백 경로 유지</text>
<rect x="40" y="48" width="132" height="92" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="106.0" y="84.4" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">deprecation 공지</text>
<text x="106.0" y="98.7" font-size="11" fill="#1F2937" text-anchor="middle">90일 후 retire</text>
<text x="106.0" y="112.7" font-size="11" fill="#1F2937" text-anchor="middle">날짜를 ID 옆에 기록</text>
<rect x="212" y="48" width="132" height="92" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="278.0" y="84.4" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">frozen eval</text>
<text x="278.0" y="98.7" font-size="11" fill="#1F2937" text-anchor="middle">새 버전에 실행</text>
<text x="278.0" y="112.7" font-size="11" fill="#1F2937" text-anchor="middle">→ 차이 수정</text>
<rect x="384" y="48" width="132" height="92" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="450.0" y="84.4" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">shadow deploy</text>
<text x="450.0" y="98.7" font-size="11" fill="#1F2937" text-anchor="middle">트래픽 사본 처리</text>
<text x="450.0" y="112.7" font-size="11" fill="#1F2937" text-anchor="middle">출력 비교</text>
<rect x="556" y="48" width="132" height="92" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="622.0" y="84.4" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">점진 전환</text>
<text x="622.0" y="98.7" font-size="11" fill="#1F2937" text-anchor="middle">이전 버전 유지</text>
<text x="622.0" y="112.7" font-size="11" fill="#1F2937" text-anchor="middle">(롤백 경로)</text>
<rect x="728" y="48" width="132" height="92" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
<text x="794.0" y="84.4" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">새 baseline</text>
<text x="794.0" y="98.7" font-size="11" fill="#1F2937" text-anchor="middle">문서화</text>
<text x="794.0" y="112.7" font-size="11" fill="#1F2937" text-anchor="middle">날짜 전 트래픽 이전</text>
<polyline points="172,94 212,94" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-model-migration)"/>
<text x="192" y="86" font-size="11" fill="#1F2937" text-anchor="middle">테스트</text>
<polyline points="344,94 384,94" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-model-migration)"/>
<text x="364" y="86" font-size="11" fill="#1F2937" text-anchor="middle">수정 후</text>
<polyline points="516,94 556,94" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-model-migration)"/>
<text x="536" y="86" font-size="11" fill="#1F2937" text-anchor="middle">비교 후</text>
<polyline points="688,94 728,94" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-model-migration)"/>
<text x="708" y="86" font-size="11" fill="#1F2937" text-anchor="middle">전환 후</text>
<text x="20" y="176" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="start">건너뛰면 실패하는 지름길</text>
<rect x="20" y="188" width="273" height="60" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="156.5" y="215.4" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">ID만 교체</text>
<text x="156.5" y="229.7" font-size="11" fill="#1F2937" text-anchor="middle">동작 변화로 튜닝 prompt 파괴</text>
<rect x="313" y="188" width="273" height="60" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="449.5" y="215.4" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">하룻밤 전환</text>
<text x="449.5" y="229.7" font-size="11" fill="#1F2937" text-anchor="middle">위험 일괄 · 롤백 리허설 ✗</text>
<rect x="606" y="188" width="273" height="60" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="742.5" y="215.4" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">"latest" pin</text>
<text x="742.5" y="229.7" font-size="11" fill="#1F2937" text-anchor="middle">제공자 모든 업데이트 = 조용한 마이그레이션</text>
<text x="20" y="284" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="start">14개 워크로드가 공유 pin 하나 · 90일 내 이전 · flag-day 금지</text>
<rect x="20" y="298" width="380" height="92" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="210.0" y="334.4" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">공유 pin 하나 = 결합</text>
<text x="210.0" y="348.7" font-size="11" fill="#1F2937" text-anchor="middle">14개 워크로드 동시 전환 = flag day 강제</text>
<text x="210.0" y="362.7" font-size="11" fill="#1F2937" text-anchor="middle">연장 요청 = 마감만 이동 · 결합 그대로</text>
<polyline points="400,344 480,344" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-model-migration)"/>
<text x="440" y="336" font-size="11" fill="#1F2937" text-anchor="middle">pin 분리</text>
<rect x="480" y="298" width="400" height="92" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="680.0" y="334.4" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">추상화 계층 뒤 워크로드별 pin</text>
<text x="680.0" y="348.7" font-size="11" fill="#1F2937" text-anchor="middle">하나씩 이전 + 워크로드별 eval 재실행</text>
<text x="680.0" y="362.7" font-size="11" fill="#1F2937" text-anchor="middle">이전 pin은 마지막 통과까지 유지</text>
</g>
</svg>
