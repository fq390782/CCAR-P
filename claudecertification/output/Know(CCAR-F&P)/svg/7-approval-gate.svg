<svg xmlns="http://www.w3.org/2000/svg" width="780" height="560" viewBox="0 0 780 560" role="img" aria-label="Human-in-the-loop 승인 게이트 흐름">
<title>Human-in-the-loop 승인 게이트 흐름</title>
<defs><marker id="arr-approval-gate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<g font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">
<text x="390" y="30" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">Human approval gate: 꼭 막을 행동은 tool 제거, 큰 행동은 사람 승인</text><rect x="290" y="48" width="180" height="40" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/><text x="380.0" y="72.4" font-size="13" fill="#1F2937" text-anchor="middle">agent가 tool 호출 시도</text><polyline points="380,88 380,108" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-approval-gate)"/><polygon points="380,108 500,150 380,192 260,150" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/><text x="380" y="145.6" font-size="12" fill="#1F2937" text-anchor="middle">꼭 막아야 하는</text><text x="380" y="162.4" font-size="12" fill="#1F2937" text-anchor="middle">행동인가?</text><polyline points="260,150 242,150" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-approval-gate)"/><text x="251" y="142" font-size="11" fill="#1F2937" text-anchor="middle">예</text><rect x="40" y="122" width="200" height="56" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/><text x="140.0" y="146.7" font-size="13" fill="#1F2937" text-anchor="middle">tool을 아예 주지 않음</text><text x="140.0" y="162.8" font-size="11" fill="#1F2937" text-anchor="middle">configuration · hooks로 보장</text><polyline points="380,192 380,226" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-approval-gate)"/><text x="388" y="213" font-size="11" fill="#1F2937" text-anchor="start">아니오</text><polygon points="380,227 520,285 380,343 240,285" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/><text x="380" y="272.2" font-size="12" fill="#1F2937" text-anchor="middle">consequential ·</text><text x="380" y="289.0" font-size="12" fill="#1F2937" text-anchor="middle">irreversible ·</text><text x="380" y="305.8" font-size="12" fill="#1F2937" text-anchor="middle">destructive인가?</text><polyline points="520,285 568,285" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-approval-gate)"/><text x="544" y="277" font-size="11" fill="#1F2937" text-anchor="middle">아니오</text><rect x="570" y="258" width="190" height="54" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/><text x="665.0" y="280.3" font-size="13" fill="#1F2937" text-anchor="middle">least privilege 범위</text><text x="665.0" y="298.5" font-size="13" fill="#1F2937" text-anchor="middle">안에서 실행</text><polyline points="380,343 380,378" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-approval-gate)"/><text x="388" y="364" font-size="11" fill="#1F2937" text-anchor="start">예</text><rect x="280" y="380" width="200" height="46" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/><text x="380.0" y="407.4" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">human approval gate</text><polyline points="380,426 380,456" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-approval-gate)"/><polygon points="380,457 460,495 380,533 300,495" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/><text x="380" y="499.0" font-size="12" fill="#1F2937" text-anchor="middle">사람이 승인?</text><polyline points="460,495 568,495" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-approval-gate)"/><text x="514" y="487" font-size="11" fill="#1F2937" text-anchor="middle">예</text><rect x="570" y="470" width="190" height="50" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/><text x="665.0" y="499.4" font-size="13" fill="#1F2937" text-anchor="middle">실행</text><polyline points="300,495 242,495" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-approval-gate)"/><text x="271" y="487" font-size="11" fill="#1F2937" text-anchor="middle">아니오</text><rect x="40" y="470" width="200" height="50" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/><text x="140.0" y="499.4" font-size="13" fill="#1F2937" text-anchor="middle">실행하지 않음</text><rect x="20" y="368" width="230" height="70" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/><text x="135.0" y="390.6" font-size="13" fill="#1F2937" text-anchor="middle">오답: 모델에게</text><text x="135.0" y="408.8" font-size="13" fill="#1F2937" text-anchor="middle">'실행 전에 확인하라' 지시</text><text x="135.0" y="424.9" font-size="11" fill="#1F2937" text-anchor="middle">모델의 자기 확인은 enforcement 아님</text>
</g>
</svg>
