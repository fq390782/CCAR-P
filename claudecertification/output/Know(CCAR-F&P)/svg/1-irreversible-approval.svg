<svg xmlns="http://www.w3.org/2000/svg" width="920" height="480" viewBox="0 0 920 480" role="img" aria-label="비가역 작업 통제: 모델은 제안하고 gate와 사람 승인 뒤에서만 실행되며 preview와 execute는 token으로 묶인다" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">
<title>비가역 작업 통제: 모델은 제안하고 gate와 사람 승인 뒤에서만 실행되며 preview와 execute는 token으로 묶인다</title>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<defs><marker id="arr-irreversible-k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker><marker id="arr-irreversible-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker><marker id="arr-irreversible-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="arr-irreversible-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/></marker></defs>
<text x="20" y="30" font-size="14" fill="#1F2937" text-anchor="start" font-weight="bold">비가역 작업 통제 — 모델은 제안 · 실행은 모델 밖 gate가 처분</text>
<text x="20" y="60" font-size="14" fill="#1F2937" text-anchor="start" font-weight="bold">금전 이동 · 고객 대상 메시지 (모델 단독 실행 금지)</text>
<rect x="20" y="100" width="170" height="58" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="105.0" y="126.0" font-size="13" fill="#1F2937" text-anchor="middle" font-weight="bold">모델</text>
<text x="105.0" y="141.3" font-size="11" fill="#6B7280" text-anchor="middle">제안 작성 = 자동</text>
<rect x="240" y="72" width="660" height="112" rx="6" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="260" y="92" font-size="11" fill="#6B7280" text-anchor="start">gate 뒤 — 모델 밖에서 강제</text>
<rect x="270" y="108" width="180" height="58" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="360.0" y="134.1" font-size="13" fill="#1F2937" text-anchor="middle" font-weight="bold">규칙 엔진</text>
<text x="360.0" y="149.3" font-size="11" fill="#6B7280" text-anchor="middle">정책 · 금액 · 사기 flag 확인</text>
<rect x="480" y="108" width="180" height="58" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="570.0" y="134.1" font-size="13" fill="#1F2937" text-anchor="middle" font-weight="bold">사람 승인</text>
<text x="570.0" y="149.3" font-size="11" fill="#6B7280" text-anchor="middle">발송 = 사람 승인</text>
<rect x="690" y="108" width="180" height="58" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
<text x="780.0" y="141.6" font-size="13" fill="#1F2937" text-anchor="middle" font-weight="bold">발송 · 환불 실행</text>
<path d="M190,129 L240,129" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-irreversible-k)"/>
<rect x="200.0" y="109.0" width="30.0" height="16" fill="#FFFFFF"/>
<text x="215" y="120.0" font-size="11" fill="#1F2937" text-anchor="middle">제안</text>
<path d="M450,137 L480,137" fill="none" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arr-irreversible-b)"/>
<path d="M660,137 L690,137" fill="none" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arr-irreversible-b)"/>
<text x="20" y="222" font-size="14" fill="#1F2937" text-anchor="start" font-weight="bold">dry_run 우회 방지 — preview · execute 두 tool 분리</text>
<rect x="20" y="236" width="180" height="64" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="110.0" y="265.1" font-size="13" fill="#1F2937" text-anchor="middle" font-weight="bold">preview tool</text>
<text x="110.0" y="280.4" font-size="11" fill="#6B7280" text-anchor="middle">미리보기</text>
<rect x="260" y="236" width="180" height="64" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="350.0" y="265.1" font-size="13" fill="#1F2937" text-anchor="middle" font-weight="bold">영향 세부</text>
<text x="350.0" y="280.4" font-size="11" fill="#6B7280" text-anchor="middle">+ 1회용 confirmation token</text>
<rect x="500" y="236" width="180" height="64" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="590.0" y="265.1" font-size="13" fill="#1F2937" text-anchor="middle" font-weight="bold">execute tool</text>
<text x="590.0" y="280.4" font-size="11" fill="#6B7280" text-anchor="middle">token 필수</text>
<rect x="740" y="236" width="160" height="64" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
<text x="820.0" y="265.1" font-size="13" fill="#1F2937" text-anchor="middle" font-weight="bold">실행</text>
<text x="820.0" y="280.4" font-size="11" fill="#6B7280" text-anchor="middle">실행이 preview에 바인딩</text>
<path d="M200,268 L260,268" fill="none" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arr-irreversible-b)"/>
<rect x="215.0" y="248.0" width="30.0" height="16" fill="#FFFFFF"/>
<text x="230" y="259.0" font-size="11" fill="#2563EB" text-anchor="middle">반환</text>
<path d="M440,268 L500,268" fill="none" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arr-irreversible-b)"/>
<rect x="450.1" y="248.0" width="39.9" height="16" fill="#FFFFFF"/>
<text x="470" y="259.0" font-size="11" fill="#2563EB" text-anchor="middle">token</text>
<path d="M680,268 L740,268" fill="none" stroke="#16A34A" stroke-width="1.5" marker-end="url(#arr-irreversible-g)"/>
<rect x="695.0" y="248.0" width="30.0" height="16" fill="#FFFFFF"/>
<text x="710" y="259.0" font-size="11" fill="#16A34A" text-anchor="middle">검증</text>
<rect x="500" y="330" width="180" height="40" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="590.0" y="354.6" font-size="13" fill="#1F2937" text-anchor="middle" font-weight="bold">실행 거부</text>
<path d="M590,300 L590,330" fill="none" stroke="#DC2626" stroke-width="1.5" marker-end="url(#arr-irreversible-r)"/>
<rect x="587.4" y="307.0" width="65.2" height="16" fill="#FFFFFF"/>
<text x="620" y="318.0" font-size="11" fill="#DC2626" text-anchor="middle">token 없음</text>
<rect x="20" y="396" width="430" height="64" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="235.0" y="417.6" font-size="13" fill="#1F2937" text-anchor="middle" font-weight="bold">모델 판단에 의존하는 방식은 통제가 아님</text>
<text x="235.0" y="432.9" font-size="11" fill="#6B7280" text-anchor="middle">double-check 지시 · 추론 설명 요구 · 두 agent 투표</text>
<text x="235.0" y="447.9" font-size="11" fill="#6B7280" text-anchor="middle">60초 내 dry_run 이력 validation · tool 설명 · few-shot</text>
<rect x="470" y="396" width="430" height="64" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="685.0" y="417.6" font-size="13" fill="#1F2937" text-anchor="middle" font-weight="bold">검토 강도 = 결과 중대성 · 되돌림 가능성에 비례</text>
<text x="685.0" y="432.9" font-size="11" fill="#6B7280" text-anchor="middle">되돌릴 수 없음 + 중대 → 효과 전 사람 검토</text>
<text x="685.0" y="447.9" font-size="11" fill="#6B7280" text-anchor="middle">되돌릴 수 있음 → 코드 검사 유지</text>
</svg>
