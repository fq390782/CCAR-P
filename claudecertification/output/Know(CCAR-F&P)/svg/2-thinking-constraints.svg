<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" role="img" aria-label="extended thinking 사용 시 max_tokens와 tool_choice 제약" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">
<title>extended thinking 사용 시 max_tokens와 tool_choice 제약</title>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<defs><marker id="arr-thinking-constraints" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker></defs>
<text x="450" y="28" font-size="14" text-anchor="middle" fill="#1F2937" font-weight="bold">수동 extended thinking: budget_tokens &lt; max_tokens, tool_choice는 auto/none만</text>
<rect x="20" y="60" width="260" height="56" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="150.0" y="84.0" font-size="13" text-anchor="middle" fill="#1F2937">thinking: {type: "enabled",</text>
<text x="150.0" y="101.0" font-size="13" text-anchor="middle" fill="#1F2937">budget_tokens}</text>
<polygon points="450,43.0 560.0,88 450,133.0 340.0,88" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
<text x="450" y="84.0" font-size="13" text-anchor="middle" fill="#1F2937">budget_tokens</text>
<text x="450" y="101.0" font-size="13" text-anchor="middle" fill="#1F2937">&lt; max_tokens?</text>
<polyline points="280,88 340,88" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-thinking-constraints)"/>
<rect x="620" y="60" width="260" height="56" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="750.0" y="84.0" font-size="12" text-anchor="middle" fill="#1F2937">거부 → max_tokens를 budget보다</text>
<text x="750.0" y="101.0" font-size="12" text-anchor="middle" fill="#1F2937">크게 (thinking도 출력에 포함)</text>
<polyline points="560,88 620,88" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-thinking-constraints)"/>
<rect x="569.5" y="65.0" width="41.0" height="18" fill="#FFFFFF"/>
<text x="590" y="78.5" font-size="11" text-anchor="middle" fill="#6B7280">아니오</text>
<polygon points="450,165.0 560.0,210 450,255.0 340.0,210" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
<text x="450" y="214.5" font-size="13" text-anchor="middle" fill="#1F2937">tool_choice?</text>
<polyline points="450,133 450,165" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-thinking-constraints)"/>
<rect x="460.5" y="140.0" width="19.0" height="18" fill="#FFFFFF"/>
<text x="470" y="153.5" font-size="11" text-anchor="middle" fill="#6B7280">예</text>
<rect x="620" y="180" width="260" height="60" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="750.0" y="206.0" font-size="12" text-anchor="middle" fill="#1F2937">any / 특정 tool 강제 → 400</text>
<text x="750.0" y="223.0" font-size="12" text-anchor="middle" fill="#1F2937">→ 프롬프트에 언제 쓸지 적기</text>
<polyline points="560,210 620,210" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-thinking-constraints)"/>
<rect x="561.9" y="189.0" width="56.2" height="18" fill="#FFFFFF"/>
<text x="590" y="202.5" font-size="11" text-anchor="middle" fill="#6B7280">any·tool</text>
<rect x="330" y="290" width="240" height="46" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
<text x="450.0" y="309.0" font-size="12" text-anchor="middle" fill="#1F2937">auto / none → 허용</text>
<text x="450.0" y="326.0" font-size="11" text-anchor="middle" fill="#6B7280">system prompt와도 함께 사용 가능</text>
<polyline points="450,255 450,290" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-thinking-constraints)"/>
<rect x="453.6" y="263.0" width="72.7" height="18" fill="#FFFFFF"/>
<text x="490" y="276.5" font-size="11" text-anchor="middle" fill="#6B7280">auto · none</text>
<rect x="20" y="180" width="260" height="80" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="150.0" y="207.5" font-size="13" text-anchor="middle" fill="#1F2937">adaptive thinking</text>
<text x="150.0" y="224.5" font-size="11" text-anchor="middle" fill="#6B7280">대부분 모델: 강제 tool 허용</text>
<text x="150.0" y="241.5" font-size="11" text-anchor="middle" fill="#6B7280">Opus 5.5 · Sonnet 5.5: 항상 거부</text>
</svg>
