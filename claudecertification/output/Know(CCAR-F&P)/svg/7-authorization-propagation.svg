<svg xmlns="http://www.w3.org/2000/svg" width="920" height="510" viewBox="0 0 920 510" role="img" aria-label="Authorization 전파: 누구의 권한으로 tool을 실행하는가">
<title>Authorization 전파: 누구의 권한으로 tool을 실행하는가</title>
<defs><marker id="arr-authorization-propagation" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<g font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">
<text x="460" y="28" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">Authorization 전파: tool은 호출한 사용자의 권한(검증된 token)으로 실행한다</text><rect x="20" y="45" width="880" height="125" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/><text x="36" y="69" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="start">오답 ① 공유 service account 하나로 모든 사용자 처리</text><rect x="40" y="83" width="160" height="50" rx="6" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/><text x="120.0" y="112.4" font-size="13" fill="#1F2937" text-anchor="middle">사용자 A · B · C</text><polyline points="200,108 258,108" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-authorization-propagation)"/><text x="230" y="101" font-size="11" fill="#1F2937" text-anchor="middle">요청</text><rect x="260" y="83" width="160" height="50" rx="6" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/><text x="340.0" y="112.4" font-size="13" fill="#1F2937" text-anchor="middle">app / 모델</text><polyline points="420,108 478,108" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-authorization-propagation)"/><text x="450" y="101" font-size="11" fill="#1F2937" text-anchor="middle">tool 호출</text><rect x="480" y="83" width="160" height="50" rx="6" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/><text x="560.0" y="104.7" font-size="13" fill="#1F2937" text-anchor="middle">공유 service account</text><text x="560.0" y="120.8" font-size="11" fill="#1F2937" text-anchor="middle">강한 권한</text><polyline points="640,108 698,108" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-authorization-propagation)"/><text x="670" y="101" font-size="11" fill="#1F2937" text-anchor="middle">전권 접근</text><rect x="700" y="83" width="160" height="50" rx="6" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/><text x="780.0" y="112.4" font-size="13" fill="#1F2937" text-anchor="middle">모든 사용자의 데이터</text><text x="40" y="157" font-size="11" fill="#1F2937" text-anchor="start">사용자별 authorization과 audit trail이 사라짐 → 모델이 다른 사람의 데이터를 꺼내는 '강한 대리인'이 됨</text><rect x="20" y="185" width="880" height="125" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/><text x="36" y="209" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="start">오답 ② 대상 사용자 ID를 모델이 tool argument로 넘김</text><rect x="40" y="223" width="160" height="50" rx="6" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/><text x="120.0" y="244.7" font-size="13" fill="#1F2937" text-anchor="middle">대화로 유도</text><text x="120.0" y="260.8" font-size="11" fill="#1F2937" text-anchor="middle">(injection)</text><polyline points="200,248 258,248" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-authorization-propagation)"/><text x="230" y="241" font-size="11" fill="#1F2937" text-anchor="middle">입력</text><rect x="260" y="223" width="160" height="50" rx="6" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/><text x="340.0" y="252.4" font-size="13" fill="#1F2937" text-anchor="middle">모델</text><polyline points="420,248 478,248" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-authorization-propagation)"/><text x="450" y="241" font-size="11" fill="#1F2937" text-anchor="middle">값 결정</text><rect x="480" y="223" width="160" height="50" rx="6" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/><text x="560.0" y="244.7" font-size="13" fill="#1F2937" text-anchor="middle">tool_use</text><text x="560.0" y="260.8" font-size="11" fill="#1F2937" text-anchor="middle">user_id: 'B'</text><polyline points="640,248 698,248" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-authorization-propagation)"/><text x="670" y="241" font-size="11" fill="#1F2937" text-anchor="middle">그대로 믿음</text><rect x="700" y="223" width="160" height="50" rx="6" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/><text x="780.0" y="252.4" font-size="13" fill="#1F2937" text-anchor="middle">B의 데이터 반환</text><text x="40" y="297" font-size="11" fill="#1F2937" text-anchor="start">argument 값은 모델이 정한다 → 유도당하면 다른 사람의 ID를 넣음. 원래 결함과 같음</text><rect x="20" y="325" width="880" height="125" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/><text x="36" y="349" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="start">정답: 로그인 사용자의 검증된 token으로 server가 매번 판정</text><rect x="40" y="363" width="160" height="50" rx="6" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/><text x="120.0" y="392.4" font-size="13" fill="#1F2937" text-anchor="middle">로그인한 사용자 A</text><polyline points="200,388 258,388" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-authorization-propagation)"/><text x="230" y="381" font-size="11" fill="#1F2937" text-anchor="middle">요청</text><rect x="260" y="363" width="160" height="50" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/><text x="340.0" y="384.7" font-size="13" fill="#1F2937" text-anchor="middle">app</text><text x="340.0" y="400.8" font-size="11" fill="#1F2937" text-anchor="middle">검증된 token 첨부</text><polyline points="420,388 478,388" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-authorization-propagation)"/><text x="450" y="381" font-size="11" fill="#1F2937" text-anchor="middle">token 전달</text><rect x="480" y="363" width="160" height="50" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/><text x="560.0" y="384.7" font-size="13" fill="#1F2937" text-anchor="middle">MCP server</text><text x="560.0" y="400.8" font-size="11" fill="#1F2937" text-anchor="middle">token으로 매번 범위 판정</text><polyline points="640,388 698,388" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-authorization-propagation)"/><text x="670" y="381" font-size="11" fill="#1F2937" text-anchor="middle">허용 범위만</text><rect x="700" y="363" width="160" height="50" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/><text x="780.0" y="384.7" font-size="13" fill="#1F2937" text-anchor="middle">A 범위의 데이터만</text><text x="780.0" y="400.8" font-size="11" fill="#1F2937" text-anchor="middle">tool 호출마다 A 기준 log</text><text x="40" y="437" font-size="11" fill="#1F2937" text-anchor="start">사용자 식별은 client나 모델이 넘긴 값이 아니라 검증된 token에서 얻는다</text><rect x="20" y="463" width="880" height="36" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/><text x="460.0" y="485.0" font-size="12" fill="#1F2937" text-anchor="middle">보조 수단일 뿐: 출력 검사(다른 모델로 이름 탐지)는 authorization을 대신하지 못함. 권한 밖 데이터는 이미 모델에게 읽혔다</text>
</g>
</svg>
