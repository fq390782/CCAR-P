<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-label="지식이 바뀌는 속도로 출처를 고르는 판단 흐름">
<title>지식이 바뀌는 속도로 출처를 고르는 판단 흐름</title>
<defs><marker id="arr-rag-knowledge-source" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<g font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">
<text x="450" y="28" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">지식이 바뀌는 속도가 출처를 결정: 실시간은 tool call, 안정 텍스트는 index</text>
<rect x="350" y="44" width="200" height="32" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="450" y="64.4" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">답변에 필요한 지식</text>
<polyline points="450,76 450,96" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-rag-knowledge-source)"/>
<polygon points="450,96 600,140 450,184 300,140" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
<text x="450" y="144.4" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">지식이 바뀌는 속도는?</text>
<polyline points="300,140 160,140 160,250" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-rag-knowledge-source)"/>
<text x="168" y="180" font-size="11" fill="#1F2937" text-anchor="start">실시간 트랜잭션 상태</text>
<text x="168" y="195" font-size="11" fill="#1F2937" text-anchor="start">(재고 · 위치 · 가격 · 주문)</text>
<polyline points="450,184 450,250" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-rag-knowledge-source)"/>
<text x="458" y="214" font-size="11" fill="#1F2937" text-anchor="start">안정적 지식</text>
<text x="458" y="229" font-size="11" fill="#1F2937" text-anchor="start">(정책 · 매뉴얼 · 계약)</text>
<polyline points="600,140 740,140 740,250" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-rag-knowledge-source)"/>
<text x="748" y="180" font-size="11" fill="#1F2937" text-anchor="start">과제가 지식이 아니라</text>
<text x="748" y="195" font-size="11" fill="#1F2937" text-anchor="start">스타일 · 판단</text>
<rect x="20" y="250" width="280" height="90" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="160" y="276.9" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">결정 시점의 tool call</text>
<text x="160" y="292.2" font-size="11" fill="#1F2937" text-anchor="middle">실시간 API · 요청별 인증(사용자 id)</text>
<text x="160" y="307.2" font-size="11" fill="#1F2937" text-anchor="middle">한계: 지연 추가 · API 가동 의존</text>
<text x="160" y="322.2" font-size="11" fill="#1F2937" text-anchor="middle">tool 실패 시 대체 메시지 필요</text>
<rect x="310" y="250" width="280" height="90" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="450" y="276.9" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">vector index retrieval</text>
<text x="450" y="292.2" font-size="11" fill="#1F2937" text-anchor="middle">주 단위로 바뀌는 문서 → 재수집 주기</text>
<text x="450" y="307.2" font-size="11" fill="#1F2937" text-anchor="middle">출처 인용 필요 → retrieval</text>
<text x="450" y="322.2" font-size="11" fill="#1F2937" text-anchor="middle">+ grounding 검사</text>
<rect x="600" y="250" width="280" height="90" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="740" y="276.9" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">fine-tuning</text>
<text x="740" y="292.2" font-size="11" fill="#1F2937" text-anchor="middle">맞는 경우 = 스타일 · 판단 과제</text>
<text x="740" y="307.2" font-size="11" fill="#1F2937" text-anchor="middle">이때 검색은 답 ✗</text>
<text x="740" y="322.2" font-size="11" fill="#1F2937" text-anchor="middle">RAG 파이프라인의 대체 수단 ✗</text>
<text x="20" y="366" font-size="11" font-weight="bold" fill="#6B7280" text-anchor="start">흔한 오답</text>
<rect x="20" y="374" width="280" height="70" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="160" y="398.4" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">재구축 주기 단축 · cache</text>
<text x="160" y="413.7" font-size="11" fill="#1F2937" text-anchor="middle">스냅샷은 더 자주 갱신해도 스냅샷</text>
<text x="160" y="428.7" font-size="11" fill="#1F2937" text-anchor="middle">5분 = 하루 288회 · 1분 = 1,440회</text>
<rect x="310" y="374" width="280" height="70" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="450" y="398.4" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">주간 fine-tuning · 학습 지식</text>
<text x="450" y="413.7" font-size="11" fill="#1F2937" text-anchor="middle">재수집 주기보다 열등 · 인용 ✗</text>
<text x="450" y="428.7" font-size="11" fill="#1F2937" text-anchor="middle">검색 없이 생성 = 출처 없음</text>
<rect x="600" y="374" width="280" height="70" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="740" y="398.4" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">모델의 학습 지식에 의존</text>
<text x="740" y="413.7" font-size="11" fill="#1F2937" text-anchor="middle">조직 데이터 ✗ (수개월 전 지식)</text>
<text x="740" y="428.7" font-size="11" fill="#1F2937" text-anchor="middle">이 상점 재고와 무관</text>
</g>
</svg>
