<svg xmlns="http://www.w3.org/2000/svg" width="800" height="470" viewBox="0 0 800 470" role="img" aria-label="검사를 못 하면 위험 행동은 거부하는 fail-closed 흐름">
<title>검사를 못 하면 위험 행동은 거부하는 fail-closed 흐름</title>
<defs><marker id="arr-fail-closed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<g font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">
<text x="400.0" y="28" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">검사를 못 하면 위험 행동은 거부 (fail-closed)</text>
<rect x="230" y="48" width="300" height="48" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="380.0" y="68.8" font-size="13" fill="#1F2937" text-anchor="middle">도구 실행 요청</text>
<text x="380.0" y="84.2" font-size="11" fill="#1F2937" text-anchor="middle">돈 이동 · 구매 · 개인 데이터(이메일) 접근</text>
<polyline points="380,96 380,122" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-fail-closed)"/>
<text x="388" y="114" font-size="11" fill="#1F2937" text-anchor="start">gate = 모델 밖 코드</text>
<polygon points="380,124.0 530.0,184 380,244.0 230.0,184" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
<text x="380" y="173.2" font-size="13" fill="#1F2937" text-anchor="middle">gate가 검사할 수 있나?</text>
<text x="380" y="188.8" font-size="11" fill="#1F2937" text-anchor="middle">backing service 정상</text>
<text x="380" y="203.8" font-size="11" fill="#1F2937" text-anchor="middle">입력 명확</text>
<polyline points="530,184 588,184" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-fail-closed)"/>
<text x="559" y="176" font-size="11" fill="#1F2937" text-anchor="middle">예</text>
<rect x="590" y="150" width="190" height="68" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
<text x="685.0" y="173.2" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">정책 검사 후 실행</text>
<text x="685.0" y="188.8" font-size="11" fill="#1F2937" text-anchor="middle">양방향 screening</text>
<text x="685.0" y="203.8" font-size="11" fill="#1F2937" text-anchor="middle">호출마다 지연 추가</text>
<polyline points="380,244 380,282" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-fail-closed)"/>
<text x="388" y="268" font-size="11" fill="#1F2937" text-anchor="start">아니오 (중단 · 모호)</text>
<rect x="250" y="284" width="260" height="48" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="380.0" y="304.8" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">거부 (fail-closed)</text>
<text x="380.0" y="320.2" font-size="11" fill="#1F2937" text-anchor="middle">지연 · 정상 요청 손실을 감수</text>
<polyline points="380,332 380,364" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-fail-closed)"/>
<text x="388" y="354" font-size="11" fill="#1F2937" text-anchor="start">복구 경로</text>
<rect x="140" y="366" width="430" height="76" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="355.0" y="392.2" font-size="13" fill="#1F2937" text-anchor="middle">대기열 → 복구 시 비움</text>
<text x="355.0" y="409.2" font-size="13" fill="#1F2937" text-anchor="middle">격리 경로 → 폐기 메시지 검토</text>
<text x="355.0" y="424.8" font-size="11" fill="#1F2937" text-anchor="middle">sandbox가 도구를 실제로 가둠 · 알림으로 중단 해소 단축</text>
<rect x="10" y="140" width="170" height="92" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="95.0" y="167.8" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">fail-open 함정</text>
<text x="95.0" y="183.2" font-size="11" fill="#1F2937" text-anchor="middle">가동시간을 위해 허용 전환</text>
<text x="95.0" y="198.2" font-size="11" fill="#1F2937" text-anchor="middle">sandbox · screener</text>
<text x="95.0" y="213.2" font-size="11" fill="#1F2937" text-anchor="middle">→ 중단 = 공격 창</text>
<polyline points="230,184 182,184" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-fail-closed)"/>
<text x="206" y="176" font-size="11" fill="#1F2937" text-anchor="middle">허용 전환</text>
<rect x="590" y="270" width="190" height="76" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="685.0" y="297.2" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">prompt에 한도 기재</text>
<text x="685.0" y="312.8" font-size="11" fill="#1F2937" text-anchor="middle">injection이 prompt를 덮어씀</text>
<text x="685.0" y="327.8" font-size="11" fill="#1F2937" text-anchor="middle">→ 중단 · 공격 시 보장 ✗</text>
<rect x="590" y="364" width="190" height="52" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="685.0" y="386.8" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">적용 제외</text>
<text x="685.0" y="402.2" font-size="11" fill="#1F2937" text-anchor="middle">사용량 대시보드 = 제어 ✗</text>
</g>
</svg>
