<svg xmlns="http://www.w3.org/2000/svg" width="800" height="510" viewBox="0 0 800 510" role="img" aria-label="위험 평가에서 위험별 통제, incident 대응으로 이어지는 흐름">
<title>위험 평가에서 위험별 통제, incident 대응으로 이어지는 흐름</title>
<defs><marker id="arr-risk-control-incident" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<g font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">
<text x="400.0" y="28" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">위험 평가 → 위험별 통제 → incident 대응</text>
<rect x="20" y="48" width="230" height="62" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="135.0" y="68.2" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">red team</text>
<text x="135.0" y="83.8" font-size="11" fill="#1F2937" text-anchor="middle">안전 통제를 적극 공격</text>
<text x="135.0" y="98.8" font-size="11" fill="#1F2937" text-anchor="middle">→ 구멍 발견</text>
<polyline points="250,79 288,79" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-risk-control-incident)"/>
<text x="269" y="71" font-size="11" fill="#1F2937" text-anchor="middle">발견</text>
<rect x="290" y="48" width="230" height="62" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="405.0" y="68.2" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">risk register</text>
<text x="405.0" y="83.8" font-size="11" fill="#1F2937" text-anchor="middle">잔여 위험 + 심각도 · 승인</text>
<text x="405.0" y="98.8" font-size="11" fill="#1F2937" text-anchor="middle">→ 관리되는 결정으로 전환</text>
<polyline points="520,79 558,79" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-risk-control-incident)"/>
<text x="539" y="71" font-size="11" fill="#1F2937" text-anchor="middle">위험별</text>
<rect x="560" y="48" width="220" height="62" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="670.0" y="75.8" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">위험마다 통제</text>
<text x="670.0" y="91.2" font-size="11" fill="#1F2937" text-anchor="middle">예방 · 탐지 · 복구를 갖춤</text>
<polyline points="670,110 670,134" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-risk-control-incident)"/>
<text x="678" y="127" font-size="11" fill="#1F2937" text-anchor="start">통제 설계</text>
<rect x="20" y="136" width="760" height="152" rx="6" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="34" y="156" font-size="11" fill="#6B7280" text-anchor="start">위험별 통제 예</text>
<rect x="36" y="166" width="228" height="110" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="150.0" y="210.2" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">예방</text>
<text x="150.0" y="225.8" font-size="11" fill="#1F2937" text-anchor="middle">호출 · 지출 상한 (측정된 최대치 위)</text>
<text x="150.0" y="240.8" font-size="11" fill="#1F2937" text-anchor="middle">버전 고정 · 파일 접근 범위 한정</text>
<rect x="286" y="166" width="228" height="110" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="400.0" y="202.8" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">탐지</text>
<text x="400.0" y="218.2" font-size="11" fill="#1F2937" text-anchor="middle">지출 알림 (상한보다 먼저)</text>
<text x="400.0" y="233.2" font-size="11" fill="#1F2937" text-anchor="middle">회귀 실행 (refusal · 정책 사례)</text>
<text x="400.0" y="248.2" font-size="11" fill="#1F2937" text-anchor="middle">업데이트별 검토</text>
<rect x="536" y="166" width="228" height="110" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="650.0" y="202.8" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">복구</text>
<text x="650.0" y="218.2" font-size="11" fill="#1F2937" text-anchor="middle">롤백 (실제 테스트)</text>
<text x="650.0" y="233.2" font-size="11" fill="#1F2937" text-anchor="middle">출처 격리 + 담당자 알림</text>
<text x="650.0" y="248.2" font-size="11" fill="#1F2937" text-anchor="middle">실행 종료 + 세션 revoke</text>
<polyline points="100,288 100,326" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-risk-control-incident)"/>
<text x="108" y="314" font-size="11" fill="#1F2937" text-anchor="start">사고 발생</text>
<text x="230" y="322" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">Incident 대응 순서</text>
<rect x="20" y="328" width="160" height="66" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="100.0" y="357.8" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">1. 종료</text>
<text x="100.0" y="373.2" font-size="11" fill="#1F2937" text-anchor="middle">진행 중인 run 중지</text>
<polyline points="180,361 220,361" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-risk-control-incident)"/>
<text x="200" y="353" font-size="11" fill="#1F2937" text-anchor="middle">다음</text>
<rect x="220" y="328" width="160" height="66" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="300.0" y="350.2" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">2. revoke</text>
<text x="300.0" y="365.8" font-size="11" fill="#1F2937" text-anchor="middle">세션 + 캐시된</text>
<text x="300.0" y="380.8" font-size="11" fill="#1F2937" text-anchor="middle">credential 무효화</text>
<polyline points="380,361 420,361" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-risk-control-incident)"/>
<text x="400" y="353" font-size="11" fill="#1F2937" text-anchor="middle">다음</text>
<rect x="420" y="328" width="160" height="66" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="500.0" y="350.2" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">3. 격리</text>
<text x="500.0" y="365.8" font-size="11" fill="#1F2937" text-anchor="middle">주입 출처를 보존한 채</text>
<text x="500.0" y="380.8" font-size="11" fill="#1F2937" text-anchor="middle">분리 (포렌식용)</text>
<polyline points="580,361 620,361" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-risk-control-incident)"/>
<text x="600" y="353" font-size="11" fill="#1F2937" text-anchor="middle">다음</text>
<rect x="620" y="328" width="160" height="66" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="700.0" y="357.8" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">4. 알림</text>
<text x="700.0" y="373.2" font-size="11" fill="#1F2937" text-anchor="middle">담당자에게 통지</text>
<rect x="20" y="424" width="760" height="60" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="400.0" y="443.2" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">오답</text>
<text x="400.0" y="458.8" font-size="11" fill="#1F2937" text-anchor="middle">더 나은 모델 · tier 업그레이드 = 사고 대응 ✗</text>
<text x="400.0" y="473.8" font-size="11" fill="#1F2937" text-anchor="middle">rate limit = 분당 요청 수 제어 ≠ 월 지출 제어 · 사용량 보고서 = 현황 확인용</text>
</g>
</svg>
