<svg xmlns="http://www.w3.org/2000/svg" width="900" height="385" viewBox="0 0 900 385" role="img" aria-label="Least privilege tool 설계: 행동에 기대기 vs 모델 바깥 강제">
<title>Least privilege tool 설계: 행동에 기대기 vs 모델 바깥 강제</title>
<defs><marker id="arr-least-privilege" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<g font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">
<text x="450" y="30" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">Least privilege: 금지는 prompt가 아니라 tool 구성으로 강제한다</text><rect x="20" y="45" width="420" height="325" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/><text x="36" y="68" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="start">오답: 모델의 행동에 기대기</text><rect x="150" y="80" width="160" height="40" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/><text x="230.0" y="104.4" font-size="13" fill="#1F2937" text-anchor="middle">agent (모델)</text><polyline points="230,120 230,158" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-least-privilege)"/><text x="240" y="144" font-size="11" fill="#1F2937" text-anchor="start">prompt: '쓰기는 하지 마라'</text><rect x="100" y="160" width="260" height="54" rx="6" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/><text x="230.0" y="183.7" font-size="13" fill="#1F2937" text-anchor="middle">full credentials</text><text x="230.0" y="199.8" font-size="11" fill="#1F2937" text-anchor="middle">read · write 권한 그대로</text><polyline points="230,214 230,252" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-least-privilege)"/><text x="240" y="238" font-size="11" fill="#1F2937" text-anchor="start">모델이 따르기만 바람</text><rect x="100" y="254" width="260" height="54" rx="6" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/><text x="230.0" y="277.7" font-size="13" fill="#1F2937" text-anchor="middle">DB 전체</text><text x="230.0" y="293.8" font-size="11" fill="#1F2937" text-anchor="middle">schema 없는 범용 tool = 경계 없음</text><text x="230" y="345" font-size="13" font-weight="bold" fill="#DC2626" text-anchor="middle">조작·실수 시 피해 범위 = 전체</text><rect x="460" y="45" width="420" height="325" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/><text x="476" y="68" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="start">정답: 모델 바깥에서 강제</text><rect x="590" y="80" width="160" height="40" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/><text x="670.0" y="104.4" font-size="13" fill="#1F2937" text-anchor="middle">agent (모델)</text><polyline points="670,120 670,158" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-least-privilege)"/><text x="680" y="144" font-size="11" fill="#1F2937" text-anchor="start">tool_use</text><rect x="495" y="160" width="350" height="54" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/><text x="670.0" y="183.7" font-size="13" fill="#1F2937" text-anchor="middle">tool configuration · hooks</text><text x="670.0" y="199.8" font-size="11" fill="#1F2937" text-anchor="middle">tool executor 안의 authorization</text><polyline points="560,214 537,252" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-least-privilege)"/><text x="535" y="236" font-size="11" fill="#1F2937" text-anchor="end">허용</text><polyline points="670,214 670,252" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-least-privilege)"/><text x="678" y="238" font-size="11" fill="#1F2937" text-anchor="start">외부 전송</text><polyline points="780,214 803,252" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-least-privilege)"/><text x="800" y="230" font-size="11" fill="#1F2937" text-anchor="start">금지 행동</text><rect x="475" y="254" width="125" height="56" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/><text x="537.5" y="278.3" font-size="12" fill="#1F2937" text-anchor="middle">필요한 operation만</text><text x="537.5" y="294.1" font-size="11" fill="#1F2937" text-anchor="middle">범위를 좁혀 노출</text><rect x="608" y="254" width="125" height="56" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/><text x="670.5" y="278.3" font-size="12" fill="#1F2937" text-anchor="middle">deterministic gate</text><text x="670.5" y="294.1" font-size="11" fill="#1F2937" text-anchor="middle">코드로 차단 · 보류</text><rect x="741" y="254" width="125" height="56" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/><text x="803.5" y="277.6" font-size="12" fill="#1F2937" text-anchor="middle">tool 자체를</text><text x="803.5" y="294.4" font-size="12" fill="#1F2937" text-anchor="middle">주지 않음</text><text x="670" y="345" font-size="13" font-weight="bold" fill="#2563EB" text-anchor="middle">피해 범위 = 노출한 operation · 범위로 제한</text>
</g>
</svg>
