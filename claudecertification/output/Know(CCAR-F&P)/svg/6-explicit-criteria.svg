<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-label="모호한 지시를 명시적 기준으로 바꿔 false positive를 줄이는 비교" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">
<title>모호한 지시를 명시적 기준으로 바꿔 false positive를 줄이는 비교</title>
<defs><marker id="arr-explicit-criteria" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="20" y="24" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="start">모호한 지시 (측정 불가)</text>
<text x="500" y="24" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="start">명시적 기준 (검증 가능)</text>
<rect x="20" y="40" width="380" height="64" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="210.0" y="68.4" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">주석이 정확 · 최신인지 확인</text>
<text x="210.0" y="83.8" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="middle">무엇이 부정확인지 미정 → TODO · 문구 지적 다수, 진짜 모순 누락</text>
<rect x="500" y="40" width="380" height="64" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="690.0" y="75.5" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="middle">주장 동작이 실제 코드 동작과 모순될 때만 지적</text>
<polyline points="400,72 500,72" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-explicit-criteria)"/>
<rect x="429.5" y="64.0" width="41.0" height="16" fill="#FFFFFF"/>
<text x="450.0" y="76.0" font-size="11" font-weight="normal" fill="#1F2937" text-anchor="middle">구체화</text>
<rect x="20" y="114" width="380" height="64" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="210.0" y="142.4" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">꼼꼼하게 보되 사소한 지적은 피하라</text>
<text x="210.0" y="157.8" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="middle">모델이 기준선을 짐작 → 스타일 지적 들쭉날쭉 · 취약점 누락</text>
<rect x="500" y="114" width="380" height="64" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="690.0" y="142.1" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="middle">범주 · 최소 심각도 · 제외 대상 명시</text>
<text x="690.0" y="157.3" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="middle">준수 여부 확인 가능</text>
<polyline points="400,146 500,146" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-explicit-criteria)"/>
<rect x="429.5" y="138.0" width="41.0" height="16" fill="#FFFFFF"/>
<text x="450.0" y="150.0" font-size="11" font-weight="normal" fill="#1F2937" text-anchor="middle">구체화</text>
<rect x="20" y="188" width="380" height="64" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="210.0" y="216.4" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">높은 확신의 문제만 보고</text>
<text x="210.0" y="231.8" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="middle">오탐 38% → 36%만 감소 · 실제 버그 누락 증가 (보고 범위가 그대로)</text>
<rect x="500" y="188" width="380" height="64" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="690.0" y="207.6" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="middle">보고 대상(로직 오류 · 보안) · 제외 대상(사소한 스타일 ·</text>
<text x="690.0" y="224.6" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="middle">국소 패턴)</text>
<text x="690.0" y="239.8" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="middle">노이즈원 항목은 체크리스트에서 제외</text>
<polyline points="400,220 500,220" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-explicit-criteria)"/>
<rect x="429.5" y="212.0" width="41.0" height="16" fill="#FFFFFF"/>
<text x="450.0" y="224.0" font-size="11" font-weight="normal" fill="#1F2937" text-anchor="middle">구체화</text>
<rect x="20" y="262" width="380" height="64" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="210.0" y="290.4" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">영향의 크기에 따라 심각도 판단</text>
<text x="210.0" y="305.9" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="middle">영향 정의 없음 → 같은 문제가 critical · minor로 갈림</text>
<rect x="500" y="262" width="380" height="64" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="690.0" y="297.6" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="middle">심각도 수준별 구체적 코드 예시 포함 기준</text>
<polyline points="400,294 500,294" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-explicit-criteria)"/>
<rect x="429.5" y="286.0" width="41.0" height="16" fill="#FFFFFF"/>
<text x="450.0" y="298.0" font-size="11" font-weight="normal" fill="#1F2937" text-anchor="middle">구체화</text>
<rect x="20" y="336" width="380" height="64" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="210.0" y="364.4" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">의심스러운 합계를 플래그</text>
<text x="210.0" y="379.9" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="middle">측정 불가 기준 → 무해한 표기 차이 플래그 · 계산 오류 누락</text>
<rect x="500" y="336" width="380" height="64" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="690.0" y="371.6" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="middle">명세 합계와 기재 합계가 모순되는 조건을 수치로 정의</text>
<polyline points="400,368 500,368" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-explicit-criteria)"/>
<rect x="429.5" y="360.0" width="41.0" height="16" fill="#FFFFFF"/>
<text x="450.0" y="372.0" font-size="11" font-weight="normal" fill="#1F2937" text-anchor="middle">구체화</text>
<rect x="20" y="414" width="860" height="44" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
<text x="450.0" y="439.6" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="middle">노이즈의 원인 = 확신도가 아니라 보고 범위 → 기준으로 경계를 긋고 경계 예시(&lt;example&gt; 3~5개)로 시연</text>
</svg>
