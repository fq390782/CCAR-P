<text x="750" y="184.05" font-size="13" text-anchor="middle" fill="#1F2937">삭감 + 더 큰 tier 동시 적용 → 진단 뒤섞임</text>
<text x="750" y="201.05" font-size="13" text-anchor="middle" fill="#1F2937">토큰당 정가 비교 · 월 총지출만 비교</text>
<text x="750" y="218.05" font-size="13" text-anchor="middle" fill="#1F2937">session budget · Usage · Cost 합계 = 품질 점수 ✗</text>
