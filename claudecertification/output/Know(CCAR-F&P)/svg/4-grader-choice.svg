<svg xmlns="http://www.w3.org/2000/svg" width="820" height="470" viewBox="0 0 820 470" role="img" aria-label="free-form prose의 주관적 품질은 rubric을 준 LLM-as-judge로 채점하고 judge는 human label로 검증한다. 형식 검사는 code로 하지만 품질 eval이 아니다." font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">
<title>Grader 선택</title>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<defs><marker id="arr-grader-choice" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker><marker id="arr-grader-choice-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker></defs>
<text x="20" y="30" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="start">Grader 선택: free-form prose 품질은 LLM-as-judge + rubric</text>
<polygon points="450,68.0 600.0,110 450,152.0 300.0,110" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
<text x="450" y="106.5" text-anchor="middle"><tspan x="450" dy="0" font-size="13" fill="#1F2937">free-form prose의</tspan><tspan x="450" dy="16" font-size="13" fill="#1F2937">주관적 품질을 평가?</tspan></text>
<rect x="30" y="200" width="240" height="70" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="150.0" y="224.9" text-anchor="middle"><tspan x="150.0" dy="0" font-size="14" font-weight="bold" fill="#1F2937">code-based 검사</tspan><tspan x="150.0" dy="16" font-size="13" fill="#1F2937">valid JSON 여부 등</tspan><tspan x="150.0" dy="14" font-size="11" fill="#6B7280">형식 검사일 뿐, 품질 eval 아님</tspan></text>
<rect x="320" y="200" width="260" height="70" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="450.0" y="225.9" text-anchor="middle"><tspan x="450.0" dy="0" font-size="14" font-weight="bold" fill="#1F2937">LLM-as-judge + rubric</tspan><tspan x="450.0" dy="14" font-size="11" fill="#6B7280">출처에 충실한가?</tspan><tspan x="450.0" dy="14" font-size="11" fill="#6B7280">지어낸 주장이 없는가?</tspan></text>
<rect x="320" y="310" width="260" height="56" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="450.0" y="335.9" text-anchor="middle"><tspan x="450.0" dy="0" font-size="14" font-weight="bold" fill="#1F2937">human label 표본과 대조</tspan><tspan x="450.0" dy="14" font-size="11" fill="#6B7280">judge 자체를 validation</tspan></text>
<rect x="320" y="406" width="260" height="44" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
<text x="450.0" y="432.6" text-anchor="middle"><tspan x="450.0" dy="0" font-size="13" fill="#1F2937">신뢰할 수 있는 품질 점수</tspan></text>
<path d="M300,110 L150,110 L150,200" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-grader-choice)"/>
<rect x="162.6" y="91" width="124.9" height="17" fill="#FFFFFF"/>
<text x="225" y="103" font-size="12" fill="#1F2937" text-anchor="middle">아니오: 형식만 확인</text>
<path d="M450,152 L450,200" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-grader-choice)"/>
<rect x="454.0" y="170" width="20.0" height="17" fill="#FFFFFF"/>
<text x="458" y="182" font-size="12" fill="#1F2937" text-anchor="start">예</text>
<path d="M450,270 L450,310" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-grader-choice)"/>
<rect x="454.0" y="283" width="73.8" height="17" fill="#FFFFFF"/>
<text x="458" y="295" font-size="12" fill="#1F2937" text-anchor="start">judge 검증</text>
<path d="M450,366 L450,406" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-grader-choice)"/>
<text x="705" y="190" font-size="14" font-weight="bold" fill="#DC2626" text-anchor="middle">흔한 오답</text>
<rect x="610" y="200" width="190" height="70" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="705.0" y="225.6" text-anchor="middle"><tspan x="705.0" dy="0" font-size="13" fill="#1F2937">✗ exact string match</tspan><tspan x="705.0" dy="14" font-size="11" fill="#6B7280">golden answer와 비교하면</tspan><tspan x="705.0" dy="14" font-size="11" fill="#6B7280">정답도 표현이 달라 실패</tspan></text>
<rect x="610" y="310" width="190" height="56" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="705.0" y="334.6" text-anchor="middle"><tspan x="705.0" dy="0" font-size="13" fill="#1F2937">✗ rubric 없이</tspan><tspan x="705.0" dy="16" font-size="13" fill="#1F2937">맨 점수만 요청</tspan></text>
</svg>
