<svg xmlns="http://www.w3.org/2000/svg" width="800" height="510" viewBox="0 0 800 510" role="img" aria-label="합산 수치가 그룹 격차를 가리므로 하위 그룹별로 측정하는 흐름">
<title>합산 수치가 그룹 격차를 가리므로 하위 그룹별로 측정하는 흐름</title>
<defs><marker id="arr-fairness-subgroup" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<g font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">
<text x="400.0" y="28" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">합산 수치는 그룹 격차를 가림 → 하위 그룹별 측정</text>
<rect x="20" y="52" width="290" height="44" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="165.0" y="78.2" font-size="13" fill="#1F2937" text-anchor="middle">집계 평가: 전체 90%</text>
<polyline points="165,96 165,120" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-fairness-subgroup)"/>
<text x="173" y="113" font-size="11" fill="#1F2937" text-anchor="start">합산이 가림</text>
<rect x="20" y="122" width="290" height="60" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="165.0" y="148.8" font-size="13" fill="#1F2937" text-anchor="middle">그룹 하나 68%가 가려짐</text>
<text x="165.0" y="164.2" font-size="11" fill="#1F2937" text-anchor="middle">전체 목표 충족 + 그룹 격차 공존</text>
<rect x="20" y="206" width="290" height="132" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="165.0" y="238.8" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">수정이 안 되는 오답</text>
<text x="165.0" y="254.2" font-size="11" fill="#1F2937" text-anchor="middle">집계 값 튜닝 → 전체 점수만 이동</text>
<text x="165.0" y="269.2" font-size="11" fill="#1F2937" text-anchor="middle">민감 필드 1개 제거 → 가정 존속</text>
<text x="165.0" y="284.2" font-size="11" fill="#1F2937" text-anchor="middle">블라인딩만 → 우편번호 · 경력 공백 잔존</text>
<text x="165.0" y="299.2" font-size="11" fill="#1F2937" text-anchor="middle">데이터 증량 → 기존 패턴 고착 가능</text>
<text x="165.0" y="314.2" font-size="11" fill="#1F2937" text-anchor="middle">그룹 · label 삭제 → 격차 그대로 + 측정 불가</text>
<rect x="20" y="362" width="290" height="78" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="165.0" y="390.2" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">소표본 그룹</text>
<text x="165.0" y="405.8" font-size="11" fill="#1F2937" text-anchor="middle">noisy score → 불확실성(구간) 보고</text>
<text x="165.0" y="420.8" font-size="11" fill="#1F2937" text-anchor="middle">표본 확대 후 기준선이 구속</text>
<rect x="370" y="52" width="300" height="44" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="520.0" y="70.8" font-size="13" fill="#1F2937" text-anchor="middle">하위 그룹별 평가</text>
<text x="520.0" y="86.2" font-size="11" fill="#1F2937" text-anchor="middle">채용 · 대출 · 만족도 등 사람에 영향</text>
<polyline points="520,96 520,120" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-fairness-subgroup)"/>
<text x="528" y="113" font-size="11" fill="#1F2937" text-anchor="start">그룹별 점수</text>
<rect x="370" y="122" width="300" height="44" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="520.0" y="140.8" font-size="13" fill="#1F2937" text-anchor="middle">그룹별 기준선(하한) 설정</text>
<text x="520.0" y="156.2" font-size="11" fill="#1F2937" text-anchor="middle">비즈니스 · 법무 승인 필요</text>
<polyline points="520,166 520,192" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-fairness-subgroup)"/>
<text x="528" y="183" font-size="11" fill="#1F2937" text-anchor="start">비교</text>
<polygon points="520,192.0 630.0,234 520,276.0 410.0,234" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
<text x="520" y="229.8" font-size="13" fill="#1F2937" text-anchor="middle">기준선 미달</text>
<text x="520" y="246.8" font-size="13" fill="#1F2937" text-anchor="middle">그룹 있나?</text>
<polyline points="630,234 702,234" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-fairness-subgroup)"/>
<text x="666" y="226" font-size="11" fill="#1F2937" text-anchor="middle">아니오</text>
<rect x="704" y="214" width="76" height="40" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
<text x="742.0" y="238.2" font-size="13" fill="#1F2937" text-anchor="middle">출시</text>
<polyline points="520,276 520,304" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-fairness-subgroup)"/>
<text x="528" y="296" font-size="11" fill="#1F2937" text-anchor="start">예</text>
<rect x="370" y="306" width="300" height="36" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="520.0" y="328.2" font-size="13" fill="#1F2937" text-anchor="middle">출시 차단</text>
<polyline points="520,342 520,366" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-fairness-subgroup)"/>
<text x="528" y="359" font-size="11" fill="#1F2937" text-anchor="start">원인 규명</text>
<rect x="370" y="368" width="300" height="44" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="520.0" y="386.8" font-size="13" fill="#1F2937" text-anchor="middle">데이터 감사</text>
<text x="520.0" y="402.2" font-size="11" fill="#1F2937" text-anchor="middle">학습 데이터 · label · rule 중 위치 확인</text>
<polyline points="520,412 520,436" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-fairness-subgroup)"/>
<text x="528" y="429" font-size="11" fill="#1F2937" text-anchor="start">상류 수정</text>
<rect x="370" y="438" width="300" height="52" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="520.0" y="460.8" font-size="13" fill="#1F2937" text-anchor="middle">데이터 · rubric · prompt 수정</text>
<text x="520.0" y="476.2" font-size="11" fill="#1F2937" text-anchor="middle">feedback loop도 상류</text>
<polyline points="370,464 346,464 346,74 368,74" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-fairness-subgroup)"/>
<text transform="rotate(-90 338 270)" x="338" y="270" font-size="11" fill="#1F2937" text-anchor="middle">재평가</text>
</g>
</svg>
