<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" role="img" aria-label="system prompt와 user message의 역할 분리" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">
<title>system prompt와 user message의 역할 분리</title>
<defs><marker id="arr-system-vs-user" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="20" y="30" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="start">올바른 배치 (Messages API)</text>
<text x="470" y="30" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="start">잘못된 배치</text>
<rect x="20" y="50" width="280" height="104" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="160.0" y="81.5" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">system (top-level 파라미터)</text>
<text x="160.0" y="98.7" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="middle">role · 행동 규칙 · 안전 제약</text>
<text x="160.0" y="115.7" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="middle">항상 참조할 배경 정보</text>
<text x="160.0" y="131.3" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="middle">모든 턴에 일관되게 적용할 안정적 지침</text>
<rect x="20" y="190" width="280" height="84" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="160.0" y="220.0" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">messages의 user 턴</text>
<text x="160.0" y="237.2" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="middle">사용자 질문 · 참조 데이터</text>
<text x="160.0" y="252.8" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="middle">매 요청마다 바뀌는 입력</text>
<rect x="315" y="130" width="135" height="64" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
<text x="382.5" y="157.5" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">Claude</text>
<text x="382.5" y="174.7" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="middle">일관된 행동·어조</text>
<polyline points="300,102 360,102 360,130" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-system-vs-user)"/>
<rect x="281.1" y="83" width="97.8" height="16" fill="#FFFFFF"/>
<text x="330" y="95.5" font-size="11" font-weight="normal" fill="#1F2937" text-anchor="middle">대화 전체의 전제</text>
<polyline points="300,232 380,232 380,194" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-system-vs-user)"/>
<rect x="310.8" y="239" width="58.4" height="16" fill="#FFFFFF"/>
<text x="340" y="251.5" font-size="11" font-weight="normal" fill="#1F2937" text-anchor="middle">개별 요청</text>
<text x="20" y="305" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="start">system prompt를 쓸 수 없는 환경이면 지시를 user message에 써도 대체로 따르지만,</text>
<text x="20" y="321" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="start">원칙은 아니다 (유지보수가 어렵고 입력이 지침을 약화시킬 여지).</text>
<rect x="470" y="50" width="410" height="84" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="675.0" y="79.0" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">지침을 user 턴에 (첫 · 마지막 · 매 메시지 반복)</text>
<text x="675.0" y="96.2" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="middle">configuration과 input이 섞여 drift</text>
<text x="675.0" y="113.2" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="middle">입력 문구에 따라 지침이 약해지거나 덮어써짐</text>
<rect x="470" y="150" width="410" height="66" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="675.0" y="178.5" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">사용자 질문까지 system prompt에</text>
<text x="675.0" y="195.7" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="middle">신뢰할 수 없는 입력을 지침과 같은 권위로 다룸</text>
<rect x="470" y="232" width="410" height="66" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="675.0" y="260.5" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">행동 지침을 tool description에</text>
<text x="675.0" y="277.7" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="middle">tool description은 tool 선택을 좌우하는 곳</text>
</svg>
