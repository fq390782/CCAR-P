<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-label="tool_choice 모드별 보장과 추출 tool 강제 방법" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">
<title>tool_choice 모드별 보장과 추출 tool 강제 방법</title>
<defs><marker id="arr-tool-choice-extraction" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="450" y="24" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">any = 호출 보장 · 특정 tool 보장은 tool 지정</text>
<rect x="20" y="44" width="280" height="56" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="160.0" y="68.4" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">auto</text>
<text x="160.0" y="83.8" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="middle">호출 여부는 모델 판단</text>
<rect x="20" y="112" width="280" height="50" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="160.0" y="133.1" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="middle">tool 없이 텍스트만 반환 가능</text>
<text x="160.0" y="148.3" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="middle">→ 구조화 출력 누락</text>
<rect x="310" y="44" width="280" height="56" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="450.0" y="68.4" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">any</text>
<text x="450.0" y="83.8" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="middle">제공 tool 중 하나 반드시 호출</text>
<rect x="310" y="112" width="280" height="50" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="450.0" y="133.1" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="middle">어느 tool인지 보장 ✗</text>
<text x="450.0" y="148.3" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="middle">호출 순서 보장 ✗</text>
<rect x="600" y="44" width="280" height="56" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="740.0" y="68.4" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">{"type": "tool", "name": ...}</text>
<text x="740.0" y="83.8" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="middle">지정 tool 반드시 호출</text>
<rect x="600" y="112" width="280" height="50" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="740.0" y="140.6" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="middle">문서 종류 불명이면 사용 ✗</text>
<line x1="20" y1="182" x2="880" y2="182" stroke="#9CA3AF" stroke-width="1"/>
<text x="20" y="204" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="start">문서 종류 불명 + 추출 schema 여러 개</text>
<rect x="20" y="214" width="200" height="66" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="120.0" y="242.3" font-size="11" font-weight="normal" fill="#1F2937" text-anchor="middle">tool_choice: auto</text>
<text x="120.0" y="257.4" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="middle">일부 요청이 텍스트만 반환</text>
<rect x="320" y="214" width="270" height="66" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="455.0" y="235.9" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">tool_choice: {"type": "any"}</text>
<text x="455.0" y="251.3" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="middle">각 tool description에 고유 기재 항목 · 타</text>
<text x="455.0" y="266.4" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="middle">종류와 구별법</text>
<rect x="690" y="214" width="190" height="66" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="785.0" y="243.4" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">표본 확인</text>
<text x="785.0" y="258.9" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="middle">선택 tool과 실제 종류</text>
<polyline points="220,247 320,247" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-tool-choice-extraction)"/>
<rect x="238.2" y="239.0" width="63.7" height="16" fill="#FFFFFF"/>
<text x="270.0" y="251.0" font-size="11" font-weight="normal" fill="#1F2937" text-anchor="middle">any로 변경</text>
<polyline points="590,247 690,247" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-tool-choice-extraction)"/>
<rect x="605.0" y="239.0" width="70.0" height="16" fill="#FFFFFF"/>
<text x="640" y="251" font-size="11" font-weight="normal" fill="#1F2937" text-anchor="middle">종류 혼동 시</text>
<line x1="20" y1="300" x2="880" y2="300" stroke="#9CA3AF" stroke-width="1"/>
<text x="20" y="322" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="start">조회 tool이 추출보다 먼저 호출 (any는 순서 보장 ✗) → 첫 요청만 강제</text>
<rect x="20" y="332" width="240" height="66" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="140.0" y="361.4" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">첫 요청: tool 지정 강제</text>
<text x="140.0" y="376.9" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="middle">추출 tool을 반드시 호출</text>
<rect x="360" y="332" width="220" height="66" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="470.0" y="361.4" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">이후 turn</text>
<text x="470.0" y="376.9" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="middle">tool_choice를 되돌림</text>
<rect x="680" y="332" width="200" height="66" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
<text x="780.0" y="368.6" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="middle">조회 · enrichment 진행</text>
<polyline points="260,365 360,365" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-tool-choice-extraction)"/>
<rect x="282.2" y="357.0" width="55.5" height="16" fill="#FFFFFF"/>
<text x="310.0" y="369.0" font-size="11" font-weight="normal" fill="#1F2937" text-anchor="middle">추출 완료</text>
<polyline points="580,365 680,365" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-tool-choice-extraction)"/>
<rect x="602.2" y="357.0" width="55.5" height="16" fill="#FFFFFF"/>
<text x="630.0" y="369.0" font-size="11" font-weight="normal" fill="#1F2937" text-anchor="middle">조회 진행</text>
<line x1="20" y1="418" x2="880" y2="418" stroke="#9CA3AF" stroke-width="1"/>
<rect x="20" y="430" width="860" height="46" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="450.0" y="456.6" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="middle">강제 미지원 모델: auto + strict: true tool 또는 structured outputs</text>
<text x="20" y="500" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="start">주의: 2026년 9월 이후 일부 모델은 any · tool 강제 시 400 (해설 보충) · 시험 가이드(2026년 7월판)보다 새로움</text>
<text x="20" y="518" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="start">→ 시험은 강제 가능 전제로 출제될 수 있음</text>
</svg>
