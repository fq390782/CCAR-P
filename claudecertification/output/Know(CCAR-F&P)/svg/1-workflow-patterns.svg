<text x="20" y="30" font-size="14" fill="#1F2937" text-anchor="start" font-weight="bold">Workflow 패턴 — 분해 내용을 누가, 언제 정하나</text>
<rect x="10" y="45" width="900" height="90" rx="6" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="24" y="67" font-size="14" fill="#1F2937" text-anchor="start" font-weight="bold">prompt chaining</text>
<text x="24" y="89" font-size="11" fill="#6B7280" text-anchor="start">순서를 앱 코드가 고정</text>
<text x="24" y="104" font-size="11" fill="#6B7280" text-anchor="start">단계 사이 gate 가능</text>
<rect x="10" y="145" width="900" height="160" rx="6" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="24" y="167" font-size="14" fill="#1F2937" text-anchor="start" font-weight="bold">routing</text>
<text x="24" y="189" font-size="11" fill="#6B7280" text-anchor="start">분류해 전용 처리로 보내고 끝</text>
<text x="24" y="204" font-size="11" fill="#6B7280" text-anchor="start">분해·통합 없음</text>
<rect x="10" y="315" width="900" height="160" rx="6" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="24" y="337" font-size="14" fill="#1F2937" text-anchor="start" font-weight="bold">parallelization (voting)</text>
<text x="24" y="359" font-size="11" fill="#6B7280" text-anchor="start">같은 작업을 여러 번 실행</text>
<text x="24" y="374" font-size="11" fill="#6B7280" text-anchor="start">작업 분해가 아님</text>
<rect x="10" y="485" width="900" height="170" rx="6" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="24" y="507" font-size="14" fill="#1F2937" text-anchor="start" font-weight="bold">orchestrator-workers</text>
<text x="24" y="529" font-size="11" fill="#6B7280" text-anchor="start">subtask를 실행 중에 결정</text>
<text x="24" y="544" font-size="11" fill="#6B7280" text-anchor="start">입력마다 분해가 달라짐</text>
