<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-label="직렬 호출과 AsyncAnthropic 병렬 호출 비교" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">
<title>직렬 호출과 AsyncAnthropic 병렬 호출 비교</title>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<defs><marker id="arr-async-parallel-semaphore" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker></defs>
<text x="450" y="28" font-size="14" text-anchor="middle" fill="#1F2937" font-weight="bold">독립 호출이 직렬이라 느리면 AsyncAnthropic + asyncio.gather로 병렬, Semaphore로 동시 수 제한</text>
<text x="30" y="70" font-size="13" text-anchor="start" fill="#1F2937" font-weight="bold">직렬 (동기 Anthropic)</text>
<rect x="220" y="52" width="150" height="32" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="295.0" y="72.5" font-size="12" text-anchor="middle" fill="#1F2937">호출 1</text>
<rect x="374" y="52" width="200" height="32" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="474.0" y="72.5" font-size="12" text-anchor="middle" fill="#1F2937">호출 2</text>
<rect x="578" y="52" width="120" height="32" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="638.0" y="72.5" font-size="12" text-anchor="middle" fill="#1F2937">호출 3</text>
<text x="712" y="73" font-size="12" text-anchor="start" fill="#6B7280">총 시간 = 합</text>
<text x="30" y="140" font-size="13" text-anchor="start" fill="#1F2937" font-weight="bold">병렬 (AsyncAnthropic</text>
<text x="30" y="158" font-size="13" text-anchor="start" fill="#1F2937" font-weight="bold"> + asyncio.gather)</text>
<rect x="220" y="110" width="150" height="32" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="295.0" y="130.5" font-size="12" text-anchor="middle" fill="#1F2937">호출 1</text>
<rect x="220" y="148" width="200" height="32" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="320.0" y="168.5" font-size="12" text-anchor="middle" fill="#1F2937">호출 2</text>
<rect x="220" y="186" width="120" height="32" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="280.0" y="206.5" font-size="12" text-anchor="middle" fill="#1F2937">호출 3</text>
<line x1="420" y1="104" x2="420" y2="226" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="430" y="170" font-size="12" text-anchor="start" fill="#6B7280">총 시간 ≈ 가장 느린 1건</text>
<polyline points="220,244 800,244" fill="none" stroke="#6B7280" stroke-width="1.5"/>
<text x="800" y="260" font-size="11" text-anchor="end" fill="#6B7280">시간 →</text>
<rect x="30" y="280" width="260" height="70" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="160.0" y="311.0" font-size="13" text-anchor="middle" fill="#1F2937">asyncio.Semaphore</text>
<text x="160.0" y="328.0" font-size="11" text-anchor="middle" fill="#6B7280">동시 실행 수를 rate limit 안으로</text>
<rect x="320" y="280" width="260" height="70" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="450.0" y="311.0" font-size="13" text-anchor="middle" fill="#1F2937">SDK 자동 재시도와 함께</text>
<text x="450.0" y="328.0" font-size="11" text-anchor="middle" fill="#6B7280">429 등 일시 오류 흡수</text>
<rect x="610" y="280" width="270" height="70" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="745.0" y="311.0" font-size="13" text-anchor="middle" fill="#1F2937">max_retries만 늘리기</text>
<text x="745.0" y="328.0" font-size="11" text-anchor="middle" fill="#6B7280">직렬 구조 그대로 → 총 시간 안 줄어듦</text>
<text x="450" y="380" font-size="11" text-anchor="middle" fill="#6B7280">AsyncAnthropic은 동기 Anthropic과 인터페이스가 같다 · 범례: 파란 점선 = 병렬 완료 시점</text>
</svg>
