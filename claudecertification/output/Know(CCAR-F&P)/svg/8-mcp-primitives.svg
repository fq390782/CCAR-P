<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-label="MCP 세 primitive는 누가 주도하는지로 구분한다: tools는 모델, resources는 앱, prompts는 사용자" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">
<title>MCP 세 primitive는 누가 주도하는지로 구분한다: tools는 모델, resources는 앱, prompts는 사용자</title>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<defs><marker id="arr-8-mcp-primitives" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker></defs>
<rect x="20" y="150" width="860" height="150" rx="6" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="450" y="290" font-size="11" fill="#6B7280" text-anchor="middle">MCP server가 노출</text>
<rect x="40" y="30" width="260" height="50" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
<text x="170.0" y="59.0" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">모델 (Claude)</text>
<polyline points="170,80 170,164" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-8-mcp-primitives)"/>
<rect x="106.98076923076923" y="115" width="126.03846153846153" height="15" fill="#FFFFFF"/>
<text x="170" y="126" font-size="11" fill="#1F2937" text-anchor="middle">상황에 따라 찾아 호출</text>
<rect x="40" y="166" width="260" height="100" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="170.0" y="212.0" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">tools</text>
<text x="170.0" y="228.0" font-size="12" fill="#1F2937" text-anchor="middle">호출 가능한 기능</text>
<rect x="320" y="30" width="260" height="50" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
<text x="450.0" y="59.0" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">앱 (host)</text>
<polyline points="450,80 450,164" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-8-mcp-primitives)"/>
<rect x="356.0961538461538" y="115" width="187.80769230769232" height="15" fill="#FFFFFF"/>
<text x="450" y="126" font-size="11" fill="#1F2937" text-anchor="middle">어떤 것을 context에 넣을지 결정</text>
<rect x="320" y="166" width="260" height="100" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="450.0" y="204.0" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">resources</text>
<text x="450.0" y="220.0" font-size="12" fill="#1F2937" text-anchor="middle">파일, DB 스키마, 문서 같은</text>
<text x="450.0" y="236.0" font-size="12" fill="#1F2937" text-anchor="middle">참조 데이터를 URI로 노출</text>
<rect x="600" y="30" width="260" height="50" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
<text x="730.0" y="59.0" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">사용자</text>
<polyline points="730,80 730,164" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-8-mcp-primitives)"/>
<rect x="631.2307692307693" y="115" width="197.53846153846155" height="15" fill="#FFFFFF"/>
<text x="730" y="126" font-size="11" fill="#1F2937" text-anchor="middle">slash command 등으로 명시적 선택</text>
<rect x="600" y="166" width="260" height="100" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="730.0" y="204.0" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">prompts</text>
<text x="730.0" y="220.0" font-size="12" fill="#1F2937" text-anchor="middle">재사용 가능한</text>
<text x="730.0" y="236.0" font-size="12" fill="#1F2937" text-anchor="middle">프롬프트 템플릿</text>
<rect x="20" y="320" width="860" height="120" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="450.0" y="359.5" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">오답</text>
<text x="450.0" y="375.5" font-size="12" fill="#1F2937" text-anchor="middle">tool 사양서를 resource로 읽힘 → 호출 가능한 tool로 등록되지 않음</text>
<text x="450.0" y="391.5" font-size="12" fill="#1F2937" text-anchor="middle">prompts로 모델이 tool을 자동으로 찾게 함 → prompts는 사용자가 고르는 템플릿</text>
<text x="450.0" y="407.5" font-size="12" fill="#1F2937" text-anchor="middle">tool 발견에 prompts·resources 사용 → 발견은 tools/list</text>
</svg>
