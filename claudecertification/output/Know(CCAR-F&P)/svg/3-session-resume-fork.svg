<svg xmlns="http://www.w3.org/2000/svg" width="890" height="404" viewBox="0 0 890 404" role="img" aria-label="session 이어가기와 fork는 대화 이력을 다루고, rewind는 Claude가 편집한 파일을 복구하며 Bash로만 바뀐 파일은 버전 관리로 되돌린다" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">
  <title>session 이어가기, fork, rewind 비교</title>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <defs>
    <marker id="arr-sessfork" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker>
  </defs>
  <text x="445" y="26" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F2937">이어가기 · 분기는 대화 이력, rewind는 파일 복구: 다루는 대상이 다르다</text>
  <text x="20" y="54" font-size="14" font-weight="bold" fill="#1F2937">대화 이력: 이어가기 vs 분기</text>

  <rect x="20" y="118" width="130" height="48" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="85" y="139" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2937">기준점 대화</text>
  <text x="85" y="156" text-anchor="middle" font-size="11" fill="#6B7280">같은 baseline</text>
  <polyline points="150,142 180,142 180,98 248,98" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-sessfork)"/>
  <text x="214" y="92" text-anchor="middle" font-size="11" fill="#6B7280">이어가기</text>
  <polyline points="180,142 180,191 248,191" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-sessfork)"/>
  <text x="214" y="185" text-anchor="middle" font-size="11" fill="#6B7280">fork</text>

  <rect x="250" y="66" width="340" height="64" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="420" y="87" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2937">--continue · --resume &lt;session ID&gt;</text>
  <text x="420" y="105" text-anchor="middle" font-size="11" fill="#6B7280">최신 대화 · 지정한 과거 대화를 이어감</text>
  <text x="420" y="121" text-anchor="middle" font-size="11" fill="#6B7280">같은 대화에 추가 → 혼입 · 원본 덮어쓰기 불가피</text>

  <rect x="250" y="156" width="150" height="70" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="325" y="178" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2937">fork</text>
  <text x="325" y="197" text-anchor="middle" font-size="11" fill="#6B7280">원래 이력 복사 → 새 ID</text>
  <text x="325" y="213" text-anchor="middle" font-size="11" fill="#6B7280">원본 ID · 이력 불변</text>
  <polyline points="400,191 450,191" fill="none" stroke="#1F2937" stroke-width="1.5"/>
  <polyline points="450,168 450,218" fill="none" stroke="#1F2937" stroke-width="1.5"/>
  <line x1="450" y1="168" x2="478" y2="168" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-sessfork)"/>
  <line x1="450" y1="218" x2="478" y2="218" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-sessfork)"/>
  <text x="425" y="183" text-anchor="middle" font-size="11" fill="#6B7280">각각</text>
  <rect x="480" y="146" width="220" height="44" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="590" y="164" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2937">fork 1 · 새 ID</text>
  <text x="590" y="181" text-anchor="middle" font-size="11" fill="#6B7280">전략 A를 독립 재개</text>
  <rect x="480" y="196" width="220" height="44" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="590" y="214" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2937">fork 2 · 새 ID</text>
  <text x="590" y="231" text-anchor="middle" font-size="11" fill="#6B7280">전략 B를 독립 재개</text>
  <rect x="716" y="146" width="134" height="94" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="783" y="168" text-anchor="middle" font-size="11" fill="#6B7280">같은 baseline에서</text>
  <text x="783" y="186" text-anchor="middle" font-size="11" fill="#6B7280">전략 2개 비교</text>
  <text x="783" y="208" text-anchor="middle" font-size="11" fill="#6B7280">추론 혼입 ✗</text>
  <text x="783" y="226" text-anchor="middle" font-size="11" fill="#6B7280">원본 보존</text>
  <rect x="250" y="252" width="600" height="30" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="550" y="272" text-anchor="middle" font-size="11" fill="#6B7280">fork 한계: 분리 = 대화 이력만 · 파일 ✗ → 파일 편집 시 별도 작업 트리 · checkpoint 병용</text>

  <text x="20" y="314" font-size="14" font-weight="bold" fill="#1F2937">되돌리기: rewind = 사후 복구 · 사전 차단 ✗</text>
  <rect x="20" y="326" width="270" height="64" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="155" y="348" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2937">Claude가 편집한 파일</text>
  <text x="155" y="366" text-anchor="middle" font-size="11" fill="#6B7280">→ rewind</text>
  <text x="155" y="381" text-anchor="middle" font-size="11" fill="#6B7280">(session이 유지하는 checkpoint 범위 내)</text>
  <rect x="310" y="326" width="270" height="64" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="445" y="348" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2937">Bash 명령으로만 바뀐 파일</text>
  <text x="445" y="366" text-anchor="middle" font-size="11" fill="#6B7280">rewind 추적 ✗</text>
  <text x="445" y="381" text-anchor="middle" font-size="11" fill="#6B7280">→ 버전 관리로 되돌림</text>
  <rect x="600" y="326" width="270" height="64" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="735" y="348" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2937">두 종류 모두</text>
  <text x="735" y="366" text-anchor="middle" font-size="11" fill="#6B7280">rewind + 버전 관리 병용</text>
</svg>
