<text x="20" y="393" font-size="13" fill="#1F2937" text-anchor="start" font-weight="bold">자주 나오는 오답</text>
<rect x="20" y="405" width="300" height="50" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="170.0" y="425.1" font-size="13" fill="#1F2937" text-anchor="middle">tool_use인데 같은 요청 재전송·턴 종료</text>
