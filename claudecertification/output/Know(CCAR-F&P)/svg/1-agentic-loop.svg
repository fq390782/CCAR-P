<rect x="330" y="405" width="300" height="50" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="480.0" y="425.1" font-size="13" fill="#1F2937" text-anchor="middle">end_turn인데 tool 재실행·빈 tool_result</text>
<text x="480.0" y="441.7" font-size="11" fill="#6B7280" text-anchor="middle">이미 완료된 턴</text>
<rect x="640" y="405" width="300" height="50" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="790.0" y="425.1" font-size="13" fill="#1F2937" text-anchor="middle">text block이 있으면 종료</text>
<text x="790.0" y="441.7" font-size="11" fill="#6B7280" text-anchor="middle">text와 tool 호출은 함께 올 수 있음</text>
