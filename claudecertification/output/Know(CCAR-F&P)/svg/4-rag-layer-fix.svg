<text x="800.0" y="193.3" font-size="11" fill="#6B7280" text-anchor="middle">그럴듯한 가짜 판례 인용</text>
<text x="800.0" y="207.3" font-size="11" fill="#6B7280" text-anchor="middle">(실제 같은 이름 · 올바른 형식)</text>
<text x="800.0" y="221.3" font-size="11" fill="#6B7280" text-anchor="middle">= ungrounded generation</text>
<text x="800.0" y="235.3" font-size="11" fill="#6B7280" text-anchor="middle">(parametric memory에서 생성)</text>
