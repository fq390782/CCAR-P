<text x="570.0" y="363.4" font-size="11" fill="#6B7280" text-anchor="middle">retrieve-then-read</text>
<text x="570.0" y="377.4" font-size="11" fill="#6B7280" text-anchor="middle">관련 섹션을 먼저 가져옴</text>
