<svg xmlns="http://www.w3.org/2000/svg" width="920" height="580" viewBox="0 0 920 580" role="img" aria-label="증상이 아니라 trace가 실패 계층을 지목하면, 그 계층의 구성 요소를 고친다." font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">
<title>RAG 실패의 계층별 수정</title>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<defs><marker id="arr-rag-layer-fix" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker></defs>
<text x="20" y="30" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="start">RAG 실패: 계층은 증상이 아니라 trace가 결정, 지목된 계층의 구성 요소를 고친다</text>
