<text x="340.0" y="348.6" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">수정</text>
<text x="340.0" y="363.4" font-size="11" fill="#6B7280" text-anchor="middle">ranking에서 권위 출처 우대</text>
<text x="340.0" y="377.4" font-size="11" fill="#6B7280" text-anchor="middle">(또는 사양 corpus filter)</text>
<text x="340.0" y="391.4" font-size="11" fill="#6B7280" text-anchor="middle">source-type metadata 추가</text>
<text x="340.0" y="405.4" font-size="11" fill="#6B7280" text-anchor="middle">→ retrieval에서 우선</text>
<path d="M570.0,104 L570.0,144" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-rag-layer-fix)"/>
<rect x="572.0" y="117" width="32.0" height="17" fill="#FFFFFF"/>
