<text x="340.0" y="74.5" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">retrieval</text>
<text x="340.0" y="89.3" font-size="11" fill="#6B7280" text-anchor="middle">chunk 검색 · ranking</text>
<rect x="480" y="50" width="180" height="54" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="570.0" y="74.5" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">context window</text>
