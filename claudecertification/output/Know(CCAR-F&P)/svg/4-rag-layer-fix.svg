<text x="570.0" y="178.6" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">증상</text>
<text x="570.0" y="193.3" font-size="11" fill="#6B7280" text-anchor="middle">180K 문서에서 100K 이후</text>
