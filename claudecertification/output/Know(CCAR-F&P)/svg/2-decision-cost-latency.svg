<text x="425.0" y="605.0" font-size="12" text-anchor="middle" fill="#1F2937">max_tokens가 큰 요청이 timeout</text>
<polyline points="565,592 595,592" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-decision-cost-latency)"/>
<rect x="595" y="570" width="325" height="44" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="757.5" y="596.5" font-size="12" text-anchor="middle" fill="#1F2937">streaming (stream: true, SSE)</text>
<polyline points="265,644 285,644" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-decision-cost-latency)"/>
<rect x="285" y="622" width="280" height="44" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="425.0" y="648.5" font-size="12" text-anchor="middle" fill="#1F2937">실시간 + 대규모 동시 사용</text>
<polyline points="565,644 595,644" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-decision-cost-latency)"/>
<rect x="595" y="622" width="325" height="44" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="757.5" y="648.5" font-size="12" text-anchor="middle" fill="#1F2937">streaming + RPM/ITPM/OTPM 용량 확보(상향 신청)</text>
