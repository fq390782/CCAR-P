<text x="757.5" y="722.5" font-size="12" text-anchor="middle" fill="#1F2937">앞단에 queue 배치 (retry는 여전히 필요)</text>
<polyline points="265,770 285,770" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-decision-cost-latency)"/>
<rect x="285" y="748" width="280" height="44" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="425.0" y="774.5" font-size="12" text-anchor="middle" fill="#1F2937">endpoint 지연 SLA보다 모델 처리가 김</text>
