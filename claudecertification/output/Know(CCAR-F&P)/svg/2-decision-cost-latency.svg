<polyline points="565,540 595,540" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-decision-cost-latency)"/>
<rect x="595" y="518" width="325" height="44" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="757.5" y="544.5" font-size="12" text-anchor="middle" fill="#1F2937">AsyncAnthropic 병렬 + Semaphore로 동시 수 제한</text>
