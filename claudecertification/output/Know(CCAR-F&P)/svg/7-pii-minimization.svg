<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-label="PII 최소화 dataflow">
<title>PII 최소화 dataflow</title>
<defs><marker id="arr-pii-minimization" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<g font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">
<text x="450" y="28" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">PII 보호: 모델에게 보여 주는 것과 접근할 수 있는 것을 둘 다 최소로</text><rect x="20" y="42" width="860" height="180" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/><text x="36" y="64" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="start">정답: data minimization + least privilege</text><rect x="40" y="82" width="150" height="60" rx="6" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/><text x="115.0" y="108.7" font-size="13" fill="#1F2937" text-anchor="middle">원본 기록</text><text x="115.0" y="124.8" font-size="11" fill="#1F2937" text-anchor="middle">이름 · 연락처 · 이력</text><polyline points="190,112 248,112" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-pii-minimization)"/><text x="219" y="104" font-size="11" fill="#1F2937" text-anchor="middle">필요 항목만</text><rect x="250" y="82" width="150" height="60" rx="6" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/><text x="325.0" y="107.3" font-size="13" fill="#1F2937" text-anchor="middle">작업에 필요한</text><text x="325.0" y="125.5" font-size="13" fill="#1F2937" text-anchor="middle">항목만 선택</text><polyline points="400,112 458,112" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-pii-minimization)"/><text x="429" y="104" font-size="11" fill="#1F2937" text-anchor="middle">식별자 치환</text><rect x="460" y="82" width="150" height="60" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/><text x="535.0" y="107.3" font-size="13" fill="#1F2937" text-anchor="middle">masking ·</text><text x="535.0" y="125.5" font-size="13" fill="#1F2937" text-anchor="middle">tokenization (임시 ID)</text><polyline points="610,112 668,112" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-pii-minimization)"/><text x="639" y="104" font-size="11" fill="#1F2937" text-anchor="middle">context로</text><rect x="670" y="82" width="190" height="60" rx="6" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/><text x="765.0" y="108.7" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Claude</text><text x="765.0" y="124.8" font-size="11" fill="#1F2937" text-anchor="middle">tool 접근 = 담당 대상만</text><polyline points="765,142 765,158" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-pii-minimization)"/><rect x="640" y="160" width="220" height="50" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/><text x="750.0" y="181.7" font-size="13" fill="#1F2937" text-anchor="middle">log · URL에 PII 없음</text><text x="750.0" y="197.8" font-size="11" fill="#1F2937" text-anchor="middle">audit log는 masking · 항목 한정</text><text x="40" y="190" font-size="13" font-weight="bold" fill="#2563EB" text-anchor="start">판단 기준: 유출되면 어디까지 퍼지는가 → 그 범위가 가장 작은 선택지</text><rect x="20" y="238" width="860" height="170" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/><text x="36" y="260" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="start">오답: 범위가 넓은 설계</text><rect x="40" y="278" width="200" height="54" rx="6" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/><text x="140.0" y="301.7" font-size="13" fill="#1F2937" text-anchor="middle">system prompt에</text><text x="140.0" y="317.8" font-size="11" fill="#1F2937" text-anchor="middle">모든 사용자 기록 상시</text><polyline points="240,305 318,305" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-pii-minimization)"/><text x="279" y="297" font-size="11" fill="#1F2937" text-anchor="middle">공격 · 실수</text><rect x="320" y="278" width="200" height="54" rx="6" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/><text x="420.0" y="301.7" font-size="13" fill="#1F2937" text-anchor="middle">injection 한 번</text><text x="420.0" y="317.8" font-size="11" fill="#1F2937" text-anchor="middle">또는 잘못된 출력 한 번</text><polyline points="520,305 598,305" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-pii-minimization)"/><text x="559" y="297" font-size="11" fill="#1F2937" text-anchor="middle">결과</text><rect x="600" y="278" width="260" height="54" rx="6" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/><text x="730.0" y="309.4" font-size="13" fill="#1F2937" text-anchor="middle">담당 밖 정보까지 유출</text><text x="40" y="360" font-size="12" fill="#1F2937" text-anchor="start">이름이 든 전문 audit log → 유출 경로가 늘어난다</text><text x="40" y="384" font-size="12" fill="#1F2937" text-anchor="start">TLS · 저장 시 암호화만 → 전송 · 보관만 지킨다. 출력이나 injection을 통한 유출은 못 막아 최소화를 대신하지 못한다</text>
</g>
</svg>
