<svg xmlns="http://www.w3.org/2000/svg" width="920" height="500" viewBox="0 0 920 500" role="img" aria-label="의존성 기반 실행: 독립은 병렬, 의존은 순차, 합류점은 fan-in" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">
<title>의존성 기반 실행: 독립은 병렬, 의존은 순차, 합류점은 fan-in</title>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<defs><marker id="arr-dependency-k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker><marker id="arr-dependency-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker><marker id="arr-dependency-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="arr-dependency-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/></marker></defs>
<text x="20" y="30" font-size="14" fill="#1F2937" text-anchor="start" font-weight="bold">의존성 기반 병렬 · 순차 — 독립은 병렬 · 의존은 순차 · 합류는 fan-in</text>
<rect x="20" y="50" width="440" height="230" rx="6" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="34" y="72" font-size="14" fill="#1F2937" text-anchor="start" font-weight="bold">독립 N개 → 합류 1개</text>
<rect x="30" y="130" width="120" height="60" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="90.0" y="157.1" font-size="13" fill="#1F2937" text-anchor="middle" font-weight="bold">Coordinator</text>
<text x="90.0" y="172.3" font-size="11" fill="#6B7280" text-anchor="middle">한 응답에 호출 N개</text>
<rect x="190" y="92" width="120" height="44" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="250.0" y="118.5" font-size="13" fill="#1F2937" text-anchor="middle">저장소 A 스캔</text>
<path d="M150,140 L190,114" fill="none" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arr-dependency-b)"/>
<path d="M310,114 L350,140" fill="none" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arr-dependency-b)"/>
<rect x="190" y="152" width="120" height="44" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="250.0" y="178.6" font-size="13" fill="#1F2937" text-anchor="middle">저장소 B 스캔</text>
<path d="M150,160 L190,174" fill="none" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arr-dependency-b)"/>
<path d="M310,174 L350,160" fill="none" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arr-dependency-b)"/>
<rect x="190" y="212" width="120" height="44" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="250.0" y="238.6" font-size="13" fill="#1F2937" text-anchor="middle">저장소 C 스캔</text>
<path d="M150,180 L190,234" fill="none" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arr-dependency-b)"/>
<path d="M310,234 L350,180" fill="none" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arr-dependency-b)"/>
<rect x="62.4" y="108.0" width="55.3" height="16" fill="#FFFFFF"/>
<text x="90" y="119.0" font-size="11" fill="#2563EB" text-anchor="middle">병렬 기동</text>
<rect x="350" y="130" width="100" height="60" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
<text x="400.0" y="157.1" font-size="13" fill="#1F2937" text-anchor="middle" font-weight="bold">통합 보고서</text>
<text x="400.0" y="172.3" font-size="11" fill="#6B7280" text-anchor="middle">fan-in</text>
<text x="240" y="268" font-size="11" fill="#6B7280" text-anchor="middle">선행 완료 신호를 확인한 뒤 fan-in 실행</text>
<rect x="480" y="50" width="420" height="230" rx="6" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="494" y="72" font-size="14" fill="#1F2937" text-anchor="start" font-weight="bold">선행 1개 → 병렬 2개 → 합류</text>
<rect x="492" y="135" width="70" height="50" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="527.0" y="164.6" font-size="13" fill="#1F2937" text-anchor="middle" font-weight="bold">빌드</text>
<rect x="612" y="92" width="100" height="44" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="662.0" y="118.5" font-size="13" fill="#1F2937" text-anchor="middle">테스트</text>
<rect x="612" y="184" width="100" height="44" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="662.0" y="210.6" font-size="13" fill="#1F2937" text-anchor="middle">스캔</text>
<rect x="762" y="135" width="130" height="50" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
<text x="827.0" y="164.6" font-size="13" fill="#1F2937" text-anchor="middle" font-weight="bold">배포</text>
<path d="M562,160 L612,114" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-dependency-k)"/>
<path d="M562,160 L612,206" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-dependency-k)"/>
<path d="M712,114 L762,160" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-dependency-k)"/>
<path d="M712,206 L762,160" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-dependency-k)"/>
<text x="690" y="268" font-size="11" fill="#6B7280" text-anchor="middle">빌드 완료 후 테스트 ∥ 스캔은 동시에 · 배포는 둘 다 끝난 뒤</text>
<rect x="20" y="300" width="540" height="180" rx="6" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="34" y="322" font-size="14" fill="#1F2937" text-anchor="start" font-weight="bold">독립 작업 3개의 소요 시간</text>
<text x="40" y="364" font-size="13" fill="#1F2937" text-anchor="start">순차</text>
<rect x="90" y="352" width="100" height="18" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="140.0" y="365" font-size="11" fill="#6B7280" text-anchor="middle">A</text>
<rect x="190" y="352" width="70" height="18" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="225.0" y="365" font-size="11" fill="#6B7280" text-anchor="middle">B</text>
<rect x="260" y="352" width="120" height="18" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="320.0" y="365" font-size="11" fill="#6B7280" text-anchor="middle">C</text>
<text x="392" y="366" font-size="13" fill="#1F2937" text-anchor="start" font-weight="bold">소요 = 합계</text>
<text x="40" y="414" font-size="13" fill="#1F2937" text-anchor="start">병렬</text>
<rect x="90" y="392" width="100" height="18" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="140.0" y="405" font-size="11" fill="#6B7280" text-anchor="middle">A</text>
<rect x="90" y="414" width="70" height="18" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="125.0" y="427" font-size="11" fill="#6B7280" text-anchor="middle">B</text>
<rect x="90" y="436" width="120" height="18" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="150.0" y="449" font-size="11" fill="#6B7280" text-anchor="middle">C</text>
<path d="M210,386 L210,458" fill="none" stroke="#2563EB" stroke-width="1.5"/>
<text x="222" y="424" font-size="13" fill="#1F2937" text-anchor="start" font-weight="bold">소요 = 최댓값 (가장 긴 작업)</text>
<rect x="590" y="300" width="310" height="84" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="745.0" y="331.6" font-size="13" fill="#1F2937" text-anchor="middle" font-weight="bold">의존 무시 병렬 = 결함</text>
<text x="745.0" y="346.9" font-size="11" fill="#6B7280" text-anchor="middle">선행 결과가 필요한 작업을 전부 동시 위임</text>
<text x="745.0" y="361.9" font-size="11" fill="#6B7280" text-anchor="middle">→ 최적화 ✗ · 안전 위반 가능</text>
<rect x="590" y="396" width="310" height="84" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="745.0" y="427.6" font-size="13" fill="#1F2937" text-anchor="middle" font-weight="bold">자원 공유 작업 → 병렬 ✗</text>
<text x="745.0" y="442.9" font-size="11" fill="#6B7280" text-anchor="middle">독립성 붕괴 (예: 장비 1대 공유)</text>
<text x="745.0" y="457.9" font-size="11" fill="#6B7280" text-anchor="middle">→ 병렬로 돌리면 안 됨</text>
</svg>
