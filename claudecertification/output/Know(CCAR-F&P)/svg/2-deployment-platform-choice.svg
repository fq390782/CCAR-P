<text x="450.0" y="502.4" font-size="11" font-weight="normal" fill="#1F2937" text-anchor="middle">기본 구성 직접 API → 거주 · 감사 불충족</text>
<text x="450.0" y="517.4" font-size="11" font-weight="normal" fill="#1F2937" text-anchor="middle">오픈 웨이트 자체 호스팅 → 보안 · 패치 · 감사 부담</text>
