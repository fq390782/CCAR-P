<text x="740.0" y="495.6" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="middle">싼 리전 · 최저 지연 리전 · 암호화</text>
<text x="740.0" y="510.9" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="middle">→ 데이터가 경계 너머로 이동</text>
