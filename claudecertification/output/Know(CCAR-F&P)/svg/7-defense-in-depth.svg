<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-label="Guardrail 다층 방어">
<title>Guardrail 다층 방어</title>
<defs><marker id="arr-defense-in-depth" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<g font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">
<text x="480" y="28" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">Guardrail 다층 방어: 입력 · 지시 · 출력 · 운영 단계마다 층을 겹친다</text><text x="495" y="58" font-size="12" font-weight="bold" fill="#2563EB" text-anchor="middle">사전에 막는 층 (응답 전달 전)</text><polyline points="160,74 160,66 830,66 830,74" fill="none" stroke="#2563EB" stroke-width="1.5"/><rect x="20" y="110" width="100" height="50" rx="6" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/><text x="70.0" y="139.4" font-size="13" fill="#1F2937" text-anchor="middle">사용자 입력</text><polyline points="120,135 158,135" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-defense-in-depth)"/><text x="139" y="127" font-size="11" fill="#1F2937" text-anchor="middle">입력</text><rect x="160" y="85" width="170" height="100" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/><text x="245.0" y="115.6" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">① 입력</text><text x="245.0" y="132.7" font-size="12" fill="#1F2937" text-anchor="middle">harmlessness screen</text><text x="245.0" y="148.5" font-size="11" fill="#1F2937" text-anchor="middle">(경량 Haiku 계열)</text><text x="245.0" y="163.9" font-size="11" fill="#1F2937" text-anchor="middle">알려진 공격 패턴 검증</text><polyline points="330,135 368,135" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-defense-in-depth)"/><text x="349" y="127" font-size="11" fill="#1F2937" text-anchor="middle">통과</text><rect x="370" y="85" width="160" height="100" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/><text x="450.0" y="115.6" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">② 지시</text><text x="450.0" y="132.7" font-size="12" fill="#1F2937" text-anchor="middle">system prompt:</text><text x="450.0" y="148.5" font-size="11" fill="#1F2937" text-anchor="middle">경계와 거절 방식</text><text x="450.0" y="163.9" font-size="11" fill="#1F2937" text-anchor="middle">명시</text><polyline points="530,135 568,135" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-defense-in-depth)"/><text x="549" y="127" font-size="11" fill="#1F2937" text-anchor="middle">prompt</text><rect x="570" y="110" width="90" height="50" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/><text x="615.0" y="139.4" font-size="13" fill="#1F2937" text-anchor="middle">Claude</text><polyline points="660,135 698,135" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-defense-in-depth)"/><text x="679" y="127" font-size="11" fill="#1F2937" text-anchor="middle">출력</text><rect x="700" y="85" width="130" height="100" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/><text x="765.0" y="131.0" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">③ 출력</text><text x="765.0" y="148.1" font-size="12" fill="#1F2937" text-anchor="middle">output filter</text><polyline points="830,135 868,135" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-defense-in-depth)"/><text x="849" y="127" font-size="11" fill="#1F2937" text-anchor="middle">전달</text><rect x="870" y="110" width="70" height="50" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/><text x="905.0" y="139.4" font-size="13" fill="#1F2937" text-anchor="middle">응답</text><polyline points="245,185 245,246" fill="none" stroke="#1F2937" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr-defense-in-depth)"/><polyline points="450,185 450,246" fill="none" stroke="#1F2937" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr-defense-in-depth)"/><polyline points="615,160 615,246" fill="none" stroke="#1F2937" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr-defense-in-depth)"/><polyline points="765,185 765,246" fill="none" stroke="#1F2937" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr-defense-in-depth)"/><text x="255" y="222" font-size="11" fill="#1F2937" text-anchor="start">관찰</text><rect x="160" y="248" width="780" height="50" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/><text x="550.0" y="277.4" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">④ 운영 (사후에 탐지하는 층): 지속적 monitoring · 반복 위반자 대응</text><line x1="40" y1="318" x2="80" y2="318" stroke="#1F2937" stroke-width="1.5" stroke-dasharray="5 4"/><text x="88" y="322" font-size="11" fill="#6B7280" text-anchor="start">점선 = 비동기 관찰(log · monitoring)</text><rect x="20" y="338" width="450" height="66" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/><text x="245.0" y="367.7" font-size="13" fill="#1F2937" text-anchor="middle">오답: 층 하나만 (입력 screen만, 출시 전 red teaming만)</text><text x="245.0" y="383.8" font-size="11" fill="#1F2937" text-anchor="middle">빠져나간 공격과 가동 후 새 수법을 잡을 층이 없음</text><rect x="490" y="338" width="450" height="66" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/><text x="715.0" y="367.7" font-size="13" fill="#1F2937" text-anchor="middle">prompt 강화 · 출력 검사도 혼자서는 probabilistic</text><text x="715.0" y="383.8" font-size="11" fill="#1F2937" text-anchor="middle">한 층으로서만 가치 · 규제 업종은 사전 + 사후 층 둘 다 확인</text>
</g>
</svg>
