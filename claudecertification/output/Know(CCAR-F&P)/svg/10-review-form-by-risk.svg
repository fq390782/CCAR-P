<svg xmlns="http://www.w3.org/2000/svg" width="900" height="580" viewBox="0 0 900 580" role="img" aria-label="되돌림 가능성과 결과 중대성으로 pre-action 승인과 post-action 표본 검토를 고르는 decision tree">
<title>되돌림 가능성과 결과 중대성으로 pre-action 승인과 post-action 표본 검토를 고르는 decision tree</title>
<defs><marker id="arr-review-form-by-risk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<g font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">
<text x="450" y="28" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">검토 형태: 되돌림 가능성 · 결과 중대성 · 물량으로 pre-action과 post-action을 가름</text>
<polygon points="450,54 630,104 450,154 270,104" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
<text x="450" y="100" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">되돌릴 수 있고</text>
<text x="450" y="116.9" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">롤백이 작동하는가?</text>
<polyline points="630,104 690,104" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-review-form-by-risk)"/>
<text x="660" y="96" font-size="11" fill="#1F2937" text-anchor="middle">아니오</text>
<rect x="690" y="52" width="190" height="104" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="785" y="94.1" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">pre-action 승인</text>
<text x="785" y="109" font-size="11" fill="#1F2937" text-anchor="middle">규제 대상 · 되돌림 불가</text>
<text x="785" y="123.3" font-size="11" fill="#1F2937" text-anchor="middle">롤백이 작동 안 하는 등급</text>
<polyline points="450,154 450,192" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-review-form-by-risk)"/>
<text x="458" y="176" font-size="11" fill="#1F2937" text-anchor="start">예</text>
<polygon points="450,192 630,244 450,296 270,244" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
<text x="450" y="241.3" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">결과가 중대한가?</text>
<text x="450" y="256.2" font-size="11" fill="#1F2937" text-anchor="middle">법적 책임 · 법적 리스크</text>
<polyline points="630,244 690,244" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-review-form-by-risk)"/>
<text x="660" y="236" font-size="11" fill="#1F2937" text-anchor="middle">예</text>
<rect x="690" y="186" width="190" height="118" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="785" y="220.8" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">pre-action 승인</text>
<text x="785" y="235.7" font-size="11" fill="#1F2937" text-anchor="middle">해당 등급만 · 전체 컨텍스트를</text>
<text x="785" y="250" font-size="11" fill="#1F2937" text-anchor="middle">갖춘 사람</text>
<text x="785" y="264.3" font-size="11" fill="#1F2937" text-anchor="middle">예: 계약서 초안 30건/일 →</text>
<text x="785" y="278.6" font-size="11" fill="#1F2937" text-anchor="middle">변호사가 전달 전 검토</text>
<polyline points="270,244 222,244" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-review-form-by-risk)"/>
<text x="246" y="236" font-size="11" fill="#1F2937" text-anchor="middle">혼재</text>
<rect x="20" y="190" width="202" height="108" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="121" y="227" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">일부 건만 법적 리스크</text>
<text x="121" y="241.9" font-size="11" fill="#1F2937" text-anchor="middle">예: 200건 중 1건</text>
<text x="121" y="256.2" font-size="11" fill="#1F2937" text-anchor="middle">등급 분리: 되돌림 가능 등급은</text>
<text x="121" y="270.5" font-size="11" fill="#1F2937" text-anchor="middle">post-action 표본 + 테스트한 롤백</text>
<polyline points="450,296 450,340" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-review-form-by-risk)"/>
<text x="458" y="322" font-size="11" fill="#1F2937" text-anchor="start">아니오</text>
<rect x="270" y="342" width="360" height="100" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
<text x="450" y="375" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">post-action 표본 검토 + audit logging</text>
<text x="450" y="389.9" font-size="11" fill="#1F2937" text-anchor="middle">탐지 후 수정 &gt; 전량 gate</text>
<text x="450" y="404.2" font-size="11" fill="#1F2937" text-anchor="middle">예: 내부 업데이트 2,000건/일 · 블로그 글 · 소셜 게시물</text>
<text x="450" y="418.5" font-size="11" fill="#1F2937" text-anchor="middle">전제: 롤백을 정기 테스트</text>
<text x="20" y="494" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">오답: 위험과 물량을 무시한 검토 형태</text>
<rect x="20" y="506" width="280" height="60" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="160" y="532.9" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">모든 건에 pre-action 승인</text>
<text x="160" y="547.5" font-size="11" fill="#1F2937" text-anchor="middle">대량에서 형식적 도장 (게이트가 연극)</text>
<rect x="310" y="506" width="280" height="60" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="450" y="525.1" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">저위험 · 되돌림 가능 건에 CEO · 이사회 ·</text>
<text x="450" y="540.7" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">법무 gate</text>
<text x="450" y="555.3" font-size="11" fill="#1F2937" text-anchor="middle">과잉 gate</text>
<rect x="600" y="506" width="280" height="60" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="740" y="532.9" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">법적 책임 계약서를 사후 샘플링</text>
<text x="740" y="547.5" font-size="11" fill="#1F2937" text-anchor="middle">결과 중대 → pre-action 필요</text>
</g>
</svg>
