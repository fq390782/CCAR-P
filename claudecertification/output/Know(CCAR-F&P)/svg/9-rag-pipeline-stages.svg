<svg xmlns="http://www.w3.org/2000/svg" width="900" height="530" viewBox="0 0 900 530" role="img" aria-label="RAG 파이프라인: 구축 5단계, 질의 4단계, 출고 전 검증 단계">
<title>RAG 파이프라인: 구축 5단계, 질의 4단계, 출고 전 검증 단계</title>
<defs><marker id="arr-rag-pipeline-stages" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<g font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">
<text x="450" y="28" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">구축 5단계 → 질의 4단계 → 검증: grounding · citation 검사는 generation 이후</text>
<rect x="14" y="44" width="872" height="116" rx="6" fill="none" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="28" y="66" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="start">구축 단계</text>
<rect x="24" y="78" width="148" height="64" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="98" y="106.9" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">1 ingestion</text>
<text x="98" y="122.2" font-size="11" fill="#1F2937" text-anchor="middle">문서 변경 시 재수집</text>
<rect x="200" y="78" width="148" height="64" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="274" y="106.9" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">2 parsing</text>
<text x="274" y="122.2" font-size="11" fill="#1F2937" text-anchor="middle">모니터링할 실패 지점</text>
<rect x="376" y="78" width="148" height="64" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="450" y="106.9" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">3 chunking</text>
<text x="450" y="122.2" font-size="11" fill="#1F2937" text-anchor="middle">구조 · 질의 단위 경계</text>
<rect x="552" y="78" width="148" height="64" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="626" y="106.9" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">4 metadata</text>
<text x="626" y="122.2" font-size="11" fill="#1F2937" text-anchor="middle">필터링 · 인용 귀속</text>
<rect x="728" y="78" width="148" height="64" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="802" y="106.9" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">5 indexing</text>
<text x="802" y="122.2" font-size="11" fill="#1F2937" text-anchor="middle">인덱스 손상 점검</text>
<polyline points="172,110 200,110" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-rag-pipeline-stages)"/>
<polyline points="348,110 376,110" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-rag-pipeline-stages)"/>
<polyline points="524,110 552,110" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-rag-pipeline-stages)"/>
<polyline points="700,110 728,110" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-rag-pipeline-stages)"/>
<polyline points="802,142 802,180 150,180 150,228" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-rag-pipeline-stages)"/>
<text x="476" y="174" font-size="11" fill="#1F2937" text-anchor="middle">구축 완료 → 질의</text>
<rect x="14" y="196" width="872" height="110" rx="6" fill="none" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="28" y="218" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="start">질의 단계</text>
<rect x="24" y="228" width="148" height="64" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="98" y="256.9" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">6 retrieval</text>
<text x="98" y="272.2" font-size="11" fill="#1F2937" text-anchor="middle">질의 형태별 검색 방식</text>
<rect x="200" y="228" width="148" height="64" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="274" y="256.9" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">7 rerank</text>
<text x="274" y="272.2" font-size="11" fill="#1F2937" text-anchor="middle">쿼리 관련도순 재정렬</text>
<rect x="376" y="228" width="148" height="64" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="450" y="256.9" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">8 assembly</text>
<text x="450" y="272.2" font-size="11" fill="#1F2937" text-anchor="middle">상위 passage 전달</text>
<rect x="552" y="228" width="148" height="64" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="626" y="256.9" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">9 generation</text>
<text x="626" y="272.2" font-size="11" fill="#1F2937" text-anchor="middle">답변 생성</text>
<polyline points="172,260 200,260" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-rag-pipeline-stages)"/>
<polyline points="348,260 376,260" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-rag-pipeline-stages)"/>
<polyline points="524,260 552,260" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-rag-pipeline-stages)"/>
<polyline points="626,292 626,326 450,326 450,366" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-rag-pipeline-stages)"/>
<text x="540" y="320" font-size="11" fill="#1F2937" text-anchor="middle">답변 초안</text>
<rect x="14" y="340" width="872" height="150" rx="6" fill="none" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="28" y="362" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="start">검증 단계 (generation 이후 · 출고 전)</text>
<polygon points="450,366 620,418 450,470 280,418" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
<text x="450" y="407.4" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">10 grounding · citation 검사</text>
<text x="450" y="422.7" font-size="11" fill="#1F2937" text-anchor="middle">주장 ↔ source chunk 대조</text>
<text x="450" y="437.7" font-size="11" fill="#1F2937" text-anchor="middle">인용 구간이 주장을 함의?</text>
<polyline points="280,418 200,418" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-rag-pipeline-stages)"/>
<text x="240" y="412" font-size="11" fill="#1F2937" text-anchor="middle">실패</text>
<rect x="40" y="394" width="160" height="48" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="120" y="414.9" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">수정 단계</text>
<text x="120" y="430.2" font-size="11" fill="#1F2937" text-anchor="middle">출고 대신 전송</text>
<polyline points="620,418 700,418" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-rag-pipeline-stages)"/>
<text x="660" y="412" font-size="11" fill="#1F2937" text-anchor="middle">통과</text>
<rect x="700" y="394" width="160" height="48" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
<text x="780" y="422.4" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">답변 출고</text>
<text x="450" y="514" font-size="11" fill="#6B7280" text-anchor="middle">구축 단계(ingestion · chunking · indexing) ≠ 검증 단계 · retrieval 바로 다음 = rerank</text>
</g>
</svg>
