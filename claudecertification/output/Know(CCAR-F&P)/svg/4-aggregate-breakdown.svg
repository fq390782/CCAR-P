<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img" aria-label="집계 점수 하나를 카테고리별 precision/recall로 분해해 문제 범위만 분리하고 양호한 부분은 유지한다." font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">
<title>집계 점수 분해</title>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<defs><marker id="arr-aggregate-breakdown" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker></defs>
<text x="20" y="30" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="start">집계 점수 분해: 문제 범위만 분리하고 양호한 부분의 가치는 유지</text>
<rect x="20" y="56" width="190" height="164" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="115.0" y="114.5" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">집계 하나</text>
<text x="115.0" y="129.3" font-size="11" fill="#6B7280" text-anchor="middle">전체 정확도 97.4%</text>
<text x="115.0" y="143.3" font-size="11" fill="#6B7280" text-anchor="middle">전체 수용률</text>
<text x="115.0" y="157.3" font-size="11" fill="#6B7280" text-anchor="middle">편향 · 집중된 오류를</text>
<text x="115.0" y="171.3" font-size="11" fill="#6B7280" text-anchor="middle">평균이 가림</text>
<path d="M210,98 L340,98" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-aggregate-breakdown)"/>
<rect x="227.2" y="78" width="95.6" height="17" fill="#FFFFFF"/>
<text x="275" y="90" font-size="12" fill="#1F2937" text-anchor="middle">카테고리별 측정</text>
<path d="M210,178 L340,178" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-aggregate-breakdown)"/>
<rect x="220.0" y="158" width="110.1" height="17" fill="#FFFFFF"/>
<text x="275" y="170" font-size="11" fill="#1F2937" text-anchor="middle">precision/recall</text>
<rect x="340" y="56" width="230" height="80" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
<text x="455.0" y="93.5" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">보안 지적</text>
<text x="455.0" y="108.3" font-size="11" fill="#6B7280" text-anchor="middle">수용됨 · 양호</text>
<rect x="340" y="140" width="230" height="80" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="455.0" y="170.6" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">style 지적</text>
<text x="455.0" y="185.3" font-size="11" fill="#6B7280" text-anchor="middle">기각 · 오탐 연발</text>
<text x="455.0" y="199.3" font-size="11" fill="#6B7280" text-anchor="middle">→ 보고서 전체 무시</text>
<path d="M570,98 L640,98" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-aggregate-breakdown)"/>
<rect x="589.0" y="78" width="32.0" height="17" fill="#FFFFFF"/>
<text x="605" y="90" font-size="12" fill="#1F2937" text-anchor="middle">유지</text>
<path d="M570,180 L640,180" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-aggregate-breakdown)"/>
<rect x="577.4" y="160" width="55.3" height="17" fill="#FFFFFF"/>
<text x="605" y="172" font-size="11" fill="#1F2937" text-anchor="middle">일시 제외</text>
<rect x="640" y="56" width="240" height="80" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="760.0" y="93.5" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">그대로 유지</text>
<text x="760.0" y="108.3" font-size="11" fill="#6B7280" text-anchor="middle">양호한 부분의 가치 보존</text>
<rect x="640" y="140" width="240" height="80" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="760.0" y="170.6" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">그 카테고리만 제외 후 재구축</text>
<text x="760.0" y="185.3" font-size="11" fill="#6B7280" text-anchor="middle">정의 · 실례 · precision/recall eval</text>
<text x="760.0" y="199.3" font-size="11" fill="#6B7280" text-anchor="middle">또는 실례 기반 기준 축소 · 비활성화</text>
<text x="20" y="254" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">오답: 범위를 좁히지 못하는 수정</text>
<rect x="20" y="264" width="270" height="60" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="155.0" y="291.6" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">품질 gate 전체 중지</text>
<text x="155.0" y="306.4" font-size="11" fill="#6B7280" text-anchor="middle">양호한 시그널까지 손실</text>
<rect x="315" y="264" width="270" height="60" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="450.0" y="291.6" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">전 카테고리 임계값 일괄 상향</text>
<text x="450.0" y="306.4" font-size="11" fill="#6B7280" text-anchor="middle">양호한 카테고리까지 영향</text>
<rect x="610" y="264" width="270" height="60" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="745.0" y="291.6" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">전체 수용률만 추적</text>
<text x="745.0" y="306.4" font-size="11" fill="#6B7280" text-anchor="middle">편향을 평균으로 가림</text>
<rect x="20" y="346" width="860" height="76" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="450.0" y="373.9" font-size="11" fill="#6B7280" text-anchor="middle">전체 정확도 97.4%로 사람 review를 줄이려면: 세그먼트별 목표 정확도를 먼저 정함</text>
<text x="450.0" y="387.9" font-size="11" fill="#6B7280" text-anchor="middle">문서 종류 · 필드별 정확도를 신뢰할 건수로 측정 → 검증 세트 확대</text>
<text x="450.0" y="401.9" font-size="11" fill="#6B7280" text-anchor="middle">채용 순위 공정성 = 하위 집단별 측정 (집계 ✗)</text>
</svg>
