<svg xmlns="http://www.w3.org/2000/svg" width="920" height="500" viewBox="0 0 920 500" role="img" aria-label="구조화 출력과 stop_reason 확인, 검증 후 재시도 흐름" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">
<title>구조화 출력과 stop_reason 확인, 검증 후 재시도 흐름</title>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<defs><marker id="arr-structured-output-check" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker></defs>
<text x="460" y="28" font-size="14" text-anchor="middle" fill="#1F2937" font-weight="bold">스키마로 출력을 제약해도 stop_reason 확인과 검증은 남는다</text>
<rect x="20" y="60" width="230" height="70" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="135.0" y="82.5" font-size="13" text-anchor="middle" fill="#1F2937">스키마 지정</text>
<text x="135.0" y="99.5" font-size="11" text-anchor="middle" fill="#6B7280">본문: output_config.format</text>
<text x="135.0" y="116.5" font-size="11" text-anchor="middle" fill="#6B7280">tool 입력: strict: true</text>
<rect x="300" y="60" width="170" height="70" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="385.0" y="91.0" font-size="13" text-anchor="middle" fill="#1F2937">Claude</text>
<text x="385.0" y="108.0" font-size="11" text-anchor="middle" fill="#6B7280">constrained decoding</text>
<polyline points="250,95 300,95" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-structured-output-check)"/>
<polygon points="600,45.0 690.0,95 600,145.0 510.0,95" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
<text x="600" y="99.5" font-size="13" text-anchor="middle" fill="#1F2937">stop_reason?</text>
<polyline points="470,95 510,95" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-structured-output-check)"/>
<rect x="780" y="60" width="130" height="70" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="845.0" y="91.0" font-size="12" text-anchor="middle" fill="#1F2937">스키마 불일치</text>
<text x="845.0" y="108.0" font-size="12" text-anchor="middle" fill="#1F2937">가능 → 저장 금지</text>
<polyline points="690,95 780,95" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-structured-output-check)"/>
<rect x="699.3" y="52.0" width="71.5" height="32" fill="#FFFFFF"/>
<text x="735" y="65.5" font-size="11" text-anchor="middle" fill="#6B7280">refusal</text>
<text x="735" y="79.5" font-size="11" text-anchor="middle" fill="#6B7280">max_tokens</text>
<polyline points="600,145 600,190" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-structured-output-check)"/>
<rect x="612.1" y="159.0" width="55.8" height="18" fill="#FFFFFF"/>
<text x="640" y="172.5" font-size="11" text-anchor="middle" fill="#6B7280">정상 종료</text>
<polygon points="600,190.0 710.0,245 600,300.0 490.0,245" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
<text x="600" y="241.0" font-size="13" text-anchor="middle" fill="#1F2937">검증 통과?</text>
<text x="600" y="258.0" font-size="11" text-anchor="middle" fill="#6B7280">출력 = 신뢰할 수 없는 입력</text>
<rect x="720" y="320" width="180" height="50" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
<text x="810.0" y="349.5" font-size="13" text-anchor="middle" fill="#1F2937">DB 레코드로 저장</text>
<polyline points="600,300 600,345 720,345" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-structured-output-check)"/>
<rect x="630.5" y="336.0" width="19.0" height="18" fill="#FFFFFF"/>
<text x="640" y="349.5" font-size="11" text-anchor="middle" fill="#6B7280">예</text>
<rect x="290" y="220" width="160" height="50" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="370.0" y="241.0" font-size="12" text-anchor="middle" fill="#1F2937">오류 내용을 함께</text>
<text x="370.0" y="258.0" font-size="12" text-anchor="middle" fill="#1F2937">넘겨 다시 시도</text>
<polyline points="490,245 450,245" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-structured-output-check)"/>
<rect x="449.5" y="221.0" width="41.0" height="18" fill="#FFFFFF"/>
<text x="470" y="234.5" font-size="11" text-anchor="middle" fill="#6B7280">아니오</text>
<polyline points="370,220 370,130" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-structured-output-check)"/>
<rect x="20" y="400" width="400" height="80" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="220.0" y="427.5" font-size="13" text-anchor="middle" fill="#1F2937">형식을 보장하지 못함</text>
<text x="220.0" y="444.5" font-size="11" text-anchor="middle" fill="#6B7280">지시문 대문자 강조 · temperature 0 · 정규식 후처리</text>
<text x="220.0" y="461.5" font-size="11" text-anchor="middle" fill="#6B7280">max_tokens 줄이기 → 오히려 JSON이 중간에 잘림</text>
<rect x="470" y="400" width="430" height="80" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="685.0" y="436.0" font-size="13" text-anchor="middle" fill="#1F2937">검증 실패를 조용히 건너뛰기</text>
<text x="685.0" y="453.0" font-size="13" text-anchor="middle" fill="#1F2937">→ 데이터가 사라짐</text>
<text x="460" y="385" font-size="13" text-anchor="middle" fill="#DC2626" font-weight="bold">안티패턴</text>
</svg>
