<text x="658.5" y="401.0" font-size="12" text-anchor="middle" fill="#1F2937">→ 오류 없이 캐시 안 됨 (cache 토큰 0)</text>
<text x="470" y="450" font-size="11" text-anchor="middle" fill="#6B7280">확인: usage.cache_creation_input_tokens(write) / cache_read_input_tokens(read) · 캐시된 prefix도 매번 보내고 window를 그대로 차지</text>
