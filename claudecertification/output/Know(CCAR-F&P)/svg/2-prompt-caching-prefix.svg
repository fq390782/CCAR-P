<svg xmlns="http://www.w3.org/2000/svg" width="940" height="470" viewBox="0 0 940 470" role="img" aria-label="prompt caching prefix 배치와 cache hit/miss" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">
<title>prompt caching prefix 배치와 cache hit/miss</title>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<defs><marker id="arr-prompt-caching-prefix" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker></defs>
<text x="470" y="28" font-size="14" text-anchor="middle" fill="#1F2937" font-weight="bold">캐시는 prefix 일치: tools → system → messages 순서로 breakpoint까지 이전 요청과 완전히 같아야 hit</text>
