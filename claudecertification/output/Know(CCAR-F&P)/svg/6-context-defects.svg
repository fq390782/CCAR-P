<text x="230.0" y="413.6" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="middle">duplication에 chunk 추가 → 반복 배가</text>
<text x="230.0" y="430.6" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="middle">exhaustion에 턴별 요약 → drift · 비용 누적</text>
<text x="230.0" y="447.6" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="middle">감사관이 전체 대화 요구 → growth 아님 → 별도 보관 필요</text>
