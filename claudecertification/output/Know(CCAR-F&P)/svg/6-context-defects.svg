<text x="670.0" y="387.9" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">진단 규칙: 증거가 명시된 결함만 선택</text>
<text x="670.0" y="405.1" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="middle">overflow · 오류 언급 없으면 exhaustion 제외</text>
<text x="670.0" y="422.1" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="middle">turn 소실 언급 없으면 loss 제외</text>
<text x="670.0" y="439.1" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="middle">조합: 대량 로드 + 엉뚱한 답 → growth + dilution</text>
<text x="670.0" y="456.1" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="middle">조합: 대량 로드 + 반복 삽입 → growth + duplication</text>
