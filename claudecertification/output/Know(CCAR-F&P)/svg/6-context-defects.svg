<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-label="Context 결함 5종: 증거 문구에서 결함 이름과 처방으로 1:1 대응" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">
<title>Context 결함 5종: 증거 문구에서 결함 이름과 처방으로 1:1 대응</title>
