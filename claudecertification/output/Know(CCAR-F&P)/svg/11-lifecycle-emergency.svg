<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-label="discovery design handoff monitoring iteration 순서와 프로덕션 실패 시 discovery나 design으로 복귀하는 경로, 장애 시 hotfix를 먼저 배포하는 긴급 경로">
<title>lifecycle 단계 순서, 실패 시 건너뛴 단계로 복귀, 장애 시 hotfix 긴급 경로</title>
