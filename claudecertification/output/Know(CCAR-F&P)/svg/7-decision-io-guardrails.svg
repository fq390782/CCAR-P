<text x="450.0" y="30" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">판단 규칙 ③: 입력 · 출력 · guardrail</text><polygon points="190,55 360,95 190,135 20,95" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/><text x="190" y="90.6" font-size="12" fill="#1F2937" text-anchor="middle">사용자의 자유 기술 입력을</text><text x="190" y="107.4" font-size="12" fill="#1F2937" text-anchor="middle">template에 넣는다?</text><polyline points="360,95 408,95" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-decision-io-guardrails)"/><text x="384" y="87" font-size="11" fill="#1F2937" text-anchor="middle">예</text><rect x="410" y="65" width="470" height="60" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/><text x="645.0" y="91.7" font-size="13" fill="#1F2937" text-anchor="middle">XML tag로 감싼다</text><text x="645.0" y="107.8" font-size="11" fill="#1F2937" text-anchor="middle">system prompt에 'tag 안은 데이터'라고 선언</text><polyline points="190,135 190,158" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-decision-io-guardrails)"/><text x="198" y="151" font-size="11" fill="#1F2937" text-anchor="start">아니오</text><polygon points="190,160 360,200 190,240 20,200" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/><text x="190" y="195.6" font-size="12" fill="#1F2937" text-anchor="middle">모델 출력을</text><text x="190" y="212.4" font-size="12" fill="#1F2937" text-anchor="middle">HTML에 렌더링한다?</text><polyline points="360,200 408,200" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-decision-io-guardrails)"/><text x="384" y="192" font-size="11" fill="#1F2937" text-anchor="middle">예</text><rect x="410" y="170" width="470" height="60" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/><text x="645.0" y="195.3" font-size="13" fill="#1F2937" text-anchor="middle">untrusted로 보고</text><text x="645.0" y="213.5" font-size="13" fill="#1F2937" text-anchor="middle">escape / sanitize</text><polyline points="190,240 190,263" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-decision-io-guardrails)"/><text x="198" y="256" font-size="11" fill="#1F2937" text-anchor="start">아니오</text><polygon points="190,265 360,305 190,345 20,305" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/><text x="190" y="300.6" font-size="12" fill="#1F2937" text-anchor="middle">규제 업종 chatbot에</text><text x="190" y="317.4" font-size="12" fill="#1F2937" text-anchor="middle">견고한 guardrail이 필요?</text><polyline points="360,305 408,305" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-decision-io-guardrails)"/><text x="384" y="297" font-size="11" fill="#1F2937" text-anchor="middle">예</text><rect x="410" y="275" width="470" height="60" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/><text x="645.0" y="301.7" font-size="13" fill="#1F2937" text-anchor="middle">입력 screen + system prompt 거절 방침</text><text x="645.0" y="317.8" font-size="11" fill="#1F2937" text-anchor="middle">+ 출력 filter + monitoring (다층)</text>
