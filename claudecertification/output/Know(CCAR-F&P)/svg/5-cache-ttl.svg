<svg xmlns="http://www.w3.org/2000/svg" width="880" height="330" viewBox="0 0 880 330" role="img" aria-label="몇 분짜리 burst 뒤 오래 쉬는 패턴에는 5분 ephemeral cache">
<title>몇 분짜리 burst 뒤 오래 쉬는 패턴에는 5분 ephemeral cache</title>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<defs><marker id="arr-cache-ttl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker><marker id="arr-cache-ttl-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker></defs>
<g font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">
<text x="440" y="30" font-size="14" text-anchor="middle" fill="#1F2937" font-weight="bold">몇 분짜리 burst 뒤 오래 쉬는 패턴에는 5분 ephemeral cache</text>
<text x="30" y="82" font-size="13" text-anchor="start" fill="#1F2937" font-weight="bold">요청</text>
<polyline points="150,64 150,88" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-cache-ttl)"/>
<polyline points="166,64 166,88" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-cache-ttl)"/>
<polyline points="182,64 182,88" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-cache-ttl)"/>
<polyline points="198,64 198,88" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-cache-ttl)"/>
<polyline points="214,64 214,88" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-cache-ttl)"/>
<polyline points="230,64 230,88" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-cache-ttl)"/>
<polyline points="246,64 246,88" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-cache-ttl)"/>
<polyline points="262,64 262,88" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-cache-ttl)"/>
<line x1="140" y1="100" x2="860" y2="100" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="206" y="118" font-size="11" text-anchor="middle" fill="#6B7280">몇 분 안에 몰림</text>
<text x="560" y="118" font-size="11" text-anchor="middle" fill="#6B7280">몇 시간 동안 요청 없음</text>
<text x="30" y="168" font-size="13" text-anchor="start" fill="#1F2937" font-weight="bold">5분 TTL</text>
<rect x="150" y="145" width="190" height="40" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="245" y="169.55" font-size="13" text-anchor="middle" fill="#1F2937">write 1회 + burst 내 read</text>
<text x="352" y="170" font-size="11" text-anchor="start" fill="#6B7280">→ 만료돼도 다음 요청이 없으니 손해 없음</text>
<text x="30" y="238" font-size="13" text-anchor="start" fill="#1F2937" font-weight="bold">1시간 TTL</text>
<rect x="150" y="215" width="600" height="40" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="450" y="239.55" font-size="13" text-anchor="middle" fill="#1F2937">write 비용이 더 비쌈 · burst 이후 추가 hit 없음</text>
<text x="30" y="300" font-size="11" text-anchor="start" fill="#6B7280">permanent cache 옵션은 없음</text>
</g>
</svg>
