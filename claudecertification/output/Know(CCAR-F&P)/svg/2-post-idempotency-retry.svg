<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-label="결과를 모르는 POST 재전송 시 중복 방지" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">
<title>결과를 모르는 POST 재전송 시 중복 방지</title>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<defs><marker id="arr-post-idempotency-retry" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker></defs>
<text x="450" y="28" font-size="14" text-anchor="middle" fill="#1F2937" font-weight="bold">결과를 모르는 POST는 그냥 재전송하지 않는다: idempotency key 또는 등록 여부 확인</text>
<rect x="20" y="60" width="160" height="50" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="100.0" y="89.5" font-size="13" text-anchor="middle" fill="#1F2937">POST 등록 요청</text>
<rect x="240" y="60" width="220" height="50" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
<text x="350.0" y="81.0" font-size="13" text-anchor="middle" fill="#1F2937">timeout 또는 5xx</text>
<text x="350.0" y="98.0" font-size="11" text-anchor="middle" fill="#6B7280">처리됐는지 알 수 없음</text>
<polyline points="180,85 240,85" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-post-idempotency-retry)"/>
<rect x="540" y="50" width="340" height="50" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="710.0" y="71.0" font-size="12" text-anchor="middle" fill="#1F2937">그대로 재전송 → 중복 등록 위험</text>
<text x="710.0" y="88.0" font-size="11" text-anchor="middle" fill="#6B7280">POST는 idempotent 아님 · 5xx ≠ 처리 완료</text>
<rect x="540" y="120" width="340" height="50" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="710.0" y="141.0" font-size="12" text-anchor="middle" fill="#1F2937">idempotency key를 붙여 재전송</text>
<text x="710.0" y="158.0" font-size="11" text-anchor="middle" fill="#6B7280">같은 key는 서버가 한 번만 처리</text>
<rect x="540" y="190" width="340" height="50" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="710.0" y="211.0" font-size="12" text-anchor="middle" fill="#1F2937">먼저 등록 여부를 조회한 뒤</text>
<text x="710.0" y="228.0" font-size="11" text-anchor="middle" fill="#6B7280">없을 때만 재전송</text>
<polyline points="460,85 500,85" fill="none" stroke="#1F2937" stroke-width="1.5"/>
<polyline points="500,75 500,215" fill="none" stroke="#1F2937" stroke-width="1.5"/>
<polyline points="500,75 540,75" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-post-idempotency-retry)"/>
<polyline points="500,145 540,145" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-post-idempotency-retry)"/>
<polyline points="500,215 540,215" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-post-idempotency-retry)"/>
<text x="450" y="290" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="bold">HTTP 메서드의 idempotency</text>
<rect x="150" y="305" width="280" height="56" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
<text x="290.0" y="329.0" font-size="12" text-anchor="middle" fill="#1F2937">GET · HEAD · PUT · DELETE</text>
<text x="290.0" y="346.0" font-size="11" text-anchor="middle" fill="#6B7280">idempotent: 다시 보내도 결과 같음</text>
<rect x="470" y="305" width="280" height="56" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="610.0" y="329.0" font-size="12" text-anchor="middle" fill="#1F2937">POST · PATCH</text>
<text x="610.0" y="346.0" font-size="11" text-anchor="middle" fill="#6B7280">non-idempotent: 재전송 시 중복 위험</text>
</svg>
