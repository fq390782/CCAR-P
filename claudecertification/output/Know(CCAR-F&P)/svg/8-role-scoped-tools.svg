<svg xmlns="http://www.w3.org/2000/svg" width="960" height="490" viewBox="0 0 960 490" role="img" aria-label="각 agent에는 자기 역할의 tool만 주고, 쓰기와 역할 밖 조사는 coordinator를 거친다" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">
<title>각 agent에는 자기 역할의 tool만 주고, 쓰기와 역할 밖 조사는 coordinator를 거친다</title>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<defs><marker id="arr-8-role-scoped-tools" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker></defs>
<rect x="330" y="25" width="300" height="80" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="480.0" y="53.0" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">coordinator</text>
<text x="480.0" y="69.0" font-size="12" fill="#1F2937" text-anchor="middle">쓰기 담당: 티켓 등록 · CRM 갱신</text>
<text x="480.0" y="85.0" font-size="12" fill="#1F2937" text-anchor="middle">합쳐진 결과를 기반으로 실행</text>
<polyline points="400,105 400,148 170,148 170,188" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-8-role-scoped-tools)" marker-start="url(#arr-8-role-scoped-tools)"/>
<rect x="246.4" y="139" width="77.2" height="18" fill="#FFFFFF"/>
<text x="285" y="152" font-size="12" fill="#1F2937" text-anchor="middle">위임 ↔ 결과</text>
<polyline points="480,105 480,188" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-8-role-scoped-tools)" marker-start="url(#arr-8-role-scoped-tools)"/>
<text x="488" y="150" font-size="12" fill="#1F2937" text-anchor="start">위임 ↔ 결과</text>
<polyline points="560,105 560,148 790,148 790,188" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-8-role-scoped-tools)" marker-start="url(#arr-8-role-scoped-tools)"/>
<rect x="636.4" y="139" width="77.2" height="18" fill="#FFFFFF"/>
<text x="675" y="152" font-size="12" fill="#1F2937" text-anchor="middle">위임 ↔ 결과</text>
<rect x="30" y="190" width="280" height="90" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="170.0" y="223.0" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">저장소 scanner subagent</text>
<text x="170.0" y="239.0" font-size="12" fill="#1F2937" text-anchor="middle">tools: Read · Grep · Glob</text>
<text x="170.0" y="255.0" font-size="12" fill="#1F2937" text-anchor="middle">· 의존성 검사 (읽기 전용)</text>
<rect x="340" y="190" width="280" height="90" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="480.0" y="223.0" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">추출 subagent</text>
<text x="480.0" y="239.0" font-size="12" fill="#1F2937" text-anchor="middle">tools: 문서 읽기</text>
<text x="480.0" y="255.0" font-size="12" fill="#1F2937" text-anchor="middle">+ 추출 결과 제출만</text>
<rect x="650" y="190" width="280" height="90" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="790.0" y="223.0" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">CRM · 메일 · 캘린더 agent</text>
<text x="790.0" y="239.0" font-size="12" fill="#1F2937" text-anchor="middle">추출 agent에서 분리</text>
<text x="790.0" y="255.0" font-size="12" fill="#1F2937" text-anchor="middle">별도 agent · 별도 단계</text>
<rect x="30" y="305" width="280" height="40" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="170.0" y="329.0" font-size="12" fill="#1F2937" text-anchor="middle">티켓 등록 ✗ (coordinator만)</text>
<rect x="340" y="305" width="280" height="40" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="480.0" y="329.0" font-size="12" fill="#1F2937" text-anchor="middle">웹 검색 · 검증 전 DB 쓰기 ✗</text>
<text x="30" y="385" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">역할 밖 tool이 필요해지면</text>
<rect x="30" y="400" width="280" height="72" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="170.0" y="424.0" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">필요 빈도 낮음</text>
<text x="170.0" y="440.0" font-size="12" fill="#1F2937" text-anchor="middle">→ 타 역할 tool 제거</text>
<text x="170.0" y="456.0" font-size="12" fill="#1F2937" text-anchor="middle">→ 추가 조사는 coordinator 경유</text>
<rect x="340" y="400" width="280" height="72" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="480.0" y="424.0" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">빈번 · 대부분 단순 확인</text>
<text x="480.0" y="440.0" font-size="12" fill="#1F2937" text-anchor="middle">→ 범위 제한 tool 부여</text>
<text x="480.0" y="456.0" font-size="12" fill="#1F2937" text-anchor="middle">(예: verify_fact)</text>
<rect x="650" y="400" width="280" height="72" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="790.0" y="424.0" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">복잡 · 깊은 조사</text>
<text x="790.0" y="440.0" font-size="12" fill="#1F2937" text-anchor="middle">→ 기존 경로 유지</text>
<text x="790.0" y="456.0" font-size="12" fill="#1F2937" text-anchor="middle">coordinator → 전문 agent</text>
</svg>
