<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-label="고지 · 인용 · 이의 신청을 trace에서 생성하는 투명성 흐름">
<title>고지 · 인용 · 이의 신청을 trace에서 생성하는 투명성 흐름</title>
<defs><marker id="arr-transparency-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<g font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">
<text x="400.0" y="28" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">고지 · 검증 · 구제를 모두 갖춘 투명성: 설명은 trace에서 생성</text>
<rect x="20" y="46" width="230" height="38" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
