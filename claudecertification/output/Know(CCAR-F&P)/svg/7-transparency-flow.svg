<text x="143" y="98" font-size="11" fill="#1F2937" text-anchor="start">대응</text>
<rect x="20" y="106" width="230" height="38" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="135.0" y="129.2" font-size="13" fill="#1F2937" text-anchor="middle">사전 고지</text>
<rect x="285" y="46" width="230" height="38" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="400.0" y="69.2" font-size="13" fill="#1F2937" text-anchor="middle">답변 주장을 검증</text>
<polyline points="400,84 400,104" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-transparency-flow)"/>
