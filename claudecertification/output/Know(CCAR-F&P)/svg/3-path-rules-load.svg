<svg xmlns="http://www.w3.org/2000/svg" width="860" height="420" viewBox="0 0 860 420" role="img" aria-label="path-specific rules: paths 없는 rule은 시작 시 로드되고, paths 있는 rule은 Claude가 일치하는 파일을 읽거나 쓸 때만 로드된다" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">
  <title>path-specific rules 로드 흐름</title>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <defs>
    <marker id="arr-prule" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker>
  </defs>
  <text x="430" y="26" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F2937">paths 있는 rule은 Claude가 일치하는 파일을 다룰 때만 로드된다</text>

  <rect x="20" y="48" width="280" height="56" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="160" y="71" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2937">paths 없는 rule</text>
  <text x="160" y="91" text-anchor="middle" font-size="11" fill="#6B7280">.claude/rules/*.md · 폴더 구성으로 범위 제한 ✗</text>
  <line x1="300" y1="76" x2="398" y2="76" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-prule)"/>
  <text x="349" y="68" text-anchor="middle" font-size="11" fill="#6B7280">시작 시 로드</text>
  <rect x="400" y="48" width="440" height="56" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="620" y="71" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2937">항상 context에 있음</text>
  <text x="620" y="91" text-anchor="middle" font-size="11" fill="#6B7280">로드량 불변 · 항상 지킬 규약은 분할해도 누락 ✗</text>

  <rect x="20" y="150" width="180" height="56" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="110" y="172" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2937">Claude의 파일 작업</text>
  <text x="110" y="190" text-anchor="middle" font-size="11" fill="#6B7280">Read · Write · Edit</text>
  <text x="110" y="203" text-anchor="middle" font-size="11" fill="#6B7280">계기 = 파일 경로 (주제 ✗)</text>
  <line x1="200" y1="178" x2="238" y2="178" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-prule)"/>
  <polygon points="340,132 440,178 340,224 240,178" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="340" y="174" text-anchor="middle" font-size="13" fill="#1F2937">경로가 paths</text>
  <text x="340" y="191" text-anchor="middle" font-size="13" fill="#1F2937">glob과 일치?</text>
  <line x1="440" y1="178" x2="478" y2="178" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-prule)"/>
  <text x="459" y="170" text-anchor="middle" font-size="11" fill="#6B7280">예</text>
  <rect x="480" y="150" width="360" height="56" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="660" y="172" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2937">일치 rule 로드</text>
  <text x="660" y="192" text-anchor="middle" font-size="11" fill="#6B7280">InstructionsLoaded hook 로그로 로드 여부 확인</text>
  <line x1="340" y1="224" x2="340" y2="250" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-prule)"/>
  <text x="348" y="242" font-size="11" fill="#6B7280">아니오</text>
  <rect x="200" y="252" width="280" height="62" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="340" y="273" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2937">rule 미로드</text>
  <text x="340" y="291" text-anchor="middle" font-size="11" fill="#6B7280">일치 파일을 읽거나 쓰지 않은 작업</text>
  <text x="340" y="306" text-anchor="middle" font-size="11" fill="#6B7280">→ 다루는 파일을 paths에 포함</text>

  <text x="20" y="344" font-size="14" font-weight="bold" fill="#1F2937">glob 범위 (일치 판정 예)</text>
  <rect x="20" y="354" width="260" height="56" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="150" y="376" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2937">*.sql</text>
  <text x="150" y="395" text-anchor="middle" font-size="11" fill="#6B7280">프로젝트 루트 파일만 → 하위 미적용</text>
  <rect x="300" y="354" width="260" height="56" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="430" y="376" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2937">**/*.sql</text>
  <text x="430" y="395" text-anchor="middle" font-size="11" fill="#6B7280">깊이 무관 해당 확장자 전체 ✓</text>
  <rect x="580" y="354" width="260" height="56" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="710" y="376" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2937">**/*.{graphql,ts}</text>
  <text x="710" y="395" text-anchor="middle" font-size="11" fill="#6B7280">모든 TypeScript 파일 일치 → 범위 넓음</text>
</svg>
