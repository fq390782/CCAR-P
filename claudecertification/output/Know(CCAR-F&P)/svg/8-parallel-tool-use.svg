<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img" aria-label="병렬 tool use: 여러 tool_use 결과를 한 user 메시지에 모아 돌려준다" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">
<title>병렬 tool use: 여러 tool_use 결과를 한 user 메시지에 모아 돌려준다</title>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<defs><marker id="arr-8-parallel-tool-use" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker></defs>
<rect x="30" y="40" width="230" height="190" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="145" y="64" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">assistant 턴 1개</text>
<rect x="50" y="80" width="190" height="36" rx="6" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="145.0" y="101.5" font-size="13" fill="#1F2937" text-anchor="middle">tool_use  id: A</text>
<rect x="50" y="128" width="190" height="36" rx="6" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="145.0" y="149.5" font-size="13" fill="#1F2937" text-anchor="middle">tool_use  id: B</text>
<rect x="50" y="176" width="190" height="36" rx="6" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="145.0" y="197.5" font-size="13" fill="#1F2937" text-anchor="middle">tool_use  id: C</text>
<rect x="330" y="100" width="170" height="70" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="415.0" y="130.5" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">앱이 모두 실행</text>
<text x="415.0" y="146.5" font-size="12" fill="#6B7280" text-anchor="middle">A, B, C</text>
<polyline points="260,135 328,135" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-8-parallel-tool-use)"/>
<rect x="262.53846153846155" y="113" width="62.92307692307692" height="16" fill="#FFFFFF"/>
<text x="294" y="125" font-size="12" fill="#1F2937" text-anchor="middle">전부 받음</text>
<rect x="580" y="30" width="290" height="190" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="725" y="54" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">정답: user 메시지 1개</text>
<rect x="600" y="70" width="250" height="36" rx="6" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="725.0" y="91.5" font-size="13" fill="#1F2937" text-anchor="middle">tool_result  tool_use_id: A</text>
<rect x="600" y="118" width="250" height="36" rx="6" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="725.0" y="139.5" font-size="13" fill="#1F2937" text-anchor="middle">tool_result  tool_use_id: B</text>
<rect x="600" y="166" width="250" height="36" rx="6" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="725.0" y="187.5" font-size="13" fill="#1F2937" text-anchor="middle">tool_result  tool_use_id: C</text>
<polyline points="500,125 578,125" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-8-parallel-tool-use)"/>
<rect x="513.5384615384615" y="103" width="50.92307692307692" height="16" fill="#FFFFFF"/>
<text x="539" y="115" font-size="12" fill="#1F2937" text-anchor="middle">한 번에</text>
<rect x="580" y="250" width="290" height="150" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="725" y="274" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">오답: 메시지 여러 개로 분할</text>
<rect x="600" y="290" width="250" height="34" rx="6" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="725.0" y="310.5" font-size="13" fill="#1F2937" text-anchor="middle">user: tool_result A</text>
<rect x="600" y="336" width="250" height="34" rx="6" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="725.0" y="356.5" font-size="13" fill="#1F2937" text-anchor="middle">user: tool_result B ...</text>
<polyline points="440,170 440,325 578,325" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-8-parallel-tool-use)"/>
<rect x="478.53846153846155" y="304" width="62.92307692307692" height="16" fill="#FFFFFF"/>
<text x="510" y="316" font-size="12" fill="#1F2937" text-anchor="middle">나눠 보냄</text>
<rect x="30" y="270" width="380" height="120" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="220.0" y="308.5" font-size="13" fill="#1F2937" text-anchor="middle">분할하면 모델이 이후 병렬 호출을</text>
<text x="220.0" y="325.5" font-size="13" fill="#1F2937" text-anchor="middle">덜 함 → latency 증가</text>
<text x="220.0" y="342.5" font-size="13" fill="#1F2937" text-anchor="middle">"첫 번째 tool_use만 유효"도 오답</text>
<text x="220.0" y="358.5" font-size="12" fill="#6B7280" text-anchor="middle">호출 1개로 제한: disable_parallel_tool_use</text>
<rect x="30" y="414" width="14" height="14" rx="3" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="50" y="425" font-size="11" fill="#6B7280" text-anchor="start">정답 경로</text>
<rect x="118.34615384615384" y="414" width="14" height="14" rx="3" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="138.34615384615384" y="425" font-size="11" fill="#6B7280" text-anchor="start">오답</text>
</svg>
