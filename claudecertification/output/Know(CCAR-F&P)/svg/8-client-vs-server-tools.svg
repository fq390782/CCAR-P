<text x="450.0" y="470.5" font-size="12" fill="#1F2937" text-anchor="middle">server tool은 앱이 실행 / client tool은 Anthropic에서 실행  |  server tool은 MCP·Batch API 전용</text>
<text x="450.0" y="486.5" font-size="12" fill="#1F2937" text-anchor="middle">사내 시스템을 server tool로 연결 (사용자가 정의할 수 없고 사내망에 닿지 않음)</text>
