<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" role="img" aria-label="사용자와 워크로드 단위로 자격 증명을 나누고 workspace로 격리하는 구조" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">
<title>사용자와 워크로드 단위로 자격 증명을 나누고 workspace로 격리하는 구조</title>
<defs><marker id="arr-auth-credential-workspace" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker></defs>
