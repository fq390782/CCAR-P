<svg xmlns="http://www.w3.org/2000/svg" width="920" height="590" viewBox="0 0 920 590" role="img" aria-label="Cascade: 측정된 검사를 통과하지 못한 요청만 한 단계 위 tier로 escalate">
<title>Cascade: 측정된 검사를 통과하지 못한 요청만 한 단계 위 tier로 escalate</title>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<defs><marker id="arr-cascade-escalation" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker></defs>
<g font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">
<text x="460" y="30" font-size="14" text-anchor="middle" fill="#1F2937" font-weight="bold">Cascade: 측정된 검사를 통과하지 못한 요청만 한 단계 위 tier로 escalate</text>
<rect x="20" y="60" width="90" height="50" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="65" y="81.05" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="bold">코드 변경</text>
<text x="65" y="98.05" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="bold">요청</text>
<polyline points="110,85 170,85" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-cascade-escalation)"/>
<rect x="113.3" y="68" width="53.3" height="15" fill="#FFFFFF"/>
<text x="140" y="79" font-size="11" text-anchor="middle" fill="#1F2937">유형 판별</text>
<rect x="170" y="50" width="200" height="70" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="270" y="74.55" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="bold">라우터</text>
<text x="270" y="89.85" font-size="11" text-anchor="middle" fill="#6B7280">크기 · 복잡도 신호</text>
<text x="270" y="104.85" font-size="11" text-anchor="middle" fill="#6B7280">보정된 신뢰도 임계값</text>
<polyline points="370,85 450,85" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-cascade-escalation)"/>
<rect x="381.6" y="68" width="56.8" height="15" fill="#FFFFFF"/>
<text x="410" y="79" font-size="11" text-anchor="middle" fill="#1F2937">작은 diff</text>
<rect x="450" y="57" width="190" height="56" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="545" y="82.05" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="bold">Fast tier</text>
<text x="545" y="97.35" font-size="11" text-anchor="middle" fill="#6B7280">floor 넘는 가장 싼 tier</text>
<polyline points="545,113 545,153" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-cascade-escalation)"/>
<rect x="552.0" y="127" width="56.8" height="15" fill="#FFFFFF"/>
<text x="555" y="138" font-size="11" text-anchor="start" fill="#1F2937">Fast 결과</text>
<polygon points="545,153 645,205 545,257 445,205" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
<text x="545" y="193.55" font-size="13" text-anchor="middle" fill="#1F2937">측정된 검사</text>
<text x="545" y="208.85" font-size="11" text-anchor="middle" fill="#6B7280">verifier · floor test</text>
<text x="545" y="225.55" font-size="13" text-anchor="middle" fill="#1F2937">통과?</text>
<polyline points="645,205 700,205" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-cascade-escalation)"/>
<rect x="663.5" y="188" width="17.0" height="15" fill="#FFFFFF"/>
<text x="672" y="199" font-size="11" text-anchor="middle" fill="#1F2937">예</text>
<rect x="700" y="177" width="200" height="56" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
<text x="800" y="202.05" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="bold">Fast 응답 반환</text>
<text x="800" y="217.35" font-size="11" text-anchor="middle" fill="#6B7280">비용 절감</text>
<polyline points="545,257 545,320" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-cascade-escalation)"/>
<rect x="552.0" y="283" width="140.2" height="15" fill="#FFFFFF"/>
<text x="555" y="294" font-size="11" text-anchor="start" fill="#1F2937">아니오: floor 미달 요청만</text>
<rect x="450" y="320" width="190" height="56" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="545" y="345.05" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="bold">Capable tier</text>
<text x="545" y="360.35" font-size="11" text-anchor="middle" fill="#6B7280">한 단계 위로 escalate</text>
<polyline points="640,348 700,348" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-cascade-escalation)"/>
<rect x="656.0" y="331" width="28.0" height="15" fill="#FFFFFF"/>
<text x="670" y="342" font-size="11" text-anchor="middle" fill="#1F2937">응답</text>
<rect x="700" y="320" width="200" height="56" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
<text x="800" y="345.05" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="bold">Capable 응답 반환</text>
<text x="800" y="360.35" font-size="11" text-anchor="middle" fill="#6B7280">floor 충족</text>
<polyline points="220,120 220,348 450,348" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-cascade-escalation)"/>
<rect x="278.8" y="331" width="112.5" height="15" fill="#FFFFFF"/>
<text x="335" y="342" font-size="11" text-anchor="middle" fill="#1F2937">대규모 refactoring</text>
<rect x="240" y="160" width="190" height="100" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="335" y="190.05" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="bold">배정 원칙</text>
<text x="335" y="207.05" font-size="13" text-anchor="middle" fill="#1F2937">각 유형 = floor 넘는</text>
<text x="335" y="224.05" font-size="13" text-anchor="middle" fill="#1F2937">가장 싼 tier</text>
<text x="335" y="239.35" font-size="11" text-anchor="middle" fill="#6B7280">round-robin(순번 배정) ✗</text>
<rect x="20" y="408" width="880" height="70" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="460" y="430.55" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="bold">라우터도 eval 대상 (새 실패 지점)</text>
<text x="460" y="447.55" font-size="13" text-anchor="middle" fill="#1F2937">어려운 질문 → 저렴한 tier = 품질 위험 · 쉬운 질문 → 비싼 tier = 비용 위험</text>
<text x="460" y="464.55" font-size="13" text-anchor="middle" fill="#1F2937">키워드 목록 포함 모든 라우터 = 자체 eval 필요 · 완벽한 라우터 없음</text>
<rect x="20" y="494" width="880" height="86" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="460" y="516.05" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="bold">✗ 오답</text>
<text x="460" y="533.05" font-size="13" text-anchor="middle" fill="#1F2937">모델 자기 신뢰도로 escalate 판단 → 보정 안 됨 · prompt injection 가능</text>
<text x="460" y="550.05" font-size="13" text-anchor="middle" fill="#1F2937">임계값 오보정 → 전부 escalate = 비용 낭비 · 아무것도 안 함 = 품질 하락</text>
<text x="460" y="567.05" font-size="13" text-anchor="middle" fill="#1F2937">전부 Capable = 작은 diff에 가격 낭비 · 전부 Fast = 어려운 유형 floor 위반</text>
</g>
</svg>
