<svg xmlns="http://www.w3.org/2000/svg" width="960" height="535" viewBox="0 0 960 535" role="img" aria-label="MCP server는 공유하면 project scope, 비밀은 .mcp.json에 ${VAR}로만 참조한다" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">
<title>MCP server는 공유하면 project scope, 비밀은 .mcp.json에 ${VAR}로만 참조한다</title>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<defs><marker id="arr-8-mcp-scope-credential" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker></defs>
<rect x="30" y="20" width="280" height="80" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="170.0" y="48.0" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">local (기본값)</text>
<text x="170.0" y="64.0" font-size="12" fill="#1F2937" text-anchor="middle">저장: ~/.claude.json (현재 프로젝트용)</text>
<text x="170.0" y="80.0" font-size="12" fill="#1F2937" text-anchor="middle">본인만 · 현재 프로젝트에서만 로드</text>
<rect x="340" y="20" width="280" height="80" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="480.0" y="48.0" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">project</text>
<text x="480.0" y="64.0" font-size="12" fill="#1F2937" text-anchor="middle">저장: 프로젝트 루트 .mcp.json</text>
<text x="480.0" y="80.0" font-size="12" fill="#1F2937" text-anchor="middle">버전 관리로 팀 공유</text>
<rect x="650" y="20" width="280" height="80" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="790.0" y="48.0" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">user</text>
<text x="790.0" y="64.0" font-size="12" fill="#1F2937" text-anchor="middle">저장: ~/.claude.json</text>
<text x="790.0" y="80.0" font-size="12" fill="#1F2937" text-anchor="middle">공유 ✗ · 본인의 모든 프로젝트에서 로드</text>
<polyline points="170,100 170,138" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-8-mcp-scope-credential)"/>
<rect x="139.2" y="110" width="61.6" height="18" fill="#FFFFFF"/>
<text x="170" y="123" font-size="12" fill="#1F2937" text-anchor="middle">쓰는 경우</text>
<polyline points="480,100 480,138" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-8-mcp-scope-credential)"/>
<rect x="449.2" y="110" width="61.6" height="18" fill="#FFFFFF"/>
<text x="480" y="123" font-size="12" fill="#1F2937" text-anchor="middle">쓰는 경우</text>
<polyline points="790,100 790,138" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-8-mcp-scope-credential)"/>
<rect x="759.2" y="110" width="61.6" height="18" fill="#FFFFFF"/>
<text x="790" y="123" font-size="12" fill="#1F2937" text-anchor="middle">쓰는 경우</text>
<rect x="30" y="140" width="280" height="54" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="170.0" y="171.0" font-size="12" fill="#1F2937" text-anchor="middle">특정 프로젝트에서만 개인 시험</text>
<rect x="340" y="140" width="280" height="54" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
<text x="480.0" y="163.0" font-size="12" fill="#1F2937" text-anchor="middle">팀 전원이 쓰는 서버</text>
<text x="480.0" y="179.0" font-size="12" fill="#1F2937" text-anchor="middle">claude mcp add --scope project</text>
<rect x="650" y="140" width="280" height="54" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="790.0" y="163.0" font-size="12" fill="#1F2937" text-anchor="middle">개인 · 실험 서버를 여러 repo에서</text>
<text x="790.0" y="179.0" font-size="12" fill="#1F2937" text-anchor="middle">claude mcp add --scope user</text>
<rect x="30" y="214" width="280" height="50" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="170.0" y="235.0" font-size="12" fill="#1F2937" text-anchor="middle">기본 명령으로 추가 → 동료에게 안 보임</text>
<text x="170.0" y="251.0" font-size="12" fill="#1F2937" text-anchor="middle">(local 저장) → --scope project로 재추가</text>
<text x="30" y="305" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">credential: 비밀 값은 .mcp.json에 두지 않고 환경 변수로 참조</text>
<rect x="30" y="320" width="240" height="85" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="150.0" y="342.5" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">.mcp.json (commit)</text>
<text x="150.0" y="358.5" font-size="12" fill="#1F2937" text-anchor="middle">headers:</text>
<text x="150.0" y="374.5" font-size="12" fill="#1F2937" text-anchor="middle">Bearer ${PR_API_TOKEN}</text>
<text x="150.0" y="390.5" font-size="12" fill="#1F2937" text-anchor="middle">실제 값은 없음</text>
<polyline points="270,362 380,362" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-8-mcp-scope-credential)"/>
<rect x="284.6" y="343" width="80.80000000000001" height="18" fill="#FFFFFF"/>
<text x="325" y="356" font-size="12" fill="#1F2937" text-anchor="middle">${VAR} 확장</text>
<rect x="380" y="320" width="270" height="85" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="515.0" y="350.5" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">각 개발자 · 환경의 환경 변수</text>
<text x="515.0" y="366.5" font-size="12" fill="#1F2937" text-anchor="middle">PR_API_TOKEN = 본인 token</text>
<text x="515.0" y="382.5" font-size="12" fill="#1F2937" text-anchor="middle">필요 변수명 = README · 온보딩 문서</text>
<polyline points="650,362 760,362" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-8-mcp-scope-credential)"/>
<rect x="688.0" y="343" width="34.0" height="18" fill="#FFFFFF"/>
<text x="705" y="356" font-size="12" fill="#1F2937" text-anchor="middle">요청</text>
<rect x="760" y="320" width="170" height="85" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
<text x="845.0" y="350.5" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">원격 MCP 서버</text>
<text x="845.0" y="366.5" font-size="12" fill="#1F2937" text-anchor="middle">headers의 Bearer에</text>
<text x="845.0" y="382.5" font-size="12" fill="#1F2937" text-anchor="middle">본인 token 전달</text>
<polyline points="150,405 150,440" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-8-mcp-scope-credential)"/>
<rect x="111.4" y="413" width="77.2" height="18" fill="#FFFFFF"/>
<text x="150" y="426" font-size="12" fill="#1F2937" text-anchor="middle">직접 삽입 ✗</text>
<polyline points="580,405 580,440" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-8-mcp-scope-credential)"/>
<rect x="549.2" y="413" width="61.6" height="18" fill="#FFFFFF"/>
<text x="580" y="426" font-size="12" fill="#1F2937" text-anchor="middle">미설정 시</text>
<rect x="30" y="442" width="400" height="78" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="230.0" y="469.0" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">안티패턴</text>
<text x="230.0" y="485.0" font-size="12" fill="#1F2937" text-anchor="middle">token 직접 삽입 → 접근 제한과 무관하게 유출</text>
<text x="230.0" y="501.0" font-size="12" fill="#1F2937" text-anchor="middle">$VAR (중괄호 없음) → 문서화된 확장 구문 ✗</text>
<rect x="460" y="442" width="470" height="78" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="695.0" y="469.0" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">변수 미설정 + default 없음</text>
<text x="695.0" y="485.0" font-size="12" fill="#1F2937" text-anchor="middle">→ config 로드 · 경고 · ${VAR} 원문 그대로 → 해당 멤버 401</text>
<text x="695.0" y="501.0" font-size="12" fill="#1F2937" text-anchor="middle">조치: 각자 환경 변수 설정 후 Claude Code 시작 · ${VAR:-default}</text>
</svg>
