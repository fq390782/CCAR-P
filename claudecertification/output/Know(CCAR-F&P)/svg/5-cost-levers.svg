<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-label="비용 절감 레버: 가장 큰 항목부터 공략하고, 적용 후 eval로 floor 확인">
<title>비용 절감 레버: 가장 큰 항목부터 공략하고, 적용 후 eval로 floor 확인</title>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<defs><marker id="arr-cost-levers" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker></defs>
<g font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">
<text x="480" y="30" font-size="14" text-anchor="middle" fill="#1F2937" font-weight="bold">비용 절감 레버: 가장 큰 항목부터 공략하고, 적용 후 eval로 floor 확인</text>
<rect x="20" y="165" width="140" height="96" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="90" y="195.05" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="bold">호출당 비용 분해</text>
<text x="90" y="210.35" font-size="11" text-anchor="middle" fill="#6B7280">context · retrieval</text>
<text x="90" y="225.35" font-size="11" text-anchor="middle" fill="#6B7280">· generation</text>
<text x="90" y="240.35" font-size="11" text-anchor="middle" fill="#6B7280">가장 큰 항목 먼저</text>
<rect x="225" y="60" width="230" height="66" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="340" y="90.05" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="bold">호출당 context가 비용 지배</text>
<text x="340" y="105.35" font-size="11" text-anchor="middle" fill="#6B7280">(10,000 token 중 8,000 = 반복 지시문)</text>
<rect x="515" y="60" width="385" height="66" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="707.5" y="82.55" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="bold">context 축소 → 중복 제거 후 안정 블록 cache</text>
<text x="707.5" y="97.85" font-size="11" text-anchor="middle" fill="#6B7280">caching보다 먼저: 작은 context &gt; 할인된 큰 context</text>
<text x="707.5" y="112.85" font-size="11" text-anchor="middle" fill="#6B7280">안정 prefix 전제 · 블록 버전 관리 필요</text>
<polyline points="160,213 195,213 195,93 225,93" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-cost-levers)"/>
<polyline points="455,93 515,93" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-cost-levers)"/>
<rect x="458.4" y="76" width="53.3" height="15" fill="#FFFFFF"/>
<text x="485" y="87" font-size="11" text-anchor="middle" fill="#1F2937">중복 제거</text>
<polyline points="900,93 925,93" fill="none" stroke="#1F2937" stroke-width="1.5"/>
<rect x="225" y="140" width="230" height="66" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="340" y="170.05" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="bold">질문이 문서 일부만 필요</text>
<text x="340" y="185.35" font-size="11" text-anchor="middle" fill="#6B7280">(30페이지 · 25,000 token 매 호출 전송)</text>
<rect x="515" y="140" width="385" height="66" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="707.5" y="162.55" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="bold">JIT retrieval: 관련 섹션만 retrieve</text>
<text x="707.5" y="177.85" font-size="11" text-anchor="middle" fill="#6B7280">과대 context = 첫 절감 대상</text>
<text x="707.5" y="192.85" font-size="11" text-anchor="middle" fill="#6B7280">반례: 올바른 섹션에도 trace 실패 → 더 큰 모델 검토</text>
<polyline points="160,213 195,213 195,173 225,173" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-cost-levers)"/>
<polyline points="455,173 515,173" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-cost-levers)"/>
<rect x="456.5" y="156" width="57.0" height="15" fill="#FFFFFF"/>
<text x="485" y="167" font-size="11" text-anchor="middle" fill="#1F2937">retrieve</text>
<polyline points="900,173 925,173" fill="none" stroke="#1F2937" stroke-width="1.5"/>
<rect x="225" y="220" width="230" height="66" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="340" y="250.05" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="bold">변경분이 소수</text>
<text x="340" y="265.35" font-size="11" text-anchor="middle" fill="#6B7280">(재임베딩 중 밤마다 2%만 변경)</text>
<rect x="515" y="220" width="385" height="66" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="707.5" y="242.55" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="bold">증분 처리 (call elimination)</text>
<text x="707.5" y="257.85" font-size="11" text-anchor="middle" fill="#6B7280">변경 문서만 처리 · 나머지 재사용</text>
<text x="707.5" y="272.85" font-size="11" text-anchor="middle" fill="#6B7280">변경 감지 비용이 더 크면 전체 재처리</text>
<polyline points="160,213 195,213 195,253 225,253" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-cost-levers)"/>
<polyline points="455,253 515,253" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-cost-levers)"/>
<rect x="460.0" y="236" width="50.0" height="15" fill="#FFFFFF"/>
<text x="485" y="247" font-size="11" text-anchor="middle" fill="#1F2937">변경분만</text>
<polyline points="900,253 925,253" fill="none" stroke="#1F2937" stroke-width="1.5"/>
<rect x="225" y="300" width="230" height="66" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="340" y="337.55" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="bold">고정 레이아웃 · 고정 필드 추출</text>
<rect x="515" y="300" width="385" height="66" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="707.5" y="322.55" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="bold">코드 규칙: 모델 호출 skip</text>
<text x="707.5" y="337.85" font-size="11" text-anchor="middle" fill="#6B7280">token 비용 0 · 같은 입력 = 같은 출력</text>
<text x="707.5" y="352.85" font-size="11" text-anchor="middle" fill="#6B7280">열린 입력만 모델 호출</text>
<polyline points="160,213 195,213 195,333 225,333" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-cost-levers)"/>
<polyline points="455,333 515,333" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-cost-levers)"/>
<rect x="469.2" y="316" width="31.5" height="15" fill="#FFFFFF"/>
<text x="485" y="327" font-size="11" text-anchor="middle" fill="#1F2937">skip</text>
<polyline points="925,93 925,333" fill="none" stroke="#1F2937" stroke-width="1.5"/>
<polyline points="900,333 925,333 925,463 900,463" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-cost-levers)"/>
<rect x="903.9" y="394" width="42.3" height="15" fill="#FFFFFF"/>
<text x="925" y="405" font-size="11" text-anchor="middle" fill="#1F2937">적용 후</text>
<rect x="20" y="425" width="880" height="76" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
<text x="460" y="452.55" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="bold">적용 후 eval 재실행 → floor 유지 입증</text>
<text x="460" y="467.85" font-size="11" text-anchor="middle" fill="#6B7280">조합 계획 예 (40% 절감 · 정확도 90% 이상): 반복 prefix caching</text>
<text x="460" y="482.85" font-size="11" text-anchor="middle" fill="#6B7280">→ 쉬운 등급은 더 작은 모델 · 어려운 사례 유지 → eval 재실행으로 하한선 유지 입증</text>
</g>
</svg>
