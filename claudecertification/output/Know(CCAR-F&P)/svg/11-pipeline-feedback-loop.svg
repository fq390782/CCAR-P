<svg xmlns="http://www.w3.org/2000/svg" width="900" height="488" viewBox="0 0 900 488" role="img" aria-label="송장 처리 예에서 입력 처리 출력 피드백 네 단계와 사람 대기열, 피드백 루프 4단 반복을 보여 주는 흐름">
<title>입력, 처리, 출력, 피드백 루프를 갖춘 end-to-end 파이프라인</title>
<defs><marker id="arr-pipeline-feedback-loop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<g font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">
<text x="450.0" y="28" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">완전한 설계 = 입력 · 처리 · 출력 · 피드백 루프</text>
<rect x="20" y="84" width="170" height="80" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="105.0" y="121.4" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">입력</text>
<text x="105.0" y="135.7" font-size="11" fill="#1F2937" text-anchor="middle">이메일 수신 · OCR</text>
<rect x="250" y="84" width="170" height="80" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="335.0" y="121.4" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">처리</text>
<text x="335.0" y="135.7" font-size="11" fill="#1F2937" text-anchor="middle">스키마 검증을 포함한 추출</text>
<rect x="480" y="84" width="170" height="80" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="565.0" y="121.4" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">출력</text>
<text x="565.0" y="135.7" font-size="11" fill="#1F2937" text-anchor="middle">예외 큐를 갖춘 ERP 전기</text>
<rect x="710" y="84" width="170" height="80" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="795.0" y="114.4" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">피드백</text>
<text x="795.0" y="128.7" font-size="11" fill="#1F2937" text-anchor="middle">필드별 정확도 평가 ·</text>
<text x="795.0" y="142.7" font-size="11" fill="#1F2937" text-anchor="middle">사용자 수정 · 모니터링</text>
<polyline points="190,124 250,124" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-pipeline-feedback-loop)"/>
<text x="220" y="116" font-size="11" fill="#1F2937" text-anchor="middle">handoff</text>
<polyline points="420,124 480,124" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-pipeline-feedback-loop)"/>
<text x="450" y="116" font-size="11" fill="#1F2937" text-anchor="middle">handoff</text>
<polyline points="650,124 710,124" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-pipeline-feedback-loop)"/>
<text x="680" y="116" font-size="11" fill="#1F2937" text-anchor="middle">handoff</text>
<polyline points="795,84 795,62 335,62 335,84" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-pipeline-feedback-loop)"/>
<text x="565" y="56" font-size="11" fill="#1F2937" text-anchor="middle">prompt · 모델 결정에 반영</text>
<text x="20" y="182" font-size="11" fill="#6B7280" text-anchor="start">모든 handoff 로깅 (감사 추적)</text>
<text x="20" y="198" font-size="11" fill="#6B7280" text-anchor="start">handoff = 단계별 typed 결과 + 신뢰도</text>
<polyline points="335,164 335,226" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-pipeline-feedback-loop)"/>
<text x="343" y="200" font-size="11" fill="#1F2937" text-anchor="start">저신뢰 · 실패</text>
<rect x="185" y="226" width="300" height="52" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="335.0" y="249.4" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">사람 대기열</text>
<text x="335.0" y="263.7" font-size="11" fill="#1F2937" text-anchor="middle">전체 단계 이력 첨부</text>
<rect x="540" y="226" width="340" height="66" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="710.0" y="249.4" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">피드백 루프 부재 ✗</text>
<text x="710.0" y="263.7" font-size="11" fill="#1F2937" text-anchor="middle">평점만 수집 후 DB 방치 · 처리량 대시보드</text>
<text x="710.0" y="277.7" font-size="11" fill="#1F2937" text-anchor="middle">= 활동 측정 · 품질 개선 ✗</text>
<text x="20" y="328" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="start">피드백 루프 4단 (일정에 따라 반복)</text>
<rect x="20" y="342" width="170" height="76" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="105.0" y="370.4" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">① 샘플링</text>
<text x="105.0" y="384.7" font-size="11" fill="#1F2937" text-anchor="middle">낮은 평점 답변을</text>
<text x="105.0" y="398.7" font-size="11" fill="#1F2937" text-anchor="middle">주기(주 1회)로</text>
<rect x="250" y="342" width="170" height="76" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="335.0" y="370.4" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">② eval 추가</text>
<text x="335.0" y="384.7" font-size="11" fill="#1F2937" text-anchor="middle">실패 사례를</text>
<text x="335.0" y="398.7" font-size="11" fill="#1F2937" text-anchor="middle">eval 세트에 추가</text>
<rect x="480" y="342" width="170" height="76" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="565.0" y="370.4" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">③ 수정 검토</text>
<text x="565.0" y="384.7" font-size="11" fill="#1F2937" text-anchor="middle">prompt · 검색 수정안을</text>
<text x="565.0" y="398.7" font-size="11" fill="#1F2937" text-anchor="middle">eval 세트에 대해 검토</text>
<rect x="710" y="342" width="170" height="76" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="795.0" y="370.4" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">④ 개선분 배포</text>
<text x="795.0" y="384.7" font-size="11" fill="#1F2937" text-anchor="middle">점수를 개선하는</text>
<text x="795.0" y="398.7" font-size="11" fill="#1F2937" text-anchor="middle">수정만 배포</text>
<polyline points="190,380 250,380" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-pipeline-feedback-loop)"/>
<text x="220" y="372" font-size="11" fill="#1F2937" text-anchor="middle">실패 사례</text>
<polyline points="420,380 480,380" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-pipeline-feedback-loop)"/>
<text x="450" y="372" font-size="11" fill="#1F2937" text-anchor="middle">수정안</text>
<polyline points="650,380 710,380" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-pipeline-feedback-loop)"/>
<text x="680" y="372" font-size="11" fill="#1F2937" text-anchor="middle">점수 개선</text>
<polyline points="795,418 795,442 105,442 105,418" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-pipeline-feedback-loop)"/>
<text x="450" y="436" font-size="11" fill="#1F2937" text-anchor="middle">다음 주기에 반복</text>
<text x="20" y="472" font-size="11" fill="#6B7280" text-anchor="start">⚠️ 단계별 신뢰도 라우팅: 신뢰도 산출 방식이 문항에 없음 · 10장 confidence 규칙과 상충 소지</text>
</g>
</svg>
