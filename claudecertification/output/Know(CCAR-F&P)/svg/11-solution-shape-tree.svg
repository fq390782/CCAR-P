<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-label="문제 형태가 갱신 지식, 월 갱신 인용, 고정 분류, 형태가 다른 두 문제 중 무엇인지에 따라 구조를 고르는 decision tree">
<title>문제 형태에 따라 적합한 구조를 고르는 판단 흐름</title>
<defs><marker id="arr-solution-shape-tree" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<g font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">
<text x="450.0" y="28" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">사실이 필요하면 retrieval · 동작이 필요하면 classifier</text>
<polygon points="450,70.0 570.0,108 450,146.0 330.0,108" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
<text x="450" y="112.4" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">문제 형태는?</text>
<polyline points="450,146 450,166" fill="none" stroke="#1F2937" stroke-width="1.5"/>
<polyline points="120,166 780,166" fill="none" stroke="#1F2937" stroke-width="1.5"/>
<polyline points="120,166 120,188" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-solution-shape-tree)"/>
<text x="126" y="181" font-size="11" fill="#1F2937" text-anchor="start">사실</text>
<rect x="20" y="188" width="200" height="60" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="120.0" y="208.4" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">자주 바뀌는 지식</text>
<text x="120.0" y="222.7" font-size="11" fill="#1F2937" text-anchor="middle">매일 바뀌는 대규모 카탈로그</text>
<text x="120.0" y="236.7" font-size="11" fill="#1F2937" text-anchor="middle">제품 질문</text>
<polyline points="120,248 120,282" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-solution-shape-tree)"/>
<text x="126" y="270" font-size="11" fill="#1F2937" text-anchor="start">적합한 구조</text>
<rect x="20" y="282" width="200" height="84" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="120.0" y="307.4" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">갱신되는 index 검색</text>
<text x="120.0" y="321.7" font-size="11" fill="#1F2937" text-anchor="middle">+ 검색 context로 답변</text>
<text x="120.0" y="335.7" font-size="11" fill="#1F2937" text-anchor="middle">갱신 지식 = 검색의 몫</text>
<text x="120.0" y="349.7" font-size="11" fill="#1F2937" text-anchor="middle">(가중치 · context window ✗)</text>
<rect x="20" y="382" width="200" height="84" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="120.0" y="407.4" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">기각 대상</text>
<text x="120.0" y="421.7" font-size="11" fill="#1F2937" text-anchor="middle">매일 밤 fine-tune</text>
<text x="120.0" y="435.7" font-size="11" fill="#1F2937" text-anchor="middle">카탈로그 system prompt 적재</text>
<text x="120.0" y="449.7" font-size="11" fill="#1F2937" text-anchor="middle">공개 웹 탐색 자율 agent</text>
<polyline points="340,166 340,188" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-solution-shape-tree)"/>
<text x="346" y="181" font-size="11" fill="#1F2937" text-anchor="start">사실</text>
<rect x="240" y="188" width="200" height="60" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="340.0" y="215.4" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">월 갱신 300페이지 매뉴얼</text>
<text x="340.0" y="229.7" font-size="11" fill="#1F2937" text-anchor="middle">단일 턴 · 인용 필요</text>
<polyline points="340,248 340,282" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-solution-shape-tree)"/>
<text x="346" y="270" font-size="11" fill="#1F2937" text-anchor="start">적합한 구조</text>
<rect x="240" y="282" width="200" height="84" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="340.0" y="307.4" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">augmented LLM</text>
<text x="340.0" y="321.7" font-size="11" fill="#1F2937" text-anchor="middle">retrieval + 단일 호출</text>
<text x="340.0" y="335.7" font-size="11" fill="#1F2937" text-anchor="middle">+ 구절 인용</text>
<text x="340.0" y="349.7" font-size="11" fill="#1F2937" text-anchor="middle">범위 정해진 근거 호출 하나로 충족</text>
<rect x="240" y="382" width="200" height="84" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="340.0" y="407.4" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">기각 대상</text>
<text x="340.0" y="421.7" font-size="11" fill="#1F2937" text-anchor="middle">매월 fine-tuning</text>
<text x="340.0" y="435.7" font-size="11" fill="#1F2937" text-anchor="middle">(재인덱싱보다 느림 · 인용 ✗)</text>
<text x="340.0" y="449.7" font-size="11" fill="#1F2937" text-anchor="middle">자율 agent · multi-agent 리서치</text>
<polyline points="560,166 560,188" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-solution-shape-tree)"/>
<text x="566" y="181" font-size="11" fill="#1F2937" text-anchor="start">동작</text>
<rect x="460" y="188" width="200" height="60" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="560.0" y="208.4" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">고정 카테고리 분류</text>
<text x="560.0" y="222.7" font-size="11" fill="#1F2937" text-anchor="middle">안정적 정의 · retrieval 불필요</text>
<text x="560.0" y="236.7" font-size="11" fill="#1F2937" text-anchor="middle">예: 티켓 분류</text>
<polyline points="560,248 560,282" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-solution-shape-tree)"/>
<text x="566" y="270" font-size="11" fill="#1F2937" text-anchor="start">적합한 구조</text>
<rect x="460" y="282" width="200" height="84" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="560.0" y="314.4" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">classifier</text>
<text x="560.0" y="328.7" font-size="11" fill="#1F2937" text-anchor="middle">fine-tuned 또는 규칙 기반</text>
<text x="560.0" y="342.7" font-size="11" fill="#1F2937" text-anchor="middle">필요한 것 = 안정적 동작 (사실 ✗)</text>
<rect x="460" y="382" width="200" height="84" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="560.0" y="407.4" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">기각 대상</text>
<text x="560.0" y="421.7" font-size="11" fill="#1F2937" text-anchor="middle">고정 카테고리에 RAG</text>
<text x="560.0" y="435.7" font-size="11" fill="#1F2937" text-anchor="middle">retrieval = 토큰만 추가</text>
<text x="560.0" y="449.7" font-size="11" fill="#1F2937" text-anchor="middle">경계 불변</text>
<polyline points="780,166 780,188" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-solution-shape-tree)"/>
<text x="786" y="181" font-size="11" fill="#1F2937" text-anchor="start">두 문제</text>
<rect x="680" y="188" width="200" height="60" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="780.0" y="208.4" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">형태가 다른 두 문제</text>
<text x="780.0" y="222.7" font-size="11" fill="#1F2937" text-anchor="middle">정책 질문 인용 답변</text>
<text x="780.0" y="236.7" font-size="11" fill="#1F2937" text-anchor="middle">+ 결정 데이터 → 통지서</text>
<polyline points="780,248 780,282" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-solution-shape-tree)"/>
<text x="786" y="270" font-size="11" fill="#1F2937" text-anchor="start">적합한 구조</text>
<rect x="680" y="282" width="200" height="84" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="780.0" y="307.4" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">단순 구성요소 둘</text>
<text x="780.0" y="321.7" font-size="11" fill="#1F2937" text-anchor="middle">검색 증강 답변 서비스</text>
<text x="780.0" y="335.7" font-size="11" fill="#1F2937" text-anchor="middle">+ 템플릿 생성 workflow</text>
<text x="780.0" y="349.7" font-size="11" fill="#1F2937" text-anchor="middle">독립 테스트 · 각자 자체 지표</text>
<rect x="680" y="382" width="200" height="84" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="780.0" y="407.4" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">기각 대상</text>
<text x="780.0" y="421.7" font-size="11" fill="#1F2937" text-anchor="middle">두 작업을 multi-agent 하나로</text>
<text x="780.0" y="435.7" font-size="11" fill="#1F2937" text-anchor="middle">모든 도구를 가진 단일 agent</text>
<text x="780.0" y="449.7" font-size="11" fill="#1F2937" text-anchor="middle">두 작업을 fine-tuned 모델 하나로</text>
<text x="20" y="492" font-size="11" fill="#6B7280" text-anchor="start">RAG가 정답으로 바뀌는 조건 = 카테고리가 매주 변경 · 감사 담당자가 출처 요구</text>
</g>
</svg>
