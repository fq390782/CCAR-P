<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" role="img" aria-label="독립 리뷰어가 파일별 집중 pass를 돌리고 통합 pass로 합치는 구조" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">
<title>독립 리뷰어가 파일별 집중 pass를 돌리고 통합 pass로 합치는 구조</title>
<defs><marker id="arr-multipass-review" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="20" y="36" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="start">리뷰는 생성과 분리 · 큰 입력은 파일별 pass + 통합 pass</text>
<rect x="20" y="170" width="120" height="84" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="80.0" y="200.9" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">생성 session</text>
<text x="80.0" y="216.3" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="middle">생성 시 추론 ·</text>
<text x="80.0" y="231.3" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="middle">전제를 보유</text>
<rect x="215" y="75" width="185" height="287" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="307.5" y="173.4" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">입력 한정 템플릿</text>
<text x="307.5" y="190.6" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="middle">diff · 요구사항 명세 ·</text>
<text x="307.5" y="207.6" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="middle">리뷰 기준만</text>
<text x="307.5" y="224.6" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="middle">생성 시 추론 · 대화 기록은</text>
<text x="307.5" y="241.6" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="middle">미전달</text>
<text x="307.5" y="256.9" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="middle">별도 instance = 독립성 조건 둘</text>
<text x="307.5" y="271.9" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="middle">다 충족</text>
<polyline points="140,212 215,212" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-multipass-review)"/>
<rect x="151.0" y="194.0" width="52.0" height="16" fill="#FFFFFF"/>
<text x="177" y="206" font-size="11" font-weight="normal" fill="#1F2937" text-anchor="middle">산출물만</text>
<rect x="450" y="75" width="190" height="62" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="545.0" y="102.4" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">파일 A 집중 pass</text>
<text x="545.0" y="117.8" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="middle">같은 깊이 확보</text>
<polyline points="400,106 450,106" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-multipass-review)"/>
<rect x="410.0" y="88.0" width="30.0" height="16" fill="#FFFFFF"/>
<text x="425" y="100" font-size="11" font-weight="normal" fill="#1F2937" text-anchor="middle">리뷰</text>
<polyline points="640,106 700,106" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-multipass-review)"/>
<rect x="655.0" y="88.0" width="30.0" height="16" fill="#FFFFFF"/>
<text x="670" y="100" font-size="11" font-weight="normal" fill="#1F2937" text-anchor="middle">결과</text>
<rect x="450" y="181" width="190" height="62" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="545.0" y="208.4" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">파일 B 집중 pass</text>
<text x="545.0" y="223.8" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="middle">같은 깊이 확보</text>
<polyline points="400,212 450,212" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-multipass-review)"/>
<polyline points="640,212 700,212" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-multipass-review)"/>
<rect x="450" y="287" width="190" height="62" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="545.0" y="314.4" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">파일 N 집중 pass</text>
<text x="545.0" y="329.9" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="middle">14~42개 파일 각각</text>
<polyline points="400,318 450,318" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-multipass-review)"/>
<polyline points="640,318 700,318" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-multipass-review)"/>
<rect x="700" y="75" width="180" height="287" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="790.0" y="179.9" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">통합 pass</text>
<text x="790.0" y="197.1" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="middle">입력 = 파일별 결과 +</text>
<text x="790.0" y="214.1" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="middle">변경된 interface 목록</text>
<text x="790.0" y="231.1" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="middle">파일 간 문제: 의존성 ·</text>
<text x="790.0" y="248.1" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="middle">데이터 흐름 · 필드명 변경</text>
<text x="790.0" y="265.1" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="middle">미반영</text>
<rect x="20" y="386" width="280" height="76" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="160.0" y="411.9" font-size="11" font-weight="normal" fill="#1F2937" text-anchor="middle">같은 session 자기 리뷰 → 생성 시 추론 그대로 보유</text>
<text x="160.0" y="426.9" font-size="11" font-weight="normal" fill="#1F2937" text-anchor="middle">→ 확증 편향 (extended thinking 예산을 늘려도</text>
<text x="160.0" y="441.9" font-size="11" font-weight="normal" fill="#1F2937" text-anchor="middle">불변)</text>
<rect x="310" y="386" width="280" height="76" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="450.0" y="419.4" font-size="11" font-weight="normal" fill="#1F2937" text-anchor="middle">single-pass 대형 PR → attention dilution →</text>
<text x="450.0" y="434.4" font-size="11" font-weight="normal" fill="#1F2937" text-anchor="middle">깊이 편차 · 뻔한 버그 누락 · 모순 피드백</text>
<rect x="600" y="386" width="280" height="76" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
<text x="740.0" y="419.4" font-size="11" font-weight="normal" fill="#1F2937" text-anchor="middle">국소 pass + 횡단 통합 pass 둘 다 필요 · 한쪽만</text>
<text x="740.0" y="434.4" font-size="11" font-weight="normal" fill="#1F2937" text-anchor="middle">있으면 다른 쪽 결함 누락</text>
</svg>
