<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-label="데이터 유형과 관할권에서 프레임워크, 설계 요구, Claude 쪽 선택으로 이어지는 매핑">
<title>데이터 유형과 관할권에서 프레임워크, 설계 요구, Claude 쪽 선택으로 이어지는 매핑</title>
<defs><marker id="arr-regulatory-mapping" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<g font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">
<text x="400.0" y="28" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">프레임워크는 데이터 유형 · 관할권이 결정</text>
