<svg xmlns="http://www.w3.org/2000/svg" width="900" height="580" viewBox="0 0 900 580" role="img" aria-label="단일 통합 지점과 외부 호출 장애를 계층으로 막는 구조" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">
<title>단일 통합 지점과 외부 호출 장애를 계층으로 막는 구조</title>
<defs><marker id="arr-integration-failure-isolation" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="450" y="24" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">단일 통합 지점 · 느슨한 결합 · 외부 호출 장애는 계층 방어</text>
<rect x="20" y="50" width="100" height="70" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="70.0" y="88.5" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="middle">앱</text>
<rect x="180" y="50" width="260" height="70" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="310.0" y="73.9" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">내부 서비스</text>
<text x="310.0" y="89.3" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="middle">인증 · rate limiting · 로깅 · 모델 라우팅을</text>
<text x="310.0" y="104.3" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="middle">한 곳에서 일관 적용</text>
<rect x="500" y="50" width="80" height="70" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="540.0" y="88.5" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="middle">Claude</text>
<polyline points="120,85 180,85" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-integration-failure-isolation)"/>
<rect x="135.0" y="77.0" width="30.0" height="16" fill="#FFFFFF"/>
<text x="150.0" y="89.0" font-size="11" font-weight="normal" fill="#1F2937" text-anchor="middle">요청</text>
<polyline points="440,85 500,85" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-integration-failure-isolation)"/>
<rect x="455.0" y="77.0" width="30.0" height="16" fill="#FFFFFF"/>
<text x="470.0" y="89.0" font-size="11" font-weight="normal" fill="#1F2937" text-anchor="middle">호출</text>
<rect x="180" y="130" width="260" height="44" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="310.0" y="147.3" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="middle">안 바뀌는 것: 토큰 단가 · 평가 필요성</text>
<text x="310.0" y="162.3" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="middle">추가 hop = 일반적으로 지연 증가</text>
<rect x="620" y="50" width="260" height="124" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="750.0" y="92.3" font-size="11" font-weight="normal" fill="#1F2937" text-anchor="middle">추상화 없이 단일 클라우드 서비스에</text>
<text x="750.0" y="107.3" font-size="11" font-weight="normal" fill="#1F2937" text-anchor="middle">직접 결합 ✗</text>
<text x="750.0" y="122.3" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="middle">→ 결합이 앱 코드까지 확산</text>
<text x="750.0" y="137.3" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="middle">→ 나중에 옮기는 비용 증가</text>
<line x1="20" y1="196" x2="880" y2="196" stroke="#9CA3AF" stroke-width="1"/>
<text x="20" y="220" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="start">소유자 · 도구 · 정책이 다른 외부 AI agent 호출: 외부 API 성능 저하 시 계층 방어</text>
<text x="560" y="244" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">방어 계층</text>
<text x="765" y="244" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">오답</text>
<rect x="20" y="300" width="150" height="80" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="95.0" y="336.1" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="middle">외부 API 성능 저하</text>
<text x="95.0" y="351.4" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="middle">예: 제휴사 40초 응답</text>
<rect x="330" y="256" width="230" height="58" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="445.0" y="281.4" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">timeout</text>
<text x="445.0" y="296.9" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="middle">worker 무기한 정지 방지</text>
<rect x="630" y="256" width="250" height="58" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="755.0" y="280.4" font-size="11" font-weight="normal" fill="#1F2937" text-anchor="middle">timeout 완전 제거 ✗</text>
<text x="755.0" y="295.4" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="middle">→ 느린 제휴사 1곳이 worker를 무기한 정지</text>
<polyline points="170,340 205,340 205,285.0 330,285.0" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-integration-failure-isolation)"/>
<rect x="227.5" y="277.0" width="81.0" height="16" fill="#FFFFFF"/>
<text x="268" y="289.0" font-size="11" font-weight="normal" fill="#1F2937" text-anchor="middle">대기 시간 제한</text>
<rect x="330" y="326" width="230" height="58" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="445.0" y="351.4" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">bulkhead</text>
<text x="445.0" y="366.9" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="middle">동시 호출 제한</text>
<rect x="630" y="326" width="250" height="58" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="755.0" y="350.4" font-size="11" font-weight="normal" fill="#1F2937" text-anchor="middle">모든 제휴사 요청을 직렬 큐 처리 ✗</text>
<text x="755.0" y="365.4" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="middle">→ 40초 응답이 사용자의 무한 지연으로</text>
<polyline points="170,340 205,340 205,355.0 330,355.0" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-integration-failure-isolation)"/>
<rect x="222.0" y="347.0" width="92.0" height="16" fill="#FFFFFF"/>
<text x="268" y="359.0" font-size="11" font-weight="normal" fill="#1F2937" text-anchor="middle">자원 소모량 제한</text>
<rect x="330" y="396" width="230" height="58" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="445.0" y="421.4" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">circuit breaker</text>
<text x="445.0" y="436.9" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="middle">반복 실패 후 차단</text>
<rect x="630" y="396" width="250" height="58" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="755.0" y="420.4" font-size="11" font-weight="normal" fill="#1F2937" text-anchor="middle">retry budget 증가 + backoff ✗</text>
<text x="755.0" y="435.4" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="middle">→ retry storm · 과부하 심화</text>
<polyline points="170,340 205,340 205,425.0 330,425.0" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-integration-failure-isolation)"/>
<rect x="222.0" y="417.0" width="92.0" height="16" fill="#FFFFFF"/>
<text x="268" y="429.0" font-size="11" font-weight="normal" fill="#1F2937" text-anchor="middle">재시도 누적 차단</text>
<rect x="330" y="466" width="230" height="58" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="445.0" y="491.4" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">graceful fallback</text>
<text x="445.0" y="506.9" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="middle">예: "캐시된 요금을 표시"</text>
<rect x="630" y="466" width="250" height="58" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="755.0" y="490.4" font-size="11" font-weight="normal" fill="#1F2937" text-anchor="middle">retry budget 증가 ✗</text>
<text x="755.0" y="505.4" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="middle">→ 사용자는 여전히 대기</text>
<polyline points="170,340 205,340 205,495.0 330,495.0" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-integration-failure-isolation)"/>
<rect x="234.7" y="487.0" width="66.5" height="16" fill="#FFFFFF"/>
<text x="268" y="499.0" font-size="11" font-weight="normal" fill="#1F2937" text-anchor="middle">응답성 유지</text>
</svg>
