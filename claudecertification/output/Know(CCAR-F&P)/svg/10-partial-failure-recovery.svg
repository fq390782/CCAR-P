<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-label="8개국 병렬 검색에서 A국 권한 오류가 났을 때 성공분 보존과 실패분 재위임">
<title>8개국 병렬 검색에서 A국 권한 오류가 났을 때 성공분 보존과 실패분 재위임</title>
<defs><marker id="arr-partial-failure-recovery" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<g font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">
<text x="450" y="28" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">부분 실패: 성공분은 그대로 쓰고, 실패분만 대체 수단으로 다시 위임</text>
<rect x="20" y="70" width="130" height="270" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="85" y="202.3" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">coordinator</text>
<text x="85" y="217.2" font-size="11" fill="#1F2937" text-anchor="middle">8개국 병렬 위임</text>
<polyline points="150,105 205,105" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-partial-failure-recovery)"/>
<text x="177" y="97" font-size="11" fill="#1F2937" text-anchor="middle">성공 7곳</text>
<polyline points="150,290 205,290" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-partial-failure-recovery)"/>
<text x="177" y="282" font-size="11" fill="#1F2937" text-anchor="middle">A국 실패</text>
<rect x="205" y="70" width="220" height="70" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
<text x="315" y="102.3" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">7개국 성공</text>
<text x="315" y="117.2" font-size="11" fill="#1F2937" text-anchor="middle">결과 수신</text>
<rect x="205" y="240" width="220" height="100" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="315" y="280.1" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">A국: 권한 오류</text>
<text x="315" y="295" font-size="11" fill="#1F2937" text-anchor="middle">structured error 반환</text>
<text x="315" y="309.3" font-size="11" fill="#1F2937" text-anchor="middle">대체 수단: 관보 리콜 공시</text>
<polyline points="425,105 480,105" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-partial-failure-recovery)"/>
<text x="452" y="97" font-size="11" fill="#1F2937" text-anchor="middle">그대로</text>
<polyline points="425,290 480,290" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-partial-failure-recovery)"/>
<text x="452" y="282" font-size="11" fill="#1F2937" text-anchor="middle">에러 읽기</text>
<rect x="480" y="70" width="220" height="70" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
<text x="590" y="102.3" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">재검색 없이 통합에 사용</text>
<text x="590" y="117.2" font-size="11" fill="#1F2937" text-anchor="middle">성공 7개국 결과 보존</text>
<rect x="480" y="240" width="220" height="100" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="590" y="280.1" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">대체 수단으로 복구</text>
<text x="590" y="295" font-size="11" fill="#1F2937" text-anchor="middle">에러의 대체 수단을 읽고</text>
<text x="590" y="309.3" font-size="11" fill="#1F2937" text-anchor="middle">A국만 관보 검색을 위임</text>
<polyline points="700,105 750,105" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-partial-failure-recovery)"/>
<text x="725" y="97" font-size="11" fill="#1F2937" text-anchor="middle">7곳</text>
<polyline points="700,290 750,290" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-partial-failure-recovery)"/>
<text x="725" y="282" font-size="11" fill="#1F2937" text-anchor="middle">관보 결과</text>
<rect x="750" y="70" width="130" height="270" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
<text x="815" y="195.1" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">통합</text>
<text x="815" y="210" font-size="11" fill="#1F2937" text-anchor="middle">성공 7개국 + A국 관보</text>
<text x="815" y="224.3" font-size="11" fill="#1F2937" text-anchor="middle">검색 결과</text>
<text x="20" y="382" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">오답: 실패분만 다루지 못함</text>
<rect x="20" y="394" width="280" height="70" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="160" y="426.3" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">8개국 전체 재위임</text>
<text x="160" y="441.2" font-size="11" fill="#1F2937" text-anchor="middle">권한 오류 3회 반복 · 비용 약 4배</text>
<rect x="310" y="394" width="280" height="70" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="450" y="426.3" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">권한 오류에 backoff retry 3회</text>
<text x="450" y="441.2" font-size="11" fill="#1F2937" text-anchor="middle">기다려도 해소 ✗</text>
<rect x="600" y="394" width="280" height="70" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="740" y="426.3" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">예외 전파 → 전체 종료</text>
<text x="740" y="441.2" font-size="11" fill="#1F2937" text-anchor="middle">12개 지역 중 1곳 timeout → 11곳 결과 폐기</text>
<rect x="20" y="484" width="860" height="52" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="450" y="507.3" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">같은 원리 (tool 호출 수준)</text>
<text x="450" y="522.2" font-size="11" fill="#1F2937" text-anchor="middle">get_customer 성공 + lookup_order timeout → 성공 결과 + is_error: true 실패 결과를 둘 다 반환 · 대화 계속</text>
</g>
</svg>
