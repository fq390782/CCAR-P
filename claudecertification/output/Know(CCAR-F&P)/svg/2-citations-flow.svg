<svg xmlns="http://www.w3.org/2000/svg" width="900" height="365" viewBox="0 0 900 365" role="img" aria-label="citations 흐름과 프롬프트 출처 표시 비교" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">
<title>citations 흐름과 프롬프트 출처 표시 비교</title>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<defs><marker id="arr-citations-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker></defs>
<text x="450" y="28" font-size="14" text-anchor="middle" fill="#1F2937" font-weight="bold">주장마다 출처가 필요하면 citations 기능: 원문 구간과 연결된 구조화 span이 돌아온다</text>
<rect x="30" y="60" width="210" height="70" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="135.0" y="91.0" font-size="13" text-anchor="middle" fill="#1F2937">document content block</text>
<text x="135.0" y="108.0" font-size="11" text-anchor="middle" fill="#6B7280">원문 문서</text>
<rect x="30" y="140" width="210" height="40" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="135.0" y="164.5" font-size="13" text-anchor="middle" fill="#1F2937">citations: {enabled: true}</text>
<rect x="320" y="80" width="140" height="70" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="390.0" y="119.5" font-size="13" text-anchor="middle" fill="#1F2937">Claude</text>
<polyline points="240,115 320,115" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-citations-flow)"/>
<rect x="540" y="60" width="340" height="110" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="710" y="82" font-size="14" text-anchor="middle" fill="#1F2937" font-weight="bold">응답</text>
<rect x="555" y="92" width="150" height="64" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="630.0" y="128.5" font-size="12" text-anchor="middle" fill="#1F2937">주장 텍스트</text>
<rect x="715" y="92" width="150" height="64" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
<text x="790.0" y="120.0" font-size="12" text-anchor="middle" fill="#1F2937">citation span</text>
<text x="790.0" y="137.0" font-size="11" text-anchor="middle" fill="#6B7280">원문 구간에 연결</text>
<polyline points="460,115 540,115" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-citations-flow)"/>
<polyline points="790,170 790,205" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-citations-flow)"/>
<rect x="640" y="205" width="240" height="44" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
<text x="760.0" y="231.5" font-size="12" text-anchor="middle" fill="#1F2937">주장별 출처 표시·검증 (RAG, 감사)</text>
<text x="30" y="232" font-size="13" text-anchor="start" fill="#DC2626" font-weight="bold">안티패턴: 검증되지 않은 자유 텍스트</text>
<rect x="30" y="245" width="260" height="70" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="160.0" y="267.5" font-size="13" text-anchor="middle" fill="#1F2937">프롬프트로 [source] 표시,</text>
<text x="160.0" y="284.5" font-size="13" text-anchor="middle" fill="#1F2937">페이지 번호 쓰게 하기</text>
<text x="160.0" y="301.5" font-size="11" text-anchor="middle" fill="#6B7280">JSON sources 배열 받기</text>
<rect x="320" y="245" width="230" height="70" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="435.0" y="276.0" font-size="13" text-anchor="middle" fill="#1F2937">별도 호출로</text>
<text x="435.0" y="293.0" font-size="13" text-anchor="middle" fill="#1F2937">출처를 나중에 추론하기</text>
<rect x="600" y="260" width="280" height="55" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="740.0" y="283.5" font-size="13" text-anchor="middle" fill="#1F2937">원문과 연결되지 않음</text>
<text x="740.0" y="300.5" font-size="13" text-anchor="middle" fill="#1F2937">→ 신뢰·검증 불가</text>
<polyline points="550,287 600,287" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-citations-flow)"/>
<polyline points="160,315 160,340 740,340 740,315" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-citations-flow)"/>
</svg>
