<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520" role="img" aria-label="snapshot을 pin하고, 업그레이드는 eval을 거친 의도적 변경으로">
<title>snapshot을 pin하고, 업그레이드는 eval을 거친 의도적 변경으로</title>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<defs><marker id="arr-version-pinning" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker><marker id="arr-version-pinning-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker></defs>
<g font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">
<text x="460" y="30" font-size="14" text-anchor="middle" fill="#1F2937" font-weight="bold">snapshot을 pin하고, 업그레이드는 eval을 거친 의도적 변경으로</text>
<rect x="20" y="70" width="200" height="56" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="120" y="94.55" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="bold">production: snapshot pin</text>
<text x="120" y="110.85" font-size="11" text-anchor="middle" fill="#6B7280">weight 고정 · 재현성 · audit</text>
<polyline points="220,98 278,98" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-version-pinning)"/>
<rect x="222.308" y="81" width="53.3846" height="15" fill="#FFFFFF"/>
<text x="249" y="92" font-size="11" text-anchor="middle" fill="#1F2937">시간 경과</text>
<rect x="280" y="70" width="190" height="56" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="375" y="94.55" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="bold">새 모델 출시</text>
<text x="375" y="110.85" font-size="11" text-anchor="middle" fill="#6B7280">새 model ID로 제공</text>
<polyline points="470,98 528,98" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-version-pinning)"/>
<rect x="466.808" y="81" width="64.3846" height="15" fill="#FFFFFF"/>
<text x="499" y="92" font-size="11" text-anchor="middle" fill="#1F2937">의도적 검토</text>
<rect x="530" y="70" width="190" height="56" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="625" y="93.55" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="bold">eval set으로</text>
<text x="625" y="111.55" font-size="13" text-anchor="middle" fill="#1F2937">새 ID 검증</text>
<polyline points="625,126 625,178" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-version-pinning)"/>
<polygon points="625,180.0 715.0,230 625,280.0 535.0,230" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
<text x="625" y="225.55" font-size="13" text-anchor="middle" fill="#1F2937">quality bar</text>
<text x="625" y="243.55" font-size="13" text-anchor="middle" fill="#1F2937">통과?</text>
<polyline points="715,230 758,230" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-version-pinning)"/>
<rect x="728" y="213" width="17" height="15" fill="#FFFFFF"/>
<text x="736.5" y="224" font-size="11" text-anchor="middle" fill="#1F2937">예</text>
<rect x="760" y="202" width="140" height="56" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
<text x="830" y="225.55" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="bold">pin을 새 ID로</text>
<text x="830" y="243.55" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="bold">변경</text>
<polyline points="535,230 497,230" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-version-pinning)"/>
<rect x="496.5" y="213" width="39" height="15" fill="#FFFFFF"/>
<text x="516" y="224" font-size="11" text-anchor="middle" fill="#1F2937">아니오</text>
<rect x="355" y="208" width="140" height="44" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="425" y="234.55" font-size="13" text-anchor="middle" fill="#1F2937">기존 pin 유지</text>
<polyline points="830,258 830,300 120,300 120,128" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-version-pinning)"/>
<rect x="398.038" y="283" width="143.923" height="15" fill="#FFFFFF"/>
<text x="470" y="294" font-size="11" text-anchor="middle" fill="#1F2937">새 snapshot으로 다시 고정</text>
<rect x="20" y="320" width="880" height="44" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="460" y="346.55" font-size="13" text-anchor="middle" fill="#1F2937">pinning ≠ 영구: model ID마다 retirement 일정 → 그 날짜 전에 이 흐름으로 후속 모델 검증 · 이전</text>
<rect x="20" y="380" width="880" height="80" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="460" y="406.55" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="bold">✗ 오답</text>
<text x="460" y="424.55" font-size="13" text-anchor="middle" fill="#1F2937">미고정 상태로 운영 → 모델 업데이트로 refusal 등 동작 변화</text>
<text x="460" y="442.55" font-size="13" text-anchor="middle" fill="#1F2937">prompt로 "이전 모델처럼" 지시 · 다른 provider로 failover · 에러를 빈 응답 처리</text>
<text x="460" y="490" font-size="11" text-anchor="middle" fill="#6B7280">"pin하면 더 싸다 · 영구 사용 · 개선 자동 반영"도 모두 틀림. 같은 ID라도 router · safety classifier 업데이트로 동작이 약간 달라질 수 있음</text>
</g>
</svg>
