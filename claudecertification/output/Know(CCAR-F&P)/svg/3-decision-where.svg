<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-label="판단 트리: 모델 판단 없이 매번 지켜야 하면 settings로 강제하고 적용 대상에 따라 파일을 고르며, 알려 주기만 하면 필요 빈도에 따라 CLAUDE.md, skill, subagent를 고른다" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">
  <title>규칙과 정보를 어디에 둘지 판단 트리</title>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <defs>
    <marker id="arr-dwhere" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker>
  </defs>

  <!-- root -->
  <polygon points="480,30 690,76 480,122 270,76" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="480" y="72" text-anchor="middle" font-size="13" fill="#1F2937">"확실히, 매번, 모델 판단 없이"</text>
  <text x="480" y="90" text-anchor="middle" font-size="13" fill="#1F2937">지켜야 하나?</text>

  <polyline points="270,76 240,76 240,168" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-dwhere)"/>
  <text x="232" y="130" text-anchor="end" font-size="11" fill="#6B7280">아니오: 알려 주기만</text>
  <polyline points="690,76 719,76 719,168" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-dwhere)"/>
  <text x="727" y="124" font-size="11" fill="#6B7280">예: settings로 강제</text>
  <text x="727" y="140" font-size="11" fill="#6B7280">(permissions · hooks)</text>

  <!-- left diamond -->
  <polygon points="240,170 350,210 240,250 130,210" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="240" y="215" text-anchor="middle" font-size="13" fill="#1F2937">언제 필요한가?</text>
  <polyline points="240,250 240,280" fill="none" stroke="#1F2937" stroke-width="1.5"/>
  <polyline points="90,280 390,280" fill="none" stroke="#1F2937" stroke-width="1.5"/>
  <line x1="90" y1="280" x2="90" y2="318" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-dwhere)"/>
  <line x1="240" y1="280" x2="240" y2="318" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-dwhere)"/>
  <line x1="390" y1="280" x2="390" y2="318" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-dwhere)"/>
  <text x="84" y="304" text-anchor="end" font-size="11" fill="#6B7280">매 세션</text>
  <text x="234" y="304" text-anchor="end" font-size="11" fill="#6B7280">가끔</text>
  <text x="384" y="304" text-anchor="end" font-size="11" fill="#6B7280">대량 탐색</text>

  <rect x="20" y="320" width="140" height="76" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="90" y="344" text-anchor="middle" font-size="13" fill="#1F2937">CLAUDE.md</text>
  <text x="90" y="364" text-anchor="middle" font-size="11" fill="#6B7280">저장소 루트에 커밋</text>
  <text x="90" y="381" text-anchor="middle" font-size="11" fill="#6B7280">빌드 명령·규약</text>
  <rect x="170" y="320" width="140" height="76" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="240" y="344" text-anchor="middle" font-size="13" fill="#1F2937">skill</text>
  <text x="240" y="364" text-anchor="middle" font-size="11" fill="#6B7280">긴 절차·참고 자료</text>
  <text x="240" y="381" text-anchor="middle" font-size="11" fill="#6B7280">필요할 때 본문 로드</text>
  <rect x="320" y="320" width="140" height="76" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="390" y="344" text-anchor="middle" font-size="13" fill="#1F2937">subagent</text>
  <text x="390" y="364" text-anchor="middle" font-size="11" fill="#6B7280">독립 컨텍스트</text>
  <text x="390" y="381" text-anchor="middle" font-size="11" fill="#6B7280">요약만 반환</text>

  <!-- right diamond -->
  <polygon points="719,170 829,210 719,250 609,210" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="719" y="215" text-anchor="middle" font-size="13" fill="#1F2937">누구에게 적용?</text>
  <polyline points="719,250 719,280" fill="none" stroke="#1F2937" stroke-width="1.5"/>
  <polyline points="563,280 875,280" fill="none" stroke="#1F2937" stroke-width="1.5"/>
  <line x1="563" y1="280" x2="563" y2="318" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-dwhere)"/>
  <line x1="719" y1="280" x2="719" y2="318" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-dwhere)"/>
  <line x1="875" y1="280" x2="875" y2="318" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-dwhere)"/>
  <text x="557" y="304" text-anchor="end" font-size="11" fill="#6B7280">팀 전원</text>
  <text x="713" y="304" text-anchor="end" font-size="11" fill="#6B7280">이 프로젝트의 나</text>
  <text x="869" y="304" text-anchor="end" font-size="11" fill="#6B7280">나, 모든 프로젝트</text>

  <rect x="490" y="320" width="146" height="76" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="563" y="342" text-anchor="middle" font-size="12" fill="#1F2937">.claude/</text>
  <text x="563" y="359" text-anchor="middle" font-size="12" fill="#1F2937">settings.json</text>
  <text x="563" y="381" text-anchor="middle" font-size="11" fill="#6B7280">커밋, PR 리뷰</text>
  <rect x="646" y="320" width="146" height="76" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="719" y="342" text-anchor="middle" font-size="12" fill="#1F2937">.claude/</text>
  <text x="719" y="359" text-anchor="middle" font-size="12" fill="#1F2937">settings.local.json</text>
  <text x="719" y="381" text-anchor="middle" font-size="11" fill="#6B7280">gitignore, 팀 영향 없음</text>
  <rect x="802" y="320" width="146" height="76" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="875" y="342" text-anchor="middle" font-size="12" fill="#1F2937">~/.claude/</text>
  <text x="875" y="359" text-anchor="middle" font-size="12" fill="#1F2937">settings.json</text>
  <text x="875" y="381" text-anchor="middle" font-size="11" fill="#6B7280">개인 취향 설정</text>

  <!-- anti -->
  <rect x="20" y="416" width="928" height="66" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="484" y="438" text-anchor="middle" font-size="13" fill="#1F2937">오답: "매번" 규칙을 프롬프트·CLAUDE.md·subagent로 처리 (모델 판단에 의존하는 확률적 방법)</text>
  <text x="484" y="461" text-anchor="middle" font-size="11" fill="#6B7280">개인 허용을 .claude/settings.json에 커밋 → 팀원 전원의 권한이 바뀜 · 팀 배포에 settings.local.json이나 각자의 ~/.claude 사용</text>
</svg>
