<svg xmlns="http://www.w3.org/2000/svg" width="920" height="470" viewBox="0 0 920 470" role="img" aria-label="Session 옵션 비교: continue는 최신 session, resume은 지정 session, fork는 이력을 복사한 새 session" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">
<title>Session 옵션 비교: continue는 최신 session, resume은 지정 session, fork는 이력을 복사한 새 session</title>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<defs><marker id="arr-session-k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker><marker id="arr-session-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker><marker id="arr-session-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="arr-session-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/></marker></defs>
<text x="20" y="30" font-size="14" fill="#1F2937" text-anchor="start" font-weight="bold">Session — continue · resume · fork</text>
<rect x="20" y="60" width="160" height="292" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="100.0" y="203.1" font-size="13" fill="#1F2937" text-anchor="middle" font-weight="bold">원본 session</text>
<text x="100.0" y="218.3" font-size="11" fill="#6B7280" text-anchor="middle">대화 이력 + session ID</text>
<rect x="270" y="60" width="320" height="88" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="430.0" y="93.5" font-size="13" fill="#1F2937" text-anchor="middle" font-weight="bold">continue</text>
<text x="430.0" y="108.8" font-size="11" fill="#6B7280" text-anchor="middle">continue_conversation=True · claude --continue</text>
<text x="430.0" y="123.8" font-size="11" fill="#6B7280" text-anchor="middle">현재 디렉터리의 최신 session 재개</text>
<rect x="640" y="60" width="260" height="88" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="770.0" y="93.5" font-size="13" fill="#1F2937" text-anchor="middle">최신이 곧 대상일 때</text>
<text x="770.0" y="108.8" font-size="11" fill="#6B7280" text-anchor="middle">분기 원본 보장 ✗</text>
<text x="770.0" y="123.8" font-size="11" fill="#6B7280" text-anchor="middle">병행 조사 → 엉뚱한 session이 열림</text>
<path d="M180,104 L270,104" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-session-k)"/>
<rect x="195.5" y="84.0" width="59.0" height="16" fill="#FFFFFF"/>
<text x="225" y="95.0" font-size="11" fill="#1F2937" text-anchor="middle">continue</text>
<path d="M590,104 L640,104" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-session-k)"/>
<rect x="270" y="162" width="320" height="88" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="430.0" y="195.6" font-size="13" fill="#1F2937" text-anchor="middle" font-weight="bold">resume</text>
<text x="430.0" y="210.8" font-size="11" fill="#6B7280" text-anchor="middle">resume=&lt;id&gt; · claude --resume &lt;name&gt;</text>
<text x="430.0" y="225.8" font-size="11" fill="#6B7280" text-anchor="middle">session ID(또는 이름) 지정 재개</text>
<rect x="640" y="162" width="260" height="88" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="770.0" y="195.6" font-size="13" fill="#1F2937" text-anchor="middle">이어가기</text>
<text x="770.0" y="210.8" font-size="11" fill="#6B7280" text-anchor="middle">복귀 사용자의 history 복원</text>
<text x="770.0" y="225.8" font-size="11" fill="#6B7280" text-anchor="middle">이름 = 조사 내용을 알 수 있게</text>
<path d="M180,206 L270,206" fill="none" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arr-session-b)"/>
<rect x="201.9" y="186.0" width="46.3" height="16" fill="#FFFFFF"/>
<text x="225" y="197.0" font-size="11" fill="#2563EB" text-anchor="middle">resume</text>
<path d="M590,206 L640,206" fill="none" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arr-session-b)"/>
<rect x="270" y="264" width="320" height="88" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="430.0" y="297.6" font-size="13" fill="#1F2937" text-anchor="middle" font-weight="bold">fork</text>
<text x="430.0" y="312.9" font-size="11" fill="#6B7280" text-anchor="middle">fork_session=True · --fork-session · /branch</text>
<text x="430.0" y="327.9" font-size="11" fill="#6B7280" text-anchor="middle">원본 이력을 복사한 새 session ID</text>
<rect x="640" y="264" width="260" height="88" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="770.0" y="297.6" font-size="13" fill="#1F2937" text-anchor="middle">같은 시점에서 독립 탐색</text>
<text x="770.0" y="312.9" font-size="11" fill="#6B7280" text-anchor="middle">원본 ID · 이력 불변</text>
<text x="770.0" y="327.9" font-size="11" fill="#6B7280" text-anchor="middle">나중에 어느 쪽으로든 복귀</text>
<path d="M180,308 L270,308" fill="none" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arr-session-b)"/>
<rect x="208.2" y="288.0" width="33.5" height="16" fill="#FFFFFF"/>
<text x="225" y="299.0" font-size="11" fill="#2563EB" text-anchor="middle">fork</text>
<path d="M590,308 L640,308" fill="none" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arr-session-b)"/>
<rect x="20" y="380" width="430" height="76" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="235.0" y="407.6" font-size="13" fill="#1F2937" text-anchor="middle" font-weight="bold">fork가 나누는 것 = 대화 이력만 (파일 시스템 ✗)</text>
<text x="235.0" y="422.9" font-size="11" fill="#6B7280" text-anchor="middle">파일 수정이 겹치면 git worktree 등 별도 작업 복사본 병행</text>
<text x="235.0" y="437.9" font-size="11" fill="#6B7280" text-anchor="middle">file checkpoint = 파일 되돌림 · 대화 분기 수단 ✗</text>
<rect x="470" y="380" width="430" height="76" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="685.0" y="407.6" font-size="13" fill="#1F2937" text-anchor="middle" font-weight="bold">이전 context를 신뢰할 수 있나</text>
<text x="685.0" y="422.9" font-size="11" fill="#6B7280" text-anchor="middle">변경 미미 → resume · 일부 파일만 변경 → resume + 변경 파일 전달</text>
<text x="685.0" y="437.9" font-size="11" fill="#6B7280" text-anchor="middle">대규모 변경 → 확인된 결론만 요약해 새 session</text>
</svg>
