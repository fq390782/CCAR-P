<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-label="긴 문서 배치 순서: 문서는 위, 질문은 아래" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">
<title>긴 문서 배치 순서: 문서는 위, 질문은 아래</title>
<defs><marker id="arr-long-doc-order" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="20" y="30" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="start">Before (오답)</text>
<text x="500" y="30" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="start">After (권장)</text>
<rect x="20" y="50" width="380" height="44" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="210.0" y="75.7" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="middle">질문 · 지시 (맨 앞)</text>
<rect x="20" y="104" width="380" height="150" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="210.0" y="167.0" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">보고서 A + 보고서 B + 보고서 C</text>
<text x="210.0" y="184.2" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="middle">구분 없이 이어 붙임</text>
<text x="210.0" y="199.8" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="middle">어느 내용이 어느 문서에서 왔는지 혼동</text>
<rect x="500" y="50" width="380" height="44" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="690.0" y="75.7" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="middle">&lt;document&gt; A: &lt;document_content&gt; + &lt;source&gt;</text>
<rect x="500" y="104" width="380" height="44" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="690.0" y="129.7" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="middle">&lt;document&gt; B: &lt;document_content&gt; + &lt;source&gt;</text>
<rect x="500" y="158" width="380" height="44" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="690.0" y="183.7" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="middle">&lt;document&gt; C: &lt;document_content&gt; + &lt;source&gt;</text>
<rect x="500" y="212" width="380" height="44" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="690.0" y="237.7" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="middle">답하기 전에 관련 부분을 먼저 quote</text>
<rect x="500" y="266" width="380" height="44" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="690.0" y="292.0" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">지시 · 질문 (맨 끝)</text>
<polyline points="400,152 500,152" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-long-doc-order)"/>
<rect x="429.5" y="143.0" width="41.0" height="16" fill="#FFFFFF"/>
<text x="450.0" y="155.5" font-size="11" font-weight="normal" fill="#1F2937" text-anchor="middle">재배치</text>
<rect x="20" y="280" width="380" height="64" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="210.0" y="308.5" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">effort ↑ · cache_control · 사전 요약</text>
<text x="210.0" y="324.3" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="middle">구조 · 출처 문제는 그대로 (세부와 출처를 잃기도 함)</text>
<text x="500" y="336" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="start">약 20K tokens 이상 입력에 적용</text>
<text x="500" y="352" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="start">복잡한 multi-document 테스트에서 응답 품질 최대 30% 향상</text>
<text x="20" y="386" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="start">문서를 질문 앞뒤로 두 번 넣기 → 비용과 노이즈만 두 배</text>
</svg>
