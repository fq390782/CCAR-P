<text x="250.0" y="134.3" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="middle">진료 기록 · 급여 밴드 · 타</text>
<text x="250.0" y="149.3" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="middle">지원자 이름</text>
<polyline points="340,130 400,130" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-code-enforcement)"/>
<rect x="355.0" y="122.0" width="30.0" height="16" fill="#FFFFFF"/>
<text x="370.0" y="134.0" font-size="11" font-weight="normal" fill="#1F2937" text-anchor="middle">제외</text>
<rect x="400" y="100" width="210" height="60" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="505.0" y="126.4" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">retrieval filter</text>
<text x="505.0" y="141.8" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="middle">index에서 제외</text>
<polyline points="610,130 660,130" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-code-enforcement)"/>
<rect x="614.5" y="122.0" width="41.0" height="16" fill="#FFFFFF"/>
<text x="635.0" y="134.0" font-size="11" font-weight="normal" fill="#1F2937" text-anchor="middle">통과분</text>
<rect x="660" y="100" width="220" height="60" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
<text x="770.0" y="118.9" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">모델이 못 봄</text>
<text x="770.0" y="134.3" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="middle">태그 없는 레코드 → output check가</text>
<text x="770.0" y="149.3" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="middle">마지막 방어</text>
<line x1="20" y1="182" x2="880" y2="182" stroke="#9CA3AF" stroke-width="1"/>
