<text x="75.0" y="241.4" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">2 행동</text>
<text x="75.0" y="256.9" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="middle">tool 실행 전</text>
<rect x="160" y="215" width="190" height="60" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="255.0" y="241.4" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">tool_use 요청</text>
<text x="255.0" y="256.9" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="middle">환불 &gt; $50 · 할인 &gt; 10%</text>
<polyline points="350,245 410,245" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-code-enforcement)"/>
