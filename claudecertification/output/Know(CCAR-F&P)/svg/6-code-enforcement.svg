<text x="510.0" y="241.4" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">코드 gate</text>
<text x="510.0" y="256.9" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="middle">승인 기록 있나?</text>
<polyline points="610,245 660,245" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-code-enforcement)"/>
<rect x="620.0" y="237.0" width="30.0" height="16" fill="#FFFFFF"/>
<text x="635.0" y="249.0" font-size="11" font-weight="normal" fill="#1F2937" text-anchor="middle">있음</text>
<rect x="660" y="215" width="220" height="60" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
<text x="770.0" y="233.9" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">tool 실행</text>
<text x="770.0" y="249.3" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="middle">승인 기록 = 신뢰할 수 있는 출처 · 채팅</text>
<text x="770.0" y="264.4" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="middle">텍스트 ✗</text>
<polyline points="510,295 510,325" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-code-enforcement)"/>
<text x="518" y="316" font-size="11" font-weight="normal" fill="#1F2937" text-anchor="start">없음</text>
<rect x="410" y="325" width="200" height="44" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="510.0" y="350.9" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">중단 (fail closed)</text>
<polyline points="255,275 255,325" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-code-enforcement)"/>
<rect x="222.3" y="293.0" width="65.4" height="16" fill="#FFFFFF"/>
<text x="255" y="305" font-size="11" font-weight="normal" fill="#1F2937" text-anchor="middle">agent 동작</text>
<rect x="160" y="325" width="220" height="56" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="270.0" y="341.9" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">permission rule</text>
<text x="270.0" y="357.4" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="middle">.env 읽기 · rm -rf = deny · push main</text>
<text x="270.0" y="372.4" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="middle">= ask</text>
<rect x="660" y="325" width="220" height="44" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="770.0" y="343.4" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">예외: gate 불필요</text>
<text x="770.0" y="358.9" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="middle">공개 정가 · 읽기 전용 잔액 조회</text>
<line x1="20" y1="398" x2="880" y2="398" stroke="#9CA3AF" stroke-width="1"/>
<rect x="20" y="430" width="110" height="60" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
