<svg xmlns="http://www.w3.org/2000/svg" width="900" height="546" viewBox="0 0 900 546" role="img" aria-label="절대 규칙은 prompt가 아니라 입력 단계, 행동 단계, 출력 단계의 코드 관문으로 강제" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">
<title>절대 규칙은 prompt가 아니라 입력 단계, 행동 단계, 출력 단계의 코드 관문으로 강제</title>
<defs><marker id="arr-code-enforcement" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<rect x="20" y="14" width="420" height="56" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="230.0" y="38.4" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">prompt · CLAUDE.md = 안내 (표지판)</text>
<text x="230.0" y="53.9" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="middle">신입 agent가 .env 읽기 · rm -rf · main push 규칙을 전부 위반</text>
<rect x="460" y="14" width="420" height="56" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="670.0" y="38.4" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">코드 = 강제 (자물쇠)</text>
<text x="670.0" y="53.9" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="middle">실행 전 관문 · 기록 없으면 중단(fail closed)</text>
<rect x="20" y="100" width="110" height="60" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="75.0" y="126.4" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">1 입력</text>
<text x="75.0" y="141.8" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="middle">모델이 보기 전</text>
