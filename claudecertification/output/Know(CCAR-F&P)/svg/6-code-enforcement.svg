<text x="250.0" y="448.9" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">응답 초안</text>
<text x="250.0" y="464.4" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="middle">잔액 수치 · 진단성 · 연령 부적합</text>
<text x="250.0" y="479.4" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="middle">내용</text>
<polyline points="340,460 400,460" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-code-enforcement)"/>
<rect x="355.0" y="452.0" width="30.0" height="16" fill="#FFFFFF"/>
<text x="370.0" y="464.0" font-size="11" font-weight="normal" fill="#1F2937" text-anchor="middle">검사</text>
<rect x="400" y="430" width="210" height="60" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="505.0" y="456.4" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">output check</text>
<text x="505.0" y="471.9" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="middle">표시 전 차단 · 일반 정보로 rewrite</text>
<polyline points="610,460 660,460" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr-code-enforcement)"/>
<rect x="620.0" y="452.0" width="30.0" height="16" fill="#FFFFFF"/>
<text x="635.0" y="464.0" font-size="11" font-weight="normal" fill="#1F2937" text-anchor="middle">통과</text>
<rect x="660" y="430" width="220" height="60" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
<text x="770.0" y="463.9" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">사용자에게 표시</text>
<text x="20" y="520" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="start">표시(mark)는 chunking · 인용 · 요약을 거쳐도 유지해야 함 → 표시가 새면 구멍 재개방</text>
</svg>
